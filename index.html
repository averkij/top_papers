й по нескольким эталонным объектам, который сохраняет внешний вид субъектов и организует их сцену по инструкции. Композиция сначала задаётся упрощённой 3D-сценой в виде исполняемой Blender-программы, а агент-кодер (coding agent) проверяет геометрию и рендер и исправляет программу. Полученный прокси-рендер служит визуальным планом для генератора, который обучается на датасете MAGPIE-Instruct-3K. Метод улучшает модели Qwen и FLUX на бенчмарках DreamOmni2 и SconeEval, давая для FLUX прирост успешности на 28.21 процентных пункта.'}, 'en': {'title': 'Plan the scene in 3D, then generate it from references', 'desc': 'MAGPIE helps image-generation models place selected subjects into a scene while keeping their appearance consistent with reference images. It turns the instruction into a simple 3D scene described by an executable Blender program, then checks and revises the scene before image synthesis. The rendered scene acts as a visual plan, and the generator is trained on MAGPIE-Instruct-3K to follow that plan while drawing each subject’s appearance from its reference. Tests show that MAGPIE improves Qwen and FLUX on DreamOmni2 and SconeEval, including a 28.21 percentage-point gain for FLUX on DreamOmni2.'}, 'zh': {'title': '先用三维场景规划，再让图像生成精准构图', 'desc': '这篇论文提出 MAGPIE，用于根据多张参考图和文字指令生成图像，同时保留指定主体的外观并安排好它们的位置关系。它先把目标构图表示为可执行的 Blender 程序，生成简化的三维场景，并由编码智能体检查和修改场景，使其更符合指令。随后，图像生成器以场景渲染图作为视觉规划，并从各自的参考图中获取主体外观。研究还构建了 MAGPIE-Instruct-3K 数据集用于训练；实验显示，该方法提升了 Qwen 和 FLUX 在 DreamOmni2 与 SconeEval 上的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.30149', 'title': 'LeadVLA: Learning Follower-Aware Route Execution for Robot Leading', 'url': 'https://huggingface.co/papers/2611.30149', 'abstract': 'Abstract LeadVLA is a structured multimodal policy that separates route execution into explicit path, pace, and residual components, trained and evaluated with generated closed-loop data and a benchmark, achieving the highest success among tested robot policies and transferring to unseen real environments without fine-tuning.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Robot leading requires executing a route while continuously adapting to a designated follower. Existing robot-leading systems often mediate follower understanding and physical route execution through explicit states, planners, or modular interfaces; directly learning this coupling through end-to-end trajectory prediction can instead entangle route execution with follower response. We introduce LeadVLA, a structured multimodal policy that preserves the route as an explicit Path reference while learning a Pace for route progress and a Residual for local follower- and scene-conditioned adaptation. To make this problem trainable and measurable, we develop LeadInfra, a configurable Unreal Engine-based closed-loop data-generation infrastructure from which we instantiate an approximately 4M-sample training corpus, and LeadBench, a standardized benchmark with 108 fully held-out closed-loop episodes. LeadVLA achieves the highest task success (39.6%) among evaluated robot policies on LeadBench while maintaining strong route fidelity and follower responsiveness, and transfers to unseen real-world environments without real-world policy fine-tuning. Project Page: https://louiszengCN.github.io/LeadVLA_PAGE/', 'score': 12, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '91a117f2594797ac', 'authors': ['Tianle Zeng', 'Hanjing Ye', 'Bingyi Xia', 'Yuchen Zhou', 'Zibo Zhang', 'Yufei Huang', 'Yonggen Ling', 'Hong Zhang'], 'affiliations': ['Futian Laboratory', 'Southern University of Science and Technology', 'Tencent Robotics'], 'pdf_title_img': 'assets/pdf/title_img/2611.30149.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#optimization', '#multimodal', '#dataset', '#data', '#games', '#architecture', '#synthetic'], 'emoji': '🤖', 'ru': {'title': 'Робот ведёт за собой: маршрут, темп и адаптация — раздельно и точно', 'desc': 'Статья представляет LeadVLA — структурированную мультимодальную политику (policy) для робота-проводника, который ведёт за собой следующего за ним человека или робота. Модель разделяет управление на три явные части: Path (маршрут), Pace (темп движения по маршруту) и Residual (локальная поправка с учётом поведения последователя и сцены). Для обучения и оценки авторы создали LeadInfra — конфигурируемую инфраструктуру генерации closed-loop данных на базе Unreal Engine (около 4M обучающих примеров) и бенчмарк LeadBench из 108 полностью отложенных эпизодов. LeadVLA достигает наивысшего показателя успешности (39.6%) среди протестированных политик и работает в новых реальных средах без дообучения (fine-tuning) на реальных данных.'}, 'en': {'title': 'Keep the route clear, adapt the pace', 'desc': 'LeadVLA is a multimodal robot policy for guiding a follower along a route. It separates behavior into an explicit path reference, a pace for controlling route progress, and a residual for adapting to the follower and surroundings. The researchers trained it using about four million simulated examples and evaluated it on 108 held-out closed-loop episodes. It achieved the highest success rate among the tested policies and transferred to unfamiliar real environments without fine-tuning on real-world data.'}, 'zh': {'title': '路径明确、步调灵活，让机器人带路更可靠', 'desc': '论文提出 LeadVLA，一种用于机器人引导任务的结构化多模态策略。它将路线执行拆分为显式路径（Path）、路线进度控制（Pace）和局部残差调整（Residual），以便机器人既能遵循路线，也能根据跟随者和场景变化灵活适应。研究还构建了闭环数据生成基础设施 LeadInfra，并据此生成约 400 万条训练样本，同时建立包含 108 个留出回合的标准基准 LeadBench。LeadVLA 在测试的机器人策略中取得最高任务成功率 39.6%，并能迁移到未见过的真实环境中，无需使用真实世界数据进行策略微调。'}}}, {'id': 'https://huggingface.co/papers/2611.32973', 'title': 'SpecEngineeringBench: Evaluating Coding Agents as Autonomous Specification Engineers', 'url': 'https://huggingface.co/papers/2611.32973', 'abstract': 'Abstract  Autonomous specification engineering requires coding agents to translate functional requirements into executable tests and use the results to discover and validate defects. However, existing benchmarks evaluate coding agents on explicitly specified test generation tasks, commonly providing an issue description, a designated test entry point, or files to inspect, leaving the ability to determine what to test and where to investigate insufficiently evaluated. Relying on such clues bypasses the challenge of mapping requirements to implementations and proactively uncovering unknown defects. We propose SpecEngineeringBench, comprising 100 instances from 78 open-source Python repositories across 16 application categories, with multiple recorded defects in each instance. Two independent tasks evaluate complementary capabilities: generating test suites and discovering defects through execution analysis. The evaluation combines test validity, defect detection, and coverage with localization precision and recall. Across seven frontier coding agents, results reveal that test validity and coverage decouple from defect exposure: agents achieve a 91.47% Head Pass Rate and 80.48% Change-focused Coverage alongside a 26.36% Fail-to-Pass Rate, while localization recall drops from 78.11% at the file level to 51.29% at the function level. Autonomous test generation improves file, function, and hunk localization recall by 4.99, 2.77, and 2.69 percentage points over relying solely on existing repository test suites.', 'score': 11, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'ed69caf2a762592e', 'authors': ['Xingjian Wang', 'Shijian Wang', 'Minghao Liu', 'Ji Zou', 'Zetao Yang', 'Xinping Lei', 'Yiming Liang', 'Shen Yan', 'Enduo Zhao', 'Xiaoyang Shen', 'Weihao Xuan', 'Jiaheng Liu', 'Ge Zhang'], 'affiliations': ['Monolith Management', 'The University of Tokyo', 'TokenWave AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.32973.jpg', 'data': {'categories': ['#agents', '#plp', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Покрытие кода не равно поиску ошибок: агенты должны находить дефекты сами', 'desc': 'Статья представляет SpecEngineeringBench — бенчмарк из 100 инстансов из 78 репозиториев с открытым кодом на Python, предназначенный для оценки LLM-агентов в автономной инженерии спецификаций. Бенчмарк проверяет две задачи: генерацию тестов по функциональным требованиям и обнаружение дефектов через анализ выполнения без явных подсказок. Результаты показывают, что высокая валидность тестов и покрытие не гарантируют выявление ошибок: Fail-to-Pass Rate составляет лишь 26.36%, а полнота локализации падает с 78.11% на уровне файлов до 51.29% на уровне функций. Автономная генерация тестов улучшает полноту локализации на 2.7–5 процентных пунктов по сравнению с использованием только существующих тестов репозитория.'}, 'en': {'title': 'From requirements to tests—and hidden defects', 'desc': 'This paper introduces SpecEngineeringBench, a benchmark for testing whether coding agents can turn functional requirements into tests and uncover defects without being told exactly where to look. It contains 100 tasks from 78 Python repositories and evaluates test-suite generation and defect discovery through execution analysis. The results show that agents can produce valid tests with good code coverage, but often fail to expose defects and become less precise when locating them at the function level. Generating tests autonomously improves defect localization compared with using only the repository’s existing tests.'}, 'zh': {'title': '不止生成测试：让编码智能体主动发现并精准定位缺陷', 'desc': '自主规格工程要求编码智能体把功能需求转化为可执行测试，并通过运行测试发现和验证缺陷。论文提出 SpecEngineeringBench，包含来自 78 个开源 Python 仓库的 100 个实例，用于评估智能体生成测试套件和分析执行结果以发现缺陷的能力。实验发现，测试有效性和代码覆盖率并不代表能有效暴露缺陷：智能体的变更关注覆盖率为 80.48%，但发现缺陷的 Fail-to-Pass 率只有 26.36%，而定位召回率也会从文件级的 78.11% 降至函数级的 51.29%。与仅使用仓库现有测试相比，自主生成测试能提升文件、函数和代码片段层级的缺陷定位召回率。'}}}, {'id': 'https://huggingface.co/papers/2611.31184', 'title': 'On-Policy Codec Distillation for Efficient All-in-One Video Generation', 'url': 'https://huggingface.co/papers/2611.31184', 'abstract': 'Abstract  Modern visual generative models operate on tokens, and every visual asset they receive, whether an identity, a scribble, a depth map, or a motion video, is tokenized and appended to the input token sequence. Consequently, conditioning quickly dominates the computation cost. Yet most of these tokens carry redundant spatiotemporal information. Our key insight is that identifying what is genuinely new is exactly the problem that classical video codecs have long solved. Thus, we first introduce a codec-based token pruning method that discards redundant tokens. Then, we propose an on-policy self-distillation (OPSD) strategy to train a DiT adapter capable of learning the codec pruning pattern well without quality degradation. Together, they form On-Policy Codec Distillation (CodecOPSD). We scale CodecOPSD to 16 condition modalities on our own video diffusion model, where it prunes 66% of the condition tokens on average with almost no quality drop. Therefore, denoising becomes 2x faster, and the cache memory shrinks by up to 73% in KV cache mode. CodecOPSD also extends to other state-of-the-art pretrained image and video generative models, where its benefit grows further with more conditions, longer frames, and higher resolution.', 'score': 11, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '6a97af7184c7e128', 'authors': ['Boyang Wang', 'Kevin Blackburn-Matzen', 'Oindrila Saha', 'Matheus Gadelha', 'Zezhou Cheng'], 'affiliations': ['Adobe Research', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2611.31184.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#video', '#architecture', '#training', '#inference', '#diffusion'], 'emoji': '🎞️', 'ru': {'title': 'Сжимаем условия как видеокодек: меньше токенов, та же качество генерации', 'desc': 'Современные генеративные модели для изображений и видео работают с токенами, и каждое условие (идентичность, эскиз, карта глубины, видео движения) добавляется в последовательность, из-за чего вычисления быстро растут. Авторы предлагают CodecOPSD: метод прунинга токенов на основе классического видеокодека, который отбрасывает избыточную пространственно-временную информацию и оставляет только действительно новое. Затем DiT-адаптер обучается через on-policy self-distillation (OPSD), чтобы воспроизводить этот паттерн прунинга без потери качества. В экспериментах с 16 модальностями условий удаляется в среднем 66% токенов, денойзинг ускоряется примерно в 2 раза, а KV-кэш уменьшается до 73%.'}, 'en': {'title': 'Prune the Redundancy, Keep the Quality', 'desc': 'Visual generative models process conditioning information as tokens, but many tokens repeat information across space and time. CodecOPSD uses ideas from video codecs to identify and prune these redundant condition tokens. It trains a DiT adapter with on-policy self-distillation to reproduce this pruning while preserving output quality. Across 16 condition modalities, it removes an average of 66% of tokens, making denoising about twice as fast and reducing KV cache memory by up to 73%.'}, 'zh': {'title': '借鉴视频编码去冗余，让视觉生成更快更省', 'desc': '现代视觉生成模型会把身份、涂鸦、深度图和视频等条件转换为 token，但许多 token 包含重复的时空信息，增加了计算开销。论文借鉴传统视频编码，提出基于编码器的 token 剪枝方法，去除冗余条件 token。作者还提出在线策略自蒸馏（OPSD），训练 DiT 适配器学习这种剪枝模式，同时尽量保持生成质量；两者结合称为 CodecOPSD。在视频扩散模型中，它平均减少 66% 的条件 token，几乎不损失质量，使去噪速度提升约 2 倍，并在 KV 缓存模式下最多减少 73% 的缓存内存。'}}}, {'id': 'https://huggingface.co/papers/2611.30219', 'title': 'RoomTokens: Masked Diffusion over Structured Tokens for Indoor Scene Synthesis', 'url': 'https://huggingface.co/papers/2611.30219', 'abstract': 'Abstract  Generating 3D indoor scenes requires a representation that captures object semantics, instance identity, height structure, and orientation while respecting room geometry. Methods that model scenes as sequences of object vectors learn spatial constraints implicitly, leaving collisions and boundary violations to losses or post-processing; semantic-map methods make occupancy explicit, but collapse instance and directional structure. We introduce RoomTokens, a sliced structured-token representation in which each token stores semantic class, instance-color identity, and facing field. This representation allows a scene to be generated as a discrete grid while preserving cues for instance grouping, orientation estimation, and 3D extent prediction. To learn the RoomToken distribution, we propose MDIRT (Masked Diffusion over RoomTokens), a masked discrete diffusion model that denoises semantic/instance-color/facing channels jointly with a shared cross-slice backbone. Architectural tokens are clamped as explicit floor- plan constraints, so the model samples furniture layouts that respect room geometry while retaining instance and object-attribute structure. Experiments on 3D-FRONT show that RoomTokens with MDIRT improve layout fidelity and physical consistency over sequence/vector- and map-based methods, suggesting structured spatial tokens as a practical choice for discrete 3D scene synthesis.', 'score': 11, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '47a988500171864a', 'authors': ['Xiaohao Sun', 'Angel X. Chang'], 'affiliations': ['Alberta Machine Intelligence Institute (Amii)', 'Simon Fraser University'], 'pdf_title_img': 'assets/pdf/title_img/2611.30219.jpg', 'data': {'categories': ['#3d', '#architecture', '#optimization', '#diffusion'], 'emoji': '🏠', 'ru': {'title': 'Структурированные токены делают генерацию 3D-интерьеров геометрически верной', 'desc': 'Статья предлагает RoomTokens — структурированное токенное представление 3D-сцены интерьера в виде дискретной сетки, где каждый токен хранит семантический класс, цвет-идентификатор экземпляра и поле направления. Для генерации этих токенов авторы вводят MDIRT, маскированную дискретную диффузионную модель (masked discrete diffusion), которая совместно деноизирует все каналы через общий cross-slice backbone. Архитектурные элементы фиксируются как явные ограничения планировки, поэтому модель генерирует расстановку мебели, соблюдающую геометрию комнаты. Эксперименты на датасете 3D-FRONT показывают, что такой подход улучшает точность компоновки и физическую согласованность по сравнению с методами на основе последовательностей векторов и карт.'}, 'en': {'title': 'RoomTokens: Diffusion that builds 3D rooms with structure', 'desc': 'The paper introduces RoomTokens, a grid-based representation for 3D indoor scenes that records each object’s semantic class, instance identity, and facing direction. It uses MDIRT, a masked discrete diffusion model, to jointly generate and refine these token channels across room slices. Architectural constraints such as walls and floor plans are fixed during generation, helping layouts fit the room while preserving object structure and orientation. Tests on 3D-FRONT show better layout fidelity and physical consistency than sequence-based and semantic-map approaches.'}, 'zh': {'title': '用结构化空间标记生成更合理的室内场景', 'desc': '论文提出 RoomTokens，用结构化的网格标记表示室内场景中的物体类别、实例身份和朝向，并保留物体的高度与空间信息。研究还提出 MDIRT，一种掩码离散扩散模型，可联合学习这些标记并逐步生成场景布局。生成时，模型将房间的墙壁和地面等结构作为固定约束，帮助家具布局符合房间几何形状。3D-FRONT 实验表明，这种方法比序列向量和语义地图类方法生成的布局更贴合目标，也更符合物理规律。'}}}, {'id': 'https://huggingface.co/papers/2611.31974', 'title': 'Coding4Games: Can Modern Coding Agents Play Modern Video Games?', 'url': 'https://huggingface.co/papers/2611.31974', 'abstract': 'Abstract  Games, especially modern AAA games, challenge language models to perceive complex scenes, control actions, and make decisions over long horizons. Existing game benchmarks primarily test language models as computer-use agents that query a language model throughout play, incurring repeated inference cost and, in real-time games, acting while the environment continues to evolve. We ask whether coding agents can learn from game interaction to develop standalone game-playing programs that run without language model inference. We thus introduce Coding4Games, a benchmark for evaluating whether coding agents can develop standalone programs that play modern games through visual observations and standard game inputs. Coding4Games has three defining features: 1) Diverse Modern Games, covering 15 games with diverse visual, strategic, and control demands; 2) Development-Test Separation, in which a coding agent uses a sandbox and the standard player interface to iteratively develop a program, after which the selected program is frozen and independently tested without language-model inference; and 3) Outcome and Process Evaluation, which measures not only game performance and reliability but also how agents use feedback, revise programs, and resolve problems during development. Across 15 games, the best program per game outscores the strongest GUI baseline on 13 and ties it on one. The human player outscores all agents on 10 games. We additionally examine the effects of development budgets. Coding4Games evaluates whether coding agents can turn their understanding of complex interactive environments into programs that work reliably on their own.', 'score': 10, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'ae6750a850bbf896', 'authors': ['Shifang Zhao', 'Haoyu Wang', 'Yuyang Yin', 'Dong Chen', 'Xingyilang Yin', 'Yunkang Tao', 'Honghao Chen', 'Guangzhi Wang', 'Yiran Wang', 'Junfu Pu', 'Cheng Cheng', 'Xiaodong Cun', 'Ying Shan'], 'affiliations': ['Beijing Jiaotong University', 'GVC Lab, Great Bay University', 'Nanjing University', 'Tencent ARC Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.31974.jpg', 'data': {'categories': ['#benchmark', '#reasoning', '#agents', '#games', '#plp'], 'emoji': '🎮', 'ru': {'title': 'Программы, которые играют сами, без LLM', 'desc': 'В статье представлен бенчмарк Coding4Games для оценки того, могут ли coding agents создавать автономные программы, играющие в современные игры по визуальным наблюдениям и стандартным игровым инпутам. Разработка программы ведётся в песочнице, после чего выбранная программа «замораживается» и тестируется без каких-либо вызовов LLM. Бенчмарк охватывает 15 игр и оценивает не только игровой результат и надёжность, но и то, как агент использует обратную связь и исправляет ошибки в процессе разработки. Результаты показывают, что лучшие программы превосходят сильнейший GUI-baseline в 13 играх из 15, но люди по-прежнему играют лучше агентов в 10 играх.'}, 'en': {'title': 'Build It, Freeze It, Play: Testing Standalone Game Agents', 'desc': 'This paper introduces Coding4Games, a benchmark for testing whether coding agents can build programs that play modern games from visual observations and standard inputs. Agents develop and refine their programs in a sandbox, then the programs are frozen and tested without further language-model inference. The benchmark evaluates game results and reliability, as well as how agents use feedback and fix problems during development. The best program beats a strong GUI-based agent in 13 of 15 games, while human players outperform all agents in 10 games.'}, 'zh': {'title': '从游戏互动中学习，让程序独立闯关', 'desc': '本文提出 Coding4Games 基准，用于评估编程智能体能否通过与游戏互动，编写无需语言模型持续推理的独立游戏程序。基准包含 15 款现代游戏，并将程序开发阶段与独立测试阶段分开，以检验程序在视觉观察和标准游戏输入下的实际表现。评估不仅考察游戏成绩与可靠性，也考察智能体如何利用反馈、修改程序和解决开发问题。实验显示，各游戏中表现最佳的程序在 13 款游戏中胜过最强的图形界面智能体基线、在 1 款中持平，但人类玩家在 10 款游戏中胜过所有智能体。'}}}, {'id': 'https://huggingface.co/papers/2611.31358', 'title': 'Nemotron-Labs-VisualCreation: Pixel as Code for Agentic Visual Creation', 'url': 'https://huggingface.co/papers/2611.31358', 'abstract': 'Abstract  Visual creation demands expressive imagery together with precise control over text, layout, and structure. We introduce Nemotron-Labs-VisualCreation, an agentic framework that connects these capabilities through Pixel as Code. Raster images are represented by learned discrete visual tokens, while structured artifacts use explicit programs. A shared generation-and-rendering interface connects these representations to visual feedback across images, vector graphics, webpages, and documents. A Nemotron-native harness coordinates planning and raster candidate selection, with targeted repair for editable structured and hybrid artifacts. To support this interface, we develop Nemotron-Labs-Image-Tokenizer, the autoregressive raster generator Nemotron-Labs-Image-30B-A3B, and the structured-code model family Nemotron-Labs-VisionCode. On approximately 178K images spanning six visual domains, our tokenizer improves reconstruction PSNR from 26.08 to 29.57 dB over Emu3.5 IBQ. It also provides 7.13x faster encoding and 10.93x faster decoding at batch size one on A100. In standalone evaluation, one Nemotron-Labs-VisionCode variant surpasses Kimi K3.1 Pro on the aggregate across Chart2Code, MMSVG, Design2Code, and Image2Struct. At the system level, the Nemotron-native configuration raises GenEval2 Soft-TIFA GM from 31.71 to 52.56 using the same raster generator. With our best setting, Nemotron-Labs-VisualCreation achieves performance competitive with GPT Image 2 and Nano Banana Pro across most benchmarks with available comparisons.', 'score': 9, 'issue_id': 3565, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'b56888a7d3389099', 'pdf_title_img': 'assets/pdf/title_img/2611.31358.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#architecture', '#cv', '#inference', '#agents', '#dataset', '#plp', '#data'], 'emoji': '🎨', 'ru': {'title': 'Пиксели как код: единая агентная система для точного визуального творчества', 'desc': 'Статья представляет Nemotron-Labs-VisualCreation, агентную систему для создания визуального контента, которая объединяет растровые изображения и структурированные артефакты через подход «Pixel as Code». Растровые изображения кодируются дискретными визуальными токенами, полученными новым токенизатором, а векторная графика, вебстраницы и документы описываются явными программами. Авторы показывают, что их токенизатор превосходит Emu3.5 IBQ по PSNR и работает в несколько раз быстрее, а модели семейства VisionCode конкурируют с сильными LLM в генерации кода. На уровне системы качество генерации по GenEval2 заметно растёт, приближаясь к проприетарным решениям.'}, 'en': {'title': 'Pixel as Code: One framework for creating and refining visual content', 'desc': 'The paper presents Nemotron-Labs-VisualCreation, an agentic framework for creating images and structured visual content with precise control. It represents raster images with learned discrete visual tokens and uses explicit programs for artifacts such as vector graphics, webpages, and documents. A shared generation-and-rendering interface lets the system inspect visual feedback, plan, select image candidates, and repair editable outputs. Its tokenizer improves reconstruction quality and speed, while evaluations show strong results for its code models and overall system across several visual benchmarks.'}, 'zh': {'title': '让视觉创作像编程一样可控', 'desc': '这篇论文提出 Nemotron-Labs-VisualCreation，一个能理解视觉反馈并协调多种模型的视觉创作框架。它把图像表示为学习得到的离散视觉词元，把网页、矢量图和文档等表示为可编辑的程序，并通过统一的生成与渲染接口连接两者。框架还会规划创作步骤、挑选合适的图像候选，并针对结构化作品进行定向修改；配套模型包括图像分词器、图像生成器和视觉代码模型。在实验中，图像分词器提升了重建质量和处理速度，视觉代码模型及完整系统也在多项基准测试中取得有竞争力的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.32617', 'title': 'VenusOCR2.0: Towards Efficient and Effective Document Parsing', 'url': 'https://huggingface.co/papers/2611.32617', 'abstract': 'Abstract  We present VenusOCR2.0, a compact 1B-parameter vision-language recognizer designed for both high-accuracy and high-throughput document parsing across text, tables, and formulas. To continuously improve recognition quality without self-training collapse, we build a bounded recursive self-improvement (RSI) data engine where the model acts strictly as a weakness probe, while external multi-expert medoid consensus, VLM visual verification, and factorized synthesis supply reliable supervision across pretraining, curated SFT, and RLVR. VenusOCR2.0 couples a dynamic-resolution SigLIP2 encoder and 2x2 spatial token merging with a Qwen3-0.6B decoder, adopting compact atomic OTSL tokens to shorten table sequences and reduce structural errors. To further eliminate the autoregressive decoding bottleneck, we introduce PTPv2, a lightweight (sim67M) decoupled parallel draft module that combines frozen multi-layer verifier conditioning, a standalone learned mask, and block-causal all-position next-token prediction. On OmniDocBenchv1.6, VenusOCR2.0 achieves an overall score of 96.45 and a state-of-the-art 98.57 formula CDM, substantially outperforming massive general-purpose VLMs such as Gemini-3-Pro (92.91) and Qwen3-VL-235B (89.78). Deployed in vLLM on a single H20 GPU, PTPv2 delivers a 2.96x single-request speedup and up to 2.36x higher batched throughput while guaranteeing lossless, token-for-token equivalence with standard autoregressive decoding.', 'score': 9, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '05d45bcaf50b7930', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#cv', '#benchmark', '#optimization', '#multimodal', '#data', '#small_models', '#plp', '#architecture', '#training', '#inference', '#synthetic'], 'emoji': '📄', 'ru': {'title': 'Компактный OCR-эксперт, который читает документы быстрее и точнее гигантов', 'desc': 'Статья представляет VenusOCR2.0 — компактную vision-language модель с 1 млрд параметров для распознавания документов, включая текст, таблицы и формулы. Для улучшения качества используется ограниченный рекурсивный self-improvement (RSI) пайплайн, где модель лишь выявляет слабые места, а разметку обеспечивают мультиэкспертный консенсус, VLM-верификация и синтез данных на этапах pretraining, SFT и RLVR. Архитектура объединяет SigLIP2-энкодер, Qwen3-0.6B декодер и компактные токены OTSL для таблиц, а модуль PTPv2 ускоряет декодирование параллельным драфтингом без потери качества. Модель превосходит крупные general-purpose VLM на OmniDocBench и даёт ускорение инференса до 2.96x на одном GPU.'}, 'en': {'title': 'Accurate document reading, with faster decoding', 'desc': 'VenusOCR2.0 is a compact vision-language model that reads documents, including text, tables, and formulas. It improves its training data using expert agreement and visual checks, while using its own predictions only to identify weak spots. A parallel drafting module speeds up text generation while preserving exactly the same output as standard autoregressive decoding. The system achieves strong document-recognition results and runs efficiently on a single GPU.'}, 'zh': {'title': '小模型精准识文档，并行解码提速不丢精度', 'desc': '论文提出 VenusOCR2.0，这是一个仅有 10 亿参数的视觉语言模型，可高精度、高效率地识别文档中的文字、表格和公式。研究团队采用有界递归自我改进数据流程，并结合多专家共识、视觉核验与合成数据来提供可靠训练监督，避免模型自我训练导致性能退化。模型通过动态分辨率视觉编码器和紧凑的表格标记提升识别效果，并加入并行草稿模块，加快文本生成且保持与标准自回归解码完全一致。它在 OmniDocBench v1.6 上取得 96.45 的综合分数和 98.57 的公式识别分数；在单张 H20 GPU 上，解码速度最高提升 2.96 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.32067', 'title': 'LoopDVR: Looped Transformer for Efficient Dense Visual Recognition', 'url': 'https://huggingface.co/papers/2611.32067', 'abstract': "Abstract LoopDVR converts pretrained Transformer-based dense visual recognition models into parameter-efficient looped networks by selectively reusing Transformer blocks with adapters, reducing parameters while preserving accuracy.  Generated by deepseek-ai/DeepSeek-V4.1-Flash We propose LoopDVR, a framework for converting pretrained Transformer-based dense visual recognition models into parameter-efficient looped networks. Rather than reducing the network width or depth directly, LoopDVR reuses Transformer blocks across layers in both the ViT backbone and Transformer decoder, reducing the number of parameters while retaining the original computational structure. However, naively sharing parameters can disrupt the distinct transformations learned at different depths. To address this challenge, we identify suitable sharing groups based on inter-layer representation dissimilarity and keep the final backbone block independent for multi-scale feature construction. We then initialize each shared backbone block with the pretrained weights of its group's terminal layer to better preserve the learned representations. An independent Loop Adapter at each layer further helps retain depth-specific transformations within shared blocks. Subsequently, we distill visual representations into the looped backbone and integrate it with a looped decoder for task-specific training. Experiments demonstrate that LoopDVR achieves the best accuracy--parameter trade-offs across dense recognition tasks. Compared with the reference models, it reduces parameters by approximately 28% while maintaining competitive accuracy. Notably, LoopDet-S achieves 50.9 box AP with only 7.0M parameters, highlighting its effectiveness in compact models.", 'score': 9, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '124f09a5ad0aa91e', 'authors': ['Sirui Liang', 'Xuanlong Yu', 'Longfei Liu', 'Xiaodong Cun', 'Xi Shen'], 'affiliations': ['Great Bay University', 'Intellindust AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.32067.jpg', 'data': {'categories': ['#cv', '#optimization', '#small_models', '#architecture', '#training'], 'emoji': '🔁', 'ru': {'title': 'Меньше параметров, та же точность: переиспользуем Transformer-блоки', 'desc': 'В статье представлен LoopDVR — метод превращения предобученных Transformer-моделей для плотного визуального распознавания (ViT и декодер) в параметрически эффективные looped-сети. Вместо уменьшения ширины или глубины сети блоки Transformer переиспользуются между слоями, что сокращает число параметров при сохранении исходной вычислительной структуры. Для сохранения различий между слоями выбираются группы для разделения весов по межслойной непохожести представлений, а в каждый слой добавляется независимый Loop Adapter, а затем проводится дистилляция в looped-бэкбон. Эксперименты показывают снижение числа параметров примерно на 28% при сохранении конкурентной точности, а LoopDet-S достигает 50.9 box AP всего с 7.0M параметрами.'}, 'en': {'title': 'Reuse Transformer blocks, keep the accuracy', 'desc': 'LoopDVR turns pretrained Transformer models for dense visual recognition into smaller, parameter-efficient looped networks. It reuses selected Transformer blocks in both the ViT backbone and decoder, choosing blocks to share based on differences between their representations. Independent adapters at each layer help preserve depth-specific transformations, while representation distillation helps the looped backbone retain useful visual features. Experiments show strong accuracy–parameter trade-offs, including a 28% parameter reduction while maintaining competitive accuracy.'}, 'zh': {'title': '循环复用 Transformer，让模型更轻而精度不减', 'desc': 'LoopDVR 将预训练的 Transformer 密集视觉识别模型改造成参数更少的循环网络：它在 ViT 主干网络和 Transformer 解码器中重复使用部分模块，而不直接缩小网络宽度或深度。为减少共享参数对不同层特征变换的影响，方法依据层间表示差异选择共享分组，并让最后一个主干模块保持独立。它还用分组末层的预训练权重初始化共享模块，并在每层加入独立的 Loop Adapter，以保留层特有的变换，再通过知识蒸馏和任务训练提升效果。实验显示，该方法在多种密集视觉识别任务中实现了较好的精度与参数量权衡，参数量约减少 28%；例如 LoopDet-S 仅用 7.0M 参数便达到 50.9 的框 AP。'}}}, {'id': 'https://huggingface.co/papers/2611.32820', 'title': 'Residual Guidance for Real-Time Interactive Video Generation', 'url': 'https://huggingface.co/papers/2611.32820', 'abstract': 'Abstract Residual Guidance is a training-free method that counteracts context inertia in streaming video generation by adding a residual from denoising the previous chunk under the new prompt to early denoising steps, improving prompt switching without training or per-model tuning.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Real-time interactive video generation allows users to change the prompt during generation to steer the evolving video. However, existing streaming models, which generate videos chunk by chunk, often keep following the previous prompt after a switch. We trace this failure to context inertia, where the previous chunk acts as a strong prior that suppresses the new prompt. Furthermore, we find that this inertia persists even when the cache retains only the previous chunk, yet discarding the context breaks visual continuity, which limits approaches that edit the cache. Rather than editing the cache, we propose Residual Guidance (RG), a simple, training-free method that counteracts context inertia with a correction measured outside the cache. Specifically, RG denoises the re-noised previous chunk once under the new prompt without the cache and adds the resulting residual to the early denoising steps of the next chunk, where its content is largely decided and the new prompt is most suppressed. Across settings ranging from a single switch to long multi-switch generation, RG substantially improves prompt switching capability on existing streaming models, including those with dedicated switching mechanisms, while largely retaining visual quality. As it requires no training or per-model tuning and adds only one forward pass per chunk, RG can be easily integrated into existing real-time video generation pipelines.', 'score': 8, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'f107ed6e2df99f4b', 'authors': ['NaHyeon Park', 'Kyeong-Hwan Moon', 'Youjin Jeon', 'Hyunjung Shim'], 'affiliations': ['KAIST', 'POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2611.32820.jpg', 'data': {'categories': ['#inference', '#video', '#diffusion'], 'emoji': '🎬', 'ru': {'title': 'Новый промпт важнее старого контекста: смена сцены без переобучения', 'desc': 'Статья описывает метод Residual Guidance (RG) для потоковой генерации видео по частям (chunk-by-chunk), который решает проблему инерции контекста: модель продолжает следовать старому промпту после его смены. RG не редактирует KV-кэш, а один раз денойзит пересэмплированный предыдущий chunk под новым промптом без кэша и добавляет полученный residual к ранним шагам денойзинга следующего chunk. Метод не требует обучения или подбора параметров под конкретную модель и добавляет лишь один forward pass на chunk. Эксперименты показывают заметное улучшение переключения промптов на существующих streaming-моделях при сохранении визуального качества.'}, 'en': {'title': 'Break Context Inertia for Better Prompt Switching', 'desc': 'Streaming video models can keep following an old prompt after users switch to a new one, a problem called context inertia. Residual Guidance (RG) reduces this effect without changing the model’s cache or requiring additional training. It denoises the previous video chunk under the new prompt without using the cache, then applies the resulting residual during the early denoising steps of the next chunk. Experiments show that RG improves prompt switching while largely preserving visual quality, with only one extra model pass per chunk.'}, 'zh': {'title': '不改缓存，用残差让视频及时跟上新提示词', 'desc': '流式视频生成模型逐段生成视频，但用户切换提示词后，模型常因“上下文惯性”而继续遵循旧提示词。研究发现，即使缓存只保留前一段视频，这种惯性仍然存在；直接删除上下文又会破坏画面连贯性。作者提出残差引导（RG）：在不使用缓存的情况下，按新提示词对重新加噪的前一段视频进行一次去噪，并将得到的残差加入下一段视频早期的去噪步骤。该方法无需训练或针对模型调参，只增加每段一次前向计算，能改善提示词切换效果并大体保持视觉质量。'}}}, {'id': 'https://huggingface.co/papers/2510.22622', 'title': 'Mega-MMDF and DeepfakeBench-MM: Benchmarking Multimodal Deepfake Detection Across Diverse Forgery Pipelines', 'url': 'https://huggingface.co/papers/2510.22622', 'abstract': 'Abstract A large audio-visual deepfake benchmark and standardized evaluation suite show that diverse composite-forgery training improves detection performance but does not reliably generalize to constituent manipulations, while modality masking and temporal misalignment increase detection errors.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Audio-visual deepfakes can spread misinformation and enable impersonation, undermining trust in digital media. However, existing datasets provide limited coverage of forgery operations and their combinations, constraining detector development and systematic evaluation. We introduce Mega-MMDF, containing 100,000 real and 1.2 million forged clips across 22 pipelines spanning modality-specific manipulations, stacked forgeries, and joint audio-video generation. To assess its training value and enable fair comparisons, we develop DeepfakeBench-MM, which standardizes training and evaluation across 8 datasets and 10 detectors. Training-based detectors achieve their highest mean AUC when trained on Mega-MMDF, with gains of up to 0.0784 over the best alternative training dataset for each detector. Experiments on data scale and pipeline coverage further support the value of large, diverse training data. Cross-pipeline evaluations reveal bidirectional and asymmetric generalization. Training on composite forgeries does not necessarily enable detection of their constituent operations in isolation. Our analysis of altered inputs shows that modality masking can increase false alarms and missed detections, and temporal misalignment can raise mean predicted forgery probabilities. Together, these resources provide a foundation for understanding and improving multimodal deepfake detection, with publicly available code and dataset access subject to application and usage terms.', 'score': 7, 'issue_id': 3565, 'pub_date': '2026-11-20', 'pub_date_card': {'ru': '20 ноября', 'en': 'November 20', 'zh': '11月20日'}, 'hash': '7966970e3a64dd68', 'authors': ['Kangran Zhao', 'Xiaoyu Zhang', 'Yupeng Chen', 'Yize Chen', 'Weinan Guan', 'Bo Zheng', 'Yufan Liao', 'Chengzhe Sun', 'Soumyya Kanti Datta', 'Qingshan Liu', 'Siwei Lyu', 'Baoyuan Wu'], 'affiliations': ['Nanjing University of Information Science and Technology', 'The Chinese University of Hong Kong', 'The Chinese University of Hong Kong, Shenzhen', 'University at Buffalo, State University of New York'], 'pdf_title_img': 'assets/pdf/title_img/2510.22622.jpg', 'data': {'categories': ['#security', '#synthetic', '#benchmark', '#multimodal', '#training', '#dataset', '#audio', '#open_source', '#video'], 'emoji': '🎭', 'ru': {'title': 'Большие и разнообразные данные — ключ к надёжному поиску аудиовизуальных подделок', 'desc': 'Авторы представляют Mega-MMDF — крупный датасет с 100 000 реальных и 1,2 миллиона поддельных аудиовизуальных клипов, созданных по 22 пайплайнам, включая составные (stacked) подделки и совместную генерацию аудио и видео. Для честного сравнения детекторов они разработали бенчмарк DeepfakeBench-MM, который стандартизирует обучение и оценку на 8 датасетах для 10 детекторов. Результаты показывают, что обучение на Mega-MMDF даёт наибольший средний AUC, а кросс-пайплайновые тесты выявляют асимметричную генерализацию: обучение на композитных подделках не гарантирует распознавание их отдельных компонентов. Также установлено, что маскирование модальностей и временная рассинхронизация увеличивают ошибки детекции, что делает работу важной основой для улучшения мультимодальных deepfake-детекторов.'}, 'en': {'title': 'More diverse training, stronger deepfake detection—but generalization still matters', 'desc': 'The paper introduces Mega-MMDF, a large dataset of real and forged audio-video clips covering 22 manipulation pipelines, and DeepfakeBench-MM, a standardized way to train and compare detectors across eight datasets. Detectors trained on Mega-MMDF achieve their strongest average AUC, with gains of up to 0.0784 over the best alternative training dataset for each detector. Tests show that detection can generalize unevenly across forgery types: training on composite fakes does not always help identify each manipulation on its own. Hiding one modality or misaligning audio and video can also increase errors, highlighting challenges for reliable multimodal deepfake detection.'}, 'zh': {'title': '以大规模多样化数据，推动音视频伪造检测更可靠', 'desc': '本文发布了 Mega-MMDF 音视频深度伪造数据集，包含真实视频和由 22 种篡改流程生成的伪造视频。研究还提出 DeepfakeBench-MM，用统一的训练与评测流程比较 8 个数据集和 10 种检测器。使用 Mega-MMDF 训练能提升检测器的平均 AUC，但在复合伪造上训练并不保证能识别其中单独的篡改操作。实验也发现，遮蔽某种模态或让音视频时间错位会增加误报、漏报或伪造判定倾向。'}}}, {'id': 'https://huggingface.co/papers/2611.29389', 'title': 'PINE: Point, Instance and Normal Estimation in One-Step Diffusion Model', 'url': 'https://huggingface.co/papers/2611.29389', 'abstract': 'Abstract  Understanding a scene requires both geometry and semantics: geometry recovers its spatial structure, and semantics separates it into objects. Current models obtain the two from separate networks or separate passes. We present PINE, a one-step Omni Diffusion Transformer that predicts the point map, the surface normals, and the instance map of an image in one forward pass. PINE treats each map as a token stream, and a stream mask decides which streams interact. A camera-aware ray encoding positions every token by its camera ray rather than its pixel. Grounding attention adds the affinity of pretrained DINOv3 features to the attention logits. Trained on only 139K synthetic images for geometry, PINE achieves state-of-the-art point maps whether or not intrinsics are given and the best average rank on surface normals. It also exceeds SAM on large objects with less than 1 percent of its training images, and it predicts all three maps 5.7x faster than MoGe-3 with SAM.', 'score': 6, 'issue_id': 3564, 'pub_date': '2026-11-22', 'pub_date_card': {'ru': '22 ноября', 'en': 'November 22', 'zh': '11月22日'}, 'hash': 'c6d42f774f860110', 'authors': ['Zeyu Ren', 'Jie Ni', 'Rui Qian', 'Jiahao Wei', 'Hao Tang', 'Yongtai Liu', 'Zeyu Zhang'], 'affiliations': ['Fudan University', 'Hanyang University', 'Peking University', 'Southeast University', 'The University of Melbourne'], 'pdf_title_img': 'assets/pdf/title_img/2611.29389.jpg', 'data': {'categories': ['#cv', '#optimization', '#multimodal', '#architecture', '#training', '#diffusion'], 'emoji': '🧭', 'ru': {'title': 'Геометрия и семантика сцены за один проход', 'desc': 'Статья представляет PINE — Omni Diffusion Transformer, который за один проход (one-step forward pass) предсказывает карту точек (point map), нормали поверхностей и карту инстансов объектов по одному изображению. Каждая карта обрабатывается как отдельный поток токенов, а маска потоков определяет, какие потоки взаимодействуют между собой. Камерно-зависимое кодирование лучей (camera-aware ray encoding) привязывает токены к лучам камеры, а grounding attention добавляет к логитам внимания сходство признаков предобученного DINOv3. Модель, обученная всего на 139K синтетических изображениях, достигает лучших результатов по картам точек и нормалям и работает в 5.7 раза быстрее MoGe-3 с SAM.'}, 'en': {'title': 'One pass, three maps: geometry and objects together', 'desc': 'PINE is a single-pass Omni Diffusion Transformer that predicts an image’s point map, surface normals, and instance map together. It represents each output as a token stream and uses a stream mask to control interactions between them. Camera-ray encodings provide camera-aware positions, while grounding attention uses similarities between pretrained DINOv3 features to guide attention. Trained on 139K synthetic geometry images, PINE achieves strong geometry and segmentation results while producing all three maps 5.7 times faster than MoGe-3 with SAM.'}, 'zh': {'title': '一次前向传播，统一理解场景几何与语义', 'desc': 'PINE 是一种全景扩散 Transformer，可在一次前向传播中同时预测图像的点图、表面法线图和实例图。它把每种图表示为一个 token 流，用流掩码控制不同任务之间的信息交互，并用相机感知射线编码表示 token 的位置。模型还将预训练 DINOv3 特征之间的亲和度加入注意力分数，以增强特征对齐。仅用 13.9 万张合成图像训练，PINE 在点图和表面法线预测上表现出色，在大型物体实例分割上也超过 SAM，并且推理速度更快。'}}}, {'id': 'https://huggingface.co/papers/2611.31977', 'title': 'Distill to Loop: Turning Pretrained Diffusion Transformers into Looped Models with Adjustable Depth', 'url': 'https://huggingface.co/papers/2611.31977', 'abstract': "Abstract A pretrained diffusion transformer is distilled into a weight-shared looped student that supports variable loop counts at inference and uses depth-wise ODE solvers and loop guidance to match teacher quality with fewer parameters and less compute.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Looped transformers reuse one block of shared weights along the depth of the network. Recent looped diffusion transformers are trained from scratch, which repeats the full pretraining cost although strong pretrained non-looped diffusion transformers exist. We propose Distill to Loop (Dooop), which distills a pretrained non-looped diffusion transformer into a looped student whose blocks are initialized from the teacher's. We cast distillation as a fixed-point iteration toward the teacher, in which the output after every loop is trained toward the teacher, and each loop is one step of an ordinary differential equation in depth. As a result, one model runs any number of loops at test time without retraining, and the higher-order ODE solvers of diffusion model sampling can be applied along the depth dimension for better results. Meanwhile, because a looped model produces an output after every loop, we also construct loop guidance between the outputs of different loop counts, which improves the generated samples at little extra compute. On SD3-medium, a looped student with about 37% of the teacher's parameters matches the teacher on average over GenEval, ImageReward, PickScore and HPSv2.1 with two to four loops, and with two loops it uses about 58% of the teacher's compute. And on a four-step SD3-medium, loop guidance raises the average of the four metrics from 88.2 to 99.2.", 'score': 4, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '939430a58f76f57c', 'pdf_title_img': 'assets/pdf/title_img/2611.31977.jpg', 'data': {'categories': ['#architecture', '#training', '#diffusion', '#inference', '#optimization'], 'emoji': '🔁', 'ru': {'title': 'Один блок весов, любое число циклов: дистилляция диффузионного трансформера в looped-модель', 'desc': 'Авторы предлагают метод Distill to Loop (Dooop), который дистиллирует предобученный диффузионный трансформер без циклов в looped-студента с общими весами блоков. Обучение строится как итерация с неподвижной точкой к выходу учителя, где каждый цикл рассматривается как шаг обыкновенного дифференциального уравнения по глубине сети. Такая модель работает с любым числом циклов на инференсе без переобучения, а для сэмплирования по глубине применяются ODE-солверы высокого порядка. Дополнительный loop guidance, основанный на разнице выходов при разном числе циклов, на SD3-medium с примерно 37% параметров учителя почти сохраняет качество и заметно повышает результат при четырёх шагах.'}, 'en': {'title': 'Reuse the Weights, Keep the Quality', 'desc': 'Dooop distills a pretrained diffusion transformer into a smaller looped transformer that reuses the same weights at each depth. It trains the output after every loop to approach the teacher’s output, treating each loop as a step in an ordinary differential equation. At inference, the model can use different numbers of loops without retraining, and higher-order ODE solvers or loop guidance can improve its results. On SD3-medium, a student with about 37% of the teacher’s parameters matches its average scores with two to four loops, while two loops use about 58% of the teacher’s compute.'}, 'zh': {'title': '蒸馏成循环模型，以更少参数与算力复现教师质量', 'desc': '本文提出 Dooop，将预训练的非循环扩散 Transformer 蒸馏为共享权重的循环模型，避免从头训练循环模型的高昂成本。训练时，模型每循环一次都要让输出接近教师模型，并将每次循环视为沿网络深度执行的一步常微分方程迭代。推理时可以灵活选择循环次数，也能使用高阶 ODE 求解器提升生成效果；循环引导则利用不同循环次数的输出进一步改善样本质量。实验显示，该学生模型仅有教师模型约 37% 的参数量，循环两到四次即可在多项指标上达到相近表现；循环两次时计算量约为教师模型的 58%。'}}}, {'id': 'https://huggingface.co/papers/2611.31752', 'title': 'Separating Measurement Failures from Defence Failures in Split Language-Model Privacy', 'url': 'https://huggingface.co/papers/2611.31752', 'abstract': "Abstract  Split-training privacy evaluations fail through distinct mechanisms. Evaluators can overlook an exposed gradient channel, align reconstructions against shifted labels, or deploy uncalibrated probes before testing a candidate defence, while calibrated attacks can also refute real defences. Separating these failure modes alters which claims survive. We conduct a retrospective evidentiary reanalysis across four split-LLM campaigns and two cross-cutting scope checks covering host key custody and variational mutual-information bounds, mapping every recorded claim to one of five admissibility states (breach, non-detection, undetermined coverage, invalid measurement, or out-of-scope inference). Across a 19-configuration exploration, only four of 24 required probes qualified, yet those four calibrated probes still established qualified privacy breaches in 13 configurations, while utility or learning-gain failures eliminated the remaining 6. In a seven-cell defence-redesign pilot, 2 quantised configurations failed utility gates, calibrated next-byte structure probes breached the 0.02 gate on all 7 cells (0.097 to 0.112), and qualified punctuation-property probes reached 0.79 to 0.89, yielding 4 failed and 3 undetermined composite privacy assessments (the latter from marginal null-band excursions on punctuation bindings). Negative evidence against both defence families remains intact. Scope checks further show that shared-key orthogonal wrappers protect passive network captures without hiding activations from a compromised restoring host, and why near-zero variational lower bounds leave worst-case leakage unconstrained. Rerunnable scripts verify 1,522 checks across 122 SHA-256-pinned artifacts while preserving each campaign's native seed intervals and retrospective boundaries.", 'score': 4, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'e8630b77bc4410ec', 'authors': ['Georgios Politis', 'Evangelos Pappas'], 'affiliations': ['Setloop.io'], 'pdf_title_img': 'assets/pdf/title_img/2611.31752.jpg', 'data': {'categories': ['#leakage', '#security', '#training', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Приватность split-LLM без проверки на правдоподобие не доказана', 'desc': 'Статья показывает, что оценки приватности в split-обучении LLM часто ошибочны из-за трёх причин: необнаруженного канала утечки градиентов, неправильного выравнивания меток при реконструкции и использования некалиброванных probe-тестов. Авторы проводят ретроспективный переанализ четырёх кампаний и распределяют каждое заявление по пяти статусам допустимости: breach, non-detection, undetermined coverage, invalid measurement и out-of-scope inference. Только 4 из 24 probe-тестов прошли проверку, но они подтвердили приватностные утечки в 13 конфигурациях, а остальные конфигурации отсеялись из-за сбоев полезности или обучения. Дополнительные проверки показывают, что ортогональные обёртки с общим ключом защищают от пассивного перехвата трафика, но не скрывают активации от скомпрометированного хоста, а близкие к нулю вариационные нижние границы взаимной информации не ограничивают наихудшую утечку.'}, 'en': {'title': 'Calibrate the attack, then trust the privacy claim', 'desc': 'This paper re-evaluates privacy claims from four split-language-model studies and two related scope checks. It classifies evidence as a breach, non-detection, undetermined coverage, invalid measurement, or an inference outside the tested scope, and finds that only four of 24 required probes were properly calibrated. Even so, calibrated probes confirmed privacy breaches in 13 explored configurations and exceeded the privacy threshold in all seven cells of a defence redesign; utility failures or uncertain results affected the others. The analysis also clarifies that shared-key wrappers can protect network traffic from passive observers but not activations from a compromised host, and that near-zero variational mutual-information lower bounds do not establish low worst-case leakage.'}, 'zh': {'title': '校准攻击、厘清证据：重新检验分割式大模型的隐私防御', 'desc': '这篇论文重新评估了四组分割式大语言模型研究中的隐私证据，并区分真正的隐私泄露、未发现泄露、测试覆盖不足、测量无效和超出范围的推论。研究发现，合格且经过校准的攻击探针仍在多种配置中证明了隐私泄露；另有一些配置因效用或学习收益未达标而被淘汰。防御试验中，量化配置未通过效用门槛，而经过校准的探针在所有测试单元中都超过隐私泄露阈值，因此部分防御评估未能通过，另有部分结果尚无定论。论文还指出，共享密钥封装无法阻止被攻陷的恢复主机看到激活值，而接近零的变分互信息下界也不能保证最坏情况下的泄露很小。'}}}, {'id': 'https://huggingface.co/papers/2611.33020', 'title': 'GRAPE-Bench: When Vision Degrades, Does Video Reasoning Hold?', 'url': 'https://huggingface.co/papers/2611.33020', 'abstract': "Abstract GRAPE-Bench jointly evaluates video reasoning under visual degradation and question difficulty, exposing model weaknesses and enabling improvement and control.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Despite strong performance on standard benchmarks, video reasoning models remain vulnerable to visual degradation, raising concerns about their reliability in safety-critical scenarios. Existing benchmarks address this concern in part by simulating visual degradation or probing model reasoning with challenging questions, leaving open how well models handle naturally degraded video and whether they can make the simpler judgments that matter for safe driving. To this end, we introduce GRAPE-Bench, which jointly evaluates video reasoning across visual degradation conditions and question difficulty. It combines a synthetic set spanning twelve corruption types across daily-life and driving videos with real-world footage of driving at night or in rain, snow, or fog. Each video is paired with three progressively challenging questions, from fundamental judgments with potential safety implications to demanding reasoning stress tests. Across open-weight and frontier models, we observe ranking reversals between synthetic and real-world conditions and level-specific weaknesses obscured by overall accuracy. Synthetic-data fine-tuning improves Qwen3.5-9B's real-world accuracy from 76.7% to 81.1%, while clean-privileged on-policy distillation reaches 80.4% in a separate reasoning-enabled setting. Through preference steering, we further demonstrate continuous control over a frozen model's trade-off between safety-relevant judgments and challenging reasoning, with little change in overall accuracy. Together, GRAPE-Bench provides a unified testbed for evaluating, improving, and controlling video reasoning under degraded visual conditions.", 'score': 4, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '24aea02b2ae85e7c', 'authors': ['Ce Zhang', 'Junyi He', 'Tianshi Ming', 'Jinxi He', 'Jianshu Zhang', 'Xiyuan Yang', 'Jianuo Zhu', 'Yicheng Tao', 'Xiyu Luo', 'Minghao Fu', 'Jiahui Zhu', 'Kehan Guo', 'Yunzhong Xiao', 'Jingyang Lin', 'Wei Chow', 'Lingdong Kong', 'Katia Sycara', 'Yaqi Xie'], 'affiliations': ['CMU', 'ND', 'NUS', 'Northwestern', 'UCSD', 'UIUC', 'UR', 'WSU'], 'pdf_title_img': 'assets/pdf/title_img/2611.33020.jpg', 'data': {'categories': ['#security', '#synthetic', '#training', '#benchmark', '#reasoning', '#dataset', '#optimization', '#video', '#alignment'], 'emoji': '🚗', 'ru': {'title': 'Видеорассуждения ИИ проверяют в тумане и темноте, чтобы сделать вождение безопаснее', 'desc': 'Статья представляет GRAPE-Bench — новый бенчмарк для оценки video reasoning у LLM и мультимодальных моделей в условиях деградации изображения и разной сложности вопросов. Он сочетает синтетические искажения (двенадцать типов) на бытовых и дорожных видео с реальными записями вождения ночью, в дождь, снег и туман. Каждое видео сопровождается тремя вопросами возрастающей сложности, от базовых суждений, важных для безопасности, до сложных задач на рассуждение. Авторы показывают, что fine-tuning на синтетических данных и on-policy distillation повышают точность, а preference steering позволяет управлять компромиссом между безопасными суждениями и сложным рассуждением у замороженной модели.'}, 'en': {'title': 'Test video reasoning where clear vision and easy answers cannot be assumed', 'desc': 'This paper introduces GRAPE-Bench, a benchmark for testing video reasoning models under visual degradation and different levels of question difficulty. It includes synthetic videos with twelve types of corruption and real-world driving footage in conditions such as night, rain, snow, and fog. The results show that model rankings can change between synthetic and real-world videos, and that overall accuracy can hide weaknesses on specific kinds of questions. Fine-tuning, distillation, and preference steering can improve or adjust performance, including the balance between safety-relevant judgments and harder reasoning.'}, 'zh': {'title': '不只测准确率：让视频推理在恶劣画面中更可靠、更可控', 'desc': '这篇论文提出 GRAPE-Bench，用来评估视频推理模型在画面受损和问题难度不同的情况下表现如何。基准涵盖十二种模拟画面损坏、夜间及雨雪雾等真实驾驶视频，并为每段视频设置由易到难的三个问题。实验发现，模型在模拟与真实画面中的排名可能不同，而且总体准确率会掩盖不同难度层级上的弱点。通过合成数据微调、策略蒸馏和偏好引导，研究者展示了提升真实场景准确率及调节安全判断与复杂推理之间取舍的可能性。'}}}, {'id': 'https://huggingface.co/papers/2611.31466', 'title': 'AdProducer: Towards Agentic Advertising Video Generation', 'url': 'https://huggingface.co/papers/2611.31466', 'abstract': 'Abstract An end-to-end multimodal agent framework autonomously researches products and creates selling-point-driven storyboards to guide a frozen video generator, trained via supervised fine-tuning and reinforcement learning to produce effective advertising videos.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent advances in video generation have made automated advertising production increasingly feasible. However, an effective advertisement must faithfully represent the product and communicate its selling points through compelling visual storytelling, which requires more than visual synthesis: it calls for deeper product understanding and strategic decisions about how to present product value. Crucially, product research and creative design are closely intertwined, as the information gathered about a product determines which features can be faithfully demonstrated and how they should be presented. In this paper, we introduce AdProducer, the first end-to-end agentic framework for advertising video creation, transforming concise creative briefs into finished advertisements. Our multimodal agent autonomously researches products through web and image search and translates its findings into selling-point-driven storyboards that guide a frozen video generator. To achieve this, we develop a dedicated data construction pipeline that yields two training datasets, AdProducer-SFT and AdProducer-RL, and train the agent through supervised fine-tuning followed by reinforcement learning with joint optimization of storyboard- and video-level rewards. We further introduce AdCreation-Bench, comprising 305 advertising briefs across eight domains, with two complementary metrics: PG-Score for product correctness and creative execution, and Ad-Score for overall advertising effectiveness assessed by an independent judge. Experiments demonstrate that AdProducer improves the PG-Score of MiniMax H3 from 17.3 to 51.3 and generalizes to Veo 3.1 without additional training, improving its score from 28.0 to 35.9, with consistent gains in Ad-Score, VideoScore2, and human evaluations. Code, models, and data are released.', 'score': 4, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'e9a903ed4f523e17', 'authors': ['Kunyang Li', 'Chaoyang Wang', 'Mubarak Shah', 'Yuzhang Shang'], 'affiliations': ['Institute of Artificial Intelligence, University of Central Florida'], 'pdf_title_img': 'assets/pdf/title_img/2611.31466.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#agents', '#multimodal', '#dataset', '#video', '#rl', '#training', '#diffusion', '#synthetic'], 'emoji': '🎬', 'ru': {'title': 'Агент, который сначала изучит продукт, а потом снимет рекламу', 'desc': 'В статье представлен AdProducer — end-to-end агентная система на базе мультимодального LLM-агента, которая создаёт рекламные видео из краткого брифа. Агент самостоятельно исследует продукт через веб- и поиск по изображениям и на основе найденных сведений формирует storyboard, ориентированный на ключевые преимущества продукта, который управляет замороженным видеогенератором. Агент обучается в два этапа: supervised fine-tuning и reinforcement learning с совместной оптимизацией наград на уровне storyboard и итогового видео. Для оценки авторы вводят бенчмарк AdCreation-Bench и метрики PG-Score и Ad-Score, а эксперименты показывают заметный рост качества, в том числе при переносе на Veo 3.1 без дополнительного обучения.'}, 'en': {'title': 'Research the Product, Then Tell Its Story', 'desc': 'AdProducer turns short advertising briefs into finished videos using a multimodal agent. The agent searches the web and images to learn about each product, then creates a storyboard that highlights its selling points and guides a frozen video generator. It is trained with supervised fine-tuning and reinforcement learning, using rewards for both storyboard quality and video quality. On a new benchmark, it improves product accuracy and advertising effectiveness, and its benefits transfer to another video generator without extra training.'}, 'zh': {'title': '先懂产品，再创作打动人的广告视频', 'desc': '本文提出 AdProducer，一个端到端的多模态智能体框架，可把简短的广告需求转化为完整广告视频。智能体会通过网页和图片搜索了解产品，再制作突出产品卖点的分镜脚本，引导一个冻结的视频生成模型生成视频。研究者先用监督微调训练智能体，再用强化学习优化分镜和视频层面的奖励，并构建了广告评测基准。实验表明，该方法能提升广告的产品准确性与整体效果，也能迁移到未参与训练的视频生成模型。'}}}, {'id': 'https://huggingface.co/papers/2611.32094', 'title': 'Clinical3D-Bench: Evaluating and Improving Spatial Intelligence of Multimodal LLMs in Hospital Environments', 'url': 'https://huggingface.co/papers/2611.32094', 'abstract': "Abstract A simulated hospital benchmark shows that multimodal large language models have limited spatial reasoning, while fine-tuning and a 3D-computation method improve their accuracy and reduce the gap to physicians.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Spatial reasoning in hospitals requires tracking look-alike equipment, interpreting patient-relative directions, and judging passage widths, yet existing benchmarks provide limited coverage of these abilities. We introduce Clinical3D-Bench, a simulated benchmark with 3,368 questions of eight types on egocentric walkthroughs of 373 hospital-room layouts. Layouts follow hospital design guidelines, answers are computed from the 3D scenes, and paired scene states test whether models change their answers when relevant evidence changes. Videos are photorealistic, and ten physicians screened the layouts. Among 35 multimodal large language models (MLLMs), the best open and proprietary models reach 45.7% and 53.6% macro accuracy, against 40.8% for an answer prior and 79.0% for physicians on a subset, and 27 of 32 open models score below 40% on two-way patient-relative directions. Fine-tuning on Clinical3D-45K, our 44,750-question training set, lifts two MLLMs 16-20 points above the best proprietary model. 3D maps given to the fine-tuned MLLM as input go largely unused: replacing them with another video's, even when they are ground truth, barely changes its accuracy. The proposed GeoJeV instead lets the MLLM compute with 3D: it reconstructs a scene memory from each video, selects 3D operations and their arguments from the MLLM's question state, and adds their evidence to its option scores. It achieves the highest accuracy of all evaluated models, narrowing the gap to physicians.", 'score': 4, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'f76d465e8cceaf50', 'authors': ['Yang Bai', 'Yingzhi Xia', 'Ling Lin', 'Jun Cheng', 'Lin Fu', 'Huazhu Fu'], 'affiliations': ['A*STAR', 'University of Science and Technology of China', 'Wenzhou Medical University'], 'pdf_title_img': 'assets/pdf/title_img/2611.32094.jpg', 'data': {'categories': ['#benchmark', '#reasoning', '#multimodal', '#dataset', '#video', '#healthcare', '#training', '#3d', '#interpretability'], 'emoji': '🏥', 'ru': {'title': 'Чтобы понимать пространство больницы, LLM должна вычислять в 3D, а не только смотреть видео', 'desc': 'Авторы представляют Clinical3D-Bench — симулированный бенчмарк из 3368 вопросов по видеопрогулкам по 373 планировкам больничных палат, проверяющий пространственное мышление мультимодальных LLM. Лучшие модели показывают лишь около 45–54% точности против 79% у врачей, а большинство открытых моделей плохо справляются с направлениями относительно пациента. Дообучение на Clinical3D-45K заметно повышает качество, но 3D-карты почти не используются моделью. Предложенный метод GeoJeV строит 3D-память сцены, выполняет геометрические операции и добавляет их результаты к оценкам вариантов ответа, достигая лучшей точности среди всех моделей.'}, 'en': {'title': 'Give Language Models 3D Tools to Navigate Hospital Scenes', 'desc': 'The paper introduces Clinical3D-Bench, a benchmark for testing whether multimodal large language models can reason about hospital spaces from videos. It finds that current models struggle with tasks such as tracking similar equipment, interpreting directions relative to a patient, and estimating passage widths. Fine-tuning improves accuracy, but models make little use of provided 3D maps. The proposed GeoJeV method uses the model to select operations over a reconstructed 3D scene, improving accuracy and reducing the gap with physicians.'}, 'zh': {'title': '让多模态模型真正用三维计算理解医院空间', 'desc': '本文提出 Clinical3D-Bench，用于评测多模态大语言模型在医院场景中的空间推理能力，涵盖辨认相似设备、理解相对患者的方向和判断通道宽度等任务。基准包含 3,368 道问题，并通过改变场景中的相关证据来测试模型能否相应调整答案。实验显示，现有模型整体表现有限，尤其难以判断以患者为参照的方向；使用该基准数据微调后，两个模型的准确率显著提升。作者提出 GeoJeV，让模型从视频重建三维场景记忆，并调用三维计算操作辅助选答案，使其在评测中准确率最高，并缩小与医生的差距。'}}}, {'id': 'https://huggingface.co/papers/2611.25595', 'title': 'LoopedWAM: Looped World Action Models for Elastic Inference', 'url': 'https://huggingface.co/papers/2611.25595', 'abstract': 'Abstract  World action models (WAMs) couple generative video modeling with robotic action prediction but typically require large video and action transformers, limiting deployment efficiency. We present LoopedWAM, a compact WAM that recurrently applies a shared six-block core in each expert, executing 30 transformer layers while storing only 12 blocks per expert. To account for their asymmetric inference costs, the video and action experts can operate at different depths: visual features are computed once per query, whereas action computation repeats at every sampling step. We further propose elastic self-distillation, which trains a single elastic checkpoint, LoopedWAM-E, across action-depth and sampling-step budgets. With only 0.58B policy parameters and no robot pretraining, LoopedWAM achieves 96.1% success on LIBERO, 91.9% on RoboTwin 2.0, and 52.2% on RoboCasaGR1, while using 7.4times less peak GPU memory than Fast-WAM under matched inference measurements. On LIBERO, LoopedWAM-E achieves 96.0% success in 27.6 ms or 95.2% in 24.7 ms on an H100, providing multiple accuracy-latency operating points from a single checkpoint; with two sampling steps and four action loops, it stays within 0.5 points of LoopedWAM on all three benchmarks. Ablations demonstrate that weight-shared depth preserves competitive performance, while aggressive action-depth reduction requires explicit budget-aware training. On a real AgileX PiPER arm, LoopedWAM succeeds in 71.3% of 80 trials across four tasks.', 'score': 4, 'issue_id': 3564, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '4ac4b50f0eff7368', 'pdf_title_img': 'assets/pdf/title_img/2611.25595.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#optimization', '#video', '#small_models', '#architecture', '#training', '#inference'], 'emoji': '🤖', 'ru': {'title': 'Компактный робот-мозг: один чекпоинт, много режимов скорости и точности', 'desc': 'В статье предлагается LoopedWAM — компактная модель мира для роботов (world action model), которая объединяет генеративное видеомоделирование и предсказание действий. Архитектура рекуррентно применяет общий блок трансформера, что даёт 30 слоёв при хранении лишь 12 блоков на эксперт и 0.58B параметров без предобучения на роботах. Видео- и action-эксперты работают на разной глубине: визуальные признаки вычисляются один раз, а вычисления действий повторяются на каждом шаге сэмплирования, что экономит ресурсы. Метод elastic self-distillation позволяет обучить один чекпоинт, который управляет компромиссом между точностью и задержкой, достигая 96.1% на LIBERO и 7.4× меньшего пикового потребления GPU памяти по сравнению с Fast-WAM.'}, 'en': {'title': 'One compact model, flexible speed and accuracy', 'desc': 'LoopedWAM is a compact world action model that generates video predictions and robot actions using a small transformer core repeatedly, reducing the number of stored model blocks. It computes visual features once per query and lets action processing use a different depth, since action computation repeats at every sampling step. Its elastic self-distillation trains one model to work across different action-depth and sampling-step budgets, offering several speed and accuracy options. The model achieves strong results on simulated benchmarks and real robot trials while using substantially less peak GPU memory than a comparison model.'}, 'zh': {'title': '共享循环计算，让机器人动作模型更轻、更灵活', 'desc': '这篇论文提出 LoopedWAM，一种紧凑的世界动作模型，通过循环复用共享的 Transformer 模块，减少模型存储和显存需求。它让视频专家和动作专家使用不同计算深度，以适应视觉特征只需计算一次、动作预测却要在每个采样步骤重复计算的特点。论文还提出弹性自蒸馏，在同一个模型检查点中训练不同的动作计算深度和采样步数，从而提供多种速度与精度配置。在多个机器人操作基准和真实机械臂测试中，LoopedWAM取得了有竞争力的成功率，并显著降低显存占用。'}}}, {'id': 'https://huggingface.co/papers/2611.32782', 'title': 'Measuring Layer-wise Intrinsic Dimensionality of FFNs in LLMs via PCA', 'url': 'https://huggingface.co/papers/2611.32782', 'abstract': "Abstract Large language models exhibit a middle-heavy intrinsic-dimensionality profile in their feed-forward layers, and using this profile to guide width allocation improves pruning under a fixed parameter budget.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Modern large language models (LLMs) keep the feed-forward network (FFN) intermediate width identical across every layer, a convention inherited from the original Transformer. Yet mechanistic work suggests layers at different depths do qualitatively different work, raising a natural question: are their capacity demands also non-uniform, and if so, can a fixed parameter budget be allocated more wisely than uniformly? To probe this, we apply principal component analysis (PCA) to the input of each FFN down-projection and measure, for every layer, its intrinsic dimensionality as the smallest number of principal components needed to reconstruct the activation up to a fixed cosine similarity. Scanning 58 open-weight LLMs spanning 14 families and 70M to 72B parameters, we find a recurring middle-heavy profile in which middle layers carry higher intrinsic dimensionality than edge layers; the profile is robust to the calibration corpus, even across English and Chinese, and is largely preserved through post-training fine-tuning. As a direct test that this signal is structurally meaningful, we use it to guide width pruning in a knowledge-distilled student under a matched parameter budget: the PCA-guided allocation outperforms the uniform-width convention by +2.3 points on Qwen3-8B and +2.5 on Qwen2.5-3B, while lower-dispersion teachers show smaller gaps (+0.9 on Gemma-3-4B, +0.5 on LLaMA-3-8B), and a budget-matched inverted control does worst on all four teachers. Across these four teachers, the size of the gap tracks how unevenly the teacher's intrinsic dimensionality is distributed across layers (a single-number summary we call σ_{99}), and the advantage persists through downstream supervised fine-tuning. Code is available at https://github.com/naver-ai/lidf.", 'score': 3, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '8570c5243f3fd465', 'authors': ['Daehee Kim'], 'affiliations': ['NAVER Cloud'], 'pdf_title_img': 'assets/pdf/title_img/2611.32782.jpg', 'data': {'categories': ['#interpretability', '#multilingual', '#training', '#architecture', '#inference', '#open_source', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Средние слои LLM нужнее крайних: распределяйте ширину FFN с умом', 'desc': 'Авторы показывают, что в FFN-слоях современных LLM внутренняя размерность активаций (измеряемая через PCA) распределена неравномерно: средние слои несут больше информации, чем крайние. Это свойство устойчиво к выбору калибровочного корпуса и сохраняется после fine-tuning. Использование этого профиля для распределения ширины FFN при pruning в knowledge distillation при том же бюджете параметров даёт прирост качества относительно равномерной ширины. Чем сильнее неравномерность у учителя, тем больше выигрыш.'}, 'en': {'title': 'Give the Middle Layers the Width They Need', 'desc': 'The paper uses principal component analysis (PCA) to estimate how much intrinsic dimensionality each Transformer feed-forward layer needs. Across 58 language models, middle layers generally have higher intrinsic dimensionality than layers near the beginning or end, and this pattern remains stable across data and fine-tuning. The authors use these estimates to allocate a fixed parameter budget unevenly when pruning a distilled model, preserving more width in layers with greater estimated capacity needs. This PCA-guided allocation outperforms uniform-width pruning, with larger gains when the teacher model’s layer-wise dimensionality is more uneven.'}, 'zh': {'title': '按层分配宽度，让模型容量用在关键处', 'desc': '论文研究大语言模型前馈网络（FFN）各层是否需要相同的宽度。作者用主成分分析（PCA）测量每层激活的内在维度，发现中间层通常比靠近输入和输出的边缘层具有更高的内在维度。根据这一分布，在固定参数预算下为各层分配不同宽度，能让知识蒸馏得到的学生模型优于统一宽度的剪枝方案。提升幅度与教师模型各层内在维度分布的不均匀程度相关，而且经过下游监督微调后仍能保持。'}}}, {'id': 'https://huggingface.co/papers/2611.32918', 'title': 'InstructReplay: Replaying Assistant Turns to Preserve General Behavior During Factual Fine-Tuning', 'url': 'https://huggingface.co/papers/2611.32918', 'abstract': "Abstract InstructReplay preserves an instruction-tuned language model's general abilities during fact fine-tuning by keeping its responses close to the initial model's answers on general instructions, reducing benchmark decline while still learning new facts.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Fine-tuning an instruction-tuned language model on new facts often erodes its general abilities. We find that standard fine-tuning lowers instruction-following, reasoning and coding benchmarks by 35 points on average, and that these losses track a collapse in answer length: fine-tuned models at least halve their responses, and the further a response drifts from the initial model's length, the more often it fails. We propose InstructReplay: the initial model answers a set of general instructions once, and during fine-tuning the model is kept close to the initial model on these answers. Across three model families and two domains, InstructReplay reduces the average decline on five general benchmarks from 28.1 to 2.4 points and keeps answer length close to the initial model's, while learning the new facts as well as standard fine-tuning. It balances learning and retention better than seven adaptation methods in all six settings. Controlled comparisons attribute the gain to replaying the model's own answers to general instructions rather than to the form of the loss.", 'score': 3, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'e10d2a194e950583', 'authors': ['Xiaofeng Shi', 'Qian Kou', 'Hua Zhou'], 'affiliations': ['Beijing Academy of Artificial Intelligence (BAAI)'], 'pdf_title_img': 'assets/pdf/title_img/2611.32918.jpg', 'data': {'categories': ['#optimization', '#training'], 'emoji': '🧠', 'ru': {'title': 'Учим новые факты, не забывая старые навыки', 'desc': 'Статья описывает InstructReplay — метод дообучения instruction-tuned LLM на новых фактах без потери общих способностей. Авторы показывают, что стандартный fine-tuning ухудшает качество на бенчмарках следования инструкциям, рассуждениям и программированию в среднем на 35 баллов, причём это связано с резким сокращением длины ответов. InstructReplay сохраняет распределение ответов модели на общие инструкции, близкое к исходной модели, через replay её собственных ответов в качестве регуляризации. Метод снижает падение на пяти общих бенчмарках с 28,1 до 2,4 балла, сохраняя при этом качество обучения новым фактам и превосходя семь альтернативных методов адаптации.'}, 'en': {'title': 'Learn new facts without forgetting how to help', 'desc': 'Fine-tuning an instruction-tuned language model to learn new facts can weaken its instruction-following, reasoning, and coding abilities. The paper finds that these declines are linked to shorter answers and proposes InstructReplay, which uses the model’s original answers to general instructions as replay targets during fine-tuning. This helps the model retain its general abilities while learning new facts, reducing the average benchmark decline from 28.1 points to 2.4 points across the tested settings. The results suggest that replaying the model’s own answers is more important than the specific form of the training loss.'}, 'zh': {'title': '学习新事实，也留住模型的通用本领', 'desc': '对指令微调语言模型进行新事实微调，可能损害其指令遵循、推理和编程等通用能力。研究发现，这种性能下降与回答长度缩短有关：回答越偏离初始模型的长度，越容易出错。InstructReplay先让初始模型回答一组通用指令，再在微调时约束模型，使其在这些指令上的回答接近初始模型。实验表明，该方法在有效学习新事实的同时，大幅减少通用基准性能下降，并且在多种设置下优于其他适配方法。'}}}, {'id': 'https://huggingface.co/papers/2611.30488', 'title': 'Do learned image captioning metrics generalize? Auditing duplicated samples in human-judgment benchmarks', 'url': 'https://huggingface.co/papers/2611.30488', 'abstract': "Abstract An audit of recent image captioning evaluation benchmarks shows that duplicate samples and metric behavior inflate reported correlations, and proposes a protocol under which zero-shot vision-language judges perform best on recent test sets.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Learned image captioning metrics are trained and tested on human judgments, so their reported correlation is a claim about generalization. We audit thi
