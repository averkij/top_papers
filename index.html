e, accent, and emotion of a target voice while preserving linguistic content. StyleStream 1.0 introduced the first streamable zero-shot VSC system with state-of-the-art conversion quality, but remained limited in two ways: approximately 1s end-to-end latency on consumer hardware, and the lack of a text-based interface for designing or editing target voices. We present StyleStream 2.0, a fast and controllable streaming VSC framework that addresses these limitations. To reduce latency, we train a few-step pixel MeanFlow model and further fine-tune it with autoregressive feedback inspired by Self Forcing, improving robustness under streaming inference. This reduces end-to-end latency to 520~ms on a consumer GPU, a 2x speedup over StyleStream 1.0, while maintaining conversion quality. To enable controllable style manipulation, we remove the mel-spectrogram context and instead route target style information through a compact style embedding. In this embedding space, we train a unified text-conditioned flow matching model that supports both text-based voice design, which maps natural language prompts to voice styles, and instruction-based voice editing, which modifies a specific attribute of a source utterance while preserving the rest. Experiments show that StyleStream 2.0 achieves the strongest target style fidelity on VSC, voice design, and voice editing, while remaining competitive on intelligibility and non-edited attribute preservation.', 'score': 9, 'issue_id': 3450, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '78bb3c1f3fb1c828', 'authors': ['Yisi Liu', 'Nicholas Lee', 'Gopala K. Anumanchipalli'], 'affiliations': ['University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2610.28940.jpg', 'data': {'categories': ['#optimization', '#diffusion', '#inference', '#audio', '#multimodal', '#training'], 'emoji': '🎙️', 'ru': {'title': 'Голос по текстовому описанию и в реальном времени', 'desc': 'Статья представляет StyleStream 2.0 — потоковую систему голосовой конверсии стиля (VSC), которая переносит тембр, акцент и эмоции целевого голоса, сохраняя лингвистическое содержание. Для снижения задержки до 520 мс авторы обучают few-step MeanFlow модель и дообучают её с авторегрессивной обратной связью, вдохновлённой Self Forcing. Вместо mel-спектрограммы контекста используется компактный style embedding, в пространстве которого обучается единая text-conditioned flow matching модель для текстового дизайна голоса и редактирования по инструкции. Эксперименты показывают наилучшую точность целевого стиля при сохранении разборчивости и неизменённых атрибутов.'}, 'en': {'title': 'Fast and Flexible Voice Conversion with StyleStream 2.0', 'desc': 'StyleStream 2.0 is an advanced framework for streaming voice conversion (VSC) that significantly reduces latency and enhances control over voice design. It utilizes a few-step MeanFlow model to achieve a remarkable end-to-end latency of 520 ms, which is twice as fast as its predecessor, StyleStream 1.0. The system introduces a unified flow matching model that allows users to manipulate voice styles through text prompts and edit specific attributes of voice while keeping the original content intact. Overall, StyleStream 2.0 excels in maintaining high conversion quality and fidelity to target styles, making it a powerful tool for voice transformation tasks.'}, 'zh': {'title': '流式语音转换的快速与可控', 'desc': 'StyleStream 2.0 是一种改进的流式语音转换技术，具有更低的延迟和更好的控制能力。它通过几步的 MeanFlow 模型来减少延迟，并引入统一的流匹配模型，实现基于文本的语音设计和编辑。与 StyleStream 1.0 相比，StyleStream 2.0 在消费者硬件上将端到端延迟降低到 520 毫秒，同时保持了转换质量。该系统支持通过文本提示设计语音风格，并能够在保留其他内容的同时修改源语音的特定属性。'}}}, {'id': 'https://huggingface.co/papers/2610.28027', 'title': 'From RL Papers to Framework Code: Inclusion and Review in Seven Open-Source Training Frameworks', 'url': 'https://huggingface.co/papers/2610.28027', 'abstract': "Abstract Most proposed reinforcement learning training methods for language models are not adopted by open-source frameworks, with adoption rates remaining low despite growing publication volumes.  Generated by thinkingmachines/Inkling-Small Practitioners use reinforcement learning methods for language models through training frameworks, so a method that a framework includes is one configuration change away for its users. We measure how often this happens. We trace seven open-source frameworks for RL post-training through their commit histories and link them to 6,939 screened arXiv papers from January 2025 to June 2026. Of 1,598 papers that propose a general RL training method, 37 reached at least one framework. Across five quarterly cohorts of papers, the number included within 180 days stayed between 5 and 7 while the cohorts grew from 72 to 386 papers. Compared with papers from the same quarters, included papers more often trained policies of 30B parameters or more, at 41 against 10 percent, and more often changed a coefficient, clip, mask or weight in the existing loss, at 29 against 9 percent. Both gaps hold without papers from the companies that maintain the frameworks, while code release was equally common in both groups. The frameworks' issues and pull requests show that few methods are turned away in public. More than nine in ten of the general methods no framework included have no thread there that cites or names them, and many proposals that do appear stay open without a reply. Two further records, the frameworks' issues and the technical reports of 13 large open-weight models, show that users rarely report training failures in public and that the reports state 8 of the 13 widely included methods. We release the data as a tracker that links training failures to framework implementations and lists each framework's contribution rules and earlier proposals.", 'score': 9, 'issue_id': 3448, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': 'c000c3a92c120fe0', 'authors': ['Taiheng Pan'], 'affiliations': ['The University of Melbourne'], 'pdf_title_img': 'assets/pdf/title_img/2610.28027.jpg', 'data': {'categories': ['#rl', '#optimization', '#open_source', '#benchmark', '#training', '#data', '#rlhf'], 'emoji': '🔍', 'ru': {'title': 'Почему RL-методы для LLM редко попадают в open-source фреймворки', 'desc': 'В статье изучается, почему методы обучения с подкреплением (RL) для LLM редко попадают в популярные open-source фреймворки, несмотря на рост числа публикаций. Авторы отслеживают историю коммитов семи фреймворков и связывают их с почти 7000 статьями arXiv за 2025–2026 годы. Включённые в фреймворки методы чаще применяются к моделям от 30B параметров и чаще меняют коэффициенты, clip, маски или веса в существующей функции потерь. Исследование также показывает, что фреймворки почти не обсуждают подобные предложения публично, а авторы выпускают трекер, связывающий сбои обучения с реализациями в фреймворках.'}, 'en': {'title': 'Bridging the Gap: Enhancing RL Method Adoption in Language Models', 'desc': 'This paper investigates the low adoption rates of proposed reinforcement learning (RL) methods for language models within open-source frameworks. It analyzes the commit histories of seven frameworks and correlates them with 6,939 arXiv papers published between January 2025 and June 2026. The findings reveal that only a small fraction of RL methods (37 out of 1,598) were integrated into these frameworks, with a notable preference for methods that involve training larger models and modifying existing loss functions. The study also highlights a lack of public engagement with many proposed methods, suggesting that the barriers to adoption may stem from insufficient visibility and feedback mechanisms in the open-source community.'}, 'zh': {'title': '强化学习方法在开源框架中的应用挑战', 'desc': '这篇论文探讨了强化学习在语言模型训练中的应用，尤其是开源框架的采用情况。尽管有大量相关论文发表，但只有少数提出的训练方法被实际应用到开源框架中。研究显示，只有37篇论文的强化学习方法被至少一个框架采纳，而这些方法通常涉及更大参数的模型和更复杂的损失函数调整。论文还提供了一个数据追踪工具，帮助用户了解训练失败与框架实现之间的关系。'}}}, {'id': 'https://huggingface.co/papers/2610.28827', 'title': 'WorldStream: Streaming Interactive 3D Worlds with Hierarchical Planning and Persistent State', 'url': 'https://huggingface.co/papers/2610.28827', 'abstract': 'Abstract WorldStream is an open-ended 3D world model that continuously expands terrain, processes language commands, and preserves edits through hierarchical planning and streaming compilation.  Generated by thinkingmachines/Inkling-Small We present WorldStream, an open-ended 3D world model with three simultaneous capabilities: it extends playable terrain beyond any pre-specified map, acts on open-ended language in the running world, and restores visited places with their edits. A hierarchical planner over a typed decision model emits structured decision state: Macro fixes settlement, ecology, transport, and hydrological structure across a group of tiles; Micro specializes that contract into tile semantics under measured terrain and accepted neighbor commitments. Deterministic local code compiles accepted plans into terrain, roads, settlements, vegetation, and entities. Streaming separates their reach: plans run ahead along the predicted corridor, compilation only where movement will soon need it, geometry behind the user released. One world record retains plans, seeds, object identities and mutable state, boundary commitments, and edits by attribute, revised as the user advances and edits; returning tiles recompile from it. The same record grounds interaction: the model acts on existing entities, including stateful NPCs that update as they act, edits the present region, or attaches intent to unplanned regions. Together they yield a world expanding under bounded budgets, connected across independently planned tiles, and interactive.', 'score': 9, 'issue_id': 3448, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '8d16697b786c7467', 'authors': ['Xiaoxiao Ma', 'Weiyang Jin', 'Yanwen Ma', 'Haoran Li', 'Zhixiang Wei', 'Songchun Zhang', 'Yaowei Li', 'Junhao Zhuang', 'Zeyue Xue', 'Yuming Li', 'Zheming Fu', 'Haoyang Huang', 'Nan Duan', 'Feng Zhao'], 'affiliations': ['Joy Future Academy, JD', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.28827.jpg', 'data': {'categories': ['#games', '#3d', '#agents', '#agi', '#architecture'], 'emoji': '🌍', 'ru': {'title': 'Бесконечный мир, который помнит каждое ваше действие', 'desc': 'WorldStream — это открытая 3D-модель мира, которая непрерывно расширяет игровую местность, понимает свободные текстовые команды и сохраняет изменения. Иерархический планировщик (Macro и Micro) формирует структурированное описание поселений, экологии, дорог и гидрологии, а детерминированный локальный код превращает эти планы в ландшафт и объекты. Потоковая архитектура вычисляет план заранее вдоль предполагаемого маршрута пользователя и отбрасывает геометрию позади него, что укладывается в ограниченный бюджет ресурсов. Единая запись мира хранит планы, сиды, состояние объектов и правки, поэтому при возвращении в регион он восстанавливается без потерь, а LLM-подобные агенты, включая NPC с изменяемым состоянием, работают с существующими сущностями.'}, 'en': {'title': 'Endless Exploration in an Evolving 3D World', 'desc': 'WorldStream is a dynamic 3D world model that can grow and adapt in real-time, allowing for endless exploration and interaction. It processes language commands to modify the environment and remembers changes made by users, ensuring a persistent and evolving experience. The system uses a hierarchical planning approach to manage both large-scale and detailed changes in the terrain and structures. By compiling plans and updates efficiently, WorldStream creates a seamless and interactive world that responds to player actions and decisions.'}, 'zh': {'title': '开放式3D世界模型的无限扩展', 'desc': 'WorldStream 是一个开放式的 3D 世界模型，能够不断扩展地形、处理语言命令并通过分层规划和流式编译保留编辑内容。它具有三个主要功能：扩展可玩地形、响应开放式语言指令以及恢复已访问地点的编辑。通过分层规划器，模型能够生成结构化的决策状态，处理宏观和微观层面的决策。最终，WorldStream 实现了一个在有限预算下扩展的互动世界，能够连接独立规划的区域。'}}}, {'id': 'https://huggingface.co/papers/2610.27040', 'title': 'ACE-Brain-0.6: Scaling Spatial Grounding for Physical Foundation Models', 'url': 'https://huggingface.co/papers/2610.27040', 'abstract': "Abstract Scaling diverse verifiable visual grounding data improves spatial perception and embodied manipulation performance in open multimodal models.  Generated by thinkingmachines/Inkling-Small General-purpose multimodal models, including GPT-6 Astra and Claude Opus 5.5, demonstrate broad capabilities in embodied manipulation. Our analysis indicates that this generality is accompanied by strong spatial perception, as Astra can determine where to interact with task-relevant entities amid visual distractors. Because spatial perception connects high-level reasoning to the physical scene, we investigate scaling visual grounding to strengthen the perceptual foundation of general embodied operation. We develop a unified data pipeline that combines robot manipulation recordings with complementary visual data from diverse sources. After automatically annotating the robot recordings, the pipeline converts the collected data into verifiable grounding supervision. Fine-tuning Qwen3.5-9B on approximately 1.5 million samples produced by this pipeline yields ACE-Brain-0.6. The model outperforms GPT-6 Astra on four of seven public grounding benchmarks, with an overall average score of 75.41 compared with Astra's 73.68. Under a fixed Qwen3.5-9B fine-tuning setup, aggregate grounding performance improves steadily as successive data releases expand the training collection to cover a broader range of grounding scenarios. These results show that scaling verifiable grounding supervision from diverse sources can strengthen the spatial perception of an open 9B model for general embodied operation.", 'score': 9, 'issue_id': 3447, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': 'b76309c7c6a31a8a', 'pdf_title_img': 'assets/pdf/title_img/2610.27040.jpg', 'data': {'categories': ['#cv', '#robotics', '#benchmark', '#alignment', '#dataset', '#data', '#training', '#synthetic', '#open_source', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Больше верифицируемого grounding-обучения — сильнее пространственное восприятие у открытой 9B-модели', 'desc': 'Авторы показывают, что крупные мультимодальные модели, такие как GPT-6 Astra, хорошо справляются с пространственным восприятием и задачами embodied-манипуляций. Чтобы усилить этот фундамент, они создают единый data pipeline, который объединяет записи работы роботов с разнородными визуальными данными и автоматически размечает их в верифицируемую supervision для visual grounding. На основе примерно 1,5 миллиона таких образцов дообучается открытая модель Qwen3.5-9B, получившая название ACE-Brain-0.6. Она превосходит GPT-6 Astra на четырёх из семи публичных бенчмарков и по среднему баллу (75.41 против 73.68), а рост качества при расширении обучающих данных показывает, что масштабирование проверяемого grounding способно усилить пространственное восприятие небольшой открытой LLM.'}, 'en': {'title': 'Enhancing Spatial Perception through Diverse Visual Grounding Data', 'desc': 'This paper discusses how increasing the amount of diverse and verifiable visual grounding data can enhance the spatial perception and manipulation abilities of multimodal models. The authors focus on models like GPT-6 Astra and Claude Opus 5.5, which show strong performance in tasks requiring interaction with visual elements. By creating a unified data pipeline that combines robot manipulation recordings with various visual data, they generate a large dataset for training. The results indicate that fine-tuning the Qwen3.5-9B model on this extensive dataset leads to improved performance in grounding tasks compared to existing models.'}, 'zh': {'title': '扩展视觉基础数据，提升空间感知能力', 'desc': '这篇论文探讨了如何通过扩展多样化的可验证视觉基础数据来提高开放多模态模型的空间感知和身体操作性能。研究表明，通用多模态模型如GPT-6 Astra和Claude Opus 5.5在身体操作中表现出强大的能力，尤其是在复杂视觉环境中识别任务相关实体的能力。我们开发了一种统一的数据管道，将机器人操作记录与来自不同来源的视觉数据结合，自动注释后生成可验证的基础监督。通过在约150万样本上微调Qwen3.5-9B模型，结果显示该模型在多个公共基础基准测试中超越了GPT-6 Astra，证明了多样化数据对增强空间感知的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.30090', 'title': 'VX-One: Typed, Calibrated Decision Heads for Real-Time Perimeter Triage - An empirical study of unknown-attack honesty, cascade gray zones, and calibration under drift', 'url': 'https://huggingface.co/papers/2610.30090', 'abstract': 'Abstract VX-One is a small multi-task neural network that outputs calibrated typed decision primitives for perimeter triage, evaluated in a two-phase cascade against signature engines and baseline classifiers across multiple intrusion detection benchmarks.  Generated by thinkingmachines/Inkling-Small Perimeter triage faces a latency/semantics trade-off: signature engines are fast and format-safe but blind to unseen attacks, while generative models are semantic but slow and produce unparseable output. In late 2026 a class of commercial System One decision models (TypeSafe Jev; Microsoft-Decision-1) began selling typed decision primitives - binary gates, closed-set choices, ordinal scores - as product APIs, with no academic treatment. We present VX-One: a small multi-head network (100K-10M parameters) whose outputs are these primitives - a calibrated gate, a choice over a closed candidate set that always includes an explicit unknown option, and an ordinal score, trained multi-task, temperature-calibrated per head (~0.7-1.7 ms p50 on CPU). We evaluate it on UNSW-NB15, CIC-IDS2017, EMBER2024 against calibrated XGBoost, Random-Forest, MLP, Kitsune, and measure a two-phase cascade (Suricata with 52,674 Emerging-Threats rules -> VX-One) over five days of CIC-IDS2017. Findings: (i) VX-One wins detection (AUROC/FPR@95%TPR) on UNSW-NB15 and under temporal drift on CIC-IDS2017 (0.711 vs 0.637), but XGBoost wins multi-class attribution on all three benchmarks; (ii) leave-one-family-out gate detects never-seen families on 9/9 UNSW folds yet drops below chance on CIC recon family, and abstention threshold transfers poorly across benchmarks; (iii) on payload-less reconstructions signature engines resolve ~0.1% of flows - gray zone ~99.9% of traffic, recovered by Phase 2 (combined recall >=0.978); (iv) calibration collapses under temporal drift (ECE 0.04->0.40) for every method while ranking partially survives. We provide a measured account of where typed calibrated decisions help perimeter triage, and where they fail.', 'score': 9, 'issue_id': 3447, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'ed046c42294deda2', 'authors': ['Juan S. Santillana'], 'affiliations': ['Independent research'], 'pdf_title_img': 'assets/pdf/title_img/2610.30090.jpg', 'data': {'categories': ['#optimization', '#benchmark', '#small_models', '#security', '#architecture'], 'emoji': '🛡️', 'ru': {'title': 'Быстрые типизированные решения помогают защищать периметр, но калибровка ломается при дрифте данных', 'desc': 'В статье представлена VX-One — компактная мультизадачная нейросеть (от 100 тыс. до 10 млн параметров), которая выдаёт типизированные решения: калиброванный бинарный шлюз, выбор из закрытого набора классов с явной опцией «неизвестно» и порядковую оценку. Модель обучается multi-task и калибруется по температуре отдельно для каждой головы, работая за ~1 мс на CPU. Авторы сравнивают её с XGBoost, Random Forest, MLP и Kitsune на UNSW-NB15, CIC-IDS2017 и EMBER2024, а также с каскадом Suricata плюс VX-One. Результаты показывают, что VX-One лучше обнаруживает атаки и при temporal drift, но XGBoost превосходит её в multi-class атрибуции, а калибровка сильно деградирует при дрифте.'}, 'en': {'title': 'VX-One: Bridging Speed and Semantic Understanding in Intrusion Detection', 'desc': 'The paper introduces VX-One, a compact multi-task neural network designed to produce calibrated decision primitives for perimeter triage in intrusion detection systems. It addresses the trade-off between speed and semantic understanding in existing models, offering outputs like binary gates and ordinal scores that enhance decision-making. Evaluated against various benchmarks, VX-One demonstrates superior detection capabilities while highlighting challenges such as calibration issues under temporal drift. The findings suggest that while VX-One excels in certain detection scenarios, it also reveals limitations in multi-class attribution and adaptability across different datasets.'}, 'zh': {'title': 'VX-One：高效的周界分类决策模型', 'desc': 'VX-One 是一个小型多任务神经网络，能够输出经过校准的类型化决策原语，用于周界分类。该模型在多个入侵检测基准上进行了评估，采用了两阶段级联的方法，与签名引擎和基线分类器进行比较。VX-One 解决了签名引擎快速但对未知攻击盲目的问题，同时也克服了生成模型慢且输出不可解析的缺陷。研究结果表明，VX-One 在某些基准上表现优于其他模型，但在时间漂移下校准效果下降。'}}}, {'id': 'https://huggingface.co/papers/2610.28474', 'title': "Answering in the User's Variety: Calibrated Accommodation Pairs for Post-Training", 'url': 'https://huggingface.co/papers/2610.28474', 'abstract': "Abstract  People adapt how they talk to the person in front of them. However, chat models tend to respond in Standard English regardless of the dialect used by the user. A uniform answer can hide whether training treats these users alike, and output audits cannot tell as well. We trace how each post-training stage, from supervised fine-tuning (SFT) to preference optimization (DPO) and reinforcement learning, changes a model's tendency to match the user, and read what each update prefers from two content-matched replies, one matching the user and one not. Across 10 open model lineages, post-training standardizes replies to every informal cue, yet after adjusting for how likely each reply already was, the DPO update still favours matching British and Australian spelling over AAE and Singlish on 10 lineages, and models still produce AAE features when asked. We then introduce calibrated accommodation pairs (CAP), preference data that reward matching users' dialect density while preserving Standard English for Standard-English users. On a fully open model, CAP raises convergence on features it was not trained on without a detectable increase in dialect for Standard-English users or a cost in instruction following. In contrast, one-sided pairs reach a similar gain only by overshooting the user and imposing dialect. Our findings show that uniform replies can hide selective updates and audits should read the update as well as the output. Code: https://github.com/kouzhizhuo/cap-accommodation.", 'score': 8, 'issue_id': 3447, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '12508c9b2ddea448', 'authors': ['Zhizhuo Kou', 'Heming Li', 'Jian Yang', 'Junyu Luo', 'Jingshu Peng', 'Sirui Han', 'Yike Guo'], 'affiliations': ['Peking University', 'The Hong Kong University of Science and Technology', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2610.28474.jpg', 'data': {'categories': ['#rlhf', '#optimization', '#multilingual', '#alignment', '#data', '#training', '#ethics'], 'emoji': '🗣️', 'ru': {'title': 'Одинаковые ответы могут скрывать неравное обучение: аудит должен смотреть на обновления модели', 'desc': 'Статья исследует, как этапы post-training (SFT, DPO и reinforcement learning) меняют склонность LLM подстраиваться под диалект пользователя. Авторы сравнивают пары ответов, один из которых соответствует диалекту пользователя, а другой нет, и учитывают априорную вероятность каждого ответа. Результаты показывают, что DPO по-прежнему предпочитает британское и австралийское написание перед AAE и Singlish, даже если выходные ответы кажутся однородными. Предложенные calibrated accommodation pairs (CAP) позволяют повысить адаптацию к диалекту без роста диалектности для пользователей со стандартным английским и без потери качества instruction following.'}, 'en': {'title': 'Bridging Dialects: Enhancing Chat Models with Calibrated Accommodation', 'desc': "This paper explores how chat models respond to users' dialects and the impact of different training stages on this behavior. It highlights that while models often default to Standard English, they can be adjusted to better accommodate users' dialects through techniques like calibrated accommodation pairs (CAP). The study shows that CAP can enhance a model's ability to match users' dialects without compromising its performance for Standard English users. Ultimately, the research emphasizes the importance of auditing both the updates made to models and their outputs to ensure fair treatment of diverse dialects."}, 'zh': {'title': '让聊天模型更懂你的语言风格', 'desc': '这篇论文探讨了聊天模型如何适应用户的语言风格。研究发现，尽管模型在训练后会标准化回复，但在某些情况下仍然偏向于使用特定的拼写和方言。作者提出了校准适应对（CAP），这种方法可以在保持标准英语的同时，奖励与用户方言相匹配的回复。研究结果表明，统一的回复可能掩盖了模型的选择性更新，因此审计时需要同时关注更新和输出。'}}}, {'id': 'https://huggingface.co/papers/2610.29434', 'title': 'RubatoCodec: Budgeted Adaptive Speech Tokenization with Streaming Decoding', 'url': 'https://huggingface.co/papers/2610.29434', 'abstract': "Abstract RubatoCodec uses adaptive event-based coding with fixed utterance budgets to improve low-rate speech reconstruction and streaming text-to-speech generation.  Generated by thinkingmachines/Inkling-Small Neural speech codecs provide discrete tokens for speech generation. Lower frame rates shorten token sequences, but each token must then carry more linguistic and acoustic information. Variable-frame-rate codecs address this trade-off by adapting token allocation to speech content, but threshold-based allocation lets content determine the token count, so the sequence length a speech generator must produce varies across utterances and datasets at a fixed setting. We present RubatoCodec, a variable-frame-rate speech codec built on X-Codec-2 with an exact utterance-level event budget and streaming decoding. Its Adaptive Firing mechanism uses changes in codec features and waveform spectra to divide speech into variable-duration events without a learned boundary predictor. Discrete codes and an explicit duration represent each event, allowing a speech generator to predict and decode one event at a time. Controlled experiments show that adaptive allocation outperforms fixed-rate coding in reconstruction fidelity and intelligibility at low event rates. A model trained on large-scale multilingual speech achieves competitive reconstruction quality across English, Japanese, and Mandarin, with the best intelligibility preservation among the compared codecs on the evaluated English and Japanese benchmarks at comparable bitrates. In a matched text-to-speech comparison, the adaptive representation yields lower WER and higher UTMOS and UTMOSv2 with comparable speaker similarity. The speech generator also learns the codec's utterance-level event budget without an explicit generation-time rate constraint. These results demonstrate that budgeted adaptive speech representations support both high-quality reconstruction and streaming text-to-speech generation. Code and weights are available at https://github.com/third-intelligence/RubatoCodec and https://huggingface.co/third-intelligence/RubatoCodec.", 'score': 8, 'issue_id': 3447, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '343617a542d6c164', 'authors': ['Chihiro Arata', 'Shohei Taniguchi', 'Gouki Minegishi', 'Kan Hatakeyama-Sato'], 'affiliations': ['Third Intelligence, Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2610.29434.jpg', 'data': {'categories': ['#inference', '#multilingual', '#architecture', '#audio'], 'emoji': '🎙️', 'ru': {'title': 'Адаптивные события вместо фиксированных кадров: бюджетная речь для потокового синтеза', 'desc': 'В статье представлен RubatoCodec — нейросетевой речевой кодек с переменной частотой кадров и точным бюджетом событий на высказывание. Механизм Adaptive Firing делит речь на события переменной длительности по изменениям признаков кодека и спектра сигнала, без обучаемого предсказателя границ. Каждое событие описывается дискретными кодами и явной длительностью, что позволяет языковой модели генерировать и декодировать речь по одному событию в потоковом режиме. Эксперименты показывают лучшее качество восстановления и разборчивость при низкой частоте событий, а также меньший WER и более высокие UTMOS/UTMOSv2 в задаче text-to-speech.'}, 'en': {'title': 'Adaptive Speech Coding for High-Quality Reconstruction', 'desc': 'RubatoCodec is a speech codec that improves the quality of low-rate speech reconstruction and streaming text-to-speech by using adaptive event-based coding. It allocates a fixed budget of utterance events, allowing for variable frame rates that adapt to the content of the speech. This approach enables the codec to produce discrete tokens that carry more information while maintaining intelligibility and reconstruction fidelity. Experiments show that RubatoCodec outperforms traditional fixed-rate codecs, achieving high-quality results across multiple languages with efficient resource usage.'}, 'zh': {'title': '自适应语音编码，提升重建质量与流式生成', 'desc': 'RubatoCodec是一种自适应事件编码技术，旨在改善低比特率语音重建和流式文本到语音生成。它通过固定的发声预算来优化语音生成过程，允许每个事件携带更多的语言和声学信息。该模型采用自适应触发机制，根据编码特征和波形谱的变化，将语音划分为可变时长的事件，从而提高了重建的保真度和可懂度。实验结果表明，RubatoCodec在多种语言的语音重建中表现出色，尤其在英语和日语的评估基准中具有最佳的可懂度保持。'}}}, {'id': 'https://huggingface.co/papers/2610.09861', 'title': 'Toward Part-Aware Choral Transcription with singing voice assignment', 'url': 'https://huggingface.co/papers/2610.09861', 'abstract': 'Abstract PawCT is an end-to-end neural framework that jointly transcribes choral audio into separate SATB note tracks using part-specific predictions, range priors, and ordered-continuity constraints.  Generated by thinkingmachines/Inkling-Small Single-instrument automatic music transcription (AMT) has advanced substantially, yet choral applications require soprano, alto, tenor, and bass (SATB) to be transcribed as separate parts. Recent note-level choral AMT instead produces a single merged note track, limiting rehearsal, education, and score reconstruction. To address this limitation, we introduce Part-aware Choral Transcription (PawCT), to our knowledge the first end-to-end neural framework that identifies active SATB parts from choral audio and transcribes each into a separate note-level track. PawCT combines part-specific onset, offset, and frame prediction with part-presence estimation, union-level supervision, and structured training targets using a range prior (RP) based on SATB pitch ranges and its ordered-continuity (OC) extension, which adds within-part melodic continuity and cross-part pitch ordering. On YouChorale, PawCT-RP-OC achieves a macro part-aware note F1 of 0.225 at a 50-ms onset tolerance, outperforming an adapted choral baseline (0.165) by 36.4% relative and a two-stage post-hoc assignment pipeline (0.175). Its part-agnostic variant, PagCT, achieves a 50-ms onset F1 of 0.382, compared with 0.237 for the previous state-of-the-art choral AMT model. Cross-dataset evaluations on CSD and Cantoria further assess performance under dataset shift. These results demonstrate the benefit of jointly modeling note transcription and vocal-part assignment. Code and demos are available at https://hanyu-meng.github.io/Paw_Choral_AMT_Demo/.', 'score': 8, 'issue_id': 3447, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '17d876807c00ccfe', 'authors': ['Hanyu Meng', 'Zhanhong He', 'Zixun Guo', 'Yaolong Ju'], 'affiliations': ['Center for Digital Music (C4DM), Queen Mary University of London, London, United Kingdom', 'Great Bay University, Guangdong, China', 'The University of New South Wales, Sydney, Australia', 'The University of Western Australia, Perth, Australia'], 'pdf_title_img': 'assets/pdf/title_img/2610.09861.jpg', 'data': {'categories': ['#benchmark', '#architecture', '#audio'], 'emoji': '🎼', 'ru': {'title': 'Каждый голос хора — на своей нотной строке', 'desc': 'В статье представлен PawCT — сквозная нейросетевая модель (end-to-end neural framework) для автоматической транскрипции хорового аудио в отдельные треки нот для партий сопрано, альта, тенора и баса (SATB). Модель совместно предсказывает onset, offset и frame для каждой партии, оценивает присутствие партии и использует range prior на основе диапазонов SATB и ограничения ordered-continuity для мелодической непрерывности и порядка высот между партиями. На датасете YouChorale PawCT-RP-OC превосходит адаптированный хоровой baseline и двухэтапный пост-обработочный пайплайн по метрике part-aware note F1 при 50-мс допуске onset. Совместное моделирование транскрипции нот и назначения вокальной партии показало свою эффективность, а код и демо доступны в открытом виде.'}, 'en': {'title': 'Revolutionizing Choral Music Transcription with PawCT', 'desc': 'PawCT is a novel neural network framework designed for automatic music transcription (AMT) specifically for choral music, which involves separating the audio into distinct tracks for soprano, alto, tenor, and bass (SATB) voices. Unlike previous methods that produced a single merged note track, PawCT utilizes part-specific predictions and structured training to accurately transcribe each vocal part. It incorporates range priors and ordered-continuity constraints to enhance the transcription quality by ensuring melodic continuity within parts and proper pitch ordering across parts. The framework has shown significant improvements in transcription accuracy compared to existing models, making it a valuable tool for music education and rehearsal.'}, 'zh': {'title': '合唱音频的智能分轨转录', 'desc': 'PawCT是一种端到端的神经网络框架，能够将合唱音频转录为独立的SATB音轨。它通过特定部分的预测、音域先验和有序连续性约束来实现这一目标。与传统的合唱自动音乐转录方法不同，PawCT能够识别活跃的SATB部分，并将每个部分转录为单独的音符轨道。实验结果表明，PawCT在音符转录和声部分配的联合建模上表现优越，显著提高了转录的准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.28905', 'title': 'Hidden Messages Between Diffusion Language Model Agents: Causal Evidence for Latent Communication', 'url': 'https://huggingface.co/papers/2610.28905', 'abstract': 'Abstract Diffusion language model agents can exchange compressed continuous hidden messages that causally affect reasoning, with the timing of transfer sometimes outweighing repeated exchanges.  Generated by thinkingmachines/Inkling-Small Diffusion language models form answers through a sequence of revisable continuous states, but multi-agent systems usually discard those states and make agents communicate only after decoding text. We ask whether one independent diffusion trajectory can pass a compact hidden message into another and, crucially, whether the receiver uses what that message means. In Hidden Messages, a sender compresses its denoising state into four signed dense vectors; the receiver consumes them while retaining its own context, canvas, and trajectory. Removing a message tests whether the channel matters; replacing it with a message from another example tests whether its content matters. Across controlled tasks, derangement removes a +63.6-point advantage on Tiny-A2D and a +100.0-point advantage on Dream-7B, while targeted substitutions steer the receiver toward the substituted fact. On QASC with the two supporting facts split across agents, matched communication reaches 80.8%, but a wrong-example message lowers accuracy to 46.8%, a content effect of +34.0 points. The surprising result is temporal: one late transfer reaches 87.8%, exceeding four recurrent exchanges by +7.0 points. These experiments provide causal evidence for continuous hidden communication between diffusion-LM agents and show that when information is transferred can matter more than how many times agents exchange it.', 'score': 7, 'issue_id': 3450, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': 'beaf8f4940bd8e69', 'authors': ['Alan-Barsag Gazzaev', 'Alexey Gavrilov', 'Sergey Muravyov', 'Ilya Makarov'], 'affiliations': ['HSE University', 'ITMO University'], 'pdf_title_img': 'assets/pdf/title_img/2610.28905.jpg', 'data': {'categories': ['#architecture', '#optimization', '#agents', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Важен момент передачи, а не число обменов', 'desc': 'В статье исследуется, может ли одна диффузионная языковая модель (diffusion LM) передавать другой агенту сжатое скрытое сообщение в виде непрерывных векторов, не декодируя текст. Авторы показывают причинное влияние такого канала: удаление или подмена сообщения резко снижает точность на задачах рассуждения, а на QASC содержание сообщения даёт прирост около 34 пунктов. Неожиданный результат заключается в том, что одна поздняя передача состояния работает лучше четырёх повторных обменов, то есть момент передачи важнее её количества. Эксперименты дают причинные доказательства того, что непрерывная скрытая коммуникация между агентами на основе diffusion LM возможна и эффективна.'}, 'en': {'title': 'Timing Over Frequency: The Power of Hidden Messages in Diffusion Agents', 'desc': 'This paper explores how diffusion language model agents can communicate using compressed hidden messages that influence their reasoning processes. It demonstrates that the timing of message transfer can be more important than the frequency of exchanges between agents. The study shows that a single, well-timed message can significantly improve performance compared to multiple exchanges of less relevant information. The findings highlight the importance of both the content and timing of communication in multi-agent systems, suggesting that effective information transfer can enhance collaborative reasoning.'}, 'zh': {'title': '信息传递时机胜于频率', 'desc': '这篇论文探讨了扩散语言模型代理之间的隐含信息传递。研究表明，信息的传递时机有时比多次交换更为重要。通过压缩的隐藏信息，发送者能够影响接收者的推理过程。实验结果显示，延迟的信息传递可以显著提高准确率，证明了信息传递的时效性对多智能体系统的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.29934', 'title': 'ToM2Vec: Continuous Theory-of-Mind Tokens for Multi-Agent Coordination', 'url': 'https://huggingface.co/papers/2610.29934', 'abstract': "Abstract ToM2Vec learns abstract partner-state representations via continuous latent reasoning tokens to improve multi-agent collaboration across diverse settings.  Generated by thinkingmachines/Inkling-Small Forming an accurate theory-of-mind (ToM) is key to successful multi-agent collaboration and requires reasoning under uncertainty to capture multiple possible partner states. This is hard to do in the text representation space native to large language model (LLM) agents, which more easily describe a single partner state. To address this challenge, we introduce ToM2Vec, which learns to form abstract theories-of-mind in a rich latent space via a fixed budget of continuous reasoning tokens. During training, supervision for these tokens comes from the partner's actual thoughts, which the ToM tokens are trained to abstract and match. At test-time, ToM tokens are generated by each agent and act as conditioners for that agent's thoughts and actions. Across several environments covering collaborative, competitive, and mixed-motive settings (Overcooked-AI, multiparty negotiation, Decrypto, Hanabi, and Collab Escape/Capture), we evaluate ToM2Vec's ability to support multi-agent interactions and collaboration, finding consistent improvements over the base model and a variety of competitive trained and prompted baselines. We show that latent reasoning is critical, with performance dropping when reasoning is expressed in text. Moreover, we show that ToM2Vec training generalizes to partner model families not seen at train-time, including a proprietary model (GPT-5.4). In our analysis, we provide evidence that the latent tokens encode a ToM, rather than task-specific information: ToM2Vec's tokens improve the agent's ability to directly answer questions about partner beliefs, desires, and next actions.", 'score': 7, 'issue_id': 3449, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '7995a18fabc691bf', 'authors': ['Nithin Sivakumaran', 'Ali Payani', 'Hyunji Lee', 'Mohit Bansal', 'Elias Stengel-Eskin'], 'affiliations': ['Cisco', 'The University of Texas at Austin', 'UNC Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2610.29934.jpg', 'data': {'categories': ['#benchmark', '#reasoning', '#architecture', '#training', '#agents', '#games'], 'emoji': '🤝', 'ru': {'title': 'Понимать партнёра без слов: латентные токены разума для мультиагентного сотрудничества', 'desc': 'В статье представлен метод ToM2Vec, который помогает LLM-агентам формировать теорию разума (Theory-of-Mind) о партнёре в скрытом латентном пространстве, а не в виде текста. Модель использует фиксированный набор непрерывных reasoning-токенов, которые обучаются на реальных мыслях партнёра и затем служат кондиционером для действий агента. Эксперименты в кооперативных, конкурентных и смешанных средах (Overcooked-AI, Hanabi, Decrypto и др.) показали стабильное улучшение над базовыми моделями и сильными baseline-подходами. Метод также обобщается на модели, не встречавшиеся при обучении, включая проприетарную GPT-5.4.'}, 'en': {'title': 'Enhancing Multi-Agent Collaboration with Theory-of-Mind Representations', 'desc': "ToM2Vec is a machine learning model designed to enhance collaboration among multiple agents by developing abstract representations of their partner's mental states, known as theory-of-mind (ToM). It utilizes continuous latent reasoning tokens to capture various possible states of a partner, which is crucial for effective interaction in uncertain environments. The model is trained using actual thoughts from partners to create these tokens, which then guide the agents' actions and decisions during testing. Evaluations across diverse scenarios demonstrate that ToM2Vec significantly outperforms traditional models, highlighting the importance of latent reasoning over simple text representations."}, 'zh': {'title': '提升多智能体协作的心智理论学习', 'desc': 'ToM2Vec是一种通过连续的潜在推理标记学习抽象的伙伴状态表示的方法，旨在提高多智能体在不同环境中的协作能力。成功的多智能体协作需要在不确定性下进行推理，以捕捉多个可能的伙伴状态，而这在大型语言模型的文本表示空间中是困难的。ToM2Vec通过固定预算的连续推理标记，在丰富的潜在空间中学习形成抽象的心智理论。在多个环境中进行评估时，ToM2Vec在支持多智能体互动和协作方面表现出一致的改进，证明了潜在推理的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.28909', 'title': 'DiffResearch: Accelerating Deep Research with Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.28909', 'abstract': "Abstract DiffResearch replaces autoregressive backbones with diffusion language models in multi-agent deep research, achieving large latency reductions and improved report quality via iterative planning and early subquery extraction.  Generated by thinkingmachines/Inkling-Small Deep research systems iteratively plan, gather evidence, synthesize, and revise, making end-to-end latency a key bottleneck for interactive use. Almost all production systems are built on autoregressive (AR) language models and inherit left-to-right decoding in planning and long-form writing. We present DiffResearch, an open multi-agent deep research framework that places a diffusion language model (dLLM) at the core of every stage, and measure how a diffusion backbone changes latency and report quality. Holding the agentic scaffold, retrieval code, prompts, and evaluation fixed, we swap the backbone between an open diffusion model and a comparable AR model. Across 100 Deep Research Bench tasks, the diffusion backbone is roughly 6 times faster end-to-end, driven by order-of-magnitude reductions in planning and writing. We further introduce dFast, a decomposition mode that reads intermediate denoising states and extracts subqueries before generation finishes, providing a 1.99 times median speedup for decomposition in isolation with no loss of report quality. On the benchmark's RACE rubric, dFast obtains the best overall score among the three configurations. Finally, in a public system-level leaderboard snapshot, an instance built on a stronger diffusion model ranks above several commercial systems. We release DiffResearch under an Apache-2.0 license.", 'score': 6, 'issue_id': 3450, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '7a646bfc30ba9c85', 'authors': ['Alan-Barsag Gazzaev', 'Alexey Gavrilov', 'Mikhail Mozikov', 'Sergey Muravyov'], 'affiliations': ['AXXX', 'ITMO University'], 'pdf_title_img': 'assets/pdf/title_img/2610.28909.jpg', 'data': {'categories': ['#open_source', '#diffusion', '#inference', '#benchmark', '#agents', '#architecture'], 'emoji': '⚡', 'ru': {'title': 'Диффузионные LLM ускоряют глубокое исследование в шесть раз без потери качества', 'desc': 'Статья представляет DiffResearch — открытый мультиагентный фреймворк для глубокого исследования, в котором диффузионная языковая модель (dLLM) заменяет привычную autoregressive LLM на всех этапах: планировании, сборе данных и написании отчёта. Авторы сравнивают обе архитектуры при одинаковых агентной схеме, поиске и промптах на 100 задачах Deep Research Bench и получают ускорение примерно в 6 раз за счёт значительного сокращения времени планирования и написания. Вводится режим dFast, который извлекает подзапросы из промежуточных состояний денойзинга ещё до завершения генерации, давая медианное ускорение декомпозиции в 1.99 раза без потери качества. По метрике RACE dFast показывает лучший общий результат среди трёх конфигураций, а система на более сильной диффузионной модели входит в публичный рейтинг выше нескольких коммерческих решений.'}, 'en': {'title': 'Revolutionizing Research with Diffusion Models', 'desc': 'DiffResearch introduces a novel approach to deep research systems by utilizing diffusion language models (dLLMs) instead of traditional autoregressive (AR) models. This shift significantly reduces latency and enhances the quality of generated reports through iterative planning and early subquery extraction. The framework demonstrates that dLLMs can achieve approximately six times faster end-to-end processing compared to AR models, while maintaining high report quality. Additionally, the dFast mode further optimizes performance by allowing for intermediate denoising states to be utilized, resulting in a notable speedup without sacrificing output quality.'}, 'zh': {'title': '用扩散模型提升深度研究效率', 'desc': 'DiffResearch 是一个多智能体深度研究框架，它用扩散语言模型替代了自回归模型，从而显著降低了延迟并提高了报告质量。该系统通过迭代规划、证据收集、综合和修订来进行深度研究，解决了交互使用中的延迟瓶颈。研究表明，使用扩散模型的系统在规划和写作方面的速度比自回归模型快约六倍。我们还引入了 dFast 模式，通过在生成完成之前提取子查询，进一步提高了速度，同时保持了报告质量。'}}}, {'id': 'https://huggingface.co/papers/2610.23344', 'title': 'Language Models Learn to Improve Language Models', 'url': 'https://huggingface.co/papers/2610.23344', 'abstract': 'Abstract LM2LM uses a frozen research world model to provide scalable reinforcement learning rewards for generating language model improvements, maintaining reliability through periodic real execution and outperforming larger baselines at lower cost.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) are increasingly used to automate AI research, including language-model (LM) development, offering a potential path toward recursive self-improvement. However, turning experimental feedback into a learned ability to propose effective improvements across models faces two challenges. First, training such an ability with real feedback is expensive: reinforcement learning (RL) requires evaluating tens of thousands of proposals, each potentially requiring a full model-training run. Even at ten GPU-hours per run, reward collection alone would consume hundreds of thousands of GPU-hours, motivating a cheaper surrogate. Second, surrogate feedback can become unreliable as policy optimization favors overestimated proposals when the proposal distribution shifts. To address these challenges, we propose LM2LM, which trains LLMs with RL to generate effective LM improvement proposals. To provide scalable feedback, we use a research world model (RWM), a frozen LLM that predicts proposal gains from real experimental records provided in context, as the reward model for RL. To maintain feedback reliability, we periodically execute current-policy proposals ranked highly by the RWM and add their measured outcomes to its context. Across eight autoregressive and diffusion LM development environments, real-execution evaluations on held-out tasks show that LM2LM enables Qwen3.8-27B to outperform GPT-6-sol, even when GPT-6-sol is given 300 real experimental records in context, while requiring 33% lower data-generation cost. LM2LM also generalizes to a model family unseen during training.', 'score': 5, 'issue_id': 3450, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': 'b83eac39e60a90a5', 'authors': ['Minhua Lin', 'Zijun Wang', 'Zewen Liu', 'Zhaotian Weng', 'Bing He', 'Zhan Shi', 'Benoit Dumoulin', 'Xiang Zhang', 'Suhang Wang', 'Hanqing Lu'], 'affiliations': ['Amazon', 'Emory University', 'The Pennsylvania State University', 'UC Santa Barbara', 'UC Santa Cruz'], 'pdf_title_img': 'assets/pdf/title_img/2610.23344.jpg', 'data': {'categories': ['#optimization', '#agi', '#science', '#benchmark', '#training', '#agents', '#rl', '#synthetic'], 'emoji': '🤖', 'ru': {'title': 'Языковые модели учатся улучшать сами себя, не тратя лишних GPU-часов', 'desc': 'В статье предлагается метод LM2LM, который обучает большие языковые модели (LLM) с помощью reinforcement learning генерировать предложения по улучшению других языковых моделей. Чтобы не тратить огромные GPU-часы на реальные запуски обучения, в качестве функции награды используется замороженная research world model (RWM), которая предсказывает эффект предложения по уже накопленным экспериментальным записям. Для сохранения надёжности оценок периодически запускаются реально предложенные моделью и высоко оценённые RWM варианты, а их результаты добавляются в контекст RWM. В экспериментах LM2LM позволяет меньшей модели Qwen3.8-27B превзойти GPT-6-sol при меньшей стоимости генерации данных и хорошо обобщается на неизвестное при обучении семейство моделей.'}, 'en': {'title': 'Efficient Language Model Improvement through Scalable Reinforcement Learning', 'desc': "The paper introduces LM2LM, a method that enhances language model (LM) development using reinforcement learning (RL) with a frozen research world model (RWM) for scalable reward generation. This approach addresses the high costs of traditional RL by utilizing the RWM to predict the effectiveness of LM improvement proposals based on past experimental data. To ensure the reliability of feedback, LM2LM periodically tests top-ranked proposals in real scenarios and incorporates their results back into the RWM's context. The results demonstrate that LM2LM can outperform larger models like GPT-6-sol while reducing data generation costs by 33%."}, 'zh': {'title': 'LM2LM：高效的语言模型改进方案', 'desc': 'LM2LM是一种利用冻结的研究世界模型来提供可扩展的强化学习奖励的方法，旨在生成语言模型的改进建议。该方法通过定期执行高排名的提案来保持反馈的可靠性，从而在成本更低的情况下超越更大的基线模型。LM2LM解决了在真实反馈下训练有效改进能力的高成本和代理反馈不可靠的问题。通过使用研究世界模型作为强化学习的奖励模型，LM2LM能够在多个语言模型开发环境中实现更好的性能。'}}}, {'id': 'https://huggingface.co/papers/2610.28679', 'title': 'VerifierBench: Benchmarking the Generation of Executable Verifiers for LLM Agents', 'url': 'https://huggingface.co/papers/2610.28679', 'abstract': "Abstract Agents generate executable verifiers to validate outputs, but these verifiers often wrongly reject valid solutions due to hidden assumptions, prompting recommendations to test acceptance of diverse correct answers.  Generated by thinkingmachines/Inkling-Small Agents need reliable ways to validate their outputs, both when completing tasks and when filtering synthetic training data. We study verifier generation: from the instruction and environment available for solving a task, an agent writes an executable verifier that must accept every valid solution and reject invalid ones. We introduce VerifierBench, a benchmark of 222 tasks from six agent benchmarks spanning tool-call, state-based, and code verification, with 4,993 hidden test cases that include alternative valid solutions and attacks; Verifier4Verifier (V4V), a six-check audit, screens its source verifiers and test suites. Across 19 models in a common agent harness, normalized balanced accuracy ranges from 10.6 to 62.1, with generated verifiers consistently rejecting invalid solutions more reliably than they accept valid ones. This apparent strength can mask overly restrictive verification: most false rejections in the analyzed records come from verifiers that accept no tested solution to a task. Case studies reveal unsupported assumptions about solution formats, tool use, and code changes that exclude valid solutions. These errors survive self-testing because agents test solutions that share the verifier's mistaken assumptions, or submit verifiers without confirming that any correct solution passes. These findings suggest testing both whether a verifier accepts a correct solution and whether it accepts other solutions permitted by the task. The project page and dataset are publicly available.", 'score': 4, 'issue_id': 3450, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': 'f491d30e24a46512', 'authors': ['Jianing Yin', 'Ziyi Chen', 'Hao Wang', 'Yiyou Sun', 'Zijian Jin', 'Dawn Song', 'Daoan Zhang'], 'affiliations': ['New York University', 'University of California, Berkeley', 'University of Illinois at Urbana-Champaign', 'University of Pennsylvania', 'University of Rochester'], 'pdf_title_img': 'assets/pdf/title_img/2610.28679.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#plp', '#agents', '#security', '#synthetic'], 'emoji': '🧪', 'ru': {'title': 'Верификатор должен принимать все правильные решения, а не только один эталон', 'desc': 'В статье исследуется генерация верификаторов, которые LLM-агенты пишут для проверки собственных решений задач. Авторы представляют VerifierBench, набор из 222 задач с 4993 скрытыми тест-кейсами, включающими альтернативные корректные решения и атаки. Анализ 19 моделей показывает, что сгенерированные верификаторы надёжнее отвергают неверные решения, чем принимают верные, и часто слишком строги из-за скрытых допущений о формате, инструментах и изменениях кода. Авторы предлагают тестировать не только принятие одного правильного решения, но и принятие всех допустимых альтернатив.'}, 'en': {'title': 'Enhancing Verifier Reliability in Agent Outputs', 'desc': 'This paper discusses the challenges faced by agents in generating reliable verifiers to validate their outputs. Often, these verifiers incorrectly reject valid solutions due to hidden assumptions, leading to a need for diverse testing of acceptable answers. The authors introduce VerifierBench, a benchmark that evaluates the performance of these verifiers across various tasks and identifies common pitfalls in their design. The findings highlight the importance of ensuring that verifiers not only accept correct solutions but also accommodate alternative valid solutions to improve their reliability.'}, 'zh': {'title': '提升验证器的准确性与可靠性', 'desc': '本文研究了代理生成可执行验证器以验证输出的过程，但这些验证器常常由于隐藏假设错误地拒绝有效解。我们提出了VerifierBench，这是一个包含222个任务的基准测试，旨在评估生成的验证器的有效性。研究发现，生成的验证器在拒绝无效解方面表现较好，但在接受有效解时却不够可靠。我们的研究表明，验证器需要同时测试是否接受正确解和任务允许的其他解，以提高验证的准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.30066', 'title': 'Looped Uniform Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.30066', 'abstract': 'Abstract Looping early Transformer layers improves training and inference efficiency of uniform diffusion language models without altering their objective or sampler.  Generated by thinkingmachines/Inkling-Small Uniform diffusion language models (UDLMs) generate text by iteratively denoising sequences of ordinary vocabulary tokens, any of which may be corrupted and subsequently revised. During training, UDLMs must denoise from a context that may itself be unreliable, whereas masked diffusion language models (MDLMs) always condition on a clean context. This challenging training objective makes UDLMs more FLOP-intensive to train than MDLMs, but it yields stronger downstream reasoning performance. Recently, selective looping, which recursively applies a few early Transformer layers within each denoising step, has been shown to improve training efficiency in MDLMs under an iso-FLOP budget. We investigate looping in UDLMs while keeping the training objective and sampler unchanged. We find that looping significantly improves training efficiency: looped UDLMs reach the validation NLL of a non-looped UDLM trained on about 0.5 trillion tokens with up to 2.8x fewer training FLOPs on OpenWebText and 3.3x fewer on FineWeb-Edu. We also find that, at a matched NFE budget, looped UDLMs reach up to 9.8% lower generation perplexity than the non-looped UDLM, with most gains achieved at moderate loop counts. Finally, we study different loop-count distributions and find that sampling smaller loop counts more frequently during training improves inference efficiency: on downstream tasks, this strategy uses 12% fewer loops than uniform loop-count sampling without degrading accuracy.', 'score': 4, 'issue_id': 3450, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '5dd416b559eb9588', 'authors': ['Saiteja Utpala', 'Chieh-Hsin Lai', 'Yuki Mitsufuji', 'Praneeth Vepakomma'], 'affiliations': ['MBZUAI', 'MIT', 'Sony Group Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2610.30066.jpg', 'data': {'categories': ['#diffusion', '#architecture', '#optimization', '#training'], 'emoji': '🔁', 'ru': {'title': 'Зацикливание ранних слоёв ускоряет диффузионные языковые модели без потери качества', 'desc': 'Авторы предлагают зацикливать несколько ранних слоёв Transformer внутри каждого шага денойзинга в uniform diffusion language models (UDLM), не меняя целевую функцию обучения и sampler. Такой подход позволяет достичь того же validation NLL, что и обычная модель, при использовании в 2.8–3.3 раза меньшего числа FLOPs на OpenWebText и FineWeb-Edu. При одинаковом бюджете NFE зацикленные модели дают до 9.8% более низкую generation perplexity. Выбор чаще меньших чисел циклов во время обучения дополнительно сокращает число циклов на инференсе примерно на 12% без потери точности на downstream-задачах.'}, 'en': {'title': 'Boosting Efficiency in Language Models with Selective Looping', 'desc': 'This paper explores the use of selective looping in Uniform Diffusion Language Models (UDLMs) to enhance their training and inference efficiency. By applying early Transformer layers multiple times during the denoising process, the authors demonstrate that UDLMs can achieve significant reductions in training FLOPs while maintaining their performance objectives. The study shows that looped UDLMs can reach validation metrics comparable to non-looped models with substantially fewer computational resources. Additionally, the research indicates that varying loop counts during training can lead to improved efficiency in downstream tasks without sacrificing accuracy.'}, 'zh': {'title': '循环机制提升扩散语言模型效率', 'desc': '这篇论文探讨了在均匀扩散语言模型（UDLMs）中循环早期Transformer层的效果，以提高训练和推理效率。UDLMs通过逐步去噪普通词汇标记生成文本，但在训练时面临不可靠上下文的挑战。研究发现，循环机制显著提高了训练效率，使得循环UDLMs在较少的计算量下达到更好的验证性能。最后，论文还提出了在训练中更频繁地采样较小循环次数的策略，以进一步提升推理效率。'}}}, {'id': 'https://huggingface.co/papers/2610.30113', 'title': 'Quant-Arena: Benchmarking LLM Agents for Quantitative Trading Research', 'url': 'https://huggingface.co/papers/2610.30113', 'abstract': 'Abstract Quant-Arena benchmarks end-to-end quantitative research by evaluating whether language models can build trading strategies on historical A-share data that remain profitable in a sealed future year.  Generated by thinkingmachines/Inkling-Small Quantitative research is an iterative loop: a researcher proposes a market hypothesis, implements it as an executable signal, tests it on historical data, and decides what to keep. Existing benchmarks score formulas, code, or individual trading decisions, leaving open whether large language models (LLMs) can complete this loop and produce strategies that work beyond the research period. We introduce Quant-Arena, a benchmark and public leaderboard for end-to-end quantitative research on real A-share market data. A model constructs features and stock-scoring code, receives feedback only on 2022--2023, and freezes one strategy for assessment on the sealed year 2024. A cash-account evaluator applies trading constraints and costs, including market impact estimated from a simulated order book. Scores are dominated by realized excess return and complemented by signal quality and the diversity of features used by the strategy. We evaluate nine frontier models, among which GPT-6 Astra scores highest; yet no model beats the equal-weight market in 2024. Quant-Arena is open to submissions from any model or agent harness.', 'score': 4, 'issue_id': 3449, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '4e8255cb4d6b7178', 'authors': ['Houde Qian', 'Zheng Jiang', 'Wenyi Li', 'Chenxi Xu', 'Xinjie Lin', 'Yuzhao Peng', 'Ruoyu Han', 'Youjie Zheng', 'Kaisen Yang', 'Qinhuai Na', 'You Fu', 'Calvin Xiao'], 'affiliations': ['Einsia.AI', 'Navers Lab'], 'pdf_title_img': 'assets/pdf/title_img/2610.30113.jpg', 'data': {'categories': ['#agents', '#benchmark', '#data'], 'emoji': '📈', 'ru': {'title': 'Могут ли LLM заработать на рынке в незнакомом году?', 'desc': 'Quant-Arena — это бенчмарк для оценки того, могут ли LLM самостоятельно проводить полный цикл количественных исследований: сформулировать рыночную гипотезу, реализовать её в виде торгового сигнала и проверить на исторических данных. Модели строят признаки и код для скоринга акций, получая обратную связь только по 2022–2023 годам, после чего «замороженная» стратегия тестируется на закрытом 2024 году. Оценка учитывает торговые ограничения, издержки и market impact, а итоговый балл определяется в первую очередь избыточной доходностью, дополняясь качеством сигнала и разнообразием использованных признаков. Результаты девяти передовых моделей показывают, что ни одна из них не обыграла рынок в виде equal-weight портфеля в 2024 году.'}, 'en': {'title': 'Quant-Arena: Testing Language Models for Profitable Trading Strategies', 'desc': 'Quant-Arena is a benchmark designed to test how well language models can create profitable trading strategies using historical A-share market data. It evaluates the entire quantitative research process, where a model generates trading signals, tests them on past data, and then assesses their performance on a future, unseen year. The benchmark measures success based on realized excess return, signal quality, and the diversity of features in the strategies. Despite testing nine advanced models, including GPT-6 Astra, none outperformed a simple equal-weight market strategy in 2024, highlighting the challenges in achieving consistent profitability in trading.'}, 'zh': {'title': '量化研究的新基准：Quant-Arena', 'desc': 'Quant-Arena 是一个用于评估语言模型在历史 A 股数据上构建可持续盈利交易策略的基准测试。研究者提出市场假设，并将其实现为可执行信号，经过历史数据测试后决定保留哪些策略。该基准测试评估模型在 2022-2023 年的表现，并在 2024 年对冻结的策略进行评估。最终得分主要基于实现的超额收益，同时考虑信号质量和策略使用的特征多样性。'}}}, {'id': 'https://huggingface.co/papers/2610.22659', 'title': 'Exploring The Empirical Privacy Landscape of Synthetic Data', 'url': 'https://huggingface.co/papers/2610.22659', 'abstract': 'Abstract Privacy-aware rewriting of synthetic medical records improves privacy protection with less capability loss than direct fine-tuning or DP-SGD, offering a favorable trade-off for sensitive data.  Generated by thinkingmachines/Inkling-Small Methods for training language models on sensitive data differ in how they balance capability gains against the risk of leaking private information. In this paper, we present a controlled comparison of data-level and training-level interventions for navigating the capability-privacy tradeoff on synthetic medical records with canaries to probe for leakage. Direct finetuning performs best on capability metrics but leads to the most privacy leakage, while DP-SGD reduces leakage at substantial cost to capabilities. Generating synthetic data from these records offers a more favorable balance, particularly when guided by a uniqueness-aware instruction to replace private details. Relative to naive paraphrasing, privacy-aware rewriting improves privacy protection across a variety of different rewriting models. We also find that more capable rewriting models generally reduce the risks of downstream privacy leakage, although held-out fit does not improve monotonically and increased test-time compute yields inconsistent gains. Overall, these results highlight privacy-aware rewriting as a promising direction for achieving a more favorable trade-off between capabilities and empirical privacy compared to other training-level methods, and our evaluation framework supports comparisons of future models and methods.', 'score': 3, 'issue_id': 3450, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': 'f398ceed0185d1c1', 'authors': ['Zihao Zhao', 'Avi Schwarzschild', 'Casey Meehan', 'Katherine Lee', 'Zhili Feng', 'Dylan Sam'], 'affiliations': ['Johns Hopkins University', 'OpenAI'], 'pdf_title_img': 'assets/pdf/title_img/2610.22659.jpg', 'data': {'categories': ['#data', '#leakage', '#benchmark', '#training', '#healthcare', '#ethics', '#security', '#synthetic'], 'emoji': '🔒', 'ru': {'title': 'Перефразируем медицинские данные, а не просто обучаем на них: приватность без потери качества', 'desc': 'В статье сравниваются методы обучения языковых моделей на чувствительных медицинских данных с точки зрения баланса между качеством (capability) и защитой приватности. Прямое дообучение (fine-tuning) даёт лучшие результаты, но сильнее всего приводит к утечкам, тогда как DP-SGD снижает утечки ценой заметной потери качества. Наиболее удачным компромиссом оказалась privacy-aware перефразировка синтетических медицинских записей, особенно с инструкцией заменять уникальные детали, и она превосходит наивный paraphrasing. Авторы также показывают, что более мощные LLM для перефразировки обычно снижают риски утечек, хотя на результат влияют и другие факторы, такие как вычисления на этапе инференса.'}, 'en': {'title': 'Balancing Privacy and Capability in Synthetic Medical Records', 'desc': 'This paper discusses a method for rewriting synthetic medical records to enhance privacy while maintaining performance. It compares different approaches to training language models on sensitive data, focusing on the balance between capability and privacy. The authors find that privacy-aware rewriting outperforms direct fine-tuning and DP-SGD in terms of privacy protection with less loss in capability. Their results suggest that using more advanced rewriting models can further reduce privacy risks, making this approach a promising solution for handling sensitive information.'}, 'zh': {'title': '隐私保护与能力平衡的新方法', 'desc': '本文探讨了在合成医疗记录中进行隐私保护重写的方法，旨在在保护隐私的同时减少能力损失。通过对数据级和训练级干预措施的比较，研究了能力与隐私之间的权衡。直接微调虽然在能力指标上表现最佳，但会导致最多的隐私泄露，而DP-SGD则在显著降低泄露的同时损失了能力。相较于简单的改写，隐私意识重写在多种改写模型中都能有效提高隐私保护。'}}}, {'id': 'https://huggingface.co/papers/2610.24771', 'title': 'Design Anything, Design at Scale', 'url': 'https://huggingface.co/papers/2610.24771', 'abstract': "Abstract Design Anything uses an intent-execution graph and task contracts to maintain design alignment across long projects, improving constraint satisfaction and deliverable completeness over baseline agents.  Generated by thinkingmachines/Inkling-Small As multimodal resources are transformed into media outputs, agentic AI is expected to stay aligned with design intent over long horizons. Designers follow briefs specifying goals, constraints, and deliverables, with later work building on earlier decisions. Recent work reuses design experience across tasks, yet alignment among artifacts within one project remains challenging. Agents therefore need to preserve and apply this intent across domains and as projects grow. We introduce Design Anything, a graph-based harness that preserves design intent outside the model and binds deliverables to the workflow steps that produce them through an intent-execution graph. A task contract retains constraints and decisions, selected designs become explicit inputs to later generations, and a deterministic controller uses bindings and execution records to check output types and counts, identify outstanding deliverables, and guide subsequent turns. We also introduce DesignAnything-Bench, with 228 tasks across 19 design domains, including 38 project families at scales of 6, 14, and 24 artifacts. With the LLM held fixed, Design Anything satisfies 85.0% and 92.5% of the brief's factual constraints with DeepSeek V4.1 Flash High and GPT-5.6 Sol High, respectively, exceeding the strongest same-model baselines by 15.4% and 14.4%. These gains reach 25.1% and 23.0% on 24-artifact tasks. Under each model, Design Anything leads or ties in constraint satisfaction in 18 of 19 domains. Professional designers also prefer its complete deliverable sets over those of same-model baselines in a blind evaluation.", 'score': 3, 'issue_id': 3449, 'pub_date': '2026-10-17', 'pub_date_card': {'ru': '17 октября', 'en': 'October 17', 'zh': '10月17日'}, 'hash': '5493fcbc3ffb8079', 'authors': ['Xuchao Ren', 'Siyuan Feng', 'Jing Huang', 'Yanhua Yao', 'Jing Wang', 'Lingyu Alina Wang', 'Anan Chen', 'Hangjie Yuan', 'Tao Feng', 'Qiong Wu', 'Sai Ma'], 'affiliations': ['Academy of Arts & Design, Tsinghua University', 'Beijing Institute of Fashion Technology', 'DAMO Academy, Alibaba Group', 'Senseable City Lab, Massachusetts Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.24771.jpg', 'data': {'categories': ['#agents', '#benchmark', '#dataset', '#alignment'], 'emoji': '🎨', 'ru': {'title': 'Дизайн-намерение не теряется: граф вместо памяти модели', 'desc': 'В статье представлен Design Anything — graph-based фреймворк для агентных AI-систем, который сохраняет design intent вне самой LLM через intent-execution graph и task contracts. Детерминированный контроллер проверяет типы и количество результатов, отслеживает незавершённые deliverables и направляет дальнейшие шаги генерации. Авторы также предлагают бенчмарк DesignAnything-Bench из 228 задач в 19 доменах дизайна с проектами от 6 до 24 артефактов. Эксперименты показывают, что при фиксированной модели метод выполняет больше фактических ограничений брифа (до 92.5%) и лидирует по constraint satisfaction в 18 из 19 доменов, а профессиональные дизайнеры в слепой оценке предпочитают его полные наборы результатов.'}, 'en': {'title': 'Aligning Design Intent Across Projects with AI', 'desc': 'The paper presents Design Anything, a novel framework that utilizes an intent-execution graph and task contracts to enhance design alignment in long-term projects. This approach ensures that design intent is preserved and applied consistently across various tasks and domains, addressing challenges in maintaining coherence among project artifacts. By binding deliverables to specific workflow steps, Design Anything improves constraint satisfaction and the completeness of outputs compared to baseline agents. The framework demonstrates significant performance improvements in meeting design briefs, as evidenced by evaluations across multiple design domains and tasks.'}, 'zh': {'title': '保持设计意图的一致性', 'desc': '本文介绍了Design Anything，一个基于图的框架，用于在长期项目中保持设计意图的一致性。它通过意图执行图和任务合同来提高约束满足度和交付物的完整性。设计师遵循目标、约束和交付物的简要说明，后续工作基于早期决策进行。Design Anything在多个设计领域中表现出色，显著超越了同类模型的基线，获得了专业设计师的青睐。'}}}, {'id': 'https://huggingface.co/papers/2610.27861', 'title': 'RoboCasa-Shift: Stage-Aware Robustness Evaluation of Vision-Language-Action Policies in Long-Horizon Household Manipulation', 'url': 'https://huggingface.co/papers/2610.27861', 'abstract': 'Abstract RoboCasa-Shift evaluates vision-language-action robustness through paired rollouts and stage-aware diagnostics, revealing that failure patterns vary by shift factor and task rather than degrading uniformly.  Generated by thinkingmachines/Inkling-Small Vision-language-action (VLA) robustness is commonly summarized by aggregate task success, which obscures how individual executions change under distribution shifts and where failures emerge in long-horizon tasks. We introduce RoboCasa-Shift, a diagnostic robustness benchmark built on RoboCasa365 that combines controlled single-factor shifts, matched clean-perturbed rollouts in which each pair shares the same underlying settings and differs only in the target shift, and simulator-grounded stage-aware diagnostics. We evaluate GR00T N1.5 on four long-horizon tasks that pass a predefined clean-performance gate under four perturbation factors and three calibrated severity levels, including conditions that drive the evaluated policy to complete task failure, totaling 1,040 formal rollouts. Robustness responses vary substantially across factors and tasks, and increasing severity does not always produce monotonic degradation. For example, one camera condition yields ΔSR=0 despite 8 of 80 matched episodes changing outcome. Stage-aware analysis further shows that the same end-to-end degradation can correspond to different execution-depth profiles. Camera L_2 and Gaussian blur L_1 both yield ΔSR=0.188, yet their first-stage failure rates are 19.0\\% and 36.4\\%, respectively. Our findings suggest that VLA robustness should be viewed as a multi-dimensional property of execution rather than a single end-to-end performance measure, motivating evaluation protocols that jointly capture outcome degradation, paired outcome sensitivity, and failure progression. The code is publicly available at https://github.com/HaochengWang23/RoboCasa-Shift.', 'score': 2, 'issue_id': 3450, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '06e90a8aa42cd535', 'authors': ['Haocheng Wang', 'Youquan Liu', 'Weiyu Guo', 'Aokai Zhang', 'Donghang Wu', 'Hongyu Liu', 'Sha Zhang', 'Weidong Yang', 'Ben Fei'], 'affiliations': ['1 Affiliation 1 (not specified in text)', '2 Affiliation 2 (not specified in text)', '3 Affiliation 3 (not specified in text)', '4 Affiliation 4 (not specified in text)', '5 Affiliation 5 (not specified in text)'], 'pdf_title_img': 'assets/pdf/title_img/2610.27861.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#benchmark', '#robotics', '#cv', '#security'], 'emoji': '🤖', 'ru': {'title': 'Устойчивость робота — это не одна цифра, а многомерное свойство исполнения', 'desc': 'Авторы представляют RoboCasa-Shift — диагностический бенчмарк для оценки устойчивости VLA-моделей (vision-language-action) к сдвигам распределения в длинных задачах манипуляции. Бенчмарк сочетает контролируемые одиночные сдвиги, парные прогоны с одинаковыми условиями (clean и perturbed) и поэтапную диагностику на основе симулятора. Оценка модели GR00T N1.5 на 1040 прогонах показала, что деградация зависит от фактора сдвига и задачи, а не растёт монотонно с силой возмущения. Вывод: робастность VLA следует рассматривать как многомерное свойство исполнения, а не как одну агрегированную метрику успеха.'}, 'en': {'title': 'RoboCasa-Shift: Unpacking VLA Robustness Beyond Simple Metrics', 'desc': 'The paper introduces RoboCasa-Shift, a benchmark designed to evaluate the robustness of vision-language-action (VLA) systems under various distribution shifts. It highlights that failure patterns in these systems are influenced by specific task characteristics and the nature of the shift, rather than being uniform across all scenarios. The study employs controlled experiments with matched rollouts to analyze how different perturbations affect task performance, revealing that robustness is a complex, multi-dimensional property. The findings emphasize the need for more nuanced evaluation methods that consider both overall performance and the specific conditions leading to failures.'}, 'zh': {'title': '多维度评估视觉-语言-行动鲁棒性', 'desc': 'RoboCasa-Shift 是一个评估视觉-语言-行动（VLA）鲁棒性的基准，旨在通过配对的实验和阶段感知诊断来揭示不同任务和变化因素下的失败模式。研究表明，VLA 鲁棒性通常通过整体任务成功率来总结，但这掩盖了在分布变化下个体执行的变化及长期任务中的失败位置。我们在四个长期任务上评估了 GR00T N1.5，发现鲁棒性响应在不同因素和任务之间差异显著，且增加的严重性并不总是导致单调的性能下降。我们的研究建议将 VLA 鲁棒性视为执行的多维特性，而非单一的端到端性能指标，推动了评估协议的发展，以共同捕捉结果退化、配对结果敏感性和失败进程。'}}}, {'id': 'https://huggingface.co/papers/2610.29932', 'title': 'FrontierCS 2: A Benchmark for Computer Science R&D', 'url': 'https://huggingface.co/papers/2610.29932', 'abstract': "Abstract FrontierCS 2 evaluates LLM agents on open-ended computer science R&D tasks using hidden evaluation suites and reveals that even the best agents pass only about half of tasks.  Generated by thinkingmachines/Inkling-Small Can LLM agents make contributions to frontier computer science R&D? We introduce FrontierCS 2, a benchmark of 48 open-ended tasks. We take a paper and the code its authors released and delete the paper's contribution. The deleted code becomes the human reference that sets the bar. Earlier open-ended benchmarks give each agent a problem statement and grade one program after the run. FrontierCS 2 places the agent inside a research environment. The agent inherits a working repository and may submit a patch at any point. For each patch, a judge returns a development-suite score but keeps the evaluator, the held-out final suite and the reference private, and grades the final submission on that suite against the reference. The tasks span 13 domains, from machine-learning systems and high-performance computing to databases, security and robotics. Beyond these 48 tasks, FrontierCS 2 keeps a private set of more than 100 tasks, to be announced in the future. We evaluate 12 agents. The best one is Claude Opus 5.5, passing 58% of its runs. No run passes on 16 tasks. A higher score is not the same as a pass: most runs that beat the reference on the combined final score still fall short on some metric or workload. On a shared capability scale for agents and tasks, the median task is roughly as difficult as what the strongest agent can handle.", 'score': 1, 'issue_id': 3450, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'b56218c6bc677677', 'pdf_title_img': 'assets/pdf/title_img/2610.29932.jpg', 'data': {'categories': ['#optimization', '#agi', '#science', '#benchmark', '#plp', '#agents', '#security'], 'emoji': '🤖', 'ru': {'title': 'ИИ-агенты пока решают лишь половину сложных задач исследований в компьютерных науках', 'desc': 'Статья представляет FrontierCS 2 — бенчмарк из 48 открытых задач в области компьютерных наук, где LLM-агенты работают внутри исследовательской среды с готовым репозиторием и могут предлагать патчи. Эталоном служит удалённый из кода вклад авторов оригинальной статьи, а итоговая оценка проводится на закрытом наборе тестов, недоступном агенту. Задачи охватывают 13 направлений, от систем машинного обучения и HPC до баз данных, безопасности и робототехники. Лучший агент (Claude Opus 5.5) проходит лишь 58% запусков, а многие решения, превосходящие эталон по совокупной метрике, всё же уступают по отдельным показателям.'}, 'en': {'title': 'Evaluating LLM Agents in Real-World Computer Science Challenges', 'desc': 'FrontierCS 2 is a benchmark designed to assess large language model (LLM) agents on complex computer science research and development tasks. It consists of 48 open-ended tasks where agents must contribute to existing codebases, simulating a real research environment. The evaluation process involves hidden scores and private references, ensuring that agents are tested rigorously against human-created benchmarks. Despite the challenges, the best-performing agent, Claude Opus 5.5, only succeeded in passing 58% of the tasks, highlighting the limitations of current LLM capabilities in advanced R&D.'}, 'zh': {'title': '评估LLM代理在计算机科学研发中的能力', 'desc': 'FrontierCS 2 是一个评估大型语言模型（LLM）代理在开放式计算机科学研发任务中的表现的基准。该基准包含48个任务，旨在测试这些代理在真实研究环境中的能力。尽管表现最好的代理Claude Opus 5.5仅通过了58%的任务，但仍有16个任务没有任何代理通过。这个研究表明，尽管LLM代理在某些方面表现良好，但在复杂的计算机科学问题上仍然存在显著的挑战。'}}}];
