    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.15777', 'title': 'SO-Arena: Benchmarking the Capability Spectrum and Reliability of System One Models', 'url': 'https://huggingface.co/papers/2611.15777', 'abstract': 'Abstract SO-Arena evaluates System One models across domains and capability families, revealing that scaling and reasoning gains vary and that high overall accuracy does not ensure reliable decision-making.  Generated by deepseek-ai/DeepSeek-V4.1-Flash System One models promise fast, general-purpose decision-making without lengthy token generation. However, understanding their capability spectrum and decision reliability requires more than aggregate performance on current benchmarks. Existing evaluations often provide limited insight into the breadth of model capabilities and the reliability of their decisions. We introduce SO-Arena, a benchmark characterizing the capability spectrum and decision reliability of System One models across 11 domains and five capability families. For the capability spectrum, SO-Arena offers evidence-grounded evaluation through reliable sources and manual verification of reference labels against model-visible inputs; fine-grained capability assessment through domain-specific difficulty criteria; and realistic interactive evaluation, where models iteratively execute actions in sandboxes. Reasoning-intensive tasks further enable system one-two comparison. Beyond accuracy, SO-Arena assesses decision reliability through two complementary measures: decision stability under controlled option-set changes and missing-answer recognition when no valid option is available. Evaluations across 21 models reveal that the benefits of scaling and additional reasoning vary substantially across domains. More importantly, strong overall performance does not necessarily imply reliable decision-making: the best-performing System One model ranks only seventh in reliability. Together, these findings highlight the need to characterize capability spectrum and decision reliability as complementary dimensions, providing a systematic view of the strengths and limitations of System One models.', 'score': 74, 'issue_id': 3528, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'cf20d9a1a952a373', 'authors': ['Lichen Li', 'Ziping Dong', 'Sicheng Feng', 'Qi Li', 'Xinchao Wang'], 'affiliations': ['National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.15777.jpg', 'data': {'categories': ['#interpretability', '#survey', '#reasoning', '#data', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Высокая точность не означает надёжность: оценивайте System One модели по-новому', 'desc': 'Статья представляет SO-Arena — бенчмарк для оценки System One моделей (быстрых LLM без длинной генерации токенов) в 11 доменах и пяти семействах способностей. Помимо точности, авторы измеряют надёжность решений: устойчивость ответов при изменении набора вариантов и распознавание ситуации, когда правильного ответа нет. Оценка 21 модели показала, что выгода от масштабирования и reasoning сильно различается по доменам. Главный вывод: высокая общая точность не гарантирует надёжность, и лучшая модель по точности занимает лишь седьмое место по надёжности.'}, 'en': {'title': 'Measure What Models Know—and Whether Their Decisions Can Be Trusted', 'desc': 'SO-Arena is a benchmark for evaluating System One models across 11 domains and five capability families. It tests model capabilities using verified reference answers, domain-specific difficulty levels, and interactive tasks, including tasks that compare System One and System Two reasoning. It also measures decision reliability by checking whether answers stay stable when options change and whether models recognize when no valid answer exists. Results from 21 models show that scaling and extra reasoning help unevenly across domains, and high accuracy does not guarantee reliable decisions.'}, 'zh': {'title': '不止看准确率：全面评估模型能力与决策可靠性', 'desc': '本文提出 SO-Arena，用于评估 System One 模型在 11 个领域和五类能力上的表现与决策可靠性。基准通过可靠来源和人工核验参考标签、按领域细分难度，以及在沙盒中进行交互式任务，提供更全面的能力评估。它还衡量模型在选项集合变化时的决策稳定性，以及在没有正确选项时识别并拒答的能力。对 21 个模型的评测显示，扩展模型规模和增加推理带来的收益因领域而异，而且总体准确率高并不代表决策可靠。'}}}, {'id': 'https://huggingface.co/papers/2611.14815', 'title': 'BirdDreams: Joint Perspective and BEV Video Generation for a Plausible, Reactive Driving World Model', 'url': 'https://huggingface.co/papers/2611.14815', 'abstract': "Abstract  Driving world models aim to simulate how a scene unfolds under different ego actions. This requires plausible motion of surrounding vehicles as well as precise ego-trajectory control. Learning vehicle motion from perspective video alone is challenging because motion is entangled with appearance and vehicles can be occluded. Prior work therefore conditions video generation on layouts that specify vehicle motion, providing control over surrounding vehicles but requiring their future trajectories as inputs. We introduce BirdDreams, an autoregressive driving world model that jointly generates perspective video and a schematic bird's-eye-view (BEV) video, making scene layout part of the predicted future. The BEV, rendered from scene annotations for training, depicts roads and vehicles as simple shapes at a fixed metric scale, providing a top-down view of their positions and motion with reduced occlusion between vehicles. Perspective video, by contrast, retains scene details that the BEV omits, such as traffic signals and object appearance. Joint attention between two video diffusion transformers, one per stream, lets each stream inform the other during generation. The predicted BEV also provides a geometric interface for ego control: we translate and rotate its latest frame along an input ego trajectory and use the resulting frames as a soft condition that shows how the scene would appear to move if only the ego vehicle moved. At inference, BirdDreams generates both videos from a single camera image without requiring an HD map or vehicle-state inputs. On PhysicalAI-AV and nuScenes, BirdDreams follows input ego trajectories more faithfully than prior driving world models and generates more plausible ego motion without ego-action conditioning. Human evaluation shows that BirdDreams outperforms a perspective-only baseline in generating realistic surrounding-vehicle behavior.", 'score': 46, 'issue_id': 3528, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': '1d376866ff5c7346', 'authors': ['Junyoung Seo', 'Jaewoo Seo', 'Seungryong Kim', 'Laura Leal-Taixé', 'Xiuming Zhang', 'Seung Wook Kim'], 'affiliations': ['KAIST', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2611.14815.jpg', 'data': {'categories': ['#multimodal', '#3d', '#architecture', '#video', '#diffusion'], 'emoji': '🚗', 'ru': {'title': 'Видим дорогу сверху и спереди: мир вождения, который предсказывает себя сам', 'desc': 'Статья представляет BirdDreams — авторегрессионную модель мира для вождения, которая совместно генерирует перспективное видео и схематичное видео вида сверху (BEV) с помощью двух video diffusion transformers с joint attention. BEV-поток задаёт геометрический интерфейс для управления эго-траекторией: последний кадр BEV сдвигается и поворачивается по заданной траектории, что служит мягким условием генерации. Модель работает только по одному изображению с камеры, без HD-карт и состояния автомобиля. На PhysicalAI-AV и nuScenes она точнее следует заданным траекториям и правдоподобнее моделирует поведение окружающих машин, чем предыдущие подходы.'}, 'en': {'title': 'See the road from above to drive the future more faithfully', 'desc': 'BirdDreams is an autoregressive driving world model that jointly generates a camera-view video and a bird’s-eye-view (BEV) video. The BEV represents roads and vehicles at a fixed scale, making their positions and motion easier to predict despite occlusion, while the camera view captures visual details such as traffic signals. Two video diffusion transformers use joint attention so that each view can inform the other, and the BEV also provides a soft condition for controlling the ego vehicle’s trajectory. On PhysicalAI-AV and nuScenes, BirdDreams follows requested trajectories more accurately and produces more plausible vehicle behavior than the compared models, without requiring an HD map or vehicle-state inputs.'}, 'zh': {'title': '双视角协同生成，让驾驶世界模型更懂场景与轨迹', 'desc': 'BirdDreams 是一种自回归驾驶世界模型，能够同时生成透视视频和鸟瞰图（BEV）视频，让场景布局也成为模型预测的一部分。BEV以固定的真实尺度显示道路和车辆的位置与运动，较少受到车辆遮挡的影响；透视视频则保留交通灯和物体外观等细节。模型使用两个视频扩散 Transformer，并通过联合注意力让两种视角在生成过程中相互提供信息；它还会根据输入的自车轨迹变换最新的BEV画面，作为软条件来引导自车运动。实验表明，BirdDreams无需高清地图或车辆状态输入，就能更准确地跟随指定轨迹，并生成更合理的自车运动和周围车辆行为。'}}}, {'id': 'https://huggingface.co/papers/2611.16748', 'title': "PhysLoop: Harnessing LLMs' Physics Awareness for Self-Improving Video Generation Models", 'url': 'https://huggingface.co/papers/2611.16748', 'abstract': 'Abstract PhysLoop leverages large language models to guide video generation, selection, and correction, enabling physically consistent self-improvement and controllable data construction for video models.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Video generation models produce visually realistic videos but still struggle with physical dynamics and causal consistency. Learning from generated videos requires fine-grained physical supervision, yet reliable quality judgments, correction pairs, and controlled variations are difficult to obtain. Large language models (LLMs) possess physical knowledge, but struggle to reliably guide video generation models in producing their training videos. We present PhysLoop, a unified harness designed to support physically grounded self-improvement in video generation models. The harness guides and constrains LLMs throughout video generation, selection, and correction, distilling their physical knowledge into physically consistent videos. The framework supports controllable training-data construction and inference-time video repair. By identifying and correcting failures, PhysLoop marks a key milestone toward recursive self-improvement (RSI) in video generation models with limited human intervention. We release 100K videos spanning diverse, realistic indoor and outdoor scenes, along with generation tools and two evaluation datasets: PhysLoop-Gen and PhysLoop-Repair. We evaluate controllable generation and localized repair on these datasets, respectively, and assess physical behavior on the external Physics-IQ Verified benchmark.', 'score': 42, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '1202ffc3feb68530', 'authors': ['Yuxuan Chen', 'Xiaojie Li', 'Hao Chen', 'Juncheng Ma', 'Kewei Zhang', 'Zhongjing Du', 'Guoqiang Wei', 'Fangfang Wang', 'Zhen Dong', 'Zhiyang Dou', 'Liming Zhao', 'Yan Zeng', 'Jianwei Zhang', 'Daquan Zhou'], 'affiliations': ['ByteDance Seed', 'Hangzhou Normal University', 'Massachusetts Institute of Technology', 'Peking University', 'University of California, Santa Barbara', 'Universität Hamburg'], 'pdf_title_img': 'assets/pdf/title_img/2611.16748.jpg', 'data': {'categories': ['#synthetic', '#agi', '#training', '#video', '#data', '#benchmark', '#dataset', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Физически правдивые видео: LLM учит модели генерации видео законам физики', 'desc': 'Статья представляет PhysLoop — унифицированный фреймворк, который использует LLM для направления генерации, отбора и исправления видео в моделях генерации видео. Фреймворк переносит физические знания LLM в процесс создания обучающих данных, помогая получать физически согласованные ролики. Система также поддерживает контролируемое построение датасетов и восстановление видео на этапе инференса, выявляя и исправляя ошибки. Авторы выпустили 100K видео, инструменты генерации и два оценочных датасета, а результаты проверены на бенчмарке Physics-IQ Verified.'}, 'en': {'title': 'Make Video Models Learn from Their Own Physical Mistakes', 'desc': 'PhysLoop uses large language models (LLMs) to guide video generation, select good results, and correct physical errors. This helps video models produce clips with more consistent physical dynamics and cause-and-effect relationships. The framework also builds controllable training data and can repair videos during inference. The authors release 100,000 videos and evaluation datasets, and test the approach on video generation, repair, and physical reasoning benchmarks.'}, 'zh': {'title': '让视频生成懂物理：生成、筛选、修正，循环进步', 'desc': '视频生成模型虽然能生成逼真的画面，但常常无法准确表现物理运动和因果关系。PhysLoop 用大语言模型指导视频的生成、筛选与修正，把模型的物理知识转化为物理规律更一致的视频。它还支持按需构建训练数据，并在推理时修复视频中局部的物理错误。研究者发布了 10 万段视频、生成工具和评测数据集，用于评估可控生成、局部修复及物理行为。'}}}, {'id': 'https://huggingface.co/papers/2611.13004', 'title': 'G-STAR: Group-Scaled Token Capacity for Deeply Compressed Autoregressive Generation', 'url': 'https://huggingface.co/papers/2611.13004', 'abstract': 'Abstract  Discrete autoregressive models offer a scalable framework for image generation. However, they face a fundamental trade-off: long token sequences preserve representation quality but slow generation, while aggressive spatial compression reduces representation capacity. Based on product quantization, we show that, under a fixed nominal information budget, group size should scale quadratically with the per-axis spatial compression factor. Building on this principle, we propose GSTAR, a spatial--group co-scaling framework that enables \\(32\\times\\) and even effective \\(64\\times\\) compression while preserving strong reconstruction, understanding, and generation performance. Since larger groups introduce intra-group dependencies that must be modeled efficiently, we analyze their impact on inference latency and generation quality and introduce a semi-autoregressive decoder that combines parallel feature computation with lightweight causal modeling. With these designs, our highly compressed models perform competitively with leading models across five representative text-to-image benchmarks (GenEval, DPG-Bench, PRISM, LongText-Bench, and Qwen-Image-Bench). At \\(1024\\times1024\\) resolution, our model delivers a \\(20\\times\\) speedup over prior discrete autoregressive models, generating each image in 2.5 seconds on a single NVIDIA H200. Together, these results show that highly compressed discrete representations can enable high-quality autoregressive generation at low latency.', 'score': 40, 'issue_id': 3528, 'pub_date': '2026-11-08', 'pub_date_card': {'ru': '8 ноября', 'en': 'November 8', 'zh': '11月8日'}, 'hash': 'da0fdd01e67f6541', 'authors': ['Xu Huang', 'Ye Huang', 'Xiaotong Li', 'Zhengrong Yue', 'Jialv Zou', 'Minhao Jing', 'Haodong Li', 'Wenhao Yan', 'Yaxin Luo', 'Duomin Wang', 'Daquan Zhou'], 'affiliations': ['Huazhong University of Science and Technology', 'MBZUAI', 'Meituan Longcat', 'Peking University', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.13004.jpg', 'data': {'categories': ['#inference', '#multimodal', '#architecture', '#cv', '#benchmark'], 'emoji': '🚀', 'ru': {'title': 'Сильное сжатие — быстрая и качественная генерация изображений', 'desc': 'В статье предлагается GSTAR — фреймворк для дискретных авторегрессионных моделей генерации изображений, основанный на product quantization. Авторы показывают, что при фиксированном информационном бюджете размер группы должен масштабироваться квадратично по коэффициенту пространственного сжатия, что позволяет достичь сжатия 32× и 64×. Для моделирования внутригрупповых зависимостей вводится полуавторегрессионный декодер, сочетающий параллельное вычисление признаков с лёгким каузальным моделированием. Модель конкурирует с ведущими LLM и AI-моделями на пяти text-to-image бенчмарках и генерирует изображение 1024×1024 за 2.5 секунды на NVIDIA H200, что в 20 раз быстрее прежних дискретных авторегрессионных моделей.'}, 'en': {'title': 'Compress More, Generate Faster', 'desc': 'The paper introduces GSTAR, a discrete autoregressive image-generation framework that jointly scales spatial compression and product-quantization group size. This design enables strong image reconstruction, understanding, and generation even when representations are compressed by 32× or effectively 64×. To handle dependencies among tokens within larger groups, GSTAR uses a semi-autoregressive decoder that computes features in parallel while modeling dependencies with a lightweight causal process. On five text-to-image benchmarks, it performs competitively with leading models and generates 1024×1024 images in 2.5 seconds on one NVIDIA H200, a 20× speedup over earlier discrete autoregressive models.'}, 'zh': {'title': '空间压缩与分组协同，让高质量自回归图像生成更快', 'desc': '离散自回归模型可以逐步生成图像，但生成速度与图像表示能力之间存在取舍：序列太长会变慢，空间压缩太强则可能损失信息。本文基于乘积量化提出 GSTAR，指出在名义信息预算固定时，分组大小应随每个空间维度的压缩倍数的平方增长，并据此联合调整空间压缩与分组。针对大分组带来的组内依赖，作者设计半自回归解码器，将并行特征计算与轻量因果建模结合，在保持重建、理解和生成质量的同时提高推理效率。实验显示，模型在五个文生图基准上表现有竞争力，并能以单张 NVIDIA H200 在 2.5 秒内生成 1024×1024 图像，速度比此前离散自回归模型快 20 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.15131', 'title': 'Duo: A Reciprocal World Model for Full-Duplex Interaction', 'url': 'https://huggingface.co/papers/2611.15131', 'abstract': 'Abstract A reciprocal world model enables real-time full-duplex audiovisual interaction by jointly modeling intent and realization using autoregressive reasoning, synchronized attention, and dual rollout distillation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash In this report, we introduce the Reciprocal World Model (RWM) and present Duo v1, a full-duplex world model that continuously perceives audiovisual inputs while responding to users in real time. The RWM treats intelligence and physical reality as equally fundamental to what constitutes a world. Existing world models largely focus on simulating the latter, leaving reasoning and decision-making as external controls rather than intrinsic parts of the world itself. In RWM, we identify two equally fundamental capabilities: Intent, which provides the cognition underlying world interactions, and Realization, which generates coherent audio-visual behavior. To realize this formulation, Duo v1 introduces three key technical designs: (1) Leveraging autoregressive modeling for continuous interaction reasoning and participation decisions, rather than restricting it to instruction understanding for diffusion models. (2) Constructing chunk-specific conditions and synchronize tokens across Intent and Realization on a unified timeline. Module-specific attention masks enforce causal dependencies both within and across chunks, preventing access to future inputs. (3) Mitigating distribution shift in both modules through dual rollout distillation, training on autoregressively generated Intent tokens and synthesized audiovisual histories from Realization. Both modules continuously perceive real-time audio, video, and text, enabling full-duplex interaction with spontaneous conversations and interruptions. Beyond conversation, users can share real objects, reshape virtual scenes, guide assistants, or play audiovisual games without mouse or keyboard controls. The release of Duo v1 makes our first step, with the next version coming soon. We look forward to broader exploration of this emerging field.', 'score': 36, 'issue_id': 3528, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': '493a17f20b6b643f', 'authors': ['Hengyuan Cao', 'Biao Gong', 'Guoshan Lu', 'Qiyuan Zhang', 'Lin Liu', 'Yiding Tian', 'Yilei Jiang', 'Yuxin Ma', 'Chengzhang Wu', 'Kun Chen', 'Yiqian Xie', 'Ting Liu', 'Xin Zheng', 'Xijun Gu', 'Tianren Ma', 'Jiancheng Pan', 'Chi Zhang', 'Xuzhe Zheng', 'Siyi Li', 'Zhenzhong Lan'], 'affiliations': ['Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2611.15131.jpg', 'data': {'categories': ['#audio', '#agents', '#multimodal', '#interpretability', '#architecture', '#agi', '#video', '#training', '#games'], 'emoji': '🎭', 'ru': {'title': 'Модель мира, которая не только видит и слышит, но и сама решает, когда и как ответить', 'desc': 'Статья представляет Reciprocal World Model (RWM) и систему Duo v1 — full-duplex модель мира, которая непрерывно воспринимает аудио- и видеовход и отвечает пользователю в реальном времени. Авторы разделяют две равноправные способности: Intent (намерение, отвечающее за рассуждение и решения о участии через autoregressive моделирование) и Realization (генерация согласованного аудиовизуального поведения). Для синхронизации используются chunk-специфичные условия, общий timeline с synchronized tokens и module-specific attention masks, обеспечивающие причинность без доступа к будущим входам. Для борьбы со distribution shift применяется dual rollout distillation, которая обучает модули на собственных сгенерированных токенах и аудиовизуальных историях.'}, 'en': {'title': 'One model thinks, listens, and responds in real time', 'desc': 'The Reciprocal World Model (RWM) treats reasoning about what to do (Intent) and generating what happens (Realization) as equally important parts of a world model. Duo v1 uses autoregressive modeling so it can continually reason about interactions and decide when to respond. Synchronized tokens, chunk-specific conditions, and causal attention masks keep its reasoning and audiovisual outputs aligned without letting it use future information. Dual rollout distillation trains both modules on generated histories, helping the model handle real-time, full-duplex interaction, including interruptions.'}, 'zh': {'title': '让意图与行动同步，开启实时全双工交互', 'desc': '本文提出互惠世界模型（RWM），让模型把意图推理与现实中的行为生成视为同等重要的部分。其系统 Duo v1 持续接收音频、视频和文本，并能在用户说话时同步回应，实现实时全双工交互。模型通过自回归建模推理交互意图，并用统一时间线、同步标记和因果注意力机制协调意图与音视频生成，避免利用未来信息。双重 rollout 蒸馏则让训练过程贴近模型实际生成的意图和音视频历史，从而减少分布偏移。'}}}, {'id': 'https://huggingface.co/papers/2611.15844', 'title': 'Open Vision Banana: A Fully Open Recipe for Generative Visual Perception', 'url': 'https://huggingface.co/papers/2611.15844', 'abstract': "Abstract  Recent work suggests that pretrained image generators encode real-world understanding beyond image synthesis. Vision Banana exploits this by framing vision tasks as conditional image editing. However, its data, weights, code, and implementation details are not public. We present Open Vision Banana (OVB), a fully open and reproducible recipe for converting pretrained generators into unified multi-task perception systems. Our analyses identify the design choices that matter most for generalization, including color encoding, prompt design, parameter adaptation, and task balancing. These choices interact, so individually helpful choices can hurt when combined with others. Starting from 4B and 9B parameter open-weight base models and using 2.1M-3.8M training pairs from public datasets, OVB surpasses Vision Banana's reported Cityscapes zero-shot performance (73.9 vs. 69.9 mIoU) and rivals state-of-the-art affine-invariant depth estimators. Its non-zero-shot variants come within five points of Vision Banana on referring and reasoning segmentation but remain further behind on instance segmentation. All models largely retain the base model's image-editing abilities. With legend ensembling, we introduce a test-time scaling method for generator-based perception. It segments an image under several class-color legends and fuses the results by majority vote, correcting unstable color-class bindings and improving mIoU by up to 8.7 points on Cityscapes and 15.0 points on COCO-Object without retraining. We release the dataset construction and processing pipeline, the training and evaluation code, as well as the final, intermediate, and ablation checkpoints. Project website: https://openvisionbanana.github.io", 'score': 29, 'issue_id': 3529, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'd256bad2285eddeb', 'authors': ['Arpit Jadon', 'Valentinos Pariza', 'Jona Ruthardt', 'Ryousuke Yamada', 'A. Sophia Koepke', 'Andrei Bursuc', 'Yuki M. Asano'], 'affiliations': ['AIST', 'DLR', 'MCML', 'TUM', 'Tübingen AI Center', 'University of Technology Nuremberg', 'University of Tübingen', 'valeo.ai'], 'pdf_title_img': 'assets/pdf/title_img/2611.15844.jpg', 'data': {'categories': ['#benchmark', '#diffusion', '#training', '#data', '#optimization', '#open_source', '#multimodal', '#dataset', '#cv'], 'emoji': '🎨', 'ru': {'title': 'Генератор изображений становится универсальным детектором без переобучения', 'desc': 'Авторы представляют Open Vision Banana (OVB) — полностью открытый и воспроизводимый метод превращения предобученных генеративных моделей изображений в универсальную систему для множества задач компьютерного зрения. Задачи формулируются как условное редактирование изображений, а анализ выявляет ключевые решения: кодирование цветов, дизайн промптов, адаптацию параметров и балансировку задач. Модели на основе 4B и 9B параметров по качеству сегментации на Cityscapes в режиме zero-shot превосходят Vision Banana и сопоставимы с лучшими методами оценки глубины. Авторы также предлагают метод масштабирования на этапе инференса — legend ensembling, который усредняет результаты при разных цветовых легендах голосованием большинства и повышает mIoU без дообучения.'}, 'en': {'title': 'Turn Image Generators into Open, Multi-Task Vision Systems', 'desc': 'Open Vision Banana (OVB) is an open, reproducible method that adapts pretrained image generators into systems for multiple vision tasks. The paper studies how choices such as color encoding, prompt design, parameter adaptation, and task balancing affect generalization. OVB outperforms the reported Vision Banana result on zero-shot Cityscapes segmentation and performs competitively on depth estimation, while preserving much of the generators’ image-editing ability. Its legend ensembling method combines segmentation predictions made with different class-color mappings, improving accuracy at test time without retraining.'}, 'zh': {'title': '让开源图像生成模型成为多任务视觉感知器', 'desc': '本文提出开放且可复现的 Open Vision Banana（OVB），将预训练图像生成模型转化为统一的多任务视觉感知系统，并把视觉任务建模为条件图像编辑。研究分析了颜色编码、提示词设计、参数适配和任务平衡等影响泛化能力的因素，指出这些设计彼此关联，组合时可能相互削弱。OVB 使用公开数据训练，在 Cityscapes 零样本分割上达到 73.9 mIoU，并在仿射不变深度估计上接近当前先进方法；多数模型也保留了原有的图像编辑能力。作者还提出图例集成测试时扩展方法，通过多种类别—颜色图例进行分割并以多数投票融合结果，无需重新训练即可提升分割性能，同时公开了数据处理流程、代码和模型权重。'}}}, {'id': 'https://huggingface.co/papers/2611.17167', 'title': 'Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2611.17167', 'abstract': "Abstract A decision model that acts poorly can still teach reinforcement learning policies effectively by judging complete action trajectories, improving success on ALFWorld and WebShop.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Decision models answer a question with a typed output, such as a choice among options with a probability for each, so one model can choose an agent's actions, evaluate actions already taken, or score every action to teach a policy with reinforcement learning. Prior work has studied them mainly as actors, judging their usefulness by how well they act. We ask whether a decision model that acts poorly can still teach well. We compare three decision models and three general LLMs as actors and judges on ALFWorld, and use JEV as a teacher on ALFWorld and WebShop. As actors, all six models are pulled away from a subgoal that must come first by an easier one. As judges that see the whole trajectory, the same models credit the steps toward that subgoal, and asking whether each action helped, rather than whether the task will succeed, separates useful from useless actions. As a teacher, JEV raises a Qwen2.5-1.5B policy over GRPO from 72.8% to 82.9% success on ALFWorld and from 56.8% to 71.4% on WebShop. These results suggest that a poor actor can still teach well, because judging an action after the episode ends reveals the consequences that acting must anticipate. Code is available at https://github.com/ZJU-REAL/decision-agents.", 'score': 29, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'a3666ba3d084cf6d', 'authors': ['Haochen Liu', 'Qianhao Zhu', 'Zixuan Wang', 'Dingming Li', 'Tongbo Chen', 'Peng Qiu', 'Yingqi Qu', 'Weiming Lu', 'Jun Xiao', 'Yongliang Shen'], 'affiliations': ['Baidu Inc.', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.17167.jpg', 'data': {'categories': ['#agents', '#optimization', '#benchmark', '#rl', '#games'], 'emoji': '🎓', 'ru': {'title': 'Плохой актёр может стать хорошим учителем', 'desc': 'Авторы показывают, что decision-модель (LLM, выдающая типизированный выбор с вероятностями), которая плохо действует сама, может всё равно эффективно обучать reinforcement learning-политику. Модели сравнивались как actor и judge на ALFWorld, а JEV использовался как teacher для обучения Qwen2.5-1.5B с помощью GRPO. Оценка действий по всей траектории после её завершения, с вопросом «помогло ли действие», отделяет полезные шаги от бесполезных лучше, чем оценка вероятности успеха задачи. Это повышает успешность на ALFWorld с 72.8% до 82.9% и на WebShop с 56.8% до 71.4%.'}, 'en': {'title': 'A Poor Actor Can Still Be a Great Teacher', 'desc': 'The paper studies whether a decision model that performs poorly as an agent can still teach a reinforcement learning policy. Across ALFWorld and WebShop, models acting step by step often choose easy subgoals instead of necessary ones, but can judge full action trajectories more effectively. Evaluating whether each action helped, rather than predicting whether the whole task will succeed, makes the judgments more useful for learning. Training with JEV improves a Qwen2.5-1.5B policy’s success rates over GRPO on both benchmarks, showing that a weak actor can still be a strong teacher.'}, 'zh': {'title': '行动未必出色，评判也能教出更强策略', 'desc': '论文研究决策模型能否在自身行动表现不佳时，仍然有效地指导强化学习策略。实验发现，模型作为评判者查看完整行动轨迹时，能识别出有助于完成任务的步骤；询问每个动作是否有帮助，比询问最终能否成功更能区分有效与无效动作。研究者将这种评判方法用于强化学习，在 ALFWorld 和 WebShop 上都提升了策略的任务成功率。结果说明，行动能力弱的模型也可能成为好老师，因为事后评估完整轨迹能看出行动的实际后果。'}}}, {'id': 'https://huggingface.co/papers/2611.05984', 'title': 'On the Design of Hyper-Connections: Simplification, Stability, and Scalability', 'url': 'https://huggingface.co/papers/2611.05984', 'abstract': 'Abstract A systematic study of Hyper-Connections architectures identifies the simpler efficient design SimpleHC, which removes residual mixing and uses shared memory access to match mHC performance while adding minimal training overhead and improving stability.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Hyper-Connections (HC) architectures are increasingly adopted in frontier language models, yet their components remain insufficiently understood and introduce non-negligible training overhead. In this work, we systematically study the HC architecture to understand its components and identify simpler, more efficient designs. We find that learned read/write gating without mixing and unconstrained mixing with fixed gates form two effective interaction groups: either alone achieves performance comparable to mHC. We also identify repeated access to the expanded residual state as a major source of training overhead, even without mixing. These findings lead to SimpleHC, which simplifies the architecture by removing residual mixing and simplifies execution through shared memory access, using the resulting additive structure and shared gate inputs. Layer-specific gates share a group-entry state, enabling batched reads and deferred writes; scalar corrections exactly preserve preceding sublayer output contributions. Our analyses support both the retained residual structure and the design of shared memory access. SimpleHC incurs only 2.4% extra end-to-end training time over a vanilla residual baseline at the largest tested scale. It maintains performance comparable to mHC when scaling from 15B to 30B MoE models, exhibits smoother gradient dynamics during standard training, and remains stable under stress. We hope SimpleHC will encourage a broader pursuit of simplicity in foundation model design, making performance gains more accessible and practical at scale.', 'score': 26, 'issue_id': 3528, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '9ef94a34cd03b418', 'authors': ['Xiangdong Zhang', 'Xiaohan Qin', 'Sunan Zou', 'Tuo Dai', 'Bizhao Shi', 'Zhuo Xia', 'Yebin Yang', 'Yizhou Chen', 'Yuliang Liu', 'Yu Cheng', 'Junchi Yan'], 'affiliations': ['Dots Studio, Xiaohongshu Inc.', 'Independent Researcher', 'Nanyang Technological University', 'School of AI, Shanghai Jiao Tong University', 'School of CS, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2611.05984.jpg', 'data': {'categories': ['#training', '#architecture', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Проще — значит быстрее и стабильнее: SimpleHC против лишней сложности', 'desc': 'Авторы систематически изучают архитектуры Hyper-Connections (HC), которые всё чаще применяют в современных LLM, и выясняют роль их компонентов. Показано, что обучаемые гейты чтения и записи без смешивания, а также неограниченное смешивание с фиксированными гейтами по отдельности дают качество, сопоставимое с mHC. Предложенная архитектура SimpleHC убирает смешивание остаточного состояния и использует общий доступ к памяти с батчевыми чтениями и отложенными записями, что снижает накладные расходы на обучение всего до 2.4%. Модель сохраняет качество при масштабировании от 15B до 30B MoE и демонстрирует более стабильную динамику градиентов.'}, 'en': {'title': 'Simpler Connections, Strong Performance', 'desc': 'This paper studies Hyper-Connections (HC) and finds that some of their components add training cost without being necessary for strong performance. It introduces SimpleHC, which removes residual mixing and uses shared memory access to reduce repeated reads and writes to the expanded residual state. SimpleHC achieves performance comparable to mHC, while adding only 2.4% training time over a standard residual architecture at the largest tested scale. It also shows smoother gradient dynamics and remains stable during training, including at larger model scales and under stress.'}, 'zh': {'title': '简化超连接：以共享内存访问实现高效稳定训练', 'desc': '本文系统研究了超连接（HC）架构，发现去掉残差混合后，采用共享内存访问仍能达到与 mHC 相近的效果。研究指出，反复读取扩展残差状态是训练开销的重要来源，因此提出 SimpleHC，以加法结构和共享门控输入简化计算。SimpleHC 通过批量读取、延迟写入和标量校正保留各子层输出的贡献，在最大测试规模下仅比普通残差结构多耗时 2.4%。它在 15B 到 30B 的 MoE 模型扩展中保持了相近性能，并呈现更平滑的梯度动态和更好的训练稳定性。'}}}, {'id': 'https://huggingface.co/papers/2611.17060', 'title': 'Ropedia Xperience 2: A Gold Standard for Scaling Physical AI Environments and Behaviors', 'url': 'https://huggingface.co/papers/2611.17060', 'abstract': 'Abstract  Large foundation models such as GPT-6 Astra and Claude Fable 5.1 have recently been shown to control robots directly from visual observations. They nevertheless remain brittle on long-horizon, contact-rich tasks in real-world environments. Further progress depends on two complementary resources: demonstrations of human behavior that supervise how tasks are performed, and interactive environments in which policies can be rolled out, evaluated, and improved in closed loop. Language models have advanced along well-characterized scaling laws; the corresponding question for physical AI is how capability scales with environments and behaviors, which first requires identifying which data to scale and how to produce and reuse such data continuously. To address this question, we introduce Ropedia Xperience 2, comprising 1,589 released metric-scale 3D scans and a collection of 4,230 egocentric recordings of 74 tasks (131 hours). We further show that each capture can be repurposed for robot learning: scenes are converted into physically interactive simulation environments, human motion is retargeted to whole-body robot trajectories, and additional robot behaviors are obtained through virtual teleoperation and automated long-horizon trajectory generation. We propose this joint capture of environments and behaviors as a gold standard for physical AI data collection, laying a data foundation for establishing scaling laws over environments and behaviors.', 'score': 25, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'c352c02aa956a9e7', 'authors': ['Hao Li', 'Fangzhou Hong', 'Zhaoxi Chen', 'Hui En Pang', 'Kairui Hu', 'Mingze Sun', 'Runmao Yao', 'Xinhao Ji', 'Xiyuan Zheng', 'Xuanli Chen', 'Yalun Dai', 'Yap Kim Hui', 'Dingwen Zhang', 'Yuanyuan Gao', 'Ziang Cao', 'Cheng Huang Yean', 'Jackson Peng', 'Rui Duan', 'Yaobo Liu', 'Zetong Wang', 'Ziwei Liu'], 'affiliations': ['Ropedia'], 'pdf_title_img': 'assets/pdf/title_img/2611.17060.jpg', 'data': {'categories': ['#multimodal', '#3d', '#synthetic', '#data', '#robotics', '#dataset', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Масштабировать физический AI можно только через совместный сбор сред и поведений', 'desc': 'Статья описывает набор данных Ropedia Xperience 2, включающий 1589 3D-сканов сцен в метрическом масштабе и 4230 эгоцентричных записей 74 задач общей длительностью 131 час. Авторы показывают, что каждая запись можно использовать для обучения роботов: сцены превращаются в физически интерактивные симуляционные среды, движения человека переносятся на траектории всего тела робота, а дополнительные поведения генерируются через виртуальную телеоперацию и автоматическую генерацию длинных траекторий. Предлагается совместный сбор данных об окружении и поведении как эталон для Physical AI. Это создаёт основу для изучения скейлинг-законов по средам и поведениям, аналогичных тем, что уже описаны для LLM.'}, 'en': {'title': 'Scale Robot Learning by Capturing Worlds and Behaviors Together', 'desc': 'The paper introduces Ropedia Xperience 2, a dataset for training physical AI systems that control robots. It includes 1,589 metric-scale 3D scans and 4,230 egocentric recordings covering 74 tasks. The captured scenes are converted into interactive simulations, while human motions are retargeted to robot trajectories and expanded with virtual teleoperation and automated generation. By collecting environments and behaviors together, the dataset supports research into how robot capabilities scale with training data.'}, 'zh': {'title': '环境与行为同步扩展，推动物理 AI 持续进化', 'desc': '本文介绍 Ropedia Xperience 2，一个面向具身智能研究的数据集，包含 1,589 个真实尺度的三维场景扫描，以及 74 类任务的 4,230 段第一人称视频，总时长 131 小时。研究将采集到的场景转换为可交互的物理仿真环境，并把人的动作重定向为机器人全身运动轨迹。研究还通过虚拟遥操作和自动生成长时程轨迹，扩充可用于机器人学习的行为数据。作者提出同时采集环境与行为作为物理 AI 数据建设的标准，为研究模型能力如何随环境和行为数据规模增长奠定基础。'}}}, {'id': 'https://huggingface.co/papers/2611.17331', 'title': 'TTB: Test-time Baking for Efficient Rendering of Decoder-only View Synthesis Models', 'url': 'https://huggingface.co/papers/2611.17331', 'abstract': 'Abstract By baking global scene information from cross-view attention into a lightweight MLP, Test-Time Baking (TTB) enhances the fidelity of novel-view decoding in Large View Synthesis Models while maintaining the efficiency of Test-Time Training.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Decoder-only Large View Synthesis Models (LVSMs) with KV-cache have recently achieved state-of-the-art quality by regressing novel views from neural networks without reconstructing 3D geometry, while Test-Time Training (TTT) layers save computation but sacrifice quality. We propose Test-Time Baking (TTB), a strategy that learns to bake global scene information from cross-view attention into a lightweight MLP, enabling fast and high-fidelity novel-view decoding. The first key is to repurpose the fast-weight MLP of TTT to learn the cross-view attention mapping explicitly from its input-output pairs, rather than replacing attention entirely, achieving the same rendering efficiency as TTT while delivering substantially higher quality. The second key addresses a modality misalignment between context prefilling and novel-view rendering: we disentangle context tokens into camera-only context rendering tokens to serve as TTB input, and context ground-truth tokens with image content to serve as the TTB mapping target, ensuring the baked MLPs are relieved of the modality generalization challenge between context and novel-view processing. Our method achieves up to **23x** rendering speedup with quality on par with the state-of-the-art across several benchmarks. Project page: https://test-time-baking.github.io', 'score': 19, 'issue_id': 3529, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'a48c2b3827ca9a35', 'authors': ['Chin-Yang Lin', 'Ryo Hachiuma', 'Jaesung Choe', 'Min-Hung Chen', 'Yu-Chiang Frank Wang', 'Yen-Yu Lin', 'Wei-Chen Chiu', 'Yu-Lun Liu', 'Cheng Sun'], 'affiliations': ['NVIDIA', 'National Yang Ming Chiao Tung University'], 'pdf_title_img': 'assets/pdf/title_img/2611.17331.jpg', 'data': {'categories': ['#training', '#interpretability', '#optimization', '#cv', '#architecture'], 'emoji': '🎨', 'ru': {'title': 'Запекаем глобальный контекст сцены в лёгкий MLP для быстрого синтеза новых видов', 'desc': 'Авторы предлагают метод Test-Time Baking (TTB) для Large View Synthesis Models (LVSM), которые синтезируют новые ракурсы сцены без явной реконструкции 3D-геометрии. Идея в том, чтобы переиспользовать fast-weight MLP из слоёв Test-Time Training (TTT) и обучить его явно воспроизводить cross-view attention по парам вход-выход, вместо полной замены attention. Во-вторых, для устранения модальностного рассогласования между префилом контекста и рендерингом новых видов контекстные токены разделяются на camera-only токены для входа и ground-truth токены с изображением как целевой выход. Метод сохраняет скорость рендеринга TTT, при этом качество сопоставимо с state-of-the-art, а ускорение достигает 23x.'}, 'en': {'title': 'Bake Attention’s Scene Knowledge for Faster, High-Quality Views', 'desc': 'Test-Time Baking (TTB) speeds up novel-view rendering in large view synthesis models while preserving high image quality. It trains a lightweight, fast-weight MLP to imitate the mapping learned by cross-view attention, rather than removing attention without preserving its effect. TTB separates camera-only context tokens used as input from image-content tokens used as targets, reducing the mismatch between context processing and novel-view rendering. Across several benchmarks, it achieves up to 23× faster rendering with quality comparable to state-of-the-art methods.'}, 'zh': {'title': '把全局场景信息烘焙进轻量网络，实现快速高保真新视角渲染', 'desc': '大型视图合成模型可以直接从输入图像预测新视角，不必重建三维几何，但使用跨视图注意力会带来较高的计算开销。本文提出测试时烘焙（TTB），让轻量级多层感知机（MLP）学习跨视图注意力的输入与输出映射，从而保留重要的场景信息。为减少上下文处理与新视角渲染之间的模态差异，方法将上下文令牌拆分为仅含相机信息的输入令牌，以及含图像内容的映射目标令牌。TTB最高可将渲染速度提升23倍，同时在多个基准测试上达到与当前先进方法相当的质量。'}}}, {'id': 'https://huggingface.co/papers/2611.16217', 'title': 'WorldDraft: If Code Builds the World, Can Video Models Just Render It?', 'url': 'https://huggingface.co/papers/2611.16217', 'abstract': 'Abstract  Multimodal coding agents decouple 4D world construction from visual generation, repurposing video models from world generators toward generative renderers. This division of labor raises a fundamental question: if code builds the world, can video models just render it? A reliable generative renderer hinges on two complementary criteria: (i) world preservation, retaining prescribed 4D kinematics and camera paths; and (ii) visual realization, persistently binding text-specified target attributes over time. To evaluate this capability, we introduce WorldDraft, a benchmark of 432 strictly paired test cases across 48 executable 4D world families spanning six dynamic challenge categories. Under a 3 times 3 factorial design, WorldDraft orthogonally crosses draft granularity (abstract proxy to previs) and appearance alignment (neutral to conflicting) under identical dynamics. Extensive evaluations across 12 representative models reveal that: (I) world preservation and visual realization remain in stark operational tension; (II) richer draft scaffolding anchors structure but paradoxically impairs appearance fidelity; and (III) conflicting source cues trigger severe source leakage (up to 64%), exposing fragile cross-modal disentanglement. To mitigate these bottlenecks, we propose WorldDraft-Primer, a plug-and-play visual prompting strategy that consistently improves both objectives across frozen video renderers. Together, WorldDraft and WorldDraft-Primer lay a foundation for bridging programmatic 4D simulation with video generation, advancing physically grounded generative rendering.', 'score': 14, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '19ef60edbda734f9', 'authors': ['Zhiyu Hou', 'Wen-Jie Shu', 'Harold Haodong Chen', 'Weilin Ruan', 'Chenfei Liao', 'Liuzhou Zhang', 'Disen Lan', 'Xiaogang Xu', 'Qi Chen', 'Ser-Nam Lim'], 'affiliations': ['CUHK', 'FDU', 'HKUST', 'HKUST(GZ)', 'SUSTech', 'UCF', 'ZJU', 'ZODA'], 'pdf_title_img': 'assets/pdf/title_img/2611.16217.jpg', 'data': {'categories': ['#3d', '#multimodal', '#agents', '#leakage', '#video', '#diffusion', '#benchmark', '#dataset'], 'emoji': '🌍', 'ru': {'title': 'Код строит мир, видео лишь рисует его: проверяем генеративный рендеринг', 'desc': 'В статье рассматриваются мультимодальные coding agents, которые отделяют построение 4D-мира от визуальной генерации и используют video-модели как генеративные рендереры. Авторы представляют бенчмарк WorldDraft из 432 парных тестов на 48 исполняемых 4D-мирах с 3×3 факторным дизайном, варьирующим детализацию черновика и согласованность внешнего вида. Оценка 12 моделей показывает напряжение между сохранением структуры мира и визуальной реализацией, а также утечку источника при конфликтующих текстовых указаниях до 64%. Для смягчения проблем предлагается WorldDraft-Primer, plug-and-play стратегия visual prompting, улучшающая оба критерия для замороженных video-рендереров.'}, 'en': {'title': 'Build the world with code; render it faithfully with video models', 'desc': 'The paper studies video models used as renderers for worlds built by code, focusing on two goals: preserving the world’s motion and camera paths, and accurately showing attributes described in text over time. It introduces WorldDraft, a benchmark with 432 paired tests across 48 executable 4D world families, to measure both goals under different draft and appearance conditions. Tests on 12 models show that preserving structure can conflict with appearance accuracy, detailed drafts can reduce visual fidelity, and conflicting visual cues can cause models to copy unwanted source details. The authors also propose WorldDraft-Primer, a visual prompting method that improves both goals across video renderers without changing the models.'}, 'zh': {'title': '让视频模型既守住四维世界，也画对目标外观', 'desc': '这篇论文研究多模态编码智能体如何先用代码构建四维世界，再用视频模型将其渲染成画面。作者提出 WorldDraft 基准，包含 432 组严格配对的测试案例，用来评估模型能否保留世界的运动和相机路径，同时持续呈现文本指定的外观。对 12 个模型的测试发现，保留世界结构与准确生成外观之间存在明显冲突；草图提供更多结构线索虽能帮助模型保留场景，却可能降低外观准确度，互相矛盾的视觉线索还会造成严重的来源泄漏。作者进一步提出 WorldDraft-Primer 视觉提示策略，无需微调模型即可同时改善结构保留和外观生成，为结合程序化四维模拟与视频生成提供了新方法。'}}}, {'id': 'https://huggingface.co/papers/2611.16905', 'title': 'Factored One-sided Adam-Moment for Practical and Scalable SOAP', 'url': 'https://huggingface.co/papers/2611.16905', 'abstract': "Abstract FOAM is a lightweight SOAP variant that uses input-only preconditioning and a factored Adam-moment estimator to match strong second-order and Muon baselines in LLM pre-training while using half the optimizer state and running at Muon-class speed.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Second-order optimizers (e.g., Shampoo, SOAP) have emerged as compelling alternatives to Adam/AdamW and promise faster per-step convergence than AdamW in transformer training. However, they still remain costly in practice, and even SOAP still pays substantial optimizer-state memory and eigendecomposition overhead. We ask whether the benefits of SOAP can be retained at nearly the efficiency of AdamW. In this paper, we answer yes with a lightweight SOAP variant, Factored One-sided Adam-Moment (FOAM). The path to practical impact is twofold: first, FOAM employs input-only preconditioning, dropping the output-side Kronecker factor to reduce memory and remove one eigendecomposition. The Kronecker structure of the Hessian shows that this is exact for a diagonal output-side curvature and nearly lossless for a near-diagonal one, as we observe empirically. Second, FOAM replaces SOAP's dense rotated second moment with a factored Adam-moment estimator based on row-by-column statistics. Under the K-FAC Fisher assumption with a diagonal output curvature, this estimator exactly recovers SOAP's dense second moment, and we measure only a 15-20% K-FAC violation, with negligible effect on the update. Our empirical results support the claim that FOAM matches strong SOAP and Muon baselines in validation loss across scales of large language model (LLM) pre-training, uses half of SOAP's optimizer state, runs at Muon-class wall-clock time, and retains robustness across a three-fold learning-rate range. The results hold from 124M to 760M parameters, demonstrating that SOAP's gains need not require SOAP's cost. Code: https://github.com/naver-ai/foam", 'score': 12, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '2397da6a75353b7e', 'pdf_title_img': 'assets/pdf/title_img/2611.16905.jpg', 'data': {'categories': ['#training', '#architecture', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Преимущества SOAP без его высокой цены', 'desc': 'В статье представлен FOAM — облегчённый вариант оптимизатора SOAP для обучения больших языковых моделей (LLM). Метод использует предобуславливание только по входам (input-only preconditioning), что убирает один фактор Кронекера и одну эйгендекомпозицию, а также заменяет плотный вращённый второй момент факторизованной оценкой на основе статистик по строкам и столбцам. Эмпирически FOAM сопоставим по validation loss с SOAP и Muon на моделях от 124M до 760M параметров, при этом использует вдвое меньше состояния оптимизатора. Таким образом, преимущества методов второго порядка достигаются при скорости, близкой к AdamW.'}, 'en': {'title': 'SOAP’s gains, with less cost', 'desc': 'FOAM is a lightweight optimizer designed to keep SOAP’s training benefits while reducing its cost. It uses input-only preconditioning, which removes one Kronecker factor and its eigendecomposition. It also estimates the second moment using compact row-and-column statistics instead of a dense matrix. In LLM pre-training experiments, FOAM matches SOAP and Muon in validation loss, uses half SOAP’s optimizer memory, and runs at about Muon’s speed.'}, 'zh': {'title': '保留 SOAP 的效果，减半优化器状态', 'desc': 'FOAM 是一种轻量级的 SOAP 优化器变体，旨在降低大语言模型预训练中的计算和内存开销。它只使用输入侧预条件，从而省去输出侧的矩阵分解，并用基于行列统计的因子化 Adam 二阶矩估计替代稠密估计。在特定的曲率与 K-FAC 假设下，这种估计可以准确还原 SOAP 的二阶矩；实验中假设偏差对更新影响很小。对于 1.24 亿到 7.6 亿参数的模型，FOAM 的验证损失可媲美 SOAP 和 Muon，同时只需 SOAP 一半的优化器状态，并达到接近 Muon 的运行速度。'}}}, {'id': 'https://huggingface.co/papers/2611.16517', 'title': 'UniSpark: Exploring Hybrid Attention for Multimodal Understanding and Generation', 'url': 'https://huggingface.co/papers/2611.16517', 'abstract': 'Abstract  We present UniSpark-9B, a unified multimodal model that investigates hybrid attention for visual understanding and generation. Built on a Mixture-of-Transformer-Experts backbone with approximately 9B parameters in each branch, UniSpark combines full attention for explicit token interactions with GatedDeltaNet linear attention for compact context propagation. Autoregressive text prediction and visual flow matching jointly support visual question answering, text-to-image generation, instruction-guided editing, and interleaved text-image prediction. In interleaved generation, noisy visual targets are isolated from subsequent predictions, while clean visual representations provide context for later outputs. A blockwise protocol enforces this distinction through attention masks in full-attention layers and recurrent-state retention rules in linear-attention layers. The selected training sources contain 159.7M generation samples, 213.4M understanding samples, and 624.8K interleaved sequences. A four-stage curriculum jointly trains multimodal understanding and visual generation, refining answer accuracy and instruction following while extending image synthesis to 2K. UniSpark scores 2470.3 on MME-S and 0.83 on GenEval. Qualitative examples further illustrate its capabilities in interleaved image generation, video synthesis, and video editing. Together, these results demonstrate that hybrid attention provides an effective backbone for unified multimodal understanding and generation.', 'score': 12, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '4e13dbfb877ef42a', 'pdf_title_img': 'assets/pdf/title_img/2611.16517.jpg', 'data': {'categories': ['#multimodal', '#architecture', '#synthetic', '#cv', '#training', '#video', '#diffusion', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Гибридное внимание объединяет понимание и генерацию изображений', 'desc': 'В статье представлена UniSpark-9B, унифицированная мультимодальная модель, которая совмещает визуальное понимание и генерацию изображений на основе гибридного внимания. Архитектура Mixture-of-Transformer-Experts с полным вниманием (full attention) и линейным вниманием GatedDeltaNet объединяет точные взаимодействия токенов с компактным распространением контекста. Модель обучается совместно: авторегрессионное предсказание текста и visual flow matching поддерживают VQA, text-to-image генерацию, редактирование по инструкции и interleaved предсказание текста и изображений. Четырёхэтапный curriculum learning на сотнях миллионов примеров даёт результаты 2470.3 на MME-S и 0.83 на GenEval, что подтверждает эффективность гибридного внимания как основы для унифицированных мультимодальных моделей.'}, 'en': {'title': 'One hybrid-attention model for seeing, creating, and editing', 'desc': 'UniSpark-9B is a multimodal model that combines full attention with GatedDeltaNet linear attention to understand and generate visual content. Its mixture-of-experts backbone is trained to answer visual questions, create and edit images from instructions, and predict sequences that mix text and images. A blockwise protocol prevents noisy image targets from influencing later predictions, while allowing clean image representations to provide useful context. Training on a four-stage curriculum yields strong benchmark results and supports image generation up to 2K resolution, as well as video synthesis and editing.'}, 'zh': {'title': '混合注意力，让多模态理解与生成融为一体', 'desc': '论文提出 UniSpark-9B，一个统一的多模态模型，可同时理解视觉内容并生成图像。它采用混合注意力架构，将全注意力与 GatedDeltaNet 线性注意力结合，并以专家混合 Transformer 为基础。模型通过联合训练文本预测和视觉流匹配，支持视觉问答、文生图、指令编辑，以及文字与图像交错生成。实验结果显示，这种架构能有效支持多模态理解与生成，并在图像生成和视觉问答基准上取得良好表现。'}}}, {'id': 'https://huggingface.co/papers/2611.17334', 'title': 'Unbundling Multimodal Vision Encoding', 'url': 'https://huggingface.co/papers/2611.17334', 'abstract': "Abstract Controlled experiments show that multimodal language models do not need a pretrained vision encoder, but benefit from dedicated vision capacity trained jointly with the backbone and integrated early rather than before fusion.  Generated by deepseek-ai/DeepSeek-V4.1-Flash How multimodal language models should encode visual input remains up for debate. Most models use a pretrained vision encoder, while some recent recipes train the encoder from scratch with the language model or remove it entirely. Vision encoders bundle together three design choices: a visual prior from upstream pretraining, dedicated vision capacity, and pre-fusion placement of that capacity (i.e., before the multimodal backbone). Because published models also differ in data, architecture, and compute, comparing them cannot isolate the effect of each choice. We disentangle these choices via a controlled framework where we pretrain all models from scratch on common data and compare them on visual question answering and language benchmarks at matched lifetime compute. We find that the visual prior is not necessary; an encoder trained jointly from scratch is on par with a pretrained one, without a separate training stage. What matters instead is dedicated vision capacity: an encoder-free model trails on visual understanding even when its backbone is enlarged by the encoder's parameter count. Yet that capacity need not precede multimodal fusion, as vision-only modules added in-fusion to early backbone layers perform comparably to a pre-fusion encoder and can lower time to first token. These results also hold across backbone sizes, when encoder pretraining is treated as free, and when starting from a pretrained language model. Overall, our findings favor dedicated vision capacity trained jointly with the backbone and placed early within it.", 'score': 9, 'issue_id': 3530, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'c8fc036d758bf531', 'authors': ['Ellis Brown', 'Chris Hoang', 'Shengyi Qian', 'Shang-Wen Li', 'Mike Lewis', 'Marjan Ghazvininejad', 'Luke Zettlemoyer', 'Lucas Beyer', 'Mengye Ren', 'Jakob Verbeek', 'Saining Xie', 'Hu Xu'], 'affiliations': ['Meta FAIR', 'New York University'], 'pdf_title_img': 'assets/pdf/title_img/2611.17334.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#architecture', '#training', '#interpretability'], 'emoji': '👁️', 'ru': {'title': 'Визуальная ёмкость важнее предобучения: учим зрение вместе с моделью и рано', 'desc': 'В статье исследуется, как мультимодальные языковые модели (LLM) должны кодировать визуальные данные. Авторы проводят контролируемые эксперименты, предобучая все модели с нуля на одинаковых данных и сравнивая их на бенчмарках VQA и языковых задачах при равных вычислительных затратах. Выяснилось, что предобученный визуальный prior не обязателен: энкодер, обученный совместно с backbone, работает не хуже предобученного, а ключевую роль играет выделенная визуальная ёмкость (dedicated vision capacity). Модули, добавленные внутрь ранних слоёв backbone (in-fusion), показывают результаты, сопоставимые с классическим pre-fusion энкодером, и могут снижать time to first token.'}, 'en': {'title': 'Give Vision Its Own Capacity—Train It Jointly and Fuse It Early', 'desc': 'The study compares visual-input designs for multimodal language models using controlled experiments with matched compute and common training data. It finds that a pretrained visual prior is unnecessary: a vision encoder trained from scratch jointly with the language model performs similarly. Dedicated vision capacity does improve visual understanding, while simply enlarging the language-model backbone does not replace it. This capacity can be integrated into early backbone layers rather than placed before multimodal fusion, with comparable performance and potentially faster time to first token.'}, 'zh': {'title': '视觉能力要专门，训练与融合都可早期联合', 'desc': '这项研究通过控制实验，比较多模态模型处理图像的不同方式，并在相同数据和计算量下进行评测。结果表明，视觉编码器不一定要经过预训练；从零开始与语言模型联合训练，也能达到相近效果。模型仍需要专门的视觉容量，单纯扩大语言模型骨干网络无法弥补移除视觉模块造成的视觉理解能力下降。视觉模块也不必放在多模态融合之前，较早地融入骨干网络同样有效，并可能缩短首个词元的生成时间。'}}}, {'id': 'https://huggingface.co/papers/2611.08318', 'title': 'Learning the Task or Learning the Verifier? Rethinking Criteria Exposure in Embodied Self-Improvement', 'url': 'https://huggingface.co/papers/2611.08318', 'abstract': "Abstract Exposing benchmark success criteria to self-improving embodied coding agents can raise measured success under those criteria without improving instructed-task completion, and the advantage weakens under slight criteria changes and transfers poorly across tasks, while instruction-faithful criteria better reflect instructed-task performance.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Self-improving embodied agents are increasingly being developed and compared on robot simulation benchmarks. Several recent works expose the benchmark's success criteria to the learning agent, a practice we call Criteria Exposure (CE). These criteria, originally written to verify policies trained by imitation learning, often demand more than the corresponding language instructions, so a score from such a verifier may not faithfully reflect whether the instructed task was completed, especially for robot-control programs written by an agent. As embodied coding agents report ever higher benchmark scores, a natural question arises: when a coding agent is exposed to the benchmark's criteria, does it generate code that better performs the instructed task, or code that simply overfits to the verification criteria? We conduct controlled experiments with a self-improving agent with and without CE, and find that with CE the agent quickly produces code with a higher success rate under the given criteria, but this advantage disappears when the criteria are changed slightly without departing from the original instructions. More importantly, the skills the agent develops under CE transfer poorly across tasks. We further propose instruction-faithful criteria and show that they better reflect the performance of agent-generated programs.", 'score': 7, 'issue_id': 3529, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '00a6b9b7075abc37', 'authors': ['Wenbo Huang', 'Jianxin Bi', 'Shunyu Yang', 'Ruiyang Si', 'Rui Ni', 'Qiang Wang', 'Shulong Jiang', 'Yintianrun Zhang', 'Feixiang Ruan', 'Kewei Zhang', 'Ye Huang', 'Shukai Gong', 'Daquan Zhou'], 'affiliations': ['National University of Singapore', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2611.08318.jpg', 'data': {'categories': ['#benchmark', '#agents', '#optimization', '#reasoning', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Не учи робота сдавать тест, учи его выполнять задачу', 'desc': 'Статья исследует self-improving агентов, которые пишут код для роботов и используют бенчмарки с открытыми критериями успеха (Criteria Exposure). Авторы показывают, что при доступе к критериям агент быстро повышает метрику, но это улучшение исчезает при небольшом изменении критериев и плохо переносится между задачами, то есть агент переобучается под верификатор. Поэтому оценка по таким критериям может неточно отражать реальное выполнение инструкции. Предложены инструкционно-верные критерии (instruction-faithful criteria), которые лучше отражают качество сгенерированных программ.'}, 'en': {'title': 'Train for the Task, Not the Test', 'desc': 'The paper studies whether showing a self-improving embodied coding agent a benchmark’s success criteria helps it complete the task or merely satisfy the verifier. With criteria exposure, the agent quickly achieves higher scores under the exposed criteria, but this advantage fades when the criteria change slightly. The skills learned with exposure also transfer poorly to other tasks, suggesting the agent overfits to the evaluation criteria. The authors propose instruction-faithful criteria, which they find better reflect whether generated programs complete the language instructions.'}, 'zh': {'title': '别让智能体只会迎合评分标准', 'desc': '这篇论文研究具身编码智能体能否通过接触基准测试的成功判定标准来提升任务表现。实验发现，智能体接触这些标准后，能更快生成在原标准下得分更高的代码，但这并不代表它更好地完成了语言指令中的任务。只要稍微修改判定标准，这种优势就会减弱，而且学到的技能难以迁移到其他任务，说明智能体可能过拟合了评估标准。作者提出更忠实于指令内容的判定标准，并发现它们更能反映智能体生成程序的实际任务表现。'}}}, {'id': 'https://huggingface.co/papers/2611.09567', 'title': 'TurtLES: A Large-Scale Benchmark for Turbulent 3D Neural PDE Surrogates', 'url': 'https://huggingface.co/papers/2611.09567', 'abstract': 'Abstract  Machine-learning surrogates are increasingly used to accelerate computational fluid dynamics, yet progress is limited by the lack of benchmarks capturing realistic, time-dependent turbulent flows. We introduce TurtLES, a 14 TB dataset of 3D turbulent cylinder wakes in the shear-layer transition regime, computed via high-fidelity implicit large-eddy simulations. The dataset contains 400 trajectories of 400 time steps each, with 3-11 million points per frame, spanning variations in geometry, Reynolds number, and angle of attack. Unlike existing datasets, TurtLES combines (i) physically realistic turbulence with an active energy cascade driven by vortex stretching, (ii) dense irregular meshes, and (iii) long-horizon temporal dynamics. We benchmark state-of-the-art neural operators on autoregressive rollouts and identify key failure modes, including temporal instability, loss of small-scale energy, and challenges in learning on large irregular domains. TurtLES provides a new benchmark for evaluating surrogate models on 3D turbulent wakes at industrially relevant mesh resolution.', 'score': 4, 'issue_id': 3530, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'f433e7c631603af5', 'authors': ['Jarno Platenburg', 'Armand Kassaï Koupaï', 'Paola Cinnella', 'Patrick Gallinari'], 'affiliations': ['CNRS', 'Criteo AI Lab', 'Delft University of Technology', 'ISIR', 'Institut Jean Le Rond dAlembert', 'Sorbonne Université'], 'pdf_title_img': 'assets/pdf/title_img/2611.09567.jpg', 'data': {'categories': ['#synthetic', '#dataset', '#benchmark', '#open_source', '#data'], 'emoji': '🌀', 'ru': {'title': 'TurtLES: честный бенчмарк для ИИ-суррогатов турбулентных потоков', 'desc': 'Статья представляет TurtLES — новый датасет объёмом 14 ТБ с трёхмерными турбулентными следами за цилиндром в режиме перехода сдвигового слоя, полученными методом implicit large-eddy simulation. Данные включают 400 траекторий по 400 временных шагов с плотными нерегулярными сетками (3–11 млн точек на кадр) и варьируют геометрию, число Рейнольдса и угол атаки. В отличие от существующих датасетов, TurtLES сочетает физически реалистичную турбулентность с энергетическим каскадом, нерегулярные сетки и длинные временные зависимости. Авторы тестируют современные нейронные операторы в режиме авторегрессивного роллаута и выявляют типичные сбои: временную нестабильность, потерю энергии мелкомасштабных структур и трудности обучения на больших нерегулярных доменах.'}, 'en': {'title': 'A realistic turbulence test for faster fluid-flow prediction', 'desc': 'TurtLES is a large dataset for testing machine-learning surrogates that predict turbulent fluid flow. It contains 400 long simulations of three-dimensional cylinder wakes, with varied shapes, Reynolds numbers, and angles of attack. The flows capture realistic turbulence, dense irregular meshes, and long-term changes over time. Tests of neural operators reveal problems such as unstable predictions, loss of small-scale energy, and difficulty handling large irregular domains.'}, 'zh': {'title': '以真实湍流挑战神经算子，打造工业级流体模拟基准', 'desc': '本文提出了 TurtLES，这是一个用于评估机器学习流体模拟替代模型的大型基准数据集，包含三维圆柱尾流的湍流模拟。数据由高保真隐式大涡模拟生成，涵盖不同几何形状、雷诺数和攻角，并包含长时间序列与密集的不规则网格。研究使用该数据测试了多种神经算子在自回归预测中的表现，发现它们容易出现时间不稳定、丢失小尺度能量，以及难以处理大型不规则计算域等问题。TurtLES 为在工业级网格分辨率下评估三维湍流尾流的替代模型提供了新的基准。'}}}, {'id': 'https://huggingface.co/papers/2611.17190', 'title': 'Consensus Capture in Reference-Based UAV Video Stabilization: A Benchmark on Dynamic Urban Scenes', 'url': 'https://huggingface.co/papers/2611.17190', 'abstract': "Abstract  Reference-frame stabilization registers every frame of a hovering-drone video onto one reference frame, keeping object positions comparable. The registration pipelines it relies on are selected on feature-matching benchmarks in which only the camera moves. Over a busy intersection, vehicles moving together supply mutually consistent correspondences that can draw the robust homography estimate toward their motion: consensus capture, which inlier statistics cannot flag. A two-part benchmark measures it and the object masking meant to prevent it. A static protocol scores ten pipelines under exactly known homographies on 4K aerial frames, tuned on a site-disjoint split at a matched resolution and feature budget. A dynamic protocol scores them at an offline and a real-time budget on hovers selected from the video alone to span the amount and coherence of moving foreground, plus a stationary control. It measures background alignment, object position error and the share of a moving group's displacement an estimate follows, against a pseudo-ground-truth reference audited with manually annotated ground control points, which also score every candidate. On static scenes, tuned AKAZE, RootSIFT, SIFT and BRISK lead, retuning the matcher thresholds raises the mean average accuracy (mAA) by at most 0.0062, and masking costs less than 0.005. Unmasked ORB is captured on 28 of 304 real-time dynamic pairs and on 6 offline; its real-time captured estimates have a median corner error of 18.8 px yet typical inlier counts and ratios. Masking removes capture for every pipeline and leaves the leading pipelines unchanged. Code, data and results are released.", 'score': 3, 'issue_id': 3530, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '53ac781209b8e660', 'authors': ['Robert Fonod', 'Nikolas Geroliminis'], 'affiliations': ['aÉcole Polytechnique Fédérale de Lausanne (EPFL)'], 'pdf_title_img': 'assets/pdf/title_img/2611.17190.jpg', 'data': {'categories': ['#survey', '#cv', '#benchmark', '#open_source', '#video', '#data'], 'emoji': '🚁', 'ru': {'title': 'Движущиеся машины могут незаметно увести стабилизацию дрона в сторону', 'desc': 'Статья исследует стабилизацию видео с дронов, где каждый кадр регистрируется на опорный через гомографию, оцениваемую робастным методом (RANSAC) на ключевых точках. Авторы показывают, что движущиеся группы объектов (например, машины на перекрёстке) дают согласованные соответствия, которые уводят оценку гомографии за собой — это явление названо «захватом консенсуса» (consensus capture), и его нельзя обнаружить по статистике инлаеров. Предложен двухчастный бенчмарк: статический протокол с точно известными гомографиями на 4K-кадрах и динамический протокол с псевдо-эталонной разметкой, проверенной вручную. Результаты показывают, что маскирование объектов устраняет захват для всех конвейеров, при этом ведущие методы (AKAZE, RootSIFT, SIFT, BRISK) не меняются.'}, 'en': {'title': 'Keep Moving Objects from Steering the Frame', 'desc': 'The paper studies reference-frame stabilization for drone videos, where homography estimates can be pulled toward the motion of groups of vehicles. It introduces static and dynamic benchmarks to evaluate alignment quality, object-position error, and how much an estimate follows moving objects, using manually checked ground-control points for evaluation. On static scenes, tuned AKAZE, RootSIFT, SIFT, and BRISK perform best, while retuning matcher thresholds or masking has little effect on accuracy. On dynamic scenes, unmasked ORB is sometimes captured by moving vehicles despite normal-looking inlier statistics, and object masking prevents this failure across all tested pipelines.'}, 'zh': {'title': '防止移动前景带偏配准：用物体遮罩守住无人机视频的参考帧', 'desc': '本文研究无人机悬停视频的参考帧配准：将每一帧映射到同一参考帧，以便比较物体位置。车辆等前景物体若成群同向移动，可能产生彼此一致的特征匹配，使鲁棒单应性估计被带偏；常见的内点统计却未必能发现这种问题。作者设计静态与动态两部分基准，评估十种配准流程的背景对齐、物体位置误差，以及估计结果跟随移动物体位移的程度，并用人工标注的地面控制点审查伪真值。实验发现，静态场景中多种特征方法表现领先；动态场景中未屏蔽前景的 ORB 会出现“共识捕获”，而物体遮罩可消除此现象，且不损害领先流程的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.16009', 'title': 'JustRUA: A Controlled Study of GPT-6 Robot-Use Agents', 'url': 'https://huggingface.co/papers/2611.16009', 'abstract': 'Abstract A simplified evaluation harness that keeps full episode history and stops motions early substantially improves robot-use agent scores on RoboDojo, with scene geometry providing the largest additional benefit.  Generated by deepseek-ai/DeepSeek-V4.1-Flash GPT-6 Astra can drive a robot arm directly through a fixed harness, and scores of such robot-use agents on RoboDojo have risen quickly since. Reported systems differ in harness and test subset and often change several designs at once, so it is hard to tell which choices produce the gains. We take these designs apart and test them in one framework, along the harness around the model, the action interface, the reuse of experience and the scene geometry given to the model. A lean harness that keeps the full episode history and stops each motion early goes a long way. Reusing experience changes how the model acts but is not a free lunch, and scene geometry helps most, even when depth is predicted from RGB alone. JustRUA starts from the official L3 harness and keeps only what matters most. Even with no learned policy, self-improvement loop or task-specific tuning, this simple harness raises the score on the RoboDojo simulation benchmark substantially, from 29.7 to 50.3.', 'score': 3, 'issue_id': 3529, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': '04188cde1477b772', 'authors': ['Zefan Wang', 'Yufan Dang', 'Xuanwei Shi', 'Mingqi Gao', 'Cheng Yin', 'SikYuen Tam', 'Hanyu Liu', 'Yasheng Wang', 'Yaxi Lu', 'Songyang Zhang', 'Xin Cong', 'Yuan Yao'], 'affiliations': ['Huazhong University of Science and Technology', 'ModelBest', 'Peking University', 'Tencent', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.16009.jpg', 'data': {'categories': ['#benchmark', '#agents', '#interpretability', '#optimization', '#agi', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Простой harness важнее сложных архитектур: геометрия сцены даёт самый большой прирост', 'desc': 'Авторы разбирают по частям архитектуру агентов для управления роботами, которые работают с LLM напрямую через фиксированный harness, и проверяют каждый компонент в единой среде. Показано, что упрощённый harness, сохраняющий полную историю эпизода и раннюю остановку движений, даёт заметный прирост качества. Использование накопленного опыта меняет поведение модели, но не даёт гарантированного улучшения, а геометрия сцены (в том числе глубина, предсказанная по RGB) ока
