o capture detailed information. This method leads to better performance in generating images and improves the accuracy of reconstructing small text, demonstrating a successful balance between fidelity and learnability.'}, 'zh': {'title': '鲁棒预测与重建的平衡', 'desc': 'RoAR-VAE是一种改进视觉标记器的方法，它通过强制对语义的鲁棒预测和从损坏的潜在变量中重建来平衡图像的保真度与扩散模型的可学习性。该方法保留了高层次的结构信息，同时重建干净的图像以保持细粒度的空间和外观信息。通过两个互补的目标，RobustAlign和RobustRecon，RoAR-VAE能够有效地从损坏的潜在变量中恢复生成相关的信息。实验结果表明，RoAR-VAE在生成基准性能上优于最强基线标记器，并在小文本重建准确性上有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2610.06830', 'title': 'MemPilot: Orchestrating On-Demand Multimodal Memory Curation for LLM Agents', 'url': 'https://huggingface.co/papers/2610.06830', 'abstract': "Abstract MemPilot uses reinforcement learning to dynamically curate multimodal agent memory, balancing performance, cost, and latency through adaptive retrieval and model selection.  Generated by thinkingmachines/Inkling-Small Memory has become integral to the LLM agent ecosystem, supporting information retention and reuse across interactions. However, most existing agent memory systems construct memory in a query-agnostic manner, which can incur unnecessary preprocessing cost and discard details that later prove essential. Recent studies have begun shifting memory processing toward runtime adaptation, but typically specialize in particular operations or fixed processing schemes, leaving flexible control over performance, cost, and latency largely underexplored. To address this challenge, we present MemPilot, a flexible framework that orchestrates on-demand memory curation under different performance--cost--latency preferences. Specifically, we optimize a multi-step LLM policy via reinforcement learning to iteratively choose between retrieving from query-agnostic memory and delegating query-specific curation of raw multimodal history to heterogeneous LLMs and VLMs. The policy jointly controls evidence amount, curation instructions, model selection, and visual access, enabling fine-grained allocation of runtime computation. To optimize this policy under competing objectives, we adapt objective-wise advantage decoupling by separately estimating each objective's advantage before aggregation. Moreover, we introduce prefix-based marginal utility estimation for fine-grained credit assignment across multi-step rollouts. Experiments on five multimodal agent-memory benchmarks demonstrate favorable performance--cost--latency trade-offs across optimization preferences, with preference sweeps yielding broader frontiers than existing trade-off-aware baselines.", 'score': 25, 'issue_id': 3437, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'd14e004f9b20d1b7', 'authors': ['Haozhen Zhang', 'Haodong Yue', 'Quanyu Long', 'Jianzhu Bao', 'Qingyuan Liu', 'Tao Feng', 'Bohan Liu', 'Weida Liang', 'Wenya Wang'], 'affiliations': ['Nanyang Technological University', 'Tsinghua University', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.06830.jpg', 'data': {'categories': ['#multimodal', '#agents', '#optimization', '#benchmark', '#rl', '#reasoning'], 'emoji': '🧭', 'ru': {'title': 'Умный пилот памяти: адаптивное управление контекстом агента под баланс качества, цены и скорости', 'desc': 'В статье представлен MemPilot — фреймворк, который использует reinforcement learning для динамического управления памятью мультимодальных LLM-агентов. Вместо построения памяти без учёта запроса, политика агента на каждом шаге решает, извлекать ли данные из общей памяти или делегировать курирование сырой истории LLM и VLM, при этом выбирая объём доказательств, инструкции, модель и доступ к изображениям. Для обучения под конкурирующие цели (качество, стоимость, задержка) авторы используют objective-wise advantage decoupling и prefix-based marginal utility estimation для точного credit assignment. Эксперименты на пяти бенчмарках показали, что MemPilot даёт более широкий фронт компромиссов между производительностью, стоимостью и задержкой, чем существующие базовые методы.'}, 'en': {'title': 'Smart Memory Management with MemPilot', 'desc': 'MemPilot is a framework that uses reinforcement learning to manage how an agent remembers and retrieves information, focusing on balancing performance, cost, and latency. Unlike traditional memory systems that treat all queries the same, MemPilot adapts its memory curation based on the specific needs of each query, which helps in retaining important details. It employs a multi-step policy that decides whether to use general memory or to curate specific information from various models, optimizing the use of computational resources. The results show that MemPilot achieves better trade-offs in performance, cost, and latency compared to existing methods, making it a more efficient solution for multimodal agent memory management.'}, 'zh': {'title': 'MemPilot：灵活的多模态记忆管理', 'desc': 'MemPilot 是一个使用强化学习的框架，旨在动态管理多模态代理的记忆，平衡性能、成本和延迟。它通过自适应检索和模型选择来优化记忆的使用，支持信息的保留和重用。与传统的记忆系统不同，MemPilot 能够根据查询的需求灵活调整记忆处理，避免不必要的预处理成本。实验结果表明，MemPilot 在多个基准测试中表现出优越的性能和成本效率，提供了更广泛的优化选择。'}}}, {'id': 'https://huggingface.co/papers/2610.26853', 'title': 'InfiniDream: Open-Ended Photorealistic 3D Worlds Through Procedural Generation', 'url': 'https://huggingface.co/papers/2610.26853', 'abstract': 'Abstract InfiniDream is a vision-language model framework that generates open-ended, editable, photorealistic 3D worlds through symbolic procedural asset creation and deterministic scene placement.  Generated by thinkingmachines/Inkling-Small Procedural generation plays a key role in synthetic data creation and game development, offering greater controllability, editability, and diversity than static mesh representations. However, VLM-based code generation often produces relatively simple 3D assets, while sophisticated photorealistic procedural systems require extensive manual development. Existing VLM-guided procedural methods remain largely constrained by predefined factories and APIs, limiting their ability to create novel asset types. We introduce InfiniDream, a VLM-driven framework for open-ended procedural 3D world generation. First, we propose Symbolically Constrained Asset Generation, which leverages existing procedural algorithms to create novel, photorealistic assets while preserving editability and seed-based diversity. Second, we develop an end-to-end text-to-world pipeline that combines semantic scene planning with Deterministic Frustum-Guided Grid Placement to construct large-scale 3D worlds with precise object placement, procedural population, and animation. Extensive evaluations on 100 object and 20 scene generation tasks demonstrate improvements across four perceptual metrics. Diversity analysis, ablation studies, and human preference evaluations further validate the effectiveness of our framework. Project page: https://yichuanh.github.io/infinidream-page/', 'score': 25, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '9ba70ccc9583cd66', 'authors': ['Yi-Chuan Huang', 'Hao-Jen Chien', 'Zheng-Hui Huang', 'Yu-Lun Liu', 'Kaipeng Zhang', 'Zhixiang Wang'], 'affiliations': ['Alaya Lab', 'National Taiwan University', 'National Yang Ming Chiao Tung University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26853.jpg', 'data': {'categories': ['#benchmark', '#synthetic', '#multimodal', '#3d', '#architecture', '#games', '#plp'], 'emoji': '🌍', 'ru': {'title': 'Миры по тексту: открытая процедурная генерация фотореалистичных 3D-сцен', 'desc': 'В статье представлен InfiniDream — фреймворк на базе VLM (vision-language model), который генерирует редактируемые фотореалистичные 3D-миры по текстовому описанию. Ключевая идея Symbolically Constrained Asset Generation: VLM пишет символьные описания, а существующие процедурные алгоритмы создают новые ассеты без ограничения заранее заданным набором API, сохраняя редактируемость и разнообразие через seed. Для сборки целых сцен используется семантическое планирование и Deterministic Frustum-Guided Grid Placement, обеспечивающий точное размещение объектов, процедурное заполнение и анимацию. Эксперименты на 100 задачах генерации объектов и 20 задачах генерации сцен показывают улучшения по четырём перцептивным метрикам, а также подтверждаются абляциями и оценками предпочтений людей.'}, 'en': {'title': 'Unlocking Endless Possibilities in 3D World Creation', 'desc': 'InfiniDream is a new framework that combines vision and language models to create detailed and editable 3D worlds. It uses procedural generation techniques to produce diverse and realistic assets, allowing for greater control compared to traditional static models. The framework includes a text-to-world pipeline that ensures accurate placement and animation of objects within the generated scenes. Evaluations show that InfiniDream significantly improves the quality and diversity of 3D asset generation compared to existing methods.'}, 'zh': {'title': '开放式程序化3D世界生成的创新框架', 'desc': 'InfiniDream是一个视觉-语言模型框架，能够生成开放式、可编辑的逼真3D世界。它通过符号程序化资产创建和确定性场景放置来实现这一目标，提供比静态网格表示更高的可控性和多样性。该框架引入了符号约束资产生成，利用现有的程序算法创造新颖的逼真资产，同时保持可编辑性和基于种子的多样性。通过文本到世界的端到端管道，InfiniDream能够精确地构建大规模3D世界，展示了在多个感知指标上的显著改进。'}}}, {'id': 'https://huggingface.co/papers/2610.26770', 'title': 'HarnessPro: Recursive Harness Self-Improvement with Pareto Optimization for Performance-Cost Trade-offs', 'url': 'https://huggingface.co/papers/2610.26770', 'abstract': 'Abstract HarnessPro evolves AI agent harnesses without labels to boost task success and lower execution costs, yielding lightweight, balanced, and high-performance variants via trajectory diagnosis and weighted selection.  Generated by thinkingmachines/Inkling-Small Harness development plays a crucial role in building capable AI agents. Recent approaches improve harnesses through recursive self-improvement (RSI), but their performance gains often come with higher execution costs. We introduce HarnessPro, a label-free method for evolving harnesses to improve task performance while reducing execution cost. In this setting, candidate harnesses are evaluated using LLM-generated tests without access to ground-truth solutions or official tests. Specialized agents diagnose execution trajectories, plan updates with different performance-cost priorities, and implement them as candidate harnesses. Rather than returning a single harness, HarnessPro uses normalized weighted squared-distance selection to provide cost-focused (lite), balanced (medium), and performance-focused (heavy) harnesses for different deployment budgets. Selected harnesses enter the next iteration, where execution feedback guides further updates. Our experiments cover Terminal-Bench 2, SWE-Bench Pro, and ProgramBench, using GPT-5.5 with Codex and GLM-5.2 with Claude Code. Across these benchmarks using GPT-5.5 with Codex, the heavy mode of HarnessPro achieves an average pass-rate gain of 2.0 percentage points and an average per-task cost reduction of 26.1% relative to RHO. This advantage also holds when using GLM-5.2 with Claude Code. Code is available at https://github.com/pzs19/HarnessPro', 'score': 25, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '0b86bb21aaa9154f', 'authors': ['Zhuoshi Pan', 'ZhiYuan Feng', 'Yukuo Cen', 'Honglin Lin', 'Junru Lu', 'Zhongxia Chen', 'Shuo Yang', 'H. Vicky Zhao', 'Jie Tang'], 'affiliations': ['Kuaishou Technology', 'Shanghai Jiao Tong University', 'Tsinghua University', 'University of Warwick', 'Z.AI Co., Ltd.'], 'pdf_title_img': 'assets/pdf/title_img/2610.26770.jpg', 'data': {'categories': ['#benchmark', '#agents', '#agi', '#training', '#optimization', '#plp'], 'emoji': '🧰', 'ru': {'title': 'Эволюция обвязок AI-агентов без разметки: выше качество, ниже цена', 'desc': 'HarnessPro — это метод эволюции обвязок (harness) для AI-агентов без использования размеченных данных. Кандидатные обвязки оцениваются на тестах, сгенерированных LLM, а специализированные агенты анализируют траектории выполнения и предлагают обновления. Вместо одной обвязки метод отбирает три варианта: lite (экономичный), medium (сбалансированный) и heavy (ориентированный на качество) с помощью нормализованного взвешенного отбора по квадратичному расстоянию. На бенчмарках Terminal-Bench 2, SWE-Bench Pro и ProgramBench режим heavy повышает pass-rate в среднем на 2.0 п.п. и снижает стоимость на задачу на 26.1% относительно RHO.'}, 'en': {'title': 'Evolving AI Harnesses for Cost-Effective Performance', 'desc': 'HarnessPro is a novel approach for evolving AI agent harnesses without the need for labeled data, aiming to enhance task success while minimizing execution costs. It evaluates candidate harnesses through tests generated by large language models (LLMs), allowing for performance improvements without relying on ground-truth solutions. The method employs trajectory diagnosis and a weighted selection process to create harnesses that are tailored for different performance and cost priorities. Experimental results demonstrate that HarnessPro significantly improves task performance and reduces costs across various benchmarks, showcasing its effectiveness in developing efficient AI agents.'}, 'zh': {'title': 'HarnessPro：无标签进化，提升AI任务表现', 'desc': 'HarnessPro是一种无标签的AI代理进化方法，旨在提高任务成功率并降低执行成本。该方法通过轨迹诊断和加权选择生成轻量级、平衡和高性能的变体。与传统的递归自我改进方法相比，HarnessPro在不依赖真实答案的情况下，通过生成的测试评估候选的执行方案。最终，HarnessPro提供了针对不同预算的多种执行方案，以优化性能和成本。'}}}, {'id': 'https://huggingface.co/papers/2610.26851', 'title': 'Manga2Animate: An Agentic Framework for Faithful Manga Animation with Script and Storyboard Planning', 'url': 'https://huggingface.co/papers/2610.26851', 'abstract': "Abstract Manga2Animate uses paired creator and reviewer agents to build script and storyboard representations from manga panels, yielding more faithful and consistent animations.  Generated by thinkingmachines/Inkling-Small Adapting existing manga into coherent animation that stays faithful to the source is a valuable yet challenging task. Existing methods either access the manga mainly through text, losing its characters and art style, or feed manga pages directly into video generation models, which misinterpret the manga's structure and produce incorrect storylines. In this paper, we propose Manga2Animate, a multi-agent framework that grounds every stage of generation in the source manga. We decompose the task into two intermediate representations, an animation script and a visual storyboard. Each representation is produced by a creator agent and reviewed against the source panels by a paired reviewer agent. We tailor representation-specific selection and dual-level feedback to progressively refine both before synthesizing the final animation. Extensive experiments and a user study demonstrate that Manga2Animate produces animations more faithful to the source manga and more consistent across shots than state-of-the-art approaches. Project page: https://annchenn.github.io/Manga2Animate/", 'score': 23, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': 'f2a830cf2ed51776', 'authors': ['Sheng-Wei Zhang', 'Hsi-An Chen', 'Yan-Ting Liou', 'Chih-Hsuan Chen', 'Shih-Chen Tseng', 'Yu-Lun Liu'], 'affiliations': ['Department of Computer Science, National Yang Ming Chiao Tung University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26851.jpg', 'data': {'categories': ['#story_generation', '#video', '#synthetic', '#multimodal', '#agents', '#cv'], 'emoji': '🎬', 'ru': {'title': 'Анимация манги, которая остаётся верной первоисточнику', 'desc': 'Статья представляет Manga2Animate — мультиагентную систему, которая превращает страницы манги в анимацию. Вместо прямой подачи панелей в video-генеративные модели задача разбивается на два промежуточных представления: сценарий анимации и визуальную раскадровку. Каждое представление создаётся агентом-создателем (creator agent) и проверяется парным агентом-рецензентом (reviewer agent), который сверяет его с исходными панелями, а отбор и двухуровневая обратная связь (dual-level feedback) постепенно уточняют оба артефакта. Эксперименты и пользовательское исследование показывают, что такой подход даёт анимации, более верные оригиналу и согласованные между кадрами, чем современные методы.'}, 'en': {'title': 'Transforming Manga into Faithful Animations with Multi-Agent Collaboration', 'desc': 'Manga2Animate is a multi-agent framework designed to convert manga into animations while preserving the original art style and storyline. It uses two types of agents: a creator agent that generates an animation script and a visual storyboard, and a reviewer agent that ensures these representations align with the source manga panels. This approach allows for a structured decomposition of the animation process, enabling tailored feedback and refinement at each stage. The results show that Manga2Animate produces animations that are more faithful to the original manga compared to existing methods.'}, 'zh': {'title': '漫画动画化：忠实于原作的创新之路', 'desc': 'Manga2Animate 是一个多智能体框架，旨在将漫画转换为动画，同时保持对原作的忠实度。该方法将任务分解为动画脚本和视觉故事板两个中间表示，由创作者智能体生成，并由配对的审查智能体进行审核。通过特定的选择和双层反馈机制，逐步优化这两个表示，最终合成出高质量的动画。实验结果表明，Manga2Animate 在忠实度和镜头一致性方面优于现有的最先进方法。'}}}, {'id': 'https://huggingface.co/papers/2610.23986', 'title': 'BlenderWorld: Benchmarking Visual Agents for 3D Creation from Real-World References', 'url': 'https://huggingface.co/papers/2610.23986', 'abstract': 'Abstract BlenderWorld is a benchmark for evaluating multimodal language models on realistic 3D creation tasks using rendered outputs and binary rubrics, revealing significant gaps in spatial coherence.  Generated by thinkingmachines/Inkling-Small Recent advances in multimodal large language models (MLLMs) have enabled them to act as autonomous agents, creating and editing 3D models via code or direct software manipulation. In practical workflows, these models must infer object shapes, materials, spatial layouts, and lighting from diverse references while strictly following instructions to reconstruct, modify, or design 3D content. However, existing benchmarks provide limited coverage of such open-ended requests across real-world scenarios. To bridge this gap, we introduce BlenderWorld, the first comprehensive benchmark dedicated to evaluating frontier models on realistic 3D creation tasks. BlenderWorld comprises 223 tasks spanning architecture, products, natural environments, and scientific visualization, driven by text, image, video, and structured specification inputs. To rigorously assess these complex deliverables, we establish a unified evaluation protocol: we render the submitted Blender projects from multiple viewpoints and evaluate them against 2,651 task-specific binary rubrics alongside holistic visual quality scores. Benchmarking thirteen frontier models reveals that GPT-6-Astra achieves the highest overall fused score of 79.9, followed by Opus-5 (73.0) and GPT-5.6-Sol (67.7). Ultimately, our findings reveal a critical bottleneck: while current models can parse broad instructions, they still profoundly struggle with fine-grained 3D spatial coherence and accurate structural reproduction in Blender, leaving substantial headroom for future 3D-native agentics.', 'score': 21, 'issue_id': 3437, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': '567630367fb178a7', 'authors': ['Xinyu Fang', 'Yuchi Wang', 'Weihao Yu', 'Rongyao Fang', 'Zhaohai Li', 'Zhixun Li', 'Tiancheng Gu', 'Xilin Wei', 'Yuhang Zang', 'Hongsheng Li', 'Dahua Lin', 'Guofeng Zhang', 'Shuai Bai', 'Zhibo Yang', 'Dayiheng Liu'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'Fudan University', 'National University of Singapore', 'The Chinese University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.23986.jpg', 'data': {'categories': ['#multimodal', '#agents', '#benchmark', '#3d', '#dataset', '#survey'], 'emoji': '🧊', 'ru': {'title': 'Модели понимают инструкции, но ещё не умеют строить 3D-мир без ошибок', 'desc': 'В статье представлен BlenderWorld — первый комплексный бенчмарк для оценки мультимодальных LLM (MLLM) на реалистичных задачах 3D-моделирования в Blender. Бенчмарк включает 223 задачи из областей архитектуры, продуктового дизайна, природных сред и научной визуализации, с входными данными в виде текста, изображений, видео и структурированных спецификаций. Качество результатов оценивается по рендерам с нескольких ракурсов с помощью 2 651 бинарной проверки и общей визуальной оценки. Тестирование тринадцати передовых моделей показало, что лучший результат достигает GPT-6-Astra (79,9 баллов), однако модели всё ещё плохо справляются с точной пространственной согласованностью и воспроизведением структуры 3D-объектов.'}, 'en': {'title': 'Bridging the Gap in 3D Creation with BlenderWorld', 'desc': 'BlenderWorld is a new benchmark designed to test multimodal language models (MLLMs) on realistic tasks involving 3D creation. It includes 223 diverse tasks that require models to generate and manipulate 3D content based on various inputs like text and images. The evaluation process uses multiple viewpoints and specific rubrics to assess the quality of the generated 3D models. Results show that while some models perform well overall, they struggle with maintaining spatial coherence and accurately reproducing structures, indicating room for improvement in future models.'}, 'zh': {'title': 'BlenderWorld：评估3D创作的多模态语言模型基准', 'desc': 'BlenderWorld是一个用于评估多模态语言模型在现实3D创作任务中的基准测试。该基准测试揭示了当前模型在空间一致性方面存在显著差距。BlenderWorld包含223个任务，涵盖建筑、产品、自然环境和科学可视化，使用文本、图像、视频和结构化规范作为输入。我们的评估结果显示，尽管现有模型能够理解广泛的指令，但在细致的3D空间一致性和准确的结构再现方面仍然面临重大挑战。'}}}, {'id': 'https://huggingface.co/papers/2610.26663', 'title': 'RoboValue: A Fine-Grained Sim-and-Real Benchmark for Unified Evaluation of Robotic Value Models', 'url': 'https://huggingface.co/papers/2610.26663', 'abstract': 'Abstract RoboValue introduces a benchmark to evaluate robotic value models across task-state understanding, progress tracking, failure recovery, and consistency in both simulated and real-world settings.  Generated by thinkingmachines/Inkling-Small Robotic value models assess task execution from visual observations and instructions, providing feedback for policy learning and execution monitoring. However, existing evaluations cover only selected aspects of execution understanding, leaving the reliability of value feedback insufficiently tested. We introduce RoboValue, a fine-grained sim-and-real benchmark for unified evaluation of robotic value models. Its framework evaluates four complementary capability dimensions through shared interfaces: task-state understanding, temporal progress monitoring, failure and recovery reasoning, and value consistency. Diagnostic trajectories and instruction variations test whether value judgments accurately reflect task requirements and changes throughout execution. RoboValue-Dataset covers 15 simulation and 20 real-world manipulation tasks, providing expert demonstrations for training and annotated trajectories for fine-grained evaluation. We evaluate representative robotic value models in zero-shot and one-shot settings under standard conditions and separate shifts in robot embodiment and environment. Our results reveal errors in fine-grained instruction grounding, history-dependent progress tracking, and recovery assessment, even in models with strong outcome and forward-progress scores. The same semantic subtask can also receive substantially different value gains across valid execution orders. These findings identify concrete targets for value supervision, while the dataset and public leaderboard support continued assessment of feedback reliability. The website is available at https://robovalue-benchmark.github.io/.', 'score': 20, 'issue_id': 3437, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '55dadffab9732c7f', 'pdf_title_img': 'assets/pdf/title_img/2610.26663.jpg', 'data': {'categories': ['#dataset', '#robotics', '#interpretability', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Проверяем, насколько можно доверять оценкам роботов: RoboValue', 'desc': 'В статье представлен RoboValue — бенчмарк для оценки robotic value models, которые по визуальным наблюдениям и инструкциям оценивают ход выполнения манипуляционных задач. Оценка охватывает четыре измерения: понимание состояния задачи, отслеживание прогресса во времени, анализ сбоев и восстановления и согласованность value-оценок. Датасет включает 15 симуляционных и 20 реальных задач с экспертными демонстрациями и размеченными траекториями, а тестирование проводится в режимах zero-shot и one-shot со сдвигами embodiment и среды. Результаты показывают, что даже сильные модели ошибаются в тонкой привязке инструкций, учёте истории прогресса и оценке восстановления, а одна и та же подзадача может получать разные value-оценки при допустимых порядках выполнения.'}, 'en': {'title': 'RoboValue: A New Standard for Evaluating Robotic Value Models', 'desc': "RoboValue is a new benchmark designed to evaluate robotic value models by examining their understanding of tasks, tracking progress, recovering from failures, and maintaining consistency in both simulated and real-world environments. It focuses on assessing how well these models interpret visual inputs and instructions to provide feedback for improving their learning and execution. The benchmark includes a comprehensive dataset with various tasks and expert demonstrations, allowing for detailed evaluation of the models' performance. The findings highlight significant issues in how these models handle instructions and track progress, pointing to areas that need improvement for better reliability in robotic applications."}, 'zh': {'title': 'RoboValue：统一评估机器人价值模型的基准', 'desc': 'RoboValue是一个基准，用于评估机器人价值模型在任务状态理解、进度跟踪、故障恢复和一致性等方面的表现。该基准通过共享接口评估四个互补的能力维度，确保在模拟和真实环境中都能进行统一评估。研究发现，现有的评估方法仅覆盖了执行理解的某些方面，导致价值反馈的可靠性不足。RoboValue数据集包含15个模拟和20个真实世界的操作任务，为训练提供专家演示，并为细致评估提供标注轨迹。'}}}, {'id': 'https://huggingface.co/papers/2610.25090', 'title': 'Think Visually Across Space and Time: Grounded Reasoning for Video Segmentation', 'url': 'https://huggingface.co/papers/2610.25090', 'abstract': 'Abstract TCoVP introduces a spatiotemporally grounded video reasoning chain that links entities to timestamped visual evidence for segmentation, improving reasoning and mask prediction across benchmarks.  Generated by thinkingmachines/Inkling-Small Video Reasoning Segmentation (VRS) requires a model to identify an implicitly described target and predict its pixel-level mask trajectory, while resolving the spatial relations and temporal events that determine the answer. Text-only Chain-of-Thought (CoT) can explain a target choice without making the underlying visual references explicit, leaving a video reference gap between linguistic inference and the evidence distributed across frames. We introduce Temporal Chain of Video Primitives (TCoVP), a spatiotemporally grounded form of Video CoT that organizes query-relevant observations into a chronological reasoning chain. Each primitive associates an entity reference with temporal support and timestamped spatial evidence, and the chain interleaves these references with language to guide reasoning about which entity is relevant, when the queried event holds, and where its evidence appears. The selected target primitives then provide box prompts and temporal support for video mask prediction. We construct TCoVP-SFT-15k and TCoVP-RL-13k to learn this representation through supervised fine-tuning and chain-aligned reinforcement learning. Extensive experiments across five VRS benchmarks and three model backbones demonstrate the strong performance of TCoVP, highlighting the effectiveness of organizing spatial and temporal evidence within the reasoning process. All models and code will be publicly released. Project page: https://victor-wjw.github.io/TCoVP/', 'score': 18, 'issue_id': 3436, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': 'fcb7ed23b3e7c374', 'authors': ['Junwei Wen', 'Deshui Miao', 'Guangming Lu', 'Ming-Hsuan Yang', 'Xin Li', 'Wenjie Pei'], 'affiliations': ['Harbin Institute of Technology, Shenzhen', 'Pazhou Lab (Huangpu)', 'Pengcheng Laboratory', 'University of California at Merced'], 'pdf_title_img': 'assets/pdf/title_img/2610.25090.jpg', 'data': {'categories': ['#benchmark', '#video', '#multimodal', '#open_source', '#dataset', '#rl', '#training', '#reasoning'], 'emoji': '🎬', 'ru': {'title': 'Рассуждай по кадрам: видеоцепочка, привязанная ко времени и месту', 'desc': 'В статье представлен метод TCoVP, который организует рассуждения модели для задачи сегментации видео по языковому запросу (VRS). Вместо текстовой цепочки рассуждений (CoT) модель строит хронологическую цепочку видеопримитивов, где каждая сущность связана с временными метками и пространственными координатами на кадрах. Выбранные примитивы используются как box-промпты и временная опора для предсказания масок объектов. Обучение проводится через supervised fine-tuning на датасете TCoVP-SFT-15k и через reinforcement learning на TCoVP-RL-13k, а эксперименты на пяти бенчмарках подтверждают эффективность подхода.'}, 'en': {'title': 'Linking Time and Space for Better Video Reasoning', 'desc': 'The paper introduces TCoVP, a new method for video reasoning that connects entities to visual evidence over time. It enhances the process of segmenting video content by creating a reasoning chain that organizes observations chronologically. This method addresses the gap between language-based reasoning and visual evidence by linking entities with their corresponding timestamps and spatial locations. The results show that TCoVP significantly improves mask prediction and reasoning accuracy across various benchmarks.'}, 'zh': {'title': '时空视频推理的新突破', 'desc': 'TCoVP提出了一种时空基础的视频推理链，将实体与时间戳的视觉证据连接起来，以改善推理和掩膜预测。该方法要求模型识别隐含描述的目标，并预测其像素级掩膜轨迹，同时解决决定答案的空间关系和时间事件。TCoVP通过将查询相关的观察组织成一个按时间顺序排列的推理链，填补了语言推理与分布在帧中的证据之间的空白。通过监督微调和链对齐的强化学习，我们构建了TCoVP-SFT-15k和TCoVP-RL-13k，以学习这种表示。'}}}, {'id': 'https://huggingface.co/papers/2610.26848', 'title': 'Where is Physical RSI capability from? An Observational Scaling Law of LLM-as-policy', 'url': 'https://huggingface.co/papers/2610.26848', 'abstract': 'Abstract Physical recursive self-improvement in vision-language agents is evaluated via multi-axis metrics, scaling analysis, and workspace interventions to assess improvement speed, limits, and reusable experience.  Generated by thinkingmachines/Inkling-Small In this paper, we systematically investigate the mechanisms, scaling behavior, and generalization of physical Recursive self-improvement. We introduce PhysRSI-eval to quantify physical RSI through a five-axis metric: First-Attempt Performance, Efficiency, Success, Budget and Improvement from failure. Different VLMs are evaluated on 18 manipulation tasks under a fixed interaction budget. The analysis of experimental results motivates the Physical Barrel Hypothesis: different capabilities may constrain different parts of improvement. The five-axis metrics also distinguish systems with close public benchmark averages and show that high scores need not come with early or efficient gains. We study observational scaling from two perspectives: predicting the relative performance of VLM agents from their public capabilities, and forecasting later progress from early physical feedback. Together, these analyses ask how quickly and how far an agent can improve. Moreover, we conduct workspace interventions and then analyze what improvement leaves behind. Removing history reduces late-round success, frozen workspaces remain useful on unseen layouts, and three cross-task cases achieve success earlier. The results suggest that scene-specific adaptation and reusable experience can coexist.', 'score': 16, 'issue_id': 3437, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '8e8dd0ac1e5a4823', 'authors': ['Zekai Li', 'Jiayi Yu', 'Jinlu Zhang', 'Luyang Niu', 'Zekun Qi', 'Jun Zheng', 'Xuchuan Chen', 'Dairu Liu', 'Yintianrun Zhang', 'He Wang', 'Li Yi'], 'affiliations': ['Galbot'], 'pdf_title_img': 'assets/pdf/title_img/2610.26848.jpg', 'data': {'categories': ['#multimodal', '#agents', '#agi', '#robotics', '#interpretability', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Агент учится на собственных ошибках: насколько быстро и далеко он способен улучшаться в физическом мире', 'desc': 'Статья исследует физическое рекурсивное самоулучшение (physical RSI) у vision-language агентов, которые управляют роботом в задачах манипуляции. Авторы вводят метрику PhysRSI-eval с пятью осями: качество первой попытки, эффективность, успешность, бюджет взаимодействия и улучшение после неудач, и оценивают VLM на 18 задачах при фиксированном бюджете. Гипотеза Physical Barrel Hypothesis утверждает, что разные способности ограничивают разные части процесса улучшения, а наблюдательный scaling-анализ позволяет прогнозировать прогресс агента по раннему физическому фидбэку. Эксперименты с интервенциями в рабочем пространстве показывают, что история важна для поздних успехов, а замороженные workspace полезны на новых раскладках, так что адаптация к конкретной сцене и переиспользуемый опыт могут сосуществовать.'}, 'en': {'title': 'Unlocking Improvement: The Power of Recursive Self-Improvement in Vision-Language Agents', 'desc': 'This paper explores how vision-language models (VLMs) can improve their physical manipulation abilities through a process called Recursive Self-Improvement (RSI). It introduces a new evaluation framework, PhysRSI-eval, which uses five metrics to measure performance, efficiency, and improvement in various tasks. The study finds that different capabilities can limit improvement in specific areas, leading to the Physical Barrel Hypothesis. Additionally, it shows that agents can benefit from past experiences while adapting to new environments, highlighting the balance between scene-specific adaptation and reusable knowledge.'}, 'zh': {'title': '物理递归自我改进的探索与评估', 'desc': '本文系统地研究了物理递归自我改进的机制、扩展行为和泛化能力。我们引入了PhysRSI-eval，通过五个维度的指标来量化物理递归自我改进，包括首次尝试表现、效率、成功率、预算和从失败中改进。实验结果分析提出了物理桶假设，表明不同能力可能限制改进的不同部分。我们的研究还探讨了观察性扩展，从公共能力预测VLM代理的相对表现，以及从早期物理反馈预测后续进展。'}}}, {'id': 'https://huggingface.co/papers/2610.17724', 'title': 'Evidence-First Agentic Verification', 'url': 'https://huggingface.co/papers/2610.17724', 'abstract': "Abstract Sauron is an evidence-first agentic verifier that independently validates claims against environment state and execution traces to improve rubric-based evaluation accuracy and reduce reinforcement-learning reward errors.  Generated by thinkingmachines/Inkling-Small Long-horizon, semi-verifiable agentic tasks often rely on rubric-based evaluation, but the evidence needed to assess these tasks can be spread across the environment state and the execution trace. A judge may overlook this evidence or accept unsupported claims, including an agent's own reports of success. When rubric verdicts serve as reinforcement-learning rewards, such errors can reinforce undesirable behavior. We introduce Sauron, an evidence-first agentic verifier that investigates both state and trace and relies on a claim only after independently validating it against its source. Bounded queries and joint investigation of related criteria reduce context use and redundant work, and each verdict carries an auditable receipt of its supporting evidence. Across 2,586 human-labeled criteria from 100 personal-assistant episodes, Sauron achieves the highest F1 of five verifiers on all eight backbones tested while costing less than Gandalf, the strongest baseline. With GPT-5.6 Sol, it reaches 0.96 F1 versus Gandalf's 0.92 at 23% lower cost, with a wider margin on process criteria. On a paired fault-injection suite covering 13 families, several of which simulate reward hacking, Sauron detects 97% of injected failures while flagging only 2% of clean controls, outperforming baselines even when they are given the full trace. On TRAIL, a benchmark for detecting and localizing real agent errors, Sauron leads both Gandalf and TRAIL's own judge on all three quality metrics.", 'score': 16, 'issue_id': 3437, 'pub_date': '2026-10-13', 'pub_date_card': {'ru': '13 октября', 'en': 'October 13', 'zh': '10月13日'}, 'hash': '7e868a8d699464b0', 'authors': ['Reza Sanayei', 'Razvan-Gabriel Dumitru', 'Sunjie Hou', 'MohammadHossein Rezaei', 'Haris Riaz', 'Robert Vacareanu', 'Minglai Yang', 'Ying Liu', 'Mihai Surdeanu', 'Daniel Yue Zhang'], 'affiliations': ['Scale AI', 'University of Arizona'], 'pdf_title_img': 'assets/pdf/title_img/2610.17724.jpg', 'data': {'categories': ['#agents', '#optimization', '#benchmark', '#rl', '#reasoning', '#security'], 'emoji': '🔍', 'ru': {'title': 'Не верь на слово: проверяй доказательства, а не отчёты агента', 'desc': 'Статья представляет Sauron — агентного верификатора, который проверяет утверждения агента, опираясь на состояние окружения и трассу выполнения, а не принимая отчёты агента на веру. Это важно для rubric-based оценки и reinforcement learning, где ошибочные награды могут закреплять нежелательное поведение, например reward hacking. Модель использует ограниченные запросы, совместную проверку связанных критериев и аудируемые receipts с доказательствами для каждого вердикта. На 2 586 размеченных людьми критериях Sauron показывает лучший F1 среди пяти верификаторов и обнаруживает 97% инжектированных ошибок при 2% ложных срабатываний.'}, 'en': {'title': 'Sauron: Elevating Evaluation Accuracy in Reinforcement Learning', 'desc': 'The paper introduces Sauron, a novel verifier designed to enhance the accuracy of rubric-based evaluations in reinforcement learning by independently validating claims against both the environment state and execution traces. This approach addresses the common issue where judges may overlook critical evidence or accept unsupported claims, which can lead to reinforcement of incorrect behaviors. Sauron employs bounded queries and a joint investigation strategy to minimize redundant work and ensure that each verdict is backed by verifiable evidence. In extensive testing, Sauron outperformed existing verifiers, achieving the highest F1 scores while also being more cost-effective, demonstrating its effectiveness in detecting errors and improving evaluation reliability.'}, 'zh': {'title': 'Sauron：提升强化学习评估准确性的证据验证器', 'desc': 'Sauron是一种以证据为基础的自主验证器，旨在独立验证环境状态和执行轨迹中的声明，以提高基于评分标准的评估准确性并减少强化学习中的奖励错误。它通过检查状态和轨迹来验证声明，确保只有在独立验证后才接受这些声明。Sauron在处理长时间的半可验证任务时，能够减少上下文使用和冗余工作，并为每个判决提供可审计的证据收据。通过在2586个人工标记的标准上测试，Sauron在所有测试的八个基础模型中实现了最高的F1分数，同时成本低于最强基线Gandalf。'}}}, {'id': 'https://huggingface.co/papers/2609.22332', 'title': 'AffordanceWAM: Affordance-Aware Joint World-Action Modeling for Robot Manipulation', 'url': 'https://huggingface.co/papers/2609.22332', 'abstract': 'Abstract AffordanceWAM uses affordance representations from human videos to jointly predict future scenes and robot actions, improving manipulation transfer without human action labels.  Generated by thinkingmachines/Inkling-Small Generalizable robot manipulation requires predicting how a scene will evolve, identifying where interactions are feasible, and determining how to act. Action-labeled robot videos directly supervise control but are costly and limited in diversity, whereas egocentric human videos capture diverse interactions but lack robot actions and differ in embodiment and appearance. We introduce AffordanceWAM, an affordance-aware generative World Action Model that represents object-centric spatiotemporal affordance through Scalar Affordance and Affordance Heatmap, within the generated future World. This representation grounds visual prediction in task-relevantant objects and interaction regions for action generation, and provides shared interaction targets across human and robot videos. Built on a pretrained video diffusion Transformer, AffordanceWAM uses separately parameterized World and Action Experts, coupled through Masked Joint Self-Attention, to jointly predict future RGB observations, Scalar Affordance fields, Affordance Heatmaps, and continuous robot actions under a unified flow-matching objective. Human videos supervise all three future-World streams, whereas robot trajectories additionally provide action supervision, enabling transfer without human action labels or retargeting. Experiments on RoboCasa, CALVIN ABCrightarrowD, and real-world manipulation demonstrate consistent gains over RGB-only and robot-data-only baselines. Under fixed robot supervision, RoboCasa performance improves monotonically as affordance-annotated human video scales. These results support affordance as an effective interface for both vision-language-action learning and human-to-robot transfer.', 'score': 16, 'issue_id': 3436, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': 'f858f481484f1e7f', 'authors': ['Jiadi You', 'Qize Yu', 'Yue Chen', 'Minghong Cai', 'Zhide Zhong', 'Yuran Wang', 'Bowen Ping', 'Jiaqi Liang', 'Zhenhao Shen', 'Haodong Yan', 'Yinchuan Li', 'Ruihai Wu', 'Xiaojuan Qi', 'Yingcong Chen'], 'affiliations': ['HKUST (GZ)', 'Knowin AI', 'National University of Singapore', 'Peking University', 'The Chinese University of Hong Kong', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.22332.jpg', 'data': {'categories': ['#robotics', '#video', '#transfer_learning', '#multimodal', '#architecture', '#cv', '#training', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Аффордансы как мост от видео людей к действиям роботов', 'desc': "В статье предлагается AffordanceWAM — генеративная World Action Model, которая учитывает аффордансы объектов, то есть где и как возможно взаимодействие, через Scalar Affordance и Affordance Heatmap. Модель построена на предобученном video diffusion Transformer с раздельными World и Action Experts, связанными через Masked Joint Self-Attention, и совместно предсказывает будущие RGB-кадры, аффордансы и непрерывные действия робота в рамках единого flow-matching objective. Видео людей используются для обучения предсказанию будущего сцены без разметки действий, а траектории робота дополнительно дают action supervision, что позволяет переносить навыки от человека к роботу. Эксперименты на RoboCasa, CALVIN и в реальных условиях показывают стабильный прирост над baseline'ами, обученными только на RGB или только на роботических данных."}, 'en': {'title': 'Empowering Robots with Human-Like Affordance Understanding', 'desc': 'AffordanceWAM is a machine learning model that enhances robot manipulation by using affordance representations derived from human videos. It predicts future scenes and robot actions without needing labeled human actions, which are often expensive and limited. The model employs a unique representation of object-centric affordances through Scalar Affordance and Affordance Heatmaps, allowing it to identify feasible interactions and generate appropriate actions. By leveraging a pretrained video diffusion Transformer and a unified flow-matching objective, AffordanceWAM demonstrates improved performance in various robotic tasks, showcasing the effectiveness of affordance in bridging human and robot learning.'}, 'zh': {'title': '可供性驱动的机器人操作预测', 'desc': 'AffordanceWAM是一种利用人类视频中的可供性表示来共同预测未来场景和机器人动作的方法，从而在没有人类动作标签的情况下改善操作转移。该模型通过标量可供性和可供性热图在生成的未来世界中表示物体中心的时空可供性。这种表示方法将视觉预测与任务相关的对象和交互区域结合起来，为动作生成提供了共享的交互目标。实验结果表明，AffordanceWAM在多种基准测试中表现优于仅使用RGB或机器人数据的基线，支持可供性作为视觉-语言-动作学习和人机转移的有效接口。'}}}, {'id': 'https://huggingface.co/papers/2610.25011', 'title': 'FineSplat: Fine Patches, Local Groups, Detailed Splats', 'url': 'https://huggingface.co/papers/2610.25011', 'abstract': 'Abstract FineSplat improves feed-forward 3D Gaussian Splatting by using fine-grained patches, dual grouping for efficient multi-view interaction, rendering-based feedback, and compact Gaussian generation to recover richer geometry and appearance efficiently.  Generated by thinkingmachines/Inkling-Small Feed-forward 3D Gaussian Splatting (3DGS) promises instant scene reconstruction with high-quality novel-view synthesis. Yet, fine-grained geometry and appearance remain difficult to recover, motivating us to revisit how feed-forward models represent, aggregate, and refine detailed visual information. We introduce FineSplat, a feed-forward 3DGS framework built around fine-grained image patches. Since global multi-view attention becomes prohibitively expensive at such high token resolutions, we develop a dual-grouping strategy that combines two complementary forms of locality: view-wise grouping enables efficient interaction among neighboring views, while 3D spatial grouping reconnects geometrically related tokens that may never have interacted under view-wise grouping by lifting them into the 3D scene space. We further leverage reconstruction error as direct feedback, providing an explicit rendering-based signal to recover fine-grained structures and appearance, thereby overcoming the limitations of one-pass feed-forward prediction. Finally, a compact Gaussian generation scheme preserves the benefits of fine-grained features without unnecessarily increasing the number of primitives. Together, these designs enable FineSplat to recover richer geometry and appearance while remaining efficient and compact, achieving state-of-the-art results by a substantial margin, under the same or smaller Gaussian budgets than existing methods.', 'score': 15, 'issue_id': 3437, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': 'f45104edefe8972c', 'authors': ['Hyebin Kim', 'Hwasik Jeong', 'Joonhyuk Park', 'Gyeongjin Kang', 'Jungwoo Kim', 'Younghyun Kim', 'Eunbyung Park'], 'affiliations': ['Sungkyunkwan University'], 'pdf_title_img': 'assets/pdf/title_img/2610.25011.jpg', 'data': {'categories': ['#architecture', '#3d'], 'emoji': '🧩', 'ru': {'title': 'Детальная 3D-сцена за один проход без лишних гауссиан', 'desc': 'Статья представляет FineSplat — feed-forward фреймворк для 3D Gaussian Splatting, который работает с мелкозернистыми патчами изображений, чтобы восстанавливать более детальную геометрию и внешний вид сцены. Чтобы избежать непомерных затрат глобального multi-view attention на высоком разрешении токенов, авторы используют dual-grouping: view-wise группировку для соседних видов и 3D spatial группировку, которая связывает геометрически близкие токены в пространстве сцены. Ошибка реконструкции используется как явный rendering-based сигнал обратной связи, что позволяет уточнять мелкие структуры и преодолевать ограничения одношагового предсказания. Компактная схема генерации гауссиан сохраняет преимущества детальных признаков без лишнего роста числа примитивов, достигая state-of-the-art результатов при том же или меньшем бюджете гауссиан.'}, 'en': {'title': 'FineSplat: Efficiently Recovering Rich Geometry and Appearance in 3D Synthesis', 'desc': 'FineSplat enhances the process of 3D Gaussian Splatting by utilizing fine-grained image patches and a dual-grouping strategy for better multi-view interactions. This approach allows for efficient aggregation and refinement of detailed visual information, addressing challenges in recovering fine geometry and appearance. By incorporating rendering-based feedback, FineSplat improves the accuracy of scene reconstruction and appearance synthesis. The method achieves superior results while maintaining efficiency and compactness, using fewer Gaussian primitives than previous techniques.'}, 'zh': {'title': 'FineSplat：高效恢复丰富几何与外观的前馈3D高斯点云技术', 'desc': 'FineSplat是一种改进的前馈3D高斯点云技术，通过使用细粒度图像补丁和双重分组策略来提高多视角交互的效率。该方法利用重建误差作为反馈信号，帮助恢复更精细的几何结构和外观，从而克服了传统前馈模型的局限性。FineSplat在保持高效和紧凑的同时，能够恢复更丰富的几何和外观，显著提升了性能。最终，FineSplat在相同或更小的高斯预算下，取得了领先的效果。'}}}, {'id': 'https://huggingface.co/papers/2610.25666', 'title': 'Frechet Forcing: Training Long-Horizon Streaming World Models from Short Clips', 'url': 'https://huggingface.co/papers/2610.25666', 'abstract': "Abstract Fréchet Forcing fine-tunes streaming video world models using self-generated rollouts and real-data statistics to prevent long-horizon drift without requiring teachers or long videos.  Generated by thinkingmachines/Inkling-Small Streaming video world models generate the future chunk by chunk, conditioned on their own past and a stream of actions. Trained on short clips, they drift once a rollout exceeds the training horizon, as prediction errors re-enter the context and compound. A common remedy is to train the model on its own rollouts via distribution matching distillation (DMD). For action-conditioned world models, the teacher becomes a bottleneck: an external video model is agnostic to the actions, whereas the model's own pretrained network drifts in the same manner as the student. We observe that a long rollout need not match a teacher, provided it remains a realistic continuation of its own scene that follows the commanded actions. Realism and scene fidelity can be measured against real-data statistics, which remain valid at any horizon, while action following is preserved by the model's conditional generation loss. We propose Fréchet Forcing, which fine-tunes a world model together with its deployed multi-step sampler under three constraints. Generative anchoring applies the flow-matching loss after a self-generated history ending on real data. Context fidelity, a Fréchet distance (FD) on latent statistics of the free rollout centred on each clip's own ground truth, keeps every rollout faithful to its scene. Reality matching, an FD to real frames in a frozen perceptual space, keeps the generated frames realistic. Because all three targets are derived from short real clips without comparing a rollout against a long recorded future, training requires no teacher, no online critic and no long videos. Fine-tuning MiniWorld-1B, pretrained on 253-frame clips, for at most 36 GPU-hours on 381-frame clips yields rollouts that remain stable beyond 4,000 frames and continue to follow their actions in both robot manipulation and camera-controlled exploration.", 'score': 15, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '43d224572fb0212d', 'pdf_title_img': 'assets/pdf/title_img/2610.25666.jpg', 'data': {'categories': ['#diffusion', '#robotics', '#video', '#synthetic', '#training', '#optimization'], 'emoji': '🎬', 'ru': {'title': 'Стабильные миры на длинных горизонтах без учителя', 'desc': "Статья предлагает метод Fréchet Forcing для дообучения потоковых video world models, которые генерируют видео чанк за чанком и склонны к дрейфу на длинных горизонтах. Вместо внешнего teacher-модели или online critic используется fine-tuning на собственных rollout'ах с тремя ограничениями: generative anchoring (flow-matching loss после самогенерированной истории, заканчивающейся реальными данными), context fidelity (Fréchet distance на латентных статистиках относительно ground truth клипа) и reality matching (FD к реальным кадрам в замороженном перцептивном пространстве). Такой подход не требует длинных видео и сохраняет следование действиям за счёт условной генерации. После дообучения MiniWorld-1B модель стабильно генерирует более 4000 кадров в задачах манипуляции роботом и исследования сцены камерой."}, 'en': {'title': 'Fréchet Forcing: Stabilizing Video Predictions Without Teachers', 'desc': 'The paper introduces Fréchet Forcing, a method to enhance streaming video world models by using self-generated rollouts and real-data statistics. This approach addresses the issue of long-horizon drift that occurs when models trained on short clips attempt to predict beyond their training limits. By applying generative anchoring, context fidelity, and reality matching, the model can maintain realism and scene fidelity without needing external teachers or lengthy video data. The results show that this fine-tuning allows the model to produce stable rollouts that accurately follow actions over extended sequences.'}, 'zh': {'title': 'Fréchet Forcing：稳定流媒体视频模型的创新方法', 'desc': '本文提出了一种名为Fréchet Forcing的方法，用于微调流媒体视频世界模型，以防止长时间预测漂移。该方法通过自生成的回放和真实数据统计来实现，而无需依赖教师模型或长视频。Fréchet Forcing在三个约束下优化模型，包括生成锚定、上下文保真度和现实匹配，从而确保生成的帧保持真实感和场景一致性。实验表明，该方法在短时间内训练后，模型能够稳定生成超过4000帧的回放，并继续跟随指令动作。'}}}, {'id': 'https://huggingface.co/papers/2610.26081', 'title': 'DeOverlay: A Benchmark and Source-Anchored Flow for Video Overlay Removal', 'url': 'https://huggingface.co/papers/2610.26081', 'abstract': 'Abstract DeOverlay uses source-anchored flow matching and visibility-normalized temporal aggregation to remove video overlays while preserving scene structure, and introduces DVTE-Bench for standardized evaluation.  Generated by thinkingmachines/Inkling-Small Video overlay removal aims to recover scenes obscured by subtitles, titles, and logos while preserving surrounding content. Existing methods use temporal propagation or source-conditioned generation, but can leave residual overlays and distort scene structure when useful source information is obscured. We propose DeOverlay, a source-anchored flow model that reconstructs the clean video from the source latent with fixed source guidance. Specifically, we train a shared velocity network along paired source-to-clean paths using region-weighted flow matching, enabling successive cor- rections from intermediate states. To select local source cues, we develop visibility-normalized temporal aggregation that excludes masked positions and averages the remaining observations. Global source context and edit-region embeddings complement these cues through additive condi- tioning, retaining a single video-token sequence. To evaluate scene recovery across diverse overlay conditions, we introduce DVTE-Bench, comprising 1,631 paired videos across eight text-overlay categories, with OCR-screened clean targets, frame-aligned pixel masks, and a common evaluation protocol. Experiments on the complete release show that DeOverlay outperforms four baselines on all five reconstruction and perceptual metrics, reducing Mask LPIPS and Mask VFID by 58.3% and 70.3%, respectively, relative to the strongest evaluated baseline. Additional qualitative examples demonstrate the removal of graphic logos and stickers. We will make the complete benchmark, evaluation code, and test outputs availabl. Project page:https://yahooo-m.github.io/DVTE-Bench/', 'score': 13, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '0f417736eefc9c68', 'authors': ['Deshui Miao', 'Yuhang Ma', 'Shaoyong Jia', 'Wenzhao Gao', 'Yue Zhang', 'Shaohui Jiao', 'Xin Li'], 'affiliations': ['ByteDance', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.26081.jpg', 'data': {'categories': ['#diffusion', '#benchmark', '#video', '#dataset', '#cv', '#open_source', '#optimization'], 'emoji': '🎬', 'ru': {'title': 'Убираем наложения и сохраняем сцену: чистое видео без субтитров и логотипов', 'desc': 'Статья представляет DeOverlay — модель на основе flow matching, которая убирает наложения (субтитры, титры, логотипы) из видео, восстанавливая исходную сцену. Модель опирается на source-anchored подход: обучает общую velocity network вдоль путей от исходного латентного представления к чистому видео с region-weighted flow matching. Для локальных подсказок используется visibility-normalized temporal aggregation, который игнорирует замаскированные пиксели и усредняет остальные наблюдения, а глобальный контекст добавляется через аддитивное кондиционирование. Также авторы выпускают бенчмарк DVTE-Bench из 1 631 пары видео, на котором DeOverlay превосходит четыре базовые модели по всем пяти метрикам, снижая Mask LPIPS и Mask VFID на 58,3% и 70,3%.'}, 'en': {'title': 'Clean Video Reconstruction: Removing Overlays with DeOverlay', 'desc': 'DeOverlay is a machine learning model designed to remove video overlays like subtitles and logos while keeping the underlying scene intact. It uses a source-anchored flow matching technique to accurately reconstruct clean video frames from a source latent representation. The model incorporates visibility-normalized temporal aggregation to focus on relevant visual cues while ignoring obscured areas. Additionally, the introduction of DVTE-Bench provides a standardized way to evaluate the effectiveness of overlay removal across various conditions, demonstrating significant improvements over existing methods.'}, 'zh': {'title': '去除视频覆盖，保留场景结构的创新方法', 'desc': 'DeOverlay是一种视频覆盖去除技术，旨在在保留场景结构的同时去除字幕、标题和标志等遮挡物。该方法使用源锚定流匹配和可见性归一化时间聚合，能够有效重建干净的视频。通过训练共享速度网络和区域加权流匹配，DeOverlay能够逐步修正中间状态，选择局部源线索。为了标准化评估，研究团队还推出了DVTE-Bench基准，包含多种覆盖条件下的配对视频，展示了DeOverlay在去除图形标志和贴纸方面的优越性能。'}}}, {'id': 'https://huggingface.co/papers/2610.26811', 'title': 'State World Models: Execute the Rules, Generate the Pixels', 'url': 'https://huggingface.co/papers/2610.26811', 'abstract': 'Abstract A framework called Stateful Harness separates rule-based world state updates from frozen video rendering to improve consistency in interactive world models with hidden state, evaluated via the WorldState-Bench benchmark.  Generated by thinkingmachines/Inkling-Small Existing world models can generate action-conditioned video from a single image. Many focus on camera movement, allowing users to explore the generated scene. However, navigation alone does not ensure that an action follows persistent rules when its outcome depends on state that is invisible in the current frame. We present Stateful Harness, a framework that separates world evolution from video rendering to support stateful and rule-governed interaction. It maintains an evolving world state under specified rules, renders each resulting event with a frozen video model, and uses the generated clip to update the world state for the next turn. At each turn, the harness resolves the action selected by the user and compiles the resulting event into an instruction, while a preview clip from an editable 3D scene provides spatial and camera guidance. To evaluate rule compliance, we build WorldState-Bench, a benchmark of 50 counterfactual twin pairs that share an initial frame and action but differ in hidden state and required outcome. Under rule-only prompting, the best of the 11 evaluated video backends produces the required endings for both cases in 32% of pairs. For MiniMax-H3, specifying the required endings raises this rate from 32% to 64%, while the full harness reaches 92% with the same frozen model. These results support separating rule execution from video rendering for world interactions with hidden state.', 'score': 12, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': 'a6145a83f2aaca3a', 'authors': ['Chan Yan Ki', 'Yanran Zhang', 'Wenzhao Zheng', 'Xiaofeng Wang', 'Zheng Zhu', 'Lei Chen', 'Jie Zhou', 'Jiwen Lu'], 'affiliations': ['Department of Automation, Tsinghua University, China', 'GigaAI'], 'pdf_title_img': 'assets/pdf/title_img/2610.26811.jpg', 'data': {'categories': ['#benchmark', '#video', '#synthetic', '#3d', '#agents', '#games', '#reasoning'], 'emoji': '🎬', 'ru': {'title': 'Правила решают, видео лишь показывает: разделяем логику мира и рендеринг', 'desc': 'Статья предлагает фреймворк Stateful Harness, который разделяет обновление состояния мира по заданным правилам и рендеринг видео с помощью замороженной video-модели. На каждом шаге harness определяет действие пользователя, формирует инструкцию для генерации, а сгенерированный клип используется для обновления world state. Для оценки соблюдения правил авторы создали WorldState-Bench из 50 контрфактуальных пар с одинаковым начальным кадром, но разным скрытым состоянием. Результаты показывают, что такое разделение заметно повышает долю корректных исходов: с 32% до 92% для модели MiniMax-H3.'}, 'en': {'title': 'Enhancing Interactive Worlds with Stateful Harness', 'desc': 'The paper introduces a framework called Stateful Harness, which enhances interactive world models by separating the updates of world states from video rendering. This approach allows for consistent rule-based interactions in scenarios where the state is not visible in the current frame. The framework maintains an evolving world state according to specified rules and uses a frozen video model to render events, ensuring that actions adhere to persistent rules. The effectiveness of this method is evaluated using the WorldState-Bench benchmark, demonstrating significant improvements in rule compliance when using the Stateful Harness compared to traditional methods.'}, 'zh': {'title': '分离规则执行与视频渲染，提升交互一致性', 'desc': 'Stateful Harness 是一个框架，它将基于规则的世界状态更新与静态视频渲染分开，以提高交互式世界模型的一致性。该框架在指定规则下维护一个不断演变的世界状态，并使用生成的视频片段来更新下一个回合的世界状态。通过 WorldState-Bench 基准测试，我们评估了规则合规性，发现分离规则执行与视频渲染可以显著提高隐藏状态下的世界交互效果。实验结果表明，使用完整的 State Harness 框架可以将规则合规率提高到 92%。'}}}, {'id': 'https://huggingface.co/papers/2610.22328', 'title': 'ACEdit: Stable Multi-Turn Image Editing via Asymmetric Conditioning', 'url': 'https://huggingface.co/papers/2610.22328', 'abstract': "Abstract Self-forcing training with teacher distillation and asymmetric conditioning stabilizes multi-turn image editing against accumulating distribution shifts.  Generated by thinkingmachines/Inkling-Small Image editing models produce impressive results for individual edits, but their quality often deteriorates over multiple editing turns. Each editing turn introduces small distribution shifts that accumulate over successive edits, creating a gap between the input distributions encountered during the editor's original training and multi-turn inference. We introduce a training scheme that makes multi-turn image editing stable under this accumulating distribution shift. A key is to force the editor to operate on its own outputs from previous editing turns during training, bringing the principle of Self-Forcing to image editing. The main challenge is that self-generated editing trajectories deviate from ground-truth trajectories, making direct supervision unreliable. We address this challenge through a distillation objective that leverages a teacher image editor to provide a reliable training signal when the model operates on its own previous outputs. We introduce an asymmetric conditioning scheme: while the student performs edits sequentially on its own outputs, the teacher remains anchored to the original clean image and receives a compound editing instruction. Experiments show substantially reduced degradation over long multi-turn sequences while maintaining editing quality and instruction adherence.", 'score': 11, 'issue_id': 3438, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': '824ce5591df84a8c', 'pdf_title_img': 'assets/pdf/title_img/2610.22328.jpg', 'data': {'categories': ['#training', '#diffusion', '#multimodal', '#optimization', '#synthetic'], 'emoji': '🎨', 'ru': {'title': 'Стабильная редакция изображений даже после десятков правок', 'desc': 'В статье предлагается метод обучения для многошаговой редакции изображений, который стабилизирует работу модели при накоплении сдвигов распределения. Ключевая идея — заставить редактор во время обучения работать с собственными результатами предыдущих шагов, по принципу Self-Forcing. Для надёжного сигнала используется дистилляция знаний: учительская модель (teacher image editor) получает составную инструкцию и опирается на исходное чистое изображение. Эксперименты показывают заметно меньшую деградацию качества на длинных последовательностях правок при сохранении точности следования инструкциям.'}, 'en': {'title': 'Stabilizing Multi-Turn Image Editing with Self-Forcing and Teacher Distillation', 'desc': 'This paper presents a novel training approach for multi-turn image editing that addresses the issue of quality degradation over successive edits. The method employs self-forcing training, where the model learns to edit its own outputs from previous turns, thus stabilizing the editing process against distribution shifts. To enhance training reliability, a teacher distillation technique is introduced, where a teacher model provides guidance while the student model edits its own outputs. The results demonstrate improved performance in maintaining quality and adherence to instructions during long sequences of edits.'}, 'zh': {'title': '自强训练：稳定多轮图像编辑的关键', 'desc': '本论文提出了一种自强训练方法，结合教师蒸馏和不对称条件化，以稳定多轮图像编辑，防止累积的分布偏移。传统的图像编辑模型在单次编辑时表现出色，但在多次编辑后质量往往下降。每次编辑都会引入小的分布偏移，这些偏移在连续编辑中累积，导致输入分布与模型训练时的分布之间产生差距。我们通过让编辑器在训练时使用自己之前的输出进行编辑，解决了这一问题，并通过教师模型提供可靠的训练信号，确保了多轮编辑的稳定性。'}}}, {'id': 'https://huggingface.co/papers/2606.31876', 'title': 'Harnessing Textual Refusal Directions for Multimodal Safety', 'url': 'https://huggingface.co/papers/2606.31876', 'abstract': 'Abstract MARS enables multimodal safety steering using only text-derived refusal directions, avoiding the need for multimodal safety data.  Generated by thinkingmachines/Inkling-Small Safety in Multimodal Large Language Models (MLLMs) depends on unsafe multimodal data for post-training alignment or activation steering. However, such data is hard to collect, must be gathered anew for each modality, and its collection and distribution raise ethical and legal concerns. In this work, we relax this constraint and investigate whether textual refusal directions, extracted directly from the LLM backbone, generalize across modalities (i.e., image, video). Preliminary findings confirm this ability, though effectiveness is conditioned by layer selection, steering strength, and cross-modal alignment, with the latter causing safe multimodal inputs to be spuriously steered toward refusal. Building on this, we introduce Modality-Agnostic Refusal Steering (MARS), a lightweight training-free approach that injects multimodal safety without the need for multimodal safety data. MARS corrects modality misalignment via activation centering, adaptively scales steering strength within a geometrically defined trust region, and selects the optimal intervention layer, operating at the first generated token. Evaluated on five SOTA MLLMs across safety, utility, and video jailbreak, MARS achieves consistent safety gains while preserving utility up to over-refusal. MARS reveals that safety-relevant structure is shared across modalities and that textual refusal directions are a powerful and underexplored foundation for multimodal alignment.', 'score': 11, 'issue_id': 3437, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '3b172c11515d22f8', 'pdf_title_img': 'assets/pdf/title_img/2606.31876.jpg', 'data': {'categories': ['#multimodal', '#ethics', '#video', '#security', '#cv', '#alignment'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность в любой модальности: отказ из текста работает и для картинок и видео', 'desc': 'Статья показывает, что направления отказа (refusal directions), извлечённые из текстовых данных в языковой модели (LLM), могут переноситься на изображения и видео в мультимодальных моделях (MLLM). Авторы предлагают MARS — метод без обучения, который корректирует сдвиг модальностей через activation centering, адаптивно масштабирует силу воздействия в геометрически заданной trust region и выбирает оптимальный слой для вмешательства. MARS применяется на первом генерируемом токене и не требует мультимодальных данных с небезопасным контентом. Эксперименты на пяти современных MLLM показывают рост безопасности при сохранении полезности модели и снижении числа ложных отказов.'}, 'en': {'title': 'MARS: Text-Driven Safety for Multimodal Models', 'desc': 'The paper introduces MARS, a method for enhancing safety in multimodal large language models (MLLMs) using only text-based refusal directions. This approach eliminates the need for collecting multimodal safety data, which is often difficult and raises ethical issues. MARS operates by correcting misalignments between modalities and adjusting the strength of safety steering based on a defined trust region. The findings suggest that textual refusal directions can effectively guide safety across different modalities like images and videos, leading to improved safety without sacrificing utility.'}, 'zh': {'title': 'MARS：无数据的多模态安全引导', 'desc': 'MARS是一种多模态安全引导方法，它仅依赖文本生成的拒绝指令，避免了对多模态安全数据的需求。该方法通过直接从大型语言模型（LLM）提取文本拒绝指令，探索其在不同模态（如图像和视频）中的通用性。初步研究表明，尽管效果受层选择、引导强度和跨模态对齐的影响，但MARS能够有效地纠正模态不对齐。MARS在不需要多模态安全数据的情况下，通过激活中心化和自适应调整引导强度，实现了多模态安全的注入。'}}}, {'id': 'https://huggingface.co/papers/2610.16782', 'title': 'LIBERO-Industry: Benchmarking Robotic Manipulation under Industrial Process Constraints', 'url': 'https://huggingface.co/papers/2610.16782', 'abstract': 'Abstract LIBERO-Industry introduces a benchmark translating industrial manufacturing constraints into controllable robot learning tasks to evaluate generalist policies under realistic production conditions.  Generated by thinkingmachines/Inkling-Small Industrial manipulation in flexible manufacturing, e.g., high-mix, low-volume (HMLV) electronics assembly, requires robot policies to adapt to changing products and production conditions. Such settings impose industrial process constraints, including product variants, moving material flows, finite execution windows, and tight geometric tolerances. However, existing evaluation frameworks do not systematically capture these constraints when assessing generalist robot policies. To address this gap, we introduce LIBERO-Industry, a novel benchmark built on the widely used robot learning benchmark LIBERO, that translates the aforementioned industrial constraints into controllable task conditions and measurable success criteria. Specifically, LIBERO-Industry comprises three classic task scenarios: Static-to-Dynamic (S2D) loading, Dynamic-to-Static (D2S) unloading, and Dynamic-to-Dynamic (D2D) transfer. The suites contain 216 tasks in total that systematically vary object geometry, conveyor speed, interaction-window duration, and geometric acceptance region size. Extensive experiments across five generalist robot policies (including vision-language-action models and world-action models) show that performance progressively degrades as industrial constraints are introduced and combined. Under a shared fine-tuning and evaluation protocol, the LIBERO-Industry co-training condition achieved higher observed target-transfer completion than the original-LIBERO condition.', 'score': 10, 'issue_id': 3437, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': 'e04a61f5a870b47b', 'authors': ['Ming Shin Cindy Sung', 'Duan Leijiahao', 'Haoxiang Wang', 'Boning Tan', 'Liangna Fu', 'Chao Tan', 'Yafu Li', 'Yulong Chen', 'Chaoqun Wan', 'Zhen Huang', 'Shuxian Liang', 'Xian-Sheng Hua'], 'affiliations': ['Institute of AI for Engineering, Tongji University', 'The Chinese University of Hong Kong', 'University of Aberdeen', 'University of Cambridge'], 'pdf_title_img': 'assets/pdf/title_img/2610.16782.jpg', 'data': {'categories': ['#dataset', '#optimization', '#robotics', '#benchmark'], 'emoji': '🏭', 'ru': {'title': 'Проверяем роботов-манипуляторов на реальных условиях фабрики, а не только в лаборатории', 'desc': 'В статье представлен LIBERO-Industry — новый бенчмарк для оценки универсальных роботизированных политик (generalist policies) в условиях реального промышленного производства. Он переводит ограничения гибкого производства, например сборки электроники малыми сериями, в управляемые задачи robot learning с измеримыми критериями успеха. Бенчмарк включает 216 задач трёх типов: загрузка со статичного на динамический конвейер, выгрузка с динамического на статичный и передача между динамическими конвейерами, варьируя геометрию объектов, скорость конвейера, длительность окна взаимодействия и размер допустимой области. Эксперименты с пятью моделями, включая VLA и world-action модели, показали, что качество падает по мере добавления и комбинирования ограничений, а co-training на LIBERO-Industry даёт лучший результат переноса на целевые задачи.'}, 'en': {'title': 'Adapting Robot Learning to Real-World Manufacturing Challenges', 'desc': 'LIBERO-Industry is a new benchmark designed to evaluate robot learning policies in realistic industrial manufacturing environments. It translates complex manufacturing constraints, such as product variations and material flow, into specific tasks for robots to learn. The benchmark includes three main scenarios: loading, unloading, and transferring objects, with a total of 216 tasks that vary in complexity. Experiments show that as more industrial constraints are added, the performance of generalist robot policies decreases, highlighting the importance of adapting to real-world production conditions.'}, 'zh': {'title': 'LIBERO-Industry：工业约束下的机器人学习新基准', 'desc': 'LIBERO-Industry是一个新的基准，旨在将工业制造中的约束转化为可控的机器人学习任务，以评估通用策略在现实生产条件下的表现。该基准特别关注灵活制造中的小批量电子组装，要求机器人策略能够适应不断变化的产品和生产条件。LIBERO-Industry包含三种经典任务场景，并系统地变化对象几何形状、传送带速度和交互窗口持续时间等因素。实验结果表明，随着工业约束的引入和组合，通用机器人策略的性能逐渐下降。'}}}, {'id': 'https://huggingface.co/papers/2610.26453', 'title': 'Remembering Has a Price: Learning Memory Worth under Resource Constraints', 'url': 'https://huggingface.co/papers/2610.26453', 'abstract': 'Abstract TokenWorth is a lightweight online memory framework that learns which past experiences are worth retaining and reusing under tight resource constraints, improving lifelong agent success while reducing token usage.  Generated by thinkingmachines/Inkling-Small Lifelong agents continually accumulate and reuse experience to improve after deployment, yet in practice they often operate under tight generation, interaction, and memory budgets. Under such stringent joint constraints, we find that existing lifelong-memory methods can become ineffective, with several sophisticated approaches offering little advantage over simple retrieval or even no-memory agents. This reveals a more fundamental problem: resource scarcity makes each memory decision more consequential. When only a small amount of past experience can be retained or reused and opportunities for reasoning and recovery are limited, retrieving a relevant but ineffective memory can consume scarce context and hinder downstream execution. The key challenge is therefore not simply to retrieve relevant experience, but to determine which experiences are actually worth retaining and reusing. To address this challenge, we propose TokenWorth, a lightweight online memory framework that learns query-dependent memory worth from sparse execution feedback and applies it consistently to memory retrieval and bounded memory management. Across three LifelongAgentBench environments and both local and API-based deployments, TokenWorth achieves the highest task success rate while using the fewest output tokens among the evaluated methods. These results suggest that effective lifelong adaptation under resource constraints depends not on remembering more, but on learning what is worth remembering. Our code is publicly available at https://github.com/AIGNLAI/TokenWorth.', 'score': 10, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '82a953f9b05f26c9', 'authors': ['Guannan Lai', 'Zi-Yang Bai', 'Jun-Peng Jiang', 'Han-Jia Ye'], 'affiliations': ['Nanjing University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26453.jpg', 'data': {'categories': ['#agents', '#rag', '#optimization', '#inference'], 'emoji': '🧠', 'ru': {'title': 'Важно не помнить больше, а понимать, что стоит помнить', 'desc': 'Статья представляет TokenWorth — лёгкий онлайн-фреймворк памяти для lifelong-агентов, который в условиях жёстких ограничений по ресурсам учится оценивать, какой прошлый опыт стоит сохранять и повторно использовать. Авторы показывают, что при нехватке контекста и бюджета на память многие сложные LLM-методы работают не лучше простого retrieval или агента без памяти. Ключевая идея — обучать query-зависимую ценность памяти (memory worth) на основе разреженного feedback от выполнения задач и применять её и для retrieval, и для ограниченного управления памятью. Эксперименты в трёх средах LifelongAgentBench показывают, что TokenWorth даёт наибольший процент успешно решённых задач при наименьшем количестве выходных токенов.'}, 'en': {'title': 'Smart Memory Management for Lifelong Learning', 'desc': 'TokenWorth is a novel online memory framework designed for lifelong agents that need to manage limited resources effectively. It focuses on learning which past experiences are valuable enough to retain and reuse, rather than simply storing more memories. By utilizing sparse execution feedback, TokenWorth optimizes memory retrieval and management, ensuring that agents can adapt successfully while minimizing token usage. The framework demonstrates superior performance in various environments, highlighting the importance of discerning memory worth in resource-constrained scenarios.'}, 'zh': {'title': '学习值得记住的经验，提升终身智能体的成功率', 'desc': 'TokenWorth 是一个轻量级的在线记忆框架，旨在学习哪些过去的经验值得保留和重用，以提高终身智能体的成功率，同时减少令牌使用。在资源有限的情况下，终身智能体需要不断积累和重用经验，但现有的方法在这种严格的约束下往往效果不佳。TokenWorth 通过稀疏的执行反馈学习记忆的价值，从而优化记忆检索和管理，确保在有限的资源下实现最佳的任务成功率。研究表明，有效的终身适应依赖于学习哪些经验值得记住，而不是单纯地记住更多的内容。'}}}, {'id': 'https://huggingface.co/papers/2610.23600', 'title': 'Learning to Discriminate Scene Structures Makes Self-Supervised Depth Learning Scalable', 'url': 'https://huggingface.co/papers/2610.23600', 'abstract': 'Abstract The MaSS framework improves self-supervised monocular depth estimation across diverse scenes by separating structural representations from contextual features and using a scene-structure discrimination objective, enabling scalable mixed-domain training and strong zero-shot generalization.  Generated by thinkingmachines/Inkling-Small Self-supervised monocular depth estimation is appealing for its potential to scale with unlabeled data, yet existing methods often degrade when trained on diverse scenes. This study finds that, under self-supervision, models tend to encode dataset-specific structural biases rather than transferable scene geometry, leading to cross-domain optimization conflicts. To address this issue, this study proposes the MaSS framework, aiming to make self-supervised depth learning scalable to diverse data. MaSS introduces a dedicated structural representation pathway explicitly decoupled from contextual features, which is guided by a novel scene-structure discrimination objective to learn generalized, layout-aware structural representations for depth decoding. Trained and evaluated on four diverse datasets, both individually and jointly, MaSS substantially outperforms prior self-supervised methods and is the first to consistently benefit from mixed-domain training. Zero-shot evaluation on eight additional datasets further demonstrates its remarkable generalizability, particularly on those entirely out-of-distribution scenes. The source code is publicly available at https://mias.group/MaSS.', 'score': 10, 'issue_id': 3436, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': 'a1f2bf10d7728251', 'pdf_title_img': 'assets/pdf/title_img/2610.23600.jpg', 'data': {'categories': ['#transfer_learning', '#architecture', '#cv', '#training', '#optimization'], 'emoji': '📐', 'ru': {'title': 'Учим модель видеть геометрию сцены, а не привычки датасета', 'desc': 'Статья посвящена самообучаемой оценке глубины по одному монокулярному изображению, которая хорошо масштабируется на неразмеченных данных, но обычно ухудшается при обучении на разнородных сценах. Авторы показывают, что модели под самообучением запоминают специфичные для датасета структурные смещения, а не переносимую геометрию сцены, что приводит к конф
