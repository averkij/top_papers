ity to enhance video generation quality.'}, 'zh': {'title': '提升视频生成的物理真实感', 'desc': '本文介绍了一个名为世界嵌入基准的研究，包含8000个来自80个物理领域的受控模拟案例，涉及流体力学、固体力学、动力学以及光学与电磁学。每个案例都配有渲染视频和基于模拟的物理注释，支持文本-视频检索、物理属性回归和多选视频描述配对分类等任务。研究发现，预训练的全模态嵌入模型在检索和配对分类上表现较差，而轻量级探针能够从冻结的视频嵌入中恢复有用的物理信息。通过与物理特定的视频-文本对进行持续对比训练，可以改善检索和配对分类的效果，但会降低物理属性回归的性能，揭示了对齐与定量信息恢复之间的权衡。'}}}, {'id': 'https://huggingface.co/papers/2610.02521', 'title': 'Spatial Memory Intelligence: Endowing World Models with Understanding-Driven Long-Term Memory', 'url': 'https://huggingface.co/papers/2610.02521', 'abstract': 'Abstract  Long-video generation and world models have shown strong potential for interactive entertainment and embodied simulation by predicting future observations conditioned on user actions and historical memory. However, as memory sequences grow longer and their structures become increasingly complex, managing long-range spatial context becomes increasingly challenging, calling for a more intelligent and systematic memory-management strategy. Building on the advancing spatial reasoning capabilities of multimodal large language models (MLLMs) and the broader vision of unified models, we propose Spatial Memory Intelligence (SMI), the first framework to systematically employ an understanding model for spatial-memory management in long-video world models. SMI introduces four coordinated atomic operations: spatial clustering, within-cluster sparsification, action-aware retrieval, and reliability-aware filtering. Extensive experiments across multiple baselines, benchmarks, and world-model backbones demonstrate the effectiveness and generalizability of SMI, achieving comprehensive improvements in memory sparsity, generation stability, and spatial consistency.', 'score': 40, 'issue_id': 3375, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd5ef2b7425959668', 'authors': ['Ying Yang', 'Guiyu Zhang', 'Lianghua Huang', 'Chang Nie', 'Chenyang Si', 'Haofan Wang', 'Shaoshuai Shi', 'Li Jiang'], 'affiliations': ['Alibaba Group', 'Lovart AI', 'Nanjing University', 'Shenzhen Loop Area Institute', 'The Chinese University of Hong Kong, Shenzhen', 'Voyager Research, Didi Chuxing'], 'pdf_title_img': 'assets/pdf/title_img/2610.02521.jpg', 'data': {'categories': ['#video', '#multimodal', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Умное управление памятью для моделей предсказания длинных видео', 'desc': 'В этой работе предлагается Spatial Memory Intelligence (SMI) — первая система для интеллектуального управления пространственной памятью в моделях мира для генерации длинных видео. SMI использует возможности мультимодальных больших языковых моделей для организации сложных последовательностей памяти через четыре операции: пространственную кластеризацию, разреживание внутри кластеров, поиск с учётом действий и фильтрацию по надёжности. Система позволяет эффективнее управлять долгосрочным пространственным контекстом, что критично при растущей длине видеопоследовательностей. Экспериментальные результаты подтверждают улучшение разреженности памяти, стабильности генерации и пространственной согласованности во всех протестированных вариантах.'}, 'en': {'title': 'Enhancing Long-Video Generation with Spatial Memory Intelligence', 'desc': 'This paper introduces Spatial Memory Intelligence (SMI), a novel framework designed to enhance memory management in long-video generation and world models. SMI leverages the capabilities of multimodal large language models to improve how spatial context is handled over extended sequences. It incorporates four key operations: spatial clustering, within-cluster sparsification, action-aware retrieval, and reliability-aware filtering to optimize memory usage. The results show that SMI significantly improves memory efficiency, stability in video generation, and consistency in spatial representation across various benchmarks.'}, 'zh': {'title': '空间记忆智能：长视频生成的新策略', 'desc': '本论文提出了一种新的框架，称为空间记忆智能（SMI），用于管理长视频生成中的空间记忆。随着记忆序列的增长，管理长距离空间上下文变得越来越复杂，因此需要更智能的记忆管理策略。SMI利用多模态大语言模型的空间推理能力，引入了四种协调的基本操作，以提高记忆的稀疏性、生成的稳定性和空间的一致性。通过广泛的实验，SMI在多个基准和世界模型中展示了其有效性和通用性。'}}}, {'id': 'https://huggingface.co/papers/2610.03367', 'title': 'Multilingual GSM-Symbolic: What determines capability transfer across languages?', 'url': 'https://huggingface.co/papers/2610.03367', 'abstract': "Abstract  We understand little about how capabilities acquired in one language carry over to another, or what governs this transfer: evaluations rely on incomparable, saturation-prone datasets and rarely examine its determinants jointly. Identifying what predicts transfer would let us avoid exhaustive evaluation across all language pairs and let developers target the factors that limit performance in low-resource languages. To evaluate cross-lingual capability transfer, we introduce Multilingual GSM-Symbolic, an extensible multilingual mathematical dataset covering 30,000 item-matched question-answer pairs and spanning 15 languages. It utilises symbolic templates to prevent overfitting and ensure generalisation by allowing generation of millions of high-quality variations from a single sample. Using Multilingual GSM-Symbolic, we quantify the largest determinants of capability as model size (β= 1.77), language resource level (β= 0.77), reasoning (β= 0.67) and typological distance (β= -0.25). This joint estimation allows these determinants to be expressed in terms of one another: a 32B model evaluated in Marathi performs like a 10B model in English. Our findings have important implications for model developers, showing that model size and reasoning narrow the performance gap between low- and high-resource languages (β= -0.27 and β= -0.20, respectively), while similar levers have little or no effect on typologically distant languages.   Overall, our analysis framework explains 92% of between-language variation, but only 23% of the model-by-language variation, and predicts a model's performance on an unseen language within 6.0pp (r=.96). Incorporating measurements from just 10 templates in the target language reduces this to 4.19pp, enabling reasonable estimates of performance with little or no downstream dataset.", 'score': 39, 'issue_id': 3376, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '72eac1bf20a92467', 'authors': ['Kenneth Enevoldsen', 'Riley Herchert', 'Sofie Mosegaard', 'Dan Saattrup Smart', 'Simon Enni', 'Isaac Chung', 'Sofie Bruun', 'Ayush Sunil Munot', 'Max Müller-Eberstein', 'Adnan El-Assadi', 'Elisa Bassignana', 'Gianluca Barmina', 'Hafsteinn Einarsson', 'Iben Nyholm Debess', 'Linda Freienthal', 'Lukas Galke Poech', 'Mike Zhang', 'Nicolas Legrand', 'Vladimir Salnikov', 'Yevhen Kostiuk', 'Zafar Hussain', 'Sagandeep Kaur', 'Agnes Toftgård', 'Marie Mattson', 'Kristoffer Nielbo'], 'affiliations': ['Aarhus University', 'Alexandra Institute', 'Bocconi University', 'Danish Foundation Models', 'Foam.io', 'IT University of Copenhagen', 'Indian Institute of Technology Kharagpur', 'Indian Institute of Technology Madras', 'Massachusetts General Hospital', 'National Library of Sweden', 'Syv.ai', 'The University of Tokyo', 'University of Alabama', 'University of Copenhagen', 'University of Iceland', 'University of Southern Denmark', 'University of the Faroe Islands', 'Zendesk'], 'pdf_title_img': 'assets/pdf/title_img/2610.03367.jpg', 'data': {'categories': ['#math', '#multilingual', '#benchmark', '#reasoning', '#low_resource', '#dataset', '#science', '#transfer_learning'], 'emoji': '🌍', 'ru': {'title': 'Размер модели и рассуждение преодолевают барьеры между языками', 'desc': 'Исследование изучает, как способности, приобретённые языковой моделью на одном языке, переносятся на другие языки. Авторы создали Multilingual GSM-Symbolic — расширяемый мультиязычный датасет с 30 000 пар вопрос-ответ по математике на 15 языках, используя символические шаблоны для предотвращения переобучения. Они количественно определили ключевые факторы, влияющие на кроссязычный трансфер: размер модели (β=1.77), объём языковых ресурсов (β=0.77), способность к рассуждению (β=0.67) и типологическое расстояние между языками (β=-0.25). Предложенный анализ объясняет 92% вариативности между языками и позволяет предсказать производительность модели на неизученном языке с точностью до 6 процентных пункта.'}, 'en': {'title': 'Unlocking Language Transfer: Key Factors for Multilingual Model Performance', 'desc': 'This paper explores how skills learned in one language can be applied to another, focusing on the factors that influence this transfer. It introduces the Multilingual GSM-Symbolic dataset, which consists of 30,000 question-answer pairs across 15 languages, designed to help evaluate cross-lingual capability transfer. The study identifies key determinants of performance, such as model size and reasoning ability, and shows how these factors can help improve outcomes in low-resource languages. The findings suggest that understanding these determinants can significantly enhance model performance across different languages, especially when leveraging symbolic templates for better generalization.'}, 'zh': {'title': '跨语言能力转移的关键因素', 'desc': '这篇论文探讨了语言能力如何在不同语言之间转移，以及影响这种转移的因素。研究者们引入了多语言GSM-符号数据集，包含30,000对匹配的问题和答案，覆盖15种语言，以评估跨语言能力转移。通过分析，发现模型大小、语言资源水平、推理能力和语言类型距离是影响能力转移的主要因素。研究结果对模型开发者具有重要意义，表明模型大小和推理能力可以缩小低资源语言与高资源语言之间的性能差距。'}}}, {'id': 'https://huggingface.co/papers/2610.01257', 'title': 'Science Utopia? Closed-Loop LLM Simulation of Academic Research Ecosystems', 'url': 'https://huggingface.co/papers/2610.01257', 'abstract': 'Abstract  Scientific progress emerges from a longitudinal ecosystem in which researchers, institutions, funding agencies, collaboration networks, and the scientific literature co-evolve. As AI becomes increasingly involved throughout the scientific research cycle, understanding these interconnected and evolving processes becomes increasingly important. We introduce SciUtopia, a persistent, closed-loop LLM-agent simulation framework for studying academic research ecosystems. SciUtopia models interconnected scientific processes such as research-direction choice, collaboration, submission, peer review, resubmission, citation, funding, and researcher attrition, while maintaining evolving states across simulated years. Its configurable institutional mechanisms and information channels provide a controlled testbed for matched counterfactual experiments and targeted interventions. Across 61 simulation worlds, SciUtopia simulates over 40,000 researchers from 8,000 institutions, producing around 400,000 publication decisions and 1.2 million LLM-generated peer reviews. Using these longitudinal simulations, we find that rejection-driven resubmission substantially amplifies reviewer burden beyond population growth alone, cautious exploration balances citation impact with career success and long-term topic diversity, and resource inequality can emerge even without detectable cumulative advantage from narrowly winning early funding. Code is available at https://github.com/Ahren09/ScienceUtopia.', 'score': 37, 'issue_id': 3375, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '52fa4cddf8c9a0dd', 'authors': ['Yiqiao Jin', 'Yiyang Wang', 'Lucheng Fu', 'Bing He', 'Siheng Xiong', 'Yijia Xiao', 'B. Aditya Prakash', 'Josiah Hester', 'Srijan Kumar', 'James Evans', 'Jindong Wang'], 'affiliations': ['Georgia Institute of Technology', 'University of California, Los Angeles', 'University of Chicago', 'William & Mary'], 'pdf_title_img': 'assets/pdf/title_img/2610.01257.jpg', 'data': {'categories': ['#open_source', '#science'], 'emoji': '🔬', 'ru': {'title': 'Симуляция научной экосистемы для понимания динамики академических исследований', 'desc': 'В работе представлена SciUtopia — симуляционная платформа на основе LLM-агентов для изучения экосистемы научных исследований. Система моделирует взаимосвязанные процессы в науке: выбор направления исследований, сотрудничество, рецензирование, цитирование и финансирование, отслеживая их эволюцию на протяжении симулированных лет. На основе 61 виртуального мира с 40,000 исследователей авторы провели более 1,2 миллиона моделирований процесса peer review и обнаружили ключевые закономерности: отклонения статей увеличивают нагрузку на рецензентов, осторожный выбор тем балансирует успех и разнообразие науки, а неравенство ресурсов возникает независимо от кумулятивного преимущества на ранних этапах.'}, 'en': {'title': 'Exploring Academic Research Dynamics with SciUtopia', 'desc': 'This paper presents SciUtopia, a simulation framework designed to study the dynamics of academic research ecosystems using large language models (LLMs). It models various interconnected processes in scientific research, such as collaboration, peer review, and funding, over simulated years with a large number of researchers and institutions. The framework allows for controlled experiments to understand how different factors influence research outcomes and reviewer workloads. Key findings indicate that resubmission practices increase reviewer burden and that resource inequality can develop without prior advantages in funding.'}, 'zh': {'title': '探索学术研究生态的未来', 'desc': '本论文介绍了SciUtopia，这是一个用于研究学术研究生态系统的长期闭环大语言模型（LLM）代理模拟框架。该框架模拟了研究方向选择、合作、提交、同行评审、重新提交、引用、资金和研究人员流失等相互关联的科学过程。通过61个模拟世界，SciUtopia模拟了超过40,000名研究人员和8,000个机构，生成了约400,000个出版决策和120万条LLM生成的同行评审。研究发现，拒稿驱动的重新提交显著增加了评审负担，谨慎探索在引用影响与职业成功之间取得平衡，资源不平等即使在没有明显的早期资金优势的情况下也会出现。'}}}, {'id': 'https://huggingface.co/papers/2610.03195', 'title': 'Source Preference in the Wild: How LLM Agents Favor Items by Source, and How to Reduce It', 'url': 'https://huggingface.co/papers/2610.03195', 'abstract': "Abstract  As LLM agents decide on users' behalf which product to buy, which hotel to book, or which paper to cite, a preference for items from certain sources (the sites or services they come from) shapes what users receive and which sources are selected. We study source preference in end-to-end search with 12 agent models across three domains. Comparing items from different sources that satisfy the same requirements at the same position, we find that each model prefers some sources and avoids others in every domain, largely agreeing on which. This preference can outweigh how well items satisfy the request: an item satisfying one requirement fewer is selected about two-thirds of the time when it comes from a preferred source and the better one from a dispreferred source, but almost never in the reverse case. The information identifying an item's source affects selection by itself: hiding it weakens the preference, and relabeling an item with a preferred source raises its selection rate. We test two routes to this preference: training that rewards better items can make a source a shortcut for requirement satisfaction, and missing information can trigger preconceptions about the source. Supplying missing information or a prompt countering these preconceptions reduces source preference.", 'score': 33, 'issue_id': 3374, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'e485340c9be9dc3f', 'authors': ['Jonghyun Song', 'Haewon Park', 'Jeonghoon Shim', 'Woojung Song', 'Yohan Jo'], 'affiliations': ['Graduate School of Data Science, Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2610.03195.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Скрытая предвзятость: как LLM агенты отдают предпочтение источникам перед качеством', 'desc': 'В работе исследуется предвзятость LLM агентов к источникам информации при выборе товаров, отелей и других объектов от пользователей. Авторы показали, что все 12 протестированных моделей демонстрируют устойчивые предпочтения к определённым источникам независимо от качества предложений, причём эта предвзятость часто важнее соответствия требованиям пользователя. Источник предвзятости связан с тем, что идентификация источника влияет на выбор самостоятельно: модели используют источник как ярлык для предположения о качестве, а при недостающей информации активируются предубеждения. Предложенные решения включают явное предоставление недостающей информации и направляющие подсказки, которые ослабляют эффект источника в рекомендациях.'}, 'en': {'title': 'Source Matters: How LLM Agents Choose What to Recommend', 'desc': 'This paper investigates how large language model (LLM) agents make decisions based on the sources of products, hotels, or papers they recommend. The study reveals that these agents show a strong preference for certain sources, which can significantly influence their selections, even when other items better meet user requirements. The findings indicate that the source of an item can be more important than its quality, as agents often choose items from preferred sources over better options from less favored ones. Additionally, the research explores how training and information availability can alter these source preferences, suggesting that providing more context can help mitigate biases in selection.'}, 'zh': {'title': '来源偏好影响选择结果', 'desc': '本研究探讨了大型语言模型（LLM）代理在选择产品、酒店或引用文献时的来源偏好。我们分析了12个代理模型在三个领域中的端到端搜索表现，发现每个模型在不同领域中对某些来源表现出偏好。即使某个项目满足的要求较少，如果它来自一个偏好的来源，用户仍然更可能选择它。研究还表明，隐藏信息会削弱这种偏好，而重新标记项目的来源则会提高其选择率。'}}}, {'id': 'https://huggingface.co/papers/2609.38123', 'title': 'HelixWorld: A Real-time Interactive Audio-Visual World Model', 'url': 'https://huggingface.co/papers/2609.38123', 'abstract': 'Abstract  World simulation is inherently multisensory, demanding synchronized visual and acoustic dynamics in real time. Yet prevailing interactive world models remain strictly silent, focusing exclusively on visual rendering and control while overlooking the acoustic dimension. We present HelixWorld, a real-time interactive audio-visual world model where visual scenes and camera-grounded spatial stereo sound co-evolve natively under user interaction. We curate a high-fidelity spatial audio-visual dataset with true stereo acoustics and metric camera poses, upon which we pre-train a bidirectional teacher conditioned on 6-DoF camera trajectories and user actions. To enable low-latency causal interaction, we distill the teacher into a few-step streaming student via an online trajectory distillation loss, sustaining drift-free joint audio-visual rollouts at 24 FPS on a single GPU. Furthermore, we formalize spatial-acoustic consistency and introduce HelixBench to evaluate whether synthesized sound fields faithfully track dynamic viewpoint motion. Extensive experiments demonstrate that HelixWorld matches state-of-the-art silent world models in visual fidelity and responsiveness, while significantly surpassing existing baselines in camera-aligned spatial-acoustic immersion.', 'score': 31, 'issue_id': 3375, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'd266196e1dd3869c', 'authors': ['Lei Ke', 'Jiahao Pan', 'Zeyue Tian', 'Jiaming Wang', 'Haoyuan Huang', 'Kam Man Wu', 'Pengjun Fang', 'Hongyu Liu', 'Chenyang Qi', 'Lin Wang', 'Ruibin Yuan', 'Weijia Chen', 'Fangneng Zhan', 'Qifeng Chen', 'Wei Xue', 'Yike Guo'], 'affiliations': ['Noiz AI', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.38123.jpg', 'data': {'categories': ['#benchmark', '#video', '#multimodal', '#dataset', '#audio'], 'emoji': '🎬', 'ru': {'title': 'Синтез визуально-звукового мира в реальном времени', 'desc': 'HelixWorld — это интерактивная модель мира, которая одновременно генерирует визуальные сцены и пространственный звук в реальном времени. Авторы создали высококачественный датасет с синхронизированным видео и стерео-аудио, затем предварительно обучили модель-учитель на 6-градусной свободе движения камеры и действиях пользователя. Для обеспечения низкой латентности большую модель дистиллировали в компактный студент, достигнув воспроизведения со скоростью 24 кадра в секунду на одном GPU. Они также предложили HelixBench — бенчмарк для оценки согласованности синтезированного звукового поля с движением камеры.'}, 'en': {'title': 'Bringing Sound to Life in Interactive Worlds', 'desc': 'The paper introduces HelixWorld, a novel interactive audio-visual world model that integrates real-time visual and acoustic dynamics. Unlike traditional models that focus solely on visual rendering, HelixWorld synchronizes stereo sound with visual scenes, enhancing user interaction. It utilizes a high-fidelity dataset and a bidirectional teacher model to achieve low-latency audio-visual responses. The system is evaluated using HelixBench, demonstrating superior spatial-acoustic immersion compared to existing silent models while maintaining visual fidelity.'}, 'zh': {'title': '实时音视频交互的未来：HelixWorld', 'desc': '本论文介绍了HelixWorld，这是一个实时交互的音视频世界模型，能够同步视觉场景和空间立体声效。与传统的仅关注视觉渲染的模型不同，HelixWorld同时考虑了声音的动态变化。我们构建了一个高保真的音视频数据集，并在此基础上预训练了一个双向教师模型，以支持用户交互。实验结果表明，HelixWorld在视觉保真度和响应性方面与最先进的无声世界模型相当，但在相机对齐的空间声学沉浸感上显著优于现有基准。'}}}, {'id': 'https://huggingface.co/papers/2609.32777', 'title': 'DEFINE: Exemplar-Guided Accent Control for Zero-Shot TTS', 'url': 'https://huggingface.co/papers/2609.32777', 'abstract': 'Abstract  Zero-shot text-to-speech (TTS) can reproduce an unseen speaker from a short reference recording, but typically entangles speaker identity and accent within the same reference. We introduce DEFINE, an end-to-end framework that decouples these factors by conditioning speaker identity and target accent on separate audio exemplars. A single inference-time guidance weight continuously controls accent strength without retraining. Built on F5-TTS with parameter-efficient LoRA adaptation, DEFINE maps short accent exemplars into a conditioning space using an exemplar encoder supervised through learned accent prototypes, requiring neither accent labels at inference time nor post-synthesis waveform conversion. On seen accents, increasing accent guidance improves accent-probe accuracy from 6.5% to 19.6%. More importantly, a single DEFINE model generalizes accent control beyond its training accent set: on seen and out-of-domain accents, though not on held-out accents, it matches the accent transfer performance of a two-model TTS-voice-conversion cascade while achieving higher speaker similarity and comparable predicted speech quality. These results demonstrate that speaker identity and accent can be independently controlled from audio exemplars within a single zero-shot TTS model, including for accents unseen during training.', 'score': 31, 'issue_id': 3374, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'c508d19f1f5d8c63', 'authors': ['Ambuj Mehrish', 'Abhinaba Roy', 'Alex Ivanov', 'Tawsif Ahmed', 'Dorien Herremans'], 'affiliations': ['Ca Foscari University of Venice', 'Kandinsky Lab', 'Singapore University of Technology and Design', 'Sleeping AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.32777.jpg', 'data': {'categories': ['#multimodal', '#audio', '#training'], 'emoji': '🎤', 'ru': {'title': 'Независимое управление голосом и акцентом в нулевой синтез речи', 'desc': 'В работе предложена система DEFINE для синтеза речи, которая разделяет управление идентичностью говорящего и акцентом на основе отдельных аудио образцов. Система использует архитектуру F5-TTS с эффективной LoRA адаптацией и кодирует акцентные образцы в пространство обусловливания через выученные прототипы акцентов. Вес наведения на инференсе позволяет непрерывно управлять интенсивностью акцента без переобучения модели. Единая модель DEFINE успешно обобщает контроль акцента на неизвестные акценты, достигая качества, сравнимого с каскадом из двух независимых моделей, при этом сохраняя высокую схожесть голоса говорящего.'}, 'en': {'title': 'Decoupling Speaker Identity and Accent in Zero-Shot TTS', 'desc': 'The paper presents DEFINE, a novel framework for zero-shot text-to-speech (TTS) that separates speaker identity from accent using different audio samples. This approach allows the model to control accent strength dynamically during inference without needing to retrain. DEFINE utilizes a parameter-efficient adaptation method and an exemplar encoder to map accent samples into a conditioning space, eliminating the need for accent labels at inference. The results show that DEFINE not only improves accent accuracy but also generalizes well to unseen accents, outperforming traditional methods in speaker similarity and speech quality.'}, 'zh': {'title': '独立控制说话者身份与口音的零-shot TTS模型', 'desc': '这篇论文介绍了一种名为DEFINE的零-shot文本到语音（TTS）框架，它能够从短的参考录音中重现未见过的说话者。该框架通过将说话者身份和目标口音分别与不同的音频示例进行条件化，从而解耦这两个因素。DEFINE使用一个单一的推理时间指导权重来持续控制口音强度，而无需重新训练。实验结果表明，DEFINE在已见口音上提高了口音探测的准确性，并且在未见口音上也能有效控制口音，显示出说话者身份和口音可以在单一的零-shot TTS模型中独立控制。'}}}, {'id': 'https://huggingface.co/papers/2610.03664', 'title': 'ProAR: Learning Prospective Reasoning with Autoregressive Video Models', 'url': 'https://huggingface.co/papers/2610.03664', 'abstract': "Abstract  Autoregressive (AR) video models excel at causal generation, but their reliance on next-chunk prediction confines them to a short-sighted, reactive paradigm. This limitation is particularly consequential for reasoning-oriented generation, where achieving a target outcome through valid intermediate states matters more than local visual plausibility. To address this challenge, we propose Learning Prospective Reasoning with Autoregressive Video Models (ProAR), a novel framework that transforms autoregressive video generation into a goal-oriented reasoning process. ProAR introduces two key components: (1) To anchor generation to the long-range outcome, we integrate goal-frame prediction into the autoregressive loop via an asymmetric attention mask, enabling the predicted goal frame to guide the generation of intermediate states without being disrupted by them. (2) To guide short-range transitions, we introduce future representation self-alignment to encourage current hidden states to anticipate upcoming temporal dynamics. By leveraging teacher-forcing in AR training, we extract clean future representations in a single forward pass and align current representations with them using a lightweight, training-only predictor. Together, these two mechanisms seamlessly combine explicit, sparse target supervision with implicit, dense step-wise guidance, promoting coherent, goal-directed reasoning progress with modest computational cost. Experiments show that ProAR's complementary components consistently improve performance across diverse visual reasoning benchmarks. The framework proves highly training-efficient, surpassing fully trained standard AR baselines using only 25% of the training steps. This paradigm also demonstrates promising applicability to embodied reasoning tasks.", 'score': 25, 'issue_id': 3375, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '99c37ca7c2f6c2ff', 'authors': ['Linghui Shen', 'Tinghui Zhu', 'Sheng Zhang', 'Muhao Chen'], 'affiliations': ['Microsoft', 'The Hong Kong Polytechnic University', 'University of California, Davis'], 'pdf_title_img': 'assets/pdf/title_img/2610.03664.jpg', 'data': {'categories': ['#video', '#benchmark', '#optimization', '#training', '#architecture', '#reasoning'], 'emoji': '🎯', 'ru': {'title': 'Целенаправленное рассуждение в авторегрессивных видеомоделях', 'desc': 'В статье предлагается ProAR — новый подход к авторегрессивным моделям видеогенерации, который добавляет целевую ориентацию в процесс генерации. Основная идея заключается в интеграции предсказания целевого кадра через асимметричную маску внимания, позволяющей конечному результату направлять генерацию промежуточных состояний. Дополнительно авторы вводят механизм self-alignment будущих представлений, который заставляет текущие скрытые состояния предугадывать грядущую динамику видеопоследовательности. Экспериментальные результаты показывают, что предложенный подход значительно улучшает производительность на задачах визуального рассуждения, требуя при этом всего 25% от стандартного времени обучения.'}, 'en': {'title': 'Transforming Video Generation with Goal-Oriented Reasoning', 'desc': 'The paper introduces ProAR, a new framework that enhances autoregressive video models by focusing on goal-oriented reasoning rather than just predicting the next video chunk. It incorporates goal-frame prediction to ensure that the generation process is directed towards a long-term outcome, allowing for better intermediate state generation. Additionally, ProAR employs future representation self-alignment to help the model anticipate upcoming changes in the video, improving the coherence of transitions. Overall, this approach not only boosts performance on visual reasoning tasks but also does so efficiently, requiring fewer training steps compared to traditional autoregressive methods.'}, 'zh': {'title': '前瞻性推理：自回归视频生成的新视角', 'desc': '自回归视频模型在因果生成方面表现出色，但其依赖于下一个片段的预测使其局限于短视的反应模式。为了克服这一挑战，我们提出了学习前瞻性推理的自回归视频模型（ProAR），将自回归视频生成转变为以目标为导向的推理过程。ProAR引入了两个关键组件：首先，通过不对称注意力掩码将目标帧预测整合到自回归循环中，使得预测的目标帧能够在生成中间状态时提供指导。其次，引入未来表示自对齐，鼓励当前隐藏状态预测即将到来的时间动态，从而实现更连贯的目标导向推理。'}}}, {'id': 'https://huggingface.co/papers/2609.36529', 'title': 'Triadic Linear Attention: Three-Dimensional Recurrent States for Long-Context Sequence Modeling', 'url': 'https://huggingface.co/papers/2609.36529', 'abstract': 'Abstract  Recurrent neural networks (RNNs) compress the historical context into a memory state of fixed size, thus allowing for constant-time inference. The memory state size is a crucial factor in their performance, as exemplified by the strong performance and resurgence of linear attention, which extends the vector-valued hidden states of ordinary RNNs to matrix-valued hidden states. Crucially, linear attention does so in a parameter-efficient way, in particular by using an outer product of the key and value vectors to write to the matrix-valued hidden state. We generalize this construction and propose triadic linear attention, which writes the triadic outer product of a key, a second key, and a value, into a third-order (i.e., 3D) tensor state, and reads from it by contracting both key axes with two queries. An E-dimensional second key thus yields an E-fold increase in state size while adding only two projections. Triadic linear attention is compatible with data-dependent forgetting, the delta rule, and chunkwise-parallel training. Applied to Gated DeltaNet and scalar-gated linear attention, triadic linear attention substantially improves long-context language modeling and recall, outperforming alternatives that enlarge the state.', 'score': 25, 'issue_id': 3375, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '239209d91b2d28e5', 'authors': ['Oliver Sieberling', 'Bharat Runwal', 'David Jin', 'Ryan Chin', 'Rameswar Panda', 'Yoon Kim'], 'affiliations': ['MIT-IBM Computing Research Lab', 'Massachusetts Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.36529.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Триадическое внимание: масштабирование памяти рекуррентных сетей без потери эффективности', 'desc': 'В статье предложен метод триадической линейной внимательности, который расширяет идею линейного внимания путём использования трёхмерного тензорного состояния вместо матричного. Ключевое улучшение заключается в том, что добавление второго ключевого вектора увеличивает размер состояния в E раз, но требует только двух дополнительных проекций, что обеспечивает параметрическую эффективность. Метод совместим с различными техниками обучения, включая данные-зависимое забывание и параллельное обучение по блокам. На задачах языкового моделирования с длинными контекстами триадическое линейное внимание показывает значительное улучшение по сравнению с альтернативными подходами.'}, 'en': {'title': 'Enhancing RNNs with Triadic Linear Attention for Better Memory and Performance', 'desc': 'This paper introduces triadic linear attention, an advanced method for enhancing recurrent neural networks (RNNs) by using a third-order tensor state. By employing a triadic outer product of two keys and a value, this approach increases the memory capacity without significantly increasing the number of parameters. The method allows for efficient data processing and is compatible with techniques like data-dependent forgetting and chunkwise-parallel training. Ultimately, triadic linear attention demonstrates improved performance in long-context language modeling compared to traditional methods that simply increase state size.'}, 'zh': {'title': '三元线性注意力：提升长上下文建模的利器', 'desc': '递归神经网络（RNN）将历史上下文压缩为固定大小的记忆状态，从而实现常量时间的推理。记忆状态的大小对其性能至关重要，线性注意力的强大表现证明了这一点，它将普通RNN的向量值隐藏状态扩展为矩阵值隐藏状态。我们提出了三元线性注意力，它通过将关键、第二关键和价值的三元外积写入三阶张量状态，并通过与两个查询收缩两个关键轴来读取。三元线性注意力在长上下文语言建模和回忆方面显著提高了性能，超越了那些仅通过扩大状态来改进的替代方案。'}}}, {'id': 'https://huggingface.co/papers/2610.03695', 'title': 'Language Models that Play Chess and Explain Their Moves', 'url': 'https://huggingface.co/papers/2610.03695', 'abstract': "Abstract  Modern chess engines are silent experts: they play at a superhuman level, but do not offer explanations for their play. On the other hand, language models (LMs) can generate plausible-sounding explanations, but their weak playing strength limits the utility of their explanations. We introduce Queen, a 4B-parameter chess-language model that can explain its moves and plans while playing at the level of a typical Grandmaster. Our novel framework enables domain-specific reasoning through complementary components: an encoder-decoder architecture and an iterative distillation algorithm. This architecture integrates a silent expert chess encoder with an instruction-tuned LM through cross-attention, which we train via a question-answering curriculum to extract chess concepts from the encoder's representations. Building on this domain-adapted model, we iteratively improve its explanations with a natural-language analog of the Bellman update: the model analyzes the positions after its top candidate moves and consolidates them into an explanation of the current position, which is then distilled back into the model. Over seven iterations, our model gains over 900 Elo points (1782 to 2697), substantially surpassing all frontier models on both playing strength and puzzle accuracy, despite containing three orders of magnitude fewer parameters. Furthermore, LM-based evaluations show that our explanations are fluent and approach GPT-5.6-Sol (high) in coherence. The generality of our architecture and training procedure suggests a recipe for applying language models to domains where silent expert encoders are available, like games, robotics, and computer use.", 'score': 23, 'issue_id': 3376, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '14b3782b85aff4d3', 'authors': ['Adithya Bhaskar', 'Jeffrey Cheng', 'Danqi Chen'], 'affiliations': ['Princeton Language and Intelligence, Princeton University'], 'pdf_title_img': 'assets/pdf/title_img/2610.03695.jpg', 'data': {'categories': ['#small_models', '#reasoning', '#games', '#architecture', '#multimodal', '#training', '#interpretability'], 'emoji': '♟️', 'ru': {'title': 'Молчаливые эксперты учат языковые модели объяснять свои ходы', 'desc': 'Авторы представляют Queen — языковую модель для шахмат, которая объединяет сверхчеловеческие способности в игре с умением объяснять свои ходы. Модель использует архитектуру с энкодером-декодером, интегрирующей молчаливого эксперта (шахматный энкодер) с инструктированной языковой моделью через кросс-внимание и обучаемую на основе вопросов. Для улучшения качества объяснений применяется итеративная дистилляция, аналогичная обновлению Беллмана в теории управления, что позволяет модели анализировать позиции после ходов и консолидировать их в объяснение текущей позиции. За семь итераций модель достигла уровня гроссмейстера (2697 Elo), превзойдя все современные модели при этом содержа в тысячу раз меньше параметров.'}, 'en': {'title': 'Queen: The Chess Model That Explains Its Moves!', 'desc': 'This paper presents Queen, a chess-language model that combines the strengths of high-level chess engines and language models. Queen can play chess at a Grandmaster level while providing clear explanations for its moves, addressing the gap between performance and interpretability in AI. The model uses an encoder-decoder architecture and an iterative distillation algorithm to enhance its reasoning capabilities and improve the quality of its explanations. Through extensive training, Queen significantly increases its playing strength and produces coherent, fluent explanations, demonstrating a new approach for integrating language models in specialized domains.'}, 'zh': {'title': '国际象棋语言模型：解释与超越', 'desc': '本文介绍了一种名为Queen的国际象棋语言模型，它能够在与典型国际象棋大师相当的水平下进行游戏，并解释其走棋的原因。该模型结合了编码器-解码器架构和迭代蒸馏算法，使其能够进行领域特定的推理。通过交叉注意力机制，Queen将沉默的国际象棋专家编码器与经过指令调优的语言模型相结合，从而提取国际象棋概念。经过七轮迭代，模型的棋力显著提升，超越了所有前沿模型，同时其解释的流畅性和连贯性也接近于最新的语言模型。'}}}, {'id': 'https://huggingface.co/papers/2610.02126', 'title': 'Local Support Learning', 'url': 'https://huggingface.co/papers/2610.02126', 'abstract': 'Abstract  We explore catastrophic forgetting in the context of large pre-trained models. By considering forgetting as a geometric problem in the input space of each weight matrix, we uncover a natural retention objective under which updates produced by gradient-based optimizers are suboptimal. Following this observation, we propose Local Support Learning (LSL), a general-purpose framework that augments gradient-based training for retention of prior capabilities without access to prior data. During a new learning phase, LSL pairs two components with distinct roles: a standard weight adapter, trained as usual to minimize the loss, and a gating function that enables the adapter only on input activations from its own training distribution, making the update local to that distribution. The key challenge is that this gate must route data from all learning phases while training only on data from the current one. We address this with a gate based on a Gaussian Mixture Model (GMM), whose likelihood decays rapidly away from its training data, giving it a natural tendency to stay closed on data from prior phases. We show that this post-training approach can resolve forgetting in LLMs of up to 7 billion parameters, retaining both pretrained and finetuned capabilities across multiple training phases, while being efficient in memory and compute, robust to hyperparameter choice, and showing scaling potential.', 'score': 23, 'issue_id': 3375, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '985780989c85a481', 'authors': ['Assaf Ben-Kish', 'Akarsh Kumar', 'James Glass', 'Raja Giryes'], 'affiliations': ['MIT CSAIL', 'Tel Aviv University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02126.jpg', 'data': {'categories': ['#optimization'], 'emoji': '🧠', 'ru': {'title': 'Сохранение знаний при обучении без доступа к старым данным', 'desc': 'В работе исследуется проблема катастрофального забывания в больших предобученных моделях путём представления её как геометрической задачи в пространстве весов. Авторы предлагают Local Support Learning — общий фреймворк, который дополняет градиентную оптимизацию двумя компонентами: адаптером весов и gating функцией на основе гауссовой смеси моделей для локализации обновлений к текущему распределению данных. Подход позволяет сохранять как предобученные, так и настроенные способности модели без доступа к предыдущим данным. Метод продемонстрировал эффективность на больших языковых моделях до 7 млрд параметров с низкими требованиями к памяти и вычислениям.'}, 'en': {'title': 'Retaining Knowledge in Large Models: Local Support Learning', 'desc': 'This paper investigates the issue of catastrophic forgetting in large pre-trained models, which occurs when a model loses previously learned information while learning new tasks. The authors present a geometric perspective on forgetting and introduce Local Support Learning (LSL), a framework designed to enhance gradient-based training by preserving prior knowledge without needing access to old data. LSL employs a weight adapter for standard training and a gating function that restricts updates to inputs from the current training distribution, ensuring that past knowledge is retained. The gating mechanism is implemented using a Gaussian Mixture Model (GMM) to effectively manage data from different learning phases, demonstrating significant improvements in retaining capabilities in large language models with millions of parameters.'}, 'zh': {'title': '局部支持学习：解决灾难性遗忘的有效方法', 'desc': '本文探讨了在大型预训练模型中出现的灾难性遗忘现象。我们将遗忘视为每个权重矩阵输入空间中的几何问题，提出了一种自然的保留目标，发现基于梯度的优化器产生的更新是次优的。为了解决这个问题，我们提出了局部支持学习（LSL）框架，它增强了基于梯度的训练，以保留先前的能力，而无需访问先前的数据。LSL通过一个标准权重适配器和一个门控函数的组合，使得更新仅限于当前训练分布的数据，从而有效地解决了遗忘问题。'}}}, {'id': 'https://huggingface.co/papers/2609.28339', 'title': 'Beyond Future Prediction: Denoising as Generative Adaptation for Robot Control', 'url': 'https://huggingface.co/papers/2609.28339', 'abstract': 'Abstract  Pretrained generative Diffusion Transformers (DiTs) capture rich pixel-level visual and language-conditioned structure through large-scale image and video generation training. A growing line of robot policies builds on this generative prior, but how it should be transferred to control remains unclear, and existing approaches commonly instantiate this transfer through future visual prediction. We ask a more basic question: what a pretrained generative DiT actually contributes to action learning, and how this prior should be adapted for control. We introduce NowWAM, a future-target-free co-training formulation that denoises the current observation and predicts robot actions from the same visual stream, directly coupling the native generative objective to the action-facing representation across the denoising trajectory. Under matched controlled settings, past and future visual targets perform comparably, while restricting training to the clean endpoint substantially reduces robustness, suggesting that a separate future target is not essential for generative adaptation, while the denoising trajectory remains an effective interface for control. On LIBERO-Plus, NowWAM reaches 87.7% with FLUX2-Klein, improving over the future-target co-training baseline by 6.1 points while halving training visual tokens (784 to 392) and reducing step time from 2.85 s to 1.63 s, a 1.8x speedup. With the pure text-to-image Z-Image backbone, NowWAM further reaches 87.8%, showing that strong control adaptation is not tied to video generation or image-editing backbones.', 'score': 22, 'issue_id': 3376, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '33e24e11d9696f15', 'authors': ['Zanyi Wang', 'Yuheng Lei', 'Dengyang Jiang', 'Ping Luo', 'Mengdi Wang', 'Zhixuan Liang', 'Shilong Liu'], 'affiliations': ['HKU', 'HKUST', 'Princeton University', 'UC San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2609.28339.jpg', 'data': {'categories': ['#robotics', '#transfer_learning', '#diffusion', '#cv', '#architecture', '#multimodal', '#training'], 'emoji': '🤖', 'ru': {'title': 'Адаптация генеративных трансформеров для робототехники без предсказания будущего', 'desc': 'Статья исследует, как предварительно обученные генеративные диффузионные трансформеры (DiT) можно адаптировать для управления робототехническими системами. Авторы предлагают NowWAM — метод совместного обучения, который одновременно денуазирует текущее наблюдение и предсказывает действия робота из одного визуального потока, напрямую связывая генеративную целевую функцию с представлениями для управления. Экспериментально показано, что предсказание будущих кадров не является необходимым для эффективной адаптации, а траектория денуазирования остаётся эффективным интерфейсом для обучения политики. Метод достигает 87.7% точности на бенчмарке LIBERO-Plus, при этом сокращая требуемые вычислительные ресурсы в 1.8 раза по сравнению с базовым подходом.'}, 'en': {'title': 'Empowering Robots with Denoising for Action Learning', 'desc': 'This paper discusses the use of pretrained generative Diffusion Transformers (DiTs) in robot action learning. It introduces NowWAM, a new method that allows robots to learn actions without relying on future visual predictions, instead focusing on denoising current observations. The study shows that using a denoising trajectory is effective for control, and that a separate future target is not necessary for successful adaptation. The results demonstrate significant improvements in performance and efficiency, indicating that strong control can be achieved without traditional video generation techniques.'}, 'zh': {'title': '去除未来目标，提升机器人控制的有效性', 'desc': '这篇论文介绍了一种名为NowWAM的方法，它利用预训练的生成扩散变换器（DiT）来改进机器人控制学习。NowWAM通过去噪当前观察并从同一视觉流预测机器人动作，避免了对未来视觉目标的依赖。研究表明，使用去噪轨迹作为控制接口比依赖未来目标更有效。实验结果显示，NowWAM在多个指标上超越了传统的未来目标共同训练方法，同时显著提高了训练效率。'}}}, {'id': 'https://huggingface.co/papers/2610.03675', 'title': 'FrugalEvo: Towards Cost-Aware LLM-Guided Program Evolution', 'url': 'https://huggingface.co/papers/2610.03675', 'abstract': 'Abstract  LLM-guided evolutionary methods, such as AlphaEvolve, have emerged as powerful approaches for challenging computational optimization problems, such as circle packing. However, prior work typically optimizes performance gain over a fixed number of iterations. We argue that practical optimization should maximize gain per unit cost. To this end, we propose FrugalEvo, a cost-aware evolutionary framework where a stronger, higher-cost LLM explores solution strategies, and a cheaper LLM implements them and iteratively refines the resulting code. We also design a cache-efficient evolution process, where our harness and prompts maximize the sharing of prefixes across different evolution steps, to improve cache reuse. To measure solution quality throughout a fixed cost budget, we introduce Budget-Aware Area Under the Curve (BA-AUC), defined as the area under the best-so-far evaluation score curve over cumulative LLM cost, up to the budget. Across 10 mathematical and systems optimization tasks, FrugalEvo matches or surpasses state-of-the-art baselines, including OpenEvolve, ShinkaEvolve, AdaEvolve, and EvoX, in final solution quality and achieves higher BA-AUC on 9 tasks. It also achieves higher average performance than these baselines on 10 algorithmic optimization tasks from ALE-Bench-Lite. Notably, on circle packing, FrugalEvo achieves new state-of-the-art performance with GPT-5.6 Terra and Luna for only 1.68 USD and with GLM-5.3 and its Flash variant for only 0.55 USD, matching or surpassing all baselines, including multi-agent methods such as CORAL and SwarmResearch, which cost approximately 50 USD on average.', 'score': 21, 'issue_id': 3376, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'f79df43cf63d2a85', 'authors': ['Hui Chen', 'Xuan Qi', 'James Xu Zhao', 'Zhaopeng Feng', 'Shilong Liu', 'Kuang Xu', 'Pang Wei Koh', 'Bryan Hooi'], 'affiliations': ['National University of Singapore', 'Princeton University', 'Stanford University', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2610.03675.jpg', 'data': {'categories': ['#math', '#agents', '#training', '#optimization'], 'emoji': '💰', 'ru': {'title': 'Экономная эволюция: максимум результата при минимуме затрат', 'desc': 'В работе предложен FrugalEvo — экономный эволюционный фреймворк, где мощная LLM исследует стратегии оптимизации, а более дешёвая модель их реализует и уточняет код. Авторы разработали кэш-эффективный процесс эволюции с максимальным переиспользованием префиксов и введили метрику BA-AUC для измерения качества решений в рамках фиксированного бюджета затрат. Метод достигает конкурентные или лучшие результаты на задачах математической и системной оптимизации, при этом значительно экономя на вычислительных затратах. На задаче упаковки кругов FrugalEvo получает новое лучшее решение за 0.55 USD, что в 90 раз дешевле чем многоагентные подходы.'}, 'en': {'title': 'FrugalEvo: Optimizing Performance with Cost Efficiency in Evolutionary Methods', 'desc': 'The paper introduces FrugalEvo, a cost-aware evolutionary framework that optimizes computational problems by balancing performance gain with cost efficiency. It utilizes a high-cost LLM for exploring solution strategies and a lower-cost LLM for refining these solutions, enhancing the overall optimization process. The authors propose a new metric, Budget-Aware Area Under the Curve (BA-AUC), to evaluate solution quality relative to the cost incurred. FrugalEvo demonstrates superior performance across various optimization tasks, achieving state-of-the-art results while significantly reducing costs compared to existing methods.'}, 'zh': {'title': '成本意识的进化优化新方法', 'desc': '本文提出了一种名为FrugalEvo的成本意识进化框架，旨在优化计算问题的解决方案。与以往的研究不同，FrugalEvo不仅关注性能提升，还考虑每单位成本的收益最大化。该框架利用高成本的强大LLM探索解决策略，并通过低成本的LLM实施和迭代优化代码。此外，FrugalEvo在多个优化任务中表现优异，尤其在圆形打包问题上，展示了新的最先进性能，且成本显著低于传统方法。'}}}, {'id': 'https://huggingface.co/papers/2609.39963', 'title': 'Diptych: Scoped, AI-Interpreted Comparison for Reference Listening in Music Production', 'url': 'https://huggingface.co/papers/2609.39963', 'abstract': 'Abstract  Reference listening is a common strategy in music production, but current comparison tools often obscure a key human judgment: deciding what should be compared. We present Diptych, an AI-assisted system that lets users define comparison scope across whole tracks or independently selected segments, while inspecting structured audio features and scope-specific AI interpretations. We evaluated Diptych in a within-participants study with 12 musicians, complemented by source-blinded ratings from four expert listeners. Participants used the system to surface additional differences, nine of ten of which received at least partial expert support, and reported good usability and greater clarity about possible next steps. These findings suggest that AI support for creative comparison should prioritize user-defined scope, inspectable evidence, and actionable guidance, while avoiding authoritative judgments that exceed what the evidence can support.', 'score': 20, 'issue_id': 3374, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '08e46785a1bf4310', 'authors': ['Chongjun Zhong', 'Abhinaba Roy', 'Archishman Ghosh', 'Kejun Zhang', 'Dorien Herremans'], 'affiliations': ['Singapore University of Technology and Design, Singapore', 'Zhejiang University, Hangzhou, Zhejiang, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.39963.jpg', 'data': {'categories': [], 'emoji': '🎵', 'ru': {'title': 'Пользовательское управление: ключ к AI-ассистированному анализу музыки', 'desc': 'Авторы представляют Diptych — систему с поддержкой искусственного интеллекта для сравнения музыкальных треков, которая позволяет пользователям самостоятельно определять масштаб сравнения на уровне целых композиций или отдельных сегментов. Система анализирует структурированные аудиофичи и предоставляет интерпретации, специфичные для выбранного масштаба. Исследование с участием 12 музыкантов показало, что система помогает выявить дополнительные различия в музыке и улучшает ясность в принятии решений о следующих шагах производства. Работа демонстрирует, что эффективная AI-поддержка творческого анализа должна приоритизировать контроль пользователя, прозрачность доказательств и практические рекомендации, избегая категоричных суждений без достаточного обоснования.'}, 'en': {'title': 'Empowering Music Comparison with AI: User-Defined Insights', 'desc': 'The paper introduces Diptych, an AI-assisted tool designed to enhance music production by allowing users to define the scope of audio comparisons. It enables musicians to compare entire tracks or specific segments while examining structured audio features and AI-generated insights. A study with musicians and expert listeners showed that Diptych helped users identify additional differences in music, with most findings receiving some expert validation. The results indicate that effective AI tools for creative tasks should focus on user-defined parameters, provide clear evidence, and offer actionable advice without making overreaching claims.'}, 'zh': {'title': 'AI助力音乐创作中的个性化比较', 'desc': '本文介绍了一种名为Diptych的AI辅助系统，旨在帮助音乐制作人进行参考听觉的比较。该系统允许用户定义比较的范围，可以是整首曲目或独立选择的片段，同时检查结构化的音频特征和特定范围的AI解释。通过对12名音乐家的研究评估，结果显示参与者能够发现更多的差异，并且大多数差异得到了专家的部分支持。研究表明，AI在创意比较中的支持应优先考虑用户定义的范围、可检查的证据和可操作的指导，而不是超出证据所能支持的权威判断。'}}}, {'id': 'https://huggingface.co/papers/2610.03715', 'title': '4DCodeBench: Benchmarking Agents on Inverse Graphics of Dynamic Scenes', 'url': 'https://huggingface.co/papers/2610.03715', 'abstract': 'Abstract  We introduce 4DCodeBench, a benchmark for 4D inverse graphics through code generation, in which agents reconstruct dynamic scenes from video as executable graphics programs. To accomplish this, agents must translate visual observations into compact representations of scene structure and dynamics, by implementing abstractions such as physical simulations to reproduce complex behavior. To evaluate this capability, we curate a set of real-world videos and construct synthetic scenes spanning diverse physical phenomena, including deformation, fluid flow, and fracture. We perform extensive benchmarking of frontier models, finding that strong static reconstruction capabilities do not yet translate into reliable reconstruction of complex dynamics. 4DCodeBench provides a testbed for tracking progress toward agents that can interpret the dynamics of the world through code. Our benchmark is available at https://github.com/4DCodeBench/4DCodeBench', 'score': 19, 'issue_id': 3376, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '8466d9c3ca2b26f7', 'authors': ['Ruihong Shen', 'Žiga Kovačič', 'Peter Kulits', 'Xingrui Wang', 'Zizhang Li', 'Joshua B. Tenenbaum', 'Alan Yuille', 'Jieneng Chen', 'Jiajun Wu'], 'affiliations': ['Johns Hopkins University', 'Massachusetts Institute of Technology', 'Max Planck Institute for Intelligent Systems', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.03715.jpg', 'data': {'categories': ['#agents', '#video', '#dataset', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Интерпретация динамики мира через программный код', 'desc': 'Авторы представляют 4DCodeBench, новый бенчмарк для обратной графики четвёртого измерения через генерацию кода. Агентам нужно реконструировать динамические сцены из видео в виде исполняемых графических программ, преобразуя визуальные наблюдения в компактные представления структуры и динамики сцены. Для оценки способностей используются реальные видео и синтетические сцены с различными физическими явлениями: деформацией, потоком жидкости и разломами. Результаты показывают, что даже сильные модели плохо справляются с реконструкцией сложной динамики, несмотря на успехи в статической реконструкции.'}, 'en': {'title': 'Reconstructing Dynamic Scenes with Code Generation', 'desc': 'The paper presents 4DCodeBench, a new benchmark designed for evaluating 4D inverse graphics through code generation. It focuses on how agents can reconstruct dynamic scenes from videos by creating executable graphics programs. The agents need to convert visual data into compact representations that capture the structure and dynamics of scenes, using techniques like physical simulations. The study highlights that while current models excel in static scene reconstruction, they struggle with accurately modeling complex dynamic behaviors, thus providing a platform to measure advancements in this area.'}, 'zh': {'title': '4DCodeBench：动态场景重建的新基准', 'desc': '我们介绍了4DCodeBench，这是一个用于4D逆图形的基准测试，旨在通过代码生成重建动态场景。代理需要将视觉观察转化为场景结构和动态的紧凑表示，并实现物理模拟等抽象，以重现复杂行为。我们整理了一组真实世界的视频，并构建了涵盖多种物理现象的合成场景，包括变形、流体流动和破裂。通过对前沿模型的广泛基准测试，我们发现强大的静态重建能力尚未能可靠地重建复杂的动态。'}}}, {'id': 'https://huggingface.co/papers/2610.02824', 'title': 'MetaRubric: Learning to Reward for Rubric-Based Reinforcement Learning', 'url': 'https://huggingface.co/papers/2610.02824', 'abstract': "Abstract  Rubric-based reinforcement learning extends reward-driven optimization to open-ended tasks by assigning partial credit to individual response requirements. However, rubric judges can assign a high criterion score even when the information or action it requires is absent from the response, a failure mode we term Vacuous Credit. Such awards persist after the required information is removed and can reverse the sign of a response's GRPO advantage. To address this problem, we introduce MetaRubric, which alternates evidence-aware policy optimization with response-guided rubric adaptation. We construct counterfactual counterparts by changing one task-relevant fact in each prompt. During policy optimization, credit is assigned only when the response contains sufficient evidence to satisfy the required rubric criterion. After each policy-optimization stage, current policy responses guide revisions to original and counterfactual criteria while preserving the meaning of the original prompt's initial rubric as interpreted under each prompt's facts. We also adapt criterion weights at stage boundaries to better address observed policy errors. Across multiple backbones, MetaRubric improves PubMedQA accuracy by 6.00--20.40 percentage points over static-judge GRPO, with further gains on HealthBench-Hard and two multimodal medical benchmarks.", 'score': 19, 'issue_id': 3374, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'a3c6c6ffbd65f23d', 'authors': ['Yuxuan Fan', 'Jaehong Yoon'], 'affiliations': ['NTU Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2610.02824.jpg', 'data': {'categories': ['#benchmark', '#rl', '#multimodal', '#healthcare', '#rlhf'], 'emoji': '⚖️', 'ru': {'title': 'Метаобучение критериев: от бессмысленных похвал к доказательным оценкам', 'desc': "В статье предлагается метод MetaRubric для улучшения обучения с подкреплением на основе критериев оценки при выполнении открытых задач. Авторы выявили проблему 'Vacuous Credit' — когда система оценивания дает высокие баллы за критерии даже при отсутствии необходимой информации в ответе. Решение основано на чередовании оптимизации политики с проверкой доказательств и адаптации критериев через контрфактические примеры. Экспериментальные результаты показывают значительное улучшение точности на медицинских датасетах PubMedQA и HealthBench-Hard по сравнению с базовым методом GRPO."}, 'en': {'title': 'Enhancing Reward Assignment in Reinforcement Learning with MetaRubric', 'desc': 'This paper discusses a new approach called MetaRubric in the field of reinforcement learning, which aims to improve how rewards are assigned in open-ended tasks. The authors identify a problem known as Vacuous Credit, where judges give high scores even when necessary information is missing from responses. MetaRubric addresses this by ensuring that credit is only given when responses contain sufficient evidence to meet rubric criteria, thus enhancing the learning process. The method shows significant improvements in accuracy on various medical benchmarks compared to traditional methods.'}, 'zh': {'title': 'MetaRubric：提升评分系统的有效性', 'desc': '本论文提出了一种名为MetaRubric的强化学习方法，旨在解决传统评分系统中的空洞信用问题。该方法通过证据感知的策略优化与响应引导的评分适应交替进行，确保只有在响应中包含足够证据时才给予信用。MetaRubric通过构建反事实对照，调整评分标准，以更好地反映任务相关信息。实验结果表明，MetaRubric在多个基准测试中显著提高了准确率，尤其是在PubMedQA上提升了6.00至20.40个百分点。'}}}, {'id': 'https://huggingface.co/papers/2609.37925', 'title': 'Rollout-Marginal Distillation for Long-Horizon Autoregressive Video Generation', 'url': 'https://huggingface.co/papers/2609.37925', 'abstract': 'Abstract  Autoregressive (AR) video diffusion enables low-latency, streamable video generation, but prediction errors often accumulate over long rollouts. Training the generator on its own rollouts exposes it to these imperfect histories. However, existing video-level distribution matching distillation (DMD) scores the whole rollout jointly. Because a chunk is evaluated together with its past and future, its correction can favor matching artifacts in the surrounding context merely to preserve temporal consistency. To provide a clearer visual-quality signal, we introduce Rollout-Marginal Distillation (RMD). RMD retains the generated history for AR prediction but scores each chunk independently against a chunk teacher, ensuring its quality correction is not compromised by an imperfect temporal context. To compensate for the lack of temporal context in independent chunk scoring, RMD subsequently applies video-level DMD to restore temporal coherence. Extensive experiments demonstrate that RMD maintains high visual quality far beyond its training horizon and outperforms video-level DMD baselines. Code and video results are available at https://cjeen.github.io/RMD', 'score': 17, 'issue_id': 3376, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'e6dad85e42416905', 'authors': ['Chenjian Gao', 'Zhihao Hu', 'Jianqi Ma', 'Jun Zhang', 'Weidong Zhang', 'Tianfan Xue'], 'affiliations': ['MMLab, The Chinese University of Hong Kong', 'Tencent AIPD'], 'pdf_title_img': 'assets/pdf/title_img/2609.37925.jpg', 'data': {'categories': ['#video', '#training'], 'emoji': '🎬', 'ru': {'title': 'Маргинальная дистилляция для авторегрессивного видео без артефактов временной согласованности', 'desc': 'В статье представлен метод Rollout-Marginal Distillation (RMD) для улучшения качества авторегрессивной генерации видео. Авторы показывают, что оценка видео целиком приводит к компромиссам в качестве отдельных фреймов ради сохранения временной согласованности. Предложенный подход оценивает каждый сегмент видео независимо против учителя, обеспечивая чистый сигнал качества, а затем применяет дистилляцию на уровне всего видео для восстановления временной когерентности. Экспериментально доказано, что RMD поддерживает высокое качество визуализации значительно дальше горизонта обучения и превосходит существующие базовые методы.'}, 'en': {'title': 'Enhancing Video Quality with Independent Chunk Scoring', 'desc': 'This paper presents a new method called Rollout-Marginal Distillation (RMD) for improving the quality of autoregressive video generation. Traditional methods often suffer from accumulated prediction errors due to the way they evaluate video segments in relation to their entire context. RMD addresses this by scoring each video chunk independently, which allows for better quality corrections without being influenced by past or future segments. Additionally, it combines this independent scoring with video-level distribution matching distillation to ensure that the overall temporal coherence of the video is maintained.'}, 'zh': {'title': '提升视频生成质量的新方法', 'desc': '自回归视频扩散技术可以实现低延迟、可流式的视频生成，但在长时间生成过程中，预测误差往往会累积。传统的视频级分布匹配蒸馏方法会将整个生成过程一起评估，这可能导致生成的片段受到周围上下文的影响。为了解决这个问题，我们提出了回滚边际蒸馏（RMD），它独立评估每个片段的质量，从而避免了不完美时间上下文对质量修正的影响。实验表明，RMD在视觉质量上表现优异，超越了传统的视频级蒸馏方法。'}}}, {'id': 'https://huggingface.co/papers/2608.26762', 'title': 'Equal Ranking Quality, Different Decisions: Measuring and Reducing Order Dependence in LLM Scorers', 'url': 'https://huggingface.co/papers/2608.26762', 'abstract': "Abstract  In passage reranking, response ranking and multi-document question answering, LLMs can score several candidate documents or responses together in one prompt, each still receiving its own score. Such scorers are selected on ranking quality, but their scores determine a decision: what a score threshold retains, a reader answers, or which chosen/rejected pair enters preference training. Because the candidates share that prompt, reordering them changes their scores. The same query over the same candidates should still yield the same decision. However, equal ranking quality does not imply equal decisions: on passage reranking, five trained scorers within 0.010 nDCG@10 retain sets that overlap by only 0.66-0.84 when reordered. No prompt-time change we test resolves that dependence: the only one that improves ranking quality does not measurably improve decision stability. We introduce order-consistency SFT (OC-SFT), which attenuates it in the weights by penalizing disagreement between a candidate's scores across orderings. It holds ranking quality and leads every decision-stability measure among trained scorers on all three tasks. It is also more stable on 12 base models than order-averaged distillation, which trains on labels averaged across permutations. One OC-SFT permutation retains sets that overlap more than ten averaged off-the-shelf permutations. A comparison of such scorers should therefore report what a threshold retains and a reader answers, not ranking quality alone. Code is available at https://github.com/thomsonreuters/presentation-dependence.", 'score': 16, 'issue_id': 3376, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '5cdfcab45c55d1e4', 'authors': ['Markus Frohmann', 'Mahdiyar Ali Akbar Alavi', 'Elizabeth Lingg', 'Navid Rekabsaz'], 'affiliations': ['Thomson Reuters Labs', 'University of Toronto', 'Vector Institute'], 'pdf_title_img': 'assets/pdf/title_img/2608.26762.jpg', 'data': {'categories': ['#benchmark', '#rag', '#training'], 'emoji': '🔄', 'ru': {'title': 'Учим LLM быть независимыми от порядка кандидатов', 'desc': 'В статье изучается проблема зависимости оценок LLM от порядка кандидатов в промпте при переранжировании и ответах на вопросы. Авторы показывают, что даже скореры с одинаковым качеством ранжирования (nDCG) принимают разные решения при изменении порядка кандидатов, что приводит к нестабильности выбранных наборов. Для решения этой проблемы предложен метод Order-Consistency SFT (OC-SFT), который штрафует согласованность оценок одного кандидата при разных перестановках во время обучения. Метод OC-SFT сохраняет качество ранжирования и значительно улучшает стабильность принимаемых решений на трёх задачах по сравнению с существующими подходами.'}, 'en': {'title': 'Enhancing Decision Stability in Passage Reranking with OC-SFT', 'desc': 'This paper discusses the challenges in passage reranking and multi-document question answering when using large language models (LLMs) to score multiple candidate responses. It highlights that while different scorers may have similar ranking quality, they can lead to different decisions when the order of candidates is changed. The authors introduce a new method called order-consistency SFT (OC-SFT) that improves decision stability by penalizing score disagreements across different orderings of candidates. The results show that OC-SFT maintains high ranking quality while enhancing stability in decision-making across various tasks and models.'}, 'zh': {'title': '提升决策稳定性的顺序一致性微调', 'desc': '本文探讨了在段落重排序、响应排名和多文档问答中，如何使用大型语言模型（LLMs）对多个候选文档或响应进行评分。研究发现，候选项的评分会受到它们在提示中的顺序影响，尽管相同的查询应产生相同的决策。为了解决这一问题，本文提出了一种新的方法——顺序一致性微调（OC-SFT），通过惩罚候选项在不同顺序下评分的不一致性来提高决策的稳定性。实验结果表明，OC-SFT在保持排名质量的同时，显著提高了决策的稳定性。'}}}, {'id': 'https://huggingface.co/papers/2609.34895', 'title': 'LVMT: Video Mask Transformer for Long-term Video Segmentation', 'url': 'https://huggingface.co/papers/2609.34895', 'abstract': 'Abstract  Existing online video segmentation methods struggle to track objects in long, complex videos with long-term occlusions. We hypothesize that this limitation is caused by (i) the inability of their temporal propagation mechanism to adaptively select the object information that is propagated across time, and (ii) their inability to be trained on long videos due to memory requirements and vanishing gradients. To address the first limitation, we propose to use a lightweight GRU-based temporal propagation module that can learn to select which information it keeps in memory and propagates across time. Second, to allow training on long videos, we introduce Truncated Query Propagation (TQP), a training strategy in which the model processes a video in chunks of frames, where information about tracked objects is propagated between chunks but backpropagation is only conducted in individual chunks, enabling longer temporal supervision without out-of-memory issues, inference overhead, or vanishing gradients. The resulting model is called the Long-term Video Mask Transformer (LVMT). Extensive experiments on six benchmarks show that LVMT sets a new state of the art across a range of video segmentation tasks, while retaining the speed of the highly efficient model it is based on, making it 10X faster than the prior state of the art. Code: https://www.tue-mps.org/lvmt', 'score': 16, 'issue_id': 3375, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'cb8d8507f7c9208a', 'authors': ['Narges Norouzi', 'Niccolò Cavagnero', 'Idil Esen Zulfikar', 'Bastian Leibe', 'Gijs Dubbelman', 'Daan de Geus'], 'affiliations': ['Eindhoven University of Technology', 'RWTH Aachen University'], 'pdf_title_img': 'assets/pdf/title_img/2609.34895.jpg', 'data': {'categories': ['#video', '#optimization', '#training', '#architecture', '#long_context', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Эффективная сегментация видео с долгосрочной памятью через адаптивную пропагацию', 'desc': 'В работе предложен новый подход к сегментации объектов в видео, который решает проблему отслеживания в длинных видеороликах с окклюзиями. Авторы используют легковесный модуль временной пропагации на основе GRU, способный адаптивно выбирать информацию об объектах для распространения во времени. Ключевой вклад — метод Truncated Query Propagation (TQP), позволяющий обучать модель на длинных видео, разбивая их на фрагменты и проводя обратное распространение только внутри каждого фрагмента, что избегает проблем с памятью и затухающими градиентами. Предложенная модель LVMT достигает лучших результатов на шести бенчмарках, оставаясь при этом в 10 раз быстрее предыдущих методов.'}, 'en': {'title': 'Revolutionizing Long-term Video Segmentation with LVMT', 'desc': 'This paper addresses the challenges of online video segmentation, particularly in tracking objects over long videos with occlusions. The authors propose a new model called the Long-term Video Mask Transformer (LVMT), which utilizes a GRU-based temporal propagation module to selectively retain and propagate object information over time. To manage memory and training efficiency, they introduce Truncated Query Propagation (TQP), allowing the model to process video in manageable chunks while maintaining long-term supervision. Experimental results demonstrate that LVMT achieves state-of-the-art performance in video segmentation tasks while being significantly faster than previous models.'}, 'zh': {'title': '长视频分割的新突破', 'desc': '现有的在线视频分割方法在处理长时间复杂视频时，难以跟踪被遮挡的物体。我们认为，这一限制主要源于其时间传播机制无法自适应选择需要传播的物体信息，以及无法在长视频上进行训练。为了解决第一个问题，我们提出了一种基于轻量级GRU的时间传播模块，能够学习选择保留哪些信息。其次，我们引入了截断查询传播（TQP）策略，使模型能够分块处理视频，从而在不出现内存不足或梯度消失问题的情况下，实现对长视频的训练。'}}}, {'id': 'https://huggingface.co/papers/2610.01153', 'title': 'Looping Beyond Twice: A Scalable Recipe for Looped Mixture-of-Experts', 'url': 'https://huggingface.co/papers/2610.01153', 'abstract': 'Abstract  Looped Transformers introduce recurrent depth as a new scaling axis for LLMs: by repeatedly applying shared Transformer blocks, they increase effective depth without increasing parameter count. However, the benefits of looping remain unclear for large MoE LLMs under FLOPs-matched comparisons. The main reason is that the gains from additional iterations diminish quickly and can even turn into degradation, so the extra FLOPs spent on looping yield little substantial improvement. Consequently, prior work typically settles on two loops. We identify two main obstacles to scaling looped MoE. First, looping inherits and amplifies the curse of depth: hidden-state variance grows with each iteration as residual updates accumulate, which destabilizes deep recurrence and causes representations to drift. Second, looped MoE suffers from expert selection collapse: routers repeatedly select the same experts across loops, so extra iterations add computation without adding computational diversity. Guided by this diagnosis, we propose LOOM, built on a single principle: each loop should contribute new computation while keeping the recurrent state stable. LOOM stabilizes recurrence by scaling residual updates to bound variance growth and re-injecting the input embedding at every loop, and diversifies it through per-loop routers that engage different experts and a Looping Residual that carries earlier outputs forward. Experiments across 100M-1.7B models show stable scaling to 9-12 loops. Under near-iso-FLOP, the 700M model performs best at 5 loops, reducing perplexity from 18.36 to 16.54 and improving average zero-shot accuracy from 38.84% to 39.53% over the non-looped baseline. Without FLOP matching, the 1.7B model trained on 60B tokens peaks at 9 loops, reducing perplexity from 9.62 to 7.77 and improving average zero-shot accuracy from 42.4% to 47.7%. Code is available https://github.com/hed-ucas/LOOM.', 'score': 15, 'issue_id': 3375, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'c6606a14c068c7c4', 'authors': ['Di He', 'Pengxiang Li', 'Da Chang', 'Qingyan Meng', 'Lu Yin', 'Shiwei Liu'], 'affiliations': ['ELLIS Institute Tubingen', 'Max Planck Institute for Intelligent Systems', 'Peng Cheng Laboratory', 'Shenzhen Institutes of Advanced Technology, Chinese Academy of Sciences', 'The Hong Kong Polytechnic University', 'Tubingen AI Center', 'University of Chinese Academy of Sciences', 'University of Surrey'], 'pdf_title_img': 'assets/pdf/title_img/2610.01153.jpg', 'data': {'categories': ['#optimization', '#open_source', '#training', '#architecture', '#small_models'], 'emoji': '🔄', 'ru': {'title': 'Стабильная циклизация: как научить трансформеры эффективно повторяться', 'desc': 'В статье предложен метод LOOM для улучшения масштабирования циклических трансформаторов с механизмом смеси экспертов (MoE). Авторы выявили две основные проблемы: рост дисперсии скрытых состояний при повторных итерациях, которая дестабилизирует рекуррентные вычисления, и коллапс выбора экспертов, когда маршрутизаторы многократно выбирают одних и тех же специалистов. LOOM решает эти проблемы путём масштабирования остаточных соединений для контроля роста дисперсии, переинъекции входных эмбеддингов на каждом цикле и использования отдельных маршрутизаторов для каждого цикла. Экспериментальные результаты показывают, что модель может стабильно масштабироваться до 9-12 циклов и значительно улучшает качество при одинаковых объёмах вычислений.'}, 'en': {'title': 'Enhancing LLMs with Stable and Diverse Looping', 'desc': "Looped Transformers enhance large language models (LLMs) by applying shared Transformer blocks multiple times, effectively increasing their depth without adding more parameters. However, the benefits of this looping approach can diminish quickly, especially in mixture of experts (MoE) models, leading to potential performance degradation. The paper identifies two main challenges: the curse of depth, which causes instability in the model's representations, and expert selection collapse, where the same experts are chosen repeatedly, limiting diversity. To address these issues, the authors propose LOOM, which stabilizes the model's recurrent state and ensures that each loop contributes new computations, resulting in improved performance across various model sizes."}, 'zh': {'title': '循环变换器：稳定递归与多样化计算的创新', 'desc': '本文介绍了循环变换器（Looped Transformers），通过重复应用共享的变换器模块，增加了有效深度而不增加参数数量。然而，对于大型混合专家（MoE）模型，循环的好处在FLOPs匹配比较中仍不明确。我们发现循环会放大深度的诅咒，导致隐藏状态方差增长，从而使深度递归不稳定。此外，循环的MoE模型在专家选择上也存在问题，导致额外的迭代增加了计算量但没有增加计算多样性。为了解决这些问题，我们提出了LOOM，通过稳定递归和多样化计算来优化循环过程。'}}}, {'id': 'https://huggingface.co/papers/2610.02788', 'title': 'Skill2Real: Agentic Skill Learning for Zero-Shot Sim-to-Real Robot Manipulation', 'url': 'https://huggingface.co/papers/2610.02788', 'abstract': 'Abstract  Transferring robotic skills from simulation to reality requires task knowledge that remains usable across differences in perception, dynamics, and embodiment. We introduce Skill2Real, an agentic policy framework that learns executable skills through a shared application programming interface (API). A Proposer-Verifier-Governor (PVG) loop uses privileged simulation evidence to diagnose outcomes and validate updates, while keeping learned skills grounded in public observations and API semantics. The Cerebellum first acquires local manipulation skills; the Brain then learns task-level composition with the Cerebellum frozen. Both memories transfer to the real robot without task-policy fine-tuning or skill-memory updates. As GPT-5.6 Sol learns skills on LIBERO-90, evaluating each frozen checkpoint with GPT-6 Astra raises LIBERO-Pro Long success from 2.0% to 56.3%, without training on Pro Long. Independent Robosuite training reaches 85.1% and 89.4% mean success with Sol and Opus 5 across seven tasks, respectively. Frozen Sol-trained LIBERO-90 skills achieve 78.75% mean completion across four real-world manipulation tasks with Astra. Removing the Verifier or Governor during LIBERO-90 training lowers final Pro Long success by 17.3 and 13.3 percentage points, respectively. These results support learning and transferring a hierarchy of executable skills through a common robot interface.', 'score': 15, 'issue_id': 3374, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'f1aebeee02942d1a', 'authors': ['Xincheng He', 'Siyu Ma', 'Chang Yu', 'Yunuo Chen', 'Yanjia Huang', 'Ying Nian Wu', 'Yin Yang', 'Chenfanfu Jiang'], 'affiliations': ['Envora', 'Shanghai Jiao Tong University', 'University of California, Los Angeles', 'University of Utah'], 'pdf_title_img': 'assets/pdf/title_img/2610.02788.jpg', 'data': {'categories': ['#agents', '#robotics', '#transfer_learning', '#training'], 'emoji': '🤖', 'ru': {'title': 'Иерархические навыки робота, которые переносятся из симуляции в реальность через общий интерфейс', 'desc': 'В статье предложена система Skill2Real для переноса навыков робота из симуляции в реальность через единый интерфейс API. Система использует архитектуру с тремя компонентами (Proposer-Verifier-Governor), которые диагностируют результаты обучения, опираясь на привилегированную информацию из симуляции и общедоступные наблюдения. Навыки организованы иерархически: Мозжечок (Cerebellum) обучается локальным навыкам манипуляции, а Мозг (Brain) изучает композицию задач высокого уровня на замороженных весах Мозжечка. Эксперименты демонстрируют успешный перенос замороженных навыков на реальных роботов без переобучения, достигая 78.75% успеха в манипуляционных задачах.'}, 'en': {'title': 'Seamless Skill Transfer from Simulation to Reality', 'desc': 'The paper presents Skill2Real, a framework designed to transfer robotic skills learned in simulation to real-world applications. It utilizes a Proposer-Verifier-Governor (PVG) loop to ensure that skills are validated and grounded in real observations while leveraging simulation data. The framework consists of two main components: the Cerebellum, which learns local manipulation skills, and the Brain, which composes these skills into higher-level tasks. The results show significant improvements in task success rates when using this method, demonstrating its effectiveness in skill transfer without the need for fine-tuning.'}, 'zh': {'title': '技能转移：从模拟到现实的桥梁', 'desc': '本论文介绍了一种名为Skill2Real的框架，用于将机器人技能从模拟环境转移到现实中。该框架通过共享的应用程序接口（API）学习可执行的技能，并使用提议者-验证者-管理者（PVG）循环来诊断结果和验证更新。研究表明，Cerebellum首先学习局部操作技能，然后Brain在Cerebellum被冻结的情况下学习任务级组合。最终，经过训练的技能能够在真实机器人上成功应用，而无需对任务策略进行微调或更新技能记忆。'}
