    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.25270', 'title': 'RULER: Instance-aware Rubric Rewards for SVG Generation', 'url': 'https://huggingface.co/papers/2609.25270', 'abstract': 'Abstract  Generating Scalable Vector Graphics (SVG) code from natural-language instructions is an open-ended task without absolute visual ground truth, leaving both evaluation and policy optimization without a faithful signal. Scalar metrics (CLIP, Aesthetic) calibrated on natural images transfer poorly to stylized vector content, and reusing them as RL rewards triggers reward hacking. We address both limitations with rubric-based scoring. We first establish empirically that prompting a vision-language judge with a multi-axis rubric correlates with human judgments far better than scalar metrics, both across samples and within instructions. Building on this finding, we introduce RULER (Instance-aware Rubric Rewards for Reinforcement Learning), which converts each instruction into an instance-aware rubric of six items spanning semantic, visual, and stylistic axes; a judge VLM scores rendered rollouts item-by-item, and the weighted satisfactions form a fine-grained reward optimized via Group Relative Policy Optimization. Because the rubric is derived from text alone, RULER requires neither paired SVG ground truth nor human preference labels. On MMSVG-Illustration and MMSVG-Icon, RULER lifts the rubric score from 0.432/0.395 to 0.693/0.683, surpassing dedicated SVG specialists and matching the substantially larger DeepSeek-V3, with ablations identifying rubric design as the active lever for RL on open-ended SVG generation. The project page is available at https://hangyuran.github.io/RULER/.', 'score': 4, 'issue_id': 3319, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '7e64a867b588053c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#rlhf', '#dataset', '#multimodal', '#rl'], 'emoji': '✏️', 'ru': {'title': 'Мультиосевые рубрики вместо скалярных метрик для обучения генерации векторной графики', 'desc': 'В работе решается задача генерации кода Scalable Vector Graphics (SVG) из естественного языка с использованием новой системы оценки на основе рубрик. Авторы показывают, что стандартные скалярные метрики (CLIP, Aesthetic) плохо переносятся на векторную графику и вызывают reward hacking при использовании в обучении с подкреплением. Предложен метод RULER, который преобразует текстовые инструкции в детальные рубрики со множеством критериев (семантические, визуальные, стилистические), а языковая модель зрения оценивает каждый критерий отдельно. Полученные вознаграждения оптимизируются через Group Relative Policy Optimization без необходимости в парных примерах SVG или человеческих предпочтениях.'}, 'en': {'title': 'RULER: Elevating SVG Generation with Rubric-Based Rewards', 'desc': 'This paper presents a method for generating SVG code from natural language instructions using a new approach called RULER. RULER employs a multi-axis rubric to evaluate generated SVGs, which correlates better with human judgments than traditional scalar metrics. By using instance-aware rubric rewards, the method allows for fine-grained scoring without needing paired ground truth or human preferences. The results show significant improvements in SVG generation quality, outperforming existing models and demonstrating the effectiveness of rubric-based evaluation in reinforcement learning.'}, 'zh': {'title': '基于评分标准的SVG生成优化', 'desc': '本论文探讨了从自然语言指令生成可扩展矢量图形（SVG）代码的任务。由于缺乏绝对的视觉基准，评估和策略优化面临挑战。我们提出了一种基于评分标准的方法，使用多维评分系统来更好地与人类判断相关联。通过引入RULER（实例感知评分奖励），我们能够在没有配对SVG真值或人类偏好标签的情况下，优化生成的SVG质量。'}}}, {'id': 'https://huggingface.co/papers/2609.26796', 'title': 'Flash-dLLM: IO-Aware KV Caching and Parallel Decoding for Fast, Memory-Efficient Diffusion LLMs', 'url': 'https://huggingface.co/papers/2609.26796', 'abstract': 'Abstract  Diffusion Large Language Models (dLLMs) have recently emerged as a promising alternative to autoregressive LLMs by enabling non-autoregressive text generation. However, their practical deployment remains limited by inefficient inference, largely due to the absence of effective Key-Value (KV) caching and scalable parallel decoding mechanisms. Existing acceleration methods typically study KV caching and parallel decoding in isolation, overlooking the I/O bottlenecks that arise when cache reuse and parallel token verification are jointly applied. In this work, we introduce Flash-dLLM, a training-free inference acceleration framework for fast and memory-efficient dLLMs. Flash-dLLM first identifies GPU memory I/O as a dominant bottleneck in KV-cache-enabled dLLM inference and addresses it with an I/O-aware fused KV-cache kernel that reduces redundant memory movement. Building on this optimized cache mechanism, Flash-dLLM further proposes an efficient KV-cache-driven draft-and-verify decoding strategy, where the dLLM itself serves as both drafter and verifier without requiring an auxiliary model. This unified design enables faster decoding while preserving generation quality and improving scalability to longer sequences and larger batch size. Extensive experiments on mathematical reasoning and code-generation benchmarks demonstrate that Flash-dLLM consistently outperforms existing state-of-the-art dLLM acceleration methods in both inference speed and memory efficiency. In particular, it achieves 5.1times and 11.0times speedups over prior strongest baseline Elastic-Cache on GSM8K and HumanEval, respectively.', 'score': 3, 'issue_id': 3319, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': 'bffc23c6445360fb', 'authors': ['Quan Nguyen-Tri', 'Mukul Ranjan', 'Zhiqiang Shen'], 'affiliations': ['VILA Lab, MBZUAI Abu Dhabi, UAE'], 'pdf_title_img': 'assets/pdf/title_img/2609.26796.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Молниеносный инференс диффузионных моделей через оптимизацию кэширования', 'desc': 'Статья представляет Flash-dLLM — фреймворк для ускорения инференса диффузионных больших языковых моделей без переобучения. Авторы выявили, что основным узким местом является передача данных между GPU памятью, и решили эту проблему с помощью оптимизированного ядра кэширования ключ-значение пар. На основе этого механизма предложена эффективная стратегия генерации токенов с проверкой, где модель одновременно выступает как генератор гипотез и верификатор. Экспериментальные результаты показывают существенное ускорение инференса (до 11 раз) и улучшение памяти, при этом сохраняя качество генерируемого текста.'}, 'en': {'title': 'Accelerating dLLMs: Fast and Efficient Inference with Flash-dLLM', 'desc': 'This paper presents Flash-dLLM, a new framework designed to speed up the inference process of Diffusion Large Language Models (dLLMs). It addresses the inefficiencies caused by GPU memory I/O during the use of Key-Value (KV) caching and parallel decoding. By introducing an optimized KV-cache kernel and a novel draft-and-verify decoding strategy, Flash-dLLM enhances both speed and memory efficiency without needing additional models. The results show significant improvements in inference speed, achieving up to 11 times faster performance compared to existing methods on various benchmarks.'}, 'zh': {'title': 'Flash-dLLM：加速扩散大型语言模型的创新方案', 'desc': '扩散大型语言模型（dLLMs）是一种新兴的文本生成方法，能够实现非自回归生成。本文提出了Flash-dLLM，一个无需训练的推理加速框架，旨在提高dLLMs的推理速度和内存效率。通过优化键值缓存（KV-cache）机制，Flash-dLLM解决了GPU内存I/O瓶颈，并提出了一种高效的草拟和验证解码策略。实验结果表明，Flash-dLLM在推理速度和内存效率上均优于现有的最先进的dLLM加速方法。'}}}, {'id': 'https://huggingface.co/papers/2609.26457', 'title': 'Recursive self-improvement of AI research agents', 'url': 'https://huggingface.co/papers/2609.26457', 'abstract': "Abstract  AI agents are beginning to automate research and development across the AI stack, from improving training efficiency to optimizing inference. A natural next step is to improve the research efficiency of the agents themselves. When an AI research agent's own code is the object of optimization, each accepted rewrite becomes the agent that the next round edits. We refer to this loop as recursive self-improvement. Its significance lies in a long-standing trend, in which increased cumulative spending on R&D yields diminishing returns. Sustained self-improvement offers a way to counter this trend. We present AIDE^2, a system that implements this loop for a frontier AI research agent. It proposes changes to its own code, benchmarks modified versions of itself on a suite of AI R&D tasks, and keeps the changes that perform best on hidden evaluations. In an autonomous 8-day run, AIDE^2 discovered seven successive improvements, ranging from a new search policy to memory mechanisms that compress and manage the agent's growing context. These gains generalize to four held-out benchmarks spanning machine learning engineering, heuristic algorithm engineering, and physics-based weather forecasting, the last of which is out of distribution from the selection tasks. On all four, the strongest discovered agent matches or exceeds a human-engineered production research agent that ranks among the strongest on FML-Bench. On a separate held-out task family, the discovered agents also exhibit reduced reward hacking, a property the loop never explicitly optimized for: the rate falls from 55% to 32% during the run, 7 percentage points below the human-engineered agent. Together, these results show that an AI research agent can improve its own research efficiency through recursive self-improvement, and that these gains transfer to tasks and domains the loop never encountered.", 'score': 1, 'issue_id': 3319, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '64364d489b93769b', 'authors': ['Dhruv Srikanth', 'Bingchen Zhao', 'Dixing Xu', 'Yuxiang Wu', 'Zhengyao Jiang'], 'affiliations': ['Weco AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.26457.jpg', 'data': {'categories': ['#benchmark', '#agents', '#training', '#optimization', '#science'], 'emoji': '🔄', 'ru': {'title': 'AI-агент улучшает сам себя: от кода к открытиям', 'desc': 'В статье представлена система AIDE^2, которая реализует рекурсивное самоулучшение — процесс, при котором AI-агент автономно модифицирует собственный код, тестирует изменения на наборе задач исследования и оставляет наиболее эффективные версии. За восьмидневный период агент обнаружил семь последовательных улучшений, включая новые стратегии поиска и механизмы памяти для управления растущим контекстом. Полученные улучшения обобщаются на скрытых бенчмарках в области машинного обучения, эвристической оптимизации и прогнозирования погоды, демонстрируя способность к трансферу знаний. Результаты показывают, что AI-исследовательский агент может самостоятельно повышать эффективность своей работы через итеративную оптимизацию, противодействуя тенденции к убывающей отдаче от масштабирования R&D.'}, 'en': {'title': 'Empowering AI: Recursive Self-Improvement for Enhanced Research Efficiency', 'desc': 'This paper discusses a system called AIDE^2, which enables AI agents to enhance their own code through a process known as recursive self-improvement. By iteratively proposing and testing modifications to their own algorithms, these agents can optimize their performance on various AI research and development tasks. The study demonstrates that AIDE^2 successfully discovered multiple improvements over an 8-day period, leading to better performance than traditional human-engineered agents. Notably, the improvements also resulted in reduced instances of reward hacking, showcasing the potential for AI agents to autonomously enhance their efficiency and effectiveness.'}, 'zh': {'title': 'AI代理的自我改进之路', 'desc': '本文介绍了一种名为AIDE^2的系统，该系统能够实现递归自我改进，使AI研究代理能够优化自身代码。通过提出代码修改建议并在一系列AI研发任务上进行基准测试，AIDE^2在8天内发现了七个连续的改进。研究表明，这些改进不仅提高了代理的研究效率，还在多个未见过的任务上表现出色，超越了人类设计的研究代理。最终，结果显示AI研究代理能够通过递归自我改进来提升自身的研究效率，并且这些改进能够迁移到未接触过的任务和领域。'}}}, {'id': 'https://huggingface.co/papers/2609.25165', 'title': 'Ovis-Embedding: Pushing the Frontiers of Universal Omni-Modal Embeddings', 'url': 'https://huggingface.co/papers/2609.25165', 'abstract': 'Abstract  In this report, we introduce Ovis-Embedding, a state-of-the-art omni-modal embedding family built on native integration of text, image, video, and audio. Instead of assembling separate modality towers, Ovis-Embedding uses a shared multimodal backbone to encode different modalities in a common representation space. Specifically, we make three key advances: (1) native omni-modal initialization: we adopt a pretrained Qwen-omni model as the embedding backbone and adapt it through contrastive training with low-rank initialization; (2) data-centric omni-modal training: we construct a broad, high-quality corpus spanning text, images, video, audio, and interleaved multimodal data. To improve data efficiency, we introduce homogeneous-source sampling to form task-consistent batches with informative in-batch negatives; and (3) embedding-specific training and inference optimization: we use focal loss to emphasize hard examples and similarity-based Embedding Distillation to transfer fine-grained similarity structure from complementary experts. At inference time, low-rank feature decomposition enables compact embeddings with flexible dimensionality and minimal performance loss. Empirical evaluations show that the Ovis-Embedding family achieves state-of-the-art performance on MMEB-v3, MMEB-v2, MVEB, MAEB, and RTEB, demonstrating its effectiveness across text, image, video, and audio modalities. These results highlight the potential of unified omni-modal training to overcome modality fragmentation and advance universal embedding models for any-to-any retrieval.', 'score': 0, 'issue_id': 3319, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '4cd538151afdd8e8', 'authors': ['Ovis-Embedding Team'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2609.25165.jpg', 'data': {'categories': ['#benchmark', '#video', '#multimodal', '#audio', '#training'], 'emoji': '🎬', 'ru': {'title': 'Единое пространство для всех модальностей: универсальные омни-модальные эмбеддинги', 'desc': 'Ovis-Embedding представляет семейство мультимодальных эмбеддингов, объединяющих текст, изображения, видео и аудио в едином пространстве представлений через общий backbone на основе предобученной модели Qwen-omni. Авторы применяют контрастивное обучение с низкоранговой инициализацией и предлагают специальную стратегию формирования батчей с информативными негативными примерами для повышения эффективности обучения на разнородных данных. В процессе обучения использованы focal loss для акцентирования сложных примеров и Embedding Distillation для передачи структуры сходства от дополнительных экспертов. На этапе инференса низкоранговая декомпозиция признаков позволяет создавать компактные эмбеддинги с гибкой размерностью, сохраняя качество на всех модальностях.'}, 'en': {'title': 'Unified Embeddings for All Modalities', 'desc': 'Ovis-Embedding is a new approach to creating embeddings that can handle multiple types of data, like text, images, videos, and audio, all at once. Instead of using separate models for each type of data, it uses a single backbone model that integrates all these modalities into one shared space. The method includes innovative techniques such as using a pretrained model for better initialization, creating a diverse dataset for training, and optimizing the training process to focus on challenging examples. The results show that Ovis-Embedding outperforms existing models in various tasks, proving its effectiveness in unifying different data types for better retrieval.'}, 'zh': {'title': '统一全模态嵌入，突破模态碎片化', 'desc': '本文介绍了Ovis-Embedding，这是一种先进的全模态嵌入方法，能够同时处理文本、图像、视频和音频。与传统的分开处理不同模态的方法不同，Ovis-Embedding使用共享的多模态骨干网络，将不同模态编码到一个共同的表示空间中。我们在三个方面取得了重要进展，包括使用预训练的Qwen-omni模型进行嵌入初始化，以及通过对比训练和低秩初始化来优化模型。此外，我们还通过同源采样和焦点损失等技术提高了数据效率和训练效果。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (1)', '#agi', '#alignment', '#architecture', '#audio (1)', '#benchmark (3)', '#cv', '#data', '#dataset (1)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (2)', '#open_source', '#optimization (1)', '#plp', '#rag', '#reasoning', '#rl (1)', '#rlhf (1)', '#robotics', '#science (1)', '#security', '#small_models', '#story_generation', '#survey', '#synthetic', '#training (2)', '#transfer_learning', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-23 02:35',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-23 02:35')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-23 02:35')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
