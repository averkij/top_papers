    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        function toggleTheme() {

                const title = document.getElementById('doomgrad');

                titleSign.classList.add('rotate');

                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";

        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.12572', 'title': 'DiffusionART: Efficient, Stable and Scalable Reinforcement of Diffusion Models', 'url': 'https://huggingface.co/papers/2610.12572', 'abstract': "Abstract  Online reinforcement learning (RL) fine-tunes diffusion models with black-box rewards, but reverse-process methods such as Flow-GRPO are limited in efficiency by poor credit assignment, while forward-process methods such as DiffusionNFT are efficient yet unstable without carefully tuned exponential-moving-average (EMA) off-policy training. We show that NFT-style objectives contain a hidden forward--reverse consistency force that joint positive--negative training cancels only partially, and that EMA stabilizes training through restoration rather than off-policy rollouts. We introduce DiffusionART (Diffusion Reinforcement with Aggregation-First Reward Tilting), which aggregates each prompt's rewards into a shared reward-improving direction for reverse-process states, removing the consistency force by construction, and adds a trust-region-masked second update for drift-adaptive restoration without EMA tuning. It requires no differentiable reward model, remains effective with fewer samples per prompt, and supports pairwise reward models (DiffusionART-Pairwise). Across image and video generation, DiffusionART trains efficiently and stably without per-task tuning. In particular, on HunyuanVideo-13B with equally weighted visual and motion quality rewards, DiffusionART reaches the late-stage mean reward levels of DiffusionNFT and Flow-GRPO-Fast with 12.02 and 11.72 times fewer GPU hours, respectively, while achieving 28.8% and 53.0% higher mean training rewards.", 'score': 227, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'cf2699e89763a436', 'authors': ['Zhenglin Wan', 'Jiayu Chen', 'Zhengfeiyang Zhang', 'Pengfei Zhou', 'Wangbo Zhao', 'Fangyuan Kong', 'Pengfei Wan', 'Kun Gai', 'Yang You'], 'affiliations': ['HKUST', 'HPC-AI Lab, National University of Singapore', 'Kling AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.12572.jpg', 'data': {'categories': ['#optimization', '#diffusion', '#training', '#rl', '#video'], 'emoji': '⚡', 'ru': {'title': 'Эффективное обучение с подкреплением диффузионных моделей через согласованность процессов', 'desc': 'В статье предложен новый метод DiffusionART для онлайн обучения с подкреплением диффузионных моделей, используя чёрный ящик функций награды. Авторы выявили скрытые противоречия между прямым и обратным процессами в NFT-подобных целевых функциях и показали, что экспоненциальное скользящее среднее стабилизирует обучение через восстановление состояния. DiffusionART агрегирует награды каждого промпта в единое направление улучшения и применяет маскированное доверительное ограничение для адаптивного восстановления без тонкой настройки гиперпараметров. Метод демонстрирует значительное ускорение обучения: на видеогенерационной модели HunyuanVideo-13B достигается уровень награды конкурентных методов в 12 раз быстрее при экономии вычислительных ресурсов.'}, 'en': {'title': 'Efficient and Stable Training with DiffusionART', 'desc': 'This paper presents DiffusionART, a new method for online reinforcement learning that fine-tunes diffusion models using aggregated rewards. It addresses the inefficiencies of existing methods by eliminating the hidden consistency force that complicates training. DiffusionART utilizes a trust-region-masked update to stabilize training without the need for exponential-moving-average tuning. The method demonstrates significant improvements in efficiency and reward levels across image and video generation tasks, requiring fewer samples and GPU hours compared to previous approaches.'}, 'zh': {'title': 'DiffusionART：高效稳定的扩散模型强化学习', 'desc': '本文介绍了一种新的在线强化学习方法，称为DiffusionART，旨在优化扩散模型的训练效率。与传统的反向过程方法相比，DiffusionART通过聚合奖励来消除一致性强制，从而提高了训练的稳定性。该方法不需要可微分的奖励模型，并且在每个提示上使用更少的样本仍然有效。实验结果表明，DiffusionART在图像和视频生成任务中表现出色，显著减少了GPU使用时间，同时提高了训练奖励。'}}}, {'id': 'https://huggingface.co/papers/2610.13527', 'title': 'S-Space: Exploring Spatial Workspace in Multimodal Language Models', 'url': 'https://huggingface.co/papers/2610.13527', 'abstract': 'Abstract  Multimodal language models (MLLMs) exhibit promising spatial reasoning capabilities, yet the internal mechanisms supporting them remain poorly understood. We uncover S-Space, a linear representation subspace in which object-token representations encode continuous coordinates along horizontal, vertical, and distance axes. Although we identify these axes by differentiating spatial-answer scores with respect to object-token activations, S-Space is intrinsic rather than induced by specific data or prompts, remaining readable under non-spatial questions. We show that S-Space functions as an internal spatial workspace of MLLMs. Perception encodes object locations into it, forming spatial representations that can be directly read out to support accurate spatial judgments. Internal reasoning transforms it for changing viewpoints. Verbal responses selectively access it, evidenced by causal interventions that alter spatial judgments while largely preserving non-spatial responses. Case studies further show that S-Space assigns locations to unseen entities and the observer, and connects physical directions with abstract linguistic meanings, suggesting both the capabilities and limitations of large-scale language training. Finally, we use S-Space as a diagnostic tool for spatial reasoning failures. Direction-word readouts reveal systematic coupling between cardinal and image-relative reference frames. More importantly, a perception-computation decomposition exposes a key bottleneck: MLLMs can form capable spatial representations, yet fall short in the spatial transformations required to reason reliably across viewpoint changes.', 'score': 200, 'issue_id': 3400, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '9138bc67ad664dd9', 'pdf_title_img': 'assets/pdf/title_img/2610.13527.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Раскрытие скрытого пространственного рабочего стола в многомодальных языковых моделях', 'desc': 'Исследователи обнаружили S-Space — линейное подпространство представлений в многомодальных языковых моделях, где активации токенов объектов кодируют пространственные координаты вдоль горизонтальной, вертикальной и дистанционной осей. Это подпространство является внутренним свойством модели и функционирует как пространственный рабочий стол, поддерживающий восприятие, рассуждения и вербальные ответы. Авторы применили методы каузального вмешательства и градиентного анализа для демонстрации того, что пространственные суждения напрямую зависят от активации в S-Space. Анализ выявил ключевое узкое место: модели способны формировать качественные пространственные представления, но испытывают сложности при пространственных трансформациях при смене точки зрения.'}, 'en': {'title': 'Unlocking Spatial Reasoning in Multimodal Language Models', 'desc': 'This paper explores the internal workings of multimodal language models (MLLMs) and introduces a concept called S-Space, which is a linear representation subspace for spatial reasoning. S-Space allows MLLMs to encode object locations in a way that supports spatial judgments, even when asked non-spatial questions. The study reveals that while MLLMs can create effective spatial representations, they struggle with transforming these representations when viewpoints change. Additionally, S-Space serves as a diagnostic tool to identify spatial reasoning failures in MLLMs, highlighting the relationship between spatial and linguistic understanding.'}, 'zh': {'title': '揭示多模态语言模型的空间推理机制', 'desc': '多模态语言模型（MLLMs）展现出良好的空间推理能力，但其内部机制尚不清楚。我们发现了S-Space，这是一个线性表示子空间，其中对象标记表示沿水平、垂直和距离轴编码连续坐标。S-Space作为MLLMs的内部空间工作区，感知将对象位置编码到其中，形成可以直接读取的空间表示，以支持准确的空间判断。尽管MLLMs能够形成有效的空间表示，但在视角变化时所需的空间转换能力仍然不足。'}}}, {'id': 'https://huggingface.co/papers/2610.12772', 'title': 'Reflex: Visually Grounded Reactive Humanoid Control', 'url': 'https://huggingface.co/papers/2610.12772', 'abstract': "Abstract  Humans effortlessly react to the world; they adeptly return a tennis shot, catch a falling cup, step aside from a passing cart, or pass a box tossed during truck unloading. These everyday actions require anticipating a moving target and reflexively responding with the whole body within about a second. Such visual reactive whole-body control remains challenging for humanoids, which must (1) coordinate whole-body control, (2) react to object dynamics in real time, and (3) ground perception in egocentric vision. We study catching thrown boxes as a representative task that demands all three capabilities; existing systems cover only part of it, relying on end-effectors, motion capture, or marked objects. We present Reflex, a three-stage framework that learns these capabilities stage by stage while connecting them through a compact representation of object dynamics. First, a state-based policy learns whole-body catching with reinforcement learning. Second, the policy learns to infer the dynamics of a moving box from delayed and incomplete observations. Third, an egocentric RGB-D encoder learns to recover this dynamics representation directly from visual observations while keeping the whole-body controller fixed. This decomposition provides each capability with a direct training signal and makes visual learning substantially more scalable. In simulation, Reflex achieves 85.7% catch success from egocentric RGB-D, compared with 87.9% when given privileged box observations. Temporal visual history is critical: removing it reduces success by 35.6 and 39.8 points on centered and laterally offset throws. On a real Unitree G1, Reflex catches human-thrown boxes with 65% and 40% success at 2.5 and 5 m, reaching 76% and 59% of human catchers' success at the same distances.", 'score': 128, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'a0bf438d5391d6a7', 'authors': ['Taoyang Jia', 'Weikai Huang', 'Linxin Song', 'Jared Darlington', 'Jieyu Zhao', 'Yue Wang', 'Jiafei Duan', 'Zhongzheng Ren', 'Ranjay Krishna'], 'affiliations': ['Allen Institute for AI', 'National University of Singapore', 'Stanford University', 'University of North Carolina at Chapel Hill', 'University of Southern California', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2610.12772.jpg', 'data': {'categories': ['#robotics', '#cv', '#multimodal', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Рефлексивная ловля: соединение визуальной динамики и управления всем телом', 'desc': 'В работе представлена система Reflex для обучения гуманоидного робота ловить летящие предметы, используя эгоцентрическое RGB-D видение. Авторы предлагают трёхэтапный подход: сначала обучают политику контроля всего тела с помощью обучения с подкреплением, затем обучают предсказывать динамику движущегося объекта из неполных наблюдений, и наконец обучают визуальный кодировщик восстанавливать представление динамики напрямую из видеонаблюдений. Разложение задачи на подзадачи позволяет каждому компоненту получать прямой сигнал обучения и делает обучение на основе зрения более масштабируемым. На реальном роботе Unitree G1 система достигает успешного захвата в 65% случаев на расстоянии 2.5 метра, что соответствует 76% успешности ловли человеком.'}, 'en': {'title': 'Reflex: Mastering Whole-Body Catching with Real-Time Dynamics', 'desc': 'This paper presents Reflex, a novel framework designed to enhance the ability of humanoid robots to catch moving objects, specifically thrown boxes. It addresses three key challenges: coordinating whole-body control, reacting to real-time object dynamics, and utilizing egocentric vision for perception. The framework is developed in three stages, starting with reinforcement learning for whole-body catching, followed by learning to infer object dynamics from incomplete observations, and finally using an RGB-D encoder for visual learning. Reflex demonstrates significant success in both simulation and real-world scenarios, achieving high catch rates that approach human performance.'}, 'zh': {'title': '全身反应控制的智能捕捉系统', 'desc': '本论文研究了人类如何快速反应并控制全身以应对动态物体，例如接住投掷的盒子。我们提出了一种名为Reflex的三阶段框架，通过强化学习逐步学习全身捕捉、动态推断和视觉编码等能力。该框架通过紧凑的物体动态表示将这些能力连接起来，使得视觉学习更加可扩展。实验结果表明，Reflex在模拟环境中和真实环境中均表现出色，成功捕捉率接近人类水平。'}}}, {'id': 'https://huggingface.co/papers/2610.12611', 'title': 'SoftwareGym: Scaling Computer-Use Agent Training with Diverse Synthesized Software Environments', 'url': 'https://huggingface.co/papers/2610.12611', 'abstract': 'Abstract  Computer-use agents (CUAs) are rapidly improving, yet synthesizing diverse and reliable software environments at scale remains challenging. Native application environments require substantial construction and integration effort, which limits application coverage and increases the risk of application-specific overfitting. Browser-hosted environments provide limited interaction depth and workflow complexity. These limitations motivate SoftwareGym, an automated pipeline for synthesizing GUI software environments with diverse interfaces, executable functionality, and runtime-verified behavior. It generates structurally diverse designs, realizes them as runnable applications, and uses GUI evaluation with iterative repair to ensure functional reliability. Using SoftwareGym, we synthesize 182 applications across twelve categories and achieve a mean GUI task pass rate of 91.5%. We construct SoftwareGym-Bench, a 120-task evaluation suite spanning the same twelve categories, and use trajectories collected from these environments for CUA training. The resulting model improves Pass@3 from 41.39% to 56.97% on the strictly out-of-domain OSWorld benchmark and achieves 40.0% on SoftwareGym-Bench. These results demonstrate the potential of synthesized software environments as scalable and transferable supervision for CUA training.', 'score': 82, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '7bdebe5658cad601', 'authors': ['Tian Jin', 'Wenhao Wang', 'Jing Kang', 'Haoting Shi', 'Rui Ye', 'Yijun Lu', 'Siheng Chen'], 'affiliations': ['Shanghai Jiaotong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12611.jpg', 'data': {'categories': ['#agents', '#dataset', '#benchmark'], 'emoji': '🏭', 'ru': {'title': 'Синтез виртуальных приложений для обучения компьютерных агентов', 'desc': 'В статье представляется SoftwareGym — автоматизированный конвейер для синтеза разнообразных графических приложений с целью обучения агентов, работающих с компьютерным интерфейсом. Система генерирует структурно различные дизайны приложений, реализует их как исполняемые программы и использует итеративную проверку через GUI для обеспечения функциональной надёжности. Авторы синтезировали 182 приложения по 12 категориям и создали оценочный набор SoftwareGym-Bench из 120 задач для тестирования агентов. Полученные модели показали значительное улучшение производительности на независимых тестовых наборах, что демонстрирует эффективность синтезированных окружений как масштабируемого источника обучающих данных.'}, 'en': {'title': 'Empowering CUAs with Diverse and Reliable Software Environments', 'desc': 'This paper introduces SoftwareGym, an automated system designed to create diverse graphical user interface (GUI) software environments for training computer-use agents (CUAs). It addresses the challenges of building native application environments, which can be time-consuming and prone to overfitting. SoftwareGym generates a variety of runnable applications and ensures their reliability through iterative GUI evaluation and repair. The results show that using these synthesized environments significantly improves the performance of CUAs in various tasks, demonstrating their effectiveness as a scalable training resource.'}, 'zh': {'title': '合成软件环境，提升智能代理训练效果', 'desc': '本文介绍了一种名为SoftwareGym的自动化管道，用于合成具有多样化界面的图形用户界面（GUI）软件环境。该系统能够生成结构多样的设计，并将其实现为可运行的应用程序，同时通过GUI评估和迭代修复确保功能的可靠性。通过使用SoftwareGym，我们合成了182个应用程序，并在12个类别中实现了91.5%的平均GUI任务通过率。研究结果表明，合成的软件环境可以作为可扩展和可转移的监督，显著提升计算机使用代理（CUA）的训练效果。'}}}, {'id': 'https://huggingface.co/papers/2610.13021', 'title': 'EmbodiedCLBench: Evaluating Continual Learning for Self-Evolving Embodied Agents', 'url': 'https://huggingface.co/papers/2610.13021', 'abstract': 'Abstract  Continual learning requires models to accumulate past experience and transfer it to new tasks. Despite substantial research on continual learning, existing work remains largely confined to non-embodied settings, without extending to embodied environments. To address this gap, we introduce EmbodiedCLBench, the first benchmark in embodied simulation for evaluating the continual learning capability of self-evolving agents. With compositional generalization as the core evaluation principle, our benchmark evaluates whether agents can first learn from basic tasks and then recombine the acquired skills to solve complex, unseen advanced tasks. Based on EmbodiedCLBench, we conduct extensive experiments across multiple agent harnesses and learning methods, revealing consistent limitations and distinctive behaviors. Our results show that while advanced tasks can be hardly solved under zero-shot setting, the experience from basic tasks enables consistent improvement. Such benefit from the experience remains stable even if the task complexity increases. However, this improvement does not scale accordingly with the number of learning samples, and current agents cannot extract meaningful information from additional experience. Collectively, our findings highlight continual learning as a fundamental yet underexplored capability, and our benchmark offers valuable resources for designing effective self-evolving agents in embodied environments. Our code and dataset are available at https://pku-value-lab.github.io/EmbodiedCLBench-homepage.', 'score': 62, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'cab6f9b8321540b9', 'authors': ['Jie Huang', 'Yanan Chen', 'Ruixun Liu', 'Kaichen He', 'Xinyi He', 'Rui Huang', 'Zilong Zheng', 'Zhenliang Zhang', 'Yiwu Zhong'], 'affiliations': ['School of Intelligence Science and Technology, Peking University', 'State Key Laboratory of General Artificial Intelligence, BIGAI, Beijing, China', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.13021.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#robotics', '#agents', '#transfer_learning'], 'emoji': '🤖', 'ru': {'title': 'Построение агентов, которые учатся и комбинируют навыки в виртуальных мирах', 'desc': 'В работе представлена EmbodiedCLBench — первый бенчмарк для оценки способности агентов к continual learning в симуляционных средах с физическим моделированием. Авторы предлагают оценивать agents по принципу композиционной обобщаемости: могут ли они сначала усвоить базовые навыки, а затем комбинировать их для решения сложных неизвестных задач. Экспериментальные результаты показывают, что опыт из простых задач стабильно улучшает производительность на сложных задачах, однако агенты плохо масштабируют обучение с увеличением объёма данных. Исследование выявляет существенный пробел в текущих методах continual learning для embodied agents и предоставляет инструменты для разработки более эффективных self-evolving моделей.'}, 'en': {'title': 'Empowering Agents: Learning from Experience in Embodied Environments', 'desc': "This paper addresses the challenge of continual learning in embodied environments, where agents must learn from past experiences to tackle new tasks. The authors introduce EmbodiedCLBench, a benchmark designed to evaluate how well self-evolving agents can generalize skills learned from simpler tasks to solve more complex, unseen tasks. Through experiments, they find that while agents struggle with advanced tasks in a zero-shot setting, prior experience from basic tasks significantly aids their performance. However, the study also reveals that the benefits of this experience do not scale with the number of learning samples, indicating limitations in current agents' ability to leverage additional information effectively."}, 'zh': {'title': '持续学习：自我进化代理的新挑战', 'desc': '持续学习要求模型积累过去的经验并将其转移到新任务中。尽管在持续学习方面进行了大量研究，但现有工作主要集中在非具身环境中，未能扩展到具身环境。为了解决这个问题，我们引入了EmbodiedCLBench，这是第一个用于评估自我进化代理在具身模拟中持续学习能力的基准。我们的实验表明，尽管在零样本设置下很难解决高级任务，但基本任务的经验能够持续改善代理的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.07987', 'title': 'VisionWeave: Weaving Elastic Visual Representations as a Native Capability of MLLMs', 'url': 'https://huggingface.co/papers/2610.07987', 'abstract': 'Abstract  Multimodal large language models have become the dominant paradigm for visual understanding, but incur substantial costs by encoding inputs into dense, fixed-size patch tokens. However, visual information is unevenly distributed: some regions require fine-grained detail, while others admit compact representations. Downsampling sacrifices this detail, while existing token pruning and adaptive approaches remain limited in content-adaptive granularity, task generalization, and integration with modern MLLMs and serving infrastructure. Overcoming these limitations calls for foundation models that learn, end to end, where-and at what granularity-to allocate visual representations, a native capability we term elastic visual representation weaving. We introduce VisionWeave, establishing this capability in frontier-level MLLMs through large-scale training. It combines two components: a gated spatial pooler constructs coarse-grained representations alongside native fine-grained representations within a shared MRoPE coordinate, while a granularity router learns their content-adaptive allocation. Through self-distillation alone, we validate this capability on Qwen3.5-4B and scale to Qwen3.8-27B with over 30K A100 GPU-hours. Based on Qwen3.8-27B, VisionWeave adaptively adjusts token savings to visual content, saving 43.0% tokens on average while retaining 98.9% native performance across eight benchmarks, versus only 88% performance preserved for token pruning baselines with a fixed 50% savings target. Extensive evaluations confirm robust efficiency-quality trade-offs across diverse tasks, resolutions and video frames. When deployed on SGLang serving engine, our method achieves a 2.3x throughput gain while reducing mean TTFT by 54.4% and mean TPOT by 60.6%. Together, we believe these results position elastic visual weaving as a promising capability for next-generation multimodal models.', 'score': 55, 'issue_id': 3399, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '3da571a45b871df0', 'authors': ['Yuan Feng', 'Qize Yang', 'Ruizhe Chen', 'Sibo Song', 'Haolin He', 'Muzhi Zhu', 'Zihan Liu', 'Yunfei Chu', 'Xize Cheng', 'Yuxuan Wang', 'Jin Xu', 'Xike Xie'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'The Chinese University of Hong Kong', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.07987.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#training', '#inference'], 'emoji': '🧵', 'ru': {'title': 'Адаптивное плетение визуальных представлений для эффективных мультимодальных моделей', 'desc': 'В работе представлена методика VisionWeave для оптимизации мультимодальных больших языковых моделей путём адаптивного распределения визуальных представлений с разной детализацией. Ключевая идея заключается в том, что различные области изображения требуют разной степени детализации: некоторые нуждаются в мелкозернистых деталях, а другие могут быть представлены компактнее. Архитектура включает пространственный пулер для создания многоуровневых представлений и маршрутизатор гранулярности для адаптивного выбора между ними в зависимости от содержания. На практике метод достигает экономии 43% токенов при сохранении 98.9% производительности, а при развёртывании обеспечивает 2.3-кратный прирост пропускной способности.'}, 'en': {'title': 'Elastic Visual Representation Weaving for Efficient Multimodal Learning', 'desc': 'This paper introduces VisionWeave, a new approach for improving visual understanding in multimodal large language models (MLLMs). It addresses the inefficiencies of fixed-size patch tokens by allowing the model to adaptively allocate visual representations based on content, which enhances detail where needed. The method combines a gated spatial pooler for creating both coarse and fine representations, and a granularity router that optimizes their use. VisionWeave demonstrates significant improvements in token efficiency and performance across various tasks, making it a promising advancement for future MLLMs.'}, 'zh': {'title': '弹性视觉编织：下一代多模态模型的潜力', 'desc': '多模态大型语言模型在视觉理解中占据主导地位，但在将输入编码为固定大小的补丁令牌时会产生高昂的成本。视觉信息分布不均，有些区域需要细致的细节，而其他区域则可以使用紧凑的表示。我们提出了VisionWeave，通过大规模训练实现了弹性视觉表示编织的能力，能够自适应地调整视觉内容的令牌分配。实验结果表明，该方法在保持高性能的同时，显著提高了效率，适用于多种任务和场景。'}}}, {'id': 'https://huggingface.co/papers/2609.38748', 'title': 'Here the World in Stereo: Learning Dynamic Spatial Correspondence for Immersive Joint Video-Audio Generation', 'url': 'https://huggingface.co/papers/2609.38748', 'abstract': 'Abstract  Recent joint video-audio generation models have achieved strong semantic correspondence and temporal synchronization. However, applications such as AR/VR and interactive gaming further require stereo audio to provide an immersive sense, which remains largely overlooked. Effective stereo audio requires the perceived sound location to evolve consistently with the motion of its corresponding visual source. We refer to this property as Dynamic Spatial Correspondence and propose StereoBind, a framework that binds visual source motion to stereo sound generation. StereoBind uses motion tracks to coordinate visual motion and stereo audio through three complementary mechanisms. Visual Motion Binding establishes source-aware audiovisual correspondence, the Spatial Track Encoder captures absolute source positions, and Residual Track RoPE models relative motion. For supervision and evaluation, we construct StereoWorld-29K, a large-scale stereo audio-video dataset with paired motion tracks, and StereoWorldBench for measuring audiovisual spatial consistency. Experiments show that StereoBind substantially improves spatial alignment in stereo audio generation over existing models while preserving overall audiovisual quality.', 'score': 51, 'issue_id': 3399, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '673dd5ef40b52766', 'authors': ['Hanmo Chen', 'Chengcheng Liu', 'Tianxiao Chen', 'Zheyu Zhang', 'Siming Zheng', 'Jinwei Chen', 'Xu Yang', 'Cheng Deng', 'Bo Li', 'Peng-tao Jiang'], 'affiliations': ['Xidian University', 'vivo BlueImage Lab, vivo Mobile Communication Co., Ltd.'], 'pdf_title_img': 'assets/pdf/title_img/2609.38748.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#multimodal', '#audio', '#video'], 'emoji': '🎬', 'ru': {'title': 'Привязка движения видео к пространственному стереозвуку', 'desc': 'В работе предлагается StereoBind — фреймворк для генерации стереофонического аудио, синхронизированного с движением визуальных объектов в видео. Авторы вводят концепцию Dynamic Spatial Correspondence, которая обеспечивает соответствие воспринимаемого положения звука движению источника на экране. Система использует три взаимодополняющих механизма: привязку визуального движения к источнику звука, энкодер для захвата абсолютных позиций и механизм относительного движения на основе RoPE. Для обучения и оценки создана большая датасет StereoWorld-29K с видео, стереоаудио и треками движения, а также бенчмарк StereoWorldBench для измерения пространственной согласованности.'}, 'en': {'title': 'Enhancing Stereo Audio with Visual Motion Synchronization', 'desc': "This paper introduces StereoBind, a new framework designed to enhance the generation of stereo audio that corresponds with visual motion in video. It addresses the challenge of achieving Dynamic Spatial Correspondence, which ensures that the sound location changes in sync with the visual source's movement. StereoBind employs three key mechanisms: Visual Motion Binding for audiovisual alignment, a Spatial Track Encoder for capturing absolute positions, and Residual Track RoPE for modeling relative motion. The authors also present a new dataset, StereoWorld-29K, to support the training and evaluation of their model, demonstrating significant improvements in spatial audio alignment while maintaining high audiovisual quality."}, 'zh': {'title': '动态空间对应：立体音频生成的新突破', 'desc': '最近的联合视频-音频生成模型在语义对应和时间同步方面取得了显著进展。然而，增强现实（AR）/虚拟现实（VR）和互动游戏等应用需要立体音频来提供沉浸感，这一需求尚未得到充分重视。有效的立体音频要求感知的声音位置与其对应的视觉源的运动一致变化。我们提出了StereoBind框架，将视觉源运动与立体声音生成绑定，显著提高了立体音频生成中的空间对齐效果。'}}}, {'id': 'https://huggingface.co/papers/2610.13395', 'title': 'ProgramGym: Scaling Training Environments for Long-Horizon Program Reproduction Agents', 'url': 'https://huggingface.co/papers/2610.13395', 'abstract': 'Abstract  Coding agents are increasingly used to build programs from scratch as software engineers do rather than to resolve issues within a repository or to generate a repository from a given requirements document. However, scalable verifiable training environments that force agents to discover what is required and to decide how the system should be designed remain scarce. Moreover, existing agent workflows also cannot sustain long-horizon development in which the agent explores the reference program before implementation. To address these challenges, we introduce ProgramGym, a framework consisting of Program-Env and Program-Agent for scalable training environments of long-horizon program reproduction agents. Specifically, Program-Env constructs verifiable training environments from repositories through a feedback-driven loop that repairs runtime sandbox builds and the quality of black-box tests. Using this novel pipeline, we obtain 1,648 training environments spanning C, C++, Go, and Rust. Program-Agent combines a role-isolated workflow of analysis, implementation, and review with revision management for compilation checks and failure recovery. Experiments on ProgramBench show that both Program-Env and Program-Agent improve performance on program reproduction. Fine-tuning on trajectories with these constructed environments raises the performance of Qwen3.8-27B from 34.87% to 42.84%. Program-Agent further raises the base and SFT models to 55.71% and 56.25%, both exceeding some flagship models. We will release the ProgramGym to support further research on coding agents that build programs from scratch.', 'score': 47, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'ddfbfb72778877b3', 'authors': ['Chengyi Yang', 'Renxu Bao', 'Jue Hou', 'Zongpei Teng', 'Ziheng Wang', 'Yujie Lin', 'Chengsong Huang', 'Junnan Zhu', 'Delai Qiu', 'Yining Wang', 'Shengping Liu', 'Fei Long', 'Jinsong Su'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'Unisound', 'Washington University in St. Louis', 'Xiamen University'], 'pdf_title_img': 'assets/pdf/title_img/2610.13395.jpg', 'data': {'categories': ['#plp', '#agents', '#dataset', '#training'], 'emoji': '🔨', 'ru': {'title': 'Обучение агентов на репозиториях для создания программ с нуля', 'desc': 'В статье представляется ProgramGym — фреймворк для обучения агентов, которые могут воспроизводить полные программы с нуля, подобно тому, как это делают реальные программисты. Program-Env создаёт масштабируемые проверяемые окружения для тренировки, автоматически восстанавливая песочницы и улучшая качество тестов из реальных репозиториев. Program-Agent реализует специализированный workflow с анализом, реализацией и рецензированием кода, включая управление версиями и восстановление после ошибок. Экспериментальные результаты показывают значительное улучшение производительности: fine-tuning модели Qwen3.8-27B повышает точность с 34.87% до 42.84%, а программный агент достигает 56.25%, превосходя некоторые флагманские модели.'}, 'en': {'title': 'Empowering Coding Agents with ProgramGym for Enhanced Software Development', 'desc': 'This paper presents ProgramGym, a new framework designed to enhance the training of coding agents that create software from the ground up. It introduces Program-Env, which generates scalable and verifiable training environments by utilizing a feedback loop to improve runtime builds and test quality. Additionally, Program-Agent employs a structured workflow that includes analysis, implementation, and review processes, along with mechanisms for managing revisions and handling compilation errors. The results show significant performance improvements in program reproduction tasks, demonstrating the effectiveness of this framework in advancing the capabilities of coding agents.'}, 'zh': {'title': '构建程序的智能代理新框架', 'desc': '本文介绍了一个名为ProgramGym的框架，旨在为长时间程序重现代理提供可扩展的训练环境。ProgramGym由Program-Env和Program-Agent组成，能够构建可验证的训练环境，并通过反馈驱动循环修复运行时沙箱构建和黑箱测试的质量。实验结果表明，Program-Env和Program-Agent在程序重现任务中显著提高了性能，尤其是在Qwen3.8-27B模型的微调中，性能从34.87%提升至42.84%。该框架的发布将支持进一步研究从零开始构建程序的编码代理。'}}}, {'id': 'https://huggingface.co/papers/2610.13113', 'title': 'Continually Post-training Small Models via Synthetic Self-distillation', 'url': 'https://huggingface.co/papers/2610.13113', 'abstract': "Abstract  Continual post-training faces a dual challenge of acquisition and retention: models must learn new capabilities while preserving prior knowledge. While Self-Distillation Fine-Tuning (SDFT) mitigates this using self-supervision with in-context demonstrations, it relies on strong in-context learning and instruction-following abilities. Consequently, SDFT fails on smaller models critical for low-latency, on-device use. To enable continual learning at smaller scales, we first identify the root cause of failure. We show that poor acquisition and forgetting correlate linearly with the post-trained model's distribution shift, revealing the necessity of in-distribution learning. We thus introduce Synthetic Self-Distillation (SynthSelf), imitating SDFT's in-distribution rewrite by outsourcing the task to a minimally larger, same-family aligner. Coupled with off-policy supervision and rejection sampling, this provides the high-quality supervision small models require without breaking their original distribution. Evaluations spanning 4 acquisition datasets (including a mixture) and 14 retention benchmarks show SynthSelf consistently outperforms 6 methods (including off- and on-policy distillation) across 3 small model scales. Extensive further analyses confirm SynthSelf paves the way toward effective small-model continual learning.", 'score': 41, 'issue_id': 3400, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '240221f9b5df6fa1', 'authors': ['Woosung Koh', 'Hyunsoo Lee', 'Kyungjae Lee', 'Haeju Park', 'Dahyun Lee', 'Dasol Hwang', 'Moontae Lee'], 'affiliations': ['KAIST', 'LG AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2610.13113.jpg', 'data': {'categories': ['#training', '#dataset', '#synthetic', '#small_models', '#benchmark', '#transfer_learning'], 'emoji': '🧠', 'ru': {'title': 'Синтетическая самодистилляция для эффективного непрерывного обучения маленьких моделей', 'desc': 'В статье рассматривается проблема непрерывного обучения языковых моделей, которые должны одновременно усваивать новые знания и сохранять старые. Авторы показывают, что существующий метод Self-Distillation Fine-Tuning неэффективен для маленьких моделей, потому что они плохо справляются с задачами in-context learning. Они предлагают новый метод Synthetic Self-Distillation, который использует большую вспомогательную модель для создания высококачественных синтетических данных, сохраняя исходное распределение маленькой модели. Экспериментальные результаты показывают, что метод значительно превосходит существующие подходы к дистилляции на моделях разных размеров.'}, 'en': {'title': 'Empowering Small Models for Continual Learning with SynthSelf', 'desc': 'This paper addresses the challenge of continual learning in machine learning models, particularly focusing on the balance between acquiring new knowledge and retaining existing knowledge. The authors introduce a method called Synthetic Self-Distillation (SynthSelf), which enhances the performance of smaller models that struggle with continual learning due to distribution shifts. By using a larger model to provide high-quality supervision, SynthSelf allows smaller models to learn new tasks without losing their original capabilities. The results demonstrate that SynthSelf significantly improves the continual learning process for small models across various datasets and benchmarks.'}, 'zh': {'title': '小模型的持续学习新方法', 'desc': '持续后训练面临获取和保留的双重挑战：模型必须学习新能力，同时保留先前知识。自我蒸馏微调（SDFT）通过自我监督和上下文示例来缓解这一问题，但在小型模型上效果不佳，这些模型对于低延迟和设备端使用至关重要。我们提出合成自我蒸馏（SynthSelf），通过将任务外包给一个稍大且同类的对齐器，来模仿SDFT的分布重写，从而实现小规模的持续学习。评估结果表明，SynthSelf在多个数据集和基准测试中始终优于其他方法，证明了其在小型模型持续学习中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.12984', 'title': 'Work2Skill: Capturing Human GUI Experience for Reusable Agent Skill Induction', 'url': 'https://huggingface.co/papers/2610.12984', 'abstract': "Abstract  Computer-use agents can perform increasingly complex GUI tasks, yet unfamiliar software and workflows requiring human domain knowledge remain challenging. Human demonstrations convey procedural knowledge through the same GUI interaction space, but reuse requires interpreting actions in context and separating workflow rules from task-specific details. We thus introduce Work2Skill, a framework that captures human GUI experience for reusable agent skill induction. WorkRecorder provides the framework's infrastructure for collecting this experience, aligning screen recordings, mouse and keyboard events, and available accessibility-tree information. Using WorkRecorder, we construct WorkDemo-350, the first synchronized multimodal dataset of human desktop GUI demonstrations for reusable agent skill induction and downstream evaluation. Its 350 demonstrations are screened for completeness and task success. We then propose an agentic skill-induction method that inspects evidence on demand to produce reusable skills capturing workflow rules, step dependencies, and completion checks. When the same four execution models are equipped with skills induced by each method under shared execution settings, Work2Skill achieves the highest scores and success rates. Mean score improvements over the corresponding No Skill baseline are 4.67--10.54 points on MyPCBench Bounded Action and 3.11--7.50 points on a 286-task subset of OSWorld-Verified. Our code and data are available at https://github.com/china-qijizhifeng/Work2Skill.", 'score': 39, 'issue_id': 3400, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '4bb2c3eed2ad2927', 'authors': ['Yuqi Huang', 'Hui Li', 'Yifei Cao', 'Zikun Cai', 'Tianci Xie', 'Yangfan Gao', 'Pinxue Guo', 'Chaoyun Zhang', 'Bingxuan Li', 'Rui Zheng', 'Hang Yan', 'Ning Liao'], 'affiliations': ['Fudan University', 'Nanyang Technological University', 'Shanghai Jiao Tong University', 'Shanghai Qiji Zhifeng Co., Ltd', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12984.jpg', 'data': {'categories': ['#agents', '#dataset', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Обучение переиспользуемых умений агентов из человеческих демонстраций в GUI', 'desc': 'Статья представляет Work2Skill — фреймворк для обучения переиспользуемых навыков агентов на основе демонстраций человека в графическом интерфейсе. Авторы разработали WorkRecorder для сбора синхронизированных мультимодальных данных о действиях пользователя, включая видео экрана, события клавиатуры и мыши, создав датасет WorkDemo-350. Предложенный метод индукции навыков анализирует доказательства по требованию и извлекает правила рабочего процесса, зависимости между шагами и условия завершения задач. Экспериментальная оценка показала значительное улучшение производительности различных моделей выполнения (на 4.67-10.54 пункта на MyPCBench) по сравнению с базовым вариантом без навыков.'}, 'en': {'title': 'Empowering Agents with Human GUI Skills for Better Performance', 'desc': 'This paper presents Work2Skill, a framework designed to help computer agents learn from human interactions with graphical user interfaces (GUIs). It addresses the challenge of reusing human knowledge by capturing and interpreting GUI actions in context, separating general workflow rules from specific task details. The framework includes WorkRecorder, which collects and synchronizes data from human demonstrations, resulting in the WorkDemo-350 dataset of 350 multimodal GUI demonstrations. The proposed skill-induction method allows agents to learn reusable skills, leading to significant improvements in task performance compared to agents without these skills.'}, 'zh': {'title': '智能代理技能生成的新方法', 'desc': '本论文介绍了一种名为Work2Skill的框架，用于捕捉人类在图形用户界面（GUI）上的操作经验，以便为智能代理生成可重用的技能。通过WorkRecorder，研究者收集了屏幕录制、鼠标和键盘事件等信息，构建了第一个同步的多模态数据集WorkDemo-350，包含350个完整的桌面GUI演示。该框架能够提取工作流程规则和任务依赖关系，从而生成可重用的技能。实验结果表明，使用Work2Skill框架的智能代理在执行任务时表现出更高的成功率和得分。'}}}, {'id': 'https://huggingface.co/papers/2610.11361', 'title': 'SepGen: Multi-Stem Audio-Video Separation and Generation in a Single Model', 'url': 'https://huggingface.co/papers/2610.11361', 'abstract': 'Abstract  A 4D audio-visual scene comprises a video, the dynamic geometry it depicts, and the sound sources that populate it, each with its own position and trajectory. Rendering such a scene from a novel viewpoint requires that every source be available as an individual waveform, so that it can be localized in the scene and propagated to the observer before the signals are mixed. Joint audio-video generators can synthesize the video and its soundtrack, but the soundtrack is emitted as a single audio-mix in which the sources are not individually accessible. We present SepGen, which extends a pretrained audio-video generator to emit the video, the mixed soundtrack, and one waveform per captioned source in one joint sampling run. SepGen supports two complementary modes: generation and separation. In generation mode, each source caption specifies what its stem contains. A two-speaker dialogue, for example, comes out as one stem per speaker in the original turn order. In separation mode, the input audio-mix remains clean while the captions specify what to extract, so the model can decompose a recording from a free-text description. We evaluate generation on scenes synthesized from text, and separation on scenes rendered by other generators and on real recordings of speech, music, and sound effects. Given an audio-mix and captions that carry the spoken lines, SepGen outperforms language-conditioned separators, most clearly on speech, and it keeps the lead when the lines are removed from the captions. Code, checkpoints, and datasets are available at https://sepgen.github.io/', 'score': 38, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '3ff9423ad86b62a0', 'authors': ['Aviad Dahan', 'Rajaei Khatib', 'Yonatan Bitton', 'Idan Szpektor', 'Lior Wolf', 'Raja Giryes'], 'affiliations': ['Google', 'Tel Aviv University'], 'pdf_title_img': 'assets/pdf/title_img/2610.11361.jpg', 'data': {'categories': ['#open_source', '#video', '#dataset', '#audio', '#multimodal'], 'emoji': '🎵', 'ru': {'title': 'Генерация и разделение звука с помощью аудио-визуального условного моделирования', 'desc': 'В работе представлена система SepGen, которая расширяет предварительно обученный генератор аудио-видео для одновременного создания видео, смешанной звуковой дорожки и отдельных waveforms для каждого источника звука. Модель поддерживает два режима работы: генерация, где описания источников определяют содержание каждого stem, и разделение (separation), где исходный аудиомикс разлагается согласно текстовым подписям. Система обучается на основе контролируемого обучения с использованием пар видео и звука, а также текстовых аннотаций для локализации источников в 4D сцене. Экспериментальные результаты показывают, что SepGen превосходит существующие методы разделения звука по качеству, особенно на речевых сигналах, и может работать как с синтезированными, так и с реальными записями.'}, 'en': {'title': 'SepGen: Unmixing Audio-Visual Scenes with Precision', 'desc': 'The paper introduces SepGen, a novel model that enhances audio-visual scene generation by allowing individual sound sources to be extracted and rendered alongside video. It builds on a pretrained audio-video generator to produce both a mixed soundtrack and separate waveforms for each sound source based on captions. SepGen operates in two modes: generation, where it creates distinct audio stems for each source, and separation, where it cleansly extracts specified sounds from a mixed audio input. The model demonstrates superior performance in generating and separating audio compared to existing methods, particularly in handling speech.'}, 'zh': {'title': 'SepGen：音视频生成与分离的创新模型', 'desc': '这篇论文介绍了一种名为SepGen的模型，它可以同时生成视频、混合音轨和每个音源的独立波形。SepGen扩展了预训练的音视频生成器，支持生成和分离两种模式。在生成模式下，模型根据每个音源的描述生成相应的音频；在分离模式下，模型能够从混合音频中提取特定的音源。通过对比实验，SepGen在语音、音乐和音效的处理上表现优于现有的语言条件分离器。'}}}, {'id': 'https://huggingface.co/papers/2610.12341', 'title': 'Can AI Agents Learn Their Way to the Top? Evaluating Heuristic Learning in a Long-Running Game Agent Competition', 'url': 'https://huggingface.co/papers/2610.12341', 'abstract': "Abstract  Adversarial games have driven advances from heuristic search to reinforcement learning, yet learning and adapting strategies from limited samples remain challenging. AI agents offer an alternative by turning game experience into revisions of executable policies. Building on heuristic learning (HL), we formalize Adversarial Heuristic Learning (AHL), a paradigm that uses AI agents as learning engines to refine game policies and supporting software while keeping model weights fixed. We introduce AAArena, a benchmark comprising 12 authentic adversarial games and 1,920 archived human programs, with an evaluation protocol modeled on real-world game competitions. Agents interpret rules, choose opponents, analyze replays, and revise game agents to achieve their highest ranking within fixed match and evaluation budgets. We evaluate completedmodels model and harness configurations: Opus5.5 with Claude Code earns 6 gold medals, while no evaluated configuration tops the remaining 6 human ladders. Performance is generally weaker in games with more complex rule specifications. Further experiments show that opponent selection and dense feedback support policy improvement, and that agents learn from both on-policy replays of their own matches and off-policy replays of other players' matches. These results highlight HL's potential in adversarial games and identify persistent challenges in game understanding, strategy implementation, and long-horizon policy development.", 'score': 33, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'b9e9dee62f1eb38b', 'authors': ['Kaisen Yang', 'Qingle Liu', 'Kejin Wang', 'Yicheng Zhao', 'Jieming Li', 'Shenghan Zheng', 'Ruize Yang', 'Bojun Yang', 'Heng Gong', 'Xiang Gao', 'Lanyue Zhang', 'Kaiyu Zhong', 'Zhuo Liu', 'Shaoxuan Li', 'Chengxi Li', 'Yong Yan', 'Weixuan Zhang', 'Tianwei Luo', 'Situ Wang', 'Youjie Zheng', 'Sihan Zhao', 'Shengyuan Wang', 'Huan-ang Gao', 'Jiazheng Xu', 'Xiaohui Xie', 'Wentao Han', 'Hongning Wang'], 'affiliations': ['College of AI, Tsinghua University', 'Department of Computer Science and Technology, Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12341.jpg', 'data': {'categories': ['#optimization', '#rl', '#agents', '#games', '#reasoning', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Обучение игровых стратегий через iterative пересмотр политик с помощью языковых моделей', 'desc': 'В работе предложена парадигма Adversarial Heuristic Learning (AHL), которая использует AI агентов для улучшения игровых стратегий и политик, сохраняя веса модели неизменными. Авторы создали бенчмарк AAArena с 12 adversarial играми и 1920 архивированными программами человека, оценивая способность агентов интерпретировать правила, выбирать противников и анализировать реплеи матчей. Результаты показывают, что модель Claude Opus достигает 6 золотых медалей, но не превосходит остальные человеческие рейтинги, с особыми трудностями в играх со сложными спецификациями правил. Эксперименты демонстрируют, что выбор противников и плотная обратная связь поддерживают улучшение политики, а агенты обучаются как на собственных, так и на чужих матчах.'}, 'en': {'title': 'Enhancing Game Strategies with Adversarial Heuristic Learning', 'desc': 'This paper introduces Adversarial Heuristic Learning (AHL), a new approach that uses AI agents to improve game strategies by learning from limited samples. AHL allows agents to refine their policies while keeping their model weights unchanged, making it easier to adapt to different game scenarios. The authors present AAArena, a benchmark featuring various adversarial games and human programs to evaluate the performance of these agents. The findings suggest that while AHL shows promise in enhancing game strategies, challenges remain in understanding complex game rules and developing long-term strategies.'}, 'zh': {'title': '对抗性启发式学习：提升游戏策略的新方法', 'desc': '对抗性游戏推动了从启发式搜索到强化学习的进展，但从有限样本中学习和适应策略仍然具有挑战性。本文提出了对抗性启发式学习（AHL），利用AI代理作为学习引擎，改进游戏策略，同时保持模型权重不变。我们引入了AAArena基准，包含12个真实对抗游戏和1920个存档的人类程序，评估协议模拟真实游戏比赛。实验结果表明，代理通过选择对手和密集反馈来支持策略改进，并从自己的比赛和其他玩家的比赛中学习。'}}}, {'id': 'https://huggingface.co/papers/2610.07121', 'title': 'SoloQ: Calibration-Free Quantization for Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.07121', 'abstract': 'Abstract  Diffusion large language models dLLMs) have emerged as a promising alternative to autoregressive language models through bidirectional diffusion-based token generation. However, their growing model sizes and high inference costs make efficient deployment challenging: full-sequence denoising repeatedly invokes compute-intensive forward passes, while block-diffusion models additionally introduce a memory-intensive KV-cache. Low-bit weight-activation quantization is therefore attractive, yet existing dLLM post-training quantization methods rely on calibration data despite activation distributions shifting across masking states and denoising steps. We present SoloQ, a calibration-free quantization framework that maps weights and activations into a normalized rotated basis with a predictable marginal distribution, enabling data-independent quantization. SoloQ combines a structured K-RPBH rotation with a lightweight rescaling correction for calibration-free quantization. Its predictable post-rotation distribution supports both distribution-matched codebooks and hardware-native NVFP4. For block-diffusion models, SoloQ further applies commit-time KV-cache quantization to compress persistent states without perturbing the actively denoised block. Across full-sequence dLLMs (LLaDA and Dream) and block-diffusion dLLMs(Fast-dLLM v2 and Nemotron-Labs-Diffusion), SoloQ retains accuracy under 4-bit quantization and outperforms calibration-based baselines on knowledge- and reasoning-intensive benchmarks. With NVFP4, SoloQ reduces peak memory by up to 2.61X and accelerates end-to-end inference by up to 2.24X.', 'score': 32, 'issue_id': 3399, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '3f611762f73f0e41', 'authors': ['Donghyun Lee', 'Arkapravo Ghosh', 'Varun Manjunath', 'Bumjoon Kyle Rhee', 'Hyunho Kook', 'Shiting Xiao', 'Youngeun Kim', 'Priyadarshini Panda'], 'affiliations': ['Korea University', 'University of Southern California', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2610.07121.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Квантизация без данных для эффективного развёртывания диффузионных языковых моделей', 'desc': 'В статье представлена SoloQ,框架квантизации без калибровки для диффузионных больших языковых моделей (dLLM), которые используют двусторонний процесс денoisизации вместо автерегрессивного генерирования токенов. Основная идея заключается в преобразовании весов и активаций в нормализованный повёрнутый базис с предсказуемым распределением, что позволяет выполнять квантизацию без данных калибровки. Метод комбинирует структурированное K-RPBH вращение с лёгкой коррекцией масштабирования и поддерживает как согласованные кодовые таблицы, так и аппаратный формат NVFP4. SoloQ продемонстрировала сохранение точности при 4-битной квантизации, значительное сокращение пиковой памяти (до 2.61X) и ускорение инференса (до 2.24X) на различных архитектурах dLLM.'}, 'en': {'title': 'SoloQ: Efficient Calibration-Free Quantization for Diffusion Language Models', 'desc': 'This paper introduces SoloQ, a novel framework for quantizing diffusion large language models (dLLMs) without the need for calibration data. It addresses the challenges of high model sizes and inference costs by using a method that maps weights and activations into a normalized rotated basis, allowing for efficient data-independent quantization. SoloQ enhances performance by applying a structured rotation and lightweight rescaling, which helps maintain accuracy even at low-bit quantization levels. The framework significantly reduces memory usage and speeds up inference times, making it a valuable advancement for deploying dLLMs in practical applications.'}, 'zh': {'title': 'SoloQ：高效的无校准量化框架', 'desc': '扩散大型语言模型（dLLMs）通过双向扩散生成令牌，成为自回归语言模型的有力替代方案。然而，随着模型规模的增长和推理成本的提高，如何高效部署成为一大挑战。现有的后训练量化方法依赖于校准数据，而我们提出的SoloQ框架则实现了无校准量化，通过将权重和激活映射到标准化的旋转基中，支持数据独立的量化。SoloQ在保持准确性的同时，显著降低了内存使用和推理时间，尤其在知识和推理密集型基准测试中表现优异。'}}}, {'id': 'https://huggingface.co/papers/2610.13912', 'title': 'RSI-Anything: Unlocking Recursive Self-Improvement with World Models', 'url': 'https://huggingface.co/papers/2610.13912', 'abstract': 'Abstract  Recursive self-improvement (RSI) aims to transform interaction experience into persistent improvements, yet external feedback is costly and world-model predictions may become unreliable as policies evolve. We introduce RSI-Anything, a domain-general framework built on JEPA-Anything that uses predictive world models to guide action and learning-data selection. Observed feedback drives policy or workflow improvement and conditional world-model adaptation, while component and compatibility checks govern the retention of updated policy-model pairs. Across diverse computational and scientific domains, RSI-Anything demonstrates substantial gains. In code repair, with the coder fixed, success increases from 26.3% with a static verifier to 29.2% through predictive selection and 31.2% after world-model adaptation, at comparable test usage. Graphical user interface (GUI) evaluations showed higher task completion, while average actions decrease by 39.4%. Across five successive policy versions, laboratory-planning scores more than double from 21.80% to 46.01%. In reaction optimization, RSI-Anything achieves 96.15% mean best observed yield versus 82.16% for Bayesian optimization under the same 40-experiment budget. An end-to-end immune-science application further connects workflow evolution and predictive modeling with therapeutic hypothesis generation. These results demonstrate how predictive world models and retained system updates enable recursive improvement across diverse environments.', 'score': 30, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '2340b035d95262c1', 'pdf_title_img': 'assets/pdf/title_img/2610.13912.jpg', 'data': {'categories': ['#optimization', '#science', '#reasoning'], 'emoji': '🔄', 'ru': {'title': 'Предиктивные модели для непрерывного совершенствования агентов', 'desc': 'В статье предлагается RSI-Anything — фреймворк для рекурсивного самоулучшения систем, построенный на основе предиктивных мировых моделей, которые направляют выбор действий и данных для обучения. Фреймворк использует наблюдаемую обратную связь для улучшения политик и адаптации мировых моделей, при этом компонентные проверки обеспечивают сохранение только валидных обновлений. Метод демонстрирует значительные улучшения в разнообразных задачах: в восстановлении кода успешность возросла с 26.3% до 31.2%, в автоматизации GUI количество действий снизилось на 39.4%, а в планировании лабораторных экспериментов результаты удвоились с 21.80% до 46.01%. Подход превосходит традиционные методы оптимизации (например, байесовскую оптимизацию в задаче оптимизации химических реакций) и применим к различным вычислительным и научным доменам.'}, 'en': {'title': 'Empowering Recursive Self-Improvement with Predictive Models', 'desc': 'The paper presents RSI-Anything, a framework designed for recursive self-improvement (RSI) that enhances learning and action selection using predictive world models. It addresses the challenges of costly external feedback and unreliable predictions by adapting policies based on observed feedback and ensuring compatibility of updated models. The framework shows significant performance improvements across various domains, including code repair and graphical user interface tasks, by effectively utilizing predictive selection and world-model adaptation. Overall, RSI-Anything illustrates the potential of combining predictive modeling with iterative policy updates to achieve substantial gains in efficiency and effectiveness.'}, 'zh': {'title': '递归自我改进的未来', 'desc': '递归自我改进（RSI）旨在将交互体验转化为持久的改进，但外部反馈成本高昂，且随着策略的演变，世界模型的预测可能变得不可靠。我们提出了RSI-Anything，这是一个基于JEPA-Anything的通用框架，利用预测世界模型来指导行动和学习数据的选择。观察到的反馈推动策略或工作流程的改进，并且条件世界模型的适应性受到组件和兼容性检查的管理。RSI-Anything在多个计算和科学领域展示了显著的提升，证明了预测世界模型和保留系统更新如何在不同环境中实现递归改进。'}}}, {'id': 'https://huggingface.co/papers/2609.37712', 'title': 'PolyOCR-Venus: Unified OCR Foundation Models for Text-Centric Visual Intelligence', 'url': 'https://huggingface.co/papers/2609.37712', 'abstract': 'Abstract  Optical Character Recognition (OCR) is evolving from plain-text transcription toward general visual intelligence, requiring models to recognize, localize, and reason over textual information in complex visual environments. However, existing OCR systems often excel at only some tasks and struggle to balance recognition, parsing, and reasoning across scenarios. In this report, we present PolyOCR, a family of unified OCR foundation models of varying scales. PolyOCR combines a shared instruction-following framework with a large-scale data engine that converts heterogeneous visual resources into quality-verified OCR supervision. We introduce Competence-Guided Policy Optimization, which combines verifier-based Group Relative Policy Optimization with on-policy distillation through sample-wise routing based on teacher reliability and the teacher--student competence gap. We also introduce OCRBench v2.1, our revision of OCRBench v2 with manually verified annotation corrections and task-aligned scoring metrics. Extensive experiments across OCRBench v2.1, CC-OCR, in-house KIE Benchmark, OmniDocBench v1.6 and MDPBench demonstrate that PolyOCR achieves state-of-the-art or highly competitive performance.', 'score': 28, 'issue_id': 3399, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '1bd98abf144f52a5', 'authors': ['GuangJian Team', 'Kaili Huang', 'Yongshuo Zhang', 'Bingtao Fu', 'Changjiang Jiang', 'Chenfan Qu', 'Chenfeng Zhang', 'Fangming Cui', 'Gaoyang Zhang', 'Jiangwei Xie', 'Jianshu Li', 'Jing Huang', 'Jingwen Bai', 'Mingqi Fang', 'Tao Fang', 'Weihong Zhang', 'Wenbo Du', 'Xiongfei Bai', 'Xuekang Zhu', 'Yinan Xia', 'Zhenming Wang', 'Jian Liu', 'Jingjing Liu', 'Xiang Qi', 'Weiqiang Wang'], 'affiliations': ['Ant Group'], 'pdf_title_img': 'assets/pdf/title_img/2609.37712.jpg', 'data': {'categories': [], 'emoji': '📄', 'ru': {'title': 'Универсальная OCR-модель, превосходящая узкоспециализированные системы', 'desc': 'PolyOCR представляет семейство универсальных foundation моделей для распознавания текста, которые объединяют инструкции пользователя с масштабируемым конвейером данных для создания высококачественных обучающих примеров. Авторы предлагают Competence-Guided Policy Optimization — метод оптимизации, который сочетает верификацию моделей с дистилляцией знаний через маршрутизацию примеров на основе надежности учителя. Для оценки качества представлена улучшенная версия OCRBench v2.1 с ручной проверкой аннотаций и согласованными метриками. Система демонстрирует лучшие или конкурентные результаты на множестве бенчмарков, включая распознавание текста, его локализацию и рассуждения в сложных визуальных сценах.'}, 'en': {'title': 'PolyOCR: Unifying OCR for Enhanced Visual Intelligence', 'desc': 'This paper introduces PolyOCR, a set of advanced Optical Character Recognition (OCR) models designed to improve the recognition, localization, and reasoning of text in complex images. Unlike traditional OCR systems that often excel in specific tasks, PolyOCR aims to provide a unified solution that balances these capabilities across various scenarios. The approach utilizes a large-scale data engine for generating high-quality OCR supervision and employs Competence-Guided Policy Optimization to enhance model training through effective sample routing. Extensive testing on multiple benchmarks shows that PolyOCR achieves top-tier performance, setting a new standard in the field of OCR.'}, 'zh': {'title': 'PolyOCR：统一的光学字符识别新模型', 'desc': '光学字符识别（OCR）正在从简单的文本转录发展到更复杂的视觉智能，要求模型能够在复杂的视觉环境中识别、定位和推理文本信息。现有的OCR系统通常只能在某些任务上表现良好，难以在不同场景中平衡识别、解析和推理。本文介绍了PolyOCR，这是一系列不同规模的统一OCR基础模型，结合了共享的指令跟随框架和一个大型数据引擎，将异构视觉资源转化为经过质量验证的OCR监督。我们还引入了能力引导策略优化和OCRBench v2.1，以提高模型的性能和准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.12978', 'title': 'Learning Representations to Guide Pixel Diffusion Transformers', 'url': 'https://huggingface.co/papers/2610.12978', 'abstract': 'Abstract  Visual representations are largely developed for understanding, yet what makes them useful for generation remains unclear. We study this question in pixel diffusion transformers and uncover two key insights. First, better representation quality does not necessarily translate into greater generative utility, as externally aligned semantics can be progressively lost during pixel synthesis. Second, architectural separation with specialized pixel decoders mainly redistributes semantic and spatial modeling, without necessarily yielding representations better suited to generation. These insights suggest that a useful generative representation must be both properly formed and actively exploited. Motivated by these insights, we introduce Representation Guidance (RG), which directly forms and exploits internal representations while retaining a plain Transformer architecture. A low-dimensional bottleneck forces generation-relevant information into a compact representation, which is then explicitly used to guide decoder generation by modifying the flow-matching target according to its induced prediction offset. RG learns clearer semantic and spatial structure while scaling efficiently in both parameters and computation. On ImageNet 256x256, RG-L/16 with only 459M parameters outperforms substantially larger pixel diffusion transformers, while RG-XL/16 achieves an FID of 1.55. RG further reaches an FID of 1.74 at 512x512 and extends to text-to-image generation, achieving 0.89 on GenEval and 87.1 on DPG-Bench.', 'score': 22, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'dfd83b4d9c160d05', 'authors': ['Zihao Pan', 'Mengting Chen', 'Cheng Shi', 'Taihang Hu', 'Zhengrong Yue', 'Zikang Wang', 'Yuan Wang', 'Wei Li', 'Sibei Yang'], 'affiliations': ['Alibaba Group', 'Shanghai Jiao Tong University', 'Sun Yat-sen University', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.12978.jpg', 'data': {'categories': ['#training', '#cv', '#architecture', '#optimization', '#diffusion'], 'emoji': '🎨', 'ru': {'title': 'Направленное представление: активное использование внутренних признаков для лучшей генерации изображений', 'desc': 'Авторы исследуют, как внутренние представления в пиксельных диффузионных трансформерах влияют на качество генерации изображений. Они обнаруживают, что высокое качество представлений не гарантирует хорошие результаты генерации, так как семантическая информация может теряться во время синтеза. Предложенный метод Representation Guidance использует низкоразмерное узкое место для концентрации релевантной информации и явно направляет декодер, модифицируя целевую функцию flow-matching на основе предсказанных смещений. Метод демонстрирует лучшие результаты при меньшем количестве параметров и успешно применяется как для генерации изображений, так и для text-to-image задач.'}, 'en': {'title': 'Unlocking Generative Power with Representation Guidance', 'desc': 'This paper explores how visual representations can be improved for generative tasks, particularly in pixel diffusion transformers. It reveals that higher quality representations do not always enhance generative performance, as important semantic information can be lost during the generation process. The authors introduce Representation Guidance (RG), a method that optimizes internal representations while maintaining a simple Transformer structure, ensuring that relevant information is compactly represented and effectively utilized in generation. RG demonstrates significant improvements in image generation quality, outperforming larger models and achieving impressive scores on various benchmarks.'}, 'zh': {'title': '生成任务中的有效表示引导', 'desc': '本论文研究了视觉表示在生成任务中的有效性，特别是在像素扩散变换器中。我们发现，表示质量的提高并不总是能提升生成能力，因为在像素合成过程中，外部对齐的语义可能会逐渐丢失。此外，使用专门的像素解码器进行架构分离主要是重新分配语义和空间建模，而不一定能产生更适合生成的表示。基于这些发现，我们提出了表示引导（Representation Guidance, RG），它在保持简单变换器架构的同时，直接形成和利用内部表示。'}}}, {'id': 'https://huggingface.co/papers/2610.12570', 'title': 'Contextual Correction of Parallel Draftsfor Speculative Decoding', 'url': 'https://huggingface.co/papers/2610.12570', 'abstract': "Abstract  Speculative decoding accelerates large language model inference by using a lightweight drafter to propose multiple tokens that are subsequently verified in parallel by the target model. Recent diffusion-based drafters make this paradigm particularly attractive: deep attention-based neural backbones provide strong predictions, while drafting multiple future positions in parallel avoids the sequential cost of autoregressive generation. This parallelism, however, comes at a cost. Tokens within a draft block are predicted without access to the realized identities of preceding draft tokens, removing intra-block dependencies that would naturally be available under autoregressive generation. We introduce DCOCO (DFlash Contextual Corrector), a lightweight mechanism that restores these dependencies while preserving parallel drafting. Rather than committing to each position's top prediction, DCOCO retains multiple candidate tokens and evaluates their contextual compatibility across adjacent draft positions in parallel, enabling contextually informed token selection at low additional cost. Across four verifier backbones and ten benchmarks, DCOCO achieves the highest average throughput in every evaluated configuration, spanning greedy and stochastic decoding with and without extended reasoning, with speedups of up to 6.6x over vanilla decoding. Its advantage persists under concurrent serving: DCOCO outperforms the strongest competing method by 6-23% across 4-32 concurrent requests, while other sequential correctors fall below uncorrected DFlash at these loads. These results demonstrate that recovering intra-block dependencies through parallel contextual scoring delivers consistent acceleration across decoding regimes and serving loads.", 'score': 21, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '5a2e15f3b22eff3f', 'pdf_title_img': 'assets/pdf/title_img/2610.12570.jpg', 'data': {'categories': ['#architecture', '#optimization', '#inference', '#diffusion'], 'emoji': '⚡', 'ru': {'title': 'Восстановление контекста в параллельном черновике для ускорения генерации токенов', 'desc': 'В статье представлен DCOCO, механизм, который улучшает спекулятивное декодирование для больших языковых моделей путём восстановления зависимостей между токенами в блоке черновика. Метод использует лёгкий модуль-корректор, который параллельно оценивает несколько кандидатов токенов для каждой позиции, сохраняя контекстную информацию от соседних позиций. Авторы демонстрируют, что DCOCO достигает ускорения до 6.6 раз по сравнению с обычным декодированием и сохраняет преимущества при одновременном обслуживании множественных запросов. Метод показывает консистентное улучшение производительности как для жадного, так и для стохастического декодирования на различных архитектурах верификаторов.'}, 'en': {'title': 'Accelerating Language Model Inference with DCOCO', 'desc': 'This paper presents DCOCO, a novel mechanism that enhances the efficiency of speculative decoding in large language models. By allowing a lightweight drafter to propose multiple token candidates in parallel, DCOCO restores important dependencies between tokens that are typically lost in standard autoregressive generation. The method evaluates the contextual compatibility of these candidates, enabling better-informed token selection without significantly increasing computational costs. The results show that DCOCO significantly improves throughput and performance across various benchmarks and concurrent requests, outperforming existing methods.'}, 'zh': {'title': '并行上下文校正，提升推理速度！', 'desc': '本文介绍了一种名为DCOCO（DFlash上下文校正器）的新机制，旨在加速大型语言模型的推理过程。通过使用轻量级的草拟器并行预测多个令牌，DCOCO能够在保持并行草拟的同时恢复令牌之间的依赖关系。与传统的自回归生成方法相比，DCOCO在多个基准测试中表现出更高的吞吐量，速度提升可达6.6倍。研究结果表明，通过并行上下文评分恢复块内依赖关系，可以在不同的解码模式和负载下实现一致的加速效果。'}}}, {'id': 'https://huggingface.co/papers/2610.12569', 'title': 'SWE-Duel: Towards a Self-Scaling Arena for Coding Agents', 'url': 'https://huggingface.co/papers/2610.12569', 'abstract': "Abstract  Static coding benchmarks are fixed at release. Over time their tasks leak into training data, and stronger agents eventually saturate them. We argue that a benchmark should instead aim to be self-scaling: its tasks and oracles are created at evaluation time, so no content exists in advance to leak, and its difficulty is set by the participating agents rather than fixed at release. We introduce SWE-Duel, an arena in which two coding agents evaluate each other over mirrored Red-Blue turns. In each turn, the Red agent works on a real repository across three context-isolated sessions. It proposes and implements a new feature with feature tests, then embeds a subtle bug in that feature along with sealed bug-triggering tests. The resulting pull request is admitted only if (1) it passes the feature tests and the repository's existing tests while failing exactly the bug tests, and (2) a fresh session of the same agent can repair the bug blind, which rules out unsolvable tasks. The Blue agent then reviews the pull request without being told a bug exists. It wins only if its revision passes all three test suites, and then the two agents swap roles. We run a tournament among 11 model-harness participants on 15 repositories in five languages for 1,500 turns. The leaders win in different ways. GPT-5.5 with Codex CLI ranks first as the strongest solver, repairing 98.3% of the defects it reviews. Claude Opus 4.8 with mini-swe-agent ranks second as the strongest task author, with a 27.3% Red win rate. Finally, within one model family, tasks written by the newest version defeat a fixed-reference solver far more often than those of older versions (42.9% vs. 4.0%), giving preliminary evidence that task difficulty scales with task authoring capability.", 'score': 19, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'a137059d3c995005', 'authors': ['Wei Minn', 'Zhensu Sun', 'Lwin Khin Shar', 'David Lo'], 'affiliations': ['Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12569.jpg', 'data': {'categories': ['#agents', '#plp', '#benchmark'], 'emoji': '⚔️', 'ru': {'title': 'Самомасштабирующийся бенчмарк кода через состязательную оценку агентов', 'desc': 'В работе предложен новый подход к оценке способностей кодирующих агентов — вместо статических бенчмарков, которые со временем попадают в обучающие данные, авторы создали SWE-Duel, динамическую арену, где два AI агента оценивают друг друга, создавая задачи во время тестирования. Красный агент реализует новую функциональность в реальных репозиториях и специально вводит скрытый баг с тестами для его проверки, а синий агент должен обнаружить и исправить этот баг без явных подсказок. Такой подход гарантирует, что содержание задач не может утечь в данные для обучения, так как задачи генерируются в момент оценки, а сложность автоматически регулируется способностями самих агентов. Эксперименты на 15 репозиториях показали, что GPT-4.5 лучше всех решает задачи, а Claude Opus 4.8 создаёт наиболее сложные задачи, подтверждая, что качество автоматически сгенерированных бенчмарков коррелирует с возможностями моделей.'}, 'en':
