    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');
                    currentLang = flag.dataset.lang;

                    updateTimeDiffs();

                    filterAndRenderArticles();
                });

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.02886', 'title': 'SolarWM: Open Data and Scalable Training for Long-Horizon Video World Models', 'url': 'https://huggingface.co/papers/2609.02886', 'abstract': 'Abstract SolarWM provides an open framework and unified training recipe for building interactive video world models across diverse data sources and generator backbones, enabling long-horizon real-time rollouts.  Generated by thinkingmachines/Inkling-Small We introduce SolarWM, a fully open foundation for building interactive video world models from data preparation through long-horizon inference. Training across heterogeneous data sources and video backbones is challenging: datasets differ in temporal scale, camera geometry, visual quality, motion, and captioning styles, while video generators use distinct representations and architectures. Naive data mixing and model-specific implementations therefore produce inconsistent supervision and make results difficult to reproduce and compare. SolarWM addresses this coupling with a reconfigurable multi-source data engine and a backbone-native adaptation framework. The engine converts 1.43 million canonical clips from 10 datasets into a unified, frame-aligned contract covering visual observations, metric camera geometry, captions, quality metadata, selection decisions, and provenance, while decoupling source processing from mixture construction. Under shared camera-conditioning, training, and inference interfaces, we instantiate four 5B--33B models based on Wan2.2, LTX-2.5, and MiniMax-H3 while preserving their native representations and objectives. A unified three-stage recipe combines bidirectional adaptation, teacher-forced autoregressive initialization, and distribution matching distillation. The resulting causal models enable real-time interaction over rollouts ranging from minutes to hours after being trained on only 5s sequences. By releasing the resulting data, pipeline, recipes, weights, and framework, SolarWM provides a reproducible and extensible foundation for interactive world-model research.', 'score': 8, 'issue_id': 3208, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '0610487d27e8e478', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#dataset', '#training', '#video', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Единая платформа для обучения интерактивных видео-моделей мира на разнородных данных', 'desc': 'SolarWM представляет открытую платформу для создания интерактивных видео-моделей мира, которые могут обучаться на разнородных источниках данных и различных архитектурах видео-генераторов. Авторы решили проблему несовместимости данных, разработав унифицированный движок обработки данных, который преобразует 1.43 миллиона видеоклипов из 10 датасетов в единый формат с согласованной геометрией камеры и метаданными. Они обучили четыре модели размером от 5 до 33 миллиардов параметров, используя трёхэтапный рецепт включающий адаптацию, инициализацию с учителем и дистилляцию, что позволило моделям генерировать видео в реальном времени на протяжении часов. Открытый выход проекта с данными, кодом, весами моделей и фреймворком создаёт воспроизводимую основу для исследований интерактивных моделей мира.'}, 'en': {'title': 'Building Unified Interactive Video World Models with SolarWM', 'desc': 'SolarWM is an innovative framework designed for creating interactive video world models that can learn from various data sources and generator architectures. It tackles the challenges of inconsistent data by providing a unified system that aligns different datasets in terms of visual quality, camera geometry, and motion. The framework includes a multi-source data engine that processes a large number of video clips into a standardized format, facilitating easier training and inference. By offering a comprehensive training recipe and releasing all components, SolarWM aims to enhance reproducibility and extensibility in the field of interactive world-model research.'}, 'zh': {'title': 'SolarWM：构建互动视频世界模型的开放框架', 'desc': 'SolarWM是一个开放的框架，旨在构建互动视频世界模型，支持多种数据源和生成器的统一训练。它解决了不同数据集在时间尺度、相机几何、视觉质量等方面的差异，提供了一个可重配置的多源数据引擎。通过将1.43百万个标准片段转换为统一的格式，SolarWM使得模型训练和推理过程更加一致和可重复。最终，SolarWM为互动世界模型研究提供了一个可扩展的基础，支持实时交互和长时间的推理。'}}}, {'id': 'https://huggingface.co/papers/2609.00638', 'title': 'It Takes Two to Match: Co-Evolving Generative Retriever with Reinforcement Learning', 'url': 'https://huggingface.co/papers/2609.00638', 'abstract': "Abstract CoGR trains LLMs to generate compact keywords for both queries and items, enabling direct inverted-index retrieval optimized via co-evolving reinforcement learning.  Generated by thinkingmachines/Inkling-Small Retrieval is the first stage of modern search and advertising systems, selecting a candidate set from a large item universe for downstream ranking and auction. Recent work increasingly leverages LLMs to improve retrieval through query expansion, data synthesis, and retrieval-feedback training. However, the generative component is typically used for query-side augmentation, while final matching is still delegated to a downstream retriever. We introduce CoGR, a retrieval framework that instead trains LLMs to directly construct retrieval representations on both query and item sides. Each generator produces a compact set of keywords, which are matched directly through an inverted index, preserving compatibility with existing keyword-based retrieval infrastructure. CoGR uses a two-stage training pipeline. Supervised fine-tuning first establishes an aligned keyword space, after which co-evolving reinforcement learning alternately optimizes the query- and item-side generators with GRPO against the opposite side's frozen index. Both sides optimize the same query-to-item retrieval F_1 objective: the query side receives retrieval F_1 directly, while the item side receives a counterfactual marginal reward measuring the change in query-side F_1 caused by its generated keywords. Across 10 representative sparse, dense, and generative baselines, CoGR achieves the best performance on both an internal APP Marketplace dataset and the public WANDS benchmark, improving F_1 over the strongest baseline by 10.9% and 36.1%, respectively. Further analysis shows stable co-evolution and increasingly aligned query--item keyword spaces over training.", 'score': 8, 'issue_id': 3208, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '8875bbda877bcd18', 'authors': ['Runpeng Dai', 'Kaili Huang', 'Changsung Kang', 'Ciya Liao'], 'affiliations': ['Apple', 'University of North Carolina at Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2609.00638.jpg', 'data': {'categories': ['#benchmark', '#rl', '#rag', '#training'], 'emoji': '🔍', 'ru': {'title': 'Двусторонняя генерация ключевых слов для прямого поиска через совместное обучение с подкреплением', 'desc': 'CoGR — это новая система поиска, которая использует LLM для генерации компактных ключевых слов как для запросов пользователей, так и для товаров, позволяя выполнять прямое сопоставление через инвертированный индекс. Система использует двухэтапный процесс обучения: сначала супервизированная доработка устанавливает согласованное пространство ключевых слов, а затем совместная эволюция с использованием reinforcement learning оптимизирует генераторы с обеих сторон. Генераторы запросов и товаров оптимизируются попеременно против замороженного индекса противоположной стороны, используя единую метрику F₁. CoGR превосходит существующие методы на 10,9-36,1% по точности поиска, сохраняя совместимость с традиционной инфраструктурой поиска на основе ключевых слов.'}, 'en': {'title': 'Revolutionizing Retrieval with CoGR: Direct Keyword Generation for Enhanced Search', 'desc': 'The paper introduces CoGR, a novel framework that trains large language models (LLMs) to generate compact keywords for both queries and items, enhancing retrieval processes in search and advertising systems. Unlike traditional methods that focus on query-side augmentation, CoGR directly constructs retrieval representations for both sides, allowing for more efficient matching through an inverted index. The training involves a two-stage pipeline, starting with supervised fine-tuning to create an aligned keyword space, followed by co-evolving reinforcement learning to optimize both query and item generators. Results show that CoGR significantly outperforms existing baselines, achieving notable improvements in retrieval performance across various datasets.'}, 'zh': {'title': 'CoGR：优化检索的关键词生成框架', 'desc': 'CoGR是一种检索框架，旨在训练大型语言模型（LLMs）直接生成查询和项目的紧凑关键词，从而优化反向索引检索。该方法通过两阶段训练管道，首先进行监督微调以建立对齐的关键词空间，然后使用共同进化的强化学习优化查询和项目生成器。CoGR的创新之处在于，它不仅在查询侧进行关键词扩展，还在项目侧生成关键词，直接通过反向索引进行匹配。实验结果表明，CoGR在多个基准测试中表现优异，显著提高了检索性能。'}}}, {'id': 'https://huggingface.co/papers/2608.29846', 'title': 'Influence-Directed Distillation: Solving the Diversity Bottleneck in Sampled-Token On-Policy Distillation', 'url': 'https://huggingface.co/papers/2608.29846', 'abstract': "Abstract Influence-Directed Adaptive On-Policy Distillation improves diversity transfer in reasoning model distillation by selectively preserving entropy-expanding updates and replacing entropy-contracting ones with adaptive advantage shrinkage.  Generated by thinkingmachines/Inkling-Small Sampled-token on-policy distillation (OPD) efficiently transfers capabilities from teacher to student using student-generated tokens, requiring teacher probabilities only for sampled tokens. Yet it frequently suffers from diversity distillation failure: the student's pass@1 improves while its pass@k plateaus, failing to inherit the teacher's diversity. To explain this, we introduce First-Order Local Entropy Influence, a signed first-order proxy that decouples each update's entropy effect into the teacher--student log-probability gap and the student's local probability structure, and empirically links entropy contraction to negative-influence positions. Motivated by this, we propose Influence-Directed Adaptive On-Policy Distillation (IDA-OPD): rather than relying on costly full-vocabulary Forward-KL objectives, it preserves entropy-expanding updates while replacing entropy-contracting ones with divergence-adaptive advantage shrinkage, using only the teacher's sampled-token log-probability. Experiments on reasoning-oriented distillation show IDA-OPD consistently improves pass@k, inheriting the teacher's diversity through distillation, matches the strongest teacher-informed methods at strictly lower cost, and broadly maintains vanilla OPD's pass@1, all without full-vocabulary teacher information.", 'score': 2, 'issue_id': 3208, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': 'e91adfba7a387d0a', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Сохранение разнообразия при дистилляции через влияние на энтропию', 'desc': 'В работе предлагается метод Influence-Directed Adaptive On-Policy Distillation (IDA-OPD) для улучшения передачи разнообразия при дистилляции моделей рассуждения. Авторы выявили проблему отказа в дистилляции разнообразия, когда метрика pass@1 студента улучшается, но pass@k не растёт, и предложили использовать First-Order Local Entropy Influence для анализа влияния каждого обновления на энтропию. Новый метод сохраняет обновления, которые увеличивают энтропию, а обновления, сокращающие энтропию, заменяет адаптивным сжатием преимущества без использования полного словаря. Экспериментальные результаты показывают, что IDA-OPD эффективнее наследует разнообразие учителя, достигает лучших результатов с меньшими вычислительными затратами и сохраняет качество базового метода OPD.'}, 'en': {'title': 'Enhancing Diversity in Model Distillation with IDA-OPD', 'desc': "This paper presents Influence-Directed Adaptive On-Policy Distillation (IDA-OPD), a method that enhances the transfer of diverse reasoning capabilities from a teacher model to a student model in machine learning. It addresses the issue of diversity distillation failure, where the student's performance improves in some areas but plateaus in others, by selectively preserving updates that increase entropy and replacing those that decrease it. The authors introduce a new metric, First-Order Local Entropy Influence, to analyze the impact of each update on the model's diversity. Through experiments, IDA-OPD demonstrates improved performance in maintaining diversity while being more efficient than traditional methods that require full vocabulary teacher information."}, 'zh': {'title': '提升推理模型多样性的自适应蒸馏方法', 'desc': '本文提出了一种名为影响导向自适应在线蒸馏（IDA-OPD）的方法，旨在改善推理模型蒸馏中的多样性转移。该方法通过选择性保留扩展熵的更新，并用自适应优势收缩替换收缩熵的更新，从而提高了学生模型的多样性。研究引入了一阶局部熵影响的概念，帮助理解更新对熵的影响，并将其与教师和学生之间的概率结构联系起来。实验结果表明，IDA-OPD在推理导向的蒸馏任务中，能够有效提高学生模型的多样性，同时降低了计算成本。'}}}, {'id': 'https://huggingface.co/papers/2609.02272', 'title': 'PaperCompiler: Faithful Paper-to-Code Generation via Repository-Level Specification Compilation', 'url': 'https://huggingface.co/papers/2609.02272', 'abstract': 'Abstract PaperCompiler converts research papers into structured repository specifications that preserve method logic and cross-file consistency, improving code fidelity and reducing critical errors.  Generated by thinkingmachines/Inkling-Small Faithfully translating research papers into repository-level implementations remains challenging because papers often describe methods at a high level, leave implementation assumptions implicit, and require generated repositories to preserve method logic, evaluation protocols, and cross-file consistency. Despite recent advances in paper-to-code agents, their intermediate outputs are often presented as free-form plans or summaries that downstream coding agents may ignore, reinterpret, or compress, leading to algorithmic simplification and inconsistent repository structure. To address these challenges, we introduce PaperCompiler, a paper-to-code generation framework that compiles paper-grounded evidence into explicit repository-level implementation specifications. PaperCompiler grounds implementation-relevant evidence while preserving source provenance and distinguishing paper-supported, inferred, externally delegated, and unresolved information. The resulting specifications encode non-degradation requirements, ownership assignments, cross-file dependencies, and file-level constraints. Repository generation proceeds under these compiled specifications while retaining flexibility over local engineering choices not fixed by the paper. PaperCompiler outperforms strong baselines on Paper2CodeBench, achieving a 13.8% relative improvement in reference-based fidelity (from 3.64 to 4.15) and reducing high-severity evaluator critiques (from 13.2% to 6.1%).', 'score': 1, 'issue_id': 3208, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': 'cfc74fbf7ea8977c', 'authors': ['Yunhao Liu', 'Hong Phuc Pham', 'Jaehong Yoon'], 'affiliations': ['NTU Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.02272.jpg', 'data': {'categories': [], 'emoji': '📋', 'ru': {'title': 'От научной статьи к идеальному коду через явные спецификации', 'desc': 'PaperCompiler — это система для автоматического преобразования научных статей в структурированные спецификации хранилищ кода, которые сохраняют логику методов и согласованность между файлами. В отличие от существующих агентов для генерации кода из бумаги, которые создают неструктурированные планы, PaperCompiler компилирует доказательства из статей в явные требования уровня репозитория с трассировкой источников и различением подтвержденной, выведенной и неопределенной информации. Система кодирует требования непротиворечивости, распределение ответственности между файлами, зависимости и ограничения, позволяя генератору кода работать под этими спецификациями. PaperCompiler достигает 13.8% относительного улучшения в точности воспроизведения метода и снижает критические ошибки в коде на 53%.'}, 'en': {'title': 'Transforming Research into Reliable Code', 'desc': 'PaperCompiler is a framework designed to convert research papers into structured code repositories while maintaining the integrity of the methods described. It addresses the challenge of translating high-level descriptions and implicit assumptions from papers into explicit implementation specifications. By grounding the generated code in evidence from the original paper, it ensures that the logic and evaluation protocols are preserved, reducing errors and inconsistencies. The framework has shown significant improvements in code fidelity and reduced critical issues compared to existing methods.'}, 'zh': {'title': 'PaperCompiler：将论文转化为高保真代码的利器', 'desc': 'PaperCompiler 是一个将研究论文转换为结构化代码库规范的框架，旨在保持方法逻辑和跨文件一致性，从而提高代码的准确性并减少关键错误。该框架解决了将论文高层次描述的研究方法转化为具体实现时的挑战，确保生成的代码库能够保留评估协议和方法逻辑。PaperCompiler 通过明确的规范编码实现相关证据，同时区分论文支持的信息和推断、外部委托及未解决的信息。最终，PaperCompiler 在 Paper2CodeBench 上的表现优于强基线，显著提高了代码的参考准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.01865', 'title': 'ExecRetrieval: Measuring the Functional-Correctness Gap in Code-Embedding Retrieval', 'url': 'https://huggingface.co/papers/2609.01865', 'abstract': "Abstract ExecRetrieval evaluates whether code embeddings can distinguish correct implementations from near-identical buggy variants, revealing that leading retrievers frequently rank incorrect near-clones above canonical solutions.  Generated by thinkingmachines/Inkling-Small Embedding-based code retrieval is a core component of coding agents and retrieval-augmented code generation, where retrieving correct code matters more than retrieving lexically similar code. Existing code-retrieval benchmarks do not plant controlled, execution-verified single-edit variants of each query's canonical implementation in the search pool, leaving the question of whether embeddings can functionally discriminate correct from near-clone-but-incorrect code unanswered in a retrieval setting. Resolving this requires a benchmark whose search pool itself contains the relevant counterfactuals -- execution-verified buggy variants near-identical to each canonical -- so that a retriever's rank ordering can be directly tested for functional discrimination rather than topical or identity overlap. We introduce ExecRetrieval, 939 Python tasks each paired with one execution-verified canonical implementation and up to four execution-verified buggy distractors, each generated by a mechanical mutation making a single targeted edit, and evaluate 23 dense embedding configurations plus BM25 under provider-native invocation with paired McNemar tests and query-level bootstrap intervals. With near-clone counterfactuals in the pool, the top hosted system reaches exec@10 = 1.00 but only exec@1 = 0.331; rank-1 misses are paired buggy variants 91.5-99.4% of the time across the four leading systems, and the canonical scores below at least one of its four paired distractors in 67-78% of queries on the leading systems. The full dataset, execution oracle, embedding matrices, environment snapshot, and pairwise statistical tests are released at the URL in Appendix D.", 'score': 1, 'issue_id': 3208, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'aa0a1fa6f2b3e541', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rag', '#dataset', '#benchmark', '#plp', '#agents'], 'emoji': '🐛', 'ru': {'title': 'Когда почти идентичный код скрывает критическую ошибку', 'desc': 'В работе представлен новый бенчмарк ExecRetrieval для оценки способности векторных представлений кода различать корректные реализации от почти идентичных багов. Исследование показывает, что современные системы поиска кода часто ранжируют ошибочные варианты выше правильных решений, несмотря на высокую лексическую схожесть. Бенчмарк содержит 939 Python задач с канонической реализацией и проверенными на выполнение мутантами-ошибками, полученными путём целевого редактирования. Результаты демонстрируют критический разрыв между recall@10 и recall@1 для лидирующих систем, подчёркивая необходимость семантического анализа при поиске кода.'}, 'en': {'title': 'Distinguishing Code: Correct vs. Buggy with ExecRetrieval', 'desc': 'The paper introduces ExecRetrieval, a benchmark designed to evaluate the effectiveness of code embeddings in distinguishing correct code implementations from similar but buggy variants. It highlights that existing benchmarks do not adequately test this capability, as they lack controlled, execution-verified buggy versions of code. By including these near-clone distractors, the study assesses how well different retrieval systems can rank correct solutions over incorrect ones. The results show that while some systems perform well overall, they often misidentify buggy variants as correct, indicating a need for improved retrieval methods in code generation tasks.'}, 'zh': {'title': 'ExecRetrieval：区分正确与错误代码的基准测试', 'desc': '本文介绍了ExecRetrieval，一个评估代码嵌入是否能够区分正确实现与近似错误变体的基准。研究发现，现有的代码检索系统常常将错误的近似克隆排在正确解决方案之前。为了验证嵌入的功能性区分能力，ExecRetrieval创建了一个包含执行验证的错误变体的搜索池，使得检索系统的排名可以直接测试。通过对939个Python任务的评估，结果显示，尽管顶级系统在前10名中表现良好，但在第一名的准确率却相对较低，表明现有系统在处理近似错误变体时存在显著挑战。'}}}, {'id': 'https://huggingface.co/papers/2609.02817', 'title': 'Cliff: Learning Process Rewards from the First Mistake', 'url': 'https://huggingface.co/papers/2609.02817', 'abstract': "Abstract Cliff improves reinforcement learning with verifiable rewards by using an off-the-shelf language model to detect the first reasoning error and shaping token-level advantages accordingly.  Generated by thinkingmachines/Inkling-Small Reinforcement learning with verifiable rewards (RLVR) has emerged as a powerful paradigm for large language model (LLM) post-training, but its reliance on coarse outcome rewards leads to limited guidance on intermediate reasoning processes. Existing approaches such as process reward modeling and on-policy distillation introduce additional constraints, such as reliance on a specialized reward model or assuming identical reasoning patterns between teacher and student. Nevertheless, we observe that once a reasoning process first goes wrong, evaluating the subsequent reasoning provides limited additional information, as it is already conditioned on an invalid prefix. Therefore, we propose Cliff, a reward shaping strategy that utilizes an off-the-shelf LLM as a teacher to identify the first mistake in each rollout. As a result, the rollout is naturally decomposed into two parts: a correct prefix and an incorrect suffix. Cliff then converts this signal into token-level advantages, assigning positive advantages for the correct prefix and negative feedback afterward. Experiments across 12 different scenarios demonstrate that Cliff consistently improves reasoning performance, outperforming on-policy distillation by 15% and standard GRPO by 7%, even with teachers of modest capability. Furthermore, we analyse the role of ``ground truth'' in Cliff and investigate its training dynamics. These results establish Cliff as a simple, general and effective approach for improving RLVR with richer, fine-grained supervision.", 'score': 0, 'issue_id': 3208, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '53c9bec3e7b8a24f', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#reasoning', '#rl', '#training', '#optimization'], 'emoji': '🧗', 'ru': {'title': 'Останови рассуждение в момент первой ошибки', 'desc': 'Cliff — это метод формирования вознаграждения (reward shaping), который улучшает обучение с подкреплением при наличии верифицируемых наград для больших языковых моделей. Подход использует вспомогательную языковую модель для обнаружения первой ошибки рассуждения в каждом образце и разделяет траекторию на корректный префикс и некорректный суффикс. На основе этого разделения метод назначает положительные преимущества токенам в правильной части и отрицательные в ошибочной части, создавая более детальный сигнал обучения. Экспериментальные результаты на 12 сценариях показывают, что Cliff превосходит существующие подходы на 15% по сравнению с on-policy дистилляцией и на 7% по сравнению со стандартным GRPO.'}, 'en': {'title': 'Cliff: Enhancing Reinforcement Learning with Fine-Grained Feedback', 'desc': 'The paper introduces Cliff, a novel approach to enhance reinforcement learning with verifiable rewards (RLVR) by leveraging a language model to identify the first reasoning error during the learning process. Instead of relying solely on coarse outcome rewards, Cliff shapes the learning signal by providing token-level advantages based on the correctness of reasoning segments. This method decomposes the reasoning into a correct prefix and an incorrect suffix, allowing for more precise feedback during training. Experimental results show that Cliff significantly improves reasoning performance across various scenarios, demonstrating its effectiveness over existing methods.'}, 'zh': {'title': 'Cliff：提升增强学习的有效策略', 'desc': 'Cliff是一种增强学习方法，通过使用现成的语言模型来检测推理过程中的第一个错误，从而改善可验证奖励的效果。该方法将推理过程分为正确的前缀和错误的后缀，并为正确的前缀分配正向优势，而对错误部分给予负向反馈。实验表明，Cliff在12种不同场景中均能显著提高推理性能，超越了传统的策略蒸馏方法。通过对“真实情况”的分析，Cliff被确立为一种简单、通用且有效的增强学习改进方法。'}}}, {'id': 'https://huggingface.co/papers/2608.30949', 'title': 'MULTI3IR: A Benchmark for Multi-perspective Multi-domain Multi-modal Information Retrieval', 'url': 'https://huggingface.co/papers/2608.30949', 'abstract': "Abstract A new benchmark and steering method improve retrieval coverage of diverse perspectives across domains and modalities for open-ended queries.  Generated by thinkingmachines/Inkling-Small Information retrieval (IR) increasingly targets open-ended queries that admit diverse perspectives. Existing IR benchmarks, however, focus primarily on closed-ended queries, while even open-ended benchmarks largely consist of queries whose supporting documents span a single subject domain and modality. We introduce Multi^3IR, a benchmark that evaluates how well retrievers cover the multifaceted perspectives of open-ended queries across diverse domains and modalities. It comprises 104.9K Stack Exchange queries, each annotated with perspective descriptions that capture the query's implicit viewpoints. We further propose SPIN, a parameter- and label-efficient method that learns noise vectors to steer embeddings toward diverse yet meaningful semantic directions. Experiments show that existing multimodal retrievers suffer from single-perspective bias, while SPIN substantially improves perspective coverage on Multi^3IR and generalizes well to unseen open-ended IR benchmarks. The dataset and experimental code are available at https://github.com/seokwon99/Multi3IR.", 'score': 0, 'issue_id': 3208, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'b262dab5b9bd98a8', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#multimodal', '#rag', '#dataset'], 'emoji': '🔍', 'ru': {'title': 'Преодоление однобокости: многомерный поиск информации с разнообразием перспектив', 'desc': 'В статье представлен новый бенчмарк Multi³IR для оценки способности систем поиска информации покрывать разнообразные точки зрения по открытым запросам пользователей, охватывающим различные домены и модальности. Авторы предлагают метод SPIN, который использует шумовые векторы для направления эмбеддингов в семантическое пространство, обеспечивая разнообразие релевантных результатов при минимальных вычислительных затратах. Эксперименты показывают, что существующие мультимодальные retriever-ы страдают от однобокости в выдаче результатов, тогда как SPIN значительно улучшает покрытие различных перспектив. Метод хорошо обобщается на новые бенчмарки открытых информационных запросов.'}, 'en': {'title': 'Enhancing Diverse Perspectives in Open-Ended Information Retrieval', 'desc': 'This paper presents Multi^3IR, a new benchmark designed to enhance information retrieval (IR) for open-ended queries by ensuring diverse perspectives across various domains and modalities. Traditional IR benchmarks often focus on closed-ended queries or single-domain documents, limiting the exploration of multifaceted viewpoints. The authors introduce SPIN, a novel method that efficiently adjusts embeddings to capture a wider range of semantic directions, addressing the issue of single-perspective bias in existing multimodal retrievers. Experimental results demonstrate that SPIN significantly improves the retrieval of diverse perspectives, showcasing its effectiveness on the Multi^3IR benchmark and its applicability to other open-ended IR tasks.'}, 'zh': {'title': '提升开放式查询的多样化视角检索', 'desc': '这篇论文介绍了一种新的基准和引导方法，旨在提高开放式查询在不同领域和模态下的多样化视角的检索覆盖率。现有的信息检索基准主要集中在封闭式查询，而开放式基准往往只涉及单一主题领域和模态的查询。我们提出了Multi^3IR基准，评估检索器在多领域和多模态下对开放式查询的多面向视角的覆盖能力。我们还提出了SPIN方法，通过学习噪声向量，引导嵌入向多样且有意义的语义方向发展，从而显著改善了视角覆盖。'}}}];

            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (1)', '#agi', '#alignment', '#architecture (1)', '#audio', '#benchmark (3)', '#cv', '#data', '#dataset (3)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (2)', '#open_source', '#optimization (1)', '#plp (1)', '#rag (3)', '#reasoning (1)', '#rl (2)', '#rlhf', '#robotics', '#science', '#security', '#small_models', '#story_generation', '#survey', '#synthetic', '#training (3)', '#transfer_learning', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-03 02:14',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-03 02:14')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-03 02:14')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
