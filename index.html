'en': 'November 13', 'zh': '11月13日'}, 'hash': 'bef647dfc99a7b06', 'authors': ['Solano Amadori'], 'affiliations': ['Charcot.ai'], 'pdf_title_img': 'assets/pdf/title_img/2611.18330.jpg', 'data': {'categories': ['#multimodal', '#small_models', '#benchmark', '#audio', '#data'], 'emoji': '🎙️', 'ru': {'title': 'Замороженная ASR-модель как универсальный детектор решений в речи', 'desc': 'Статья представляет Marimba — интерфейс для принятия типизированных решений по речи, построенный на замороженных признаках LLM-подобной модели Qwen3-ASR 0.6B. Лексические вопросы решаются zero-shot-оценкой транскриптов, а нелексические — отдельными лёгкими головами: для завершения реплики используется readout с 18-го слоя, для смены спикера и подсчёта спикеров — с 12-го слоя, а для определения языка берутся языковые оценки самой ASR-модели. Модель показывает высокие AUROC и хорошую калибровку на разговорных и читаемых речевых данных, а также конкурирует с ECAPA, pyannote 3.1 и Smart Turn v3.2. Дополнительно реализовано обнаружение персональных данных через приватный PII-конвейер с F1 0.904 на синтетической португальской речи.'}, 'en': {'title': 'One frozen speech model, many useful decisions', 'desc': 'Marimba makes speech decisions using features from a frozen Qwen3-ASR model, with lightweight readouts for different tasks. It scores transcript-based questions for whether words are present, while separate methods estimate language, speaker changes, turn endings, and personal information. It performs strongly on several speech benchmarks, including speaker-change detection, and its lexical predictions are well calibrated. Turn-end results vary by test set, and the comparison on ICSI meetings shows no clear advantage over the baseline.'}, 'zh': {'title': '冻结 ASR 特征，轻量读出多种语音决策', 'desc': 'Marimba 使用冻结的 Qwen3-ASR 0.6B 特征，并通过轻量级读出模块，从语音中判断词语是否出现、话轮是否结束、所用语言、说话人是否变化，以及是否包含个人信息。词汇判断采用零样本转录文本评分，其他判断则使用问题条件化分类头或专门的读出模块；语言识别直接利用 ASR 模型的语言分数。在多项基准测试中，系统对说话人变化和说话人数的检测表现突出，词汇判断也具有较好的校准效果；个人信息检测则依赖后续的专用处理流程。话轮结束检测在自有测试集上表现良好，但在 Smart Turn 的测试集上不及其专用模型，而在 ICSI 数据上的比较差异并不显著。'}}}, {'id': 'https://huggingface.co/papers/2611.17933', 'title': 'OutfitterBench: Evaluating LLM Agents on Long-Horizon Resource Allocation and Commitment Coordination', 'url': 'https://huggingface.co/papers/2611.17933', 'abstract': "Abstract OutfitterBench evaluates LLM agents managing a 200-day outdoor-equipment rental business under fixed capital and uncertain demand, revealing limitations in sustaining feasible commitments and reallocating resources.  Generated by deepseek-ai/DeepSeek-V4.1-Flash In many long-horizon settings, an agent's own choices create future constraints: committing finite capacity establishes future obligations and forecloses later opportunities. Sustaining performance therefore requires both keeping evolving plans feasible and comparing the value of resource allocations with the alternatives they displace. Recent benchmarks increasingly evaluate LLM agents in continuing operations, but give less attention to how agents keep their own commitments feasible while reassessing resource allocations as opportunities change. We introduce OutfitterBench, where agents manage an outdoor-equipment rental business for 200 days, purchasing from a 46-product catalog and handling roughly 1,100 reservation requests. Under a fixed capital ceiling, reservations and uncertain walk-in demand compete for reusable equipment whose availability changes over time. Experiments with seven frontier LLMs show that several agents underperform a simple rule-based baseline, while only the leading agent consistently surpasses it. Trajectory analysis shows that some agents apply known constraints inconsistently and make new decisions that conflict with existing commitments. Agents with more reliable fulfillment can still secure low returns from comparable commitments or delay resource reallocation. The leading agent better connects preparation with economic choices but also misses opportunities for more profitable asset use. These findings highlight limitations in sustaining coherent resource plans and reassessing their value over time. The benchmark code is publicly available at https://github.com/adminblackjack/OutfitterBench.", 'score': 4, 'issue_id': 3542, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': 'b896f840367c1fe4', 'authors': ['Jie Huang', 'Yuecheng Hong', 'Yao Chen', 'Shengding Jiao', 'Xudong Liu', 'Qiang Ye'], 'affiliations': ['Harbin Institute of Technology', 'Independent Researcher', 'Peking University', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.17933.jpg', 'data': {'categories': ['#agents', '#optimization', '#benchmark', '#reasoning'], 'emoji': '🏕️', 'ru': {'title': 'Агенты LLM теряют связность планов, когда ресурсы ограничены и обязательства накапливаются', 'desc': 'Авторы представляют OutfitterBench, бенчмарк, в котором LLM-агенты 200 дней управляют бизнесом по аренде туристического снаряжения при фиксированном капитале и неопределённом спросе. Агентам нужно выполнять бронирования и одновременно распределять переиспользуемое оборудование между резервациями и заказами «с улицы». Эксперименты с семью frontier LLM показали, что многие агенты уступают простой rule-based baseline, и лишь лучший агент стабильно её превосходит. Анализ траекторий выявил непоследовательное соблюдение ограничений и решения, противоречащие уже принятым обязательствам, а также запаздывание с перераспределением ресурсов.'}, 'en': {'title': 'Keep Commitments, Reallocate for What Pays', 'desc': 'OutfitterBench tests how well language-model agents run an equipment rental business for 200 days, with limited money, uncertain demand, and reusable gear. The agents must honor existing reservations while deciding how to spend money and allocate equipment to new opportunities. Most tested models perform worse than a simple rule-based system, and only the strongest consistently does better. Even strong agents struggle to keep plans consistent and shift resources toward more profitable uses over time.'}, 'zh': {'title': '守住承诺，更要让资源持续创造价值', 'desc': '本文提出 OutfitterBench，用来评估大语言模型智能体经营户外装备租赁业务的能力。智能体需要在固定资金和不确定需求下，管理采购、预订与可重复使用的库存，并连续运营 200 天。实验发现，许多模型不如简单的规则基线，常会违反已有承诺，或未能及时把资源转投更有价值的用途。结果显示，长期经营不仅要求维持计划可行，还需要持续比较资源配置的收益与其他选择。'}}}, {'id': 'https://huggingface.co/papers/2611.19537', 'title': 'Continuation-Guided LLM Evolution of Program Policies and Goal Compilers in Craftax', 'url': 'https://huggingface.co/papers/2611.19537', 'abstract': 'Abstract A framework uses coding agents and a feedback cascade to synthesize code-based policies that achieve long-horizon success and can be factored into a reusable goal compiler for zero-shot transfer to new tasks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Coding agents can synthesize and optimize code-based policies from simulator feedback, allowing the resulting program to act with zero inference model calls. But for long horizon tasks, two challenges arise: local improvements can hurt final success and switching to a new objective requires another expensive synthesis run. We propose a framework that first develops competence by refining the policy through a feedback cascade, moving from episode returns to hierarchical goals and belief updates which can be scored densely from simulator. In the Craftax game, a partially observed and procedurally generated environment, refinements via episode level feedback stall at <1% final-level arrival, whereas with the feedback cascade the optimized policy reaches the final stage 50% of time (28% final boss defeats). Furthermore, to make this competence reusable towards new goals, we factor the previous controller into an environment interpreter I (models, memory, skills) and a rule program p_0, and we show that coding agents can optimize a reusable goal compiler C_θ that maps structured tasks g into new rule programs p_g. Across five independent compiler searches trained only on short tasks, the resulting compilers successfully transfer zero-shot to longer tasks without any task-specific tuning nor inference-time LLM calls: continuation-scored feedback and a fixed machine with an editable program together turn a single-task competent policy into a reusable one.   Code at: https://github.com/vicgalle/craftax-program-policies', 'score': 4, 'issue_id': 3542, 'pub_date': '2026-11-14', 'pub_date_card': {'ru': '14 ноября', 'en': 'November 14', 'zh': '11月14日'}, 'hash': '095eacf43fac5717', 'authors': ['Víctor Gallego'], 'affiliations': ['University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2611.19537.jpg', 'data': {'categories': ['#rl', '#plp', '#agents', '#transfer_learning', '#optimization', '#games'], 'emoji': '🧩', 'ru': {'title': 'От одноразового решения к переиспользуемому компилятору целей', 'desc': 'Статья описывает фреймворк, в котором coding agents (агенты-программисты) синтезируют и улучшают кодовые политики на основе обратной связи от симулятора, так что итоговая программа работает без вызовов LLM. Для длинных горизонтов предложен каскад обратной связи: от наград эпизода к иерархическим целям и обновлению belief, что позволяет плотно оценивать прогресс и резко повышает долю успешного достижения финального уровня в среде Craftax. Далее среда разбивается на интерпретатор окружения и базовую rule-программу, а coding agents оптимизируют переиспользуемый goal compiler, который переводит структурированные задачи в новые программы правил. Компиляторы, обученные только на коротких задачах, без дообучения и без вызовов LLM переносятся на более длинные задачи в режиме zero-shot.'}, 'en': {'title': 'Build One Strong Policy, Then Compile It for New Goals', 'desc': 'The paper presents a framework where coding agents use simulator feedback to build and improve programs that control an environment, without needing language-model calls during execution. A feedback cascade scores progress at several levels, from whole-episode outcomes to smaller goals and belief updates, helping improvements support long-term success. In the Craftax game, this approach reaches the final stage in 50% of attempts and defeats the final boss in 28%, compared with under 1% final-stage arrival using episode-level feedback alone. The authors also introduce a reusable goal compiler that turns new task descriptions into programs, enabling zero-shot transfer to longer tasks without task-specific tuning.'}, 'zh': {'title': '用反馈级联学会长程任务，让目标编译器实现零样本迁移', 'desc': '这篇论文提出一种利用编码智能体和模拟器反馈，自动生成并优化代码策略的方法；策略运行时无需调用推理模型。为解决长时程任务中局部改进未必提升最终成功率的问题，框架采用逐级反馈级联：先依据整局回报优化，再利用层级目标和信念状态更新提供更密集的反馈。在 Craftax 游戏中，这种方法将到达最终阶段的成功率提升至 50%，击败最终首领的比例达到 28%，而只用整局反馈时到达率低于 1%。研究还把控制器拆分为环境解释器和规则程序，并训练可复用的目标编译器，将新任务转换成规则程序，使策略能够零样本迁移到更长任务，无需针对新任务微调或在执行时调用大语言模型。'}}}, {'id': 'https://huggingface.co/papers/2611.20385', 'title': 'DominoBench: Evaluating Multi-Step Physical Reasoning from Still Images', 'url': 'https://huggingface.co/papers/2611.20385', 'abstract': 'Abstract A new benchmark, DominoBench, shows that current vision-language and multimodal models cannot reliably predict physical outcomes from still images unless the critical calculation and necessary quantities are provided.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Can a vision-language model look at a picture of a chain reaction and tell what will happen? Recent multimodal models describe scenes fluently and solve textbook physics problems, which suggests they should also predict how a scene of ramps, ledges, pendulums, seesaws and dominoes plays out once a ball is pushed. We tested this claim on 30 models from 10 families and reached a clear conclusion: unaided, no model predicts the outcome reliably. We built DominoBench, a benchmark of still images of 2D rigid-body scenes whose outcome a physics simulator computes. It holds 854 items in 427 minimal pairs, in which a change of one to three grid steps in one quantity decides whether one person survives, and every item comes with a four-rung hint ladder ending in the exact calculation that decides the outcome. Unaided, frontier models from Anthropic, Google and OpenAI are right about the person whose fate flips in at most 72% of items and answer both twins of a pair correctly in at most 34%. Pointing at the deciding step helps little, and exact geometry given as text barely helps, yet once the deciding calculation and the quantities it needs, including speeds that a still image cannot show, are written out, the same models reach 82-92% on the deciding person, while small open-weight models stay near chance. Physical prediction from a still image therefore fails at the quantitative step: the strongest models use the deciding quantity when they are given it, but do not produce it on their own. For models that plan or act in the physical world, a fluent account of a scene is thus no evidence of a correct prediction: such models must find and compute the deciding quantity unprompted, and DominoBench tests whether they do.', 'score': 4, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'a2e411ed4d4a818a', 'authors': ['Emilio Ferrara'], 'affiliations': ['University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2611.20385.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#interpretability', '#reasoning', '#dataset', '#multimodal'], 'emoji': '🎲', 'ru': {'title': 'Модели красиво описывают домино, но не умеют сами посчитать, что упадёт', 'desc': 'Авторы представляют DominoBench — бенчмарк из 854 статичных изображений 2D-сцен с твёрдыми телами, где физический симулятор вычисляет исход цепной реакции. Тестировались 30 моделей, включая vision-language и мультимодальные LLM, и без подсказок ни одна не предсказывала результат надёжно: лучшие модели правильно угадывали судьбу персонажа лишь в 72% случаев. Когда же модели получали явно записанный решающий расчёт и нужные величины (например, скорости, которые не видны на картинке), точность возрастала до 82–92%, тогда как маленькие открытые модели оставались на уровне случайного угадывания. Вывод: модели не могут сами выделить и вычислить ключевую физическую величину, поэтому связное описание сцены не гарантирует верного предсказания для агентов, действующих в физическом мире.'}, 'en': {'title': 'Seeing the Scene Isn’t Enough: Models Must Compute What Decides', 'desc': 'DominoBench tests whether vision-language models can predict the outcomes of physical chain reactions from still images. Across 854 scenes, models often fail to identify which person survives, especially when a small change in a paired scene flips the outcome. Giving models the exact calculation and needed quantities, including hidden speeds, greatly improves leading models’ accuracy, suggesting the main weakness is deriving those quantities themselves. The benchmark measures whether models can independently find and compute the decisive information needed for reliable physical prediction.'}, 'zh': {'title': '看懂场景还不够：模型必须算出决定结果的关键物理量', 'desc': '本文提出 DominoBench 基准，用来检验视觉语言模型能否根据静态图像预测二维刚体场景中的物理结果。基准包含 854 个测试项目，组成 427 对仅有细微差异的场景，并由物理模拟器确定结果。实验发现，模型独立预测时表现不可靠；提供关键计算及所需数值后，先进模型的准确率则明显提高。结果表明，模型的主要困难在于自行找出并计算决定结果的物理量，而不只是理解场景。'}}}, {'id': 'https://huggingface.co/papers/2611.19649', 'title': 'LoopFill: Pipelined Multi-Token Speculative Decoding for Looped Transformers', 'url': 'https://huggingface.co/papers/2611.19649', 'abstract': "Abstract LoopFill reduces decoding latency for looped language models by combining multi-token suffix drafts and shallow-loop predictions into a single draft tree with full-depth verification that preserves the autoregressive output distribution.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Looped Transformers improve parameter efficiency by repeatedly applying the same Transformer layers. During autoregressive decoding, however, generating each token requires several sequential passes through these layers, leading to high decoding latency. Pipelined self-speculative methods use shallow-loop predictions to process tokens at different loops in the same batch, but each token must reach the drafting depth before the next can enter the pipeline. We introduce LoopFill, a training-free speculative decoding algorithm for looped LLM that combines multi-token suffix drafts with shallow-loop predictions in a single draft tree. Both drafters contribute to one tree, so a suffix lookup can immediately extend a shallow prediction and several future tokens can enter the pipeline together. The shared block computes the highest-scoring draft candidates at different loop depths in one batch, and full-depth verification preserves the model's autoregressive output distribution. Across seven benchmarks, LoopFill's average speedup over greedy autoregressive decoding is 5.85times on Ouro-2.6B and 5.13times on Huginn-3.5B. The speedups exceed those of LoopAhead, the strongest baseline, by \\(40\\%\\) on Ouro-2.6B and \\(25\\%\\) on Huginn-3.5B.", 'score': 4, 'issue_id': 3542, 'pub_date': '2026-11-14', 'pub_date_card': {'ru': '14 ноября', 'en': 'November 14', 'zh': '11月14日'}, 'hash': '896e5ed379de412d', 'pdf_title_img': 'assets/pdf/title_img/2611.19649.jpg', 'data': {'categories': ['#architecture', '#optimization', '#inference'], 'emoji': '🚀', 'ru': {'title': 'Больше токенов за один проход: LoopFill ускоряет looped LLM без потери качества', 'desc': 'LoopFill — это алгоритм спекулятивного декодирования без дополнительного обучения для looped LLM, то есть моделей, которые многократно применяют одни и те же слои Transformer. Он объединяет multi-token suffix drafts и предсказания с мелких проходов (shallow-loop predictions) в одно общее draft tree, поэтому несколько будущих токенов могут сразу войти в конвейер. Полная верификация на полной глубине сохраняет исходное распределение выходов модели, а значит качество генерации не меняется. На семи бенчмарках ускорение относительно жадного autoregressive декодирования составляет 5.85x для Ouro-2.6B и 5.13x для Huginn-3.5B, что на 40% и 25% выше, чем у сильнейшего базового метода LoopAhead.'}, 'en': {'title': 'One Draft Tree, Faster Looped Decoding', 'desc': 'LoopFill speeds up decoding in looped language models, which reuse the same Transformer layers several times for each token. It combines multi-token suffix drafts and predictions from shallow loops into one draft tree, allowing several future tokens to be prepared together. The model verifies these drafts at full depth, preserving the original autoregressive output distribution without additional training. Across seven benchmarks, it achieves higher average speedups than greedy decoding and outperforms the strongest baseline, LoopAhead.'}, 'zh': {'title': '合并草稿树，让循环语言模型解码更快且不改变输出分布', 'desc': '循环式 Transformer 通过反复使用同一组层来提高参数效率，但逐个生成词元时需要多次串行计算，造成解码延迟。LoopFill 是一种无需训练的推测解码算法，它将多词元后缀草稿与浅循环预测合并到同一棵草稿树中。这样，后缀查找可以立即扩展浅循环预测，并让多个未来词元同时进入流水线；模型再以完整深度验证候选，从而保留自回归输出分布。七项基准测试显示，LoopFill 在 Ouro-2.6B 和 Huginn-3.5B 上分别实现 5.85 倍和 5.13 倍平均加速，优于最强基线 LoopAhead。'}}}, {'id': 'https://huggingface.co/papers/2611.17610', 'title': 'More Agents, More Samples, or More Thinking? Untangling Coordination, Ensembling, and Test-Time Compute in Multi-Agent LLMs', 'url': 'https://huggingface.co/papers/2611.17610', 'abstract': 'Abstract  Evaluations of multi-agent language models often compare communicating architectures against a single greedy pass. This practice confounds coordination with sample multiplicity and inference compute. We synthesize nine primary empirical evaluations comprising 516 unique multi-agent configurations organized along a resource vector R with six dimensions and a baseline ladder with four categories. Against baselines with a single pass (Category A), multi-agent accuracy differences are negative overall and near zero when omitting the largest contributing study. When evaluated against baselines matched on sample count (Category B) or resource budget (Category C), multi-agent systems average -0.042 in accuracy, and multilevel random effects modeling on the log odds scale remains negative across sensitivity checks. Multi-agent accuracy equals or falls below the baseline in 74% of these comparable contrasts, and study means are nonpositive in almost all evaluated studies. Across studies reporting both baselines, moving from a greedy pass to a sampled baseline shifts accuracy differences by -0.038 on average. Because communication adds no information when agents share identical evidence, positive returns require partitioned evidence, external verification, or error diversity across models. We provide a reviewer checklist and accounting utilities.', 'score': 3, 'issue_id': 3543, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': 'a010d7bf012528f1', 'authors': ['Seyed Mahmoud Sajjadi Mohammadabadi'], 'affiliations': ['Department of Computer Science, Mahmoud Sajjadi Mohammadabadi'], 'pdf_title_img': 'assets/pdf/title_img/2611.17610.jpg', 'data': {'categories': ['#optimization', '#benchmark', '#survey', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Больше агентов не значит лучше: коммуникация без новых данных не помогает', 'desc': 'Статья систематически анализирует множество экспериментов с мультиагентными LLM-системами и сравнивает их с одиночными базовыми моделями. Авторы показывают, что при честном сравнении с учётом числа сэмплов и вычислительных ресурсов мультиагентные системы в среднем уступают базовым, а часто и вовсе не дают прироста точности. Причина в том, что коммуникация агентов с одинаковой информацией не добавляет новых знаний, поэтому положительный эффект возможен лишь при разделении данных, внешней верификации или разнообразии ошибок между моделями. В работе также предложены чек-лист для рецензентов и утилиты для учёта ресурсов.'}, 'en': {'title': 'Fair Comparisons Show When Multi-Agent Models Help', 'desc': 'The paper reviews nine studies covering 516 multi-agent language model configurations and compares them with baselines that account for sampling and inference resources. Against baselines matched for sample count or resource budget, multi-agent systems have 0.042 lower accuracy on average, with results remaining negative across statistical sensitivity checks. In 74% of comparable evaluations, multi-agent accuracy is no better than the baseline, and comparing against a sampled baseline rather than a single greedy pass reduces the apparent advantage. The authors argue that coordination is most likely to help when agents have different evidence, access to external verification, or make diverse errors, and provide tools for fairer evaluation.'}, 'zh': {'title': '公平对齐推理资源，才能看清多智能体协作的真实收益', 'desc': '这篇论文系统评估多智能体语言模型，并指出，与单次贪心推理相比，直接比较会把协作效果和样本数量、推理计算量混在一起。研究汇总了九项实证评估、516种配置，并在样本数或资源预算相匹配的基线下进行比较；多智能体系统的准确率平均低约0.042，且多数可比结果并未胜过基线。多层随机效应模型和敏感性分析也支持这一结论，说明现有证据尚未显示多智能体协作能稳定提升准确率。若要获得正向收益，系统需要让智能体拥有不同证据、进行外部验证，或利用不同模型之间的错误差异；论文还提供了审稿检查清单和资源核算工具。'}}}, {'id': 'https://huggingface.co/papers/2611.09825', 'title': 'BitDecoding-FP4: Native FP4 KV Cache Decoding via Algorithm-System Co-Design', 'url': 'https://huggingface.co/papers/2611.09825', 'abstract': 'Abstract BitDecoding-FP4 co-designs FP4 quantization and system optimizations to enable accurate, high-throughput long-context KV decoding for LLMs.  Generated by deepseek-ai/DeepSeek-V4.1-Flash The key-value (KV) cache dominates memory capacity and bandwidth in long-context LLM serving. While 4-bit microscaling formats (NVFP4, MXFP4) shrink the cache and run attention on FP4 Tensor Cores, a fundamental gap remains between algorithmic quantization and system-aware acceleration: existing FP4 KV systems use vanilla quantization that causes severe accuracy drops, whereas accuracy-oriented 4-bit algorithms rely on vector codebooks whose lookup overhead degrades decoding throughput. We present BitDecoding-FP4, an algorithm--system co-design for accurate and efficient native FP4 KV decoding. We mitigate three error sources: Dual-Residual Query Quantization splits queries into two FP4 tensors, cutting query logit error from 60% to 1%; Underflow-Aware Probability Scaling prevents E4M3 scales from rounding long-context probabilities to zero; and Outlier-Aware Key Quantization combines static smoothing, Hadamard rotation, and scale search to suppress key outliers under token-wise scaling. At the system level, we remove the softmax bottleneck via transposed softmax with fused probability quantization and stacked query MMA on paged KV caches. Across dense and MoE models with GQA and MLA, BitDecoding-FP4 stays within 0.5 points of BF16 KV accuracy with NVFP4 (1 point with MXFP4), and tracks BF16 KV in RL training rollouts. In end-to-end serving on NVIDIA B300 with Qwen3-4B and Qwen3-30B-A3B, it delivers 2.4-3.0times higher peak serving throughput than BF16 KV. The implementation is available at https://github.com/OpenBitSys/BitDecoding-FP4.', 'score': 3, 'issue_id': 3543, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': '57d3bd4b11843bf6', 'authors': ['Dayou Du', 'Woon Yee Ng', 'Guangming Sheng', 'Nick Lau', 'Jianyi Cheng', 'Luo Mai'], 'affiliations': ['Tencent Hunyuan', 'University of Edinburgh'], 'pdf_title_img': 'assets/pdf/title_img/2611.09825.jpg', 'data': {'categories': ['#training', '#optimization', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Точный FP4-кэш для быстрого декодирования длинного контекста LLM', 'desc': 'Статья представляет BitDecoding-FP4 — совместный алгоритмически-системный дизайн для эффективного декодирования KV-кэша в формате FP4 при работе LLM с длинным контекстом. Авторы устраняют три источника ошибок квантизации: Dual-Residual Query Quantization разбивает запросы на два FP4-тензора, Underflow-Aware Probability Scaling предотвращает обнуление вероятностей при масштабировании E4M3, а Outlier-Aware Key Quantization подавляет выбросы в ключах с помощью статического сглаживания, Hadamard-ротации и поиска масштаба. На системном уровне softmax-узкое место устраняется через transposed softmax с fused-квантизацией вероятностей и stacked query MMA на paged KV-кэше. На моделях Qwen3 на NVIDIA B300 метод даёт пиковую пропускную способность в 2.4–3.0 раза выше, чем BF16 KV, при точности в пределах 0.5 пункта от BF16.'}, 'en': {'title': 'Accurate 4-bit KV caches, faster long-context decoding', 'desc': 'BitDecoding-FP4 makes long-context language model decoding more memory-efficient by storing the key-value (KV) cache in 4-bit floating-point formats. It reduces quantization error with separate techniques for queries, probabilities, and keys, while avoiding slow lookup-based methods. Its system optimizations fuse probability quantization with softmax and speed up attention on paged KV caches. Tests show accuracy close to BF16 and up to 3× higher serving throughput on NVIDIA B300 GPUs.'}, 'zh': {'title': '让 FP4 KV 缓存兼顾长上下文精度与高速解码', 'desc': '本文提出 BitDecoding-FP4，通过协同设计 FP4 量化算法与系统优化，让大语言模型能够更准确、高效地解码长上下文 KV 缓存。它采用双残差查询量化、感知下溢的概率缩放和感知离群值的键量化，减少量化误差，并避免长上下文中的概率被舍入为零。系统方面，方法融合概率量化与转置 Softmax，并优化分页 KV 缓存上的矩阵乘法，从而降低解码瓶颈。在 NVIDIA B300 上测试时，其精度接近 BF16 KV，服务吞吐量可提升 2.4 至 3.0 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.19771', 'title': 'JEPA4R: Embodied JEPA World Models with 4D Point Planning', 'url': 'https://huggingface.co/papers/2611.19771', 'abstract': 'Abstract  Joint-embedding predictive architecture (JEPA) world models predict future embeddings instead of pixels and plan in latent space. Two challenges remain: 2D images leave the metric geometry that manipulation acts on implicit and entangled with appearance, and what these models imagine stays hidden, as they are mostly judged in simulation by short-horizon latent planning. We present JEPA4R, a JEPA world model that observes single-depth-camera point clouds, predicts and plans in their latent space, and acts through a policy head on its frozen latents; we call this 4D point planning. A decoder on the frozen world model shows what it imagines as 4D point clouds, with a mean point error within 1.1 cm over 200 steps. Under the policy-learning protocols of OGBench and CortexBench, JEPA4R leads pixel JEPA models on OGBench Cube-Single, Cube-Double, Cube-Triple and Scene, and ranks first on MetaWorld and Adroit Relocate with 98.4% and 88.0%, above the runner-up, R3M, at 96.0% and 65.3%. Trained only in a digital twin, JEPA4R and its policy heads run zero-shot on the real arm with both a gripper and a dexterous hand.', 'score': 3, 'issue_id': 3543, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': 'a2d5e519cc96413c', 'authors': ['Jiarui Dong', 'Zhiheng Liang', 'Yanjun Li', 'Zeyu Zhang', 'Heejeong Nam', 'Haoyu Chen', 'Hao Tang'], 'affiliations': ['Brown University', 'Peking University', 'UC Berkeley BAIR', 'University of Oulu'], 'pdf_title_img': 'assets/pdf/title_img/2611.19771.jpg', 'data': {'categories': ['#architecture', '#optimization', '#3d', '#benchmark', '#robotics', '#games'], 'emoji': '🤖', 'ru': {'title': 'Планируем манипуляции в 4D-пространстве точек, а не в пикселях', 'desc': 'Авторы представляют JEPA4R — JEPA world model, которая работает не с 2D-изображениями, а с облаками точек (point clouds) от одной глубинной камеры, предсказывая и планируя действия в их латентном пространстве. Политика управления (policy head) строится поверх замороженных латентных представлений, что они называют 4D point planning. Декодер визуализирует «воображаемые» 4D-облака точек с средней ошибкой около 1.1 см на горизонте 200 шагов, что делает внутренние предсказания модели наблюдаемыми. На бенчмарках OGBench, CortexBench, MetaWorld и Adroit модель превосходит пиксельные JEPA и базовые подходы, например R3M, а обученная только в цифровом двойнике, она переносится на реального робота zero-shot, с захватом и с dexterous hand.'}, 'en': {'title': 'Plan in 3D, Imagine the Future, Act in the Real World', 'desc': 'JEPA4R is a world model that uses point clouds from a depth camera to predict future states in a learned latent space, rather than predicting image pixels. This gives the model explicit 3D geometry for planning robot manipulation, while a policy head turns its frozen latent representations into actions. A decoder makes the model’s imagined future point clouds visible, with average point error under 1.1 cm across 200 steps. JEPA4R outperforms pixel-based JEPA models on several manipulation benchmarks and transfers from simulation to a real robot arm without additional training.'}, 'zh': {'title': '让机器人在三维潜在空间中预见并规划动作', 'desc': '本文提出 JEPA4R，一种用于机器人操作的世界模型，它从单个深度相机获取点云，并在潜在空间中预测未来状态、规划动作。与基于图像的方法相比，它直接表示物体的三维几何形状，并通过策略头利用冻结的潜在表示执行动作。研究还训练了解码器，将模型想象的未来还原为四维点云；在预测 200 步时，平均点误差低于 1.1 厘米。在多个仿真基准上，JEPA4R 超越像素 JEPA 模型，并且仅在数字孪生中训练后，就能在真实机械臂及不同类型的手上零样本运行。'}}}, {'id': 'https://huggingface.co/papers/2611.16642', 'title': 'Dataset Distillation via Drifting', 'url': 'https://huggingface.co/papers/2611.16642', 'abstract': 'Abstract A dataset distillation method learns synthetic samples that approximate per-class data distributions in a feature extractor\'s latent space, improving distribution coverage and classification training while supporting visualization and other modalities.  Generated by deepseek-ai/DeepSeek-V4.1-Flash The task of dataset distillation concerns the learning of a small set of synthetic samples that can serve as an effective replacement for a large real dataset when used for downstream tasks. While many solutions have been proposed since the problem\'s inception, most of them primarily seek to optimize the distilled data with respect to a classifier. In this work, we propose a new distillation method that learns a set of samples such that they directly approximate the per-class data distribution. Specifically, we "drift" our distilled data in the latent space of a feature extractor such that they move both toward the real data and away from each other without using a classification objective. We find that our drifted data cover the real distribution significantly better than existing methods while still serving as powerful training samples for classification. Furthermore, we showcase our method\'s use as a visualization tool for better interpreting models and extend it beyond images to other modalities. Our work advances the frontier of dataset distillation, offering a novel synthesis method and proposing distribution-based metrics as a complementary evaluation. More broadly, our findings help address the growing need to understand both data and models by uncovering more about how they interact.', 'score': 3, 'issue_id': 3542, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '7aa125cbc2d676dd', 'pdf_title_img': 'assets/pdf/title_img/2611.16642.jpg', 'data': {'categories': ['#synthetic', '#training', '#benchmark', '#interpretability', '#multimodal', '#data', '#cv'], 'emoji': '🧬', 'ru': {'title': 'Синтетические данные, которые повторяют распределение реального мира', 'desc': 'Авторы предлагают новый метод дистилляции датасета, который обучает небольшой набор синтетических образцов аппроксимировать распределение данных каждого класса. Образцы «дрейфуют» в латентном пространстве экстрактора признаков: они приближаются к реальным данным и отталкиваются друг от друга, без использования классификационной функции потерь. Такие данные лучше покрывают реальное распределение, чем у существующих методов, и при этом остаются эффективными для обучения классификаторов. Метод также применим как инструмент визуализации для интерпретации моделей и расширен на модальности помимо изображений.'}, 'en': {'title': 'Distill data by matching distributions, not classifier outputs', 'desc': 'This paper introduces a dataset distillation method that creates a small set of synthetic samples to represent each class’s data distribution. It moves the samples through a feature extractor’s latent space, pulling them toward real data while pushing them apart from one another, without optimizing a classifier’s predictions. The resulting samples cover the real data distribution better than prior methods and remain useful for training classifiers. The method can also help visualize and interpret models, and it extends to data beyond images.'}, 'zh': {'title': '在潜在空间中贴近真实分布，让少量合成数据发挥更大作用', 'desc': '本文提出一种数据集蒸馏方法，生成少量合成样本来替代大量真实训练数据。它在特征提取器的潜在空间中调整样本，使样本靠近真实数据分布，同时彼此远离，而不依赖分类目标进行优化。实验显示，这种方法能更充分地覆盖真实数据分布，并且仍能有效训练分类器。该方法还可用于模型可视化，并扩展到图像以外的其他模态。'}}}, {'id': 'https://huggingface.co/papers/2611.08977', 'title': 'Energy-Based Reasoners: Your Recurrent Reasoner Should Be an Energy-Based Model', 'url': 'https://huggingface.co/papers/2611.08977', 'abstract': 'Abstract Energy-Based Reasoners guide looped latent reasoning by learning an energy function whose gradient refines states and signals when to stop, with exploration-based training improving performance and efficiency.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Looping is a powerful inductive bias for reasoning. By repeatedly iterating a recurrent block, looped models can scale their effective depth and enable multi-step reasoning in latent space. However, existing looped models are not inherently guided by an explicit measure of progress, making it difficult to determine when to stop looping and how to improve upon the current state. To enable this, we introduce Energy-Based Reasoners (EBRs), which learn an energy function over latent reasoning states and formulate looped updates as gradient descent on this energy. The energy scores latent states, while its gradient guides refinement and provides a signal for stopping. To train EBRs effectively, we further introduce exploration-based training to discover additional modes and to better shape the energy landscape over a broader set of states. Across four algorithmic reasoning benchmarks, EBRs match or outperform prior recurrent reasoning models, achieving 99.9% accuracy on Sudoku-Extreme while using 345times less inference compute than the next-best model and maintaining comparable training compute. On all multi-solution benchmarks, EBRs achieve state-of-the-art coverage of distinct valid solutions while maintaining near-100% single-sample accuracy. These results suggest that energy-based models are a promising approach for strong reasoning performance.', 'score': 2, 'issue_id': 3543, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': '61e19cef2720f4e9', 'authors': ['William Xingxu Chen', 'Alexi Gladstone', 'Zeyu Michael Li', 'Heng Ji', 'Yilun Du'], 'affiliations': ['Duke University', 'Harvard University', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2611.08977.jpg', 'data': {'categories': ['#math', '#optimization', '#training', '#benchmark', '#reasoning', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Рассуждать — значит спускаться по энергетическому ландшафту', 'desc': 'Статья представляет Energy-Based Reasoners (EBR) — модели, которые рассуждают в латентном пространстве, многократно применяя рекуррентный блок. Авторы обучают энергетическую функцию над скрытыми состояниями, а итеративные обновления формулируют как градиентный спуск по этой энергии. Градиент направляет уточнение состояний и служит сигналом для остановки цикла, а exploration-based training помогает находить дополнительные моды и лучше формировать энергетический ландшафт. На бенчмарках EBR не уступают или превосходят прошлые рекуррентные модели, достигая 99.9% accuracy на Sudoku-Extreme при в 345 раз меньших затратах inference-вычислений.'}, 'en': {'title': 'Guide Every Reasoning Loop with Energy', 'desc': 'The paper introduces Energy-Based Reasoners (EBRs), which use an energy function to evaluate latent reasoning states. A looped model updates its state by following the energy gradient, refining its reasoning and indicating when it should stop. Exploration-based training helps the model discover more possible states and shape a useful energy landscape. On four algorithmic reasoning benchmarks, EBRs match or outperform earlier models, including strong Sudoku accuracy with much less inference compute and broad coverage of valid solutions.'}, 'zh': {'title': '以能量梯度引导隐空间推理，少算也能推得更好', 'desc': '论文提出能量型推理器（EBR），用能量函数评估循环模型在隐空间中的推理状态。模型沿着能量梯度迭代更新状态，使推理逐步改善，并利用能量信号判断何时停止。为让模型探索更丰富的有效状态，作者还提出基于探索的训练方法，以塑造覆盖更广的能量景观。在四项算法推理基准测试中，EBR表现达到或超过已有循环推理模型；它在极难数独上取得99.9%的准确率，推理计算量也远低于次优模型。'}}}, {'id': 'https://huggingface.co/papers/2611.20595', 'title': 'Invariant-Aware Harness Enforcement to Protect LLM Agents from Silent API Failures', 'url': 'https://huggingface.co/papers/2611.20595', 'abstract': 'Abstract  LLM agents answer questions by calling APIs and trusting the results. An API can fail silently. It ignores part of a request, such as a misnamed filter, yet returns HTTP 200 and a plausible but wrong result. Current fixes, such as checklists, reviewer models and LLM judges, ask the model to catch it. But models often see the problem and answer anyway. We present SilentGuard, which moves the decision from the model to the harness running tool calls. It tests each result against invariants that any correct API must satisfy and withholds values that break one. We find silent failures in 11 of 15 public research APIs, with counts inflated up to 691 times. Current fixes leave over 70% of answers wrong, and agents report 77.4% of counts a judge flags. Across 7 open models, SilentGuard cuts wrong answers on its target faults from 74.0% to 1.7%, with no loss on fault-free tasks. On three frontier models they fall from 70.2% to 0.5%. A warning from the same check leaves 70.1% wrong, so enforcement is the key. On new fault types, the harness alone cuts wrong answers from 61.1% to 24.5%. It avoids wrong answers by abstaining rather than recovering.', 'score': 2, 'issue_id': 3543, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'fe63186dfe44cded', 'authors': ['Sajib Acharjee Dip', 'Brian Ouyang', 'Lala Motlhabi'], 'affiliations': ['Genentech, South San Francisco, CA, USA', 'Virginia Tech, Blacksburg, VA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2611.20595.jpg', 'data': {'categories': ['#alignment', '#benchmark', '#hallucinations', '#agents'], 'emoji': '🛡️', 'ru': {'title': 'Не доверяй API вслепую: решение должен принимать harness, а не модель', 'desc': 'Статья показывает, что LLM-агенты могут получать неверные ответы от API, которые молча игнорируют часть запроса, но возвращают HTTP 200 и правдоподобный результат. Существующие методы, такие как чек-листы, модели-рецензенты и LLM-судьи, полагаются на саму модель, которая часто замечает ошибку, но всё равно отвечает неверно. Авторы предлагают SilentGuard, который переносит решение из модели в harness, проверяющий результаты вызовов по инвариантам, и скрывает значения, нарушающие их. Эксперименты показывают, что метод почти полностью устраняет неверные ответы на целевых ошибках (с 74% до 1.7% у открытых моделей), сохраняя качество без сбоев, а предупреждения без принуждения такого эффекта не дают.'}, 'en': {'title': 'Check the tool result, not the model’s confidence', 'desc': 'SilentGuard protects LLM agents from silent API failures, where an API returns a plausible result despite ignoring part of a request. Instead of asking the model to detect errors, its tool-calling harness checks API results against invariants and withholds results that violate them. Across tested models, enforcing these checks sharply reduced wrong answers, while simply warning the model did not; the checks also helped on new fault types. The system avoids errors by abstaining when results fail checks, rather than trying to recover the correct answer.'}, 'zh': {'title': '别让静默故障蒙混过关：用强制校验守住工具调用', 'desc': '这篇论文提出 SilentGuard，用于防止大型语言模型（LLM）智能体被 API 的静默故障误导。静默故障会让 API 忽略请求中的部分内容，却仍返回看似合理的结果；SilentGuard 会在工具调用框架中检查结果是否符合正确 API 必须满足的不变量，并拦截不符合的结果。研究发现，单纯提醒或警告模型并不足以避免错误，而强制拦截可将目标故障导致的错误答案大幅降低，且不影响无故障任务。面对尚未见过的故障类型，它也能减少错误，但主要通过拒绝作答来避免错误，而不是修复或恢复正确结果。'}}}, {'id': 'https://huggingface.co/papers/2611.16694', 'title': 'When Expert Disagreement Hurts: Prestige and Selectivity in LLM Decision Revision', 'url': 'https://huggingface.co/papers/2611.16694', 'abstract': "Abstract A controlled two-pass audit varying only the revision context reveals that language models often fail to selectively correct errors under disagreement, with expert labels increasing reversals but not reliably improving accuracy, so revision should be assessed using paired conditional metrics per model and protocol.  Generated by deepseek-ai/DeepSeek-V4.1-Flash When language models revise a decision after another agent disagrees, neither reversal counts nor final accuracy shows whether they are fixing mistakes or abandoning correct answers. We introduce a controlled two-pass audit that holds the question, the evidence, and the model's initial answer fixed and varies only the revision context: neutral reflection, anonymous disagreement, or disagreement attributed to a domain expert. For binary decisions the accounting is exact: revision raises accuracy only if it is selective enough, reversing wrong answers more than a/(1-a) times as often as correct ones, where a is initial accuracy (nine times at 90%). Across five models and 1,989 evidence-grounded decisions in medicine, science, and law, no model clears this bar under expert disagreement, and accuracy falls by up to 16.1 points. The expert label, a prestige cue, adds reversals for four of the five models, yet its effect on accuracy ranges from a 5.2-point loss to a 2.4-point gain, so reversal counts are a poor proxy for harm. With identical arguments from both sources, the label still raises reversal for three proprietary models and in a pooled analysis of four newer models. Models also respond to stated source reliability. Revision pipelines should therefore be evaluated with paired, conditional metrics, per model and protocol.", 'score': 2, 'issue_id': 3543, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '266a94ac803a3fa8', 'authors': ['Yupeng Tang', 'Mingfeng Lin'], 'affiliations': ['Georgia Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.16694.jpg', 'data': {'categories': ['#science', '#alignment', '#ethics', '#interpretability', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Частые пересмотры не значат лучшие ответы: оценивайте LLM парными условными метриками', 'desc': 'Авторы исследуют, как LLM пересматривают свои ответы, когда другой агент с ними не согласен. Они используют контролируемый двухэтапный аудит, где меняется только контекст пересмотра: нейтральная рефлексия, анонимное несогласие или несогласие эксперта, при этом вопрос, доказательства и первоначальный ответ фиксированы. Показано, что при несогласии эксперта точность часто падает на величину до 16.1 п.п., поскольку модели меняют ответы не избирательно и исправляют ошибки, но и портят правильные ответы. Поэтому пересмотр в ML-пайплайнах предлагается оценивать парными условными метриками отдельно для каждой модели и протокола.'}, 'en': {'title': 'More Revisions Don’t Always Mean Better Answers', 'desc': 'The paper tests how language models change binary decisions after neutral reflection or disagreement from an anonymous source or a domain expert. It keeps each question, evidence, and initial answer fixed, so the effect of the revision context can be measured directly. Across five models, expert disagreement often caused more answers to be reversed, but models did not reliably reverse wrong answers more often than correct ones, and accuracy sometimes dropped. The authors recommend evaluating revisions with paired, conditional measures for each model and protocol, rather than using reversal counts alone.'}, 'zh': {'title': '评估模型修订，别只数它改了多少答案', 'desc': '本文研究语言模型在他人提出异议后修改判断的表现，并通过控制实验只改变修订时看到的背景信息。实验比较中性反思、匿名异议和标注为领域专家的异议，发现专家标签常使模型更频繁地改变答案，却不一定提高准确率。只有当模型更常纠正原本错误的答案、而不是推翻原本正确的答案时，修订才会提升准确率；实验中没有模型在专家异议下达到这一标准。作者因此建议按模型和实验流程，使用配对的条件指标评估修订效果，而不能只看答案改变次数或最终准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.21479', 'title': 'LynnReal-Hand: Unlocking World Interaction with Hand Control', 'url': 'https://huggingface.co/papers/2611.21479', 'abstract': 'Abstract  Interactive video world models enable exploration through text and camera controls, yet direct object interaction requires finer control. Hands provide a natural interface, but translating continuous hand movements into coherent visual responses remains challenging because of complex hand-object dynamics and demanding real-time computation. To address these challenges, we introduce LynnReal-Hand, a hand-controlled video world model that unifies precise interaction modeling with efficient streaming generation. We curate 100K interaction clips spanning diverse real and synthetic environments and develop hand-aware supervision to improve fine-grained hand motions and object interactions. Building on this foundation, we learn a causal flow map for few-step generation and introduce region-aware score distillation that combines complementary video and image priors to refine interaction dynamics and visual appearance. To further reduce inference latency, we propose Ultra-Fast-VAE, a compact video decoder that preserves high reconstruction fidelity with substantially lower computational cost. Extensive evaluations on HandBench demonstrate superior hand-following accuracy and visual quality compared with existing approaches. Our full-sequence model achieves an FVD of 181.67 and a MANO Dice score of 93.02, while the three-step causal model maintains a MANO Dice score of 92.49. For real-time interaction, 540p streaming on a single H200 reaches 18.03 FPS with 741ms latency and an optimized peak GPU memory footprint of only 34.89GB. We will release the datasets, model weights, and the full training and inference code to support research on hand-controlled video world models.', 'score': 2, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'ecd24f4647952fde', 'authors': ['Shaohao Rui', 'Chaoyang Zhang', 'Xiaofeng Mao', 'Weijie Ma'], 'affiliations': ['LynnReal AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.21479.jpg', 'data': {'categories': ['#architecture', '#synthetic', '#training', '#robotics', '#benchmark', '#multimodal', '#dataset', '#data', '#diffusion', '#optimization', '#inference', '#video'], 'emoji': '🖐️', 'ru': {'title': 'Управляй миром жестами: генерация видео с точным контролем рук в реальном времени', 'desc': 'Статья представляет LynnReal-Hand — видео-модель мира, которой можно управлять движениями рук, что позволяет напрямую взаимодействовать с объектами в генерируемой сцене. Авторы собрали датасет из 100 тысяч клипов с взаимодействиями и ввели hand-aware supervision для точного моделирования мелкой моторики и динамики «рука-объект». Для быстрой генерации используется causal flow map с небольшим числом шагов и region-aware score distillation, а декодер Ultra-Fast-VAE снижает задержку при сохранении качества. На HandBench модель превосходит аналоги по точности следования за рукой и визуальному качеству и работает в реальном времени на одном H200 со стримингом 540p.'}, 'en': {'title': 'Hands-on Control for Fast, Real-Time Video Worlds', 'desc': 'LynnReal-Hand is a video world model that lets users control scenes by moving their hands. The researchers collect 100,000 interaction clips and use hand-aware supervision to improve how the model represents hand motion and object interactions. They combine a causal flow map for efficient few-step video generation with region-aware score distillation, and build a compact video decoder to reduce inference costs. On HandBench, the model achieves strong hand-following accuracy and visual quality, while its streaming version runs at 18.03 FPS with 741 ms latency on a single H200 GPU.'}, 'zh': {'title': '让手势成为实时视频世界的精准交互方式', 'desc': '本文提出 LynnReal-Hand，一种通过手部动作控制视频世界模型的系统，让用户能更精细地与视频中的物体互动。研究团队整理了涵盖真实与合成环境的十万段互动视频，并设计手部感知监督，以提升手部动作和物体交互的建模精度。模型利用因果流映射实现少步生成，并通过区域感知的分数蒸馏融合视频与图像先验；此外，Ultra-Fast-VAE 解码器降低了计算成本和延迟。实验显示，该方法在手部跟随准确度与视觉质量方面表现突出，也能以较低延迟进行实时视频生成。'}}}, {'id': 'https://huggingface.co/papers/2611.20148', 'title': 'Centered Ablation: Why Last-Layer Directional Ablation Under-Fires or Collapses, and a Closed-Form Fix', 'url': 'https://huggingface.co/papers/2611.20148', 'abstract': 'Abstract  Directional ablation removes a hidden state\'s component along a "behaviour direction" while a language model runs. It is the standard way to switch a behaviour such as refusal off, but it is erratic: on some models it barely fires, on others the text collapses into repetition. We show why, and fix it. At the last residual stream, ablation is exactly a logit bias: a fixed vocabulary footprint scaled by a gate, the cosine between the hidden state and the direction. The gate is measured from the origin, but last-layer states share a large common mode far from it, so a direction that overlaps the common mode fires on benign text and under-fires on its targets. Centered Ablation (CA) projects the common mode out of the direction, in closed form. Across 8 models, CA raises attack success by 29 and 46 points where the standard recipe under-fires, cuts collapse on Gemma-2-9B from 50\\% to 1\\%, and preserves 12 to 40 points more benign answers on high-overlap models, 39 to 46 more than the affine offset of prior work. Two numbers computed before generation predict, on models the analysis had not seen, which gain faithfulness and which gain attack success, and a collapse index marks when text degenerates. We also show that two standard safety judges score collapsed text in opposite directions, which can fabricate a 46-point effect.', 'score': 2, 'issue_id': 3542, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': '0d7bbac56c20c422', 'authors': ['Quy-Anh Dang', 'Chris Ngo'], 'affiliations': ['Knovel Engineering Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.20148.jpg', 'data': {'categories': ['#alignment', '#interpretability', '#security'], 'emoji': '🧭', 'ru': {'title': 'Центрируй направление — и абляция перестанет сбоить', 'desc': 'Статья рассматривает directional ablation — метод отключения поведения LLM (например, отказов) путём удаления компоненты скрытого состояния вдоль «поведенческого направления». Авторы показывают, что на последнем слое эта операция эквивалентна logit bias, а её нестабильность связана с общей модой (common mode) скрытых состояний, из-за которой направление захватывает нерелевантный текст. Предложенный метод Centered Ablation (CA) в замкнутом виде проецирует общую моду из направления, что повышает успешность атак и снижает деградацию текста на 8 моделях. Также вводятся предварительные метрики и индекс коллапса, а показано, что две стандартные оценки безопасности по-разному оценивают вырожденный текст.'}, 'en': {'title': 'Center the direction; make ablation behave', 'desc': 'Directional ablation removes part of a language model’s hidden state to alter a behavior, but it can be unreliable and cause repetitive, collapsed text. The paper explains that at the final residual stream, this method acts like a logit bias whose strength depends on how much the hidden state aligns with the ablation direction. Because hidden states share a large common component, the alignment can be misleading; Centered Ablation (CA) removes that component from the direction in closed form. Across eight models, CA improves attack success and preserves more benign answers while greatly reducing text collapse, and the paper also shows that safety judges can score collapsed outputs inconsistently.'}, 'zh': {'title': '去除共同偏移，让方向消融更精准', 'desc': '方向消融会在语言模型生成时，移除隐藏状态沿某个“行为方向”的分量，常用于关闭拒绝等行为，但效果可能不稳定。论文指出，在最后一层残差流中，消融等价于给词表 logits 加上一个固定偏置，其强度由隐藏状态与行为方向的余弦相似度门控；由于隐藏状态带有远离原点的共同成分，原方法可能误伤无害文本，也可能无法有效作用于目标文本。作者提出中心化消融（CA），通过闭式投影从行为方向中去除共同成分；在8个模型上的实验显示，它能提升攻击成功率、减少生成崩溃，并在某些模型上更好地保留无害回答。论文还发现，生成前计算的两个指标可以预测不同模型的收益类型，且文本崩溃会让两种常用安全评估器给出相反判断，从而虚构出很大的效果差异。'}}}, {'id': 'https://huggingface.co/papers/2611.18668', 'title': 'UMM-JEPA: Generative Pretraining via Masked Next-Scale Representation Prediction for Unified Multimodal Models', 'url': 'https://huggingface.co/papers/2611.18668', 'abstract': 'Abstract Reformulating generation as progressive prediction of continuous perceptual representations improves visual understanding in unified multimodal models more than discrete-code or latent-flow objectives.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Unified multimodal models can support both visual understanding and generation, yet generative training does not necessarily improve understanding. We argue that this limitation may arise from a mismatch between the representation targeted by generation and the perceptual representation used for understanding. Conventional generation objectives primarily optimize synthesis-oriented spaces such as discrete visual codes or generative latents. We therefore introduce UMM-JEPA, which reformulates generation as progressive prediction of continuous visual-understanding representations. The model constructs a multi-scale representation hierarchy from coarse to fine, while pixel rendering is decoupled from representation pretraining and attached only afterward. Controlled comparisons show that the representation-prediction objective accounts for most of the understanding improvement, while a data-matched control leaves the group means nearly unchanged. UMM-JEPA reaches a 16-benchmark visual mean of 51.71, against 46.36 for the understanding-only Qwen-VL baseline, and the text mean also rises. Compared with discrete-code and latent-flow generation objectives, perceptual representation prediction yields stronger and more consistent transfer to understanding. Linear probes and visual-evidence interventions further reveal richer object and spatial structure and stronger use of image-specific information. These results suggest that generation can benefit understanding when it directly supervises the perceptual representations that understanding consumes.', 'score': 2, 'issue_id': 3542, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': '2d88adb508b3d1f5', 'authors': ['Yucheng Zhou', 'Yunjia Xi', 'Di Yin', 'Jianbing Shen'], 'affiliations': ['Tencent Youtu Lab', 'University of Macau'], 'pdf_title_img': 'assets/pdf/title_img/2611.18668.jpg', 'data': {'categories': ['#architecture', '#training', '#benchmark', '#interpretability', '#multimodal', '#optimization', '#cv'], 'emoji': '🧠', 'ru': {'title': 'Генерация, которая учит понимать: предсказываем то, что модель реально видит', 'desc': 'В статье предлагается UMM-JEPA — подход, в котором генерация изображений в унифицированных мультимодальных моделях (unified multimodal models) сводится к прогрессивному предсказанию непрерывных перцептивных представлений, используемых для понимания. Модель строит иерархию представлений от грубых к детальным, а рендеринг пикселей отделён от предобучения представлений и подключается лишь на последнем этапе. Контролируемые эксперименты показывают, что основной прирост качества понимания даёт именно цель предсказания представлений, а не просто объём данных, и средний результат на 16 бенчмарках вырос до 51.71 против 46.36 у базовой Qwen-VL. Линейные пробы и интервенции с визуальными свидетельствами подтверждают, что модель лучше учитывает структуру объектов и пространственные отношения.'}, 'en': {'title': 'Train generation to predict what understanding needs', 'desc': 'The paper introduces UMM-JEPA, a unified multimodal model that learns generation by progressively predicting continuous visual representations. Unlike methods that predict discrete visual codes or generative latents, it trains the model to predict perceptual representations used for visual understanding. Tests show that this objective improves visual understanding across 16 benchmarks, and also raises the text benchmark mean, compared with an understanding-only baseline. Probes and interventions indicate that the model learns richer object and spatial structure and uses image-specific evidence more effectively.'}, 'zh': {'title': '让生成直接学习理解所需的视觉表征', 'desc': '这篇论文提出 UMM-JEPA，将图像生成改为逐步预测连续的视觉理解表征，而不是预测离散视觉编码或生成潜变量。模型按由粗到细的多尺度层级学习这些表征，并把像素渲染与表征预训练分开。实验显示，这种表征预测目标带来的视觉理解提升明显优于其他生成目标，且数据匹配的对照实验几乎没有提升。线性探测和视觉证据干预也表明，模型学到了更丰富的物体与空间结构，并更能利用图像本身的信息。'}}}, {'id': 'https://huggingface.co/papers/2611.20192', 'title': 'GlyphAtlas: Disentangling Stroke Detail from Layout for Scene Text Synthesis', 'url': 'https://huggingface.co/papers/2611.20192', 'abstract': 'Abstract GlyphAtlas uses a dedicated glyph atlas and atlas-anchored attention to provide fine-grained stroke references for scene text synthesis, improving stroke accuracy and zero-shot transfer.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Scene text synthesis requires stroke-accurate characters rendered in a specified layout, as well as visual coherence with the surrounding scene. To achieve this, existing methods commonly pre-render the target text at its intended locations to form a glyph image that jointly specifies layout and glyph structure. However, this representation ties the resolution of each glyph to its target region, limiting fine-grained stroke guidance for small, densely packed, or structurally complex text. To tackle this, we propose GlyphAtlas, a scene text synthesis framework that retains the glyph image as a spatial anchor and supplies fine-grained stroke references through a dedicated glyph atlas. The atlas renders and encodes each character or word in a separate cell, decoupling reference resolution from target-region size. We further introduce atlas-anchored attention, which lets each text region retrieve stroke detail only from its corresponding atlas cells to refine the coarse glyph structure provided by the glyph image. This coarse-to-fine conditioning simplifies stroke rendering while preserving explicit layout correspondence. We optimize GlyphAtlas with a mask-weighted flow matching objective and a timestep-weighted text perceptual loss for writing accuracy and background consistency. Random resolution augmentation of atlas cells supports adjustable atlas budgets at inference. Extensive experiments demonstrate that GlyphAtlas achieves stroke-accurate synthesis of small, dense, and structurally complex text, zero-shot transfer to languages unseen during task-specific training, and leading performance in scenes with many text regions. project page: https://fr0zencrane.github.io/project-glyphatlas/', 'score': 2, 'issue_id': 3542, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': '8175d5e535fcdd58', 'authors': ['Luozheng Qin', 'Changhai Zhou', 'Yiyi Zhou'], 'affiliations': ['Fudan University', 'Xiamen University'], 'pdf_title_img': 'assets/pdf/title_img/2611.20192.jpg', 'data': {'categories': ['#architecture', '#training', '#multimodal', '#diffusion', '#cv', '#multilingual'], 'emoji': '🔤', 'ru': {'title': 'Точные штрихи в каждой букве: от грубого глифа к детальному атласу', 'desc': 'В статье представлен GlyphAtlas — фреймворк для синтеза текста в сцене (scene text synthesis), который сохраняет глиф-изображение как пространственный якорь и добавляет отдельный glyph atlas с мелкими деталями штрихов для каждого символа или слова. Механизм atlas-anchored attention позволяет каждой текстовой области извлекать детали только из соответствующих ячеек атласа, уточняя грубую структуру глифа по схеме coarse-to-fine. Модель обучается с помощью mask-weighted flow matching и timestep-weighted text perceptual loss, а случайная аугментация разрешения ячеек позволяет регулировать бюджет атласа на этапе инференса. Эксперименты показывают высокую точность штрихов для мелкого и плотного текста, zero-shot перенос на языки, не виденные при обучении, и лучшие результаты в сценах с большим количеством текстовых областей.'}, 'en': {'title': 'A dedicated glyph atlas brings fine strokes to every scene', 'desc': 'GlyphAtlas improves scene text synthesis by separating text layout from detailed stroke references. It keeps a glyph image as a spatial anchor and places each character or word in a high-resolution cell of a dedicated glyph atlas, so small text regions can still receive fine stroke detail. Atlas-anchored attention connects each text region to its matching atlas cells, refining the glyph image’s coarse structure while preserving layout. With flow matching, a text perceptual loss, and resolution augmentation, the method produces accurate text and transfers to languages unseen during task-specific training.'}, 'zh': {'title': '以字形图集精细引导笔画，让场景文字清晰准确', 'desc': 'GlyphAtlas 是一种用于场景文字合成的框架，目标是在指定布局和背景中生成笔画准确的文字。它保留文字图像作为空间锚点，并用独立字形图集提供高分辨率笔画参考，从而避免字形细节受目标区域大小限制。其图集锚定注意力让每个文字区域只从对应的图集单元检索细节，再以由粗到细的方式完善字形结构。实验表明，该方法能更好地生成小型、密集和结构复杂的文字，并可迁移到训练中未见过的语言。'}}}, {'id': 'https://huggingface.co/papers/2611.21605', 'title': 'ViRA: Toward Ultra-High-Resolution Visual Agents via Cross-Input Relative Policy Optimization', 'url': 'https://huggingface.co/papers/2611.21605', 'abstract': 'Abstract  Visual agents answer questions about ultra-high-resolution photos by zooming into the relevant regions. However, existing agents often answer from common sense instead of reading the evidence. Reinforcement learning (RL) on the final answer cannot correct this, because a guess earns the same reward as reading. We propose Cross-Input Relative Policy Optimization (CrossRPO), which trains agents on contrast sets. A contrast set asks one question about several versions of an image that differ only in a small region with the evidence and have different answers, so only reading the evidence solves the whole set. CrossRPO rewards solving the whole set, and we prove that it does not reinforce a set answered from common sense. We build contrast sets for training (ViRA-Train) and evaluation (ViRA-Bench) by editing one small object in images of 21 to 120 megapixels, and we photograph further sets with real changes (ViRA-Bench-Real) to exclude editing traces. We train two Visual Reasoning Agents, ViRA-9B and ViRA-27B, with CrossRPO on only about 3,500 items of ViRA-Train each. CrossRPO achieves 63.3% set accuracy on ViRA-Bench at the maximum resolution, against 59.3% for GRPO. ViRA-9B is the most accurate open model of its size on all benchmarks, and ViRA-27B outperforms Claude Haiku 5.5 and GPT-6-Luna, both at their highest thinking level, on most benchmarks.', 'score': 1, 'issue_id': 3543, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '98faaee3673fc54f', 'authors': ['Huawei Lin', 'Jinting Liu', 'Tongyan Wang', 'Xuyang Chen', 'Ruihua Shi', 'Zhichao Xu', 'Jiaxin Qin', 'Guoshenghui Zhao', 'Baijian Yang', 'Yingjie Victor Chen', 'Tan Yu', 'Weijie Zhao'], 'affiliations': ['NVIDIA', 'Purdue University', 'Rochester Institute of Technology', 'University of Utah'], 'pdf_title_img': 'assets/pdf/title_img/2611.21605.jpg', 'data': {'categories': ['#dataset', '#optimization', '#cv', '#training', '#rl', '#benchmark', '#long_context', '#reasoning', '#synthetic', '#agents', '#data'], 'emoji': '🔍', 'ru': {'title': 'Видеть доказательства, а не угадывать ответ', 'desc': 'Авторы предлагают метод CrossRPO для обучения визуальных агентов с помощью обучения с подкреплением, который заставляет модель читать доказательства на сверхвысокоразрешённых изображениях, а не отвечать по здравому смыслу. Агенты обучаются на контрастных наборах: один вопрос задаётся к нескольким версиям изображения, отличающимся только небольшой областью с ответом, и награда начисляется только за верное решение всего набора. Для обучения и оценки построены датасеты ViRA-Train, ViRA-Bench и ViRA-Bench-Real на изображениях до 120 мегапикселей. Модели ViRA-9B и ViRA-27B превосходят открытые аналоги и на большинстве тестов обходят крупные проприетарные LLM.'}, 'en': {'title': 'Make Every Zoom Count: Reward Evidence, Not Guesswork', 'desc': 'The paper introduces Cross-Input Relative Policy Optimization (CrossRPO), a reinforcement-learning method that encourages visual agents to inspect image evidence rather than guess from common sense. It trains agents on contrast sets: several images that differ only in a small region, where the same question has different answers for each image. The method rewards getting the entire set right, and the authors prove that this reward does not reinforce a strategy based on common-sense guessing. Models trained with CrossRPO outperform GRPO and achieve strong results on high-resolution image benchmarks, using about 3,500 training items per model.'}, 'zh': {'title': '让视觉智能体读证据，而不是凭常识猜答案', 'desc': '这篇论文提出 CrossRPO，一种用强化学习训练视觉智能体查看超高分辨率图像的方法。训练时，同一问题会配上几张只在关键小区域不同、答案也不同的图像，因此智能体必须读出图像证据，不能只靠常识猜测。CrossRPO 根据整组图像是否都答对来给奖励，论文证明这种奖励不会强化仅凭常识作答的策略。研究团队用约 3,500 个训练样本训练出 ViRA-9B 和 ViRA-27B；在最高分辨率评测中，CrossRPO 的整组准确率为 63.3%，高于 GRPO 的 59.3%。'}}}, {'id': 'https://huggingface.co/papers/2605.09614', 'title': 'Reflection Anchors for Propagation-Aware Visual Retention in Long-Chain Multimodal Reasoning', 'url': 'https://huggingface.co/papers/2605.09614', 'abstract': 'Abstract  Long chain-of-thought (CoT) reasoning improves large vision--language models, but visual information often fades during generation, limiting long-horizon multimodal reasoning. Existing methods either re-inject vision at inference or train policies for stronger grounding, but where to intervene relies on perception heuristics rather than principled gain analysis, and how local visual influence propagates remains implicit. We study this problem from an information-theoretic standpoint and derive a lower bound on the downstream visual gain of a one-step intervention, which suggests two factors: local branching room (token entropy) and downstream visual propagation potential (suffix divergence from a vision-marginalized reference). Guided by this analysis, we propose reflection-anchor policy optimization (RAPO), a GRPO-based policy optimization method that selects high-entropy reflection anchors and optimizes a chain-masked finite-window KL surrogate for downstream visual dependence. Experiments on reasoning-intensive and general-domain benchmarks show that RAPO delivers substantial gains over strong baselines across multiple LVLM backbones. Mechanism analyses further indicate that reflection anchors are enriched for visually sensitive decision points and that RAPO increases contrastive visual-dependence signals along generated trajectories.', 'score': 1, 'issue_id': 3542, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': '7d28c0c313979a8a', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#rl', '#interpretability', '#reasoning', '#multimodal', '#optimization'], 'emoji': '🧭', 'ru': {'title': 'Возвращаем взгляд модели к картинке в длинных рассуждениях', 'desc': 'Статья посвящена проблеме затухания визуальной информации в длинных цепочках рассуждений (chain-of-thought) больших vision-language моделей (LVLM). Авторы выводят с помощью теории информации нижнюю оценку визуального выигрыша от одношагового вмешательства, зависящую от энтропии токенов и дивергенции суффикса относительно визуально-маргинализированной ссылки. На основе этого анализа предлагается метод RAPO: GRPO-подобная оптимизация политики, которая выбирает высокоэнтропийные «reflection anchors» и использует маскированный суррогат KL на конечном окне. Эксперименты показывают заметный прирост качества над сильными baseline-моделями на разных LVLM-бэкбонах.'}, 'en': {'title': 'Keep Vision in the Reasoning Chain', 'desc': 'Long chain-of-thought reasoning can help large vision-language models, but visual details may fade as they generate long answers. This paper derives an information-theoretic lower bound showing that useful intervention points depend on token entropy and how strongly later text depends on visual input. It proposes reflection-anchor policy optimization (RAPO), a GRPO-based method that selects high-entropy points and trains the model to preserve visual influence over a finite window of later tokens. Experiments show that RAPO improves performance across benchmarks and increases visual dependence along generated reasoning trajectories.'}, 'zh': {'title': '抓住高熵反思锚点，让视觉信息贯穿长链推理', 'desc': '长链式思维推理能提升大型视觉语言模型的表现，但生成过程中的视觉信息容易逐渐减弱，影响多步多模态推理。本文从信息论角度分析何时重新引入视觉信息更有效，并指出关键因素包括局部 token 熵，以及后续文本对视觉信息的依赖程度。基于此，作者提出反思锚点策略优化（RAPO），一种基于 GRPO 的方法：选取高熵位置作为反思锚点，并通过链式掩码的有限窗口 KL 目标强化后续推理对视觉信息的依赖。实验显示，RAPO 在多种视觉语言模型和不同基准上优于强基线；分析也发现，它能找出对视觉信息敏感的决策点，并增强生成过程中的视觉依赖信号。'}}}, {'id': 'https://huggingface.co/papers/2611.21412', 'title': 'Flexible Multi-Stack Super-Resolution of Clinical Brain MRI Using Hetero-Orientation Variational Encoding: Expert Reader Evaluation in a Nigerian Cohort', 'url': 'https://huggingface.co/papers/2611.21412', 'abstract': 'Abstract MS-HVED enables flexible super-resolution of partially overlapping brain MRI stacks by fusing independently encoded multi-scale Gaussian posteriors with a field-of-view-aware Product-of-Gaussians and physics-informed domain randomisation, improving reconstruction, tissue segmentation, and external clinical generalisation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash High-resolution brain MRI is important for neuroradiological assessment, yet routine clinical protocols often rely on fast, anisotropic 2D acquisitions, particularly in resource-constrained settings. These acquisitions may differ in orientation, alignment and anatomical coverage, resulting in partially overlapping image stacks. Existing learning-based super-resolution methods typically rely on single, under-constrained inputs or fixed multi-stack configurations with idealised acquisition geometry. We introduce MS-HVED, a sequence-agnostic framework for flexible multi-stack brain MRI super-resolution. Available axial, coronal and sagittal stacks are independently encoded into multi-scale Gaussian posteriors and fused using a field-of-view-aware Product-of-Gaussians formulation that limits contributions from unsupported regions. Physics-informed domain randomisation simulates heterogeneous clinical acquisition conditions, including obliqueness, partial coverage and imaging artefacts. MS-HVED achieved competitive or superior reconstruction fidelity across synthetic benchmarks and improved downstream tissue segmentation relative to low-resolution inputs. To assess generalisation beyond the training cohorts, we performed external clinical validation on 30 routine brain MRI examinations from a Nigerian cohort, representing an under-represented population in medical imaging research. These examinations formed the largest component of a blinded reader study involving 44 real cases and seven expert neuroradiologists. In the Nigerian cohort, MS-HVED was preferred over the supervised baseline for overall image quality in 187 of 210 paired assessments. Across all clinical cohorts, MS-HVED achieved higher overall-quality scores with all available inputs (5.93 vs. 4.49, p<.001), with the preference persisting when axial or coronal inputs were omitted (p<.001). Code at github.com/cai4cai/ms-hved', 'score': 0, 'issue_id': 3543, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '235e1a687cd3c86c', 'authors': ['Kabir Hamzah Muhammad', 'Lorena Garcia-Foncillas Macias', 'Soumya Snigdha Kundu', 'Emily Guilhem', 'Jon Cleary', 'Amal Saleh Nour', 'Yodit Abraham Yaynishet', 'Chinasa Kalaiwo', 'Peter Chibuta', 'Ugumba Kwikima', 'Udunna Anazodo', 'Jonathan Shapey', 'Tom Vercauteren'], 'affiliations': ['African Medical Centre of Excellence, Abuja, Nigeria', "Children's Hospital of Philadelphia, Philadelphia, United States", 'Department of Neurosurgery, Kings College Hospital NHS Foundation Trust, London, United Kingdom', "Department of Radiology, Guy's and St. Thomas NHS Foundation Trust, London, United Kingdom", 'Kings College Hospital NHS Foundation Trust, London, United Kingdom', 'Medical Artificial Intelligence, Crestview Radiology Ltd., Lagos, Nigeria', 'Montreal Neurological Institute, McGill University, Montreal, Canada', 'Muhimbili Orthopedic Institute & Muhimbili University of Health and Allied Sciences, Dar Es Salaam, Tanzania', 'School of Biomedical Engineering & Imaging Sciences, Kings College London, London, United Kingdom', 'School of Medicine, College of Health Sciences, Addis Ababa University, Addis Ababa, Ethiopia', 'University Teaching Hospital, Lusaka, Zambia'], 'pdf_title_img': 'assets/pdf/title_img/2611.21412.jpg', 'data': {'categories': ['#healthcare', '#optimization', '#cv', '#benchmark', '#architecture', '#synthetic', '#data'], 'emoji': '🧠', 'ru': {'title': 'Собираем чёткую картину мозга из разрозненных МРТ-срезов', 'desc': 'Статья представляет MS-HVED — фреймворк для супер-разрешения МРТ головного мозга, который работает с несколькими частично перекрывающимися стеками срезов, полученными в разных ориентациях. Каждый стек кодируется независимо в мультимасштабные гауссовы апостериорные распределения, а затем объединяется через Product-of-Gaussians с учётом поля обзора, что подавляет вклад неподдерживаемых областей. Физически обоснованная доменная рандомизация имитирует гетерогенные клинические условия съёмки, включая наклонные срезы, неполное покрытие и артефакты. Модель показала преимущество в качестве реконструкции, сегментации тканей и обобщении на внешней клинической выборке из Нигерии, где врачи-нейрорадиологи предпочли её базовому методу в большинстве сравнений.'}, 'en': {'title': 'Fuse What You Have for Clearer Brain MRI', 'desc': 'MS-HVED is a flexible method for reconstructing high-resolution brain MRI from multiple low-resolution stacks, even when their orientations and anatomical coverage differ. It independently encodes each stack as multi-scale Gaussian posteriors, then combines them with a field-of-view-aware Product-of-Gaussians that reduces the influence of regions not covered by an input. Physics-informed domain randomisation exposes the model to realistic acquisition differences and imaging artefacts during training. The method improved image reconstruction and tissue segmentation, and expert readers preferred its image quality across clinical cohorts, including an external Nigerian cohort.'}, 'zh': {'title': '灵活融合多视角 MRI，让脑部超分辨率更贴近真实临床', 'desc': 'MS-HVED 是一种灵活的脑部 MRI 超分辨率方法，可融合方向、位置和覆盖范围各不相同的多组低分辨率图像。它分别将各组图像编码为多尺度高斯后验，再通过感知视野范围的高斯乘积进行融合，减少无图像支持区域对结果的影响。物理信息引导的域随机化用于模拟临床扫描中的倾斜、覆盖不全和成像伪影，从而提升模型对不同采集条件的适应能力。实验显示，该方法改善了图像重建和组织分割表现，并在外部临床验证中获得了更高的图像质量评价。'}}}, {'id': 'https://huggingface.co/papers/2611.18981', 'title': 'GPBam: A Retrieval-Aware German Public Law Exam Benchmark', 'url': 'https://huggingface.co/papers/2611.18981', 'abstract': "Abstract A new benchmark of German public-law exam cases and statutory provisions jointly scores legal retrieval and long-form opinion generation across many models, finding that retrieval yields limited gains and essay quality strongly tracks prior statutory knowledge.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Legal reasoning in civil-law systems is not rule-lookup: the German state examination asks for a structured opinion (Gutachten) that names the governing norms, applies them to the facts, and argues to a conclusion. We introduce GPBam (German Public Law Bar-style Exam), 81 public-law examination cases with reference solutions, paired with a recitation task over 200 statutory provisions. Drawn from state examination preparation, the cases are broad and rarely repeat, and are not publicly available - we find no evidence of exact-solution memorisation in the models we evaluate, and keeping them private limits contamination. Because each reference solution's cited norms form a retrieval gold set over the very instances the essays are graded on, GPBam scores retrieval and long-form generation jointly, which makes it a benchmark for legal retrieval as well as for legal writing and lets us ask how much retrieval quality a legal opinion actually needs. Across 32 open-weight and proprietary models evaluated without retrieval, scores span 4.81-76.42 out of 100. Supplying the law helps modestly: across seven models and eight retrieval configurations, retrieval performance varies nearly threefold and buys at most 4.1 essay points, and nothing significant for three of the seven, while an oracle with 91% gold-norm recall improves scores by 2-6 points. Essay quality strongly tracks prior knowledge: verbatim statute recall, measured in a separate task, correlates at ρ= 0.92 over 32 models.", 'score': 0, 'issue_id': 3543, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '5ae8b5fe3b8d2d72', 'authors': ['Abdullah Al Zubaer', 'Lorenz Wendlinger', 'Simon Alexander Nonn', 'Michael Granitzer', 'Jelena Mitrović'], 'affiliations': ['Technische Hochschule Deggendorf', 'Universität Passau'], 'pdf_title_img': 'assets/pdf/title_img/2611.18981.jpg', 'data': {'categories': ['#rag', '#benchmark', '#dataset', '#data'], 'emoji': '⚖️', 'ru': {'title': 'Знание закона важнее поиска: что на самом деле определяет качество юридического заключения ИИ', 'desc': 'Авторы представляют бенчмарк GPBam на основе 81 экзаменационного кейса немецкого публичного права с эталонными решениями и задачу воспроизведения 200 статей законов. Кейсы закрытые, поэтому модели почти не могут опираться на заученные решения. Оценка объединяет поиск норм (retrieval) и генерацию развернутого заключения, что делает бенчмарк одновременно тестом для LLM в правовой сфере. Результаты показывают, что подключение внешнего законодательного контекста даёт лишь умеренный прирост, тогда как качество эссе сильно коррелирует с предварительными знаниями моделей о законах (
