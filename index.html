ing with 3D Neural Fusion', 'desc': 'This paper addresses the challenge of improving low-light imaging by combining Near-Infrared (NIR) and noisy RGB images. It introduces a novel approach that utilizes 3D-aware neural modeling to enhance image quality without needing clean RGB supervision. The model effectively merges noisy RGB data with NIR information in a 3D context, allowing for the recovery of clearer RGB images. The results show that this method outperforms existing techniques across various noise conditions, making it more robust and versatile.'}, 'zh': {'title': '无监督低光照成像的新方法', 'desc': '本论文探讨了低光照成像的挑战，提出了一种新的方法来融合近红外（NIR）和噪声较大的RGB图像。通过引入3D感知神经建模，该方法无需干净的RGB监督，能够在3D空间中有效地将极其嘈杂的RGB观测与NIR线索融合，从而恢复干净的RGB图像。该模型不依赖于干净的RGB数据收集，能够在不同噪声水平下进行泛化。大量的合成和真实数据评估表明，该方法在性能上优于现有技术。'}}}, {'id': 'https://huggingface.co/papers/2607.28996', 'title': 'SULAND v2: A Refined RGB Dataset and Deep Learning Object Detection Benchmark for UAV/UGV-Based SUrface LANDmine Detection Under Domain Shift', 'url': 'https://huggingface.co/papers/2607.28996', 'abstract': 'Abstract  RGB imagery offers a practical, low-cost option for Unmanned Aerial/Ground Vehicle (UAV/UGV) survey support in surface-landmine detection, but object detectors remain underexplored in this safety-critical domain. Limited cross-architecture benchmarking and insufficient out-of-distribution (OOD) analysis obscure whether detectors generalize across deployment conditions. This challenge is amplified by the scarcity of public RGB landmine datasets, making SULAND a key benchmark for PFM-1 and PMA-2 detection. However, inspection reveals missing/false annotations, localization errors, inconsistent visibility criteria, visual artifacts, temporal labeling inconsistencies, and an inverted OOD class-ID convention in SULAND. We present SULAND_v2, a refined RGB surface-landmine dataset and benchmark. Preserving original images and splits, we manually revise annotations to ensure completeness, precise localization, label validity, and class consistency. SULAND_v2 contains 33,771 images and 12,433 bounding boxes. We benchmark 35 detector configurations across nine families. Annotation refinement improves YOLOv8 in-distribution (IID) test mAP@50 by 14.6-19.6 percentage points, while fixing the OOD class-ID convention increases mean YOLOv8 OOD mAP@50 by ~25 percentage points. On SULAND_v2, YOLOv12-Small achieves the highest IID mAP@50 (0.908), while RF-DETR-Large yields the strongest OOD performance (0.799 mAP@50, 0.675 recall). Our results demonstrate that high IID accuracy does not guarantee operational readiness. SULAND_v2 provides a reliable benchmark for evaluating domain-shift robustness in RGB-based mine-action survey support.', 'score': 2, 'issue_id': 2830, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'b91df6208db92f27', 'authors': ['Sagar Lekhak', 'Prasanna Reddy Pulakurthi', 'Lalit Joshi', 'Ramesh Bhatta', 'Emmett J. Ientilucci'], 'affiliations': ['Rochester Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.28996.jpg', 'data': {'categories': ['#benchmark', '#cv', '#dataset'], 'emoji': '💣', 'ru': {'title': 'Точная разметка и робастное тестирование детекторов мин на RGB-снимках', 'desc': 'В статье представлен улучшенный датасет SULAND_v2 для обнаружения противопехотных мин на RGB-изображениях с беспилотных летательных аппаратов. Авторы выявили и исправили множество ошибок в исходном датасете, включая неполные аннотации, ошибки локализации и проблемы с консистентностью разметки. Они провели комплексное бенчмаркирование 35 конфигураций детекторов из девяти семейств архитектур, оценивая как качество на распределении обучения (IID), так и устойчивость к распределению вне выборки (OOD). Исследование показало, что высокая точность на IID не гарантирует готовность к реальному развертыванию, подчеркивая важность тестирования на смещение домена для критичных по безопасности приложений.'}, 'en': {'title': 'Enhancing Landmine Detection with SULAND_v2: A Step Towards Reliable UAV/UGV Support', 'desc': 'This paper addresses the challenges of using RGB imagery for detecting landmines with unmanned vehicles, highlighting the limitations of existing object detectors in this critical area. It introduces SULAND_v2, a refined dataset that improves upon the original SULAND by correcting annotation errors and ensuring consistent labeling. The authors benchmark various detector configurations, revealing that improved annotations significantly enhance the performance of models like YOLOv8. The findings emphasize that high accuracy in controlled conditions does not necessarily translate to effective performance in real-world scenarios, underscoring the importance of robust evaluation methods for deployment.'}, 'zh': {'title': 'SULAND_v2：提升地雷检测的可靠基准', 'desc': '本论文介绍了SULAND_v2，一个改进的RGB地面雷达数据集和基准，用于无人机和地面车辆的地雷检测。研究发现，原有数据集存在标注错误和可视化不一致等问题，影响了检测器的性能。通过手动修正标注，SULAND_v2显著提高了YOLOv8在分布内和分布外的检测精度。该数据集为评估基于RGB的地雷行动调查支持的领域转移鲁棒性提供了可靠的基准。'}}}, {'id': 'https://huggingface.co/papers/2607.27851', 'title': 'Beyond Feeling Better: Capability-Sustaining Emotional Dialogue as a Longitudinal Research Paradigm', 'url': 'https://huggingface.co/papers/2607.27851', 'abstract': "Abstract  Emotional dialogue research includes two influential strategy traditions. Empathetic dialogue prioritizes understanding a speaker's emotional experience. Emotional support conversation selects and sequences support for the seeker's current needs. Sustained use introduces a further goal. Effective support should sustain users' capacities for emotion regulation, coping, self-endorsed decisions, and social connection across the interaction lifecycle. We propose capability-sustaining emotional dialogue (CSED) as a longitudinal research paradigm that aligns supportive strategy with this goal and organizes data, models, system design, evaluation, and governance around repeated use, non-use, transition, and termination. A targeted literature-and-corpus audit motivates this position. In a PRISMA-ScR-guided sample, 95% of 60 system-building papers pursue relief-oriented goals. None evaluates capability or longitudinal outcomes, and only 1 considers dependency, autonomy, or termination risk. In 300 ESConv supporter turns, capability-relevant functions appear in 43.0%, while generic suggestions account for 22.0%, compared with 4.0% reappraisal, 6.7% self-efficacy support, and 0.3% boundary behavior. We release a protocol for extending the audit to model behavior. An illustrative process model connects latent user capability to six design commitments, four evaluation timescales, and lifecycle constraints. The resulting agenda makes CSED testable across data, policy design, training, evaluation, and governance.", 'score': 2, 'issue_id': 2832, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'a7b6bdf989b3128f', 'authors': ['Ming Wang', 'Jiaqi Wu Young', 'Wenfang Wu', 'Daling Wang', 'Shi Feng'], 'affiliations': ['Amiya Research', 'Georg-August-Universität Göttingen', 'Northeastern University', 'Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2607.27851.jpg', 'data': {'categories': ['#training', '#benchmark', '#dataset'], 'emoji': '🌱', 'ru': {'title': 'От облегчения к укреплению: долгосрочная поддержка эмоционального благополучия в диалоговых системах', 'desc': 'Статья предлагает новую парадигму для исследования эмоциональных диалогов - CSED (capability-sustaining emotional dialogue), которая фокусируется на поддержании способностей пользователей к саморегуляции и автономии на протяжении всего взаимодействия. Авторы проводят систематический анализ существующих работ и обнаруживают, что 95% исследуемых систем ориентированы на немедленное облегчение эмоционального состояния, игнорируя долгосрочные эффекты и риски зависимости пользователя. Они анализируют корпус диалогов поддержки и показывают, что функции, относящиеся к укреплению способностей, встречаются редко, в то время как преобладают общие рекомендации. Исследование предлагает комплексный подход, включающий переработку данных, дизайн моделей, метрики оценки и управление на основе жизненного цикла взаимодействия.'}, 'en': {'title': 'Empowering Emotions: Sustaining Support in Dialogue', 'desc': "This paper introduces the concept of capability-sustaining emotional dialogue (CSED), which aims to enhance users' emotional regulation and social connections over time. It critiques existing emotional support systems for focusing primarily on immediate relief rather than long-term user capabilities. The authors conducted a literature review revealing that most studies do not assess the long-term effects of emotional support strategies. They propose a structured approach to evaluate and design systems that support users' emotional needs throughout their interaction lifecycle."}, 'zh': {'title': '能力维持情感对话：支持与成长的结合', 'desc': '情感对话研究包括两种重要的策略传统：同理心对话和情感支持对话。同理心对话重视理解说话者的情感体验，而情感支持对话则关注为寻求者的当前需求提供支持。我们提出了能力维持情感对话（CSED）作为一种长期研究范式，旨在将支持策略与用户情感调节和社会联系的能力维持目标相结合。通过对文献和语料库的审计，我们发现大多数系统构建的研究关注于缓解目标，而缺乏对能力或长期结果的评估。'}}}, {'id': 'https://huggingface.co/papers/2607.27888', 'title': 'Not All Tokens Deserve Equal Credit: Counterfactual Sensitivity Credit Reallocation for Long-CoT Reasoning', 'url': 'https://huggingface.co/papers/2607.27888', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) is central to improving long-CoT reasoning in large language models. Critic-free methods such as GRPO convert response-level rewards into advantages and uniformly broadcast them across tokens, overlooking their unequal contributions to the final outcome. On-policy self-distillation (OPSD) instead provides dense distributional supervision by minimizing the forward KL divergence between an unprivileged policy and a privileged self-teacher, implicitly assuming that the resulting likelihood shifts encode reliable answer-aligned information. We test this premise by fixing each sampled trajectory and re-scoring it under two opposing outcome conditions, one asserting correctness and the other incorrectness. Most affected tokens shift in the same direction under both conditions, with few sign reversals and substantial overlap in the induced optimization signals. Large shifts also concentrate on highly substitutable surface-form tokens, whereas tokens carrying problem-specific reasoning content are less sensitive. These findings show that privileged shifts fail to provide reliable answer-aligned directions, while their magnitudes primarily reflect counterfactual sensitivity rather than token-level learning value. Based on these observations, we propose Counterfactual Sensitivity Credit Reallocation (CSCR), a simple extension of GRPO that reduces credit for highly sensitive tokens and renormalizes token-level advantages to preserve both the original credit budget and verifier-determined direction. On long-CoT mathematical reasoning benchmarks, CSCR consistently outperforms GRPO baseline with the same number of policy updates. Targeted ablations further corroborate our diagnosis: privilege-induced directions are unreliable, moderate downweighting is most effective, and stronger modulation destabilizes optimization.', 'score': 2, 'issue_id': 2831, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '8d2d88dca8fba94f', 'authors': ['Qiangqiang He', 'Zhongheng Wu', 'ZiJian Wang'], 'affiliations': ['Institute of Wireless Communications Technology, Shanghai Jiao Tong University, Shanghai, China', 'State Key Laboratory for Novel Software Technology, Nanjing University, Nanjing, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27888.jpg', 'data': {'categories': ['#rlhf', '#alignment', '#math', '#reasoning', '#rl', '#training'], 'emoji': '🧮', 'ru': {'title': 'Пересчёт кредитов обучения через контрфактическую чувствительность для улучшения рассуждений', 'desc': 'В статье предлагается новый подход к обучению с подкреплением на основе верифицируемых вознаграждений для улучшения длинных цепочек рассуждений в большых языковых моделях. Авторы выявляют, что методы самодистилляции, такие как OPSD, неправильно распределяют кредиты обучения между токенами, так как их чувствительность к контрфактическим условиям не коррелирует с релевантностью для финального ответа. На основе этого анализа предлагается метод CSCR, который переаллоцирует кредиты обучения, снижая вес для высокочувствительных поверхностных токенов и сохраняя исходный бюджет вознаграждений. Экспериментально показано, что CSCR последовательно превосходит базовый метод GRPO на задачах математического рассуждения.'}, 'en': {'title': 'Revolutionizing Token Credit in Reinforcement Learning', 'desc': 'This paper introduces a new approach called Counterfactual Sensitivity Credit Reallocation (CSCR) to improve reinforcement learning in large language models, particularly for long-chain of thought (CoT) reasoning. The authors critique existing methods like GRPO for treating all tokens equally, which can lead to misleading optimization signals. By analyzing how tokens respond to different outcome conditions, they find that some tokens are more sensitive and less reliable for guiding learning. CSCR addresses these issues by adjusting the credit given to sensitive tokens, leading to better performance on reasoning tasks compared to traditional methods.'}, 'zh': {'title': '反事实敏感性提升长链推理', 'desc': '强化学习与可验证奖励（RLVR）在提升大型语言模型的长链推理能力中起着重要作用。现有的无评论方法如GRPO将响应级奖励转化为优势，并在所有标记中均匀传播，忽视了它们对最终结果的不同贡献。我们提出的在政策自蒸馏（OPSD）方法通过最小化未特权政策与特权自教师之间的前向KL散度，提供了密集的分布式监督。基于我们的研究结果，我们提出了反事实敏感性信用重新分配（CSCR），该方法在长链数学推理基准测试中表现优于GRPO基线。'}}}, {'id': 'https://huggingface.co/papers/2607.27951', 'title': 'Safeguards Based on Copyable Context Cannot Provide Reliable Safety for LLMs', 'url': 'https://huggingface.co/papers/2607.27951', 'abstract': 'Abstract  Large language model safeguards decide whether to answer before seeing how an answer will be used. This creates a basic problem for dual-use tasks: the same answer can help an authorized professional or an attacker, while an attacker can imitate a benign request and interaction history. We separate the capability released by the model from the evidence available about downstream use. When that evidence is copyable, we derive the exact worst-case floor on attacker assistance while preserving useful answers. The result yields a safety trilemma: Useful Capability, Reliable Safety, and Open Access cannot coexist. We then show how a trusted credential can complement existing safeguards by adding hard-to-copy information that predicts actual downstream use, and identify the stronger condition needed to eliminate the floor. Evidence from dual-use evaluations, adaptive attacks, and deployed trusted-access programs supports the practical relevance of these conditions.', 'score': 1, 'issue_id': 2829, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '093f0fd124e2ee50', 'authors': ['Pingyu Wu', 'Lingyao Zhu', 'Weiming Zhang', 'Nenghai Yu'], 'affiliations': ['Hefei AiDA Lab', 'University of Science and Technology of China', 'Zhejiang Wanli University'], 'pdf_title_img': 'assets/pdf/title_img/2607.27951.jpg', 'data': {'categories': [], 'emoji': '🔐', 'ru': {'title': 'Невозможная триада: утилита, безопасность и открытость в защите языковых моделей', 'desc': 'В этой работе исследуется фундаментальная проблема защиты больших языковых моделей при выполнении задач двойного назначения, когда один и тот же ответ может быть использован как легально, так и во вредоносных целях. Авторы разделяют возможности модели от информации о том, как будет использован ответ, и доказывают математически точный минимальный уровень помощи злоумышленнику при сохранении полезности системы. Они выявляют триллемму безопасности: полезность, надежная защита и открытый доступ не могут существовать одновременно. Предложено решение в виде доверенной идентификации пользователя, которая добавляет сложно подделываемую информацию для прогнозирования реального использования ответа.'}, 'en': {'title': 'Balancing Safety and Utility in Language Models', 'desc': 'This paper discusses the challenges of using large language models in situations where their answers can be misused. It highlights a safety trilemma where useful capabilities, reliable safety, and open access cannot all be achieved simultaneously. The authors propose a solution involving trusted credentials that provide hard-to-copy information to better predict how answers will be used. They support their findings with evidence from evaluations and real-world programs that address dual-use concerns.'}, 'zh': {'title': '安全三难：能力、安全与开放的冲突', 'desc': '这篇论文讨论了大型语言模型在回答问题前如何决定是否回答，这在双重用途任务中引发了问题。相同的答案可能对授权专业人士有帮助，但也可能被攻击者利用。作者提出了一种方法，将模型的能力与下游使用的证据分开，从而在保持有用答案的同时，推导出攻击者协助的最坏情况底线。最后，论文提出了一个安全三难困境，表明有用能力、可靠安全和开放访问无法共存，并建议使用可信凭证来增强现有的安全措施。'}}}, {'id': 'https://huggingface.co/papers/2607.15820', 'title': "In the Driver's Seat: A Multi-Company Study on the Reality of Autonomous Driving System Testing", 'url': 'https://huggingface.co/papers/2607.15820', 'abstract': 'Abstract  Autonomous driving systems (ADS) are rapidly advancing and increasingly deployed in real-world applications. This creates growing demands for effective testing to ensure system functionality and safety. However, ADS testing remains complex and lacks well-established standards for scenario selection, performance evaluation, and acceptance criteria. To better understand current ADS testing practices and challenges, we conducted an interview study with experts working on ADS development and testing in nine companies from six different countries. Through thematic analysis, we synthesized industrial testing practices, challenges, potential solutions, future trends, and proposed an evidence-centered closed-loop testing framework for ADS testing. Our findings show that current practices primarily focus on scenario-based and X-in-the-loop testing approaches, supported by diverse tools, metrics, benchmarks, and testing strategies. The participants highlighted major challenges related to scenario realism, scenario coverage, simulation fidelity, and acceptance criteria, while also discussing potential solutions such as the use of AI, world models, and end-to-end approaches. Furthermore, participants envisioned future ADS testing to become more automated, data-driven, and transparent across the industry. Overall, this study provides a comprehensive industry-grounded overview of ADS testing, proposes an evidence-centered closed-loop testing framework to provide actionable guidance for ADS testing, and outlines important directions for future research and practice.', 'score': 1, 'issue_id': 2830, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': 'ca0b14a17c0a7534', 'authors': ['Qunying Song', 'Yuan Gao', 'Johannes Betz', 'Dietmar Pfahl', 'Mohammad Reza Mousavi', 'Federica Sarro'], 'affiliations': ['Kings College London', 'Technical University of Munich', 'University College London', 'University of Tartu'], 'pdf_title_img': 'assets/pdf/title_img/2607.15820.jpg', 'data': {'categories': [], 'emoji': '🚗', 'ru': {'title': 'Стандартизация и автоматизация тестирования автономных транспортных систем', 'desc': 'В работе проведено исследование практик тестирования автономных систем вождения через интервью с экспертами из девяти компаний. Авторы выявили, что индустрия преимущественно использует сценарное тестирование и X-in-the-loop подходы с различными метриками и бенчмарками для оценки. Основные проблемы включают реалистичность сценариев, полноту их покрытия, точность симуляции и отсутствие стандартизированных критериев приемки систем. Исследователи предложили замкнутую циклическую схему тестирования на основе доказательств, которая поможет ориентировать будущие направления разработки и тестирования автономных систем.'}, 'en': {'title': 'Enhancing Safety in Autonomous Driving: A New Testing Framework', 'desc': 'This paper discusses the challenges and practices in testing autonomous driving systems (ADS), which are becoming more common in real-world applications. The authors conducted interviews with experts from various companies to gather insights on current testing methods, focusing on scenario-based and X-in-the-loop approaches. They identified key challenges such as ensuring scenario realism and coverage, and proposed an evidence-centered closed-loop testing framework to improve testing effectiveness. The study emphasizes the need for more automated and data-driven testing solutions in the future.'}, 'zh': {'title': '推动自动驾驶测试的标准化与智能化', 'desc': '自动驾驶系统（ADS）正在快速发展并逐渐应用于现实世界中，这对有效的测试提出了更高的要求，以确保系统的功能和安全性。然而，ADS的测试仍然复杂，缺乏成熟的标准来选择场景、评估性能和设定接受标准。通过对来自六个国家九家公司的ADS开发和测试专家进行访谈，我们总结了当前的测试实践、面临的挑战和潜在解决方案，并提出了一个以证据为中心的闭环测试框架。研究发现，当前的测试主要集中在基于场景和X-in-the-loop的测试方法上，并强调了场景真实性、覆盖率、仿真保真度和接受标准等主要挑战。'}}}, {'id': 'https://huggingface.co/papers/2607.28478', 'title': 'Would You Walk to the Car Wash? Revealing the Salience Bias of Large Language Models in Commonsense Reasoning', 'url': 'https://huggingface.co/papers/2607.28478', 'abstract': 'Abstract  As large language models (LLMs) continue to advance in complex reasoning tasks, they have learned to heavily prioritize explicit conditions provided in the input. However, in everyday commonsense reasoning, this mechanism exposes a critical vulnerability which we term Salience Bias: models become easily hijacked by useless explicit distractors (e.g., numerical values), leading them to ignore the implicit physical or commonsense prerequisites of a task. A critical open question is whether this failure reflects a genuine gap in commonsense knowledge or merely its suppression under misleading task framing. To investigate this, we construct the SaliTrap Benchmark, a high-quality dataset across four trap dimensions. Evaluating 12 state-of-the-art LLMs, we find that all mainstream models suffer significantly from salience bias, with severity scaling with distractor density and detecting the trap often decoupled from actually avoiding it. Crucially, by re-eliciting the same models with the task framing stripped away, we show that this is overwhelmingly a failure of knowledge suppression rather than knowledge absence: a context-free knowledge probe alone recovers over 90\\% of sycophantic-compliance failures, revealing that the requisite commonsense is intrinsically present but actively crowded out by salient distractors that lure the model into over-compliant, unnecessary computation. Building on this diagnosis, we further show that lightweight, inference-time prompting alone substantially closes the gap without any retraining. Our findings relocate the bottleneck of commonsense reasoning failures from model competence to elicitation, and we release SaliTrap as a testbed for this blind spot. The codes are available at https://github.com/Wuzheng02/SaliTrap.', 'score': 0, 'issue_id': 2830, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '6158cf6a073d8d77', 'authors': ['Zheng Wu', 'Chenhao Xue', 'Shijie Zheng', 'Yijie Lu', 'Cheng Yang', 'Zhuosheng Zhang'], 'affiliations': ['ByteDance Inc', 'School of Computer Science, Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28478.jpg', 'data': {'categories': ['#interpretability', '#open_source', '#benchmark', '#reasoning', '#dataset'], 'emoji': '🪤', 'ru': {'title': 'Когда модель знает, но молчит: как отвлекающие факторы подавляют здравый смысл LLM', 'desc': 'В работе исследуется уязвимость больших языковых моделей, названная Salience Bias, когда модели игнорируют неявные знания здравого смысла, отвлекаясь на явные, но бесполезные признаки в входных данных. Авторы создали бенчмарк SaliTrap для оценки этого явления и обнаружили, что все современные LLM страдают от этой проблемы в различной степени. Ключевой находкой является то, что это не дефицит знаний, а их подавление: модели обладают необходимыми знаниями здравого смысла, но активно их игнорируют из-за отвлекающих факторов. Авторы показали, что простые техники переформулирования задачи во время инференции значительно улучшают производительность без переобучения модели.'}, 'en': {'title': 'Unmasking Salience Bias in Language Models', 'desc': 'This paper discusses a problem called Salience Bias in large language models (LLMs), where these models focus too much on explicit information in their inputs, like numbers, and ignore important commonsense knowledge. The authors created a new dataset called the SaliTrap Benchmark to test this bias across different scenarios. They found that all tested LLMs struggle with this issue, often failing to avoid distractions even when they have the necessary knowledge. By adjusting how tasks are presented to the models, they demonstrated that the knowledge is there, but the way tasks are framed can suppress it, suggesting that improving task presentation can enhance model performance without needing retraining.'}, 'zh': {'title': '揭示显著性偏差：常识推理的新挑战', 'desc': '随着大型语言模型（LLMs）在复杂推理任务中的进步，它们开始过度依赖输入中的显性条件。这种机制导致了一个关键的脆弱性，称为显著性偏差：模型容易受到无用的显性干扰因素（如数字值）的影响，从而忽视任务的隐性物理或常识前提。通过构建SaliTrap基准数据集，我们发现主流模型在显著性偏差上普遍存在显著问题，且这种偏差与干扰因素的密度成正比。我们的研究表明，这主要是知识抑制的失败，而非知识的缺失，提供了一个新的视角来理解常识推理的瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2607.25388', 'title': 'SGTP: Sampling-based Game-Theoretic Planning for Real-Time Multi-Vehicle Autonomous Racing', 'url': 'https://huggingface.co/papers/2607.25388', 'abstract': 'Abstract  Autonomous multi-vehicle racing requires real-time planning of diverse competitive behaviors in intense interactions. Existing planners often struggle to balance strategic diversity and computational efficiency. To address this challenge, we propose Sampling-based Game-Theoretic Planning (SGTP), a real-time framework that combines game-theoretic reasoning with GPU-accelerated sampling of control sequences and dynamics rollouts. Sampled trajectories are ranked using a game-aware cost to capture competitive interactions and generate diverse racing behaviors. Our planner then performs feasibility selection by explicitly enforcing track-boundary and dynamic collision-avoidance constraints, ensuring safe and reliable transitions between racing strategies. Extensive simulations on challenging tracks show that SGTP achieves a 95.24% win rate and a 99.35% task-completion ratio in highly interactive races, with a mean computational time of 0.095 s over multiple iterative solving steps. We also demonstrate the successful application of SGTP in large-scale scenarios with up to 10 agents. We release our code and provide an open-source benchmark of multi-agent autonomous racing algorithms to facilitate future research. Project page: https://sgtp-racing.github.io/.', 'score': 0, 'issue_id': 2830, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'f3729abb79ae6080', 'authors': ['Zhouheng Li', 'Fangguo Zhao', 'Mattia Piccinini', 'Baha Zarrouki', 'Yuan Gao', 'Zitong Shan', 'Johannes Betz', 'Chen Lv', 'Lei Xie'], 'affiliations': ['Baha Zarrouki', 'Chen Lv', 'Fangguo Zhao', 'Johannes Betz', 'Lei Xie', 'Mattia Piccinini', 'Yuan Gao', 'Zhouheng Li', 'Zitong Shan'], 'pdf_title_img': 'assets/pdf/title_img/2607.25388.jpg', 'data': {'categories': ['#games', '#agents', '#open_source', '#optimization', '#benchmark', '#robotics', '#reasoning'], 'emoji': '🏎️', 'ru': {'title': 'Теоретико-игровое планирование для многоагентных автономных гонок', 'desc': 'В статье предлагается Sampling-based Game-Theoretic Planning (SGTP) — фреймворк для планирования траекторий автономных гоночных автомобилей в режиме реального времени. Метод комбинирует теоретико-игровой подход с GPU-ускоренной генерацией и развёртыванием последовательностей управления для моделирования динамики. Сгенерированные траектории ранжируются с помощью специальной cost-функции, учитывающей конкурентные взаимодействия между агентами и обеспечивающей разнообразие поведения. Алгоритм гарантирует безопасность через явное соблюдение ограничений трека и динамического избежания столкновений, демонстрируя высокую производительность на сложных сценариях с множественными агентами.'}, 'en': {'title': 'Revolutionizing Autonomous Racing with Game-Theoretic Planning', 'desc': "This paper introduces Sampling-based Game-Theoretic Planning (SGTP), a new framework for real-time decision-making in autonomous multi-vehicle racing. SGTP combines game-theoretic principles with GPU-accelerated sampling to efficiently generate and evaluate diverse racing strategies. The planner ranks sampled trajectories based on a game-aware cost function, ensuring that competitive interactions are effectively captured. The results demonstrate SGTP's high performance in terms of win rate and task completion, while maintaining safety through collision-avoidance constraints."}, 'zh': {'title': '实时博弈论规划，提升赛车策略的多样性与安全性', 'desc': '这篇论文提出了一种名为基于采样的博弈论规划（SGTP）的实时框架，旨在解决自主多车赛车中的复杂行为规划问题。SGTP结合了博弈论推理和GPU加速的控制序列采样，以实现高效的竞争行为生成。通过使用博弈感知成本对采样轨迹进行排名，SGTP能够捕捉竞争互动并生成多样化的赛车行为。此外，该规划器通过强制执行赛道边界和动态避碰约束，确保赛车策略之间的安全可靠过渡。'}}}];

        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (5)', '#agi', '#alignment (4)', '#architecture (4)', '#audio', '#benchmark (9)', '#cv (3)', '#data', '#dataset (7)', '#diffusion (1)', '#ethics (1)', '#games (2)', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability (1)', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math (2)', '#multilingual', '#multimodal (8)', '#open_source (5)', '#optimization (4)', '#plp (2)', '#rag (1)', '#reasoning (7)', '#rl (7)', '#rlhf (3)', '#robotics (6)', '#science (1)', '#security (1)', '#small_models (1)', '#story_generation', '#survey', '#synthetic', '#training (11)', '#transfer_learning', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-03 19:21',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-03 19:21')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-03 19:21')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
