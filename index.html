    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.27205', 'title': 'TurboVLA: Real-Time Vision-Language-Action Model at 32 Hz on an RTX 4090 with <1 GB VRAM', 'url': 'https://huggingface.co/papers/2607.27205', 'abstract': 'Abstract  Vision-language-action (VLA) models commonly adopt an LLM-centric V to L to A pathway, where visual observations are projected into the representation space of a large language model before being decoded into robot actions. Although effective, this design incurs substantial computation and memory overhead at every policy invocation. In this work, we introduce TurboVLA, a new VLA paradigm that reformulates the conventional V to L to A pathway as a direct V + L to A mapping. Instead of using a large language model as the central interface between perception and action, TurboVLA independently encodes visual observations and language instructions, directly exchanges information between them through lightweight bidirectional vision-language interaction, and predicts continuous action chunks with a compact decoder. This simple design constructs task-conditioned representations directly from visual and linguistic features, significantly reducing the computational and memory costs of VLA inference. On LIBERO, TurboVLA achieves 97.7% average success with only 0.2B parameters, 31.2 ms inference latency, and 0.9 GB inference VRAM on a consumer-grade RTX 4090, matching or outperforming substantially larger VLA policies. These results establish TurboVLA as a simple and effective alternative to the prevailing LLM-centric VLA paradigm, offering a new perspective on how vision, language, and action can be connected for efficient robotic manipulation. Code is available at https://github.com/H-EmbodVis/TurboVLA.', 'score': 118, 'issue_id': 2798, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '0fcc2c05a80e7d95', 'authors': ['Hengyi Xie', 'Chenfei Yao', 'Xianjin Wu', 'Xuanyang Xi', 'Yiping Tang', 'Di Xu', 'Yingying Zhu', 'Dingkang Liang', 'Xiang Bai', 'Han Ding'], 'affiliations': ['Huawei Technologies Co. Ltd', 'Huazhong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.27205.jpg', 'data': {'categories': ['#multimodal', '#small_models', '#inference', '#robotics', '#architecture'], 'emoji': '⚡', 'ru': {'title': 'Прямое отображение зрения и языка в действия без промежуточной языковой модели', 'desc': 'В статье предложена новая архитектура VLA моделей под названием TurboVLA, которая отходит от традиционного подхода, где визуальные данные проходят через большую языковую модель перед преобразованием в действия робота. Вместо этого модель независимо кодирует визуальные наблюдения и текстовые инструкции, обмениваясь информацией между ними через легковесный механизм взаимодействия зрения и языка. TurboVLA предсказывает последовательности действий компактным декодером, значительно снижая вычислительные затраты и требования к памяти при инференсе. На тестовом наборе LIBERO модель достигла 97.7% успеха с использованием всего 0.2B параметров и время инференса 31.2 мс на потребительском GPU.'}, 'en': {'title': 'TurboVLA: Efficient Vision-Language-Action Mapping Without Heavy LLMs', 'desc': 'TurboVLA introduces a new approach to vision-language-action (VLA) models by eliminating the reliance on large language models (LLMs) for processing visual and linguistic inputs. Instead of following the traditional pathway of converting visual data to language and then to actions, TurboVLA directly maps visual and language inputs to actions through a lightweight interaction mechanism. This method significantly reduces computational and memory requirements while maintaining high performance in robotic tasks. The results demonstrate that TurboVLA can achieve impressive success rates with fewer parameters and lower latency compared to larger, conventional VLA models.'}, 'zh': {'title': 'TurboVLA：高效的视觉-语言-动作模型', 'desc': '本文介绍了一种新的视觉-语言-动作（VLA）模型，称为TurboVLA。与传统的以大型语言模型为中心的路径不同，TurboVLA直接将视觉和语言信息映射到动作上。它通过轻量级的双向视觉-语言交互独立编码视觉观察和语言指令，从而显著降低了计算和内存开销。实验结果表明，TurboVLA在LIBERO数据集上表现优异，成功率达到97.7%，且参数量和推理延迟均远低于现有的VLA模型。'}}}, {'id': 'https://huggingface.co/papers/2607.25659', 'title': 'CoRT: Counterfactual Replay for Token-Level Rubric-Guided Policy Optimization', 'url': 'https://huggingface.co/papers/2607.25659', 'abstract': 'Abstract  Rubric-based reinforcement learning enriches language model training by evaluating model outputs against explicit criteria. Yet in GRPO-style pipelines, these structured judgments are reduced to a scalar response-level reward and converted into a response-level advantage, which is broadcast uniformly to all generated tokens. This leaves no explicit mechanism for allocating credit within a response, even when different criteria are grounded in different spans, formatting decisions, or semantic choices. We propose CoRT, a token-level credit weighting method for rubric-conditioned GRPO. Instead of training an auxiliary token scoring model, CoRT uses counterfactual replay to rescore the same sampled response under the original rubric-conditioned prompt and a matched criteria-free prompt. The resulting tokenwise log-likelihood contrasts serve as a proxy for dependence on the rubric context. CoRT maps these contrasts to bounded, response-normalized weights and uses them to redistribute the signed GRPO advantage across tokens, without introducing an auxiliary scorer or changing the response-level reward. Experiments across instruction-tuned models and reward granularities show that CoRT improves over matched response-level GRPO in the vast majority of comparisons, with an average gain of 4.4 percentage points. The method remains competitive with learned token-level credit baselines while avoiding a separate relevance-learning stage. These results suggest that policy-internal counterfactual likelihood contrasts provide an effective training signal for within-response credit allocation while retaining the simplicity and stability of GRPO.', 'score': 73, 'issue_id': 2798, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'ea4ce8a79746d748', 'authors': ['Bo-Wen Zhang', 'Junwei He', 'Wen Wang', 'Song-Lin Lv', 'Wentao Ma', 'Rongyi Lin', 'Shuhan Zhong', 'Lan-Zhe Guo'], 'affiliations': ['ByteDance', 'School of Intelligence Science and Technology, Nanjing University', 'State Key Laboratory of Novel Software Technology, Nanjing University', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2607.25659.jpg', 'data': {'categories': ['#rlhf', '#training', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Внутренние контрфактические контрасты для справедливого распределения кредита в токен-ориентированном обучении', 'desc': 'В статье предложен метод CoRT для более точного распределения награды между отдельными токенами при обучении языковых моделей с использованием рубрик-ориентированного обучения с подкреплением (GRPO). Вместо обучения дополнительной модели для оценки токенов, CoRT использует контрфактический повтор — пересчитывает вероятность одного ответа под исходным и альтернативным промптом, чтобы определить зависимость каждого токена от критериев оценки. Полученные контрасты логарифмических вероятностей преобразуются в нормализованные веса, которые перераспределяют преимущество (advantage) GRPO по токенам без введения вспомогательной модели. Экспериментальные результаты показывают, что CoRT улучшает качество обучения на 4.4 процентных пункта по сравнению с базовым GRPO, оставаясь при этом простым и стабильным методом.'}, 'en': {'title': 'Enhancing Token Credit Allocation in Language Models with CoRT', 'desc': 'This paper introduces CoRT, a method that enhances rubric-based reinforcement learning for language models by providing token-level credit weighting. Traditional approaches reduce structured evaluations to a single reward, which fails to recognize the varying contributions of different tokens in a response. CoRT addresses this by using counterfactual replay to assess how tokens perform under different prompts, allowing for a more nuanced allocation of credit based on their relevance to the rubric. The results demonstrate that CoRT significantly improves performance over standard methods, offering a more effective way to train language models without the need for additional scoring systems.'}, 'zh': {'title': '提升模型输出的信用分配效率', 'desc': '这篇论文提出了一种名为CoRT的令牌级信用加权方法，用于基于评分标准的强化学习。传统的GRPO管道将模型输出的评估简化为标量奖励，导致在响应内部无法明确分配信用。CoRT通过反事实重放技术，在原始评分标准提示和无标准提示下重新评分相同的响应，从而为每个令牌分配权重。实验结果表明，CoRT在大多数比较中优于传统的响应级GRPO，且在保持简单性和稳定性的同时，提供了有效的内部信用分配信号。'}}}, {'id': 'https://huggingface.co/papers/2607.27180', 'title': 'HumanCLAW: Can Vision-Language Models Act Through a Body?', 'url': 'https://huggingface.co/papers/2607.27180', 'abstract': "Abstract  Evaluating whether a vision-language model (VLM) can act through a physical body is challenging. The outcome of an action couples the VLM's decision with motor control. When a task fails, it is hard to tell whether the VLM made a bad choice or the motor controller simply failed to execute it, e.g., losing balance and falling. In this work, we introduce HumanCLAW, an evaluation framework that decouples action decision-making from low-level execution. At every step, a harnessed, off-the-shelf VLM issues an atomic skill command, and the command is translated into a sub-second chunk of continuous full-body motion with real physical consequences, including gravity and collisions. The body can therefore act freely in the physical world, while execution-side disturbances, balance and motor errors, are factored out. What remains measurable is the model's action intelligence: its moment-to-moment choice of what the body should execute next. Based on this framework, we build HumanCLAW-Bench: 1,218 long-horizon, egocentric find-navigate-interact episodes across 41 indoor scenes. We test nine state-of-the-art VLMs and find that none solves the benchmark; the best model reaches only a 16.8% success rate. Recognizing the target is not the bottleneck. What current VLMs lack is embodied self-awareness: they lose track of their own body, failing to tell where it is, whether it has reached the goal, or whether it has hit an obstacle.", 'score': 65, 'issue_id': 2798, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': 'd53672bb4c67fbd3', 'authors': ['Siyao Li', 'Jiawei Gu', 'Shuai Liu', 'Kairui Hu', 'Zekun Li', 'Linjie Li', 'Chengcheng Tang', 'Po-Chen Wu', 'Ivan Shugurov', 'Lingni Ma', 'Michael Zollhoefer', 'Sizhe An', 'Abhay Mittal', 'Amy Zhao', 'Ranjay Krishna', 'Manling Li', 'Ziwei Liu', 'Chuan Guo'], 'affiliations': ['Brown University', 'Meta', 'Nanyang Technological University', 'Northwestern University', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2607.27180.jpg', 'data': {'categories': ['#benchmark', '#robotics', '#cv', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Тело без сознания: почему VLM не способны к воплощённому интеллекту', 'desc': 'В работе представлена оценочная платформа HumanCLAW, которая разделяет принятие решений о действиях от их низкоуровневого выполнения в физическом мире. Vision-language модель выдаёт команды элементарных навыков, которые транслируются в непрерывные движения тела с учётом физики, гравитации и столкновений. На основе этой платформы создан бенчмарк HumanCLAW-Bench с 1218 длительными эпизодами в 41 помещении, где лучшие VLM достигают успеха только в 16,8% случаев. Главное ограничение современных моделей — недостаток телесного самосознания: они теряют ориентацию в собственном теле и не могут отслеживать его положение в пространстве.'}, 'en': {'title': 'Decoupling Decision-Making from Execution in Vision-Language Models', 'desc': 'This paper presents HumanCLAW, a framework designed to evaluate vision-language models (VLMs) in physical tasks by separating decision-making from motor execution. It allows VLMs to issue commands that translate into real-time body movements while accounting for physical disturbances like gravity and collisions. The study reveals that current VLMs struggle with embodied self-awareness, which is crucial for understanding their own position and interactions in the environment. The authors created HumanCLAW-Bench, a benchmark with 1,218 episodes, to test VLMs, finding that none achieved satisfactory performance, highlighting the need for improved embodied intelligence in these models.'}, 'zh': {'title': '评估视觉-语言模型的具身自我意识', 'desc': '本研究提出了HumanCLAW，一个评估框架，用于测试视觉-语言模型（VLM）在物理环境中的行动能力。该框架将决策过程与低级执行分离，使得模型可以在真实世界中自由行动，同时排除执行过程中的干扰和错误。通过HumanCLAW-Bench，我们创建了1218个长时间的自我中心寻找-导航-交互的任务，测试了九个最先进的VLM模型，结果显示没有一个模型能够成功完成任务。当前VLM的主要问题在于缺乏具身自我意识，无法准确判断自身位置和目标状态。'}}}, {'id': 'https://huggingface.co/papers/2607.25675', 'title': 'DecoEvo: Score-Decoupled Co-Evolution of Solver and Rubric-Generator Skills in Text Space', 'url': 'https://huggingface.co/papers/2607.25675', 'abstract': "Abstract  Text-space optimization adapts large language models (LLMs) by editing external natural-language artifacts rather than model weights, so the optimized artifacts remain inspectable and the model can be treated as a black box. However, most existing text-space methods keep evaluation fixed. On open-ended tasks, this can become a bottleneck: once the solver improves on the criteria a rubric measures, omitted dimensions remain invisible to the optimization signal. Simply evolving the rubric is also unreliable when updates are selected by the current solver's score, because apparent progress can come from making the rubric easier to satisfy. We introduce DecoEvo (Decoupled Co-Evolution), which co-evolves a solver skill and a rubric-generator skill under decoupled objectives without using gold rubrics during optimization. The solver skill is updated using criterion-level feedback, while the rubric-generator skill is revised through complementary audits of requirement coverage and response discrimination that are independent of aggregate solver score. This separation focuses generator updates on newly exposed solver weaknesses, reducing repeated emphasis on criteria the solver already satisfies. Under each benchmark's official evaluation, DecoEvo outperforms all compared methods across five benchmarks and three LLM backbones, yielding 2.8--5.0\\% relative gains over SkillOpt in the five-benchmark average.", 'score': 54, 'issue_id': 2798, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'f034ff7faf105541', 'authors': ['Jiangwang Chen', 'Zixin Song', 'Junlin Liu', 'Shuaiyu Zhou', 'Haiyan Wu', 'Haihan Shi', 'Chenxi Zhou', 'Hanqing Li', 'Xiao Yang', 'Da Zhu', 'Guanjun Jiang', 'Hai Wan', 'Xibin Zhao'], 'affiliations': ['Peking University', 'Qwen Business Unit of Alibaba', 'Tsinghua University', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2607.25675.jpg', 'data': {'categories': ['#training', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Совместная эволюция решателя и оценивателя для адаптации моделей', 'desc': 'Статья представляет DecoEvo, метод оптимизации больших языковых моделей путем одновременной эволюции решающего агента и генератора критериев оценки с независимыми целевыми функциями. В отличие от существующих подходов, которые фиксируют метрики оценки, DecoEvo разделяет процесс обновления: агент совершенствуется на основе обратной связи по отдельным критериям, а генератор критериев изменяется через специальные аудиты полноты требований и дискриминативности ответов. Такое разделение объективов предотвращает переоптимизацию на уже решенных задачах и выявляет новые слабости модели. Метод демонстрирует улучшение на 2.8-5.0% относительно базовых подходов на пяти бенчмарках при использовании различных LLM.'}, 'en': {'title': 'DecoEvo: Evolving Skills and Rubrics for Better Language Model Optimization', 'desc': "This paper presents DecoEvo, a novel approach to optimize large language models (LLMs) by co-evolving a solver skill and a rubric-generator skill. Unlike traditional methods that rely on fixed evaluation criteria, DecoEvo allows for dynamic updates to the rubric based on the solver's performance, ensuring that optimization focuses on newly identified weaknesses. The rubric-generator uses independent audits to assess requirement coverage and response discrimination, which helps avoid the pitfalls of merely making the rubric easier. The results show that DecoEvo significantly outperforms existing methods, achieving notable improvements across multiple benchmarks."}, 'zh': {'title': '解耦共进化：优化语言模型的新方法', 'desc': '本文介绍了一种名为DecoEvo（解耦共进化）的方法，用于优化大型语言模型（LLMs）。与传统方法不同，DecoEvo通过独立的目标同时进化求解器技能和评分标准生成器技能，而不依赖于固定的评分标准。该方法通过对求解器的反馈和评分标准的独立审计，专注于求解器的新弱点，从而提高了优化的有效性。实验结果表明，DecoEvo在多个基准测试中优于其他方法，显示出显著的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2607.25294', 'title': 'CLBench-V: Evaluating Multimodal Context Learning from Grounding to Knowledge Acquisition', 'url': 'https://huggingface.co/papers/2607.25294', 'abstract': 'Abstract  Real-world tasks often require models to learn from task-specific context rather than relying only on pre-trained knowledge. While recent work has highlighted this capability as context learning, existing evaluations mainly focus on textual contexts. In many practical settings, however, the context to be learned from is multimodal: scientific findings are conveyed through figures and tables, financial indicators are scattered across converted reports, and spatial decisions depend on maps, scenes, or web pages. We introduce CLBench-V, a benchmark for multimodal context learning that addresses the difficulty of localizing where context use breaks down by organizing tasks around three dimensions: context grounding, new information application, and new knowledge learning. CLBench-V combines converted public benchmarks with newly constructed datasets spanning domains such as science, finance, long-document understanding, spatial reasoning, and web-based visual question answering. To reduce the cost of constructing domain-specific context-learning tasks, we further use automated construction and filtering procedures for our newly built datasets. Across 3,443 instances and six recent multimodal models, the best overall score is only 0.2847, indicating that multimodal context learning remains far from saturated. Moreover, InternVL3.5-30B-A3B performs best on context grounding and new knowledge learning, while Qwen3.5-Plus performs best on new information application. We further analyze judge reliability, context length, image count, and representative failure cases. Code is available at https://github.com/IamLihua/CLBench-V.', 'score': 40, 'issue_id': 2798, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '5d81028f3c452c3a', 'authors': ['Lai Wei', 'Chengqi Li', 'Jiapeng Li', 'Ruina Hu', 'Yue Wang', 'Weiran Huang'], 'affiliations': ['School of Computer Science, Shanghai Jiao Tong University', 'Shanghai Innovation Institute', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2607.25294.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#dataset'], 'emoji': '📚', 'ru': {'title': 'Мультимодальное обучение на контексте: новый рубеж для больших моделей', 'desc': 'В статье представлена CLBench-V — бенчмарк для оценки способности мультимодальных моделей обучаться на контекстной информации в виде текста, изображений и таблиц. Авторы организовали задачи по трём измерениям: привязка контекста к содержанию, применение новой информации и обучение новым знаниям, охватив области науки, финансов и веб-анализа. Тестирование показало, что даже лучшие модели достигают только 28,47% точности, демонстрируя незрелость этого направления в machine learning. Исследование включает анализ надёжности оценок, влияния длины контекста и выявление типичных ошибок моделей при работе с мультимодальными данными.'}, 'en': {'title': 'Unlocking Multimodal Context Learning with CLBench-V', 'desc': 'This paper presents CLBench-V, a benchmark designed to evaluate multimodal context learning, which is essential for tasks that involve various types of data like text, images, and tables. Unlike previous evaluations that focused mainly on text, CLBench-V addresses the need for models to learn from diverse contexts in real-world applications, such as science and finance. The benchmark organizes tasks into three key areas: grounding context, applying new information, and learning new knowledge, and includes a mix of existing and newly created datasets. The results show that current multimodal models still struggle with context learning, highlighting the need for further advancements in this area.'}, 'zh': {'title': '多模态上下文学习的新基准', 'desc': '这篇论文介绍了CLBench-V，这是一个用于多模态上下文学习的基准测试。它强调了在实际任务中，模型需要从多种类型的上下文中学习，而不仅仅依赖于预训练知识。研究中使用了自动化构建和过滤程序，以减少构建特定领域上下文学习任务的成本。实验结果显示，当前的多模态上下文学习仍有很大的提升空间，最佳得分仅为0.2847。'}}}, {'id': 'https://huggingface.co/papers/2607.25308', 'title': 'CAST: Game Solvers as Turn-Level Teachers for LLM Agents', 'url': 'https://huggingface.co/papers/2607.25308', 'abstract': "Abstract  Training large language models (LLMs) to act in long-horizon games is a promising step toward generalist decision-making, yet reinforcement learning with verifiable rewards (RLVR) relies on sparse final rewards that reveal little about which decisions determine success. Denser process signals could supply this missing turn-level credit, but existing sources are hard to keep both cheap and accurate. We observe that changes in a game solver's state value reveal whether an action advances the state toward success. Building on this insight, we propose CAST (Credit Assignment from Solver Teachers), which converts these value changes into solver advantages and injects them into RLVR as turn-level signals. We further show that, under a soft-optimal solver assumption, maximizing the solver advantage is equivalent to on-policy distillation from the solver, requiring only scalar values rather than teacher logits. Across Sokoban, Minesweeper, and Rush Hour, CAST outperforms all trained baselines on every game under both in-domain and unseen-difficulty evaluation and achieves the highest average zero-shot performance on ALFWorld and WebShop. Our code is available at https://github.com/Wloner0809/CAST.", 'score': 28, 'issue_id': 2798, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'd25ed1861cb6effa', 'authors': ['Yu Wang', 'Yi-Kai Zhang', 'Wentao Shi', 'Ziang Ye', 'Yuchun Miao', 'Yueqing Sun', 'Qi Gu', 'Xunliang Cai', 'Lan-Zhe Guo', 'Han-Jia Ye', 'Fuli Feng'], 'affiliations': ['Meituan, China', 'Nanjing University', 'University of Science and Technology of China', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.25308.jpg', 'data': {'categories': [], 'emoji': '🎮', 'ru': {'title': 'Кредит от учителя-решателя: плотный сигнал для обучения агентов в долгих играх', 'desc': 'В этой работе предлагается метод CAST для улучшения обучения больших языковых моделей в задачах с длинными горизонтами принятия решений. Авторы используют сигналы от решателя игр для создания более плотного сигнала кредита на каждом шаге вместо редких финальных наград. Основная идея состоит в том, что изменения в оценке стоимости состояния решателя указывают на то, продвигает ли действие состояние к успеху. Метод достигает лучших результатов на нескольких играх, включая Sokoban и Minesweeper, а также показывает хорошую обобщаемость на невидимые сложности и задачи реального мира.'}, 'en': {'title': 'Enhancing Reinforcement Learning with Turn-Level Credit Assignment', 'desc': "This paper introduces CAST (Credit Assignment from Solver Teachers), a method that enhances reinforcement learning with verifiable rewards (RLVR) by providing denser feedback signals. It leverages changes in a game solver's state value to determine which actions contribute to success, thus offering turn-level credit assignment. The authors demonstrate that maximizing solver advantages can be achieved through on-policy distillation, simplifying the process to use scalar values instead of complex teacher logits. The results show that CAST significantly outperforms existing methods in various games, indicating its effectiveness in improving decision-making in long-horizon tasks."}, 'zh': {'title': '提升游戏决策的信用分配方法', 'desc': '本文提出了一种名为CAST（来自求解教师的信用分配）的新方法，用于改善长时间游戏中的强化学习。传统的强化学习依赖于稀疏的最终奖励，难以有效评估每个决策的影响。CAST通过观察游戏求解器状态值的变化，将这些变化转化为回合级别的信号，从而提供更密集的过程反馈。实验结果表明，CAST在多个游戏中表现优于现有的基线方法，尤其在未见难度的评估中取得了最佳的零-shot性能。'}}}, {'id': 'https://huggingface.co/papers/2607.26784', 'title': 'SkillRise: Agentic Reinforcement Learning for Cross-Task Skill Evolution', 'url': 'https://huggingface.co/papers/2607.26784', 'abstract': 'Abstract  Large language model agents often encounter related yet distinct tasks that share reusable solution patterns. Yet standard agentic reinforcement learning treats tasks as independent episodes, while existing approaches to skill learning either focus on repeated attempts of one task or use pipelines with multiple stages that entangle extraction, retrieval, and execution. We introduce SkillRise, a unified reinforcement learning framework for learning skills across tasks. SkillRise organizes related instances into progressively challenging sequences and uses a single policy to alternate between task solving and curating an evolving skill document passed directly to the next task. Decoupled credit assignment across tasks supervises solving with the current task outcome and curation with discounted downstream outcomes. Experiments on ALFWorld, WebShop, and ScienceWorld show that SkillRise achieves the strongest Pass@1 performance among the compared methods, with gains over the strongest baseline ranging from 2.3 to 8.5 percentage points. Although trained across distinct tasks, its learned curation policy remains effective for repeated attempts on the same task. Further analysis reveals scaling at test time across tasks: performance improves with longer sequences of related tasks even when each task is attempted only once. This trend suggests that SkillRise reuses transferable skills across tasks rather than benefiting from repeated sampling of the same task. SkillRise further retains strong performance while substantially reducing the runtime overhead of skill learning pipelines with multiple stages. Together, these results provide a simple and efficient training paradigm for LLM agents to extract, refine, and reuse transferable skills across tasks.', 'score': 18, 'issue_id': 2798, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': 'dd474669a67efa94', 'authors': ['Zhiyuan Yao', 'Yuxin Chen', 'Zhengxi Lu', 'Zishan Xu', 'Yueqing Sun', 'Yifu Guo', 'Yuquan Lu', 'Zhengzhou Cai', 'Kangning Zhang', 'Zhuowen Han', 'Zi-Han Wang', 'Ziang Ye', 'Qi Gu', 'Xunliang Cai', 'Weiwen Liu', 'Yongliang Shen'], 'affiliations': ['Meituan', 'National University of Singapore', 'Shanghai Jiao Tong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26784.jpg', 'data': {'categories': ['#training', '#rl', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Обучение переиспользуемым навыкам агентов через прогрессивные последовательности задач', 'desc': 'В статье представлена SkillRise — единая система обучения с подкреплением для agenta на основе больших языковых моделей, которая извлекает и переиспользует навыки решения задач. Фреймворк организует связанные задачи в последовательности возрастающей сложности и использует одну политику для чередования решения текущей задачи и курирования развивающегося документа навыков. Кредитование обучения разделено между задачами: успех в текущей задаче контролирует решение, а дисконтированные результаты будущих задач контролируют курирование. Эксперименты показывают, что система достигает лучших результатов на бенчмарках ALFWorld, WebShop и ScienceWorld, и демонстрирует масштабируемость при последовательном выполнении связанных задач.'}, 'en': {'title': 'SkillRise: Efficient Skill Learning Across Related Tasks', 'desc': 'The paper introduces SkillRise, a novel reinforcement learning framework designed for large language model agents to learn skills across related tasks. Unlike traditional methods that treat tasks as separate episodes, SkillRise organizes tasks into sequences that progressively increase in difficulty, allowing for skill reuse. It employs a single policy that alternates between solving tasks and curating a skill document for future tasks, enhancing efficiency. Experimental results demonstrate that SkillRise outperforms existing methods in performance while reducing the complexity of skill learning processes.'}, 'zh': {'title': 'SkillRise：跨任务学习的统一强化学习框架', 'desc': '本论文介绍了一种名为SkillRise的统一强化学习框架，用于跨任务学习技能。SkillRise将相关任务组织成逐步挑战的序列，并使用单一策略在解决任务和整理技能文档之间交替进行。通过解耦的信用分配，SkillRise能够有效地监督当前任务的解决和后续任务的技能整理。实验结果表明，SkillRise在多个任务上表现优异，能够有效提取和重用可转移的技能。'}}}, {'id': 'https://huggingface.co/papers/2607.27146', 'title': 'MindForge: Teaching Small Language Models Whole-Life-Cycle Software Engineering via Source-Free Program Synthesis', 'url': 'https://huggingface.co/papers/2607.27146', 'abstract': 'Abstract  Coding agents have made substantial progress on software engineering tasks that modify existing codebases, including bug fixing and feature implementation. However, constructing a complete program from scratch remains a major challenge: even the frontier models evaluated on ProgramBench fully resolve fewer than 1% of tasks. One obstacle is the lack of scalable training environments for this from-scratch setting, spanning the whole software engineering life cycle, as existing environment-construction frameworks focus only on a single phase in software development. To address this gap, we introduce MindForge, an automated pipeline that converts open-source command-line programs into source-free environments that expose only a compiled reference executable and its documentation. Using MindForge, we construct training environments from repositories disjoint from those in ProgramBench, and curate a high-quality data recipe consisting of program synthesis trajectories using GLM-5.2 as the teacher agent. Fine-tuning Qwen3.6-27B on these trajectories increases its ProgramBench average test pass rate from 37.98% to 49.51%, achieving performance comparable to substantially larger frontier models. Moreover, the fine-tuned model consistently improves over the base model across all seven unseen software engineering benchmarks, spanning long-horizon repository generation and translation, bug fixing, feature implementation, and cross-language issue resolution, with absolute gains of 31.00 points on RepoZero-C2Rust, 14.16 on DeepSWE, 10.70/4.56 on NL2Repo-Bench (with/without tests), 5.04 on SWE-bench Verified, 5.93 on SWE-bench Pro, 5.22 on SWE-bench Multilingual, and 4.94 on FeatBench.', 'score': 17, 'issue_id': 2803, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '657074069bebefd0', 'authors': ['Yihao Chen', 'Shi Chang', 'Khaled Chawa', 'Feng Lin', 'Boyuan Chen', 'Shaowei Wang', 'Ahmed E. Hassan'], 'affiliations': ['Huawei Canada', 'Queens University', 'University of Manitoba'], 'pdf_title_img': 'assets/pdf/title_img/2607.27146.jpg', 'data': {'categories': ['#agents', '#plp', '#benchmark', '#dataset', '#training'], 'emoji': '🛠️', 'ru': {'title': 'Обучение агентов писать код с нуля через синтез программ в масштабируемых окружениях', 'desc': 'Статья представляет MindForge — автоматизированный конвейер для создания тренировочных окружений из открытых исходных кодов, которые обучают агентов писать программы с нуля. Авторы используют GLM-5.2 в качестве учителя для генерации высокачественных траекторий синтеза программ, а затем дообучают модель Qwen3.6-27B на этих данных. Дообученная модель значительно улучшает производительность на бенчмарке ProgramBench с 37.98% до 49.51%, достигая результатов, сопоставимых с намного большими моделями. Модель также показывает устойчивое улучшение на семи различных бенчмарках инженерии ПО, включая генерацию репозиториев, исправление ошибок и кросс-языковое разрешение проблем.'}, 'en': {'title': 'MindForge: Bridging the Gap in Program Synthesis Training', 'desc': 'This paper presents MindForge, a novel automated pipeline designed to create scalable training environments for machine learning models focused on software engineering tasks. Unlike existing frameworks that only address specific phases of software development, MindForge generates source-free environments from open-source command-line programs, providing a compiled executable and its documentation. The authors demonstrate that fine-tuning the Qwen3.6-27B model on program synthesis trajectories generated by GLM-5.2 significantly improves its performance on various software engineering benchmarks. The results show that the fine-tuned model achieves comparable performance to larger models, with notable gains across multiple unseen tasks, including bug fixing and feature implementation.'}, 'zh': {'title': 'MindForge：从零开始构建程序的解决方案', 'desc': '本文介绍了一种名为MindForge的自动化管道，旨在解决从零开始构建完整程序的挑战。现有的环境构建框架仅关注软件开发的单一阶段，而MindForge能够将开源命令行程序转换为无源环境，提供编译后的可执行文件和文档。通过使用MindForge，我们构建了与ProgramBench不相关的训练环境，并利用GLM-5.2作为教师代理，创建了高质量的数据配方。对Qwen3.6-27B进行微调后，其在ProgramBench上的平均测试通过率从37.98%提高到49.51%，在多个软件工程基准测试中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2607.27167', 'title': 'SpecFirst: Behavioral Specification Elicitation as a First-Class Step in Agent-Based Program Synthesis from Scratch', 'url': 'https://huggingface.co/papers/2607.27167', 'abstract': 'Abstract  LLM-based agents excel at software engineering tasks where an existing codebase provides context, but constructing a program from scratch remains fundamentally harder. Recent benchmarks such as ProgramBench quantify this gap: given only natural-language documentation and an execute-only binary as a behavioral oracle, even frontier models solve fewer than 1% of instances. Existing frameworks conflate documentation reading, behavioral exploration, and code synthesis into a single pass, causing agents to probe insufficiently, lose behavioral intent as context drifts, and propagate early misinterpretations into the final implementation. Inspired by classical requirements engineering, we argue that behavioral specification elicitation should be a first-class phase that precedes implementation. We present SpecFirst, a two-stage framework that forces the specification elicitation before code synthesis. A dedicated spec agent first probes the binary and combines observations with documentation into a structured specification. Next, a code synthesis agent then uses this specification to drive implementation. This decomposition resolves documentation ambiguities before coding begins and provides a stable behavioral reference throughout synthesis. We evaluate SpecFirst on all 200 ProgramBench instances across four models spanning two families and an order of magnitude of capability. SpecFirst consistently outperforms the single-loop baseline, improving test pass rates by 6.9%-21.3% and binary exploration coverage by 9.4%-18.5%, all statistically significant. Behavioral analysis on code synthesis further shows that a prior specification enables earlier and more sustained code construction. Our results demonstrate that an explicit requirements-engineering phase is an effective paradigm for from-scratch program construction.', 'score': 14, 'issue_id': 2804, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '998c20d69e2bd04f', 'authors': ['Yihao Chen', 'Shi Chang', 'Feng Lin', 'Khaled Chawa', 'Boyuan Chen', 'Shaowei Wang', 'Ahmed E. Hassan'], 'affiliations': ['Concordia University', 'Huawei Canada', 'Queens University', 'University of Manitoba'], 'pdf_title_img': 'assets/pdf/title_img/2607.27167.jpg', 'data': {'categories': ['#benchmark', '#training', '#plp', '#agents'], 'emoji': '📋', 'ru': {'title': 'Спецификация прежде всего: двухэтапный синтез программ через выявление требований', 'desc': 'В статье рассматривается проблема создания программ с нуля с помощью LLM-агентов, которые плохо справляются с этой задачей без готовой кодовой базы. Авторы предлагают SpecFirst — двухэтапный фреймворк, вдохновлённый классической инженерией требований, который отделяет фазу выявления поведенческой спецификации от фазы синтеза кода. На первом этапе специальный агент исследует бинарный файл и создаёт структурированную спецификацию, а на втором этапе агент синтеза кода использует эту спецификацию для реализации. Экспериментальная оценка на 200 примерах показывает, что такое разделение улучшает показатели прохождения тестов на 6.9%-21.3% и повышает покрытие исследования бинарного файла на 9.4%-18.5%.'}, 'en': {'title': 'SpecFirst: Enhancing Code Synthesis with Structured Requirements', 'desc': 'This paper discusses the challenges faced by large language model (LLM) agents when creating software from scratch, particularly when only given natural-language documentation and a binary. It highlights that existing methods often mix documentation reading, behavioral exploration, and code synthesis, leading to poor performance. The authors propose a new framework called SpecFirst, which separates the specification elicitation phase from code synthesis, allowing for clearer requirements before coding begins. Their experiments show that SpecFirst significantly improves the success rate of program construction and enhances the exploration of the binary, demonstrating the importance of a structured requirements phase in software development.'}, 'zh': {'title': '明确需求工程，提升程序构建效率', 'desc': '本论文探讨了基于大型语言模型（LLM）的代理在软件工程任务中的表现，尤其是在从零开始构建程序时的挑战。研究表明，现有的框架将文档阅读、行为探索和代码合成混为一谈，导致代理在实现过程中出现误解和上下文漂移。为了解决这个问题，作者提出了一种名为SpecFirst的两阶段框架，强调在代码合成之前进行行为规范的提取。通过在200个ProgramBench实例上的评估，SpecFirst显著提高了测试通过率和二进制探索覆盖率，证明了明确的需求工程阶段在从零开始构建程序中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2607.27191', 'title': 'Can AI agents conduct open-ended AI research? Early evidence from two case studies', 'url': 'https://huggingface.co/papers/2607.27191', 'abstract': "Abstract  Forecasts of explosive AI progress hinge on AI agents automating AI research. But evidence on whether agents can carry out open-ended AI research is thin. Current evaluations either test agents on narrow, verifiable tasks, which excludes open-ended research, or submit AI-generated papers to blind peer review, which is overstretched, stochastic, and suffers from poor review quality. We introduce a third way to measure progress towards AI R\\&D automation. An agent takes on the central, open-ended research question of a high-quality unpublished paper, and the paper's original authors grade its output. We call these shadow evaluations. We ran shadow evaluations on two unpublished NeurIPS 2026 submissions, giving frontier agents six days and thousands of dollars of compute. The agents completed all of the engineering without human help, yet could not make substantial progress towards answering the research questions. As a result, both papers were unambiguously rejected by the authors. We identify five recurring failure modes: poor judgment about the bar for publishable research, uncreative responses to shortcomings in the research design, ineffective backtracking from dead ends, poor resource awareness, and instruction drift. A robustness check with a second model and scaffold reproduced these failures. We release the expert reviews, survey responses, agent repositories, and logs. Our results provide early evidence that today's agents can do the engineering of AI research, but struggle with critical parts of the research lifecycle.", 'score': 12, 'issue_id': 2798, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '1b7ac6a207e606da', 'authors': ['Peter Kirgis', 'Sayash Kapoor', 'Andrew Schwartz', 'Stephan Rabanser', 'David Africa', 'Konstantinos Voudouris', 'Viet Nguyen', 'Toby Pilditch', 'Magda Dubois', 'Harry Coppock', 'Cozmin Ududec', 'Nitya Nadgir', 'Matilda Orona', 'Tilman Bayer', 'Derrick Chan-Sew', 'Yue Ling', 'Abhishek Shetty', 'Helen Toner', 'Gillian Hadfield', 'Seth Lazar', 'Steve Newman', 'Shoshannah Tekofsky', 'Rishi Bommasani', 'Arvind Narayanan'], 'affiliations': ['AI Digest', 'Cornflower Labs', 'Georgetown University', 'Golden Gate Institute for AI', 'Independent', 'Johns Hopkins University', 'Princeton University', 'Stanford University', 'UC Berkeley', 'UK AI Security Institute', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2607.27191.jpg', 'data': {'categories': ['#benchmark', '#science', '#agents', '#agi'], 'emoji': '🤖', 'ru': {'title': 'AI-агенты могут выполнять инженерные работы исследований, но не способны решать критические исследовательские задачи', 'desc': 'В работе предлагается новый метод оценки способности AI-агентов автоматизировать исследования в области машинного обучения. Авторы разработали так называемые "теневые оценки", где агенты решают открытые исследовательские вопросы из неопубликованных статей, а оригинальные авторы оценивают результаты. Было проведено тестирование на двух статьях из NeurIPS 2026, где агентам дали шесть дней и тысячи долларов вычислительных ресурсов, но они не смогли добиться существенного прогресса. Исследование выявило пять основных типов ошибок: неправильная оценка качества исследования, творческая неспособность решать проблемы в дизайне, плохая навигация при возврате из тупиков, недостаточная осведомленность о ресурсах и дрейф инструкций.'}, 'en': {'title': 'AI Agents: Engineering Success, Research Failure', 'desc': "This paper investigates the ability of AI agents to automate the research and development (R&D) process in artificial intelligence. The authors introduce a novel evaluation method called shadow evaluations, where AI agents attempt to address open-ended research questions from unpublished papers, with the original authors grading their outputs. Despite successfully handling engineering tasks, the agents failed to make significant progress on the research questions, leading to rejections from the authors. The study identifies key failure modes in the agents' performance, highlighting their limitations in judgment, creativity, and resource management during the research lifecycle."}, 'zh': {'title': 'AI代理在研究中的挑战与机遇', 'desc': '本研究探讨了人工智能（AI）代理在自动化AI研究中的能力。我们引入了一种新的评估方法，称为影子评估，通过让AI代理处理高质量未发表论文的开放性研究问题，并由原作者评分。尽管代理在工程方面表现出色，但在回答研究问题上未能取得实质性进展，导致论文被拒绝。我们识别出五种常见的失败模式，表明当前的AI代理在研究生命周期的关键部分仍然面临挑战。'}}}, {'id': 'https://huggingface.co/papers/2607.26754', 'title': 'StatePlay: State-Aware Game World Models for Mechanics-Consistent Generation', 'url': 'https://huggingface.co/papers/2607.26754', 'abstract': 'Abstract  Recent game world models can generate visually realistic and interactive environments conditioned on player actions. However, games are not defined by pixels alone; they are governed by explicit mechanics, namely state-dependent rules that control health reduction, skill activation, and game termination. These mechanics depend on precise internal states, such as health points, skill meters, and timers, which are tightly coupled with visual observations and determine how gameplay evolves. Without modeling these state dynamics, existing game world models may generate visually plausible rollouts but violate the underlying game rules. In this paper, we propose StatePlay, a novel state-aware game world model that jointly predicts visual content and game states to promote mechanics-consistent generation. StatePlay adopts a mixture-of-transformers (MoT)-style architecture that preserves specialized visual and state representations while enabling cross-modal interaction, allowing predicted states to guide frame generation. Each branch is further optimized with a distinct objective suited to its modality. Experiments show that StatePlay achieves an average normalized L1 distance below 0.06 for state prediction. Furthermore, compared with models without explicit state modeling, our method improves mechanics fidelity in generated game rollouts by 18.6%. Overall, our work highlights the importance of state-aware game world modeling and advances beyond pixel-level realism toward complete and mechanically faithful game generation.', 'score': 12, 'issue_id': 2800, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '34fda3094676d155', 'authors': ['Zijun Lin', 'Zeqing Wang', 'Cheston Tan', 'Bihan Wen', 'Yeying Jin'], 'affiliations': ['Centre for Frontier AI Research, A*STAR', 'Nanyang Technological University', 'National University of Singapore', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2607.26754.jpg', 'data': {'categories': ['#video', '#architecture', '#games', '#multimodal'], 'emoji': '🎮', 'ru': {'title': 'Игровые модели с явным моделированием внутреннего состояния для механически верной генерации', 'desc': 'В работе предлагается StatePlay — модель для генерации игровых миров, которая предсказывает не только визуальное содержание, но и внутреннее состояние игры (здоровье, энергия, таймеры и другие параметры). Авторы используют архитектуру mixture-of-transformers, где специализированные ветки обрабатывают визуальную информацию и состояния отдельно, но при этом взаимодействуют между собой. Это позволяет предсказанному состоянию направлять генерацию видеокадров, обеспечивая соответствие игровым правилам и механикам. Экспериментальные результаты показывают, что предложенный метод улучшает верность игровых механик на 18.6% по сравнению с моделями без явного моделирования состояния.'}, 'en': {'title': 'StatePlay: Bridging Visuals and Game Mechanics for Realistic Game Worlds', 'desc': "This paper introduces StatePlay, a new model for generating game environments that not only looks realistic but also follows the rules of the game. It emphasizes the importance of internal game states, like health points and timers, which are crucial for maintaining gameplay mechanics. StatePlay uses a mixture-of-transformers architecture to effectively combine visual and state information, ensuring that the generated content adheres to the game's rules. The results show that StatePlay significantly improves the accuracy of state predictions and the fidelity of game mechanics in generated scenarios compared to previous models."}, 'zh': {'title': '状态感知，游戏生成的新纪元', 'desc': '最近的游戏世界模型能够根据玩家的动作生成视觉上逼真且互动的环境。然而，游戏不仅仅由像素构成，还受到明确的机制控制，这些机制包括健康值减少、技能激活和游戏结束等状态依赖规则。这些机制依赖于精确的内部状态，如健康点、技能计量器和计时器，这些状态与视觉观察紧密相连，并决定游戏玩法的演变。我们提出了StatePlay，这是一种新颖的状态感知游戏世界模型，它联合预测视觉内容和游戏状态，以促进与机制一致的生成。'}}}, {'id': 'https://huggingface.co/papers/2607.27155', 'title': 'OmegaUse-OfficeVal: Benchmarking LLM Agents on Long-Horizon Office-Suite Tasks with Economic Grounding', 'url': 'https://huggingface.co/papers/2607.27155', 'abstract': 'Abstract  Large language model (LLM) agents are increasingly expected to assist users in completing tasks. However, existing benchmarks provide limited support for evaluating whether agents can carry out office-suite workflows at a reasonable cost. We introduce OmegaUse-OfficeVal, a benchmark for evaluating LLM agents on long-horizon office-suite tasks with task-level economic grounding. The benchmark comprises 100 tasks derived from office-suite requests proposed by practitioners and adapted through a privacy-preserving process. On average, these tasks require 2.32 hours of human labor to complete. An important feature of the benchmark is that each task is paired with two economic signals: human labor time and task price proxy. These signals enable direct comparisons between human costs and LLM inference costs, as well as value-weighted evaluation. To support stable evaluation, we develop code-based verifiers from fine-grained rubrics. We evaluate several frontier LLMs together with a human baseline. Although all evaluated LLMs are substantially cheaper and faster than human workers, they have not yet approached human-level deliverable quality. The code and dataset are fully open-sourced, and more information is available on our project website: https://omegause-officeval.github.io.', 'score': 7, 'issue_id': 2798, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '8360174c9e04d802', 'authors': ['Jingbo Zhou', 'Yusai Zhao', 'Qi Bao', 'Jingjia Cao', 'Zhenghai Chen', 'Chang Gao', 'Kaiqi Guo', 'Muxin Guo', 'Mingxuan Li', 'Xinjiang Lu', 'Yanru Ma', 'Yixiong Xiao', 'Zenghui Zhang', 'Le Zhang', 'Hua Wu'], 'affiliations': ['Baidu Inc., China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27155.jpg', 'data': {'categories': ['#benchmark', '#open_source', '#agents', '#dataset'], 'emoji': '💼', 'ru': {'title': 'Экономическая оценка LLM агентов в офисных задачах', 'desc': 'В статье представлен OmegaUse-OfficeVal - новый бенчмарк для оценки LLM агентов на сложных задачах офисного назначения с учётом экономической целесообразности. Каждая из 100 задач в бенчмарке снабжена двумя экономическими сигналами: временем человеческого труда и стоимостью, что позволяет сравнивать затраты на людей с затратами на инференс моделей. Для стабильной оценки разработаны верификаторы на основе кода с детальными критериями качества. Экспериментальные результаты показывают, что хотя LLM агенты значительно дешевле и быстрее человека, они пока не достигли человеческого уровня качества выполняемых работ.'}, 'en': {'title': 'Evaluating LLMs: Cost-Effective Office Task Performance', 'desc': 'This paper presents OmegaUse-OfficeVal, a new benchmark designed to evaluate large language model (LLM) agents on complex office-suite tasks. It includes 100 tasks that reflect real-world office requests and incorporates economic metrics like human labor time and task price to assess cost-effectiveness. The benchmark allows for comparisons between the efficiency of LLMs and human workers, highlighting that while LLMs are faster and cheaper, they still fall short of human quality. The authors provide open-source access to the code and dataset to encourage further research in this area.'}, 'zh': {'title': '评估LLM在办公任务中的经济效益与质量', 'desc': '本文介绍了一个新的基准测试工具OmegaUse-OfficeVal，用于评估大型语言模型（LLM）在长时间的办公任务中的表现。该基准包含100个任务，这些任务来源于实际办公请求，并经过隐私保护处理。每个任务都配有两个经济信号：人类劳动时间和任务价格代理，便于比较人类成本与LLM推理成本。尽管评估的LLM在成本和速度上优于人类，但在交付质量上仍未达到人类水平。'}}}, {'id': 'https://huggingface.co/papers/2607.26410', 'title': 'Voice Memory for Agentic Speech Recognition', 'url': 'https://huggingface.co/papers/2607.26410', 'abstract': 'Abstract  We present Voice Memory, a inference-only scheme for agentic speech recognition: at stream time, a frozen corrector reads a single per-domain memory.md and decides per utterance whether to act on the hypothesis or abstain and keep the 1-best. Asynchronously, a score-gated optimizer revises that file through bounded edits, accepting an edit only when it strictly improves a held-out score. Extended from classical ASR-LM framework, we refer this split the listener-thinker architecture; the two roles are coupled only through the memory, so no weights change and the learned skill stays auditable and portable. Restraint turns out to be the operative skill this loop discovers: unconstrained generative error correction (GER) over-corrects, breaking correct tokens on up to 64% of its edits on financial news, and Voice Memory, reduces this rate to 35%. Across ten HyPoradise domains with an open corrector, Voice Memory, lowers weighted word error rate from 8.36% to 7.52% (7.47% with three added in-context examples) without regressing any dataset below its 1-best baseline; gains concentrate where recoverable headroom is largest, including air-travel commands (8.40% to 3.40%) and noisy far-field speech (CHiME-4, 12.69% to 10.46%). The memory transfers across corrector families and adds zero parameters to the inference path. A demo and example code are provided for future studies.', 'score': 5, 'issue_id': 2803, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '2c48b0de3eb3c65e', 'authors': ['Chao-Han Huck Yang', 'Zih-Ching Chen', 'Piotr Zelasko', 'Zhehuai Chen', 'Jagadeesh Balam', 'Boris Ginsburg'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2607.26410.jpg', 'data': {'categories': ['#audio', '#agents', '#inference'], 'emoji': '🧠', 'ru': {'title': 'Память вместо переобучения: аудируемая коррекция речи без изменения весов', 'desc': 'Представлена Voice Memory — схема для распознавания речи в реальном времени, использующая замороженную модель-корректор, которая читает единый файл памяти для каждого домена и решает, исправлять ли гипотезу или оставить исходный результат. Асинхронный оптимизатор с гейтингом по оценкам обновляет файл памяти через ограниченные редактирования, принимая изменения только если они улучшают качество на контрольном наборе. Архитектура с разделением ролей «слушатель-мыслитель» связана только через память, что позволяет избежать обновления весов модели и сохраняет интерпретируемость. Voice Memory снижает частоту ошибочных исправлений с 64% до 35% и уменьшает взвешенную ошибку слова с 8.36% до 7.52% на десяти доменах без деградации качества на исходных данных.'}, 'en': {'title': 'Voice Memory: Enhancing Speech Recognition with Smart Memory Management', 'desc': 'The paper introduces Voice Memory, a novel approach for improving speech recognition by using a memory-based system that operates during inference. It employs a frozen corrector that evaluates each spoken utterance and decides whether to accept the initial recognition or retain the best guess. The method incorporates a score-gated optimizer that refines the memory file through limited edits, ensuring that only beneficial changes are made. This architecture, which separates the roles of listener and thinker, enhances performance while maintaining the integrity and portability of the learned model.'}, 'zh': {'title': 'Voice Memory：智能语音识别的新突破', 'desc': '本文介绍了一种名为Voice Memory的推理方案，用于智能语音识别。在这个方案中，一个固定的校正器会读取特定领域的记忆文件，并决定每次发言是采取假设还是保持最佳结果。通过一个分数门控优化器，系统会对记忆文件进行有限的编辑，以提高性能。研究表明，Voice Memory能够显著降低语音识别中的错误率，尤其在处理复杂和嘈杂的语音时表现出色。'}}}, {'id': 'https://huggingface.co/papers/2607.25802', 'title': 'Explicit Layer Modeling for Video Object Insertion and Layer Decomposition', 'url': 'https://huggingface.co/papers/2607.25802', 'abstract': 'Abstract  Most video editing systems still lack explicit layered video representations, limiting their ability to perform realistic compositing, object reuse, and consistent manipulation. This limitation is especially pronounced in video object insertion and video layer decomposition, where existing methods rely on implicit inference or per-scene optimization due to the absence of explicit foreground-layer supervision. We introduce TriLayer, a large-scale triplet video dataset containing aligned composite, background, and foreground videos, where the foreground layers include both object appearance and associated visual effects. This explicit supervision enables models to learn layered video representations directly rather than inferring them implicitly. Building on this dataset, we propose DBL-Diffusion, a dual-branch diffusion framework that jointly models RGB composites and RGBA foreground layers through shared denoising and cross-branch interaction. We instantiate the framework in two tasks: DBL-Insert for layered object insertion, which generates explicit RGBA layers for realistic compositing and flexible post-editing, and DBL-Decompose for video layer decomposition, which recovers foreground and background layers using triplet supervision. Experiments demonstrate that explicit layer modeling substantially improves both insertion fidelity and decomposition quality.', 'score': 5, 'issue_id': 2797, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '45ed298290571dde', 'authors': ['Kyujin Han', 'Seungjoo Shin', 'Sunghyun Cho'], 'affiliations': ['POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2607.25802.jpg', 'data': {'categories': ['#video', '#multimodal', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Явные слои видео для реалистичного композитинга и редактирования', 'desc': 'В работе представлен новый набор данных TriLayer с явным разделением видео на слои: композитное, фоновое и переднее планы, где передний план включает объекты и визуальные эффекты. Это позволяет моделям обучаться явному представлению слоёв вместо неявного вывода. Авторы предлагают DBL-Diffusion — двухветвевую диффузионную модель, которая совместно моделирует RGB-композиты и RGBA-слои переднего плана через общий процесс денойзинга и взаимодействие между ветвями. Фреймворк применяется для двух задач: вставки объектов с генерацией явных RGBA-слоёв и разложения видео на компоненты, показывая значительное улучшение качества как при композитинге, так и при разделении слоёв.'}, 'en': {'title': 'Revolutionizing Video Editing with Explicit Layered Representations', 'desc': 'This paper addresses the limitations of current video editing systems that do not use explicit layered video representations, which hampers realistic compositing and object manipulation. The authors introduce TriLayer, a new dataset that provides aligned composite, background, and foreground videos, allowing for better training of models with explicit supervision. They propose a dual-branch diffusion framework called DBL-Diffusion, which effectively models both RGB composites and RGBA foreground layers. The framework is applied to two tasks: layered object insertion and video layer decomposition, showing significant improvements in the quality of video editing outcomes.'}, 'zh': {'title': '明确分层，提升视频编辑质量', 'desc': '大多数视频编辑系统缺乏明确的分层视频表示，这限制了它们进行真实合成和对象重用的能力。我们提出了TriLayer，这是一个大规模的三元视频数据集，包含对齐的合成、背景和前景视频，前景层包括对象外观和相关视觉效果。通过这种明确的监督，模型可以直接学习分层视频表示，而不是隐式推断。基于此数据集，我们提出了DBL-Diffusion，一个双分支扩散框架，能够共同建模RGB合成和RGBA前景层，显著提高了插入精度和分解质量。'}}}, {'id': 'https://huggingface.co/papers/2607.25380', 'title': 'Memory for Large Language Models', 'url': 'https://huggingface.co/papers/2607.25380', 'abstract': 'Abstract  Memory has evolved into a foundational architectural dimension in large language models (LLMs), shifting from an implicit byproduct of computation to a spectrum of explicit, controllable mechanisms. While recent advances introduce diverse strategies---spanning transient attention, recurrent state dynamics, parameter-efficient adaptations, and scalable lookup storage---this rapid evolution has led to a highly fragmented research landscape. In this survey, we present a systematic, architecture-centric taxonomy of memory in LLMs. Our framework characterizes memory along three orthogonal axes: representation (implicit versus explicit), update dynamics (offline versus online), and persistence (short-term versus long-term). We further formalize the granular mechanisms dictating memory writing, routing, state transitions, and consolidation. This unified perspective elucidates the conceptual boundaries between computation-coupled and independently addressable memory, effectively bridging disparate architectural paradigms. Additionally, we critically analyze hybrid memory architectures, system-level efficiency trade-offs, and multi-dimensional evaluation methodologies. By consolidating these scattered advancements into a cohesive framework, this survey charts the trajectory of memory-centric LLM design and provides a principled foundation for future innovations in scalable and adaptive language modeling.', 'score': 4, 'issue_id': 2801, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '0af4c17ea5be43a5', 'authors': ['Sining Zhoubian', 'Dan Zhang', 'Evgeny Kharlamov', 'Jie Tang'], 'affiliations': ['Bosch AI', 'National University of Singapore', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.25380.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Память как архитектурная основа: единая таксономия механизмов в LLM', 'desc': 'В этой работе авторы предлагают систематическую классификацию механизмов памяти в больших языковых моделях, которые эволюционировали от неявной характеристики вычислений до явных управляемых компонентов архитектуры. Они организуют разнообразные стратегии памяти—включая внимание, рекуррентные состояния и масштабируемое хранилище—вдоль трёх ортогональных осей: представление (неявное или явное), динамика обновления (офлайн или онлайн) и долговечность (кратковременная или долговременная). Авторы формализуют граничные механизмы записи, маршрутизации, переходов состояний и консолидации памяти. Работа объединяет разрозненные исследования в единую концептуальную схему, анализирует гибридные архитектуры и компромиссы эффективности, предоставляя принципиальный фундамент для разработки масштабируемых языковых моделей.'}, 'en': {'title': 'Revolutionizing Memory in Language Models', 'desc': 'This paper discusses how memory has become a key part of large language models (LLMs), moving from being a hidden feature to a clear and manageable aspect of their design. It introduces a structured way to categorize different memory types in LLMs based on how they represent information, how they update it, and how long they keep it. The authors also explain the specific processes involved in managing memory, such as writing and routing information. By bringing together various research findings, this paper aims to provide a clear framework for understanding and improving memory in LLMs for future developments.'}, 'zh': {'title': '内存驱动的大语言模型设计新视角', 'desc': '本文探讨了大语言模型（LLMs）中内存的演变，强调内存已成为一种显性且可控的机制。我们提出了一种系统的、以架构为中心的内存分类法，涵盖了内存的表示、更新动态和持久性三个维度。通过对内存写入、路由、状态转移和整合机制的细致分析，我们阐明了计算耦合内存与独立可寻址内存之间的概念界限。最终，我们整合了这些研究进展，为未来可扩展和自适应语言建模的创新奠定了基础。'}}}, {'id': 'https://huggingface.co/papers/2607.26115', 'title': 'GPT-Red: Automated Red Teaming via Self-Play at Scale', 'url': 'https://huggingface.co/papers/2607.26115', 'abstract': 'Abstract  We introduce GPT-Red, an automated red-teaming agent that is trained to discover novel prompt injection attacks against frontier LLMs. The goal of this model is to evaluate and improve the robustness of our production systems. To this end, we use it to adversarially train GPT-5.6, our most robust model to prompt injections to date. To create GPT-Red, we design a scalable self-play algorithm where the model is tasked with attacking a diverse population of simultaneously-trained defender agents. We train the model on realistic red-teaming environments using compute on the same scale as some of our largest RL post-training runs, making it the single-largest LLM safety training run ever documented. GPT-Red excels at red-teaming: it reliably breaks our past models up to GPT-5.5, it finds more successful attacks than human red-teamers, and it generalizes to held-out environments, defender models, and harnesses. In the future, we expect that as we improve the robustness of each new GPT model, it will in turn will provide better learning signal for even stronger red-teamer agents, thus unlocking a self-improvement flywheel.', 'score': 4, 'issue_id': 2798, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '834014844a20f658', 'authors': ['Eric Wallace', 'Christopher A. Choquette-Choo', 'Nikhil Kandpal', 'Sam Toyer', 'Dylan Hunn', 'Stephanie Lin', 'Yuxin Wen', 'Xiangyu Qi', 'Christopher Wolff', 'Zizhao Wang', 'Milad Nasr', 'Sicheng Zhu', 'Chuan Guo', 'Juan Felipe Cerón Uribe', 'Kaiwen Wang', 'Aiden Low', 'Kai Xiao', 'Kai Chen'], 'affiliations': ['OpenAI'], 'pdf_title_img': 'assets/pdf/title_img/2607.26115.jpg', 'data': {'categories': ['#agents', '#security', '#alignment', '#training', '#rl'], 'emoji': '🔴', 'ru': {'title': 'Автоматический красный тестер для укрепления безопасности языковых моделей', 'desc': 'В работе представлен GPT-Red — автоматизированный агент для поиска уязвимостей, обученный обнаруживать новые атаки путём инъекции промптов против современных больших языковых моделей. Для создания этого агента используется инновационный алгоритм самоигры, где модель одновременно атакует разнообразную популяцию защитных агентов, что позволяет масштабировать процесс обучения. Модель обучена на реалистичных сценариях красного тестирования с использованием вычислительных ресурсов, сопоставимых с крупнейшими экспериментами по обучению с подкреплением. GPT-Red эффективно находит больше успешных атак, чем люди-тестировщики, и хорошо обобщается на новые модели и среды, создавая цикл непрерывного улучшения безопасности LLM.'}, 'en': {'title': 'Empowering LLM Security with Automated Red-Teaming', 'desc': 'The paper presents GPT-Red, an automated agent designed to identify new prompt injection attacks on advanced large language models (LLMs). It aims to enhance the security and robustness of these models by adversarially training them against various attack strategies. Using a self-play algorithm, GPT-Red simulates attacks on multiple defender models, making it a significant advancement in LLM safety training. The results show that GPT-Red outperforms human red-teamers and effectively generalizes its findings to different environments and models.'}, 'zh': {'title': 'GPT-Red：提升LLM鲁棒性的自动化红队代理', 'desc': '本文介绍了GPT-Red，这是一种自动化的红队代理，旨在发现针对前沿大型语言模型（LLM）的新型提示注入攻击。该模型的目标是评估和提高生产系统的鲁棒性。我们利用GPT-Red对GPT-5.6进行对抗性训练，使其成为迄今为止对提示注入最具鲁棒性的模型。GPT-Red通过可扩展的自我对抗算法进行训练，能够有效地攻击多种同时训练的防御代理，并在红队环境中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2607.16955', 'title': 'CADENCE: Closing the Reasoning Gap via Coverage-Adaptive On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.16955', 'abstract': "Abstract  On-policy knowledge distillation transfers reasoning from large teachers to compact students, but existing approaches suffer three compounding failure modes: (i) cold-start collapse, where a fresh student assigns near-zero mass to teacher-preferred tokens; (ii) state-agnostic divergence scheduling, where time-only forward/reverse-KL interpolation ignores the student's coverage state; and (iii) binary reward sparsity, where pass/fail signals discard information from partially correct traces.   We present CADENCE, a unified framework with a targeted fix for each. Its DRIFT mechanism schedules a per-token convex mixture of forward-KL and reverse-KL surrogate objectives on student-sampled trajectories (per-token surrogates, not sequence-level KL gradient estimators). Six components extend it: (A) COVA, a coverage-adaptive β schedule accelerating the forward-to-reverse transition; (B) FTB, a forking-token boost concentrating gradient at high-entropy positions via a globally-normalized entropy reference; (C) CCD, a dense reward adding numerical-proximity partial credit for incorrect-but-close traces; (D) LAP, brevity-preferential correct-rollout reinforcement; (E) EMR, an entropy-matching calibration regularizer; (F) BSD, a bootstrapped self-distillation phase.   On GSM8K and MATH-500 (corrected 512-token protocol, 5 seeds, reported std), CADENCE distills a 0.5B student from a 1.5B teacher to 69.8 pm 0.5% GSM8K pass@1 (from 48.7% pretrained; 63.2% of the teacher gap closed) and to 72.1 pm 0.4% with a 3B teacher (76.2% closed), beating the strongest matched-compute label-using baseline (DRIFT+binary reward) by +4.4 pm 0.7 points. All experiments run on a single Apple Mac Studio (M-series, 64GB unified memory), showing principled distillation reaches strong reasoning quality without datacenter-scale hardware.", 'score': 4, 'issue_id': 2800, 'pub_date': '2026-07-18', 'pub_date_card': {'ru': '18 июля', 'en': 'July 18', 'zh': '7月18日'}, 'hash': '06928ea5b831d3a6', 'authors': ['Satyam Kumar', 'Saurabh Jha'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.16955.jpg', 'data': {'categories': ['#training', '#transfer_learning', '#math', '#optimization', '#reasoning', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Адаптивная дистилляция знаний для языковых моделей с решением проблем холодного старта и разреженности наград', 'desc': 'В работе представлена CADENCE — единая система для дистилляции знаний от больших языковых моделей к компактным студентам в задачах логического вывода. Авторы выявили три основные проблемы существующих подходов: холодный старт, когда новый студент присваивает близкую к нулю вероятность предпочитаемым учителем токенам; игнорирование реального состояния покрытия при расписании KL-дивергенции; и потеря информации из частично правильных траекторий из-за бинарных наград. CADENCE предлагает механизм DRIFT с адаптивным расписанием смешивания forward-KL и reverse-KL целевых функций на токен-уровне, дополненный шестью компонентами для улучшения сходимости и качества. На задачах GSM8K и MATH-500 система дистиллирует студента из 0.5B параметров от учителя в 1.5B до 69.8% точности, значительно превосходя базовые методы на одном Apple Mac Studio без облачных вычислений.'}, 'en': {'title': 'CADENCE: Enhancing Knowledge Distillation for Smarter Students', 'desc': "This paper introduces CADENCE, a new framework for on-policy knowledge distillation that improves the transfer of reasoning from large teacher models to smaller student models. It addresses three main issues: cold-start collapse, state-agnostic divergence scheduling, and binary reward sparsity, which hinder effective learning. CADENCE employs a DRIFT mechanism that uses per-token surrogate objectives to better align the student's learning with the teacher's preferences. Additionally, it incorporates six innovative components to enhance performance, achieving significant improvements in reasoning tasks on benchmark datasets like GSM8K and MATH-500."}, 'zh': {'title': 'CADENCE：高效知识蒸馏的新框架', 'desc': '本文提出了一种名为CADENCE的框架，用于解决现有知识蒸馏方法中的三个主要问题。首先，CADENCE通过DRIFT机制为每个token调度前向和反向KL散度的混合目标，避免了冷启动崩溃。其次，框架引入了覆盖自适应的β调度和其他组件，以提高学生模型的学习效率。最后，实验结果表明，CADENCE在GSM8K和MATH-500数据集上显著提高了学生模型的推理能力，展示了在不依赖大型数据中心硬件的情况下实现高质量蒸馏的可能性。'}}}, {'id': 'https://huggingface.co/papers/2607.26055', 'title': 'πR^2: Reactive Real-time Flow Policies', 'url': 'https://huggingface.co/papers/2607.26055', 'abstract': 'Abstract  Generalist manipulation policies increasingly take the form of action-chunking flow policies built on large pretrained backbones. Such chunks run open-loop, so the policy cannot react to sensory input arriving mid-execution, sacrificing reactivity. Replanning more often would restore it, but the perception-to-action pipeline (a large backbone plus multiple denoising steps) is too slow: this latency forbids frequent replanning and leaves committed actions stale, making such policies ill-suited for dynamic, closed-loop control. We present πR^2, which makes these policies reactive and real-time while retaining large backbones, expressive multi-modal policies, and multi-action prediction. Built on the per-position noise schedule of diffusion forcing, πR^2 contributes two ideas. First, it splits conditioning into a fast channel (proprioception, fresh every tick) and an asynchronously updated slow channel (vision-language features), so the policy reacts to proprioception within a chunk while tolerating stale vision. Second, a latency-adaptive flow schedule treats in-flight actions as inpainting conditioning and emits actions in one denoising step per call, letting one trained model adapt to varying hardware latency. Requiring minimal modification to existing architectures, πR^2 can be finetuned from a pretrained policy: applied to GR00T-N1.7 on a real xArm6+XHand platform, it replans closed-loop roughly 4times faster than the base policy (~25Hz on an A5000 GPU), acting on a fresh observation every 40ms. Across simulation and real-world manipulation tasks, πR^2 improves the success rate by up to 23% in simulation and 30% in the real world over the strongest baseline. Project page: https://pi-r2-flow.github.io/', 'score': 2, 'issue_id': 2803, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '0108b15485d6b610', 'authors': ['Sungjae Park', 'Shubham Tulsiani'], 'affiliations': ['Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26055.jpg', 'data': {'categories': ['#robotics', '#optimization', '#multimodal', '#training', '#diffusion', '#inference'], 'emoji': '🔄', 'ru': {'title': 'Реактивная манипуляция в реальном времени через адаптивное переплание диффузионного потока', 'desc': 'В статье представлена πR^2 — методология для повышения реактивности политик манипуляции на основе диффузионных моделей с действиями блоками. Авторы решают проблему латентности, разделяя входные сигналы на быстрый канал (проприоцепция) и медленный асинхронный канал (визуально-языковые признаки), позволяя политике реагировать на сенсорную обратную связь в реальном времени. Предложенный алгоритм адаптируется к изменяющейся задержке оборудования, генерируя действия за один шаг денойзинга вместо множественных итераций. На практике πR^2 увеличивает частоту переплана в 4 раза (до 25Hz) и повышает успешность манипуляции на 23-30% по сравнению с базовыми подходами.'}, 'en': {'title': 'Enhancing Reactivity in Manipulation Policies with πR^2', 'desc': 'The paper introduces πR^2, a new approach to enhance the reactivity of manipulation policies that use action-chunking flow methods based on large pretrained models. It addresses the challenge of slow perception-to-action pipelines by implementing a dual-channel conditioning system, allowing the policy to quickly respond to proprioceptive feedback while managing slower visual inputs. Additionally, πR^2 employs a latency-adaptive flow schedule that enables efficient action emission, accommodating varying hardware speeds. The results show significant improvements in closed-loop replanning speed and success rates in both simulated and real-world tasks compared to existing methods.'}, 'zh
