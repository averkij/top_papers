    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.02023', 'title': 'SwanTale: Unified Multi-Speaker Speech and Audio Generation for Instruct and Zero-Shot Tasks', 'url': 'https://huggingface.co/papers/2608.02023', 'abstract': 'Abstract  Speech and audio generation is often needed in animation dubbing, audio drama, movies, advertising, games, podcasts, and short-video production. In these scenarios, creators may need to design voices without reference recordings, control speaker styles with natural language, support acoustic scenes with environments and audio effects, and later reuse the designed voices. Therefore, it is important to support multi-speaker speech and audio generation for both instruct and zero-shot tasks. The instruct task requires a caption of the environment, speaker styles, and fine-grained content, while the zero-shot task uses reference audio together with the same fine-grained content. We address these tasks from both the data and model sides. First, we propose SwanData-Caption, which cleans raw speech and audio data, adds targeted synthetic coverage, and annotates diverse and accurate multi-level captions. Then, we propose SwanTale, a multi-speaker expressive speech and audio generation model that supports both zero-shot and instruct tasks. We introduce SwanVAE to support high-quality multi-audio-modality generation. Then, we adopt reward-conditioned quality control and Engram conditioning, along with Unified MoE for multi-task and multi-audio-modality modeling. In addition, we use curriculum learning and GRPO post-training to let the model progressively learn and strengthen its capabilities. Experimental results show that SwanTale leads on multiple key zero-shot and instruct metrics, achieves the best expressiveness scores in both tasks, and supports complex instruct generation involving multi-speaker speech and audio. Demos can be found at https://swanaigc.github.io/\\#swantale.', 'score': 140, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '4b04115678abc0cc', 'authors': ['Yu Zhang', 'Ruiqi Li', 'Changhao Pan', 'Ke Lei', 'Xiang Yin', 'Cheng Yang'], 'affiliations': ['ByteDance', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02023.jpg', 'data': {'categories': ['#games', '#training', '#audio', '#data', '#open_source', '#synthetic', '#dataset'], 'emoji': '🎙️', 'ru': {'title': 'Выразительная генерация речи и аудио с контролем по инструкциям и примерам', 'desc': 'В статье представлена система SwanTale для генерации многоголосой экспрессивной речи и аудио, которая поддерживает как инструктивные задачи с текстовым описанием сцены, так и нулевые примеры с референсным аудио. Авторы разработали датасет SwanData-Caption с чисткой данных, синтетическим расширением и многоуровневой аннотацией для обучения модели. Модель использует SwanVAE для высококачественной генерации мультимодального аудио, награду-обусловленный контроль качества, расширенное кодирование и унифицированную MoE архитектуру для обработки различных задач и модальностей. Система демонстрирует превосходные результаты по метрикам экспрессивности и качества в обеих постановках задач, включая сложные сценарии с несколькими говорящими.'}, 'en': {'title': 'Empowering Creative Voices with Advanced Audio Generation', 'desc': 'This paper presents advancements in speech and audio generation for various creative applications, such as animation and gaming. It introduces SwanData-Caption, a method for enhancing and annotating audio data to improve multi-speaker generation tasks. The authors also propose SwanTale, a model that excels in both instruct and zero-shot tasks, allowing for expressive audio generation without prior recordings. The model incorporates techniques like reward-conditioned quality control and curriculum learning to enhance its performance and adaptability.'}, 'zh': {'title': '多说话人语音生成的创新解决方案', 'desc': '本论文探讨了多说话人语音和音频生成在动画配音、音频剧、电影等场景中的应用。我们提出了SwanData-Caption，用于清理原始语音数据并添加多样化的注释，以支持指令和零样本任务。接着，我们介绍了SwanTale模型，能够生成高质量的多音频模态，并通过奖励条件质量控制和课程学习来提升模型能力。实验结果表明，SwanTale在多个关键指标上表现优异，支持复杂的多说话人语音生成。'}}}, {'id': 'https://huggingface.co/papers/2608.01964', 'title': 'LongHorizon-Harness: Advancing Long-Horizon Agents for Real-World Tasks', 'url': 'https://huggingface.co/papers/2608.01964', 'abstract': 'Abstract  Large language model (LLM) agents increasingly undertake long-horizon tasks that require sustained reasoning, tool use, and revision across many interdependent steps. However, existing agent harnesses maintain task execution, task state, and completion assessment within a growing context, making the state difficult to track and allowing incorrect self-assessments to propagate into later decisions. We reformulate long-horizon execution as a task-state management problem and propose LongHorizon-Harness, which maintains the task state explicitly outside execution and updates it only with facts independently verified from the environment. Its Manage-Execute-Audit(MEA) loop uses a manager to maintain the task state and determine the next subtask, a fresh-context executor to perform it, and a read-only auditor to verify the resulting environment state before the next round. A lightweight AgentAdapter supports interchangeable model and harness backends without modifying their native agent loops. LongHorizon-Harness improves Qwen~3.7-Plus from 51.8% to 80.7% on WeaveBench, from 69.7% to 77.2% on Terminal-Bench~2.1, and from 2.8% to 8.3% on OSWorld~2.0. It also raises Claude Opus~4.7 from 20.0% to 34.3% on an OSWorld2.0 subset, demonstrating consistent gains across models, harnesses, and interaction domains.', 'score': 126, 'issue_id': 2840, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '2633e8f341470f4e', 'authors': ['Ziyu Ma', 'Hailang Huang', 'Shun Zou', 'Yong Wang', 'Shidong Yang', 'Yiming Hu', 'Fei Wei', 'XiangXiang Chu'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.01964.jpg', 'data': {'categories': ['#long_context', '#benchmark', '#agents', '#reasoning'], 'emoji': '🔄', 'ru': {'title': 'Явное управление состоянием для надёжного выполнения сложных многошаговых задач агентами LLM', 'desc': 'Статья предлагает LongHorizon-Harness — новый фреймворк для управления долгоизмеряющимися задачами агентов на базе больших языковых моделей. Вместо того чтобы хранить состояние задачи внутри растущего контекста, система явно отделяет управление состоянием от выполнения и проверяет каждый результат независимо через взаимодействие с окружением. Архитектура использует цикл Manage-Execute-Audit: менеджер поддерживает состояние и определяет подзадачи, исполнитель выполняет их в свежем контексте, а аудитор верифицирует результаты перед следующей итерацией. Эксперименты показали значительные улучшения на нескольких бенчмарках: производительность моделей Qwen и Claude увеличилась на 20-30 процентных пункта.'}, 'en': {'title': 'Enhancing Long-Term Task Execution in LLMs with LongHorizon-Harness', 'desc': 'This paper introduces LongHorizon-Harness, a new framework designed to improve the performance of large language model (LLM) agents in executing long-term tasks. It addresses the challenge of tracking task state and preventing errors from propagating by managing task state externally and verifying facts from the environment. The framework employs a Manage-Execute-Audit (MEA) loop, which includes a manager for task state, an executor for performing subtasks, and an auditor for verifying outcomes. The results show significant performance improvements across various benchmarks, indicating the effectiveness of this approach in enhancing LLM capabilities.'}, 'zh': {'title': '提升长期任务执行的智能管理', 'desc': '本文提出了一种新的方法LongHorizon-Harness，用于管理大型语言模型（LLM）在执行长期任务时的状态。通过将任务执行重新定义为任务状态管理问题，该方法能够在执行过程中明确维护任务状态，并仅通过环境中独立验证的事实来更新状态。LongHorizon-Harness采用管理-执行-审计（MEA）循环，确保每个子任务的执行和结果都经过验证，从而减少错误传播。实验结果表明，该方法显著提高了多个模型在不同基准测试上的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.01735', 'title': 'DAPD: Dual-Anchored Policy Distillation', 'url': 'https://huggingface.co/papers/2608.01735', 'abstract': 'Abstract  On-policy (self) distillation (OPSD) is increasingly adopted for language-model post-training. It strengthens the teacher with privileged information but can induce a privilege illusion: the student learns privilege-dependent behavior it cannot reproduce from its inference-time context, yet behaves as if the training-time privileged information remained available, ultimately degrading performance. In this paper, we identify information asymmetry between the privileged teacher and the student at inference as the root cause of this failure in OPSD. To resolve this asymmetry, we propose Dual-Anchored Policy Distillation (DAPD), a unified framework with two levels of anchoring. Dual-Path Anchoring (DPA) introduces a self-conditioned bridge and aligns reference and rollout behavior along two matched-information paths, preventing privilege-dependent behavior from being transferred to the inference-time student. Dual-Source Anchoring (DSA) applies these paths in both reference-to-rollout and rollout-to-reference directions, reducing reliance on privileged reference guidance while preserving correctness supervision. Extensive experiments show that DAPD significantly alleviates privilege illusion, outperforming OPSD on Qwen3-4B by +2.00 points on average across tasks. Notably, its gains persist across scales, reaching +2.69 at 4B and +2.78 at 32B.', 'score': 54, 'issue_id': 2840, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'c037e8e8eff733cd', 'authors': ['Jianyu Wu', 'Yizhou Wang', 'Encheng Su', 'Chen Tang', 'Shixiang Tang'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'The University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.01735.jpg', 'data': {'categories': [], 'emoji': '🎓', 'ru': {'title': 'Преодоление иллюзии привилегий в дистилляции языковых моделей', 'desc': 'В статье исследуется проблема привилегированной иллюзии в методе дистилляции политики на своих данных (OPSD), когда студент-модель учится поведению, зависящему от информации, недоступной во время инференса. Авторы предлагают метод Dual-Anchored Policy Distillation (DAPD), который устраняет информационную асимметрию между учителем и студентом через двухуровневое якорирование. Фреймворк использует Dual-Path Anchoring для выравнивания поведения по двум согласованным информационным путям и Dual-Source Anchoring для двусторонней передачи знаний. Экспериментальные результаты показывают, что DAPD значительно повышает качество дистилляции, улучшая производительность на +2.00 пункта в среднем и сохраняя преимущества при масштабировании до 32B параметров.'}, 'en': {'title': 'Bridging the Gap: Enhancing Language Models with Dual-Anchored Policy Distillation', 'desc': 'This paper discusses a method called Dual-Anchored Policy Distillation (DAPD) to improve on-policy self distillation in language models. The authors identify a problem where the student model learns behaviors based on privileged information that it cannot access during inference, leading to poor performance. DAPD introduces two anchoring techniques to align the learning process and reduce reliance on this privileged information. Experimental results show that DAPD significantly enhances model performance compared to traditional on-policy self distillation methods.'}, 'zh': {'title': '双锚策略蒸馏：消除特权幻觉的有效方法', 'desc': '本文提出了一种新的框架，称为双锚策略蒸馏（DAPD），旨在解决在语言模型后训练中出现的特权幻觉问题。特权幻觉是指学生模型在推理时无法重现训练时获得的特权信息，从而导致性能下降。通过双路径锚定和双源锚定，DAPD能够在两个信息路径上对齐参考和执行行为，减少对特权信息的依赖。实验结果表明，DAPD在多个任务上显著优于传统的自我蒸馏方法，提升了模型的整体性能。'}}}, {'id': 'https://huggingface.co/papers/2608.01678', 'title': 'Progressive Agent Skill Generation via Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.01678', 'abstract': 'Abstract  Existing skill generation methods largely rely on heuristics or pipeline-style consolidation, which must be specially designed for different evidence sources. In contrast, learning-based approaches offer a more unified way to model skill generation across heterogeneous sources. However, learning-based skill generation remains challenging because skills lack a natural supervision signal based on relevance or correctness; their value can largely be determined only by whether they improve the behavior of the agent on downstream tasks. To address this challenge, we propose Skill-α, a reinforcement learning method for progressively generating high-quality agent skills. Specifically, we formulate skill generation as a sequential editing process that decomposes skill construction into individually evaluable edits, and introduce a novel rollback reward that evaluates each edit by comparing downstream execution under the original and edited skills on an anchored query. Extensive experiments show that Skill-α generates more effective skills than methods based on heuristics or pipelines in both document-to-skill and experience-to-skill settings. Under the main GPT-4o worker, Skill-α improves average downstream success rates over the strongest skill-generation baseline by 3.3 points on CL-Bench and 6.7 points on tau2-bench. Further ablations validate the importance of rollback reward and progressive generation.', 'score': 49, 'issue_id': 2840, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '46889e670263b454', 'authors': ['Junhao Shen', 'Zhanqiu Zhang', 'Yiwen Guo', 'Hong Cheng'], 'affiliations': ['Independent Researcher', 'LIGHTSPEED', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.01678.jpg', 'data': {'categories': ['#agents', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Прогрессивная генерация навыков агента через последовательное редактирование с наградой отката', 'desc': 'В статье предлагается Skill-α — метод на основе обучения с подкреплением для генерации высокачественных навыков агента. Авторы формулируют создание навыков как последовательный процесс редактирования, где каждое изменение можно оценить отдельно с помощью новой награды отката, которая сравнивает выполнение задач с исходными и отредактированными навыками. В отличие от эвристических подходов, предложенный метод предоставляет унифицированный способ моделирования генерации навыков из разнородных источников данных. Экспериментальные результаты показывают значительное улучшение эффективности агента по сравнению с базовыми методами генерации навыков на нескольких бенчмарках.'}, 'en': {'title': 'Revolutionizing Skill Generation with Reinforcement Learning', 'desc': "This paper introduces Skill-α, a novel reinforcement learning approach for generating agent skills. Unlike traditional methods that rely on heuristics or fixed pipelines, Skill-α treats skill generation as a sequential editing process, allowing for more flexible and effective skill construction. The method employs a unique rollback reward mechanism to evaluate the impact of each edit on the agent's performance in downstream tasks. Experimental results demonstrate that Skill-α outperforms existing skill generation techniques, achieving significant improvements in success rates across various benchmarks."}, 'zh': {'title': 'Skill-α：通过强化学习生成高质量技能', 'desc': '现有的技能生成方法主要依赖启发式或管道式整合，这些方法需要针对不同的证据来源进行特别设计。与此不同，基于学习的方法提供了一种更统一的方式来建模跨异构来源的技能生成。然而，基于学习的技能生成仍然面临挑战，因为技能缺乏基于相关性或正确性的自然监督信号；它们的价值主要取决于是否能改善代理在下游任务中的表现。为了解决这个问题，我们提出了Skill-α，这是一种通过强化学习逐步生成高质量代理技能的方法。'}}}, {'id': 'https://huggingface.co/papers/2607.28590', 'title': 'VAD: Attributing Visual Evidence for Target Reconstruction in Multimodal On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.28590', 'abstract': 'Abstract  Multimodal on-policy distillation (OPD) transfers fine-grained visual knowledge by supervising student-generated trajectories with a privileged-view teacher. Yet its next-token corrections are source-mixed, combining visual signals with linguistic priors and teacher-specific effects. The key challenge is to estimate which corrections are supported by visual evidence, not merely where or how strongly to distill. We introduce Visual Attribution Distillation (VAD), a counterfactual target-reconstruction algorithm that estimates the visually attributable part of a teacher correction. At each student-generated prefix, VAD evaluates the same fixed teacher with the relevant evidence present and removed. The corresponding change in centered log-probabilities defines ut, a signed proxy for the visual evidence direction that estimates how revealing the evidence supports or refutes candidate tokens. VAD projects the original correction onto this proxy to obtain an intervention-aligned component and a proxy-unexplained residual, then reconstructs a student-anchored target from the former. During training, this reconstructed target supplies the primary supervision signal, while the privileged teacher contributes a weak regularizer. Across six fine-grained visual benchmarks at 4B and 9B scales, VAD outperforms direct privileged-view distillation and visual-advantage weighting. Token- level and controlled-target analyses show that the proxy-aligned component is enriched in task-relevant visual corrections and yields stronger target shifts, especially when evidence refutes a mistaken answer. These results support counterfactual target reconstruction as an effective alternative to source-mixed supervision.', 'score': 43, 'issue_id': 2839, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'f3f1d830b7497087', 'authors': ['Kangning Zhang', 'Yixing Li', 'Shuai Shao', 'Qingyao Li', 'Zhengxi Lu', 'Zhiyuan Yao', 'Jianghao Lin', 'Wenxiang Jiao', 'Yuan Lu', 'Weiwen Liu', 'Weinan Zhang', 'Yong Yu'], 'affiliations': ['Shanghai Jiao Tong University', 'Southeast University', 'The Chinese University of Hong Kong', 'Xiaohongshu Inc.', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28590.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#training'], 'emoji': '👁️', 'ru': {'title': 'Выделение визуальной атрибуции при дистилляции мультимодальных моделей', 'desc': 'В работе предлагается метод Visual Attribution Distillation (VAD) для улучшения дистилляции мультимодальных моделей. Основная идея заключается в том, чтобы выделить из корректив учителя только ту часть, которая действительно обусловлена визуальной информацией, отделив её от лингвистических приоритетов. Метод использует контрфактический подход: оценивает предсказания учителя при наличии и отсутствии визуальных доказательств, определяя таким образом влияние зрительных сигналов. Экспериментальные результаты на шести бенчмарках показывают, что VAD превосходит стандартную дистилляцию с привилегированным视представлением и более эффективно передаёт визуальные знания студенческой модели.'}, 'en': {'title': 'Enhancing Visual Knowledge Transfer with VAD', 'desc': "This paper presents Visual Attribution Distillation (VAD), a method that improves the transfer of visual knowledge in machine learning by focusing on the visual evidence behind teacher corrections. VAD uses a counterfactual approach to determine which parts of a teacher's guidance are supported by visual data, rather than just combining visual and linguistic signals. By evaluating the impact of visual evidence on the teacher's corrections, VAD creates a more accurate supervision signal for training student models. The results show that VAD significantly enhances performance on visual tasks compared to traditional methods, especially when the evidence contradicts incorrect predictions."}, 'zh': {'title': '视觉归因蒸馏：提升知识转移的有效方法', 'desc': '多模态的在线策略蒸馏（OPD）通过使用特权视角教师来监督学生生成的轨迹，从而转移细粒度的视觉知识。本文提出了视觉归因蒸馏（VAD），这是一种反事实目标重建算法，用于估计教师修正中由视觉证据支持的部分。VAD在每个学生生成的前缀上评估固定教师的相关证据，并通过比较有无证据的变化来定义视觉证据的方向。实验结果表明，VAD在多个细粒度视觉基准测试中表现优于直接的特权视角蒸馏，证明了反事实目标重建作为一种有效的监督替代方案。'}}}, {'id': 'https://huggingface.co/papers/2608.02583', 'title': 'UEmbed: Unified Sparse and Dense Multimodal Embeddings', 'url': 'https://huggingface.co/papers/2608.02583', 'abstract': "Abstract  Sparse retrieval underpins modern search systems, from web search to retrieval-augmented generation. Existing work has introduced Learned Sparse Retrieval (LSR) to push beyond exact lexical matching toward richer semantics. Yet LSR has so far remained tied to encoder-style bidirectional architectures, and its extension to multimodal settings still relies heavily on auxiliary cross-modal modules. To address these limitations, we introduce UEmbed (Unified Embedding), a decoder-only multimodal embedding model that produces both sparse lexical and dense representations in one causal forward pass. UEmbed appends N learnable special tokens to the input and partitions the vocabulary into N disjoint subsets. Each token's causal hidden state predicts sparse weights over its assigned subset, and the N subsets are concatenated into the full sparse vector. Trained on public data, we release UEmbed at 2B, 4B, and 9B scales. UEmbed-9B reaches 71.8 (dense) and 71.0 (sparse) on MMEB-v2, outperforming multimodal embedding models trained on publicly available data (e.g., RzenEmbed). On BEIR, UEmbed also remains competitive with strong dense and sparse baselines. Furthermore, we demonstrate the practical utility of UEmbed across three dimensions: effectiveness, efficiency, and agentic applications. Overall, UEmbed offers a new paradigm: it unifies dense and sparse embeddings in one model, while further extending sparse retrieval to unify text and multimodal inputs.", 'score': 41, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '8b7e72d84edb3411', 'authors': ['Tingyu Song', 'Mingxin Li', 'Yanzhao Zhang', 'Dingkun Long', 'Pengjun Xie', 'Zhijie Nie', 'Yilun Zhao', 'Shu Wu'], 'affiliations': ['Alibaba Group', 'CASIA', 'University of Chinese Academy of Sciences', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02583.jpg', 'data': {'categories': ['#multimodal', '#rag', '#benchmark', '#agents', '#open_source'], 'emoji': '🔍', 'ru': {'title': 'Единая модель для разреженного и плотного поиска в мультимодальных данных', 'desc': 'В работе представлена UEmbed — единая модель для создания как разреженных лексических, так и плотных представлений текста и изображений в одном проходе декодера. Модель использует специальные обучаемые токены, которые предсказывают разреженные веса над разными подмножествами словаря, что позволяет избежать использования вспомогательных кросс-модальных модулей. UEmbed достигает конкурентных результатов на бенчмарках MMEB-v2 и BEIR, превосходя существующие многомодальные модели embeddings, обученные на открытых данных. Модель демонстрирует практическую полезность через эффективность поиска, вычислительную экономичность и применимость в агентных системах.'}, 'en': {'title': 'Unifying Dense and Sparse Retrieval with UEmbed', 'desc': 'This paper presents UEmbed, a novel decoder-only multimodal embedding model designed for sparse retrieval in search systems. UEmbed combines both sparse lexical and dense representations in a single forward pass, enhancing the retrieval process beyond traditional methods. By introducing learnable special tokens and partitioning the vocabulary, UEmbed efficiently predicts sparse weights, achieving high performance on multimodal benchmarks. The model demonstrates significant improvements in effectiveness and efficiency, making it a versatile tool for integrating text and multimodal inputs in retrieval tasks.'}, 'zh': {'title': '统一稀疏与稠密嵌入的新范式', 'desc': '这篇论文介绍了一种新的模型UEmbed（统一嵌入），它在稀疏检索中结合了稠密和稀疏表示。UEmbed使用解码器结构，通过一次前向传播生成稀疏和稠密的嵌入，克服了以往模型的局限性。该模型通过添加可学习的特殊标记，将词汇分成多个不相交的子集，从而提高了检索的语义丰富性。UEmbed在多个基准测试中表现优异，展示了其在有效性、效率和应用方面的实用性。'}}}, {'id': 'https://huggingface.co/papers/2608.02603', 'title': 'WorldExam: Benchmarking World Models from Apparent Appearance to Inherent Reactivity', 'url': 'https://huggingface.co/papers/2608.02603', 'abstract': 'Abstract  Controllable video generation models are increasingly being developed as world models. Accordingly, evaluating them in this role extends beyond the apparent appearance of generated videos to the inherent reactivity of the worlds they depict: the ability to infer from the scene state how the world should react and to generate plausible consequences not explicitly described in the input. Yet existing benchmarks mainly assess visual quality or explicit instruction fulfillment by checking whether requested actions and interaction outcomes are realized, leaving inherent reactivity underexamined. We introduce WorldExam, a hierarchical diagnostic benchmark spanning four levels: Visual Quality, Control Adherence, Spatial Consistency, and World Reactivity. It comprises 1,474 cases across eight dedicated tasks and supports unified evaluation of camera-, action-, and language-driven model paradigms. The World Reactivity level evaluates scene-conditioned reactions and goal-directed behaviors beyond what is explicitly specified in the input. Evaluation of 20 representative models reveals a clear capability split. Camera-driven models excel at camera control, but their interfaces do not support dynamic interaction; action-driven models control subjects more precisely but often leave the world unresponsive; and language-driven models perform better on interaction but follow complex controls less faithfully. No model combines broad task coverage with consistently strong performance, showing that high visual quality and explicit instruction fulfillment do not guarantee inherent reactivity.', 'score': 30, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '02882d4253b0287f', 'authors': ['Yuxue Yang', 'Shuyao Shang', 'Jiahe Wang', 'Zitong Zhou', 'Liang Tan', 'Junhan Zeng', 'Ruizhi Li', 'Junyan Li', 'Yu Liu', 'Xiao Yang', 'Yong Li', 'Jun Zhu', 'Hongsheng Li', 'Tieniu Tan', 'Lue Fan', 'Zhaoxiang Zhang'], 'affiliations': ['Chinese Academy of Sciences', 'Tsinghua University', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.02603.jpg', 'data': {'categories': ['#benchmark', '#video', '#dataset'], 'emoji': '🌍', 'ru': {'title': 'Оценка реактивности виртуальных миров в моделях генерации видео', 'desc': 'В статье представлен WorldExam — иерархический бенчмарк для оценки моделей генерации видео, которые используются в качестве мировых моделей. Бенчмарк включает четыре уровня оценки: качество визуализации, соответствие управлению, пространственная согласованность и реактивность мира, охватывая 1474 случая в восьми различных задачах. Особое внимание уделяется оценке реактивности мира — способности модели предсказывать и генерировать правдоподобные последствия происходящего в сцене, которые не были явно указаны во входных данных. Анализ 20 моделей показал, что камеро-ориентированные модели хорошо управляют камерой, но не поддерживают динамическое взаимодействие, действие-ориентированные модели точнее контролируют объекты, но часто оставляют мир нереактивным, а языковые модели лучше справляются с взаимодействием, но менее точно следуют сложным командам.'}, 'en': {'title': 'Evaluating Video Models: Beyond Visuals to World Reactivity', 'desc': "This paper discusses the development of controllable video generation models that act as world models, focusing on their ability to react to scene states. It highlights the limitations of current evaluation benchmarks, which primarily assess visual quality and adherence to explicit instructions, neglecting the models' inherent reactivity. The authors introduce WorldExam, a comprehensive benchmark that evaluates models across four levels: Visual Quality, Control Adherence, Spatial Consistency, and World Reactivity. Their findings reveal that while different model types excel in specific areas, none achieve a balance of high performance across all tasks, indicating that visual appeal and instruction compliance do not ensure effective world interaction."}, 'zh': {'title': '评估视频生成模型的内在反应性', 'desc': '可控视频生成模型正在被开发为世界模型。评估这些模型不仅要看生成视频的外观，还要考虑它们所描绘世界的内在反应能力。现有的基准主要关注视觉质量和明确指令的实现，而对内在反应性关注不足。我们提出了WorldExam，这是一个分层诊断基准，涵盖视觉质量、控制遵循、空间一致性和世界反应性四个层面。'}}}, {'id': 'https://huggingface.co/papers/2608.00799', 'title': 'CADENA: Stepwise CAD Reverse Engineering', 'url': 'https://huggingface.co/papers/2608.00799', 'abstract': 'Abstract  Computer-Aided Design (CAD) underpins modern engineering, yet converting existing shapes into editable models still demands substantial expert effort. Most AI systems emit the entire CAD program in a single pass, never inspecting the intermediate geometry. In contrast, human engineers build a part feature by feature, checking after each operation what remains to be modeled. We introduce CADENA (Spanish for "chain"), a model that reconstructs a 3D mesh as a parametric CAD program, growing its sequence of operations one at a time and comparing the target with the currently predicted geometry at every step. We also address the lack of benchmarks for evaluating reverse-engineering methods on mechanical parts, introducing CADENA-Bench, a benchmark that measures performance across categories of mechanical parts. CADENA outperforms prior methods on CADENA-Bench and on the DeepCAD, Fusion 360, and MCB datasets. Code is available at https://github.com/zhemdi/cadena, model weights at https://huggingface.co/kulibinai/cadena, and CADENA-Bench at https://huggingface.co/datasets/kulibinai/cadena-bench.', 'score': 30, 'issue_id': 2840, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': 'a4e05eaa5c9497be', 'authors': ['Soslan Kabisov', 'Gennadiy Savrasov', 'Maksim Elistratov', 'Antonio Rodriguez', 'Daniil Ignatiev', 'Nikita Gavrilov', 'Rustam Uzdenov', 'Alexey I. Boyko', 'Igor Pasechnik', 'Anton Konushin', 'Andrey Kuznetsov', 'Dmitrii Zhemchuzhnikov'], 'affiliations': ['DAIMLD', 'FusionBrain Lab', 'Independent Researcher', 'Innopolis University', 'Lomonosov Moscow State University'], 'pdf_title_img': 'assets/pdf/title_img/2608.00799.jpg', 'data': {'categories': ['#benchmark', '#open_source', '#dataset', '#3d'], 'emoji': '⛓️', 'ru': {'title': 'Восстановление CAD-моделей цепочкой пошаговых операций с проверкой', 'desc': 'В статье представлена CADENA — модель глубокого обучения, которая восстанавливает трёхмерные сетки в виде параметрических CAD-программ, генерируя последовательность операций пошагово с проверкой промежуточной геометрии на каждом шаге. Этот подход имитирует рабочий процесс инженеров, которые строят детали постепенно, в отличие от существующих систем, генерирующих весь код за один проход без контроля результата. Авторы также создали CADENA-Bench — первый эталонный набор данных для оценки методов обратного инжиниринга механических деталей. Предложенная модель демонстрирует превосходные результаты на нескольких общедоступных датасетах, включая DeepCAD, Fusion 360 и MCB.'}, 'en': {'title': 'Revolutionizing CAD with Step-by-Step AI Reconstruction', 'desc': 'This paper presents CADENA, a novel AI model designed to convert 3D meshes into editable CAD programs by reconstructing them feature by feature. Unlike traditional AI systems that generate the entire CAD program in one go, CADENA evaluates the geometry at each step, mimicking the iterative process used by human engineers. The authors also introduce CADENA-Bench, a new benchmark for assessing the performance of reverse-engineering methods specifically for mechanical parts. Experimental results show that CADENA outperforms existing methods on various datasets, demonstrating its effectiveness in CAD model reconstruction.'}, 'zh': {'title': '逐步重建，智能设计的未来', 'desc': '计算机辅助设计（CAD）是现代工程的基础，但将现有形状转换为可编辑模型仍然需要大量专家的努力。大多数人工智能系统一次性生成整个CAD程序，而不检查中间几何形状。与此不同，人类工程师逐步构建零件，每完成一个操作后检查剩余的建模内容。我们提出了CADENA模型，它逐步重建3D网格为参数化CAD程序，并在每一步比较目标与当前预测的几何形状。'}}}, {'id': 'https://huggingface.co/papers/2608.01755', 'title': 'Deferred Exposure of Future Trajectories for Verifiable Reasoning in Autonomous Driving VLMs', 'url': 'https://huggingface.co/papers/2608.01755', 'abstract': 'Abstract  Recent Vision-Language-Action (VLA) models for autonomous driving (AD) increasingly utilize chain-of-thought (CoT) supervision to enhance the reasoning capabilities of their Vision-Language Model (VLM) components, yet existing annotation pipelines commonly expose the teacher model to the logged ground-truth (GT) future trajectory. We empirically show that this induces trajectory anchoring bias: teacher models rationalize the revealed outcome rather than infer a decision from scene evidence, producing less causally faithful CoTs and substantially more severe hallucinations, especially in causally challenging scenes. Removing the GT trajectory eliminates this shortcut, but open-ended trajectory generation entangles high-level decision-making with precise geometric synthesis and low-level dynamics. To make trajectory-level driving decisions verifiable without requiring open-ended trajectory synthesis, we introduce Autonomous-Driving Multiple-Choice Question (AD-MCQ), which casts planning as selection among explicit trajectory candidates. Taking this a step further, we propose Deferred Exposure of Future Trajectories for RLVR (DEFT-RLVR) to transform future trajectories from pre-decision anchors into post-decision verification targets. Experimental results show that DEFT-RLVR improves AD reasoning while preserving or even enhancing general visual capabilities. With VLM-only inference and controllable difficulty through candidate construction, AD-MCQ provides a flexible, scalable, and extensible foundation for future research on verifiable AD reasoning.', 'score': 29, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '6c381be0cfaffa29', 'authors': ['Zixuan Huang', 'Yang Zhou', 'Kaixuan Wang', 'Guli Zhang', 'Hongyan Xie', 'Yakun Zhu', 'Hao Geng', 'Yikun Ban', 'Deqing Wang'], 'affiliations': ['Beihang University', 'Shanghai Jiao Tong University', 'Zhejiang University', 'Zhuoyu Technology, Shenzhen, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.01755.jpg', 'data': {'categories': ['#multimodal', '#training', '#rlhf', '#agents', '#cv'], 'emoji': '🚗', 'ru': {'title': 'Избегаем якорения: от открытого синтеза к верификации траекторий в автономном вождении', 'desc': 'В работе изучается проблема смещения в цепочке рассуждений (CoT) при обучении моделей Vision-Language-Action для автономного вождения, когда учительская модель получает доступ к истинной траектории движения и начинает объяснять уже известный результат вместо причинного вывода из сцены. Авторы предлагают новый подход AD-MCQ, который переформулирует задачу планирования как выбор из предложенных кандидатов траекторий вместо открытого синтеза. Для решения проблемы якорения разработан метод DEFT-RLVR, который изменяет роль будущих траекторий с анкоров принятия решений на цели верификации после принятия решения. Экспериментальные результаты показывают, что предложенный метод улучшает качество рассуждений модели в задачах автономного вождения при сохранении общих возможностей зрительно-языковых моделей.'}, 'en': {'title': 'Enhancing Autonomous Driving Reasoning with Selective Trajectory Planning', 'desc': 'This paper addresses the challenges faced by Vision-Language-Action (VLA) models in autonomous driving, particularly the issue of trajectory anchoring bias caused by exposing teacher models to ground-truth future trajectories. The authors propose a new framework called Autonomous-Driving Multiple-Choice Question (AD-MCQ) that allows for planning decisions to be made by selecting from explicit trajectory candidates, rather than relying on open-ended trajectory generation. Additionally, they introduce Deferred Exposure of Future Trajectories for RLVR (DEFT-RLVR), which shifts the focus from pre-decision anchors to post-decision verification, enhancing the reasoning capabilities of the models. Experimental results demonstrate that DEFT-RLVR not only improves decision-making in complex driving scenarios but also maintains or boosts the overall visual performance of the models.'}, 'zh': {'title': '提升自动驾驶推理能力的新方法', 'desc': '最近的视觉-语言-动作（VLA）模型在自动驾驶（AD）中越来越多地利用思维链（CoT）监督来增强其视觉-语言模型（VLM）的推理能力。然而，现有的注释流程常常使教师模型接触到真实的未来轨迹，这会导致轨迹锚定偏差，使得教师模型更倾向于解释已知结果，而不是从场景证据中推断决策。为了解决这个问题，本文提出了自主驾驶多项选择题（AD-MCQ），将规划视为在明确轨迹候选中进行选择，并进一步提出了未来轨迹的延迟暴露（DEFT-RLVR），将未来轨迹从决策前的锚点转变为决策后的验证目标。'}}}, {'id': 'https://huggingface.co/papers/2608.02287', 'title': 'SKT: Skill-Use Training at Scale via Verified Synthetic Data Generation', 'url': 'https://huggingface.co/papers/2608.02287', 'abstract': 'Abstract  Agent skills have become an important mechanism for equipping language-model agents with reusable procedural knowledge. However, providing skills alone does not guarantee that current models can effectively identify, apply, and coordinate them. To improve skill-use capabilities, we introduce SKT, a verified data synthesis pipeline that constructs skill-grounded tasks and executable trajectories from large collections of agent skills. SKT selects suitable single-skill and multi-skill configurations, synthesizes tasks through rule-based and agent-based verification with feedback-guided repair, and retains only successful trajectories that substantially use every required skill. Using 2,000 public skills, SKT produces 4,000 task packages and 27,164 verified trajectories. Based on the same pipeline and a disjoint test pool, we further construct SkillEval, a held-out executable benchmark for evaluating skill use. Experiments across diverse models, benchmarks, and agent harnesses show that supervised fine-tuning on SKT-generated trajectories consistently improves skill-use performance. Verification ablations, cross-harness evaluation, and scaling experiments further demonstrate that these gains depend on high-quality supervision, extend beyond a single agent interface, and increase with broader skill coverage. Together, these results establish verified data synthesis as an effective and scalable approach for skill-use training.', 'score': 27, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '3306ffc2ed710b66', 'authors': ['Zelin Tan', 'Yiqun Zhang', 'Hao Li', 'Zhiyao Cui', 'Hejia Geng', 'Shao Zhang', 'Hangfan Zhang', 'Yang Chen', 'Xiaosong Wang', 'Lilong Wang', 'Zhenfei Yin', 'Shuyue Hu', 'Chen Zhang', 'Lei Bai'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2608.02287.jpg', 'data': {'categories': ['#training', '#reasoning', '#agents', '#benchmark', '#synthetic', '#dataset'], 'emoji': '🛠️', 'ru': {'title': 'Верифицированный синтез данных для обучения агентов использованию навыков', 'desc': 'В статье предлагается SKT — конвейер синтеза верифицированных данных для обучения агентов на основе больших языковых моделей эффективно использовать навыки. Система автоматически создаёт задачи и траектории выполнения, проверяя качество синтезированных данных с помощью обратной связи. Из 2000 публичных навыков генерируется 4000 пакетов задач и более 27000 верифицированных траекторий. Эксперименты показывают, что обучение с учителем на синтезированных данных стабильно улучшает способность моделей к координации и применению навыков.'}, 'en': {'title': 'Enhancing Agent Skills with Verified Data Synthesis', 'desc': 'This paper presents SKT, a data synthesis pipeline designed to enhance the skill-use capabilities of language-model agents. SKT constructs skill-grounded tasks and executable trajectories by selecting appropriate single and multi-skill configurations from a large pool of agent skills. The pipeline employs rule-based and agent-based verification methods to ensure that only successful trajectories that effectively utilize the required skills are retained. The results show that training on SKT-generated data significantly improves the performance of various models in skill application, highlighting the importance of high-quality supervision and broad skill coverage.'}, 'zh': {'title': '验证数据合成：提升技能使用的有效方法', 'desc': '本论文介绍了一种名为SKT的数据合成管道，用于构建基于技能的任务和可执行轨迹，以提高语言模型代理的技能使用能力。SKT通过选择合适的单技能和多技能配置，结合基于规则和基于代理的验证，合成任务并进行反馈修复，最终保留成功的轨迹。使用2000个公共技能，SKT生成了4000个任务包和27164个经过验证的轨迹。实验结果表明，在SKT生成的轨迹上进行监督微调可以显著提高技能使用性能，验证数据合成被确立为一种有效且可扩展的技能训练方法。'}}}, {'id': 'https://huggingface.co/papers/2608.02499', 'title': 'SWE-Touch: Benchmarking Coding Agents When Users Touch the Code', 'url': 'https://huggingface.co/papers/2608.02499', 'abstract': 'Abstract  Real-world software development requires coding agents to operate in shared workspaces where users may inspect and modify code during an ongoing task, yet existing repository-level benchmarks typically evaluate agents working alone or restrict user participation to messages. This leads us to ask: how do coding agents understand and respond to code changes in a shared workspace? We introduce SWE-Touch, a framework that stress-tests this setting through validated Counter-Edits: plausible edits to task-relevant code that conflict with task completion. SWE-Touch mines task-critical regions from multiple repair trajectories, uses a separate User Patch Generator to construct the edits, and injects them with contextual user messages when agents reach the relevant code. We evaluate nine coding models on SWE-bench Verified, with additional experiments on longer-horizon tasks from SWE-Bench Pro and DeepSWE. Counter-Edit lowers average resolve rate by 7.7 percentage points on SWE-bench Verified, with degradation also persisting on both longer-horizon benchmarks. Trajectory analysis links these failures to limited awareness of the evolving workspace: agents may retain conflicting code or replace it without sufficiently re-inspecting the repository and validating the revised code with targeted tests. These findings show that strong autonomous performance does not yet ensure the state awareness and adaptive behavior needed for shared-workspace collaboration, and point to detecting workspace changes, reconciling conflicting edits with the task, and verifying the affected behavior as key capabilities for future optimization.', 'score': 22, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e7489fa536aa40aa', 'authors': ['Yuqiao Tan', 'Jinxiang Meng', 'Fangyu Lei', 'Minzheng Wang', 'Shizhu He', 'Jun Zhao', 'Kang Liu'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.02499.jpg', 'data': {'categories': ['#benchmark', '#plp', '#dataset', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Когда агентам не хватает внимания: совместная разработка кода требует осознания изменений', 'desc': 'В статье представлена система SWE-Touch для оценки способности coding agents работать в общих рабочих пространствах, где пользователи могут изменять код во время выполнения задачи. Система использует Counter-Edits — правдоподобные конфликтующие изменения кода — для стресс-тестирования девяти моделей на бенчмарках SWE-bench. Результаты показали, что средний процент успешного разрешения задач снизился на 7,7 пункта из-за ограниченной осведомленности агентов о динамических изменениях в репозитории. Исследование выявило критические недостатки в отслеживании состояния рабочего пространства и рекомендует разработать механизмы для обнаружения изменений, разрешения конфликтов и верификации затронутого кода.'}, 'en': {'title': 'Enhancing Coding Agents for Collaborative Workspaces', 'desc': "This paper introduces SWE-Touch, a framework designed to evaluate how coding agents handle code changes in collaborative environments. It focuses on the concept of Counter-Edits, which are plausible modifications that conflict with the agents' tasks. The study reveals that existing coding models struggle with awareness of changes in shared workspaces, leading to a decrease in their performance. The findings suggest that improving agents' ability to detect changes, reconcile conflicts, and validate code is essential for enhancing their collaborative capabilities."}, 'zh': {'title': '共享工作空间中的编码代理挑战', 'desc': '这篇论文探讨了在共享工作空间中，编码代理如何理解和响应代码的变化。研究提出了SWE-Touch框架，通过验证的反向编辑来测试这一环境，反向编辑是与任务完成相冲突的合理代码修改。实验表明，编码模型在处理这些反向编辑时的平均解决率下降了7.7个百分点，且这种下降在更长时间的任务中也存在。研究结果表明，强大的自主性能并不意味着编码代理具备在共享工作空间中所需的状态意识和适应行为，未来的优化应关注检测工作空间变化、调和冲突编辑与任务的关系，以及验证受影响行为的能力。'}}}, {'id': 'https://huggingface.co/papers/2608.00146', 'title': 'DiffusionGemma Technical Report', 'url': 'https://huggingface.co/papers/2608.00146', 'abstract': "Abstract  We introduce DiffusionGemma, an experimental open-weight language model that uses discrete diffusion to generate text at exceptionally high speed. Rather than decoding one token at a time, DiffusionGemma iteratively refines blocks of 256 tokens in parallel, avoiding the sequential decoding bottleneck of conventional autoregressive (AR) large language models. Instead of training from scratch, we obtain DiffusionGemma by fine-tuning the mixture-of-experts Gemma 4 model with 3.8B activated and 25.2B total parameters. Our compute-efficient two-stage training pipeline uses fewer than 10% of the starting AR model's total training token budget. The first stage uses supervised fine-tuning to teach bidirectional denoising, while the second stage combines reinforcement learning with sampler distillation to jointly improve generation quality and inference efficiency. DiffusionGemma establishes a new Pareto frontier for the trade-off between generation speed and model capability. Averaged across our full evaluation suite, it generates around 20 tokens per forward pass and achieves roughly 1,500 output tokens per second on a single NVIDIA H100 GPU, which is substantially faster than AR models even with state-of-the-art speculative decoding. DiffusionGemma also retains the starting model's support for thinking mode, multimodal inputs, and long contexts. Despite diffusion fine-tuning, it remains capable of AR generation with only minor performance degradation, suggesting a path toward hybrid diffusion-AR decoding.", 'score': 22, 'issue_id': 2840, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '428dd5f0c5ebad77', 'authors': ['DiffusionGemma Team', 'Adrien Ali Taïga', 'James Assiene', 'Daniele Calandriello', 'Rahma Chaabouni', 'João Gante', 'Tamara von Glehn', 'Nate Keating', 'Chris Knutsen', 'Martin Kukla', 'Tianlin Liu', 'Ivan Lobov', 'Ofir Nabati', 'João Gabriel Oliveira', 'Nicolas Perez-Nieves', 'Nastasia Prutianova', 'Bobak Shahriari', 'Jean Tarbouriech', 'Pavel Tyletski', 'Çağlar Ünlü', 'Cindy Wu', 'Glenn Cameron', 'Jerome Connor', 'Sertan Girgin', 'Maarten Grootendorst', 'Alon Levkovitch', 'Eliya Nachmani', 'Omar Sanseviero', 'Piotr Stanczyk', 'Quentin Berthet', 'Andrew Campbell', 'Clément Crepy', 'Valentin De Bortoli', 'Arnaud Doucet', 'Romuald Elie', 'Alexandre Galashov', 'Klaus Greff', 'Alexis Jacq', 'David Ruhe', 'Yu-Han Wu', 'Sebastian Flennerhag', "Brendan O'Donoghue", 'George Scrivener', 'Shantanu Thakoor'], 'affiliations': ['Google DeepMind'], 'pdf_title_img': 'assets/pdf/title_img/2608.00146.jpg', 'data': {'categories': ['#diffusion', '#optimization', '#multimodal', '#long_context', '#architecture', '#inference', '#training', '#open_source', '#rl'], 'emoji': '⚡', 'ru': {'title': 'Параллельная генерация текста через дискретную диффузию вместо последовательного декодирования', 'desc': 'В работе представлен DiffusionGemma — открытая языковая модель, основанная на дискретной диффузии для параллельной генерации текста с исключительной скоростью. Вместо последовательного декодирования по одному токену модель итеративно уточняет блоки из 256 токенов одновременно, избегая узких мест автоRegressive моделей. DiffusionGemma получена путем fine-tuning модели Gemma 4 с архитектурой mixture-of-experts, используя менее 10% вычислительных ресурсов оригинальной модели. Двухэтапное обучение включает supervised fine-tuning для бидирекционального denoising и усиленное обучение с дистилляцией сэмплера для оптимизации качества генерации и эффективности инференса.'}, 'en': {'title': 'Revolutionizing Text Generation with Speed and Efficiency', 'desc': 'DiffusionGemma is a new language model that generates text quickly by using discrete diffusion techniques. Instead of producing one word at a time like traditional models, it processes blocks of 256 words simultaneously, which speeds up the generation process. The model is built on the existing Gemma 4 framework and is fine-tuned to enhance its performance while using significantly less training data. It achieves impressive output rates, generating around 1,500 tokens per second, while still supporting complex tasks and maintaining the ability to generate text in a traditional autoregressive manner.'}, 'zh': {'title': 'DiffusionGemma：高速文本生成的新突破', 'desc': 'DiffusionGemma是一种实验性的开放权重语言模型，采用离散扩散技术以极高的速度生成文本。与传统的自回归模型逐个解码不同，DiffusionGemma能够并行处理256个令牌的块，从而避免了顺序解码的瓶颈。该模型通过对Gemma 4模型进行微调而获得，使用了3.8B的激活参数和25.2B的总参数，训练过程高效且节省计算资源。DiffusionGemma在生成速度和模型能力之间建立了新的平衡，能够在单个NVIDIA H100 GPU上每秒生成约1500个输出令牌，显著快于传统的自回归模型。'}}}, {'id': 'https://huggingface.co/papers/2607.29613', 'title': 'WCM: A World Critic Model for Vision-Language-Action Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.29613', 'abstract': "Abstract  Reinforcement learning (RL) post-training of Vision-Language-Action (VLA) models has shown strong promise for robotic manipulation. Among RL methods, critic-based approaches rely on a value estimator that predominantly operates on single-frame observations or single-frame VLM backbone latents, which is a fundamental mismatch with the partially observable nature of robot control. A naive approach to incorporate observation history into the critic incurs exponential complexity with high-dimensional visual space, and still fails because pure scalar-return regression provides insufficient supervision for learning cross-temporal dynamics. We identify the root cause as a state approximation problem: without an explicit world modeling objective, the critic's representation cannot capture the temporal structure needed for accurate value estimation. To address this, we propose the World Critic Model (WCM), built on a lightweight LeJEPA architecture; WCM jointly predicts future latent state and estimates values, such that the critic's representation is explicitly trained to capture temporal dynamics rather than merely regress scalar returns. WCM integrates seamlessly into both on-policy and off-policy training pipelines and is compatible with state-of-the-art VLA backbones including Pi0, Pi0.5, and OpenVLA-OFT. Extensive experiments on 149 tasks across four benchmarks demonstrate that WCM consistently achieves state-of-the-art performance in both in-distribution and out-of-distribution settings, with particularly strong generalization gains. We further validate WCM on seven real-world manipulation tasks using OpenVLA-OFT and Pi0.5 with off-policy RL, confirming stable deployment across diverse settings.", 'score': 22, 'issue_id': 2839, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'c7f7e6f3142b7614', 'authors': ['Senyu Fei', 'Xiaopeng Yu', 'Siyin Wang', 'Xianzhong Zhao', 'Jingjing Gong', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'Shanghai Innovation Institute', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2607.29613.jpg', 'data': {'categories': ['#rl', '#multimodal', '#training', '#robotics', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Критик с моделированием мира для временной динамики в робототехнике', 'desc': 'В статье предложен метод улучшения обучения с подкреплением для робототехнических манипуляторов, использующих модели Vision-Language-Action. Авторы выявили проблему: критики в методах на основе оценки стоимости работают с отдельными кадрами, что не соответствует частичной наблюдаемости в управлении роботами. Решением является World Critic Model, построенная на архитектуре LeJEPA, которая одновременно предсказывает будущие скрытые состояния и оценивает значения, явно обучаясь захватывать временную динамику. Модель успешно интегрируется в on-policy и off-policy обучение и демонстрирует улучшение производительности на 149 задачах и семи реальных манипуляционных задачах.'}, 'en': {'title': 'Enhancing Robotic Learning with Temporal Awareness', 'desc': 'This paper introduces the World Critic Model (WCM) to improve reinforcement learning for robotic manipulation by addressing the limitations of traditional critic-based approaches. The WCM enhances value estimation by jointly predicting future states and capturing temporal dynamics, rather than just regressing scalar returns. This model is designed to work with various Vision-Language-Action (VLA) architectures and can be integrated into both on-policy and off-policy training methods. Experimental results show that WCM outperforms existing methods across multiple tasks, demonstrating its effectiveness in both familiar and novel environments.'}, 'zh': {'title': '提升机器人操作的世界评论者模型', 'desc': '强化学习（RL）在视觉-语言-动作（VLA）模型的后期训练中显示出强大的潜力，尤其是在机器人操作方面。现有的基于评论者的方法主要依赖于单帧观察或单帧VLM骨干的价值估计，这与机器人控制的部分可观察性特性不匹配。我们提出了世界评论者模型（WCM），它通过轻量级的LeJEPA架构共同预测未来的潜在状态并估计价值，从而显著改善了时间动态的捕捉。实验结果表明，WCM在多个基准测试中表现出色，尤其在真实世界的操作任务中也展现了稳定的部署能力。'}}}, {'id': 'https://huggingface.co/papers/2608.02585', 'title': 'GradCuit: Credit-Assigned Gradient Flow Enables Robust and Interpretable Test-Time Latent Reasoning', 'url': 'https://huggingface.co/papers/2608.02585', 'abstract': 'Abstract  Optimization-based latent reasoning improves large language model outputs by optimizing instance-specific continuous states at test time while keeping model parameters frozen. Existing methods, however, typically connect these states to the reasoning trajectory through decoded tokens, making sequence-level credit assignment indirect and obscuring how latent updates shape subsequent reasoning. We introduce GradCuit (gradient through circuit), which inserts optimizable latent states at a selected Transformer layer between the hidden representations of the prompt and the generated continuation. Causal self-attention provides every continuation-token log-probability with a differentiable path to every preceding latent state through the remaining Transformer blocks, enabling reward-weighted gradients from the entire continuation to be assigned directly to the latents. Across five instruction-tuned backbones, three reasoning benchmarks, and two answer formats, GradCuit achieves an average accuracy of 64.5%, outperforming chain-of-thought prompting by 6.6 percentage points and the strongest competing method by 2.4 points. GradCuit also demonstrates greater robustness: across seven learning-rate settings, it consistently outperforms LatentSeek while reducing the standard deviation of accuracy from 1.53 to 0.82, and even its random-walk variant remains competitive with LatentSeek. For interpretability, token-level gradient attribution reveals that latent influence concentrates on reasoning-connector tokens, while layer analysis identifies early-to-middle Transformer layers as the most effective optimization space. By directly optimizing internal reasoning from outcome feedback, GradCuit opens a new axis of robust and interpretable test-time scaling, where LLMs adapt how they reason rather than merely regenerate, sample, or rerank outputs.', 'score': 21, 'issue_id': 2841, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '4105a5d42450886c', 'authors': ['Zhaoxin Yu', 'Qi Shen', 'Hengli Li', 'Zhaowei Zhang', 'Song-Chun Zhu', 'Chi Zhang', 'Zilong Zheng'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'NLCo Lab, Beijing Institute for General Artificial Intelligence', 'School of Artificial Intelligence for Science, Peking University', 'School of Artificial Intelligence, Beijing University of Posts and Telecommunications'], 'pdf_title_img': 'assets/pdf/title_img/2608.02585.jpg', 'data': {'categories': ['#reasoning', '#interpretability', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Оптимизация скрытых рассуждений через прямые градиенты в Трансформерах', 'desc': 'В статье предложен метод GradCuit для оптимизации скрытых состояний больших языковых моделей во время инференции, позволяющий улучшить качество рассуждений модели. Метод вставляет оптимизируемые латентные представления между входными и выходными скрытыми состояниями выбранного слоя Трансформера, при этом архитектура self-attention обеспечивает дифференцируемый путь градиентов от награды целевого выхода к этим латентным переменным. GradCuit превосходит методы цепочки рассуждений и других конкурирующих подходов по точности на бенчмарках рассуждений, демонстрируя при этом большую робастность к гиперпараметрам. Интерпретируемость метода подтверждается анализом градиентов, показывающим, что оптимизация латентных состояний в ранних и средних слоях Трансформера наиболее эффективна для улучшения логики рассуждения модели.'}, 'en': {'title': 'Optimizing Latent States for Enhanced Reasoning in LLMs', 'desc': 'This paper presents GradCuit, a novel method that enhances large language models (LLMs) by optimizing latent states during inference while keeping the model parameters unchanged. Unlike previous approaches that link these states to reasoning through decoded tokens, GradCuit allows for a direct connection between latent states and the reasoning process by inserting them into a specific layer of the Transformer architecture. This method enables the model to receive feedback from the entire output sequence, improving the accuracy of reasoning tasks significantly. GradCuit not only outperforms existing methods but also provides better interpretability and robustness in its performance across various benchmarks.'}, 'zh': {'title': 'GradCuit：优化推理的新方法', 'desc': '本文提出了一种名为GradCuit的优化方法，通过在Transformer层插入可优化的潜在状态，改善大型语言模型的输出。与传统方法不同，GradCuit允许每个生成的标记与之前的潜在状态之间建立可微分的联系，从而实现更直接的信用分配。实验结果表明，GradCuit在多个基准测试中表现优异，准确率平均达到64.5%，超越了现有的最佳方法。此外，GradCuit在不同学习率设置下表现出更高的鲁棒性，且其可解释性分析显示潜在状态对推理连接标记的影响集中。'}}}, {'id': 'https://huggingface.co/papers/2608.01628', 'title': 'Motion Beyond Morphology: Bootstrapping Cross-Category Motion Transfer from Abstract Motion Representations', 'url': 'https://huggingface.co/papers/2608.01628', 'abstract': 'Abstract  Video motion transfer aims to animate a target object using dynamics from a reference video. Existing formulations largely rely on fixed structural correspondence, which becomes ill-defined when reference and target objects differ substantially in morphology, articulation, or deformation mechanisms. We introduce Motion Beyond Morphology, a perspective that seeks to transfer motion beyond fixed structural correspondence, by preserving dynamics that remain meaningful across different target morphologies. To realize this, we propose a two-stage framework. Stage~I learns complementary multi-granularity abstract motion views and uses them to bootstrap cross-category video pairs that preserve transferable dynamics across diverse morphologies. Stage~II internalizes this supervision into direct reference-video-conditioned generation, removing the need for explicit motion extraction at inference. We further introduce OpenVMT-Dataset and OpenVMT-Bench for training and evaluating image- and text-conditioned motion transfer across Same, Near, and Far category gaps, and plan to release both upon acceptance. Extensive experiments demonstrate state-of-the-art motion fidelity and target preservation. Project page: https://miniz233.github.io/MotionBeyondMorphology/', 'score': 20, 'issue_id': 2840, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'a4238946542edcd3', 'authors': ['Zhixue Fang', 'Zhimin Zhang', "Bi'an Du", 'Zijie Meng', 'Yan Zhou', 'Wei Hu', 'Guoxin Zhang', 'Pengfei Wan', 'Kun Gai'], 'affiliations': ['Kling Team, Kuaishou Technology', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.01628.jpg', 'data': {'categories': ['#video', '#dataset', '#multimodal', '#benchmark', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Движение без границ морфологии: передача динамики между разными формами объектов', 'desc': 'Статья представляет новый подход к передаче движения между видео, который работает даже когда исходный и целевой объекты имеют существенно различающуюся морфологию. Авторы предлагают двухэтапную архитектуру: на первом этапе модель изучает многоуровневые абстрактные представления движения, на втором этапе напрямую генерирует анимацию на основе условного видео-ввода. Они также создали новый датасет OpenVMT-Dataset и бенчмарк для оценки передачи движения между объектами разных категорий. Экспериментальные результаты показывают, что метод достигает лучших показателей в сохранении точности движения и целевого объекта.'}, 'en': {'title': 'Animating Any Object: Motion Transfer Beyond Shape', 'desc': 'This paper presents a new approach to video motion transfer that allows for animating a target object using motion from a reference video, even when the objects differ significantly in shape or movement. The authors propose a two-stage framework that first learns various abstract motion representations and then uses these to generate motion that is applicable across different object types. This method eliminates the need for traditional motion extraction during the generation process, making it more efficient. The paper also introduces new datasets for training and evaluating this technique, showing improved performance in maintaining motion quality and object integrity.'}, 'zh': {'title': '超越形态的运动转移', 'desc': '视频运动转移旨在利用参考视频中的动态来动画化目标对象。现有的方法主要依赖于固定的结构对应关系，但当参考对象和目标对象在形态、关节或变形机制上有显著差异时，这种方法会变得不明确。我们提出了超越形态的运动转移视角，旨在通过保留在不同目标形态中仍然有意义的动态，来实现运动转移。我们提出了一个两阶段的框架，第一阶段学习多粒度的抽象运动视图，第二阶段则直接生成参考视频条件下的运动，消除了推理时对显式运动提取的需求。'}}}, {'id': 'https://huggingface.co/papers/2607.28887', 'title': 'To Add Is Machine, To Delete Is Human: Measuring and Mitigating Deletion Avoidance in LLM Code Editing', 'url': 'https://huggingface.co/papers/2607.28887', 'abstract': 'Abstract  Large language models increasingly write and repair production code, yet evidence is mounting that their test-passing patches leave codebases harder to maintain. We identify one concrete source: deletion avoidance, the systematic tendency to retain code that an intended edit requires removing. Across the five leading models on the official SWE-bench Verified leaderboard, deletion recall against the developer patch reaches at most 71.7% even on tasks all five solve, and models reach the right file for over 92% of required deletions but cut the exact line in under 52% of cases. Instead, 29.0% of passing patches wrap the targeted code in a guard or fallback, a pattern we call Guard-and-Go. Such patches pass because the original tests rarely check removal: when we retrofit 34 Verified tasks with tests that fail if the targeted code remains, four frontier models spanning closed and open weights fall from 63.2% to 41.9%. Because real repairs mix removal with addition, we curate CanItDelete, a benchmark of 200 tasks mined from real commits whose entire required edit is deletion. Even with the addition work gone, the best model still fails one task in five, and smaller open models fall to 18.0%. We then ablate GPT-5.6 Sol under four cumulative prompts; success moves little until we supply the exact lines, which nearly eliminate incomplete deletion yet raise success only to 80.5% because the model then deletes beyond the spans or adds code instead. Finally, through a pilot study we show one potential fix: teaching deletion during post-training reduces deletion avoidance and improves broader code-editing performance, suggesting the behavior is undertrained rather than beyond reach.', 'score': 18, 'issue_id': 2844, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '0a71315f35ced3f0', 'authors': ['Amir M. Ebrahimi', 'Mohammed Mehedi Hasan', 'Aaditya Bhatia', 'Gopi Krishnan Rajbahadur', 'Ahmed E. Hassan'], 'affiliations': ['School of Computing, Queens University, Kingston, Ontario, Canada'], 'pdf_title_img': 'assets/pdf/title_img/2607.28887.jpg', 'data': {'categories': ['#optimization', '#dataset', '#plp', '#security', '#training', '#open_source', '#benchmark'], 'emoji': '✂️', 'ru': {'title': 'Почему модели боятся удалять код: проблема избегания удалений в автоматических исправлениях', 'desc': 'В статье исследуется проблема, когда большие языковые модели генерируют исправления кода, которые проходят тесты, но затрудняют поддержку кода. Авторы выявили систематическую тенденцию избегания удаления кода: модели неохотно удаляют нужные строки и вместо этого часто оборачивают код в условное выражение или резервный вариант. Они создали новый бенчмарк CanItDelete с 200 задачами, где требуемое редактирование состоит исключительно из удалений, и показали, что лучшие модели справляются с этим хуже, чем с смешанным редактированием. Исследование доказывает, что проблема вызвана недостаточным обучением моделей удалению кода, а не принципиальными ограничениями, и что специальная подготовка на этапе fine-tuning может значительно улучшить качество исправлений.'}, 'en': {'title': 'Tackling Deletion Avoidance in Code Patching', 'desc': 'This paper investigates the challenges large language models face when generating code patches, particularly their tendency to avoid deleting necessary code. The authors find that while these models can identify the correct files for deletions, they often fail to remove the exact lines needed, leading to maintenance issues in codebases. They introduce a benchmark called CanItDelete, which focuses on tasks that require complete deletion, revealing that even the best models struggle significantly with these tasks. The study suggests that improving model training to emphasize deletion could enhance overall code-editing performance.'}, 'zh': {'title': '教会模型删除，提升代码维护能力', 'desc': '大型语言模型在编写和修复生产代码方面越来越多地被使用，但它们生成的代码补丁往往使代码库更难维护。我们发现一个具体原因是删除回避，即系统性地倾向于保留需要删除的代码。尽管模型能够找到需要删除的文件，但在实际删除时的准确率却很低，许多补丁只是将目标代码包裹在保护或回退结构中。通过后期训练教会模型删除操作，可以减少删除回避现象，从而提高代码编辑的整体性能。'}}}, {'id': 'https://huggingface.co/papers/2607.27042', 'title': 'GPTQ-2D: Cubic-Time Two-Sided Adaptive Rounding', 'url': 'https://huggingface.co/papers/2607.27042', 'abstract': "Abstract  Adaptive rounding methods such as GPTQ, or equivalently Babai's nearest plane algorithm, round a real matrix to integers under a quadratic metric. They process the entries in a fixed order, one at a time, propagating each rounding error to the entries not yet processed through a triangular feedback matrix. We study the two-sided version of this task, in which fixed nonsingular basis matrices act on both the left and the right of the residual; the familiar one-sided case is the special case of an identity right basis. Vectorizing the matrix turns the two-sided objective into a quadratic metric whose Gram matrix is a Kronecker product, so the one-dimensional algorithm applies verbatim, but takes quartic time in the matrix dimension. We present GPTQ-2D, which produces the identical rounded matrix in cubic time. It rounds the entries anti-diagonal by anti-diagonal; entries on the same anti-diagonal are independent and are rounded in parallel.", 'score': 18, 'issue_id': 2841, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '60f2de3d4f02e86f', 'authors': ['Jiale Chen', 'Torsten Hoefler', 'Dan Alistarh'], 'affiliations': ['ETH Zürich', 'Institute of Science and Technology Austria (ISTA)', 'Red Hat AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.27042.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Ускоренное двустороннее округление матриц через параллельную обработку антидиагоналей', 'desc': 'В работе изучается задача адаптивного округления матриц, обобщающая алгоритм GPTQ на двусторонний случай, когда базисные матрицы действуют как слева, так и справа. Авторы показывают, что векторизация матрицы преобразует двустороннюю целевую функцию в квадратичную метрику с матрицей Грама в виде произведения Кронекера. Предложенный алгоритм GPTQ-2D достигает той же точности округления, но с кубической вычислительной сложностью вместо четвёртой степени, благодаря параллельному округлению элементов по антидиагоналям. Это решение применимо к квантизации больших нейросетей и компрессии данных с контролируемой ошибкой.'}, 'en': {'title': 'Efficient Matrix Rounding with GPTQ-2D', 'desc': 'This paper introduces GPTQ-2D, an adaptive rounding method that efficiently rounds a real matrix to integers using a two-sided approach. Unlike traditional methods that process entries sequentially, GPTQ-2D rounds entries on the anti-diagonal in parallel, significantly reducing computation time. The method leverages a quadratic metric and a Kronecker product to maintain accuracy while improving efficiency. By doing so, it achieves the same results as previous algorithms but operates in cubic time instead of quartic time, making it more suitable for larger matrices.'}, 'zh': {'title': '高效的双侧舍入方法GPTQ-2D', 'desc': '自适应舍入方法如GPTQ，或等价于Babai的最近平面算法，可以在二次度量下将实矩阵舍入为整数。该方法按固定顺序逐个处理矩阵的条目，并通过三角反馈矩阵将每个舍入误差传播到尚未处理的条目。我们研究了该任务的双侧版本，其中固定的非奇异基矩阵同时作用于残差的左侧和右侧；而熟悉的单侧情况是右侧基为单位矩阵的特例。我们提出了GPTQ-2D，它以立方时间生成相同的舍入矩阵，通过反对角线逐个舍入条目，且同一反对角线上的条目是独立的，可以并行舍入。'}}}, {'id': 'https://huggingface.co/papers/2608.01973', 'title': 'Roomer: Reflective Object-Grounded Model Editing and Repair for 3D Indoor Layout Synthesis', 'url': 'https://huggingface.co/papers/2608.01973', 'abstract': "Abstract  Existing indoor layout generators produce globally plausible layouts yet may retain local violations such as collisions, out-of-bounds placements, obstructed openings, and blocked circulation. Most prior work focuses on full-scene synthesis or scene-level optimization, with limited support for identifying responsible objects and locally repairing affected regions. We present Roomer, a reflective repair framework that casts these violations as sparse, object-grounded repair problems. Roomer encodes layouts as ``RoState'' and uses ``RoReview'' to bind measured violations to implicated objects. A geometry-conditioned vision-language model planner proposes a structured local edit, while a deterministic solver validates it and generates a finite set of candidate edits when needed. Each candidate is committed only if full-scene verification confirms that it resolves the target violation without new hard violations or broken protected constraints. We train the planner on Roomer-CC, a controlled-corruption dataset that pairs faulty layouts with object-grounded violation evidence and known-feasible inverse StatePatches. Since existing benchmarks rarely assess whether physically valid layouts are usable, we introduce Roomer-Eval to assess distributional quality, physical validity, and practical usability. Experiments show that Roomer repairs residual violations while preserving valid regions, improves physical validity and usability, and transfers across external generators.", 'score': 16, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '1bfea2972109a104', 'authors': ['Lingwei Dang', 'Ziyan Qiu', 'Jiajia Cheng', 'Shishuo Shang', 'Zhenhao Zhang', 'Yufei Zhu', 'Qingxin Xiao', 'Pan Liu', 'Shenghui Huang', 'Yun Hao', 'Juntong Li', 'Qingyao Wu'], 'affiliations': ['School of Information Science and Technology, ShanghaiTech University', 'School of Software Engineering, South China University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.01973.jpg', 'data': {'categories': ['#benchmark', '#cv', '#multimodal', '#dataset'], 'emoji': '🏠', 'ru': {'title': 'Локальное восстановление планировок помещений через обоснованное редактирование', 'desc': 'В статье представлена система Roomer для исправления локальных нарушений в сгенерированных планировках помещений, таких как коллизии объектов и перекрытие проходов. Система использует vision-language модель для предложения структурированных локальных редактирований и детерминированный решатель для проверки их корректности. Авторы создали специальный датасет Roomer-CC для обучения модели на парах ошибочных планировок с аннотациями нарушений. Предложен также новый бенчмарк Roomer-Eval для оценки не только физической валидности, но и практической удобства использования сгенерированных сцен.'}, 'en': {'title': 'Roomer: Smart Fixes for Indoor Layouts', 'desc': 'The paper introduces Roomer, a framework designed to fix local layout violations in indoor spaces, such as collisions and blocked openings. It treats these issues as specific problems linked to individual objects, allowing for targeted repairs. Roomer uses a combination of a geometry-conditioned vision-language model and a deterministic solver to propose and validate local edits to the layout. The framework is trained on a dataset that includes faulty layouts and their corresponding violation evidence, and it also introduces a new evaluation method to ensure the usability and physical validity of the generated layouts.'}, 'zh': {'title': 'Roomer：智能室内布局修复框架', 'desc': '本文介绍了一种名为Roomer的室内布局修复框架，旨在解决现有布局生成器在局部区域存在的违规问题，如碰撞和阻塞。Roomer将这些违规视为稀疏的、与对象相关的修复问题，通过编码布局为“RoState”并使用“RoReview”将违规与相关对象绑定。该框架利用几何条件的视觉-语言模型规划器提出结构化的局部编辑，并通过确定性求解器验证这些编辑。实验表明，Roomer能够修复剩余的违规，同时保持有效区域，提高物理有效性和可用性。'}}}, {'id': 'https://huggingface.co/papers/2608.01827', 'title': 'DeepVoyager-VL: Incentivizing Vision-in-the-Loop Search for Long-Horizon Multimodal Agents', 'url': 'https://h
