    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.15779', 'title': 'EvoOntology: A Self-Evolving Ontology Layer for Data Agents', 'url': 'https://huggingface.co/papers/2609.15779', 'abstract': 'Abstract  Data agents aim to fulfill natural-language instructions over heterogeneous data, including tables, files, and databases. However, data agents face a challenging agent-data gap: heterogeneous data resides outside the agent, while the agent can access it (e.g., column names and file paths) only through generic tools. Existing approaches either let agents directly explore raw data sources or inject manually constructed semantic layers into prompts. However, neither scales well to large heterogeneous data sources nor adapts to different agent behaviors. In this paper, we introduce EvoOntology, a self-evolving ontology layer for data agents. EvoOntology encapsulates the ontology as an MCP server comprising a schema layer, a content layer, and a tool layer, enabling agents to actively query and interact with the ontology at runtime. To this end, we introduce a builder agent for autonomous ontology construction and a self-evolution loop that continuously refines the ontology through attribution-guided typed edits that are accepted only after a backbone-conditional paired evaluation. Experiments on three well-adopted data-agent benchmarks with four LLM backbones demonstrate that EvoOntology consistently outperforms strong baselines and existing semantic-layer approaches, effectively bridging the agent-data gap and enabling more effective interaction with heterogeneous data. Code: https://github.com/ruc-datalab/EvoOntology', 'score': 56, 'issue_id': 3309, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': 'ffba81bfe21c8cbd', 'authors': ['Meiduo Chong', 'Shaolei Zhang', 'Ju Fan', 'Xiaoyong Du'], 'affiliations': ['Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.15779.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#agents'], 'emoji': '🧬', 'ru': {'title': 'Самоэволюционирующая онтология для умного доступа к разнородным данным', 'desc': 'Статья представляет EvoOntology — самоэволюционирующий слой онтологии для агентов, работающих с разнородными данными (таблицы, файлы, базы данных). Основная проблема заключается в разрыве между агентом и данными: агент может получать доступ к данным только через универсальные инструменты, что затрудняет работу с большими и сложными источниками. Решение использует MCP-сервер с архитектурой из трех слоев (схема, содержание, инструменты) и автономного агента-построителя, который непрерывно совершенствует онтологию на основе оценки. Экспериментальные результаты показывают, что подход существенно превосходит базовые решения и эффективнее взаимодействует с гетерогенными данными при работе различных LLM.'}, 'en': {'title': 'EvoOntology: Bridging the Agent-Data Gap for Enhanced Data Interaction', 'desc': "This paper presents EvoOntology, a novel approach to enhance data agents' ability to process diverse data types like tables and databases. It addresses the agent-data gap by providing a self-evolving ontology that allows agents to interact with data more effectively. The system includes a schema, content, and tool layer, enabling real-time querying and interaction. Experiments show that EvoOntology significantly improves performance compared to existing methods, making data agents more efficient in handling heterogeneous data."}, 'zh': {'title': 'EvoOntology：缩小代理与数据之间的差距', 'desc': '数据代理旨在根据自然语言指令处理异构数据，包括表格、文件和数据库。然而，数据代理面临着代理与数据之间的差距：异构数据存在于代理之外，代理只能通过通用工具访问这些数据（例如列名和文件路径）。现有方法要么让代理直接探索原始数据源，要么在提示中注入手动构建的语义层，但这两种方法都无法很好地扩展到大型异构数据源或适应不同的代理行为。本文介绍了EvoOntology，一个自我演化的本体层，能够帮助数据代理在运行时主动查询和与本体交互，从而有效地缩小代理与数据之间的差距。'}}}, {'id': 'https://huggingface.co/papers/2609.05571', 'title': 'Grounded Skill Synthesis from Code at Scale for Agentic Intelligence', 'url': 'https://huggingface.co/papers/2609.05571', 'abstract': 'Abstract Code2Skill automatically extracts verifiable procedural skills from source code to improve agent performance before interaction experience accumulates.  Generated by thinkingmachines/Inkling-Small Reusable skills give agents transferable procedural knowledge, making scalable acquisition essential for extending agents beyond prior experience. Existing methods face two limitations: trajectory-based synthesis requires interactions with specific environments, while document-derived skills may lack executable evidence and verification. Source code offers a complementary path: it requires no prior agent experience yet provides executable evidence for grounding abstractions. We present Code2Skill, a fully automated pipeline that transforms selected code units into implementation-anchored records of atomic operations, composite workflows, and recurring patterns, then verifies each record through source-body-blind reconstruction and source-aware comparison. Applied to 19,769 popular, actively maintained GitHub repositories, Code2Skill produces CodeSkillBank, a grounded bank of 1,006,822 accepted records with workflow, boundary, provenance, and source-evidence metadata. Across 72 protocol-matched evaluations covering nine model settings and eight benchmarks, models augmented with retrieved CodeSkillBank skills improve by 11.7% on average over matched baselines and outperform them in 57 cases. Under a unified downstream interface, Code2Skill also outperforms trajectory-derived skill banks on all seven shared benchmarks, showing that repository-derived skills can provide useful procedural knowledge before agents accumulate sufficient interaction experience. Skills synthesized from tested AI-generated code achieve a 93.50% pass rate, compared with 93.00% for human-written code, providing initial evidence that the pipeline can expand with the growing volume of AI-generated software. Overall, Code2Skill transforms procedural knowledge embedded in repositories into grounded, verifiable, and transferable agent skills.', 'score': 54, 'issue_id': 3308, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '6f3547451365584a', 'authors': ['Yongqi Tong', 'Pan Wang', 'Hang Wang', 'Jianshe Li', 'Xin Zhang', 'Jiang-Ming Yang', 'Wei Wu'], 'affiliations': ['Ant International'], 'pdf_title_img': 'assets/pdf/title_img/2609.05571.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#agents'], 'emoji': '💾', 'ru': {'title': 'Извлечение переиспользуемых навыков из кода для трансфера знаний AI агентам', 'desc': 'Code2Skill — это автоматизированная система, которая извлекает процедурные навыки из исходного кода для улучшения производительности AI агентов без необходимости предварительного взаимодействия с окружением. Метод преобразует единицы кода в проверяемые записи об атомарных операциях, композитных workflow и повторяющихся паттернах, используя верификацию через слепую реконструкцию и сравнение с исходным кодом. На основе анализа 19 769 популярных GitHub репозиториев была создана CodeSkillBank — база из более чем миллиона верифицированных записей навыков с метаданными о workflow, граница применения и источниках. Экспериментальные результаты показывают, что модели, дополненные навыками из CodeSkillBank, достигают в среднем 11.7% улучшения производительности и превосходят базовые модели в 57 из 72 тестовых сценариев.'}, 'en': {'title': 'Unlocking Agent Potential with Code2Skill', 'desc': 'Code2Skill is a machine learning framework that extracts actionable skills from source code to enhance the performance of agents before they gain experience through interaction. It addresses limitations of existing methods by using source code, which provides executable evidence for skills without requiring prior agent experience. The framework generates a comprehensive database called CodeSkillBank, containing over a million verified procedural skills from popular GitHub repositories. By integrating these skills, agents show significant performance improvements in various benchmarks, demonstrating the effectiveness of repository-derived knowledge in training AI systems.'}, 'zh': {'title': '从代码中提取可转移的智能体技能', 'desc': 'Code2Skill 是一个自动化工具，可以从源代码中提取可验证的程序技能，以提高智能体在积累交互经验之前的表现。它通过将选定的代码单元转化为基于实现的原子操作记录和复合工作流，提供可转移的程序知识。与现有方法相比，Code2Skill 不需要特定环境的交互，且提供可执行的证据来验证技能。通过对 19,769 个 GitHub 仓库的应用，Code2Skill 生成了一个包含 1,006,822 条记录的技能库，显著提升了模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.22000', 'title': 'RecreationWorld: Scalable and Verifiable Environments for Hybrid Computer-Use Agents', 'url': 'https://huggingface.co/papers/2609.22000', 'abstract': 'Abstract  Computer-use agents (CUAs) have advanced along two separate lines: graphical interaction and software development through code and the command line. Real digital work requires both, interleaved rather than stacked end to end. We study hybrid CUAs that autonomously decide when to explore an interface, implement software, and run and visually verify their artifacts. We introduce RecreationWorld, a five-platform framework built around recreation: given a running reference, an agent must discover its behavior and build a faithful implementation with no prescribed workflow. RecreationWorld provides reproducible environments on Ubuntu, macOS, Windows, Android, and Web, plus a unified harness with native GUI control and coding tools. The running reference serves as an oracle for hidden behavioral tests, providing execution-grounded rewards. We scale trajectory generation with high-quality open-source applications. Models trained on these trajectories improve across five out-of-distribution coding and hybrid computer-use benchmarks and more frequently verify their rendered outputs, providing evidence of transfer beyond recreation. For held-out evaluation, we introduce RecreationBench, comprising 250 diverse tasks across domains and platforms. Reference-grounded programmatic and visual assertions cover action-conditioned outcomes at multiple interaction depths; each is validated on the reference and by human reviewers before the suite is frozen for automatic scoring. GPT-6 Astra leads at 58.1% overall, but passes all programmatic tests on just 2.8% of tasks. Agents reproduce static interface structure more reliably than interactions and computed outputs, while generated applications remain smaller and more monolithic than their references. We release the benchmark, environments, and test suites.', 'score': 48, 'issue_id': 3308, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': 'fd3e2482dc316ba1', 'authors': ['Shuai Bai', 'Jiayong Deng', 'Yikun Fu', 'Chang Gao', 'Xuhao Hu', 'Mianqiu Huang', 'Yizhen Jiang', 'Yuheng Jing', 'Dehui Kong', 'Keliang Li', 'Ning Li', 'Wanli Li', 'Dayiheng Liu', 'Dunjie Lu', 'Changwei Luo', 'Que Shen', 'Zheyuan Wang', 'Zijian Wang', 'Jie Wu', 'Gao Wu', 'Zhihui Xie', 'Rui Xie', 'Haiyang Xu', 'An Yang', 'Jiakang Yuan', 'Yanming Zhang', 'Jiajun Zhang', 'Xi Zhang', 'Zhenru Zhang', 'Zhuo Zhen', 'Mingkang Zhu', 'Bowen Zhou'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2609.22000.jpg', 'data': {'categories': ['#games', '#benchmark', '#multimodal', '#cv', '#dataset', '#open_source', '#optimization', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Гибридные агенты, которые одновременно кодят и управляют интерфейсом', 'desc': 'В работе представлены гибридные агенты для компьютерного взаимодействия, которые могут одновременно работать с графическими интерфейсами и писать код. Авторы создали RecreationWorld — фреймворк с пятью платформами, где агент должен понять поведение запущенной программы и создать её функциональную копию без предписанного сценария. Модели обучаются на траекториях взаимодействия с реальными открытыми приложениями и демонстрируют улучшения на бенчмарках гибридного компьютерного взаимодействия. Для оценки представлен RecreationBench с 250 разнообразными задачами, включающими программные и визуальные проверки корректности на нескольких уровнях взаимодействия.'}, 'en': {'title': 'Empowering Agents with Hybrid Learning in RecreationWorld', 'desc': 'This paper presents a study on hybrid computer-use agents (CUAs) that can autonomously navigate both graphical interfaces and software development tasks. The authors introduce RecreationWorld, a versatile framework that allows agents to learn from a running reference by discovering behaviors and creating implementations without a fixed workflow. The framework supports multiple platforms and provides a unified environment for testing and validating agent performance through execution-grounded rewards. The results show that models trained in this setting can effectively transfer their learning to various coding and interaction tasks, demonstrating improved performance across diverse benchmarks.'}, 'zh': {'title': '混合计算机使用代理的创新研究', 'desc': '本文研究了混合计算机使用代理（CUAs），这些代理能够自主决定何时探索界面、实现软件并运行和验证其产物。我们引入了RecreationWorld，这是一个基于娱乐的五平台框架，允许代理在没有预设工作流程的情况下发现行为并构建忠实实现。通过高质量的开源应用程序，我们扩展了轨迹生成，并在五个不同的编码和混合计算机使用基准上提高了模型的表现。我们还推出了RecreationBench，包含250个多样化任务，提供了基于参考的程序性和视觉断言，以便进行自动评分。'}}}, {'id': 'https://huggingface.co/papers/2609.22068', 'title': 'CodeMidas: Scaling Agentic Coding RL Environments from Code Itself', 'url': 'https://huggingface.co/papers/2609.22068', 'abstract': 'Abstract  Training capable coding agents via reinforcement learning (RL) requires diverse tasks with reliable verifiers. Open-source codebases offer a rich source of such tasks, while existing methods typically rely on development artifacts such as issues and commits, limiting the range of tasks that can be extracted. To better scale RL environments, we present CodeMidas, an agentic pipeline that turns implemented functionality in existing codebases into executable RL environments using source code as its only task-specific input. CodeMidas allocates agentic compute to every stage of environment construction: agents explore implemented functionality to formulate behavioral specifications, construct tests grounded in execution of the original code, and validate and filter candidate tasks through execution checks and repeated solution rollouts. The resulting dataset has 5,545 training tasks from 3,185 open-source codebases spanning 23 programming languages and 15 technical domains. Training MiMo-V2.5 on these tasks with GRPO improves performance on all five diverse benchmarks, covering issue repair (DeepSWE + 11.7%), whole-program construction (ProgramBench +17%), and terminal work (Terminal-Bench v2.1 +8.5%). Ablations show that increasing the number of high-quality training tasks improves performance. Trajectory analysis shows the RL-trained agent demonstrates better behaviors like increasing codebase exploration and more diverse self-verification. These results establish source code as a scalable foundation for constructing RL environments that improve coding agents across diverse software tasks.', 'score': 41, 'issue_id': 3309, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': '4b2475f9274054f8', 'authors': ['Bowen Ye', 'Lei Li', 'Shicheng Li', 'Zihao Yue', 'Linghao Zhang', 'Hanglong Lv', 'Yuanxin Liu', 'Wenhan Ma', 'Hao Tian', 'Rang Li', 'Jinhao Dong', 'Yikai Zhao', 'Xiangwei Deng', 'Hailin Zhang', 'Liang Zhao', 'Qi Liu', 'Lingpeng Kong', 'Tong Yang', 'Fuli Luo'], 'affiliations': ['LLM Core, Xiaomi', 'Peking University', 'Renmin University of China', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.22068.jpg', 'data': {'categories': ['#plp', '#reasoning', '#benchmark', '#dataset', '#training', '#agents', '#open_source', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Автоматизированное создание сред обучения кодовых агентов из исходного кода', 'desc': 'В статье представлена система CodeMidas, которая автоматически создаёт среды обучения с подкреплением для агентов разработки кода, используя только исходный код существующих проектов. Агентская система проходит несколько этапов: исследует функциональность кода, формирует спецификации поведения, генерирует тесты на основе исходного кода и валидирует задачи через проверку выполнения. На построенном датасете из 5,545 задач авторы обучили модель MiMo-V2.5 с использованием алгоритма GRPO, достигнув улучшений на всех тестовых бенчмарках. Результаты показывают, что увеличение количества высокачественных задач для обучения с подкреплением улучшает способность агента к исследованию кодовой базы и разнообразной самопроверке.'}, 'en': {'title': 'CodeMidas: Unlocking Coding Agents with Open-Source Tasks', 'desc': 'This paper introduces CodeMidas, a novel approach for training coding agents using reinforcement learning (RL) by leveraging existing open-source codebases. CodeMidas transforms implemented functionalities in code into executable RL environments, allowing for a broader range of tasks beyond traditional methods that rely on development artifacts. The pipeline includes agents that explore code to create behavioral specifications, generate tests, and validate tasks through execution checks. The results show that training on a diverse dataset of over 5,500 tasks significantly enhances the performance of coding agents across various benchmarks, demonstrating the effectiveness of using source code for RL training.'}, 'zh': {'title': '源代码：构建强化学习环境的新基础', 'desc': '本论文介绍了一种名为CodeMidas的系统，它通过强化学习（RL）将现有代码库中的功能转化为可执行的RL环境。该系统利用源代码作为唯一的任务特定输入，自动生成多样化的训练任务。通过对3,185个开源代码库的5,545个任务进行训练，CodeMidas显著提升了编码代理在多个基准测试中的表现。研究表明，增加高质量训练任务的数量可以进一步提高性能，且RL训练的代理在代码库探索和自我验证方面表现出更好的行为。'}}}, {'id': 'https://huggingface.co/papers/2609.20816', 'title': 'Paint-Anything: Unified Any-Color Control for Image Generation and Editing', 'url': 'https://huggingface.co/papers/2609.20816', 'abstract': "Abstract  Professional design requires any-color control: the ability to specify an object's target color with any 24-bit hex value for image generation and editing. Prior work has explored color generation, editing, and colorization, but often relies on dedicated color representations or specialized inference procedures. Advances in large language models offer a simpler starting point: even compact models can associate hex values with color semantics. We present Paint-Anything, which learns a shared hex-prompt interface for generation and editing through object-level color supervision. We develop a data pipeline that constructs Paint-500K from real images through object grounding, perceptual color labeling, and editing-pair synthesis. Since shadows make real-image labels only approximate colors, we complement this supervision with pure-color anchors whose pixels exactly match their paired hex values. These anchors are used only at high-noise timesteps, leaving low-noise training to natural images. We further introduce Any Color Benchmark (ACBench), comprising ACBench-T2I and ACBench-Edit, to measure object-level hex color fidelity across both tasks. On FLUX.2-4B, Paint-Anything improves ACBench-T2I and ACBench-Edit scores by 85.3% and 28.3%, respectively, relative to the base model, with ablations supporting the training recipe. It also achieves the highest average CompColor score among the compared methods.", 'score': 22, 'issue_id': 3309, 'pub_date': '2026-09-17', 'pub_date_card': {'ru': '17 сентября', 'en': 'September 17', 'zh': '9月17日'}, 'hash': '117c25973c40c286', 'authors': ['Ji Xie', 'Dewei Zhou', 'Xinyu Huang', 'Zhennan Chen', 'Xun Wang'], 'affiliations': ['ByteDance', 'Nanjing University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.20816.jpg', 'data': {'categories': ['#training', '#dataset', '#benchmark', '#multimodal'], 'emoji': '🎨', 'ru': {'title': 'Точное управление цветом в нейросетевой генерации и редактировании изображений', 'desc': 'В этой работе предложен метод Paint-Anything для точного управления цветом объектов в задачах генерации и редактирования изображений с использованием 24-битных hex-значений. Авторы разработали данные Paint-500K путём разметки реальных изображений и добавили синтетические "якоря" чистого цвета для улучшения обучения на высоких уровнях шума. Для оценки качества работы введены бенчмарки ACBench-T2I и ACBench-Edit, измеряющие точность воспроизведения цвета на уровне объектов. На модели FLUX.2-4B метод достигает значительного улучшения: на 85.3% для генерации и на 28.3% для редактирования по сравнению с базовой моделью.'}, 'en': {'title': 'Paint-Anything: Mastering Any Color for Image Generation and Editing', 'desc': 'The paper introduces Paint-Anything, a machine learning model designed for precise color generation and editing using any 24-bit hex color code. It leverages a shared hex-prompt interface and object-level color supervision to enhance the accuracy of color representation in images. The model is trained on a large dataset called Paint-500K, which combines real images with color labels and editing pairs, while also using pure-color anchors to improve color fidelity. The results show significant improvements in color accuracy for both image generation and editing tasks, as measured by the Any Color Benchmark (ACBench).'}, 'zh': {'title': '任意颜色控制的图像生成与编辑', 'desc': '本论文介绍了一种名为Paint-Anything的模型，旨在实现对图像生成和编辑中任意颜色的控制。该模型通过对象级颜色监督学习共享的十六进制提示接口，简化了颜色生成和编辑的过程。我们构建了一个数据管道Paint-500K，利用真实图像进行对象定位、感知颜色标记和编辑对合成。实验结果表明，Paint-Anything在ACBench-T2I和ACBench-Edit任务中显著提高了颜色保真度，展示了其在专业设计中的应用潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.22069', 'title': 'OmniVBench: A Benchmark and Large-Scale Dataset for Omni Reference-to-Video Generation', 'url': 'https://huggingface.co/papers/2609.22069', 'abstract': 'Abstract  Reference-to-video (R2V) generation is evolving toward increasingly general and versatile reference control, giving rise to the emerging paradigm of omni R2V generation. However, existing benchmarks fall short of these emerging capabilities: their test cases cover limited reference types and compositions, and their evaluation protocols largely assess holistic reference consistency, overlooking whether reference factors are properly preserved, disentangled, and routed. Meanwhile, the high cost of constructing omni R2V training data makes suitable training resources scarce. To address these gaps, we introduce OmniVBench and the Omni-R2V Dataset for evaluating and training omni R2V models. OmniVBench expands R2V evaluation across broader reference types, fine-grained control tasks, and richer reference compositions, covering 7 task families and 18 fine-grained tasks spanning content, motion, style, structure, narrative, and multi-reference settings. We introduce factor-grounded evaluation with 12,172 case-specific checklist items, assessing whether intended reference factors are faithfully preserved, correctly disentangled and bound to their targets, and properly realized according to the instruction. We further introduce the Omni-R2V Dataset, bringing industrial-grade training resources for diverse R2V tasks to the broader research community. Drawing primarily on a large-scale corpus of professional video footage, it comprises 340K processed training samples spanning diverse reference types and multi-reference compositions. We develop task-specific pipelines for reference-target pair construction, offering a practical and scalable recipe for omni R2V data construction. Extensive evaluation of advanced open- and closed-source R2V models reveals clear performance gaps across task families and evaluation dimensions on OmniVBench, highlighting remaining limitations of current R2V models.', 'score': 9, 'issue_id': 3308, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': '5be9996ae32e5078', 'authors': ['Wenxue Li', 'Peiyan Guan', 'Haoyang Jiang', 'Junxian Cai', 'Hualuo Liu', 'Chunjie Zhang', 'Chong Guan', 'Songlian Li', 'Taiyi Wu', 'Yongjian Yu', 'Xiaotong Zhao', 'Alan Zhao', 'Eric Liu', 'Xi Chen', 'Yu Liu', 'Lei Zhu'], 'affiliations': ['Online Video BU, Tencent', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2609.22069.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#synthetic', '#video', '#dataset', '#diffusion', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Комплексная система для контролируемой генерации видео по многообразным референсам', 'desc': 'Статья представляет OmniVBench и Omni-R2V Dataset для оценки и обучения моделей генерации видео по референсам (Reference-to-Video). Авторы разработали комплексный бенчмарк, охватывающий 7 семейств задач и 18 детализированных подзадач, включая контроль контента, движения, стиля и структуры. Введена факторная оценка с более чем 12 тысячами контрольных списков для проверки правильности сохранения и разделения референсных факторов. Создан индустриальный датасет из 340 тысяч обучающих примеров с разными типами референсов и композициями для масштабируемого обучения моделей.'}, 'en': {'title': 'Empowering R2V Models with OmniVBench and Omni-R2V Dataset', 'desc': 'This paper introduces a new framework for evaluating and training reference-to-video (R2V) models called OmniVBench and the Omni-R2V Dataset. It addresses the limitations of existing benchmarks by expanding the types of references and tasks evaluated, ensuring that models can handle a variety of content, motion, style, and narrative elements. The authors propose a factor-grounded evaluation method to assess how well models preserve and disentangle reference factors in their outputs. Additionally, the Omni-R2V Dataset provides a large-scale collection of training samples, facilitating the development of more robust R2V models.'}, 'zh': {'title': '推动参考视频生成的全面评估与训练', 'desc': '本文介绍了一种新的参考视频生成（R2V）评估和训练框架，称为OmniVBench和Omni-R2V数据集。现有的R2V基准测试无法满足日益增长的多样化参考控制需求，缺乏对参考因素的细致评估。OmniVBench扩展了评估范围，涵盖了多种参考类型和细粒度控制任务，并引入了基于因素的评估方法。Omni-R2V数据集则提供了丰富的训练资源，支持多样化的R2V任务，推动了该领域的研究进展。'}}}, {'id': 'https://huggingface.co/papers/2609.21749', 'title': 'GraphSkillEvo: Evolutionary Optimization of Graph-Structured Agent Skills', 'url': 'https://huggingface.co/papers/2609.21749', 'abstract': 'Abstract  Skills can improve the performance of Large Language Model (LLM) agents by providing task-specific procedural guidance, while skill optimization further improves their effectiveness through iterative refinement. However, existing skill optimization methods typically represent skills as unstructured natural-language instructions, creating two key challenges: 1) Unstructured skills often lack explicit workflow-level guidance and contain substantial redundancy, making them difficult for LLMs to execute; 2) the vast search space of unconstrained natural-language skills makes skill optimization ineffective. To address these challenges, we propose representing skills as graph-structured natural-language artifacts. In graph-structured skills, each node represents an execution step together with its operational guidance, while directed edges encode context-dependent transitions between steps. Compared to unstructured skills, graph-structured skills can provide clear workflow-level guidance. Moreover, the proposed graph-structured skill can also facilitate skill optimization. Building on this structured representation, we introduce GraphSkillEvo, a population-based evolutionary optimization framework with mutation and crossover operators for graph-structured skills. By maintaining multiple candidate skills and combining effective components, GraphSkillEvo enables broader and more comprehensive exploration of the structured skill space than purely LLM-based iterative self-refinement. Extensive experiments across five agent benchmarks demonstrate that GraphSkillEvo consistently outperforms the strong skill optimization baseline SkillOpt, improving average accuracy by 4.01% on GPT-5.4-nano and 1.76% on GPT-5.4. Our code is available at https://github.com/ruisun7/GraphSkillEvo.', 'score': 8, 'issue_id': 3308, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': '65d06aabbc10f947', 'authors': ['Rui Sun', 'Zhi Zheng', 'Zhenkun Wang', 'Zhichao Lu'], 'affiliations': ['City University of Hong Kong', 'National University of Singapore', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.21749.jpg', 'data': {'categories': ['#open_source', '#optimization', '#graphs'], 'emoji': '🧬', 'ru': {'title': 'Эволюционная оптимизация графических навыков для агентов LLM', 'desc': 'В статье предложен новый подход к представлению навыков для агентов на основе больших языковых моделей в виде графических структур вместо неструктурированного естественного языка. Граф-структурированные навыки содержат узлы с шагами выполнения и рёбра для кодирования контекстно-зависимых переходов между ними, что обеспечивает лучшее руководство для выполнения задач. На основе этого представления авторы разработали GraphSkillEvo — фреймворк эволюционной оптимизации с популяционными алгоритмами, использующий операторы мутации и кроссовера для улучшения навыков. Экспериментальные результаты на пяти бенчмарках показывают устойчивое превосходство GraphSkillEvo над базовым методом, улучшая точность на 4.01% и 1.76% в зависимости от модели.'}, 'en': {'title': 'Graph-Structured Skills: Enhancing LLM Performance through Structured Guidance', 'desc': 'This paper introduces a new way to improve Large Language Model (LLM) agents by using graph-structured skills instead of traditional unstructured natural-language instructions. By representing skills as graphs, where each node is a step with guidance and edges show how to move between steps, the authors provide clearer workflow guidance for LLMs. They also present GraphSkillEvo, an evolutionary optimization framework that enhances skill optimization by exploring a wider range of structured skills through mutation and crossover techniques. Experimental results show that this approach significantly improves the performance of LLMs compared to existing methods, demonstrating its effectiveness in skill optimization.'}, 'zh': {'title': '图结构技能优化：提升LLM性能的新方法', 'desc': '本论文提出了一种新的技能表示方法，通过图结构的自然语言来优化大型语言模型（LLM）代理的技能。每个节点代表一个执行步骤及其操作指导，而有向边则编码步骤之间的上下文依赖关系。这种图结构的技能提供了清晰的工作流程指导，并且有助于技能的优化。我们还引入了GraphSkillEvo，一个基于种群的进化优化框架，能够在结构化技能空间中进行更广泛的探索，实验结果表明其在多个基准测试中优于传统的技能优化方法。'}}}, {'id': 'https://huggingface.co/papers/2609.22083', 'title': 'MintAct: A Unified Visual Agent for Digital Environments', 'url': 'https://huggingface.co/papers/2609.22083', 'abstract': 'Abstract  We present MintAct, a family of vision-language models that unifies UI grounding, multi-step navigation across mobile, desktop, and web, and visual tool use, trained at 2B, 4B, and 8B scales. Through careful design of our environments, data, and training recipes, MintAct models match the performance of per-domain specialists across all of these capabilities. To enable this, we develop a scalable environment and reinforcement learning (RL) infrastructure. On the environment side, we host hundreds of concurrent instances across heterogeneous per-domain backends, serving both trajectory data collection and online RL. To enable efficient and scalable RL training, an asynchronous framework keeps explicit control over the cross-domain training distribution and remains stable under noisy environment feedback and off-policy drift. Experimental results show that MintAct achieves state-of-the-art performance (48.9 on OSWorld-Verified) across a wide range of benchmarks at comparable model sizes.', 'score': 6, 'issue_id': 3308, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': '0a9e3a40fd79a0e1', 'pdf_title_img': 'assets/pdf/title_img/2609.22083.jpg', 'data': {'categories': ['#training', '#benchmark', '#multimodal', '#small_models', '#rl', '#cv', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Универсальный агент для взаимодействия с цифровыми интерфейсами через обучение с подкреплением', 'desc': 'В работе представлена MintAct — семейство vision-language моделей, объединяющих грундирование UI, навигацию по мобильным и веб-приложениям, а также использование визуальных инструментов в единой системе. Модели обучены методом обучения с подкреплением на масштабируемой инфраструктуре, которая управляет сотнями одновременных сессий приложений и собирает данные траекторий в реальном времени. Разработанный асинхронный фреймворк обеспечивает стабильное обучение при наличии шума в обратной связи окружения и проблем смещения вне политики. Модель достигает наилучших результатов на бенчмарках, включая OSWorld-Verified (48.9 балла), конкурируя со специализированными системами для отдельных доменов.'}, 'en': {'title': 'MintAct: Unifying Vision-Language Tasks with Scalable Reinforcement Learning', 'desc': 'MintAct is a set of advanced vision-language models designed to handle various tasks like UI grounding and multi-step navigation on different platforms. It achieves high performance by integrating specialized training environments and reinforcement learning techniques. The models are trained at different scales (2B, 4B, and 8B parameters) and are capable of competing with domain-specific models in multiple tasks. The innovative asynchronous framework allows for efficient training while managing the complexities of cross-domain data and feedback.'}, 'zh': {'title': 'MintAct：统一多领域的视觉-语言模型', 'desc': 'MintAct是一种视觉-语言模型家族，能够统一用户界面定位、多步导航以及视觉工具使用，支持移动、桌面和网页等多种平台。通过精心设计的环境、数据和训练方案，MintAct模型在这些能力上与各领域的专业模型表现相当。为了实现这一目标，我们开发了可扩展的环境和强化学习基础设施，能够同时处理多个领域的任务。实验结果表明，MintAct在多个基准测试中达到了最先进的性能，展示了其在不同模型规模下的优越性。'}}}, {'id': 'https://huggingface.co/papers/2609.20942', 'title': 'When AI Reviews Train AI Reviewers: Scientific-Judgment Collapse and Mitigation', 'url': 'https://huggingface.co/papers/2609.20942', 'abstract': 'Abstract  Large language models (LLMs) increasingly participate in scientific evaluation, both as automated reviewers and as assistants to human reviewers. As model-generated reviews enter public data and future training corpora, AI peer review can become recursive: later reviewers learn from judgments produced by earlier models. We study one step of this feedback loop in a controlled setting. Starting from Llama 3.1 8B, we first fine-tune a reviewer on official ICLR reviews from 2018--2023 and then train four successor models on ICLR 2024 data with systematically varied mixtures of official and model-generated reviews. Our study shows that introducing synthetic reviews compresses rating distributions and reduces both same-paper and corpus-level semantic diversity. We call this pattern scientific-judgment collapse.   To mitigate this failure mode, we introduce TrustReviewer, an open-source LLM-based system for generating peer reviews of AI and machine learning papers. TrustReviewer intervenes at two complementary stages. For training-time prevention, we train the core reviewer in a single stage on a curated corpus designed to reduce low-quality and semantically degenerate supervision. For test-time correction, paired activation steering aims to further mitigate residual tendencies toward collapsed judgments without further training or additional expert annotation. Together, these results characterize a concrete risk of recursive reviewer training and provide practical interventions for preserving judgment diversity and improving recommendation alignment in AI-assisted scientific evaluation.', 'score': 5, 'issue_id': 3308, 'pub_date': '2026-09-17', 'pub_date_card': {'ru': '17 сентября', 'en': 'September 17', 'zh': '9月17日'}, 'hash': '7659749fbb38fe62', 'authors': ['Sy-Tuyen Ho', 'Minghui Liu', 'Furong Huang'], 'affiliations': ['University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2609.20942.jpg', 'data': {'categories': ['#interpretability', '#training', '#synthetic', '#rlhf', '#dataset', '#science', '#open_source'], 'emoji': '🔄', 'ru': {'title': 'Предотвращение коллапса научных суждений в рекурсивном обучении языковых моделей-рецензентов', 'desc': 'В статье исследуется проблема рекурсивного обучения языковых моделей на основе их собственных предыдущих оценок в научном рецензировании. Авторы показали, что когда модели обучаются на смеси официальных рецензий и синтетических оценок, генерируемых другими моделями, происходит коллапс научных суждений: оценки становятся однородными и теряют смысловое разнообразие. Для решения этой проблемы предложена система TrustReviewer, которая использует два подхода: на этапе обучения применяется тщательно отобранный набор данных для улучшения качества, а на этапе инференса используется техника управления активациями нейронной сети для предотвращения деградации суждений. Исследование демонстрирует конкретный риск рекурсивного обучения моделей-рецензентов и предлагает практические методы для сохранения разнообразия оценок в системах автоматизированного научного рецензирования.'}, 'en': {'title': 'Preserving Diversity in AI Peer Review with TrustReviewer', 'desc': "This paper explores the impact of large language models (LLMs) on the peer review process in scientific evaluation. It highlights a phenomenon called 'scientific-judgment collapse,' where the introduction of model-generated reviews leads to reduced diversity in ratings and judgments. The authors propose a solution called TrustReviewer, which is designed to improve the quality of peer reviews by using a curated training corpus and a method called paired activation steering. This approach aims to maintain diverse and accurate evaluations in AI-assisted scientific reviews, addressing the risks associated with recursive training of reviewers."}, 'zh': {'title': '保持科学评审的多样性与质量', 'desc': '这篇论文探讨了大型语言模型（LLMs）在科学评审中的应用，尤其是作为自动评审者和人类评审者的助手。研究发现，当模型生成的评审进入公共数据后，后续的评审者可能会受到早期模型判断的影响，形成反馈循环。作者提出了一种名为TrustReviewer的开源系统，旨在生成AI和机器学习论文的同行评审，以减少低质量评审的影响。通过在训练和测试阶段的干预，TrustReviewer能够保持评审判断的多样性，改善AI辅助科学评估的推荐一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.18766', 'title': 'FRAUDSkill: Structured Frozen-Weight Skill Optimization for Audio Anti-Fraud Detection', 'url': 'https://huggingface.co/papers/2609.18766', 'abstract': 'Abstract  Large audio-language models have shown promise for anti-fraud detection by directly processing speech and reasoning over fraud-related evidence. Their deployment, however, requires predictions to follow a predefined label space and a structured decision protocol consisting of service-scenario identification, fraud detection, and conditional fraud-type classification. Existing fine-tuning and prompt-based approaches typically encode task knowledge, constraints, and decision rules into model parameters or manually maintained prompts, making them difficult to adapt as fraud patterns and labeling policies evolve. To this end, we propose FRAUDSkill, a structured frozen-weight adaptation framework that leaves the underlying audio-language model unchanged while optimizing an external layer of skill programs, route-specific policies, and decision rules. We further combine structured output control with validation-guided multi-path inference to ensure protocol-compliant predictions. On the TeleAntiFraud benchmark, FRAUDSkill achieves 73.50% Macro-F1, outperforming the shared frozen-model baseline by 31.96% while reducing invalid outputs to 1.94%. Extensive experiments demonstrate that external skill optimization provides an effective and adaptable solution for structured audio anti-fraud detection without modifying the underlying model. The source code is available at https://anonymous.4open.science/r/FRAUDSKILL-114514.', 'score': 2, 'issue_id': 3309, 'pub_date': '2026-09-16', 'pub_date_card': {'ru': '16 сентября', 'en': 'September 16', 'zh': '9月16日'}, 'hash': 'a04adfa53420ec74', 'authors': ['Chengxian Hu', 'Zhiming Ma', 'Mingjun Pan', 'Yifan Wang', 'Shun Zhang', 'Qifan Wang', 'Zhilei Zhao', 'Yijin Zhou', 'Yuxi Zhao', 'Huiyuan Liu', 'Peidong Wang', 'Peng Chen'], 'affiliations': ['JD Technology', 'Meta', 'Northeastern University', 'Peking University, Shenzhen', 'Peoples Public Security University of China', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.18766.jpg', 'data': {'categories': ['#audio', '#benchmark', '#multimodal'], 'emoji': '🚨', 'ru': {'title': 'Адаптивная детекция мошенничества через внешнюю оптимизацию навыков', 'desc': 'Статья предлагает FRAUDSkill — фреймворк адаптации больших аудио-языковых моделей для детектирования мошенничества без изменения весов исходной модели. Вместо традиционного fine-tuning, метод оптимизирует внешний слой программ навыков, маршрут-специфичных политик и правил принятия решений. Для обеспечения соответствия структурированному протоколу используется валидация-управляемая многопутевая инференция, которая гарантирует предсказания из предопределённого пространства классов. На бенчмарке TeleAntiFraud модель достигла 73.50% Macro-F1, превосходя базовый вариант на 31.96% при снижении невалидных выходов до 1.94%.'}, 'en': {'title': 'FRAUDSkill: Adapting Audio Models for Evolving Fraud Detection', 'desc': 'This paper introduces FRAUDSkill, a novel framework designed to enhance audio-language models for anti-fraud detection without altering the core model. It focuses on optimizing an external layer that includes skill programs and decision rules, allowing for easier adaptation to changing fraud patterns and labeling policies. The framework combines structured output control with validation-guided multi-path inference to ensure that predictions align with predefined protocols. Experimental results show that FRAUDSkill significantly improves detection performance while minimizing invalid outputs, demonstrating its effectiveness in structured audio anti-fraud applications.'}, 'zh': {'title': 'FRAUDSkill：音频反欺诈检测的新方法', 'desc': '本文提出了一种名为FRAUDSkill的框架，用于音频反欺诈检测。该框架通过优化外部技能程序和决策规则，而不改变基础的音频语言模型，从而提高了模型的适应性。FRAUDSkill结合了结构化输出控制和验证引导的多路径推理，确保预测符合预定义的决策协议。实验结果表明，FRAUDSkill在TeleAntiFraud基准测试中取得了73.50%的Macro-F1分数，显著优于现有模型。'}}}, {'id': 'https://huggingface.co/papers/2609.18748', 'title': 'TeleAntiFraud 2.0: A Refreshable, Profile-Grounded, and Audio-Based Benchmark for Telecom Fraud Detection', 'url': 'https://huggingface.co/papers/2609.18748', 'abstract': 'Abstract  Telecom fraud scripts evolve rapidly and are often designed to resemble routine service conversations, creating two key requirements for audio-based telecom-fraud evaluation. First, benchmarks must incorporate newly observed scam patterns without overwriting previously established test sets. Second, they must distinguish fraud from lawful, near-domain calls rather than relying on topic-separated negative examples. We present TeleAntiFraud 2.0, constructed with our Mixed-Tree Anti-Fraud Generation Pipeline and evaluated under a monthly frozen evaluation protocol. The pipeline transforms online fraud-case abstracts into profile-grounded scenarios, expands them through mixed-tree generation, realizes fraud and non-fraud dialogue paths under shared contexts, renders validated dialogues as role-matched speech, and freezes the resulting audio, labels, prompts, manifests, and provenance records for each monthly evaluation set. Each frozen set contains 900 Chinese calls, comprising 600 fraud and 300 near-domain non-fraud cases. Controlled text experiments show that three classifiers achieve perfect macro-averaged F1 (Macro-F1) when evaluated against unrelated or ordinary negatives, but drop to 0.65-0.68 with near-domain sibling negatives. Full-set audio and automatic-speech-recognition plus large-language-model (ASR+LLM) evaluations further reveal class-prior shortcuts, prediction collapse, and snapshot sensitivity. Together, these findings establish near-domain construction and collapse-aware reporting as core requirements for evaluating audio-based telecom-fraud models under realistic confusable conditions. The accompanying research artifact includes the construction code, evaluation scripts, manifests, and documentation. Our dataset and code are available at https://anonymous.4open.science/r/TeleAntiFraud-2_0-EEB2/.', 'score': 2, 'issue_id': 3309, 'pub_date': '2026-09-17', 'pub_date_card': {'ru': '17 сентября', 'en': 'September 17', 'zh': '9月17日'}, 'hash': 'dbe9c4c9a280aa01', 'authors': ['Huiyuan Liu', 'Zhiming Ma', 'Yanxing Liu', 'Shun Zhang', 'Qifan Wang', 'Di Liu', 'Yifan Wang', 'Yuyang Deng', 'Haoyang Meng', 'Yijin Zhou', 'Yuxi Zhao', 'Chengxian Hu', 'Peidong Wang', 'Peng Chen'], 'affiliations': ['Chongqing Ant Consumer Finance Co., Ltd., Ant Group', 'JD Technology', 'Meta', 'Northeastern University', 'Peoples Public Security University of China', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.18748.jpg', 'data': {'categories': ['#multilingual', '#dataset', '#benchmark', '#audio'], 'emoji': '🚨', 'ru': {'title': 'Реалистичные бенчмарки для детектирования телефонного мошенничества через аудио', 'desc': 'Исследователи представляют TeleAntiFraud 2.0 — бенчмарк для выявления телефонного мошенничества на основе анализа аудио. Датасет содержит китайские разговоры, сгенерированные через специально разработанный конвейер, который преобразует описания реальных мошеннических схем в диалоги с речевым синтезом. Ключевое улучшение заключается в использовании похожих на мошенничество честных звонков в качестве отрицательных примеров, что делает задачу классификации намного сложнее. Экспериментальные результаты показывают, что классификаторы достигают идеальных метрик на несвязанных данных, но теряют точность на реалистичных примерах, выявляя проблемы переобучения и необходимость более строгого протокола оценки.'}, 'en': {'title': 'Revolutionizing Telecom Fraud Detection with TeleAntiFraud 2.0', 'desc': 'The paper introduces TeleAntiFraud 2.0, a new dataset and evaluation framework for detecting telecom fraud in audio conversations. It emphasizes the need for benchmarks that adapt to evolving fraud patterns while distinguishing between fraudulent and legitimate calls in similar contexts. The Mixed-Tree Anti-Fraud Generation Pipeline is used to create realistic dialogue scenarios, ensuring that the evaluation sets reflect real-world challenges. The study highlights the importance of near-domain evaluation and the limitations of existing classifiers when faced with closely related non-fraud cases.'}, 'zh': {'title': '构建真实环境下的电信诈骗评估基准', 'desc': '本论文介绍了TeleAntiFraud 2.0，这是一个用于音频电信诈骗评估的基准数据集。该数据集通过混合树反欺诈生成管道构建，能够有效区分诈骗和合法的近域通话。研究表明，使用该数据集的分类器在面对近域负样本时表现不佳，强调了在真实混淆条件下评估音频电信诈骗模型的必要性。我们提供了构建代码、评估脚本和数据集，供研究人员使用。'}}}, {'id': 'https://huggingface.co/papers/2609.15126', 'title': 'MoME: Mixture-of-Memory Embeddings for Context-Aware Sparse Lookup', 'url': 'https://huggingface.co/papers/2609.15126', 'abstract': "Abstract  Scaling large language models efficiently has motivated sparse capacity mechanisms such as Mixture-of-Experts and, more recently, conditional memory: token-indexed embedding tables that augment the backbone with cheap parametric lookups. Existing memory-embedding methods retrieve via a deterministic function of the surface form, which collapses different contextual senses of the same token (e.g., python the language vs. the animal) into a single fixed entry. We introduce Mixture of Memory Embeddings (MoME), a context-aware memory mechanism that replaces each token's single memory row with a mixture of M slots and uses a learned gate over the hidden state to choose which slots to read at each position. In controlled pretraining experiments across nanochat, Llama-3/MobileLLM, and Qwen3 backbones, MoME improves over Value Embedding, Bigram, and STEM baselines in iso-parameter and iso-training-FLOP settings, shows a more promising memory-size scaling trend at sub-billion scale, and remains efficient in training and inference. Qualitative routing analyses on polysemous tokens further suggest that the learned mixture exhibits a degree of semantic interpretability, dispatching the same surface token to distinct memory slots under different senses.", 'score': 2, 'issue_id': 3309, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '51a928b20d0d8519', 'authors': ['Muchen Li', 'Leonid Sigal', 'Renjie Liao'], 'affiliations': ['Canada CIFAR AI Chair', 'NSERC CRC Chair', 'University of British Columbia', 'Vector Institute for AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.15126.jpg', 'data': {'categories': [], 'emoji': '🎭', 'ru': {'title': 'Контекстная смесь эмбеддингов для точного понимания многозначных слов', 'desc': 'В статье предложен механизм Mixture of Memory Embeddings (MoME), который расширяет возможности больших языковых моделей за счет контекстно-зависимых эмбеддингов в виде таблиц памяти. Вместо детерминированного отображения каждого токена на одну строку памяти, метод использует смесь из M слотов и обучаемый шлюз, выбирающий релевантные слоты в зависимости от скрытого состояния. Экспериментальная оценка показала улучшение качества в сравнении с базовыми методами Value Embedding и STEM при одинаковом числе параметров и вычислительных затрат. Анализ маршрутизации токенов выявил семантическую интерпретируемость механизма: он корректно различает различные значения многозначных слов, направляя их в разные ячейки памяти.'}, 'en': {'title': 'Context-Aware Memory for Enhanced Language Understanding', 'desc': 'This paper presents Mixture of Memory Embeddings (MoME), a novel context-aware memory mechanism designed to enhance the efficiency of large language models. Unlike traditional memory-embedding methods that use a single fixed entry for each token, MoME utilizes a mixture of memory slots, allowing for more nuanced retrieval based on the context of the token. The approach improves performance over existing baselines in controlled experiments, demonstrating better scalability and efficiency in both training and inference. Additionally, MoME shows semantic interpretability by routing polysemous tokens to different memory slots depending on their contextual meaning.'}, 'zh': {'title': '混合记忆嵌入：提升语言模型的上下文理解能力', 'desc': '这篇论文介绍了一种新的内存机制，称为混合记忆嵌入（MoME），旨在提高大语言模型的效率。传统的内存嵌入方法将同一标记的不同上下文意义合并为一个固定的条目，而MoME通过为每个标记提供多个内存槽来解决这个问题。该方法使用学习的门控机制，根据隐藏状态选择在每个位置读取的槽，从而实现上下文感知。实验结果表明，MoME在多个基准测试中优于现有的嵌入方法，并在内存规模扩展方面表现出更好的趋势。'}}}, {'id': 'https://huggingface.co/papers/2609.09206', 'title': 'MLLMs Hallucinate when Information Distribution Drifts in Synergy Heads', 'url': 'https://huggingface.co/papers/2609.09206', 'abstract': 'Abstract  Multimodal Large Language Models (MLLMs) often struggle with hallucinations, thus hindering their reliable practical applications. Existing attention-based mitigation methods mainly rely on indirect signals (e.g., attention weights) that fail to accurately reflect the actual information shift underlying hallucination generation. In this paper, we propose HEAL, Head-lEvel information disentAnglement and caLibration for identifying and mitigating hallucinations. HEAL first employs causal noise intervention on multi-head outputs to filter out causally redundant heads. Subsequently, it disentangles information distribution within the remaining heads via the counterfactual Difference-in-Differences, categorizing heads into four types. Through analysis, we observe: hallucinations happen when information distribution drifts away from a healthy equilibrium in synergy heads, not strongly correlated with the quantity or strength of modality-specific heads. Motivated by this insight, HEAL injects dynamic information calibration factors into the value vectors of synergy heads, and actively regulates visual-language dependencies, steering the output distribution towards factual evidence. Extensive experiments demonstrate that HEAL effectively reduces hallucinations across multiple MLLMs, offering a simple and interpretable pathway to enhance model trustworthiness.', 'score': 2, 'issue_id': 3309, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': 'b2580680fc5ef076', 'authors': ["Meng'en Qin", 'Junye Chen', 'Jucheng Liu', 'Youlu Xing', 'Song Wang', 'Ruize Han'], 'affiliations': ['Faculty of Computer Science and Artificial Intelligence, Shenzhen University of Advanced Technology, Shenzhen, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.09206.jpg', 'data': {'categories': ['#training', '#hallucinations', '#interpretability', '#multimodal'], 'emoji': '🎯', 'ru': {'title': 'Калибровка внимания для правдивости мультимодальных моделей', 'desc': 'В статье предлагается метод HEAL для борьбы с галлюцинациями в мультимодальных больших языковых моделях, которые часто генерируют неверную информацию. Авторы используют причинный анализ шума для фильтрации избыточных головок внимания и применяют контрфактический анализ Difference-in-Differences для категоризации оставшихся головок. Ключевое открытие заключается в том, что галлюцинации возникают не из-за количества модально-специфичных головок, а из-за дрейфа распределения информации в синергетических головках. Метод динамически калибрует информационные факторы в векторах значений, чтобы направить модель к генерированию фактически верных ответов.'}, 'en': {'title': 'HEAL: Enhancing Trustworthiness in MLLMs by Mitigating Hallucinations', 'desc': "This paper addresses the issue of hallucinations in Multimodal Large Language Models (MLLMs), which can undermine their practical use. The authors introduce a method called HEAL, which focuses on disentangling and calibrating information at the head level to better identify and mitigate these hallucinations. HEAL uses causal noise intervention to filter out redundant heads and analyzes the information distribution to categorize heads into four types. By injecting dynamic calibration factors into the value vectors of synergy heads, HEAL improves the model's output by aligning it more closely with factual information, thus enhancing trustworthiness."}, 'zh': {'title': 'HEAL：提升多模态模型可信度的创新方法', 'desc': '多模态大型语言模型（MLLMs）在实际应用中常常出现幻觉现象，影响其可靠性。现有的基于注意力的缓解方法主要依赖间接信号，无法准确反映幻觉生成背后的信息变化。本文提出了HEAL方法，通过对多头输出进行因果噪声干预，过滤掉因果冗余的头部，并利用反事实差异法对剩余头部的信息分布进行解耦。实验表明，HEAL有效减少了多种MLLMs中的幻觉现象，提升了模型的可信度。'}}}, {'id': 'https://huggingface.co/papers/2609.21619', 'title': 'Calibrating Teacher--Student Discrepancy for On-Policy Distillation', 'url': 'https://huggingface.co/papers/2609.21619', 'abstract': "Abstract  On-policy distillation (OPD) improves reasoning models by learning the token-level discrepancy between a stronger teacher and an on-policy student. However, this discrepancy does not purely reflect the capability gap between the teacher and the student: it also contains deviations arising from the teacher itself, which are consequently mixed into the observed teacher--student discrepancy and indiscriminately learned by standard OPD during training. This issue is further exacerbated by privileged OPD, where privileged information induces larger teacher-side likelihood shifts, thereby encouraging the student to learn more of the teacher's own deviation. We introduce Calibrated On-Policy Distillation (Cal-OPD), which estimates the teacher's self-deviation region through positive and negative privileged interventions and calibrates the original teacher--student discrepancy by retaining only the component that lies beyond this region. Experiments on mathematical reasoning benchmarks show that, while retaining only about 52--65\\% of the original teacher--student discrepancy as the optimization signal, Cal-OPD consistently outperforms standard OPD and its variants across model scales.", 'score': 2, 'issue_id': 3309, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': 'be54aa5c658a574c', 'authors': ['Qiangqiang He', 'Jin Li', 'MingCai Chen'], 'affiliations': ['College of Software Engineering, Southeast University, Nanjing, China', 'Nanjing University of Posts and Telecommunications, Nanjing, China', 'State Key Laboratory for Novel Software Technology, Nanjing University, Nanjing, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.21619.jpg', 'data': {'categories': ['#optimization', '#training', '#reasoning', '#math'], 'emoji': '🎯', 'ru': {'title': 'Отфильтровать шум: калиброванная дистилляция для чистого обучения от учителя', 'desc': 'В статье рассматривается проблема дистилляции знаний в моделях рассуждения, где стандартная дистилляция на стратегии (On-Policy Distillation) смешивает информацию о различиях между учителем и студентом с собственными ошибками учителя. Авторы предлагают Калиброванную дистилляцию на стратегии (Cal-OPD), которая оценивает границы самоотклонения учителя через специальные вмешательства и фильтрует сигнал обучения, убирая шум от ошибок учителя. Метод использует привилегированную информацию для более точного определения того, какие различия действительно отражают пробел в способностях между моделями. Экспериментальные результаты на задачах математического рассуждения показывают, что Cal-OPD превосходит стандартные подходы, используя только 52-65% от исходного сигнала дистилляции.'}, 'en': {'title': 'Refining Learning with Calibrated Distillation', 'desc': "This paper presents Calibrated On-Policy Distillation (Cal-OPD), a method that enhances the training of reasoning models by addressing the discrepancies between a teacher model and a student model. The authors identify that traditional on-policy distillation (OPD) mixes the teacher's inherent deviations with the actual capability gap, leading to suboptimal learning for the student. Cal-OPD introduces a calibration process that isolates the true performance gap by estimating the teacher's self-deviation, allowing the student to focus on learning the most relevant information. Experimental results demonstrate that Cal-OPD significantly improves performance on mathematical reasoning tasks while using a reduced amount of the original discrepancy as a training signal."}, 'zh': {'title': '校准在线蒸馏：提升推理模型的学习效果', 'desc': '本文提出了一种新的方法，称为校准在线蒸馏（Cal-OPD），旨在改善推理模型的学习效果。传统的在线蒸馏方法在训练过程中会混合教师模型和学生模型之间的差异，导致学生学习到教师模型的偏差。Cal-OPD通过正负干预来估计教师模型的自我偏差区域，从而校准教师与学生之间的差异，只保留超出该区域的部分。实验结果表明，Cal-OPD在数学推理基准测试中表现优于标准的在线蒸馏方法，尽管只保留了52%到65%的原始差异作为优化信号。'}}}, {'id': 'https://huggingface.co/papers/2609.18620', 'title': 'DeformSmith: Physics Harness-Guided Hierarchical Generation of Deformable Assets for Robot Manipulation', 'url': 'https://huggingface.co/papers/2609.18620', 'abstract': 'Abstract  Creating deformable assets for robot manipulation requires jointly specifying their geometry, appearance, and physical properties. This is especially challenging for deformable objects, since text and images provide limited evidence about how they deform and respond to contact, yet these responses directly affect their suitability for interaction. Automated generation therefore needs to resolve coupled physical requirements and use interaction evidence to guide construction and refinement. We present DeformSmith, a framework that enables automated generation of interactive, physically credible deformable assets from text or a single image. Through hierarchical agentic construction and a shared physics-grounded harness, it progressively builds, tests, and refines geometry, physical models, material behavior, and robot interaction until the resulting asset is ready for simulation and manipulation. Robot interaction closes the generation loop through manipulation feedback and replayable interaction data. Results show that DeformSmith generates assets with better visual quality and physical plausibility than state-of-the-art baselines, including PhysGen3D, PhysGM, and PhysX-Omni, while supporting the synthesis of data for robotic manipulation of deformable objects. Project page: https://can-lee.github.io/deformsmith-web/', 'score': 2, 'issue_id': 3309, 'pub_date': '2026-09-17', 'pub_date_card': {'ru': '17 сентября', 'en': 'September 17', 'zh': '9月17日'}, 'hash': 'e754110a5bbe8279', 'authors': ['Can Li', 'Jie Gu', 'Zishun Deng', 'Jingmin Chen', 'Lei Sun'], 'affiliations': ['Nankai University', 'Rightly Robotics'], 'pdf_title_img': 'assets/pdf/title_img/2609.18620.jpg', 'data': {'categories': ['#robotics', '#3d', '#agents', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Автоматическое создание физически достоверных деформируемых объектов через взаимодействие с роботом', 'desc': 'DeformSmith — это фреймворк для автоматического создания деформируемых объектов из текста или одного изображения, которые пригодны для манипуляции робототехническими системами. Система использует иерархический агентный подход для последовательного построения, тестирования и уточнения геометрии, физических моделей и материальных свойств объектов. Ключевой особенностью является замкнутый цикл обратной связи через взаимодействие робота, где данные манипуляции используются для уточнения характеристик объекта. Результаты показывают, что DeformSmith генерирует активы с лучшим визуальным качеством и физической правдоподобностью по сравнению с существующими методами, одновременно обеспечивая синтез данных для робоманипуляции деформируемыми предметами.'}, 'en': {'title': 'Automating the Creation of Realistic Deformable Assets for Robots', 'desc': 'The paper introduces DeformSmith, a framework designed to automate the creation of deformable assets for robot manipulation. It addresses the challenge of generating objects that accurately reflect their geometry, appearance, and physical properties based on limited input like text or images. By employing a hierarchical construction process and a physics-based approach, DeformSmith iteratively builds and refines these assets, ensuring they are suitable for interaction. The framework demonstrates superior visual quality and physical realism compared to existing methods, enhancing the ability of robots to manipulate deformable objects effectively.'}, 'zh': {'title': '自动生成可变形机器人资产的创新框架', 'desc': '本论文介绍了一种名为DeformSmith的框架，用于自动生成可变形的机器人操作资产。该框架通过文本或单张图像，逐步构建、测试和优化几何形状、物理模型和材料行为。DeformSmith利用机器人交互反馈来完善生成过程，确保生成的资产在视觉和物理上都具有可信度。实验结果表明，DeformSmith生成的资产在视觉质量和物理合理性上优于现有的最先进方法。'}}}, {'id': 'https://huggingface.co/papers/2609.19122', 'title': 'Training-Adaptive Convolutional Sparse Coding via Information Bottleneck for Robust Visual Representation', 'url': 'https://huggingface.co/papers/2609.19122', 'abstract': 'Abstract  Visual signals require compact yet sufficient representations for robust downstream prediction. Convolutional sparse coding (CSC) provides an explicit mechanism for suppressing redundant components while preserving signal content, but its sparsity coefficient is typically fixed and manually selected. We propose a training-adaptive convolutional sparse coding framework for robust visual signal representation. Specifically, we unfold the CSC optimization with the Fast Iterative Shrinkage-Thresholding Algorithm (FISTA) and treat the sparsity coefficient as a differentiable variable jointly learned with the network parameters. From the information bottleneck perspective, this coefficient controls the trade-off between information retention and compression: the sparsity term promotes compact representations, while the reconstruction term together with task loss preserves task-relevant signal content. We further introduce a label-free post-training strategy that adjusts the compression strength for corrupted inputs with the main network parameters fixed. Experiments on CIFAR and ImageNet demonstrate competitive clean-data recognition and greatly improved robustness under different input perturbations.', 'score': 1, 'issue_id': 3309, 'pub_date': '2026-09-17', 'pub_date_card': {'ru': '17 сентября', 'en': 'September 17', 'zh': '9月17日'}, 'hash': '629b9a219ffea08c', 'authors': ["Meng'en Qin", 'Yinchen Liu', 'Mingxuan Cui', 'Youlu Xing'], 'affiliations': ['Faculty of Computer Science and Artificial Intelligence, Shenzhen University of Advanced Technology, Shenzhen, China', 'School of Mathematical Sciences, University of Electronic Science and Technology of China, Chengdu, China', 'School of Mathematics, Shandong University, Jinan, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.19122.jpg', 'data': {'categories': ['#training', '#cv', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Обучаемая разреженность для устойчивых визуальных представлений', 'desc': 'Статья предлагает адаптивный метод сверточного разреженного кодирования (CSC) для получения компактных представлений визуальных сигналов. Авторы разворачивают оптимизацию CSC с использованием алгоритма FISTA и обучают коэффициент разреженности совместно с параметрами сети как дифференцируемую переменную. С точки зрения информационного узкого места, этот коэффициент управляет компромиссом между сохранением информации и сжатием данных. Дополнительно предложена стратегия постобучения без использования меток, которая корректирует силу сжатия для искаженных входных данных, что улучшает устойчивость модели к возмущениям входа.'}, 'en': {'title': 'Adaptive Sparsity for Robust Visual Representation', 'desc': 'This paper introduces a new method for representing visual signals using convolutional sparse coding (CSC) that adapts the sparsity coefficient during training. By using the Fast Iterative Shrinkage-Thresholding Algorithm (FISTA), the method allows the sparsity coefficient to be learned alongside the network parameters, enhancing the balance between information retention and compression. The approach also includes a post-training strategy that adjusts compression for corrupted inputs without changing the main network parameters. Experiments show that this method achieves strong performance on clean data and significantly improves robustness against various input disturbances.'}, 'zh': {'title': '自适应卷积稀疏编码：提升视觉信号表示的鲁棒性', 'desc': '本文提出了一种训练自适应的卷积稀疏编码框架，用于视觉信号的有效表示。通过使用快速迭代收缩阈值算法（FISTA），我们将稀疏系数视为一个可微分的变量，与网络参数共同学习。该稀疏系数在信息瓶颈的视角下，控制信息保留与压缩之间的权衡，促进紧凑表示的同时保留任务相关的信号内容。实验结果表明，该方法在CIFAR和ImageNet数据集上具有竞争力的识别性能，并在不同输入扰动下显著提高了鲁棒性。'}}}, {'id': 'https://huggingface.co/papers/2609.20669', 'title': 'Learning Foresight without Explicit Trajectories for 3D Diffusion Policies', 'url': 'https://huggingface.co/papers/2609.20669', 'abstract': 'Abstract  3D diffusion policies are strong at generating geometrically grounded actions from current observations, but successful manipulation requires not only knowing what motion is feasible now, but also anticipating where the interaction is heading. Existing policies largely leave such foresight to emerge implicitly from action learning. We introduce Movement Trend Guidance, a simple but effective way to provide this foresight without introducing an explicit plan. From a short observation history, the policy learns a compact latent representation of interaction evolution. During training, sparse future gripper states supervise this representation; at inference, only the latent is retained as future-oriented conditioning alongside the current observation. The latent provides global conditioning for action generation, while an additional gated FiLM branch is used only at the UNet bottleneck. Despite adding only 3.52% more parameters to DP3, our method preserves the original dense-action and receding-horizon formulation and consistently improves upon DP3 across RoboTwin2.0, LIBERO-40, and DexArt. It reaches 62.8% vs. 56.1% in 50-task RoboTwin2.0 mixed training, 71.93% vs. 37.08% on LIBERO-40, and 72.0% vs. 49.0% on five real-robot tasks. These results show that a diffusion policy can benefit substantially from knowing where an interaction is heading, without being told exactly where to move.', 'score': 1, 'issue_id': 3308, 'pub_date': '2026-09-17', 'pub_date_card': {'ru': '17 сентября', 'en': 'September 17', 'zh': '9月17日'}, 'hash': 'fc5ea531b0351813', 'pdf_title_img': 'assets/pdf/title_img/2609.20669.jpg', 'data': {'categories': ['#architecture', '#training', '#3d', '#diffusion', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Предчувствие взаимодействия: обучение диффузионных политик видеть будущее', 'desc': 'В работе предлагается метод Movement Trend Guidance для улучшения 3D diffusion policies в задачах манипуляции роботом. Ключевая идея заключается в том, чтобы предоставить политике информацию о тренде развития взаимодействия через компактное латентное представление, обучаемое на истории наблюдений и контролируемое редкими будущими состояниями захвата. Во время инференции это латентное представление используется как глобальная подсказка для генерации действий через gated FiLM модуль в bottleneck части UNet, добавляя при этом только 3.52% параметров. Метод демонстрирует значительное улучшение результатов на бенчмарках RoboTwin2.0, LIBERO-40 и реальных робототехнических задачах, достигая улучшения производительности на 6-34 процентных пункта без явного планирования.'}, 'en': {'title': 'Anticipating Interaction: Enhancing 3D Diffusion Policies with Movement Trend Guidance', 'desc': 'This paper presents a new method called Movement Trend Guidance to enhance 3D diffusion policies in robotic manipulation. The approach allows the policy to learn a compact representation of how interactions evolve over time, which helps in anticipating future states without needing explicit planning. By using sparse future gripper states during training, the model can generate actions that are more aligned with the expected trajectory of interactions. The results show significant performance improvements across various tasks, demonstrating that understanding the direction of movement can greatly enhance action generation in robotic systems.'}, 'zh': {'title': '运动趋势引导：提升3D扩散策略的未来预测能力', 'desc': '这篇论文提出了一种新的方法，称为运动趋势引导，旨在提高3D扩散策略在动作生成中的表现。该方法通过学习交互演变的紧凑潜在表示，帮助策略在当前观察的基础上预测未来的动作趋势。训练过程中，稀疏的未来抓取状态用于监督潜在表示，而在推理时，仅保留潜在表示作为未来导向的条件。实验结果表明，该方法在多个任务上显著提高了性能，证明了扩散策略在了解交互趋势方面的潜力。'}}}];
