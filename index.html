    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

            const isDarkMode = body.classList.contains('dark-theme');

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.36484', 'title': 'The Teacher Is a Direction, Not a Destination: Extrapolating RL-Induced Representation Residuals in On-Policy Distillation', 'url': 'https://huggingface.co/papers/2609.36484', 'abstract': "Abstract  On-policy distillation (OPD) trains a student to match the teacher's next-token distributions on the student's own trajectories and has yielded substantial empirical gains. Generalized variants allow the student to surpass the teacher by extrapolating an implicit reward in output space. The language-model head, however, attenuates this change anisotropically: much of the change encoded in the teacher's hidden states reaches the logits at a small fraction of its weight, and the sampled-token log-probability ratios on which output-space extrapolation relies inject noise that the extrapolation amplifies, making training unstable. We observe that reinforcement learning (RL) shifts a model's internal representations relative to its base checkpoint, and that the direction of this shift can be measured at every layer. Motivated by this observation, we propose RIDE (RL-Induced Direction Extrapolation), which extrapolates the RL-induced change directly in representation space: at every layer and token position, RIDE computes the residual between the teacher and its pre-RL checkpoint and regresses the student's hidden states toward targets displaced beyond the teacher along this residual. Conditioned on a sampled trajectory, this regression is equivalent to maximizing a linear directional reward defined by the residual under a quadratic penalty centered at the teacher, which makes explicit how the objective moves the student along the RL-induced direction while limiting its deviation from the teacher. Across four base/RL-teacher pairs spanning different scales, architectures, and pre-training lineages, RIDE approaches or exceeds the RL-trained teacher on every pair and is the only method whose mean does so, and it consistently outperforms output-space extrapolation, which degrades the student whenever the teacher is close to its base. Project page: https://github.com/xixixixixxxx/RIDE.", 'score': 214, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '1c22c44fff72eb4b', 'authors': ['Hao Li', 'MeiJia Chen', 'Weijie Ren', 'Donghan Li', 'Zijun Tian', 'Jingchun Huang', 'Naibo Wang'], 'affiliations': ['Independent Researcher', 'Rutgers University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.36484.jpg', 'data': {'categories': ['#training', '#open_source', '#rl', '#architecture', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Экстраполяция RL-индуцированных изменений в пространстве представлений', 'desc': 'В работе предлагается метод RIDE для обучения студент-модели путём дистилляции знаний от учителя, обученного с помощью reinforcement learning. Авторы показывают, что прямая экстраполяция изменений в пространстве скрытых представлений более эффективна, чем традиционный подход экстраполяции в пространстве выходов. Метод работает на каждом слое нейронной сети, вычисляя остаток между весами учителя и его исходной версией, и регрессирует скрытые состояния студента по направлению этих изменений с квадратичной регуляризацией. Экспериментально RIDE показывает стабильное улучшение и способен превзойти или сравняться с производительностью RL-обученного учителя на различных архитектурах и масштабах моделей.'}, 'en': {'title': 'RIDE: Enhancing Student Models with RL-Induced Representation Changes', 'desc': "This paper introduces RIDE (RL-Induced Direction Extrapolation), a method that enhances on-policy distillation by directly leveraging the changes in a model's internal representations induced by reinforcement learning (RL). RIDE computes the difference between a teacher model's hidden states before and after RL training, allowing the student model to adjust its representations towards these changes. This approach stabilizes training by applying a regression that maximizes a linear reward while keeping the student close to the teacher's outputs. The results show that RIDE consistently outperforms traditional output-space extrapolation methods across various model architectures and training scenarios."}, 'zh': {'title': '通过RIDE提升学生模型的训练效果', 'desc': '本文提出了一种新的方法RIDE（RL诱导方向外推），旨在通过强化学习（RL）来改进学生模型的训练。RIDE直接在表示空间中外推RL诱导的变化，通过计算教师模型与其基准检查点之间的残差，来调整学生的隐藏状态。该方法在多个不同规模和架构的模型对比中表现出色，能够接近或超过RL训练的教师模型。与传统的输出空间外推方法相比，RIDE在训练过程中更稳定，能够有效减少噪声的影响。'}}}, {'id': 'https://huggingface.co/papers/2609.38721', 'title': 'UniEvo-VL: An On-policy Self-Distillation Training Recipe for Multimodal Model Self-improvement', 'url': 'https://huggingface.co/papers/2609.38721', 'abstract': "Abstract  Modern multimodal models bring generation and understanding into a single unified system, which enables them to provide and learn from their own feedback. Motivated by this unified capacity, we introduce UniEvo-VL, a self-evolving framework for multimodal models to learn from this constructive self-correction feedback during test-time compute. Instead of relying on a separate, often larger, teacher, we leverage their self-critiques as privileged information and ask a single multimodal model to act as both teacher and student with different contexts. The student only sees the vanilla question, while the teacher conditions on the privileged critique. Then training minimizes the per-state divergence between their denoising diffusion distributions over the student's own sampling trajectories. Experiments demonstrate that UniEvo-VL improves the image generation capabilities of multimodal models, while maintaining their sensitivity to additional reflection information. Specifically, we build on top of the open-source Qwen-image-2512 and observe a significant performance gain from 0.747 to 0.808 on GenEval and from 32.97 to 35.53 on GenEval2 Soft-TIFA. Moreover, attempts with more powerful external critics (e.g., GPT5.6-Luna) show that multimodal models with strong judge capabilities can anticipate a higher self-evolving ceiling. Last but not least, mixed text-rendering outcomes show that our self-improvements may not be uniform across different tasks. Our study aims to shed light on the current hot recursive self-improvement research line to enhance the user experience when using multimodal models without external supervision or guidance.", 'score': 166, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '51640f03502e212f', 'authors': ['Fang Wu', 'Da Xing', 'Yanjie Huang', 'Junxi Wang', 'Ji Wang', 'Hejia Geng', 'Guancheng Wan', 'Bowen Zuo', 'Xiaomin Li', 'Shixiang Tang', 'Xinyu Xiang', 'Zehong Wang', 'Shiyi Du', 'Peng Xia', 'Shuangjia Zheng', 'Yining Hong', 'Li Erran Li', 'Jure Leskovec', 'Yejin Choi'], 'affiliations': ['Carnegie Mellon University', 'Independent Researcher', 'Johns Hopkins University', 'MatrAIx', 'Stanford University', 'UC Riverside', 'UNC Chapel Hill', 'University of Notre Dame', 'University of Oxford', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2609.38721.jpg', 'data': {'categories': ['#training', '#open_source', '#multimodal', '#diffusion'], 'emoji': '🔄', 'ru': {'title': 'Мультимодальные модели учатся совершенствовать себя сами', 'desc': 'В статье представлена UniEvo-VL — фреймворк для самоусовершенствования мультимодальных моделей, который позволяет им учиться на собственной конструктивной критике во время инференса. Вместо привлечения отдельного учителя, модель выступает одновременно в роли учителя и ученика с разными контекстами: ученик видит только вопрос, а учитель дополнительно обрабатывает критику. Обучение минимизирует расхождение между распределениями диффузионных моделей на траекториях собственной выборки. Эксперименты показали значительное улучшение качества генерации изображений в Qwen-image-2512 с 0.747 до 0.808 на метрике GenEval.'}, 'en': {'title': 'Self-Improvement in Multimodal Models with UniEvo-VL', 'desc': "The paper introduces UniEvo-VL, a novel framework for multimodal models that allows them to learn and improve from their own feedback during testing. This self-evolving approach eliminates the need for a separate teacher model by enabling the multimodal model to act as both teacher and student, using its own critiques to enhance learning. The training process focuses on minimizing the differences between the model's generated outputs and its self-critiques, leading to improved image generation capabilities. Experiments show significant performance gains on evaluation metrics, highlighting the potential for self-improvement in multimodal systems without external guidance."}, 'zh': {'title': '自我进化的多模态学习新框架', 'desc': '现代多模态模型将生成和理解整合为一个统一的系统，使其能够提供和学习自我反馈。我们提出了UniEvo-VL，这是一个自我进化的框架，允许多模态模型在测试时通过自我纠正反馈进行学习。该模型利用自我批评作为特权信息，使同一个多模态模型在不同上下文中充当教师和学生。实验表明，UniEvo-VL显著提高了多模态模型的图像生成能力，同时保持了对额外反思信息的敏感性。'}}}, {'id': 'https://huggingface.co/papers/2609.39102', 'title': 'False Frontiers: Diagnosing and Mitigating Co-Cheating in Self-Evolving Search Agents', 'url': 'https://huggingface.co/papers/2609.39102', 'abstract': "Abstract  Self-evolving search agents build their own training curricula by jointly optimizing a proposer that generates questions and a solver that answers them. This closed loop introduces a failure mode we call co-cheating: the proposer and solver increasingly agree on shared errors, so internal reward improves without a matching gain in external correctness. A post-hoc audit against source evidence shows co-cheating growing more severe over successive rounds of self-evolution, with pseudo-label correctness stagnating or declining even as the in-loop training signal improves. The most direct mitigation is to verify proposals before training: we introduce multi-sample verification (MSV), which queries the same model three times with the source and three times without it to decide task admission and replace unreliable pseudo-labels. MSV partially reduces false agreement but leaves substantial residual co-cheating and costs six extra labeler generations per candidate. These limitations motivate CrossFit, our main method: it partitions the proposer's source documents into groups A and B; questions generated from A are scored by an auxiliary solver trained only on B, and vice versa. The cross-fitted agreement determines proposer reward, so a same-source pseudo-label cannot be reproduced through the feedback solver, while the original solver's update rule is unchanged. Rerunning the loop with Qwen3.5-4B and Qwen3.5-9B, MSV reduces false-agreement mass from 6.1% to 5.7% and from 8.8% to 7.2%, whereas CrossFit reduces it to 3.0% and 3.7%. Replaying identical proposals with source-excluded feedback further reduces false agreement to 0.4% and 0.1%, isolating feedback ancestry from curriculum changes. Across seven downstream search benchmarks, CrossFit improves average performance over standard coupled self-evolution by 8.8 and 8.4 points and over Search-R1 by 8.7 and 7.8 points at 4B and 9B.", 'score': 141, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'f805245f771433b8', 'authors': ['Meijia Chen', 'Hao Li', 'Zheng Lu', 'Hongshan Lin', 'Junbai Tian', 'Yichen Liu', 'Zijun Tian', 'Yufan Zou', 'Shuhan Sun', 'Hanxin Chen', 'Zeyu Zhang', 'Weizhi Du', 'Yueting Li', 'Tianyu Shi', 'Alaa Khamis'], 'affiliations': ['Independent Researcher', 'King Fahd University of Petroleum and Minerals', 'McGill University', 'Rutgers University', 'University of California, San Diego', 'University of Michigan'], 'pdf_title_img': 'assets/pdf/title_img/2609.39102.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents', '#small_models'], 'emoji': '🔄', 'ru': {'title': 'Борьба с совместным жульничеством в самоэволюционирующих агентах поиска', 'desc': 'В работе исследуется проблема самоэволюции поисковых агентов, которые создают свои собственные учебные программы, совместно оптимизируя генератор вопросов и решатель. Авторы выявляют критическую ошибку, названную ими «совместным жульничеством» (co-cheating), когда генератор и решатель начинают соглашаться на одни и те же ошибки, что улучшает внутренние метрики без реального прогресса во внешней корректности. Для борьбы с этой проблемой предложены два метода: проверка с несколькими выборками (MSV) и главный метод CrossFit, который использует кросс-валидацию между разделёнными наборами данных, чтобы предотвратить самовоспроизведение ошибок. Эксперименты на моделях Qwen показывают, что CrossFit значительно снижает ложное согласие между компонентами и улучшает производительность на семи бенчмарках на 8-9 пунктов.'}, 'en': {'title': 'CrossFit: Enhancing Self-Evolving Agents by Preventing Co-Cheating', 'desc': "This paper discusses a method for improving self-evolving search agents that create their own training materials. It identifies a problem called co-cheating, where the question proposer and answer solver start to agree on incorrect answers, leading to misleading improvements in their performance. To address this, the authors propose a technique called CrossFit, which uses separate groups of source documents to ensure that the proposer and solver do not reinforce each other's errors. The results show that CrossFit significantly reduces false agreement and enhances performance on various search tasks compared to traditional methods."}, 'zh': {'title': '跨适应方法提升搜索代理的自我进化效果', 'desc': '自我进化的搜索代理通过共同优化提问者和解答者来构建自己的训练课程。这种闭环引入了一种称为共作弊的失败模式，导致提问者和解答者在共享错误上达成一致，从而内部奖励提高，但外部正确性没有相应提升。我们提出了多样本验证（MSV）来缓解这一问题，通过对同一模型进行多次查询来决定任务的接受与否。我们的主要方法CrossFit通过将提问者的源文档分组，利用辅助解答者进行评分，从而有效减少了共作弊现象。'}}}, {'id': 'https://huggingface.co/papers/2609.38288', 'title': 'AREX-2: Advancing Self-Improving Agents through Long-Horizon Reflective Tasks', 'url': 'https://huggingface.co/papers/2609.38288', 'abstract': 'Abstract  We present AREX-2, an effort to advance the self-improving capability of LLM agents, which we define as the ability to iteratively refine a solution at test time. This ability rests on two complementary capabilities: reflection, which produces a solution better than the current one, and long-horizon execution, which keeps the iteration effective over many rounds. We hypothesize that both capabilities are domain-agnostic, and can therefore be learned in scenarios that are well suited for supervision. Accordingly, we synthesize long-horizon improvement trajectories from machine learning and algorithmic programming tasks, two domains that offer verifiable feedback and reward sustained iteration. Trained on this data, our agent, built on Qwen3.8-27B, achieves strong results on MLE-bench Lite (81.8) and Frontier-CS (70.7), transfers to deep research with 84.0 on BrowseComp, 52.6 on HLE, 92.2 on GAIA, and 93.8 on DeepSearchQA, and keeps improving as its budget of rounds grows. These results show that long-horizon reflective data is an effective route toward self-improving agents.', 'score': 93, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '13c71fa9e1b2076c', 'authors': ['Hongjin Qian', 'Chaofan Li', 'Kun Luo', 'Wenqing Wei', 'Jianlyu Chen', 'Shuqi Lu', 'Yuyang Hu', 'Hongwang Xiao', 'Hui Wang', 'Chaozhuo Li', 'Qiwei Ye', 'Zhicheng Dou', 'Defu Lian', 'Zheng Liu'], 'affiliations': ['Beijing Academy of Artificial Intelligence (BAAI)'], 'pdf_title_img': 'assets/pdf/title_img/2609.38288.jpg', 'data': {'categories': ['#reasoning', '#training', '#benchmark', '#synthetic', '#transfer_learning', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Самоулучшающиеся агенты через долгосрочную рефлексию', 'desc': 'В работе представлена AREX-2 — система для улучшения способности LLM агентов к самосовершенствованию на этапе тестирования путём итеративного уточнения решений. Ключевые компоненты включают рефлексию (генерацию лучших решений) и долгосрочное выполнение (поддержание эффективности итераций). Авторы синтезируют траектории улучшения на задачах машинного обучения и алгоритмического программирования, где доступна верифицируемая обратная связь. Обученный на этих данных агент достигает высоких результатов на нескольких бенчмарках и продолжает улучшаться с увеличением доступных вычислительных раундов.'}, 'en': {'title': 'Empowering LLMs with Self-Improvement through Reflection and Long-Horizon Execution', 'desc': 'The paper introduces AREX-2, a system designed to enhance the self-improvement abilities of large language model (LLM) agents. It focuses on two key capabilities: reflection, which allows the agent to generate better solutions, and long-horizon execution, which ensures that improvements are sustained over multiple iterations. The authors propose that these capabilities can be learned across various domains by using supervised learning techniques. The results demonstrate that training on long-horizon improvement trajectories leads to significant performance gains in various benchmarks, indicating a promising approach for developing self-improving agents.'}, 'zh': {'title': '自我改进代理的长时间反思能力', 'desc': '本文介绍了AREX-2，这是一个旨在提升大型语言模型（LLM）代理自我改进能力的研究。自我改进能力包括反思和长时间执行两个方面，反思能够产生比当前更好的解决方案，而长时间执行则确保在多轮迭代中保持有效性。我们假设这两种能力是领域无关的，可以通过适合监督的场景进行学习。通过合成来自机器学习和算法编程任务的长时间改进轨迹，我们的代理在多个基准测试中取得了优异的成绩，证明了长时间反思数据是实现自我改进代理的有效途径。'}}}, {'id': 'https://huggingface.co/papers/2609.39982', 'title': 'Mid-Harness: Scaling Actions Between Model and Harness for Terminal Agents', 'url': 'https://huggingface.co/papers/2609.39982', 'abstract': 'Abstract  Terminal agents act through stochastic model generations, yet the ability to generate a useful action does not ensure its reliable execution. A poor command (e.g., wrong package install) can change the environment in ways that hinder subsequent progress, even when the model could generate a better alternative. We investigate whether allocating test-time compute at the model-harness boundary can improve action reliability and trajectory success, and what makes this allocation effective. To study these questions, we introduce Mid-Harness, which samples and verifies candidate actions before forwarding one for execution, while keeping the generator and harness unchanged. With a TMAX-9B generator, more action sampling yields little benefit under weak verification, whereas a capable verifier can exploit useful alternatives from the same generator. On TerminalBench-Lite, a GPT-5.6 Sol verifier raises Pass@1 from 50.00% for the base agent to 68.03% with 8 sampled actions. When the same TMAX-9B model serves as the verifier, pairwise verification performs best among the evaluated verification mechanisms. Distilling responses from the stronger verifier into TMAX-9B further improves Pass@1, while leaving the action generator unchanged. With TMAX-9B on TerminalBench-Lite, combining action and trajectory scaling reaches higher success at lower estimated token cost than generating more trajectories alone. Mid-Harness also improves performance across additional models, benchmarks, and harnesses. These findings identify action scaling as a promising target for test-time compute scaling in terminal agents.', 'score': 73, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'f98ec0af687a4fec', 'authors': ['Minki Kang', 'Ryo Hachiuma', 'Shaokun Zhang', 'Subhashree Radhakrishnan', 'Yonggan Fu', 'Jindong Jiang', 'Mingjie Liu', 'Ehsan Hosseini-Asl', 'Yi Dong', 'Yu-Chiang Frank Wang', 'Byung-Kwan Lee'], 'affiliations': ['KAIST', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.39982.jpg', 'data': {'categories': ['#benchmark', '#agents', '#inference'], 'emoji': '🛡️', 'ru': {'title': 'Верификация действий агентов для повышения надежности командной строки', 'desc': 'Исследование показывает, что агенты, работающие в терминале, генерируют действия стохастически, но качество выполнения зависит не только от модели. Авторы предлагают Mid-Harness — подход, который дополнительно проверяет сгенерированные действия перед их выполнением, используя верификатор. Эксперименты демонстрируют, что мощный верификатор может значительно улучшить надежность действий: с помощью верификатора на основе GPT-5.6 точность повышается с 50% до 68% при 8 сэмплах. Метод показывает, что масштабирование количества проверяемых действий на тестовом этапе более эффективно по затратам токенов, чем просто увеличение числа траекторий.'}, 'en': {'title': 'Enhancing Action Reliability in Terminal Agents through Smart Verification', 'desc': 'This paper explores how to improve the reliability of actions taken by terminal agents, which generate actions based on stochastic models. It introduces a method called Mid-Harness that samples and verifies potential actions before executing them, ensuring better outcomes. The study shows that using a strong verifier can significantly increase the success rate of actions, as demonstrated by improved performance metrics on the TerminalBench-Lite benchmark. The findings suggest that optimizing action sampling and verification can enhance the effectiveness of terminal agents without altering the underlying action generation model.'}, 'zh': {'title': '提升终端代理行动可靠性的关键在于验证', 'desc': '本文研究了终端代理在生成随机模型时的行动可靠性问题。即使模型能够生成更好的行动，错误的命令也可能导致环境变化，从而影响后续进展。我们提出了Mid-Harness方法，通过在执行前对候选行动进行采样和验证，来提高行动的可靠性。研究表明，强大的验证器能够从同一生成器中挖掘出有用的替代方案，从而显著提高成功率。'}}}, {'id': 'https://huggingface.co/papers/2609.40340', 'title': 'EvoDuet: Bilevel Co-Evolution of Web Searching and Task Solving for Scientific Discovery', 'url': 'https://huggingface.co/papers/2609.40340', 'abstract': "Abstract  Evolutionary search with large language models (LLMs) can stall when progress requires external knowledge the model lacks. Supplying relevant documents helps, but simply adding web search tool can keep returning the same pages as solutions change. We introduce EvoDuet, a bi-level optimization method that co-evolves solutions and search queries with fixed model parameters. At each iteration, a retrieval gate lets the LLM assess its knowledge gap and choose to retrieve new documents, reuse stored ones, or proceed without them. An inner loop refines queries and ranks documents by the solution scores they are predicted to yield; an outer loop generates candidates in parallel from these documents and records the evaluated outcomes for later searches. Across 21 optimization tasks with one candidate per iteration, EvoDuet raises OpenEvolve's normalized discovery gain from 74.1% to 78.0% with GPT-5.6-Luna and from 61.3% to 82.3% with Gemini-3.8-Flash, whereas Qwen3.5-9B does not benefit. Our best runs surpass the previously reported best scores on eight tasks, including Swap Reduction on Q20 and Rosetta, and match them on three more. EvoDuet also improves with other scaffolds (e.g., Top-K, EvoX) on Sums/Diffs and Denoising, demonstrating its applicability across evolutionary search scaffolds.", 'score': 69, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '7b355dba3a530e6b', 'authors': ['Young-Jun Lee', 'Jinheon Baek', 'Soyeong Jeong', 'Minki Kang', 'Seungyeon Jwa', 'Jonghyun Choi', 'Seungho Han', 'Dongyeop Kang'], 'affiliations': ['Hanyang University', 'KAIST', 'Seoul National University', 'University of Minnesota'], 'pdf_title_img': 'assets/pdf/title_img/2609.40340.jpg', 'data': {'categories': ['#reasoning', '#training', '#benchmark', '#optimization', '#rag'], 'emoji': '🔄', 'ru': {'title': 'Коэволюция решений и запросов в эволюционном поиске с LLM', 'desc': 'В статье предложен метод EvoDuet, который использует совместную оптимизацию двух уровней для эволюционного поиска с большими языковыми моделями. Система позволяет модели самостоятельно решать, когда ей нужно получить новые документы, переиспользовать сохранённые или продолжить работу без внешней информации, избегая бесконечного повтора одних и тех же результатов поиска. Внутренний цикл алгоритма улучшает поисковые запросы и ранжирует документы по предсказанному потенциалу решений, а внешний цикл генерирует кандидаты параллельно и сохраняет результаты для будущих поисков. Экспериментальные результаты показывают значительное улучшение производительности на 21 задаче оптимизации, особенно для моделей GPT и Gemini, с преодолением ранее установленных рекордов на восьми задачах.'}, 'en': {'title': 'EvoDuet: Enhancing Evolutionary Search with Dynamic Knowledge Retrieval', 'desc': 'The paper presents EvoDuet, a novel bi-level optimization method designed to enhance evolutionary search using large language models (LLMs). It addresses the issue of LLMs stalling when they lack external knowledge by allowing the model to dynamically retrieve relevant documents based on its knowledge gaps. The method operates in two loops: the inner loop refines search queries and ranks documents, while the outer loop generates and evaluates candidate solutions. EvoDuet significantly improves discovery gains across various optimization tasks, outperforming previous methods and demonstrating versatility with different evolutionary search frameworks.'}, 'zh': {'title': 'EvoDuet：提升进化搜索的智能选择', 'desc': '本论文介绍了一种名为EvoDuet的双层优化方法，旨在解决大型语言模型（LLMs）在进化搜索中遇到的知识缺口问题。EvoDuet通过共同进化解决方案和搜索查询，允许模型在每次迭代中评估其知识差距，并选择是否检索新文档或重用已有文档。该方法在21个优化任务中表现出色，显著提高了发现增益，超越了之前的最佳成绩。EvoDuet还在其他进化搜索框架中表现良好，显示了其广泛的适用性。'}}}, {'id': 'https://huggingface.co/papers/2609.40325', 'title': 'WorldAuditBench: Interactive 3D World Auditing with Multimodal Agents', 'url': 'https://huggingface.co/papers/2609.40325', 'abstract': 'Abstract  As interactive 3D worlds are increasingly used to study intelligent behavior, it becomes important to develop efficient pipelines for identifying anomalies in these simulated environments, such as floating objects, traversable walls, or objects inconsistent with the surrounding scene. Multimodal AI systems, including vision-language models (VLMs) and vision-language-action models (VLAs), have shown potential for automating this task. However, 3D world auditing is complex, requiring the close coupling of two distinct capabilities: action, to navigate the 3D world and search for anomalies systematically and efficiently; and visual reasoning, to understand the environment and identify anomalies from multimodal observations. It remains largely unexplored whether multimodal agents can effectively couple these two capabilities, using visual reasoning to identify potential anomalies while taking actions to validate them. In this paper, we introduce WorldAuditBench, a benchmark for 3D world auditing comprising 213 anomaly tasks across 13 environments built with Unreal Engine 5 and Three.js, spanning five anomaly families. We evaluate five frontier models under a fixed exploration budget using two auditing paradigms: VLA-based exploration followed by VLM-based anomaly identification, and an end-to-end VLM agent in which visual reasoning directly guides action selection. Across the evaluated models and two paradigms, success rates range from 6.6% to 42.3%, substantially below human performance (83.4%). Through the task of world auditing, WorldAuditBench provides a testbed for studying how multimodal agents couple action and visual reasoning in interactive 3D environments, while highlighting current limitations in their ability to gather and interpret evidence during exploration.', 'score': 66, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '882386f3e4061024', 'authors': ['Ziyan Jiang', 'Jingbo Yang', 'Jiabao Ji', 'Yujian Liu', 'Qiucheng Wu', 'Tommi Jaakkola', 'Yang Zhang', 'Shiyu Chang'], 'affiliations': ['MIT CSAIL', 'MIT-IBM Watson AI Lab', 'UC Santa Barbara'], 'pdf_title_img': 'assets/pdf/title_img/2609.40325.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#dataset', '#agents', '#3d'], 'emoji': '🔍', 'ru': {'title': 'Связывая действие и рассуждение: мультимодальные агенты для аудита виртуальных миров', 'desc': 'Статья представляет WorldAuditBench — новый бенчмарк для оценки мультимодальных AI-систем, которые должны обнаруживать аномалии в интерактивных 3D-окружениях, таких как зависшие объекты или проходимые стены. Исследователи оценивают frontier-модели, включая vision-language models (VLM) и vision-language-action models (VLA), на задаче поиска аномалий в 213 сценариях на 13 виртуальных окружениях. Работа показывает, что мультимодальные агенты должны эффективно комбинировать два навыка: навигацию и систематический поиск в 3D-среде, а также визуальное рассуждение для идентификации аномалий из мультимодальных наблюдений. Результаты демонстрируют значительный разрыв между производительностью текущих моделей (6.6-42.3%) и человеческим уровнем (83.4%), выявляя ограничения агентов в сборе и интерпретации доказательств во время исследования окружения.'}, 'en': {'title': 'Enhancing Anomaly Detection in 3D Worlds with Multimodal AI', 'desc': 'This paper presents WorldAuditBench, a benchmark designed to evaluate how well multimodal AI systems can identify anomalies in interactive 3D environments. The study focuses on two main capabilities: the ability to navigate the 3D world and the ability to reason visually about the environment. Five advanced models were tested under different paradigms, revealing that their success rates in anomaly detection were significantly lower than human performance. The findings highlight the challenges faced by these models in effectively combining action and visual reasoning for anomaly identification.'}, 'zh': {'title': '多模态代理在3D世界中的异常识别挑战', 'desc': '随着交互式3D世界在研究智能行为中的应用日益增加，开发高效的异常识别管道变得至关重要。本文提出了WorldAuditBench，这是一个包含213个异常任务的基准测试，旨在评估多模态人工智能系统在3D环境中的表现。我们评估了五种前沿模型，结果显示它们在异常识别上的成功率远低于人类表现。通过这一任务，WorldAuditBench为研究多模态代理如何在交互式3D环境中结合行动与视觉推理提供了测试平台。'}}}, {'id': 'https://huggingface.co/papers/2609.38143', 'title': 'Learning Meta-Skills for Agent Harness Design in Test-Time AI4AI', 'url': 'https://huggingface.co/papers/2609.38143', 'abstract': "Abstract  Agent performance depends on both reasoning ability and the environment in which it acts. We study test-time AI-for-AI, asking how a Builder can learn to construct better execution environments for a Target while both models' weights remain fixed. To make the Builder's experience reusable, we introduce Meta-Skill: principles specifying when support is needed and what resources to provide. The Builder learns these principles from Target's execution feedback on the development set, then uses the frozen skill bank to construct harnesses for unseen tasks. Across Harness-Bench and NewtonBench, full-bank meta-skills improve macro-average performance by 8.95 percentage points over no-skill construction, and 12.02 points over direct delivery of the same bank to the Target. These results highlight the value of translating experience into executable support. Gains when the same model serves both roles further suggest a path to system level self-improvement through learning to build better environments.", 'score': 44, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '4f02884e1832db0b', 'authors': ['Cheng Qian', 'Kunlun Zhu', 'Beibin Li', 'Zhenhailong Wang', 'Heng Ji'], 'affiliations': ['Apodex', 'University of Illinois Urbana Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.38143.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🏗️', 'ru': {'title': 'Обучение строительству лучших сред выполнения через мета-навыки', 'desc': 'Статья изучает, как одна модель (Builder) может научиться конструировать лучшие окружения для выполнения задач другой моделью (Target) без изменения весов обеих моделей. Авторы предлагают Meta-Skill — набор принципов, которые определяют, когда нужна поддержка и какие ресурсы предоставить для эффективного выполнения. Builder обучается этим принципам на основе обратной связи от Target на развивающем наборе данных, а затем применяет замороженный набор навыков к новым задачам. Экспериментальные результаты показывают значительное улучшение производительности — на 8.95 процентных пункта благодаря использованию полного набора Meta-Skills, что демонстрирует ценность трансформации опыта в практическую поддержку для выполнения задач.'}, 'en': {'title': 'Empowering AI: Building Better Environments for Enhanced Performance', 'desc': "This paper explores how an AI Builder can enhance the performance of a Target AI by creating better execution environments while keeping both models' parameters unchanged. It introduces a concept called Meta-Skill, which consists of guidelines that help the Builder determine when and what resources to provide based on feedback from the Target's performance. By learning from the Target's execution on a development set, the Builder can effectively use a skill bank to create environments for new tasks. The findings show that using these meta-skills significantly improves performance metrics, indicating the potential for self-improvement in AI systems through better environment construction."}, 'zh': {'title': '通过经验提升智能体环境构建能力', 'desc': '本文研究了智能体的表现如何依赖于推理能力和其所处的环境。我们提出了一种名为Meta-Skill的方法，旨在帮助构建者在目标模型的权重保持不变的情况下，学习如何为目标模型构建更好的执行环境。构建者通过从目标模型的执行反馈中学习原则，进而利用这些原则为未见任务构建支持环境。实验结果表明，使用完整的Meta-Skill可以显著提高模型的整体表现，强调了将经验转化为可执行支持的重要性。'}}}, {'id': 'https://huggingface.co/papers/2609.38334', 'title': 'EVOKE: Eliciting World Knowledge in Agents for Transferable Decision-Making', 'url': 'https://huggingface.co/papers/2609.38334', 'abstract': "Abstract  Large language models (LLMs) are increasingly deployed as agents for multi-step decision-making, yet transfer poorly to unseen environments. World-model methods address this by training agents to predict future observations, at the cost of additional training and errors that compound when predictions are used for planning. However, for LLM agents operating in digital environments, much of this world knowledge is already internalized during pretraining, which shifts the problem from acquiring it to eliciting it. We argue that typical post-training provides little pressure for such elicitation, since supervision under a single goal at each visited state inadvertently drives policies to rely on superficial contextual habits. We introduce EVOKE, a post-training method that supplies this pressure through goal diversity at fixed states. Motivated by theory showing that an agent competent across diverse goals must encode a world model recoverable from its action preferences, EVOKE holds the environment state and interaction history fixed and ranks the same candidate actions under alternative goals, forcing action preferences to change, so that a policy relying on contextual habits or single-goal correlations cannot order them correctly. This implicitly elicits the policy's pretrained world knowledge to inform decisions. We evaluate EVOKE across diverse tasks in three backbones, demonstrating improved task performance, unseen environment generalization, and data efficiency. We further conduct controlled analyses to better understand what drives these gains. These findings offer a new perspective on eliciting internalized world knowledge for transferable action through direct decision supervision.", 'score': 40, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'b553c9330050d9f8', 'authors': ['Yuhan Guo', 'Jinming Liu', 'Liang Xu', 'Ziqiang Li', 'Jianguo Huang', 'Zhicheng Wang', 'Hu Zhu', 'Qiuyu Chen', 'Yuntao Wei', 'Xin Jin', 'Wenjun Zeng'], 'affiliations': ['Eastern Institute of Technology, Ningbo', 'Hong Kong Polytechnic University', 'Shanghai Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38334.jpg', 'data': {'categories': ['#reasoning', '#training', '#rlhf', '#transfer_learning', '#agents'], 'emoji': '🌍', 'ru': {'title': 'Раскрытие скрытого мировоззрения языковых моделей через разнообразие целей', 'desc': 'Исследование показывает, что большие языковые модели, используемые как агенты для принятия решений, плохо переносятся на новые окружения. Авторы предлагают EVOKE — метод обучения, который использует разнообразие целевых функций в одинаковых состояниях окружения, чтобы заставить агента раскрыть скрытое знание о мире, которое было усвоено во время предварительного обучения. Ключевая идея заключается в том, что разнообразие целей при ранжировании одних и тех же действий не позволяет политике полагаться на поверхностные корреляции, а требует использования внутреннего мировоззрения. Экспериментальные результаты демонстрируют улучшение производительности задач, обобщение на неизвестные окружения и повышение эффективности использования данных.'}, 'en': {'title': 'Eliciting Internal Knowledge for Better Decision-Making in LLMs', 'desc': 'This paper discusses the challenges faced by large language models (LLMs) when used as decision-making agents in new environments. It introduces a method called EVOKE, which enhances the ability of these models to utilize their pre-existing world knowledge by introducing diverse goals during post-training. By fixing the environment state and varying the goals, EVOKE encourages the model to adapt its action preferences, moving beyond superficial habits. The results show that EVOKE improves performance in various tasks, enhances generalization to unseen environments, and increases data efficiency.'}, 'zh': {'title': 'EVOKE：激发内部知识以提升决策能力', 'desc': '大型语言模型（LLMs）在多步骤决策中应用越来越广泛，但在未见环境中的迁移能力较差。世界模型方法通过训练代理预测未来观察来解决这个问题，但这需要额外的训练，并且在规划时可能导致错误累积。我们提出了EVOKE，这是一种后训练方法，通过在固定状态下提供多样化目标来增强对内部知识的引导。EVOKE通过固定环境状态和交互历史，迫使代理在不同目标下重新评估候选动作，从而有效地引导其利用预训练的世界知识做出决策。'}}}, {'id': 'https://huggingface.co/papers/2609.39045', 'title': 'RSIGame: Autonomous Agentic Game Development with Recursive Self-improvement', 'url': 'https://huggingface.co/papers/2609.39045', 'abstract': "Abstract  Recent advances in large language models have made automatic game generation increasingly feasible, yet reliably improving generated games beyond a playable version remains challenging. Naive iterative refinement can easily overfit a small set of test cases, producing fragile games with unresolved bugs, missing behaviors, and poor generalization to broader player interactions. We introduce RSIGame, an autonomous agentic game development framework with recursive self-improvement. RSIGame organizes development into complementary local and global loops. Concretely, a local explore-diagnose-improve loop broadly explores the executable game, diagnoses and prioritizes discovered issues, and performs evidence-grounded revision, where an evolving checklist continually accumulates new testing and improvement guidance. A global loop tracks overall quality, preserves the best checkpoint, and detects saturation or regression over long-horizon development. Beyond test-time improvement, RSIGame further internalizes successful development experience into the generator through training. Across 140 GameCraft-Bench tasks, two game engines, and five generators, RSIGame consistently improves game quality under matched development budgets. Notably, experience internalization enables Qwen3.8-27B to reach 61.38 on Godot and 58.53 on Phaser, exceeding GPT-5.5 one-shot scores while reducing Qwen's generation tokens by 11 times.", 'score': 31, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'b084cda465267129', 'authors': ['Wenyi Wu', 'Minghao Fu', 'Jieyu You', 'Kun Zhou', 'Siqi Liu', 'Aayush Salvi', 'Yiheng Lin', 'Ce Zhang', 'Xiaohan Lan', 'Jiahui Zhu', 'Yujie Zhong', 'Qi She', 'Biwei Huang'], 'affiliations': ['ByteDance Inc.', 'Carnegie Mellon University', 'University of California San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2609.39045.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents'], 'emoji': '🎮', 'ru': {'title': 'Самосовершенствующийся агент для автоматической разработки игр', 'desc': 'В статье предложена система RSIGame для автоматического улучшения игр, созданных большими языковыми моделями. Система использует рекурсивное самосовершенствование через локальные циклы исследования-диагностики-улучшения, которые выявляют и исправляют ошибки, и глобальные циклы, отслеживающие качество и предотвращающие переобучение. Успешные стратегии развития интернализуются в генератор через обучение, позволяя более компактным моделям достигать качества больших моделей с меньшими вычислительными затратами. Экспериментальные результаты показывают значительное улучшение качества игр на 140 задачах с различными движками и генераторами.'}, 'en': {'title': 'Revolutionizing Game Development with Recursive Self-Improvement', 'desc': 'This paper presents RSIGame, a framework designed to enhance the automatic generation of video games using large language models. It addresses the challenge of improving game quality beyond just making them playable by implementing a recursive self-improvement process. RSIGame features a dual-loop system: a local loop that explores and diagnoses game issues while revising them based on evidence, and a global loop that monitors overall game quality and preserves the best versions. The framework has shown significant improvements in game quality across various tasks and engines, demonstrating its effectiveness in internalizing successful development experiences.'}, 'zh': {'title': 'RSIGame：游戏开发的自我改进框架', 'desc': '最近大型语言模型的进步使得自动游戏生成变得更加可行，但在可玩版本之外可靠地提升生成游戏的质量仍然具有挑战性。简单的迭代改进容易导致过拟合，生成的游戏可能存在未解决的错误和缺失的行为，且对更广泛的玩家互动的泛化能力差。我们提出了RSIGame，一个具有递归自我改进的自主游戏开发框架，组织开发为互补的局部和全局循环。RSIGame通过探索、诊断和改进的局部循环，广泛探索可执行游戏，诊断并优先处理发现的问题，同时通过训练将成功的开发经验内化到生成器中。'}}}, {'id': 'https://huggingface.co/papers/2609.38827', 'title': 'More Choices, Fewer Decisions: Ordinal-Scale Bias in JEV-like Direct-Decision Models', 'url': 'https://huggingface.co/papers/2609.38827', 'abstract': 'Abstract  Direct-decision models turn text into low-latency structured labels and scores, making them attractive for classification and automatic evaluation. Yet reliability requires more than accuracy: a model must also use the ordinal decision scale supplied by the user faithfully. We analyze JEV~1.13 and three open KEV models. Our investigation begins with ANLI, where JEV assigns 38.8\\% of all predictions and 51.3\\% of errors to Neutral despite 74.95\\% accuracy, nearly balanced gold labels, and balanced candidate positions. Across 36 ordinal datasets, final decisions use only 67--76\\% of the effective gold support, versus 87--102\\% on four nominal tasks. Randomizing candidate order weakens but does not remove this compression. Holding items and source scores fixed while balancing gold support and positions, we refine scales from K=2 to 14; utilization falls for every model and reaches 26--75\\% at K=14, although candidate probabilities remain broad for most models. Targeted BA-LoRA post-training raises gold-relative utilization from roughly 47\\% to 86\\% on eight supervised scales at both KEV sizes, showing that the compression is learned and modifiable rather than an immutable architectural limit. We call this ordinal scale-utilization bias: decision-stage candidate-space compression distinct from accuracy, gold imbalance, fixed position, and candidate count alone. The code and data are available at https://github.com/Glax147/jev_ordinal_scale_bia', 'score': 31, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '9cd2b1b9c2ee829f', 'authors': ['Tianxiang Gao', 'Jinzhe Li', 'Zhiyuan Li', 'Yi Chang', 'Yuan Wu'], 'affiliations': ['College of Software, Jilin University', 'Engineering Research Center of Knowledge-Driven Human-Machine Intelligence, Jilin University', 'International Center of Future Science, Jilin University', 'School of Artificial Intelligence, Jilin University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38827.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Модели игнорируют порядковые шкалы: как научить их быть честными судьями', 'desc': 'Исследование показывает, что прямые модели принятия решений на основе текста недостаточно эффективно используют предоставленные пользователем порядковые шкалы оценок, хотя и показывают высокую точность. Авторы проанализировали несколько моделей и обнаружили, что при классификации с порядковыми метками модели используют только 67-76% эффективной поддержки, в то время как для номинальных задач этот показатель достигает 87-102%. Проблема заключается в том, что модели сжимают пространство кандидатов на этапе принятия решений, отдавая предпочтение определённым классам вместо сбалансированного распределения по всей шкале. Применение специализированного дообучения BA-LoRA успешно повысило использование шкалы с 47% до 86%, доказав, что это смещение является приобретённым и корректируемым, а не архитектурным ограничением.'}, 'en': {'title': 'Enhancing Ordinal Scale Utilization in Direct-Decision Models', 'desc': 'This paper investigates how direct-decision models handle ordinal data in classification tasks. It highlights that while these models can achieve high accuracy, they often fail to utilize the full range of ordinal labels provided by users. The authors analyze various models and find that many decisions are compressed, leading to a significant loss of information. They propose a method to improve the utilization of ordinal scales, demonstrating that this compression can be adjusted through targeted post-training techniques.'}, 'zh': {'title': '序数尺度利用偏差：超越准确率的决策模型分析', 'desc': '本文探讨了直接决策模型在文本分类和自动评估中的应用，强调了模型在使用用户提供的序数决策尺度时的可靠性。我们分析了JEV~1.13和三个开放的KEV模型，发现尽管准确率高达74.95%，但模型在预测中对中立标签的分配存在偏差。通过对36个序数数据集的研究，发现最终决策仅利用了67%到76%的有效金标准支持。我们提出了序数尺度利用偏差的概念，表明这种压缩是可学习和可修改的，而非固定的架构限制。'}}}, {'id': 'https://huggingface.co/papers/2609.38177', 'title': 'Imagine3D-LLM: Teaching MLLMs to Imagine 3D Scenes Before Answering', 'url': 'https://huggingface.co/papers/2609.38177', 'abstract': "Abstract  Reasoning about the 3D world from multi-view images remains a fundamental challenge for Multimodal Large Language Models (MLLMs). While modern MLLMs handle single-image inputs effectively, they struggle to integrate evidence across viewpoints into a coherent 3D understanding. A growing body of work attempts to close this gap by injecting 3D awareness into MLLMs, either by boosting fine-grained pixel-level cross-view correspondence or by fusing features from 3D geometry foundation models, yet a substantial gap to human reasoning persists. In this work, we revisit human spatial reasoning, which suggests that rather than relying on fine-grained geometry cues, humans roughly identify common objects across views, infer the relative geometry between viewpoints, and assemble a coarse 3D layout of the scene. Inspired by this process, we introduce Imagine3D-LLM, an MLLM that learns to assemble a similar compact 3D representation of the scene and conditions its answer on this representation. Concretely, we append a small set of learnable summary tokens after the image tokens, decode them into a compact 3D Gaussian Splatting representation supervised by a photometric reconstruction loss, and train jointly with the standard next-token prediction objective. Notably, although only the summary tokens receive direct reconstruction supervision, this objective also induces stronger cross-frame correspondence within the LLM's underlying image features, suggesting that learning to reconstruct propagates 3D-aware signals throughout the model. As a result, Imagine3D-LLM consistently outperforms prior approaches across multiple spatial reasoning and 3D understanding benchmarks, suggesting that imagining the scene can be more effective than being told its pixel-wise geometry.", 'score': 29, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '3c5fb8a650cb0638', 'authors': ['Jaewoo Jung', 'Hyeonseo Yu', 'Honggyu An', 'Jisang Han', 'Mungyeom Kim', 'Minkyeong Jeon', 'Heeseong Shin', 'Wonjun Moon', 'Federico Tombari', 'Daniel Barath', 'Marc Pollefeys', 'Seungryong Kim', 'Sunghwan Hong'], 'affiliations': ['ETH AI Center', 'ETH Zürich', 'Google', 'KAIST', 'TUM'], 'pdf_title_img': 'assets/pdf/title_img/2609.38177.jpg', 'data': {'categories': ['#training', '#reasoning', '#multimodal', '#3d'], 'emoji': '🌍', 'ru': {'title': 'Воображение трёхмерной сцены эффективнее, чем пиксельная геометрия', 'desc': 'В работе предлагается подход Imagine3D-LLM для улучшения понимания трёхмерного мира многомодальными большими языковыми моделями на основе мультивью изображений. Вместо использования детальных геометрических соответствий между пикселами, модель обучается создавать компактное представление сцены, вдохновляясь тем, как люди рассуждают о пространстве — через идентификацию объектов и вывод относительной геометрии между видами. Ключевой инновацией является добавление обучаемых токенов-резюме, которые декодируются в представление 3D Gaussian Splatting с использованием фотометрического loss для реконструкции. Экспериментальные результаты показывают, что обучение на задаче реконструкции распространяет 3D-осведомлённые сигналы по всей модели и позволяет достичь лучших результатов на бенчмарках пространственного рассуждения.'}, 'en': {'title': 'Imagine 3D: Learning Spatial Reasoning Beyond Pixels', 'desc': "This paper addresses the challenge of understanding 3D scenes from multiple images using Multimodal Large Language Models (MLLMs). It highlights that while current models excel with single images, they struggle to synthesize information from different viewpoints into a cohesive 3D representation. The authors propose Imagine3D-LLM, which learns to create a simplified 3D layout by using summary tokens that capture essential spatial information, rather than relying solely on detailed geometric data. This approach not only improves the model's ability to reason about space but also enhances the overall performance on various benchmarks for spatial reasoning and 3D understanding."}, 'zh': {'title': '想象三维，超越几何理解', 'desc': '这篇论文探讨了如何从多视角图像中推理三维世界，这是多模态大型语言模型（MLLMs）面临的一个重要挑战。虽然现代的MLLMs在处理单幅图像时表现良好，但在整合不同视角的信息以形成一致的三维理解方面仍然存在困难。研究者们提出了一种新的模型Imagine3D-LLM，该模型通过学习构建紧凑的三维场景表示，并在此基础上生成答案，从而提高了空间推理和三维理解的能力。实验结果表明，Imagine3D-LLM在多个基准测试中优于之前的方法，表明想象场景的方式比单纯依赖像素几何信息更有效。'}}}, {'id': 'https://huggingface.co/papers/2609.40111', 'title': 'Agent Error Dataset: Scaling 50,000 Error--Diagnosis Pairs for Failure Analysis and Error-Aware Post-Training', 'url': 'https://huggingface.co/papers/2609.40111', 'abstract': "Abstract  An unsuccessful LLM agent rollout contains more information than its final reward: the observations available to the agent, the actions it chose, and the environment's responses. Reusing this experience for learning requires identifying a decision to revise and testing a concrete alternative. We introduce the Agent Error Dataset (AED), comprising 50,228 error-diagnosis pairs from 9,961 source tasks across 33 environments, 19 harness families, and 23 policy models in text-based agent systems. We retain source traces and execution metadata to support cross-setting failure analysis and re-diagnosis without repeating the original rollout. Our five-stage Agentic Error-to-Training (AET) pipeline collects natural failures, generates diagnoses and proposed corrections, and checks them against recorded evidence. Where replay is supported, we compare corrections with original-action retries from the same checkpoint under matched execution settings. We then construct separate training views for diagnosis and actor recovery. Across 3,062 matched replay pairs, first-proposal corrections raise verifier pass rates from 18.4% to 51.1%, a gain of 32.7 percentage points. Using a separately frozen diagnosis release, full-diagnosis fine-tuning on 1,656 source tasks raises Qwen3-8B's exact-step agreement with internal teacher labels from 47.2% to 63.6%, averaged over three seeds on a 943-case holdout. The strongest prompted reference in this comparison scores 54.7%, and mean agreement improves at each of four increasing training-set sizes. In a single-seed comparison of actor-training recipes, action-only repair training scores 6.67 percentage points higher on WebShop-lite than success-only training.", 'score': 22, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '662dccb1e706c6ae', 'authors': ['Kunlun Zhu', 'Xuyan Ye', 'Yibo Li', 'Cheng Qian', 'Beibin Li', 'Heng Ji'], 'affiliations': ['Apodex'], 'pdf_title_img': 'assets/pdf/title_img/2609.40111.jpg', 'data': {'categories': ['#training', '#dataset', '#agents', '#rlhf'], 'emoji': '🔧', 'ru': {'title': 'Учимся на ошибках агентов: как превратить неудачи в знание', 'desc': 'В статье предлагается набор данных Agent Error Dataset (AED) для обучения языковых моделей на ошибках агентов, содержащий более 50 тысяч пар ошибок и их диагнозов из различных сценариев и сред. Авторы разработали пятиэтапный конвейер Agentic Error-to-Training (AET), который собирает неудачные попытки агентов, генерирует диагнозы проблем и предлагает исправления, проверяя их против сохранённых данных выполнения. Эксперименты показывают, что предложенные исправления повышают точность верификации с 18.4% до 51.1%, а fine-tuning на диагнозах улучшает согласованность модели Qwen3-8B с эталонными метками с 47.2% до 63.6%. Подход демонстрирует, что детальный анализ ошибок без повторного выполнения сценариев позволяет значительно улучшить качество обучения агентов.'}, 'en': {'title': 'Learning from Mistakes: Enhancing Agent Performance through Error Analysis', 'desc': 'This paper presents the Agent Error Dataset (AED), which captures valuable information from unsuccessful agent rollouts in machine learning. The dataset includes over 50,000 error-diagnosis pairs from various tasks and environments, allowing for detailed analysis of agent failures. The authors propose a five-stage pipeline called Agentic Error-to-Training (AET) to utilize this data for improving agent performance through diagnosis and corrective actions. Results show that using first-proposal corrections significantly enhances the success rates of agents, demonstrating the potential of leveraging past failures for better training outcomes.'}, 'zh': {'title': '利用错误数据提升智能体学习效果', 'desc': '本文介绍了一种新的数据集，称为代理错误数据集（AED），它包含来自多个环境和任务的错误诊断对。通过分析这些错误，研究者可以识别需要修正的决策，并测试具体的替代方案。我们提出的五阶段代理错误到训练（AET）流程能够收集自然失败，生成诊断和建议的修正，并与记录的证据进行对比。实验结果表明，使用这些修正可以显著提高模型的性能，尤其是在行动修复训练中。'}}}, {'id': 'https://huggingface.co/papers/2609.32264', 'title': 'LANTERN: Illuminating Hidden Mathematical Knowledge in Language Models', 'url': 'https://huggingface.co/papers/2609.32264', 'abstract': "Abstract  Language models can now prove theorems, but people still decide which problems to pursue. We ask whether a model's internal representations can help identify promising mathematical connections. We develop LANTERN, a fast, cost-efficient pipeline that uses a classifier over pretrained-model activations to rank candidate relations, followed by staged filtering, hypothesis generation, executable verification, and analytical checking. Applied to the On-Line Encyclopedia of Integer Sequences (OEIS), LANTERN ranked 50 million pairs among 10,000 frequently referenced sequences and produced 62 verified relations between pairs without an existing OEIS cross-reference. A content screen retained 13 relations worth presenting; nine of these are informative or insightful, including four which are entirely novel to the best of our knowledge: none appears in the OEIS or in our targeted literature search. The entire end-to-end process including classifier training, candidate ranking, filtering and verification took under 8 hours.", 'score': 19, 'issue_id': 3359, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '5a8b35093161964d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Автоматическое открытие математических закономерностей через активации языковых моделей', 'desc': 'В работе предложен LANTERN — эффективный конвейер для обнаружения скрытых математических связей между последовательностями с использованием внутренних представлений языковых моделей. Система применяет классификатор на активациях предварительно обученной модели для ранжирования кандидатов, а затем использует многоэтапную фильтрацию, генерацию гипотез и верификацию. На базе энциклопедии целочисленных последовательностей OEIS алгоритм обработал 50 миллионов пар и открыл 62 новые математические отношения, из которых 9 являются информативными, включая 4 полностью новых закономерности. Весь процесс, от обучения классификатора до проверки результатов, занял менее 8 часов.'}, 'en': {'title': 'LANTERN: Illuminating New Mathematical Connections with AI', 'desc': 'This paper introduces LANTERN, a machine learning pipeline designed to identify promising mathematical connections using language models. It employs a classifier that analyzes the internal activations of pretrained models to rank potential relationships between mathematical sequences. The system efficiently filters and verifies these relationships, resulting in the discovery of novel connections that were not previously documented. Overall, LANTERN demonstrates a rapid and effective approach to theorem proving in mathematics by leveraging advanced machine learning techniques.'}, 'zh': {'title': '利用LANTERN发现数学新关系', 'desc': '本文介绍了一种名为LANTERN的快速高效管道，用于利用预训练模型的内部表示来识别有前景的数学关系。该方法通过分类器对候选关系进行排名，并进行分阶段过滤、假设生成、可执行验证和分析检查。LANTERN在整数序列在线百科全书（OEIS）上应用，成功从10000个常引用序列中排名出5000万对，并验证了62个新关系。整个过程，包括分类器训练、候选排名、过滤和验证，耗时不到8小时。'}}}, {'id': 'https://huggingface.co/papers/2609.37863', 'title': "It's Not What the Image Shows: Irrelevant Context Destabilises VLM Judges Without Informing Them", 'url': 'https://huggingface.co/papers/2609.37863', 'abstract': "Abstract  Vision-language models (VLMs) are increasingly used in place of human annotators, making it important that substitutability tests reflect the model rather than incidental evaluation conditions. We introduce MIST, the Misleading-Image Stress Test: 200 English sentences, each built around a phrase readable either figuratively or literally and shown with an aligned image depicting its reading, a misleading image depicting the opposite, or no image at all. The guidelines require the label to be decided from the sentence alone, so no image should change any answer. We expected each image to pull a judge's labels toward the sense it depicts, and neither kind did. Across thirteen VLM judges, an aligned image changed 20.5% of labels and a misleading one 19.4%, close for every judge and both above the 11.6% produced by deleting the ignore-the-image instruction with the image left in place. Yet only 37% of the labels that differ between the two images moved toward the sense shown, and agreement with our human annotators is unchanged whether the image is absent, aligned or misleading. The effect is smaller in the seven judges that pass the alt-test than in the six that never do, but present in all of them: what moves a judge is that an image is there, not which of the two it is, so a substitutability verdict describes a configuration as much as a model.", 'score': 14, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'e1c3925ac94b3f0f', 'authors': ['Nagham Omar', 'Mahmoud Jabarin', 'Kinan Ibraheem', 'Lotem Peled-Cohen'], 'affiliations': ['Faculty of Data and Decision Sciences, Technion'], 'pdf_title_img': 'assets/pdf/title_img/2609.37863.jpg', 'data': {'categories': ['#benchmark', '#cv', '#multimodal', '#dataset'], 'emoji': '🖼️', 'ru': {'title': 'Наличие изображения важнее его содержания: о надёжности оценки VLM моделей', 'desc': 'В работе представлен тест MIST для оценки того, насколько хорошо модели зрения и языка (VLM) могут заменить человеческих аннотаторов. Исследователи создали набор из 200 английских предложений с фразами, которые можно понимать буквально или фигурально, и показывали их с тремя вариантами изображений: соответствующим смыслу фразы, противоположным смыслом или без изображения. Неожиданно обнаружилось, что для всех 13 протестированных VLM-моделей наличие изображения влияет на результаты одинаково (около 20%), независимо от того, совпадает ли оно с текстом или противоречит ему. Авторы заключают, что эффект зависит не от содержания изображения, а просто от его присутствия, что говорит о важности учёта условий оценки при проверке подменяемости моделей на место людей.'}, 'en': {'title': 'MIST: Testing the True Impact of Images on VLMs', 'desc': 'This paper introduces MIST, a test designed to evaluate how vision-language models (VLMs) respond to images that are either aligned with or misleading to the text they accompany. The study reveals that both aligned and misleading images significantly influence the labels assigned by judges, indicating that the mere presence of an image affects decision-making more than its content. Despite this influence, the agreement between VLM outputs and human annotators remains consistent regardless of the image type, suggesting that VLMs may not fully understand the context of the images. The findings highlight the need for careful evaluation of VLMs, as their performance can be affected by the testing conditions rather than their inherent capabilities.'}, 'zh': {'title': '图像影响判断，模型评估需更全面', 'desc': '本文介绍了一种新的测试方法，称为MIST（误导图像压力测试），用于评估视觉语言模型（VLMs）的替代性。该测试使用200个英语句子，每个句子配有一个相关图像、一个误导图像或没有图像，旨在检验图像对判断的影响。结果显示，相关图像和误导图像都对判断结果产生了显著影响，但影响的方向并不一致。研究表明，判断者的选择更多是受到图像存在的影响，而不是图像的具体内容，因此替代性评估不仅反映模型本身，也反映了测试的配置。'}}}, {'id': 'https://huggingface.co/papers/2609.39841', 'title': 'DyRAD: Radar Novel View Synthesis for Dynamic Driving Scenes', 'url': 'https://huggingface.co/papers/2609.39841', 'abstract': "Abstract  Reconstructing dynamic driving scenes from recorded sensor data supports closed-loop evaluation of autonomous driving systems by synthesizing observations beyond the original trajectory. Unlike cameras and LiDAR, radar measures radial velocity directly through Doppler. Yet existing radar novel-view synthesis fails to exploit this capability: methods addressing dynamic scenes reconstruct only range-azimuth tensors, while methods that render Doppler assume static scenes. Moreover, because radar processing spreads each reflection across multiple bins, existing representations absorb this spread into scene geometry, causing it to render incorrectly when the viewpoint moves. We present DyRAD, which models dynamic driving scenes using static background reflectors and motion-tracked dynamic point reflectors to render complete range-azimuth-Doppler (RAD) tensors. Reflector velocities are derived from object tracks and projected onto the line of sight, making Doppler both a rendered output and supervision for those tracks. Crucially, we render reflectors through a fixed analytic point-spread function (PSF) derived from the radar's signal-processing chain, preventing sensor-induced spread from being baked into the scene representation. Beyond improving scene reconstruction, this separation also enables zero-shot sensor-configuration transfer, allowing the same reconstructed scene to be rendered under different radar specifications without refitting. We evaluate DyRAD on RADIal, Boreas, and a synthetic benchmark across both on-path poses and displaced viewpoints untested by prior work. On RADIal, DyRAD recovers radar detections in 90.7% of reference-detected objects, compared with 26.9% for the strongest baseline.", 'score': 14, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '5fa6e9976c23ce06', 'authors': ['Merav Keidar', 'Tomer Borreda', 'Rajalakshmi Nandakumar', 'Or Litany'], 'affiliations': ['Cornell Tech', 'NVIDIA', 'Technion'], 'pdf_title_img': 'assets/pdf/title_img/2609.39841.jpg', 'data': {'categories': ['#3d', '#synthetic', '#dataset', '#benchmark', '#cv'], 'emoji': '📡', 'ru': {'title': 'Доплеровский радар встречает синтез новых видов динамических сцен', 'desc': 'Статья описывает DyRAD — метод для синтеза новых представлений динамических сцен дорожного движения из данных радара. Ключевое отличие работы заключается в том, что авторы используют радиальную скорость (эффект Доплера) как напрямую измеряемую характеристику, а не только как побочный продукт, что позволяет более точно моделировать движение объектов. Модель разделяет сцену на статичные отражатели фона и динамические точечные отражатели объектов, отслеживая их движение для синтеза полных тензоров range-azimuth-Doppler. Критически важным является использование аналитической функции рассеяния точки (PSF), которая исключает артефакты сенсора из геометрии сцены и позволяет переносить обученную сцену на радары с разными характеристиками без переобучения.'}, 'en': {'title': 'Revolutionizing Radar Scene Reconstruction with DyRAD', 'desc': 'This paper introduces DyRAD, a novel approach for reconstructing dynamic driving scenes using radar data. Unlike previous methods that either ignore Doppler effects or misrepresent dynamic objects, DyRAD effectively combines static and dynamic reflectors to create accurate range-azimuth-Doppler (RAD) tensors. By utilizing a fixed point-spread function, DyRAD prevents sensor-induced distortions from affecting the scene representation, allowing for better scene reconstruction and adaptability to different radar configurations. The results show significant improvements in object detection accuracy compared to existing methods, demonstrating the effectiveness of this new approach.'}, 'zh': {'title': 'DyRAD：动态场景重建的新方法', 'desc': '本论文提出了一种名为DyRAD的方法，用于从传感器数据重建动态驾驶场景，以支持自动驾驶系统的闭环评估。与传统的相机和激光雷达不同，雷达通过多普勒效应直接测量径向速度，但现有的雷达新视角合成方法未能充分利用这一能力。DyRAD通过静态背景反射器和动态点反射器的运动跟踪来建模动态场景，从而生成完整的范围-方位-多普勒（RAD）张量。该方法不仅提高了场景重建的准确性，还实现了零-shot传感器配置转移，使得在不同雷达规格下重建的场景无需重新调整。'}}}, {'id': 'https://huggingface.co/papers/2609.33355', 'title': 'Unmask the State: When Does State Adaptation Matter for Masked Diffusion Language Models', 'url': 'https://huggingface.co/papers/2609.33355', 'abstract': 'Abstract  Masked diffusion language models (MDMs) admit flexible generation orders, making the unmasking strategy an inference decision. Existing methods vary in how they prioritize positions, control parallelism, restrict selection regions, revise predictions, or plan future denoising, yet it remains unclear when these choices should change during generation. We study this question through strategy reversals, where an alternative action becomes preferable to a fixed choice. We organize MDM inference into five axes--score, cardinality, region, commitment, and planning--and define adaptation opportunity as the one-step utility advantage of the best candidate action over a validation-selected fixed action. This view shows that adaptation value depends on both the frequency and magnitude of such reversals. Across three MDMs and ten tasks, adaptation opportunities are highly heterogeneous, with some regimes exhibiting concentrated and predictable one-step gains. This motivates selective adaptation: lightweight detectors calibrated on validation prompts identify high-opportunity states, capturing, for example, 56.9 percent of the candidate-set oracle opportunity by adapting only the top 10 percent of states on LLaDA-8B constrained JSON filling. Our transition-level results suggest that state adaptation is most useful when applied selectively rather than uniformly.', 'score': 14, 'issue_id': 3358, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': '384cddb1cdaf81e9', 'authors': ['Injin Kong', 'Sunghwan Choi', 'Yohan Jo'], 'affiliations': ['Graduate School of Data Science, Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2609.33355.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Адаптивные стратегии развёртывания масок: когда менять решение во время генерации', 'desc': 'В работе исследуются маскированные диффузионные языковые модели, которые позволяют генерировать текст в произвольном порядке, что делает стратегию раскрытия масок критической для качества. Авторы предлагают систематический анализ инференции через пять ключевых параметров: оценку качества предсказаний, количество параллельных операций, выбор регионов, фиксацию выборов и планирование дальнейшего процесса. Они вводят концепцию адаптивных возможностей, которая измеряет, когда имеет смысл изменить стратегию во время генерации, и показывают, что эффективная адаптация должна быть избирательной. Экспериментальные результаты демонстрируют, что применение лёгких детекторов для выявления состояний с высоким потенциалом адаптации позволяет достичь значительного улучшения при модификации только 10% процентов шагов генерации.'}, 'en': {'title': 'Selective Adaptation in Masked Diffusion Models for Enhanced Performance', 'desc': 'This paper explores how masked diffusion language models (MDMs) can adapt their generation strategies during inference to improve performance. It introduces the concept of adaptation opportunities, which are situations where changing the generation strategy can lead to better outcomes. The authors analyze five axes of MDM inference and demonstrate that selective adaptation, where only certain high-opportunity states are adjusted, can significantly enhance model efficiency. Their findings indicate that not all states require adaptation, and focusing on the most promising ones yields substantial benefits.'}, 'zh': {'title': '选择性适应：提升掩蔽扩散语言模型的生成效率', 'desc': '本文研究了掩蔽扩散语言模型（MDMs）在生成过程中的灵活性，特别是如何选择解码策略。我们提出了五个维度来组织MDM推理，包括得分、基数、区域、承诺和规划，并定义了适应机会为最佳候选动作相对于固定动作的一步效用优势。研究表明，适应价值依赖于策略反转的频率和幅度，且在不同任务中适应机会表现出高度异质性。通过选择性适应，我们可以有效识别高机会状态，从而提高生成效率。'}}}, {'id': 'https://huggingface.co/papers/2609.38660', 'title': 'Breaking Babel: A Self-Evolving Multi-Agent System for Long-Form Subtitle Translation', 'url': 'https://huggingface.co/papers/2609.38660', 'abstract': 'Abstract  Long-form subtitle translation requires reasoning over discourse and cultural context spanning episodes or entire series, while maintaining consistent terminology and style. Existing single-LLM methods are largely sentence-level, and multi-agent systems often use static workflows that do not adapt to scene complexity or production context. We propose SMART, a Self-evolving Multi-Agent system for long-foRm subtitle Translation. During test-time training, SMART builds persistent series-level memory and translates a subset of sentences through a dynamic router and Mixture-of-Agents layer with tools for terminology verification, subtitle constraint validation, and contextual retrieval. A judge-refiner loop scores candidates and uses textual critiques to update agent prompts and routing policies without retraining the underlying LLMs. During test-time inference, the evolved configuration translates the remaining series. We also introduce Subtitle Arena, covering 14 genres, 2--198 episodes per series, production years 1959--2023, and 15 target locales, together with SubMQM, a subtitle-adapted MQM framework with seven dimensions and 19 error categories. SMART achieves the best overall MQM score in all 15 Subtitle Arena directions, reducing average penalty by 6.9% over the strongest competing agent system. On the public MuSC benchmark, SMART obtains the best model result across all four language pairs and also achieves the best human-evaluation result, with an overall score of 4.50/5.', 'score': 14, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'db1b548ea851bca9', 'authors': ['Haibo Jin', 'Xinjie Li', 'Najmeh Sadoughi', 'Yang Liu', 'Yibo Wang', 'Zhu Liu', 'Yuzong Liu'], 'affiliations': ['Amazon', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.38660.jpg', 'data': {'categories': ['#reasoning', '#open_source', '#benchmark', '#dataset', '#machine_translation', '#agents', '#multilingual'], 'emoji': '🎬', 'ru': {'title': 'Умная система многоагентного перевода с самообучением во время работы', 'desc': 'Статья описывает SMART — систему на основе нескольких агентов для перевода длинных субтитров сериалов. Система учитывает контекст всего сериала, ведёт память о терминологии и стиле, и использует динамическую маршрутизацию для выбора оптимального агента. Во время тестирования система обучается сама себя, обновляя подсказки агентов на основе критики судьи без переобучения базовых LLM моделей. Авторы также создали большой датасет Subtitle Arena с субтитрами из 14 жанров и новую метрику оценки качества SubMQM, специально адаптированную для субтитров.'}, 'en': {'title': 'SMART: Evolving Subtitle Translation for Contextual Accuracy', 'desc': 'The paper presents SMART, a Self-evolving Multi-Agent system designed for translating long-form subtitles while considering discourse and cultural context. Unlike traditional methods that operate at the sentence level, SMART utilizes a dynamic routing mechanism and a Mixture-of-Agents layer to adapt to the complexity of scenes and production contexts. It incorporates a judge-refiner loop that allows for real-time updates to agent prompts and routing policies based on performance feedback, enhancing translation quality without retraining the underlying models. The system demonstrates superior performance on the Subtitle Arena and MuSC benchmarks, achieving the best scores in multiple translation directions and language pairs.'}, 'zh': {'title': '智能字幕翻译的自我进化系统', 'desc': '这篇论文提出了一种名为SMART的自我进化多智能体系统，用于长篇字幕翻译。SMART在测试时训练
