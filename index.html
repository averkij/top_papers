rk designed for recursive self-improvement in machine learning agents. It dynamically selects specific workflows based on feedback from their execution, allowing the agents to adapt and refine their skills over time. By diagnosing performance bottlenecks and evolving its orchestration methods, RSIFlow enhances the overall efficiency of the agents. Experiments show that this approach achieves state-of-the-art performance across various benchmarks, demonstrating its effectiveness in improving agent capabilities.'}, 'zh': {'title': '递归自我改进的智能框架', 'desc': 'RSIFlow是一个递归自我改进框架，它根据执行反馈动态选择特定组件的工作流程，并发展一个元代理来优化协调和技能。该框架能够诊断任务代理轨迹和环境反馈中的性能瓶颈，从而动态选择改进工作流程。元代理将工作流程的结果提炼为特定组件的技能和跨组件的原则，进而演化自身的工具以改善后续的工作流程协调。实验结果表明，RSIFlow在六个基准测试和两个基础模型上达到了最先进的平均性能。'}}}, {'id': 'https://huggingface.co/papers/2610.17816', 'title': 'Empowering Edge Agents: A Systematic Analysis of Edge-Cloud Collaboration in LLM Agent Execution', 'url': 'https://huggingface.co/papers/2610.17816', 'abstract': 'Abstract EC2-Bench evaluates edge-cloud collaboration for long-horizon LLM agents, revealing trade-offs among performance, resource use, and privacy, and showing that stronger edge models favor more edge-controlled collaboration.  Generated by thinkingmachines/Inkling-Small Edge-cloud collaboration combines the lower inference overhead and greater data locality of edge-side execution with the stronger capabilities of cloud-hosted models. However, as LLM agents increasingly operate in long-horizon scenarios, cloud participation becomes interleaved throughout execution rather than a one-shot decision for each query. Such interleaved participation introduces trajectory-level effects that remain insufficiently understood. To address this gap, we introduce EC2-Bench, a benchmark for evaluating edge-cloud collaboration in long-horizon agent execution. It provides executable digital-workspace agent tasks and a unified evaluation framework covering task performance, resource usage, and privacy exposure. Using this benchmark, we empirically study diverse forms of edge-cloud collaboration. Our study reveals three findings. First, collaboration achieves a favorable balance among task performance, resource usage, and privacy exposure compared with edge-only and cloud-only execution. Second, as edge models become stronger, collaborative execution approaches cloud-only performance, and performance differences across strategies shrink, while privacy exposure remains strongly strategy-dependent. Third, stronger edge capability shifts preferred collaboration from externally controlled cloud participation and direct cloud execution toward more edge-controlled collaboration. Further analyses identify cloud-invocation decision-making and instruction following as important edge-side abilities for effective collaboration. These findings provide a systematic understanding of edge-cloud collaboration in long-horizon agent execution and insights for designing future edge agents that effectively collaborate with cloud models. Code and resources are available at https://github.com/OpenBMB/EC2-Bench.', 'score': 4, 'issue_id': 3436, 'pub_date': '2026-10-13', 'pub_date_card': {'ru': '13 октября', 'en': 'October 13', 'zh': '10月13日'}, 'hash': '5c9cea802813ed61', 'authors': ['Pengcheng Huang', 'Zhenghao Liu', 'Shixin Ren', 'Shi Yu', 'Sijia Yao', 'Yukun Yan', 'Chaojun Xiao', 'Maosong Sun'], 'affiliations': ['China Mobile Online Services Co., Ltd.', 'Northeastern University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.17816.jpg', 'data': {'categories': ['#agents', '#benchmark', '#small_models'], 'emoji': '🤝', 'ru': {'title': 'Сильный edge — меньше зависимости от облака и больше контроля у себя', 'desc': 'Авторы представляют EC2-Bench — бенчмарк для оценки совместной работы edge и cloud моделей в долгосрочных LLM-агентах, где облако подключается к выполнению задач многократно, а не один раз. Бенчмарк включает исполняемые задачи в цифровом рабочем пространстве и оценивает качество решения, потребление ресурсов и утечку приватных данных. Эксперименты показывают, что коллаборация даёт лучший баланс между этими метриками, чем работа только на edge или только в cloud. С ростом мощности edge-моделей их результаты приближаются к cloud-only, а предпочтительной становится стратегия с большим контролем со стороны edge; ключевыми навыками edge-модели названы принятие решения о вызове облака и следование инструкциям.'}, 'en': {'title': 'Optimizing Edge-Cloud Collaboration for LLM Agents', 'desc': 'The paper introduces EC2-Bench, a benchmark designed to evaluate how edge and cloud computing can work together for long-horizon large language model (LLM) agents. It highlights the trade-offs between performance, resource usage, and privacy when using edge-cloud collaboration compared to using only edge or cloud resources. The study finds that stronger edge models can lead to better collaboration, making edge-controlled execution more favorable. Additionally, it emphasizes the importance of decision-making and instruction-following capabilities on the edge side for effective collaboration with cloud models.'}, 'zh': {'title': '边缘云协作：性能与隐私的平衡', 'desc': 'EC2-Bench 是一个评估边缘云协作的基准，专注于长时间运行的 LLM 代理。它揭示了性能、资源使用和隐私之间的权衡，并表明更强的边缘模型更倾向于边缘控制的协作。通过这个基准，我们可以系统地研究不同形式的边缘云协作，发现协作能够在任务性能、资源使用和隐私暴露之间取得良好的平衡。研究还表明，随着边缘模型能力的增强，协作执行的性能接近云端执行，同时隐私暴露依然受到策略的强烈影响。'}}}, {'id': 'https://huggingface.co/papers/2610.16078', 'title': 'Heterogeneous Agentic Coevolution', 'url': 'https://huggingface.co/papers/2610.16078', 'abstract': "Abstract HACE is a framework that jointly evolves specialized foundation models and LLM agents through reciprocal learning and evolutionary optimization of their interaction harness, improving performance across recommendation, protein prediction, and materials discovery.  Generated by thinkingmachines/Inkling-Small Recent advances in self-improving LLM agents have demonstrated the potential of AI systems that drive their own intelligence. However, many domain-specific applications rely on specialized foundation models that possess strong domain expertise but remain dependent on human-designed improvements. Extending recursive self-improvement to these models presents a key challenge: as a specialist improves, the strategies used to advance it must also adapt. To address this challenge, we propose Heterogeneous Agentic CoEvolution (HACE), a framework that jointly evolves specialized foundation models and LLM agents through reciprocal learning. HACE improves the specialist through supervised learning while training the agent with on-policy reinforced self-training, guided by verified performance gains on the current specialist. The agent's exploration, in turn, informs subsequent specialist training, enabling both models to adapt to each other's progress. To sustain this reciprocal learning, HACE further employs evolutionary search to optimize their interaction harness, adapting how the models exchange information and select training experiences as their capabilities evolve. We evaluate HACE across three challenging domains: recommendation systems, protein function prediction in biology, and crystal stability prediction in material discovery. We show that HACE outperforms the evaluated self-improving methods on the primary task metrics across all three domains. These results shed light on heterogeneous coevolution as a universal approach to improving specialized foundation models through reciprocal interaction with a learning agent.", 'score': 3, 'issue_id': 3439, 'pub_date': '2026-10-12', 'pub_date_card': {'ru': '12 октября', 'en': 'October 12', 'zh': '10月12日'}, 'hash': '7038fb3813bef24c', 'authors': ['Wenqian Ye', 'Ziwei Guan', 'Zi Yang', 'Shivani Modi', 'Cici Cong Wu', 'Yunlong He', 'Yuxin Chen', 'Zhengyu Zhang', 'Liang Luo', 'Venkatesh Ranganathan', 'Jianhui Sun', 'Yantao Yao', 'Wenlin Chen', 'Buyun Zhang', 'Ellie Dingqiao Wen', 'Henry Kautz', 'Aidong Zhang'], 'affiliations': ['Meta AI', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2610.16078.jpg', 'data': {'categories': ['#math', '#training', '#optimization', '#agents', '#rl', '#science', '#agi', '#healthcare'], 'emoji': '🧬', 'ru': {'title': 'Специалист и агент растут вместе: совместная эволюция моделей', 'desc': 'В статье предлагается HACE — фреймворк, в котором специализированная foundation model и LLM agent развиваются совместно через взаимное обучение. Специалист дообучается с помощью supervised learning, а агент обучается методом on-policy reinforced self-training, ориентируясь на подтверждённый прирост качества модели. Эволюционный поиск (evolutionary search) оптимизирует способ обмена информацией между моделями и отбор обучающих примеров по мере их развития. Метод превосходит другие self-improving подходы в задачах рекомендательных систем, предсказания функций белков и стабильности кристаллов.'}, 'en': {'title': 'Evolving Intelligence: HACE Unites Models for Superior Learning', 'desc': "HACE is a framework designed to enhance the performance of specialized foundation models and large language model (LLM) agents through a process called reciprocal learning. It allows these models to evolve together by sharing insights and adapting their training strategies based on each other's progress. The framework employs supervised learning for the specialist models and reinforced self-training for the LLM agents, ensuring that improvements in one model inform the other. By optimizing their interaction through evolutionary search, HACE demonstrates superior performance in diverse applications such as recommendation systems, protein prediction, and materials discovery."}, 'zh': {'title': '异构共进化：提升专业模型的新方法', 'desc': 'HACE是一个框架，通过互相学习和进化优化，联合发展专业基础模型和大型语言模型（LLM）代理。该框架通过监督学习提升专业模型，同时利用基于策略的强化自我训练来训练代理，从而实现双向适应。HACE在推荐系统、生物学中的蛋白质功能预测和材料发现中的晶体稳定性预测等三个领域进行了评估，结果显示其在主要任务指标上优于其他自我提升方法。该研究表明，异构共进化是一种通过与学习代理的互相互动来提升专业基础模型的普遍方法。'}}}, {'id': 'https://huggingface.co/papers/2610.06563', 'title': 'HERA: Harness-Environment Co-Evolution for Reliable Agentic Abstention', 'url': 'https://huggingface.co/papers/2610.06563', 'abstract': 'Abstract HERA co-evolves agent harnesses and task environments to improve abstention and task completion across diverse LLMs without model-specific tuning.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents are increasingly capable of acting in complex tool-use environments, yet they often fail to recognize when tasks are infeasible and no valid solution exists. Recent work has formalized this reliability gap as the problem of agentic abstention, and existing approaches typically optimize a model or agent harness against a fixed set of tasks, leading to limited generalization to unseen failure modes. We introduce HERA, a framework for harness-environment co-evolution for agentic abstention. HERA consists of (i) a pipeline to automatically construct verifiable pairs of feasible and infeasible tasks by applying controlled environment mutations that transform solvable tasks into cases requiring abstention, and (ii) a co-evolution procedure in which performance failures on previous tasks are used to drive harness adaptation and generate new execution environments and tasks geared towards previous weaknesses. On held-out evaluation tasks, an evolved harness from HERA improves abstention accuracy from 61.7% to 83.3% while improving feasible-task completion from 68.3% to 76.7%, achieving the highest abstention and feasible-task completion among the compared methods. The resulting best harness transfers across 19 other LLMs, improving abstention accuracy by 15.3 percentage points on average without any model-specific optimization, and enabling smaller models to match the performance of more powerful models at an estimated 85% lower cost.', 'score': 3, 'issue_id': 3438, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '98dc9559df1a3fd9', 'authors': ['Han Luo', 'Bingbing Wen', 'Guang Yang', 'Zora Zhiruo Wang', 'Pan Lu', 'Lucy Lu Wang'], 'affiliations': ['Allen Institute for AI', 'Carnegie Mellon University', 'Stanford University', 'University of Leeds', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2610.06563.jpg', 'data': {'categories': ['#training', '#optimization', '#benchmark', '#agents', '#synthetic', '#data'], 'emoji': '🧭', 'ru': {'title': 'Умение вовремя сказать «невозможно»: совместная эволюция агента и среды', 'desc': 'В статье представлен фреймворк HERA, который совместно эволюционирует агентную обвязку (harness) и среду выполнения задач для LLM-агентов. Система автоматически создаёт пары выполнимых и невыполнимых задач с помощью контролируемых мутаций среды, а ошибки агента на предыдущих задачах управляют адаптацией harness и генерацией новых сценариев. На отложенной выборке точность воздержания (abstention) выросла с 61.7% до 83.3%, а доля успешно выполненных выполнимых задач - с 68.3% до 76.7%. Полученный harness переносится на 19 других LLM без дообучения и позволяет более простым моделям достигать результатов сильных при примерно на 85% меньшей стоимости.'}, 'en': {'title': 'HERA: Co-evolving Agents for Smarter Task Management', 'desc': "The paper introduces HERA, a framework designed to enhance the performance of large language models (LLMs) in complex task environments by addressing the issue of agentic abstention. HERA co-evolves agent harnesses and task environments, allowing models to better recognize when tasks are infeasible and should be abandoned. By automatically generating pairs of feasible and infeasible tasks through controlled mutations, HERA helps improve the models' ability to adapt and learn from previous failures. The results show significant improvements in both abstention accuracy and task completion rates across various LLMs, demonstrating the framework's effectiveness without requiring model-specific tuning."}, 'zh': {'title': 'HERA：提升代理放弃与任务完成的共同进化框架', 'desc': 'HERA是一个用于代理放弃的框架，通过共同进化代理和任务环境来提高大型语言模型（LLM）的放弃率和任务完成率。该框架自动构建可验证的可行和不可行任务对，并通过环境变异将可解任务转化为需要放弃的情况。HERA的共同进化过程利用之前任务的性能失败来驱动代理的适应，并生成针对之前弱点的新执行环境和任务。经过HERA进化的代理在评估任务上的放弃准确率从61.7%提高到83.3%，同时可行任务的完成率也从68.3%提高到76.7%。'}}}, {'id': 'https://huggingface.co/papers/2610.22324', 'title': 'Training Reasoning Models to Generate Diverse Scientific Ideas', 'url': 'https://huggingface.co/papers/2610.22324', 'abstract': "Abstract Researchers propose a set-level reinforcement learning objective to train language models for diverse, high-quality, document-grounded idea generation, achieving stronger creative utility than larger proprietary models.  Generated by thinkingmachines/Inkling-Small One of the first steps of a research pipeline is generating ideas. Large Language Models (LLMs) are increasingly used to automate this step, but most of this work optimizes the quality of individual ideas, while overlooking diversity. In our work, we study document-grounded ideation, focusing on increasing the diversity of LLM generated ideas and ensuring they are high quality. Given prior papers, a model must propose a set of ideas that are each high-quality and clearly distinct from one another, while also being grounded in the input documents. To optimize for this, we propose training with a set-level reinforcement learning objective. In our setup, in a single generation, the model writes K structured idea cards grounded in the source papers, and the set is scored jointly, where each idea's quality is weighted by its distance from the ideas written before it. This teaches the model to steer each new idea away from its predecessors. We show that our trained 8B model achieves higher creative utility (a measure combining quality and diversity) than Claude Opus 4.8 and GPT-6 Astra on our contamination-free benchmark. In a pilot human study with four experts, our sets are judged as promising as Claude Opus 4.8's and contain marginally more unique ideas. When a coding agent runs proof-of-concept experiments on the ideas, our model's success@k is comparable to Claude Opus 4.8's, so we see that the added diversity does not cost any executability.", 'score': 3, 'issue_id': 3438, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': 'e66003d312e55741', 'authors': ['Manya Wadhwa', 'Pranav Narayanan Venkit', 'Hiroaki Hayashi', 'Yu Li', 'Tuhin Chakrabarty', 'Chien-Sheng Wu'], 'affiliations': ['New York University', 'Salesforce AI Research', 'Stony Brook University'], 'pdf_title_img': 'assets/pdf/title_img/2610.22324.jpg', 'data': {'categories': ['#training', '#alignment', '#optimization', '#benchmark', '#agents', '#rl', '#science', '#data', '#small_models'], 'emoji': '💡', 'ru': {'title': 'Разнообразие идей важнее, чем просто хорошие идеи по отдельности', 'desc': 'Авторы предлагают обучать языковую модель (LLM) с помощью обучения с подкреплением на уровне всего набора идей, а не отдельных ответов. Модель в одной генерации пишет K структурированных карточек идей, опирающихся на исходные статьи, и весь набор оценивается совместно. Вес качества каждой идеи зависит от её расстояния до предыдущих, поэтому модель учится отходить от уже написанных идей. Обученная модель на 8B параметров превосходит более крупные проприетарные модели по creative utility, при этом сохраняет исполнимость идей.'}, 'en': {'title': 'Diverse Ideas, High Quality: Reinventing Language Model Creativity', 'desc': 'This paper introduces a novel approach to training language models using a set-level reinforcement learning objective aimed at enhancing the diversity and quality of generated ideas. Unlike traditional methods that focus on individual idea quality, this research emphasizes generating multiple distinct ideas that are grounded in provided documents. The model generates a set of structured idea cards, scoring them collectively to encourage uniqueness among ideas while maintaining high quality. The results demonstrate that the proposed model outperforms larger proprietary models in terms of creative utility, showcasing both diversity and executability of the generated ideas.'}, 'zh': {'title': '多样性与质量并重的创意生成', 'desc': '本研究提出了一种集合级强化学习目标，用于训练语言模型以生成多样化且高质量的文档基础创意。与传统方法不同，我们关注于生成的创意之间的多样性，同时确保每个创意的质量。模型在生成过程中会创建多个结构化的创意卡片，并通过共同评分来优化这些创意的质量和独特性。实验结果表明，我们的模型在创意实用性方面优于其他大型模型，且在专家评估中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2610.25964', 'title': 'Token-Set Choice Confounds POPE: A Systematic Audit of Yes/No Extraction in VLM Hallucination Evaluation', 'url': 'https://huggingface.co/papers/2610.25964', 'abstract': 'Abstract Evaluation readout choices for vision-language models on the POPE benchmark cause large F1 shifts, revealing that unreported token lookup protocols and quantization confound reported hallucination-mitigation gains.  Generated by thinkingmachines/Inkling-Small We set out to reproduce a recent hallucination-mitigation result on the POPE benchmark. The LLaVA-1.5-7B baseline we measured, 82.21 F1 on the adversarial split, sat 1.21 to 8.67 points above the adversarial baselines we planned to compare against (81.00, 79.30, and 73.54). We looked at the evaluation code and found a readout choice that moves F1 on its own. A two-token logit readout decides yes versus no by comparing two vocabulary IDs, 3582 ("yes") and 1217 ("no"). Across 9,000 greedy-decode questions spanning all three splits, neither ID is generated even once. The model emits " Yes" (token 3869) and " No" (token 1939), because SentencePiece prepends a space byte after the prompt suffix "ASSISTANT:". Read with an eight-token lookup that covers the space-prefixed surface forms, LLaVA-1.5-7B scores F1 0.8221, 0.8498, and 0.8713 on the adversarial, popular, and random splits. That 6.13-point adversarial shift exceeds the adversarial gain reported by five of the six papers we surveyed. None of them states its readout, and our reference ran under 4-bit NF4 quantization, so we cannot say how much of any reported gain a matched evaluation would keep. That comparison stays unresolved until readout and precision are matched. On the fixed baseline we run nine inference-time corrections of our own (none beat it) and dissect why the adversarial split resists logit-level intervention. In a 3,000-question probe, wrong predictions draw more image attention than correct ones (Cohen\'s d=-0.46, p=1.4times10^{-24}), the opposite of what grounding-based corrections assume. A four-readout audit across four further VLMs from three tokenizer families confirms the confound is protocol-level, not model-specific: porting the LLaVA-1.5 IDs verbatim drops F1 to 0.00 on the two disjoint-vocabulary models, whereas a tokenizer-derived readout holds between 0.80 and 0.92.', 'score': 3, 'issue_id': 3438, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '839769f130eabfc3', 'authors': ['Kesav Kumar Jayakumar', 'Karthigeyan Thilak'], 'affiliations': ['Department of Computer Science and Engineering, Sri Eshwar College of Engineering, Coimbatore 641202, India', 'Department of Information Technology, Sri Krishna College of Technology, Coimbatore 641042, India'], 'pdf_title_img': 'assets/pdf/title_img/2610.25964.jpg', 'data': {'categories': ['#hallucinations', '#multimodal', '#inference', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Точность оценки зависит от выбора токенов', 'desc': 'В статье рассматривается проблема оценки моделей, работающих с изображениями и текстами, на основе POPE-бенчмарка. Исследователи обнаружили, что выбор метода считывания токенов может значительно влиять на результаты, что приводит к искажению данных о снижении галлюцинаций. Они выявили, что использование разных токенов для ответа "да" и "нет" может изменить F1-оценку, что ставит под сомнение результаты предыдущих исследований. Авторы также провели аудит других моделей и подтвердили, что проблема заключается в протоколе, а не в самих моделях.'}, 'en': {'title': 'Unmasking Evaluation Bias in Vision-Language Models', 'desc': 'This paper investigates the evaluation discrepancies in vision-language models, particularly focusing on the POPE benchmark. It reveals that the choice of token readout methods significantly affects F1 scores, leading to misleading conclusions about hallucination mitigation. The authors demonstrate that using a specific two-token logit readout can skew results, as it fails to generate the expected tokens during evaluation. Their findings emphasize the need for consistent evaluation protocols and highlight that the reported gains in performance may not be as robust as previously claimed due to unreported factors like quantization and token lookup methods.'}, 'zh': {'title': '评估选择影响F1分数的研究', 'desc': '这篇论文探讨了视觉-语言模型在POPE基准测试中的评估选择对F1分数的影响，发现未报告的标记查找协议和量化方法会干扰幻觉缓解的结果。研究表明，LLaVA-1.5-7B模型在对抗性分割上的F1分数比预期的基准高出1.21到8.67分。通过分析评估代码，发现某些读出选择会单独影响F1分数。最后，研究确认了这种干扰是协议层面的，而不是模型特定的，表明需要匹配读出和精度才能得出有效的比较。'}}}, {'id': 'https://huggingface.co/papers/2610.25874', 'title': 'Vision-Language-Delta-Action: Learning Compact Deltas as Actionable Transition Interfaces for Robotic Manipulation', 'url': 'https://huggingface.co/papers/2610.25874', 'abstract': 'Abstract VLDA reformulates robotic control as compact transition modeling via a Delta variable that bridges vision-language understanding and action generation, improving long-horizon consistency and generalization.  Generated by thinkingmachines/Inkling-Small Robotic manipulation is not merely observation-to-action generation, but the realization of task-specified state changes in the physical world. Existing vision-language-action (VLA) methods directly learn observation-to-action mappings, imposing a substantial learning burden due to the gap between semantic understanding and action execution. Although world-action models (WAMs) improve control through future prediction, modeling complete future states wastes capacity on static appearance and action-irrelevant changes. We propose Vision-Language-Delta-Action (VLDA), a paradigm that reformulates full future prediction as compact actionable transition modeling. Its core is a compact Delta variable that captures latent world-state changes, serving as an interface between vision-language understanding and action generation. VLDA learns Delta through a unified objective composed of the Local Transition Filter (LT-Filter) and Global Transition Anchor (GT-Anchor). LT-Filter captures task-relevant manipulation-centric changes while suppressing static reconstruction biases. GT-Anchor provides coarse future-level regularization to preserve the overall direction of state changes. Delta-Driven Action Refinement (DDAR) further grounds Delta in the action manifold and injects it as a structured seed to guide action denoising. We implement VLDA within LoongForge, an open-source training framework for large-scale foundation and embodied models, using its modular and distributed infrastructure for unified two-stage optimization. Experiments show that VLDA improves long-horizon consistency, robustness, and generalization, validating actionable Delta as an alternative to direct action prediction and full future-state modeling.', 'score': 3, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '4d18ddc1bc05903c', 'authors': ['Lingsen Zhang', 'Wei Li', 'Jie He', 'Henghua Zhang', 'Kai Mo', 'Shiyong Li', 'Yanpeng Wang', 'Rui Shao'], 'affiliations': ['Baidu, Inc.', 'Harbin Institute of Technology, Shenzhen', 'Shenzhen Loop Area Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.25874.jpg', 'data': {'categories': ['#vla', '#robotics', '#multimodal', '#open_source', '#architecture', '#training'], 'emoji': '🤖', 'ru': {'title': 'Предсказывай не будущее целиком, а то, что нужно для действия', 'desc': 'Статья предлагает VLDA — подход к робототехническому управлению, в котором вместо прямого отображения наблюдений в действия модель предсказывает компактную переменную Delta, описывающую изменение состояния мира. Delta служит связующим звеном между пониманием визуальной и языковой информации (vision-language) и генерацией действий. Обучение Delta выполняется через совместную функцию потерь из двух компонентов: LT-Filter, который выделяет манипуляционно значимые изменения, и GT-Anchor, задающий общее направление изменений. Эксперименты показывают улучшение согласованности на длинных горизонтах, устойчивости и обобщения, включая работу в новых условиях.'}, 'en': {'title': 'Bridging Vision and Action with Delta Modeling', 'desc': 'The paper introduces Vision-Language-Delta-Action (VLDA), a new approach to robotic control that enhances the connection between understanding visual and language inputs and generating actions. It uses a Delta variable to model transitions in the environment, allowing robots to focus on relevant changes instead of predicting complete future states. This method reduces the learning burden by bridging the gap between semantic understanding and action execution, leading to better long-horizon consistency and generalization. The framework is implemented in LoongForge, demonstrating improved performance in robotic manipulation tasks.'}, 'zh': {'title': '增量驱动的机器人控制新方法', 'desc': '本文提出了一种新的机器人控制方法，称为视觉-语言-增量-动作（VLDA），它通过增量变量将视觉-语言理解与动作生成连接起来，从而改善了长时间一致性和泛化能力。传统的视觉-语言-动作（VLA）方法直接学习观察到的动作映射，导致学习负担较重，因为语义理解与动作执行之间存在差距。VLDA通过紧凑的可操作过渡建模来重新定义完整的未来预测，利用局部过渡滤波器（LT-Filter）和全局过渡锚点（GT-Anchor）来学习增量变量。实验结果表明，VLDA在长时间一致性、鲁棒性和泛化能力方面都有显著提升，验证了增量作为直接动作预测和完整未来状态建模的替代方案。'}}}, {'id': 'https://huggingface.co/papers/2610.23470', 'title': 'QD-Rec: Open-Ended Evolution of Recommendations via Quality-Diversity', 'url': 'https://huggingface.co/papers/2610.23470', 'abstract': 'Abstract QD-Rec uses quality-diversity optimization and foundation models to generate diverse, well-reasoned recommendations for high-stakes decision-making.  Generated by thinkingmachines/Inkling-Small Open-ended search combined with foundation models has produced advances such as faster algorithms, new results on open mathematical problems, and self-improving agents. We extend this paradigm to recommendation for decision-making, focusing on decisions where the set of possible choices is fixed but the reasons for choosing them are not. In high-stakes decisions, e.g., which company to acquire or which customer to target, comparing diverse, well-reasoned options can be more useful than a single ranked list. We formalize open-ended recommendation as building a diverse, high-quality set of recommendations, each an item together with a hypothesis, a natural-language reason why the item fits the needs of a decision maker. We propose QD-Rec, a quality--diversity method that selects items with a contextual bandit and generates hypotheses with a foundation model from earlier ones kept in an archive as stepping stones. A new recommendation enters the archive if it is novel or better than its nearest neighbor. Across M&A, customer targeting, and paper and book recommendation, QD-Rec gives the highest mean quality and builds the largest archive in most settings.', 'score': 3, 'issue_id': 3436, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '7d8c51da0d89a111', 'authors': ['Takashi Ishida', 'Taro Makino', 'Issa Sugiura'], 'affiliations': ['Sakana AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.23470.jpg', 'data': {'categories': ['#agents', '#rl'], 'emoji': '🧭', 'ru': {'title': 'Разнообразие обоснованных рекомендаций важнее одного списка', 'desc': 'В статье представлен QD-Rec — метод рекомендаций для принятия решений, который сочетает quality-diversity оптимизацию с foundation models. Система формирует не один ранжированный список, а разнообразный набор высококачественных рекомендаций, каждая из которых состоит из объекта и гипотезы на естественном языке о его пригодности. Выбор объектов выполняется с помощью contextual bandit, а гипотезы генерируются LLM на основе ранее сохранённых в архиве удачных вариантов, выступающих как «ступеньки». Эксперименты на задачах M&A, таргетинга клиентов и рекомендаций статей и книг показывают, что QD-Rec обеспечивает наибольшее среднее качество и самый большой архив в большинстве сценариев.'}, 'en': {'title': 'Diverse Recommendations for High-Stakes Decisions', 'desc': 'QD-Rec is a machine learning approach that combines quality-diversity optimization with foundation models to create diverse and well-reasoned recommendations for important decisions. It focuses on generating a variety of options, each accompanied by a rationale, rather than just a single ranked list. This method is particularly useful in high-stakes scenarios, such as mergers and acquisitions or customer targeting, where understanding the reasoning behind choices is crucial. By using a contextual bandit for selection and an archive of previous recommendations for hypothesis generation, QD-Rec achieves superior quality and diversity in its recommendations.'}, 'zh': {'title': '多样化推荐，助力高风险决策', 'desc': 'QD-Rec是一种利用质量多样性优化和基础模型生成多样化且合理的推荐的方法，适用于高风险决策。该方法通过开放式搜索与基础模型的结合，能够快速生成算法并解决开放数学问题。QD-Rec专注于固定选择集中的决策，提供多样化的推荐选项及其选择理由，而不是单一的排名列表。在并购、客户定位以及论文和书籍推荐等领域，QD-Rec在大多数情况下提供了最高的平均质量，并建立了最大的推荐档案。'}}}, {'id': 'https://huggingface.co/papers/2610.23653', 'title': 'A Language-Informed Loss for Visual Generation', 'url': 'https://huggingface.co/papers/2610.23653', 'abstract': 'Abstract LILIE uses an invertible normalizing-flow encoder to derive language-informed supervision for text-to-image generation, improving fidelity over pixel-only training.  Generated by thinkingmachines/Inkling-Small End-to-end visual generation with pixel-space loss has recently achieved competitive performance without the need for learned image tokenizers. In this work, we study whether language-informed supervision can provide a richer training signal than pixel loss for visual generation. We introduce LILIE (pronounced "lily"), a Language-Informed and Lossless Image Encoder. LILIE is an invertible image transform trained such that a vision-language model can recover captions from noised features. The encoder uses a normalizing flow transformer trained jointly with a vision-language model via next token prediction. We then use the encoder to extract a simple language-informed loss for text-to-image generation. We train JiT models with LILIE loss, reducing gFD by 14 points (66.84 to 53.01) against a pixel-only baseline on the GPIC dataset. Our code, encoders, and generative models are available at https://suchiragarwal.com/lilie.', 'score': 2, 'issue_id': 3439, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '6b10f8c8510ea3a6', 'pdf_title_img': 'assets/pdf/title_img/2610.23653.jpg', 'data': {'categories': ['#diffusion', '#training', '#cv', '#multimodal', '#architecture'], 'emoji': '🖼️', 'ru': {'title': 'Язык как учитель: подписи улучшают генерацию изображений', 'desc': 'В статье представлен LILIE — инвертируемый энкодер изображений на основе нормализующего потока (normalizing flow transformer), обученный совместно с vision-language моделью через предсказание следующего токена. Энкодер восстанавливает подписи (captions) из зашумлённых признаков, что даёт языково-информированный сигнал обучения. Этот сигнал используется как дополнительная функция потерь при обучении моделей генерации изображений по тексту (JiT), вместо или вместе с потерей в пиксельном пространстве. Эксперименты на датасете GPIC показывают снижение метрики gFD с 66.84 до 53.01, то есть улучшение качества генерации относительно baseline, обученного только на пикселях.'}, 'en': {'title': 'Enhancing Image Generation with Language-Informed Supervision', 'desc': 'The paper introduces LILIE, an innovative approach that utilizes an invertible normalizing-flow encoder to enhance text-to-image generation by incorporating language-informed supervision. This method aims to improve the fidelity of generated images compared to traditional pixel-only training methods. By training a vision-language model alongside the encoder, LILIE can effectively recover captions from noised image features, providing a richer training signal. The results demonstrate a significant reduction in generation failure rates, showcasing the effectiveness of language-informed loss in visual generation tasks.'}, 'zh': {'title': '语言驱动的图像生成新方法', 'desc': 'LILIE是一种可逆的归一化流编码器，用于为文本到图像生成提供语言信息的监督，从而提高生成图像的真实感。该方法通过与视觉-语言模型共同训练，利用正常化流变换器提取语言信息损失。研究表明，语言信息的监督信号比仅依赖像素损失更丰富，能够显著提升生成效果。通过使用LILIE损失，模型在GPIC数据集上的性能得到了显著改善。'}}}, {'id': 'https://huggingface.co/papers/2610.22636', 'title': 'Measuring Mechanistic Uncertainty in Large Language Models via Causal Robustness', 'url': 'https://huggingface.co/papers/2610.22636', 'abstract': "Abstract Mechanistic uncertainty is quantified via internal mechanism stability using causal robustness margins and concept steering vectors, revealing that incorrect responses are more sensitive to interventions and that learned facts gain robustness.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) are increasingly used in critical domains, where their susceptibility to hallucinations makes reliable and interpretable uncertainty quantification essential. We introduce the concept of mechanistic uncertainty, which characterizes uncertainty through the stability of the internal mechanisms supporting a model's response. We propose the causal robustness margin, defined as the minimum internal intervention required to deviate the model's output, and operationalize it using Jacobian Lens (Jlens) concept steering vectors. Across three open-source models and five question-answering datasets, we show incorrect and uncertain responses exhibit smaller margins, indicating greater sensitivity to internal interventions, and the causal robustness margin complements conventional output-based uncertainty methods. Finally, in a controlled knowledge injection experiment, correctly learned facts show increased margins after training, suggesting that causal robustness provides a mechanistically grounded signal of uncertainty.", 'score': 2, 'issue_id': 3439, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': 'a37c54d61c8389e2', 'authors': ['Aneesh Komanduri', 'Majid Afshar', 'Timothy A. Miller', 'Yanjun Gao'], 'affiliations': ['Boston Childrens Hospital', 'Harvard Medical School', 'University of Colorado Anschutz Medical Campus', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.22636.jpg', 'data': {'categories': ['#hallucinations', '#benchmark', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Надёжность ответа LLM измеряется устойчивостью её внутренних механизмов', 'desc': 'В статье вводится понятие механистической неопределённости, которое оценивает уверенность LLM через устойчивость внутренних механизмов, поддерживающих ответ модели. Авторы предлагают causal robustness margin: минимальное внутреннее вмешательство, необходимое для изменения выхода модели, и реализуют его с помощью векторов концептуального управления Jacobian Lens (Jlens). Эксперименты на трёх открытых моделях и пяти наборах данных для question answering показывают, что неверные и неуверенные ответы имеют меньшие margin и более чувствительны к интервенциям, дополняя традиционные методы оценки неопределённости по выходу. В эксперименте с контролируемым внедрением знаний правильно усвоенные факты после обучения демонстрируют рост margin, что делает causal robustness обоснованным механистически сигналом неопределённости.'}, 'en': {'title': 'Understanding Uncertainty Through Mechanistic Stability', 'desc': "This paper introduces the concept of mechanistic uncertainty, which assesses how stable a model's internal mechanisms are when producing responses. It defines the causal robustness margin, which measures the minimum change needed in the model's internal workings to alter its output. The study finds that incorrect responses are more sensitive to changes, indicating they have smaller robustness margins, while correctly learned facts become more stable after training. This approach enhances traditional uncertainty quantification methods by providing insights into the internal workings of machine learning models."}, 'zh': {'title': '量化机械不确定性，提升模型鲁棒性', 'desc': '本文提出了一种新的不确定性量化方法，称为机械不确定性，主要通过模型内部机制的稳定性来评估。我们引入了因果鲁棒边际的概念，定义为使模型输出偏离所需的最小内部干预量，并使用雅可比透镜（Jacobian Lens）概念引导向量进行操作。研究表明，不正确和不确定的响应对内部干预更敏感，表现出较小的鲁棒边际，而因果鲁棒边际可以补充传统的基于输出的不确定性方法。最后，通过知识注入实验，正确学习的事实在训练后显示出更大的鲁棒边际，表明因果鲁棒性提供了一种基于机制的不确定性信号。'}}}, {'id': 'https://huggingface.co/papers/2604.11331', 'title': 'Any 3D Scene is Worth 1K Tokens: 3D-Grounded Representation for Scene Generation at Scale', 'url': 'https://huggingface.co/papers/2604.11331', 'abstract': 'Abstract Direct diffusion modeling in a 3D latent space improves spatial consistency and efficiency for scene-level 3D generation compared to 2D-based methods.  Generated by thinkingmachines/Inkling-Small Scene-level 3D generation has long been dominated by 2D multi-view or video diffusion models. Typically, these 2D-based approaches perform scene generation in a 2D latent space, which introduces two fundamental issues: (i) representing 3D scenes via 2D views leads to significant representation redundancy, and (ii) latent space rooted in 2D inherently limits the spatial consistency of the generated scenes. In this paper, we propose to perform 3D scene generation directly within a high-dimensional implicit 3D latent space derived from powerful 2D foundation models (e.g., DINOv2, SigLIP2, DA3). Then we tame diffusion transformers to perform diffusion modeling directly in the 3D latent space, enabling 3D-grounded scene generation. In our experiments, we not only demonstrate the advantages of our method over 2D-based approaches in terms of efficiency and spatial consistency, but also comprehensively analyze the impact of 3D latent representation on 3D scene generation performance. Furthermore, we validate the favorable scalability of our method with respect to representation and model capacity.', 'score': 2, 'issue_id': 3439, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '9023ed75cfefd892', 'authors': ['Dongxu Wei', 'Qi Xu', 'Zhiqi Li', 'Hangning Zhou', 'Cong Qiu', 'Hailong Qin', 'Mu Yang', 'Zhaopeng Cui', 'Peidong Liu'], 'affiliations': ['Afari Intelligent Drive', 'Westlake University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2604.11331.jpg', 'data': {'categories': ['#architecture', '#3d', '#diffusion'], 'emoji': '🧊', 'ru': {'title': 'Генерируем 3D-сцены прямо в 3D, а не через 2D-виды', 'desc': 'Авторы предлагают генерировать 3D-сцены напрямую в неявном 3D латентном пространстве, полученном из мощных 2D foundation models (например, DINOv2, SigLIP2, DA3), вместо традиционных 2D multi-view или video diffusion подходов. Такой подход устраняет избыточность представления 3D через набор 2D-видов и повышает пространственную согласованность сцен. Для моделирования используются diffusion transformers, которые работают непосредственно в 3D латентном пространстве. Эксперименты показывают преимущество метода по эффективности и согласованности, а также его хорошую масштабируемость по мере роста ёмкости представления и модели.'}, 'en': {'title': 'Revolutionizing 3D Scene Generation with Direct Diffusion in Latent Space', 'desc': 'This paper introduces a novel approach to 3D scene generation by utilizing direct diffusion modeling in a 3D latent space, which enhances both spatial consistency and efficiency compared to traditional 2D methods. The authors highlight the limitations of 2D-based approaches, such as redundancy in representing 3D scenes and constraints on spatial coherence. By leveraging advanced 2D foundation models, they create a high-dimensional implicit 3D latent space for more accurate scene generation. The results show significant improvements in performance and scalability, demonstrating the effectiveness of their method over existing techniques.'}, 'zh': {'title': '直接在三维潜在空间中生成高效一致的场景', 'desc': '本文提出了一种直接在三维潜在空间中进行扩散建模的方法，以提高场景级三维生成的空间一致性和效率。传统的二维方法在生成三维场景时存在表示冗余和空间一致性不足的问题。我们的方法利用强大的二维基础模型，直接在高维隐式三维潜在空间中进行建模，从而克服了这些限制。实验结果表明，我们的方法在效率和空间一致性方面优于传统的二维方法，并且具有良好的可扩展性。'}}}, {'id': 'https://huggingface.co/papers/2610.19005', 'title': 'CyberArena: Benchmarking AI Agents in Live Symmetric Attack-and-Defense Combat', 'url': 'https://huggingface.co/papers/2610.19005', 'abstract': "Abstract CyberArena is a dynamic adversarial benchmark that evaluates AI agents through concurrent multi-round attack-and-defense combat in evolving environments, measuring capabilities via a dynamical scoring model.  Generated by thinkingmachines/Inkling-Small AI agents are demonstrating increasingly strong offensive and defensive cybersecurity capabilities in the real world. Current benchmarks mostly evaluate agents in isolation against static targets. Real cyber operations, however, are dynamic and coupled: security postures constantly change as attackers and defenders adapt to each other in real time. Static benchmarks quickly saturate and miss an agent's ability to attack and defend simultaneously under live pressure. To address this gap, we present CyberArena, a dynamic, symmetric adversarial benchmark built around multi-round attack-and-defense combat. In isolated sandboxes, two agents compete under identical rules, acting concurrently as both attackers and defenders over continuously changing services. This converts static targets into evolving, semi-open challenges, directly testing an agent's speed and precision in discovering, exploiting, and patching vulnerabilities. To sustain the benchmark's longevity, an automated agentic pipeline continuously generates, reviews, and validates new environments. Furthermore, because pairwise contests are notoriously hard to quantify, we introduce a dynamical model that maps match dynamics into unified, multidimensional scores across offensive, defensive, and domain-specific capabilities. Evaluating 12 frontier LLM agents across 40 challenges in 466 matches, CyberArena separates model capabilities where single-agent baselines hit a ceiling. The trajectories read like a fight rather than an exam: defenders patch one hole and miss the next and certify repairs on stale evidence, while capable agents think a move ahead, planting backdoors for later rounds and, in one case, writing their own packet sniffer to watch the opponent. Beyond a benchmark, CyberArena serves as an adaptable, scalable experimental platform for future research on cybersecurity agents.", 'score': 2, 'issue_id': 3438, 'pub_date': '2026-10-13', 'pub_date_card': {'ru': '13 октября', 'en': 'October 13', 'zh': '10月13日'}, 'hash': 'e51d94a35a41aa58', 'authors': ['Bangya Liu', 'Jianhong Tu', 'Yueyang Pan', 'Hanhong Zhao', 'Zhe Ye', 'Hongwei Li', 'Saastha Vasan', 'Katherine Lambert', 'Junmin Zhu', 'Hao Wang', 'Jienan Chen', 'Yunze Xiao', 'Minglai Yang', 'Zihan Wang', 'Hairong Yin', 'Hao Wang', 'Zhiwen Fan', 'Tianneng Shi', 'Zhun Wang', 'Wenbo Guo', 'Chenguang Wang', 'Dawn Song'], 'affiliations': ['AI Open Source Foundation', 'Carnegie Mellon University', 'Johns Hopkins University', 'Massachusetts Institute of Technology', 'Purdue University', 'Texas A&M University', 'UC Berkeley', 'UC Santa Barbara', 'UC Santa Cruz', 'University of Toronto', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.19005.jpg', 'data': {'categories': ['#games', '#security', '#benchmark', '#agents'], 'emoji': '⚔️', 'ru': {'title': 'Кибербезопасность как живой бой: агенты атакуют и защищаются одновременно', 'desc': 'CyberArena — это динамический бенчмарк для оценки AI-агентов в кибербезопасности, где два агента одновременно атакуют и защищают сервисы в многораундовом состязании. В отличие от статичных тестов, среда постоянно меняется, а сценарии автоматически генерируются и валидируются агентным пайплайном. Для оценки парных матчей авторы вводят динамическую модель, которая переводит результаты в многомерные оценки атакующих, защитных и предметных навыков LLM-агентов. Эксперименты на 12 современных LLM-агентах показали, что CyberArena лучше различает их возможности, чем одиночные тесты, и выявляет такие стратегии, как опережающее планирование и создание бэкдоров.'}, 'en': {'title': 'CyberArena: Dynamic Benchmarking for Adaptive Cybersecurity Agents', 'desc': "CyberArena is a new benchmark designed to evaluate AI agents in cybersecurity through dynamic, multi-round attack-and-defense scenarios. Unlike traditional benchmarks that test agents against static targets, CyberArena simulates real-world conditions where both attackers and defenders adapt to each other's strategies in real time. It features a continuous generation of evolving environments and uses a dynamical scoring model to assess agents' offensive and defensive capabilities. This innovative approach allows for a more accurate measurement of an agent's performance under pressure, making it a valuable tool for future research in cybersecurity."}, 'zh': {'title': '动态对抗基准：CyberArena', 'desc': 'CyberArena 是一个动态对抗基准，旨在通过多轮攻击与防御的战斗来评估人工智能代理的能力。与传统的静态基准不同，CyberArena 允许代理在不断变化的环境中同时进行攻击和防御，从而更真实地模拟网络安全操作。该基准使用动态评分模型，能够量化代理在攻击、防御和特定领域能力上的表现。通过对多个前沿大型语言模型进行评估，CyberArena 不仅提供了一个新的评估标准，还为未来的网络安全研究提供了一个可扩展的实验平台。'}}}, {'id': 'https://huggingface.co/papers/2610.19264', 'title': 'Beyond Maliciousness: Static and Runtime Attack-Surface Profiling of Agent Skills', 'url': 'https://huggingface.co/papers/2610.19264', 'abstract': 'Abstract  Agent skills are Markdown documents that a tool-using agent reads as instructions and then acts on with the privileges of the session that loaded them. Installing one grants authority (the standing to direct the agent, not new privilege), and the size of that grant is what we measure. We present a two-phase attack-surface profiling methodology that combines whole-bundle static analysis and dependency provenance checking with instrumented sandbox execution and separate model-based assessment of the resulting traces. We apply the methodology to 6,309 listings from two marketplaces, selecting listings for execution without conditioning that decision on a prior threat or risk signal. Half the corpus carries evidence of shell-execution capability; the corresponding shares are 35% for filesystem read, 31% each for filesystem write and network egress, and 13% for credential access; seven listings in ten carry at least one elevated capability. That is the surface a user accepts at install time, and almost none of it is visible then. A permission model exists but is close to inert. Authors may list the tools a skill pre-approves in its own frontmatter, which removes confirmation prompts rather than restricting what the skill can reach; of the 6,061 listings whose frontmatter parses, 770 declare anything at all, the vocabulary cannot express credential or environment access, and nothing checks what it does express against the bundle. Declaring is also not declaring accurately: 59% of declaring listings understate what their bundle can do. ClawHub declares roughly twice as often as skillsmp, yet under-declares on 88% of its declarations against 31%. Triage at the marketplace boundary therefore cannot rest on what a listing declares. It must rest on what the bundle can do. These results position capability-oriented attack-surface profiling as a necessary complement to maliciousness detection.', 'score': 2, 'issue_id': 3438, 'pub_date': '2026-10-13', 'pub_date_card': {'ru': '13 октября', 'en': 'October 13', 'zh': '10月13日'}, 'hash': '0e8cc7b2dfc91d4a', 'authors': ['Ratnesh Pandey', 'Japneet Singh', 'Harsh Akshit', 'Sonali Tyagi', 'Cassie Crossley'], 'affiliations': ['Metano Labs', 'Purdue University', 'VulNow'], 'pdf_title_img': 'assets/pdf/title_img/2610.19264.jpg', 'data': {'categories': ['#security', '#ethics', '#benchmark', '#agents', '#data'], 'emoji': '🛡️', 'ru': {'title': 'Доверяй не декларации, а тому, что навык реально может сделать', 'desc': 'Статья исследует «навыки» (agent skills) — Markdown-документы, которые LLM-агент читает как инструкции и выполняет с правами текущей сессии. Авторы предлагают двухфазную методику профилирования поверхности атаки: статический анализ всего бандла и проверку происхождения зависимостей, а затем запуск в инструментированной песочнице с отдельной оценкой трасс с помощью AI-модели. На 6 309 листингах из двух маркетплейсов показано, что около 70% навыков имеют хотя бы одну повышенную capability, например доступ к shell или сети, а встроенная модель разрешений почти не работает. Большинство объявленных разрешений также занижают реальные возможности бандла, поэтому фильтровать навыки при установке нужно по фактическим capabilities, а не по декларациям.'}, 'en': {'title': 'Uncovering Hidden Risks in Agent Skills', 'desc': 'This paper discusses a method for analyzing the security risks associated with agent skills, which are instructions that agents follow to perform tasks. The authors introduce a two-phase methodology that combines static analysis and dynamic execution to assess the capabilities of these skills. They found that many skills have elevated permissions that are not clearly communicated to users at the time of installation. The study emphasizes the need for a capability-oriented approach to evaluate the potential risks of agent skills, rather than relying solely on what is declared by the listings.'}, 'zh': {'title': '能力导向的攻击面分析是安全检测的关键', 'desc': '本文介绍了一种新的攻击面分析方法，旨在评估工具使用代理的技能文档的安全性。该方法结合了静态分析和动态执行，分析了6309个市场列表，发现许多技能具有潜在的高权限能力。研究表明，用户在安装时并不能清楚看到这些权限，且大多数声明的权限并不准确。最终，作者强调了基于能力的攻击面分析在恶意检测中的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.25265', 'title': 'SPARC: Spoken Profile Authorship Recognition Corpus', 'url': 'https://huggingface.co/papers/2610.25265', 'abstract': 'Abstract Transcribed speech retains speaker and demographic information that large language models can exploit for verification, though releasing only brief text excerpts reduces linkage risk.  Generated by thinkingmachines/Inkling-Small Speech anonymization has focused on the acoustic signal, leaving open how much speaker information the transcribed words themselves retain. In this work, we study pairwise speaker and demographic-attribute verification from transcribed speech. We introduce SPARC (Spoken Profile Authorship Recognition Corpus), a benchmark built from two podcast corpora comprising over 12,500 speakers, 1.5M quality-filtered utterances, and speaker-level inferred or source-provided labels for sex, age, and accent, and evaluate five attribution models and three LLMs on identity- and attribute-verification trials with episode- and metadata-based topic proxies. LLM adversaries distinguish same-speaker pairs from text alone. Attribute-label agreement is harder to verify, but LLMs perform sex- and accent-label verification above chance. Finally, releasing only short probe texts (50 words) degrades the strongest adversaries the most, offering a partial reduction in observed linkage.', 'score': 2, 'issue_id': 3436, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': '5f7d67f1ee545155', 'authors': ['Efthymios Tsaprazlis', 'Bowen Yi', 'Tiantian Feng', 'Junghwan Kim', 'David Jurgens', 'Shrikanth Narayanan'], 'affiliations': ['University of Michigan', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2610.25265.jpg', 'data': {'categories': ['#benchmark', '#security', '#dataset', '#data', '#ethics'], 'emoji': '🕵️', 'ru': {'title': 'Текст выдаёт говорящего: даже после анонимизации речи', 'desc': 'Статья исследует, можно ли по расшифровке речи (тексту) определить говорящего и его демографические признаки, такие как пол, возраст и акцент, даже после анонимизации акустического сигнала. Авторы представляют SPARC — бенчмарк на основе подкастов с более чем 12 500 дикторами и 1,5 млн высказываний, с метками пола, возраста и акцента. Модели атрибуции и три LLM проверяют пары высказываний на совпадение говорящего и демографических атрибутов, при этом LLM уверенно распознают одного и того же говорящего только по тексту. Показано, что публикация коротких фрагментов текста (например, 50 слов) заметно снижает эффективность сильнейших атакующих моделей, частично уменьшая риск связывания анонимных записей.'}, 'en': {'title': 'Unlocking Speaker Identity from Transcribed Speech', 'desc': 'This paper investigates how transcribed speech can reveal speaker and demographic information, which can be exploited by large language models (LLMs) for verification tasks. The authors introduce SPARC, a new benchmark dataset that includes over 12,500 speakers and 1.5 million utterances, along with demographic labels such as sex, age, and accent. They evaluate various attribution models and LLMs to assess their ability to verify speaker identity and demographic attributes based on transcribed text. The findings suggest that while LLMs can distinguish same-speaker pairs from text, verifying demographic attributes is more challenging, although they perform better than random guessing for sex and accent verification.'}, 'zh': {'title': '转录语音中的说话者信息验证', 'desc': '本研究探讨了从转录语音中提取说话者和人口统计信息的能力。我们引入了SPARC数据集，该数据集包含超过12,500名说话者的语音样本，并提供性别、年龄和口音等标签。通过评估多种模型，我们发现大型语言模型能够在文本中区分同一说话者的对比。最后，发布简短的文本片段可以有效降低信息链接的风险。'}}}, {'id': 'https://huggingface.co/papers/2610.22466', 'title': 'Harness-Delta Attribution: Dissecting Gains From Harness Evolution', 'url': 'https://huggingface.co/papers/2610.22466', 'abstract': 'Abstract Harness-Delta Attribution dissects harness evolution gains into overfitting, test-time scaling, and residual generalizable improvement, finding that most search-set gains do not reliably transfer to held-out tasks.  Generated by thinkingmachines/Inkling-Small Harness evolution automatically optimizes the prompts, skills, tools, and orchestration code around a fixed-weight model, offering a way to improve agentic systems without updating model weights. The agent harness is iteratively optimized to achieve higher performance on the search set. But how much of this gain reflects benchmark-specific overfitting or additional inference-time compute, and how much may generalize beyond the search set? In this work, we introduce Harness-Delta Attribution (HDA), an evaluation protocol that dissects an evolution gain into artifact-driven overfitting, gains explained by test-time scaling, and the remainder, which gives an upper bound on residual generalizable improvement. We apply HDA to 11 executor models and three harness-evolution frameworks across math, coding, creativity, and agentic tasks. In 21 of these settings that show statistically significant search-set gains, we find that a large share of the improvement is explained by overfitting or test-time scaling. Specifically, among these 21 settings, overfitting and test-time scaling account for 54% and 14% of the gain on average; their combined share exceeds 50% in 14 settings. The residual and held-out transfer vary substantially across tasks, models, and frameworks. Importantly, search-set gains often fail to transfer to held-out tasks, and provide limited evidence that they will persist under practical distribution shifts. Moreover, validation-based signals are insufficient to prevent overfitting. These results motivate attribution-aware evaluation in future harness evolution research.', 'score': 1, 'issue_id': 3440, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': '56fea41e1f960e8b', 'authors': ['Wenxuan Ding', 'Qin Lu', 'Changlong Yu', 'Sha Li', 'Shuowei Jin', 'Xin Liu', 'Zhenyu Shi', 'Greg Durrett'], 'affiliations': ['Amazon', 'New York University'], 'pdf_title_img': 'assets/pdf/title_img/2610.22466.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Прирост на поиске часто не переносится: оценивать нужно атрибуцию, а не только метрики', 'desc': 'В статье представлен протокол оценки Harness-Delta Attribution (HDA), который раскладывает прирост от эволюции harness (промптов, навыков, инструментов и оркестрационного кода вокруг модели с фиксированными весами) на переобучение к артефактам, эффект масштабирования вычислений на этапе инференса и остаточное обобщаемое улучшение. Авторы применили HDA к 11 executor-моделям и трём фреймворкам эволюции harness на задачах по математике, программированию, креативности и агентным сценариям. В 21 случае со статистически значимым приростом на поисковом наборе в среднем 54% улучшения объясняется переобучением и 14% масштабированием вычислений, а перенос на held-out задачи часто оказывается слабым. Поэтому авторы призывают использовать атрибуционно-ориентированную оценку в дальнейших исследованиях эволюции harness.'}, 'en': {'title': 'Dissecting Gains: Beyond Overfitting in Harness Evolution', 'desc': 'The paper introduces Harness-Delta Attribution (HDA), a method to analyze performance gains from harness evolution in machine learning models. It identifies how much of the improvement is due to overfitting, test-time scaling, and true generalizable performance. The study reveals that a significant portion of gains in various tasks can be attributed to overfitting and scaling, rather than genuine improvements. This highlights the need for better evaluation methods to ensure that performance gains are reliable and transferable to new tasks.'}, 'zh': {'title': '揭示模型提升的真实原因', 'desc': 'Harness-Delta Attribution（HDA）是一种评估协议，用于分析模型在特定任务上的性能提升。研究发现，许多性能提升是由于过拟合和测试时扩展造成的，而不是模型的真正泛化能力。通过对11个执行模型和三种演化框架的应用，结果显示在21个设置中，过拟合和测试时扩展分别占据了54%和14%的性能提升。该研究强调了在未来的模型演化研究中，进行归因意识评估的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.25159', 'title': 'Legal Guidance in the Wild: How Users Seek Legal Help in Real-World LLM Conversations', 'url': 'https://huggingface.co/papers/2610.25159', 'abstract': 'Abstract The study develops a taxonomy to identify legal guidance requests in conversational AI, annotates thousands of chats, and evaluates ModernBERT models against a baseline for detecting such queries.  Generated by thinkingmachines/Inkling-Small People ask conversational AI models about their legal rights, obligations, procedures, and personal situations that may have legal consequences. To study this behavior, we first need to distinguish requests for legal guidance from other legally themed discussions and unrelated conversations. We contribute a multi-axis taxonomy of legal queries capturing whether legal guidance is sought, how a request is formulated, and which legal domains it concerns; apply it to 2,122 naturally occurring WildChat-1M conversations; and create a human-reviewed gold evaluation set of 200 conversations. All annotations, model checkpoints, and evaluation code are publicly available. In this enriched sample, 71.1% of conversations containing legal content seek personalized or practical guidance. Rights-and-options advice is the most common primary request type among legal-content conversations, and 25.3% of guidance-positive conversations span multiple legal topics. The gold evaluation set supports a two-stage comparison of ModernBERT-base and ModernBERT-large against a TF-IDF cascade. Our framework supports large-scale studies of legal guidance in conversational AI, and the public release of the annotated data facilitates reproducible research and future model development.', 'score': 1, 'issue_id': 3439, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': '4ce65d1e55617122', 'authors': ['Amirreza Mohseni', 'Gerasimos Spanakis'], 'affiliations': ['Maastricht University, Maastricht, The Netherlands'], 'pdf_title_img': 'assets/pdf/title_img/2610.25159.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#training', '#data', '#survey', '#ethics'], 'emoji': '⚖️', 'ru': {'title': 'Как распознать, что пользователь ищет юридическую консультацию у AI', 'desc': 'Исследование вводит таксономию для распознавания запросов на юридические консультации в диалоговых AI-системах, например LLM. Авторы размечают 2122 реальных диалога из датасета WildChat-1M и создают эталонную выборку из 200 диалогов, проверенную людьми. На этих данных сравниваются модели ModernBERT-base и ModernBERT-large с базовым TF-IDF-каскадом. Результаты показывают, что 71.1% юридических диалогов ищут персонализированную практическую помощь, а все аннотации и модели опубликованы для воспроизводимости.'}, 'en': {'title': 'Enhancing Legal Guidance Detection in Conversational AI', 'desc': 'This paper introduces a structured classification system, or taxonomy, to identify requests for legal guidance within conversations with AI. It annotates a large dataset of chats to differentiate between legal inquiries and unrelated discussions. The study evaluates the performance of ModernBERT models in detecting these legal queries compared to a traditional TF-IDF approach. By providing a publicly available dataset and evaluation framework, the research aims to enhance the understanding and development of conversational AI in the legal domain.'}, 'zh': {'title': '对话式AI中的法律指导请求分类研究', 'desc': '本研究开发了一种分类法，用于识别对话式人工智能中的法律指导请求。我们对数千个聊天记录进行了标注，并评估了ModernBERT模型在检测这些请求方面的表现。研究发现，71.1%的包含法律内容的对话寻求个性化或实用的指导，且权利与选择建议是最常见的请求类型。我们的框架支持对话式人工智能中法律指导的大规模研究，并公开发布的标注数据促进了可重复研究和未来模型的发展。'}}}, {'id': 'https://huggingface.co/papers/2610.14397', 'title': "RealityBench: Simulated Environments to Evaluate a Vision Language Model's Ability to Document Human Physical Work", 'url': 'https://huggingface.co/papers/2610.14397', 'abstract': "Abstract Researchers benchmark vision-language models on simulated physical work tasks, finding strengths in text-based documentation but weaknesses in measurement reading, spatial reasoning, and acceptability judgment.  Generated by thinkingmachines/Inkling-Small Augmenting worker capabilities in the physical world through guidance has been a decades-long goal for AI agents. One key supporting capability is to understand what the worker is doing, seeing through the human's camera or smart glasses, and assist them in documentation. Despite advances in vision language models, their capabilities in these settings remain uncertain and are challenging to benchmark because most physical work data is proprietary, and involves too much variability to study in a principled manner. Unlike structured settings such as kitchens and warehouses that have predictable lighting, geometry, and objects, field-facing tasks such as rooftop solar installation and vehicle repair are unconstrained and high variance. Here, we model real-world physical work in Blender across eleven environments, incorporating variants in both image acceptability and documentation. The acceptability task asks whether a particular view would be suitable proof-of-work and documentation asks whether an agent can understand the task-relevant state of the environment from that view. Across 26 vision-language models, we find that top models largely solve documentation when the answer is text in frame, but are weak at reading measurements and at judging small parts and spatial relations, such as whether a tape measure leans. Acceptability is harder to pin down because human raters disagree with each other. Measured against a scorer that agrees with the raters' majority about as often as a single rater does, the best models cannot be distinguished from a single non-author rater, at a cost within the range of a human pass. In the three environments where we can trace acceptability errors, most wrong rejections come from misreading the scene rather than the requirement. On the three documentation questions for which we have real images, model rankings on rendered frames transfer to real images.", 'score': 1, 'issue_id': 3437, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '69f9c6abfe70e2b8', 'authors': ['Andrew Perrault', 'Anmol Takiar', 'Dominik Winecki', 'Arnab Nandi'], 'affiliations': ['Relantic, Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2610.14397.jpg', 'data': {'categories': ['#multimodal', '#agents', '#interpretability', '#benchmark', '#cv'], 'emoji': '🛠️', 'ru': {'title': 'Видят ли VLM-модели то, что делает рабочий?', 'desc': 'Авторы оценивают vision-language models (VLM) на симулированных задачах физического труда, смоделированных в Blender в одиннадцати средах, таких как монтаж солнечных панелей и ремонт автомобилей. Модели проверяются на two задачи: оценка приемлемости кадра как proof-of-work и понимание состояния среды для документирования. Лучшие модели хорошо справляются с чтением текста в кадре, но плохо считывают показания измерительных приборов и распознают мелкие детали и пространственные отношения. Оценка acceptability осложняется расхождением человеческих разметчиков, а результаты на рендерах в основном переносятся на реальные изображения.'}, 'en': {'title': 'Enhancing AI Understanding in Real-World Tasks', 'desc': 'This paper evaluates vision-language models in the context of physical work tasks, highlighting their strengths in processing text-based information but revealing weaknesses in spatial reasoning and measurement interpretation. The researchers created a simulated environment using Blender to benchmark these models across various tasks, focusing on acceptability and documentation. They found that while top models excel at understanding text within images, they struggle with tasks requiring nuanced spatial awareness and measurement reading. The study also indicates that human judgment on acceptability varies significantly, complicating the evaluation of model performance in real-world scenarios.'}, 'zh': {'title': '提升AI在物理工作中的辅助能力', 'desc': '本研究评估了视觉-语言模型在模拟物理工作任务中的表现，发现它们在文本文档处理上表现良好，但在测量读取、空间推理和可接受性判断方面存在不足。研究通过Blender模拟了现实世界的物理工作，涵盖了多个环境，并考虑了图像可接受性和文档要求的变化。尽管顶尖模型在文档理解上表现出色，但在读取测量和判断空间关系方面仍显得薄弱。可接受性判断的难度在于人类评审者之间存在较大分歧，导致模型的表现难以准确评估。'}}}, {'id': 'https://huggingface.co/papers/2610.25288', 'title': 'Vision as Proprioception: Estimating Humanoid Robot Pose from Video', 'url': 'https://huggingface.co/papers/2610.25288', 'abstract': "Abstract HumanoidPose recovers full-body humanoid robot joint configurations from video by combining human-pose features with robot kinematics and self-training on unlabeled videos.  Generated by thinkingmachines/Inkling-Small Estimating a humanoid robot's internal state from video has a wide range of real-world applications but remains unexplored. During interactions with a robot, its onboard state information may be unavailable due to privacy, ownership, or communication constraints. Meanwhile, online and AI-generated robot videos provide rich sources of data but typically lack corresponding joint configurations, limiting their direct use in robot learning. To address these issues, we present HumanoidPose, a new framework that treats vision as proprioception to recover full-body joint configurations in world space from video alone. Specifically, we combine pretrained human-pose features with robot kinematics in a unified model that predicts each embodiment's joint configurations. We retarget human motions to sixteen different humanoid embodiments, enabling scalable learning entirely from synthetic data. To improve real-world generalization, we further leverage unlabeled online videos through self-training to develop a 2D robot-pose detector. In our evaluation, HumanoidPose improves joint-angle and joint-position accuracy over the evaluated baselines and reduces joint-angle error by 18-32% relative to the best-performing baseline on each of the three real humanoid platforms. We further show improved global localization and generalization to unseen embodiments. HumanoidPose enables visual understanding of other robots during interaction and extraction of robot motion from online and generated videos.", 'score': 0, 'issue_id': 3439, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': '3be2e145a7e48530', 'authors': ['Jiaxi Jiang', 'Matthias Heyrman', 'René Zurbrügg', 'Marco Hutter', 'Christian Holz'], 'affiliations': ['ETH Zurich'], 'pdf_title_img': 'assets/pdf/title_img/2610.25288.jpg', 'data': {'categories': ['#training', '#data', '#robotics', '#synthetic', '#optimization', '#video', '#cv'], 'emoji': '🤖', 'ru': {'title': 'Видим робота — понимаем его суставы без датчиков', 'desc': 'В статье представлен HumanoidPose — фреймворк, который восстанавливает полные конфигурации суставов humanoid-робота в мировых координатах по одному лишь видео, рассматривая зрение как проприоцепцию. Модель объединяет предобученные признаки human-pose с кинематикой робота и обучается преимущественно на синтетических данных, ретаргетируя движения человека на шестнадцать различных humanoid-воплощений. Для повышения обобщения на реальные видео используется self-training на неразмеченных онлайн-роликах, что позволяет обучить детектор 2D-поз робота. По результатам экспериментов ошибка углов суставов снижается на 18–32% относительно лучшего baseline на трёх реальных платформах.'}, 'en': {'title': 'Unlocking Robot Motion from Video: HumanoidPose', 'desc': "HumanoidPose is a framework designed to estimate the joint configurations of humanoid robots from video input. It combines human-pose features with robot kinematics, allowing the model to predict joint positions without needing labeled data. By utilizing self-training on unlabeled videos, it enhances the model's ability to generalize to real-world scenarios. The framework demonstrates significant improvements in accuracy for joint angles and positions, making it a valuable tool for understanding and interacting with humanoid robots."}, 'zh': {'title': 'HumanoidPose：从视频中恢复类人机器人运动', 'desc': 'HumanoidPose 是一个新框架，可以从视频中恢复全身类人机器人关节配置。它结合了人类姿态特征和机器人运动学，通过自我训练在未标记的视频上进行学习。该方法将视觉视为本体感觉，能够从合成数据中扩展到多种类人机器人。实验结果表明，HumanoidPose 在关节角度和位置的准确性上优于现有基线，并且在未见的机器人模型上也表现出良好的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2610.22714', 'title': 'First Passage Attention', 'url': 'https://huggingface.co/papers/2610.22714', 'abstract': "Abstract First Passage Attention replaces monotonic decay accumulation with path extrema to selectively retain older context, enabling perfect long-range retrieval with compressed caches.  Generated by thinkingmachines/Inkling-Small Augmenting softmax attention with forget gates typically relies on summing decay contributions along the key--query path. Because such accumulation is monotonic, these mechanisms cannot selectively erase intermediate context while preserving older, structurally relevant tokens. We propose First Passage Attention (FPA), which shifts from path summation to path extrema by lowering a key's logit proportionally to the deepest dip of a learned scalar field below that key's level over the intervening span. FPA encompasses the Forgetting Transformer (FoX) as a special case, and when the field and levels follow a shared learned walk, the alive keys with unpenalised logits naturally form a stack. We show that a constant-dimension FPA head realises any subset of keys left alive by subsequent dips, whereas softmax heads with positional biases or token-level forget gates require a head dimension linear in the number of keys. In synthetic experiments, one-layer FPA heads converge to these target sets while comparable softmax and FoX baselines fail on every seed. Scaling to a 110M-parameter language model, FPA matches FoX in perplexity and uniquely achieves perfect passkey retrieval at 8times the training length, even with its key--value cache compressed to about 25%.", 'score': 0, 'issue_id': 3439, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': '58c07caec78c85f1', 'authors': ['Yuxuan Liu'], 'affiliations': ['University of Bergen, Bergen, Norway'], 'pdf_title_img': 'assets/pdf/title_img/2610.22714.jpg', 'data': {'categories': ['#long_context', '#architecture', '#training'], 'emoji': '🧭', 'ru': {'title': 'Помнить главное: внимание через экстремумы пути вместо накопления забывания', 'desc': 'Статья предлагает новый механизм внимания First Passage Attention (FPA), который заменяет накопление затухания по пути между ключом и запросом на поиск экстремумов пути. Логит ключа понижается пропорционально самому глубокому провалу обученного скалярного поля относительно уровня этого ключа, что позволяет избирательно удалять промежуточный контекст и сохранять старые, структурно важные токены. FPA обобщает Forgetting Transformer (FoX), а константный по размерности head может выделять любое подмножество выживших ключей, тогда как softmax-головы требуют размерность, линейную по числу ключей. На синтетических задачах и на LLM с 110M параметрами FPA не уступает FoX по perplexity и обеспечивает идеальный поиск passkey на длине в 8 раз больше обучающей, даже при сжатии KV-кэша примерно до 25%.'}, 'en': {'title': 'Revolutionizing Context Retrieval with First Passage Attention', 'desc': 'This paper introduces First Passage Attention (FPA), a novel mechanism that enhances long-range context retrieval in machine learning models. Unlike traditional methods that rely on monotonic decay accumulation, FPA utilizes path extrema to selectively retain older context while allowing for the erasure of less relevant intermediate tokens. The approach involves adjusting the logit of keys based on a learned scalar field, enabling efficient management of key-query relationships. Experimental results demonstrate that FPA outperforms existing methods in terms of retrieval accuracy and efficiency, particularly in large-scale language models.'}, 'zh': {'title': '第一通道注意力：完美的长距离检索', 'desc': '本文提出了一种新的注意力机制，称为第一通道注意力（First Passage Attention, FPA），它通过路径极值来选择性保留旧的上下文信息，从而实现完美的长距离检索。与传统的软最大注意力机制不同，FPA能够在保留结构相关的旧标记的同时，有效地删除中间上下文。FPA还包含了遗忘变换器（Forgetting Transformer, FoX）作为特例，并且在共享学习的情况下，能够自然形成一个有效的键堆栈。通过实验，FPA在处理目标集合时表现优异，尤其是在大规模语言模型中，FPA在训练长度上表现出色，且在压缩缓存的情况下实现了完美的检索。'}}}, {'id': 'https://huggingface.co/papers/2610.22894', 'title': 'Competence-Based Evaluation of Logical Reasoning in Large Language Models', 'url': 'https://huggingface.co/papers/2610.22894', 'abstract': "Abstract Competence-based evaluation reveals that large language models fail to consistently apply reasoning rules across varied problem presentations despite high accuracy on bounded tasks.  Generated by thinkingmachines/Inkling-Small Recent advances in large language models (LLMs) have brought impressive performance across diverse tasks; however, shortcomings remain in logical reasoning, including inconsistencies under linguistic variation. To improve the reasoning capacity of LLMs, we must be able to accurately measure their reasoning capacity. Current benchmarks primarily report single accuracy numbers on selected reasoning tasks. Such a performance-based evaluation methodology says little about a model's generalization capacity in reasoning. To address this limitation, we argue for a different evaluation paradigm, called competence-based evaluation (CBE), which tests whether models reliably apply the same competence across a family of problems. A parameterized generator scales complexity while keeping the required competence fixed, and matched answer-preserving presentations test correctness beyond one formulation. We instantiate CBE on elementary ordering tasks, scaling input size while varying presentations of the same ordering rule. Across six GPT and Qwen models, performance is reasonably good over bounded complexity ranges, but even strong models fail the competence condition across the tested family. Chain-of-thought and GRPO extend strong performance without resolving all tested failures; supervised LoRA shows little held-out transfer. CBE provides diagnostic profiles and an evaluation protocol that can grow with future models.", 'score': 0, 'issue_id': 3439, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '25519b44a8aed568', 'authors': ['Jize Jiang', 'Chengxiang Zhai'], 'affiliations': ['University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.22894.jpg', 'data': {'categories': ['#benchmark', '#training', '#optimization', '#rl', '#reasoning'], 'emoji': '🧩', 'ru': {'title': 'Высокая accuracy не равна настоящему логическому мышлению LLM', 'desc': 'Статья предлагает новый подход к оценке LLM, называемый компетентностной оценкой (CBE), вместо привычного измерения одной итоговой accuracy на отдельных бенчмарках. Метод проверяет, способна ли модель стабильно применять одно и то же правило рассуждения к семейству задач, где сложность варьируется параметрическим генератором, а формулировки меняются без изменения ответа. Эксперименты на задачах упорядочивания с шестью моделями GPT и Qwen показали, что при ограниченной сложности результаты неплохие, но модели не выполняют условие компетентности на всём семействе задач. Chain-of-thought и GRPO частично улучшают результат, тогда как supervised LoRA почти не переносится на новые данные.'}, 'en': {'title': 'Evaluating Reasoning Consistency in Language Models', 'desc': "This paper discusses the limitations of large language models (LLMs) in applying reasoning rules consistently across different problem formats, despite their high accuracy in specific tasks. It introduces a new evaluation method called competence-based evaluation (CBE), which assesses whether models can reliably apply reasoning skills across a variety of related problems. The authors demonstrate that while LLMs perform well on simpler tasks, they struggle to maintain consistent reasoning when faced with variations in problem presentation. CBE aims to provide a more comprehensive understanding of a model's reasoning capabilities and offers a framework for future evaluations as models evolve."}, 'zh': {'title': '提升语言模型推理能力的新评估方法', 'desc': '这篇论文探讨了大型语言模型（LLMs）在逻辑推理方面的不足，尽管它们在特定任务上表现
