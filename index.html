    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.26802', 'title': 'Scaling Parameter-Efficient Fine-Tuning for Brain Encoding', 'url': 'https://huggingface.co/papers/2610.26802', 'abstract': "Abstract Parameter-efficient fine-tuning with low-rank adapters enables efficient adaptation of very large multimodal backbones for brain encoding, improving performance and interpretability while reducing computational cost.  Generated by thinkingmachines/Inkling-Small Brain encoding models aim to predict neural responses to stimuli. The most widely used approach fits readouts from frozen pretrained backbones. Using neural data to train large models from scratch or fully fine-tune them after task-pretraining has proven difficult because neural data is costly and limited. We show that parameter-efficient fine-tuning (PEFT) enables us to effectively adapt very large pretrained backbones for brain encoding with a small number of trainable parameters. To make it computationally practical, we exploit the backbone's causal structure to predict multiple timepoints in a single pass instead of using sliding windows, significantly reducing feature-extraction cost. This enables efficient fine-tuning of multimodal backbones with up to 104B parameters, the largest model adapted for brain encoding to our knowledge. Trained with a low-rank adapter (LoRA) and a lightweight readout, our approach consistently improves brain encoding performance across nine diverse multimodal backbones. On the same Qwen3-Omni backbone as the prior state-of-the-art (SoTA), our method BrainLoRA achieves the best published performance on the Algonauts 2025 Challenge. We also show the adapted multimodal backbones remain interpretable: modality attribution recovers the canonical sensory topography that prior work often obtains by construction from separate unimodal encoders, and neural adaptation increases the contribution of audio inputs and cross-modal mixing within the backbone. To scale out the number of adapted models, we develop a multi-LoRA kernel that accelerates joint training of multiple LoRAs on a shared backbone. This enables an ensemble of 200+ adapted models that ranks first on the public Algonauts post-challenge leaderboard at the time of writing. Together, our results highlight PEFT as an efficient and powerful paradigm for brain encoding.", 'score': 231, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '184adecc4dcfe986', 'authors': ['Zhuofan Josh Ying', 'Guanglong Sun', 'Nolan Ho', 'Kieran Liu', 'Rui Yang', 'Andrew Chen', 'Nikolaus Kriegeskorte', 'Pony Ma', 'Hossein Adeli'], 'affiliations': ['Columbia University', 'HKUST(GZ)', 'Mind Lab', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26802.jpg', 'data': {'categories': ['#benchmark', '#audio', '#multimodal', '#inference', '#science', '#training', '#interpretability', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Дообучаем гигантские LLM на данных мозга — эффективно и точно', 'desc': 'Статья предлагает BrainLoRA — метод параметрически эффективной донастройки (PEFT) с низкоранговыми адаптерами (LoRA) для больших мультимодальных моделей, которые предсказывают нейронные ответы на стимулы. Авторы используют каузальную структуру backbone-модели, чтобы предсказывать несколько временных точек за один проход вместо скользящего окна, что заметно снижает вычислительные затраты. Метод адаптирует модели до 104B параметров и достигает лучшего опубликованного результата на Algonauts 2025 Challenge, а также сохраняет интерпретируемость, восстанавливая сенсорную топографию мозга. Для масштабирования авторы разработали multi-LoRA ядро и ансамбль из 200+ моделей, который занял первое место в публичном таблице лидеров.'}, 'en': {'title': 'Efficient Brain Encoding with Parameter-Efficient Fine-Tuning', 'desc': 'This paper presents a method called parameter-efficient fine-tuning (PEFT) using low-rank adapters (LoRA) to adapt large multimodal models for brain encoding tasks. The approach allows for effective training of models with billions of parameters while only adjusting a small number of parameters, making it computationally efficient. By leveraging the causal structure of the backbone, the method reduces the cost of feature extraction and improves performance on brain encoding challenges. The results demonstrate that this technique not only enhances model performance but also maintains interpretability, revealing important insights into sensory processing.'}, 'zh': {'title': '高效脑编码的参数微调新方法', 'desc': '本文提出了一种参数高效微调（PEFT）的方法，利用低秩适配器（LoRA）有效地调整大型多模态模型以进行脑编码。通过这种方法，我们能够在有限的可训练参数下，显著提高模型在脑编码任务中的表现和可解释性。我们还利用模型的因果结构，减少特征提取的计算成本，使得在单次传递中预测多个时间点成为可能。最终，我们的方法在多个多模态模型上表现出色，并在Algonauts 2025挑战赛中取得了最佳成绩。'}}}, {'id': 'https://huggingface.co/papers/2610.24087', 'title': 'OR-License: Evaluating LLM Agents as Real-World Operations Research Practitioners', 'url': 'https://huggingface.co/papers/2610.24087', 'abstract': 'Abstract OR-License evaluates whether LLM agents can solve real-world operations research problems from original client materials, finding that while some achieve high objective quality, none match expert-level feasibility and deployment-adjusted quality.  Generated by thinkingmachines/Inkling-Small Can large language model (LLM) agents deliver expert-level operations research (OR) solutions directly from original client materials, without prior expert reformulation? Existing OR benchmarks typically begin with self-contained descriptions or predefined optimization tasks, underrepresenting the translation of original business materials into professionally validated solutions. We introduce OR-License, an end-to-end benchmark of 31 instances across 10 industrial scenarios from paid OR engagements totaling USD 3.68 million. It preserves original requirements, input data, deliverable formats, and information boundaries after de-identification. To study information acquisition, we introduce ORSim, a controlled client simulator that discloses business facts without supplying OR expertise. Hidden evaluation checks feasibility and compares objective quality against original expert solutions accepted by clients before benchmark construction. Deployment-Adjusted Quality (DAQ) averages expert-relative quality across instances, assigning zero to infeasible deliveries. Across 11 frontier LLMs using coding-agent harnesses, several exceed the expert reference in conditional objective quality, but none matches its DAQ; the strongest primary Claude Code configuration achieves 88.39% strict feasibility and a DAQ of 0.87 against the expert reference of 1. Client information acquisition extends beyond clarification into solution development and validation, with some later stages showing higher confirmed issue-resolution proportions. Trajectory analysis identifies formulation and implementation failures, while task-equalized research-chain completion rates range from 24% to 45% across models on evaluable tasks. These findings motivate sustained information-gap resolution, faithful problem formulation, and evidence-linked self-improvement for reliable long-horizon agents.', 'score': 159, 'issue_id': 3436, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '72b4da87692d4ef2', 'authors': ['Peisong Wang', 'Feixue Liu', 'Yize Meng', 'Bowen Liu', 'Ruoyu Chen', 'Gaoyang Dai', 'Xing He', 'Aiqian Li', 'Fengchi Yuan', 'Aochuan Chen', 'Chenyi Zi', 'Yuhan Li', 'Hongchuan Zeng', 'Yimo Yan', 'Nuo Chen', 'Jie Fu', 'Zuo-Jun Max Shen', 'Yong-Hong KUO', 'Jia Li'], 'affiliations': ['American University of Sharjah', 'CZBANK', 'HKU', 'HKUST-GZ', 'Hunyuan, Tencent', 'Independent Researcher', 'Qingzhi Optimization (Jinan) Information Technology Co., Ltd.', 'Tianjin Meta & Infinite Technology Co., Ltd', 'XM Capital'], 'pdf_title_img': 'assets/pdf/title_img/2610.24087.jpg', 'data': {'categories': ['#survey', '#benchmark', '#dataset', '#science', '#agents', '#reasoning'], 'emoji': '📊', 'ru': {'title': 'LLM-агенты пока не заменят эксперта в исследовании операций: даже лучшие решения уступают людям по реализуемости', 'desc': 'Авторы представляют OR-License — бенчмарк из 31 задачи исследования операций, основанных на реальных коммерческих проектах с оригинальными материалами клиентов. Они также создали ORSim, симулятор клиента, который раскрывает бизнес-факты без экспертных знаний OR, чтобы проверять, как LLM-агенты собирают информацию. Метрика DAQ оценивает качество решений относительно экспертных, присваивая ноль недопустимым решениям. Результаты показывают, что ни одна из 11 современных LLM не достигает экспертного уровня по DAQ, хотя некоторые превосходят эталон по целевой функции, и выявляют ошибки формализации и реализации.'}, 'en': {'title': 'Unlocking LLM Potential in Operations Research Solutions', 'desc': "The paper introduces OR-License, a benchmark designed to evaluate how well large language model (LLM) agents can solve real-world operations research problems using original client materials. It finds that while some LLMs can achieve high objective quality, they do not reach the expert-level feasibility and deployment-adjusted quality necessary for practical applications. The study uses ORSim, a simulator that provides business facts without OR expertise, to assess the models' performance against expert solutions. The results highlight the need for improved information acquisition and problem formulation to enhance the reliability of LLM agents in operations research tasks."}, 'zh': {'title': '评估LLM在运筹学中的专家级解决能力', 'desc': '这篇论文介绍了OR-License，一个评估大型语言模型（LLM）在解决实际运筹学问题能力的基准。研究发现，虽然一些LLM在目标质量上表现良好，但没有一个能达到专家级的可行性和调整后的质量。论文还引入了ORSIM，一个模拟客户的工具，用于研究信息获取过程。结果表明，LLM在解决复杂问题时仍需改进，特别是在问题的准确表述和解决方案的验证方面。'}}}, {'id': 'https://huggingface.co/papers/2610.26625', 'title': 'EgoXperience: Learning World-Grounded Egocentric Representations from Human Experience', 'url': 'https://huggingface.co/papers/2610.26625', 'abstract': "Abstract EgoXperience introduces a unified framework for joint reconstruction of camera motion, scene geometry, hands, and objects from egocentric video using automatically annotated large-scale data and a single-pass model.  Generated by thinkingmachines/Inkling-Small Reconstructing human activity from egocentric video requires more than recovering individual 3D components: the observer's motion, surrounding geometry, and hand-object interactions must fit together in a consistent world. Achieving this coherence requires both joint reconstruction and aligned supervision, yet existing methods and datasets offer limited support for either. We present EgoXperience, a full-stack paradigm that addresses these needs through data collection, automatic annotation, unified modeling, and benchmarking. Central to EgoXperience is an automatic annotation engine, EgoX-Engine, that couples geometrically verified object tracking with SLAM-based world alignment, yielding consistent supervision for the camera, scene, hands, and objects. This yields EgoX-Data-6M, a 50-hour dataset of task-driven manipulation and locomotion within and across indoor and outdoor environments, with second-level task captions. We carefully select one hour across these activity categories as EgoX-Bench to evaluate joint reconstruction. To translate this supervision into reconstruction, we introduce EgoX, trained with EgoX-Data-6M and complementary annotations from additional public datasets. Given monocular egocentric video and first-frame object masks, our model achieves joint metric reconstruction of the camera, scene, hands, and objects in a shared world coordinate frame with a single forward pass. Extensive experiments demonstrate state-of-the-art performance across scene estimation and world-space hand-object pose recovery. Against the strongest evaluated baselines, EgoX reduces camera, hand, and depth errors by 68.9%, 65.6%, and 42.9%, and improves object pose scores by 28.0%.", 'score': 120, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '292a860c53333915', 'authors': ['Xinhao Ji', 'Hui En Pang', 'Hao Li', 'Kairui Hu', 'Jiner Wang', 'Mingze Sun', 'Ziang Cao', 'Yalun Dai', 'Thang Luu', 'Qin Ma', 'Hongyi Chen', 'Yukang Cao', 'Fangzhou Hong', 'Zhaoxi Chen', 'Ziwei Liu'], 'affiliations': ['Nanyang Technological University', 'Peking University', 'Ropedia', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26625.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#video', '#synthetic', '#training', '#3d', '#multimodal', '#dataset', '#architecture', '#cv', '#data', '#interpretability', '#optimization'], 'emoji': '🥽', 'ru': {'title': 'Единый мир от первого лица: видим камеру, сцену, руки и объекты вместе', 'desc': 'Статья представляет EgoXperience — полный конвейер для совместной реконструкции движения камеры, геометрии сцены, рук и объектов по эгоцентричному видео. Ключевой компонент — автоматический движок аннотации EgoX-Engine, который сочетает геометрически верифицированное трекинг объектов с SLAM-выравниванием мира и создаёт датасет EgoX-Data-6M объёмом 50 часов. Модель EgoX, обученная на этих данных, по одному монокулярному видео и маскам объектов в первом кадре восстанавливает все компоненты в общей метрической системе координат за один проход. Эксперименты показывают state-of-the-art результаты, а по сравнению с сильнейшими baseline ошибки камеры, рук и глубины снижаются на 68.9%, 65.6% и 42.9% соответственно.'}, 'en': {'title': 'Unified Reconstruction of Motion and Interaction from Egocentric Video', 'desc': 'EgoXperience is a new framework designed to reconstruct various elements from egocentric video, including camera motion, scene geometry, and interactions between hands and objects. It utilizes a large-scale dataset, EgoX-Data-6M, which is automatically annotated to provide consistent supervision for these components. The framework includes an automatic annotation engine, EgoX-Engine, that ensures accurate tracking and alignment of the observed world. By training the model with this comprehensive data, EgoX achieves significant improvements in reconstruction accuracy compared to existing methods.'}, 'zh': {'title': 'EgoXperience：自我中心视频的联合重建新框架', 'desc': 'EgoXperience提出了一个统一框架，用于从自我中心视频中联合重建相机运动、场景几何、手部和物体。该框架利用自动标注的大规模数据和单次模型，确保观察者的运动、周围几何和手物体交互在一致的世界中协调一致。EgoX-Engine是核心组件，通过几何验证的物体跟踪与基于SLAM的世界对齐相结合，提供一致的监督信息。通过EgoX-Data-6M数据集，模型在单次前向传递中实现了相机、场景、手部和物体的联合度量重建，展现了在场景估计和手物体姿态恢复方面的最先进性能。'}}}, {'id': 'https://huggingface.co/papers/2610.26825', 'title': 'MemT-1.0: Towards Memory-Native Evolution', 'url': 'https://huggingface.co/papers/2610.26825', 'abstract': 'Abstract MemT-1.0 introduces a memory-native architecture that embeds continuous memory into foundation model computation, improving long-context efficiency and agentic task performance.  Generated by thinkingmachines/Inkling-Small Memory-native evolution requires making memory an intrinsic capability of foundation models, enabling them to continuously accumulate and utilize information. To this end, we introduce MemT-1.0, a new architecture of memory foundation models that internalize memory as part of model computation. Building on Metis, MemT-1.0 employs Gated DeltaNet-2 with a stable token-level memory update mechanism within each turn. We further introduce Mixture-of-Storage to scale native memory capacity. Following a deliberate backbone preparation, we develop a two-stage training pipeline consisting of continued pre-training and post-training, supported by 34B tokens of training data and efficient training and inference infrastructure. We release a model family comprising MemT-1.0-Nano and MemT-1.0-Flash, and conduct a comprehensive evaluation of memory and general capabilities. The results show that they outperform the parametric memory baselines on average and remain competitive with retrieval-augmented methods, while largely preserving general capabilities. At a history length of 128K tokens, MemT-1.0-Nano achieves approximately 1.86times end-to-end inference speedup and a 66times reduction in persistent storage relative to full context KV cache. By internalizing retrieved procedural experience, MemT-1.0 improves task success on agentic tasks, providing a practical step toward memory-native evolution.', 'score': 109, 'issue_id': 3437, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '982f068049b9bb9c', 'pdf_title_img': 'assets/pdf/title_img/2610.26825.jpg', 'data': {'categories': ['#inference', '#agents', '#optimization', '#architecture', '#rag', '#training', '#benchmark', '#long_context', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Память, встроенная прямо в мозг модели', 'desc': 'В статье представлена архитектура MemT-1.0, в которой память встроена непосредственно в вычисления базовой foundation-модели, а не подключается снаружи. Модель использует Gated DeltaNet-2 с устойчивым механизмом обновления памяти на уровне токенов и Mixture-of-Storage для масштабирования ёмкости памяти. Обучение проходит в два этапа: continued pre-training и post-training на 34B токенах. Результаты показывают преимущество над параметрическими baseline и конкурентоспособность с retrieval-augmented методами, а при длине истории 128K токенов модель Nano даёт примерно 1.86x ускорение инференса и 66x снижение объёма хранимого KV cache.'}, 'en': {'title': 'Empowering Models with Native Memory for Enhanced Performance', 'desc': 'MemT-1.0 is a new architecture designed to integrate continuous memory directly into foundation models, enhancing their ability to handle long contexts and perform complex tasks. This model allows for the accumulation and utilization of information as part of its computation process, making memory a core feature. It utilizes a Gated DeltaNet-2 mechanism for stable memory updates and introduces a Mixture-of-Storage approach to expand memory capacity. The results demonstrate that MemT-1.0 significantly improves inference speed and reduces storage needs while maintaining strong performance on various tasks.'}, 'zh': {'title': '内存原生架构，提升模型智能', 'desc': 'MemT-1.0是一种内存原生架构，它将连续记忆嵌入基础模型的计算中，从而提高了长上下文的效率和任务性能。该模型使记忆成为基础模型的内在能力，能够持续积累和利用信息。MemT-1.0采用了Gated DeltaNet-2，并在每个回合内实现稳定的令牌级记忆更新机制。通过引入Mixture-of-Storage，MemT-1.0能够扩展原生记忆容量，并在训练过程中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2610.26549', 'title': 'Holi-World: Building Holistic World Intelligence from Human-Ego Experience', 'url': 'https://huggingface.co/papers/2610.26549', 'abstract': "Abstract HOLI-WORLD is an integrated ecosystem that automates the construction of large-scale learning resources from egocentric recordings to improve machine understanding of dynamic scenes and interactions.  Generated by thinkingmachines/Inkling-Small Human egocentric experience offers a rich foundation for learning how the world is organized and how it changes through interaction. Realizing this potential at scale requires turning growing volumes of recordings into learning resources that connect scene structure, object semantics, and interaction histories across viewpoints and time, while reducing dependence on costly manual annotation. We introduce HOLI-WORLD, an integrated ecosystem connecting experience capture, world representation, automated data construction, model learning, and independent evaluation. To sup- port learning at scale, HOLIWORLD-Foundry combines complementary static and dynamic perception to automatically construct world records that connect persistent scene structure and evolving object states with interaction histories and supporting observations. HOLIWORLD-Data organizes these records from approximately 100 self-collected scenes into grounded learning resources, including approximately 80K QA pairs used to train HOLIWORLD-VL-4B. Independent human annotations of heldout recordings form HOLIWORLD-Bench, supporting evaluation of both annotation quality and learned spatial and temporal understanding. Experiments on ScanNet, ScanNet++, Aria Digital Twin, and HOLIWORLD-Bench demonstrate strong performance in static perception and dynamic tracking, while training on HOLIWORLD-Data substantially improves HOLIWORLD-VL-4B's spatial and temporal reasoning on HOLI- WORLD-Bench and EgoDynamic4D. HOLIWORLD provides a practical foundation for expanding learning resources from the continuous flow of human experience and advancing machine understanding of the dynamic world.", 'score': 108, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '3e53c2f205101202', 'authors': ['Hao Li', 'Xiyuan Zheng', 'Yuanyuan Gao', 'Yalun Dai', 'Xinhao Ji', 'Xuan-Li Chen', 'Jing Zhao', 'Fangzhou Hong', 'Zhaoxi Chen', 'Ziwei Liu'], 'affiliations': ['HKUST', 'NTU', 'PKU', 'Ropedia'], 'pdf_title_img': 'assets/pdf/title_img/2610.26549.jpg', 'data': {'categories': ['#benchmark', '#video', '#training', '#multimodal', '#3d', '#dataset', '#data'], 'emoji': '🌍', 'ru': {'title': 'Учим машины понимать динамичный мир по записям человеческого опыта', 'desc': 'Авторы представляют HOLI-WORLD — экосистему, которая автоматически создаёт большие обучающие наборы данных из записей от первого лица (egocentric recordings) о динамических сценах и взаимодействиях. Система HOLIWORLD-Foundry объединяет статическое и динамическое восприятие, чтобы строить структурированные записи о мире: устойчивую геометрию сцены, состояния объектов и историю взаимодействий. На основе примерно 100 собственных сцен формируется HOLIWORLD-Data, включающий около 80K пар вопрос-ответ для обучения мультимодальной LLM HOLIWORLD-VL-4B. Эксперименты показывают, что обучение на этих данных заметно улучшает пространственное и временное рассуждение модели на бенчмарках HOLIWORLD-Bench и EgoDynamic4D.'}, 'en': {'title': 'Automating Learning from Human Experience for Better Machine Understanding', 'desc': 'HOLI-WORLD is a system designed to automatically create large-scale learning resources from recordings of human experiences. It focuses on improving how machines understand dynamic scenes and interactions by connecting various aspects like scene structure and object semantics. The system reduces the need for expensive manual labeling by using automated processes to organize and construct data from numerous recordings. Through experiments, HOLI-WORLD has shown significant improvements in spatial and temporal reasoning, making it a valuable tool for enhancing machine learning capabilities in understanding the world.'}, 'zh': {'title': 'HOLI-WORLD：自动构建动态世界学习资源的生态系统', 'desc': 'HOLI-WORLD是一个集成生态系统，旨在自动构建大规模学习资源，以提高机器对动态场景和交互的理解。通过人类自我中心的录音，HOLI-WORLD为学习世界的组织和变化提供了丰富的基础。该系统通过连接场景结构、物体语义和交互历史，减少对昂贵人工标注的依赖，实现了大规模学习资源的构建。HOLI-WORLD结合静态和动态感知，自动生成世界记录，支持机器在动态环境中的理解和推理。'}}}, {'id': 'https://huggingface.co/papers/2610.25736', 'title': 'Learning from Fleet Experience: A Collective Learning Paradigm for Robots', 'url': 'https://huggingface.co/papers/2610.25736', 'abstract': "Abstract Robots share execution experience across fleets to improve policies via failure-guided retrieval and asynchronous training, achieving high success without extra expert corrections.  Generated by thinkingmachines/Inkling-Small Experience generated during deployment offers an opportunity for robots to improve policy reliability through learning from their own executions. However, learning through human corrections requires teleoperators to monitor execution and intervene when policies fail, a demand that is difficult to meet as robot fleets grow. We introduce collective experience learning (CEL), a learning paradigm in which deployed robots share their execution experience to improve a common policy. We realize CEL through failure-guided experience retrieval fine-tuning (FERT), which uses failure contexts from robot executions to retrieve relevant trajectory segments from the fleet's shared successful experience and uses their actions as supervision for policy updates, without collecting additional expert demonstrations or corrective actions. A fault-tolerant asynchronous training system (FATS) coordinates experience collection, policy optimization and policy distribution despite local interruptions within the robot fleet. Across five real-world manipulation tasks, the resulting policies achieve success rates of 93.3-99.2%, evaluated over 120 trials per task on robots excluded from training data collection. With collection time per robot held fixed, larger fleets provide more experience and FERT generally achieves higher success rates across the evaluated sizes. On multi-stage phone packaging, learning with 96 robots increases success from 79.2% to 98.3%. These results support collective experience as a practical basis for scalable robot learning and a path towards improving policy reliability during deployment without collecting additional expert corrective actions.", 'score': 107, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '148d44d83e26befa', 'pdf_title_img': 'assets/pdf/title_img/2610.25736.jpg', 'data': {'categories': ['#training', '#optimization', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Роботы учатся друг у друга на своих ошибках', 'desc': 'В статье предлагается коллективное обучение на опыте (collective experience learning, CEL), при котором развернутые роботы делятся данными о своих выполнениях для улучшения общей политики (policy). Метод FERT использует контекст сбоев, чтобы через retrieval находить релевантные успешные фрагменты траекторий из общего опыта флота и применять их действия как supervision для fine-tuning, без сбора дополнительных экспертных демонстраций. Для координации сбора данных, оптимизации политики и её распространения применяется отказоустойчивая асинхронная система обучения FATS. В пяти реальных задачах манипуляции успешность политик достигает 93.3–99.2%, а на задаче упаковки телефонов с 96 роботами успешность выросла с 79.2% до 98.3%.'}, 'en': {'title': 'Empowering Robots Through Shared Learning Experiences', 'desc': "This paper presents a new approach called Collective Experience Learning (CEL) for robots to enhance their performance by sharing execution experiences across a fleet. Instead of relying on human corrections, robots utilize a method called Failure-Guided Experience Retrieval Fine-Tuning (FERT) to learn from their own failures and successes. This allows them to improve their policies autonomously by retrieving relevant successful actions from their peers' experiences. The proposed system, Fault-Tolerant Asynchronous Training (FATS), ensures that robots can continuously learn and optimize their policies even when some robots face interruptions during operation."}, 'zh': {'title': '集体经验学习：提升机器人策略的可靠性', 'desc': '本文提出了一种集体经验学习（CEL）的方法，使机器人能够通过共享执行经验来改进共同策略。通过失败引导的经验检索微调（FERT），机器人可以利用失败上下文从成功经验中检索相关轨迹段，以此作为策略更新的监督，而无需额外的人类干预。研究表明，在五个实际操作任务中，采用这种方法的策略成功率高达93.3%至99.2%。这表明集体经验学习为可扩展的机器人学习提供了实用基础，并在部署过程中提高了策略的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2610.26860', 'title': 'OpenVLHarness: Real World Visual Agentic Tool-Use with Multimodal Memory', 'url': 'https://huggingface.co/papers/2610.26860', 'abstract': 'Abstract OpenVLHarness improves multimodal reasoning by integrating persistent memory, heterogeneous tool interfaces, and iterative evidence composition across 22 benchmarks.  Generated by thinkingmachines/Inkling-Small Multimodal large language models (MLLMs) have made rapid progress on visual reasoning, yet many tasks require evidence that is difficult to obtain through internal reasoning alone: our controlled study on 22 benchmarks shows that simply increasing the inference budget of the base model yields only modest gains. Such tasks demand grounded perception, external knowledge, and numerical measurements obtained through heterogeneous tools, whose outputs must be made interpretable to the model and retained across reasoning steps. We introduce OpenVLHarness, a multimodal reasoning harness organized around a capability layer and persistent multimodal memory. The capability layer combines task-level tool interfaces with evidence rendering, providing consistent access to heterogeneous backends and converting their outputs into model-readable observations. Persistent multimodal memory retains the corresponding images, structured data, and web references as addressable artifacts throughout each query. A coding interface executes generated programs over stored data, enabling computations that combine results from multiple tools. Together, these mechanisms support an iterative process of acquiring, inspecting, and composing multimodal evidence. Evaluated on 22 benchmarks with eight open and proprietary backbones, OpenVLHarness improves average scores by 9.7-12.6 points over matched no-tool baselines, including +11.2 with Qwen3-VL-8B, +9.7 with Kimi K3, and +9.9 with GPT-6 Astra. With GPT-6 Luna at medium reasoning effort, OpenVLHarness outperforms the base model, Codex, and Visual Sketchpad at maximum effort by 7.7-8.5 points while incurring at most 37% of their model-token cost.', 'score': 96, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '65829cbf1f5854a6', 'authors': ['Yu Zhou', 'Cheng-Fu Yang', 'Rui Sun', 'Di Wu', 'Sibo Peng', 'Mingyang Zhang', 'Zhen Yang', 'Ruiyi Zhang', 'Nanyun Peng', 'Zhe Gan', 'Kai-Wei Chang'], 'affiliations': ['Apple', 'University of California, Los Angeles'], 'pdf_title_img': 'assets/pdf/title_img/2610.26860.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agents', '#cv', '#open_source', '#interpretability', '#reasoning'], 'emoji': '🧰', 'ru': {'title': 'Инструменты и память делают мультимодальные модели сильнее: рассуждать мало, нужны доказательства', 'desc': 'Авторы представляют OpenVLHarness — фреймворк для мультимодального рассуждения, который позволяет мультимодальным LLM получать внешние данные через инструменты. Ключевые компоненты: слой возможностей с унифицированными интерфейсами к инструментам и постоянная мультимодальная память, хранящая изображения, структурированные данные и веб-ссылки. Кодовый интерфейс выполняет сгенерированные программы над сохранёнными данными, позволяя комбинировать результаты разных инструментов. На 22 бенчмарках и восьми бэкбонах фреймворк улучшает средние оценки на 9.7–12.6 пункта и при этом требует меньше затрат на токены, чем конкурирующие подходы.'}, 'en': {'title': 'Empowering Multimodal Reasoning with OpenVLHarness', 'desc': 'OpenVLHarness enhances multimodal reasoning by utilizing a persistent memory system and diverse tool interfaces to improve evidence gathering across various tasks. It addresses the limitations of traditional large language models (MLLMs) in visual reasoning by integrating external knowledge and numerical data from different sources. The framework allows for iterative evidence composition, making it easier for models to access and interpret complex information. Evaluations show significant performance improvements on 22 benchmarks, demonstrating the effectiveness of this approach in multimodal tasks.'}, 'zh': {'title': '提升多模态推理的利器', 'desc': 'OpenVLHarness 是一种多模态推理工具，通过整合持久内存、异构工具接口和迭代证据组合来提升推理能力。研究表明，单纯增加基础模型的推理预算只能带来有限的提升，而许多任务需要外部知识和数值测量。OpenVLHarness 通过能力层和持久多模态内存组织，提供一致的工具接口和可解释的输出。经过在22个基准测试上的评估，OpenVLHarness 显著提高了模型的平均得分，展示了其在多模态推理中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.25690', 'title': 'ScaleNav: Scalable Internet Video Pretraining for Language-Conditioned Local Navigation', 'url': 'https://huggingface.co/papers/2610.25690', 'abstract': "Abstract ScaleNav learns goal-directed visual dynamics from internet egocentric videos to generate robot actions for language-conditioned local navigation, achieving high success rates in simulation and real-world deployment.  Generated by thinkingmachines/Inkling-Small We study language-conditioned local navigation, where a robot must navigate to a text-specified target visible in its initial observation and stop at the described location. End-to-end navigation policies require diverse training data to generalize across scenes, yet real-robot data is costly to collect and simulated data leaves a sim-to-real gap. Internet egocentric videos offer a scalable source of real-world navigation experience. Our key insight is to learn goal-directed visual dynamics from Internet egocentric videos, and use these dynamics to support robot action generation. To this end, we propose ScaleNav, a unified world-action framework with three-stage training. We first perform instruction-conditioned video pretraining on these videos to learn how observations evolve as the camera approaches instructed targets across diverse real-world scenes. Action alignment then uses action-labeled simulated data to train the model to predict executable action chunks. Joint fine-tuning subsequently optimizes all trainable components together for navigation. ScaleNav achieves success rates of 86.5% on a single-view adaptation of Short-Horizon OVON and 94.9% on our HabitatGS-LN benchmark, outperforming the evaluated baselines on both benchmarks. We further deploy and evaluate ScaleNav on a real quadruped robot, with results supporting the model's ability to generalize to real-world navigation. Code and videos are available at https://zju3dv.github.io/ScaleNav/", 'score': 84, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '3bfdb85d9ce69f46', 'authors': ['Yihui Yang', 'Yuanhong Yu', 'Jiawei Wang', 'Zhongrui Yu', 'Jia Shi', 'Kun Zhan', 'Ruizhen Hu', 'Xiaowei Zhou', 'Yu Liu', 'Sida Peng'], 'affiliations': ['Li Auto Inc.', 'Shenzhen University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.25690.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#video', '#transfer_learning', '#synthetic', '#multimodal', '#games', '#training'], 'emoji': '🧭', 'ru': {'title': 'Учим робота ориентироваться по видео из интернета', 'desc': 'В статье представлен ScaleNav — унифицированная world-action модель для языково-обусловленной локальной навигации робота, где цель задаётся текстом. Ключевая идея: обучать goal-directed visual dynamics на интернет-видео от первого лица, чтобы модель понимала, как наблюдения меняются при приближении к целевому объекту. Обучение проходит в три этапа: instruction-conditioned video pretraining, action alignment на симуляционных данных с разметкой действий и совместный fine-tuning всех обучаемых компонентов. Модель достигает успешности 86.5% и 94.9% на бенчмарках и демонстрирует работоспособность на реальном четырёхногом роботе.'}, 'en': {'title': "Navigating with Words: ScaleNav's Smart Robot Guidance", 'desc': 'ScaleNav is a machine learning framework designed for robots to navigate towards targets specified by language instructions. It learns from internet videos that show how people navigate in various environments, allowing it to understand visual dynamics and improve its navigation skills. The training process involves three stages: pretraining on videos, aligning actions with simulated data, and fine-tuning the entire model for better performance. This approach enables ScaleNav to achieve high success rates in both simulated environments and real-world applications, demonstrating its effectiveness in language-conditioned navigation tasks.'}, 'zh': {'title': 'ScaleNav：智能导航的新突破', 'desc': 'ScaleNav 是一种通过互联网自我中心视频学习目标导向视觉动态的方法，旨在为语言条件下的本地导航生成机器人动作。该方法通过三阶段训练框架，首先在视频上进行指令条件预训练，以学习观察如何随着相机接近目标而变化。接着，使用带有动作标签的模拟数据进行动作对齐训练，以预测可执行的动作片段。最终的联合微调优化所有可训练组件，使得 ScaleNav 在模拟和真实世界中的导航成功率显著提高。'}}}, {'id': 'https://huggingface.co/papers/2610.26824', 'title': 'SpecMRL: Redesign Matryoshka Representation Learning within Parametric Spectrum', 'url': 'https://huggingface.co/papers/2610.26824', 'abstract': 'Abstract SpecMRL improves compressed embeddings by reorganizing features via a learned spectral basis that prioritizes informative directions, outperforming standard MRL at reduced dimensions.  Generated by thinkingmachines/Inkling-Small Matryoshka Representation Learning (MRL) is designed to support flexible representation sizes by jointly optimizing nested prefixes. While effective, this design lacks an explicit constraint to ensure that the leading portion provides a suitable compact encoding. To address this, we propose SpecMRL, which reorganizes the feature space to enable more effective prefix readout. Specifically, we extend MRL with a parameter-derived spectral basis organized with feature importance. SpecMRL otherwise follows standard MRL, with prefix readout performed in the learned spectral space. Experiments on MTEB show that SpecMRL outperforms MRL at all evaluated reduced dimensions, with larger gains under more aggressive compression. These results suggest that the learned spectral basis better prioritizes informative directions, enabling more effective representation compression. Notably, SpecMRL extends the performance frontier of MRL, surpassing full-dimensional MRL with only half the embedding dimensions.', 'score': 80, 'issue_id': 3437, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '9d6da1ff7bf4084a', 'authors': ['Zhongxin Chen', 'Songhao Wu', 'Heng Cui', 'Cong Li', 'Xiao Zhou', 'Rui Yan'], 'affiliations': ['Lenovo Group', 'Renmin University of China', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26824.jpg', 'data': {'categories': ['#architecture'], 'emoji': '🧬', 'ru': {'title': 'Главное направление важнее: сжимаем эмбеддинги без потери смысла', 'desc': 'Статья предлагает SpecMRL — улучшение метода Matryoshka Representation Learning (MRL), который обучает вложения, пригодные для разных размерностей. В SpecMRL пространство признаков переорганизуется с помощью обучаемого спектрального базиса, где направления упорядочены по важности информации. Такой подход делает первые компоненты вектора более информативными для сжатого представления. На бенчмарке MTEB SpecMRL превосходит обычный MRL при всех уменьшенных размерностях, а при сильном сжатии разрыв особенно заметен. Метод даже достигает качества полноразмерного MRL, используя вдвое меньшую размерность эмбеддингов.'}, 'en': {'title': 'Revolutionizing Compression with Spectral Insights', 'desc': 'SpecMRL is a new method that enhances compressed embeddings by reorganizing features based on their importance using a learned spectral basis. This approach improves upon the existing Matryoshka Representation Learning (MRL) by allowing for better prefix readout, which is crucial for effective encoding. By focusing on informative directions, SpecMRL achieves superior performance in representation compression, especially when using fewer dimensions. Experiments demonstrate that SpecMRL consistently outperforms standard MRL, making it a significant advancement in the field of representation learning.'}, 'zh': {'title': 'SpecMRL：优先考虑信息的压缩嵌入方法', 'desc': 'SpecMRL是一种改进的压缩嵌入方法，通过学习的谱基重组特征，优先考虑信息丰富的方向，从而在降低维度时超越标准的MRL。该方法通过优化嵌套前缀，支持灵活的表示大小，但之前的设计缺乏明确的约束，导致前导部分的编码效果不佳。SpecMRL通过在特征重要性基础上组织参数导出的谱基，改善了特征空间的重组，使得前缀读取更加有效。实验结果表明，SpecMRL在所有评估的降维情况下均优于MRL，尤其在更强压缩下表现出更大的提升。'}}}, {'id': 'https://huggingface.co/papers/2610.22791', 'title': 'Self-Evolving Coding Agents via Harness-Policy Optimization', 'url': 'https://huggingface.co/papers/2610.22791', 'abstract': "Abstract Self-HPO is a recursive framework that alternates harness and policy optimization for coding agents, improving performance by targeting evolving failure modes through reinforcement learning.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents have shown promising potential in coding tasks, and their performance is jointly determined by the policy model and the harness that mediates their interaction with the environment. Indeed, harness and policy are mutually reinforcing and evolving only one component is suboptimal---a harness tuned for one checkpoint may not target the failure modes of an updated policy, while policy learning remains limited to the trajectories elicited by a fixed harness. In light of this, we propose Self-HPO, a recursive self-improving framework for coding agents that alternates harness and policy optimization, using the evolving policy as its own harness proposer. Specifically, in each round, the current policy first analyzes its own failures and proposes new harness candidates (H-step). The policy is then updated through reinforcement learning (RL) under the selected harness (P-step), and hard tasks identified during training form the next harness search set, keeping harness optimization targeted to the policy's evolving failure modes. Across three coding benchmarks, Self-HPO consistently outperforms harness-only and policy-only baselines, improving Qwen3.5-35B-A3B's average resolve rate from 57.8% to 64.8%, with gains generalizing to out-of-distribution settings. Further analysis shows that both optimized components retain gains even when paired with their base counterparts, while their joint gain exceeds the sum of their individual gains. Self-HPO also improves reliability (Pass@1) and expands the capability frontier (Pass@k) over the base agent. Additionally, we show that with a stronger external model (e.g., Opus 4.8) as the harness proposer, the same framework yields a further performance boost.", 'score': 41, 'issue_id': 3436, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '4f325b62bfb5924a', 'authors': ['Zhepei Wei', 'Wenlin Yao', 'Baolin Peng', 'Danqing Wang', 'Qianhui Wu', 'Hao Cheng', 'Yu Meng', 'Jianfeng Gao'], 'affiliations': ['Carnegie Mellon University', 'Microsoft Research', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2610.22791.jpg', 'data': {'categories': ['#benchmark', '#agents', '#rl', '#agi', '#training', '#optimization', '#plp'], 'emoji': '🤖', 'ru': {'title': 'Агент, который учится чинить собственные ошибки вместе со своей обвязкой', 'desc': 'В статье предлагается Self-HPO — рекурсивная схема самоулучшения для агентов-программистов на базе Large language model (LLM), которая чередует оптимизацию harness (обвязки, управляющей взаимодействием с окружением) и policy (политики модели). На шаге H модель анализирует собственные ошибки и предлагает новые варианты harness, а на шаге P обновляется через reinforcement learning (RL) при выбранной обвязке, причём трудные задачи формируют следующий набор для поиска. На трёх бенчмарках Self-HPO стабильно превосходит базовые подходы с оптимизацией только harness или только policy, повышая средний resolve rate модели Qwen3.5-35B-A3B с 57.8% до 64.8%. Авторы также показывают улучшение надёжности (Pass@1) и расширение границ возможностей (Pass@k), а использование более сильного внешнего AI-модели в роли предлагающего harness дает дополнительный прирост.'}, 'en': {'title': 'Self-HPO: Evolving Coding Agents through Joint Optimization', 'desc': 'Self-HPO is a novel framework designed to enhance the performance of coding agents by optimizing both the harness and policy components through a recursive process. It utilizes reinforcement learning to allow the policy to identify its own weaknesses and propose improvements for the harness, ensuring that both components evolve together. This approach addresses the limitations of traditional methods where either the harness or policy is optimized in isolation, leading to suboptimal performance. The results demonstrate significant improvements in coding task resolution rates and reliability, showcasing the effectiveness of this integrated optimization strategy.'}, 'zh': {'title': '自我优化：编码代理的新框架', 'desc': 'Self-HPO是一种递归框架，通过交替优化代理的环境适配器和策略来提升编码性能。该方法利用强化学习，针对不断变化的失败模式进行优化，确保环境适配器和策略模型相互促进。每一轮中，当前策略会分析自身的失败并提出新的环境适配器候选，随后在选定的适配器下更新策略。实验结果表明，Self-HPO在多个编码基准测试中表现优于仅优化适配器或策略的基线，显著提高了解决率和可靠性。'}}}, {'id': 'https://huggingface.co/papers/2610.24960', 'title': 'CoworkEnv: Synthesizing Training Environments for Long-Horizon Cowork Agents', 'url': 'https://huggingface.co/papers/2610.24960', 'abstract': 'Abstract CoworkEnv synthesizes executable training environments for AI coworkers using workflow-guided task construction and programmatic validation, enabling supervised fine-tuning and reinforcement learning of compact PocketWorker models that improve multi-turn coordination and tool use.  Generated by thinkingmachines/Inkling-Small AI coworkers must coordinate tools, communicate across turns, and act on changing workspace state while respecting workflow constraints. Constructing training experience for these capabilities requires coherent requests, service records, tool interfaces, and grading checks. We present CoworkEnv, a capability-guided framework for synthesizing executable training environments for AI coworkers. Workflow requirements guide task construction, and programmatic validation with feedback repair checks generated specifications and grading behavior. Teacher executions yield curated demonstrations for supervised fine-tuning (SFT), while student interactions provide rollouts and rewards for reinforcement learning (RL). Using these resources, we train compact PocketWorker models. For Qwen3-VL-8B-Instruct, SFT raises the mean score from 46.6 to 64.1 on Claw-Eval, including a 31.9-point gain on Multi-turn tasks. An SFT-only extension to ClawMark demonstrates applicability across coworker benchmarks. We further compare RL training dynamics across configurations that vary reward processing and credit assignment. Improving training rewards provide preliminary evidence that the constructed environments support policy optimization.', 'score': 38, 'issue_id': 3436, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': '8e56ff5becfddf08', 'authors': ['Zhongwei Xie', 'Yiming Du', 'Jiaxin Bai', 'Baixuan Xu', 'Chunyang Li', 'Xiyu Ren', 'Wei Fan', 'Tianshi Zheng', 'Weizhi Du', 'Jingqiao Yu', 'Xingsu Li', 'Zhaowei Wang', 'Yangqiu Song'], 'affiliations': ['Hong Kong Baptist University', 'Independent Researcher', 'The Chinese University of Hong Kong', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.24960.jpg', 'data': {'categories': ['#data', '#synthetic', '#dataset', '#agents', '#small_models', '#rl', '#games', '#training', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Обучаем AI-коллег на автоматически созданных рабочих средах', 'desc': 'В статье представлен CoworkEnv — фреймворк, который автоматически синтезирует исполняемые обучающие среды для AI-помощников, опирающиеся на рабочие процессы и программную валидацию. Сгенерированные среды используются для supervised fine-tuning (SFT) на демонстрациях учителя и для reinforcement learning (RL) по наградам, получаемым в ходе взаимодействия студента со средой. С помощью этого подхода обучаются компактные модели PocketWorker, которые лучше координируют многошаговые диалоги и используют инструменты; для Qwen3-VL-8B-Instruct средний балл на Claw-Eval вырос с 46.6 до 64.1. Авторы также сравнивают динамику RL при разных схемах обработки наград и распределения credit assignment и показывают, что среды пригодны для policy optimization.'}, 'en': {'title': 'Empowering AI Coworkers with CoworkEnv: Enhanced Training for Coordination and Tool Use', 'desc': 'The paper introduces CoworkEnv, a framework designed to create training environments for AI coworkers that can effectively coordinate tasks and use tools. It utilizes workflow-guided task construction and programmatic validation to ensure that the training scenarios are coherent and aligned with real-world workflows. The framework supports both supervised fine-tuning (SFT) and reinforcement learning (RL) for training compact PocketWorker models, enhancing their performance in multi-turn interactions. Results show significant improvements in task performance metrics, indicating that the synthesized environments effectively facilitate policy optimization for AI coworkers.'}, 'zh': {'title': 'CoworkEnv：提升 AI 合作伙伴的训练环境', 'desc': 'CoworkEnv 是一个用于合成可执行训练环境的框架，专为 AI 合作伙伴设计。它通过工作流程引导任务构建和程序验证，支持对紧凑型 PocketWorker 模型进行监督微调和强化学习。该框架确保 AI 合作伙伴能够在多轮协调和工具使用中有效沟通，并适应不断变化的工作空间状态。实验结果表明，使用 CoworkEnv 训练的模型在多轮任务上显著提高了性能。'}}}, {'id': 'https://huggingface.co/papers/2610.25404', 'title': 'MT Forcing: Towards Stable and Consistent Multi-Turn Image Editing with Autoregressive Diffusion', 'url': 'https://huggingface.co/papers/2610.25404', 'abstract': 'Abstract MT Forcing improves multi-turn image editing by combining single-turn distribution matching distillation and teacher-forcing guidance to stabilize visual quality and preserve cross-turn consistency.  Generated by thinkingmachines/Inkling-Small Multi-turn image editing aims to modify an image according to a sequence of instructions, enabling more effective interactive visual content creation for users. However, existing methods often exhibit noticeable drift after only a few editing turns, manifesting in two aspects: 1) unstable visual quality, with accumulating artifacts and degraded details; and 2) inconsistent image content, with unintended changes to preserved regions and prior edits. To address these challenges, we propose MT Forcing, a novel training paradigm for multi-turn image editing with unified multimodal models (UMMs) based on autoregressive diffusion. Specifically, we propose Single-Turn Distribution Matching Distillation (Single-Turn DMD), which supervises student self-rollouts with a teacher that applies cumulative edits to the source image in a single turn, providing visual-quality guidance without recursive error accumulation. Additionally, we introduce Teacher-Forcing Guidance, which supervises history-dependent transitions on reference trajectories during warmup and as a regularizer during distillation, encouraging cross-turn content consistency beyond what per-turn distribution matching alone can ensure. Extensive experiments demonstrate that our approach significantly improves the multi-turn image editing capabilities of UMMs, yielding more stable visual quality and stronger cross-turn consistency.', 'score': 36, 'issue_id': 3436, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': '8db54620e6a774a5', 'authors': ['Houyuan Chen', 'Fanzhou Wang', 'Xiangyu Fan', 'Zesong Qiu', 'Yukun Wei', 'Songlin Yang', 'Zhitao Yang', 'Lvmin Zhang', 'Pei Yang', 'Hao Zhao', 'Lei Yang', 'Anyi Rao'], 'affiliations': ['AIR, Tsinghua University', 'HKUST MMLab', 'SenseTime Research', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.25404.jpg', 'data': {'categories': ['#diffusion', '#multimodal', '#cv', '#training', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Стабильное многоходовое редактирование изображений без дрейфа', 'desc': 'В статье представлен метод MT Forcing для многоходового редактирования изображений с помощью унифицированных мультимодальных моделей (UMM) на основе авторегрессивной диффузии. Авторы предлагают Single-Turn DMD, где ученическая модель обучается на собственных самогенерациях с учителем, который применяет все накопленные правки за один ход, что исключает рекурсивное накопление ошибок. Дополнительно вводится Teacher-Forcing Guidance, который на этапе прогрева и как регуляризатор во время дистилляции направляет зависимые от истории переходы по эталонным траекториям для сохранения согласованности содержимого между ходами. Эксперименты показывают, что подход повышает стабильность визуального качества и межходовую консистентность редактирования.'}, 'en': {'title': 'Enhancing Multi-Turn Image Editing with MT Forcing', 'desc': 'The paper introduces MT Forcing, a new method for improving multi-turn image editing by addressing issues of visual quality and content consistency. It combines Single-Turn Distribution Matching Distillation and Teacher-Forcing Guidance to stabilize the editing process and reduce errors that accumulate over multiple edits. This approach allows for better preservation of image details and consistency across different editing turns. The results show that MT Forcing enhances the performance of unified multimodal models in generating high-quality images during interactive editing sessions.'}, 'zh': {'title': '多轮图像编辑的新突破', 'desc': 'MT Forcing是一种改进多轮图像编辑的方法，它结合了单轮分布匹配蒸馏和教师引导，以稳定视觉质量并保持跨轮一致性。多轮图像编辑旨在根据一系列指令修改图像，使用户能够更有效地创建互动视觉内容。现有方法在编辑过程中常常出现视觉质量不稳定和内容不一致的问题。我们提出的MT Forcing通过统一的多模态模型和自回归扩散，显著提升了多轮图像编辑的能力，确保了更稳定的视觉质量和更强的跨轮一致性。'}}}, {'id': 'https://huggingface.co/papers/2610.19686', 'title': 'Interlock: From Local Correctness to Task Completion in Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2610.19686', 'abstract': 'Abstract Interlock synthesizes long-horizon tasks as typed completion graphs to enforce cross-component constraints, then uses agent-based verification and self-training to improve agent performance on complex benchmarks.  Generated by thinkingmachines/Inkling-Small Large language model agents increasingly undertake long-horizon tasks in complex environments characterized by fragmented evidence, partially completed states, and dependencies across resources and artifacts. Existing agents may satisfy individual requirements while failing to maintain these relationships, producing locally correct but incomplete outcomes. These failures arise because task completion depends on relationships among environmental evidence, consequential decisions, and required effects. To address this completion gap, we propose Interlock, a framework for task synthesis that represents each task as a typed completion graph. Grounding edges connect public evidence to decisions, coupling hyperedges impose joint constraints across components, and realization edges connect decisions to all required downstream effects. Interlock compiles this graph into a resettable workspace, a public request, and an evaluation rubric. A source-coverage review checks whether the original requirements survive generation, while a public-input review checks whether the rubric is supported by the materials available to the solver. An agent-as-judge inspects execution artifacts and runs verification scripts, retaining trajectories judged to satisfy all mandatory requirements. To evaluate training utility, we fine-tune two Qwen3.6 backbones on their own accepted trajectories. Across the two backbones, training improves AutomationBench task pass rates by 4.00-4.50 percentage points, JobBench weighted scores by 3.20-6.64 points, and Harvey LAB criterion pass rates by 3.89-4.16 percentage points. These results demonstrate the training utility of the synthesized experience across external task environments.', 'score': 33, 'issue_id': 3436, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': '148c0c8bdd9cc046', 'authors': ['Linji Hao', 'Yanji He', 'Zihan Wang', 'Hansi Yang', 'Jiayuan Zhang', 'Hongyan Hao', 'Qi Gu', 'Yan Feng', 'Han Wu'], 'affiliations': ['Meituan, China', 'Peking University', 'The Hong Kong University of Science and Technology (Guangzhou)', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.19686.jpg', 'data': {'categories': ['#benchmark', '#synthetic', '#training', '#agents', '#agi', '#data', '#optimization'], 'emoji': '🧩', 'ru': {'title': 'Агенты должны доводить задачи до конца, а не только выполнять их части', 'desc': 'Статья представляет Interlock — фреймворк для синтеза долгосрочных задач для LLM-агентов, где каждая задача описывается как типизированный граф завершения с рёбрами обоснования, гиперрёбрами совместных ограничений и рёбрами реализации. Граф компилируется в воспроизводимое рабочее пространство, публичный запрос и рубрику оценки, а проверка покрытия и публичных входных данных гарантирует корректность генерации. Агент-судья (agent-as-judge) отбирает траектории, удовлетворяющие всем обязательным требованиям, и они используются для дообучения (fine-tuning) двух бэкбон-моделей Qwen3.6 на собственном опыте. Дообучение повышает показатели успешности на бенчмарках AutomationBench, JobBench и Harvey LAB на несколько процентных пунктов.'}, 'en': {'title': 'Interlock: Enhancing Agent Performance through Task Synthesis and Verification', 'desc': "The paper introduces Interlock, a framework designed to enhance the performance of agents in completing long-horizon tasks by using typed completion graphs. These graphs help maintain relationships between various components of a task, ensuring that agents do not just meet individual requirements but also consider dependencies among them. By employing agent-based verification and self-training, the framework improves the agents' ability to navigate complex environments with fragmented evidence and incomplete states. The results show significant improvements in task completion rates across different benchmarks, highlighting the effectiveness of the Interlock approach."}, 'zh': {'title': 'Interlock：提升长时间任务完成的智能框架', 'desc': '本文提出了一种名为Interlock的框架，用于合成长时间任务并表示为类型化的完成图，以确保跨组件的约束关系。该框架通过连接公共证据与决策的边缘，以及施加联合约束的超边，来处理复杂环境中的任务完成问题。Interlock还编译出一个可重置的工作空间和评估标准，以确保生成的结果满足原始要求。实验结果表明，通过对代理进行自我训练，能够显著提高在复杂基准测试中的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.26844', 'title': 'AnyGoal: On World Model Generalization Beyond Expert Rollouts', 'url': 'https://huggingface.co/papers/2610.26844', 'abstract': 'Abstract Researchers introduce AnyGoal to evaluate whether world models can generalize dynamics to unseen combinations of familiar states and actions for planning.  Generated by thinkingmachines/Inkling-Small The goal of a world model is to capture the dynamics of an environment. This has the great appeal that it allows agents to plan and simulate a course of actions with the help of a world model. For these uses to be reliable, however, the learned dynamics must behave well beyond the specific state-action combinations observed in expert rollouts. Despite this, the relationship between data coverage, dynamics generalization, and downstream planning performance remains underexplored. We study this relationship through the lens of compositional generalization: can a world model recombine familiar state and action factors into valid dynamics? To answer this, we introduce AnyGoal, a benchmark of goal-shifted task variants built from widely used world-model environments, together with an open-source library. Each task is designed to be within reach of a world model that has learned the underlying dynamics: individual state factors and actions remain within their training support, but their combinations are underrepresented in expert trajectories. Across multiple environments and world model families, we find that current models consistently exhibit failures under these recombinations. By examining dynamics and representation failures across model families, interaction regimes, and evaluation metrics, we study where current world models generalize and where challenges remain for goal-shifted prediction and planning. Together, this framework, benchmark, and analysis provide a basis for evaluating progress toward world models that generalize to new planning tasks.', 'score': 31, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '63ce06a5e11050ed', 'authors': ['Heejeong Nam', 'Divyat Mahajan', 'Quentin Le Lidec', 'Randall Balestriero', 'David Klindt'], 'affiliations': ['Brown University', 'Cold Spring Harbor Laboratory', 'Mila, Universite de Montreal', 'New York University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26844.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#rl', '#agents'], 'emoji': '🧭', 'ru': {'title': 'Мир предсказуем лишь там, где модель видела его раньше: проверка обобщения world models', 'desc': 'Авторы представляют AnyGoal — бенчмарк и открытую библиотеку для проверки того, умеют ли world models композиционно обобщать динамику среды на новые комбинации знакомых состояний и действий. Тестовые задачи построены так, что отдельные факторы состояния и действия находятся в пределах обучающей выборки, но их сочетания редко встречаются в экспертных траекториях. Эксперименты на нескольких средах и семействах моделей показывают, что текущие модели стабильно ошибаются при таких рекомбинациях. Анализ ошибок динамики и представлений помогает понять, где модели хорошо обобщают, а где для планирования с новыми целями остаются serious проблемы.'}, 'en': {'title': 'AnyGoal: Advancing World Models for Dynamic Generalization', 'desc': 'The paper introduces AnyGoal, a benchmark designed to assess how well world models can generalize their learned dynamics to new combinations of familiar states and actions. World models aim to simulate environments, enabling agents to plan actions effectively. However, the authors highlight that current models often struggle with recombining known state-action pairs into valid dynamics, particularly in unseen scenarios. By analyzing the relationship between data coverage and planning performance, the study provides insights into the limitations of existing models and sets a foundation for future advancements in generalization for planning tasks.'}, 'zh': {'title': 'AnyGoal：评估世界模型的组合泛化能力', 'desc': '本文介绍了AnyGoal，这是一个用于评估世界模型在规划中是否能够将熟悉的状态和动作组合成新的动态的基准。世界模型的目标是捕捉环境的动态，以便代理能够规划和模拟行动。然而，学习到的动态必须在专家轨迹中未观察到的状态-动作组合上表现良好。通过研究组合泛化的视角，本文探讨了当前模型在这些组合下的表现及其局限性，为未来的研究提供了基础。'}}}, {'id': 'https://huggingface.co/papers/2610.26834', 'title': 'Kronecker Delta Rule for Long Context Linear Attention', 'url': 'https://huggingface.co/papers/2610.26834', 'abstract': 'Abstract KronLSTM introduces a Kronecker Delta Rule for stable associative memory updates in linear attention, improving long-context modeling without extra normalization.  Generated by thinkingmachines/Inkling-Small We propose KronLSTM, a linear attention architecture based on the Kronecker Delta Rule, a novel update rule for associative matrix memories. KronLSTM extends the xLSTM family with a memory-revision mechanism that corrects targeted associations while modifying the memory only along a single direction in matrix space. This minimally invasive memory revision reduces interference with previously stored information compared with delta-rule updates, making it particularly well suited for long-context language modeling. The resulting memory dynamics can be mathematically described as a Markov chain that converges to a steady-state distribution, while the expected norm of the memory matrix remains uniformly bounded throughout the entire input sequence. Hence, KronLSTM ensures stable memory dynamics without requiring additional normalization and stabilization mechanisms for the memory state. Experiments show that KronLSTM is competitive with, and often outperforms, existing linear attention architectures, including models of the (Gated) DeltaNet family, with particularly strong performance on long context benchmarks. These results establish the Kronecker Delta Rule as an effective and analytically tractable foundation for stable associative memory in recurrent linear attention architectures. Our code (https://github.com/NX-AI/KronLSTM) and models (https://huggingface.co/collections/NX-AI/kronlstm) are open-source.', 'score': 28, 'issue_id': 3437, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '418a7a0057c1bb43', 'authors': ['Anamaria-Roberta Hartl', 'Levente Zólyomi', 'Michael List', 'Günter Klambauer', 'Sebastian Böck', 'Sepp Hochreiter'], 'affiliations': ['Institute for Machine Learning, Johannes Kepler University, Linz', 'NXAI GmbH, Linz'], 'pdf_title_img': 'assets/pdf/title_img/2610.26834.jpg', 'data': {'categories': ['#architecture', '#open_source', '#training', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Стабильная память без лишней нормализации для длинных контекстов', 'desc': 'В статье представлен KronLSTM — архитектура линейного внимания (linear attention), основанная на новом правиле обновления ассоциативной матричной памяти, Kronecker Delta Rule. Правило корректирует целевые ассоциации, изменяя память только вдоль одного направления в пространстве матриц, что снижает интерференцию с ранее сохранённой информацией по сравнению с delta-rule. Динамика памяти описывается как марковская цепь, сходящаяся к стационарному распределению, а ожидаемая норма матрицы памяти равномерно ограничена, поэтому дополнительная нормализация не нужна. Эксперименты показывают, что KronLSTM конкурентоспособна с моделями семейств (Gated) DeltaNet и часто их превосходит, особенно на бенчмарках с длинным контекстом.'}, 'en': {'title': 'KronLSTM: Stable Memory for Long Contexts with Kronecker Delta Rule', 'desc': 'KronLSTM is a new linear attention model that uses the Kronecker Delta Rule to enhance memory updates in associative memory systems. This approach allows for stable long-context modeling by revising memory in a targeted way, minimizing interference with existing information. The memory dynamics of KronLSTM can be described as a Markov chain, ensuring that the memory remains stable without needing extra normalization techniques. Experiments demonstrate that KronLSTM performs competitively against other linear attention models, especially in tasks requiring long context understanding.'}, 'zh': {'title': 'KronLSTM：稳定的长上下文记忆架构', 'desc': 'KronLSTM是一种基于Kronecker Delta规则的线性注意力架构，旨在提高长上下文建模的稳定性。它通过一种新的关联矩阵记忆更新规则，扩展了xLSTM家族，并引入了记忆修正机制，以减少对先前存储信息的干扰。KronLSTM的记忆动态可以用马尔可夫链数学描述，确保在整个输入序列中记忆矩阵的期望范数保持均匀有界。实验结果表明，KronLSTM在长上下文基准测试中表现优异，且在许多情况下超越了现有的线性注意力架构。'}}}, {'id': 'https://huggingface.co/papers/2610.25950', 'title': 'AdaExploreBench: Benchmarking LLM Agents for Proactive Exploration and Test-time Adaptation in Evolving Environments', 'url': 'https://huggingface.co/papers/2610.25950', 'abstract': 'Abstract AdaExploreBench evaluates whether LLM agents can actively discover hidden environmental rules and adapt to unannounced changes, revealing that current models struggle to seek relevant evidence and detect stale knowledge.  Generated by thinkingmachines/Inkling-Small Large Language Model (LLM) agents are increasingly deployed in unfamiliar and evolving environments, requiring them to proactively explore, understand, and adapt to environmental dynamics. However, existing benchmarks rarely test whether agents can proactively discover how an environment works and adapt as it evolves. To address this gap, we introduce AdaExploreBench, a benchmark for proactive exploration and test-time adaptation in evolving environments. By instantiating environmental dynamics as hidden rules, AdaExploreBench requires agents to actively acquire evidence and infer the rules. Under implicit rule drift, the latent rule changes without announcement, requiring agents to detect from degraded performance that prior knowledge is stale and re-explore. Experiments on eight leading LLMs show that proactive and adaptive exploration remain challenging: GPT-6 Sol achieves only 61.9% calibrated accuracy, while providing sufficient evidence or removing rule drift improves average performance significantly by close to 10%. These results reveal a critical bottleneck in current LLM agents: they can often reason effectively from informative evidence once it is available, but struggle to actively acquire the right evidence and recognize when previously acquired evidence is no longer valid.', 'score': 27, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '5d0191d938ae375b', 'authors': ['Rui Wang', 'Zishen Lai', 'Jiayu Liu', 'Cheng Qian', 'Jeonghwan Kim', 'Heng Wang', 'Xuejun Zhang', 'Jiateng Liu', 'Bingxuan Li', 'Shujin Wu', 'Qing Zong', 'Tianshi Zheng', 'Chunyang Li', 'Qihan Lin', 'Chen Li', 'Dadi Guo', 'Xiusi Chen', 'Yangqiu Song'], 'affiliations': ['CMU', 'CUHK', 'HKUST', 'HKUST(GZ)', 'HKUST-UGAIL', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2610.25950.jpg', 'data': {'categories': ['#benchmark', '#agents', '#agi', '#interpretability', '#reasoning'], 'emoji': '🔍', 'ru': {'title': 'Агенты умеют рассуждать, но не умеют сами искать нужные доказательства и замечать устаревшие знания', 'desc': 'В статье представлен AdaExploreBench — новый бенчмарк для оценки того, умеют ли LLM-агенты активно исследовать среду и адаптироваться к её изменениям. Скрытые правила среды не объявляются явно, а агент должен сам собирать доказательства и выводить эти правила. В сценарии неявного дрейфа правил агент должен по снижению качества понять, что его знания устарели, и провести повторное исследование. Эксперименты на восьми ведущих LLM показали, что даже лучшая модель достигает лишь 61,9% калиброванной точности, а предоставление достаточных доказательств или устранение дрейфа заметно повышает результат, что выявляет ключевое узкое место: модели плохо собирают нужную информацию и не замечают, когда старые данные перестали быть валидными.'}, 'en': {'title': 'Unlocking Adaptive Intelligence in Evolving Environments', 'desc': 'The paper introduces AdaExploreBench, a benchmark designed to evaluate the ability of large language model (LLM) agents to discover hidden rules in dynamic environments and adapt to changes without prior notice. It highlights that current LLMs face challenges in proactively seeking relevant evidence and recognizing when their existing knowledge becomes outdated. The benchmark tests agents on their capacity to infer environmental rules and adapt to implicit rule changes, which are not explicitly communicated. Experimental results show that while LLMs can reason well with available evidence, they struggle with the proactive exploration needed to gather new evidence and detect when their knowledge is stale.'}, 'zh': {'title': '主动探索与适应能力的挑战', 'desc': 'AdaExploreBench 是一个新的基准，用于评估大型语言模型（LLM）代理在不断变化的环境中主动探索和适应的能力。研究发现，当前的模型在寻找相关证据和检测过时知识方面存在困难。该基准要求代理主动获取证据并推断环境规则，尤其是在隐含规则漂移的情况下。实验结果表明，尽管代理在获得信息后能够有效推理，但在主动获取正确证据和识别过时知识方面仍然面临挑战。'}}}, {'id': 'https://huggingface.co/papers/2610.26216', 'title': 'RoAR-VAE: Improving Latent Diffusability through Robust Prediction', 'url': 'https://huggingface.co/papers/2610.26216', 'abstract': 'Abstract RoAR-VAE improves visual tokenizers by enforcing robust prediction of semantics and reconstruction from corrupted latents, balancing fidelity with diffusion learnability.  Generated by thinkingmachines/Inkling-Small An effective visual tokenizer must preserve image fidelity while producing latents that downstream diffusion models can learn efficiently. Prior work improves latent diffusability through semantic alignment or joint tokenizer--diffusion training. Revisiting REPA-E, a representative approach, we find that removing its diffusion objective and dedicated generative blocks while retaining semantic prediction from corrupted latents yields comparable downstream generation performance under a matched setting. This observation motivates a general principle of robust prediction: generation-relevant information should remain recoverable from corrupted latents. We instantiate this principle with two complementary objectives. RobustAlign predicts pretrained semantic features from corrupted latents to preserve high-level structure, while RobustRecon reconstructs the clean image to retain fine-grained spatial and appearance information. Together, they form Robust Alignment and Reconstruction VAE (RoAR-VAE). Our analysis suggests that robust prediction improves diffusability by making useful information more accessible in high-variance latent directions, which diffusion models tend to learn earlier. Empirically, RoAR-VAE improves average generation benchmark performance by 2.19 points over the strongest baseline tokenizer under the same training budget, while improving small-text reconstruction accuracy by 16.93 percentage points over FLUX.1-VAE. These results demonstrate that RoAR-VAE achieves a favorable balance between reconstruction fidelity and downstream generative learnability.', 'score': 26, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '492bd5add1cf10d7', 'authors': ['Yang Yue', 'Fangyun Wei', 'Yitong Wang', 'Jinjing Zhao', 'Henry Zheng', 'Dong Chen', 'Gao Huang'], 'affiliations': ['Microsoft Research', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26216.jpg', 'data': {'categories': ['#diffusion', '#architecture', '#cv', '#training', '#optimization'], 'emoji': '🧩', 'ru': {'title': 'Устойчивые латенты — лучше генерация без потери деталей', 'desc': 'В статье представлен RoAR-VAE — визуальный токенизатор, который повышает обучаемость латентного пространства для диффузионных моделей, сохраняя при этом точность реконструкции изображений. Авторы показывают, что генерационно-значимая информация должна оставаться восстановимой даже из искажённых латентов, что формулируется как принцип robust prediction. Этот принцип реализован через два дополнительных целевых функционала: RobustAlign, предсказывающий семантические признаки предобученной модели из искажённых латентов, и RobustRecon, восстанавливающий чистое изображение. По результатам экспериментов RoAR-VAE улучшает качество генерации на 2.19 балла относительно сильнейшего базового токенизатора и на 16.93 п.п. повышает точность восстановления мелкого текста по сравнению с FLUX.1-VAE.'}, 'en': {'title': 'Enhancing Image Tokenization with Robust Prediction', 'desc': 'RoAR-VAE is a new visual tokenizer that enhances the way images are processed for machine learning. It focuses on maintaining high image quality while ensuring that the information extracted can be easily learned by diffusion models. The approach combines two key objectives: RobustAlign, which predicts important features from damaged data, and RobustRecon, which reconstructs the original image t
