    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.32749', 'title': 'Efficient Streaming Audio-Visual Target Speaker Extraction for Real-World Acoustic Scenes', 'url': 'https://huggingface.co/papers/2610.32749', 'abstract': 'Abstract Falcon is a lightweight causal audio-visual target speaker extraction method that achieves high quality with drastically reduced parameters and latency, supported by the realistic RealSSA benchmark.  Generated by thinkingmachines/Inkling-Small Streaming audio-visual target speaker extraction (AVTSE) is essential for latency-sensitive applications. However, current causal systems face two coupled gaps. First, standard benchmarks fix the number of speakers at two and ignore the near-/far-field interference, reverberation, and sudden noise of real scenes. Second, high-performance causal architectures are too heavy for edge deployment. Lightweight alternatives try to reclaim capacity by repeatedly invoking a small separator, which offsets the savings. To address the first gap, we release RealSSA, a realistic AVTSE benchmark consisting of RealSSA-Sim and RealSSA-Real. RealSSA-Sim provides controllable simulated scenes with 1--5 dynamic near-field interfering speakers; scenes with far-field interference additionally include 10--15 far-field interfering speakers. RealSSA-Real provides a held-out real-recorded evaluation set. To address the second gap, we propose Falcon, a causal AVTSE method. Its Separator performs multi-scale time-frequency separation in a single encoder--decoder pass. We train Falcon with an encoder-space speaker contrastive loss. This loss suppresses near-field leakage at zero inference cost and transfers across backbones. Falcon achieves state-of-the-art extraction quality on RealSSA-Sim, LRS2-2Mix, LRS3-2Mix, and VoxCeleb2-2Mix. Compared with the causal AV-TFGridNet baseline, it cuts parameters by 91.9%, computation by 20.2 times, and GPU inference latency by 11.1 times. Code and demo are available at https://cslikai.cn/Falcon/.', 'score': 146, 'issue_id': 3472, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': 'c337e3f899a3d83b', 'authors': ['Wendi Sang', 'Kai Li', 'Yifan Li', 'Jianqiang Huang', 'Xiaolin Hu'], 'affiliations': ['Chinese Institute for Brain Research (CIBR), Beijing 100010, China', 'Department of Computer Science and Technology, Institute for AI, BNRist, Tsinghua Laboratory of Brain and Intelligence (THBI), IDG/McGovern Institute for Brain Research, Tsinghua University, Beijing 100084, China', 'Intelligent Computing and Application Laboratory of Qinghai Province, Qinghai University, Xining 810016, China', 'School of Computer Technology and Application, Qinghai University, Xining 810016, China'], 'pdf_title_img': 'assets/pdf/title_img/2610.32749.jpg', 'data': {'categories': ['#inference', '#video', '#benchmark', '#audio', '#small_models', '#optimization', '#architecture', '#dataset', '#multimodal'], 'emoji': '🦅', 'ru': {'title': 'Быстрее и легче — выделяем нужного диктора в реальном шуме', 'desc': 'Статья представляет Falcon — лёгкий каузальный метод аудио-визуального извлечения целевого диктора (AVTSE), работающий в потоковом режиме с малой задержкой. Авторы также выпускают бенчмарк RealSSA с реалистичными сценами: ближнепольными и дальнепольными помехами, реверберацией и внезапным шумом. Separator в Falcon выполняет многомасштабное частотно-временное разделение за один проход encoder-decoder, а contrastive loss в пространстве энкодера подавляет утечку ближнепольных диктора без затрат на инференсе. По сравнению с каузальным AV-TFGridNet модель сокращает параметры на 91.9%, вычисления в 20.2 раза и задержку GPU-инференса в 11.1 раза при сохранении state-of-the-art качества.'}, 'en': {'title': 'Falcon: Lightweight and Efficient Audio-Visual Speaker Extraction', 'desc': "Falcon is a new method for extracting a target speaker's voice from audio and video, designed to be lightweight and efficient. It addresses two main challenges in current systems: the need for realistic testing environments and the heavy computational demands of existing models. The method introduces the RealSSA benchmark, which simulates various real-world scenarios with multiple speakers and noise. Falcon achieves high-quality results while significantly reducing the number of parameters and processing time, making it suitable for real-time applications."}, 'zh': {'title': 'Falcon：轻量级音视频目标说话人提取的创新之路', 'desc': 'Falcon是一种轻量级的因果音视频目标说话人提取方法，能够在大幅减少参数和延迟的情况下实现高质量的提取。该方法通过引入RealSSA基准，解决了当前因果系统在真实场景中面临的干扰和噪声问题。Falcon的分离器在单次编码-解码过程中执行多尺度时频分离，并通过编码空间的说话人对比损失进行训练，从而有效抑制近场泄漏。与传统方法相比，Falcon在多个基准测试中表现出色，参数减少了91.9%，计算量降低了20.2倍，GPU推理延迟减少了11.1倍。'}}}, {'id': 'https://huggingface.co/papers/2610.35684', 'title': 'OmniShowcase: Omnidirectional Subject-Consistent Video Generation from Multi-View Images', 'url': 'https://huggingface.co/papers/2610.35684', 'abstract': "Abstract OmniShowcase improves subject-to-video generation by using geometry-driven training data and surface-normal conditioning to maintain 3D consistency across novel viewpoints.  Generated by thinkingmachines/Inkling-Small Generating videos of a specific subject from a few reference images remains challenging when the camera reveals surfaces that are not visible in the input. Early subject-to-video (S2V) methods condition on a single reference image and must therefore infer the subject's unseen appearance and geometry as the viewpoint changes. To address this limitation, recent methods extend S2V to multiple reference views, providing more information about the subject from different viewpoints. However, they do not explicitly specify the 3D structure that connects these observations. In addition, existing training data do not guarantee that viewpoint changes preserve the same underlying 3D subject. We present OmniShowcase, built on two components: (i) a fully automated data synthesis pipeline that produces training videos along diverse camera trajectories, with viewpoint variation driven by underlying subject geometry, even spanning full 360-degree orbits; and (ii) a geometry-conditioning method that provides the video model with a turntable of surface-normal maps reconstructed from the reference views without requiring temporal alignment with the generated frames. We construct Showcase-4K, a corpus of 3D-asset-based videos covering twelve camera motions across 88 trajectory configurations with reconstruction-derived surface-normal conditioning, and ShowcaseBench, a held-out evaluation set with the source meshes and camera parameters used to render each video. Experiments show state-of-the-art subject identity and 3D consistency while maintaining competitive video quality and motion. Project page: justin4ai.github.io/OmniShowcase", 'score': 40, 'issue_id': 3472, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': 'b50dbc28014eedb0', 'authors': ['Junyeong Ahn', 'Geonwoo Kim', 'Kinam Kim', 'Gihwi Kim', 'Hoonjin Jung', 'Hyojin Jang', 'Jaegul Choo'], 'affiliations': ['FLIPTION', 'Inha University', 'KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.35684.jpg', 'data': {'categories': ['#video', '#benchmark', '#3d', '#diffusion', '#synthetic', '#data', '#dataset', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Видео объекта с любого ракурса — без потери 3D-структуры', 'desc': 'Статья описывает OmniShowcase — метод subject-to-video генерации, который создаёт видео объекта по нескольким референсным изображениям. Авторы используют полностью автоматический пайплайн синтеза данных, где движение камеры, включая полные 360-градусные орбиты, задаётся геометрией самого 3D-объекта. Для сохранения 3D-консистентности модель получает условие в виде карт нормалей поверхности, восстановленных по референсам и не требующих временной синхронизации с кадрами. Авторы также выпустили датасет Showcase-4K и бенчмарк ShowcaseBench, на которых метод показывает лучшую идентичность объекта и 3D-консистентность при конкурентном качестве видео.'}, 'en': {'title': 'Revolutionizing Video Generation with 3D Consistency', 'desc': "OmniShowcase enhances the generation of videos from reference images by ensuring 3D consistency through geometry-driven training data and surface-normal conditioning. Traditional subject-to-video (S2V) methods struggle with unseen surfaces when changing viewpoints, but OmniShowcase addresses this by synthesizing training videos that reflect the subject's geometry across various camera angles. It introduces a fully automated data synthesis pipeline that captures diverse camera trajectories and a geometry-conditioning method that utilizes surface-normal maps from reference views. The results demonstrate improved subject identity and 3D consistency, achieving state-of-the-art performance in video quality and motion."}, 'zh': {'title': 'OmniShowcase：提升视频生成的3D一致性', 'desc': 'OmniShowcase通过使用几何驱动的训练数据和表面法线条件，改善了从主题生成视频的过程，确保在新视角下保持3D一致性。传统的主题到视频(S2V)方法依赖单一参考图像，难以推断在视角变化时主题的隐藏外观和几何结构。为了解决这一问题，OmniShowcase引入了多视角参考图像，并通过自动化数据合成管道生成多样化的训练视频。实验结果表明，该方法在主题识别和3D一致性方面达到了最先进的水平，同时保持了竞争力的视频质量和运动表现。'}}}, {'id': 'https://huggingface.co/papers/2610.31670', 'title': 'Sensorimotor Alignment: A Platonic Proxy for Embodied Policy Success', 'url': 'https://huggingface.co/papers/2610.31670', 'abstract': "Abstract Sensorimotor alignment measures how sensory representations match physical motion geometry, serving as a low-cost offline predictor of robot model performance.  Generated by thinkingmachines/Inkling-Small Robot foundation models are typically evaluated through costly closed-loop rollouts, motivating low-cost offline proxies for model capability. The Platonic Representation Hypothesis (PRH) suggests that as representations improve, modalities such as vision and language converge toward a shared statistical model of reality. We ask whether motion trajectories form another such modality: as embodied models become more capable, should their sensory representations converge toward the structure of physical motion? To test this, we propose Sensorimotor Alignment (S^2), a training-free offline metric that measures how well a model's sensory representation aligns with the geometry of physical motion. We find that S^2 correlates positively with downstream robot task success across model families, making it a low-cost offline proxy for prioritizing models before closed-loop evaluation. S^2 can also identify promising vision-language model (VLM) backbones before costly fine-tuning into vision-language-action models (VLAs). Beyond this correlation, S^2 offers representation-level explanations for phenomena observed in VLAs and world action models (WAMs). With S^2, we extend PRH to robotics and make sensorimotor alignment measurable, offering a low-cost, representation-level view of robot foundation models that closed-loop success rates alone cannot reveal.", 'score': 33, 'issue_id': 3473, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': 'a713c937ed2d8101', 'authors': ['Yunfei Xie', 'Howard H. Qian', 'Shiyi Lan', 'Kaiyu Hang', 'Chen Wei'], 'affiliations': ['NVIDIA', 'Rice University'], 'pdf_title_img': 'assets/pdf/title_img/2610.31670.jpg', 'data': {'categories': ['#optimization', '#interpretability', '#robotics', '#agents', '#benchmark', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Оценивай робота по тому, как его восприятие совпадает с физикой движения', 'desc': 'В статье предлагается Sensorimotor Alignment (S^2) — offline-метрика без обучения, которая измеряет, насколько sensory-представления модели согласованы с геометрией физического движения. Авторы показывают положительную корреляцию S^2 с успешностью робота на downstream-задачах, что делает метрику дешёвым прокси для предварительного отбора моделей перед дорогостоящей closed-loop оценкой. Метод также помогает выбирать VLM-бэкбоны до fine-tuning в VLA и даёт representation-level объяснения наблюдаемым эффектам в VLA и world action models. Работа расширяет гипотезу Platonic Representation Hypothesis (PRH) на робототехнику, показывая, что траектории движения образуют отдельную модальность, к которой сходятся представления по мере роста возможностей модели.'}, 'en': {'title': 'Aligning Sensory and Motion Representations for Better Robot Performance', 'desc': "This paper introduces Sensorimotor Alignment (S^2), a metric that evaluates how well a robot's sensory representations correspond to the geometry of physical motion. It serves as a low-cost offline predictor of a robot's performance, allowing researchers to assess models without expensive closed-loop testing. The study builds on the Platonic Representation Hypothesis (PRH), suggesting that as models improve, their sensory modalities converge towards a unified understanding of reality. The findings indicate that S^2 correlates with task success in robots, making it a valuable tool for selecting and refining models before intensive evaluations."}, 'zh': {'title': '传感运动对齐：低成本评估机器人模型的利器', 'desc': '传感运动对齐（S^2）是一种衡量感知表示与物理运动几何形状匹配程度的指标，能够作为机器人模型性能的低成本离线预测工具。该研究提出，随着模型能力的提升，感知表示（如视觉和语言）应趋向于共享的统计现实模型。通过S^2，我们可以在不进行训练的情况下评估模型的感知表示与物理运动结构的对齐程度，从而预测机器人任务的成功率。S^2不仅为机器人基础模型提供了低成本的评估方法，还能在昂贵的微调之前识别出有潜力的视觉-语言模型。'}}}, {'id': 'https://huggingface.co/papers/2610.22507', 'title': 'RealCLI: Toward a Unified Evaluation of Human-Agent Collaboration for CLI Agents', 'url': 'https://huggingface.co/papers/2610.22507', 'abstract': 'Abstract REALCLI is a benchmark that jointly evaluates CLI agent task execution and human-agent collaboration quality, revealing major gaps in steerability, trust calibration, and safety management.  Generated by thinkingmachines/Inkling-Small Command-line interface (CLI) agents increasingly execute longer-horizon tasks, yet existing benchmarks either assume that user instructions remain fixed throughout execution or evaluate task outcomes without capturing runtime collaboration quality. In this paper, we present REALCLI, a paired benchmark that unifies the evaluation of task execution and human-agent collaboration quality on realistic CLI tasks. To comprehensively measure collaboration, REALCLI builds a five-dimensional framework, operationalized into 22 sub-dimensions and 51 interaction scenario templates. REALCLI provides two modes for paired comparison: REALCLI-EXEC supplies complete specifications upfront, whereas REALCLI-COLLAB introduces a scripted user that delivers progressive information, corrections, constraint revisions, and authorization decisions. Evaluations reveal profound capability gaps in frontier agents: the best configuration attains an average score of only 49.2%, and when evaluated by the joint collaboration score (J_{collab}), the peak performance reaches merely 37.6%. These results show that task effectiveness diverges sharply from collaboration quality, with models consistently struggling in steerability, trust calibration, and safety boundary management. REALCLI provides a rigorous, reproducible foundation for measuring and advancing collaborative CLI agents.', 'score': 15, 'issue_id': 3474, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': 'dfd940941cc03fbc', 'authors': ['Yunqi Liu', 'Peiyu Wang', 'Bingli Wang', 'Leo Luo', 'Xuanwu Song', 'Xudong Ma', 'Hongxin Li', 'Yaxin Du', 'Weicheng Gu', 'Fanglin Xu', 'Yi Xing', 'XiangLong Liu', 'Jujie He', 'Zhange Zhang', 'Huatong Song', 'Zhaoyi Li', 'Deyang Kong', 'Chuan Hao', 'Peihao Wu', 'Mingjie Tang', 'Ran Tao', 'Jian Yang', 'Wayne Xin Zhao', 'Bryan Dai'], 'affiliations': ['Beihang University', 'IQuest Research', 'Renmin University'], 'pdf_title_img': 'assets/pdf/title_img/2610.22507.jpg', 'data': {'categories': ['#agents', '#benchmark', '#dataset'], 'emoji': '🤝', 'ru': {'title': 'Успешный результат не равен хорошей совместной работе агента с человеком', 'desc': 'В статье представлен REALCLI — парный бенчмарк для оценки CLI-агентов, который одновременно измеряет качество выполнения задач и качество совместной работы агента с человеком. Фреймворк из пяти измерений, разбитых на 22 под-измерения и 51 шаблон сценариев, позволяет тестировать два режима: REALCLI-EXEC с полной спецификацией заранее и REALCLI-COLLAB, где скриптованный пользователь постепенно уточняет требования, исправляет и меняет ограничения. Результаты показывают серьёзные пробелы у передовых LLM: лучшая конфигурация набирает лишь 49.2% по среднему баллу и 37.6% по совместной метрике J_{collab}. Авторы делают вывод, что успешность задачи сильно расходится с качеством коллаборации, поскольку моделям трудно управляться с направлением работы, калибровать доверие и соблюдать границы безопасности.'}, 'en': {'title': 'REALCLI: Bridging the Gap in Human-Agent Collaboration for CLI Tasks', 'desc': 'REALCLI is a new benchmark designed to evaluate how well command-line interface (CLI) agents perform tasks and collaborate with humans. It highlights significant issues in areas like steerability, trust calibration, and safety management during task execution. The benchmark uses a detailed framework with multiple dimensions to assess collaboration quality through various interaction scenarios. Results indicate that current agents have substantial performance gaps, achieving low scores in both task effectiveness and collaboration quality, emphasizing the need for improvement in these areas.'}, 'zh': {'title': 'REALCLI：提升人机协作的基准测试', 'desc': 'REALCLI是一个基准测试，旨在同时评估命令行接口（CLI）代理的任务执行和人机协作质量。它揭示了在可控性、信任校准和安全管理方面的重大差距。REALCLI建立了一个五维框架，包含22个子维度和51个交互场景模板，以全面测量协作效果。评估结果显示，当前最先进的代理在任务有效性和协作质量之间存在明显差异，表明在这些领域仍需进一步改进。'}}}, {'id': 'https://huggingface.co/papers/2610.37230', 'title': 'TAO: Tool-Aware Joint Scheduling for LLM-Based Agentic Serving', 'url': 'https://huggingface.co/papers/2610.37230', 'abstract': 'Abstract TAO improves scheduling for LLM agent services by considering tool readiness and using dynamic programming to place sessions, reducing latency and increasing throughput.  Generated by thinkingmachines/Inkling-Small Agentic services alternate between model inference on clustered GPUs and external tools on distributed CPUs. In this scenario, existing systems (1) overlook tool-return readiness in service evaluation, wasting limited resources, and (2) use heuristic strategies to decide admission and placement on GPUs, resulting in suboptimal scheduling decisions. To bridge this gap, we present TAO, a tool-aware joint scheduling framework for LLM-based agentic serving. Its value interface combines near-term tool readiness, node-specific cache credit with time-aware decay, and token footprint; a dynamic program jointly selects and places waiting sessions under capacity constraints. Across the 12 reported model-workload-concurrency settings, TAO reduces latency by up to 26.8%, reduces mean time to first token (TTFT) by up to 36.3%, and increases decode throughput by up to 29.5% relative to the best evaluated state-of-the-art baseline for each metric.', 'score': 15, 'issue_id': 3473, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': '7eacd7a867835b35', 'authors': ['Shuhuai Li', 'Shengdong Ye', 'Dongdong Ge', 'Yinyu Ye', 'Jianghao Lin'], 'affiliations': ['Shanghai Jiao Tong University', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.37230.jpg', 'data': {'categories': ['#inference', '#optimization', '#agents'], 'emoji': '⚙️', 'ru': {'title': 'Умное планирование LLM-агентов: быстрее ответы, выше пропускная способность', 'desc': 'В статье представлен TAO — фреймворк для совместного планирования (scheduling) запросов в агентных сервисах на основе LLM, где модель чередует инференс на GPU с вызовами внешних инструментов на CPU. Авторы показывают, что существующие системы не учитывают готовность результатов инструментов и принимают решения о допуске и размещении сессий эвристически. TAO вводит функцию ценности, объединяющую готовность инструментов, кредит кэша с временным затуханием и размер токенов, а динамическое программирование выбирает и размещает ожидающие сессии под ограничениями ёмкости. В экспериментах по 12 конфигурациям метод снижает задержку до 26.8%, время до первого токена (TTFT) до 36.3% и повышает пропускную способность декодирования до 29.5%.'}, 'en': {'title': 'Optimizing LLM Scheduling with TAO: Tool-Aware Efficiency', 'desc': "The paper introduces TAO, a scheduling framework designed to enhance the efficiency of large language model (LLM) agent services. It addresses two main issues: the neglect of tool readiness in service evaluations and the reliance on heuristic methods for scheduling on GPUs. By employing dynamic programming, TAO optimally places sessions while considering tool availability and resource constraints. The results show significant improvements in latency and throughput, demonstrating TAO's effectiveness over existing systems."}, 'zh': {'title': 'TAO：优化LLM代理服务调度的工具感知框架', 'desc': 'TAO是一种改进大语言模型（LLM）代理服务调度的方法，它考虑了工具的准备情况，并使用动态规划来优化会话的安排，从而减少延迟并提高吞吐量。该系统通过在集群GPU上进行模型推理和在分布式CPU上使用外部工具来交替工作。现有系统在服务评估中忽视了工具返回的准备情况，浪费了有限的资源，并且使用启发式策略来决定GPU的接纳和放置，导致调度决策不理想。TAO通过结合工具准备情况、节点特定的缓存信用和时间敏感的衰减，提供了一种工具感知的联合调度框架，显著提高了性能。'}}}, {'id': 'https://huggingface.co/papers/2610.30161', 'title': 'TauIndianBankBench: Procedure-Aware, Action-Oriented Evaluation of Tool-Using Conversational Agents', 'url': 'https://huggingface.co/papers/2610.30161', 'abstract': "Abstract TauIndianBankBench evaluates language model assistants on Indian retail banking by verifying both procedural compliance and final outcomes across 1,000 simulated tasks.  Generated by thinkingmachines/Inkling-Small Many Indian banks serve customers through FAQ pages and scripted chatbots. Assistants based on language models could respond faster and carry out requests such as blocking a card, but only if they give correct information and follow the bank's rules. These rules prescribe a procedure, a set of required steps, such as obtaining a closure quote before closing a deposit. Adapting models to this domain requires measuring how well they follow the procedure, before and after training. Benchmarks usually judge only the records left at the end of a conversation. Many required steps, however, leave the records unchanged, so an assistant that skips them can still be judged successful. We present TauIndianBankBench, an action-oriented benchmark of 1,000 Indian retail-banking tasks where an assistant helps a simulated customer. Besides the final records, it checks that the assistant took every required step and made no unrequested change. For every model, 6.5-12.0% of sessions are judged successful when only the final records are checked, although the assistant skipped a required step or made an unrequested change. Scoring both procedure and outcome shows more accurately how well language models perform in Indian retail banking.", 'score': 8, 'issue_id': 3474, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '25a7fce2f42d816d', 'authors': ['Krishanu Adhikary', 'Prashant Devadiga'], 'affiliations': ['National Payments Corporation of India (NPCI)'], 'pdf_title_img': 'assets/pdf/title_img/2610.30161.jpg', 'data': {'categories': ['#multilingual', '#agents', '#alignment', '#dataset', '#benchmark'], 'emoji': '🏦', 'ru': {'title': 'Успех недостаточен без соблюдения процедуры: оценивайте не только итог, но и путь', 'desc': 'Статья представляет TauIndianBankBench — бенчмарк из 1000 задач для оценки LLM-ассистентов в индийском розничном банкинге. Бенчмарк проверяет не только итоговое состояние записей, но и соблюдение обязательных процедурных шагов, а также отсутствие несанкционированных изменений. Оказалось, что от 6,5% до 12% сессий ошибочно засчитываются как успешные при проверке только финального результата. Совместная оценка процедуры и результата даёт более точную картину качества моделей в банковской сфере.'}, 'en': {'title': 'Ensuring Compliance and Accuracy in Banking AI', 'desc': "The paper introduces TauIndianBankBench, a benchmark designed to evaluate language model assistants specifically in the context of Indian retail banking. It emphasizes the importance of not only achieving correct final outcomes but also adhering to procedural compliance during customer interactions. By assessing both the steps taken and the final results across 1,000 simulated banking tasks, the benchmark reveals that many models appear successful when only final records are considered, despite skipping crucial procedural steps. This comprehensive evaluation approach provides a more accurate measure of a language model's effectiveness in handling banking tasks."}, 'zh': {'title': '全面评估银行助手的表现', 'desc': 'TauIndianBankBench 是一个评估语言模型助手在印度零售银行领域表现的基准，涵盖了1000个模拟任务。该基准不仅关注最终结果，还检查助手是否遵循了银行的程序规则。许多银行的操作步骤在记录中不会留下痕迹，因此仅依赖最终记录的评估可能会导致误判。通过同时评估程序合规性和最终结果，TauIndianBankBench 更准确地反映了语言模型在印度零售银行中的实际表现。'}}}, {'id': 'https://huggingface.co/papers/2610.20832', 'title': 'Amortizing Sequential Experimental Design in Reasoning LLMs', 'url': 'https://huggingface.co/papers/2610.20832', 'abstract': "Abstract Large language models learn adaptive information gathering by training reasoning with information-gain rewards, improving experimental design efficiency and generalizing across tasks.  Generated by thinkingmachines/Inkling-Small Despite their extensive pretraining knowledge and strong reasoning capabilities, large language models (LLMs) struggle to adaptively gather information in experimental design tasks. We study how to amortize sequential Bayesian experimental design (BED) into an LLM by explicitly training the reasoning that guides action selection using information-gain rewards. Our approach specifies the experimental generative model independently of the LLM's own beliefs, allowing us to optimize expected information gain under a model of our choosing. We investigate the design choices for amortization, including alternative generative-model constructions, reward estimation, hypothesis-space specification, multi-step objectives, and computational costs relative to training- and inference-time BED baselines. On Twenty Questions, the resulting policies improve information acquisition and task performance, outperform inference- and training-time BED baselines at substantially lower computational cost, and generalize to unseen categories. We further demonstrate positive transfer from Twenty Questions training to Medi-Q, a real-world clinical dialogue benchmark. These results suggest that information gathering can be learned as a generalizable reasoning skill in LLMs.", 'score': 4, 'issue_id': 3474, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': 'd987a99e183965a1', 'authors': ['Anita Kriz', 'Antonin Berthon', 'Nicolás Astorga', 'Mihaela van der Schaar'], 'affiliations': ['University of Cambridge'], 'pdf_title_img': 'assets/pdf/title_img/2610.20832.jpg', 'data': {'categories': ['#optimization', '#reasoning', '#training', '#rl', '#transfer_learning', '#benchmark', '#healthcare'], 'emoji': '🧭', 'ru': {'title': 'Сбор информации можно выучить как обобщаемый навык рассуждения LLM', 'desc': 'Авторы показывают, как научить LLM адаптивно собирать информацию в задачах экспериментального дизайна. Для этого последовательный байесовский дизайн эксперимента (BED) переносится в модель через обучение рассуждений с наградами за information gain. Генеративная модель эксперимента задаётся независимо от собственных убеждений LLM, что позволяет оптимизировать ожидаемый information gain. На игре Twenty Questions такие политики работают лучше inference- и training-time BED при значительно меньших вычислительных затратах и обобщаются на новые категории, а также переносятся на клинический диалоговый бенчмарк Medi-Q.'}, 'en': {'title': 'Empowering LLMs with Adaptive Information Gathering Skills', 'desc': "This paper explores how large language models (LLMs) can improve their ability to gather information effectively during experimental design tasks. By training these models with information-gain rewards, the authors enable LLMs to make better decisions about which actions to take based on expected outcomes. The study introduces a method to separate the generative model from the LLM's beliefs, allowing for optimized information acquisition strategies. The results show that this approach not only enhances performance on specific tasks like Twenty Questions but also allows for successful application in real-world scenarios such as clinical dialogues."}, 'zh': {'title': '信息收集：大型语言模型的新技能', 'desc': '这篇论文探讨了大型语言模型（LLMs）在实验设计任务中如何通过信息增益奖励来学习适应性的信息收集。研究表明，通过明确训练指导行动选择的推理，可以将序列贝叶斯实验设计（BED）融入LLM中。作者提出了一种方法，独立于LLM自身信念来指定实验生成模型，从而优化预期的信息增益。实验结果显示，该方法在信息获取和任务表现上优于传统的训练和推理时间的BED基线，并且能够在未见过的类别中进行泛化。'}}}, {'id': 'https://huggingface.co/papers/2610.30132', 'title': 'LongZero: Enhancing Long-Context Reasoning in LLMs from Zero Data', 'url': 'https://huggingface.co/papers/2610.30132', 'abstract': 'Abstract LongZero enables large language models to self-improve long-context reasoning by synthesizing structured multi-hop and retrieval tasks and training with GRPO without external data.  Generated by thinkingmachines/Inkling-Small Reinforcement learning (RL) is an effective way to strengthen the long-context reasoning of large language models (LLMs), but it needs training data that are long, diverse, challenging, and verifiable. Human annotation of such data is expensive, naturally occurring data are too scarce to sustain RL, and existing synthesis methods depend on external corpora or stronger teacher models, which become harder to obtain as the trained models get stronger. Recently, RL from zero data, in which a model learns from tasks it proposes itself, has achieved excellent performance, but existing methods target short-context tasks. Therefore, we propose LongZero, a method that lets an LLM improve its own long-context reasoning without any external data. Instead of writing questions and answers over existing documents, LongZero first has the model synthesize the question and answer with its supporting evidence in a compact structured form, and only then separately expands the evidence into a long multi-document context. LongZero combines these self-written multi-hop reasoning tasks with self-written multi-round retrieval tasks and trains the model with GRPO. We evaluate LongZero on two LLMs across five long-context reasoning benchmarks and compare it with RL on data synthesized from external corpora. Experimental results show that LongZero can generalize to real tasks, and outperforms both baselines, suggesting a viable and promising path to improving long-context reasoning of LLMs.', 'score': 3, 'issue_id': 3474, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '6a2ebc698137a6e9', 'authors': ['Zhennan Wan', 'Jianfei Chen'], 'affiliations': ['BNRist Center, Tsinghua University', 'Dept. of Comp. Sci. and Tech., Tsinghua University', 'Institute for AI, Tsinghua University', 'THBI Lab, Tsinghua University', 'Tsinghua-Bosch Joint ML Center, Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.30132.jpg', 'data': {'categories': ['#optimization', '#reasoning', '#long_context', '#training', '#rl', '#synthetic', '#benchmark', '#data'], 'emoji': '🧠', 'ru': {'title': 'Модель учится длинному рассуждению сама, без внешних данных', 'desc': 'В статье представлен метод LongZero, который позволяет большой языковой модели (LLM) улучшать своё рассуждение над длинным контекстом без каких-либо внешних данных. Модель сама синтезирует задачи в виде структурированных многошаговых рассуждений и задач многораундового поиска, сначала формируя вопрос, ответ и подтверждающие факты, а затем разворачивая их в длинный многодокументный контекст. Для обучения используется reinforcement learning с алгоритмом GRPO. Эксперименты на двух LLM и пяти бенчмарках показывают, что LongZero обобщается на реальные задачи и превосходит базовые подходы, обучаемые на данных из внешних корпусов.'}, 'en': {'title': 'Empowering LLMs to Self-Improve Long-Context Reasoning!', 'desc': 'LongZero is a novel approach that enhances the long-context reasoning abilities of large language models (LLMs) without relying on external data. It allows models to generate their own structured multi-hop questions and answers, which are then expanded into longer contexts. By combining self-generated reasoning tasks with retrieval tasks, LongZero utilizes a method called GRPO for training. The results demonstrate that LongZero significantly improves performance on long-context reasoning benchmarks compared to traditional reinforcement learning methods.'}, 'zh': {'title': 'LongZero：无外部数据提升长文本推理能力的创新方法', 'desc': 'LongZero是一种新方法，旨在帮助大型语言模型（LLMs）在没有外部数据的情况下自我提升长文本推理能力。它通过合成结构化的多跳推理任务和检索任务，利用GRPO进行训练。与传统方法不同，LongZero首先让模型生成问题和答案，并提供支持证据，然后再将证据扩展为长文本上下文。实验结果表明，LongZero在多个长文本推理基准上表现优异，超越了现有的基线方法，展示了提升LLMs长文本推理能力的可行性和潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.29702', 'title': 'CausGround: Causal Interaction Grounding for Adaptive Embodied Planning', 'url': 'https://huggingface.co/papers/2610.29702', 'abstract': 'Abstract CausGround extracts reusable action preconditions and effects from interaction experience to improve embodied planning and reasoning across diverse environments without model retraining.  Generated by thinkingmachines/Inkling-Small Multimodal large language models (MLLMs) show promising reasoning capabilities, but reliable physical interaction requires planning that accounts for when actions are executable and how they change the world. These preconditions and effects are environment-dependent and often not captured by MLLMs, making adaptation challenging. Yet existing approaches either require costly environment-specific training or rely on unstructured interaction experience that is difficult to reuse. Therefore, we introduce CausGround, a non-parametric causal interaction grounding framework that distills interaction experience into reusable action-centered causal knowledge. CausGround identifies action preconditions and effects and organizes them in a factorized world-state representation capturing object attributes and inter-object relations. At planning time, task-relevant causal dependencies are grounded in current observations to support backward reasoning over preconditions and forward reasoning over effects for action selection and multi-step planning. We evaluate CausGround on simulated high-level planning, interaction reasoning, and real-world robot manipulation. On adapted VirtualHome and RoboCasa benchmarks, CausGround improves vision-based high-level planning across MLLM backbones, increasing average task success from 24.9% to 53.3% on VirtualHome and closed-loop planning success from 43.0% to 57.0% on RoboCasa. On SWITCH, average interaction reasoning accuracy increases from 25.8% to 31.9%, indicating improved action selection, recovery, and verification. Moreover, real-world experiments show that CausGround reasons backward from MLLM-interpreted goals to derive executable high-level action sequences for sequential manipulation. These results demonstrate that reusable action preconditions and effects support long-horizon embodied planning across diverse environments without parameter updates.', 'score': 2, 'issue_id': 3473, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '7efcbd6e5b87c260', 'authors': ['Yijun Shen', 'Diqi He', 'Jinbang Guo', 'Wanyue Zhang', 'Jiaming Mi', 'Huan Yang', 'Zhongyuan Wang', 'Zhiwei Yu', 'Kai Zhang'], 'affiliations': ['Beijing Academy of Artificial Intelligence (BAAI)', 'East China Normal University', 'Institute of Automation, Chinese Academy of Sciences', 'Northwestern Polytechnical University', 'School of Artificial Intelligence, University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2610.29702.jpg', 'data': {'categories': ['#robotics', '#multimodal', '#benchmark', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Понимать причины и следствия действий — ключ к умному планированию робота без переобучения', 'desc': 'В статье представлен CausGround — непараметрический фреймворк для каузального заземления взаимодействий, который извлекает из опыта взаимодействия с окружением переиспользуемые предусловия и эффекты действий. Знания организуются в факторизованном представлении состояния мира, отражающем атрибуты объектов и отношения между ними, и применяются при планировании через обратное рассуждение по предусловиям и прямое рассуждение по эффектам, без обновления параметров MLLM. Эксперименты на VirtualHome, RoboCasa и SWITCH показали рост успешности планирования с 24.9% до 53.3% и с 43.0% до 57.0% соответственно, а также улучшение точности интерактивного рассуждения. Реальные эксперименты с роботом подтвердили, что подход позволяет строить исполнимые последовательности действий для многошаговых манипуляций.'}, 'en': {'title': 'Empowering Planning with Reusable Causal Knowledge', 'desc': 'CausGround is a framework designed to enhance embodied planning and reasoning by extracting reusable action preconditions and effects from interaction experiences. It addresses the challenge of adapting large language models (MLLMs) to different environments without the need for costly retraining. By organizing causal knowledge into a structured representation, CausGround enables effective backward and forward reasoning for action selection and multi-step planning. The framework has shown significant improvements in task success rates and interaction reasoning accuracy in both simulated and real-world scenarios.'}, 'zh': {'title': 'CausGround：提升体态规划的因果知识框架', 'desc': 'CausGround 是一种非参数因果交互基础框架，旨在从交互经验中提取可重用的动作前提和效果，以改善在不同环境中的体态规划和推理。该框架通过识别动作的前提条件和效果，并将其组织成一个因子化的世界状态表示，捕捉对象属性和对象间关系。在规划时，CausGround 能够根据当前观察结果支持反向推理和前向推理，从而进行动作选择和多步骤规划。实验结果表明，CausGround 在虚拟环境和真实机器人操作中显著提高了任务成功率，证明了其在无需参数更新的情况下支持长时间的体态规划能力。'}}}, {'id': 'https://huggingface.co/papers/2610.35671', 'title': 'Evaluating DeepSeek V4.1 Flash-1017 for loss of control and harmful manipulation risks', 'url': 'https://huggingface.co/papers/2610.35671', 'abstract': 'Abstract Independent safety evaluation of DeepSeek V4.1 Flash-1017 reveals substantial improvements over prior versions and near-parity with leading closed-source models, while recommending process-level observability, incremental safety testing, and private benchmarks.  Generated by thinkingmachines/Inkling-Small As frontier language models grow increasingly capable and autonomous, independent third-party evaluations are critical for characterizing their systemic safety risks. While closed-source releases are routinely accompanied by comprehensive system cards, open-weight models receive less scrutiny regarding frontier risks. To address this gap, we present an independent safety evaluation of DeepSeek V4.1 Flash-1017, the latest version of V4.1 Flash that departs from V4 with a new architecture, scaled-up training, and strong agentic capabilities. Drawing on the EU General-Purpose AI Code of Practice, we evaluate the model across 34 benchmarks, including 5 in-house suites, spanning evaluation integrity, loss of control, and harmful manipulation. Conforming to the AEF-1 standard, we compare V4.1 Flash-1017 against V4.1 Flash, earlier DeepSeek V4 models, and leading closed-source systems (GPT-6 Astra, GPT-5.6 Sol, and Gemini 3.8 Flash). Overall, V4.1 Flash-1017 shows substantial safety improvements over the V4 generation and approaches or matches leading closed-source baselines on several dimensions, while still exhibiting notable behaviors that warrant continued attention. Building on our findings, we highlight three key observations and recommendations. First, because safety can shift and even regress across minor updates, developers should integrate safety evaluation into incremental releases. Second, as final-turn outputs and end-state checks alone cannot reliably detect loss-of-control behaviors, deployments require process-level observability across both reasoning traces and action logs. Third, because public benchmarks elicit strong evaluation awareness and face data contamination risks, developing private benchmarks is essential for trustworthy frontier evaluation.', 'score': 1, 'issue_id': 3474, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': 'f0a5e2d3bd77d5d9', 'authors': ['Yao Huang', 'Zhiyuan Zeng', 'Yu Wang', 'Zhitong Zhu', 'Dingcheng Duan', 'Hao Li', 'Shangzhi Xu', 'Yifan Wang', 'Jinzhe Tu', 'Shukun Xiong', 'Yihe Zang', 'Han Yan', 'Hongchang Yang', 'Fuyu Gu', 'Wei Xu', 'Yinpeng Dong', 'Xiaojian Li'], 'affiliations': ['Fangcun AI Evaluation Team'], 'pdf_title_img': 'assets/pdf/title_img/2610.35671.jpg', 'data': {'categories': ['#leakage', '#agents', '#alignment', '#benchmark', '#open_source', '#survey', '#ethics', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность открытых LLM растёт, но приватные тесты обязательны', 'desc': 'В статье представлена независимая оценка безопасности языковой модели DeepSeek V4.1 Flash-1017 по 34 бенчмаркам, включая 5 собственных наборов тестов. Модель сравнивается с предыдущими версиями DeepSeek V4 и закрытыми LLM, такими как GPT-6 Astra и Gemini 3.8 Flash, по стандарту AEF-1. Результаты показывают заметное улучшение безопасности относительно V4 и близость к лидерам по ряду параметров, однако сохраняются поведенческие риски, например потеря контроля. Авторы рекомендуют встраивать оценку безопасности в инкрементальные релизы, отслеживать процессы рассуждений и действий, а также разрабатывать приватные бенчмарки.'}, 'en': {'title': 'Enhancing Safety in Language Models: The DeepSeek V4.1 Evaluation', 'desc': 'The paper presents an independent safety evaluation of the DeepSeek V4.1 Flash-1017 model, highlighting its significant improvements in safety compared to earlier versions and its competitive performance against leading closed-source models. It emphasizes the importance of ongoing safety assessments as language models evolve, particularly focusing on systemic risks associated with their autonomous capabilities. The evaluation utilized 34 benchmarks to assess various safety aspects, including evaluation integrity and harmful manipulation. The authors recommend integrating safety evaluations into incremental updates, ensuring process-level observability, and developing private benchmarks to enhance the reliability of safety assessments.'}, 'zh': {'title': 'DeepSeek V4.1 Flash-1017：安全性的新突破', 'desc': '本文对DeepSeek V4.1 Flash-1017进行了独立的安全评估，显示出相较于之前版本的显著改进，并在多个方面接近领先的闭源模型。评估基于欧盟通用人工智能行为准则，涵盖了34个基准测试，重点关注评估完整性、控制丧失和有害操控等问题。研究结果表明，尽管V4.1 Flash-1017在安全性上有显著提升，但仍存在一些值得关注的行为。文章还提出了三项关键建议，包括在增量更新中整合安全评估、实现过程级可观察性以及开发私有基准以确保可信的前沿评估。'}}}, {'id': 'https://huggingface.co/papers/2610.34186', 'title': 'HuGe: Scaling Humanoid Generalist Vision-Language-Action Models with Egocentric Experience', 'url': 'https://huggingface.co/papers/2610.34186', 'abstract': 'Abstract HuGe pre-trains vision-language-action models on egocentric human and robot data with pseudo-proprioception and visual adaptation to enable whole-body humanoid control.  Generated by thinkingmachines/Inkling-Small Extending Vision-Language-Action models (VLAs) to humanoid robots requires coordinated whole-body control and diverse demonstrations that are costly to collect in real-world scenarios. Although egocentric human demonstrations provide a complementary source of task experience, differences in visual embodiment and missing robot proprioception complicate transfer to humanoid policies. To address these challenges, we introduce HuGe, a family of Humanoid Generalist VLAs pre-trained on over 2,000 hours of egocentric human and robot data. Specifically, HuGe employs three existing representative VLA architectures to predict latent motion tokens for a pretrained whole-body controller, together with hand-control signals. Based on this, we introduce a three-stage training pipeline that combines egocentric pre-training, humanoid adaptation, and downstream fine-tuning. To facilitate transfer across embodiments, we construct pseudo-proprioceptive states through simulation playback during pre-training and modify arm appearance in egocentric observations through re-rendering during downstream fine-tuning. With this pipeline, HuGe achieves the state-of-the-art on simulation benchmark HumanoidArena. Furthermore, real-world experiments on the Unitree G1 indicate that augmenting robot demonstrations with visually adapted egocentric demonstrations significantly increases success on a pick-and-drop task.', 'score': 1, 'issue_id': 3473, 'pub_date': '2026-10-25', 'pub_date_card': {'ru': '25 октября', 'en': 'October 25', 'zh': '10月25日'}, 'hash': 'dc9ee0626fa9e416', 'authors': ['Yang Liu', 'Jiacheng Liu', 'Hengtao Li', 'Yuheng Huang', 'Zijian Yang', 'Ji Dai', 'Maoxin Wang', 'Yi Gao', 'Qishen Wang', 'Baohua Yin', 'Peiyang Li', 'Shuanghao Bai', 'Mingyang Sun', 'Pengxiang Ding', 'Jianqin Yin', 'Lixin Yang', 'Donglin Wang'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'Hebei University of Technology', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Southwest University of Finance and Economics', 'University of Science and Technology of China', 'University of Sussex', 'Westlake University', 'Xian Jiaotong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.34186.jpg', 'data': {'categories': ['#training', '#robotics', '#cv', '#data', '#benchmark', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Учимся управлять человекоподобным роботом по видео людей', 'desc': 'Статья представляет HuGe, семейство обобщённых VLA-моделей для человекоподобных роботов, предобученных на более чем 2000 часах эгоцентричных данных от людей и роботов. Модель предсказывает латентные токены движения для предобученного контроллера всего тела и сигналы управления кистями рук. Для переноса между разными телами используются псевдо-проприоцептивные состояния, построенные через симуляцию, и перерисовка рук в визуальных наблюдениях. Эксперименты показывают state-of-the-art результаты на бенчмарке HumanoidArena и рост успешности на реальном роботе Unitree G1.'}, 'en': {'title': 'HuGe: Bridging Human Experience to Humanoid Robot Control', 'desc': 'The paper introduces HuGe, a model designed to enhance humanoid robot control by integrating vision, language, and action (VLA) through extensive pre-training on egocentric data. It addresses the challenges of transferring human demonstrations to robots by using pseudo-proprioception and visual adaptation techniques. HuGe employs a three-stage training pipeline that includes pre-training on human data, adapting to humanoid robots, and fine-tuning for specific tasks. The results show that HuGe outperforms existing models in simulation and improves real-world task success rates when using adapted demonstrations.'}, 'zh': {'title': 'HuGe：提升人形机器人控制的智能模型', 'desc': 'HuGe是一种预训练的视觉-语言-动作模型，旨在实现全身人形机器人的控制。该模型利用超过2000小时的自我中心人类和机器人数据，通过伪本体感知和视觉适应来解决人类示范与机器人控制之间的差异。HuGe采用三阶段训练流程，包括自我中心预训练、人形适应和下游微调，以提高模型的迁移能力。实验结果表明，HuGe在模拟基准测试中表现出色，并且在实际任务中显著提高了机器人的成功率。'}}}, {'id': 'https://huggingface.co/papers/2601.15351', 'title': 'OmniSpectra: A Unified Foundation Model for Universal Spectra Representation Learning', 'url': 'https://huggingface.co/papers/2601.15351', 'abstract': 'Abstract OmniSpectra is a wavelength-native spectral foundation model that uses continuous coordinates and physics-grounded decoders to learn cross-instrument representations without destructive resampling, achieving high performance with far fewer parameters.  Generated by thinkingmachines/Inkling-Small Standard sequence models encode position by token rank rather than physical coordinate, typically forcing practitioners to destructively resample continuous physical signals such as spectra observed across heterogeneous instruments. We identify this coordinate mismatch as a structural limitation in cross-instrument representation learning, and propose OmniSpectra, a wavelength-native foundation model for spectral representation learning: a continuous-coordinate masked autoencoder that discards the integer pixel indexing of sequence modeling. Mapping physical coordinates to a logarithmic basis turns the multiplicative scaling induced by cosmological redshift into a uniform additive shift. In continuous rotary position embeddings, this shared shift cancels from relative token distances rather than producing grid-dependent positional distortion. We further counter the spectral bias inherent to implicit neural decoders with a physics-grounded, resolution-gated Fourier decoder that provides anti-aliasing. Pretrained on eight surveys and benchmarked against seven baselines, our model reaches state-of-the-art performance with only 12.2M parameters while outperforming substantially larger models, indicating that encoding physical structure can substitute for parameter scale.', 'score': 0, 'issue_id': 3473, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': '82f6bb776ab495cb', 'authors': ['Md Khairul Islam', 'Zeyu Xia', 'Adam S. Bolton', 'Judy Fox'], 'affiliations': ['SLAC National Accelerator Laboratory', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2601.15351.jpg', 'data': {'categories': ['#optimization', '#architecture', '#small_models', '#science', '#data', '#interpretability', '#multimodal'], 'emoji': '🔭', 'ru': {'title': 'Физика вместо масштаба: учим модель понимать координаты спектра', 'desc': 'В статье представлена OmniSpectra — foundation model для спектров, которая работает с непрерывными физическими координатами длины волны, а не с индексами пикселей, что позволяет обучать representation learning на данных разных инструментов без destructive resampling. Ключевая идея: логарифмическая шкала превращает красное смещение (redshift) в равномерный аддитивный сдвиг, который при continuous rotary position embeddings сокращается из относительных расстояний между токенами. Для борьбы со spectral bias неявных нейросетевых декодеров авторы используют physics-grounded Fourier decoder с resolution-gated механизмом, обеспечивающим anti-aliasing. Модель из 12.2M параметров, предобученная на восьми обзорах, достигает state-of-the-art результатов и превосходит значительно более крупные модели, что показывает: кодирование физической структуры может заменить масштаб параметров.'}, 'en': {'title': 'Revolutionizing Spectral Learning with Fewer Parameters', 'desc': 'OmniSpectra is a new model designed for learning spectral representations from different instruments without losing important information. It uses continuous coordinates instead of traditional pixel indexing, which helps avoid issues caused by resampling physical signals. The model incorporates a physics-based decoder that improves performance by addressing spectral bias and ensuring better resolution. With only 12.2 million parameters, OmniSpectra achieves state-of-the-art results, demonstrating that understanding physical structures can reduce the need for larger models.'}, 'zh': {'title': 'OmniSpectra：高效的光谱表示学习模型', 'desc': 'OmniSpectra是一种波长原生的光谱基础模型，利用连续坐标和基于物理的解码器来学习跨仪器的表示，避免了破坏性重采样。传统的序列模型通过标记排名来编码位置，通常需要对不同仪器观察到的连续物理信号进行重采样，这限制了跨仪器表示学习的效果。我们提出的OmniSpectra模型采用连续坐标的掩蔽自编码器，消除了序列建模中的整数像素索引问题。经过在八个调查数据集上的预训练和与七个基线模型的比较，我们的模型以仅12.2M的参数达到了最先进的性能，表明编码物理结构可以替代参数规模。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (6)', '#agi', '#alignment (2)', '#architecture (2)', '#audio (1)', '#benchmark (10)', '#cv (1)', '#data (4)', '#dataset (4)', '#diffusion (1)', '#ethics (1)', '#games', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (2)', '#interpretability (2)', '#leakage (1)', '#long_context (1)', '#low_resource', '#machine_translation', '#math', '#multilingual (1)', '#multimodal (6)', '#open_source (1)', '#optimization (6)', '#plp', '#rag', '#reasoning (2)', '#rl (2)', '#rlhf', '#robotics (3)', '#science (1)', '#security (1)', '#small_models (2)', '#story_generation', '#survey (1)', '#synthetic (2)', '#training (3)', '#transfer_learning (1)', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-29 17:14',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-29 17:14')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-29 17:14')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
