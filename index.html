    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.18359', 'title': 'Envisioning Agentic Robotics: A New Era of Robotic Systems', 'url': 'https://huggingface.co/papers/2611.18359', 'abstract': 'Abstract Agentic robotics, centered on an Embodied System 2 formed by a foundation model and embodied harness, requires a shared evaluation framework and research roadmap to achieve reliable physical autonomy.  Generated by deepseek-ai/DeepSeek-V4.1-Flash The release of GPT-6 Astra marks the emergence of a new paradigm in robotics: agentic robotics. Within weeks, frontier models with agentic harnesses matched or exceeded task-specific policies on many embodied benchmarks. Instead of training a dedicated policy for each family of tasks, an agentic robotic system applies a foundation model to open-world embodied tasks. It operates in a closed loop: observing the environment, interpreting user intent, reasoning about the task, invoking skills and tools, verifying outcomes, and adapting its strategy. Despite these advances, the community has yet to converge on a shared definition, a reliable evaluation framework, or a research roadmap. We argue that Embodied System 2, realized by a foundation model together with an embodied harness, forms the decision-making core of agentic robotics. Its central challenge is to translate general-purpose reasoning into effective and verifiable actions under physical constraints such as limited reaction time, mechanical limits, unpredictable environment changes, and irreversible consequences. Motivated by this perspective, we propose an evaluation framework that measures both model capabilities and closed-loop system performance. Furthermore, we identify the principles that carry over from digital to physical agents and the challenges that must be addressed to achieve reliable physical autonomy. On top of the Embodied System 2 and the evaluation framework, we envision a research roadmap toward sustained autonomy: the ability to perform work safely and reliably with progressively broader responsibility, from executing individual primitives to fulfilling standing roles.', 'score': 8, 'issue_id': 3538, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '0da6056866d64758', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agi', '#benchmark', '#robotics', '#games', '#agents', '#survey'], 'emoji': '🤖', 'ru': {'title': 'От универсального разума к надёжному роботу-агенту в реальном мире', 'desc': 'Статья описывает новую парадигму агентной робототехники, где универсальная foundation model, дополненная embodied harness, выступает ядром принятия решений и работает в замкнутом цикле: наблюдение, рассуждение, вызов навыков и проверка результата. Авторы предлагают evaluation framework, оценивающий как возможности модели, так и производительность всей closed-loop системы в физическом мире. В работе выделяются принципы, переносимые из цифровых агентов в физических, и проблемы, связанные с ограничениями реального времени, механикой и необратимостью последствий. Итогом становится дорожная карта к sustained autonomy — надёжной и безопасной автономии с постепенно расширяющейся ответственностью.'}, 'en': {'title': 'From Foundation Models to Reliable Physical Autonomy', 'desc': 'The paper describes agentic robotics, where a foundation model and an embodied harness work together to control robots in open-ended tasks. The system repeatedly observes its surroundings, reasons about user goals, selects tools or skills, checks results, and adjusts its actions. The authors propose an evaluation framework that measures both model capabilities and the performance of the full closed-loop system under physical constraints. They also outline a research roadmap toward sustained autonomy, in which robots can take on broader responsibilities safely and reliably.'}, 'zh': {'title': '让通用推理落地为可靠的机器人自主行动', 'desc': '本文讨论一种新的机器人范式：智能体机器人，它用基础模型处理多种开放环境任务，而不是为每类任务单独训练策略。系统通过闭环流程观察环境、理解用户意图、推理任务、调用技能与工具、验证结果，并根据变化调整行动。作者将基础模型与具身执行框架构成的“具身系统 2”视为决策核心，并指出它必须在反应时间、机械限制和环境不确定性等物理约束下，把推理转化为有效且可验证的行动。为推动可靠的物理自主，文章提出同时评估模型能力与闭环系统表现的框架，并规划从执行单项技能到承担长期职责的研究路线。'}}}, {'id': 'https://huggingface.co/papers/2611.07226', 'title': 'Loopback Transformer: Towards a Unified View of Residual Looped Transformers', 'url': 'https://huggingface.co/papers/2611.07226', 'abstract': "Abstract A looped Transformer that separately controls input strength, total update weight, and per-update allocation achieves lower validation loss and higher downstream accuracy than standard and looped residual baselines while using fewer parameters.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Looped Transformers reduce parameter count by repeatedly applying shared blocks, but parameter sharing alone does not determine how the results of repeated computation are reused. We take the depth-memory view of residual connections and analyze which representation is stored after each block application and how later reads weight it. A full block output contains both its input and its new update, so weighting that output also reweights the history already carried by the input. Reading individual updates instead, with the shared stack's input kept on a separate path, gives separate controls over input strength, total update weight, and allocation across updates. The Loopback Transformer implements these controls: geometric decay sets the total update weight and supplies a recency prior, and attention learns how to allocate that weight. On ClimbMix, Loopback reaches lower validation loss than standard Transformer baselines with 40-75% of their Transformer parameters (excluding token embeddings and the output head) at reference scales from 191M to 3B, with training tokens and executed depth matched. It also has higher mean accuracy over thirteen downstream tasks at 1.4B and 3B. At 191M, 374M, and 778M, it has the lowest validation loss and the highest thirteen-task mean among the standard Transformer and seven looped residual designs.", 'score': 7, 'issue_id': 3538, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '992c684605c9f385', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#architecture', '#training'], 'emoji': '🔁', 'ru': {'title': 'Умное управление повторными обновлениями: меньше параметров, выше качество', 'desc': 'В статье предлагается Loopback Transformer, зацикленная архитектура, которая повторно применяет общие блоки и отдельно управляет силой входного сигнала, общим весом обновлений и их распределением между итерациями. Вход общего стека передаётся по отдельному пути, а отдельные обновления взвешиваются через геометрическое затухание и механизм attention, который обучается распределять вес. На датасете ClimbMix модель при меньшем числе параметров (40–75% от стандартного Transformer) достигает более низкого validation loss и более высокой средней точности на тринадцати downstream-задачах. Преимущество сохраняется в диапазоне от 191M до 3B параметров по сравнению со стандартными Transformer и семью вариантами looped residual архитектур.'}, 'en': {'title': 'Reuse the blocks; control how each update counts.', 'desc': 'Looped Transformers reuse the same blocks to reduce parameter count, but ordinary residual connections mix each new update with the input history. The Loopback Transformer keeps the input on a separate path and reads individual updates, independently controlling input strength, total update weight, and how weight is distributed across updates. A geometric decay provides a preference for recent updates, while attention learns their allocation. On ClimbMix, Loopback achieves lower validation loss and higher downstream accuracy than standard and looped residual baselines, using 40–75% as many Transformer parameters at the reported scales.'}, 'zh': {'title': '让每次更新各尽其用：更少参数，获得更强的循环 Transformer', 'desc': '循环 Transformer 通过反复使用共享模块来减少参数，但如何融合每次计算产生的结果同样重要。论文指出，直接读取完整模块输出会同时改变输入表示和新产生的更新，因此提出将输入路径与各次更新分开处理。Loopback Transformer 用几何衰减控制更新的总权重，并让注意力机制学习如何在不同更新之间分配权重。实验显示，在匹配训练 token 数和计算深度时，它以更少参数取得更低的验证损失，并在多项下游任务上获得更高准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.14504', 'title': 'Emergent Biological Capabilities in a Foundation Model for Molecular Interactions', 'url': 'https://huggingface.co/papers/2611.14504', 'abstract': 'Abstract  Foundation models trained on large unlabeled corpora develop emergent capabilities, tasks that go beyond the training objective. We extend this paradigm to multimodal biology with Bonbon, a foundation model for molecular interactions trained on approximately 3.2 trillion tokens of paired protein-ligand sequences. From a single representation space, Bonbon exhibits three zero-shot emergent capabilities at hierarchical levels of resolution: functional (mechanism of action), residue (binding site localization, including orthosteric/allosteric discrimination), and bond (covalent versus non-covalent engagement). All three capabilities generalize to out-of-distribution complexes. Bonbon was trained on protein-ligand sequences alone, without any task-specific supervision and without structural coordinates. We conducted controlled scaling experiments across six model scales from 42M to 1.6B parameters; every capability evaluated shows a sharp jump at the largest scale on continuous metrics, even as pretraining loss decreases smoothly. This demonstrates that loss-based scaling laws alone are insufficient to predict when zero-shot emergent capabilities become available. The capabilities reported here emerge after training at a 1:2,000 parameter-to-token ratio to accommodate the sparsity of paired biological interaction data. The same frozen representations achieve state-of-the-art binding and affinity prediction at five orders of magnitude greater speed than co-folding methods. In prospective wet-lab validation across nine disease targets spanning seven protein families, Bonbon achieves a 61.5% dose-response hit rate on de novo compounds, yielding structurally novel molecules not previously reported to inhibit these proteins, including for out-of-distribution targets.', 'score': 5, 'issue_id': 3538, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'b5617205ca916916', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#interpretability', '#multimodal', '#training', '#healthcare', '#optimization', '#science'], 'emoji': '🧬', 'ru': {'title': 'Bonbon: эмерджентные способности языковой модели для молекулярных взаимодействий открывают путь к быстрому поиску лекарств', 'desc': 'Авторы представляют Bonbon, foundation model для молекулярных взаимодействий, обученную на примерно 3,2 триллиона токенов парных последовательностей белок-лиганд без структурных координат и разметки. Модель демонстрирует zero-shot emergent capabilities на трёх уровнях: функциональном (механизм действия), остаточном (локализация сайта связывания, включая orthosteric/allosteric) и связевом (ковалентное против нековалентного связывания). Эксперименты по масштабированию от 42M до 1,6B параметров показывают резкий скачок способностей на continuous metrics при largest scale, хотя loss падает плавно, что ставит под сомнение предсказуемость по scaling laws. Замороженные представления дают state-of-the-art предсказание связывания и аффинности в тысячи раз быстрее co-folding методов, а wet-lab валидация на девяти мишенях даёт 61,5% dose-response hit rate на новых соединениях.'}, 'en': {'title': 'From Protein–Ligand Sequences to Drug-Discovery Capabilities', 'desc': 'Bonbon is a foundation model trained on about 3.2 trillion tokens of paired protein–ligand sequences, without task-specific labels or structural coordinates. Its shared representations support three zero-shot capabilities: predicting a molecule’s mechanism of action, locating its binding site, and distinguishing covalent from non-covalent binding, including on unfamiliar complexes. These capabilities appear sharply at the largest tested model size, even though training loss decreases smoothly, showing that loss-based scaling laws do not fully predict when such abilities emerge. The frozen representations also enable fast binding and affinity prediction, and laboratory tests found dose-response activity for 61.5% of newly designed compounds across nine disease targets.'}, 'zh': {'title': '从海量序列中涌现分子交互能力', 'desc': 'Bonbon 是一种用于分子相互作用的基础模型，使用约 3.2 万亿个蛋白质—配体序列词元训练，不需要结构坐标或任务专属标注。它能从同一套表示中零样本判断作用机制、定位结合位点并区分正构与变构结合，还能辨别共价和非共价作用；这些能力也能泛化到分布外的复合物。实验发现，模型规模增至 16 亿参数时，各项能力在连续指标上突然跃升，即使预训练损失一直平滑下降，说明仅靠损失缩放规律无法预测零样本能力何时出现。冻结后的表示能以比协同折叠方法快数十万倍的速度预测结合与亲和力，并在九个疾病靶点的新药实验中取得 61.5% 的剂量反应命中率。'}}}, {'id': 'https://huggingface.co/papers/2611.16439', 'title': 'HALO: Human-Aligned Data Collection for WhoLe-body MObile Manipulation', 'url': 'https://huggingface.co/papers/2611.16439', 'abstract': "Abstract  Learning whole-body mobile manipulation requires demonstrations that coordinate bimanual actions with locomotion across extended workspaces. However, existing interfaces trade off direct robot control, perception and action alignment, and natural operator mobility, making such demonstrations difficult to collect. We introduce HALO, a human-aligned data collection system for whole-body mobile manipulation. The system aligns the operator's perception and action space with the robot while preserving direct physical feedback and natural locomotion. Operators guide the robot end-effectors through kinesthetic teaching and move a low-resistance platform without the deployed mobile base while performing bimanual manipulation. This interface enables more natural whole-body demonstrations, but the close human-robot coupling introduces discrepancies between the demonstration and deployment settings. We address these discrepancies with deployment-aligned demonstration processing, which calibrates and temporally aligns platform motion with the deployed base response and masks and inpaints demonstrator hands in recorded observations. Compared with Mobile ALOHA and VR teleoperation, HALO enables up to 2.9x faster demonstration collection while maintaining comparable or higher success rates. Policies trained with HALO perform precise manipulation tasks, including zip-tie fastening, and achieve a 73.3% success rate on a six-stage long-horizon mobile manipulation task involving repeated coordinated base and arm motion. Project page: https://robbyant-research.github.io/Lingbot-ALOHA/", 'score': 2, 'issue_id': 3538, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '811c4f37df990728', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#data', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Естественные демонстрации человека — основа умного мобильного робота', 'desc': 'Статья представляет HALO — систему сбора демонстраций для обучения whole-body mobile manipulation, то есть согласованных движений двуруких манипуляций и перемещения робота. Оператор напрямую направляет концевые эффекторы робота через kinesthetic teaching и двигает низкосопротивляемую платформу без работающей базы, что сохраняет физическую обратную связь и естественную мобильность человека. Чтобы устранить расхождения между условиями записи и развёртывания, авторы применяют обработку демонстраций: калибровку и временное выравнивание движения платформы с откликом базы, а также маскирование и inpainting рук оператора на записанных наблюдениях. По сравнению с Mobile ALOHA и VR-телеуправлением HALO ускоряет сбор данных до 2.9x при сопоставимом или более высоком уровне успеха, а обученные на нём policy выполняют точные задачи и достигают 73.3% успеха в длинной шестиэтапной задаче.'}, 'en': {'title': 'Faster, More Natural Demonstrations for Whole-Body Robot Skills', 'desc': 'HALO is a system for collecting demonstrations of whole-body mobile manipulation, where a robot coordinates its arms and movement. It lets operators guide the robot arms by hand and move a lightweight platform, aligning what they see and do with the robot while preserving physical feedback. To address differences between demonstrations and real deployment, HALO calibrates and aligns platform motion with the robot base, and removes demonstrators’ hands from recorded observations. HALO collects demonstrations up to 2.9 times faster than comparison methods, and policies trained on its data achieve precise manipulation and a 73.3% success rate on a challenging six-stage task.'}, 'zh': {'title': '让示范更自然，让移动操作更高效', 'desc': 'HALO 是一种用于全身移动操作的示范数据采集系统，让操作者的感知和动作更贴近机器人，同时保留直接的物理反馈和自然移动能力。操作者通过动觉示教引导机器人的双臂，并推动低阻力平台来配合机器人移动。为缩小采集示范与实际部署之间的差异，系统会校准并对齐平台与机器人底盘的运动，还会遮盖并补全示范者的手部图像。与 Mobile ALOHA 和 VR 遥操作相比，HALO 最多能将示范采集速度提升至 2.9 倍；训练出的策略在多阶段移动操作任务中达到 73.3% 的成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.12901', 'title': 'Rethinking in Spikes: Mitigating Hallucinations in MDLMs with Step-Aware Decoding', 'url': 'https://huggingface.co/papers/2611.12901', 'abstract': 'Abstract StepRefine, a plug-and-play decoding strategy, mitigates hallucinations in multimodal diffusion language models by switching between discrete denoising and latent refinement based on entropy spikes and distributional stability.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent advancements in multimodal diffusion language models (MDLMs) have exhibited strong global modeling capabilities through iterative refinement. We observe that mask uncertainty follows an overall downward trend during iterative denoising, while a few denoising steps exhibit localized entropy spikes closely associated with hallucinations. We argue that anomalous steps can be identified by measuring the entropy deviation of each denoising step from its neighboring temporal window. We hypothesize that discrete token commitment discards the distributional information at masked positions, limiting the continued interaction between candidate semantics and the context during entropy spikes. With this goal, we present StepRefine, a plug-and-play decoding strategy that leverages semantic context to achieve reliable denoising. The core of our method lies in a step-aware switch between discrete denoising and latent refinement. The model employs probability-weighted embeddings at entropy spike steps to preserve diverse reasoning hypotheses and performs multiple rounds of continuous refinement. Meanwhile, a refinement controller monitors distributional stability to reduce unnecessary loops and switch the model back to standard discrete denoising. Through extensive experiments, StepRefine demonstrates significant hallucination mitigation across different MDLMs on multimodal benchmarks.', 'score': 1, 'issue_id': 3538, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': 'd3e47188ddfc04cd', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#diffusion', '#multimodal', '#hallucinations'], 'emoji': '🧠', 'ru': {'title': 'Не фиксируй токен раньше времени: плавное уточнение снижает галлюцинации', 'desc': 'Статья представляет StepRefine — декодирующую стратегию, которая не требует переобучения модели и снижает галлюцинации в мультимодальных диффузионных языковых моделях (MDLM). Авторы замечают, что на отдельных шагах итеративного шумоподавления энтропия резко возрастает, и такие аномальные шаги связаны с галлюцинациями. Метод переключается между дискретным шумоподавлением и непрерывным латентным уточнением: на шагах со скачком энтропии используются вероятностно взвешенные эмбеддинги, которые сохраняют разные гипотезы. Контроллер уточнения следит за стабильностью распределения, чтобы не делать лишних циклов, и экспериментально показано значительное снижение галлюцинаций на мультимодальных бенчмарках.'}, 'en': {'title': 'Refine at the Spikes, Reduce Hallucinations', 'desc': 'StepRefine is a plug-and-play decoding method that reduces hallucinations in multimodal diffusion language models. It detects unusual denoising steps by measuring entropy spikes relative to nearby steps. At these steps, it uses probability-weighted embeddings and continuous latent refinement to preserve alternative token hypotheses and their context. A controller tracks distributional stability, stopping refinement and returning to discrete denoising when appropriate.'}, 'zh': {'title': '在熵峰值处保留多种可能，让生成少些幻觉', 'desc': '这篇论文提出 StepRefine，一种可直接接入多模态扩散语言模型的解码策略，用来减少生成中的幻觉。作者发现，去噪过程中的不确定性整体会下降，但少数步骤会出现局部熵峰值，这些异常常与幻觉有关。遇到熵峰值时，StepRefine 使用按概率加权的嵌入进行潜在空间细化，以保留多个候选语义及其分布信息，并让它们继续结合上下文进行推理。细化控制器会监测分布稳定性，在不再需要细化时切回离散去噪；实验表明，该方法能在多个多模态基准上减少幻觉。'}}}, {'id': 'https://huggingface.co/papers/2611.06866', 'title': 'GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs', 'url': 'https://huggingface.co/papers/2611.06866', 'abstract': "Abstract  Agentic workflows enable AI agents to perform recurring repository tasks on schedules or in response to repository events. Existing studies examine workflow definitions and outputs, but provide limited evidence of what happens during execution. We present GH-AWTrace, a dataset linking 25,014 verified GitHub Agentic Workflows across 5,051 repositories to 4,112,526 run records and 562,877 nonempty execution log archives. The dataset preserves execution evidence subject to GitHub's log-retention limits and links it to repository metadata and generated workflow configurations. Illustrative cases show how the logs expose tool denials, provider failures, changes in an agent's approach, and delegation among agents. These observations enable research on execution failures, tool use, and the relationship between reported run outcomes and visible task progress. Coverage varies across workflows, and the logs provide partial observations rather than complete agent trajectories. Video: https://youtu.be/KIlfmZhHxtA", 'score': 1, 'issue_id': 3538, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '7d1b35e1d49e80d8', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#open_source', '#data', '#dataset', '#agents', '#survey'], 'emoji': '🔍', 'ru': {'title': 'Заглянуть внутрь выполнения: логи AI-агентов раскрывают то, что скрывают итоговые статусы', 'desc': 'Статья представляет GH-AWTrace — датасет, который связывает 25 014 проверенных агентных воркфлоу GitHub с 4 112 526 записями о запусках и 562 877 непустыми архивами логов выполнения. Датасет сохраняет данные о выполнении с учётом ограничений хранения логов и связывает их с метаданными репозиториев и сгенерированными конфигурациями воркфлоу. На примерах авторы показывают, как логи раскрывают отказы инструментов, сбои провайдеров LLM, изменения стратегии агента и делегирование задач между агентами. Работа открывает возможности для исследования ошибок выполнения, использования инструментов и связи между отчётными результатами запусков и реальным прогрессом задач, при этом логи дают лишь частичную картину, а не полные траектории агентов.'}, 'en': {'title': 'Look Inside the Runs: A Dataset for Studying GitHub Agents in Action', 'desc': 'This paper introduces GH-AWTrace, a dataset of GitHub agentic workflows linked to millions of run records and hundreds of thousands of execution logs. It preserves evidence of how AI agents act during repository tasks, including tool use, provider failures, and delegation between agents. Researchers can use these logs to study execution failures and compare reported run outcomes with visible task progress. Coverage is uneven, and the logs provide only partial views of agent behavior.'}, 'zh': {'title': '用真实执行日志揭开智能体工作流的运行过程', 'desc': '本文介绍 GH-AWTrace 数据集，收录了 5,051 个代码仓库中 25,014 个经过验证的 GitHub Agentic Workflows，以及数百万条运行记录和执行日志。该数据集将日志与仓库元数据和生成的工作流配置关联起来，并保留 GitHub 日志保留期限内可获取的执行证据。日志展示了工具调用被拒、服务提供方故障、智能体调整策略以及多个智能体之间的任务委派等情况，可用于研究执行失败、工具使用，以及运行结果与任务实际进展之间的关系。由于不同工作流的日志覆盖程度不一，数据只能呈现部分执行过程，并非智能体完整的运行轨迹。'}}}, {'id': 'https://huggingface.co/papers/2611.17811', 'title': 'AI Reviews Are Biased Towards the Appendix', 'url': 'https://huggingface.co/papers/2611.17811', 'abstract': "Abstract Large language models used for peer review draw about half or more of their identified weaknesses from paper appendices, whereas human reviewers draw only 8.4% and focus on presentation and core ideas.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models (LLMs) are increasingly used by reviewers to highlight weaknesses during the reviewing process, and their outputs often shape the reviews that humans submit. Prior work studies how LLM reviews align with human ones, yet we know little about which parts of a paper these models actually criticize. In this work, we investigate 2,000 papers from ACL, EMNLP, COLM, and ICLR, and show that the latest GPT and Claude models draw about 50% or more of their review weaknesses from the appendix. This behavior holds across the API, coding-agent, and web access methods for using LLMs to review a paper. In contrast, we find that humans draw only 8.4% of their weaknesses from the appendix, and these weaknesses primarily revolve around a paper's presentation and content related to its core idea. Meanwhile, LLMs draw weaknesses from deep in the appendix that concern fine-grained technical details not central to the paper's contributions. We anticipate that our analysis will contribute to the scholarly discourse on AI reviews. Our code is publicly available at: https://github.com/cincynlp/review_appendix.", 'score': 0, 'issue_id': 3538, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '4f131414ef33f04b', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#data', '#benchmark', '#science', '#alignment'], 'emoji': '📎', 'ru': {'title': 'LLM-рецензенты придираются к приложениям, а люди — к сути работы', 'desc': 'Авторы исследуют, какие части научной статьи критикуют большие языковые модели (LLM) при автоматическом рецензировании. Анализ 2000 статей с конференций ACL, EMNLP, COLM и ICLR показал, что современные модели GPT и Claude выводят около 50% и более своих замечаний из приложений (appendix), тогда как люди делают это лишь в 8,4% случаев. Люди в основном критикуют подачу материала и суть основной идеи, а LLM часто цепляются за мелкие технические детали, далекие от ключевого вклада работы. Результаты показывают систематическое расхождение между AI-рецензиями и человеческими, что важно учитывать при использовании AI в процессе peer review.'}, 'en': {'title': 'AI Reviews Look Deep into the Appendix', 'desc': 'This study analyzes reviews of 2,000 papers from ACL, EMNLP, COLM, and ICLR to see which parts of papers large language models criticize. GPT and Claude models draw at least half of their identified weaknesses from appendices, across API, coding-agent, and web-based review methods. Human reviewers, by contrast, draw only 8.4% of their weaknesses from appendices and focus more on presentation and a paper’s core ideas. LLMs often flag fine-grained technical details in appendices that are less central to the paper’s main contributions.'}, 'zh': {'title': 'AI评审盯住附录，人类评审聚焦核心', 'desc': '这项研究分析了 ACL、EMNLP、COLM 和 ICLR 的 2,000 篇论文，考察大语言模型在评审时会批评论文的哪些部分。研究发现，GPT 和 Claude 提出的弱点中，约一半或更多来自附录，而且这一现象在不同的模型使用方式下都存在。相比之下，人类评审者提出的弱点只有 8.4% 来自附录，他们更关注论文的表达和核心思想。大语言模型则常指出附录深处的细节问题，而这些问题通常并非论文贡献的重点。'}}}];

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (2)', '#agi (1)', '#alignment (1)', '#architecture (1)', '#audio', '#benchmark (3)', '#cv', '#data (3)', '#dataset (1)', '#diffusion (1)', '#ethics', '#games (1)', '#graphs', '#hallucinations (1)', '#healthcare (1)', '#inference (1)', '#interpretability (1)', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (2)', '#open_source (1)', '#optimization (2)', '#plp', '#rag', '#reasoning', '#rl', '#rlhf', '#robotics (2)', '#science (2)', '#security', '#small_models', '#story_generation', '#survey (2)', '#synthetic', '#training (3)', '#transfer_learning', '#video'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-16 03:59',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-16 03:59')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-16 03:59')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
