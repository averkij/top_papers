otong University'], 'pdf_title_img': 'assets/pdf/title_img/2609.15051.jpg', 'data': {'categories': ['#training', '#multimodal', '#rlhf', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Адаптивное распределение обучающих примеров через оценку потенциала исследования', 'desc': 'Авторы предлагают фреймворк для оптимизации обучения мультимодальных языковых моделей с помощью алгоритма обучения с подкреплением. Ключевой компонент — метрика Exploration Potential Score, которая оценивает информативность каждого обучающего примера на основе статистики текущей политики. Вместо отбрасывания неинформативных примеров модель-учитель переписывает их так, чтобы сохранить исходную задачу, но сделать пример более полезным для обучения. Метод показывает улучшения на 9.7% на внутри-распределительных бенчмарках и до 11.5% на специализированных задачах математического зрения.'}, 'en': {'title': 'Dynamic Prompt Adjustment for Enhanced Reinforcement Learning', 'desc': 'This paper introduces a new framework for improving reinforcement learning in multimodal language models by dynamically adjusting training prompts. It identifies that not all prompts are equally useful for learning, as some may be too easy or too hard, leading to inefficient training. The proposed method uses an Exploration Potential Score (EPS) to evaluate the utility of prompts and generates scaffolded rewrites to enhance their effectiveness without losing the original task intent. The results show significant improvements in performance on various benchmarks, demonstrating the effectiveness of this exploration-guided approach.'}, 'zh': {'title': '动态调整训练提示，提升多模态学习效果', 'desc': '本文提出了一种动态调整训练提示的框架，以提高多模态语言模型的强化学习效果。通过探索潜力评分（EPS）和支架重写，该方法能够在强化学习后期动态适应训练提示的分布。EPS是一种基于回合的轻量级代理，能够直接从策略回合统计中计算，帮助评估提示的有效性。实验结果表明，该方法在多个基准测试中均优于传统方法，显示出显著的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2609.12541', 'title': 'Agent as Policy for Robotic Manipulation', 'url': 'https://huggingface.co/papers/2609.12541', 'abstract': "Abstract A general-purpose agent directly controls a physical robot by interpreting visuals, writing executable programs, and revising actions based on physical feedback across diverse manipulation tasks.  Generated by thinkingmachines/Inkling-Small We demonstrate that a general-purpose agent can directly drive a physical robot throughout task execution without any task-specific or environment-specific training. We introduce Agent as Policy (AGP), which places task planning and execution under the agent's control. Given a task and a robot interface, the agent interprets visual evidence, writes executable programs, issues motion commands, and revises its actions in response to physical outcomes. This brings the agent's reasoning and programming capabilities into continuous interaction with the physical world. We study AGP across multiple real-world manipulation tasks spanning precision manipulation, dynamic motions, and deformable objects. These include assembly from human videos, block construction from goal images, die reorientation, targeted throwing, and bimanual towel folding. AGP achieves success rates of 100%, 100%, and 80% on three block construction configurations. These findings establish a path for general-purpose agents to act as robotic policies, extending their autonomy to physical manipulation through runtime reasoning, programming, and interaction.", 'score': 5, 'issue_id': 3276, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '293ec4b2a4fe3dae', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#robotics', '#cv', '#open_source', '#reasoning', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Агент как политика: прямое управление роботом через рассуждение и программирование', 'desc': 'В работе представлен подход Agent as Policy (AGP), позволяющий универсальному агенту напрямую управлять физическим роботом без специального обучения на конкретных задачах. Агент интерпретирует визуальную информацию, генерирует исполняемые программы, отправляет команды движения и корректирует свои действия на основе физической обратной связи. Метод протестирован на разнообразных манипуляционных задачах, включая сборку по видео, конструирование блоков, переориентацию объектов, бросание и двуручное складывание полотенца. Подход демонстрирует высокую успешность (100% на некоторых конфигурациях) и открывает возможность использования универсальных агентов в качестве политик для управления роботами в реальном мире.'}, 'en': {'title': 'Empowering Robots with General-Purpose Autonomous Agents', 'desc': "This paper presents a novel approach called Agent as Policy (AGP), which enables a general-purpose agent to control a physical robot without needing specific training for each task or environment. The agent interprets visual inputs, generates executable programs, and adjusts its actions based on real-time feedback from the robot's interactions with the physical world. AGP has been tested on various manipulation tasks, demonstrating high success rates in complex activities like assembly and block construction. This research highlights the potential for autonomous agents to perform diverse physical tasks through continuous reasoning and programming."}, 'zh': {'title': '通用代理：机器人操作的新未来', 'desc': '本文介绍了一种通用代理（Agent as Policy，AGP），它能够直接控制物理机器人，执行各种操作任务。该代理通过解析视觉信息、编写可执行程序，并根据物理反馈调整动作，实现了无需特定任务或环境训练的操作。AGP在多个真实世界的操作任务中表现出色，包括精确操作、动态运动和可变形物体的处理。研究结果表明，AGP能够在不同的任务中实现高成功率，展示了通用代理在物理操作中的自主性和实时推理能力。'}}}, {'id': 'https://huggingface.co/papers/2609.15029', 'title': 'Pick Your Poison: Learning to Select Poison Sets for Stronger LLM Backdoor Attacks', 'url': 'https://huggingface.co/papers/2609.15029', 'abstract': 'Abstract Backdoor vulnerability in fine-tuned language models varies drastically with poison selection, and a learned set-scoring method improves worst-case attack success by identifying high-impact poisoned examples.  Generated by thinkingmachines/Inkling-Small Backdoor poisoning attacks add poisoned examples to otherwise-clean finetuning data, pairing a trigger with a target behavior that the model learns to produce when the trigger appears. Existing evaluations typically fix the number of poisoned examples and sample them at random from a candidate pool. We show that this can severely underestimate worst-case vulnerability: across three LLaMA-3-8B backdoor settings, holding the model, clean data, and poison count fixed, attack success ranges from 3% to 80% depending only on which poison set is chosen.   We formalize poison selection as oracle-budgeted set optimization and introduce SAILS (Set-level Audit-Informed Iterative Learned Selection), which learns a set scorer from a few hundred finetune-and-evaluate runs, ranks millions of candidate sets, and audits only a small shortlist. SAILS improves held-out attack success by 30 percentage points on average over the strongest influence baselines, transfers from small-scale to full-scale finetuning, and extends to code-generation, agentic, and API-only backdoors.', 'score': 4, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '950a65d120f85db7', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '💉', 'ru': {'title': 'Умный выбор отравленных данных для максимально эффективной бэкдор-атаки', 'desc': 'В статье изучается уязвимость языковых моделей к бэкдор-атакам при fine-tuning, показано, что успешность атаки сильно зависит от выбора отравленных примеров в данных. Авторы предлагают метод SAILS, который использует обучаемый scoring-модуль для выбора наиболее эффективных отравленных примеров из большого пула кандидатов. Подход формализуется как задача оптимизации множества с ограниченным бюджетом, где модель обучается на нескольких сотнях экспериментов fine-tuning и ранжирует миллионы потенциальных наборов. Метод увеличивает успешность атаки на 30 процентных пункта и показывает хорошую обобщаемость на разные типы бэкдоров, включая генерацию кода и агентские модели.'}, 'en': {'title': 'Optimizing Poison Selection for Enhanced Backdoor Attack Success', 'desc': 'This paper addresses the backdoor vulnerability in fine-tuned language models, highlighting how the choice of poisoned examples significantly affects attack success rates. It introduces a novel method called SAILS, which optimizes the selection of poisoned examples by learning from previous finetuning evaluations. The study demonstrates that the attack success can vary dramatically, from as low as 3% to as high as 80%, based solely on the selected poison set. By using SAILS, the authors achieve a notable improvement in attack success rates, showcasing its effectiveness across various backdoor settings and applications.'}, 'zh': {'title': '优化毒素选择，提升后门攻击成功率', 'desc': '本论文探讨了微调语言模型中的后门攻击脆弱性，发现毒素选择对攻击成功率有显著影响。通过引入SAILS方法，研究者能够从数百次微调和评估中学习出一个集合评分器，从而优化毒素选择。实验表明，选择不同的毒素集合，攻击成功率可以从3%到80%变化。SAILS方法在多个设置中平均提高了30个百分点的攻击成功率，且适用于代码生成和API后门等场景。'}}}, {'id': 'https://huggingface.co/papers/2609.12419', 'title': 'MInTRL: Off-policy Intervention can boost On-policy RL', 'url': 'https://huggingface.co/papers/2609.12419', 'abstract': "Abstract Minimal Intervention Reinforcement Learning improves on-policy exploration by applying sparse local corrections during rollouts and training with a sequence-level advantage-regression objective.  Generated by thinkingmachines/Inkling-Small Reinforcement learning with verifiable rewards is typically performed on-policy, keeping training data close to the current policy but limiting learning to trajectories that the policy can discover itself. Off-policy methods such as supervised fine-tuning, on the other hand, can leverage external knowledge beyond the base model's capabilities, but may suffer from large distribution shift. The key challenge is thus to expand exploration without sacrificing learnability. In this work, we introduce Minimal Intervention Reinforcement Learning (MInTRL), which expands the exploration frontier through sparse, local interventions in otherwise on-policy rollouts. During generation, a judge-intervention policy periodically reviews the current policy's output, replaces erroneous suffixes with short corrections, and immediately returns control to the policy. During training, MInTRL adopts a sequence-level advantage-regression objective that eliminates the need for importance sampling. We show that sparse, local interventions can substantially improve coverage beyond finite-budget on-policy sampling while preserving the overall on-policy nature of the resulting trajectories. Across math and code benchmarks, MInTRL consistently outperforms standard on-policy and off-policy baselines. Ablations show that MInTRL remains effective with self-intervention and across different judge policies, while performance peaks at moderate intervention intensity, highlighting the importance of intervening minimally. These results establish minimal intervention as an effective paradigm for enhancing on-policy RL.", 'score': 4, 'issue_id': 3276, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '6227303a74ff3378', 'authors': ['Mingyu Chen', 'Yefan Tao', 'Gerald Friedland', 'Xuezhou Zhang', 'Chris Kong'], 'affiliations': ['Amazon Web Services', 'Boston University'], 'pdf_title_img': 'assets/pdf/title_img/2609.12419.jpg', 'data': {'categories': ['#plp', '#math', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Минимальные вмешательства для эффективного обучения с подкреплением', 'desc': 'В статье предлагается новый метод обучения с подкреплением — Minimal Intervention Reinforcement Learning (MInTRL), который улучшает исследование пространства действий путём редких локальных коррекций во время генерации траекторий. Во время обучения используется судейская политика, которая периодически проверяет выход основной политики, исправляет ошибочные части и возвращает контроль модели. Для оптимизации применяется sequence-level advantage-regression, который избегает необходимости в importance sampling и сохраняет on-policy природу данных. Метод демонстрирует значительное улучшение по сравнению со стандартными on-policy и off-policy подходами на задачах математики и кодирования.'}, 'en': {'title': 'Enhancing Exploration with Minimal Interventions in Reinforcement Learning', 'desc': 'Minimal Intervention Reinforcement Learning (MInTRL) enhances on-policy exploration by introducing sparse local corrections during the training process. This method allows the policy to explore more effectively without straying too far from its current trajectory, thus maintaining learnability. By using a sequence-level advantage-regression objective, MInTRL avoids the complications of importance sampling typically found in reinforcement learning. The results demonstrate that MInTRL outperforms traditional on-policy and off-policy methods, proving that minimal interventions can significantly improve exploration while keeping the learning process stable.'}, 'zh': {'title': '最小干预，最大探索！', 'desc': '最小干预强化学习（MInTRL）通过在策略回放中进行稀疏的局部修正，改善了基于策略的探索。该方法在生成过程中，使用评估干预策略定期检查当前策略的输出，并用短的修正替换错误的部分。训练时，MInTRL采用序列级优势回归目标，避免了重要性采样的需求。实验结果表明，MInTRL在数学和代码基准测试中，始终优于标准的基于策略和非基于策略的基线，证明了最小干预在增强基于策略的强化学习中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.13318', 'title': 'Attention-DP3: Spatially Object-aware 3D Diffusion Policy via Geometry-aligned Attentional Conditioning', 'url': 'https://huggingface.co/papers/2609.13318', 'abstract': 'Abstract Attention-DP3 improves 3D diffusion policies by injecting object-level geometric cues via attention to stabilize performance under heavy clutter.  Generated by thinkingmachines/Inkling-Small 3D point-cloud observations are inherently ambiguous in complex, cluttered manipulation scenes, where target objects may be partially occluded or tightly intermingled with visually similar distractors. As a result, standard 3D diffusion policies often struggle to localize and exploit task-relevant geometry as scene complexity grows. We propose Attention-DP3, a spatially object-aware 3D diffusion policy that injects object-level geometric cues via attention while keeping the DP3 diffusion backbone unchanged. Our pipeline performs open-vocabulary 2D segmentation on RGB images, then lifts predicted target masks into 3D using calibrated camera geometry to obtain object-centric geometric priors. We incorporate these cues through Tri-field Attentional Conditioning, which constructs three complementary fields: (i) a targetness field to anchor the target object, (ii) an intra-target saliency field to emphasize task-relevant geometry within the target, and (iii) a backgroundness field to suppress distractors and clutter. Experiments on Adroit, DexArt, MetaWorld, and the real-world SO101 platform show consistent improvements over DP3, achieving state-of-the-art performance across benchmarks. Notably, as distractor objects increase, DP3 drops sharply, whereas Attention-DP3 remains stable and outperforms DP3 by up to 31\\% under heavy clutter. The code is publicly available at https://github.com/zhangzhongbo2213/Attention-DP3.', 'score': 4, 'issue_id': 3275, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'e5d908701ad57dfa', 'authors': ['Changbo Yan', 'Zhongbo Zhang', 'Zaibin Zhang', 'Yifan Wang', 'Lijun Wang', 'Huchuan Lu'], 'affiliations': ['Dalian University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.13318.jpg', 'data': {'categories': ['#diffusion', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Внимание к объектам — ключ к стабильности диффузионных политик в хаотичных сценах', 'desc': 'Статья представляет Attention-DP3 — улучшенный метод для 3D политик диффузии в задачах манипуляции роботов. Основная идея заключается в использовании внимания (attention) для внедрения геометрических признаков на уровне объектов, что помогает модели лучше фокусироваться на целевых объектах в сложных сценах с частичной окклюзией и визуально похожими отвлекающими элементами. Метод использует открытый словарь для 2D сегментации RGB-изображений и затем преобразует полученные маски в 3D пространство с помощью калибровки камеры. Авторы вводят три дополняющих поля внимания: поле целевого объекта, поле значимости внутри целевого объекта и поле фона для подавления помех, что обеспечивает стабильную работу даже в условиях сильной загруженности сцены.'}, 'en': {'title': 'Enhancing 3D Diffusion with Attention for Cluttered Environments', 'desc': 'Attention-DP3 is a novel 3D diffusion policy that enhances performance in cluttered environments by integrating object-level geometric information through an attention mechanism. Traditional 3D diffusion methods struggle with occluded or similar-looking objects, leading to localization challenges. This approach utilizes open-vocabulary 2D segmentation to create 3D object masks, which are then used to inform the diffusion process. By employing Tri-field Attentional Conditioning, Attention-DP3 effectively distinguishes target objects from distractors, resulting in significant performance improvements in complex scenes.'}, 'zh': {'title': 'Attention-DP3：在复杂环境中稳定3D扩散策略的创新', 'desc': 'Attention-DP3是一种改进的3D扩散策略，通过注意力机制注入物体级几何线索，以在复杂环境中稳定性能。该方法解决了在目标物体被遮挡或与相似干扰物混合时，标准3D扩散策略难以定位和利用任务相关几何信息的问题。Attention-DP3保持DP3扩散框架不变，采用开放词汇的2D分割技术，将预测的目标掩膜提升到3D空间，获取物体中心的几何先验。实验结果表明，Attention-DP3在多个基准测试中表现优异，尤其在干扰物增加时，性能显著优于传统的DP3。'}}}, {'id': 'https://huggingface.co/papers/2609.13498', 'title': 'Building a Production Greek-English Speech Recognizer', 'url': 'https://huggingface.co/papers/2609.13498', 'abstract': 'Abstract A production bilingual Greek-English speech recognition system was engineered through iterative training, data filtering, ablation studies, and model ensembling to meet strict quality gates and achieve competitive benchmark results.  Generated by thinkingmachines/Inkling-Small We report a multi-month engineering program to build Sophea, a production bilingual Greek-English automatic speech recognition system. We evaluate the system against nine production gates covering Greek and English word error rate, language identification, and hallucinations on non-speech audio. Across twenty-three training iterations and two model architectures, no training-data composition passed all nine gates simultaneously. Meeting the Greek noisy-environment target required about 1,500 steps of dense domain exposure, while preserving English language identification tolerated only about 250 steps, or about 1,250 with a rebalanced mix that reduced Greek accuracy. We describe a six-stage data pipeline in which calibrating an audio-quality filter against in-domain anchors reduced the discarded share of scored Greek audio from 98.7 percent to 10.6 percent. A pre-registered ablation isolated a hallucination defect to one training-data package. A three-model ROVER ensemble increased gate coverage from 4-7 of 9 for individual models to 9 of 9 and reduced overlapping-speech WER from 53.35 percent to 37.87 percent, a 29 percent relative improvement. A separate learned per-clip arbiter over two models is listed as sophea/asr-k1 (preview) on the public Open ASR Leaderboard, with 4.26 percent average WER across eight public English test sets, and reaches 25.88 percent WER on live Greek noisy-environment traffic. We also document five cases in which a measurement tool produced a plausible but incorrect result and seven substantial approaches that were evaluated but not shipped. No model weights or training data are released; we report methodology and quantitative results only.', 'score': 3, 'issue_id': 3276, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '56d1d7af8437e149', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#data', '#hallucinations', '#multilingual', '#low_resource', '#open_source', '#benchmark', '#audio'], 'emoji': '🎙️', 'ru': {'title': 'От экспериментов к продакшену: многомодельный ансамбль для надёжного двуязычного распознавания речи', 'desc': 'В статье описывается разработка Sophea — производственной системы автоматического распознавания речи для греческого и английского языков. Авторы применили итеративное обучение, фильтрацию данных и проверку архитектур, чтобы пройти девять строгих производственных критериев качества, включая снижение ошибок распознавания, идентификацию языков и подавление галлюцинаций. Ключевым решением стал ансамбль из трёх моделей ROVER, который значительно улучшил качество работы на перекрывающейся речи и достиг полного соответствия всем требованиям. Система демонстрирует, что для достижения высокого качества в производстве требуется комплексный инженерный подход, включающий тщательную калибровку фильтров данных и ансамблевые методы.'}, 'en': {'title': 'Sophea: Achieving Bilingual ASR Excellence through Iterative Engineering', 'desc': "This paper presents the development of Sophea, a bilingual Greek-English automatic speech recognition (ASR) system that underwent extensive iterative training and evaluation. The system was rigorously tested against nine production quality gates, focusing on metrics like word error rate and language identification. A sophisticated data pipeline was implemented to enhance audio quality and reduce noise, significantly improving the system's performance. The final model ensemble achieved a remarkable increase in accuracy, demonstrating the effectiveness of combining multiple models to meet stringent operational standards."}, 'zh': {'title': '双语语音识别系统的成功之路', 'desc': '本文介绍了一个双语希腊语-英语的自动语音识别系统Sophea的开发过程。通过迭代训练、数据过滤和模型集成，该系统在多个质量标准下表现出色。研究表明，系统在不同的训练数据组合下，无法同时通过所有九个质量门槛。最终，采用三模型ROVER集成方法，使得系统的性能显著提升，错误率大幅降低。'}}}, {'id': 'https://huggingface.co/papers/2609.13058', 'title': 'Expert-Space Exploration in MoE Reinforcement Learning', 'url': 'https://huggingface.co/papers/2609.13058', 'abstract': 'Abstract ESRL improves reinforcement learning for mixture-of-experts language models by exploring expert routing with anchored high-confidence experts, entropy-adaptive perturbation, and path replay to boost rollout diversity and training performance.  Generated by thinkingmachines/Inkling-Small Reinforcement learning (RL) has become central to post-training of large language models. Recent advances in RL for Mixture-of-Experts (MoE) models have primarily focused on improving optimization stability and training efficiency, while treating the expert selection as a fixed component. Since routing determines the sparse computation paths that induce output distributions, expert selection offers an additional source of rollout diversity. Through empirical analysis, we find that perturbing expert routing effectively alters model output and increases rollout diversity, which is similar to increasing the decoding temperature. However, direct perturbation can activate unsuitable experts and substantially degrade rollout quality. Motivated by these observations, we introduce Expert-Space Exploration Reinforcement Learning (ESRL), an architecture-aware framework that explicitly explores the expert-routing space of MoE models. ESRL preserves high-confidence experts as anchors, and restricts stochastic routing to a plausible candidate pool, thereby retaining reliable computation paths. The perturbation strength is further adapted according to router entropy to avoid over-perturbation. To mitigate the routing mismatch introduced by perturbation, ESRL records the expert paths used during rollout and replays them during policy optimization. Experiments demonstrate that ESRL achieves the best performance across MoE backbones with top-K, top-1, and shared-expert routing, as well as across mathematics, science, and code tasks without additional sampling or computational cost. Specifically, ESRL on Qwen3-30B-A3B achieves the best among all compared methods, improving average Pass@1 and Pass@8 over GRPO by 3.2 and 4.5 percentage points, respectively. Further analyses of expert utilization and training dynamics provide insights into how exploiting MoE-specific routing structure benefits RL training.', 'score': 3, 'issue_id': 3276, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '4c16315de638a533', 'authors': ['Hongyi He', 'Zhenghao Lin', 'Xiao Liu', 'Peng Cheng', 'Yan Lu', 'Yeyun Gong'], 'affiliations': ['Microsoft Research', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.13058.jpg', 'data': {'categories': ['#training', '#architecture', '#rl', '#reasoning', '#science', '#optimization'], 'emoji': '🧭', 'ru': {'title': 'Исследование пространства маршрутизации экспертов для усиленного обучения языковых моделей', 'desc': 'В этой работе предлагается ESRL — фреймворк для улучшения обучения с подкреплением в языковых моделях типа mixture-of-experts. Основная идея заключается в исследовании пространства маршрутизации экспертов: система сохраняет надежных экспертов как опорные точки и ограничивает стохастическую маршрутизацию правдоподобным набором кандидатов. Сила возмущения адаптивно настраивается в зависимости от энтропии маршрутизатора, а пути экспертов, использованные при сборе данных, воспроизводятся во время оптимизации политики. Экспериментальные результаты показывают значительное улучшение производительности на математических, научных и программистских задачах без дополнительных вычислительных затрат.'}, 'en': {'title': 'Boosting Expert Routing in Reinforcement Learning for Language Models', 'desc': 'The paper presents Expert-Space Exploration Reinforcement Learning (ESRL), a novel approach to enhance reinforcement learning in mixture-of-experts (MoE) language models. ESRL focuses on improving expert routing by using high-confidence experts as anchors and adapting perturbation strength based on router entropy. This method increases rollout diversity while maintaining the quality of expert selection, avoiding the pitfalls of random perturbation. Experimental results show that ESRL significantly outperforms existing methods in various tasks, demonstrating its effectiveness in optimizing MoE models without incurring additional computational costs.'}, 'zh': {'title': '专家路由优化，提升强化学习表现', 'desc': 'ESRL（专家空间探索强化学习）通过探索专家路由来改进混合专家语言模型的强化学习。该方法保留高置信度的专家作为锚点，并限制随机路由在合理候选池中，从而保持可靠的计算路径。通过适应性调整扰动强度，ESRL避免了过度扰动带来的问题，并在策略优化中重放专家路径以减轻路由不匹配。实验结果表明，ESRL在多种任务中表现优异，显著提高了模型的训练性能和输出多样性。'}}}, {'id': 'https://huggingface.co/papers/2609.15078', 'title': 'Enabling Creative Exploration for Vibe Design Agents', 'url': 'https://huggingface.co/papers/2609.15078', 'abstract': 'Abstract Separating design exploration from code generation via structured intermediate specifications enables diverse UI alternatives without altering downstream generation settings.  Generated by thinkingmachines/Inkling-Small Vibe design agents turn natural-language briefs into rendered interfaces and frontend code. Yet a useful design agent should do more than produce one valid page: it should help users explore coherent alternatives. Increasing token-level temperature is a blunt solution because it varies aesthetic decisions and syntax-sensitive code at the same time. We instead separate exploration from implementation through an inference architecture that makes design direction an explicit intermediate decision. Inspired by Verbalized Sampling, a pre-pass proposes structured design specifications with typicality scores, an external selector samples one, and the downstream generator realizes the selected specification together with the original request under fixed settings. We apply this approach to UI themes and visual-asset prompts. Across 168 prompts, with 1,255 paired comparisons per temperature for each intervention, theme sampling broadens observed selection coverage and screenshot variation, while LLM-judge preferences vary across interventions, prompt complexity, and viewport. In an online experiment with more than 300,000 tasks, the observed code-export increase remains statistically uncertain, while fewer negative feedback events coexist with more correction interactions and modest operational costs. Together, these findings identify structured design specifications as a practical control point for exploring alternative UI concepts while keeping downstream generation settings fixed.', 'score': 2, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '3d2a47e982893eae', 'authors': ['Yifan Zhang', 'Nghi D. Q. Bui', 'Georgios Evangelopoulos', 'Arnaud Benard'], 'affiliations': ['Google'], 'pdf_title_img': 'assets/pdf/title_img/2609.15078.jpg', 'data': {'categories': ['#agents', '#inference', '#multimodal'], 'emoji': '🎨', 'ru': {'title': 'Структурированные промежуточные спецификации для исследования дизайна без изменения настроек генератора', 'desc': 'В статье предлагается новый подход к генерации пользовательских интерфейсов, который разделяет процесс исследования дизайна от процесса генерации кода через использование структурированных промежуточных спецификаций. Вместо простого увеличения температуры выборки (которое влияет на все аспекты одновременно), авторы используют двухэтапную архитектуру: сначала генерируются варианты дизайна со специальными оценками типичности, затем внешний селектор выбирает один из них, и наконец генератор реализует выбранную спецификацию. Эксперименты на 168 промптах показывают, что такой подход значительно расширяет разнообразие генерируемых интерфейсов и их вариаций, позволяя пользователям эффективнее исследовать альтернативные дизайн-концепции. Полученные результаты демонстрируют, что структурированные дизайн-спецификации являются практическим инструментом для контроля качества и разнообразия при генерации UI без изменения параметров финального генератора.'}, 'en': {'title': 'Empowering UI Design Exploration with Structured Specifications', 'desc': 'This paper presents a method for improving user interface (UI) design exploration by separating the design process from code generation. It introduces a structured intermediate specification that allows for the generation of diverse UI alternatives without changing the underlying code generation settings. The approach uses an inference architecture to explicitly define design directions, enabling a more coherent exploration of design options. The results show that this method enhances selection coverage and variation in UI themes while maintaining consistent operational costs and reducing negative feedback.'}, 'zh': {'title': '结构化设计规范：探索多样化UI概念的关键', 'desc': '本论文提出了一种通过结构化中间规范将设计探索与代码生成分开的方法，以便在不改变下游生成设置的情况下实现多样化的用户界面（UI）选择。我们使用思维机器的Inkling-Small Vibe设计代理，将自然语言简报转化为渲染的界面和前端代码。该设计代理不仅要生成有效的页面，还应帮助用户探索一致的替代方案。通过将设计方向作为明确的中间决策，我们的推理架构使得设计探索与实现分离，从而提高了用户界面的设计灵活性。'}}}, {'id': 'https://huggingface.co/papers/2609.13053', 'title': 'Dynin-Robotics: Omnimodal Unified Diffusion Vision-Language-Action Model', 'url': 'https://huggingface.co/papers/2609.13053', 'abstract': 'Abstract A shared trajectory model unifies goal and dynamics prediction with action generation for language-conditioned robot control, improving adaptation and success through joint denoising and test-time scaling.  Generated by thinkingmachines/Inkling-Small Visual goal and dynamics prediction can provide language-conditioned robot policies with both a target outcome and a representation of action-dependent scene changes. We bring these predictions into action generation and selection through a shared trajectory model. Dynin-Robotics implements this formulation on Dynin-Omni, an omnimodal masked-diffusion backbone, representing language, visual observations, goals, and actions as discrete tokens. By varying conditioning and target spans, the same model learns action prediction, action-conditioned next-observation prediction, terminal goal-state prediction, and trajectory-to-instruction reconstruction. These interfaces support test-time scaling through goal prediction, action-candidate evaluation, and joint refinement of action and future-state predictions. We continually pretrain the model on approximately 1.33 million trajectories from 48 Open X-Embodiment datasets and adapt it separately to downstream domains. On two VLABench tasks, robot pretraining improves adaptation within a fixed Stage-2 step budget, and the full objective mixture improves shifted-instruction success over Policy-only post-training under the same coupled decoder. Combining goal guidance with joint action-next-state denoising further improves shifted-instruction success over action-only decoding; the benefit depends on how the predictions are composed. Dynin-Robotics achieves competitive performance on LIBERO and zero-shot LIBERO-Plus, together with a 78.4% average success rate across four manipulation conditions on a Franka Research 3 robot. An optimized block-parallel implementation accelerates model-side action decoding by up to 29.2x relative to the base implementation under the reported profiling setup. These results support shared trajectory modeling as a common interface for learning complementary robot objectives and composing their predictions during control.', 'score': 2, 'issue_id': 3277, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': 'a4c470a5db264b41', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#dataset', '#robotics', '#architecture', '#diffusion', '#training', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Единая траекторная модель для управления роботом через язык и композицию предсказаний', 'desc': 'В работе предложена единая модель траектории, которая объединяет предсказание целей, динамики сцены и генерацию действий для управления роботом на естественном языке. Модель основана на маскированной диффузии и представляет язык, визуальные наблюдения, цели и действия как дискретные токены, позволяя обучаться множеству задач в единой архитектуре. Авторы предварительно обучают модель на 1,33 миллионах траекторий из 48 датасетов Open X-Embodiment и адаптируют её к различным доменам с использованием композиции предсказаний во время инференса. Результаты показывают конкурентную производительность на бенчмарках LIBERO и успешную адаптацию к физическому роботу Franka Research 3 с достижением 78,4% успешности.'}, 'en': {'title': 'Unifying Goals and Actions for Smarter Robot Control', 'desc': "This paper presents a shared trajectory model that integrates goal prediction, dynamics prediction, and action generation for controlling robots using language instructions. By utilizing a masked-diffusion backbone, the model processes various inputs like language, visual data, and goals as discrete tokens, enabling it to predict actions and future states effectively. The model is pretrained on a large dataset of trajectories and demonstrates improved adaptation and success rates in robot tasks through joint denoising and scaling techniques. The results indicate that combining goal guidance with action predictions enhances the robot's performance in complex manipulation scenarios."}, 'zh': {'title': '共享轨迹模型：提升机器人控制的成功率', 'desc': '这篇论文提出了一种共享轨迹模型，将目标预测、动态预测与基于语言的机器人控制中的动作生成结合在一起。通过联合去噪和测试时缩放，该模型提高了机器人适应性和成功率。模型在处理语言、视觉观察、目标和动作时，将它们表示为离散的标记，并通过不同的条件和目标范围学习多种预测任务。实验结果表明，该模型在多个任务上表现出色，尤其是在机器人操作的成功率上有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2609.13948', 'title': 'Thought without systematicity? Evaluating reasoning models on rule induction tasks', 'url': 'https://huggingface.co/papers/2609.13948', 'abstract': 'Abstract Reasoning models frequently fail on structurally equivalent task variants, indicating a lack of systematicity in their cognitive abilities.  Generated by thinkingmachines/Inkling-Small A central tenet of human cognition is systematicity, the principle that understanding one concept is inherently tied to understanding close variations of that concept. Do reasoning models robustly exhibit such systematicity? If so, we would expect consistent performance on structurally equivalent variants of the same task. Here, we extend established rule induction tasks from cognitive science to assess the systematicity of thought in current reasoning models. Each task family has compositional structure that we use to create structurally equivalent task variations through task isomorphisms such as recombination and substitution. We find that despite being able to correctly solve a task, models often fail on structurally equivalent variants of the same task. These findings suggest that many model behaviors lack systematicity, rendering it difficult to robustly establish the cognitive abilities of reasoning models beyond the particular contexts they were evaluated in.', 'score': 1, 'issue_id': 3277, 'pub_date': '2026-09-12', 'pub_date_card': {'ru': '12 сентября', 'en': 'September 12', 'zh': '9月12日'}, 'hash': 'd6428c9bebc21bc7', 'authors': ['Simon Schug', 'Brenden M. Lake'], 'affiliations': ['Princeton University'], 'pdf_title_img': 'assets/pdf/title_img/2609.13948.jpg', 'data': {'categories': [], 'emoji': '🧩', 'ru': {'title': 'Модели рассуждения не обладают систематичностью человеческого мышления', 'desc': 'Исследование показывает, что модели рассуждения часто не демонстрируют систематичность — ключевой принцип человеческого мышления, при котором понимание одной концепции связано с пониманием её вариаций. Авторы расширили классические задачи индукции правил из когнитивной науки, создав структурно эквивалентные варианты через изоморфизмы, такие как рекомбинация и подстановка. Несмотря на способность решать исходную задачу, модели часто ошибаются на структурно идентичных вариантах, что указывает на отсутствие систематичности в их поведении. Эти результаты подчёркивают, что способности моделей рассуждения не могут быть надёжно оценены за пределами конкретных контекстов обучения.'}, 'en': {'title': 'Testing Systematicity in Reasoning Models', 'desc': 'This paper investigates the concept of systematicity in machine learning reasoning models, which refers to the ability to apply learned knowledge to similar tasks. The authors extend traditional rule induction tasks to create structurally equivalent variants, testing whether models can maintain consistent performance across these variations. The results reveal that many reasoning models, while capable of solving specific tasks, struggle with these equivalent forms, indicating a lack of systematicity in their cognitive processes. This limitation suggests that the cognitive abilities of these models may not generalize well beyond the specific scenarios they were trained on.'}, 'zh': {'title': '推理模型的系统性缺失', 'desc': '这篇论文探讨了推理模型在结构等价任务变体上的表现，发现它们常常缺乏系统性。系统性是人类认知的一个核心原则，意味着理解一个概念与理解其相似变体是紧密相关的。研究表明，尽管模型能够正确解决某个任务，但在结构等价的任务变体上却常常失败。这表明许多模型的行为缺乏系统性，使得我们难以在特定评估上下结论，推理模型的认知能力可能不够稳健。'}}}, {'id': 'https://huggingface.co/papers/2609.15635', 'title': 'ModaLens: Measuring Image Sensitivity in Report-Conditioned Medical VLMs', 'url': 'https://huggingface.co/papers/2609.15635', 'abstract': "Abstract A paired image-swap audit reveals that report availability substantially reduces vision-language model sensitivity to image changes in radiology question answering.  Generated by thinkingmachines/Inkling-Small A radiology report can already answer a clinical question, so it is hard to tell whether a vision-language model also uses the image. ModaLens, a paired image-swap audit, measures how report availability changes image sensitivity: MedGemma-27B on 3,199 paired MIMIC-CXR cases from 293 patients, all 14 questions per case (13 finding-specific and one composite), each image replaced by one from another study, usually of the same patient, with question and report fixed. Under an explicit answer instruction, the model's generated answer changes on 4.26 percent of trials with the report and 20.94 percent without it, a paired increase of 16.7 points (patient-clustered 95 percent CI 15.6 to 17.7), so report availability reduces image-swap sensitivity under this protocol; the original prompt with a lowercase first-token readout gives 4.70 percent against 17.07 percent, and substitutions also move continuous answer scores where the binary prediction does not change. The labels are derived from reports, which limits conclusions about visual correctness; the direction replicates in two further model lineages. Code, the exact prompts and a run record for every number are at https://github.com/criticaldata/MODALENS.", 'score': 0, 'issue_id': 3277, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '0c44bec93802346b', 'authors': ['Sebastián Andrés Cajas Ordóñez', 'Maximin Lange', 'Quang Bui', 'Anqi Peter Li', 'Felipe Ocampo Osorio', 'Rafi Al Attrach', 'Kushul Reddy Palakala', 'Sahil Kapadia', 'Zakaria Laouabdia Sellami', 'Xinyue Zhang', 'Ashley Zhang', 'Leo Anthony Celi'], 'affiliations': ['American International', 'Beth Israel', 'Collingwood School', 'Deaconess Medical Center', 'Kings College London', 'MIT Critical Data, Massachusetts Institute of Technology', 'Motork', 'School Vienna Neuroscience, University of North Carolina at Chapel Hill', 'School of Computing, University of North Florida', 'Substrate Labs'], 'pdf_title_img': 'assets/pdf/title_img/2609.15635.jpg', 'data': {'categories': ['#dataset', '#healthcare', '#benchmark', '#multimodal'], 'emoji': '\U0001fa7b', 'ru': {'title': 'Когда текст побеждает изображение: как отчеты ослабляют зрение моделей', 'desc': 'В этой работе авторы разработали метод ModaLens для проверки того, насколько модели зрения и языка действительно используют медицинские изображения при ответе на вопросы по рентгенологии. Исследование показало, что когда доступен медицинский отчет, модель MedGemma-27B гораздо меньше полагается на анализ самого изображения — чувствительность к замене изображений снизилась с 20,94% до 4,26%. Авторы провели парный аудит на 3199 случаях из датасета MIMIC-CXR, заменяя изображения на другие исследования и фиксируя вопрос и отчет, чтобы измерить влияние каждого компонента. Результаты демонстрируют, что доступность текстовых отчетов существенно снижает зависимость моделей от визуальной информации, что важно для понимания надежности мультимодальных систем в медицине.'}, 'en': {'title': 'Reports Reduce Model Sensitivity to Image Changes', 'desc': "This paper investigates how the availability of radiology reports affects the sensitivity of vision-language models to changes in medical images during question answering tasks. Using a method called ModaLens, the authors conducted a paired image-swap audit on a dataset of radiology cases to measure the impact of report availability on model performance. The results show that when reports are available, the model's answers change less frequently compared to when reports are not available, indicating that the model relies more on the report than the image. This study highlights the importance of understanding the interplay between textual and visual information in medical AI applications."}, 'zh': {'title': '报告可用性降低模型对图像变化的敏感性', 'desc': '这篇论文探讨了放射学报告的可用性如何影响视觉-语言模型对图像变化的敏感性。通过配对图像交换审计，研究发现当报告可用时，模型对图像变化的反应显著降低。具体来说，在有报告的情况下，模型的答案变化率为4.26%，而没有报告时则为20.94%。这表明，报告的存在使得模型在回答放射学问题时更依赖于文本而非图像。'}}}, {'id': 'https://huggingface.co/papers/2609.14302', 'title': 'E2A-Bench: Benchmarking Evidence-to-Action Reliability in Financial Chart Reasoning', 'url': 'https://huggingface.co/papers/2609.14302', 'abstract': 'Abstract A benchmark for financial chart reasoning reveals that vision-language models often fail to maintain traceable evidence-to-action reliability, highlighting the need to evaluate the full reasoning chain rather than single hallucination scores.  Generated by thinkingmachines/Inkling-Small Can financial vision-language models (VLMs) turn chart evidence into reliable action recommendations? Existing hallucination evaluations are mostly claim-centric; they assess whether generated statements are supported, but not whether evidence remains traceable through rationale, confidence, and final action. We introduce E2A-Bench, a 969-query benchmark for financial chart reasoning, constructed from 323 HS300 constituents under three input modalities with deterministic OHLCV-derived evidence anchors. E2A-Bench evaluates grounding, reasoning-action consistency, evidence-confidence calibration, and directional coverage through UCR, RCI, ECI, and NDR, where NDR measures coverage-aware evidence-to-action reliability rather than realized trading performance. Evaluating 20 VLMs reveals three failures hidden by scalar hallucination scores: the lowest-UCR model ranks near the bottom by NDR due to only 6.4% directional coverage; oracle-aided verification reduces unsupported claims but can collapse coverage; and financial fine-tuning amplifies the BUY:SELL ratio by factors of 4.21 to 4.68 across strict base-fine-tuned pairs. These results show that financial VLM evaluation should trace the full evidence-to-action chain rather than rely on a single hallucination score. Code and data: https://github.com/wanng-ide/E2A-Bench', 'score': 0, 'issue_id': 3277, 'pub_date': '2026-09-13', 'pub_date_card': {'ru': '13 сентября', 'en': 'September 13', 'zh': '9月13日'}, 'hash': '2c416f9c5a1458ed', 'authors': ['Xiaoya Wang', 'Yutong Xu', 'Junjie Wang'], 'affiliations': ['Jinan University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.14302.jpg', 'data': {'categories': ['#cv', '#benchmark', '#multimodal'], 'emoji': '📊', 'ru': {'title': 'Полная цепь рассуждений важнее одной метрики галлюцинаций', 'desc': 'В работе представлен бенчмарк E2A-Bench для оценки способности мультимодальных моделей визуального восприятия и языка анализировать финансовые графики и преобразовывать доказательства в надёжные рекомендации действий. Авторы показывают, что традиционные метрики галлюцинаций скрывают критические проблемы в цепочке рассуждений модели: отсутствие прослеживаемости связи между доказательством, уверенностью и итоговым действием. Предложенный бенчмарк включает 969 запросов с детерминированными якорями доказательств и оценивает полную цепь «доказательство-к-действию» через четыре метрики, включая NDR, которая измеряет надёжность с учётом покрытия направлений. Эксперименты с 20 моделями выявили скрытые ошибки в финансовых VLM: низкая согласованность между рассуждениями и действиями, проблемы калибровки уверенности и дисбаланс в распределении прогнозов при дообучении на финансовых данных.'}, 'en': {'title': 'Evaluating Financial VLMs: Beyond Hallucination Scores', 'desc': 'This paper introduces E2A-Bench, a new benchmark designed to evaluate the reasoning capabilities of financial vision-language models (VLMs) when interpreting chart data. It emphasizes the importance of assessing the entire reasoning process, rather than just focusing on individual hallucination scores, to ensure that actions taken based on evidence are reliable and traceable. The benchmark includes various metrics to measure grounding, consistency between reasoning and actions, and the calibration of evidence confidence. The findings reveal significant shortcomings in current VLMs, highlighting the need for a more comprehensive evaluation approach in financial contexts.'}, 'zh': {'title': '追踪证据到行动的完整链条', 'desc': '这篇论文提出了一个金融图表推理的基准测试，揭示了视觉语言模型在证据到行动的可靠性方面存在问题。现有的评估方法主要关注生成声明是否有支持，但未能评估证据是否在推理过程中保持可追溯性。我们引入了E2A-Bench，这是一个包含969个查询的基准，旨在评估金融图表推理的完整推理链。研究结果表明，金融视觉语言模型的评估应关注证据到行动的完整链条，而不仅仅依赖单一的幻觉评分。'}}}, {'id': 'https://huggingface.co/papers/2609.01430', 'title': 'Learning Sparse Decision Trees via Transformer Variational Auto-Encoders', 'url': 'https://huggingface.co/papers/2609.01430', 'abstract': 'Abstract TREVIS learns decision trees by optimizing continuous latent representations via a tree transformer variational autoencoder to jointly improve predictive accuracy and structural sparsity.  Generated by thinkingmachines/Inkling-Small Decision trees are among the most widely used models in machine learning, largely due to their transparent decision logic, making them well-suited for high-stakes decision-making contexts. However, most existing learning algorithms focus on predictive performance, overlooking the joint optimization of other desirable properties, such as structural sparsity. In this work we propose TREVIS, an approach for learning decision trees with respect to complex objectives, based on the exploration of the latent space of a Tree Transformer Variational Auto-Encoder (TTVAE). By mapping decision trees onto latent representations, TREVIS replaces the discrete search space with a continuous one, enabling gradient-based optimization via a differentiable surrogate model. We experiment with TREVIS for learning decision trees that jointly optimize predictive performance and sparsity. Results show that TREVIS discovers decision trees matching the predictive performance of existing near-optimal algorithms while improving their structural sparsity.', 'score': 0, 'issue_id': 3277, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '53003d3cf792dd6c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🌳', 'ru': {'title': 'Деревья решений через непрерывное пространство: оптимизация точности и разреженности', 'desc': 'TREVIS — это новый метод обучения деревьев решений, который использует вариационный автокодировщик на основе трансформера для отображения деревьев в непрерывное латентное пространство. Вместо дискретного поиска по пространству деревьев, метод применяет градиентную оптимизацию через дифференцируемую суррогатную модель, что позволяет одновременно оптимизировать предсказательную точность и структурную разреженность. Экспериментальные результаты демонстрируют, что TREVIS находит деревья решений, которые достигают производительности существующих оптимальных алгоритмов, но при этом имеют значительно более компактную структуру. Такой подход особенно актуален для высокоответственных приложений машинного обучения, где требуется как интерпретируемость, так и эффективность модели.'}, 'en': {'title': 'Optimizing Decision Trees for Accuracy and Sparsity with TREVIS', 'desc': 'TREVIS is a novel approach for learning decision trees that enhances both predictive accuracy and structural sparsity. It utilizes a Tree Transformer Variational Auto-Encoder (TTVAE) to explore the latent space, allowing for continuous optimization instead of traditional discrete methods. This enables the use of gradient-based techniques to refine decision trees, making them more efficient and interpretable. Experimental results demonstrate that TREVIS achieves comparable predictive performance to existing algorithms while significantly improving the sparsity of the resulting trees.'}, 'zh': {'title': 'TREVIS：优化决策树的创新方法', 'desc': 'TREVIS是一种通过优化连续潜在表示来学习决策树的方法，使用树变换器变分自编码器（TTVAE）来共同提高预测准确性和结构稀疏性。决策树因其透明的决策逻辑而广泛应用于机器学习，尤其适合高风险决策场景。现有的学习算法通常只关注预测性能，而忽视了其他重要特性，如结构稀疏性。TREVIS通过将决策树映射到潜在表示，替代了离散搜索空间，允许通过可微分的替代模型进行基于梯度的优化。'}}}];

            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-15 14:02',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-15 14:02')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-15 14:02')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
