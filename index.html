a: https://github.com/yonghongzhang-io/ARGUS', 'score': 2, 'issue_id': 3346, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '4cfbb6572dedf9e8', 'authors': ['Yonghong Zhang', 'Yong Xie', 'Isabel M. Parra', 'Ricardo Correia'], 'affiliations': ['Department of Finance, Universidad Autónoma de Madrid, Madrid, Spain', 'Spanish National Research Council (CSIC), Madrid, Spain'], 'pdf_title_img': 'assets/pdf/title_img/2609.30867.jpg', 'data': {'categories': ['#science'], 'emoji': '🔍', 'ru': {'title': 'Автоматическая проверка предположений в причинно-следственных исследованиях', 'desc': 'Авторы представляют ARGUS — систему на основе языковой модели для проверки предположений в исследованиях метода разности разностей, который широко применяется при оценке климатической политики. Система анализирует опубликованные доказательства по одиннадцати критериям и воздерживается от оценки, если не находит релевантные свидетельства. На контрольном наборе с внедренными ошибками ARGUS обнаруживает 73% дефектов, значительно превосходя ключевой подход на 18%. Система генерирует отчёты о риске с указанием источников, помогая экспертам выявить слабые места в аргументации без суждения о причинно-следственных связях.'}, 'en': {'title': 'ARGUS: Enhancing Evidence Assessment in Climate Policy Studies', 'desc': 'This paper presents ARGUS, a machine learning pipeline designed to audit the assumptions behind Difference-in-Differences (DID) studies in climate policy evaluation. ARGUS uses a structured approach to assess evidence based on an eleven-dimensional rubric, allowing it to identify potential flaws in the reported evidence. The system demonstrates a significant improvement in flaw detection compared to traditional keyword-based methods, achieving a 73% detection rate. Additionally, ARGUS provides risk assessments that highlight areas needing expert review, while refraining from making causal claims, thus ensuring a more reliable evaluation process.'}, 'zh': {'title': 'ARGUS：提升气候政策评估的证据审计工具', 'desc': '本文介绍了一种名为ARGUS的结构化语言模型管道，用于审计气候政策评估中的差异中的差异（DID）研究。ARGUS通过一个包含十一维假设-影响-证据标准的框架，评估报告的证据，并在无法检索到相关证据时选择不作判断。实验结果显示，ARGUS在检测注入缺陷方面的准确率为73%，而基于关键词的管道仅为18%。ARGUS能够提供与证据相关的风险报告，帮助专家识别潜在的弱点，而不对因果关系进行裁定。'}}}, {'id': 'https://huggingface.co/papers/2609.31002', 'title': 'ZooWork-ShopRanker: An Open, Preference-Aligned E-Commerce Reranker', 'url': 'https://huggingface.co/papers/2609.31002', 'abstract': 'Abstract  Open rerankers trained for general web retrieval transfer imperfectly to e-commerce, where ranking decisions depend not only on topical relevance but also on user preferences, product constraints, and comparative product fit. These preference signals are difficult to supervise at scale: real search traffic provides authentic queries and candidates but no clean pairwise labels. We present ZooWork-ShopRanker, a family of e-commerce rerankers (0.6B, 4B, and 8B) aligned to judge-labeled shopping preference. Training pairs are labeled by a panel of reasoning large language models (LLMs) from different families acting as a preference oracle, with position-debiased judgments and agreement tiers, and the rerankers are trained on these labels. The aligned 8B flagship then serves as a distillation teacher for the efficient 4B and 0.6B models, which are fit to its scores and sharpened on judged pairs. To measure progress, we introduce ShopRank-Bench, a contamination-limited benchmark of ~10,000 private-traffic preference pairs in both text formats, tiered by how many judge families committed to each label. ZooWork-ShopRanker-8B and -4B significantly outperform the strongest open reranker baseline, every model significantly beats its own un-aligned base, and ZooWork-ShopRanker-0.6B beats its size peer; the gains hold in both formats and extend to common MTEB benchmarks. We release the models and the dual-format ShopRank-Bench to facilitate further research.', 'score': 2, 'issue_id': 3345, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '7b909b4cdc7a6cc6', 'pdf_title_img': 'assets/pdf/title_img/2609.31002.jpg', 'data': {'categories': ['#transfer_learning', '#alignment', '#small_models', '#training', '#multimodal', '#dataset', '#benchmark', '#open_source'], 'emoji': '🛒', 'ru': {'title': 'Переранжирование с предпочтениями: LLM-размеченные модели для умного поиска товаров', 'desc': 'В работе представлена семья моделей переранжирования для e-commerce под названием ZooWork-ShopRanker, которые учитывают не только релевантность, но и предпочтения пользователей и характеристики товаров. Для обучения используется инновационный подход: панель LLM из разных семейств выступает в роли оракула предпочтений и автоматически размечает пары товаров без предвзятости по позиции. Модели размером 0.6B, 4B и 8B обучаются на этих размеченных данных, причём меньшие модели дистиллируются из старшей 8B модели. Авторы также представили ShopRank-Bench — бенчмарк с ~10,000 пар предпочтений из реального трафика, и продемонстрировали значительное улучшение над открытыми базовыми моделями.'}, 'en': {'title': 'Enhancing E-commerce Ranking with User Preferences', 'desc': 'This paper introduces ZooWork-ShopRanker, a set of e-commerce rerankers designed to improve product ranking by incorporating user preferences and product constraints. Traditional web retrieval models struggle in e-commerce due to the lack of clean pairwise labels for training, as real search traffic does not provide clear preferences. The authors propose using large language models as preference oracles to generate labeled training pairs, which helps in aligning the rerankers with actual shopping preferences. The results show that the ZooWork-ShopRanker models significantly outperform existing open rerankers, demonstrating their effectiveness in both text formats and on established benchmarks.'}, 'zh': {'title': '电商重排序的新突破', 'desc': '这篇论文介绍了一种新的电商重排序模型ZooWork-ShopRanker，旨在解决电商搜索中的排名问题。传统的网页检索模型在电商中表现不佳，因为电商排名不仅依赖于主题相关性，还受到用户偏好和产品限制的影响。为了训练这些模型，研究者使用了大型语言模型（LLMs）作为偏好评判的来源，生成了成对的标签数据。实验结果表明，ZooWork-ShopRanker在多个基准测试中显著优于现有的开放重排序模型，展示了其在电商领域的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.28660', 'title': 'Morphometric Imitation: From Morphology and Contact Aware Hand Retargeting to Sim-to-Real Visuomotor Policy', 'url': 'https://huggingface.co/papers/2609.28660', 'abstract': 'Abstract  Human hand-object interactions (HOIs) provide a rich source of demonstrations for dexterous manipulation, but learning directly from them presents challenges in bridging morphology gaps, ensuring dynamical feasibility, and sim-to-real deployment. We present Morphometric Imitation, a three-stage framework that transforms reconstructed HOIs into zero-shot sim-to-real visuomotor policies. First, morphometric optimization (MMO) kinematically retargets human motion across hand morphologies while preserving demonstrated contacts. Second, residual reinforcement learning (RL) refines the kinematic reference using object pose and contact information from the human motion to produce dynamically feasible robot demonstrations. Third, these demonstrations are distilled into visuomotor policies. Across three robot hands and ten HOIs, MMO improves contact F1 over the strongest of five baselines by at least 8 points for every hand, while also improving the success rate of downstream dynamic retargeting by as much as 35 points. Ablations on the residual RL show complementary benefits from using object pose and contact information. Finally, the visuomotor policies achieve 89.3% zero-shot success in 300 real-world trials on 30 objects. Project page: https://morphometricimitation.github.io{this https URL}', 'score': 2, 'issue_id': 3344, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '72320598eee2467c', 'pdf_title_img': 'assets/pdf/title_img/2609.28660.jpg', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'От человеческих жестов к роботизированной ловкости через морфометрический перенос', 'desc': 'В работе предлагается фреймворк Morphometric Imitation для преобразования видеозаписей взаимодействия человека с объектами в политики управления роботизированными руками. Метод состоит из трёх этапов: морфометрическая оптимизация для кинематического переноса движений между разными морфологиями рук с сохранением контактов, обучение с подкреплением для обеспечения динамической реализуемости движений робота, и дистилляция полученных траекторий в визуомоторные политики. Подход обеспечивает значительное улучшение качества переноса контактов и успешности динамического переноса движений на всех протестированных роботизированных руках. Полученные визуомоторные политики достигают 89.3% успеха в реальных экспериментах без каких-либо адаптаций к конкретным объектам.'}, 'en': {'title': 'Transforming Human Motion for Robotic Dexterity', 'desc': 'This paper introduces Morphometric Imitation, a framework designed to learn from human hand-object interactions (HOIs) for robotic manipulation. It consists of three stages: first, morphometric optimization (MMO) adapts human motion to different hand shapes while keeping the same contact points. Next, residual reinforcement learning (RL) fine-tunes these motions to ensure they are dynamically feasible for robots. Finally, the refined demonstrations are converted into visuomotor policies, achieving high success rates in real-world applications.'}, 'zh': {'title': '形态模仿：从人手交互到机器人运动的桥梁', 'desc': '本文提出了一种名为形态模仿的三阶段框架，用于将重建的人手物体交互（HOIs）转化为零-shot的仿真到现实的视觉运动策略。首先，通过形态优化（MMO）在保持接触的同时，针对不同手部形态对人类运动进行运动学重定向。其次，利用残差强化学习（RL）结合物体姿态和接触信息，优化运动学参考，生成动态可行的机器人演示。最后，这些演示被提炼为视觉运动策略，在300个真实世界试验中实现了89.3%的零-shot成功率。'}}}, {'id': 'https://huggingface.co/papers/2609.28327', 'title': 'LightMIS: Ultra-Lightweight Medical Image Segmentation Without a Stage-Wise Decoder', 'url': 'https://huggingface.co/papers/2609.28327', 'abstract': 'Abstract  We present LightMIS, a scalable family of ultra-lightweight convolutional networks for 2D binary medical image segmentation without a learned stage-wise decoder. LightMIS aligns the outputs of a five-level encoder to a common resolution using Scale-Aligned Projection blocks, aggregates them once, and refines the fused representation with an Adaptive Fusion Cascade. The cascade combines Adaptive Kernel Fusion with the proposed Progressive Receptive Fusion module, which uses temporary channel expansion, complementary depthwise receptive fields, and progressive cross-branch information transfer. We evaluate LightMIS-T, LightMIS-S, and LightMIS using five-fold cross-validation under a common nnU-Net v2.3.1 protocol on DRIVE, Kvasir-SEG, DSB18, BUSI, ISIC-2017, and ISIC-2018. Full LightMIS contains 0.131 M parameters and requires 0.575 GFLOPs for a 3times256times256 input, achieving modality-macro Dice and IoU scores of 86.71% and 78.99%, respectively. Mobile U-ViT obtains 86.75% Dice and 79.07% IoU, so the observed differences are 0.04 and 0.08 percentage points. Relative to Mobile U-ViT, nnWNet, and nnU-Net, LightMIS reduces parameter count by 90.58-99.61% and GFLOPs by 82.54-96.14%. On an Arm Mali-G52 MC2 GPU, all LightMIS variants achieve full GPU delegation, with median delegated latency ranging from 53.31 ms for LightMIS-T to 138.31 ms for LightMIS. These results demonstrate a favorable accuracy-complexity trade-off and on-device execution feasibility for the evaluated tasks. The code is publicly available at https://github.com/AndreiiArhire/LightMIS.', 'score': 1, 'issue_id': 3346, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '6928b7501d324737', 'authors': ['Andrei Arhire', 'Mihaela-Elena Breabăn', 'Radu Timofte'], 'affiliations': ['Computer Vision Lab, CAIDAS & IFI University of Wurzburg, Germany', 'Faculty of Computer Science Alexandru Ioan Cuza University of Iasi'], 'pdf_title_img': 'assets/pdf/title_img/2609.28327.jpg', 'data': {'categories': ['#architecture', '#small_models', '#cv', '#inference', '#healthcare'], 'emoji': '📱', 'ru': {'title': 'Легкие сети для медицинской сегментации на мобильных устройствах', 'desc': 'Авторы представляют LightMIS — семейство ультралегких сверточных сетей для бинарной сегментации медицинских изображений, работающих без обученного декодера. Архитектура использует блоки Scale-Aligned Projection для выравнивания выходов пятиуровневого энкодера и Adaptive Fusion Cascade для уточнения объединённого представления. Модель достигает качества сегментации 86.71% по метрике Dice при всего 0.131 млн параметров и 0.575 GFLOPs, сохраняя производительность сравнимую с более крупными моделями. Сеть успешно выполняется на мобильных GPU устройствах с приемлемой латентностью, демонстрируя практичность для развёртывания на периферийных устройствах.'}, 'en': {'title': 'LightMIS: Efficient Medical Image Segmentation with Minimal Complexity', 'desc': 'LightMIS is a new type of lightweight convolutional network designed for segmenting 2D binary medical images without needing a complex decoder. It uses a five-level encoder that aligns outputs to a common resolution and refines the results through an Adaptive Fusion Cascade, which enhances the combined data using advanced techniques like Adaptive Kernel Fusion. The network is efficient, with significantly fewer parameters and lower computational requirements compared to existing models, making it suitable for on-device applications. Evaluation on multiple medical image datasets shows that LightMIS achieves competitive accuracy while maintaining a low complexity, demonstrating its potential for practical use in medical imaging tasks.'}, 'zh': {'title': 'LightMIS：高效的医学图像分割网络', 'desc': '本文介绍了一种名为LightMIS的超轻量级卷积网络系列，专门用于2D二元医学图像分割。LightMIS通过Scale-Aligned Projection模块将五层编码器的输出对齐到共同的分辨率，并使用自适应融合级联来优化融合后的表示。该级联结合了自适应核融合和渐进感受野融合模块，利用临时通道扩展和互补的深度感受野进行信息传递。实验结果表明，LightMIS在参数数量和计算复杂度上相较于其他模型有显著减少，同时在医学图像分割任务中表现出良好的准确性和可执行性。'}}}, {'id': 'https://huggingface.co/papers/2609.31291', 'title': 'Softmax Reparameterization for Output-Head Quantization', 'url': 'https://huggingface.co/papers/2609.31291', 'abstract': "Abstract  Large vocabularies make output heads a substantial inference cost in small language models. We propose softmax reparameterization, a post-training method that selects a functionally equivalent output head before quantization. The method subtracts a scalar multiple of the vocabulary-row mean from every output row and selects the coefficient by validation KL separately for RTN, activation-weighted MSE, and full-Hessian GPTQ. This one-dimensional search includes the original head and fixed mean-centering, preserves the full-precision softmax distribution, and leaves the trained decoder unchanged; a rank-one correction handles nonlinear logit paths such as soft-capping. Across seven heads, W4 gains concentrate where baseline quantization substantially distorts predictions: on Phi-4-mini, AW-MSE KL falls from 0.936 to 0.256. The gains survive stronger GPTQ calibration and remain complementary to exact per-channel scaling and affine quantization. Across four heads and three W4 quantizers, frozen WikiText-selected coefficients also transfer to C4 and OpenWebMath, outperforming mean-centering in all 18 comparisons where the frozen coefficient differs from 1 and matching it in the remaining six. At W2, used as a compression stress test, benefits broaden across nearly the full model--quantizer matrix. Matched residual analysis shows that improved fidelity can accompany greater logit reconstruction error while reducing the residual's Fisher-weighted cost. For shift-compatible heads, reparameterization adds no inference operation and preserves packed W4 execution: with the decoder held in BF16, quantizing the Phi output head reduces batch-one generation latency by 10.8% relative to the BF16-head baseline.", 'score': 1, 'issue_id': 3346, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '0ff01ae1c017a825', 'authors': ['Asim Kadav', 'Christian Flores', 'Chirag Arora', 'Varun Kotte', 'Hongbo Zheng', 'Lan Yan', 'Priya Shanmugasundaram', 'Tracy Holloway King'], 'affiliations': ['Adobe SDC'], 'pdf_title_img': 'assets/pdf/title_img/2609.31291.jpg', 'data': {'categories': ['#small_models', '#inference', '#training'], 'emoji': '⚡', 'ru': {'title': 'Оптимизация выходного слоя через функционально эквивалентную переработку перед квантизацией', 'desc': 'Авторы предлагают метод переработки выходного слоя (softmax reparameterization) для малых языковых моделей, который снижает вычислительные затраты при квантизации. Метод заключается в вычитании скалярного множества среднего значения строк словаря из каждой строки выходной матрицы, с выбором коэффициента через валидацию KL. Рeparameterization совместим с различными методами квантизации (RTN, activation-weighted MSE, GPTQ) и не требует изменения обученного декодера, сохраняя при этом распределение softmax полной точности. Экспериментальные результаты показывают значительное улучшение качества при 4-битной квантизации с сохранением производительности и возможностью переноса найденных коэффициентов между разными датасетами.'}, 'en': {'title': 'Optimizing Language Models with Softmax Reparameterization', 'desc': 'This paper introduces a method called softmax reparameterization to improve the efficiency of small language models with large vocabularies. The technique involves adjusting the output head of the model post-training by subtracting a mean value from the output rows, which helps maintain the softmax distribution while reducing inference costs. The authors demonstrate that this method significantly reduces prediction distortion during quantization, leading to better performance across various datasets. Additionally, the approach is shown to enhance model fidelity without increasing inference time, making it a valuable tool for optimizing language model outputs.'}, 'zh': {'title': '优化小型语言模型的推理效率', 'desc': '本论文提出了一种名为软最大重参数化的方法，旨在降低小型语言模型中大词汇量带来的推理成本。该方法在量化之前选择一个功能上等效的输出头，通过从每个输出行中减去词汇行均值的标量倍数来实现。实验结果表明，该方法在多个量化器上均能显著提高模型的预测准确性，并且在不同数据集上表现出良好的迁移能力。最终，重参数化方法不仅减少了推理延迟，还保持了模型的高效执行。'}}}, {'id': 'https://huggingface.co/papers/2609.29474', 'title': 'CodeGraph: Open-Taxonomy Knowledge Graph for Source Code with Wikidata Grounding', 'url': 'https://huggingface.co/papers/2609.29474', 'abstract': 'Abstract  Public software repositories, like GitHub and Software Heritage Archive, store billions of files, yet extracting their implicit engineering knowledge ---i.e., the algorithms they implement, the paradigms they follow, the patterns they instantiate, and the application domains they serve--- remains challenging, as current tools are constrained to syntactic and token-level analysis. We present a pipeline for building an open-taxonomy semantic annotation of source code using a code-specialised Large Language Model. The extracted entities are grounded in Wikidata through a three-stage linking procedure: a deterministic SPARQL stage handles unambiguous entities, a Deep Research Agent resolves the residual long tail, and a hierarchy-rollup stage imports the parent-of closure of each resolved Wikidata identifier. The resulting annotations are materialised as a source-code-specific open-taxonomy knowledge graph. We further introduce a calibrated quality-assurance protocol that quantifies annotation precision by combining a small human gold set with an LLM-as-a-judge filter. We applied our pipeline to the 167 million files of the Stack-Edu corpus, creating the first known large-scale open-taxonomy knowledge graph for source code. Our graph, named CodeGraph, contains approximately 158 million nodes, which include around 145 million files, about 63,000 extracted concept entities (such as algorithms, paradigms, design patterns, and application domains), and roughly 19,800 grounded Wikidata entities. Furthermore, CodeGraph features approximately 1 billion typed edges that connect files to their respective concepts, link these concepts to their grounded Wikidata identifiers, and relate them to their parent categories, covering 14 programming languages.', 'score': 1, 'issue_id': 3346, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '07c0648e739f8172', 'authors': ['Federico Pennino', 'Andrea Gurioli', 'Stefano Zacchiroli', 'Maurizio Gabbrielli', 'Paolo Ferragina'], 'affiliations': ['DISI Università di Bologna', 'LTCI Télécom Paris, Institut Polytechnique de Paris', 'SantAnna School of Advanced Studies', 'Università di Bologna'], 'pdf_title_img': 'assets/pdf/title_img/2609.29474.jpg', 'data': {'categories': ['#science', '#open_source'], 'emoji': '🕸️', 'ru': {'title': 'Семантический граф знаний для извлечения инженерных концепций из исходного кода', 'desc': 'В статье представлена система для автоматического семантического аннотирования исходного кода с использованием специализированной языковой модели, которая извлекает из репозиториев инженерные знания о реализованных алгоритмах, парадигмах и паттернах проектирования. Извлечённые сущности связываются с Wikidata через трёхэтапный процесс, включающий детерминированный SPARQL-запрос для однозначных сущностей, агент глубокого поиска для разрешения амбигуитетов и свёртку иерархии для импорта категорий. Для обеспечения качества аннотаций применяется откалиброванный протокол оценки, сочетающий небольшой золотой стандарт с LLM-судьёй. Результаты применения конвейера к 167 миллионам файлов создают CodeGraph — первый в своём роде крупномасштабный граф знаний открытой таксономии исходного кода с 158 миллионами узлов и 1 миллиардом типизированных рёбер.'}, 'en': {'title': 'Unlocking Software Knowledge with CodeGraph', 'desc': 'This paper presents a method for extracting and organizing knowledge from public software repositories using a specialized Large Language Model (LLM). The authors developed a pipeline that creates a semantic annotation of source code, linking extracted entities to Wikidata through a multi-stage process. The resulting knowledge graph, named CodeGraph, includes millions of nodes representing files, concepts, and their relationships across various programming languages. Additionally, a quality-assurance protocol is introduced to ensure the precision of the annotations, making this a significant advancement in understanding software engineering knowledge.'}, 'zh': {'title': '构建源代码的开放分类知识图谱', 'desc': '本论文介绍了一种利用专门针对代码的大型语言模型构建源代码开放分类语义注释的流程。该流程通过三阶段链接程序将提取的实体与Wikidata关联，确保注释的准确性。我们在167百万个Stack-Edu文件上应用了该流程，创建了第一个大规模的源代码开放分类知识图谱CodeGraph。该图谱包含约1.58亿个节点，涵盖了多种编程语言的算法、范式、设计模式等概念实体。'}}}, {'id': 'https://huggingface.co/papers/2608.09444', 'title': 'Depth-adaptive Inference of Looped Language Models via Continuous Depth Batching', 'url': 'https://huggingface.co/papers/2608.09444', 'abstract': 'Abstract  A main promise of looped language models is depth-adaptive inference. By looping a block of shared layers a variable number of times, the model can use less compute for "easy" tokens and more for "hard" ones. However, tokens with different numbers of loops cannot share a uniform forward pass and therefore cannot be handled by standard batching systems such as vLLM. The practical value of depth-adaptive inference thus hinges on whether batching can be made efficient. We introduce the first efficient method for depth-adaptive looped LMs via continuous depth batching (CDB), which forms new batches between loop steps. Our method dynamically schedules looped and non-looped parts of the architecture, manages looped KV-caching, and predicts which tokens will exit the loop in advance so it can prepare batches asynchronously. Experiments on Ouro 1.4B and Huginn 3.5B show that fully looped architectures are best suited to depth-adaptive inference, as large non-looped layers outside the recurrent core (e.g., token embedding, LM head, and unshared transformer blocks) slow down and complicate scheduling. Overall, CDB realizes up to 99% of the estimated maximum speedup available, leaving further gains primarily dependent on model architecture and exit behavior.', 'score': 1, 'issue_id': 3346, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': 'b7d742ab270a4bc7', 'authors': ['Kristian Schwethelm', 'Daniel Rueckert', 'Georgios Kaissis'], 'affiliations': ['Hasso Plattner Institute for Digital Engineering, University of Potsdam', 'Imperial College London', 'Munich Center for Machine Learning (MCML)', 'Technical University of Munich (TUM)'], 'pdf_title_img': 'assets/pdf/title_img/2608.09444.jpg', 'data': {'categories': ['#architecture', '#small_models', '#inference', '#training'], 'emoji': '⚡', 'ru': {'title': 'Эффективный адаптивный вывод циклических языковых моделей через динамическое батчирование', 'desc': 'В статье предложена первая эффективная методика для реализации адаптивного по глубине вывода в циклических языковых моделях через непрерывное батчинг по глубине (CDB). Этот подход переформирует батчи между итерациями цикла, динамически планирует выполнение циклических и нециклических компонентов архитектуры, управляет кешированием KV-пар и предсказывает выход токенов из цикла для асинхронной подготовки батчей. Экспериментальные результаты показывают, что полностью циклические архитектуры лучше всего подходят для адаптивного вывода, так как большие нециклические слои замедляют планирование. Метод CDB достигает до 99% максимально возможного ускорения, оставляя дальнейшие улучшения зависимыми от архитектуры модели и поведения выхода.'}, 'en': {'title': 'Efficient Depth-Adaptive Inference with Continuous Depth Batching', 'desc': 'This paper discusses a new method for improving the efficiency of looped language models through a technique called continuous depth batching (CDB). By allowing the model to adaptively loop over layers based on the complexity of tokens, it can allocate computational resources more effectively. The challenge addressed is how to batch tokens that require different numbers of loops, which traditional systems struggle with. The proposed CDB method enhances scheduling and caching, leading to significant speed improvements in processing language tasks.'}, 'zh': {'title': '深度自适应推理的新突破', 'desc': '这篇论文介绍了一种新的深度自适应推理方法，称为连续深度批处理（CDB），用于循环语言模型。通过循环共享层的不同次数，模型可以根据难易程度动态调整计算资源。CDB方法能够在循环步骤之间形成新的批次，从而提高批处理的效率。实验结果表明，完全循环的架构最适合深度自适应推理，能够实现接近99%的最大加速效果。'}}}, {'id': 'https://huggingface.co/papers/2604.02103', 'title': 'BoundInk: Boundary-Aware Online Handwriting Generation', 'url': 'https://huggingface.co/papers/2604.02103', 'abstract': 'Abstract  Realistic online handwriting depends not only on individual character shapes, but also on how a writer connects, spaces, and aligns adjacent characters. Existing methods rely primarily on long-range sequence modeling and capture these inter-character behaviors only implicitly. This often produces plausible glyphs accompanied by broken cursive joins, inconsistent spacing, or writer-inconsistent transitions. We introduce BoundInk, a writer-conditioned framework that treats inter-character boundaries as explicit generation units. By jointly modeling local transitions and surrounding text context, BoundInk preserves writer-specific glyph appearance while improving connectivity and spacing across complete text lines. We further introduce a boundary-aware evaluation framework that directly assesses cursive continuity and spatial relationships between characters beyond conventional trajectory similarity. Across three benchmark-matched settings, BoundInk improves all applicable boundary-quality measures and reduces normalized dynamic time warping by 17.6--47.8%. In blind human evaluations, BoundInk outputs are preferred in 78.0--82.6% of valid criterion-wise judgments.', 'score': 1, 'issue_id': 3346, 'pub_date': '2026-09-20', 'pub_date_card': {'ru': '20 сентября', 'en': 'September 20', 'zh': '9月20日'}, 'hash': 'dc01a7ec874509c8', 'authors': ['Jinsu Shin', 'Sungeun Hong', 'JinYeong Bak'], 'affiliations': ['Sungkyunkwan University, Suwon, Korea'], 'pdf_title_img': 'assets/pdf/title_img/2604.02103.jpg', 'data': {'categories': ['#benchmark', '#cv'], 'emoji': '✍️', 'ru': {'title': 'Явное моделирование границ между символами для реалистичной генерации рукописного текста', 'desc': 'В статье представляется BoundInk — фреймворк для генерации реалистичного рукописного текста, обусловленный индивидуальным стилем писателя. Основная инновация заключается в явном моделировании границ между символами как отдельных единиц генерации, что позволяет лучше сохранять связность букв и консистентность интервалов. Авторы предлагают новую систему оценки, которая прямо измеряет качество курсивных переходов и пространственные отношения между символами, выходя за рамки традиционных метрик сравнения траекторий. Экспериментальные результаты показывают значительное улучшение качества генерируемого текста: снижение динамического временного искажения на 17.6-47.8% и предпочтение человеческих оценивателей в 78-82.6% случаев.'}, 'en': {'title': 'BoundInk: Enhancing Handwriting with Explicit Character Connections', 'desc': 'This paper presents BoundInk, a new framework for generating realistic online handwriting that focuses on how characters connect and space out. Unlike previous methods that only model long sequences, BoundInk explicitly treats the boundaries between characters as key elements in the generation process. By considering both local transitions and the context of surrounding text, it maintains the unique style of the writer while enhancing the flow and spacing of the handwriting. The authors also introduce a new evaluation method that measures the quality of character connections and spacing, showing significant improvements over existing techniques.'}, 'zh': {'title': 'BoundInk：提升手写文本的连贯性与美观性', 'desc': '这篇论文介绍了一种名为BoundInk的框架，用于生成更真实的在线手写文本。该方法通过将字符之间的边界视为明确的生成单元，来改善字符连接、间距和对齐。BoundInk同时建模局部过渡和周围文本上下文，从而保持特定书写者的字形外观，并提高整行文本的连贯性和间距。研究还提出了一种边界感知的评估框架，直接评估字符之间的连贯性和空间关系，显著提高了边界质量指标。'}}}, {'id': 'https://huggingface.co/papers/2609.23551', 'title': 'Paragraph Boundaries Are Not White Space:Compression Depth as the Signature of Hierarchical Structure', 'url': 'https://huggingface.co/papers/2609.23551', 'abstract': "Abstract  Standard positional encodings represent position as a one-dimensional reading-order coordinate, but reading order alone does not determine hierarchical textual structure. We use a hierarchical rotary positional encoding (hRoPE) that represents paragraph, sentence, and token indices as separate channels, hold the token sequence fixed, intervene on the paragraph coordinate p1, and measure cross-paragraph attention with a token-distance-exact estimator. Attention is compressed relative to a token-distance-matched baseline in every corpus, but compression alone is not diagnostic of true structure: an architecturally identical channel with density-matched random labels is compressed too, more shallowly. What distinguishes real structure is the depth of compression, which is greater and corpus-dependent while the control's is not. Comparing eight corpus-only quantities across three constructs (lexical persistence, paragraph length, embedding-based coherence), none fully reproduces the cross-corpus ordering of depth, though embedding-based coherence comes closest. Compression depth, not its location, is the reproducible signature of genuine paragraph structure in our setting.", 'score': 1, 'issue_id': 3346, 'pub_date': '2026-09-20', 'pub_date_card': {'ru': '20 сентября', 'en': 'September 20', 'zh': '9月20日'}, 'hash': 'e07c09ecba59da1b', 'pdf_title_img': 'assets/pdf/title_img/2609.23551.jpg', 'data': {'categories': ['#interpretability'], 'emoji': '📚', 'ru': {'title': 'Глубина сжатия внимания как признак иерархической структуры текста', 'desc': 'В работе предложена иерархическая ротационная позиционная кодировка (hRoPE), которая представляет структуру текста через отдельные каналы для индексов абзацев, предложений и токенов. Авторы провели серию экспериментов, вмешиваясь в координаты абзацев и измеряя кросс-абзацное внимание, чтобы понять, как трансформеры воспринимают иерархическую структуру текста. Обнаружено, что подлинная текстовая структура отличается глубиной сжатия внимания, которая является зависимой от корпуса и воспроизводима, в отличие от случайного управления. Результаты показывают, что глубина сжатия внимания, а не его локализация, служит надежной сигнатурой реальной структуры абзацев.'}, 'en': {'title': 'Unveiling Text Structure with Hierarchical Rotary Positional Encoding', 'desc': 'This paper introduces a new method called hierarchical rotary positional encoding (hRoPE) to better capture the hierarchical structure of text. Unlike traditional positional encodings that only consider the order of words, hRoPE differentiates between paragraphs, sentences, and tokens. The authors demonstrate that the depth of attention compression is a key indicator of true textual structure, as it varies across different corpora. They also find that while some metrics attempt to measure coherence and structure, none fully replicate the depth of compression observed in genuine paragraph organization.'}, 'zh': {'title': '深度压缩揭示真实文本结构', 'desc': '这篇论文提出了一种层次旋转位置编码（hRoPE），用于更好地表示文本的层次结构。与传统的一维位置编码不同，hRoPE将段落、句子和词的索引作为不同的通道来处理。研究发现，真实的文本结构通过压缩深度来区分，而不是仅仅通过压缩程度。通过比较不同语料库的特征，论文指出压缩深度是识别段落结构的可靠标志。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (2)', '#agi', '#alignment (1)', '#architecture (5)', '#audio', '#benchmark (7)', '#cv (4)', '#data', '#dataset (4)', '#diffusion (2)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (4)', '#interpretability (1)', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (6)', '#open_source (5)', '#optimization (2)', '#plp', '#rag', '#reasoning (1)', '#rl (3)', '#rlhf', '#robotics (4)', '#science (3)', '#security', '#small_models (4)', '#story_generation', '#survey (1)', '#synthetic (1)', '#training (12)', '#transfer_learning (1)', '#video (3)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-28 17:55',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-28 17:55')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-28 17:55')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
