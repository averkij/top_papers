 {'title': 'Self-Scaling Benchmarks for Evolving Coding Challenges', 'desc': 'This paper discusses the limitations of static coding benchmarks in machine learning, where tasks can become outdated as they leak into training data. The authors propose a self-scaling benchmark called SWE-Duel, where tasks are generated at evaluation time, preventing prior knowledge from influencing results. In this setup, two coding agents take turns creating and reviewing code, with one agent introducing bugs that the other must identify and fix. The results show that newer models can create more challenging tasks, indicating that the difficulty of tasks can scale with the capabilities of the agents that create them.'}, 'zh': {'title': '自适应编码基准：智能体的挑战与评估', 'desc': '这篇论文提出了一种新的编码基准测试方法，称为SWE-Duel，旨在解决传统基准测试的局限性。该方法通过在评估时生成任务和测试，避免了任务泄露的问题，并且任务的难度由参与的智能体决定。论文中描述了两个编码智能体在对抗环境中相互评估的过程，其中一个智能体创建带有隐蔽错误的功能，另一个智能体则在不知道错误存在的情况下进行审查。实验结果显示，最新版本的智能体在创建任务的能力上优于旧版本，表明任务的难度与任务创建者的能力相关。'}}}, {'id': 'https://huggingface.co/papers/2610.13944', 'title': 'InstantFusion: A Shared Latent Interface for Heterogeneous Image Generators', 'url': 'https://huggingface.co/papers/2610.13944', 'abstract': 'Abstract  Diffusion/flow models have emerged as the de facto paradigms for image generation, giving rise to a diverse family of modern generators with increasingly heterogeneous architectures and representations. Despite their remarkable generation capabilities, the cross-model alignment of latent representations and the consistency of their underlying denoising dynamics remain underexplored. In this work, we uncover an intriguing cross-model compatibility: independently trained generators exhibit similar latent spatial organization, while directly handing off intermediate states between unaligned models can still preserve coarse visual content. Motivated by these observations, we propose InstantFusion, a lightweight shared latent interface that connects the denoising trajectories of heterogeneous image generators. Specifically, to enable flexible cross-model state translation, model-specific Latent AutoEncoders (LAEs) are introduced to project intermediate states from different generators into a shared latent space and decode them into the latent space of a target generator. This shared space is constrained by two complementary objectives: aligning intermediate states derived from the same image at matched noise levels and synchronizing their corresponding local denoising velocities. Once trained, InstantFusion allows denoising to seamlessly transition across frozen generators without requiring a dedicated mapping for every model pair. The versatility of InstantFusion is demonstrated across acceleration, multi-preference composition, cross-architecture on-policy distillation, and cross-model composition, achieving competitive performance across these diverse settings.', 'score': 18, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '757a317a34098269', 'authors': ['Xuanlang Dai', 'Jiazi Bu', 'Yujie Zhou', 'Yuhong Liu', 'Beichen Zhang', 'Penghui Yang', 'Ziyu Liu', 'Yuhang Zang'], 'affiliations': ['Fudan University', 'Shanghai AI Laboratory', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.13944.jpg', 'data': {'categories': ['#architecture', '#training', '#diffusion', '#cv'], 'emoji': '🔀', 'ru': {'title': 'Мост между генераторами: единое латентное пространство для диффузионных моделей', 'desc': 'В работе исследуется совместимость латентных представлений различных диффузионных моделей для генерации изображений. Авторы обнаруживают, что независимо обученные генераторы обладают схожей пространственной организацией скрытых состояний, что позволяет передавать информацию между моделями на промежуточных этапах денойзинга. Предложен метод InstantFusion с использованием модель-специфичных Latent AutoEncoders для проецирования промежуточных состояний в общее латентное пространство и их декодирования в целевую модель. Подход основан на двух целевых функциях: выравнивании промежуточных состояний с одинаковым уровнем шума и синхронизации локальных скоростей денойзинга, что позволяет гибко комбинировать замороженные генераторы.'}, 'en': {'title': 'Seamless Image Generation Across Models with InstantFusion', 'desc': 'This paper introduces InstantFusion, a novel method that connects different image generation models by creating a shared latent space. It reveals that independently trained generators can have similar latent structures, allowing for the transfer of visual content between them. InstantFusion uses Latent AutoEncoders to translate intermediate states from one model to another, ensuring that the denoising process remains consistent. This approach enables efficient collaboration between various generators without needing specific mappings for each model pair, showcasing its effectiveness in multiple applications.'}, 'zh': {'title': 'InstantFusion：连接多样化生成器的桥梁', 'desc': '扩散模型已成为图像生成的主要方法，产生了多种现代生成器。尽管这些生成器的生成能力很强，但它们之间的潜在表示对齐和去噪动态的一致性仍未得到充分研究。本文提出了InstantFusion，一个轻量级的共享潜在接口，连接不同图像生成器的去噪轨迹。通过引入特定模型的潜在自编码器，InstantFusion能够在共享潜在空间中灵活地转换不同生成器的中间状态，展示了在多种设置下的竞争性能。'}}}, {'id': 'https://huggingface.co/papers/2609.36641', 'title': 'Inducing Process Supervision from Outcome-Only Reinforcement Learning', 'url': 'https://huggingface.co/papers/2609.36641', 'abstract': 'Abstract  Process reward models (PRMs) have become a key component for LLMs, as their step-level feedback supports both post-training and test-time reasoning. However, training strong PRMs remains costly: human step annotation is difficult to scale, while Monte Carlo estimation is computationally expensive and can drift from the intrinsic correctness of steps. To get effective PRMs at low cost, we introduce TIPS (Thinking-Induced Process Supervision), an outcome-only reinforcement learning (RL) framework for training generative PRMs. In TIPS, the model generates a chain-of-thought (CoT) followed by step-level labels and an outcome label. The reward depends solely on whether the predicted outcome matches the ground truth, and the resulting group-relative advantage is used to optimize the entire generated response. Intuitively, when checking intermediate steps helps determine the outcome, more accurate checks can lead to better outcome judgments and higher rewards. Outcome-only RL can therefore reinforce step-level verification without explicit process supervision. We validate the effectiveness of TIPS across math and agent benchmarks and four backbone families. Notably, TIPS-Qwen3-4B-Thinking-2507 reaches 85.2 F1 on ProcessBench with only 3.2K outcome-labeled trajectories, surpassing all evaluated trained PRMs and strong prompt-only judges such as GPT-5.4-Instruct and Claude-4.7-Opus, while still trailing o1-mini. Code and data are available at https://github.com/RUCBM/TIPS.', 'score': 18, 'issue_id': 3399, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '3fc1c4d657be818b', 'authors': ['Shengda Fan', 'Xin Cong', 'Zhong Zhang', 'Haotian Chen', 'Yankai Lin'], 'affiliations': ['Renmin University of China', 'Shanghai Jiao Tong University', 'Tsinghua University', 'University of Electronic Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.36641.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#training', '#reasoning', '#math', '#rlhf', '#optimization', '#rl', '#open_source'], 'emoji': '🎯', 'ru': {'title': 'Обучение оценки промежуточных шагов только по финальному результату', 'desc': 'В статье предложен метод TIPS для обучения моделей вознаграждения процессов (PRM), которые оценивают корректность каждого шага решения в цепочке рассуждений. Вместо дорогостоящей разметки каждого шага человеком или вычислительно затратного Монте-Карло оценивания, авторы используют подкрепляющее обучение только с информацией о финальном результате. Модель генерирует цепочку рассуждений с промежуточными оценками шагов, и вознаграждение зависит только от совпадения предсказанного результата с эталоном. За счёт таких группо-относительных преимуществ система учится давать более точные оценки промежуточных шагов без явной разметки процесса. Экспериментально показано, что TIPS достигает сильных результатов на задачах математики и агентов, обучаясь на малом количестве примеров с разметкой только исходов.'}, 'en': {'title': 'TIPS: Efficient Training of Reward Models with Outcome-Only Learning', 'desc': 'This paper introduces TIPS, a novel framework for training Process Reward Models (PRMs) using outcome-only reinforcement learning. TIPS simplifies the training process by relying on the final outcome of generated responses rather than requiring detailed step-level annotations. The model generates a chain-of-thought and labels each step, but the reward is based solely on whether the final outcome matches the expected result. This approach allows for effective training of PRMs with fewer resources while achieving high performance on various benchmarks.'}, 'zh': {'title': '低成本高效训练过程奖励模型的创新方法', 'desc': '过程奖励模型（PRMs）在大型语言模型（LLMs）中扮演着重要角色，因为它们的逐步反馈支持后期训练和测试推理。然而，训练强大的PRMs成本高昂：人类逐步标注难以扩展，而蒙特卡洛估计计算量大且可能偏离步骤的内在正确性。为以低成本获得有效的PRMs，我们提出了TIPS（思维诱导过程监督），这是一种仅基于结果的强化学习框架，用于训练生成性PRMs。TIPS通过生成思维链（CoT）及其步骤标签和结果标签来优化整个生成响应，奖励仅依赖于预测结果与真实结果的匹配。'}}}, {'id': 'https://huggingface.co/papers/2610.13947', 'title': 'Towards Physically Grounded Articulated 3D Assets: A Multi-Agent Pipeline and Benchmark', 'url': 'https://huggingface.co/papers/2610.13947', 'abstract': 'Abstract  In this paper, we study physically grounded articulated 3D asset generation---moving the goal from reproducing how objects look to capturing how they move and function. Inspired by the literature on procedural and agentic generation, we present Artisan, a system that extends the latest method Articraft by introducing a multi-agent pipeline with physical simulation feedback, enabling comprehensive attributes beyond geometry, appearance, and physically plausible articulation, such as collision-free motion, stability under gravity, and accurate mass and material properties. Furthermore, we construct a unified benchmark spanning four key aspects: spatial fidelity, physical plausibility, downstream task performance, and overall quality. The benchmark encompasses 100 reference assets from ArtVIP and LightWheel, 50 stability prompts, and 50 ABO objects with reference masses, with protocols evaluating various metrics. Through extensive evaluation of more than 10 representative models, Artisan achieves competitive spatial fidelity while attaining the lowest collision rates and highest stability rates among the evaluated methods. Together, our system and benchmark establish insights for advancing 3D generation towards physically plausible, functionally usable assets.', 'score': 18, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '6845702b7fc6e7ef', 'authors': ['Xudong Cai', 'Ruijie Zhu', 'Haoliang Shang', 'Ruining Li', 'Marc Pollefeys', 'Shangzhe Wu', 'Andrea Vedaldi', 'Chuanxia Zheng'], 'affiliations': ['ETH Zurich', 'Microsoft', 'Nanyang Technological University', 'University of Cambridge', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2610.13947.jpg', 'data': {'categories': ['#benchmark', '#3d', '#dataset', '#agents'], 'emoji': '🤖', 'ru': {'title': 'От внешности к функциональности: физически правдоподобная генерация трёхмерных объектов с движением', 'desc': 'В статье представлена система Artisan для генерации трёхмерных сочленённых объектов, которая фокусируется не только на внешнем виде, но и на физически корректном движении и функциональности. Система расширяет метод Articraft, используя многоагентный конвейер с обратной связью от физического симулятора, что позволяет контролировать столкновения, устойчивость под действием гравитации и реалистичные параметры материалов. Авторы создали комплексный бенчмарк, оценивающий пространственную точность, физическую правдоподобность, производительность на прикладных задачах и общее качество моделей. Экспериментальная оценка более чем десяти моделей показывает, что Artisan достигает конкурентной пространственной точности при наименьшем количестве коллизий и наивысшей стабильности.'}, 'en': {'title': 'Crafting Realistic 3D Assets with Physical Intelligence', 'desc': 'This paper introduces Artisan, a new system for generating 3D assets that not only looks realistic but also behaves realistically in a physical environment. It builds on the previous method Articraft by incorporating a multi-agent pipeline that uses physical simulations to ensure that the generated objects can move and interact without collisions and maintain stability under gravity. The authors also present a comprehensive benchmark that evaluates the generated assets based on their spatial accuracy, physical behavior, and overall quality. Through rigorous testing, Artisan demonstrates superior performance in creating 3D models that are both visually appealing and functionally effective.'}, 'zh': {'title': '实现物理真实的3D资产生成', 'desc': '本文研究了基于物理的关节3D资产生成，目标是捕捉物体的运动和功能，而不仅仅是外观。我们提出了Artisan系统，通过引入多智能体管道和物理仿真反馈，扩展了最新的方法Articraft，使其能够生成更全面的属性，如无碰撞运动和在重力下的稳定性。我们构建了一个统一的基准，涵盖空间保真度、物理合理性、下游任务性能和整体质量等四个关键方面。经过对10多个代表性模型的广泛评估，Artisan在空间保真度方面表现出色，同时在碰撞率和稳定性方面也达到了最佳水平。'}}}, {'id': 'https://huggingface.co/papers/2610.11291', 'title': 'When Do We Need On-Policy Distillation? Distilling on Offline Student Rollouts Is Often Better', 'url': 'https://huggingface.co/papers/2610.11291', 'abstract': 'Abstract  On-policy distillation (OPD) has become increasingly popular for transferring teacher capabilities to student models. In this work, we ask a critical research question: Is on-policy sampling always beneficial for distilling arbitrary teacher-student pairs? We show that a simple alternative, Semi-OPD, which distills from offline rollouts generated by the initial student, can often outperform OPD in both accuracy and training efficiency. Across 17 teacher-student pairs ranging from 1.5B to 235B parameters, Semi-OPD outperforms OPD in 14 cases, with up to +13.6% accuracy and 11.4x training speedup. We further find that the choice between OPD and Semi-OPD depends on the alignment between the initial teacher and student, quantified by an output-token overlap ratio: OPD is beneficial only when the two are highly aligned with high overlap ratios. Our deeper investigation suggests that effective distillation requires on-policyness w.r.t. both the student and the teacher. For misaligned pairs, student rollouts can become increasingly off-policy w.r.t. the teacher as context length grows, weakening the distillation signal. In contrast, Semi-OPD is often more stable, as it distills on shorter contexts while covering full trajectories and exposing the student to more teacher-preferred tokens. Beyond proposing Semi-OPD as an efficient alternative, our work motivates the community to rethink when to use OPD and to study stronger OPD variants with meaningful teacher-student pairs.', 'score': 17, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'b5ab964f515b071d', 'pdf_title_img': 'assets/pdf/title_img/2610.11291.jpg', 'data': {'categories': ['#optimization', '#training', '#small_models', '#transfer_learning'], 'emoji': '🧑\u200d🎓', 'ru': {'title': 'Когда офлайн лучше, чем онлайн: переосмысление дистилляции языковых моделей', 'desc': 'В этой работе исследуется дистилляция знаний от больших языковых моделей к меньшим студентам, где авторы предлагают альтернативу популярному методу on-policy дистилляции (OPD). Semi-OPD использует офлайн данные, полученные от начальной студент-модели, вместо постоянной переыборки от учителя. Экспериментальные результаты на 17 парах учитель-студент показывают, что Semi-OPD часто превосходит OPD по точности (до 13.6% улучшения) и скорости обучения (ускорение в 11.4 раза). Авторы обнаруживают, что выбор метода зависит от выравнивания начальных распределений учителя и студента: OPD эффективен только при высокой схожести выходных токенов, тогда как Semi-OPD стабильнее на длинных контекстах для несогласованных пар.'}, 'en': {'title': 'Rethinking Distillation: Semi-OPD Outshines On-Policy Methods', 'desc': 'This paper explores the effectiveness of on-policy distillation (OPD) in transferring knowledge from teacher models to student models. The authors introduce a new method called Semi-OPD, which uses offline rollouts from the student to improve training efficiency and accuracy. They demonstrate that Semi-OPD outperforms OPD in many scenarios, particularly when the teacher and student models are not well aligned. The findings suggest that the choice between OPD and Semi-OPD should consider the alignment of the models, as misalignment can weaken the distillation process.'}, 'zh': {'title': '半在线策略蒸馏：更高效的选择', 'desc': '本文探讨了在教师-学生模型对中，是否总是使用在线策略蒸馏（OPD）是有益的。研究表明，半在线策略蒸馏（Semi-OPD）在许多情况下比OPD更有效，尤其是在准确性和训练效率上。通过对17对教师-学生模型的实验，发现Semi-OPD在14个案例中表现更佳，准确率提高了13.6%，训练速度提升了11.4倍。研究还发现，OPD的有效性依赖于教师和学生之间的对齐程度，而Semi-OPD在处理不对齐的模型对时更为稳定。'}}}, {'id': 'https://huggingface.co/papers/2610.05014', 'title': 'MetaKernelBench: Measuring GPU Kernel Knowledge Transfer Beyond Code', 'url': 'https://huggingface.co/papers/2610.05014', 'abstract': "Abstract  Recent GPU kernel optimization agents retain what they learn in knowledge bases or as distilled skills. Kernel benchmarks score each attempt's implementation for correctness and speed but leave the reuse value of retained experience unmeasured. We introduce MetaKernelBench, which measures whether experience distilled from an attempt in one kernel domain-specific language (DSL) improves a fresh attempt at the same problem in another. Its 74 problems are fused subgraphs in six families, each posed as a pair of CuTe DSL and TIRx variants that differ only in the DSL. The agent first attempts each variant solo and is instructed to distill what it learns into a natural-language skill, which is transferred whether or not the source attempt passes verification. The skill is the only extra input to a skill-conditioned attempt by the same model in the other DSL. We compare each skill-conditioned attempt with the solo attempt on the same variant under matched per-attempt budgets, scoring correctness and end-to-end runtime. Across six models and both directions, paired lift over solo attempts ranges from -19% to +29%. Four models gain in both directions, yet regressions occur on 16% to 45% of problems in every model and direction. Outcomes follow the source attempt's result relative to the target's solo attempt rather than source success alone, improving in 71% of comparisons when the source stands above and regressing in 54% when it stands below. MetaKernelBench complements implementation-quality metrics by measuring same-problem cross-DSL kernel knowledge transfer.", 'score': 16, 'issue_id': 3400, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'a0bf6cbc82e971ae', 'authors': ['Xueyi Chen', 'Shiyu Liu', 'Xin Jin', 'Yuhua Zheng', 'Xin Li', 'Haolei Bai', 'Junhan Zhu', 'Huan Wang'], 'affiliations': ['Shanghai Jiao Tong University', 'Westlake University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05014.jpg', 'data': {'categories': ['#optimization', '#transfer_learning'], 'emoji': '🔄', 'ru': {'title': 'Кроссплатформенная передача знаний между DSL в оптимизации GPU ядер', 'desc': 'В работе предложен новый бенчмарк MetaKernelBench для оценки передачи знаний между различными предметно-ориентированными языками (DSL) при оптимизации GPU ядер. Агент на основе языковой модели сначала решает задачу оптимизации ядра в одном DSL, затем дистиллирует полученное знание в навык на естественном языке и передаёт его при решении той же задачи в другом DSL. Исследование показывает, что качество передачи знания зависит не только от успеха исходной попытки, но и от её относительной производительности по сравнению с целевым вариантом. Результаты демонстрируют смешанные результаты: четыре из шести моделей улучшили производительность в обе стороны, но во всех моделях наблюдались регрессии на 16-45% задач.'}, 'en': {'title': 'Enhancing GPU Kernel Optimization through Cross-DSL Knowledge Transfer', 'desc': 'This paper presents MetaKernelBench, a tool designed to evaluate the transfer of knowledge between different domain-specific languages (DSLs) in GPU kernel optimization. It measures how well skills learned from one DSL can enhance performance in another DSL when solving the same problem. The study involves 74 benchmark problems and compares the performance of attempts conditioned on distilled skills against solo attempts. Results show that while some models benefit from this knowledge transfer, there are also instances of performance regression, highlighting the complexity of cross-DSL learning.'}, 'zh': {'title': '跨DSL知识转移的评估工具', 'desc': '本文介绍了一种新的工具MetaKernelBench，用于评估在不同领域特定语言（DSL）之间转移内核优化经验的效果。该工具通过比较在相同问题上使用不同DSL的尝试，来测量经验转移的价值。研究表明，尽管在某些情况下经验转移可以提高性能，但在16%到45%的问题上仍然会出现性能下降。MetaKernelBench为内核优化提供了新的评估标准，强调了跨DSL知识转移的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.09788', 'title': 'Judging in Latent Space: Efficient Generative Reward Modeling via Semantics-Preserving Compression', 'url': 'https://huggingface.co/papers/2610.09788', 'abstract': 'Abstract  Reward modeling often requires jointly representing and reasoning over multiple evaluation criteria, yet verbalizing this process token by token can incur substantial inference cost. Recent work on latent reasoning suggests that continuous states may support this computation more compactly. We introduce LatentGRM, a latent evaluation framework built on semantic chunking, compression, and reconstruction. By using the structure of rubric-guided evaluations to guide compression, LatentGRM learns compact continuous trajectories that support autonomous pairwise judgments without generating textual assessments. A separate interpreter reconstructs evaluation text from these trajectories, providing an offline view of the information retained under compression. Under matched training data and backbones, LatentGRM achieves competitive aggregate preference accuracy relative to explicit Supervised Fine-Tuning (SFT) judges at both 4B and 8B scales. Across four benchmark domains, LatentGRM-8B compresses evaluation trajectories by 8.9--9.2x and reduces total judge inference time by 6.1--7.0x at vote@5. Controlled rubric interventions show that criterion-dependent preference information is carried through the latent sequence. Together, these results demonstrate that continuous latent evaluation can substantially reduce inference cost while preserving competitive judgment quality.', 'score': 16, 'issue_id': 3399, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'a38f81077555eee3', 'authors': ['Mingqing Yuan', 'Xiaobo Liang', 'Junwei Yang', 'Ziwei Chen', 'Zeren Zhang', 'Hejin Wang', 'Yubin Wang', 'Juntao Li'], 'affiliations': ['Chalmers University of Technology', 'Peking University', 'Soochow University', 'The Hong Kong University of Science and Technology', 'Tsinghua University', 'University of Cambridge'], 'pdf_title_img': 'assets/pdf/title_img/2610.09788.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Скрытая оценка вместо явной генерации: эффективная система судейства через сжатие', 'desc': 'Авторы предлагают LatentGRM — фреймворк для оценки качества текста, который использует скрытые непрерывные представления вместо токен-по-токеновой генерации. Система основана на семантической фрагментации и сжатии информации, руководствуясь структурой критериев оценки. LatentGRM способна выносить суждения о предпочтениях между вариантами ответов без явной генерации текста, при этом отдельный интерпретатор может восстанавливать оценочный текст из сжатых траекторий. Метод достигает конкурентной точности при существенном снижении вычислительных затрат — сжимая последовательности оценок в 8.9-9.2 раза и сокращая время вывода в 6.1-7.0 раза.'}, 'en': {'title': 'Efficient Reward Modeling with LatentGRM', 'desc': 'This paper presents LatentGRM, a novel framework for reward modeling that focuses on efficiently representing multiple evaluation criteria. By utilizing latent reasoning and semantic chunking, it compresses the evaluation process into continuous trajectories, allowing for faster pairwise judgments without the need for extensive textual outputs. The framework achieves significant reductions in inference time and maintains high accuracy compared to traditional supervised fine-tuning methods. Overall, LatentGRM demonstrates that continuous latent evaluation can streamline the evaluation process while retaining essential preference information.'}, 'zh': {'title': '潜在评估框架：降低推理成本，提升判断质量', 'desc': '本论文介绍了一种名为LatentGRM的潜在评估框架，旨在通过语义分块、压缩和重构来提高评估效率。该框架利用评分标准的结构来指导压缩，从而学习出紧凑的连续轨迹，支持自主的成对判断，而无需生成文本评估。实验结果表明，LatentGRM在多个基准领域中显著压缩了评估轨迹，并减少了评审时间，同时保持了与显式监督微调（SFT）评审者相当的判断准确性。总的来说，LatentGRM展示了连续潜在评估在降低推理成本的同时，仍能保持竞争力的判断质量。'}}}, {'id': 'https://huggingface.co/papers/2610.12668', 'title': 'Recurrent Harness for Agentic Continual Learning', 'url': 'https://huggingface.co/papers/2610.12668', 'abstract': 'Abstract  Language model agents increasingly operate over long interaction streams, requiring online adaptation to distribution shifts through continual learning. However, existing agent harnesses typically either evolve their states only through forward information flow or rely on additional replay or validation data for harness optimization. To address this, we propose ReHarness, a recurrent harness framework for agentic continual learning that complements forward read and write with backward revision under a strictly online streaming protocol. We ask what information could have been captured differently in the harness state to better inform the current instance in the stream. Specifically, after each instance, we leverage the resulting trajectory as feedback to revise the reflections retrieved for that instance, thereby propagating feedback backward through the textual harness state. Across three continual learning benchmarks and three language model backbones, ReHarness consistently outperforms strong raw-context baselines, memory- and reflection-based methods, and prompt optimization approaches. Further analysis shows that ReHarness produces source-grounded and meaningful revisions, corrects overgeneralized or outdated experience under distribution shifts, and improves both stability and plasticity during continual learning.', 'score': 15, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'f1a4f51ffe8a094a', 'authors': ['Yuxin Xiao', 'Zhiyun Lu', 'Jianyu Wang', 'Yangtian Zhang', 'Yang Song', 'Qifan Wang', 'Bailin Wang'], 'affiliations': ['Massachusetts Institute of Technology', 'Meta MRS Research', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12668.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Обратная ревизия в памяти агента для онлайн-адаптации к смещениям распределения', 'desc': 'В статье предлагается ReHarness — фреймворк для обучения агентов на основе больших языковых моделей в условиях непрерывного обучения с адаптацией к смещениям распределения данных. Ключевая идея заключается в комбинировании прямого потока информации с обратной ревизией состояния агента: после каждого взаимодействия система переосмысляет ранее полученные отражения на основе траектории действий, что позволяет пропагировать обратную связь через текстовое состояние. Предложенный подход работает в строго online режиме без дополнительных данных для переобучения и валидации. Эксперименты показывают, что ReHarness превосходит базовые методы, основанные на контексте, памяти и рефлексии, при этом улучшая как устойчивость, так и пластичность модели при распределённых сдвигах.'}, 'en': {'title': 'ReHarness: Adapting Language Models with Backward Feedback for Continual Learning', 'desc': 'This paper introduces ReHarness, a new framework for continual learning in language model agents that allows them to adapt to changing information over time. Unlike traditional methods that only process information in one direction, ReHarness uses a recurrent approach that revises past information based on new feedback. This backward revision helps the model correct mistakes and update its knowledge more effectively. The results show that ReHarness outperforms existing methods in various benchmarks, demonstrating improved learning stability and adaptability.'}, 'zh': {'title': 'ReHarness：持续学习中的智能适应新方法', 'desc': '本论文提出了一种名为ReHarness的框架，用于增强语言模型在持续学习中的适应能力。该框架通过结合前向信息流和后向修正，允许模型在在线流式交互中不断调整其状态。ReHarness利用每个实例的反馈来修正之前的反思，从而在文本状态中向后传播信息。实验结果表明，ReHarness在多个持续学习基准测试中表现优于传统方法，能够有效应对分布变化带来的挑战。'}}}, {'id': 'https://huggingface.co/papers/2610.11993', 'title': 'DataVista: Diagnosing Multimodal LLMs on Data Video Understanding', 'url': 'https://huggingface.co/papers/2610.11993', 'abstract': 'Abstract  Data video is a media form that integrates data visualization with video narrative, widely adopted in news reporting and business analysis. Compared with general video understanding, data video understanding places greater emphasis on accurately reading data from animated charts, integrating evidence across charts and time, and understanding how narrative organization and visual design communicate information. Yet existing benchmarks target either general videos or static charts, and data video understanding has not been systematically evaluated. We present DataVista, the first benchmark for data video understanding, containing 961 real-world data videos and 6,775 evaluation questions organized under a three-level progressive capability framework (data perception, temporal reasoning, narrative understanding) with 10 fine-grained question types across five topic domains. Systematic evaluation of 19 mainstream MLLMs shows that the best-performing model, Gemini-3.1-Pro, achieves 70.0% overall accuracy, still far below human expert performance, with models performing worst on Causal Reasoning and Narrative Structure. Increasing frame counts and adding subtitles mainly benefit data perception and temporal reasoning, with limited gains in narrative understanding. Further analysis of model responses identifies typical failure modes in chart reading, evidence judgment, and instruction understanding. The benchmark is available at https://github.com/HKUSTDial/DataVista.', 'score': 13, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '8bd5fe203ee2ed84', 'authors': ['Yupeng Xie', 'Zhenyang Wang', 'Jiayi Zhu', 'Yinghao Tang', 'Zhouan Shen', 'Yiyu Chen', 'Yuyu Luo'], 'affiliations': ['The Hong Kong University of Science and Technology (Guangzhou)', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.11993.jpg', 'data': {'categories': ['#survey', '#video', '#dataset', '#benchmark', '#multimodal'], 'emoji': '📊', 'ru': {'title': 'Систематическая оценка понимания видеоданных через прогрессивный бенчмарк', 'desc': 'Авторы представляют DataVista — первый бенчмарк для оценки понимания видео с данными, которые сочетают визуализацию данных с видеонарративом. Бенчмарк содержит 961 видео из реальных источников и 6775 вопросов, организованных в трёхуровневую систему (восприятие данных, временное рассуждение, понимание нарратива). Экспериментальная оценка 19 современных MLLM показала, что лучшая модель достигает только 70% точности, что значительно ниже производительности человека-эксперта, особенно на задачах причинного вывода и анализа структуры повествования. Анализ выявил типичные ошибки моделей в чтении графиков, интеграции свидетельств и понимании инструкций.'}, 'en': {'title': 'Unlocking Insights from Data Videos with DataVista', 'desc': 'This paper introduces DataVista, a new benchmark designed specifically for understanding data videos, which combine data visualization with video narratives. Unlike traditional video analysis, data video understanding requires skills in reading animated charts, integrating information over time, and interpreting narrative structures. The benchmark includes 961 real-world data videos and 6,775 questions that assess three key capabilities: data perception, temporal reasoning, and narrative understanding. Evaluation of various machine learning models reveals that while the best model achieves 70% accuracy, it still lags behind human performance, particularly in areas like causal reasoning and narrative structure.'}, 'zh': {'title': '数据视频理解的首个基准测试', 'desc': '数据视频是一种将数据可视化与视频叙事相结合的媒体形式，广泛应用于新闻报道和商业分析。与一般视频理解相比，数据视频理解更注重从动态图表中准确读取数据，整合跨图表和时间的证据，以及理解叙事组织和视觉设计如何传达信息。现有的基准测试主要针对一般视频或静态图表，尚未对数据视频理解进行系统评估。我们提出了DataVista，这是第一个数据视频理解的基准，包含961个真实世界的数据视频和6775个评估问题，组织在一个三层次的能力框架下。'}}}, {'id': 'https://huggingface.co/papers/2610.06354', 'title': 'GraphDecisionBench: Benchmarking System One Models on Graph Tasks', 'url': 'https://huggingface.co/papers/2610.06354', 'abstract': "Abstract  Large language models (LLMs) are increasingly explored for graph understanding and decision-making, while System One models such as Jev select directly from supplied options. However, the capabilities of System One models on graph-related tasks remain unclear. We introduce GraphDecide, a model-independent benchmark that combines structural task profiles, matched graph-text input contrasts and heuristic-proposal controls to diagnose graph decision performance. We evaluate Jev and related choice-based models alongside language-model baselines, covering fourteen model-interface configurations. Jev's results illustrate the benchmark's central distinctions: accurate adjacency recognition does not guarantee broader structural correctness, joint graph-text input does not consistently improve prediction, and feasible construction does not establish high solution quality. Its task contracts, candidate interfaces and scoring rules support comparison across native selectors and language-model adapters. Code and aggregate results are available at https://github.com/VictorYXL/JevGraphBench.", 'score': 13, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '8fe1de5e95c0642c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#multimodal'], 'emoji': '🕸️', 'ru': {'title': 'Когда понимание графа недостаточно: диагностика реальных способностей моделей выбора', 'desc': 'В статье представлена новая бенчмарк-база GraphDecide для оценки способностей моделей выбора (System One) в решении задач на графах, которая дополняет существующие исследования больших языковых моделей. Авторы разработали методику с контрастными парами граф-текст входов и контролем эвристических предложений для диагностики качества принятия решений на графах. Через оценку четырнадцати конфигураций моделей авторы показали, что точное распознавание смежности не гарантирует правильность более сложных структурных свойств графа. Работа демонстрирует, что совместные граф-текстовые входы не всегда улучшают предсказания, и предоставляет открытый код для дальнейших исследований.'}, 'en': {'title': 'Evaluating Graph Decision-Making with GraphDecide', 'desc': 'This paper introduces GraphDecide, a benchmark designed to evaluate the performance of various models, including System One models like Jev, on graph-related decision-making tasks. It highlights the limitations of these models, showing that simply recognizing graph connections does not ensure overall structural accuracy. The study also reveals that combining graph and text inputs does not always enhance prediction quality. By providing a structured framework for comparison, GraphDecide aims to improve our understanding of how different models handle graph decision tasks.'}, 'zh': {'title': '图决策性能的新基准：GraphDecide', 'desc': '本文探讨了大型语言模型（LLMs）在图形理解和决策中的应用，特别是系统一模型（如Jev）在图相关任务中的表现。我们提出了GraphDecide，这是一个与模型无关的基准，旨在通过结构任务配置、匹配的图-文本输入对比和启发式提案控制来评估图决策性能。研究表明，Jev模型在图的邻接识别上表现准确，但并不保证整体结构的正确性，同时图-文本输入的联合使用并不总能提高预测效果。我们的基准支持不同选择器和语言模型适配器之间的比较，提供了代码和汇总结果。'}}}, {'id': 'https://huggingface.co/papers/2610.12939', 'title': 'Surfing the Activation Wave: Analyzing the Information and Geometry of LLM Hidden States for Speculative Decoding', 'url': 'https://huggingface.co/papers/2610.12939', 'abstract': 'Abstract  Decoder hidden states from different layers of large language models (LLMs) often encode complementary information. However, existing speculative decoding methods typically rely on a small set of target-model layers chosen using fixed, position-based heuristics. Selecting an optimal subset of layers is inherently a combinatorial problem, making exhaustive evaluation infeasible even for moderately deep models. In this work, we present a principled framework for multi-layer hidden-state selection for speculative decoding based on two complementary criteria: informativeness, measured through matrix-entropy analysis, and diversity, quantified using centered kernel alignment (CKA). We investigate layer-wise Shannon entropy, aggregate entropy under hidden-state concatenation, and pairwise CKA dynamics across depth, revealing distinct geometric and informational compartments within decoder representations. Motivated by these findings, we propose entropy and CKA-based layer selection algorithms that favor hidden-state sets that are both highly informative and minimally redundant. As part of this framework, we introduce token-entropy filtering, which removes hidden states associated with low predictive-entropy tokens, thereby improving the quality of layer-selection statistics. In EAGLE3-style speculative decoding, our selected sets outperform fixed baseline choices, including the default [2, N//2, N-3] rule, while providing a clearer explanation of why some defaults can remain competitive. Our results provide a practical recipe for multi-layer hidden-state selection for speculative decoding, insights into the geometry and information in LLM decoder states, and a foundation for extending similar analysis to related applications.', 'score': 12, 'issue_id': 3400, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'c6e55e92d368d4ff', 'authors': ['Raghavv Goel', 'Sudhanshu Agrawal', 'Mukul Gagrani', 'Risheek Garrepalli', 'Mingu Lee'], 'affiliations': ['Qualcomm AI Research', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12939.jpg', 'data': {'categories': ['#optimization', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Умный выбор слоев нейросети для быстрого декодирования', 'desc': 'В работе предложен принципиальный метод выбора скрытых состояний из разных слоев больших языковых моделей для спекулятивного декодирования. Авторы используют два дополняющих критерия: информативность, измеряемую через анализ энтропии матриц, и разнообразие, количественно оцениваемое с помощью центрированного выравнивания ядра (CKA). Предложены алгоритмы отбора слоев на основе энтропии и CKA, которые отдают предпочтение высокоинформативным и минимально избыточным наборам скрытых состояний. Введена фильтрация по энтропии токенов, которая улучшает качество статистики при выборе слоев и показывает лучшие результаты по сравнению с фиксированными эвристиками.'}, 'en': {'title': 'Optimizing Layer Selection for Enhanced Speculative Decoding in LLMs', 'desc': "This paper explores how different layers of large language models (LLMs) contain unique and useful information for decoding tasks. It introduces a new method for selecting which layers to use based on their informativeness and diversity, using techniques like matrix-entropy analysis and centered kernel alignment (CKA). The authors demonstrate that their approach leads to better performance in speculative decoding compared to traditional fixed-layer selection methods. Additionally, they provide insights into the structure of information within the model's hidden states, paving the way for future research in this area."}, 'zh': {'title': '优化多层隐藏状态选择，提升推测解码效果', 'desc': '本文探讨了大型语言模型（LLMs）中不同层的解码器隐藏状态所编码的互补信息。现有的推测解码方法通常依赖于固定的、基于位置的启发式选择少量目标模型层。我们提出了一种基于信息量和多样性两个互补标准的多层隐藏状态选择框架，以提高推测解码的效果。通过引入熵和CKA（中心核对齐）基础的层选择算法，我们能够选择出既信息丰富又冗余度低的隐藏状态集合，从而提升解码质量。'}}}, {'id': 'https://huggingface.co/papers/2609.39566', 'title': 'From Given to Gathered Evidence: Agentic Learning for Longitudinal Medical Reasoning', 'url': 'https://huggingface.co/papers/2609.39566', 'abstract': "Abstract  Foundation models can serve as clinical agents through tool-use harnesses. However, conventional medical benchmarks assess reasoning over preselected evidence rather than the ability to seek it across clinical records and longitudinal imaging. We propose CASE: a series of role-specific Clinical Agents for Seeking Evidence, together with a tool-use harness and an agentic post-training framework for compact vision-language policy models. We further introduce a longitudinal multimodal benchmark built on UK Biobank, comprising 50,401 clinical questions derived from real-world ICD-10-coded diagnoses of 4,739 participants. Each question links to a patient-specific environment containing clinical context and multi-sequence MRI from baseline and follow-up visits, where agents autonomously select which visits, organs, modalities, slices, and specialist tools to inspect and compare. Supervised fine-tuning transfers evidence-seeking workflows from 14,734 frontier-model interaction trajectories, followed by agentic reinforcement learning on the learner's own environment interactions. Privileged on-policy self-distillation and rubric-based LLM feedback refine evidence-to-conclusion reasoning without prescribing tool sequences. Experiments show that CASE moves beyond question-answer imitation toward transferable investigation policies, strengthening evidence-grounded longitudinal reasoning. Under matched evaluation conditions, our Qwen3-VL-8B based agent achieves over 16% and 10% relative improvements in answer accuracy over GPT-5.4 and Claude Opus 4.8. Code will be available at https://github.com/VinyehShaw/CASE.", 'score': 12, 'issue_id': 3400, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'daff3e232ce73354', 'authors': ['Minye Shao', 'Chaohui Yu', 'Yixuan Wu', 'Fan Wang', 'Ling Shao', 'Yang Long'], 'affiliations': ['DAMO Academy, Alibaba Group', 'Durham University', 'Hupan Laboratory', 'University of the Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2609.39566.jpg', 'data': {'categories': ['#open_source', '#training', '#rl', '#healthcare', '#agents', '#science', '#cv', '#dataset', '#reasoning', '#rlhf', '#benchmark', '#multimodal', '#transfer_learning'], 'emoji': '🏥', 'ru': {'title': 'Агенты для самостоятельного поиска клинических доказательств в продольных медицинских данных', 'desc': 'Работа представляет CASE — систему клинических агентов на основе foundation models, которые могут самостоятельно искать доказательства в медицинских записях пациентов. Авторы разработали специализированный harness для использования инструментов и framework постобучения агентов для компактных vision-language моделей. Они создали новый бенчмарк на основе UK Biobank с 50,401 клиническим вопросом, где агенты должны анализировать продольные данные МРИ и выбирать релевантные сроки обследования, органы и модальности. Модель обучается через supervised fine-tuning на траекториях взаимодействия frontier models и reinforcement learning, достигая значительного прироста точности ответов по сравнению с GPT и Claude.'}, 'en': {'title': 'Empowering Clinical Agents to Seek Evidence Autonomously', 'desc': "This paper introduces CASE, a framework designed to enhance clinical decision-making by enabling foundation models to autonomously seek evidence from clinical records and imaging data. Unlike traditional benchmarks that focus on reasoning with preselected evidence, CASE allows agents to explore patient-specific environments and utilize various clinical tools. The framework includes a multimodal benchmark with real-world clinical questions and employs supervised fine-tuning and reinforcement learning to improve the agents' evidence-seeking capabilities. Experimental results demonstrate that CASE significantly outperforms existing models in accuracy, showcasing its potential for advancing evidence-based longitudinal reasoning in healthcare."}, 'zh': {'title': 'CASE：自主寻找临床证据的智能代理', 'desc': '本研究提出了一种名为CASE的临床代理模型，旨在通过工具使用来寻找证据。与传统医学基准不同，CASE能够在临床记录和长期影像中自主寻找相关证据，而不仅仅是基于预选证据进行推理。我们构建了一个多模态基准，包含来自UK Biobank的50,401个临床问题，支持代理在患者特定环境中进行自主选择和比较。实验结果表明，CASE在回答准确性上相较于现有模型有显著提升，推动了基于证据的长期推理能力。'}}}, {'id': 'https://huggingface.co/papers/2610.13181', 'title': 'MixTok: Adaptive Visual Tokenization with Global 1D Tokens and Sparse 2D Refinement', 'url': 'https://huggingface.co/papers/2610.13181', 'abstract': 'Abstract  Efficient visual tokenization requires balancing representation compactness with the preservation of fine-grained image content. Conventional grid-based tokenizers allocate tokens uniformly across spatial locations despite non-uniform visual complexity, whereas compact 1D tokenizers aggregate global information but can struggle to preserve local details. We introduce MixTok, a hybrid visual tokenizer that combines a compact 1D global representation with sparse 2D tokens for local refinement. A content-adaptive router ranks candidate locations by refinement priority and determines the number of 2D tokens for each image under a target average token budget. At the highest-scoring locations, 2D token features replace the spatial features recovered from the 1D representation, and a shared decoder reconstructs the image from the resulting mixed features. On ImageNet 256 x 256, MixTok achieves highly competitive reconstruction and generation performance, with an rFID of 1.195 and a gFID of 1.95 at respective average budgets of approximately 128 and 131 content tokens per image.', 'score': 12, 'issue_id': 3400, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'a7d35fb56778ab61', 'authors': ['Chenge Li', 'Yefei He', 'Xinyu Liu', 'Feng Chen', 'Hong Zhou', 'Bohan Zhuang'], 'affiliations': ['The Hong Kong University of Science and Technology', 'University of Adelaide', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.13181.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'title': 'Адаптивная гибридизация глобальных и локальных токенов для эффективной визуализации', 'desc': 'В статье предлагается MixTok — гибридный визуальный токенизатор, который объединяет компактное глобальное представление в виде одномерной последовательности токенов с разреженными двумерными токенами для локального уточнения деталей. Адаптивный к содержимому маршрутизатор автоматически определяет приоритет областей, требующих уточнения, и контролирует количество двумерных токенов в соответствии с заданным бюджетом токенов. На местоположениях с высоким приоритетом двумерные токены заменяют пространственные признаки, восстановленные из одномерного представления, а общий декодер реконструирует изображение из смешанных признаков. Метод достигает конкурентоспособных результатов на ImageNet с метриками rFID = 1.195 и gFID = 1.95 при среднем бюджете около 128-131 токенов на изображение.'}, 'en': {'title': 'MixTok: Balancing Global and Local Image Representation', 'desc': 'The paper presents MixTok, a novel visual tokenizer that aims to improve image representation by combining the strengths of both 1D and 2D tokenization methods. Unlike traditional grid-based tokenizers that apply tokens uniformly, MixTok uses a content-adaptive router to prioritize and allocate 2D tokens based on the visual complexity of different image areas. This hybrid approach allows for a compact global representation while preserving important local details, leading to better image reconstruction and generation. The results show that MixTok outperforms existing methods on the ImageNet dataset, achieving competitive metrics for image fidelity and generation quality.'}, 'zh': {'title': 'MixTok：高效的视觉标记与细节保留', 'desc': '本论文提出了一种新的视觉标记方法MixTok，旨在平衡图像内容的紧凑表示与细节保留。传统的网格标记器在空间位置上均匀分配标记，而MixTok结合了紧凑的1D全局表示和稀疏的2D标记，以实现局部细化。通过内容自适应路由器，MixTok根据细化优先级对候选位置进行排名，并在目标平均标记预算下确定每幅图像的2D标记数量。实验结果表明，在ImageNet数据集上，MixTok在重建和生成性能方面表现出色，具有竞争力的rFID和gFID指标。'}}}, {'id': 'https://huggingface.co/papers/2610.07625', 'title': 'Stateless Language Agents: Scaling Long-Horizon Automated Research', 'url': 'https://huggingface.co/papers/2610.07625', 'abstract': "Abstract  Automated research systems increasingly run LLM agents over long horizons, but more inference does not by itself produce more progress: agents replay growing histories, duplicate one another's work, or stop experimenting while token consumption continues. Yet most evaluations use short budgets or benchmarks that saturate early, leaving these failure modes untested. We trace these failures to two choices: where research state lives and who decides what to try next. We introduce Stateless Language Agents (SLAs), built on the principle of stateful search with stateless agents: no agent carries its conversation across invocations; instead, the harness owns the research state (candidate solutions and measured outcomes) and reconstructs a fresh and role-specific context for every invocation. What each agent sees becomes an explicit design choice rather than a history that grows with the run. We implement this principle in the SLA framework, where a stateless Advisor reads harness-summarized evidence across search directions and assigns concrete experiments to parallel Workers. We evaluate SLA against three recent frameworks on software engineering, kernel optimization, and algorithm design at budgets of up to one billion tokens. SLA achieves the best final result on every task and reaches the strongest kernel baseline's final performance with over 84% fewer tokens. Ablations from shared checkpoints show that focused contexts and explicit assignments each contribute to SLA's progress, with effects that can compound over full runs, while the Advisor consumes less than 0.6% of tokens. These results argue for SLAs, which keep durable research state out of agent conversations, and show that short evaluation horizons can misjudge research systems and their components.", 'score': 12, 'issue_id': 3399, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': 'e79403cbaae1bdf7', 'authors': ['Qizheng Zhang', 'Changxiu Ji', 'Isaac Sun', 'Yuetai Li', 'Shubhangi Upasani', 'Sherry Ruan', 'Boyuan Ma', 'Fenglu Hong', 'Vamsidhar Kamanuru', 'Yoonho Lee', 'Yuzhen Mao', 'Genghan Zhang', 'Rulin Shao', 'Qiuyang Mang', 'Andy Dimnaku', 'Changran Hu', 'Radha Poovendran', 'Kunle Olukotun'], 'affiliations': ['Carnegie Mellon University', 'SambaNova Systems, Inc.', 'Stanford University', 'UC Berkeley', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2610.07625.jpg', 'data': {'categories': ['#benchmark', '#agents', '#inference'], 'emoji': '🔬', 'ru': {'title': 'Stateless агенты для эффективного автоматизированного исследования с долгосрочным горизонтом', 'desc': 'В этой работе предлагается новый подход к построению агентов на базе LLM для автоматизации научных исследований. Авторы выявили проблемы, возникающие при длительном функционировании агентов: дублирование работы, растущее потребление токенов без прогресса и неэффективное использование истории диалогов. Решение заключается в использовании статeless агентов (SLA), которые не сохраняют контекст между вызовами, а вместо этого полностью полагаются на управляющий модуль, хранящий состояние исследования. Экспериментальная оценка показала, что SLA превосходит существующие методы на трёх задачах оптимизации, требуя при этом на 84% меньше токенов для достижения лучших результатов.'}, 'en': {'title': 'Revolutionizing Research with Stateless Language Agents', 'desc': 'This paper discusses the limitations of current long-horizon research systems that use large language model (LLM) agents. It identifies issues such as agents duplicating efforts and failing to experiment effectively due to the way research state is managed. The authors propose Stateless Language Agents (SLAs), which separate the research state from the agents, allowing for a fresh context for each invocation. The SLA framework demonstrates superior performance in various tasks while using significantly fewer tokens, highlighting the importance of focused contexts and explicit task assignments in improving research outcomes.'}, 'zh': {'title': '无状态语言代理：优化研究进程的新方法', 'desc': '这篇论文探讨了自动化研究系统中大语言模型（LLM）代理的使用，指出仅仅增加推理次数并不能保证研究进展。研究发现，代理在长时间运行中可能会重放历史、重复工作或停止实验。为了解决这些问题，论文提出了无状态语言代理（SLA），通过将研究状态集中在系统中，而不是分散在各个代理中，从而优化了实验过程。实验结果表明，SLA在多个任务上表现优异，显著减少了所需的计算资源。'}}}, {'id': 'https://huggingface.co/papers/2609.37950', 'title': 'Video-RSI: Recursive Self-Improvement of Video Understanding Agents via Harness Evolution', 'url': 'https://huggingface.co/papers/2609.37950', 'abstract': 'Abstract  Video understanding agents acquire evidence through an executable harness that controls what they observe and how they use those observations. However, execution traces contain only the evidence acquired by the current harness, leaving competing explanations for failure unresolved and limiting the basis for self-improvement. We introduce Video-RSI, a framework for recursive self-improvement in which a video understanding agent uses its own language model to revise its harness. Through active video investigation, the model revisits the original training videos to test competing failure explanations with additional observations, grounding proposed changes in evidence beyond the existing trace. Cost-aware harness evolution turns these diagnoses into reusable revisions and determines which revisions to retain by considering both answer accuracy and visual cost. Across our evaluation settings on video understanding benchmarks, the evolved agent improves accuracy while processing fewer frames and achieves competitive accuracy-efficiency trade-offs against existing video understanding agents. These results demonstrate the potential for video understanding agents to improve their own evidence acquisition and use through harness evolution. Code is available at https://github.com/bingjunluo/Video-RSI .', 'score': 11, 'issue_id': 3399, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '0f0852e32b768cd3', 'pdf_title_img': 'assets/pdf/title_img/2609.37950.jpg', 'data': {'categories': ['#benchmark', '#agents', '#video'], 'emoji': '🎬', 'ru': {'title': 'Самоулучшение агентов понимания видео через эволюцию механизма наблюдения', 'desc': 'В этой работе предлагается Video-RSI — фреймворк для рекурсивного самоулучшения агентов, которые понимают видео. Агент использует собственную языковую модель для пересмотра и оптимизации своего механизма наблюдения (harness), повторно анализируя исходные видео для проверки альтернативных объяснений ошибок. Предложенный подход проводит активное исследование видео, накапливая дополнительные наблюдения и уточняя гипотезы на основе реальных данных. Результаты показывают, что эволюция механизма наблюдения улучшает точность распознавания при одновременном снижении вычислительных затрат на обработку кадров.'}, 'en': {'title': 'Empowering Video Agents to Self-Improve Through Evidence-Based Revisions', 'desc': 'This paper presents Video-RSI, a framework that enables video understanding agents to enhance their performance through recursive self-improvement. The agents utilize their own language models to analyze and revise their observation harnesses, allowing them to explore different explanations for failures. By actively investigating original training videos, the agents gather additional evidence to support their revisions, which helps them make informed decisions about which changes to implement. The approach not only improves accuracy but also optimizes the number of frames processed, achieving a better balance between accuracy and efficiency compared to existing methods.'}, 'zh': {'title': '视频理解代理的自我改进新方法', 'desc': '本文介绍了一种名为Video-RSI的视频理解框架，旨在通过递归自我改进来提升视频理解代理的性能。该框架允许代理使用自身的语言模型来修订其观察工具，从而在主动视频调查中重新审视原始训练视频。通过这种方式，代理能够测试不同的失败解释，并在现有证据的基础上提出改进建议。最终，经过演化的代理在处理更少帧的情况下提高了准确性，并在准确性与效率之间实现了竞争性的权衡。'}}}, {'id': 'https://huggingface.co/papers/2610.13627', 'title': 'AMLworld-Compact: Importance-Weighted Downsampling for Cost-Effective LLM Evaluation and Error Diagnosis', 'url': 'https://huggingface.co/papers/2610.13627', 'abstract': "Abstract  Evaluating large language models (LLMs) on AMLworld's smallest test splits is costly because each of over a million targets requires a separate graph prompt. Sampling reduces this cost, but small balanced subsets change unweighted precision and F1. We introduce AMLworld-Compact, an evaluation set that retains every illicit test transaction and samples benign transactions from supervised-score strata. Its HT-Coreset protocol reduces evaluation targets by 271x and 611x on HI-Small and LI-Small. Horvitz-Thompson weights give unbiased full-test confusion-count estimates for fixed predictions; recall is exact, while precision and F1 are ratio estimates. In a held-out study using Graph Feature Preprocessor (GFP) features, one boosted-tree family defines strata for evaluating the other over 500 draws per configuration. At the released sizes, F1 RMSE is 0.00-2.58 percentage points versus 4.44-7.41 for uniform sampling with HT weights; conservative intervals remain broad. Under the evaluated graph prompts, seven open-weight LLMs have weighted precision near the predict-all-illicit baseline. In an outcome-stratified audit of 1,000 HI-Small few-shot outputs from one run per model, lexical checks pass for 84.5% of correct and 56.2% of incorrect binary verdicts, so these markers do not establish correctness. We release the evaluation sets, construction code, and audit tools at https://huggingface.co/datasets/typhoon-ai/AMLworldCompactEval and https://github.com/nat-nischw/AMLworld-Compact.", 'score': 11, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '8284fb8c16da74ae', 'authors': ['Natapong Nitarach', 'Phume Ngampornsukswadi', 'Pittawat Taveekitworachai', 'Surapon Nonesung', 'Warit Sirichotedumrong', 'Kunat Pipatanakul'], 'affiliations': ['SCB DataX, SCBX Group'], 'pdf_title_img': 'assets/pdf/title_img/2610.13627.jpg', 'data': {'categories': ['#benchmark', '#dataset'], 'emoji': '⚖️', 'ru': {'title': 'Умная выборка вместо полного тестирования: эффективная оценка LLM на задачах обнаружения аномалий', 'desc': 'Работа решает проблему дорогостоящей оценки больших языковых моделей на гигантских наборах данных для выявления мошенничества, предложив метод AMLworld-Compact, который сохраняет все положительные примеры и стратифицированно семплирует отрицательные примеры. Авторы применяют протокол HT-Coreset для снижения количества тестовых объектов в 271-611 раз и используют веса Horvitz-Thompson для получения несмещённых оценок метрик на полном наборе данных. В экспериментах с методом Graph Feature Preprocessor показано, что стратифицированное семплирование значительно снижает среднеквадратичную ошибку F1 по сравнению с равномерным семплированием. Исследование демонстрирует, что открытые LLM-модели показывают слабые результаты на задаче классификации платежей, и лексические маркеры не могут надёжно определить корректность предсказаний модели.'}, 'en': {'title': 'Efficient Evaluation of LLMs with AMLworld-Compact', 'desc': 'This paper presents AMLworld-Compact, a new evaluation set designed to efficiently assess large language models (LLMs) on illicit transaction detection. By sampling benign transactions from supervised-score strata, the method significantly reduces the number of evaluation targets, achieving a reduction of up to 611 times. The use of Horvitz-Thompson weights ensures unbiased estimates of confusion counts, allowing for accurate recall while providing ratio estimates for precision and F1 scores. The study demonstrates that LLMs can achieve weighted precision close to the baseline, although lexical checks indicate that not all outputs can be deemed correct based on binary verdicts alone.'}, 'zh': {'title': 'AMLworld-Compact：高效评估大型语言模型的创新方法', 'desc': '本文介绍了一种新的评估集AMLworld-Compact，用于评估大型语言模型（LLMs）在反洗钱（AML）任务中的表现。该评估集保留了每个非法交易，并从监督评分层中抽样良性交易，从而显著减少了评估目标的数量。通过使用Horvitz-Thompson权重，本文提供了无偏的混淆计数估计，确保召回率准确，而精确率和F1分数则为比率估计。研究结果表明，在不同的图提示下，七个开放权重的LLMs在加权精确度上接近预测所有非法交易的基线。'}}}, {'id': 'https://huggingface.co/papers/2610.12114', 'title': 'Universal Textual Teaching for LLMs', 'url': 'https://huggingface.co/papers/2610.12114', 'abstract': "Abstract  Knowledge distillation (KD) transfers knowledge from stronger Teacher models to weaker Student models, but most methods require training the Student parameters, thereby binding the distilled knowledge to a specific architecture and checkpoint. This implicit representation is difficult to interpret or reuse across models and limits KD for API-only or costly-to-train models. This paper studies knowledge transfer for large language models (LLMs). We introduce Universal Textual Teaching (UTT), a parameter-update-free framework that distills observed Teacher-Student knowledge gaps into a textual, interpretable, and reusable natural-language artifact called Primer. Specifically, UTT first identifies representative gap cases through paired evaluations, and iteratively updates the Primer via multi-role interactions: the Student attempts each task, the Prompter turns evaluation feedback into a teaching instruction, the Teacher provides a targeted demonstration, and the Synthesizer consolidates validated lessons. Empirically, on the challenging math (Omni-MATH-2) and code generation (KernelBench) tasks, extensive results confirm the effectiveness of the method: UTT remarkably raises the Student's accuracy from 9.4% to 48.6% and Fast1 accuracy from 9% to 35% on KernelBench, while increasing mathematical reasoning accuracy from 27.6% to 51.7%. UTT also performs better than representative prompt engineering and parameter-based KD methods. Of note, UTT is shown to be generalizable across different Teachers and Students: a Primer synthesized for one Teacher-Student pair can generalize to other Students that do not participate in the synthesis.", 'score': 10, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '6ed4dd3327280871', 'authors': ['Zhanyi Lu', 'Huan Wang'], 'affiliations': ['Shanghai Jiao Tong University', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12114.jpg', 'data': {'categories': ['#training', '#math', '#interpretability', '#plp', '#reasoning', '#transfer_learning'], 'emoji': '📚', 'ru': {'title': 'Без параметров, но с пользой: текстовая дистилляция знаний для больших языковых моделей', 'desc': 'В работе предложен метод Universal Textual Teaching (UTT) для передачи знаний от больших языковых моделей-учителей к моделям-студентам без обновления параметров. Метод преобразует разницу в производительности между учителем и студентом в текстовый артефакт под названием Primer — интерпретируемый и переиспользуемый набор инструкций на естественном языке. UTT итеративно обновляет Primer через многоагентное взаимодействие: студент решает задачу, подсказчик генерирует инструкцию, учитель демонстрирует решение, а синтезатор консолидирует полученные уроки. Экспериментально показано, что метод значительно улучшает результаты на задачах математического рассуждения и генерации кода, превосходя методы prompt engineering и традиционную дистилляцию знаний, при этом оставаясь обобщаемым между различными парами моделей.'}, 'en': {'title': 'Transforming Knowledge Transfer with Universal Textual Teaching', 'desc': "This paper presents a new method called Universal Textual Teaching (UTT) for knowledge distillation, which allows knowledge transfer from strong Teacher models to weaker Student models without needing to update the Student's parameters. UTT creates a reusable natural-language artifact called a Primer that captures the knowledge gaps between the Teacher and Student, making it easier to interpret and apply across different models. The method involves a collaborative process where the Student learns from the Teacher through feedback and demonstrations, leading to significant improvements in task performance on math and code generation benchmarks. UTT outperforms traditional knowledge distillation methods and is adaptable to various Teacher-Student configurations, enhancing its utility in machine learning applications."}, 'zh': {'title': '通用文本教学：知识蒸馏的新方法', 'desc': '知识蒸馏（KD）是将强大的教师模型的知识转移到较弱的学生模型中，但大多数方法需要训练学生的参数，这使得蒸馏的知识与特定的架构和检查点绑定。本文提出了一种名为通用文本教学（UTT）的框架，它通过文本化的方式提取教师与学生之间的知识差距，形成可解释和可重用的自然语言工件，称为Primer。UTT通过多角色互动迭代更新Primer，显著提高了学生在数学和代码生成任务上的准确性。研究表明，UTT在不同的教师和学生之间具有良好的通用性，能够有效地提升学生模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2610.10288', 'title': 'TouchScale: 500 Hours of Human Vision and Touch for Visual-Tactile Learning', 'url': 'https://huggingface.co/papers/2610.10288', 'abstract': 'Abstract  Large-scale egocentric human interaction data is becoming an important source of physical supervision for embodied learning, yet video alone leaves the contact and pressure that characterize physical interaction unrecorded. Recent visual-tactile datasets provide this missing supervision, but their synchronized tactile data remain far smaller in volume than human video. Moreover, the largest resources often merge recordings from different sensors or annotation procedures, which makes the effect of data scale difficult to isolate. We therefore introduce TouchScale, a 500-hour dataset of contact-rich human interaction recorded with a single unified wearable setup. Its approximately 2K predefined task descriptions span everyday activities and structured manipulation, and each recording temporally aligns egocentric RGB-D video with wrist RGB video and dense full-hand bimanual tactile measurements. Compared with prior tactile data, training on the full TouchScale raises zero-shot contact IoU on data from an unseen tactile sensor from 0.134 to 0.383. Pretraining a visual encoder on TouchScale also yields the highest action recognition accuracy on three benchmarks among the compared visual-tactile datasets. Used for visual-tactile mid-training of a robot policy, TouchScale improves the average real-world success rate across four contact-rich manipulation tasks from 22.5% to 57.5%. With the sensor and collection protocol held fixed, both zero-shot tactile prediction and robot success show an overall upward trend as more TouchScale data is used. These results suggest that human visual-tactile data collected at scale with consistent sensing benefits both perception and robot manipulation. We will publicly release TouchScale, including all synchronized visual-tactile recordings and reconstructed object models, to support future research on scalable visual-tactile learning.', 'score': 10, 'issue_id': 3400, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '55df96ac4d324136', 'authors': ['Dayou Li', 'Hao Wang', 'Qianqian Yang', 'Zihao Zhu', 'Haoquan Fang', 'Ziyao Zeng', 'Yan Han', 'Zihan Wang', 'Yan Wang', 'Baoru Huang', 'Dilin Wang', 'Kenji Shimada', 'Yiyue Luo', 'Manling Li', 'Teresa Lv', 'Mustafa Mukadam', 'Rakesh Ranjan', 'Ruohan Zhang', 'Qi He', 'Changliu Liu', 'Xu Chen', 'Marco Pavone', 'Bangya Liu', 'Jiachen Li', 'Masayoshi Tomizuka', 'Zhiwen Fan'], 'affiliations': ['CMU', 'Georgia Tech', 'Google DeepMind', 'Meta', 'Microsoft', 'NVIDIA', 'Northwestern University', 'Overfit Lab', 'Sony', 'Stanford University', 'Texas A&M University', 'UC Berkeley', 'University of Liverpool', 'University of Washington', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2610.10288.jpg', 'data': {'categories': ['#dataset', '#robotics', '#multimodal', '#video'], 'emoji': '🤖', 'ru': {'title': 'Масштабное обучение роботов через визуально-тактильные данные человеческих взаимодействий', 'desc': 'В статье представлен набор данных TouchScale, содержащий 500 часов видеозаписей взаимодействия людей с объектами, синхронизированный с тактильными измерениями. Авторы используют единую унифицированную сенсорную установку для одновременной записи эгоцентрического RGB-D видео, видео запястья и плотных бимануальных тактильных измерений полной руки. Обучение на полном наборе данных TouchScale значительно улучшает предсказание контактов и точность распознавания действий на нескольких бенчмарках, а также повышает успешность манипуляционных задач робота в реальном мире с 22,5% до 57,5%. Результаты демонстрируют, что визуально-тактильные данные, собранные в большом масштабе с согласованным сенсорным оборудованием, существенно улучшают восприятие и способность робота к обучению.'}, 'en': {'title': 'TouchScale: Enhancing Robot Learning with Rich Visual-Tactile Data', 'desc': 'The paper introduces TouchScale, a large dataset designed to enhance embodied learning by providing synchronized visual and tactile data from human interactions. It addresses the limitations of existing datasets by offering 500 hours of contact-rich recordings captured with a single wearable device, ensuring consistency in data collection. The results show that training on TouchScale significantly improves zero-shot contact prediction and action recognition accuracy for robots. This dataset aims to facilitate advancements in visual-tactile learning and robot manipulation tasks by providing a comprehensive resource for researchers.'}, 'zh': {'title': 'TouchScale：提升机器人触觉学习的新数据集', 'desc': '本论文介绍了TouchScale，这是一个包含500小时人类互动数据的数据集，专注于记录接触和压力等物理交互特征。该数据集通过统一的可穿戴设备收集，包含约2000个日常活动和结构化操作的任务描述，并将RGB-D视频与手腕RGB视频和双手触觉测量数据进行时间对齐。与之前的触觉数据相比，使用TouchScale进行训练可以显著提高机器人在未见触觉传感器上的接触IoU和动作识别准确率。TouchScale的发布将为可扩展的视觉-触觉学习研究提供重要支持。'}}}, {'id': 'https://huggingface.co/papers/2610.13171', 'title': 'PreSTO: Predictive Subtree Prefetching for Fast LLM Power Sampling', 'url': 'https://huggingface.co/papers/2610.13171', 'abstract': "Abstract  Power sampling improves large language model (LLM) reasoning at test time by sampling from a sharpened version of the base model's distribution. Its sampler, PowerMH, is slow because its Metropolis--Hastings (MH) updates are sequential: each accept/reject decision sets the state from which the next proposal is generated. Prior work reduces this cost by changing the sampler or the model (e.g., sequential Monte Carlo, approximate lookahead, distillation). We propose Predictive SubTree Prefetching (PreSTO), which accelerates PowerMH by prefetching future proposals and provably leaves its MH transition kernel unchanged. PreSTO views future MH outcomes as a tree of accept/reject decisions: in each model call, it generates the proposals of a prefetched subtree of this tree in one batch, then follows the realized path with the original MH acceptance rule. We also observe that MH reaches only a sparse, nearly unary part of each prefetched subtree, we further design a predictive traversal rule that chooses the subtree to maximize the predicted number of completed transitions. Across seven datasets and five base LLMs, PreSTO achieves median speedups of 1.71times, 1.91times, and 2.33times on PowerMH and its follow-ups EntropyCut and MultiTryMH, respectively; on the first two, it makes a median of 3.9times fewer model calls, each only 2.1times longer. On LCB V6 with Qwen3.5-9B, the predictive traversal rule is a further 1.25times--1.37times faster than the default breadth-first traversal.", 'score': 10, 'issue_id': 3400, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'a271701ad2816625', 'authors': ['Nan Jiang', 'Panagiotis Theodoropoulos', 'Wei Deng'], 'affiliations': ['Georgia Institute of Technology', 'Morgan Stanley', 'University of Texas at El Paso'], 'pdf_title_img': 'assets/pdf/title_img/2610.13171.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Параллельная выборка для ускорения рассуждений в больших языковых моделях', 'desc': 'Статья описывает PreSTO — метод ускорения выборки в больших языковых моделях, который используется для улучшения рассуждений во время тестирования. Авторы предлагают технику предварительной загрузки будущих предложений (prefetching), которая значительно ускоряет алгоритм PowerMH, сохраняя при этом математические свойства цепи Маркова. Ключевая идея заключается в представлении будущих решений принятия/отклонения как дерева и генерировании нескольких предложений одновременно в батче, вместо последовательной обработки. Результаты показывают ускорение в 1,7-2,3 раза и снижение количества обращений к модели на 3,9 раза при лишь незначительном увеличении длины отдельных вызовов.'}, 'en': {'title': 'Accelerating LLM Reasoning with Predictive SubTree Prefetching', 'desc': 'This paper introduces Predictive SubTree Prefetching (PreSTO), a method that enhances the efficiency of the PowerMH sampler used in large language models (LLMs). PreSTO accelerates the Metropolis-Hastings (MH) sampling process by prefetching future proposals in a batch, allowing for faster decision-making without altering the MH transition kernel. The authors demonstrate that by focusing on a sparse part of the proposal tree, they can optimize the sampling process, achieving significant speedups across multiple datasets and models. Overall, PreSTO not only reduces the number of model calls but also improves the speed of each call, making it a valuable advancement in LLM reasoning.'}, 'zh': {'title': '加速大语言模型推理的创新方法', 'desc': '本论文提出了一种名为预测子树预取（PreSTO）的方法，旨在加速大语言模型（LLM）在测试时的推理过程。通过预取未来的提议，PreSTO能够在不改变Metropolis-Hastings（MH）转移核的情况下，提高PowerMH采样器的效率。研究表明，MH仅访问预取子树的稀疏部分，因此我们设计了一种预测遍历规则，以最大化完成转移的预期数量。实验结果显示，PreSTO在多个数据集和基础LLM上实现了显著的速度提升。'}}}, {'id': 'https://huggingface.co/papers/2610.00898', 'title': 'When Do Biological Reasoning Models Use Their Biological Inputs?', 'url': 'https://huggingface.co/papers/2610.00898', 'abstract': 'Abstract  Biological reasoning models use post-training to connect LLMs to biological foundation model representations and biological text. Their benchmark accuracy is taken as evidence that LLMs reason over these inputs. We test this assumption in six biological reasoning models across DNA, protein, and single-cell tasks. We perturb one biological input while holding the query and other inputs fixed, construct evidence conflicts that pair the foundation model representation of one genome, protein, or cell with the text of another, fit linear probes to the representations the language model receives, and analyze reasoning traces against the biological inputs. Evo2 and ESM3 contribute little to BioReason and BioReason-Pro performance on the evaluated tasks. Shuffling the DNA sequence barely changes BioReason disease prediction accuracy, and in evidence conflicts the two models follow the text in 97.9% and 99.7% of cases. Linear probes trained on the Evo2 and ESM3 representations predict the task targets, so these foundation models encode information relevant to the task, but provide limited overall performance improvement to BioReason and BioReason-Pro. In contrast, foundation model inputs contribute to ChatNT, Prot2Text-V2, and CellWhisperer performance, and differentially expressed genes in the gene sentence contribute to Cell2Sentence-Scale performance. Across SFT and RL checkpoints of BioReason-Pro and 42 BioReason checkpoints, increases in accuracy do not imply greater performance contributions from biological inputs. BioReason traces misstate nucleotide changes, while BioReason-Pro traces describe functions omitted from final predictions under evidence conflicts. We find that current post-training strategies do not ensure that foundation model representations contribute to task performance.', 'score': 10, 'issue_id': 3400, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd83af21f2e0132db', 'authors': ['Ada Fang', 'Nikitha Thoduguli', 'Lukas Fesser', 'Hanlin Zhang', 'Sham M. Kakade', 'Marinka Zitnik'], 'affiliations': ['Harvard University', 'Massachusetts Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.00898.jpg', 'data': {'categories': ['#training', '#science', '#interpretability', '#hallucinations', '#reasoning', '#benchmark', '#multimodal'], 'emoji': '🧬', 'ru': {'title': 'Foundation models не всегда помогают: когда LLM игнорирует биологические представления', 'desc': 'Исследование проверяет, действительно ли биологические модели рассуждения используют представления биологических foundation models при решении задач. Авторы применяют различные методы анализа: возмущение входных данных, создание конфликтов в доказательствах и обучение линейных классификаторов на скрытых представлениях LLM. Результаты показывают, что некоторые foundation models (Evo2 и ESM3) содержат релевантную информацию, но практически не улучшают финальную производительность моделей. Текущие стратегии post-training не гарантируют, что представления foundation models действительно вносят вклад в решение биологических задач.'}, 'en': {'title': 'Rethinking Post-Training: LLMs Struggle with Biological Reasoning', 'desc': 'This paper investigates how well large language models (LLMs) perform in biological reasoning tasks after being connected to biological data. The authors test the assumption that LLMs can reason about biological inputs by analyzing their performance on various tasks related to DNA, proteins, and single cells. They find that while some models encode relevant information, they do not significantly improve task performance, especially when biological inputs are perturbed. The study concludes that current post-training methods may not effectively enhance the reasoning capabilities of LLMs in biological contexts.'}, 'zh': {'title': '生物推理模型的后训练策略需改进', 'desc': '生物推理模型通过后训练将大型语言模型（LLMs）与生物基础模型表示和生物文本连接起来。我们在六个生物推理模型中测试了这一假设，涉及DNA、蛋白质和单细胞任务。结果显示，Evo2和ESM3对BioReason和BioReason-Pro的性能贡献有限，DNA序列的随机化几乎不影响疾病预测的准确性。我们的研究表明，当前的后训练策略并不能确保基础模型表示对任务性能的贡献。'}}}, {'id': 'https://huggingface.co/papers/2610.13205', 'title': 'Rethinking Relative Policy Differences Transfer of On-Policy Distillation', 'url': 'https://huggingface.co/papers/2610.13205', 'abstract': "Abstract  On-policy distillation (OPD) trains a target policy on its own rollouts using token-level supervision from a stronger teacher, but typically relies on the teacher being substantially more capable than the target. Recent work relaxes this requirement by transferring the relative policy difference between an expert and a reference policy rather than the expert's absolute distribution. Yet it remains unclear which differences provide useful supervision and which targets can benefit from them. We develop a unified view in which the log-probability ratio between a proxy expert and a proxy reference defines an implicit reward for KL-regularized policy optimization. This formulation induces an on-policy update for the target, recovers conventional OPD as a special case, and enables any-to-any transfer across models that differ in scale, training stage or generation. Our systematic experiments yield three findings. First, a stronger expert is not necessarily a better source of supervision: differences induced by task-specific training, including reinforcement learning and supervised fine-tuning, transfe
