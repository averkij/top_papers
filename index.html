    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

            body.classList.toggle('light-theme');

            const isDarkMode = body.classList.contains('dark-theme');

                const title = document.getElementById('doomgrad');

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.39633', 'title': 'Intrinsic Distribution Matching', 'url': 'https://huggingface.co/papers/2610.39633', 'abstract': "Abstract Intrinsic Distribution Matching improves few-step text-to-image generation by adding explicit moment constraints to distribution matching distillation, achieving state-of-the-art long-text rendering with minimal network evaluations.  Generated by thinkingmachines/Inkling-Small One-step and few-step text-to-image generation must accurately render the details specified in the prompt despite limited opportunities for refinement. Distribution matching distillation (DMD) uses score differences to bring the generated distribution closer to a reference distribution. Following prior work, we estimate this difference with internal velocity branches, avoiding a separate fake-score network. We ask whether an explicit moment constraint improves this learned score supervision. A decomposition of the reverse-KL field into a Gaussian moment component and a non-Gaussian residual identifies statistics that can be constrained explicitly. We introduce Intrinsic Distribution Matching (IDM), which retains the full DMD correction and matches feature means and per-coordinate standard deviations using the generator's exponential-moving-average (EMA) copy, requiring no external feature encoder. Experiments use full-parameter and low-rank adaptation (LoRA) tuning on Z-Image-Turbo 6B and Qwen-Image 20B. At two network evaluations, IDM reaches 94.25% and 90.20% on Chinese and English LongText-Bench, the highest scores among the compared methods at this budget. Controlled ablations show gains from the added moment loss, while generator EMA features perform competitively with an external DINOv2 encoder across the five reported metrics. Code is available at https://github.com/inclusionAI/IDM.", 'score': 241, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '1ee1a6be28329899', 'authors': ['Deyuan Liu', 'Yansen Han', 'Kaiwen Zheng', 'Jun Xie', 'Jiacheng Liu', 'Zhenglin Cheng', 'Peng Sun', 'Jintao Zhang', 'Jianguo Li', 'Tao Lin'], 'affiliations': ['Inclusion AI', 'MBZUAI', 'Shanghai Innovation Institute', 'Tsinghua University', 'Westlake University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.39633.jpg', 'data': {'categories': ['#multimodal', '#training', '#diffusion', '#benchmark', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Точная отрисовка деталей за считанные шаги благодаря контролю моментов распределения', 'desc': 'В статье предлагается Intrinsic Distribution Matching (IDM) — метод улучшения few-step генерации изображений по тексту. Он дополняет Distribution Matching Distillation (DMD) явными ограничениями на моменты: средние признаков и покоординатные стандартные отклонения. Эти статистики берутся из EMA-копии генератора, поэтому внешний энкодер признаков (например, DINOv2) не нужен. Эксперименты на Z-Image-Turbo 6B и Qwen-Image 20B показывают лучшие результаты при двух вычислительных шагах на LongText-Bench, особенно при рендеринге длинных текстов.'}, 'en': {'title': 'Enhancing Text-to-Image Generation with Intrinsic Distribution Matching', 'desc': "This paper presents Intrinsic Distribution Matching (IDM), a method that enhances few-step text-to-image generation by applying moment constraints to distribution matching distillation (DMD). IDM aims to improve the accuracy of generated images by aligning the statistical properties of the generated distribution with a reference distribution, specifically focusing on feature means and standard deviations. The approach utilizes the generator's exponential-moving-average (EMA) to achieve this without needing an external feature encoder. Experimental results demonstrate that IDM achieves state-of-the-art performance on long-text rendering tasks with fewer network evaluations, outperforming existing methods."}, 'zh': {'title': '内在分布匹配：提升文本到图像生成的利器', 'desc': '本文提出了一种名为内在分布匹配（IDM）的方法，旨在改善少步文本到图像生成的效果。通过在分布匹配蒸馏中添加显式的矩约束，IDM能够在有限的网络评估中实现最佳的长文本渲染。该方法利用生成器的指数移动平均（EMA）副本来匹配特征均值和每个坐标的标准差，从而避免了使用外部特征编码器。实验结果表明，IDM在中文和英文的长文本基准测试中达到了最高的得分，显示出其在文本到图像生成中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.38568', 'title': 'A-RSI: Adaptive Task Refresh for Zero-Data Multimodal Self-Improvement', 'url': 'https://huggingface.co/papers/2610.38568', 'abstract': "Abstract A-RSI improves recursive self-improvement by refreshing training tasks based on declining learning signals and using independently verifiable program-generated answers, raising benchmark performance without external labels.  Generated by thinkingmachines/Inkling-Small Recursive self-improvement requires models not only to acquire useful training experience, but also to decide when their current experience has ceased to be useful. Existing methods often focus on what experience to generate next, while paying less attention to when fresh experience should be introduced. Many also construct training targets through self-consistency or majority voting, making supervision depend on the model's own uncertain predictions. We address these two questions separately: training dynamics determine when to acquire new experience, while the answers to new tasks remain independently checkable. A-RSI monitors reward variation and accuracy in training logs to refresh a task pool when its learning signal declines, without consulting validation or test scores. A static library of model-authored programs produces multimodal questions and derives their reference answers; we specify the task-generation contract, automatically verify chosen properties of the reward and refresh rules, and separately audit the generated answers. The training loop uses no external training examples or human-written answer labels. On the primary eleven-benchmark suite, A-RSI raises the performance average from 57.77 to 61.05 with 800 fresh tasks.", 'score': 152, 'issue_id': 3477, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': 'e42275586a7114eb', 'authors': ['Yu Liu', 'Youxing Li', 'Yuedong Tan', 'Zhiwei Yang', 'Zihan Su', 'Hanqi Feng', 'Shaojie Zhang', 'Libin Liao', 'Zihao Wan', 'Chenxu Wu', 'Cong Cao', 'Fangfang Yuan', 'Yanbing Liu', 'Ziheng Chen', 'Pei Fu', 'Radu Timofte', 'Zongwei Wu', 'Nicu Sebe', 'Barnabas Poczos', 'Jian Luan'], 'affiliations': ['Carnegie Mellon University', 'ETH Zurich', 'Hong Kong University of Science and Technology', 'Nanjing University of Posts and Telecommunications', 'Shenzhen Institute of Advanced Technology, Chinese Academy of Sciences', 'University of Trento', 'University of Würzburg', 'Xiaomi Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2610.38568.jpg', 'data': {'categories': ['#multimodal', '#training', '#benchmark', '#synthetic', '#optimization', '#data'], 'emoji': '🔄', 'ru': {'title': 'Учиться дальше, когда старые задачи перестают работать', 'desc': 'В статье представлен метод A-RSI, который улучшает рекурсивное самосовершенствование моделей машинного обучения. Система отслеживает вариативность наград и точность в логах обучения и обновляет пул задач, когда обучающий сигнал падает, не обращаясь к валидационным или тестовым метрикам. Новые мультимодальные вопросы и эталонные ответы генерируются статичной библиотекой программ, созданных самой моделью, а ответы проверяются независимо. На наборе из одиннадцати бенчмарков средняя точность выросла с 57,77 до 61,05 при использовании 800 новых задач, без внешних размеченных данных.'}, 'en': {'title': 'Revitalizing Learning: A-RSI Boosts Performance with Smart Task Refreshing', 'desc': 'A-RSI enhances recursive self-improvement in machine learning by introducing new training tasks when learning signals decrease. It focuses on determining the right time to refresh training experiences rather than just generating new experiences. The method uses independently verifiable answers generated by programs, eliminating reliance on uncertain model predictions. As a result, A-RSI significantly improves benchmark performance without needing external labels, achieving a notable increase in average scores across multiple tasks.'}, 'zh': {'title': '提升学习性能的自我改进方法', 'desc': 'A-RSI通过根据学习信号的下降来刷新训练任务，从而改进递归自我改进。它使用独立可验证的程序生成答案，提升了基准性能，而无需外部标签。该方法关注何时引入新经验，并通过监控奖励变化和训练日志中的准确性来刷新任务池。最终，A-RSI在主要的十一项基准测试中，将性能平均值从57.77提高到61.05，使用了800个新任务。'}}}, {'id': 'https://huggingface.co/papers/2610.29927', 'title': 'Your Benchmark Is an Empirical Measure Over Difficulty', 'url': 'https://huggingface.co/papers/2610.29927', 'abstract': 'Abstract This work formalizes benchmark evaluation through difficulty measures, identifies failure modes of measure mismatch and coverage gaps, and proposes diagnostic metrics and a rewriting algorithm to improve benchmark coverage.  Generated by thinkingmachines/Inkling-Small A benchmark is not merely a collection of test questions; it naturally induces an empirical measure over difficulty. In this work, we develop this measure-based view of benchmark evaluation. This perspective allows us to identify and formalize two central failure modes: measure mismatch, where the benchmark difficulty distribution differs from the intended difficulty distribution, and coverage gaps, where uncovered regions along the difficulty axis prevent benchmarks from detecting meaningful localized training progress. We propose two diagnostic metrics that capture these two failure modes and provide rigorous theoretical guarantees. Empirically, we analyze 25 popular benchmarks spanning 7 domains using carefully estimated item difficulties. Our results show that many benchmarks implicitly overweight certain difficulty regions, so their leaderboard conclusions should be interpreted with caution; others leave substantial portions of the difficulty axis uncovered, limiting their ability to monitor the model improvement process. Finally, we turn diagnosis into action by introducing BenchFill, a simple difficulty-targeted item rewriting algorithm that effectively reduces local coverage gaps.', 'score': 141, 'issue_id': 3477, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'e2b3f938ab668af1', 'authors': ['Yifan Sun', 'Naicheng Yu', 'Jiawen Gong', 'Jingyan Shen', 'Huan Zhang'], 'affiliations': ['New York University', 'University of California San Diego', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.29927.jpg', 'data': {'categories': ['#benchmark', '#survey', '#data'], 'emoji': '📏', 'ru': {'title': 'Бенчмарк должен честно измерять всю шкалу сложности, а не только её часть', 'desc': 'Статья рассматривает бенчмарки для оценки моделей не просто как набор тестовых вопросов, а как эмпирическое распределение по сложности задач. Авторы выделяют два ключевых сбоя: несоответствие распределения сложности (measure mismatch) и пробелы в покрытии (coverage gaps), из-за которых бенчмарк не замечает локальный прогресс обучения. Предложены две диагностические метрики с теоретическими гарантиями, а также эмпирический анализ 25 популярных бенчмарков из 7 областей с оценкой сложности каждого элемента. Наконец, представлен BenchFill, простой алгоритм переписывания вопросов, нацеленный на сложность, который эффективно сокращает локальные пробелы в покрытии.'}, 'en': {'title': 'Enhancing Benchmark Evaluation with Difficulty Measures', 'desc': "This paper focuses on improving how we evaluate machine learning benchmarks by introducing difficulty measures. It identifies two main problems: measure mismatch, where the benchmark's difficulty does not match what was intended, and coverage gaps, where certain difficulty levels are not tested at all. The authors propose new diagnostic metrics to detect these issues and analyze 25 popular benchmarks to show that many do not accurately reflect model performance across all difficulty levels. To address these gaps, they introduce BenchFill, an algorithm that rewrites benchmark items to ensure better coverage of the difficulty spectrum."}, 'zh': {'title': '提升基准评估的覆盖性与准确性', 'desc': '本文通过难度度量形式化基准评估，识别了度量不匹配和覆盖缺口的失败模式，并提出了诊断指标和重写算法以改善基准覆盖。基准不仅仅是测试问题的集合，它自然引入了难度的经验度量。我们开发了基于度量的基准评估视角，识别并形式化了两个主要的失败模式：度量不匹配和覆盖缺口。最后，我们提出了BenchFill算法，有效减少了局部覆盖缺口。'}}}, {'id': 'https://huggingface.co/papers/2610.36671', 'title': 'Look Only When Needed: Certificate-Guided Visual Routing for Efficient Diffusion VLMs', 'url': 'https://huggingface.co/papers/2610.36671', 'abstract': "Abstract LOWN adaptively skips image processing during diffusion vision-language model decoding when predictions agree, reducing computation while preserving accuracy.  Generated by thinkingmachines/Inkling-Small Diffusion vision-language models (DVLMs) process their entire input at every denoising step. Since visual tokens make up 89-97% of this input on the benchmarks we study, most of the decoding computation is spent repeatedly processing the same image. Visual token pruning methods partially relieve this burden by removing part of the visual tokens, but they lose the removed information and still process the remaining image at every step. To measure how often the image is actually needed, we compare LLaDA-V's predictions with and without the image at every decoding step and find that removing the image changes a token being unmasked at only 22.8% of steps on average and at as few as 7.9%. We therefore propose LOWN, a decoding method that decides at every step whether to process the image and how many tokens to unmask. LOWN predicts the masked tokens without the image and processes the image only when this prediction disagrees with the last image-conditioned prediction. Agreement certifies the earlier prediction for reuse, and the number of certified tokens sets how many are unmasked in that step. We further observe that the need for the image differs across benchmarks, so LOWN's adaptive decision is needed rather than a fixed schedule. Without training or a tuned threshold, LOWN retains 99.6% of LLaDA-V's score on ten benchmarks at 35.3% of the decoding FLOPs on average. LOWN also generalizes across LLaDA-based DVLMs, composes orthogonally with visual token pruning, and runs under key-value caching for further efficiency gains. Code and project page are available at https://hyeon9698.github.io/LOWN/", 'score': 94, 'issue_id': 3477, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'ea8e23e524a4d0a0', 'authors': ['Donghyeon Cho', 'Joowon Kim', 'Seungho Shin', 'Eunho Yang'], 'affiliations': ['AITRICS', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2610.36671.jpg', 'data': {'categories': ['#inference', '#multimodal', '#optimization'], 'emoji': '🖼️', 'ru': {'title': 'Смотрим на картинку только тогда, когда это действительно нужно', 'desc': 'Диффузионные vision-language модели (DVLM) на каждом шаге денойзинга обрабатывают всё входное изображение, хотя визуальные токены составляют до 89–97% входа, что делает декодирование очень затратным. Авторы показали, что удаление изображения меняет предсказание лишь примерно в 22,8% шагов, поэтому картинку нужно пересчитывать не всегда. Метод LOWN на каждом шаге сначала предсказывает маскированные токены без изображения и обращается к картинке только при расхождении с предыдущим предсказанием, а согласованные токены переиспользует и демаскирует. Без дополнительного обучения и подбора порогов метод сохраняет 99,6% качества LLaDA-V при использовании около 35% FLOPs на декодирование.'}, 'en': {'title': 'Efficient Image Processing with Adaptive Decoding in DVLMs', 'desc': 'The paper introduces LOWN, a novel decoding method for diffusion vision-language models (DVLMs) that optimizes computation by adaptively skipping image processing when predictions are consistent. By analyzing the necessity of visual tokens during decoding, LOWN determines when to process the image based on prediction agreement, significantly reducing redundant computations. This method retains high accuracy while achieving a 35.3% reduction in decoding FLOPs, demonstrating its efficiency across various benchmarks. LOWN also shows compatibility with existing visual token pruning techniques and enhances performance without requiring additional training or tuning.'}, 'zh': {'title': 'LOWN：智能跳过图像处理的解码方法', 'desc': 'LOWN是一种自适应解码方法，用于在扩散视觉语言模型中跳过图像处理，从而减少计算量并保持准确性。通过比较预测结果，LOWN决定在每个解码步骤中是否处理图像，以及解锁多少个视觉标记。研究表明，图像在大多数步骤中并不是必需的，因此LOWN能够有效地重用之前的预测。最终，LOWN在多个基准测试中保持了高达99.6%的准确率，同时将解码计算量减少了35.3%。'}}}, {'id': 'https://huggingface.co/papers/2610.40614', 'title': 'L3G-World: Real-Time Infinite World Generation with Latent 3D Gaussian Memory', 'url': 'https://huggingface.co/papers/2610.40614', 'abstract': "Abstract L3G-World uses a compact latent 3D Gaussian memory and alternating autoregressive updates with a video diffusion transformer to generate spatially consistent interactive worlds in real time.  Generated by thinkingmachines/Inkling-Small Interactive world models generate visual content conditioned on user actions, yet maintaining spatial consistency over long-horizon exploration in real time remains challenging. Existing approaches rely on either temporal context or explicit 3D memory, both of which scale poorly because memory grows with the length of the generated stream. Moreover, explicit 3D memories condition latent video generators by re-encoding RGB renderings, which precludes real-time generation. In this paper, we introduce a Latent 3D Gaussian Memory (L3G) that combines the efficiency of feed-forward reconstruction with a compact, rapidly renderable scene representation. Building on this memory, we propose L3G-World, in which a memory updater and a video diffusion transformer (DiT) alternate autoregressively to generate spatially consistent worlds. The memory updater spawns Gaussians in newly observed regions and refines existing ones, so that the memory grows with scene extent rather than stream length. Each Gaussian further stores a VAE latent feature, allowing the memory to be rendered directly into the DiT's latent space without VAE re-encoding. Experiments show that L3G-World achieves state-of-the-art generation quality and long-horizon spatial consistency, with up to 38.6times fewer 3D primitives, 3.2times faster memory updates, and 359times faster memory rendering relative to the most efficient prior 3D-memory baseline for each metric, enabling real-time world generation at 9 FPS.", 'score': 37, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '5006c5c258a2077e', 'authors': ['Jinhyeok Choi', 'JoungBin Lee', 'Jongmin Lee', 'Minkyeong Jeon', 'Jiyoung Kim', 'Kaeun Han', 'Yoonjin Yoon', 'Seungryong Kim'], 'affiliations': ['Ewha Womans University', 'KAIST AI', 'KAIST Urban AI Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.40614.jpg', 'data': {'categories': ['#games', '#architecture', '#diffusion', '#3d', '#video'], 'emoji': '🌍', 'ru': {'title': 'Согласованные миры в реальном времени благодаря компактной 3D-памяти', 'desc': 'Статья представляет L3G-World — интерактивную модель мира, которая генерирует видео по действиям пользователя и сохраняет пространственную согласованность при долгом исследовании сцены. Ключевая идея — компактная латентная память из 3D-гауссиан (Latent 3D Gaussian Memory), где каждый гауссиан хранит VAE-признаки и рендерится напрямую в латентное пространство DiT без повторного кодирования VAE. Память-апдейтер и video diffusion transformer работают в авторегрессионном чередовании: память растёт с размером сцены, а не с длиной потока. По результатам экспериментов модель достигает state-of-the-art качества, использует до 38.6 раз меньше 3D-примитивов и обеспечивает генерацию в реальном времени на уровне 9 FPS.'}, 'en': {'title': 'Real-Time Interactive Worlds with Efficient 3D Memory', 'desc': 'L3G-World introduces a novel approach to generating interactive 3D environments using a compact Latent 3D Gaussian Memory. This method allows for real-time generation of spatially consistent worlds by alternating between a memory updater and a video diffusion transformer. Unlike traditional methods that struggle with memory scaling, L3G-World efficiently grows memory based on scene extent rather than the length of generated content. The results demonstrate significant improvements in generation quality and speed, achieving real-time performance while maintaining long-horizon spatial consistency.'}, 'zh': {'title': '实时生成空间一致的互动世界', 'desc': 'L3G-World是一种利用紧凑的潜在3D高斯记忆和交替自回归更新的技术，能够实时生成空间一致的互动世界。该方法通过结合前馈重建的高效性和快速可渲染的场景表示，解决了在长时间探索中保持空间一致性的挑战。与现有方法相比，L3G-World的记忆更新器在新观察区域生成高斯分布，并优化现有的高斯分布，使得记忆的增长与场景范围相关，而不是生成流的长度。实验表明，L3G-World在生成质量和空间一致性方面达到了最先进的水平，显著提高了生成速度和效率。'}}}, {'id': 'https://huggingface.co/papers/2610.40647', 'title': 'Read, Allocate, Route: Role-Coupled Tokenization for Pixel-Space Generative Transformers', 'url': 'https://huggingface.co/papers/2610.40647', 'abstract': 'Abstract SpecSlot improves pixel-space generative Transformers by using localized spectral slots and restricted global attention to increase image detail without raising computational cost.  Generated by thinkingmachines/Inkling-Small Pixel-space generative Transformers typically use one token per image patch, so capturing finer detail requires more tokens and makes global attention increasingly expensive. We observe that finer detail does not necessarily require more global communication: low-frequency structure benefits from global exchange, while high-frequency detail can be modeled locally. Based on this insight, we introduce SpecSlot, a pixel-space rectified-flow Transformer that decouples output detail from the length of the global attention sequence. SpecSlot expands each spatial anchor into multiple slots, each assigned a disjoint band of DCT coefficients; this separates anchor density from spectral subdivision. Only the lowest-frequency slot from each anchor participates in global attention, while all slots interact locally. This allows the model to increase spectral detail without enlarging the global sequence. A spatial head further adds a local correction to the spectral prediction, while the generative state, target, and loss remain in pixel space. On ImageNet-256, SpecSlot achieves a comparable final FID to a FLOPs-matched JiT control while converging faster. On ImageNet-512, it improves FID by 2.84 over the control with 3.9% fewer FLOPs, and comes within only 0.69 FID of JiT-B/16 at 38.2% lower cost. On text-to-image generation, SpecSlot surpasses JiT-B/8 on DPG-Bench by 1.06 at 40.6% lower forward cost.', 'score': 36, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '6a6b57672a3c9fab', 'authors': ['Jiongfan Yang', 'Weichen Fan', 'Haiwen Diao', 'Zhongang Cai', 'Ziwei Liu'], 'affiliations': ['Nanyang Technological University', 'Peking University', 'SenseTime'], 'pdf_title_img': 'assets/pdf/title_img/2610.40647.jpg', 'data': {'categories': ['#training', '#architecture', '#diffusion', '#cv'], 'emoji': '🧩', 'ru': {'title': 'Детали без лишней глобальной связи: больше разрешения, та же цена', 'desc': 'В статье представлен SpecSlot — pixel-space трансформер для генерации изображений на основе rectified flow, который повышает детализацию без роста вычислительных затрат. Ключевая идея: низкочастотная структура требует глобального взаимодействия через attention, а высокочастотные детали можно моделировать локально. Каждый пространственный якорь разбивается на несколько слотов, каждый из которых отвечает за свою полосу DCT-коэффициентов, и только самый низкочастотный слот участвует в глобальном attention. На ImageNet-256 и ImageNet-512 SpecSlot сопоставим или превосходит контрольную модель JiT по FID при меньшем количестве FLOPs, а в задаче text-to-image также показывает лучший результат на DPG-Bench.'}, 'en': {'title': 'Enhancing Image Detail Efficiently with SpecSlot', 'desc': 'SpecSlot is a novel approach that enhances pixel-space generative Transformers by utilizing localized spectral slots and limiting global attention, which helps to improve image detail without increasing computational costs. Traditional methods require more tokens for finer details, leading to higher expenses in global attention. SpecSlot innovatively separates the modeling of low-frequency structures, which benefit from global communication, from high-frequency details that can be captured locally. This method allows for greater spectral detail while maintaining efficiency, achieving competitive performance on benchmarks like ImageNet and DPG-Bench.'}, 'zh': {'title': 'SpecSlot：提升图像细节的高效生成模型', 'desc': 'SpecSlot是一种改进像素空间生成Transformer的方法，它通过使用局部谱槽和限制全局注意力来提高图像细节，同时不增加计算成本。传统的生成Transformer通常每个图像块使用一个token，捕捉更细致的细节需要更多的token，这使得全局注意力变得更加昂贵。研究表明，细节并不一定需要更多的全局通信：低频结构受益于全局交换，而高频细节可以在局部建模。SpecSlot通过将每个空间锚点扩展为多个槽，并仅让最低频率的槽参与全局注意力，从而实现了细节与全局注意力序列长度的解耦。'}}}, {'id': 'https://huggingface.co/papers/2610.37161', 'title': 'WorkFactory: Turning Professional Intents into Executable Work for Scalable Agent Training', 'url': 'https://huggingface.co/papers/2610.37161', 'abstract': 'Abstract WorkFactory builds coherent professional tasks via information planning and repair, yielding WorkPilot models that improve expert-level agent performance across benchmarks.  Generated by thinkingmachines/Inkling-Small Scaling supervised training for working agents requires diverse professional tasks that yield reliable expert demonstrations. However, missing or inconsistent task information can obstruct teacher execution and weaken the resulting supervision. We propose WorkFactory, a scalable framework for constructing coherent and executable professional tasks. Starting from professional intents, information-level planning builds an information support graph to guide task instantiation, explicitly representing the dependencies and locations of information required for the intended outputs. Probe executions then identify support failures and guide repairs while preserving the intended work. We construct 112,686 tasks spanning 612 occupations and use the collected teacher trajectories to fine-tune Qwen models at 4B, 27B, and 35B-A3B scales, yielding the WorkPilot family. All three models improve over their respective base models across four professional-work benchmarks, with WorkPilot-35B-A3B improving from 879 to 1565 Elo on GDPval-AA v2.1. Scaling analyses reveal model-dependent diminishing returns, with execution length first increasing and then decreasing. Controlled component analyses show that planning and repair reduce probe-diagnosed task environment defects and improve downstream performance. The data and models are available at https://github.com/IQuestLab/WorkFactory.', 'score': 32, 'issue_id': 3477, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': '7086734108decf95', 'authors': ['Ziyang Zeng', 'Tingyang Chen', 'Jia Deng', 'Qiyao Wang', 'Shuo Tang', 'Yike Yang', 'Tao Ren', 'Wayne Xin Zhao', 'Feng Chang', 'Jujie He', 'Chuan Hao', 'Ran Tao', 'Bryan Dai'], 'affiliations': ['Gaoling School of Artificial Intelligence, Renmin University of China', 'IQuest Research', 'Peking University', 'Shanghai Jiao Tong University', 'Shenzhen Institutes of Advanced Technology', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.37161.jpg', 'data': {'categories': ['#dataset', '#training', '#agents', '#open_source', '#benchmark', '#synthetic', '#data'], 'emoji': '🧑\u200d💼', 'ru': {'title': 'Качественные задачи — основа умных AI-агентов', 'desc': 'В статье представлен WorkFactory — масштабируемый фреймворк для автоматического создания согласованных и исполнимых профессиональных задач, которые используются для supervised fine-tuning LLM-агентов. Сначала строится information support graph, отражающий зависимости и источники необходимой информации, затем probe-запуски выявляют дефекты и запускают процедуру repair. На основе 112 686 задач из 612 профессий получены траектории учителя, которыми дообучены модели Qwen на 4B, 27B и 35B-A3B, образовавшие семейство WorkPilot. Все модели превосходят базовые на четырёх бенчмарках профессиональной работы, например WorkPilot-35B-A3B повышает Elo на GDPval-AA v2.1 с 879 до 1565.'}, 'en': {'title': 'Building Better Tasks for Smarter Agents', 'desc': 'The paper introduces WorkFactory, a framework designed to create coherent professional tasks through information planning and repair. It addresses the challenge of inconsistent task information that can hinder the performance of supervised learning agents. By constructing an information support graph, WorkFactory helps in organizing the dependencies and necessary information for executing tasks effectively. The resulting WorkPilot models demonstrate significant improvements in agent performance across various benchmarks, showcasing the effectiveness of this approach in enhancing supervised training for professional tasks.'}, 'zh': {'title': '构建一致专业任务，提升智能代理表现', 'desc': 'WorkFactory 是一个构建一致专业任务的框架，通过信息规划和修复来提升专家级代理的表现。该框架从专业意图出发，构建信息支持图，以指导任务的实例化，明确表示所需信息的依赖关系和位置。通过探测执行，识别支持失败并指导修复，同时保持预期的工作目标。我们构建了 112,686 个任务，涵盖 612 个职业，并利用收集到的教师轨迹对 Qwen 模型进行微调，显著提升了模型在专业工作基准测试中的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.32411', 'title': "A Broader Look into MLLM's Retrieval Heads", 'url': 'https://huggingface.co/papers/2610.32411', 'abstract': 'Abstract Retrieval heads remain sparse and shared across audio-visual modalities, and optimizing them improves document retrieval performance in multimodal models.  Generated by thinkingmachines/Inkling-Small Locating relevant evidence in long inputs is a core capability of Multimodal Large Language Models. Prior studies attribute this capability to retrieval heads, a sparse set of attention heads that transfer information from the context to the output. However, these analyses are confined to a limited set of modalities and the corresponding models. Moreover, how retrieval heads can be leveraged to enhance the model calls for further exploration. In this paper, we ask whether this mechanism expands together with the input modalities of the model. Taking audio-visual input as a newly added modality, we construct paired inputs in which the same answer is either spoken or shown on screen. With the evidence content fixed, retrieval heads remain sparse in the new modality and are shared to a large extent across modalities. Across 18 language, vision-language, and omni-modal checkpoints, omni-modal models largely preserve the retrieval heads of their backbones. Ablating these heads eliminates nearly all audio-visual retrieval. The heads shared across modalities make up fewer than 2\\% of all heads, yet ablating them also degrades document understanding, spatial perception, and visual mathematics. Building on these findings, we turn retrieval heads into a target of optimization by training their attention with a ranking objective. This raises the page Recall@1 of Qwen3-VL-8B on MMDocIR by 6.03 points and improves document retrieval across three model families. Functional attention heads can thus serve both as a lens on multimodal models and as a target for improving them.', 'score': 28, 'issue_id': 3477, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': 'f97d3b12ea927c04', 'authors': ['Jia Wang', 'Yuqing Li', 'Jiangnan Li', 'Zheng Lin', 'Mo Yu'], 'affiliations': ['Institute of Information Engineering, Chinese Academy of Sciences', 'School of Cyber Security, University of Chinese Academy of Sciences', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2610.32411.jpg', 'data': {'categories': ['#multimodal', '#interpretability', '#architecture', '#training', '#audio', '#benchmark', '#video', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Retrieval heads: от инструмента анализа к цели оптимизации мультимодальных моделей', 'desc': 'Статья исследует «retrieval heads» — редкие attention heads, которые переносят релевантную информацию из длинного контекста в ответ Multimodal LLM. Авторы добавляют аудио-визуальную модальность и показывают, что эти головы остаются разреженными и в основном общими для разных модальностей, а у omni-modal моделей сохраняются из backbone. Абляция этих голов почти полностью убирает аудио-визуальный retrieval и ухудшает понимание документов, пространственное восприятие и визуальную математику. Обучение attention таких голов с ranking objective повышает Recall@1 Qwen3-VL-8B на MMDocIR на 6.03 пункта и улучшает document retrieval у трёх семейств моделей.'}, 'en': {'title': 'Optimizing Retrieval Heads for Enhanced Multimodal Document Retrieval', 'desc': 'This paper investigates the role of retrieval heads in multimodal large language models, particularly focusing on audio-visual inputs. Retrieval heads are specialized attention mechanisms that help the model locate relevant information from long inputs. The study finds that these heads remain sparse and are shared across different modalities, which is crucial for effective document retrieval. By optimizing these retrieval heads, the authors demonstrate significant improvements in retrieval performance across various model families.'}, 'zh': {'title': '优化检索头，提升多模态模型性能', 'desc': '本文探讨了在多模态大语言模型中，检索头的优化如何提升文档检索性能。研究发现，尽管检索头在不同模态间共享且数量稀少，但它们对音频-视觉检索至关重要。通过对检索头进行优化，作者成功提高了模型在文档检索任务中的表现。最终，研究表明，功能性检索头不仅可以帮助理解多模态模型，还可以作为提升模型性能的目标。'}}}, {'id': 'https://huggingface.co/papers/2610.33106', 'title': 'VibeGame: Prompt-to-Game Development with AI-Native Engine and Self-Evolving Adversarial Agent Team', 'url': 'https://huggingface.co/papers/2610.33106', 'abstract': 'Abstract VibeGame is a framework that uses specialized adversarial agents and an AI-native engine to build complete 2D games from natural-language prompts with interactive validation and self-evolving reusable components.  Generated by thinkingmachines/Inkling-Small Large language model agents have enabled software development through natural-language interaction, but extending this paradigm to end-to-end game development remains challenging. Building a playable game requires coordinating code, scenes, assets, animations, physics, and configurations, while allowing developers to validate their integrated behavior through interactive testing. We introduce VibeGame, a framework for creating complete 2D game projects from natural-language prompts and optional reference images. Its AI-native game engine represents project state as schema-validated structured text and provides frame-synchronous runtime control, enabling agents to inspect game states, execute actions, and verify behavior at their own pace. Built upon this interface, we design an Adversarial Agent Team of eight specialized agents to separate implementation from review, so that problems are found and fixed through multi-round loops. For each conducted and accepted project, we further introduce a training-free self-evolution mechanism to distill it into reusable skeletons, modules, and collaboration contracts for future development. We evaluate prompt-assets-to-game (PA2G), where agents are given an asset library, and prompt-to-game (P2G), where agents generate their own art. On a GameCraft-Bench subset, VibeGame in P2G consistently outperforms a range of agent harnesses in either P2G or PA2G with the same underlying model, including GPT-6.1-Sol.', 'score': 20, 'issue_id': 3477, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '90fb4fcc6627fa8b', 'authors': ['Wenbo Hu', 'Ken Li', 'Jiazhe Wei', 'Yukang Cao', 'Weiyi Hong', 'Jiayi Dai', 'Chenjun Bai', 'Jiajun Liang', 'Yucheng Liao', 'Ruichuan An', 'Zeyu Lou', 'Haofan Wang', 'Yueming Lyu', 'Jingkang Yang', 'Ziwei Liu', 'Chenyang Si'], 'affiliations': ['Liblib.ai', 'Nanjing University', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2610.33106.jpg', 'data': {'categories': ['#multimodal', '#games', '#agents', '#open_source', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Игра из одной фразы: агенты, которые создают, проверяют и учатся', 'desc': 'В статье представлен VibeGame — фреймворк, который с помощью LLM-агентов создаёт полноценные 2D-игры по текстовому описанию и опциональным референсным изображениям. Ключевая особенность — AI-native движок, который хранит состояние проекта в виде структурированного текста с валидацией по схеме и даёт агентам покадровое управление рантаймом для проверки поведения. Команда из восьми специализированных агентов разделяет роли реализации и ревью, находя и исправляя ошибки в многораундовых циклах. Дополнительно реализован механизм самоэволюции без обучения, который извлекает из принятых проектов переиспользуемые скелеты, модули и контракты взаимодействия, а на бенчмарке GameCraft-Bench VibeGame в режиме P2G превосходит другие агентные системы на той же базовой модели.'}, 'en': {'title': 'Transforming Game Development with AI and Natural Language', 'desc': 'VibeGame is a novel framework designed for creating complete 2D games using natural language prompts. It employs specialized adversarial agents to manage the complexities of game development, such as coordinating code, assets, and animations, while allowing for interactive validation. The framework features an AI-native engine that maintains project state as structured text, enabling agents to inspect and control game behavior dynamically. Additionally, VibeGame introduces a self-evolution mechanism that allows successful projects to be distilled into reusable components for future development.'}, 'zh': {'title': '用自然语言构建完整2D游戏的创新框架', 'desc': 'VibeGame是一个框架，利用专门的对抗代理和AI原生引擎，从自然语言提示中构建完整的2D游戏。这个框架解决了游戏开发中的复杂性，包括代码、场景、资产、动画、物理和配置的协调。通过交互式测试，开发者可以验证集成行为，确保游戏的可玩性。VibeGame还引入了一种自我进化机制，将项目提炼为可重用的骨架和模块，以便于未来的开发。'}}}, {'id': 'https://huggingface.co/papers/2610.35138', 'title': 'Co-Design Bench: Multimodal Collaborative Coding Evaluation for Agentic Models', 'url': 'https://huggingface.co/papers/2610.35138', 'abstract': "Abstract  Evaluating human-AI co-design requires testing whether coding agents can translate real users' multimodal requests into working application revisions. We introduce Co-Design Bench, a reference-free benchmark of 273 tasks curated from 37,463 deduplicated queries across 26,314 real user coding sessions. Its two tracks, Multimodal Editing (ME) and Repository Editing (RE), cover localized edits with optional image, audio, video, or document inputs and coordinated repository revisions. Tasks span three capability dimensions: Grounded Understanding, UI Transformation, and Functional Implementation. The tasks pair normalized requests and runnable pre-edit applications with 2,331 hidden expert-authored acceptance criteria. Our judge-then-refute protocol grades criteria using source and browser evidence, challenges positive verdicts with a separate LLM verifier, and audits visual and interaction claims without gold code or target screenshots. Under a shared agentic harness, the strongest of ten model endpoints passes an average of 69.9% of criteria per task but fully satisfies only 26.4% of tasks. All ten endpoints achieve lower criterion completion on repository edits spanning three or four change types than on those spanning one or two. Co-Design Bench provides a testbed for studying the gap between partial requirement satisfaction and complete task success under agentic execution for real-user application revisions.", 'score': 19, 'issue_id': 3477, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': '8780c925156c281a', 'authors': ['Xilin Wei', 'Shengyuan Ding', 'Xinyu Fang', 'Tiancheng Gu', 'Yuchi Wang', 'Zhixun Li', 'Ziyu Liu', 'Yuhang Zang', 'Weixiang Yu', 'Cheng Lu', 'Chonggao Sun', 'Tong Zhou', 'Dahua Lin', 'Hang Zhang', 'Shuai Bai', 'Dayiheng Liu'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'Fudan University', 'Nanyang Technological University', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.35138.jpg', 'data': {'categories': ['#multimodal', '#plp', '#dataset', '#cv', '#audio', '#agents', '#benchmark', '#video', '#data'], 'emoji': '🧩', 'ru': {'title': 'От частичного успеха к полной готовности: разрыв в AI-агентах для со-дизайна', 'desc': 'В статье представлен Co-Design Bench — новый бенчмарк для оценки того, насколько AI-агенты для написания кода способны превращать мультимодальные запросы реальных пользователей (текст, изображения, аудио, видео, документы) в работающие правки приложений. Набор включает 273 задачи из почти 26 тысяч реальных сессий и делится на два трека: локальное редактирование (Multimodal Editing) и согласованные изменения в репозитории (Repository Editing). Оценка проводится без эталонного кода: 2 331 скрытый критерий приёмки проверяется протоколом judge-then-refute, где положительные вердикты оспаривает отдельный LLM-верификатор. Результаты показывают, что лучшая из десяти моделей выполняет в среднем 69.9% критериев, но полностью решает лишь 26.4% задач, что выявляет разрыв между частичным и полным успехом агентного выполнения.'}, 'en': {'title': 'Bridging the Gap in Human-AI Co-Design', 'desc': 'This paper presents Co-Design Bench, a new benchmark designed to evaluate how well coding agents can understand and execute user requests that involve multiple types of inputs, such as text, images, and audio. It consists of 273 tasks derived from real user coding sessions, focusing on two main areas: making localized edits and revising entire code repositories. The benchmark assesses agents based on their ability to understand user requests, transform user interfaces, and implement functional changes, using a rigorous grading system that includes expert criteria and verification by a language model. The results show that while the best-performing model meets a significant portion of the criteria, it struggles with more complex tasks that require multiple changes, highlighting the challenges in achieving complete task success in human-AI collaboration.'}, 'zh': {'title': '人机协作设计的新基准测试', 'desc': '本论文介绍了一个名为Co-Design Bench的基准测试工具，用于评估人类与人工智能共同设计的能力。该基准包含273个任务，来源于真实用户的编码会话，涵盖多模态编辑和代码库编辑。任务涉及三个能力维度：基础理解、用户界面转换和功能实现。研究结果显示，尽管模型在任务中表现出一定的能力，但在满足所有要求方面仍存在显著差距。'}}}, {'id': 'https://huggingface.co/papers/2610.40599', 'title': 'HairDeck: Animation-Ready Stylized Hair Cards from a Single Image', 'url': 'https://huggingface.co/papers/2610.40599', 'abstract': "Abstract HairDeck generates stylized hair cards and spring-bone animations as unordered token sets using a diffusion transformer, improving accuracy and speed over prior methods.  Generated by thinkingmachines/Inkling-Small The hair of stylized characters in games and avatars is built from hair cards: artist-placed ribbons whose geometry is the visible hair, animated by spring bones. Existing image-based methods produce realistic hair or a single fused mesh, while CHARM, the only generator of stylized hair cards, decodes a hairstyle autoregressively as a long sequence of control points. Observing that a card hairstyle is an unordered set of artist-defined primitives, we propose HairDeck, which generates it as one: each card is a single token, and a set diffusion transformer denoises all cards together. From a single image, HairDeck generates the cards and the spring-bone chains that drive them, yielding an animatable asset that exports to ready-to-use downstream formats. On CHARM's own test set, it lowers Chamfer distance by 44% and card-orientation error by more than half while running 33 times faster, and from single images it outperforms CHARM, image-to-3D pipelines and strand-based methods. Project page: https://hyzcluster.github.io/HairDeck", 'score': 18, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '18e77b2c3efc2f92', 'authors': ['Yuze He', 'Yixiang Wei', 'Wang Zhao', 'Chuhao Chen', 'Yanning Zhou', 'Yong-Jin Liu'], 'affiliations': ['Carnegie Mellon University', 'The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.40599.jpg', 'data': {'categories': ['#games', '#cv', '#diffusion', '#3d', '#architecture'], 'emoji': '💇', 'ru': {'title': 'Причёска целиком: быстрее и точнее через диффузию над множеством карточек', 'desc': 'HairDeck — это метод, который по одному изображению генерирует стилизованные hair cards (ленты волос) и spring-bone цепочки для их анимации. В отличие от CHARM, который декодирует причёску авторегрессивно как длинную последовательность control points, HairDeck рассматривает причёску как неупорядоченное множество карточек, где каждая карточка представлена одним токеном. Все карточки одновременно денойзит set diffusion transformer, что повышает точность и ускоряет генерацию примерно в 33 раза. Результатом становится готовый к анимации ассет, который экспортируется в стандартные форматы для игр и аватаров.'}, 'en': {'title': 'Revolutionizing Stylized Hair Generation with HairDeck', 'desc': 'HairDeck is a novel approach that generates stylized hair cards and spring-bone animations using a diffusion transformer, which enhances both accuracy and processing speed compared to previous techniques. Unlike traditional methods that create realistic hair or single meshes, HairDeck treats hair cards as unordered sets of tokens, allowing for more efficient generation. By denoising all hair cards simultaneously, it produces animatable assets directly from a single image. The results show significant improvements in accuracy metrics and processing time, making HairDeck a powerful tool for creating stylized character hair in games and avatars.'}, 'zh': {'title': 'HairDeck：高效生成风格化头发的创新方法', 'desc': 'HairDeck 是一种生成风格化头发卡片和弹簧骨动画的方法，使用扩散变换器来提高准确性和速度。与现有的图像基础方法不同，HairDeck 将头发卡片视为无序的艺术家定义的原始元素，并将其作为一个整体生成。每个头发卡片被视为一个单独的标记，集成的扩散变换器可以同时去噪所有卡片。通过从单张图像生成头发卡片和驱动它们的弹簧骨链，HairDeck 提供了可动画的资产，并在性能上显著优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2610.38352', 'title': 'WeVisCut: The Whole Editing Room in One Agent From Narration to Long-Form Video', 'url': 'https://huggingface.co/papers/2610.38352', 'abstract': 'Abstract WeVisCut is a script-to-video system that trains a compact policy to coordinate video editing tools, recover from failures, and reduce token usage while maintaining quality.  Generated by thinkingmachines/Inkling-Small Producing long-form videos from narration requires interdependent decisions that remain coherent across shots. Existing agentic editors often use multi-stage workflows driven by general models, leaving the quality-cost trade-off of compact, task-adapted policies unclear. We address this gap with WeVisCut, a long-form script-to-video system that connects tool execution with policy learning. Its agent harness maintains shared production state so that tool feedback informs subsequent decisions and repairs. Because finished videos do not expose these decisions, our four-stage data pipeline combines editing inversion with verified replay to turn recovered editing intent into executable supervision. Applied to 3,750 finished videos, this pipeline yields over 130K training examples. We use this supervision to train a single 9B policy that coordinates production and recovers from failures within the same harness. Moreover, we introduce a 100-task benchmark and five metrics assessing editing quality and delivery reliability. Under a shared tool environment, WeVisCut substantially outperforms its base model and achieves comparable performance to Claude Opus 5 while using nearly 33x fewer generated tokens per successful output minute. It also outperforms task-matched native editors on our proposed metrics.', 'score': 14, 'issue_id': 3477, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': 'd7de958c576b90b8', 'authors': ['Chenyu Mu', 'Wenming Weng', 'Qinrui Wang', 'Xingsong Ye', 'Hao Yu', 'Jun He', 'Chong Sun', 'Chen Li', 'Jing Lyu', 'Erkun Yang', 'Cheng Deng'], 'affiliations': ['WeChat Vision, Tencent Inc.', 'Xidian University'], 'pdf_title_img': 'assets/pdf/title_img/2610.38352.jpg', 'data': {'categories': ['#games', '#dataset', '#training', '#agents', '#benchmark', '#synthetic', '#video', '#optimization', '#data'], 'emoji': '🎬', 'ru': {'title': 'Компактный агент монтажа: качество Opus при в 33 раза меньшем расходе токенов', 'desc': 'В статье представлен WeVisCut — система для создания длинных видео по сценарию, которая управляет инструментами монтажа через компактную политику, обученную с помощью LLM-агента. Авторы строят четырехэтапный пайплайн данных, который восстанавливает намерения монтажа из готовых видео (editing inversion) и проверяет их через replay, получая более 130 тысяч обучающих примеров из 3750 видео. На этих данных обучается единая 9B-модель, которая координирует производство и восстанавливается после ошибок в той же среде. Также вводятся бенчмарк из 100 задач и пять метрик качества монтажа и надежности доставки. WeVisCut значительно превосходит базовую модель, сопоставим с Claude Opus 5 при расходе токенов примерно в 33 раза меньше и лучше специализированных редакторов по предложенным метрикам.'}, 'en': {'title': 'Efficient Video Editing with WeVisCut: Quality Meets Compactness', 'desc': 'WeVisCut is a novel script-to-video system that optimizes video editing by training a compact policy to effectively manage editing tools and recover from errors. It utilizes a four-stage data pipeline that combines editing inversion and verified replay to create a robust training dataset from finished videos. By maintaining a shared production state, WeVisCut ensures that feedback from editing tools informs future decisions, enhancing the coherence and quality of the final output. The system demonstrates significant improvements in efficiency and performance, achieving high-quality results with substantially fewer resources compared to existing models.'}, 'zh': {'title': 'WeVisCut：高效的视频编辑新方法', 'desc': 'WeVisCut 是一个脚本到视频的系统，旨在通过训练紧凑的策略来协调视频编辑工具，恢复故障并减少令牌使用，同时保持视频质量。该系统通过连接工具执行与策略学习，解决了现有多阶段工作流程中质量与成本之间的权衡问题。WeVisCut 的代理维护共享的生产状态，使得工具反馈能够影响后续决策和修复。经过对 3750 个完成视频的应用，该系统生成了超过 13 万个训练示例，并在编辑质量和交付可靠性方面显著优于基础模型。'}}}, {'id': 'https://huggingface.co/papers/2610.38425', 'title': 'IntReal: A Real-World Dataset and Benchmark for Multimodal Interleaved Generation', 'url': 'https://huggingface.co/papers/2610.38425', 'abstract': "Abstract IntReal introduces a real-world interleaved multimodal dataset and evaluation framework to diagnose unified model strengths and improve generation through targeted training.  Generated by thinkingmachines/Inkling-Small Humans routinely consume multimodal content, where textual and visual information is naturally interleaved. Although Unified Multimodal Models (UMMs) can jointly generate text and images, multimodal interleaved generation remains largely underexplored. Progress in this area is hindered by two key limitations: (1) the lack of well-defined interleaved generation tasks and corresponding training data, and (2) the absence of fine-grained evaluation protocols that can reliably diagnose model performance across different capability dimensions. To this end, we present IntReal, comprising two complementary components: IntReal-100K, a real-world dataset of multimodal interleaved samples spanning four major categories, and the IntReal Evaluation Suite, which evaluates model performance across seven complementary dimensions using specialized expert models, enabling coarse-to-fine diagnosis. Extensive experiments validate our evaluation suite through low inter-metric redundancy (max pairwise absolute Spearman's ρleq 0.42 ), high agreement with human judgments (83.3% accuracy), and strong consistency across different expert evaluators (Spearman's ρ> 0.9 ), supporting the complementarity and reliability of our metrics. By benchmarking four families of UMMs, we show that IntReal Evaluation Suite reveals distinct strengths and weaknesses across models. Post-training experiments demonstrate the utility of IntReal-100K for improving interleaved generation and further show that training unimodal generation can also benefit interleaved generation. These findings suggest that interleaved generation can benefit from modality-specific optimization, rather than requiring joint text-image training at every stage.", 'score': 14, 'issue_id': 3477, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': '8aca87d45abb81f4', 'authors': ['Shaohan Yu', 'Jie Qin', 'Wende Tan', 'Haiwen Diao', 'Limeng Qiao', 'Yueming Lyu', 'Chenyang Si'], 'affiliations': ['Imperial College London', 'Meituan', 'Nanjing University', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2610.38425.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#training', '#benchmark', '#synthetic', '#optimization'], 'emoji': '🧩', 'ru': {'title': 'Чередующаяся мультимодальная генерация выигрывает от оптимизации под каждую модальность', 'desc': 'Статья представляет IntReal — набор из двух компонентов для работы с чередующейся мультимодальной генерацией текста и изображений: датасет IntReal-100K из 100 тысяч реальных примеров и систему оценки IntReal Evaluation Suite. Оценка включает семь взаимодополняющих метрик, которые используют специализированные экспертные модели, и показывает низкую избыточность, высокое согласие с человеческими оценками (83.3%) и устойчивость между разными экспертами. Эксперименты на четырёх семействах Unified Multimodal Models выявили сильные и слабые стороны моделей, а дообучение на IntReal-100K улучшило генерацию. Авторы также показали, что обучение только генерации одной модальности может улучшить чередующуюся генерацию.'}, 'en': {'title': 'Enhancing Multimodal Generation with IntReal', 'desc': 'The paper introduces IntReal, a new dataset and evaluation framework designed to enhance the performance of Unified Multimodal Models (UMMs) in generating interleaved text and images. It addresses the challenges of limited training data and evaluation methods for multimodal interleaved generation tasks. IntReal consists of a dataset with 100,000 real-world samples and an evaluation suite that assesses model performance across multiple dimensions. The findings indicate that targeted training can improve interleaved generation, suggesting that optimizing for specific modalities can be more effective than joint training.'}, 'zh': {'title': '交错生成的未来：优化多模态模型', 'desc': 'IntReal是一个用于诊断统一模型优缺点的真实世界交错多模态数据集和评估框架。该框架通过针对性训练来改善生成效果，特别是在文本和视觉信息交错生成方面。研究表明，现有的统一多模态模型（UMMs）在这一领域的进展受到缺乏明确任务和训练数据的限制。IntReal包含两个部分：一个包含多模态交错样本的数据集和一个评估套件，能够在多个维度上评估模型性能，帮助识别模型的强项和弱项。'}}}, {'id': 'https://huggingface.co/papers/2610.38331', 'title': 'Multi-Token Prediction Done Right', 'url': 'https://huggingface.co/papers/2610.38331', 'abstract': "Abstract Soft-MTP removes a noisy gradient residual from multi-token prediction via a straight-through KL recovery trick, improving perplexity, speculative decoding, and reasoning without added cost.  Generated by thinkingmachines/Inkling-Small Multi-Token Prediction (MTP) is now a common ingredient in language-model pre-training, as it improves downstream performance and enables faster inference through speculative decoding. We identify a flaw in standard MTP training, in which a residual component of the MTP gradient interferes with both next-token and multi-token learning, increasingly so with scale. Specifically, the MTP cross-entropy gradient can be decomposed exactly into a KL self-distillation term that pulls each MTP head toward the model's own next-token prediction (NTP) distribution and improves speculative decoding, and a residual that has a low signal-to-noise ratio and buries the useful KL signal. We introduce the KL gradient-recovery trick: when two distributions share a linear output head, the gradient of their KL divergence can be recovered exactly by combining their cross-entropy gradients through straight-through gradient routing. Unlike minimizing the KL directly, this trick requires no vocabulary-sized logit matrices and is compatible with standard fused cross-entropy kernels. This enables Soft Multi-Token Prediction (Soft-MTP), a one-line code change to MTP that removes the noisy residual and backpropagates only the KL self-distillation signal by reusing the existing NTP and MTP cross-entropy computations. Soft-MTP supports both DeepSeek- and Meta-style MTP, adds no parameters, and incurs no measurable overhead. From 167M to 1.2B parameters, Soft-MTP improves over standard MTP with lower NTP perplexity, faster speculative decoding and higher zero-shot accuracy at every scale, lower MTP perplexity from 689M onward, and stronger math and code reasoning after fine-tuning at 1.2B. Soft-MTP also matches, if not exceeds, direct KL divergence minimization on most metrics. Soft-MTP is, in effect, a free lunch for MTP optimization. Our code can be found at https://github.com/JaydenTeoh/Soft-MTP.", 'score': 11, 'issue_id': 3477, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': 'd6f13dc7c14729e0', 'pdf_title_img': 'assets/pdf/title_img/2610.38331.jpg', 'data': {'categories': ['#plp', '#training', '#reasoning', '#math', '#inference', '#architecture', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Убери шум из MTP — и модель станет быстрее и умнее бесплатно', 'desc': 'В статье обнаружен недостаток стандартного обучения Multi-Token Prediction (MTP): часть градиента cross-entropy мешает как обучению предсказания следующего токена, так и многотокенного предсказания, и этот эффект усиливается с ростом масштаба модели. Авторы показывают, что градиент MTP раскладывается на KL self-distillation, полезный для speculative decoding, и шумный остаточный член с низким signal-to-noise ratio. Предложенный трюк KL gradient-recovery через straight-through gradient routing позволяет получить градиент KL-дивергенции без больших матриц логитов, а метод Soft-MTP реализуется одной строкой кода. Эксперименты от 167M до 1.2B параметров показывают улучшение perplexity, скорости speculative decoding и точности без дополнительных параметров и накладных расходов.'}, 'en': {'title': 'Soft-MTP: A Free Lunch for Multi-Token Prediction Optimization', 'desc': 'The paper introduces Soft-Multi-Token Prediction (Soft-MTP), a method that enhances multi-token prediction in language models by addressing a noisy gradient issue. It utilizes a KL gradient-recovery trick to improve the training process without increasing computational costs. By effectively removing the residual noise from the gradient, Soft-MTP allows for better next-token and multi-token learning, leading to improved performance metrics such as perplexity and reasoning capabilities. This approach is efficient, requiring only a simple code modification and no additional parameters, making it a valuable optimization for large-scale models.'}, 'zh': {'title': 'Soft-MTP：多标记预测的优化新方法', 'desc': 'Soft-MTP是一种改进的多标记预测方法，通过KL恢复技巧去除噪声梯度残差，从而提高了模型的困惑度、推测解码和推理能力，而无需增加额外的计算成本。传统的多标记预测训练存在缺陷，残差成分会干扰下一个标记和多标记的学习。我们提出的KL梯度恢复技巧可以通过直通梯度路由精确恢复KL散度的梯度，避免了直接最小化KL所需的复杂计算。Soft-MTP在不同参数规模下均表现出更低的困惑度和更快的推测解码速度，是多标记预测优化的有效方法。'}}}, {'id': 'https://huggingface.co/papers/2610.21143', 'title': 'CoSTA: Compressed Speech Token Adaptation for Efficient Spoken Dialogue Models', 'url': 'https://huggingface.co/papers/2610.21143', 'abstract': 'Abstract CoSTA decouples generation and synthesis token spaces to accelerate spoken dialogue models while preserving quality and compatibility.  Generated by thinkingmachines/Inkling-Small Spoken Dialogue Models (SDMs) typically share a speech-token space for generation and synthesis, leading to long autoregressive sequences and costly inference. Lower-rate speech tokenizers shorten sequences but may introduce compression-quality trade-offs and costly replacement without breaking this coupling. To address this limitation, we propose CoSTA, a compatibility-preserving post-hoc framework that decouples generation and synthesis token spaces while retaining the original speech tokenizer and decoder. CoSTA extends the generation token space with compressed representations via mean-initialized vocabulary extension, pronunciation adaptation, and dialogue adaptation, followed by deterministic expansion back to the original speech-token space before synthesis. On bilingual speech-dialogue benchmarks, CoSTA achieves approximately 1.7times expanded speech-token generation speed, lower full-response latency, and higher throughput while preserving response quality. Analyses show more sustained interaction under limited budgets and a practical trade-off among compression, decoding efficiency, and quality. Further experiments demonstrate cross-architecture transfer and complementarity to low-rate tokenization.', 'score': 11, 'issue_id': 3477, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': '6d3f5072d7dfc87c', 'authors': ['Yingzhuo Deng', 'Chong Li', 'Bingxin Liu', 'Yi Shu', 'Tianyu Peng', 'Can Xie', 'Siyao Song', 'Shuo Ren', 'Jiajun Zhang'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'School of Artificial Intelligence, University of Chinese Academy of Sciences', 'Wuhan AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2610.21143.jpg', 'data': {'categories': ['#multilingual', '#audio', '#benchmark', '#inference', '#architecture', '#optimization'], 'emoji': '🗣️', 'ru': {'title': 'Быстрее говорить, сохраняя качество: разделяем токены генерации и синтеза речи', 'desc': 'Статья предлагает CoSTA — пост-хок фреймворк, который разделяет пространства токенов для генерации и синтеза речи в Spoken Dialogue Models. Генерация работает с сжатыми представлениями, расширяя словарь через mean-initialized vocabulary extension, адаптацию произношения и адаптацию диалога. Перед синтезом сжатые токены детерминированно разворачиваются обратно в исходное пространство речевых токенов, поэтому оригинальный токенизатор и декодер сохраняются. Эксперименты на двуязычных речевых диалоговых бенчмарках показывают примерно 1.7-кратное ускорение генерации, снижение задержки и рост пропускной способности без потери качества ответов.'}, 'en': {'title': 'Decoupling for Faster and Better Spoken Dialogue Models', 'desc': 'The paper introduces CoSTA, a framework designed to improve the efficiency of spoken dialogue models (SDMs) by separating the generation and synthesis token spaces. Traditional SDMs often face challenges with long autoregressive sequences and high inference costs due to their shared speech-token space. CoSTA enhances the generation process by using compressed representations while maintaining compatibility with existing speech tokenizers and decoders. The results show that CoSTA significantly speeds up speech-token generation and reduces latency, all while ensuring high-quality responses in bilingual speech-dialogue tasks.'}, 'zh': {'title': 'CoSTA：加速语音对话模型的创新框架', 'desc': 'CoSTA是一种新框架，它将生成和合成的令牌空间分开，从而加速语音对话模型，同时保持质量和兼容性。传统的语音对话模型通常共享一个令牌空间，这导致生成过程较长且推理成本高。CoSTA通过扩展生成令牌空间，使用压缩表示来提高生成速度，并在合成前将其转换回原始的语音令牌空间。实验表明，CoSTA在双语语音对话基准测试中实现了约1.7倍的生成速度提升，同时保持了响应质量。'}}}, {'id': 'https://huggingface.co/papers/2610.37786', 'title': 'WebAnything: From the Wild Web to Scalable Agent Environments', 'url': 'https://huggingface.co/papers/2610.37786', 'abstract': 'Abstract WebAnything automates the reconstruction of reusable, source-grounded web environments from real URLs, enabling scalable agent training and evaluation with verified fidelity.  Generated by thinkingmachines/Inkling-Small Web agents require diverse, executable, and resettable website environments for reproducible training and evaluation. Human-assisted mirrors demand per-site engineering, while generative construction can diverge from specified real websites. Capture-and-replay preserves observations, with interaction coverage constrained by captured content and replay capabilities.   We present WebAnything, a fully automated framework that reconstructs source-grounded, reusable Web environments from real URLs without per-site manual implementation or repair after initial setup and authorization. An Explorer-Builder collects browser-observable structures, resources, and interaction outcomes; an independent verifier checks frozen candidates and guides local repair or targeted source recapture.   We construct 244 website artifacts across 14 application domains and 53 categories, supporting 12,984 executed and accepted tasks. Compared with human-assisted WebHarbor, WebAnything achieves higher aggregate scores on three fidelity metrics, with 12 wins, two ties, and no losses in a blind audit. Fine-tuning Qwen3.5-9B on 5,856 interaction trajectories improves REAL success by 9.9 percentage points, Odysseys-Easy Rubric Avg and Task Avg by 6.25 and 6.32 percentage points, and WebArena-Verified Overall success by 13.33 percentage points under the fixed harness. Code: https://github.com/china-qijizhifeng/Web-Anything', 'score': 11, 'issue_id': 3477, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'cf3f7836e2293548', 'authors': ['Tianci Xie', 'Zikun Cai', 'Chaoyun Zhang', 'Pinxue Guo', 'Bingxuan Li', 'Rui Zheng', 'Hang Yan'], 'affiliations': ['Nanyang Technological University', 'Shanghai Qiji Zhifeng Co., Ltd', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.37786.jpg', 'data': {'categories': ['#agi', '#dataset', '#training', '#agents', '#open_source', '#benchmark', '#data'], 'emoji': '🌐', 'ru': {'title': 'Реальные сайты по ссылке, автоматически превращённые в среды для обучения AI-агентов', 'desc': 'В статье представлен WebAnything — полностью автоматизированный фреймворк, который восстанавливает пригодные для повторного использования веб-среды по реальным URL без ручной настройки под каждый сайт. Система использует Explorer-Builder для сбора структур, ресурсов и результатов взаимодействий в браузере, а независимый верификатор проверяет готовые кандидаты и при необходимости запускает локальное исправление или целевую перезапись источника. Построено 244 артефакта сайтов в 14 доменах, на которых выполнено 12 984 принятых задачи, и по метрикам точности WebAnything превосходит human-assisted WebHarbor. Дообучение Qwen3.5-9B на 5 856 траекториях взаимодействий улучшает результаты на REAL, Odysseys-Easy и WebArena-Verified, что подтверждает пользу таких сред для обучения и оценки AI-агентов.'}, 'en': {'title': 'Automating Web Environment Reconstruction for Scalable Agent Training', 'desc': 'WebAnything is a framework that automates the creation of reusable web environments from real URLs, which helps in training and evaluating agents effectively. It eliminates the need for manual setup by using an Explorer-Builder to gather necessary web structures and resources, while an independent verifier ensures the accuracy of these environments. The system has successfully generated 244 website artifacts across various domains, allowing for extensive testing with nearly 13,000 tasks executed. Compared to traditional methods, WebAnything shows significant improvements in fidelity metrics, demonstrating its efficiency and reliability in agent training.'}, 'zh': {'title': 'WebAnything：自动化重建网站环境的创新框架', 'desc': 'WebAnything 是一个自动化框架，可以从真实的 URL 重建可重用的、基于源的网站环境，支持可扩展的智能体训练和评估。该框架通过 Explorer-Builder 收集浏览器可观察的结构和资源，并由独立的验证器检查生成的候选网站。与人工辅助的 WebHarbor 相比，WebAnything 在三个保真度指标上取得了更高的综合得分。通过对 Qwen3.5-9B 进行微调，显著提高了任务成功率和评估指标。'}}}, {'id': 'https://huggingface.co/papers/2610.38342', 'title': "Investor's Last Exam: Can AI Agents Do Equity Investment Without Seeing the Future?", 'url': 'https://huggingface.co/papers/2610.38342', 'abstract': "Abstract Investor's Last Exam evaluates financial agents on end-to-end equity research using frozen evidence, expert criteria, and dependency graphs, revealing that top models excel at research but fail at forecasting and investment judgments.  Generated by thinkingmachines/Inkling-Small Financial agents must form forecasts and investment judgments from decision-time evidence, with predictions evaluated against subsequent outcomes. Existing benchmarks assess financial knowledge, research workflows, or forecasting, but evaluating the full research process requires a strictly frozen information set and professional evaluation criteria. We introduce Investor's Last Exam (ILE), an equity-research benchmark led by experienced buy-side investors and fund managers. Its three components are a versioned financial database spanning 3.43 million document versions and nine source categories, supplemented by structured market data, with validated timestamps governing retrieval and computation; a task taxonomy organized around professional analyst deliverables; and an expert-led framework linking scoring criteria to sources, calculations, and assumptions through financial dependency graphs. Evaluation spans 86 assignments and jointly assesses research quality, forecast accuracy, and simulated investment performance. GPT-6 Astra and Claude Opus 5.5 lead overall at 68.1 and 66.9 out of 100, yet even Astra scores only 52.5 on Forecast & Model. Our results show that even state-of-the-art models fail to translate overall research capability into predictive performance. ILE shifts the evaluation unit from isolated capabilities to the evidence--assumption--judgment chain, allowing researchers to locate where analytical advantages fail to translate into forecasts and investment judgments, and providing a traceable, diagnostic foundation for training and evaluating financial agents.", 'score': 10, 'issue_id': 3477, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': '968f9b15332dc34e', 'authors': ['Huangfei Jiang', 'Anning Hu', 'Kai Sheng', 'Yuchen Cai', 'Rui Ge', 'Xiangyu Kong', 'Jianghao Lin', 'Shuzi Chen', 'Jiyi Weng', 'Junchi Yan'], 'affiliations': ['Antai College of Economics and Management, SJTU', 'Foresight Fund', 'IvyRock Asset Management', 'Prophetlab', 'RethinkLab', 'USTC'], 'pdf_title_img': 'assets/pdf/title_img/2610.38342.jpg', 'data': {'categories': ['#dataset', '#science', '#survey', '#agents', '#benchmark', '#data'], 'emoji': '📈', 'ru': {'title': 'Хорошо исследуешь — не значит хорошо прогнозируешь', 'desc': "В статье представлен Investor's Last Exam (ILE) — бенчмарк для оценки финансовых агентов на полном цикле equity research, созданный под руководством опытных buy-side инвесторов. Агенты получают «замороженный» набор данных с проверенными временными метками, включающий более 3,43 млн версий документов из девяти категорий источников, и должны формировать прогнозы и инвестиционные решения. Оценка проводится по 86 заданиям с использованием финансовых графов зависимостей, связывающих критерии оценки с источниками, расчётами и допущениями. Результаты показывают, что даже лучшие LLM хорошо справляются с исследованием, но проваливаются в прогнозировании и инвестиционных суждениях, например, лучшая модель набирает лишь 52,5 балла из 100 по Forecast & Model."}, 'en': {'title': 'Bridging Research Excellence and Predictive Performance in Finance', 'desc': "The paper introduces Investor's Last Exam (ILE), a benchmark designed to evaluate financial agents on their ability to conduct comprehensive equity research. It highlights that while top machine learning models excel in research tasks, they struggle with making accurate forecasts and investment decisions. The ILE framework includes a vast financial database, a structured task taxonomy, and expert evaluation criteria, all aimed at assessing the entire research process rather than isolated capabilities. This approach allows for a deeper understanding of where analytical strengths do not translate into effective predictions and investment judgments."}, 'zh': {'title': '投资者最后考试：揭示金融研究与预测的差距', 'desc': '本文介绍了投资者最后考试（ILE），这是一个评估金融代理在股票研究中的表现的基准。研究表明，尽管顶尖模型在研究方面表现出色，但在预测和投资判断上却存在不足。ILE通过使用冻结的信息集和专业评估标准，全面评估研究质量、预测准确性和模拟投资表现。该基准的设计帮助研究人员识别分析优势未能转化为预测和投资判断的环节，从而为金融代理的训练和评估提供了可追溯的基础。'}}}, {'id': 'https://huggingface.co/papers/2610.40454', 'title': 'Glance: The Generator Is Its Own Reranker', 'url': 'https://huggingface.co/papers/2610.40454', 'abstract': 'Abstract Glance integrates reranking and generation into a single backbone using lightweight adapters and pointer heads to score passages from shared context, reducing memory overhead while improving retrieval and answer quality.  Generated by thinkingmachines/Inkling-Small Retrieval-augmented generation commonly serves separate models for reranking and answering, duplicating model residency and passage processing. We introduce Glance, which equips the generator with a lightweight decision adapter and pointer head to score candidate passages from a shared prefill. Short relevance probes branch from the cached context, producing one score per passage without separately prefilling each query-passage pair. A single resident 9B backbone supports generation, general decisions and reranking, with approximately 0.1 GiB of additional memory per decision skill. After 39 minutes of MS MARCO fine-tuning, Glance achieves nDCG@10 of 0.741 on SciFact and 0.345 on NFCorpus, compared with 0.721 and 0.326 for bge-reranker-v2-m3. On 300 HotpotQA questions, its selected context improves answer F1 by 0.045 over cross-encoder-selected context under the same base generator (paired bootstrap 95% CI [0.014, 0.076]). In a scaling study, reranking quality keeps rising up to 200 candidates (43k tokens) scored from one shared prefill, where it exceeds the cross-encoder by 0.058 nDCG@10, and a probe-only activated adapter lets generation continue from the original passage cache. These initial results demonstrate
