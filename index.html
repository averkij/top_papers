    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.09888', 'title': 'BDH-CQ: In-Context Learning with Recurrent Latent Reasoning', 'url': 'https://huggingface.co/papers/2608.09888', 'abstract': "Abstract A 150M-parameter reasoning model using recurrent latent reasoning and in-context learning achieves a new cost-accuracy frontier on ARC-AGI-1.  Generated by thinkingmachines/Inkling-Small We introduce BDH-CQ, a reasoning model that combines in-context learning with recurrent latent reasoning. Inputs presented at inference time continuously update the model's recurrent memory; the model then solves a query through iterative computation in a high-dimensional latent space, without verbalizing its intermediate reasoning. We evaluate the model on the public ARC-AGI-1 evaluation set and use controlled ARC-like interventions to study what it learns from demonstrations, how consistently it applies an inferred transformation, and which concepts remain difficult. A 150M-parameter configuration reaches 29.5% pass@2 at a computed inference cost of \\$0.0007 per task. This operating point breaks through the previously reported ARC-AGI-1 cost-accuracy Pareto frontier, establishing a new state of the art in benchmark cost efficiency.", 'score': 199, 'issue_id': 2918, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'aac43605a0962645', 'authors': ['Björn Engdahl', 'Adrian Kosowski', 'Jan Chorowski', 'Zuzanna Stamirowska', 'Przemysław Uznański', 'Junlin Jiang', 'Rohan Phadke', 'Remigiusz Kinas', 'Richard Zhong'], 'affiliations': ['Bielik AI', 'New York University', 'Pathway'], 'pdf_title_img': 'assets/pdf/title_img/2608.09888.jpg', 'data': {'categories': ['#agi', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Эффективное рассуждение в скрытом пространстве без вербализации', 'desc': 'В работе представлена модель BDH-CQ размером 150 миллионов параметров, которая использует рекуррентное скрытое рассуждение и обучение в контексте для решения задач логического мышления. Модель обновляет свою рекуррентную память по мере поступления входных данных и решает задачи через итеративные вычисления в высокомерном латентном пространстве, не вербализуя промежуточные шаги рассуждений. Авторы провели тщательную оценку на наборе ARC-AGI-1, используя контролируемые вмешательства для изучения того, как модель применяет предложенные примеры и какие концепции остаются сложными. Модель достигла нового Парето-оптимального баланса между точностью и стоимостью вычислений, показав результат 29,5% pass@2 при стоимости $0,0007 за одну задачу.'}, 'en': {'title': 'Revolutionizing Cost-Accuracy in Reasoning Models', 'desc': 'The paper presents BDH-CQ, a novel reasoning model that integrates in-context learning with recurrent latent reasoning. This model updates its memory during inference, allowing it to solve queries through iterative computations in a high-dimensional latent space without explicitly stating its reasoning steps. Evaluated on the ARC-AGI-1 benchmark, BDH-CQ demonstrates a significant improvement in cost-efficiency, achieving a pass rate of 29.5% at a low inference cost. This advancement sets a new standard in the cost-accuracy trade-off for reasoning models.'}, 'zh': {'title': '突破成本-准确性前沿的推理模型', 'desc': '本文介绍了一种名为BDH-CQ的推理模型，它结合了上下文学习和递归潜在推理。该模型在推理时通过不断更新递归记忆来处理输入，并在高维潜在空间中通过迭代计算解决查询，而不需要口头表达中间推理过程。我们在公共的ARC-AGI-1评估集上对模型进行了评估，并通过控制ARC类干预来研究模型从示例中学习的内容、应用推断变换的一致性以及哪些概念仍然困难。该模型的150M参数配置在每个任务的计算推理成本为0.0007美元时，达到了29.5%的通过率，突破了之前报告的ARC-AGI-1成本-准确性帕累托前沿，确立了基准成本效率的新状态。'}}}, {'id': 'https://huggingface.co/papers/2608.09819', 'title': 'Macaron-V1: Towards Open Continual Learning with Self-Improvement and Mixture-of-LoRA', 'url': 'https://huggingface.co/papers/2608.09819', 'abstract': 'Abstract  Macaron-V1 is an open agent-model family for experiential intelligence: learning from experience in real environments and continuing to learn after deployment. It is organized around two system goals. Adaptation is pursued through recursive improvement of versioned model-harness pairs, where experience from one configuration is evaluated under an external contract and used to construct its successor. Collaboration is pursued via the Mixture-of-LoRA (MoL) architecture that freezes a base model, composes specialist LoRA adapters, and selects one LoRA per user turn. The flagship Macaron-V1-Venti combines a 744B GLM-5.2 base with four LoRAs for chat, agent, coding, and GenUI; the Qwen3.6-based Macaron-V1-Tall (50B) uses the same design for local deployment. This report presents Macaron-V1 as a co-designed system spanning architecture, algorithms, and infrastructure. The MoL architecture supports continual learning through extensible LoRA specialists. The algorithm combines Model-Harness Co-design and recursive self-improvement loop, including the UI4A component-native GenUI harness, a stateful action substrate, versioned HCP contract, and the agentic RL framework MindForge. The supporting infrastructure includes the post-training platform MinT, the long-context RL method LongStraw, and stability techniques for sparse MoE and DSA base models. We evaluate Macaron-V1 on Personal Intelligence, GenUI, and general capability benchmarks against frontier baselines. Our results validate the current system, while compounding gains from continual learning and collective intelligence remain open questions.', 'score': 145, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'ce6309ffcf9d9383', 'authors': ['Mind Lab', ':', 'Vin Bo', 'Asher Cai', 'Jingwei Cao', 'Song Cao', 'Vic Cao', 'Amelia Chen', 'Andrew Chen', 'Kaijie Chen', 'Cleon Cheng', 'Steven Chiang', 'Kaixuan Fan', 'Hera Feng', 'Huan Feng', 'Arthur Fu', 'Jun Gao', 'Pyke Han', 'Nolan Ho', 'Ori Hong', 'Hailee Hou', 'Piers Hua', 'Charles Huang', 'Miles Jiang', 'Nora Jiang', 'Yuyi Jiang', 'Qiuyu Jin', 'Fancy Kong', 'Kuss Koo', 'Jaron Lee', 'Andrew Lei', 'Alexy Li', 'Dawn Li', 'Lucian Li', 'Ray Li', 'Ricardo Li', 'Smith Li', 'Theo Li', 'Allen Lin', 'Elliot Lin', 'Fan Lin', 'Chen Ling', 'Kairus Liu', 'Kieran Liu', 'Logan Liu', 'Neo Liu', 'Xiang Liu', 'Yuxin Lu', 'Maeve Luo', 'Pony Ma', 'Verity Niu', 'Cole Qiao', 'Guian Qiu', 'Vince Qu', 'Sentry', 'Niko Song', 'Vincent Wang', 'Bo Wu', 'Rio Yang', 'Evelyn Ye', 'Fiona Ye', 'Ina Ye', 'Regis Ye', 'Josh Ying', 'Atlas Zeng', 'Danney Zeng', 'Salmon Zhan', 'Anya Zhang', 'Di Zhang', 'Mia Zhang', 'Sueky Zhang', 'Wei Zhao', 'Ada Zhou', 'Adrian Zhou', 'Yuhua Zhou', 'Juno Zhu', 'Murphy Zhuang'], 'affiliations': ['Mind Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.09819.jpg', 'data': {'categories': ['#open_source', '#multimodal', '#long_context', '#rl', '#architecture', '#optimization', '#transfer_learning', '#training', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Учиться на опыте: модульные агенты с непрерывным самоулучшением', 'desc': 'Macaron-V1 — это семейство открытых агент-моделей, которые обучаются на опыте взаимодействия в реальных окружениях и продолжают улучшаться после развертывания. Система использует два ключевых подхода: адаптация через итеративное улучшение пар модель-окружение с оценкой внешних контрактов, и сотрудничество через архитектуру Mixture-of-LoRA, которая замораживает базовую модель и комбинирует специализированные адаптеры LoRA. Флагманская версия Macaron-V1-Venti объединяет 744B параметров GLM-5.2 с четырьмя LoRA-специалистами для чата, агентских задач, кодирования и генерации интерфейсов. Система включает инфраструктуру для постобучения MinT, методы для работы с длинными контекстами LongStraw и техники стабилизации для разреженных смешанных экспертов.'}, 'en': {'title': 'Empowering Agents with Continual Learning and Collaboration', 'desc': 'Macaron-V1 is a new family of models designed for experiential intelligence, which means they learn from real-world experiences and keep improving even after they are deployed. It focuses on two main goals: adaptation through continuous improvement of model-harness pairs and collaboration using a Mixture-of-LoRA (MoL) architecture that allows for specialized learning. The flagship model, Macaron-V1-Venti, utilizes a large base model with multiple specialized adapters for different tasks, while Macaron-V1-Tall is designed for local use. The system incorporates advanced techniques like continual learning, recursive self-improvement, and various supporting infrastructures to enhance its performance and capabilities.'}, 'zh': {'title': '体验智能的持续学习与协作', 'desc': 'Macaron-V1是一个开放的智能体模型家族，旨在通过在真实环境中学习经验并在部署后继续学习来实现体验智能。该系统围绕两个目标组织：通过递归改进版本化模型与工具的配对来实现适应性，并通过Mixture-of-LoRA（MoL）架构促进协作。MoL架构支持持续学习，结合了模型-工具共同设计和递归自我改进的算法。我们在个人智能、GenUI和一般能力基准上评估了Macaron-V1，结果验证了当前系统的有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.09802', 'title': 'SWE-Bench ProMax: Benchmarking Agents on Large-Scale Multilingual Code Refactoring', 'url': 'https://huggingface.co/papers/2608.09802', 'abstract': 'Abstract  As AI coding agents take on increasingly complex, long-horizon software engineering tasks, existing benchmarks are rapidly saturating and their evaluation quality has come under serious scrutiny: a recent audit found that nearly 60% of unsolved SWE-bench Verified instances contain flawed tests -- either overly narrow tests that reject correct solutions or overly broad tests that check unstated requirements -- and that frontier models can verbatim reproduce gold patches from training data. Code refactoring, which requires coordinated, behavior-preserving changes across many files, offers a substantially harder and more realistic test of agent capability, yet remains underserved by current benchmarks. We introduce SWE-Bench ProMax, an expert-curated, multilingual code refactoring benchmark of 170 instances drawn from real commits across seven programming languages (Python, Java, TypeScript, Go, C, C++, and Rust). Every instance undergoes rigorous, multi-stage curation that directly addresses the quality problems identified in prior benchmarks: issue descriptions are rewritten from scratch to provide precise, unambiguous specifications, and test suites are manually reviewed to remove overly narrow and overly broad tests. Tasks with insufficient complexity or limited cross-file scope are filtered out, yielding a benchmark of challenging, large-scale refactoring tasks that average 11.4 modified files and 261.6 lines of code per instance, substantially exceeding the scale of existing benchmarks. Experiments with frontier models under two agent scaffolds show that the best model achieves only 41.2% resolve rate, confirming that SWE-Bench ProMax presents a meaningful and unsaturated challenge for current AI coding agents. Our benchmark is available at https://huggingface.co/datasets/swe-bench-promax/SWE-Bench-ProMax.', 'score': 115, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'bce586d468a7dec3', 'authors': ['Yuling Shi', 'Jinghan Xu', 'Kelin Fu', 'Wenhao Zeng', 'Shilin He', 'Lei Zhang', 'Yue Liu', 'Zelin Zhao', 'Terry Yue Zhuo', 'Jialun Cao', 'Siyu Ye', 'Tianyu Liu', 'Kai Cai', 'Shing-Chi Cheung', 'Xiaodong Gu'], 'affiliations': ['Douyin Group', 'Monash University', 'National University of Singapore', 'Peking University', 'Shanghai Jiao Tong University', 'The Hong Kong University of Science and Technology', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.09802.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#multilingual', '#dataset', '#plp', '#agents'], 'emoji': '🔨', 'ru': {'title': 'Надёжный бенчмарк для проверки агентов на реалистичном рефакторинге кода', 'desc': 'В статье представлен новый бенчмарк SWE-Bench ProMax для оценки способностей AI кодирующих агентов на задачах рефакторинга кода. Авторы выявили серьёзные проблемы в существующих бенчмарках, включая ошибочные тесты и утечку данных из обучающих наборов, поэтому создали мультиязычный датасет из 170 экземпляров реальных коммитов на семи языках программирования. Каждый экземпляр тщательно курирован: описания задач переписаны для точности, тесты проверены на корректность, а задачи отфильтрованы по сложности, в результате чего в датасете остались только требовательные задачи рефакторинга, охватывающие в среднем 11,4 файла и 261,6 строк кода. Эксперименты показали, что даже передовые модели достигают только 41,2% успеха, что подтверждает значимость и релевантность нового бенчмарка для оценки прогресса в области автоматизации разработки программного обеспечения.'}, 'en': {'title': 'SWE-Bench ProMax: Raising the Bar for AI Code Refactoring Challenges', 'desc': "The paper introduces SWE-Bench ProMax, a new benchmark designed to evaluate AI coding agents on complex code refactoring tasks. It addresses issues found in existing benchmarks, such as flawed tests and insufficient task complexity, by providing 170 carefully curated instances from real-world software commits across multiple programming languages. Each instance features clear specifications and rigorous test suites to ensure high-quality evaluation. The results show that even advanced models struggle with these tasks, achieving only a 41.2% resolve rate, highlighting the benchmark's effectiveness in challenging AI capabilities."}, 'zh': {'title': 'SWE-Bench ProMax：挑战AI编码代理的新基准', 'desc': '随着人工智能编码代理承担越来越复杂的软件工程任务，现有基准测试的评估质量受到严重质疑。我们提出了SWE-Bench ProMax，这是一个专家策划的多语言代码重构基准，包含170个实例，来自七种编程语言的真实提交。每个实例经过严格的多阶段策划，以解决之前基准测试中发现的质量问题，确保任务的复杂性和跨文件范围。实验表明，当前最好的模型在这些任务中的解决率仅为41.2%，证明了SWE-Bench ProMax为现有AI编码代理提供了有意义且未饱和的挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.08311', 'title': 'Ouroboros: A Self-Developing Frontier Coding Agent with Reviewed Core Evolution', 'url': 'https://huggingface.co/papers/2608.08311', 'abstract': 'Abstract  We present Ouroboros, a self-developing agent harness whose tools, prompts, context assembly, and core implementation improve through reviewed commits that become the runtime for later work. Core evolution proceeds in two modes. In recursive free evolution, improvement is itself a task, and completing one evolution cycle can schedule the next. In experience-driven core evolution, ordinary work and social interaction expose bugs, rough edges, and inefficient context construction that lead to reviewed structural changes.   On Terminal-Bench 2.1, an Opus 5 run scores 86.74%, the best result reported on the benchmark. On OSWorld-Verified, an Opus 5 run reaches 90.69%, exceeding the best previously reported score. A five-rollout CL-Bench campaign achieves a normalized reward of 0.2301, setting a new state of the art.   Hope is the longest-running publicly documented Ouroboros deployment. It is a 161-day living agent experiment in free evolution under governed human communication across seven surfaces. Human interaction surfaces faults and generates proposals, but the agent decides which changes to pursue. Because a self-developing agent may rewrite its own code and select new model APIs, operational safety becomes a primary design problem: guardrails must remain authoritative under evolutionary and public social pressure. Benchmark campaigns use frozen system snapshots, while Hope continues live evolution on a separate lineage.', 'score': 62, 'issue_id': 2913, 'pub_date': '2026-08-08', 'pub_date_card': {'ru': '8 августа', 'en': 'August 8', 'zh': '8月8日'}, 'hash': '076878a8fcba8e2f', 'authors': ['Anton Razzhigaev', 'Andrei Gritsaev', 'Andrei Kaznacheev', 'Nikita Dragunov', 'Roman Yampolskiy', 'Andrei Kuznetsov'], 'affiliations': ['FusionBrain Lab at Artificial Intelligence Research Institute', 'Joi Lab', 'Lomonosov Moscow State University', 'Skolkovo Institute of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.08311.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🐍', 'ru': {'title': 'Самоэволюционирующий агент, который улучшает сам себя через итерацию и опыт', 'desc': 'В работе представлен Ouroboros — агент с самообучением, который улучшает свои инструменты, подсказки и контекстное представление через проверенные изменения в коде. Система эволюционирует двумя способами: через свободную эволюцию, где улучшение является задачей, и через опыт-ориентированную эволюцию, где ошибки и неэффективности выявляются при выполнении обычной работы. Модель Opus 5 достигает лучших результатов на трёх бенчмарках: 86.74% на Terminal-Bench 2.1, 90.69% на OSWorld-Verified и 0.2301 нормализованной награды на CL-Bench. Hope — это 161-дневный публичный эксперимент с живым агентом, демонстрирующий долгосрочную самоэволюцию с контролем безопасности через человеческое взаимодействие.'}, 'en': {'title': 'Evolving Intelligence: Ouroboros Redefines Self-Development in Agents', 'desc': "Ouroboros is a self-developing agent that enhances its tools and implementation through a process of reviewed commits, allowing it to evolve over time. It operates in two modes: recursive free evolution, where the agent focuses on improving itself, and experience-driven evolution, where real-world interactions help identify and fix issues. The agent has achieved impressive results on benchmarks, scoring 86.74% on Terminal-Bench 2.1 and 90.69% on OSWorld-Verified, setting new performance records. A long-term experiment named Hope demonstrates the agent's ability to evolve in a live environment while maintaining operational safety through careful design and oversight."}, 'zh': {'title': 'Ouroboros：自我发展的智能体系统', 'desc': '本文介绍了Ouroboros，一个自我发展的智能体系统，其工具、提示、上下文组装和核心实现通过审核的提交不断改进。核心进化有两种模式：递归自由进化和经验驱动核心进化，前者将改进视为任务，后者通过日常工作和社交互动发现问题并进行结构性改进。在多个基准测试中，Ouroboros表现出色，创造了新的最佳成绩。该系统的设计还考虑了操作安全性，以确保在进化和社会压力下，智能体能够安全地进行自我改写和选择新模型API。'}}}, {'id': 'https://huggingface.co/papers/2608.07169', 'title': 'Agent Memory Distillation: Empowering Small LLM Agents with Hierarchical Teacher Memory', 'url': 'https://huggingface.co/papers/2608.07169', 'abstract': 'Abstract  Memory systems have shown promise for improving agent performance, but their potential remains largely unexplored for small language models, which struggle to generate sufficient successful trajectories on their own. We propose Agent Memory Distillation (AMD), a training-free framework that transfers structured knowledge from a large teacher agent to a small student agent through hierarchical memory. AMD constructs three complementary memory types from successful teacher trajectories: Workflow memory encodes task-level strategies, Subtask memory provides concrete behavioral examples at an intermediate granularity, and Function memory captures per-function calling conventions and common pitfalls. Workflow and Subtask memories are injected proactively at the start of each task, while Function memory is retrieved reactively upon tool-calling errors. We evaluate AMD on three tool-use benchmarks using four student models (4B-8B parameters) with GPT-5-mini as the teacher, achieving average accuracy gains of 27.2%p, 11.2%p, and 3.4%p on AppWorld, BFCL V3, and ToolSandbox, while consistently outperforming existing memory-based baselines. Further analysis shows that Subtask memory contributes the largest gains, teacher effectiveness depends on both teacher capability and student compatibility, and 4B-sized students benefit most from AMD.', 'score': 29, 'issue_id': 2913, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': '2f70621c925564bb', 'authors': ['Taeil Kim', 'Kangsan Kim', 'Sung Ju Hwang'], 'affiliations': ['DeepAuto.ai', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2608.07169.jpg', 'data': {'categories': ['#training', '#agents', '#benchmark', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Передача памяти от больших моделей к маленьким через дистилляцию знаний', 'desc': 'В статье предложена методика Agent Memory Distillation (AMD), которая позволяет передавать структурированное знание от большой учительской модели к маленькой студенческой модели через иерархическую систему памяти. Фреймворк конструирует три типа памяти из успешных траекторий учителя: память workflow кодирует стратегии задач, память subtask предоставляет конкретные примеры поведения, а память function фиксирует соглашения вызовов функций. Предложенный подход не требует переобучения и достигает прироста точности до 27.2 процентных пункта на бенчмарках работы с инструментами для моделей размером 4-8 миллиардов параметров.'}, 'en': {'title': 'Boosting Small Models with Memory from Big Teachers', 'desc': "This paper introduces Agent Memory Distillation (AMD), a novel framework designed to enhance the performance of small language models by leveraging structured knowledge from larger teacher agents. AMD utilizes three types of memory: Workflow memory for task strategies, Subtask memory for specific behavioral examples, and Function memory for common function usage errors. These memories are strategically injected or retrieved during task execution to improve the agent's decision-making process. The results demonstrate significant accuracy improvements across various benchmarks, highlighting the effectiveness of memory systems in training smaller models."}, 'zh': {'title': '代理记忆蒸馏：提升小型模型性能的新方法', 'desc': '本文提出了一种名为代理记忆蒸馏（AMD）的新框架，旨在通过层次化记忆将大型教师代理的结构化知识转移到小型学生代理上。AMD构建了三种互补的记忆类型：工作流记忆、子任务记忆和函数记忆，以帮助小型语言模型提高性能。通过在每个任务开始时主动注入工作流和子任务记忆，并在工具调用错误时反应性地检索函数记忆，AMD显著提升了学生模型在多个基准测试中的准确性。分析结果表明，子任务记忆对性能提升贡献最大，而教师的有效性依赖于教师能力和学生兼容性。'}}}, {'id': 'https://huggingface.co/papers/2608.09119', 'title': 'Motif 3: Technical Report', 'url': 'https://huggingface.co/papers/2608.09119', 'abstract': 'Abstract  We introduce Motif 3, a decoder-only Mixture-of-Experts language model with 314 billion total parameters and 13.2 billion activated per token. Each sparse MoE layer contains 384 routed experts, with eight selected per token. This fine-grained sparsity provides substantial expert capacity while limiting computation. Motif 3 is built around Grouped Differential Latent Attention (GDLA), which integrates grouped differential attention with the compressed key-value representation of Multi-head Latent Attention. The architecture further incorporates modified manifold-constrained hyper-connections, Expert Specific PolyNorm activations, and multi-token prediction to improve optimization stability, expert specialization, and inference efficiency. We pretrain Motif 3 on approximately 12.5 trillion tokens spanning web documents, STEM, code, mathematics, multilingual content, and domain-specialized corpora. Expert-balancing and numerical-stabilization techniques support stable training at scale, while selective MXFP8 computation and communication, memory-efficient fused kernels, and window-aware context parallelism enable training with context lengths up to 256K tokens. Our post-training pipeline combines general supervised fine-tuning, six specialist teachers trained with reinforcement learning, a software-engineering teacher trained with supervised fine-tuning, and Multi-teacher On-Policy Distillation. The resulting unified model consolidates complementary capabilities in reasoning, coding, tool use, professional work, long-context understanding, calibrated abstention, and instruction following. Across a broad evaluation suite, Motif 3 demonstrates competitive performance against leading open weight models, including strong results on long-horizon agentic tasks, mathematical reasoning, scientific knowledge, and hallucination-sensitive evaluation.', 'score': 28, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'c51652bf9238e6eb', 'authors': ['Junghwan Lim', 'Joon Son Chung', 'Sungmin Lee', 'Wai Ting Cheung', 'Gihun Cho', 'Minsu Ha', 'Sangho Kang', 'Beomgyu Kim', 'Dongseok Kim', 'Jangwoong Kim', 'Taehyun Kim', 'Taewhan Kim', 'Jeesoo Lee', 'Jeongdoo Lee', 'Junhyeok Lee', 'Dongpin Oh', 'Hyeyeon Cho', 'Dahye Choi', 'Jaeheui Her', 'Hanbin Jung', 'Changjin Kang', 'Minjae Kim', 'Youngrok Kim', 'Hyukjin Kweon', 'Hongjoo Lee', 'Yeongjae Park', 'Bokki Ryu'], 'affiliations': ['Motif Technologies'], 'pdf_title_img': 'assets/pdf/title_img/2608.09119.jpg', 'data': {'categories': ['#rlhf', '#open_source', '#math', '#multilingual', '#long_context', '#architecture', '#optimization', '#science', '#training', '#plp', '#agents'], 'emoji': '⚡', 'ru': {'title': 'Эффективная разреженная сеть экспертов с инновационным вниманием для масштабных языковых моделей', 'desc': 'Представлена Motif 3 — декодер-only языковая модель на основе смеси экспертов (MoE) с 314 миллиардами параметров, из которых активируется лишь 13.2 миллиарда на токен, что обеспечивает эффективность вычислений при сохранении ёмкости. Архитектура использует инновационный механизм Grouped Differential Latent Attention для оптимизации внимания и компрессии представлений ключ-значение, дополненный специализированными техниками активации и многотокенным предсказанием. Модель предварительно обучена на 12.5 триллионах токенов разнообразных корпусов с применением методов стабилизации обучения в масштабе и оптимизации памяти, включая контексты до 256K токенов. Post-training этап объединяет supervised fine-tuning и reinforcement learning с несколькими специализированными учителями, позволяя модели достичь конкурентной производительности в рассуждениях, кодировании, длинноконтекстном понимании и других сложных задачах.'}, 'en': {'title': 'Unlocking Language with Expert Precision', 'desc': 'Motif 3 is a large language model that uses a decoder-only architecture with a total of 314 billion parameters, focusing on a Mixture-of-Experts (MoE) approach. It activates 13.2 billion parameters per token by routing eight out of 384 experts for each token, allowing for efficient computation while maintaining high capacity. The model employs advanced techniques like Grouped Differential Latent Attention (GDLA) and specialized activations to enhance optimization and inference efficiency. After extensive pretraining on diverse datasets, Motif 3 achieves strong performance across various tasks, including reasoning and coding, while effectively managing long context lengths up to 256K tokens.'}, 'zh': {'title': 'Motif 3：高效的混合专家语言模型', 'desc': 'Motif 3 是一种解码器专用的混合专家语言模型，拥有3140亿个参数和每个token激活的132亿个参数。该模型采用稀疏的MoE层，每层包含384个专家，每个token选择8个专家，从而在保持计算效率的同时提供强大的专家能力。Motif 3的架构结合了分组差异注意力和压缩的多头潜在注意力的键值表示，进一步增强了优化稳定性和专家专业化。经过在约12.5万亿个token上的预训练，Motif 3在推理、编码和长文本理解等多个任务上表现出色，展现了与领先模型的竞争力。'}}}, {'id': 'https://huggingface.co/papers/2608.09873', 'title': 'Sci-VBench: Evaluating Knowledge- and Reasoning-Intensive Video Generation in Science Domains', 'url': 'https://huggingface.co/papers/2608.09873', 'abstract': 'Abstract  We introduce Sci-VBench, a comprehensive benchmark for evaluating knowledge- and reasoning-intensive video generation across scientific domains. It contains 1,253 expert-annotated examples spanning 60 subjects across four core disciplines: Natural Science, Healthcare, Humanities & Social Sciences, and Engineering. Each example requires models to generate temporally rich videos that demand scientific reasoning and knowledge-grounded synthesis, going beyond surface-level visual plausibility. We further establish a rubric-based evaluation protocol. Our analysis shows that, under this protocol, both non-expert human evaluators and MLLM-as-Judge systems can achieve relatively high agreement with expert judgments, supporting reproducible evaluation at scale. We benchmark 16 frontier proprietary and open-source models and find that, while automatic perceptual-quality scores cluster tightly across systems, performance on Prompt Grounding and Scientific and Causal Correctness varies substantially, with a pronounced proprietary-open-source gap. These findings show that advances in visual realism have not yet translated into reliable modeling of scientific and causal dynamics.', 'score': 22, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'a6fb3c08c6fdc964', 'authors': ['Diandian Zhang', 'Tingyu Song', 'Lin Fu', 'Zheyuan Yang', 'Yilun Zhao'], 'affiliations': ['Tongji University', 'UCAS', 'Yale University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.09873.jpg', 'data': {'categories': ['#video', '#open_source', '#benchmark', '#dataset', '#reasoning', '#multimodal', '#science'], 'emoji': '🎬', 'ru': {'title': 'Научное видео: визуальное совершенство без логики', 'desc': 'В работе представлен Sci-VBench — комплексный бенчмарк для оценки генерации видео, требующей научных знаний и логического мышления в различных научных областях. Бенчмарк содержит 1253 примера, аннотированные экспертами, охватывающие 60 дисциплин в четырёх основных областях: естественные науки, здравоохранение, гуманитарные науки и инженерия. Авторы разработали протокол оценки на основе рубрик и показали, что как люди, так и мультимодальные LLM могут достигать высокого согласия с экспертными суждениями. Тестирование 16 моделей выявило существенный разрыв между проприетарными и открытыми системами в моделировании научной корректности, хотя визуальное качество улучшилось.'}, 'en': {'title': 'Benchmarking Scientific Video Generation: Bridging Knowledge and Visual Realism', 'desc': 'Sci-VBench is a new benchmark designed to assess video generation models that require deep knowledge and reasoning in scientific fields. It includes 1,253 examples across four main disciplines, challenging models to create videos that are not only visually appealing but also scientifically accurate. The study introduces a structured evaluation method that allows both human judges and machine learning models to assess video quality effectively. Results indicate that while visual quality is improving, there is still a significant gap in accurately modeling scientific concepts and causal relationships, especially between proprietary and open-source models.'}, 'zh': {'title': '科学视频生成的评估新基准', 'desc': '我们介绍了Sci-VBench，这是一个全面的基准，用于评估科学领域中知识和推理密集型的视频生成。该基准包含1253个专家注释的示例，涵盖自然科学、医疗保健、人文与社会科学和工程四个核心学科。每个示例要求模型生成时间丰富的视频，这需要科学推理和知识基础的综合，超越表面视觉的可信度。我们的分析表明，在这种评估协议下，非专家人类评估者和MLLM作为评判系统可以与专家判断达成相对高的一致性，支持大规模的可重复评估。'}}}, {'id': 'https://huggingface.co/papers/2608.07565', 'title': 'What to Edit Next: Visually Aligned Image-Editing Follow-Up Suggestions in Conversational Systems', 'url': 'https://huggingface.co/papers/2608.07565', 'abstract': 'Abstract  Conversational assistants increasingly recommend follow-up edits to help users continue a task. Existing systems primarily target text-only interactions, leaving image-creation conversations underexplored. In image-creation tasks, useful follow-up edit suggestions must reflect user preferences, offer diverse directions, and remain executable on the current image. We collected 100,000 real multi-turn image-creation conversation samples from Qwen App and found that 80.1% are image-dependent, underscoring the need for multimodal recommendation. We address this setting with a three-stage framework. In Stage 1, we use real online data to build a human-reviewed table of appropriate follow-up editing intents, then create SFT targets and fine-tune a multimodal policy. In Stage 2, to align rule-guided SFT suggestions with actual user choices, we use user click feedback to optimize the policy through multi-objective reinforcement learning. In Stage 3, to reduce visual inconsistencies between suggested edits and the current image, we introduce a visual verifier as additional training supervision. Extensive experiments demonstrate that our framework significantly outperforms baselines on both automatic and human evaluations. In a live user-randomized A/B test with millions of users, our final framework reduces visual inconsistency from 3.7% to 0.9%. Furthermore, it significantly improves recommendation CTR by 32.70%, image take-away rate by 16.32%, and average conversation turns per user by 39.90% (all p<0.05).', 'score': 22, 'issue_id': 2915, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e2ad52c7be7675de', 'authors': ['Zhijing Zhang', 'Jinpeng Yu', 'Xin Song', 'Bingnan Li', 'Chuyue Li', 'Changhui Du', 'Xiaolin Fang', 'Jiaming Liu', 'Ruihua Huang'], 'affiliations': ['Qwen Business Unit of Alibaba', 'Southeast University'], 'pdf_title_img': 'assets/pdf/title_img/2608.07565.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'title': 'Умные рекомендации правок для создания изображений через multimodal обучение с подкреплением', 'desc': 'В статье предлагается трёхэтапный framework для рекомендации follow-up правок в multi-turn диалогах по созданию изображений. Авторы собрали 100,000 real-world примеров разговоров и обнаружили, что 80.1% рекомендаций зависят от текущего изображения, что требует multimodal подхода. Framework использует supervised fine-tuning для инициализации policy, затем multi-objective reinforcement learning для выравнивания с user feedback, и наконец добавляет visual verifier для повышения консистентности между рекомендациями и исходным изображением. Эксперименты показали значительное снижение visual inconsistency с 3.7% до 0.9% и увеличение CTR на 32.70% в production A/B тесте с миллионами пользователей.'}, 'en': {'title': 'Enhancing Image-Creation Conversations with Smart Edit Suggestions', 'desc': 'This paper presents a new framework for improving follow-up edit suggestions in image-creation conversations, addressing a gap in existing systems that focus mainly on text. The authors collected a large dataset of multi-turn conversations to understand user preferences and the importance of multimodal recommendations. Their three-stage approach includes building a table of editing intents, optimizing suggestions using user feedback through reinforcement learning, and employing a visual verifier to ensure consistency with the current image. The results show significant improvements in user engagement and satisfaction, highlighting the effectiveness of their method in real-world applications.'}, 'zh': {'title': '提升图像创作对话助手的推荐效果', 'desc': '本论文探讨了对话助手在图像创作任务中的后续编辑建议。我们收集了来自Qwen App的100,000个真实多轮对话样本，发现80.1%的建议与图像相关，强调了多模态推荐的必要性。我们提出了一个三阶段框架，首先构建适当的编辑意图表，然后通过多目标强化学习优化策略，最后引入视觉验证器以减少建议编辑与当前图像之间的视觉不一致性。实验结果表明，该框架在自动和人工评估中均显著优于基线，且在用户随机A/B测试中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.09867', 'title': 'Stealing Reasoning Traces from Proprietary LLM APIs', 'url': 'https://huggingface.co/papers/2608.09867', 'abstract': "Abstract  Leading large language model providers now conceal their models' step-by-step reasoning, or chain-of-thought, to protect intellectual property and limit information leakage. Rather than storing these traces server-side, providers return them to the client as blocks of encrypted text, which the client passes back with each subsequent request. Building on prior research, we identify an architectural vulnerability: these encrypted blocks are fully compatible and interchangeable across different sessions, users, and models within a provider's ecosystem. We exploit this compatibility to develop a scalable decryption jailbreak. By injecting an encrypted reasoning trace from a given model into a weaker, and less safeguarded model from the same provider, we force it to decode and output the trace verbatim in plaintext, without ever jailbreaking the more capable model directly. This vulnerability enables four distinct attack vectors. First, it circumvents anti-distillation mechanisms, allowing adversaries to extract a proprietary model's reasoning, as we demonstrate across Anthropic, OpenAI, and Google. Second, it allows for large-scale private data extraction. Developers frequently share session logs publicly, unaware of contents of the encrypted blocks. By decoding 315,320 reasoning blocks scraped from public repositories, we recovered 367 Personally Identifiable Information (PII) artifacts and 182 credentials. Third, it inadvertently reveals hazardous information hidden within the reasoning process, even in cases where the model's final, visible output safely rejects a malicious request. Fourth, attackers can leverage this flaw to execute invisible prompt injections, embedding malicious payloads entirely within encrypted blocks to poison public agentic rollouts. Following responsible disclosure, we propose concrete cryptographic and system-level mitigations to secure client-side reasoning.", 'score': 17, 'issue_id': 2916, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': '11c757a849ea8652', 'authors': ['Alexander Panfilov', 'David Schmotz', 'Ilia Shumailov', 'Luca Beurer-Kellner', 'Joachim Schaeffer', 'Ameya Prabhu', 'Jonas Geiping', 'Maksym Andriushchenko'], 'affiliations': ['AI Sequrity Company', 'ELLIS Institute Tübingen', 'MATS Research', 'Max Planck Institute for Intelligent Systems', 'Snyk', 'Tübingen AI Center', 'University of Tübingen'], 'pdf_title_img': 'assets/pdf/title_img/2608.09867.jpg', 'data': {'categories': ['#security', '#reasoning', '#leakage'], 'emoji': '🔓', 'ru': {'title': 'Взлом через совместимость: как слабые модели раскрывают секреты сильных', 'desc': 'В статье исследуется критическая уязвимость в архитектуре крупных языковых моделей, где цепочки рассуждений (chain-of-thought) возвращаются клиентам в виде зашифрованных блоков. Авторы обнаружили, что эти зашифрованные блоки совместимы и взаимозаменяемы между сессиями и моделями внутри экосистемы провайдера, что позволяет использовать их для атак на более слабые модели. Путём инъекции зашифрованного reasoning-блока одной модели в менее защищённую модель того же провайдера, исследователи заставляют её декодировать и выводить информацию в открытом виде. Такая уязвимость позволяет осуществлять атаки на извлечение моделей, утечку приватных данных, раскрытие скрытой информации и невидимые prompt-инъекции в публичные системы.'}, 'en': {'title': 'Unlocking Vulnerabilities in Language Model Security', 'desc': 'This paper discusses a security vulnerability in large language models where encrypted reasoning traces can be exploited. The authors demonstrate that these encrypted blocks are interchangeable across different models and sessions, allowing attackers to decode sensitive information. They reveal that this vulnerability can lead to the extraction of proprietary reasoning, private data, and even hazardous information. The paper concludes with recommendations for cryptographic and system-level improvements to enhance the security of client-side reasoning.'}, 'zh': {'title': '揭示大型语言模型的安全漏洞', 'desc': '这篇论文探讨了大型语言模型提供者如何保护其模型的推理过程，以防止知识产权泄露。研究发现，模型返回的加密推理块在不同会话、用户和模型之间是兼容的，这使得攻击者能够利用这一漏洞进行解密攻击。通过将一个模型的加密推理块注入到另一个较弱的模型中，攻击者可以获取原始推理内容。论文还提出了具体的加密和系统级的解决方案，以增强客户端推理的安全性。'}}}, {'id': 'https://huggingface.co/papers/2608.04419', 'title': 'SPOT: Sparse Probing and Outcome Calibration for On-Policy Distillation', 'url': 'https://huggingface.co/papers/2608.04419', 'abstract': 'Abstract  On-policy distillation (OPD) provides dense teacher supervision on student-generated trajectories, but standard reverse-KL training can assign insufficient probability to other plausible continuations. Teacher entropy alone does not reveal whether uncertainty is concentrated among a few plausible next tokens or dispersed over a long probability tail, nor whether the student already represents those candidates well. Moreover, local teacher probabilities may not predict downstream success. We introduce Sparse Probing and Outcome-calibrated Targets OPD (SPOT), which addresses two coupled decisions, where to probe and what to distill, through an acquisition--exploration--exploitation procedure. During acquisition, a position-level score combines normalized teacher entropy, the probability mass captured by a small top-k candidate set, and student--teacher mismatch to allocate a limited probing budget. During exploration, SPOT evaluates teacher-proposed candidates through verifier-scored student continuations. During exploitation, these outcomes produce a closed-form, KL-regularized target that favors candidates with better downstream outcomes while remaining anchored to the teacher distribution. Extensive experiments across multiple student models and reasoning benchmarks demonstrate the effectiveness of SPOT in improving reasoning performance while balancing solution quality and coverage.', 'score': 16, 'issue_id': 2912, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'e4aa6f2385bd23aa', 'authors': ['Zikun Qu', 'Min Zhang', 'Mingze Kong', 'Zhiwei Shang', 'Yikun Ban', 'Shuang Qiu', 'Zhongxiang Dai'], 'affiliations': ['Beihang University', 'City University of Hong Kong', 'East China Normal University', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2608.04419.jpg', 'data': {'categories': ['#training', '#rlhf', '#reasoning', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Целевая дистилляция: выбирая, где учиться и на что равняться', 'desc': 'В статье предлагается метод SPOT для дистилляции знаний от учителя к студенту, который решает задачу выбора наиболее информативных позиций для обучения и определения оптимальных целевых распределений вероятностей. Авторы используют комбинированный score, учитывающий энтропию учителя, концентрацию вероятностной массы на топ-k кандидатов и различия между предсказаниями учителя и студента, чтобы эффективно распределить ограниченный бюджет проб. Через процедуру acquisition-exploration-exploitation модель оценивает предложенные кандидаты, используя верификаторы, а затем генерирует калиброванные целевые распределения с KL-регуляризацией, которые благоприятствуют вариантам с лучшим качеством на выходе. Экспериментальные результаты показывают, что SPOT значительно улучшает производительность моделей рассуждения, достигая баланса между качеством и разнообразием решений.'}, 'en': {'title': 'Enhancing Student Learning with SPOT: Smart Probing for Better Outcomes', 'desc': 'The paper introduces Sparse Probing and Outcome-calibrated Targets OPD (SPOT), a method that enhances on-policy distillation by effectively managing teacher supervision on student trajectories. It addresses the limitations of standard reverse-KL training, which may not adequately represent diverse plausible continuations. SPOT employs a systematic approach that includes acquisition, exploration, and exploitation phases to optimize the probing process and distillation targets. Experimental results show that SPOT significantly improves reasoning performance in student models while ensuring a good balance between solution quality and coverage.'}, 'zh': {'title': '提升推理性能的稀疏探测方法', 'desc': '本文提出了一种新的方法，称为稀疏探测和结果校准目标的在线蒸馏（SPOT），旨在改善学生模型的推理性能。SPOT通过获取、探索和利用的过程，解决了在蒸馏过程中如何选择探测位置和蒸馏内容的两个关键决策。它结合了教师的熵、候选集的概率质量和学生与教师之间的不匹配，来优化探测预算。通过大量实验，SPOT在多个学生模型和推理基准上显示了其在提高推理性能方面的有效性，同时平衡了解决方案的质量和覆盖率。'}}}, {'id': 'https://huggingface.co/papers/2608.08097', 'title': 'OasisKV: Scaling In-Decode KV Cache Beyond HBM with Lookahead Sparse Prefetching', 'url': 'https://huggingface.co/papers/2608.08097', 'abstract': 'Abstract  Large language model (LLM) inference serving is increasingly constrained by memory rather than compute. As long-context and long-form reasoning workloads become more prevalent, the key-value (KV) cache dominates both memory footprint and memory traffic during LLM token generation, i.e., decode. In particular, HBM capacity has become a scarce and costly resource that heavily limits inference batch size and system throughput. This paper presents OasisKV, a memory-centric LLM inference system design that alleviates HBM capacity pressure by decoupling full KV-cache storage from HBM during LLM decoding. Because decode-time attention is naturally sparse, OasisKV keeps only the KV entries of the most relevant tokens in HBMs for attention computation. We observe that future important tokens can be predicted accurately in advance using lookahead tokens drafted by speculative decoding (SD). OasisKV employs an efficient attention background pipeline to identify important KV blocks. They are then prefetched from higher-capacity memory tiers (e.g., host or remote memory) and staged in HBMs before being used in the next decode step.   We implement OasisKV based on vLLM. The lookahead prediction is accurate enough to keep accuracy within 0.7 points of full attention under a 2,048-token KV budget. This lets OasisKV turn sparsity into throughput gain: 1.69times over dense vLLM on the reasoning workload at 0.1 points of accuracy loss, and up to 2.1times on multi-GPU long-context serving. Under prefill--decode disaggregation, OasisKV reaches about 2times dense throughput while admitting each request with 6.5--9.7times less KV and holding 2.2-2.6 less decode-node host memory than full KV transfer.', 'score': 15, 'issue_id': 2913, 'pub_date': '2026-08-08', 'pub_date_card': {'ru': '8 августа', 'en': 'August 8', 'zh': '8月8日'}, 'hash': '744769a2bbbc15d4', 'authors': ['Can Xiao', 'Sukmin Cho', 'Junbong We', 'Zhixiong Niu', 'Jianyi Cheng', 'Yiren Zhao', 'Youngjin Kwon', 'Yongqiang Xiong', 'Rui Ma', 'Junyi Liu'], 'affiliations': ['Imperial College London', 'KAIST', 'Microsoft Research', 'University of Edinburgh'], 'pdf_title_img': 'assets/pdf/title_img/2608.08097.jpg', 'data': {'categories': ['#long_context', '#optimization', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Редкие внимание и многоуровневая память для скоростного инференса LLM', 'desc': 'Статья посвящена оптимизации инференса больших языковых моделей, где узким местом является память, особенно при обработке длинных контекстов. Авторы предлагают систему OasisKV, которая разделяет хранилище KV-кеша между быстрой памятью (HBM) и более медленными уровнями памяти, сохраняя в HBM только записи для наиболее релевантных токенов. Система использует спекулятивный декодинг с предварительным просмотром для точного предсказания важных токенов, а также фоновый конвейер для предзагрузки необходимых KV-блоков. Экспериментальные результаты показывают, что OasisKV достигает ускорения в 1.69-2.1 раза при минимальной потере точности, одновременно значительно снижая требования к памяти.'}, 'en': {'title': 'OasisKV: Boosting LLM Inference Efficiency with Smart Memory Management', 'desc': 'This paper introduces OasisKV, a new system designed to improve the efficiency of large language model (LLM) inference by addressing memory limitations. It focuses on optimizing the key-value (KV) cache, which is crucial for token generation but often consumes too much high-bandwidth memory (HBM). By predicting important tokens in advance and only storing relevant KV entries in HBM, OasisKV reduces memory usage while maintaining high throughput. The results show that OasisKV can significantly outperform traditional dense models in terms of speed and memory efficiency, with minimal impact on accuracy.'}, 'zh': {'title': 'OasisKV：提升大语言模型推理效率的内存优化方案', 'desc': '这篇论文介绍了一种名为OasisKV的内存中心大语言模型推理系统设计。随着长上下文和长形式推理任务的增加，关键值（KV）缓存的存储和流量成为了内存的主要瓶颈。OasisKV通过在解码过程中将KV缓存存储与高带宽内存（HBM）解耦，减轻了HBM的容量压力。该系统利用预测未来重要令牌的能力，优化了内存使用，从而在保持高准确度的同时显著提高了推理吞吐量。'}}}, {'id': 'https://huggingface.co/papers/2608.07594', 'title': 'Scaling Inherently Interpretable Language Models', 'url': 'https://huggingface.co/papers/2608.07594', 'abstract': 'Abstract  Interpretability is often treated as a tax on capability: language models are trained as opaque systems, then explained after the fact, with methods whose reliability is difficult to establish. In this work, we challenge this premise. Rather than reverse-engineering a model, we make interpretability a constraint of the training pipeline, optimized alongside the language modeling objective. Across three orders of magnitude of compute, on both autoregressive and diffusion language models, interpretability scales with capability rather than against it. Surprisingly, model representations become more disentangled and aligned with human-understandable concepts with scale.   We instantiate the training-time recipe with Steerling-8B, a diffusion language model with a causal attention mask. For any group of generated tokens, Steerling-8B attributes the output to relevant input tokens, human-understandable concepts, and training data. This enables closed-loop intervention: diagnose an output through its concept or feature attribution, retrieve similar training data, and correct the behavior through concept steering without retraining. Steerling-8B remains competitive with open peer models trained on substantially 2-16x more compute, suggesting a different scaling paradigm: interpretability can be designed into training, and it improves with scale.', 'score': 12, 'issue_id': 2914, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '82ed343199f51023', 'authors': ['Guide Labs Team', 'Andreas Madsen', 'Aya Abdelsalam Ismail', 'Giang Nguyen', 'Isaac Plant', 'Muawiz Chaudhary', 'Nathaniel Monson', 'Saqib Azim', 'Zhichen Guo', 'Julius Adebayo'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.07594.jpg', 'data': {'categories': ['#open_source', '#diffusion', '#interpretability'], 'emoji': '🔍', 'ru': {'title': 'Интерпретируемость как ингредиент обучения, а не побочный продукт', 'desc': 'В этой работе интерпретируемость языковых моделей рассматривается не как налог на производительность, а как ограничение, встроенное в процесс обучения наравне с основной целью языкового моделирования. Исследователи показали, что на протяжении трёх порядков величин вычислительных ресурсов интерпретируемость масштабируется вместе с возможностями модели, а не против них. Разработанная модель Steerling-8B способна атрибутировать выходные токены к релевантным входным токенам, человеко-понятным концептам и данным обучения. Предложенный подход позволяет проводить диагностику и коррекцию поведения модели через концептуальное управление без переобучения, при этом модель остаётся конкурентоспособной с аналогами, обученными на значительно больших объёмах вычислений.'}, 'en': {'title': 'Integrating Interpretability into Language Model Training', 'desc': 'This paper presents a novel approach to making language models interpretable by integrating interpretability into the training process rather than applying it afterward. The authors demonstrate that by treating interpretability as a constraint during training, models can achieve better performance while also being more understandable. They introduce Steerling-8B, a diffusion language model that effectively attributes generated outputs to relevant input tokens and concepts, allowing for real-time adjustments based on human-understandable features. The findings suggest that as models scale up, their interpretability improves, challenging the notion that interpretability is a trade-off against capability.'}, 'zh': {'title': '可解释性与能力并行提升的语言模型训练', 'desc': '本研究探讨了可解释性在语言模型训练中的重要性。我们提出将可解释性作为训练过程中的一个约束，而不是事后解释模型。通过这种方法，模型的可解释性与能力一起提升，且模型的表示变得更加清晰，与人类理解的概念对齐。我们展示了Steerling-8B模型如何在生成过程中实现概念引导，从而在不重新训练的情况下进行闭环干预。'}}}, {'id': 'https://huggingface.co/papers/2608.02508', 'title': 'RoMeRL: Balancing Feedback Coverage and the Memory-Reward Trap in Self-Evolving Agent Memory via Reduced-Order Utility States', 'url': 'https://huggingface.co/papers/2608.02508', 'abstract': 'Abstract  Learning-based memory systems for self-evolving LLM agents face two tightly coupled challenges. First, trajectory-indexed utilities grow with the interaction history, thereby dispersing limited feedback over an ever-expanding state space. Second, because trajectory-level rewards are jointly assigned to co-retrieved memories, irrelevant experiences may receive misleading utility updates and consequently enter the memory-reward trap. To address these challenges, we introduce Reduced-Order Memory Reinforcement Learning (RoMeRL), which represents the growing trajectory-indexed utility space using a fixed-dimensional per-task memory state factorized by outcome polarity and memory dynamics. RoMeRL incorporates new experiences through a fixed set of semantic coordinates whose contents are updated or replaced over time, thereby concentrating feedback over a bounded utility support. Theoretically, we show that this reduced-order parameterization increases the average feedback received by each utility coordinate and characterize the steady-state occupancy of erroneous coordinates under a generic coordinate-transition model. Empirically, across ALFWorld and LifelongAgentBench, RoMeRL improves task performance, reduces the Cold-Q ratio by 80.0%, increases feedback density by approximately 6.0 times, reduces the maintained memory size by 84.4%, and cuts LLM calls by 21.1%. These results show that reduced-order utility states support efficient self-evolving agent memory while limiting persistent reward contamination. Code is available at: https://github.com/YOUNG-fnxm/RoMeRL', 'score': 9, 'issue_id': 2912, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'cc938acc86369263', 'authors': ['Yi Yang', 'Zhennan Chen', 'Yihong Zhuang', 'Tiehan Fan', 'Yinan Chen', 'Jian Li', 'Jian Yang', 'Ying Tai'], 'affiliations': ['Nanjing University', 'Xiamen University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02508.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Эффективная память агента через редуцированное пространство полезности', 'desc': 'В статье предлагается метод Reduced-Order Memory Reinforcement Learning (RoMeRL) для обучения самоэволюционирующих LLM-агентов с памятью. Основная проблема заключается в том, что полезность траекторий растёт с историей взаимодействия, рассеивая обратную связь по расширяющемуся пространству состояний, а также в том, что совместно извлечённые воспоминания получают вводящие в заблуждение обновления наград. RoMeRL решает эту проблему, представляя пространство полезности с фиксированной размерностью, факторизованное по полярности исходов и динамике памяти, что концентрирует обратную связь в ограниченной области. Экспериментально доказано, что метод улучшает качество выполнения задач, значительно уменьшает размер памяти на 84.4%, снижает количество вызовов LLM на 21.1% и увеличивает плотность обратной связи примерно в 6 раз.'}, 'en': {'title': 'Efficient Memory Management for Self-Evolving Agents', 'desc': 'This paper presents Reduced-Order Memory Reinforcement Learning (RoMeRL), a novel approach to enhance memory systems in self-evolving large language model (LLM) agents. It addresses the challenges of growing trajectory-indexed utilities and misleading updates from irrelevant experiences by using a fixed-dimensional memory state that factors in outcome polarity and memory dynamics. RoMeRL allows for efficient integration of new experiences while concentrating feedback, leading to improved task performance and reduced memory size. The empirical results demonstrate significant enhancements in feedback density and a reduction in the Cold-Q ratio, showcasing the effectiveness of the proposed method.'}, 'zh': {'title': '减少阶数，提升记忆效率！', 'desc': '本论文提出了一种名为减少阶数记忆强化学习（RoMeRL）的方法，旨在解决自我进化大型语言模型（LLM）代理在学习过程中面临的两个主要挑战。首先，随着交互历史的增加，轨迹索引的效用会不断增长，导致有限的反馈分散在不断扩展的状态空间中。其次，轨迹级奖励共同分配给共同检索的记忆，可能导致无关经验获得误导性的效用更新，从而陷入记忆奖励陷阱。RoMeRL通过固定维度的任务记忆状态来表示增长的轨迹索引效用空间，从而提高了每个效用坐标接收到的平均反馈，并在多个实验中显著提升了任务性能。'}}}, {'id': 'https://huggingface.co/papers/2608.08021', 'title': 'Evidence-RL: Towards Evidence-intensive Visual Reasoning', 'url': 'https://huggingface.co/papers/2608.08021', 'abstract': 'Abstract  Vision-Language Models (VLMs) should answer from concrete image evidence rather than language priors, dataset shortcuts, or irrelevant visual context. Existing perception-aware post-training methods encourage image use through global perturbations or attention proxies, but they do not test whether a sampled answer causally depends on the local evidence that supports it. We propose Counterfactual Evidence Disentanglement (CED), a training-time evidence audit for VLM grounding. For each response, CED neutralizes an object-centric Evidence Region and compares the resulting support drop against matched non-evidence Regions. We combine this signal with answer correctness inside GRPO, rewarding correct answers that rely on the evidence path rather than shortcut or nuisance paths. CED uses weak object-level proposals, requires no question-specific evidence annotations, and adds no inference-time overhead. Across nine public benchmarks and four backbones, CED outperforms prior RL-based post-training methods, with targeted analyses verifying its object-centric signal.', 'score': 9, 'issue_id': 2912, 'pub_date': '2026-08-08', 'pub_date_card': {'ru': '8 августа', 'en': 'August 8', 'zh': '8月8日'}, 'hash': '658b453289c7030f', 'authors': ['Haojie Huang', 'Xinlei Yu', 'Chengming Xu', 'Zhangquan Chen', 'Cheng Yang', 'Qingdong He', 'Yu Yang', 'Jiangning Zhang', 'Xiaobin Hu'], 'affiliations': ['Fudan University', 'National University of Singapore', 'Tencent', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.08021.jpg', 'data': {'categories': ['#rl', '#benchmark', '#multimodal', '#rlhf'], 'emoji': '🔍', 'ru': {'title': 'Учим модели видения с языком полагаться на визуальные доказательства, а не на языковые штампы', 'desc': 'В работе предложен метод Counterfactual Evidence Disentanglement (CED) для обучения Vision-Language моделей правильно использовать визуальные доказательства при ответе на вопросы. Метод работает во время обучения, проверяя, действительно ли ответ модели зависит от локальных объектов изображения, а не от языковых закономерностей или контекстных артефактов. CED нейтрализует области с объектами и сравнивает изменение уверенности модели, комбинируя этот сигнал с правильностью ответа в процессе обучения с подкреплением. Метод не требует дополнительных аннотаций и показывает улучшения на множестве бенчмарков по сравнению с существующими подходами.'}, 'en': {'title': 'Enhancing VLMs with Evidence-Centric Learning', 'desc': "This paper introduces Counterfactual Evidence Disentanglement (CED), a method designed to improve Vision-Language Models (VLMs) by ensuring their answers are based on relevant image evidence rather than shortcuts or irrelevant context. CED works by neutralizing specific object-centric regions in an image and measuring how this affects the model's ability to provide correct answers. By rewarding answers that depend on the correct evidence path, CED enhances the model's grounding capabilities without requiring additional annotations or slowing down inference. The results show that CED significantly outperforms previous reinforcement learning methods across multiple benchmarks, demonstrating its effectiveness in promoting evidence-based reasoning in VLMs."}, 'zh': {'title': '提升视觉语言模型的证据使用效率', 'desc': '本文提出了一种新的训练方法，称为反事实证据解耦（CED），旨在提高视觉语言模型（VLMs）的性能。CED通过中和与对象相关的证据区域，来审计模型的证据使用情况，并比较支持度的变化。该方法结合了答案的正确性，奖励那些依赖于真实证据路径的正确答案，而不是依赖于捷径或无关路径的答案。实验结果表明，CED在多个基准测试中优于之前的基于强化学习的后训练方法。'}}}, {'id': 'https://huggingface.co/papers/2608.09096', 'title': 'Evo-Bench: Can Language Models Improve Agent Harness?', 'url': 'https://huggingface.co/papers/2608.09096', 'abstract': "Abstract  Large Language Models (LLMs) have driven rapid progress in autonomous agents, yet standard evaluations remain confined to static task solving. An emerging frontier is harness evolution---the agent's capacity to autonomously optimize its own operating harness. However, systematically benchmarking this capability remains challenging, as existing evaluations fail to isolate harness improvements from base model strength, prevent task-specific overfitting, or capture long-horizon iterative research. To address these challenges, we introduce Evo-Bench, the first benchmark designed to evaluate models' intrinsic harness-evolving capabilities across Search, Office, and General agent domains. To rigorously isolate this capability, Evo-Bench employs a novel harness-guided construction framework: it leverages auxiliary-task evolution to identify tasks genuinely sensitive to framework improvements, followed by sensitivity-aware stratified splitting to ensure robust cross-suite generalization. Extensive evaluations across nine frontier and open-weight models reveal that top models achieve massive absolute gains reaching 16.6 points, closely approaching state-of-the-art human-engineered baselines. Crucially, while autonomous evolution outpeforms artificial harness in General tasks and excels in Search tasks, it struggles in Office tasks that demand highly specific processing workflows. Furthermore, our analysis exposes critical temporal anomalies like early saturation, while demonstrating that the synthesized harnesses act as highly transferable reasoning structures, consistently boosting diverse policy models.", 'score': 8, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'f18bbff1e8507823', 'authors': ['Lisheng Huang', 'Chen Yang', 'Hao Zhou', 'Huatong Song', 'Zongchao Chen', 'Ran Le', 'Yang Song', 'Wayne Xin Zhao', 'Tao Zhang'], 'affiliations': ['BOSS Zhipin, Beijing, China', 'Gaoling School of Artificial Intelligence, Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.09096.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#reasoning', '#optimization', '#transfer_learning', '#agents'], 'emoji': '🧬', 'ru': {'title': 'Автономная эволюция собственной архитектуры интеллектуальными агентами', 'desc': 'В статье представлена Evo-Bench — первый бенчмарк для оценки способности языковых моделей к автономной оптимизации собственной архитектуры и процесса обработки задач. Авторы разработали инновационный фреймворк на основе вспомогательных задач, который позволяет изолировать улучшения самой системы от улучшений базовой модели и предотвращает переобучение на конкретных задачах. Экспериментальная оценка девяти современных моделей показала, что топ-модели достигают существенных прибыльных улучшений до 16,6 пункта, при этом автономная эволюция демонстрирует лучшие результаты на задачах поиска, но испытывает трудности с офисными приложениями. Исследование выявило, что синтезированные системные архитектуры работают как высокотрансферабельные структуры рассуждений, улучшающие работу разнообразных моделей политик.'}, 'en': {'title': 'Evo-Bench: Benchmarking Autonomous Harness Evolution in LLMs', 'desc': 'This paper introduces Evo-Bench, a new benchmark for evaluating the ability of large language models (LLMs) to autonomously improve their operational frameworks, known as harnesses. The authors highlight the limitations of current evaluation methods that do not effectively separate harness enhancements from the inherent strengths of the models. Evo-Bench uses a unique approach that combines auxiliary-task evolution and sensitivity-aware stratified splitting to ensure that the evaluation is robust and generalizes well across different agent domains. The findings show that while autonomous evolution significantly improves performance in general and search tasks, it faces challenges in office tasks that require specific processing workflows.'}, 'zh': {'title': '自主演变：智能体的未来', 'desc': '大型语言模型（LLMs）在自主智能体的发展中取得了快速进展，但标准评估仍然局限于静态任务解决。本文提出了Evo-Bench，这是第一个旨在评估模型内在自我优化能力的基准，涵盖搜索、办公和通用智能体领域。Evo-Bench通过新颖的框架，利用辅助任务的演变来识别对框架改进敏感的任务，并确保跨任务的稳健泛化。评估结果显示，顶尖模型在自主演变方面取得了显著进展，接近人类工程基准，但在需要特定处理流程的办公任务中表现不佳。'}}}, {'id': 'https://huggingface.co/papers/2608.09853', 'title': 'RynnValue: Scaling Robotic Value Foundation Models with Temporal Distance', 'url': 'https://huggingface.co/papers/2608.09853', 'abstract': "Abstract  General-purpose reward models are increasingly the bottleneck for scaling robot learning, yet the recipe for learning value-related capabilities from large-scale heterogeneous corpora remains underexplored. Existing approaches tie supervision to task-internal anchors such as preferences or normalized progress, none of which transfer cleanly across embodiments and data sources. We introduce RynnValue, an open-source value foundation model for robotic manipulation that replaces these anchors with temporal distance, the directed cost-to-go from an observation to the language-specified goal. Because temporal-distance labels can be derived directly from timestamps, RynnValue scales to over 7,000 hours and roughly 3M instruction-conditioned clips without preference or progress annotations. To make temporal-value learning reliable at scale, we combine random temporal sampling, temporal-order shuffling, and value-isolation attention, suppressing shortcuts that would leave predictions insensitive to failures and regressions. Trained without preference labels, RynnValue attains an average Kendall's tau_a of 0.675 on RBM-EVAL-OOD, surpassing the fully preference-supervised state of the art (0.655) and more than doubling a progress-only counterpart (0.292), while generalizing zero-shot to unseen tasks, embodiments, and viewpoints. Converted into dense rewards via potential-based shaping, it raises real-world policy success from 52.5% to 72.5% online and from 63.8% to 82.5% offline. These results establish temporal distance as a scalable supervision target and practical reward interface for generalist robot policies.", 'score': 6, 'issue_id': 2913, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'd9ae37610edcf20e', 'authors': ['Dongchi Huang', 'Hongyin Zhang', 'Bohan Hou', 'Siteng Huang', 'Zhian Su', 'Hang Guo', 'Tong Lu', 'Zhaofeng Xu', 'Jiahao Tang', 'Jianfei Yang', 'Donglin Wang', 'Peixi Peng', 'Mingxiu Chen', 'Deli Zhao', 'Xin Li'], 'affiliations': ['DAMO Academy, Alibaba Group', 'Hupan Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.09853.jpg', 'data': {'categories': ['#transfer_learning', '#rlhf', '#optimization', '#training', '#robotics', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Временное расстояние как универсальный сигнал обучения для обобщённых робото-политик', 'desc': 'В статье представлена RynnValue — foundational model для оценки стоимости действий в робототехнике, которая использует временное расстояние до цели вместо традиционных якорей вроде предпочтений или прогресса. Модель обучена на огромном корпусе из 7000+ часов разнородных данных робототехники без аннотаций предпочтений, что достигается путём извлечения временных меток напрямую из видео. Авторы применили специальные техники обучения — случайное временное семплирование, перемешивание временного порядка и attention механизмы — чтобы избежать shortcuts и обеспечить надёжность предсказаний в масштабе. Модель демонстрирует сильную обобщаемость: превосходит state-of-the-art на бенчмарке RBM-EVAL-OOD и значительно улучшает success rate реальных роботов как в онлайн, так и в офлайн настройках.'}, 'en': {'title': 'RynnValue: Revolutionizing Robot Learning with Temporal Distance', 'desc': 'This paper presents RynnValue, a new model designed to improve how robots learn from large amounts of data. Instead of relying on traditional methods like preferences or progress tracking, RynnValue uses temporal distance, which measures how far an observation is from a goal in time. This approach allows the model to learn from over 7,000 hours of data without needing specific annotations, making it scalable and efficient. The results show that RynnValue not only performs better than existing models but also adapts well to new tasks and environments, enhancing the success of robotic policies in real-world applications.'}, 'zh': {'title': 'RynnValue：机器人学习的新突破', 'desc': '本论文介绍了一种名为RynnValue的开源价值基础模型，旨在提高机器人学习的效率。该模型通过使用时间距离作为监督信号，避免了传统方法中依赖于任务内部锚点的问题。RynnValue能够处理超过7000小时的多样化数据，且无需偏好或进度注释。实验结果表明，该模型在多种任务和视角下具有良好的泛化能力，并显著提高了机器人在现实世界中的成功率。'}}}, {'id': 'https://huggingface.co/papers/2608.07346', 'title': 'A^2E : An End-to-End Agent Auditing Engine', 'url': 'https://huggingface.co/papers/2608.07346', 'abstract': 'Abstract  With the rapid advancement of large language models (LLMs), harnesses have become essential infrastructure for deploying agents across a wide range of domains. The fast-evolving harness ecosystem has also made rigorous capability evaluation increasingly important. However, efficiently building an end-to-end, systematic, and comprehensive evaluation pipeline remains a significant challenge. To address this challenge, we introduce A^2E (Agent Auditing Engine), an end-to-end evaluation engine designed for agent harnesses. A^2E leverages our newly proposed Agent Task Protocol (ATP) to enable the rapid integration of evaluation tasks with different harnesses. Through an automatically instrumented Monitor, it captures and generates standardized execution traces during experiments. In the Evaluation stage, A^2E systematically assesses harness capabilities using a suite of multidimensional metrics. Compared with correctness alone, these metrics provide a more fine-grained characterization of differences among harnesses in execution efficiency, tool use, task planning, and error recovery. Experiments conducted with A^2E further reveal that model-harness combinations exhibit substantial performance variation across different types of tasks, and that no single combination consistently outperforms all others across every task. These findings not only demonstrate the necessity of systematic evaluation but also provide useful guidance for the co-evolving of models and harnesses. Our code is available at https://github.com/datamllab/A2E.', 'score': 6, 'issue_id': 2915, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': 'ef912b158d4b4243', 'authors': ['Haoning Wang', 'Mingxun Zhang', 'Chenyue Yu', 'Yingjun Shang', 'Xia Hu', 'Guanchu Wang', 'Na Zou'], 'affiliations': ['OpenGMLab'], 'pdf_title_img': 'assets/pdf/title_img/2608.07346.jpg', 'data': {'categories': ['#open_source'], 'emoji': '🔍', 'ru': {'title': 'Систематическая аудит-система для оценки агентов на базе больших языковых моделей', 'desc': 'Статья представляет A^2E (Agent Auditing Engine) — комплексную систему для оценки возможностей агентов на основе больших языковых моделей. Авторы предлагают Agent Task Protocol (ATP), который позволяет быстро интегрировать задачи оценки с различными фреймворками для разработки агентов. Система использует автоматизированный монитор для сбора стандартизированных следов выполнения и применяет многомерные метрики для детальной оценки эффективности, использования инструментов и планирования задач. Исследование показывает, что производительность комбинаций моделей и фреймворков существенно варьируется в зависимости от типа задачи, что подчёркивает необходимость систематического тестирования.'}, 'en': {'title': 'A^2E: Elevating Agent Evaluation with Comprehensive Insights', 'desc': 'This paper introduces the Agent Auditing Engine (A^2E), a comprehensive evaluation tool for assessing the capabilities of agent harnesses used with large language models. A^2E utilizes the Agent Task Protocol (ATP) to streamline the integration of various evaluation tasks, allowing for systematic testing of harness performance. The engine captures execution traces and employs multidimensional metrics to evaluate aspects like efficiency, tool usage, and error recovery, rather than just correctness. The findings highlight significant performance variations among model-harness combinations, emphasizing the need for thorough evaluation to guide the development of both models and harnesses.'}, 'zh': {'title': '系统评估代理程序的必要性', 'desc': '随着大型语言模型（LLMs）的快速发展，代理程序的基础设施变得至关重要。本文提出了A^2E（代理审计引擎），这是一个用于代理程序的端到端评估引擎，旨在解决评估管道构建的挑战。A^2E利用新提出的代理任务协议（ATP），快速集成不同代理程序的评估任务，并通过自动化监控生成标准化的执行轨迹。实验结果表明，不同模型与代理程序的组合在执行效率、工具使用、任务规划和错误恢复等方面存在显著差异，强调了系统评估的必要性。'}}}, {'id': 'https://huggingface.co/papers/2608.09420', 'title': 'Intent Speaks Louder: Controllable User Simulation Beyond Response Imitation', 'url': 'https://huggingface.co/papers/2608.09420', 'abstract': 'Abstract  User simulators are widely used as scalable environments for training and evaluating interactive assistants. Generating the next user turn is inherently one-to-many: the same profile and dialogue context may support multiple plausible continuations with different local interaction intents. A fluent response may therefore advance the dialogue through an inappropriate intent, such as acceptance rather than repair. Our key insight is that controllable user simulation should separate which local interaction intent the next user turn should realize from how that intent is expressed in language. We introduce UserIDA (User Intent-Directive Alignment), which exposes interaction intent as an explicit per-turn directive. UserIDA defines a six-way intent interface, learns directive-conditioned generation through supervised fine-tuning, and uses intent-calibrated policy optimization during group-based reinforcement learning. The reward preserves composite response quality while ensuring that intent-violating candidates rank below compliant alternatives in mixed groups. On LMSYS-USP, UserIDA achieves 86.6\\% intent accuracy, outperforming the strongest dedicated user-simulator baseline by 24.3 percentage points while improving semantic and stylistic similarity. In within-context interventions, it realizes at least four of the six target intents in 91.7\\% of evaluated dialogue states, compared with 22.9\\% for the strongest external baseline. These results establish per-turn intent control as a complementary dimension to response fidelity in user simulation.', 'score': 3, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'e393ae98f2e2b8c6', 'authors': ['Bo Wang', 'Ruixing Zhang', 'Yunqi Liu', 'Yang Zhang', 'Liangzhe Han', 'Tongyu Zhu', 'Leilei Sun'], 'affiliations': ['the State Key Laboratory of Complex and Critical Software Environment, Beihang University'], 'pdf_title_img
