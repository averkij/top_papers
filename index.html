arison is inconclusive. In separate code-generation coordination experiments, calibration improves the ranking of correct responses and increases answer-selection accuracy by 4.3 and 14.0 percentage points on two of three benchmarks relative to uncalibrated confidence weighting. These results support model-specific runtime calibration for coordination under changing workloads when correctness feedback is available for the participating responders.', 'score': 0, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '03aa0133b7007374', 'authors': ['Joss Armstrong'], 'affiliations': ['Ericsson, Athlone, Ireland'], 'pdf_title_img': 'assets/pdf/title_img/2605.22949.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Динамическая калибровка уверенности моделей для координации гетерогенных языковых моделей', 'desc': 'Статья представляет MARGIN — метод калибровки моделей во время выполнения, который учится корректировать модель-специфичные оценки уверенности на основе наблюдаемых результатов без переобучения моделей. Метод отслеживает недавнюю точность и заявленную уверенность, использует их соотношение для коррекции и объединяет локальные исправления в глобальную оценку. Исправленные оценки применяются для взвешивания ответов при коллективном принятии решения несколькими моделями. Экспериментальная оценка на задачах генерации кода, ответов на вопросы и математике показывает, что MARGIN превосходит базовые методы онлайн-калибровки при распределительных сдвигах в данных.'}, 'en': {'title': 'Enhancing Model Confidence for Better Decision-Making', 'desc': 'This paper introduces MARGIN, a method for improving the confidence scores of different machine learning models when they provide answers. MARGIN adjusts the reported confidence of each model based on their recent performance, without needing to retrain them or use a separate calibration dataset. By analyzing the relationship between accuracy and stated confidence, MARGIN enhances decision-making by weighting answers more effectively. The results show that MARGIN significantly improves the accuracy of answer selection in various tasks, demonstrating its effectiveness in coordinating multiple models under varying conditions.'}, 'zh': {'title': '模型特定的运行时校准提升决策准确性', 'desc': '本文提出了一种名为MARGIN（多智能体运行时评分通过增量归一化）的方法，用于在异构基础模型之间比较答案时进行自我报告置信度的校准。MARGIN通过观察答案结果学习模型特定的置信度修正，而无需重新训练模型或使用独立的校准集。该方法跟踪最近的准确性和报告的置信度，并利用它们的比率来修正报告的置信度，从而提高集体决策的准确性。实验结果表明，MARGIN在代码生成和问答任务中显著提高了答案选择的准确性，支持在变化工作负载下进行模型特定的运行时校准。'}}}, {'id': 'https://huggingface.co/papers/2610.08941', 'title': 'SPW-Nav: A Streaming Panoramic World Model for Language-Guided Navigation', 'url': 'https://huggingface.co/papers/2610.08941', 'abstract': 'Abstract  Language-guided panoramic video generation benefits various downstream applications, such as interactive 3D scene exploration, virtual reality experiences, and embodied agent training. Existing panoramic generators follow predefined trajectories, and interactive world models act through low-level actions in perspective views. We propose SPW-Nav, a streaming panoramic world model that understands movement instructions and streams one minute of 2K 360-degree video in real time from a single panorama. SPW-Nav interprets each instruction in the previously generated panorama as camera motion. Spherical rotation decoupling applies rotation exactly on the sphere, pose-aligned conditioning keeps translation inputs bounded over long streams, and a multi-term memory with a few-step generator continues the scene as instructions change. We also build SPW-NavSet, panoramic videos with camera trajectories and verified instructions. Driven by language, SPW-Nav outperforms prior panoramic generators in camera-following accuracy and video quality, and supports on-the-fly instruction switching.', 'score': 0, 'issue_id': 3389, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '4747e1b974f687ff', 'authors': ['Yunheng Liu', 'Ziqi Cai', 'Siqi Yang', 'Yimu Wang', 'Minggui Teng', 'Jiaming Tan', 'Shuchen Weng', 'Erwin Wu', 'Kaipeng Zhang', 'Boxin Shi'], 'affiliations': ['Alaya Lab', 'Institute of Science Tokyo', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.08941.jpg', 'data': {'categories': ['#dataset', '#long_context', '#multimodal', '#agents', '#3d', '#video', '#open_source'], 'emoji': '🌐', 'ru': {'title': 'Потоковое панорамное видео под управлением естественного языка', 'desc': 'Авторы предлагают SPW-Nav — потоковую панорамную мировую модель, которая генерирует видео 360 градусов разрешением 2K в реальном времени на основе текстовых команд. Модель интерпретирует инструкции как движения камеры в панорамной сцене, используя декомпозицию сферических вращений и позиционно выравненное кондиционирование для обработки длительных последовательностей. Система включает мульти-уровневую память и генератор на несколько шагов, позволяя динамически менять инструкции на лету. Авторы также создали датасет SPW-NavSet с панорамными видео, траекториями камер и проверенными инструкциями, превосходя по качеству и точности следования команд существующие подходы.'}, 'en': {'title': 'Real-Time Panoramic Video Generation Driven by Language', 'desc': 'The paper introduces SPW-Nav, a novel streaming panoramic world model that generates 2K 360-degree videos in real time based on language instructions. Unlike traditional methods that rely on fixed paths, SPW-Nav dynamically interprets movement commands to create immersive panoramic experiences. It employs techniques like spherical rotation decoupling and pose-aligned conditioning to ensure smooth transitions and accurate camera movements. The model demonstrates superior performance in both video quality and responsiveness to changing instructions compared to existing panoramic video generators.'}, 'zh': {'title': '语言驱动的全景视频生成新突破', 'desc': '本文提出了一种名为SPW-Nav的流式全景世界模型，能够实时生成2K 360度视频。该模型通过理解运动指令，将每个指令解释为相机运动，从而实现动态视频生成。SPW-Nav采用球面旋转解耦和姿态对齐条件，确保在长时间流中保持平稳的平移输入。与之前的全景生成器相比，SPW-Nav在相机跟随精度和视频质量上表现更佳，并支持即时指令切换。'}}}, {'id': 'https://huggingface.co/papers/2610.09639', 'title': 'On-Policy Distillation Teaches New Skills but Not New Knowledge', 'url': 'https://huggingface.co/papers/2610.09639', 'abstract': "Abstract  On-policy distillation (OPD) strengthens language-model reasoning, yet whether students acquire new factual knowledge or compositional skill for multi-step reasoning remains unknown. We separate these capabilities using a controlled synthetic framework that measures the student's initial capabilities and independently controls the teacher's additional facts, compositional skill, or both. Across four models from three families, reverse-KL OPD reliably transfers compositional skill across unseen reasoning structures, but transfers minimal factual knowledge. Decoupling the distillation recipe reveals the source of this asymmetry: replacing reverse KL with forward KL restores factual transfer, whereas student rollouts specifically improve the execution of multi-step reasoning. Experiments on recent factual QA and competition mathematics show a similar asymmetry under reverse-KL OPD, yielding notable reasoning gains without factual memory expansion. Together, these results demonstrate that on-policy distillation does not expand a model's parametric knowledge, but instead teaches it to organize and compose the knowledge it already possesses.", 'score': 0, 'issue_id': 3389, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '51adc2a8b54ae4e1', 'authors': ['Yixuan Tang', 'Yi Yang'], 'affiliations': ['The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.09639.jpg', 'data': {'categories': ['#reasoning', '#training', '#transfer_learning', '#rlhf', '#synthetic'], 'emoji': '🧩', 'ru': {'title': 'Дистилляция учит рассуждать, но не запоминать', 'desc': 'В работе исследуется обучение учащихся моделей через дистилляцию в режиме on-policy (OPD), которая улучшает рассуждения языковых моделей. Авторы используют контролируемую синтетическую среду для разделения двух типов способностей: передачи факторов знаний и развития композиционных навыков многошагового рассуждения. Результаты показывают, что reverse-KL дистилляция эффективно передаёт композиционные навыки на новые структуры рассуждений, но практически не расширяет факторные знания модели. Выводы демонстрируют, что OPD не увеличивает параметрические знания модели, а учит её лучше организовывать и комбинировать уже имеющиеся знания.'}, 'en': {'title': 'Enhancing Reasoning Skills Without Expanding Knowledge', 'desc': "This paper investigates how on-policy distillation (OPD) affects language models' reasoning abilities. It distinguishes between two types of learning: acquiring new factual knowledge and enhancing compositional skills for multi-step reasoning. The study finds that while OPD effectively improves compositional skills, it does not significantly increase factual knowledge. The results suggest that OPD helps models better organize and utilize their existing knowledge rather than expanding their factual memory."}, 'zh': {'title': '政策蒸馏：组织已有知识的艺术', 'desc': '本文探讨了在政策蒸馏（OPD）中，学生是否能够获得新的事实知识或多步推理的组合技能。通过一个受控的合成框架，研究者测量了学生的初始能力，并独立控制教师提供的额外事实或组合技能。实验结果表明，反向KL OPD能够有效地在未见的推理结构中转移组合技能，但对事实知识的转移效果有限。最终，研究表明，政策蒸馏并没有扩展模型的参数知识，而是教会模型如何组织和组合已有的知识。'}}}, {'id': 'https://huggingface.co/papers/2610.12452', 'title': 'BrickBench: Evaluating Agentic Brick Design', 'url': 'https://huggingface.co/papers/2610.12452', 'abstract': 'Abstract  We propose BrickBench, a benchmark for agentic text-conditioned LEGO-set design. Given a prompt, an agent is tasked with producing an assembly that not only satisfies semantic and design criteria, but that can also be physically built. To do so, it must select parts from a discrete library and reason jointly about local and global constraints. We score validity, alignment, and design across three settings that vary in scale and part availability. We provide BrickAgent, an environment for coding agents to construct, inspect, and validate their designs. We find that leading agents largely satisfy verifiable physical and semantic requirements, but fall short of human designs. We release our benchmark and environment at http://www.brickben.ch', 'score': 0, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '258134e656fcd492', 'authors': ['Peter Kulits', 'Yiqing Xu', 'R. Kenny Jones', 'Cordelia Schmid', 'Jiajun Wu'], 'affiliations': ['Inria', 'Max Planck Institute for Intelligent Systems', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12452.jpg', 'data': {'categories': [], 'emoji': '🧱', 'ru': {'title': 'Агенты для генерации реалистичных LEGO-конструкций с учётом физических ограничений', 'desc': 'В работе представлен BrickBench — бенчмарк для оценки агентов, которые генерируют конструкции LEGO-наборов по текстовому описанию. Агент должен выбирать детали из дискретной библиотеки и одновременно учитывать локальные и глобальные ограничения, чтобы создать физически реализуемую конструкцию. Авторы предлагают BrickAgent — окружение для тестирования кодировщиков и валидации дизайна через проверку соответствия семантическим критериям и физическим требованиям. Экспериментальные результаты показывают, что современные агенты удовлетворяют проверяемым физическим и семантическим требованиям, но отстают от дизайна, созданного людьми.'}, 'en': {'title': 'Building Smarter LEGO Designs with AI', 'desc': 'This paper introduces BrickBench, a new benchmark for evaluating agents that design LEGO sets based on text prompts. The agents must choose parts from a limited library and consider both local and global design constraints to create a buildable assembly. The evaluation metrics include validity, alignment with the prompt, and overall design quality across different scenarios. The authors also present BrickAgent, a platform for developing and testing these agents, revealing that while current agents meet some design criteria, they still do not match the creativity of human designers.'}, 'zh': {'title': 'BrickBench：智能LEGO设计的基准测试', 'desc': '我们提出了BrickBench，这是一个用于基于文本的LEGO套件设计的基准测试。给定一个提示，代理需要生成一个不仅满足语义和设计标准，而且可以实际构建的装配。为此，代理必须从离散库中选择零件，并共同推理局部和全局约束。我们的研究发现，领先的代理在可验证的物理和语义要求上表现良好，但仍未达到人类设计的水平。'}}}, {'id': 'https://huggingface.co/papers/2610.12369', 'title': 'Embodied Turing Machines: Stateful Code for Robot Recursive Self-Improvement', 'url': 'https://huggingface.co/papers/2610.12369', 'abstract': "Abstract  Most robot policies keep a model in the control loop: a VLA maps observations to actions, and an Agent Harness, such as Agent-as-Policy or Harness VLA queries a VLM for decision making at run time. We propose a different view: the embodied world is an Embodied Turing Machine, whose tape is the robot and environment state and rules are the policy. If this state can be represented accurately, the decision making can be written entirely in code. We therefore propose Code-Only-as-Policy (COAP): code measures and tracks the robot, environment, and task state from camera images and proprioception, and makes every decision from it. The same code applies across episodes, and different tasks share one library without a VLM or VLA in the loop. Compared with VLAs and Agent Harnesses, we analyze three advantages of COAP: (i) Explicit State: the state can be stored in code; (ii) Execution: code makes decision making controllable, recovers from failures flexibly, and runs fast and cheaply online; (iii) Extensibility: new tasks reuse, inherit, or extend the shared library, so capabilities can accumulate over tasks. These advantages make COAP a suitable medium for recursive self-improvement (RSI): coding agents develop the library in a closed loop, and each change is explicit and controllable. On RoboDojo's 42 bimanual tasks, the resulting library reaches a success rate of 70.24% without a model at test time. The upper bound of COAP lies in how accurately the state is represented for decision making and how robust the code logic is. We thus propose COAP as a new paradigm for embodied tasks; since it applies across episodes, it can also serve as an efficient data engine for VLAs and Agent Harnesses.", 'score': 0, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '7894dde23267c964', 'authors': ['Kairui Hu', 'Siyuan Hu', 'Fangzhou Hong', 'Zhaoxi Chen', 'Ziwei Liu'], 'affiliations': ['Nanyang Technological University', 'Ropedia'], 'pdf_title_img': 'assets/pdf/title_img/2610.12369.jpg', 'data': {'categories': ['#agents', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Код вместо моделей: явный контроль поведения робота через программирование', 'desc': 'Авторы предлагают новый подход к управлению роботами под названием Code-Only-as-Policy (COAP), где весь процесс принятия решений реализуется явно в коде без использования нейросетевых моделей во время выполнения. В отличие от традиционных Vision Language Models (VLM) и Visual Language Agent (VLA), система явно отслеживает состояние робота и окружения из камеры и проприоцепции, а затем принимает решения на основе этого состояния. Такой подход обладает тремя ключевыми преимуществами: прозрачность состояния, управляемость выполнения и простота расширения через переиспользование библиотеки кода. Авторы демонстрируют, что COAP достигает 70.24% успеха на 42 двуручных задачах и может служить эффективным источником данных для обучения других агентов.'}, 'en': {'title': 'Revolutionizing Robot Decision Making with Code-Only-as-Policy', 'desc': "This paper introduces a new approach called Code-Only-as-Policy (COAP) for robot decision making, which eliminates the need for traditional models in the control loop. Instead of using a Variable Length Array (VLA) or an Agent Harness, COAP relies on code to represent the robot's state and environment, allowing for direct decision making. The advantages of COAP include explicit state representation, fast and flexible execution, and the ability to extend capabilities across different tasks. This method shows promise for recursive self-improvement, as coding agents can iteratively enhance their decision-making library based on their experiences."}, 'zh': {'title': '代码驱动的机器人决策新范式', 'desc': '本文提出了一种新的机器人决策方法，称为代码仅作为策略（COAP）。与传统的机器人控制方法不同，COAP将机器人和环境的状态直接用代码表示，从而实现决策的完全编码化。该方法具有三个主要优势：明确的状态存储、可控的决策执行和任务的可扩展性。通过在RoboDojo的42个双手任务中测试，COAP在没有模型的情况下达到了70.24%的成功率，展示了其在自我改进和任务执行中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.02959', 'title': 'TerraVis: Towards Evaluation of World-Grounded Visual Consistency in Text-to-Image Generation via MLLM Workflows', 'url': 'https://huggingface.co/papers/2610.02959', 'abstract': 'Abstract  Recent text-to-image models have made substantial progress in photorealism, aesthetics, and text-image alignment. Yet visually appealing images can still violate real-world plausibility, exhibiting malformed object structures, impossible anatomy, physically implausible interactions, or inconsistent spatial relationships. Such failures are not well captured by existing fidelity, aesthetics, preference, or alignment metrics. To address this gap, we introduce TerraVis, a framework for evaluating world-grounded visual consistency in generated images. TerraVis defines a structured taxonomy of world-consistency violations spanning object-, interaction-, and scene-level failures, and employs a multi-stage evaluation framework to identify and quantify them. Given an image, TerraVis first uses an MLLM to assess its eligibility for evaluation, then detects violations across 18 taxonomy-defined types and classifies them as minor or major to derive an overall world-consistency score. Across diverse open-source and proprietary text-to-image models on two widely used benchmarks, TerraVis achieves the strongest correlation with human judgments of world consistency among existing metrics. Our benchmark results further show that models that achieve strong performance on conventional metrics can still exhibit substantial world-consistency failures. These findings highlight world consistency as a complementary evaluation dimension and demonstrate that TerraVis enables systematic quantification, diagnosis, and comparison of such failures. Our code is publicly available at https://github.com/ShyFoo/TerraVis.', 'score': 0, 'issue_id': 3389, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '09ebc07cca17c544', 'authors': ['Shuai Fu', 'Jing Gu', 'Jian Zhou', 'Zicheng Duan', 'Gengze Zhou', 'Qi Wu'], 'affiliations': ['AIML, Adelaide University', 'Responsible AI Research Centre', 'xAI'], 'pdf_title_img': 'assets/pdf/title_img/2610.02959.jpg', 'data': {'categories': ['#multimodal', '#cv', '#benchmark'], 'emoji': '🌍', 'ru': {'title': 'Оценка соответствия сгенерированных изображений законам физики', 'desc': 'Авторы представляют TerraVis — фреймворк для оценки согласованности сгенерированных изображений с реальными физическими законами. Система использует многоступенчатый подход: сначала мультимодальная языковая модель проверяет пригодность изображения к оценке, затем детектирует нарушения из 18 типов, охватывающих объектные, взаимодейственные и сценные ошибки. Полученные нарушения классифицируются как незначительные или критические для вычисления итогового скора согласованности. Экспериментальные результаты показывают, что TerraVis достигает наивысшей корреляции с человеческими оценками и выявляет серьёзные недостатки у моделей, успешных по традиционным метрикам.'}, 'en': {'title': 'TerraVis: Evaluating Visual Consistency in Generated Images', 'desc': 'This paper introduces TerraVis, a new framework designed to evaluate the visual consistency of images generated by text-to-image models. It identifies and categorizes various types of world-consistency violations, such as issues with object structure and spatial relationships. TerraVis employs a multi-stage evaluation process that uses a machine learning language model (MLLM) to assess images and classify violations into minor or major categories. The framework demonstrates a strong correlation with human judgments, revealing that traditional metrics may overlook significant inconsistencies in generated images.'}, 'zh': {'title': 'TerraVis：评估生成图像的世界一致性', 'desc': '最近的文本到图像模型在照片真实感、美学和文本图像对齐方面取得了显著进展。然而，这些视觉上吸引人的图像仍然可能违反现实世界的合理性，表现出畸形的物体结构或不可能的解剖结构。为了解决这个问题，我们提出了TerraVis，一个用于评估生成图像中世界一致性的框架。TerraVis定义了一种结构化的世界一致性违规分类法，并通过多阶段评估框架来识别和量化这些违规行为。'}}}];

            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (7)', '#agents (15)', '#agi', '#alignment', '#architecture (5)', '#audio (1)', '#benchmark (17)', '#cv (7)', '#data', '#dataset (11)', '#diffusion (2)', '#ethics', '#games (2)', '#graphs', '#hallucinations (1)', '#healthcare', '#inference (4)', '#interpretability (1)', '#leakage', '#long_context (5)', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (19)', '#open_source (6)', '#optimization (9)', '#plp (1)', '#rag (1)', '#reasoning (10)', '#rl (6)', '#rlhf (4)', '#robotics (6)', '#science', '#security', '#small_models', '#story_generation', '#survey (1)', '#synthetic (3)', '#training (12)', '#transfer_learning (3)', '#video (9)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-09 07:02',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-09 07:02')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-09 07:02')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
