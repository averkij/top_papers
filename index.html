    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

ng', 'Jiacheng Yao', 'Dingcheng Yi', 'Shihong Yi', 'Jinhui Yin', 'Peizhou Yu', 'Shan Yu', 'Hao Yuan', 'Junjie Yuan', 'Xiongyao Zha', 'Bo Zhang', 'Caixian Zhang', 'Kaicheng Zhang', 'Pengxiang Zhang', 'Qiuyinzhe Zhang', 'Wei Zhang', 'Xiaoqian Zhang', 'Xinsen Zhang', 'Jiyuan Zhao', 'Shuyu Zhao', 'Pujun Zheng', 'Zheyu Zheng', 'Xiaoxue Zhong', 'Peiheng Zhou', 'Xiaohao Zhou', 'Xinyu Zhou', 'Fangyi Zhu', 'Guanru Zhu', 'Yulun Zhu', 'Jiabao Zhuang', 'Pengfei Cao', 'Zhicheng Dou', 'Xianpei Han', 'Ben He', 'Guoxiu He', 'Xuanjing Huang', 'Tao Ji', 'Yu-Gang Jiang', 'Dahua Lin', 'Hongyu Lin', 'Kang Liu', 'Yaojie Lu', 'Le Sun', 'Ji-Rong Wen', 'Jun Zhao', 'Yutao Zhu', 'Qi Zhang', 'Bowen Zhou'], 'affiliations': ['East China Normal University', 'Fudan University', 'Harbin Institute of Technology', 'Institute of Automation Chinese Academy of Sciences', 'Institute of Software Chinese Academy of Sciences', 'Peking University', 'Renmin University of China', 'Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2611.21072.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#plp', '#agents', '#graphs', '#science'], 'emoji': '🧬', 'ru': {'title': 'Научный ИИ-агент, который рассуждает по данным и действует в среде', 'desc': 'Статья представляет Sage S1.5 Flash — mixture-of-experts модель с 320 миллиардами параметров, созданную для рассуждений над научными данными и действий в интерактивных средах. Модель использует отдельные энкодеры для молекулярных графов, биологических последовательностей и спектров, а затем проецирует их в общее пространство входов LLM вместе с текстом и изображениями. Агентные способности обучались в верифицируемых средах для работы с инструментами, поиском и кодом, а результат проверялся по выполнению, изменению состояния или артефактам. На 33 бенчмарках в семи доменах модель занимает первое место в ряде задач, включая OfficeQA Pro и MLE-bench Lite, и показывает конкурентоспособные результаты в десктопных и браузерных сценариях.'}, 'en': {'title': 'A multimodal expert model that turns scientific evidence into verifiable action', 'desc': 'Sage S1.5 Flash is a 320-billion-parameter mixture-of-experts model built for scientific reasoning and interactive tasks. It uses specialized encoders for molecular graphs, biological sequences, and spectra, then maps their representations into a shared backbone that also processes text and images. The model is trained and tested in verifiable environments for tool use, search, coding, and scientific workflows, where success is checked through execution results, environment changes, or submitted artifacts. Across 33 benchmarks, it performs especially well on evidence-based tasks, spreadsheets, and machine learning experiments, while also showing competitive results in browser and desktop environments.'}, 'zh': {'title': '让科学推理落地为可验证的行动', 'desc': '本文介绍了 Sage S1.5 Flash，这是一个拥有 3200 亿参数的通用混合专家模型，擅长利用科学证据进行推理并在交互环境中执行任务。它为分子图、生物序列和光谱数据设计了专用编码器，再通过模态投影器将这些表示与文本、图像一起输入共享模型骨干。研究团队还构建了可验证的工具使用、搜索、编程和科学工作流程环境，并根据执行结果、环境变化或提交的成果判断任务是否完成。在 33 项基准测试中，该模型在文档证据处理、生成可验证电子表格和机器学习任务上表现突出，同时也能胜任需要根据视觉反馈操作桌面或浏览器的任务。'}}}, {'id': 'https://huggingface.co/papers/2611.21003', 'title': 'K2-Horizon: A Frontier Fleet of Open Source Language Models', 'url': 'https://huggingface.co/papers/2611.21003', 'abstract': 'Abstract  We present K2-Horizon, a fleet of six fully open language models, from a 0.9B dense model to a 375B-A23B MoE, built for general-purpose reasoning and agentic work across math and science, software engineering, deep research, office automation, and beyond. The models lead or are competitive with strong open models of their size on agentic and coding benchmarks. On the modeling side, to strengthen reasoning, we introduce Mixture-of-Value Attention (MoVA), applying MoE to attention value projections, and softplus attention gating, a more flexible, theoretically motivated gate. Our 36B-A4B model uses both and nearly matches a 32B dense model trained on the same data, with one-seventh the active parameters. We also introduce Uno, lossless diffusion adapters that speed up decoding by up to 2.2x without a separate draft model. Our release follows the LLM360 definition of open source for transparency and reproducibility: the full development history, including intermediate checkpoints from every training stage, pre-training data, training logs, and all training, evaluation, and infrastructure code, notably our production-scale xLLM framework for dense and MoE training and the RL360 reinforcement-learning stack. Beyond the data itself, we release and document in detail every pipeline that built it, the part of model development that open releases most rarely disclose. These pipelines produced roughly 10T synthetic pre-training tokens, showing that synthetic data can be a major ingredient of pre-training at scale. Four of the models share one 22T-token pre-training corpus and recipe, revealing consistent scaling behavior and enabling controlled studies of scale and sparsity. All artifacts are available at https://ifm.ai/k2/', 'score': 68, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'c9d93e0c1c892832', 'authors': ['K2 Team', 'Zhengzhong Liu', 'Haonan Li', 'Xuezhe Ma', 'Alexander Moreno', 'Subham Sekhar Sahoo', 'Rupesh Kumar Srivastava', 'Mikhail Yurochkin', 'Hadi Abdine', 'Yash Akhauri', 'Adharsh Babu', 'David Bellamy', 'Jalaj Bhandari', 'Dani Bouch', 'Wail Bouhedja', 'Weili Cao', 'Ahmad Chamma', 'Po-Chun Chang', 'Junlin Chen', 'Lingjie Chen', 'Zhoujun Cheng', 'Kyle Chickering', 'Ryandito Diandaru', 'Evan Dufraisse', 'Chaitanya Dwivedi', 'Bilal El Bouardi', 'Desai Fan', 'Richard Fan', 'Chengqian Gao', 'Rifo Ahmad Genadi', 'Jonathan Geuter', 'Charles Guille-Escuret', 'Willis Guo', 'Dhawal Gupta', 'Seungwook Han', 'Tingxu Han', 'Shibo Hao', 'Besher Hassan', 'Guowei He', 'Ming Shan Hee', 'Joel Hestness', 'Yu Huang', 'Yuan Huang', 'Haolong Jia', 'Linghao Jin', 'Junu Kim', 'Lingjing Kong', 'Nurkhan Laiyk', 'Andrej Leban', 'Liqun Ma', 'John Maggs', 'Amr Mohamed', 'Mukhesh Narra', 'Omkar Pangarkar', 'Aldo Pareja', 'Khiem Pham', 'Varad Pimpalkhute', 'Nikhil Ranjan', 'Elizaveta Rebrova', 'Hector Ren', 'Shaurya Rohatgi', 'Guokan Shang', 'Jianshu She', 'Chufan Shi', 'Aaryamonvikram Singh', 'Daria Soboleva', 'Kartik Sreenivasan', 'Suqi Sun', 'Yuekai Sun', 'Bowen Tan', 'Liping Tang', 'Shengkun Tang', 'Muzi Tao', 'Mallikarjuna Tupakula', 'Micah Villmow', 'Hongyi Wang', 'Huijuan Wang', 'Renxi Wang', 'Yongxin Wang', 'Yuqi Wang', 'Zhenting Wang', 'Shicheng Wen', 'Yingquan Wu', 'Anze Xie', 'Andrew Xing', 'Matthew Yang', 'Shuanghai Yu', 'Kerem Zaman', 'Zenan Zhai', 'Hongli Zhan', 'Xuezhou Zhang', 'Anshun Asher Zheng', 'Zhe Zhou', 'Richard Zhuang', 'Eric P. Xing'], 'affiliations': ['Institute of Foundation Models'], 'pdf_title_img': 'assets/pdf/title_img/2611.21003.jpg', 'data': {'categories': ['#architecture', '#synthetic', '#training', '#small_models', '#open_source', '#rl', '#benchmark', '#dataset', '#reasoning', '#agents', '#data', '#optimization', '#inference'], 'emoji': '🧠', 'ru': {'title': 'Открытые LLM нового поколения: прозрачность, рассуждения и синтетические данные в масштабе', 'desc': 'Авторы представляют K2-Horizon — семейство из шести полностью открытых LLM, от плотной модели на 0.9B до MoE на 375B (23B активных параметров), ориентированных на рассуждения и агентные задачи. Ключевые архитектурные нововведения: Mixture-of-Value Attention (MoE, применённый к value-проекциям внимания) и softplus-гейтинг внимания, а также Uno — lossless diffusion-адаптеры, ускоряющие декодирование до 2.2x без отдельной draft-модели. Модели следуют определению открытости LLM360: публикуются чекпоинты, претрейн-данные, логи обучения и весь код, включая фреймворк xLLM и стек RL360. Показано, что синтетические данные (около 10T токенов) могут быть основным компонентом претрейна в больших масштабах.'}, 'en': {'title': 'Open models, efficient reasoning, and fully transparent training', 'desc': 'K2-Horizon is a family of six open language models designed for reasoning and agentic tasks, including coding, science, and office automation. Its Mixture-of-Value Attention and softplus attention gating improve reasoning, while its 36B-A4B model approaches a comparable 32B dense model’s performance using about one-seventh as many active parameters. The paper also introduces Uno, a lossless diffusion adapter that speeds up decoding by up to 2.2 times without needing a separate draft model. To support transparency and reproducibility, the release includes training data, checkpoints, logs, code, and data-generation pipelines, enabling studies of scaling and synthetic data.'}, 'zh': {'title': '更高效的推理，更彻底的开放', 'desc': 'K2-Horizon 是一组从 0.9B 到 375B-A23B 的六款开放语言模型，面向推理、编程和智能体任务，在多项基准上表现出竞争力。为增强推理能力，研究提出混合价值注意力（MoVA），在注意力的 value 投影中使用混合专家（MoE），并引入更灵活的 softplus 注意力门控；其中一款稀疏模型仅启用七分之一的参数，性能接近同数据训练的稠密模型。研究还提出 Uno 无损扩散适配器，无需额外草稿模型即可将解码速度提高最多 2.2 倍。项目公开了模型训练各阶段的检查点、数据、日志、代码和数据构建流程，并展示了合成数据可大规模用于预训练。'}}}, {'id': 'https://huggingface.co/papers/2611.19937', 'title': 'AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data', 'url': 'https://huggingface.co/papers/2611.19937', 'abstract': 'Abstract An end-to-end flow-matching framework generates joint portfolio allocations from raw multi-asset market histories via a cross-asset flow Transformer and a two-stage imitation and group-relative reinforcement learning procedure, improving risk-adjusted returns on cryptocurrency perpetual futures.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Real-world portfolio management requires converting noisy market observations into coordinated, simultaneous allocations across multiple assets under shared capital constraints. Advances in forecasting models and alpha discovery help identify opportunities. However, traditional pipelines often decouple signal forecasting from portfolio construction, potentially misaligning learning with allocation and execution objectives. We present AllocFlow, an end-to-end flow-matching framework that directly generates joint portfolio allocations from raw multi-asset market histories. To capture dependencies among portfolio positions, AllocFlow employs a cross-asset flow Transformer conditioned on temporal market representations to generate continuous, signed position weights across all instruments jointly. To address the sample inefficiency and instability of learning continuous allocation policies from scratch, we establish a two-stage training scheme: strategy-supervised imitation shapes a structured distribution of candidate portfolios, followed by group-relative reinforcement learning (RL) that refines joint decisions using portfolio-level financial rewards and a frozen policy reference. On hourly cryptocurrency perpetual futures, RL refinement raises the annualized net return of the imitation policy from 27.79% to 51.38% and its Calmar ratio from 0.955 to 4.043, surpassing the teacher strategy on every metric, and AllocFlow reaches a Calmar ratio of 4.90 on six further months of unseen 2026 data without retraining.', 'score': 67, 'issue_id': 3542, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': 'b7d77ca10c32e27a', 'authors': ['Annan Wang', 'Yuchen Xie', 'Yu Cen', 'Leon Liangyu Chen', 'Qianyu Julie Zhu', 'Xin Li', 'Tianyi Wei', 'Weisi Lin'], 'affiliations': ['Independent Researcher', 'Massachusetts Institute of Technology', 'Nanyang Technological University', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2611.19937.jpg', 'data': {'categories': ['#architecture', '#training', '#rl', '#optimization'], 'emoji': '📈', 'ru': {'title': 'Портфель целиком: от сырого рынка сразу к оптимальным весам', 'desc': 'В статье предлагается AllocFlow — end-to-end фреймворк на основе flow-matching, который напрямую генерирует совместные веса портфеля по всем активам из сырой истории рынка. Для учёта зависимостей между позициями используется cross-asset flow Transformer, выдающий непрерывные веса с учётом знака. Обучение проходит в два этапа: сначала supervised imitation учит распределение кандидатных портфелей по стратегии-учителю, затем group-relative reinforcement learning дорабатывает решения по портфельным финансовым наградам с замороженной reference-политикой. На часовых данных криптовалютных perpetual futures RL-доработка поднимает годовую доходность с 27.79% до 51.38% и Calmar ratio с 0.955 до 4.043, а на неизвестных данных 2026 года модель сохраняет Calmar 4.90 без переобучения.'}, 'en': {'title': 'Generate portfolios together, then refine them with rewards', 'desc': 'AllocFlow uses raw market histories to generate portfolio weights for multiple assets jointly, rather than forecasting each asset separately and then building a portfolio. A cross-asset flow Transformer models relationships among assets and produces continuous, signed allocations. Training first uses imitation learning to copy a strategy, then group-relative reinforcement learning to improve portfolios based on financial rewards while keeping a frozen policy as a reference. In tests on cryptocurrency perpetual futures, this approach improved risk-adjusted returns and performed well on unseen data without retraining.'}, 'zh': {'title': '从市场历史到联合配置：用流匹配端到端优化投资组合', 'desc': 'AllocFlow 是一种端到端框架，直接根据多个资产的历史市场数据生成联合投资组合配置。它使用跨资产 Flow Transformer，同时生成各资产连续且可正可负的仓位权重，以建模资产之间的依赖关系。训练分为两阶段：先通过策略监督模仿学习得到结构化的投资组合，再用基于组相对优势的强化学习，根据组合层面的金融回报进一步优化决策。该方法在加密货币永续合约数据上提升了风险调整后收益，并在未重新训练的后续数据上取得了较高的 Calmar 比率。'}}}, {'id': 'https://huggingface.co/papers/2611.21218', 'title': 'InclusionMed: Benchmarking AI for Inclusive Healthcare', 'url': 'https://huggingface.co/papers/2611.21218', 'abstract': "Abstract InclusionMed is an open medical AI evaluation initiative that audits and reproduces benchmarks across healthcare roles and capabilities, revealing that model rankings and inference costs vary by context and motivating broader, context-specific evaluation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Advancing medical AI for inclusive healthcare requires evaluation across diverse healthcare roles, tasks, and care settings, but benchmark coverage remains uneven. We introduce InclusionMed, an open medical AI evaluation initiative for inclusive healthcare. The InclusionMed Atlas organizes benchmarks across three healthcare roles and three AI capabilities. For the first release, we selected four public benchmarks from 388 candidates through structured audits and independent reproduction. With InclusionMed-DxFiles, our private diagnostic reasoning benchmark, the Atlas contains five benchmarks covering three of its nine role--capability cells. We evaluated frontier large language models on the Atlas and aggregated their results into the InclusionMed Index, with overall scores ranging from 17.5 to 49.1 out of 100. The Index also reports scores by healthcare role and AI capability, showing that a model's rank varied with the role or capability considered. A within-benchmark analysis using task-level tags showed that the ten highest-ranked models in the Index all scored higher on patient communication than on clinical decision-making. Models with similar Index scores also differed substantially in estimated inference cost. These findings highlight the need for evaluation covering more diverse healthcare needs and for context-specific model selection. Through open collaboration and community contributions, InclusionMed seeks to ensure that diverse healthcare needs worldwide shape how medical AI progress is defined and measured.", 'score': 62, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'b70788d4481960f6', 'pdf_title_img': 'assets/pdf/title_img/2611.21218.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#survey', '#dataset', '#healthcare'], 'emoji': '🩺', 'ru': {'title': 'Оценивать медицинский AI нужно в контексте: один рейтинг не отражает все потребности здравоохранения', 'desc': 'Статья представляет InclusionMed — открытую инициативу по оценке медицинских AI-моделей, которая аудирует и воспроизводит бенчмарки для разных медицинских ролей и возможностей. Авторы отобрали пять бенчмарков из 388 кандидатов и построили InclusionMed Index, по которому frontier LLM набирают от 17.5 до 49.1 балла из 100. Результаты показывают, что ранг модели меняется в зависимости от роли и типа задачи: например, все топ-10 моделей лучше справляются с коммуникацией с пациентом, чем с клиническим принятием решений. Также модели с близкими баллами заметно различаются по стоимости inference, что подчёркивает необходимость контекстной оценки и выбора модели под конкретную задачу.'}, 'en': {'title': 'Evaluate Medical AI for Every Care Context', 'desc': 'The paper introduces InclusionMed, an open initiative for evaluating medical AI across healthcare roles and capabilities. Its Atlas organizes benchmarks, and its first release includes four audited public benchmarks plus a private diagnostic reasoning benchmark. Tests of large language models found that rankings change depending on the role or capability being evaluated, and that top-ranked models performed better on patient communication than on clinical decision-making. Models with similar overall scores also had different estimated inference costs, underscoring the need for broader, context-specific evaluation and model selection.'}, 'zh': {'title': '让医疗AI评测贴合不同角色与真实需求', 'desc': '这篇论文提出 InclusionMed，这是一个面向包容性医疗的开放式人工智能评估计划。它整理并审查不同医疗角色与人工智能能力的基准，并通过独立复现检验评测结果。研究发现，大语言模型的排名会随医疗角色和任务能力而变化，而且患者沟通得分通常高于临床决策得分。不同模型的推理成本也可能差异很大，因此选择医疗人工智能时应结合具体应用场景，并扩大评测覆盖范围。'}}}, {'id': 'https://huggingface.co/papers/2611.07222', 'title': 'SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection', 'url': 'https://huggingface.co/papers/2611.07222', 'abstract': "Abstract  Tool-using agents act on email, files, and payments, so an instruction hidden in a web page or a shared document can make an agent send data or money to an attacker. Many runtime defenses put a language model on the decision that lets an action through, so the decision depends on a model that may read the attacker's text and adds model calls to every step. Provenance defenses keep the model off the final check but need a model to plan or route each task first. Where an action goes can instead be read from the tools' typed returns: an email's sender or a payment's account arrives in a typed field, while injected instructions arrive as free text. SPILLWAY turns this observation into a deterministic floor with no per-task plan. The check admits a call when each target value that appears in tool output but not in the user's task was returned by a read-only tool in a typed field or is covered by a fixed delegation rule. A deterministic sanitizer removes instruction-like regions its fixed rules match before the model reads them and retains the removed spans as evidence, and a local judge may restore a refused call, never one whose target lies in the removed text. Across three backbones, and seven task suites on one of them, no standard templated injection redirects an action to an attacker's target under SPILLWAY, at the highest observed mean utility and composite scores (NRP, ERS) of the defenses we run under that attack. A forged chat template also produces a raw zero, and mean in-scope attack success under a released reinforcement-learning attacker is .007. SPILLWAY reaches this floor with no defense-triggered backbone re-run and almost no added model call. As personal AI agents act on users' email, files, and payments, SPILLWAY gives them an auditable refusal floor on where their actions go that keeps them useful and holds across backbones.", 'score': 49, 'issue_id': 3542, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '353da9dbd903c56a', 'authors': ['Woosang Lim', 'Yeseul Chang', 'Jaewoo Lee'], 'affiliations': ['Chung-Ang University', 'KAIST', 'SAINT Machines'], 'pdf_title_img': 'assets/pdf/title_img/2611.07222.jpg', 'data': {'categories': ['#agents', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Агент не отправит деньги туда, куда велел злоумышленник, потому что адрес получателя проверяется детерминированно', 'desc': 'Статья описывает SPILLWAY — детерминированную защиту для LLM-агентов от prompt injection, при которой злоумышленник прячет инструкции в веб-страницах или документах. Система проверяет адреса получателей действий по типизированным полям инструментов, а не по решению языковой модели, что не требует планирования задач заранее. Перед чтением моделью детерминированный санитайзер удаляет инструкциоподобные фрагменты и сохраняет их как доказательства, а локальный судья может восстановить отклонённый вызов. Эксперименты показывают почти нулевой успех атак при сохранении полезности агента и минимальных дополнительных вызовах модели.'}, 'en': {'title': 'Trust Typed Data, Not Hidden Instructions', 'desc': 'SPILLWAY protects tool-using agents by checking where an action will send data or money. Its deterministic rule allows targets found in typed fields returned by read-only tools, or targets covered by fixed delegation rules, and blocks targets introduced only through untrusted text. A rule-based sanitizer removes instruction-like text before the model sees it, while a local judge may restore a blocked action only when its target is not in the removed text. Across tested models and attacks, SPILLWAY prevented standard injected instructions from redirecting actions while maintaining high utility, with almost no extra model calls.'}, 'zh': {'title': '用可审计的目标检查，守住代理行动的安全底线', 'desc': 'SPILLWAY 是一种保护工具调用代理的防御方法，重点检查邮件收件人或付款账户等操作目标。它利用工具返回的类型化字段，确定用户任务中未提及的目标是否来自只读工具，或是否符合固定的授权规则。系统还会用确定性规则移除可疑指令片段，并保留这些片段作为审计证据；本地判别器可以恢复被拒绝的调用，但不能允许目标来自已移除的文本。实验显示，SPILLWAY 能阻止多种攻击将操作导向攻击者指定的目标，同时保持较高效用，且无需因防御而重新运行主模型。'}}}, {'id': 'https://huggingface.co/papers/2611.20218', 'title': 'SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations', 'url': 'https://huggingface.co/papers/2611.20218', 'abstract': 'Abstract A benchmark of realistic software engineering assignments reveals that current coding agents struggle to track requirements from clarification through implementation, verification, and handoff, completing few tasks despite partial test success.  Generated by deepseek-ai/DeepSeek-V4.1-Flash A coding agent working within a software organization must establish what to build, collaborate with colleagues, and verify what it delivers. We introduce SWE-CoWork, a benchmark comprising 101 development assignments across 101 real repositories, 11 programming languages, and 12 application domains. Each assignment places an agent in a simulated engineering organization with 26 colleagues who have distinct responsibilities, bounded knowledge, and controlled collaboration behavior. Starting from a brief handoff, agents must recover requirements distributed across colleagues and workplace records, reconcile conflicting evidence, and implement changes evaluated by private executable tests. We evaluate eleven models and find a substantial gap between partial implementation and complete task delivery. The two leading models satisfy approximately 63% of fail-to-pass (F2P) tests but complete fewer than 8% of assignments. Providing complete requirements upfront improves F2P by approximately 16 percentage points for Seed Evolving and GPT-6 Astra, yet leaves complete task success unchanged. Requirement-level trajectory analysis reveals failures throughout the delivery process: Claude-Opus-5.5 directs a mean of 93% of first questions about queried cards to their accountable owners across runs but obtains only 64% of colleague-held requirements. Deferred questions go unfollowed, implementations remain incomplete even after requirements are acquired, and 31% of requirements reported as completed fail their tests. These findings highlight sustained requirement tracking, from clarification through implementation, verification, and handoff, as a key challenge for reliable autonomous software engineering.', 'score': 44, 'issue_id': 3542, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': 'b731b5fe6256ecf5', 'authors': ['Xinping Lei', 'Minghao Liu', 'Ruijie Zhu', 'Xiaohui Hu', 'Xingqiao Li', 'Ao Zhang', 'Wenhao Chai', 'Han Li', 'Tao Wang', 'Jingyuan Zhang', 'Enduo Zhao', 'Yunfeng Shi', 'Yiming Liang', 'Zetao Yang', 'Xingjian Wang', 'Yifan Yao', 'Xinkai Ma', 'Yingru Li', 'Tianhan Yang', 'Huan Zhou', 'Weiran Shi', 'Shen Yan', 'Jiaheng Liu', 'Stephen Huang', 'Eli Cheung', 'Weihao Xuan'], 'affiliations': ['TokenWave AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.20218.jpg', 'data': {'categories': ['#plp', '#agents', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Агенты пишут код, но теряют требования по пути к результату', 'desc': 'Статья представляет SWE-CoWork — бенчмарк из 101 реалистичного задания по разработке ПО на реальных репозиториях, где LLM-агенты работают в симулированной инженерной организации с 26 коллегами. Агенту нужно собрать распределённые требования, согласовать противоречивые данные и реализовать изменения, которые проверяются приватными тестами. Оценка одиннадцати моделей показала, что при высоком проценте прохождения fail-to-pass тестов (около 63%) полностью выполняется менее 8% задач. Анализ траекторий выявил главную проблему: агенты теряют отслеживание требований на всех этапах — от уточнения до верификации и передачи работы.'}, 'en': {'title': 'From Requirements to Reliable Delivery', 'desc': 'SWE-CoWork is a benchmark for testing coding agents on realistic software tasks across repositories, languages, and application areas. Agents must gather and reconcile requirements from simulated colleagues and workplace records, implement changes, and verify them with private executable tests. Although leading models pass about 63% of tests for features they begin implementing, they complete fewer than 8% of assignments, and giving them all requirements upfront does not improve full-task success. The results show that reliable software agents need to track requirements continuously through clarification, implementation, testing, and handoff.'}, 'zh': {'title': '从理解需求到验证交付：让编程智能体真正完成任务', 'desc': '本文提出 SWE-CoWork 基准，用来评估编程智能体在真实软件工程任务中的协作与交付能力。基准包含 101 个来自真实代码仓库的任务，智能体需要向同事和工作记录获取需求、处理信息冲突，并通过私有可执行测试验证实现。实验发现，模型虽然能通过一部分新增功能测试，但完整完成任务的比例不到 8%；即使提前提供全部需求，完整成功率也没有提升。失败贯穿需求澄清、实现、测试和交接过程，说明智能体需要持续追踪需求并可靠验证交付结果。'}}}, {'id': 'https://huggingface.co/papers/2611.21607', 'title': 'ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters', 'url': 'https://huggingface.co/papers/2611.21607', 'abstract': 'Abstract  Frontier Vision-Language Models (VLMs) such as GPT-6 Astra have demonstrated remarkable capabilities in robot control, suggesting that broad pretraining provides knowledge valuable for physical action. Yet most Vision-Language-Action (VLA) policies still rely on much smaller VLM backbones, leaving this potential largely untapped. We ask whether frontier-scale representations can provide a stronger foundation for robot learning. We introduce ScaleVLA, which connects a 552B DeepSeek-V4.1-Flash backbone to a trainable action DiT, and systematically compare VLMs from 2B to 552B under a shared training setup. We evaluate three fundamental capabilities of robot foundation models. In sample efficiency, just 10 demonstrations outperform a 2B backbone trained with 50 (87.8% vs. 85.6%). In generalization, LIBERO-PRO success reaches 45.1%, compared with at most 31.3% for smaller backbones. In precise manipulation, real-world charger insertion improves from 4/10 to 9/10 successes, with gains concentrated in contact-sensitive alignment. Despite its scale, ScaleVLA achieves 216 ms median latency per action chunk. Our findings suggest that frontier VLMs can serve not only as reasoning agents, but also as powerful representational foundations for efficient and generalizable robot policies.', 'score': 41, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'e241c8a640c86270', 'authors': ['Ruixi Yu', 'Dairu Liu', 'Xuchuan Chen', 'Zekun Qi', 'Zekai Li', 'Zhuo Cao', 'Luyang Niu', 'Yingsheng Zhang', 'Sikai Liang', 'Ke Fan', 'He Wang', 'Li Yi'], 'affiliations': ['Galbot', 'Peking University', 'Shanghai Jiao Tong University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.21607.jpg', 'data': {'categories': ['#architecture', '#training', '#robotics', '#benchmark', '#multimodal', '#agents', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Масштаб языковой модели открывает новые горизонты для роботов', 'desc': 'В статье представлена ScaleVLA — модель типа Vision-Language-Action, которая соединяет крупную языковую модель DeepSeek-V4.1-Flash на 552 млрд параметров с обучаемым диффузионным трансформером (DiT) для генерации действий робота. Авторы систематически сравнивают VLM-бэкбоны от 2 до 552 млрд параметров при одинаковом режиме обучения. Оценивались эффективность по числу демонстраций, обобщающая способность на бенчмарке LIBERO-PRO и точность манипуляций в реальном мире, например вставка зарядки. Результаты показывают, что фронтирные VLM служат мощной представляющей основой для робототехнических политик, при этом задержка составляет 216 мс на чанк действий.'}, 'en': {'title': 'Scale Up Vision-Language Models to Build More Capable Robot Policies', 'desc': 'The paper introduces ScaleVLA, a robot policy that connects a 552B-parameter vision-language model to a trainable diffusion transformer (DiT) for generating actions. It compares models ranging from 2B to 552B parameters using the same training setup. The largest model learns more efficiently, generalizes better, and succeeds more often at precise tasks such as inserting a charger. These results suggest that large pretrained models can provide strong representations for robot learning while still producing actions with practical speed.'}, 'zh': {'title': '让前沿视觉语言模型成为机器人的强大行动基础', 'desc': '本文提出 ScaleVLA，将 5520 亿参数的视觉语言模型连接到可训练的动作扩散 Transformer（DiT），用于机器人控制。研究在统一训练设置下比较了 20 亿至 5520 亿参数的视觉语言模型，发现更大的模型能提升样本效率：仅用 10 次示范，成功率就达到 87.8%，超过较小模型用 50 次示范取得的 85.6%。在泛化和精细操作任务中，ScaleVLA 也表现更好：LIBERO-PRO 成功率达到 45.1%，现实中的充电器插入成功次数从 10 次中 4 次提高到 9 次。尽管模型规模庞大，它每个动作片段的中位延迟仍为 216 毫秒，说明前沿视觉语言模型可以成为高效且泛化能力强的机器人策略基础。'}}}, {'id': 'https://huggingface.co/papers/2611.17834', 'title': 'PaperCritic: Training AI Reviewers to Assess the Soundness of Papers', 'url': 'https://huggingface.co/papers/2611.17834', 'abstract': "Abstract An AI reviewer trained by reinforcement learning to jointly maximize precision and recall of soundness review points outperforms frontier models and other training methods and transfers to other review domains.  Generated by deepseek-ai/DeepSeek-V4.1-Flash As AI conference submissions grow rapidly, AI reviewers are being considered as an alternative. However, simply imitating human reviewing is problematic because reviewing serves multiple purposes, including evaluating papers' soundness, interestingness, and clarity, the last two of which are subjective. In this work, we focus solely on evaluating soundness, the most important and objective criterion, and define the learning objective as jointly maximizing (1) precision, based on the soundness and substantiveness of review points, and (2) recall, the coverage of high-quality reference review points. Under this problem formulation, we construct a quality-labeled review point dataset, PaperSound-23K, using 1K ICLR submissions and 23K human-written and LLM-generated review points. Using this dataset, we train an AI reviewer model, PaperCritic, through reinforcement learning with the F1 score of precision and recall as the reward. Our experiments show that PaperCritic outperforms frontier models and models trained with other AI reviewer training methods on an in-domain test set. Surprisingly, learning to review ICLR submissions also transfers to reviewing Nature-family papers and even to out-of-domain reviewing tasks (e.g., code review, legal contract review, and feedback on story writing).", 'score': 26, 'issue_id': 3542, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': 'a2ea720d4cdd7658', 'authors': ['Hyun Ryu', 'Ji Yong Cho', 'Eunho Yang', 'Moontae Lee', 'June Yong Yang', 'Sean Welleck', 'Carolyn Rose'], 'affiliations': ['Carnegie Mellon University', 'KAIST AI', 'LG AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2611.17834.jpg', 'data': {'categories': ['#training', '#rl', '#benchmark', '#dataset', '#alignment', '#data', '#transfer_learning', '#games', '#science'], 'emoji': '🔍', 'ru': {'title': 'Обучаем AI-ревьюера находить главное: точность и полнота в оценке обоснованности', 'desc': 'Авторы предлагают AI-ревьюера PaperCritic, который оценивает только обоснованность (soundness) научных статей, так как этот критерий наиболее объективен, в отличие от субъективных interestingness и clarity. Модель обучается с помощью reinforcement learning, где награда — F1-мера, объединяющая precision (содержательность и корректность замечаний) и recall (полнота покрытия эталонных замечаний). Для обучения создан размеченный датасет PaperSound-23K из 1K статей ICLR и 23K замечаний, написанных людьми и LLM. PaperCritic превосходит frontier-модели и альтернативные методы обучения, а также неожиданно переносится на рецензирование статей Nature и даже на задачи вне домена, например ревью кода и юридических договоров.'}, 'en': {'title': 'Train reviewers to be both precise and thorough', 'desc': 'The paper trains PaperCritic to assess the soundness of research papers, focusing on whether review points are correct and useful. It introduces PaperSound-23K, a dataset of labeled human- and AI-generated review points. The model uses reinforcement learning, with an F1-based reward that balances precision and recall. PaperCritic outperforms competing models on ICLR reviews and transfers to other research and review tasks.'}, 'zh': {'title': '以强化学习兼顾审稿意见的准确性与覆盖度', 'desc': '本文聚焦于评估论文论证是否可靠，而非判断其趣味性或表达清晰度等主观特征。研究者构建了 PaperSound-23K 数据集，并训练 AI 审稿模型 PaperCritic，使其同时提升审稿意见的精确率和召回率。训练采用强化学习，以精确率和召回率的 F1 分数作为奖励。实验显示，PaperCritic 优于前沿模型及其他训练方法，并能迁移到期刊论文审阅、代码审查、合同审查和故事反馈等任务。'}}}, {'id': 'https://huggingface.co/papers/2611.20254', 'title': 'VoxMel TTS Technical Report', 'url': 'https://huggingface.co/papers/2611.20254', 'abstract': 'Abstract VoxMel is a tokenizer-free autoregressive TTS framework that uses an invertible two-axis Haar transform to decompose mel spectrograms into Coarse-Mel and residual tiers, enabling stable high-fidelity generation with strong recognition and speaker-similarity results.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Continuous autoregressive TTS relies on an acoustic target that enables stable next-latent modeling while preserving fine-grained acoustic details. While existing approaches employ learned compressed representations (e.g., continuous VAE latents) to render prediction tractable, they rely on complex neural encoders that often cap generation fidelity. Conversely, training-free targets like mel-spectrograms eliminate encoder overhead, yet their potential for autoregressive generation remains largely underexplored. In this work, we propose VoxMel, a tokenizer-free framework for autoregressive TTS that makes stable mel modeling tractable through a fixed, exactly invertible two-axis Haar transform. The transform first decomposes each mel spectrogram along frequency into local averages and a frequency residual, then splits the averaged component along time into Coarse-Mel and a temporal residual. A language-model backbone with a flow-matching head autoregressively generates Coarse-Mel. Non-autoregressive residual tiers then predict the temporal residual from Coarse-Mel, followed by the frequency residual conditioned on the reconstructed Frequency-Averaged Mel. Neither residual is fed back into the autoregressive history. Trained on 100K hours of Emilia, the supervised 0.6B model obtains 1.51\\% WER and 0.738 speaker similarity (SIM) on test-en, and 1.29\\% CER and 0.755 SIM on test-zh. GRPO improves these results to 1.15\\% WER / 0.753 SIM and 1.17\\% CER / 0.776 SIM, respectively. We also distill the guided flow head into two- and four-step students, requiring 2 or 4 head evaluations per coarse frame. The four-step student retains competitive SIM and nearly matches the supervised model in WER/CER.', 'score': 22, 'issue_id': 3542, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': '34351c54277e863a', 'authors': ['Wenhao Guan', 'Jiaxin Ye', 'Haitao Li', 'Yifan Duan', 'Junxi Liu', 'Wangjin Zhou', 'Lin Li', 'Qingyang Hong', 'Xie Chen'], 'affiliations': ['Fudan University', 'Kyoto University', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Xiamen University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.20254.jpg', 'data': {'categories': ['#architecture', '#training', '#alignment', '#audio', '#inference', '#multilingual'], 'emoji': '🎙️', 'ru': {'title': 'Точный синтез речи без энкодеров: раскладываем mel-спектрограмму по уровням', 'desc': 'Статья представляет VoxMel — tokenizer-free фреймворк для авторегрессионного TTS, который моделирует mel-спектрограммы без обучаемых энкодеров. Используется фиксированное точно обратимое двухосевое преобразование Хаара: сначала по частоте выделяются локальные средние и частотный остаток, затем усреднённая часть делится по времени на Coarse-Mel и временной остаток. LLM-бэкбон с flow-matching головой авторегрессионно генерирует Coarse-Mel, а нерегрессионные residual-уровни восстанавливают детали, при этом остатки не подаются обратно в историю. Модель, обученная на 100K часов Emilia, достигает state-of-the-art по WER, CER и SIM, а дистилляция головы в 2–4 шага сохраняет высокое качество при меньших вычислениях.'}, 'en': {'title': 'Generate speech from coarse mel, then restore the detail', 'desc': 'VoxMel is a tokenizer-free text-to-speech system that models mel spectrograms using a fixed, exactly invertible two-axis Haar transform. It splits the spectrogram into a Coarse-Mel tier and temporal and frequency residuals; an autoregressive language model with a flow-matching head generates the Coarse-Mel, while non-autoregressive models predict the residuals. On English and Chinese tests, the system achieves strong word or character error rates and speaker similarity, with further gains from GRPO training. The authors also distill the flow head into faster two- and four-step models, and the four-step version keeps competitive speaker similarity while nearly matching the supervised model’s recognition results.'}, 'zh': {'title': '用可逆频谱分解，让自回归语音生成又稳又细', 'desc': 'VoxMel 提出一种无需分词器或学习式声学编码器的自回归文本转语音框架。它用固定且可精确逆变换的双轴 Haar 变换，将梅尔频谱分解为粗粒度梅尔频谱和时间、频率残差。模型通过带流匹配头的语言模型自回归生成粗粒度部分，再以非自回归方式依次预测残差，从而兼顾生成稳定性与声学细节。该方法在中英文语音测试中取得较低的词错误率和字符错误率，并可通过强化学习优化及少步数蒸馏提升效果、加快生成。'}}}, {'id': 'https://huggingface.co/papers/2611.20882', 'title': 'Accelerate Bench: Evaluating Agents for Application-Level Program Optimization', 'url': 'https://huggingface.co/papers/2611.20882', 'abstract': "Abstract  Application optimization requires coding agents to discover useful changes and coordinate them across a complete program while preserving the required computation. We introduce Accelerate Bench, a benchmark of 32 CPU optimization tasks adapted from scientific applications and supercomputing competitions. Each task provides a working program and specifies the workload, correctness requirements, timing boundaries, and permitted edits, leaving agents to choose where and how to optimize. Public testing supports iterative development, and a separate verifier scores the final submission. On benchmark version 1.1, we evaluate 16 coding agents, each pairing a model with a harness. Their Score@1 ranges from 25.5% to 67.4%. Most of their programs are correct, and the size of the speedup separates them: the two leading agents are at least 2x faster on 22 or more of the 32 tasks, while the other fourteen reach 2x on 8 to 17 and leave 125 of their 412 correct outcomes below 1.25x. Controlled replays show why coordination across an application matters: identical source code runs between 0.29x and 2.12x depending only on build and runtime settings, and one code change is worth 1.01x or 6.4x depending on another. Accelerate Bench pairs executable workloads with agents' programs and trajectories to evaluate both their gains and the process behind them.", 'score': 16, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '4bd62fd8a1cab04c', 'authors': ['Bowen Liu', 'Yuhan Li', 'Nuo Chen', 'Weile Luo', 'Miao Peng', 'Qintong Zhang', 'Qifan Zhang', 'Jia Li', 'Ziqi Gao', 'Lydell Huang'], 'affiliations': ['Peking University', 'Tencent Hy Team', 'The Hong Kong University of Science and Technology', 'The Hong Kong University of Science and Technology (Guangzhou)', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.20882.jpg', 'data': {'categories': ['#plp', '#agents', '#optimization', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Быстрый код важнее правильного кода: оптимизация всей программы, а не отдельных правок', 'desc': 'В статье представлен Accelerate Bench — бенчмарк из 32 задач по оптимизации CPU-программ, взятых из научных приложений и суперкомпьютерных соревнований. Агенты на основе LLM должны самостоятельно находить полезные изменения в коде и согласовывать их по всей программе, сохраняя корректность вычислений и укладываясь в ограничения по времени. Оценка проводится на 16 coding agents, и разброс результатов Score@1 составляет от 25.5% до 67.4%, при этом главным отличием является величина ускорения, а не корректность. Эксперименты показывают, что эффект изменений сильно зависит от настроек сборки, рантайма и взаимодействия между правками, поэтому оценивается не только итоговый результат, но и сам процесс оптимизации агентов.'}, 'en': {'title': 'Benchmarking Coding Agents for End-to-End CPU Speedups', 'desc': 'The paper introduces Accelerate Bench, a benchmark of 32 CPU optimization tasks based on scientific and supercomputing programs. It evaluates 16 coding agents by checking correctness and measuring speedups, with top agents reaching at least 2× speedup on 22 or more tasks. Results show that optimization depends not only on code changes, but also on coordinating changes across the application and choosing suitable build and runtime settings. The benchmark includes executable workloads and agent trajectories, enabling evaluation of both performance gains and how agents achieve them.'}, 'zh': {'title': '优化不止改代码：让整套程序协同加速', 'desc': '本文提出 Accelerate Bench，这是一个包含 32 个 CPU 优化任务的基准，任务取材于科学应用和超级计算竞赛。每项任务都提供可运行程序，并规定工作负载、正确性要求、计时范围和允许修改的部分，用于评估编码智能体能否在保持计算正确的同时优化完整程序。对 16 种智能体的测试显示，Score@1 从 25.5% 到 67.4% 不等；领先的两种智能体在至少 22 项任务中实现了 2 倍或更高加速。实验还发现，构建与运行时设置以及不同代码修改之间的配合会显著影响性能，因此该基准也记录程序和智能体的优化过程。'}}}, {'id': 'https://huggingface.co/papers/2611.17110', 'title': 'SALA: Semantically Aligned Latent Actions Enable Dual-Axis Scaling of Embodied Foundation Models', 'url': 'https://huggingface.co/papers/2611.17110', 'abstract': 'Abstract SALA aligns latent actions across human and robot videos by using language-based semantic similarities to form a shared latent action space that supervises embodied foundation model training and improves robot task performance.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Embodied foundation models hinge on diverse robot interaction data, which are costly to collect. Egocentric human videos offer a complementary source of experience, and latent action models (LAMs) provide a popular means of leveraging these videos for policy supervision. Compared with world-action models (WAMs), LAMs can offer greater training efficiency and potentially lower inference costs by avoiding explicit pixel prediction during policy learning and execution. However, most existing LAMs learn latent actions solely through video reconstruction, which can cause their representations to cluster by visual appearance rather than by the underlying actions. As a result, they struggle to align human actions with their robot counterparts. To bridge the gap, we introduce SALA, which emphasizes establishing the semantic correspondence for latent actions. Without requiring paired data, we use the language descriptions of unpaired human and robot clips to estimate semantic similarities and supervise cross-embodiment correspondence. Specifically, we translate these similarities into soft neighborhood structures that guide human latent actions toward semantically related robot latents, while robot action reconstruction grounds the latent space in control. The resulting shared latent action space provides a unified supervision signal for training an embodied foundation model on both human and robot videos. Notably, latent action supervision enables scaling along two axes: (1) pre-training on increasing amounts of general human video consistently reduces robot action prediction error on downstream tasks, and (2) post-training on increasing amounts of task-specific human video substantially improves real-world robot task success rates.', 'score': 13, 'issue_id': 3542, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': '1f454069a81b13d4', 'authors': ['Jiachun Jin', 'Zetong Zhou', 'Haonan Wang', 'Zhijie Deng'], 'affiliations': ['SJTU-Sharpa Joint Lab for Embodied AI, SJTU', 'Sharpa Robotics'], 'pdf_title_img': 'assets/pdf/title_img/2611.17110.jpg', 'data': {'categories': ['#synthetic', '#training', '#robotics', '#multimodal', '#alignment', '#video'], 'emoji': '🤖', 'ru': {'title': 'Учимся у людей через общий язык действий', 'desc': 'В статье предлагается метод SALA, который выравнивает латентные действия (latent actions) между видео людей и роботов без парных данных. Семантическое сходство оценивается по языковым описаниям клипов, и на его основе строится мягкая структура соседства, направляющая человеческие латентные действия к семантически близким роботизированным. Реконструкция действий робота закрепляет общее латентное пространство в задачах управления, давая единый сигнал для обучения embodied foundation model. Эксперименты показывают, что предобучение на большом объёме человеческого видео снижает ошибку предсказания действий робота, а дообучение на задаче-специфичных видео заметно повышает успешность выполнения задач в реальном мире.'}, 'en': {'title': 'Align Actions by Meaning, Learn from More Videos', 'desc': 'SALA uses language descriptions to find semantic similarities between unpaired human and robot video clips. These similarities guide latent action models to align actions with the same meaning, while robot action reconstruction keeps the representations useful for control. The shared latent action space lets embodied foundation models learn from both human and robot videos without needing paired examples. Experiments show that adding more human video improves robot action prediction and real-world task success.'}, 'zh': {'title': '以语言语义对齐人机潜在动作，拓展机器人学习数据', 'desc': 'SALA提出一种让人类视频与机器人视频共享潜在动作表示的方法，以便利用大量人类视频训练具身基础模型。它使用语言描述估计未配对视频片段之间的语义相似度，并将相似度转化为软邻域结构，引导语义相关的人类与机器人潜在动作对齐。与此同时，机器人动作重建使共享潜在空间保留与控制相关的信息。实验表明，增加通用人类视频预训练数据可降低机器人动作预测误差，而增加任务相关的人类视频后训练数据可提高真实机器人任务成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.20986', 'title': 'Calpha: Toward Native Biomolecular Intelligence in a General-Purpose Language Model', 'url': 'https://huggingface.co/papers/2611.20986', 'abstract': "Abstract A large language model can output single-chain protein structures from its internal residue states by invoking a pretrained structure head, with reduced long-chain accuracy and MMLU-Pro accuracy in the reported tests.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Biomolecular foundation models predict the structures of proteins and their complexes accurately, and large language models (LLMs) reason in natural language, but the two remain separate: the abilities of the former are not part of a general-purpose LLM, and the reasoning of the latter does not enter a structure prediction. Calpha aims at one general model that folds proteins and complexes, understands protein sequence and structure, and lets its language reasoning influence the structures it predicts. This report covers the first step, in which an LLM outputs single-chain protein structures. Qwen3.5-9B reads a sequence enriched with ESM2 residue features. It can respond in text or emit a token that invokes a pretrained SimpleFold structure head, which receives information about the protein only through Qwen's residue states. Under a fixed folding request, the head achieves mean TM-scores of 0.808 on the FoldBench-334 development set, 0.635 on CASP16 domains and 0.900 on a CAMEO-style PDB set. We compare these predictions with a baseline in which ESM2-3B encodes the sequence and a fine-tuned SimpleFold-3B head predicts the coordinates. The two systems also differ in trainable weights, training duration and crop length. For chains of 100--299 residues, all three paired confidence intervals include zero. At 300--600 residues, the mean differences are -0.044, -0.160 and -0.025, respectively. In a separate test, four English request types triggered folding on every evaluated example. Protein training reduced accuracy on a 350-item MMLU-Pro subset from 77.4% to 70.3%. An LLM can therefore output single-chain structures from its own states, with lower long-chain scores in the current comparisons and reduced accuracy on the evaluated MMLU-Pro subset. Complex prediction, structure understanding and the effect of language reasoning on the predicted coordinates remain future work.", 'score': 11, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '91d62a06d27ce87c', 'authors': ['Yong Liu', 'Zhanpeng Shi', 'Peicong Lin', 'Zhenyi Zhong', 'Yizhou Dang', 'Wendi Wu', 'Haoling Li', 'Shuangjia Zheng'], 'affiliations': ['Fudan University', 'Lingang Laboratory', 'Nanjing University', 'Northeastern University', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2611.20986.jpg', 'data': {'categories': ['#architecture', '#training', '#benchmark', '#optimization', '#science'], 'emoji': '🧬', 'ru': {'title': 'LLM учится складывать белки, но жертвует частью своего интеллекта', 'desc': 'В статье описывается большая языковая модель (LLM) Qwen3.5-9B, которая получает последовательность белка, обогащенную признаками ESM2, и может выводить 3D-структуру одноцепочечного белка, вызывая предобученную голову SimpleFold. Структурная голова получает информацию о белке только через внутренние состояния остатков LLM, а качество оценивается по TM-score на наборах FoldBench, CASP16 и CAMEO. Сравнение с базовой системой ESM2-3B + SimpleFold-3B показывает близкие результаты для коротких цепей, но заметное отставание для белков длиной 300–600 остатков. Обучение на белковых данных также снижает точность на подвыборке MMLU-Pro с 77.4% до 70.3%, поэтому задачи предсказания комплексов и влияния языкового рассуждения на координаты остаются будущей работой.'}, 'en': {'title': 'Teaching an LLM to Fold Proteins from Its Own Representations', 'desc': 'The paper tests whether a large language model (LLM) can use its own residue representations to produce protein structures. Qwen3.5-9B reads protein sequences with ESM2 features, then passes its residue states to a pretrained SimpleFold structure head to predict coordinates. The system achieves good TM-scores on several single-chain benchmarks, but performs worse than the comparison baseline on longer proteins in the reported tests. Protein training also lowers accuracy on the tested MMLU-Pro questions; predicting protein complexes and using language reasoning to guide structures remain future work.'}, 'zh': {'title': '让语言模型从自身表示出发折叠蛋白质', 'desc': '这项研究探索让大型语言模型（LLM）利用自身的残基表示来生成单链蛋白质结构。模型以蛋白质序列和 ESM2 残基特征为输入，并可调用一个预训练的 SimpleFold 结构预测头来输出结构。在测试中，该方法能预测蛋白质结构；与基线相比，短链结果差异不明显，但在较长链上的表现较低。蛋白质训练也使模型在所测的 MMLU-Pro 子集上的准确率下降，而复合物预测、结构理解及语言推理对结构的影响仍有待研究。'}}}, {'id': 'https://huggingface.co/papers/2611.21339', 'title': 'MovieRoll: A Systematic Framework for Rolling Out Long-Form Videos', 'url': 'https://huggingface.co/papers/2611.21339', 'abstract': 'Abstract  Streaming video generation must sustain quality beyond the training horizon while handling self-generated history and growing cache costs. To address these challenges, we present MovieRoll, a base-to-distilled framework that connects streaming fine-tuning, long-rollout distillation, and long-horizon inference. We first establish a robust multi-step base through Window-wise Teacher Forcing (WinTF), which jointly denoises chunks at progressive noise levels with bidirectional attention within each window and causal access to preceding history. To retain historical context efficiently, hierarchical KV-cache compression (HieraKV) exploits layer-wise attention patterns, retaining full history in shallow layers and sink--recent history in deeper layers. This reduces cache memory by up to 78% while improving generation quality. Building on this base, cumulative long tuning with distribution matching distillation (CuLT-DMD) holds parameters fixed throughout each long self-rollout and averages local gradients before updating. Each update therefore combines supervision across temporal positions while retaining only one local computation graph, enabling efficient long-rollout training of a few-step generator. To extend generation beyond the training horizon, KV recomputation bounds context for both models, while guidance annealing (AnnealCFG) reduces guidance toward the clean endpoint to stabilize MovieRoll-Base. Complementing these modeling advances, FBCA attention and PS-VAE decoding support efficient training and streaming output. On HeliosBench, MovieRoll-Base remains competitive at 30s after training on videos of up to 15s, and MovieRoll-Distilled achieves the highest total scores among the compared methods across single- and multi-event evaluations up to 60s, combining sustained naturalness with active motion.', 'score': 10, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '386a1db5a1a4bfdc', 'authors': ['Yunyang Ge', 'Weijie Kong', 'Ryan Xu', 'Yue Wu', 'Qi Tian', 'Jiangfeng Xiong', 'Bin Lin', 'Mingzhe Zheng', 'Shenghai Yuan', 'Zheyuan Liu', 'Jianwei Zhang', 'Li Yuan'], 'affiliations': ['Peking University', 'Tencent Hunyuan', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.21339.jpg', 'data': {'categories': ['#architecture', '#training', '#benchmark', '#optimization', '#long_context', '#video'], 'emoji': '🎬', 'ru': {'title': 'Длинное видео в потоке без потери качества', 'desc': 'Статья представляет MovieRoll — фреймворк для потоковой генерации видео, объединяющий потоковое fine-tuning, дистилляцию на длинных self-rollout и инференс на длинном горизонте. Для стабильной базовой модели используется Window-wise Teacher Forcing, а для эффективного хранения истории применяется иерархическое сжатие KV-cache (HieraKV), которое уменьшает память кэша до 78%. Дистилляционный этап CuLT-DMD усредняет локальные градиенты при фиксированных параметрах, позволяя обучать few-step генератор на длинных последовательностях с одним графом вычислений. Эксперименты на HeliosBench показывают, что модели сохраняют качество и динамику видео до 30–60 секунд, обучаясь лишь на роликах до 15 секунд.'}, 'en': {'title': 'Generate Longer Videos with Less Memory', 'desc': 'MovieRoll is a framework for generating streaming videos that remain coherent over long durations while keeping memory use manageable. Its base model uses Window-wise Teacher Forcing to learn chunk-by-chunk generation, and HieraKV compresses the key-value cache by keeping different amounts of history in different layers. The distilled model uses CuLT-DMD to train on long self-generated videos efficiently, while KV recomputation and guidance annealing help generation stay stable beyond the training horizon. On HeliosBench, MovieRoll performs competitively at 30 seconds, and its distilled version leads the compared methods across evaluations up to 60 seconds.'}, 'zh': {'title': '压缩历史、蒸馏长程：让流式视频生成走得更远', 'desc': '本文提出 MovieRoll，一种面向长时流式视频生成的训练与推理框架，目标是在超出训练时长后仍保持视频质量，并控制历史缓存开销。WinTF 通过分窗口的多步去噪训练基础模型；HieraKV 根据不同层的注意力模式压缩键值缓存，最多减少 78% 的内存并提升生成质量。随后，CuLT-DMD 使用长程自回滚蒸馏训练少步生成器，并通过累积多个时间位置的梯度来提高训练效率；KV 重计算和逐渐减弱的引导则帮助模型稳定生成更长视频。在 HeliosBench 上，MovieRoll-Base 在 30 秒生成任务中表现有竞争力，MovieRoll-Distilled 在最长 60 秒的单事件与多事件评测中取得最高总分之一，同时保持自然度和动作活跃度。'}}}, {'id': 'https://huggingface.co/papers/2611.20404', 'title': 'Latent Feedback Is a Compute and Data Amplifier', 'url': 'https://huggingface.co/papers/2611.20404', 'abstract': "Abstract Latent feedback, which feeds each token's top-layer state into the next token's input, improves compute and data efficiency over standard Transformers, especially when unique data is abundant relative to model size.  Generated by deepseek-ai/DeepSeek-V4.1-Flash When high-quality data runs out, a common practice is to train on it for several epochs, but each repeat is worth less than the last. Latent feedback, which feeds each token's top-layer state into the next token's input, is another way to spend that compute, yet it has not been tested against a vanilla Transformer that spends the same compute on more epochs. We run this test across a ladder of model sizes, unique data and epochs, tuning both models at every size and amount of unique data. Latent feedback makes every FLOP and every token count for more except when unique data is scarce relative to model size, a regime that today's models are far from. We find that latent feedback serves as an amplifier: with unique data fixed, it reaches a Transformer's loss with less compute; with epochs fixed, it reaches that loss with less unique data. Furthermore, both savings grow with unique data per parameter and with repetition, and downstream tasks agree. To go beyond our grid, we fit one scaling law to both models, in which latent feedback enters as a Transformer with more parameters; it predicts that both savings keep growing with unique data and repetition. Fitted on models from 60M to 271M parameters, the law predicts the losses at a held-out 778M size to within 0.3% and the gap between the two models to within 0.05%. At most, latent feedback saves 48% of the compute and 47% of the unique data. When data, not compute, is the limit, latent feedback is the better use of a FLOP for a model of a given size.", 'score': 6, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '15f917de6019263a', 'authors': ['Benhao Huang', 'Chaitanya Dwivedi', 'Xuezhe Ma', 'Alexander Moreno', 'Hector Liu'], 'affiliations': ['Institute of Foundation Models, USC'], 'pdf_title_img': 'assets/pdf/title_img/2611.20404.jpg', 'data': {'categories': ['#architecture', '#training', '#optimization'], 'emoji': '🔁', 'ru': {'title': 'Латентная обратная связь экономит вычисления и данные, когда данных мало', 'desc': 'В статье исследуется латентная обратная связь (latent feedback), при которой состояние верхнего слоя каждого токена подаётся на вход следующего токена. Авторы сравнивают её с обычным Transformer, обученным на том же объёме вычислений, но с большим числом эпох на уникальных данных, для разных размеров моделей и объёмов данных. Результаты показывают, что латентная обратная связь выступает усилителем: она достигает того же loss с меньшим числом FLOP или уникальных токенов, а выгода растёт при увеличении данных на параметр и числа повторений. Авторы также предлагают scaling law, которая точно предсказывает поведение модели на 778M параметров по данным моделей от 60M до 271M, и показывают экономию до 48% вычислений и 47% данных.'}, 'en': {'title': 'Make Every Token and FLOP Go Further', 'desc': 'The paper compares latent feedback with a standard Transformer using the same compute across different model sizes, data amounts, and training epochs. Latent feedback passes each token’s top-layer hidden state into the next token’s input, improving compute and data efficiency in most tested settings. Its benefits grow when there is more unique training data per model parameter and when data is repeated, with savings reaching 48% of compute and 47% of unique data. A scaling law models latent feedback as a Transformer with more parameters and accurately predicts results at a larger, held-out model size.'}, 'zh': {'title': '让每个 FLOP 与每份数据发挥更大价值', 'desc': '这篇论文比较了潜在反馈与标准 Transformer：潜在反馈会把每个词元的顶层隐藏状态作为下一个词元的输入。研究者在不同模型规模、独特数据量和训练轮数下进行等计算量实验，发现除独特数据相对模型规模过少时，潜在反馈通常能更有效地利用计算量和数据。它像一种放大器：在达到相同损失时，可以减少计算量或独特数据需求，且数据重复越多、每个参数对应的独特数据越多，节省越明显。论文还拟合了能描述两种模型的缩放定律，并报告潜在反馈最多可节省48%的计算量和47%的独特数据。'}}}, {'id': 'https://huggingface.co/papers/2611.14960', 'title': 'Termination Lag: Coding Agents Solve Early but Stop Late', 'url': 'https://huggingface.co/papers/2611.14960', 'abstract': "Abstract Coding agents often find correct patches early but continue working, sometimes undoing correct solutions, with termination lag varying by model and benchmark.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Coding agents can solve a task well before they stop working on it. We characterize termination lag--the number of steps between an agent's first correct patch and the end of its run--across five models, two agent frameworks, and three SWE-bench datasets by recording and testing every distinct repository patch generated during execution. Our analysis reveals that 38--82% of successful runs achieve a correct solution on their initial source-code edit. However, agents continue to expend substantial effort after correct patches, with post-solution steps accounting for a median of 35--37% for Qwen3-Coder and 54--60% for Laguna-XS.2 in successful runs on SWE-bench Verified and Multilingual. Agents spend most of these additional steps verifying their work and exploring the repository. In a small fraction of cases (1--8%), this continued activity leads agents to undo their earlier correct patch, leaving the final solution incorrect.", 'score': 5, 'issue_id': 3543, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': '62db2a6c3c3deffd', 'authors': ['Musa Cim', 'Burak Topcu', 'Mahmut Taylan Kandemir'], 'affiliations': ['The Pennsylvania State University, University Park, PA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2611.14960.jpg', 'data': {'categories': ['#benchmark', '#agents', '#plp'], 'emoji': '🤖', 'ru': {'title': 'Агент нашёл решение, но не умеет вовремя остановиться', 'desc': 'Статья исследует, как LLM-агенты для написания кода тратят лишние шаги после того, как уже нашли правильный патч. Авторы измеряют «задержку завершения» на пяти моделях, двух фреймворках и трёх датасетах SWE-bench. Оказалось, что у 38–82% успешных запусков правильное решение появляется уже при первой правке кода, но агенты продолжают работать, а в 1–8% случаев даже откатывают верное решение. Это указывает на необходимость лучших механизмов остановки и верификации.'}, 'en': {'title': 'Stop When the Patch Is Right', 'desc': 'The paper studies termination lag: the steps an AI coding agent takes after first producing a correct patch. Across five models, two agent frameworks, and three SWE-bench datasets, the researchers test each distinct patch made during a run. Many successful runs produce a correct solution in the agent’s first code edit, yet agents often continue verifying their work and exploring the repository. In 1–8% of cases, this extra activity undoes the correct patch and makes the final solution incorrect.'}, 'zh': {'title': '找到正确补丁后，智能体也该及时停下', 'desc': '本文研究编程智能体找到正确代码补丁后，继续执行却迟迟不停止的现象，并将其称为“终止延迟”。研究人员在五种模型、两种智能体框架和三个 SWE-bench 数据集上，记录并测试运行过程中生成的每个不同补丁。结果显示，38%至82%的成功运行在第一次代码编辑时就已得到正确解，但后续步骤仍占成功运行总步骤的相当比例，主要用于验证和探索代码库。少数情况下，智能体会在继续操作时撤销正确补丁，导致最终答案错误。'}}}, {'id': 'https://huggingface.co/papers/2611.18919', 'title': 'Correcting Persistent Failures in Point-Cloud Grasping Policies using Human Demonstrations in Virtual Reality', 'url': 'https://huggingface.co/papers/2611.18919', 'abstract': 'Abstract A human-in-the-loop failure-mining pipeline turns persistently unsolved grasps of a reinforcement-learning point-cloud policy into virtual-reality human demonstrations, improving hard-case success without reducing generalization to unseen objects.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Robots in homes, warehouses and farms must pick up objects they have never seen, usually without a 3D model or a category label. A grasping policy that works directly on the point cloud from a depth sensor needs only the geometry the robot observes, so it applies to any new object. Offline grasp generators such as Contact-GraspNet work this way, but they rank grasps by learned plausibility rather than by whether the grasp actually lifts the object. Reinforcement learning (RL) can optimize for that directly and make a point-cloud grasping policy much better on average, yet it leaves specific grasps persistently unsolved. We present a human-in-the-loop failure loop that targets those grasps: situations an RL policy keeps failing are mined automatically, sent to a virtual-reality application where a person picks the object up with their own hands, and returned to training as two grasp points. The person contributes only where to grasp; the robot chooses its own approach. In simulation, RL raises success on unseen objects from 55% with Contact-GraspNet to 83%. Adding 58 human demonstrations nearly doubles success on the hard cases RL kept failing, from 24% to 45%, and recovers performance that RL alone loses on similar cases that were never demonstrated, without reducing success on unseen objects.', 'score': 5, 'issue_id': 3542, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '68c1bb4b0da56f40', 'authors': ['Achyuthan Unni Krishnan', 'Karthik Rengarajan', 'Bharath Narasimhan', 'Chris von Csefalvay'], 'affiliations': ['Ebb Robotics', 'Imperial College London', 'Robotics Institute, Carnegie Mellon University', 'Stanford University', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2611.18919.jpg', 'data': {'categories': ['#rlhf', '#robotics', '#rl', '#data', '#optimization', '#games'], 'emoji': '🤖', 'ru': {'title': 'Человек показывает, где хватать, а робот сам решает, как', 'desc': 'Статья описывает конвейер обучения захвата объектов роботом, где политика обучается с подкреплением (RL) напрямую на облаке точек от глубинного сенсора, без 3D-модели и без метки категории. Систематически находятся захваты, которые RL-политика постоянно не может выполнить, и отправляются в VR-приложение, где человек указывает две точки захвата своими руками. Эти демонстрации возвращаются в обучение, а сам подход к захвату выбирает робот. В симуляции RL поднимает успешность на невиданных объектах с 55% (Contact-GraspNet) до 83%, а добавление 58 человеческих демонстраций почти удваивает успех на сложных случаях — с 24% до 45%, не ухудшая обобщение.'}, 'en': {'title': 'Turn Repeated Grasp Failures into Human-Guided Learning', 'desc': 'This paper presents a human-in-the-loop method for improving a reinforcement-learning (RL) robot grasping policy that uses depth-camera point clouds. The system finds grasps the policy repeatedly fails, then asks a person in virtual reality to provide two grasp points; the robot still plans its own approach. In simulation, RL improves success on unseen objects from 55% to 83% compared with Contact-GraspNet, while 58 human demonstrations raise success on hard cases from 24% to 45%. The demonstrations also help with similar cases that were not shown to people, without lowering performance on unseen objects.'}, 'zh': {'title': '让人示范失败难例，让机器人学会更可靠地抓取', 'desc': '这篇论文提出一种人在环的失败挖掘流程，用来改进基于点云的强化学习抓取策略。系统会自动找出策略反复失败的抓取情形，再让人通过虚拟现实示范应当抓取物体的两个位置；机器人仍自行决定如何接近物体。仿真结果显示，强化学习将未见物体上的抓取成功率从 Contact-GraspNet 的 55% 提高到 83%；加入 58 个人类示范后，难例成功率从 24% 提高到 45%。这些示范还能帮助策略应对相似但未示范的难例，同时不降低对未见物体的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2611.13685', 'title': 'Ego Guidance: Enhancing Robot Policy Learning with Action-Free Human Egocentric Videos', 'url': 'https://huggingface.co/papers/2611.13685', 'abstract': 'Abstract A mixture-of-transformers architecture jointly predicts future visual states and actions, leveraging pretrained vision-language representations and egocentric videos to improve robot policy learning without action supervision.  Generated by deepseek-ai/DeepSeek-V4.1-Flash In this paper, we investigate how human egocentric videos can benefit robot policy learning without action supervision. Building on a pretrained VLM, we propose Shared Prediction on Action and Representation (SPAR), an MoT architecture in which future visual state prediction can provide independent and complementary learning signals alongside action prediction. We find that representations learned from egocentric videos improve downstream performance on out-of-distribution robot tasks, with further gains as video data scales. We also study the effects of objective choices and data curation, providing insights into how to leverage action-free videos for scalable robot learning.', 'score': 5, 'issue_id': 3542, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': '1e4553bc400e6901', 'authors': ['Lin Long', 'Tianren Ma', 'Zhong Chu', 'Di Wu', 'Maosong Cao', 'Qixiang Ye', 'Junbo Zhao', 'Shanghang Zhang'], 'affiliations': ['Ant Group', 'Nanyang Technology University', 'Peking University', 'University of Chinese Academy of Sciences', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.13685.jpg', 'data': {'categories': ['#architecture', '#synthetic', '#training', '#robotics', '#multimodal', '#data', '#transfer_learning', '#video'], 'emoji': '🤖', 'ru': {'title': 'Учимся у людей по видео без разметки действий', 'desc': 'Авторы предлагают архитектуру Shared Prediction on Action and Representation (SPAR) типа Mixture-of-Transformers, построенную на предобученной Vision-Language Model (VLM). Модель совместно обучается предсказывать будущие визуальные состояния и действия робота, при этом предсказание будущих состояний даёт дополнительный независимый и комплементарный сигнал для обучения. Эксперименты показывают, что представления, полученные из эгоцентричных видео людей без разметки действий, улучшают качество policy learning на out-of-distribution задачах робота, причём с ростом объёма видеоданных прирост качества продолжает расти. Также исследуется влияние выбора целевых функций и курирования данных, что дает рекомендации по использованию видео без действий для масштабируемого обучения роботов.'}, 'en': {'title': 'Teach Robots from Videos, Even Without Action Labels', 'desc': 'The paper introduces Shared Prediction on Action and Representation (SPAR), a mixture-of-transformers architecture built on a pretrained vision-language model. It learns robot policies using both action prediction and prediction of future visual states, so egocentric videos can help even when they have no action labels. The learned representations improve performance on robot tasks that differ from the training tasks, and performance improves further with more video data. The paper also examines how learning objectives and data curation affect this approach to scalable robot learning.'}, 'zh': {'title': '让无动作标注的视频助力机器人学会行动', 'desc': '本文研究如何利用人类第一人称视频，在没有动作标注的情况下提升机器人策略学习。作者提出 SPAR，一种基于预训练视觉语言模型的混合 Transformer 架构，同时预测未来视觉状态和动作。未来状态预测提供了独立且互补的学习信号，帮助模型从无动作标注的视频中学习有用表征。实验显示，这些表征能提升机器人在分布外任务上的表现，而且随着视频数据增多，效果进一步改善。'}}}, {'id': 'https://huggingface.co/papers/2611.18330', 'title': 'Marimba: A System One Model for Speech', 'url': 'https://huggingface.co/papers/2611.18330', 'abstract': "Abstract Marimba uses frozen Qwen3-ASR features and lightweight readouts to make lexical, turn-end, language, speaker-change, and personal-information decisions from speech, achieving strong detection and calibration on conversational and read-speech benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Speech applications require decisions about term presence, turn completion, and language within an audio window. We present Marimba, an interface for typed speech decisions built on frozen Qwen3-ASR 0.6B features. Lexical questions use zero-shot scoring of ASR transcripts; non-lexical questions use a question-conditioned head and a separate layer-18 turn-end readout. Language identification uses the ASR model's own language scores. On private conversational test sets, decoder AUROC is 0.80-0.92; on public read speech it is 0.92-0.97. Speech Commands four-way accuracy is 0.93; binary lexical ECE is at most 0.08. Personal-information detection, which passes the greedy transcript to a private, curated PII pipeline, reaches item-level F1 0.904 on synthetic Brazilian Portuguese speech (1.000 on reference transcripts). Layer-12 speaker readouts detect speaker change with AUROC 0.966-0.980 on AMI and VoxConverse, above an ECAPA baseline, and count speakers (0, 1, 2, or 3+) more accurately than pyannote 3.1. The turn-end readout reaches AUROC 0.930 versus Smart Turn v3.2 at 0.982 on Smart Turn's own test set. On a subset of ICSI meetings labeled by next speaker, AUROC is 0.716 versus 0.712; the paired confidence interval includes zero.", 'score': 4, 'issue_id': 3543, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября',
