    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.06107', 'title': 'DataFlex-RL: An Evaluation Platform for RLVR Data Policies', 'url': 'https://huggingface.co/papers/2609.06107', 'abstract': 'Abstract DataFlex-RL evaluates reinforcement learning data policies and finds that uniform sampling matches or exceeds adaptive rollout selection, reweighting, and domain mixing across math, logic, and science benchmarks.  Generated by thinkingmachines/Inkling-Small Data policies for reinforcement learning with verifiable rewards (RLVR) determine which rollouts are used, how strongly they are weighted, and which domains contribute to subsequent training batches. We introduce DataFlex-RL, an evaluation platform for comparing these choices under a common GRPO recipe. Our primary experiment evaluates 13 configurations across 12 matched seeds using Qwen2.5-7B-Base and 12 mathematics, logic, and science benchmarks. Uniform GRPO improves the domain-balanced average accuracy by 7.76 percentage points over the untrained checkpoint. None of the eight rollout-selection or reweighting methods achieves a paired 95% confidence interval that excludes zero relative to uniform sampling, and none of the three adaptive mixtures outperforms a fixed equal mixture at the same level of precision. A corrected 12-seed extension on Llama-3.1-8B-Base places the additional methods on the same score scale as the original controls, but does not reveal a consistent winner in terms of observed mean performance. We also quantify evaluation sensitivity by rescoring nine Qwen2.5-7B-Instruct runs using a math-heavy six-benchmark summary, consisting of five mathematics benchmarks and GPQA-Diamond but no logic benchmark, and comparing it with the domain-balanced 12-benchmark summary. The resulting rankings are negatively correlated, with a correlation coefficient of -0.33, whereas summaries that retain all 12 benchmarks largely agree. Across the controlled settings studied here, changing the data policy measurably changes the training process but does not produce a reproducible improvement over uniform training.', 'score': 90, 'issue_id': 3272, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '04936d1022a006d3', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#benchmark', '#reasoning', '#science', '#training', '#data', '#rl'], 'emoji': '📊', 'ru': {'title': 'Простота побеждает: равномерное семплирование оптимально для обучения с подкреплением', 'desc': 'В этой работе исследуется влияние различных политик выбора данных в reinforcement learning с проверяемыми вознаграждениями (RLVR) на обучение языковых моделей. Авторы разработали платформу DataFlex-RL для сравнения методов отбора rollout, переweighting и адаптивного смешивания доменов под единым рецептом GRPO. Результаты показывают, что равномерное семплирование данных сопоставимо или превосходит восемь методов адаптивного отбора и три адаптивные смеси доменов на бенчмарках математики, логики и науки. Исследование демонстрирует чувствительность оценок к выбору бенчмарков и подчеркивает, что изменение политики данных не гарантирует воспроизводимое улучшение по сравнению с базовым равномерным обучением.'}, 'en': {'title': 'Uniform Sampling: The Unsung Hero of Reinforcement Learning', 'desc': 'The paper introduces DataFlex-RL, a platform designed to evaluate different data policies in reinforcement learning (RL) by comparing their effectiveness in training models across various benchmarks. It finds that uniform sampling of data outperforms or matches more complex methods like adaptive rollout selection and domain mixing in terms of accuracy. The study shows that while different configurations can affect the training process, they do not consistently lead to better performance than uniform sampling. Additionally, the paper highlights the importance of evaluation sensitivity, revealing that different benchmark summaries can lead to varying performance rankings.'}, 'zh': {'title': '均匀采样：强化学习的新标准', 'desc': '本文介绍了DataFlex-RL，这是一个用于评估强化学习数据策略的平台。研究发现，均匀采样在数学、逻辑和科学基准测试中，表现与自适应回放选择、重加权和领域混合相当或更好。通过对13种配置进行实验，均匀GRPO在领域平衡的平均准确率上提高了7.76个百分点。尽管不同的回放选择和重加权方法被测试，但没有一种方法在95%的置信区间内优于均匀采样。'}}}, {'id': 'https://huggingface.co/papers/2609.08418', 'title': 'Feyospace-v1: How the Cyber Mercury Seven Trained Frontier Cyber Models', 'url': 'https://huggingface.co/papers/2609.08418', 'abstract': 'Abstract A data-centric framework with specialized systems for reasoning analysis, cost reduction, and execution verification enables small teams to train open-weight cyber agents that achieve top-tier performance on benchmark suites.  Generated by thinkingmachines/Inkling-Small Training capable cyber agents is often treated primarily as a problem of model scale, yet open-weight post-training is constrained more directly by the cost of executable environments, reliable multi-turn supervision, and access to strong teachers. We present a data-centric framework that addresses these bottlenecks through five complementary systems: Choulea analyzes hidden reasoning signatures, SkyReal reduces teacher-sampling cost, Hongzwang bypasses API restrictions on teacher execution, PSBreakup restores capabilities weakened by model merging, and Kreator converts expert interventions into trainable reasoning. Our data engine constructs resettable coding, vulnerability, CTF, kernel-history, full-exploit, firmware, and device-backed environments. Candidate trajectories are retained only after execution verification and evidence auditing, yielding 164,269 trajectories for long-context supervised fine-tuning. The three checkpoints improve over their starting models by an average of 23.76% on the full CyberGym suite and 10.49% across the pooled CTF suites. As of September 1, 2026, Feyospace-s1 achieves a verified success rate of 63.24% and ranks 10th on the official CyberGym leaderboard, while all three checkpoints rank 1st among models at comparable parameter scales. To our knowledge, this is the first end-to-end demonstration that a seven-person independent team can train open-weight models with leading agentic cyber capability.', 'score': 74, 'issue_id': 3271, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '8a656bb3f1afc63f', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#synthetic', '#benchmark', '#optimization', '#dataset', '#long_context', '#data', '#training', '#open_source', '#agents', '#reasoning', '#small_models'], 'emoji': '🛡️', 'ru': {'title': 'Качество данных важнее масштаба: как малая команда создала top-tier киберагента', 'desc': 'В работе представлена data-centric методология для обучения открытых киберагентов, которая вместо масштабирования модели фокусируется на качестве данных и эффективности обучения. Авторы разработали пять специализированных систем для анализа рассуждений, снижения стоимости обучения, обхода ограничений API и восстановления возможностей моделей, а также конвертации экспертных вмешательств в обучаемые стратегии. Система включает резетируемые окружения для кодирования, поиска уязвимостей и CTF-задач, с проверкой каждой траектории выполнения перед включением в fine-tuning датасет. Результаты показывают, что небольшая команда смогла натренировать киберагент, достигший лучших показателей на бенчмарках и заняв 10-е место в официальном рейтинге CyberGym.'}, 'en': {'title': 'Empowering Small Teams to Train Top Cyber Agents Efficiently', 'desc': 'This paper introduces a data-centric framework designed to enhance the training of open-weight cyber agents, focusing on improving performance while minimizing costs. It identifies key challenges such as the need for reliable supervision and effective execution environments, and proposes five specialized systems to address these issues. The framework allows for the analysis of reasoning patterns, reduces the costs associated with teacher sampling, and ensures that only verified execution paths are retained for training. The results show significant performance improvements on benchmark suites, demonstrating that small teams can achieve top-tier results in cyber agent training.'}, 'zh': {'title': '数据驱动，提升网络代理训练效率', 'desc': '这篇论文提出了一种以数据为中心的框架，旨在解决训练开放权重网络代理时的瓶颈问题。通过五个互补系统，该框架能够分析推理签名、降低教师采样成本、绕过API限制等，从而提高训练效率。研究表明，经过验证的执行轨迹可以显著提升模型在网络安全基准测试中的表现。最终，七人团队成功训练出具有领先能力的开放权重模型，展示了小团队在这一领域的潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.12641', 'title': 'Breaking the Vision-Action Shortcut: Latent Interface Training for Generalizable Robotics Foundation Models', 'url': 'https://huggingface.co/papers/2609.12641', 'abstract': "Abstract LIT improves robot action generalization by first training pose-conditioned action priors without images, then constraining visual inputs through a pose-supervised latent interface that preserves spatial goal information.  Generated by thinkingmachines/Inkling-Small Robot foundation models achieve strong in-distribution performance but often degrade under visual distribution shifts. When learning to generate actions from pretrained visual representations, models may exploit task-irrelevant visual cues that correlate with demonstrated actions within the training distribution. Such vision-action shortcuts can undermine generalization when these correlations change under distribution shifts. Mitigating these shortcuts requires constraining how visual information is used for action generation while preserving task-relevant spatial information. We propose Latent Interface Training (LIT), a framework-agnostic two-stage strategy that first establishes a spatial-goal-conditioned action prior without images, then constrains visual conditioning through a pose-supervised latent interface. Stage 1 trains the action expert to generate action chunks conditioned on language, robot state, and each demonstrated chunk's terminal SE(3) end-effector pose, learning goal-directed action generation independently of visual cues. Stage 2 introduces a latent interface that aggregates visual and semantic representations and serves as the pretrained action expert's only visual conditioning pathway. The interface is supervised to reconstruct the terminal pose previously used to condition Stage 1, encouraging it to retain the goal-relevant spatial information needed for action generation. Across four vision-language-action and world-action architectures (Pi0.5, MolmoAct2, FAST-WAM, and ImageWAM), LIT improves overall LIBERO-Plus success by 3.87-10.70 percentage points while preserving or improving average LIBERO success. Real-world evaluations show 13.30-16.70 percentage-point gains in success aggregated across three tasks under unseen camera configurations, lighting variations, and distractors.", 'score': 61, 'issue_id': 3270, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '85eb882a70551289', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#architecture', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Разделённое обучение: контроль визуальных входов через пространственные ограничения для обобщения действий робота', 'desc': 'В работе предлагается метод LIT для улучшения обобщения действий робота на новые визуальные распределения данных. Подход состоит из двух этапов: сначала обучается приоритет действий, обусловленный позой конечного эффектора, без использования изображений, а затем визуальные входы ограничиваются через интерфейс, контролируемый позой. Такая архитектура предотвращает использование модельными визуальных артефактов, не релевантных задаче, и сохраняет пространственную информацию о целевых позициях. Метод показывает значительные улучшения на тестовых наборах LIBERO-Plus и в реальных экспериментах с робот-манипуляторами при столкновении с новыми ракурсами камер и условиями освещения.'}, 'en': {'title': 'Enhancing Robot Action Generalization with LIT', 'desc': "The paper presents Latent Interface Training (LIT), a method that enhances the ability of robots to generalize actions across different visual conditions. It does this by first training action priors based on pose information without relying on images, which helps avoid learning irrelevant visual cues. In the second stage, a latent interface is introduced to combine visual and semantic data while ensuring that the robot retains important spatial information for action generation. The results show significant improvements in action success rates across various tasks and conditions, demonstrating LIT's effectiveness in real-world scenarios."}, 'zh': {'title': '提升机器人动作泛化能力的潜在接口训练', 'desc': 'LIT（潜在接口训练）通过两个阶段的策略来提高机器人动作的泛化能力。第一阶段在没有图像的情况下训练与姿态相关的动作先验，第二阶段通过姿态监督的潜在接口来约束视觉输入，从而保留空间目标信息。该方法有效减少了视觉-动作的捷径，确保机器人在不同视觉条件下仍能生成有效的动作。实验结果表明，LIT在多个任务中显著提高了成功率，尤其是在未见过的环境中。'}}}, {'id': 'https://huggingface.co/papers/2609.11115', 'title': 'Benchmark Radar: A Living Database and Search Engine for AI Benchmarks and Evaluation', 'url': 'https://huggingface.co/papers/2609.11115', 'abstract': 'Abstract Benchmark Radar is a searchable living database and discovery engine for AI evaluation benchmarks that aggregates sources, score histories, and evidence to support benchmark selection and comparison.  Generated by thinkingmachines/Inkling-Small Benchmark researchers and developers of large language models (LLMs) and other AI systems need to find relevant evaluations, locate their benchmark datasets and code, and understand the settings behind reported scores. We present Benchmark Radar, a living database and search engine for retrieval and discovery of AI benchmarks, covering LLM evaluation, agentic and tool-use benchmarks, coding, reasoning, safety, and domain-specific evaluations. The system combines daily discovery of benchmark papers, repositories, datasets, and releases with a searchable benchmark catalog, mentions in model cards and technical reports, and score histories. It retains source identities and citations so readers can inspect candidate benchmarks and their evaluation evidence. Daily discovery draws on 37 sources: 13 direct connectors and 24 first-party research and engineering feeds. The catalog contains 1,283 source records drawn from 4 benchmark catalogs and 12,916 numeric observations on 790 records. We describe collection and retrieval, audit the full catalog, and examine benchmark saturation, adoption trends, and the limits of score comparisons. A worked example walks through a complete prior-art search, showing how to query the catalog and inspect benchmark evidence when designing a new evaluation. We release the web dashboard with a benchmark leaderboard, a Pareto frontier view of score against measured use, saturation and trend views, daily feeds, downloadable evidence, a command-line interface (CLI) for offline queries, and reproducible analysis.', 'score': 55, 'issue_id': 3271, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '56b05f4c99a4281c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#benchmark', '#survey', '#dataset'], 'emoji': '🎯', 'ru': {'title': 'Единая система для поиска и сравнения бенчмарков в оценке AI моделей', 'desc': 'Benchmark Radar — это живая база данных и поисковая система для обнаружения и сравнения бенчмарков оценки AI систем. Система агрегирует информацию из 37 источников, включая исследовательские статьи, репозитории и карточки моделей, содержащую более 12,900 числовых наблюдений о 790 бенчмарках. Платформа позволяет разработчикам LLM и других AI систем находить релевантные оценки, локализовать наборы данных, понимать параметры экспериментов и анализировать историю результатов. Инструмент предоставляет веб-интерфейс с анализом насыщенности бенчмарков, трендами принятия, представлением границ Парето и CLI для автоматизированных запросов.'}, 'en': {'title': 'Discover and Compare AI Benchmarks Effortlessly!', 'desc': 'Benchmark Radar is a comprehensive database designed to help researchers and developers in the AI field find and compare evaluation benchmarks for large language models and other AI systems. It aggregates various sources, including benchmark datasets and code, while providing insights into the settings behind reported scores. The platform features a searchable catalog that includes daily updates from multiple sources, allowing users to access a wealth of benchmark information and evidence. Additionally, it offers tools for analyzing benchmark trends and comparisons, making it easier for users to design effective evaluations.'}, 'zh': {'title': 'AI评估基准的智能搜索引擎', 'desc': 'Benchmark Radar 是一个可搜索的数据库和发现引擎，专门用于人工智能评估基准的聚合和比较。它帮助研究人员和开发者找到相关的评估、基准数据集和代码，并理解报告分数背后的设置。该系统每天更新基准论文、数据集和发布内容，并提供可搜索的基准目录，保留来源身份和引用，方便读者检查候选基准及其评估证据。我们还提供了一个网络仪表板，包含基准排行榜、分数与使用情况的视图、趋势分析等功能。'}}}, {'id': 'https://huggingface.co/papers/2609.13141', 'title': 'SAS: Simple Attention Sparsification via End-to-End Optimization of Context Ranking', 'url': 'https://huggingface.co/papers/2609.13141', 'abstract': "Abstract SAS improves sparse attention by training a selector end-to-end with language modeling loss via continuous gating inside attention softmax, yielding better context ranking under tight budgets.  Generated by thinkingmachines/Inkling-Small Post-training attention sparsification reduces the quadratic cumulative attention cost of pretrained Transformers by selecting a small set of context units (tokens or blocks) for each query. Existing trainable methods usually use a lightweight selector to score context units, followed by hard Top-K selection that blocks gradients from the language modeling loss. Consequently, these methods commonly distill layer-wise dense attention distributions. Although this encourages the selector to rank context units by dense attention weights in the original model, the ranking is not directly aligned with their impact on predictions under a fixed attention budget (i.e., the number of attended context units per query), potentially wasting the limited budget on less useful units. To address this misalignment, we propose Simple Attention Sparsification (SAS), a gated sparse attention mechanism that optimizes context ranking end-to-end with the language modeling loss. The key idea is to inject the selector's continuous scores into attention logits during training, allowing the loss to update the selector through standard backpropagation. We identify several choices crucial for this simple design to work well in practice: placing the gate inside the attention softmax in log form, using normalized softmax gates to calibrate historical context against the always-retained current block, and preserving continuous selector scores so the model learns relative priorities rather than only hard selections. To support long-sequence training, we implement a memory-efficient Triton kernel that integrates SAS into FlashAttention-style computation. Across reasoning, long-context understanding, and agentic tasks, SAS consistently outperforms trainable sparse attention baselines across attention budgets, with especially large gains under tight budgets, demonstrating more effective context ranking for downstream tasks.", 'score': 48, 'issue_id': 3270, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': 'c6e96fad71ecce6d', 'authors': ['Zhiwei Li', 'Lei Zhu', 'Hao Gu', 'Xiang Hu', 'Yan Wang', 'Haitao Mi', 'Sirui Han', 'Leo Liang', 'Zhijiang Guo'], 'affiliations': ['Hong Kong University of Science and Technology', 'Hong Kong University of Science and Technology (Guangzhou)', 'Tencent HY LLM Frontier'], 'pdf_title_img': 'assets/pdf/title_img/2609.13141.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Прямая оптимизация выбора контекста через дифференцируемые оценки внимания', 'desc': 'В работе предложен метод Simple Attention Sparsification (SAS) для оптимизации разреженного внимания в Трансформерах через обучение селектора контекста непосредственно с целевой функцией языкового моделирования. Ключевое отличие от существующих методов состоит в использовании непрерывных оценок селектора внутри операции softmax внимания, что позволяет градиентам потерь влиять на ранжирование контекстных единиц. Авторы демонстрируют, что правильное размещение гейта внутри softmax в логарифмической форме и нормализация оценок приводит к более эффективному использованию бюджета внимания для выбора релевантных токенов. Метод показывает значительные улучшения на задачах рассуждения, понимания длинных последовательностей и в агентных системах, особенно при жестких ограничениях на количество посещаемых контекстных единиц.'}, 'en': {'title': 'Optimizing Sparse Attention for Better Context Ranking', 'desc': 'The paper introduces Simple Attention Sparsification (SAS), a method that enhances sparse attention in Transformers by training a selector using language modeling loss. Unlike traditional methods that use hard Top-K selection, SAS employs continuous gating within the attention softmax, allowing for better context ranking while adhering to fixed attention budgets. This approach ensures that the selector is optimized end-to-end, aligning context unit rankings with their actual impact on predictions. The results show that SAS outperforms existing sparse attention techniques, particularly in scenarios with limited attention resources, leading to improved performance in various tasks.'}, 'zh': {'title': '简单注意力稀疏化：优化上下文选择的有效方法', 'desc': '本文提出了一种简单的注意力稀疏化方法（SAS），通过在语言建模损失下端到端训练选择器，来改善稀疏注意力。SAS在注意力softmax中引入了连续的选择器评分，从而优化上下文单位的排名，避免了传统方法中梯度阻断的问题。该方法能够在固定的注意力预算下，更有效地选择对预测有影响的上下文单位。实验结果表明，SAS在推理、长上下文理解和智能任务中，均优于现有的可训练稀疏注意力基线，尤其在预算紧张的情况下表现更为突出。'}}}, {'id': 'https://huggingface.co/papers/2609.11682', 'title': 'COBRA-Skills: Contextual Bandit-Guided Evolution for Agent Skill Optimization', 'url': 'https://huggingface.co/papers/2609.11682', 'abstract': 'Abstract COBRA-Skills improves LLM agent skill optimization by using contextual-bandit prioritization and evidence-based evolution to cut evaluation costs while maintaining high performance.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents can benefit from reusable skills distilled from prior task experience, yet existing skill optimization methods often rely on costly execution-based evaluation and substantial task data. We introduce COBRA-Skills, an efficient framework that formulates skill optimization as budgeted sequential optimization over a dynamically evolving candidate space. COBRA-Skills couples contextual-bandit-guided prioritization with evidence-grounded skill evolution, selectively allocating evaluations to promising or informative candidates while continually refining the skill population from execution feedback. Across six heterogeneous agent benchmarks and three target models, COBRA-Skills consistently achieves the strongest average performance among compared methods, while reducing optimization cost by 55--58\\% relative to SkillOpt and using only 50 unique optimization examples per benchmark. Further analyses show that COBRA-Skills remains robust to changes in the agent harness and performs effectively when the target model itself is used for skill generation and refinement.', 'score': 28, 'issue_id': 3270, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'dd7d09e98fd25f64', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Умная оптимизация навыков агентов: экономия вычислений через контекстный бандит', 'desc': 'В статье представлен COBRA-Skills — эффективный фреймворк для оптимизации навыков LLM-агентов, который использует контекстный многорукий бандит для приоритизации кандидатов и эволюционный процесс, основанный на доказательствах. Метод формулирует задачу как последовательную оптимизацию с ограниченным бюджетом вычислений над динамически изменяющимся пространством кандидатов. COBRA-Skills значительно снижает стоимость оценки на 55-58% по сравнению с существующими подходами, при этом используя всего 50 примеров оптимизации на каждом бенчмарке. Экспериментальные результаты на шести разнородных бенчмарках демонстрируют, что предложенный метод достигает лучшей производительности и остаётся устойчивым к изменениям архитектуры агента.'}, 'en': {'title': 'Efficient Skill Optimization for LLM Agents with COBRA-Skills', 'desc': 'COBRA-Skills is a new framework designed to enhance the optimization of skills in large language model (LLM) agents. It uses a method called contextual-bandit prioritization to focus on the most promising skills, which helps reduce the costs associated with evaluating these skills. By continuously refining skills based on execution feedback, COBRA-Skills can adapt and improve over time. The framework has shown to significantly lower optimization costs while maintaining high performance across various benchmarks.'}, 'zh': {'title': 'COBRA-Skills：高效的技能优化新方法', 'desc': 'COBRA-Skills 是一种改进大语言模型（LLM）代理技能优化的方法。它通过上下文赌博优先级和基于证据的演化来降低评估成本，同时保持高性能。该框架将技能优化视为预算序列优化，动态调整候选空间。实验表明，COBRA-Skills 在多个基准测试中表现优异，优化成本降低了55%到58%。'}}}, {'id': 'https://huggingface.co/papers/2609.12945', 'title': 'StepAudio 3 Gen Technical Report', 'url': 'https://huggingface.co/papers/2609.12945', 'abstract': 'Abstract StepAudio 3 Gen is a discrete autoregressive audio generation model using residual vector quantization tokens to unify text-to-speech, voice design, sound effects, and music within a single framework.  Generated by thinkingmachines/Inkling-Small We introduce StepAudio 3 Gen, a general-purpose audio generation model that supports zero-shot text-to-speech (TTS), voice design, vocal generation, sound effects, music, vibe speech, and mixtures of multiple audio types within a unified framework. At its core, StepAudio 3 Gen is a discrete autoregressive generator that models audio directly over residual vector quantization (RVQ) tokens, departing from the diffusion Transformer-based continuous generation paradigm prevalent in recent general audio models. Its StepAudio Tokenizer represents general audio at 12.5 Hz in a shared 16 times 2048 residual code space, jointly quantizing semantic and waveform-level acoustic features so that each code layer preserves both types of information. For generation, the backbone predicts the first codebook along the time axis using autoregressive modeling, while a lightweight causal Transformer completes the remaining fifteen codebooks along the codebook axis. Our study further identifies three key design principles: (1) interference-aware progressive pretraining for acquiring audio capabilities while preserving the textual abilities of the large language model, (2) RVQ Adaptor for effectively incorporating multi-codebook acoustic representations, and (3) discrete autoregressive modeling over a shared representation across general audio domains. With progressive pretraining, multi-task instruction training, and supervised fine-tuning, StepAudio 3 Gen achieves state-of-the-art performance on both TTS and voice design, while retaining strong generation capabilities across speech, vocals, sound effects, and music. Audio samples are available at https://stepaudiollm.github.io/step-audio-3-gen/.', 'score': 27, 'issue_id': 3271, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': 'da2dd0ebfcdc8a7c', 'pdf_title_img': 'assets/pdf/title_img/2609.12945.jpg', 'data': {'categories': ['#multimodal', '#open_source', '#training', '#audio', '#architecture'], 'emoji': '🎵', 'ru': {'title': 'Единая авторегрессивная модель для всех типов звука', 'desc': 'Представлена StepAudio 3 Gen — универсальная модель для генерации аудио, которая использует дискретное авторегрессивное моделирование на основе остаточного векторного квантования (RVQ) для единой обработки синтеза речи, дизайна голоса, звуковых эффектов и музыки. Модель кодирует аудио в виде дискретных токенов RVQ с разрешением 12.5 Hz, объединяя семантические и волновые акустические признаки в общем пространстве представлений. Архитектура использует авторегрессивный трансформер для предсказания первого кодбука по временной оси и легковесный причинный трансформер для заполнения оставшихся пятнадцати кодбуков. Ключевые инновации включают помехоустойчивое прогрессивное предобучение для сохранения текстовых способностей LLM, RVQ адаптер для интеграции мультикодбуковых представлений и дискретное авторегрессивное моделирование в общем пространстве признаков для всех типов аудио.'}, 'en': {'title': 'Unifying Audio Generation with StepAudio 3 Gen', 'desc': "StepAudio 3 Gen is an advanced audio generation model that integrates various audio tasks like text-to-speech, voice design, and music generation into one system. It uses a discrete autoregressive approach with residual vector quantization tokens to effectively model audio data. The model's unique StepAudio Tokenizer captures both semantic and waveform features, allowing for high-quality audio generation. With innovative training techniques, it achieves top performance in generating diverse audio types while maintaining the ability to understand and produce text-based audio."}, 'zh': {'title': '统一音频生成的全能模型', 'desc': 'StepAudio 3 Gen 是一种离散自回归音频生成模型，使用残差向量量化（RVQ）令牌，将文本到语音、声音设计、音效和音乐统一在一个框架内。该模型支持零-shot 文本到语音（TTS）和多种音频类型的生成，采用了新的生成方法，区别于传统的扩散 Transformer 模型。其核心是通过 RVQ 令牌直接建模音频，使用 StepAudio Tokenizer 在共享的残差编码空间中量化语义和波形特征。通过逐步预训练和多任务训练，StepAudio 3 Gen 在 TTS 和声音设计上达到了最先进的性能，同时在语音、声乐、音效和音乐生成方面也表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.30597', 'title': 'PLC-DPO: Posterior Label Correction in Noisy and Ambiguous Preference Optimization', 'url': 'https://huggingface.co/papers/2608.30597', 'abstract': "Abstract Posterior Label Correction DPO improves preference optimization by routing noisy pairwise labels into clean, flipped, or tied cases using calibrated policy-reference margins.  Generated by thinkingmachines/Inkling-Small Direct Preference Optimization (DPO) simplifies alignment through pairwise comparisons but assumes all observed preferences are reliable. Real data often violates this assumption, leading to reversed, weak, or ambiguous labels that cause harmful policy updates. To address this, we propose Posterior Label Correction DPO (PLC-DPO) to robustly optimize preferences by routing each pair's training signal as a clean, flip, or tie case. The key idea is to use the calibrated policy-reference margin as online evidence to take appropriate correction actions. This reframes noisy preference learning as actively correcting supervision direction and strength rather than merely filtering suspicious examples. Across 57 dataset-model-benchmark cells, PLC-DPO obtains the best mean win rate against DPO (60.5 vs. 55.5 for the next-best method). Injected-noise and tie stress tests, human disagreement analysis, and self-confirmation diagnostics further show that the routing remains stable and distinguishes flipped from weakly directional pairs.", 'score': 23, 'issue_id': 3270, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '19ed22f2a621efb4', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rlhf', '#training'], 'emoji': '🎯', 'ru': {'title': 'Исправление шумных предпочтений через активную маршрутизацию меток', 'desc': 'Статья предлагает Posterior Label Correction DPO — улучшенный метод оптимизации предпочтений, который обрабатывает зашумлённые парные метки путём их маршрутизации в три категории: чистые, перевёрнутые и неоднозначные случаи. Метод использует откалиброванный margin между политикой и референсной моделью как онлайн-сигнал для принятия решений о коррекции. Вместо фильтрации подозрительных примеров, PLC-DPO активно корректирует направление и силу обучающих сигналов, что делает обучение более устойчивым к шуму в данных. Экспериментальные результаты показывают превосходство метода над базовым DPO на 57 различных комбинациях датасетов, моделей и бенчмарков.'}, 'en': {'title': 'Robust Preference Learning with Posterior Label Correction', 'desc': 'The paper introduces Posterior Label Correction DPO (PLC-DPO), a method that enhances preference optimization in machine learning by addressing the issue of noisy pairwise labels. Traditional Direct Preference Optimization (DPO) assumes that all observed preferences are accurate, which is often not the case in real-world data. PLC-DPO improves this by categorizing training signals into clean, flipped, or tied cases based on calibrated policy-reference margins, allowing for more robust learning. The results demonstrate that PLC-DPO outperforms standard DPO across various datasets, effectively correcting supervision direction and strength in the presence of label noise.'}, 'zh': {'title': '后验标签修正，提升偏好优化的鲁棒性', 'desc': '本文提出了一种名为后验标签修正直接偏好优化（PLC-DPO）的方法，旨在提高偏好优化的鲁棒性。传统的直接偏好优化（DPO）假设所有观察到的偏好都是可靠的，但实际数据常常存在噪声，导致标签反转或模糊。PLC-DPO通过将每对训练信号分类为干净、翻转或平局案例，来有效地优化偏好。该方法利用校准的策略参考边际作为在线证据，主动纠正监督方向和强度，从而改善学习效果。'}}}, {'id': 'https://huggingface.co/papers/2609.13146', 'title': 'SNAP3D: Physically Grounded 3D Parts for Assembly from a Single Image', 'url': 'https://huggingface.co/papers/2609.13146', 'abstract': 'Abstract A physics-guided framework improves part-aware 3D generation by resolving inter-part penetration, recovering contact graphs, and refining parameterized connectors via simulation feedback to ensure stable, physically valid assemblies.  Generated by thinkingmachines/Inkling-Small Part-aware 3D asset generation enables applications such as editing, articulation, simulation, and fabrication, yet existing methods can generate visually complete individual parts without ensuring that they form a valid physical assembly. Consequently, generated neighboring parts may interpenetrate, lack valid connections, or collapse under gravity. We propose a physics-guided framework for improving single-image part-aware 3D generation with physically compatible geometry and stable connections. Our method resolves inter-part penetration, recovers a contact graph between neighboring parts, and introduces parameterized connectors at their contact surfaces. Using feedback from physical simulation, we refine connector placement, orientation, and dimensions to improve assembly stability while preserving the generated geometry. We further introduce a physics-based evaluation protocol that complements conventional geometric metrics by directly testing assembly validity and stability under gravity. Experiments comparing against multiple part-aware 3D generators show substantial improvements in physical realizability and stability while maintaining geometric quality. We additionally validate the resulting parts through 3D printing and real-world assembly.', 'score': 3, 'issue_id': 3270, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '05e3651d1f2b7d59', 'pdf_title_img': 'assets/pdf/title_img/2609.13146.jpg', 'data': {'categories': [], 'emoji': '🔧', 'ru': {'title': 'Физически обоснованная генерация сборных 3D-объектов со стабильными соединениями', 'desc': 'Статья предлагает структуру, управляемую физикой, для улучшения генерации 3D-объектов из отдельных частей. Метод решает проблему взаимного проникновения деталей, восстанавливает граф контактов между соседними частями и вводит параметризованные соединители на поверхностях контакта. Используя обратную связь от физической симуляции, алгоритм уточняет размещение, ориентацию и размеры соединителей для повышения стабильности сборки. Авторы также предлагают новый протокол оценки на основе физики, который проверяет валидность и стабильность сборки под воздействием гравитации.'}, 'en': {'title': 'Building Better 3D Parts with Physics!', 'desc': 'This paper presents a new method for generating 3D models of parts that fit together correctly, addressing common issues like parts overlapping or not connecting properly. The authors introduce a physics-guided framework that uses simulations to ensure that the generated parts can be assembled in a stable and physically valid way. By recovering contact graphs and refining connectors between parts, the method enhances the quality of 3D assets for applications like editing and fabrication. The results show significant improvements in the physical stability of the assemblies while maintaining their geometric integrity.'}, 'zh': {'title': '物理引导的3D生成，确保稳定组装', 'desc': '本论文提出了一种物理引导的框架，以改善基于单图像的部件感知3D生成。该方法解决了部件间的相互穿透问题，恢复了邻近部件之间的接触图，并通过物理仿真反馈优化了连接器的参数。通过这种方式，生成的3D模型不仅在视觉上完整，而且在物理上也能稳定组装。实验结果表明，与现有方法相比，我们的方法在物理可实现性和稳定性方面有显著提升，同时保持了几何质量。'}}}, {'id': 'https://huggingface.co/papers/2609.05820', 'title': 'Online Learning with LLM Experts from Limited Feedback', 'url': 'https://huggingface.co/papers/2609.05820', 'abstract': 'Abstract Adaptive routing of prompts to LLM experts is formulated as a contextual bandit problem with limited feedback, yielding algorithms with sublinear regret bounds and effective routing strategies.  Generated by thinkingmachines/Inkling-Small We study adaptive routing of prompts to large language model (LLM) experts to maximize response quality in an online setting with limited feedback. We formulate it as a bandit problem with K actions that represent experts and d features that encode prompts, over a horizon of T rounds. We propose algorithms that strategically select and observe rewards to minimize regret. In the full-information setting, we achieve a regret of O(d T / m), while in the bandit setting we achieve O(d T K / m), where m ll T is a budget on feedback. Our experiments show that we efficiently learn high-quality routing strategies across diverse LLMs from limited feedback.', 'score': 3, 'issue_id': 3271, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '5c228d26a264e82e', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🔀', 'ru': {'title': 'Умная маршрутизация запросов между экспертными моделями с минимальной обратной связью', 'desc': 'В работе изучается адаптивная маршрутизация запросов к различным экспертам на основе больших языковых моделей с целью максимизации качества ответов в онлайн-режиме с ограниченной обратной связью. Авторы формулируют эту задачу как контекстную многорукую бандиту, где каждый эксперт представляет отдельное действие, а признаки кодируют особенности входящих запросов. Предложенные алгоритмы стратегически выбирают, какие ответы оценивать, чтобы минимизировать сожаление (regret) при ограниченном бюджете обратной связи. Экспериментальные результаты демонстрируют, что подход эффективно обучает высококачественные стратегии маршрутизации между различными LLM на основе небольшого объёма оцененных примеров.'}, 'en': {'title': 'Smart Routing for Better LLM Responses', 'desc': 'This paper addresses the challenge of directing prompts to specific large language model (LLM) experts to enhance the quality of responses in real-time scenarios with restricted feedback. It frames the problem as a contextual bandit problem, where each expert represents an action and the prompts are characterized by features. The authors develop algorithms that aim to minimize regret, which is the difference between the optimal and actual performance, achieving sublinear regret bounds in both full-information and bandit settings. Experimental results demonstrate the effectiveness of these algorithms in learning optimal routing strategies across various LLMs using limited feedback.'}, 'zh': {'title': '智能路由：优化LLM专家的提示分配', 'desc': '本文研究了如何将提示有效地路由到大型语言模型（LLM）专家，以最大化响应质量。我们将这一过程建模为一个上下文赌博机问题，涉及有限的反馈信息。提出的算法能够在不同的专家之间进行策略选择，并通过观察奖励来最小化遗憾值。实验结果表明，我们能够在有限反馈的情况下高效学习出高质量的路由策略。'}}}, {'id': 'https://huggingface.co/papers/2609.05824', 'title': 'Beyond Top-k Skill Retrieval: Diversity-Aware Skill Routing for LLM Agents', 'url': 'https://huggingface.co/papers/2609.05824', 'abstract': 'Abstract Diverse Skill Routing improves LLM agent skill selection by balancing relevance with non-redundancy via a determinantal point process, boosting multi-skill coverage.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents increasingly rely on external skills, but routing user requests over large skill registries is difficult because many skills are functionally redundant while complex tasks often require complementary skill sets. Existing skill routers typically rank candidates independently by query relevance, which can waste context budget on redundant skills. We propose Diverse Skill Routing (DSR), a diversity-aware reranking framework that uses a Determinantal Point Process to balance relevance and non-redundancy. DSR introduces a query-residual diversity kernel that penalizes redundant skill overlap while reducing penalties caused only by shared query relevance. On the SkillRouter benchmark, DSR improves recall and full coverage over a strong pointwise reranking baseline, with larger gains on multi-skill queries. These results suggest that skill routing should be treated not only as relevance ranking, but also as complementary set selection.', 'score': 2, 'issue_id': 3271, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '302170a2d6f5130a', 'authors': ['Wang Wei', 'Tiankai Yang', 'Samyadeep Basu', 'Hongjie Chen', 'Yue Zhao', 'Zhengzhong Tu', 'Xiyang Hu', 'Franck Dernoncourt', 'Ryan A. Rossi', 'Hoda Eldardiry'], 'affiliations': ['Adobe Research', 'Arizona State University', 'Dolby Labs', 'Texas A&M University', 'University of Southern California', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.05824.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Умный выбор дополняющих навыков вместо простого ранжирования', 'desc': 'Статья предлагает новый метод Diverse Skill Routing для улучшения выбора навыков в агентах на основе больших языковых моделей. Вместо независимого ранжирования навыков по релевантности, авторы используют детерминантный точечный процесс для балансировки между релевантностью и разнообразием, избегая избыточных навыков. Предложенный подход вводит ядро разнообразия на основе остатков запроса, которое штрафует дублирующиеся навыки и сохраняет релевантные результаты. На бенчмарке SkillRouter метод показывает улучшение в полноте поиска и покрытии всех требуемых навыков, особенно для сложных запросов, требующих нескольких дополнительных инструментов.'}, 'en': {'title': 'Enhancing Skill Selection with Diverse Skill Routing', 'desc': 'The paper introduces Diverse Skill Routing (DSR), a new framework for selecting skills in large language model (LLM) agents. DSR uses a Determinantal Point Process to ensure that selected skills are both relevant and non-redundant, which is important for complex tasks that require a variety of skills. By implementing a query-residual diversity kernel, DSR minimizes the overlap of redundant skills while still considering their relevance. The results show that DSR significantly improves the ability to cover multiple skills in queries compared to traditional methods, highlighting the need for a more nuanced approach to skill selection.'}, 'zh': {'title': '多样化技能路由：提升技能选择的智能', 'desc': '多样化技能路由（DSR）通过使用行列式点过程来改善大型语言模型（LLM）代理的技能选择，平衡相关性与非冗余性，从而增强多技能覆盖。现有的技能路由器通常独立地根据查询相关性对候选技能进行排名，这可能导致在冗余技能上浪费上下文预算。DSR引入了一种查询残差多样性核，惩罚冗余技能重叠，同时减少仅因共享查询相关性而产生的惩罚。实验结果表明，DSR在技能路由基准测试中显著提高了召回率和全面覆盖，尤其在多技能查询中表现更佳。'}}}, {'id': 'https://huggingface.co/papers/2609.08230', 'title': 'ActionSplice: In-Flight Action Editing for Interactive World Models', 'url': 'https://huggingface.co/papers/2609.08230', 'abstract': 'Abstract ActionSplice introduces counterfactual state transport to splice revised actions into chunk-autoregressive video world models without replaying completed evaluations, improving fidelity and speed.  Generated by thinkingmachines/Inkling-Small Chunk-autoregressive video world models typically condition each generated chunk on one action. An action received during sampling must therefore wait for the next chunk, condition future solver evaluations on a state produced under the previous action, or trigger rollback that repeats completed evaluations. We introduce ActionSplice, an inference framework that formulates this problem as Counterfactual State Transport (CST). A lightweight corrector transports the interrupted backbone-native representation toward the matched state induced by the revised action at the same solver step. The world model and sampler remain frozen, and sampling resumes without replaying completed evaluations. The retargeting variant CST*{R} updates the entire active chunk, while the temporal-splicing variant CST*{T} preserves a temporal prefix and updates only the suffix. Across minWM-Wan Action2V and HY-WM1.5, CST*{R} reduces rollback-relative LPIPS by 61.5% and 75.9% relative to direct condition swapping. CST*{T} reduces suffix LPIPS by 56.1% and 77.5%, respectively, while providing 2.73times and 1.69times pixel-ready speedups over waiting. Under the HY-WorldPlay protocol, CST_{R} obtains a PSNR of 25.66 dB, an SSIM of 0.6902, and an LPIPS of 0.1337 against the original rollout.', 'score': 1, 'issue_id': 3272, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': 'e2f9d71dcd8735b7', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': 'Быстрый переход между действиями в видео-моделях через контрфактический транспорт состояния', 'desc': 'В статье предлагается ActionSplice — фреймворк для улучшения видео-моделей мира на основе chunk-autoregressive архитектуры. Основная идея заключается в использовании контрфактического транспорта состояния (Counterfactual State Transport, CST) для быстрого переноса пересмотренных действий в уже сгенерированные последовательности без повторного воспроизведения завершённых шагов. Легкий корректор трансформирует промежуточное представление модели в направлении состояния, которое соответствует новому действию, при этом основная модель остаётся неизменной. Экспериментальные результаты показывают значительное снижение артефактов в сгенерированных видео и ускорение процесса генерации в 2-3 раза по сравнению с альтернативными подходами.'}, 'en': {'title': 'Speeding Up Video Generation with ActionSplice!', 'desc': 'ActionSplice is a new framework that enhances video world models by using a technique called Counterfactual State Transport (CST). This method allows for the integration of revised actions into the model without needing to replay previous evaluations, which speeds up the process and improves the quality of generated video chunks. The framework includes two variants: CST*{R}, which updates the entire active chunk, and CST*{T}, which only updates the latter part while keeping the earlier part intact. The results show significant improvements in fidelity and processing speed compared to traditional methods, making it a valuable advancement in video generation tasks.'}, 'zh': {'title': '反事实状态传输：提升视频生成效率与质量', 'desc': 'ActionSplice引入了反事实状态传输（Counterfactual State Transport, CST），用于在不重放已完成评估的情况下，将修订后的动作插入到块自回归视频世界模型中，从而提高了生成的准确性和速度。传统的视频世界模型在生成每个块时通常只依赖一个动作，而ActionSplice通过轻量级的校正器，将中断的表示传输到由修订动作引导的匹配状态。该框架使得世界模型和采样器保持不变，采样可以在不重放已完成评估的情况下继续进行。实验结果表明，CST*{R}和CST*{T}在多个指标上显著提高了生成速度和质量。'}}}, {'id': 'https://huggingface.co/papers/2609.03502', 'title': 'Building and Evaluating Fixed-Voice Thai TTS from Synthetic Speech', 'url': 'https://huggingface.co/papers/2609.03502', 'abstract': 'Abstract A compact Thai text-to-speech model is distilled from a large voice-cloning teacher using synthetic data from brief voice references, achieving strong on-device accuracy and prosody with minimal errors.  Generated by thinkingmachines/Inkling-Small In low-resource settings, deploying TTS typically requires choosing between a large voice-cloning model with costly inference or a compact fixed-voice system that requires a speaker-specific corpus. We study a third route: using a large voice-cloning model as a programmable data source to turn a short voice reference (e.g., 15 seconds) into a compact fixed-voice student trained entirely on synthetic speech. This setting makes pipeline design consequential: teacher errors become training targets, while filtering failed generations can reduce coverage of difficult texts. Thai further introduces challenges from ambiguous word boundaries, lexical tone, names and loanwords, numeric verbalization, and Thai-English code-switching. We study how text preparation, synthetic generation, quality filtering, rejection sampling, and frontend choices affect the resulting student, and where teacher limitations remain. We evaluate CER, Challenge-Set Keyword Accuracy, Prosody Pause Accuracy, speaker similarity, and speaking rate. The resulting 82M-parameter model, Wayu-Paxa-TTS-Edge, enables on-device Thai TTS without reference audio. It achieves 68.2% Challenge-Set Keyword Accuracy (85.5% of Gemini 3.1) and 91.4% pause precision, outperforming its OmniVoice teacher (89.9%) and reaching 94.8% of Gemini 3.1. It also achieves the lowest pause-placement error and intra-word pause rates among the three systems, and 3.7% and 1.1% CER on Thai and English, respectively. We open-source the model and evaluation framework for Thai TTS development.', 'score': 1, 'issue_id': 3272, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '41c6cfbd9d72aede', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multilingual', '#low_resource', '#small_models', '#open_source', '#inference', '#synthetic', '#audio', '#training'], 'emoji': '🗣️', 'ru': {'title': 'Дистилляция компактной модели TTS из голосового учителя на синтетических данных', 'desc': 'В этой работе исследуется метод дистилляции компактной модели синтеза речи на тайском языке путём обучения на синтетических данных, сгенерированных большой моделью voice-cloning. Студент-модель обучается на синтетической речи из короткого образца голоса (например, 15 секунд) и может работать на устройстве без эталонного аудио. Авторы тщательно изучают влияние подготовки текста, фильтрации качества, rejection sampling и других компонентов пайплайна на результаты обучения, учитывая специфические вызовы тайского языка. Итоговая модель Wayu-Paxa-TTS-Edge с 82 млн параметров достигает высокой точности распознавания и качества просодии, конкурируя с более крупными моделями на публичных бенчмарках.'}, 'en': {'title': 'Compact Thai TTS: High Accuracy with Minimal Data', 'desc': "This paper presents a new Thai text-to-speech (TTS) model called Wayu-Paxa-TTS-Edge, which is created by distilling knowledge from a larger voice-cloning model. The model is trained using synthetic data generated from short voice references, allowing it to maintain high accuracy and natural-sounding speech while being compact enough for on-device use. The authors address various challenges specific to the Thai language, such as ambiguous word boundaries and code-switching, and explore how different design choices impact the model's performance. The resulting model shows impressive metrics, outperforming its teacher model and providing a valuable resource for Thai TTS applications."}, 'zh': {'title': '紧凑高效的泰语文本到语音模型', 'desc': '这篇论文介绍了一种紧凑的泰语文本到语音（TTS）模型，它通过从大型语音克隆教师模型中提取信息，利用短语音参考生成合成数据。该模型在设备上实现了高准确率和良好的韵律，错误率极低。研究表明，使用大型语音克隆模型作为可编程数据源，可以有效地将短语音参考转化为紧凑的固定语音学生模型。最终，开发的Wayu-Paxa-TTS-Edge模型在多个评估指标上表现优异，推动了泰语TTS的发展。'}}}, {'id': 'https://huggingface.co/papers/2609.03595', 'title': 'How Far Can Synthetic Data Take Thai OCR?', 'url': 'https://huggingface.co/papers/2609.03595', 'abstract': 'Abstract A Thai OCR model trained solely on synthetic documents achieves strong real-world performance by isolating key transfer factors like typography, layout, and handwriting glyphs.  Generated by thinkingmachines/Inkling-Small We investigate what makes synthetic OCR supervision transfer to real Thai documents and use the resulting insights to build Wayu-Paxa-OCR-Zero, a Thai OCR model adapted without OCR labels from real Thai document pages. Synthetic data provide exact labels at scale, but "realism" conflates source domain, page context, typography, spatial structure, and glyph variation. We disentangle these factors with a controlled document-reconstruction pipeline and evaluate each variant under page- and crop-level training on printed and handwritten Thai documents. Non-text context has little consistent effect, whereas typeface diversity, two-dimensional structure, and real handwriting glyphs improve transfer; moreover, source-domain matching depends on training granularity, with in-domain reconstruction approaching real printed supervision under page-level training (1.82% versus 1.31% median character error rate) but underperforming out-of-domain reconstruction under crop-level training (15.59% versus 5.52%). Guided by these findings, we adapt the 0.9B-parameter PaddleOCR-VL-1.6 into Wayu-Paxa-OCR-Zero using 45,723 synthetic pages: relative to its base checkpoint, it reduces median character error rate from 6.64% to 1.24% on printed pages and from 74.87% to 20.55% on handwriting and outperforms Typhoon OCR v1 7B on all five evaluation sets, showing that synthetic-only training can be competitive.', 'score': 1, 'issue_id': 3272, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'f8dc80b815e20fee', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multilingual', '#synthetic', '#low_resource', '#small_models', '#transfer_learning', '#cv', '#open_source', '#dataset', '#data'], 'emoji': '📄', 'ru': {'title': 'Синтетические данные как полноценная замена разметки в задаче распознавания текста', 'desc': 'Исследователи разработали модель OCR для тайского языка, обученную только на синтетических документах, которая хорошо работает на реальных данных. Они провели контролируемые эксперименты, чтобы понять, какие факторы синтетических данных — типография, разметка страницы и глифы рукописного текста — критичны для трансфера знаний. Обнаружилось, что разнообразие шрифтов, двумерная структура и реальные рукописные глифы значительно улучшают обобщение модели, тогда как контекст вне текста имеет слабый эффект. На основе этих выводов была адаптирована модель PaddleOCR с использованием 45,723 синтетических страниц, достигнув результатов, конкурентных моделям, обученным на реальных данных с разметкой.'}, 'en': {'title': 'Synthetic Training, Real Results: Advancing Thai OCR', 'desc': 'This paper presents a Thai OCR model called Wayu-Paxa-OCR-Zero, which is trained exclusively on synthetic documents yet performs well on real-world Thai text. The authors explore how different factors like typography, layout, and handwriting affect the transfer of learning from synthetic to real documents. They use a controlled document-reconstruction pipeline to analyze these factors and find that typeface diversity and real handwriting glyphs significantly enhance performance. The model achieves a notable reduction in character error rates, demonstrating that training solely on synthetic data can yield competitive results in OCR tasks.'}, 'zh': {'title': '合成数据驱动的泰语OCR模型成功转移', 'desc': '这篇论文介绍了一种泰语光学字符识别（OCR）模型，名为Wayu-Paxa-OCR-Zero，主要通过合成文档进行训练。研究发现，合成数据在标签准确性和规模上具有优势，但在真实文档中的转移效果受多种因素影响，如字体、布局和手写字形。通过控制文档重建流程，研究者分析了这些因素对模型性能的影响，并发现字体多样性和真实手写字形能显著提高转移效果。最终，该模型在打印和手写文档上的字符错误率显著降低，证明了仅使用合成数据进行训练的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.07099', 'title': 'Ambient @ EgoProactive 2026 : Proactive Egocentric Assistance with Visually Grounded Supervision', 'url': 'https://huggingface.co/papers/2609.07099', 'abstract': 'Abstract The approach reformulates intervention timing as single-token classification and uses a video agent for visual supervision to improve wearable assistant decision-making.  Generated by thinkingmachines/Inkling-Small We present our submission to the EgoProactive track of the ECCV 2026 Wearable AI Challenge, which ranked first in the large-model division and second in the <=2B division. The task requires a wearable assistant to decide after each eight-second segment of egocentric video whether to intervene or remain silent.   Our approach has two main components. First, we reformulate intervention timing as single-token classification. Rather than generating either interrupt<utterance> or silent, the model predicts yes or no, and we derive the decision from the renormalised probabilities of these two tokens. This formulation improved macro-F1 by 0.249 and G-mean by 0.30 over free-form generation. Second, because labelled data were limited to the released validation set, we generated additional supervision using a tool-calling video agent that inspects each clip and assigns intervention timestamps. A narration-only alternative was four times larger and ten times cheaper, but transferred worse than supervision from an unrelated real corpus, suggesting that visual grounding is more important than annotation volume for this task.', 'score': 0, 'issue_id': 3272, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '641d2cada51c91d9', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#benchmark', '#small_models', '#agents', '#video', '#data'], 'emoji': '👁️', 'ru': {'title': 'Визуальное руководство для умного решения момента помощи', 'desc': 'Авторы переформулируют задачу определения времени вмешательства ассистента в виде классификации одного токена, что позволяет модели выбирать между вмешательством и молчанием с использованием переной нормализованных вероятностей. Для улучшения обучения модели они применяют видео-агент, который автоматически генерирует дополнительные аннотации, визуально анализируя каждый видеоклип и определяя временные метки вмешательства. Такой подход показал значительное улучшение метрик macro-F1 и G-mean по сравнению с генеративным подходом. Результаты демонстрируют, что визуальное обоснование аннотаций критически важнее, чем просто увеличение объёма размеченных данных.'}, 'en': {'title': 'Revolutionizing Wearable Assistants with Visual Supervision', 'desc': "This paper presents a novel approach to improve decision-making in wearable assistants by reformulating intervention timing as a single-token classification problem. Instead of generating specific utterances, the model predicts a simple 'yes' or 'no' based on the probabilities of intervention. The authors also introduce a video agent that provides visual supervision by analyzing video clips to assign intervention timestamps, which enhances the model's performance. Their method achieved significant improvements in macro-F1 and G-mean scores, demonstrating the importance of visual grounding over the quantity of labeled data."}, 'zh': {'title': '优化可穿戴助手决策的视觉监督方法', 'desc': '本文提出了一种将干预时机重新表述为单标记分类的方法，并使用视频代理进行视觉监督，以改善可穿戴助手的决策能力。该方法在ECCV 2026可穿戴人工智能挑战赛的EgoProactive赛道中表现优异，获得了大模型组第一和小于等于2B组第二的好成绩。我们的方法主要包括两个部分：首先，将干预时机视为单标记分类，模型预测“是”或“否”，从而提高了宏观F1值和G均值。其次，由于标记数据有限，我们使用视频代理生成额外的监督信息，以便更好地为每个片段分配干预时间戳。'}}}, {'id': 'https://huggingface.co/papers/2609.07154', 'title': 'Ambient @ EgoLongQA 2026: Distilling Long-Video perception into a Sub-2B Model', 'url': 'https://huggingface.co/papers/2609.07154', 'abstract': 'Abstract A 2B vision-language model distilled from a tool-using agent achieves first-place performance on long egocentric video question answering by pruning its multilingual embedding table to meet parameter limits.  Generated by thinkingmachines/Inkling-Small We describe our entry to the EgoLongQA track of the Wearable-AI Challenge in ECCV 2026, which placed first in the <=2B parameter division with 0.8279 on the held-out test set. Our system is a single 2B vision-language model that answers multiple-choice questions about ten-minute egocentric videos in one greedy forward pass; It is obtained by distilling the junior perception module of a tool-using agentic pipeline, not the agent itself into a small student, using teacher traces filtered to those that answered correctly. it reaches 89% of the accuracy of the large agentic pipeline using 1.1% of its parameters. This raises a 27.1% base model to 81.4% on our held-out questions. The 2B backbone has 2.2132B parameters and therefore over the divisional limit, to make the entry admissable we prune the multilingual embedding table from 248,320 to 143,469 rows, reaching 1.9985B with provably identical logits on retained rows.', 'score': 0, 'issue_id': 3272, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '1200fcd8aecfeafc', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#multilingual', '#small_models', '#agents', '#inference', '#video', '#training'], 'emoji': '📹', 'ru': {'title': 'Компактная vision-language модель для понимания долгих эгоцентрических видео через дистилляцию и pruning', 'desc': 'В работе описывается компактная vision-language модель с 2 миллиардами параметров, полученная путём дистилляции перцептивного модуля из системы tool-using агента. Модель решает задачу долгосрочного понимания эгоцентрических видео через ответы на вопросы с множественным выбором, достигая 89% точности большого агента при использовании всего 1.1% его параметров. Для соответствия ограничениям по размеру авторы применили pruning многоязычной embedding таблицы, сохраняя идентичные логиты для оставшихся строк. Модель заняла первое место в соревновании EgoLongQA трека с результатом 0.8279 на тестовом наборе данных.'}, 'en': {'title': 'Efficient Video Question Answering with Distilled Vision-Language Models', 'desc': 'This paper presents a vision-language model that excels in answering questions about long egocentric videos, achieving top performance in a competitive challenge. The model is distilled from a larger tool-using agent, focusing on a smaller student model that retains high accuracy while significantly reducing the number of parameters. By pruning the multilingual embedding table, the model meets the parameter limit while maintaining effective performance. The results demonstrate that the distilled model can achieve 89% of the accuracy of its larger counterpart with only 1.1% of its parameters, showcasing the efficiency of model distillation and pruning techniques.'}, 'zh': {'title': '高效的视觉语言模型在视频问答中的突破', 'desc': '这篇论文介绍了一种从工具使用代理中提炼出的2B视觉语言模型，该模型在长时间自我中心视频问答中表现优异。通过修剪多语言嵌入表以满足参数限制，该模型在Wearable-AI Challenge的EgoLongQA赛道中获得了第一名。该系统能够在一次前向传递中回答关于十分钟自我中心视频的多项选择题，且其参数量仅为大型代理管道的1.1%。通过这种方法，模型的准确率从27.1%提升至81.4%。'}}}, {'id': 'https://huggingface.co/papers/2609.10824', 'title': 'Studying Without a Syllabus: Task-Agnostic Environment Preprocessing', 'url': 'https://huggingface.co/papers/2609.10824', 'abstract': 'Abstract An agent can explore unfamiliar environments without task-specific guidance to build reusable artifacts that reduce later inference costs, though larger study budgets do not always improve results.  Generated by thinkingmachines/Inkling-Small Before an LLM agent tackles tasks in a new environment, it can inspect available corpora and tools and construct reusable resources such as indices, scripts, or procedural guidance. Most automated adaptation methods, however, rely on task examples, trajectories, or evaluation feedback to decide what to build. Existing task-agnostic approaches avoid this supervision but commit in advance to a preparation strategy for a particular type of environment. We study a more open-ended setting: can an agent study an unfamiliar environment without a syllabus, i.e. before test time and without knowledge of the downstream task distribution, and choose how to prepare it? We formalize task-agnostic environment preprocessing, in which a studying system explores an environment under a budget and produces artifacts for a frozen solver. We compare unaided and archive-equipped meta-agents with fixed synthetic-practice and corpus-processing methods across six heterogeneous benchmarks. A meta-agent variant achieves the highest Avg@3 reward on five benchmarks, while fixed corpus processing remains best on the largest corpus benchmark. Larger study budgets do not reliably improve downstream reward. Nevertheless, studied artifacts reduce the test-time sampling needed to reach a given score, demonstrating how reusable preparation can shift computation from repeated test-time attempts to a pre-task study phase.', 'score': 0, 'issue_id': 3272, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '9c304a0eda9f2832', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#inference', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Самостоятельное изучение окружения для создания переиспользуемых артефактов без информации о целевых задачах', 'desc': 'В работе предложен подход, где LLM агент самостоятельно исследует незнакомое окружение без информации о конкретных задачах и создаёт переиспользуемые артефакты (индексы, скрипты, инструкции), которые снижают затраты вычислений при выполнении тестовых задач. Авторы формализуют задачу бесспециализированной предварительной обработки окружения, где система изучает среду под бюджетным ограничением и производит артефакты для заморозенного решателя. Исследование показывает, что мета-агенты с адаптивной стратегией достигают лучших результатов на пяти из шести тестовых наборов данных, хотя больший бюджет на подготовку не всегда улучшает итоговую производительность. Создаваемые артефакты значительно снижают количество необходимых попыток на этапе тестирования, эффективно перемещая вычислительные затраты со стадии тестирования на фазу предварительной подготовки.'}, 'en': {'title': 'Empowering Agents with Task-Agnostic Environment Preprocessing', 'desc': "This paper explores how an agent can learn about new environments without specific tasks to guide it, allowing it to create reusable tools that lower future inference costs. The authors introduce a method called task-agnostic environment preprocessing, where the agent inspects the environment and generates resources like indices and scripts before facing any tasks. They compare different approaches, including meta-agents and fixed methods, across various benchmarks to see which is more effective. The findings suggest that while larger study budgets don't always lead to better results, the artifacts created during the study phase can significantly reduce the amount of computation needed during actual task execution."}, 'zh': {'title': '智能体的环境探索与资源重用', 'desc': '本文研究了一种智能体在没有特定任务指导的情况下，如何探索陌生环境并构建可重用的资源，以降低后续推理成本。智能体可以在新环境中检查可用的语料库和工具，生成索引、脚本或程序指导等资源。我们提出了一种任务无关的环境预处理方法，允许智能体在预算限制下探索环境并为固定求解器生成工件。研究结果表明，构建的可重用工件可以减少测试时所需的采样次数，从而提高效率。'}}}, {'id': 'https://huggingface.co/papers/2609.10297', 'title': 'TRACE: Trajectory-robust Admission with Evidence Ordering for Efficient GUI Agents', 'url': 'https://huggingface.co/papers/2609.10297', 'abstract': 'Abstract TRACE is a training-free framework that ranks visual evidence by future utility and diversity, reserves native tokens for spatial coverage, and contracts retired frames to reduce latency and memory in GUI agents.  Generated by thinkingmachines/Inkling-Small GUI agents accumulate high-resolution screenshots as the trajectory unfolds, increasing inference latency and memory usage. Training-free visual token pruning can reduce this cost, but cache reuse introduces a fundamental constraint. Once tokens are discarded, the corresponding visual evidence cannot be recovered without re-encoding. Pruning therefore becomes an irreversible admission decision that must remain useful for unknown future targets while preserving coverage of operable regions under tight budgets. To address these challenges, we
