    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.14391', 'title': 'Can We Defend Against AI-Generated Video Attacks on Real-World Crisis Events? A Systematic Evaluation of Detectors, Generators and Social Dissemination', 'url': 'https://huggingface.co/papers/2608.14391', 'abstract': 'Abstract A new benchmark for AI-generated video detection reveals that current detectors fail to generalize across realistic crisis-related videos and become less reliable as content spreads socially.  Generated by thinkingmachines/Inkling-Small Recent video generators can fabricate realistic depictions of wars, disasters, public emergencies, and other real-world crises, creating substantial risks of misinformation. Existing benchmarks, however, provide limited evidence on detector and generator behavior in such settings, including how detectability varies with generation conditions, how people perceive generated videos, and whether detectors remain reliable during social dissemination. To address this gap, we introduce RA-Bench, a benchmark for AI-generated video detection that uses Real videos as Anchors. RA-Bench contains 17,886 videos, comprising 1,830 real-video anchors across 10 social-risk categories and 16,056 generated clips from four open-source and five closed-source generators. Based on RA-Bench, we organize our evaluation along three dimensions. We first assess detector generalization across seven traditional detectors, ten zero-shot multimodal models under three review settings, and two MLLMs specifically fine-tuned on AI-generated video detection. Across these methods, none of the three detector families generalizes consistently across RA-Bench instances. We then examine how detectability varies with generation quality, conditioning information, and sampling seeds. These analyses show that generation properties affect detector families differently, while source-level detection patterns remain stable across seeds. Finally, we study human authenticity judgments and detector reliability during social dissemination. We find that videos that mislead people are also difficult for current detectors, and that social dissemination makes detection harder. Together, these findings show that current methods struggle to detect realistic AI-generated videos, highlighting the need for detectors robust to evolving video generators.', 'score': 52, 'issue_id': 2995, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': 'd260217bd2e9d41a', 'authors': ['Shuo Liang', 'Yixing Ma', 'Pengfei Zhou', 'Xingyan Chen', 'Zihan Mei', 'Manting Li', 'Feihan Chen', 'Zhiwen Wang', 'Bin Xu', 'Haotian Zhang', 'Jiajun Song', 'Shiya Su', 'Run Liu', 'Zhenghang Ni', 'Yifa Yu', 'Jintao Hong', 'Bolong Feng', 'Yifei Liu', 'Zirui Zhang', 'Jingxuan Zhang', 'Songlin Zhao', 'Yifan Bai', 'Kang Tan', 'Yizhe Liu', 'Junhao Du', 'Yongtao Ge', 'Zhaopan Xv', 'Xinyuan Zhang', 'Mengru Ma', 'Chunhua Shen', 'Wei Wang', 'Yang You', 'Zheng Zhu', 'Kaipeng Zhang', 'Wangbo Zhao'], 'affiliations': ['Alaya Lab', 'Arizona State University', 'Carnegie Mellon University', 'ETH Zurich', 'GigaAI', 'Independent Researcher', 'Inf Rec, Cardinal AI Lab', 'Monash University', 'National University of Singapore', 'Renmin University of China', 'Shanghai Jiao Tong University', 'Stanford University', 'The Hong Kong University of Science and Technology', 'University of California, Berkeley', 'University of Illinois Urbana-Champaign', 'University of Wisconsin-Madison', 'Xian Jiaotong University', 'Xidian University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14391.jpg', 'data': {'categories': ['#video', '#benchmark', '#dataset', '#multimodal', '#security'], 'emoji': '🎥', 'ru': {'title': 'Детекторы видео из нейросетей неустойчивы к реалистичному контенту о кризисах', 'desc': 'Статья представляет RA-Bench — новый бенчмарк для обнаружения видео, созданных нейросетями, на примере кризисных ситуаций. Исследователи оценили семь традиционных детекторов, десять zero-shot мультимодальных моделей и два мультимодальные LLM на датасете из 17,886 видео, включающем реальные видео и контент, сгенерированный четырьмя открытыми и пятью закрытыми генераторами. Результаты показали, что ни один из рассмотренных методов не обладает хорошей обобщающей способностью (generalization) на разные примеры из бенчмарка и что люди часто неправильно определяют поддельные видео. Исследование также выявило, что социальное распространение контента и различные параметры генерации существенно снижают надёжность детекторов.'}, 'en': {'title': 'Enhancing Detection of AI-Generated Crisis Videos', 'desc': 'This paper introduces RA-Bench, a new benchmark designed to evaluate the effectiveness of AI-generated video detection systems. It highlights that existing detectors struggle to generalize across various realistic crisis-related videos, particularly as these videos spread on social media. The study assesses the performance of multiple detection methods and reveals that none consistently perform well across different scenarios. Additionally, it emphasizes the impact of video generation quality and social dissemination on the reliability of detection, underscoring the urgent need for more robust detection technologies.'}, 'zh': {'title': '提升AI生成视频检测的可靠性', 'desc': '这篇论文介绍了一个新的基准测试RA-Bench，用于检测AI生成的视频。研究发现，现有的检测器在面对真实危机相关视频时表现不佳，且在社交传播中可靠性降低。论文分析了检测器在不同生成条件下的表现，以及人们对生成视频的感知。结果表明，当前的检测方法难以有效识别真实感强的AI生成视频，强调了需要开发更强大的检测器以应对不断演变的视频生成技术。'}}}, {'id': 'https://huggingface.co/papers/2608.14290', 'title': 'Intern-S2-Mobius: Foundation Model with Decoupled Knowledge and Reasoning', 'url': 'https://huggingface.co/papers/2608.14290', 'abstract': "Abstract Mobius-v0 separates global memory storage from iterative reasoning modules to improve knowledge compression and inference efficiency, yielding comparable performance with less training data and faster inference.  Generated by thinkingmachines/Inkling-Small We introduce Mobius-v0, an architecture that comprises a globally shared Memory (FFN) that stores knowledge vectors and multiple Reasoners (Self-Attn) that iteratively achieve compositional reasoning. Using hidden states as cache and carrier, reasoners repeatedly query memory for required knowledge-vectors, while the knowledge is transmitted back to reasoning operators. Through this knowledge-reasoning-separation architecture, Mobius achieves better knowledge compression and reasoning efficiency. Built upon Mobius-v0 architecture: 1) Our 7B model trained-from-scratch achieves similar downstream score as a 7B Transformer baseline with 62.6% of baseline's training data. 2) Our Intern-S2-Mobius, continually-pretrained from Qwen3.5-35B, achieves similar downstream score while delivering nearly 4x end-to-end inference speedup.", 'score': 26, 'issue_id': 2994, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '7835163380b14f36', 'authors': ['Kai Chen', 'Jifeng Ding', 'Ning Ding', 'Jiaye Ge', 'Lixin Gu', 'Yicheng Gu', 'Qipeng Guo', 'Ermo Hua', 'Haian Huang', 'Haozheng Hou', 'Jie Hou', 'Xiangyu Hong', 'Che Jiang', 'Minxi Jin', 'Cheng Liang', 'Dahua Lin', 'Dawei Liu', 'Kuikun Liu', 'Chengqi Lv', 'Haijun Lv', 'Han Lv', 'Ningsheng Ma', 'Biqing Qi', 'Jianmin Qian', 'Shiya Su', 'Youbang Sun', 'Huanze Tang', 'Zhongbo Tian', 'Hanjing Wang', 'Rui Wang', 'Ting Wang', 'Yi Wang', 'Baiting Wu', 'Jun Xu', 'Bowen Yang', 'Hui Wang', 'Weida Wang', 'Haochen Ye', 'Jiashuo Yu', 'Shan Yu', 'Xiaoyi Yu', 'Qirui Zeng', 'Qi Zhang', 'Ming Zhang', 'Wenwei Zhang', 'Bowen Zhou', 'Xinyu Zhou'], 'affiliations': ['Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2608.14290.jpg', 'data': {'categories': ['#reasoning', '#small_models', '#inference', '#optimization', '#open_source', '#architecture', '#training'], 'emoji': '🧠', 'ru': {'title': 'Разделение памяти и логики для эффективного рассуждения', 'desc': 'Авторы представляют Mobius-v0 — архитектуру, которая разделяет глобальную память (реализованную как FFN) для хранения векторов знаний и несколько модулей рассуждения (Self-Attention) для итеративного логического вывода. Модули рассуждения многократно обращаются к памяти за необходимыми векторами знаний, которые затем передаются обратно в операторы рассуждения через скрытые состояния. Благодаря такой архитектуре разделения знаний и рассуждений достигается лучшая компрессия знаний и эффективность вычислений. Модель показывает сравнимое качество на задачах при использовании меньше данных для обучения и обеспечивает ускорение вывода в 4 раза по сравнению с базовыми моделями Transformer.'}, 'en': {'title': 'Efficient Knowledge Handling with Mobius-v0', 'desc': 'Mobius-v0 is a new machine learning architecture that separates memory storage from reasoning processes to enhance efficiency in knowledge handling. It uses a globally shared memory to store knowledge vectors and multiple reasoning modules that work together to perform complex reasoning tasks. By allowing reasoners to query memory for necessary information, Mobius-v0 improves both knowledge compression and inference speed. The results show that Mobius-v0 can achieve comparable performance to traditional models while using significantly less training data and providing faster inference times.'}, 'zh': {'title': 'Mobius-v0：高效推理与知识压缩的新架构', 'desc': 'Mobius-v0是一种新型架构，它将全局内存存储与迭代推理模块分开，从而提高了知识压缩和推理效率。该架构使用一个共享的内存（FFN）来存储知识向量，并通过多个推理器（Self-Attn）进行组合推理。推理器利用隐藏状态作为缓存，反复查询内存以获取所需的知识向量，并将知识传递回推理操作。通过这种知识与推理分离的架构，Mobius在使用更少的训练数据时，仍能实现与传统模型相当的性能，并加快了推理速度。'}}}, {'id': 'https://huggingface.co/papers/2608.13417', 'title': 'Beyond Final Scores: A Systematic Evaluation of Agents for Long-Horizon AI Research and Development', 'url': 'https://huggingface.co/papers/2608.13417', 'abstract': 'Abstract Frontier autonomous agents excel at engineering optimization but show unstable performance, limited novelty, and variable experience reuse across long-horizon tasks.  Generated by thinkingmachines/Inkling-Small Autonomous agents are increasingly capable of improving models, systems, and other technical artifacts through long-horizon experimentation. To understand the current state of this capability, however, evaluation must go beyond final scores, which neither reveal where progress is gained or lost nor indicate whether accumulated experience improves later decisions. We therefore present a systematic evaluation of seven frontier models on 36 long-horizon tasks based on a new framework that uses rule-based metrics to characterize within-run behavior through Solution Framing, Execution, and Feedback Control and controlled comparisons to assess experience reuse within and across tasks. The results show that current agents operate more like engineering optimizers than fully autonomous researchers: they can formulate and implement practical solutions, but their performance varies substantially across runs, their strongest solutions mainly adapt or combine established techniques, and genuine methodological novelty remains rare. Detailed analysis reveals that observed performance is shaped by multiple factors, including distinct process bottlenecks behind similar final outcomes, experience reuse that can help or mislead subsequent decisions, and harness designs that affect performance stability. These findings suggest concrete directions for improving model training, inference-time strategies, experience management, and harness design.', 'score': 26, 'issue_id': 2994, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': '332b4fde4d866ca9', 'authors': ['Yiwei Li', 'Wanli Yang', 'Hexiang Tan', 'Xiangzhou Huang', 'Zhengyu Chen', 'Ziran Li', 'Borun Chen', 'Shanglin Lei', 'Huaisheng Zhu', 'Hao Tian', 'Fei Sun', 'Xunliang Cai', 'Jingang Wang'], 'affiliations': ['Meituan', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.13417.jpg', 'data': {'categories': ['#reasoning', '#agents', '#inference', '#optimization', '#benchmark', '#training'], 'emoji': '🤖', 'ru': {'title': 'От оптимизаторов к исследователям: оценка автономных агентов в долгосрочных экспериментах', 'desc': 'В работе проводится систематическая оценка семи передовых языковых моделей на 36 сложных многошаговых задачах инженерной оптимизации. Авторы предлагают новую схему оценки, использующую правила для анализа поведения агентов на этапах формулирования решения, его реализации и обратной связи. Результаты показывают, что современные агенты работают скорее как оптимизаторы, чем полностью автономные исследователи: они могут формулировать решения, но показывают нестабильную производительность и редко генерируют новые методологии. Исследование выявляет различные факторы, влияющие на качество работы, включая узкие места процесса, переиспользование опыта и влияние конструкции системы на стабильность.'}, 'en': {'title': 'Enhancing Stability and Novelty in Autonomous Agents', 'desc': "This paper evaluates the performance of advanced autonomous agents in engineering optimization tasks. It highlights that while these agents can generate solutions, their performance is inconsistent and often relies on existing techniques rather than innovative methods. The study introduces a new evaluation framework that assesses agents based on their behavior during task execution, focusing on aspects like Solution Framing and Feedback Control. The findings indicate that improvements in training and design are necessary to enhance the agents' stability and novelty in long-horizon tasks."}, 'zh': {'title': '提升自主代理的稳定性与创新性', 'desc': '本论文探讨了前沿自主代理在工程优化中的表现，指出其在长时间任务中的性能不稳定、创新性有限和经验重用不均。研究通过一个新的评估框架，对七个前沿模型在36个长时间任务上的表现进行了系统评估，使用基于规则的指标来分析代理的行为。结果显示，当前的代理更像是工程优化者，而非完全自主的研究者，虽然能够制定和实施实用解决方案，但其表现因运行而异，且真正的方法创新仍然稀少。研究还揭示了影响性能的多个因素，包括相似最终结果背后的过程瓶颈、经验重用对后续决策的影响，以及设计对性能稳定性的影响。'}}}, {'id': 'https://huggingface.co/papers/2608.14144', 'title': 'Self-Supervised Visual On-Policy Distillation', 'url': 'https://huggingface.co/papers/2608.14144', 'abstract': "Abstract Self-supervised visual on-policy distillation improves small vision-language models by distilling from original images into strongly augmented student views without privileged annotations or larger teachers.  Generated by thinkingmachines/Inkling-Small Visual on-policy distillation relies heavily on an informative teacher-student asymmetry, through either a larger, stronger teacher or privileged supervision, such as reference answers or ground-truth regions of interest. This raises a fundamental question: where can informative asymmetry come from when nothing privileged is available? We answer this by inverting where the asymmetry comes from. Rather than adding privileged information to the teacher, we subtract information from the student. This asymmetry creates the same effective learning signal for free as a teacher with access to information unavailable to the student, without ground-truth annotations, rewards, or a separate stronger teacher model. Building on this principle, we introduce Self-Supervised Visual On-Policy Distillation (S^2VOPD), a simple yet effective method that constructs on-policy learning signals from asymmetric augmented views. S^2VOPD distills the teacher's distribution conditioned on the original image on-policy into the student distribution conditioned on a strongly augmented view of the same image. We systematically explore a broad design space of visual augmentations and uncover that (1) asymmetry matters: all four augmentation families improve performance, while symmetric self-distillation degrades it; (2) strength matters: performance peaks at a moderate strength; and (3) the gap must remain task-consistent: augmentations that completely remove the question-relevant evidence can induce large but uninformative discrepancies. Across six fine-grained perception benchmarks, S^2VOPD improves Qwen3.5-4B from 70.7% to 77.4%, above all open-source models compared, up to Qwen3-VL at 235B, and surpasses GPT-5.4. While holding training data the same, it recovers 96% of the improvement achieved by methods with privileged information. Website is at https://williamium3000.github.io/s2vopd", 'score': 23, 'issue_id': 3000, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '45334fa223c481bc', 'authors': ['Yijiang Li', 'Yijun Liang', 'Yunjie Tian', 'Bingyang Wang', 'Ke Zhang', 'Zhenfei Yin', 'Di Fu', 'Philip Torr', 'Nuno Vasconcelos'], 'affiliations': ['Georgia Institute of Technology', 'Independent Researcher', 'Johns Hopkins University', 'UC San Diego', 'University of Maryland, College Park', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.14144.jpg', 'data': {'categories': ['#optimization', '#cv', '#transfer_learning', '#training', '#multimodal', '#small_models'], 'emoji': '🔄', 'ru': {'title': 'Асимметрия через аугментацию: дистилляция без привилегий', 'desc': 'В этой работе предложен метод самообучения для улучшения маленьких видео-языковых моделей через дистилляцию знаний без использования привилегированной информации или больших учителей. Основная идея заключается в создании асимметрии между учителем и студентом не через добавление дополнительной информации учителю, а через удаление информации из студента путём применения сильных аугментаций. Метод S²VOPD применяет дистилляцию распределения учителя, обусловленного исходным изображением, в распределение студента, обусловленное сильно аугментированным видом того же изображения. Экспериментальные результаты показывают, что асимметрия аугментаций критична для эффективного обучения, и метод достигает впечатляющих результатов на бенчмарках тонкого восприятия изображений.'}, 'en': {'title': 'Empowering Small Models with Self-Supervised Distillation', 'desc': 'This paper presents a method called Self-Supervised Visual On-Policy Distillation (S^2VOPD) that enhances small vision-language models by leveraging augmented views of images without needing privileged annotations. Instead of relying on a stronger teacher model, S^2VOPD creates an effective learning signal by reducing the information available to the student model, thus establishing an informative asymmetry. The authors demonstrate that various visual augmentations can significantly improve model performance, with the best results achieved through careful selection of augmentation strength and maintaining task relevance. The method shows substantial improvements in performance across multiple benchmarks, indicating its effectiveness in distilling knowledge without traditional supervision.'}, 'zh': {'title': '自监督视觉蒸馏：提升小型模型的秘密武器', 'desc': '这篇论文介绍了一种自监督视觉在线蒸馏的方法，称为S^2VOPD，旨在提高小型视觉-语言模型的性能。该方法通过从原始图像中提取信息，并将其转化为强增强视图，来实现教师与学生之间的信息不对称。研究表明，适当的增强策略可以显著提升模型的表现，而对称的自蒸馏则会导致性能下降。通过在六个细粒度感知基准上进行测试，S^2VOPD的效果超过了所有比较的开源模型。'}}}, {'id': 'https://huggingface.co/papers/2608.14530', 'title': 'Marionette: Predicting World States, Rendering Geometry, Painting Appearance', 'url': 'https://huggingface.co/papers/2608.14530', 'abstract': 'Abstract Marionette predicts explicit 3D articulated world states for interactive games, uses a fixed renderer for geometry, and synthesizes video via diffusion, enabling direct state-level control and long-horizon consistency repair.  Generated by thinkingmachines/Inkling-Small Interactive game world models typically autoregress visual observations directly in pixel or latent space, forcing structured properties such as pose, geometry, and occlusion to be implicitly maintained by the same generative sequence. Over long horizons, errors in these latent world properties accumulate, making consistency and controllability fragile. We explicitly model the evolving world state, delegate exact geometric computation to a fixed, zero-parameter renderer, and leave the neural model to synthesize appearance. We instantiate this idea as Marionette, a world model for interactive games with articulated characters. First, a two-stage autoregressive dynamics model predicts an explicit and interpretable 276-dimensional 3D world state comprising multi-entity articulated skeletons, metric root trajectories, and rotations. Second, a zero-parameter graphics bridge converts the predicted state into pose-control videos, computing world-space geometry and occlusion in closed form. Third, a control-conditioned video-diffusion observation model synthesizes photorealistic RGB observations from the resulting structured controls. Our experiments establish two properties of Marionette. First, the predicted world state is directly controllable. Forcing a mismatched action stream changes root-aligned joint error by 31% across 48 held-out segments. Second, long-horizon behaviour is determined in the state, and can be repaired there. Left free, the two generated characters drift to 21.2 m apart (recorded sessions stay near 5 m) and a third of frames show ground penetration. Two rules imposed on the explicit state, a terrain collider and a separation cap, cut penetration by 66% and keep the pair engaged, with no change to the observation model. Routing appearance through the predicted state costs no fidelity we can detect, at an FVD of 831 against 799 for recorded pose.', 'score': 21, 'issue_id': 2994, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '0c911f6eab397cb8', 'authors': ['Zian Meng', 'Zhen Li', 'Chuanhao Li', 'Qiang Li', 'Kaipeng Zhang'], 'affiliations': ['Alaya Lab', 'Huazhong University of Science and Technology', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2608.14530.jpg', 'data': {'categories': ['#games', '#video', '#3d', '#architecture', '#diffusion', '#training'], 'emoji': '🎮', 'ru': {'title': 'Явное управление состоянием игрового мира через структурированный синтез', 'desc': 'Marionette — это модель мира для интерактивных игр, которая явно предсказывает трёхмерное состояние с артикулированными персонажами вместо прямого синтеза пикселей. Архитектура состоит из трёх компонентов: авторегрессивная динамическая модель предсказывает 276-мерное состояние включающее скелеты, траектории и ротации; фиксированный графический рендер вычисляет геометрию и окклюзию в замкнутом виде; диффузионная модель синтезирует фотореалистичные наблюдения из полученных управлений. Такой подход позволяет напрямую контролировать предсказанное состояние и исправлять долгосрочные ошибки консистентности через простые правила без изменения модели наблюдений.'}, 'en': {'title': 'Marionette: Mastering 3D Control in Interactive Games', 'desc': 'The paper presents Marionette, a machine learning model designed for predicting 3D articulated states in interactive games. Unlike traditional methods that generate visual observations directly, Marionette explicitly models the evolving world state and uses a fixed renderer for geometry, which enhances control and consistency over long time horizons. It employs a two-stage autoregressive dynamics model to predict a detailed 276-dimensional world state, which includes articulated skeletons and trajectories. Additionally, a video-diffusion model synthesizes realistic visuals from this structured state, allowing for direct control and significant improvements in long-term behavior consistency.'}, 'zh': {'title': 'Marionette：互动游戏中的3D动态状态预测', 'desc': 'Marionette 是一种用于互动游戏的世界模型，它能够预测明确的 3D 动态状态。该模型使用固定的渲染器进行几何计算，并通过扩散合成视频，从而实现直接的状态级控制和长期一致性修复。通过明确建模不断变化的世界状态，Marionette 能够有效地处理多实体的关节骨架和运动轨迹。实验表明，Marionette 的预测状态是可控的，并且能够在长时间内保持一致性。'}}}, {'id': 'https://huggingface.co/papers/2608.13606', 'title': 'MobileMem: Learning from a Year of Mobile Experiences', 'url': 'https://huggingface.co/papers/2608.13606', 'abstract': "Abstract MobileMem is a benchmark and framework for evaluating on-device long-term memory through year-scale, multimodal mobile experience trajectories that require temporal reasoning, knowledge updating, and preference inference.  Generated by thinkingmachines/Inkling-Small The next generation of AI agents is increasingly moving beyond systems that answer isolated questions toward persistent personal assistants that can understand, remember, and continuously learn from users' experiences. Such assistants require long-term memory to accumulate and leverage user-specific experiences over time, yet existing benchmarks remain inadequate for realistic mobile settings, where experiences are heterogeneous, multimodal, evolving, and deeply personal. We introduce MobileMem, a benchmark and framework for studying on-device long-term memory, grounded in a year-scale collection of mobile experiences. MobileMem employs a knowledge-grounded synthesis pipeline to construct coherent and temporally consistent long-horizon trajectories from user-app sessions. It provides complementary text and multimodal settings covering multi-hop and temporal reasoning, knowledge updating, and implicit preference inference. Specifically, MobileMem enables agents to remember the past, understand the present, and adapt to the future. By modeling experiences rather than isolated facts, MobileMem moves memory beyond information retrieval toward experiential intelligence for continuous personal learning.", 'score': 18, 'issue_id': 2996, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': 'c7d4f00f5f765917', 'authors': ['Xinle Deng', 'Yida Xue', 'Xiangyuan Ru', 'Haoming Xu', 'Shuofei Qiao', 'Mengru Wang', 'Yijun Chen', 'Buqiang Xu', 'Chen Jiang', 'Yuchen Eleanor Jiang', 'Lizhong Wang', 'Jianfeng Wang', 'Li Zeng', 'Haofen Wang', 'Guilin Qi', 'Huajun Chen', 'Ningyu Zhang'], 'affiliations': ['OPPO', 'OpenKG', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.13606.jpg', 'data': {'categories': ['#agents', '#dataset', '#benchmark', '#multimodal'], 'emoji': '📱', 'ru': {'title': 'Долгосрочная мобильная память для персональных AI-ассистентов', 'desc': 'MobileMem — это бенчмарк и фреймворк для оценки долгосрочной памяти на мобильных устройствах на основе годового набора мультимодальных данных пользовательских действий. Система требует от AI-агентов выполнения временного рассуждения, обновления знаний и вывода предпочтений пользователя из реальных жизненных траекторий. Авторы используют конвейер синтеза данных для создания временно-согласованных последовательностей действий из мобильных сессий. Предложенный подход позволяет агентам не просто извлекать информацию, но развивать экспериентальный интеллект для непрерывного персонального обучения и адаптации к изменяющимся потребностям пользователя.'}, 'en': {'title': 'Empowering AI with Long-Term Memory for Personal Learning', 'desc': "MobileMem is a new benchmark designed to evaluate how well AI agents can remember and learn from user experiences over long periods. It focuses on creating realistic scenarios that involve various types of data and require the AI to reason about time and user preferences. Unlike traditional memory systems that just store facts, MobileMem emphasizes understanding and adapting to users' evolving needs. This framework aims to enhance the development of personal assistants that can provide more meaningful and context-aware interactions."}, 'zh': {'title': '移动记忆：智能助手的长期记忆新基准', 'desc': 'MobileMem是一个基准和框架，用于评估设备上的长期记忆，特别是在移动体验中。它通过收集一年内的多模态用户体验轨迹，帮助AI助手理解、记忆和学习用户的经历。MobileMem支持多跳和时间推理、知识更新以及隐含偏好推断，使得AI能够更好地适应用户的需求。通过关注用户的体验而非孤立的信息，MobileMem推动了持续个人学习的智能发展。'}}}, {'id': 'https://huggingface.co/papers/2608.13555', 'title': 'HumanTracker: Towards Comprehensive and Human-Aligned Motion Tracking Benchmark', 'url': 'https://huggingface.co/papers/2608.13555', 'abstract': 'Abstract HumanTracker introduces a large-scale benchmark and preference-aligned metric to evaluate humanoid motion tracking based on perceptual quality and physical contact stability.  Generated by thinkingmachines/Inkling-Small Humanoid motion tracking is central to teleoperation and whole-body imitation, yet evaluation often disagrees with what people perceive in videos. Kinematic errors average per-frame pose differences but miss the physical artifacts that matter most, particularly unstable support and incorrect contacts such as foot skating and mistimed touch-downs. Meanwhile, widely used test suites are small and lack the diversity needed to stress contact-rich, long-horizon behaviors. We introduce HumanTracker to make humanoid tracking evaluation both perceptually aligned and scalable. The HumanTracker benchmark contains approximately 153 hours of optical motion trajectories from multiple professional performers, organized into four motion families with text labels for fine-grained diagnosis. We further propose HumanScore, a preference-aligned metric trained on 12K motion pairs containing 24K motions. Across representative state-of-the-art trackers, HumanScore better predicts human preferences and reveals contact and stability failures that kinematic metrics often miss.', 'score': 14, 'issue_id': 2995, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': '67ab68b3caf6e8ea', 'authors': ['Dairu Liu', 'Zekun Qi', 'Jiayu Zeng', 'Ruixi Yu', 'Yu Guan', 'Yintianrun Zhang', 'Xuchuan Chen', 'Sikai Liang', 'Zekai Li', 'Chenghuai Lin', 'Xinqiang Yu', 'Wenyao Zhang', 'He Wang', 'Li Yi'], 'affiliations': ['Galbot', 'Nankai University', 'Peking University', 'Shanghai Jiao Tong University', 'Shanghai Qi Zhi Institute', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.13555.jpg', 'data': {'categories': ['#robotics', '#dataset', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Оценка движений гуманоидов через восприятие человека и стабильность контакта', 'desc': 'В статье представлена HumanTracker — большой бенчмарк для оценки отслеживания движений гуманоидов, основанный на восприятии человеком и стабильности физического контакта. Авторы выявили, что традиционные метрики, измеряющие кинематические ошибки, не отражают важные артефакты, такие как нестабильность опоры и ошибки контакта. Бенчмарк содержит 153 часа траекторий оптического захвата движений от профессиональных исполнителей с разделением на четыре семейства движений. Предложенная метрика HumanScore обучена на 12 тысячах пар движений и лучше предсказывает предпочтения человека, выявляя контактные и стабильностные ошибки.'}, 'en': {'title': 'Enhancing Humanoid Motion Tracking with Human-Centric Evaluation', 'desc': 'HumanTracker is a new benchmark designed to evaluate humanoid motion tracking by focusing on how well the motion looks to people and how stable the physical contact is. Traditional methods often miss important details like foot sliding or timing issues, which can affect the realism of the motion. This benchmark includes a large dataset of 153 hours of motion data from professional performers, categorized into different types of movements for better analysis. Additionally, the HumanScore metric is introduced to better align with human preferences, providing a more accurate assessment of motion quality compared to standard kinematic measures.'}, 'zh': {'title': '人形运动跟踪的新标准与评估指标', 'desc': 'HumanTracker 是一个大型基准测试，旨在评估人形运动跟踪的感知质量和物理接触稳定性。该方法通过分析运动轨迹，解决了传统评估方法无法准确反映人类感知的问题，特别是在支持不稳定和接触错误方面。HumanTracker 包含约 153 小时的光学运动轨迹，涵盖多种运动类型，并提供细致的文本标签以便于诊断。我们还提出了 HumanScore，这是一种基于偏好对齐的指标，能够更好地预测人类的偏好，并揭示传统运动度量常常忽视的接触和稳定性问题。'}}}, {'id': 'https://huggingface.co/papers/2608.14277', 'title': 'SimpleOPD: Simple Tokenizer-Agnostic On-Policy Distillation for Long-Context Reasoning', 'url': 'https://huggingface.co/papers/2608.14277', 'abstract': 'Abstract On-policy distillation from a long-context reasoning teacher to short-context students improves mathematical proof reasoning and generalizes to science benchmarks by aligning token spans, constraining length growth, and stabilizing training.  Generated by thinkingmachines/Inkling-Small On-policy distillation (OPD) offers a promising way to transfer reasoning capabilities from stronger teacher models, but applying it to long-context reasoning teachers and short-context students introduces practical challenges, including tokenizer mismatch, teacher-student distribution mismatch, response length explosion, and training instability. In this work, we study this setting by transferring proof-reasoning capabilities from the long-context reasoning model SU-01 to short-context student models. To handle tokenizer differences, we perform OPD in a shared text space and align only tokens that occupy identical text spans under the student and teacher tokenizers. To mitigate the problem of excessive generation length and frequent truncation, we introduce a student reference KL loss and mask the advantages of special termination tokens such as </think> and <|im_end|>. This strategy constrains the student from drifting excessively from its initial policy, thereby mitigating the teacher-student distribution mismatch problem and fostering steady length growth. Experiments on both same-family and different-family student models, including Qwen3, Qwen3.5, Intern-S2, GLM-4.7, Gemma-4, show consistent gains in mathematical reasoning, especially natural-language math proving. Notably, Intern-S2-Preview improves by 21.2 points on ProofBench, reaching 55.2 and surpassing Gemini-2.5-Pro. It also improves on science benchmarks such as HLE and HiPhO, suggesting that OPD transfers reasoning capabilities that generalize beyond the mathematical training domain.', 'score': 12, 'issue_id': 3000, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '009ae26be3c5756e', 'authors': ['Haonan He', 'Haodi Lei', 'Yun Luo', 'Haoran Zhang', 'Shunkai Zhang', 'Yizhuo Li', 'Shengji Tang', 'Zhilin Wang', 'Runzhe Zhan', 'Lei Bai', 'Ganqu Cui', 'Fangchen Yu', 'Yafu Li', 'Peng Ye', 'Ning Ding', 'Yu Cheng'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2608.14277.jpg', 'data': {'categories': ['#optimization', '#long_context', '#transfer_learning', '#training', '#reasoning', '#math', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Дистилляция долгого рассуждения в компактные модели через выравнивание токенов', 'desc': 'В этой работе исследуется передача навыков рассуждения от учительской модели с длинным контекстом к студенческим моделям с коротким контекстом с помощью on-policy дистилляции. Авторы решают проблемы несовместимости токенизаторов, несоответствия распределений между моделями и взрыва длины генерируемого текста, выравнивая токены в общем текстовом пространстве и добавляя специальную KL-регуляризацию. Метод демонстрирует значительные улучшения в математических доказательствах и показывает обобщаемость на научные бенчмарки. Результаты на различных семействах моделей подтверждают эффективность предложенного подхода для передачи способностей к сложному рассуждению.'}, 'en': {'title': 'Enhancing Reasoning Skills through On-Policy Distillation', 'desc': 'This paper discusses a method called on-policy distillation (OPD) that helps transfer reasoning skills from a strong teacher model to weaker student models, specifically in the context of mathematical proof reasoning. The authors address challenges like differences in tokenization and the tendency for student models to generate overly long responses. They propose solutions such as aligning tokens in a shared text space and using a KL loss to control response length and maintain training stability. The results show that this approach not only improves mathematical reasoning but also generalizes well to science-related tasks, demonstrating the effectiveness of OPD in enhancing model performance.'}, 'zh': {'title': '在线蒸馏：提升推理能力的有效方法', 'desc': '本文研究了从长上下文推理教师模型到短上下文学生模型的在线蒸馏（OPD）方法，旨在提升数学证明推理能力。通过对齐令牌跨度、限制生成长度增长和稳定训练，解决了教师与学生模型之间的分布不匹配等实际挑战。实验结果表明，使用OPD后，短上下文学生模型在数学推理和科学基准测试上均有显著提升，尤其是在自然语言数学证明方面。该方法不仅提高了数学推理能力，还表明其推理能力可以超越数学训练领域，适用于更广泛的科学任务。'}}}, {'id': 'https://huggingface.co/papers/2608.14546', 'title': 'CPI-Bench: A Comprehensive,Practical and Intelligent Benchmark for Real-World Image Editing', 'url': 'https://huggingface.co/papers/2608.14546', 'abstract': 'Abstract CPI-Bench is a comprehensive benchmark for real-world image editing that evaluates multi-image tasks, practical applications, and reasoning-based editing to better differentiate model performance.  Generated by thinkingmachines/Inkling-Small With the rapid advancement of image editing models and their widespread application across various domains, there is an increasingly urgent need to deploy these model capabilities directly into real-world scenarios. However, existing benchmarks remain confined to simple single-image tasks, suffering from limited coverage dimensions and an inability to effectively differentiate performance among diverse models. Consequently, they fail to reliably evaluate model performance in complex multi-image editing, highly demanding reasoning instructions, and practical deployment settings. To address these limitations, we propose CPI-Bench, a Comprehensive, Practical andIntelligent benchmark for real-world image editing. CPI-Bench comprises three core subsets: CPI-General-Bench, which comprehensively covers diverse editing tasks and pioneers the inclusion of multi-image editing evaluation; CPI-Practical-Bench, which focuses on high-frequency real-user application scenarios; and CPI-Intelligent-Bench, which is dedicated to evaluating capabilities in highly demanding reasoning-based editing. Evaluation results of mainstream image editing models based on CPI-Bench demonstrate that CPI-Bench enhances performance differentiation among models. It provides a comprehensive and reliable quantification of gaps in general editing capabilities, practical deployment efficacy, and advanced reasoning-based editing, offering invaluable guidance for the future optimization of image editing models. Crucially, our ranking analysis reveals that CPI-Bench achieves the highest alignment with the Arena Image Edit Leaderboard, indicating it faithfully captures the preferences and perceptual judgments of human evaluators, serving as a robust proxy for real-world user experience.', 'score': 10, 'issue_id': 2996, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '08ab4a65d61d43aa', 'authors': ['Qinye Zhou', 'Jun Zheng', 'Yongchao Du', 'Yuan Wang', 'Zhengrui Chen', 'Zuan Gao', 'Taihang Hu', 'Chao Lin', 'Yefeng Shen', 'Xingjian Wang', 'Zhao Wang', 'Zhengtao Wu', 'Xiaoli Xu', 'Zhengze Xu', 'Hao Yan', 'Denghui Yang', 'Yuhang Yu', 'Huayu Zhang', 'Mingzhou Zhang', 'Mengting Chen'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.14546.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#cv', '#multimodal'], 'emoji': '🎨', 'ru': {'title': 'Всеобъемлющий бенчмарк для оценки редактирования изображений в реальном мире', 'desc': 'CPI-Bench — это комплексный бенчмарк для оценки моделей редактирования изображений в реальных условиях. В отличие от существующих тестов, ориентированных на простые задачи с одним изображением, CPI-Bench включает три подмножества: оценку многоизображенного редактирования, практические сценарии использования и задачи, требующие сложного рассуждения. Бенчмарк позволяет лучше дифференцировать производительность различных моделей и выявлять пробелы в их возможностях редактирования. Результаты показывают высокое совпадение оценок CPI-Bench с предпочтениями человеческих оценивателей, что делает его надежным инструментом для оценки качества моделей в реальных условиях.'}, 'en': {'title': 'CPI-Bench: Elevating Image Editing Evaluation to Real-World Standards', 'desc': 'CPI-Bench is a new benchmark designed to evaluate image editing models in real-world scenarios, focusing on multi-image tasks and reasoning-based editing. It addresses the limitations of existing benchmarks that only assess single-image tasks, which do not effectively differentiate model performance. The benchmark includes three subsets: CPI-General-Bench for diverse editing tasks, CPI-Practical-Bench for real user applications, and CPI-Intelligent-Bench for complex reasoning tasks. Evaluation results show that CPI-Bench improves the ability to measure and compare the performance of various image editing models, aligning closely with human preferences in image editing.'}, 'zh': {'title': 'CPI-Bench：真实世界图像编辑的全面基准', 'desc': 'CPI-Bench是一个全面的基准测试，专注于真实世界的图像编辑，评估多图像任务和基于推理的编辑。它解决了现有基准仅限于简单单图像任务的问题，能够更好地区分不同模型的性能。CPI-Bench包含三个核心子集，分别是CPI-General-Bench、CPI-Practical-Bench和CPI-Intelligent-Bench，涵盖了多样化的编辑任务和实际应用场景。通过CPI-Bench的评估结果，能够更可靠地量化模型在编辑能力、实际部署效果和高级推理编辑方面的差距，为未来的图像编辑模型优化提供重要指导。'}}}, {'id': 'https://huggingface.co/papers/2608.11994', 'title': 'Claim-Level Reliability Assessment for Efficient Test-Time Reasoning', 'url': 'https://huggingface.co/papers/2608.11994', 'abstract': 'Abstract Claim-Level Reliability Assessment improves reasoning accuracy by verifying critical claims instead of sampling more solutions, reducing token use while boosting performance.  Generated by thinkingmachines/Inkling-Small We propose claim-level falsification as a principle for test-time scaling and instantiate it through Claim-Level Reliability Assessment (CLR), a training-free framework that reallocates test-time compute from additional solution sampling to targeted verification. Since whole-trace evaluation often obscures decisive errors due to signal dilution from routine tokens, CLR condenses each reasoning trace into a compact set of decision-critical claims, thereby isolating its logical anchors. Furthermore, recognizing the inherent difficulty of generating entirely correct solutions under fixed model capabilities, CLR shifts the focus to semantic falsification. This approach exploits a fundamental asymmetry between solution construction and claim refutation. Constructing a valid solution requires a flawless reasoning path, whereas refuting an incorrect claim requires identifying only a single decisive flaw. This targeted search for negative evidence systematically compresses the survival space of high-confidence incorrect traces, effectively suppressing erroneous consensus via nonlinear reliability scoring. Across four LLMs and four reasoning benchmarks under matched budgets, CLR generally improves upon pass@1 and self-consistency. On GPT-OSS-20B/CMIMC25, for instance, CLR exceeds pass@1 by 27.15 percentage-points and raises self-consistency accuracy from 77.50\\% to 82.19\\% with 37.0\\% fewer tokens.', 'score': 9, 'issue_id': 2995, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': 'b24d4e341705217d', 'authors': ['Sen Xu', 'Wei Wang', 'Shixi Liu', 'Jixin Min', 'Yingwei Dai', 'Zhibin Yin', 'Yirong Chen', 'Junlin Zhang'], 'affiliations': ['Sina Weibo Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2608.11994.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#inference', '#training'], 'emoji': '🔍', 'ru': {'title': 'Проверка утверждений вместо поиска новых решений', 'desc': 'В статье предлагается метод проверки надёжности на уровне отдельных утверждений (CLR) для улучшения точности рассуждений в больших языковых моделях. Вместо того чтобы генерировать множество различных решений, метод концентрируется на проверке критических утверждений, которые определяют логику решения. Авторы используют принцип семантической фальсификации, эксплуатируя асимметрию между созданием правильного решения (требует идеального пути) и опровержением неправильного утверждения (требует одного решающего недостатка). На четырёх моделях и бенчмарках CLR показывает значительное улучшение точности при использовании на 37% меньше токенов.'}, 'en': {'title': 'Boosting Accuracy by Verifying Claims, Not Just Solutions', 'desc': 'The paper introduces Claim-Level Reliability Assessment (CLR), a method that enhances reasoning accuracy in machine learning models by focusing on verifying critical claims rather than generating more solutions. CLR operates without additional training, reallocating computational resources to verify important claims, which helps in identifying logical errors more effectively. By condensing reasoning traces into essential claims, CLR isolates key decision points, making it easier to spot flaws in reasoning. This method leverages the asymmetry between constructing solutions and refuting claims, leading to improved performance metrics like pass@1 and self-consistency across various large language models and reasoning tasks.'}, 'zh': {'title': '声明级评估：提升推理准确性的关键', 'desc': '本文提出了一种称为声明级可靠性评估（CLR）的新方法，通过验证关键声明来提高推理准确性，而不是增加更多的解决方案采样。这种方法在测试时将计算资源从额外的解决方案采样重新分配到针对性的验证上，从而减少了令牌的使用并提升了性能。CLR通过将每个推理轨迹浓缩为一组决策关键声明，来隔离逻辑锚点，避免了全轨迹评估中由于常规令牌导致的信号稀释问题。此外，CLR强调语义反驳，利用了解决方案构建与声明反驳之间的基本不对称性，系统性地压缩高置信度错误轨迹的生存空间。'}}}, {'id': 'https://huggingface.co/papers/2608.14106', 'title': 'Forecast Collapse in Time-Series Foundation Models', 'url': 'https://huggingface.co/papers/2608.14106', 'abstract': 'Abstract Forecast collapse in hourly equity return prediction stems from low predictability and per-series objectives, and the proposed CalibRank objective balances calibration and ranking to restore cross-sectional structure.  Generated by thinkingmachines/Inkling-Small When forecasting hourly returns for 1,000 US equities, we observe an unexpected phenomenon: predictions become nearly flat and show poor stock ranking, as measured by cross-sectional correlation. We call this forecast collapse. Surprisingly, the phenomenon largely disappears when forecasting trading volume under the same setting. We investigate forecast collapse across time-series foundation models (TSFMs), twelve deep-learning forecasting models, and 97 public benchmark configurations, and find that it is closely tied to target predictability. We identify two distinct reasons behind it: low predictability limits the amplitude of calibrated point forecasts, while per-series objectives leave cross-series structure unidentified. These findings reveal a calibration-ranking tradeoff: optimizing squared error leads to flat predictions, whereas directly optimizing cross-sectional correlation improves ranking but can inflate forecast amplitude by more than an order of magnitude. To address this tradeoff, we introduce CalibRank, a simple objective that balances calibration and ranking. On Finance1K, CalibRank nearly triples cross-sectional correlation while keeping amplitude close to the target, and improves correlation on all tested models. Our results reveal a blind spot in conventional time-series evaluation: per-series metrics can hide failures in cross-series structure needed by downstream decisions.', 'score': 7, 'issue_id': 2998, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': 'ee13bdcc165dcdca', 'authors': ['Shu Wan', 'Miles Ma', 'Hank Zhu', 'Guangqi Liu', 'Stephen Wang', 'Qingsong Wen', 'Huan Liu'], 'affiliations': ['Abel AI Lab', 'Arizona State University', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.14106.jpg', 'data': {'categories': [], 'emoji': '📊', 'ru': {'title': 'Балансировка калибровки и ранжирования для восстановления структуры предсказаний доходностей', 'desc': 'В работе исследуется проблема коллапса прогнозов при предсказании почасовых доходностей акций, когда предсказания становятся практически плоскими и теряют способность ранжировать акции. Авторы выявили, что это явление связано с низкой предсказуемостью целевой переменной и использованием целевых функций, оптимизируемых для каждого временного ряда отдельно, без учета кросс-секционной структуры. Предложена новая целевая функция CalibRank, которая балансирует между калибровкой прогнозов и качеством ранжирования активов. Метод показал значительное улучшение кросс-секционной корреляции, при этом сохраняя амплитуду прогнозов близкой к целевым значениям.'}, 'en': {'title': 'Balancing Prediction Accuracy and Stock Ranking with CalibRank', 'desc': 'This paper discusses a problem called forecast collapse in predicting hourly returns of stocks, where predictions become flat and do not rank stocks well. The authors propose a new objective function called CalibRank that balances the accuracy of predictions (calibration) with their ability to rank stocks effectively. They find that traditional methods can lead to poor performance because they focus too much on individual stock predictions without considering the overall structure of the predictions across multiple stocks. By using CalibRank, they significantly improve the ability to rank stocks while maintaining accurate predictions, highlighting the importance of considering both calibration and ranking in financial forecasting.'}, 'zh': {'title': '平衡校准与排名，提升股票预测能力', 'desc': '本文探讨了在每小时股票收益预测中出现的预测崩溃现象，主要原因是低可预测性和每个系列的目标设置。我们提出了一种新的目标函数CalibRank，它平衡了校准和排名，从而恢复了横截面结构。研究表明，优化平方误差会导致预测结果平坦，而直接优化横截面相关性则能改善排名。通过在Finance1K数据集上的实验，CalibRank显著提高了横截面相关性，同时保持了预测幅度接近目标。'}}}, {'id': 'https://huggingface.co/papers/2608.13040', 'title': 'Latent On-Policy Self-Distillation', 'url': 'https://huggingface.co/papers/2608.13040', 'abstract': "Abstract Latent On-Policy Self-Distillation learns privileged teaching context end-to-end from experience to provide dense token-level supervision, improving agent performance and efficiency.  Generated by thinkingmachines/Inkling-Small Enabling agents to learn from experience and internalize it into their policy has become a central problem in self-evolving AI. On-policy self-distillation (OPSD) offers an effective pathway by using a privileged self-teacher to provide dense supervision on the student's own trajectories; however, existing methods still rely heavily on designer-specified privileged artifacts (e.g., answers, feedback, skills, or trajectories), limiting the end-to-end learnability and scalability required for continual self-improvement. In this work, we introduce Latent On-Policy Self-Distillation (LOPD), which, rather than proposing another hand-crafted OPSD variant with a newly prescribed form of privileged context, makes the teacher's privileged context itself learnable end-to-end from experience. Technically, LOPD retrieves relevant experiences and composes them into continuous latent tokens that condition a self-teacher, while the student generates trajectories from the task and interaction history and receives dense token-level supervision at every visited prefix. We further introduce a privileged-margin objective to stabilize and regulate the learning of latent context. Empirically, LOPD demonstrates (I) strong performance, outperforming RLVR and representative OPSD methods including OPSD, SDPO, and Skill-SD across both agentic tool use and code generation; and (II) high learning efficiency, surpassing GRPO and Skill-SD with less than 30% of their rollout budget. Ablation studies further provide direct evidence that making privileged context learnable is necessary for realizing these gains. Together, these results position LOPD as a step toward a more scalable and self-directed paradigm for agent evolution.", 'score': 7, 'issue_id': 2997, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': 'bb2b173950e42360', 'authors': ['Guibin Zhang', 'Jiayang Lyu', 'Ran Sun', 'Xinlei Yu', 'Haoyu Zhao', 'Qibing Ren', 'Shuicheng Yan'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'National University of Singapore', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.13040.jpg', 'data': {'categories': ['#training', '#reasoning', '#rlhf', '#optimization', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Обучаемый контекст учителя для масштабируемой самодистилляции агентов', 'desc': 'В этой работе предлагается метод Latent On-Policy Self-Distillation (LOPD), который позволяет агентам обучаться через самодистилляцию, где привилегированный учитель предоставляет плотное пообзацное наблюдение на уровне токенов. Ключевое отличие LOPD заключается в том, что контекст учителя обучается конец-в-конец из опыта, а не задаётся вручную, что обеспечивает масштабируемость и самосовершенствование агентов. Метод использует латентные токены, полученные из релевантного опыта, для кондиционирования самоучителя, в то время как студент генерирует траектории и получает плотный сигнал обучения на каждом префиксе посещённых состояний. Экспериментальные результаты показывают, что LOPD превосходит существующие методы самодистилляции по производительности и эффективности выборки на задачах использования инструментов и генерации кода.'}, 'en': {'title': 'Empowering Agents with Learnable Teaching Contexts', 'desc': "Latent On-Policy Self-Distillation (LOPD) is a novel approach that enhances agent learning by allowing the teaching context to be learned from experience rather than being predefined. This method uses a self-teacher that provides detailed supervision based on the agent's own past actions, improving both performance and efficiency. By generating continuous latent tokens from relevant experiences, LOPD enables agents to receive guidance at every step of their learning process. The results show that LOPD outperforms existing methods and requires significantly less computational resources, making it a promising advancement in self-evolving AI."}, 'zh': {'title': '潜在在线自我蒸馏：智能体进化的新路径', 'desc': '本论文提出了一种新的自我蒸馏方法，称为潜在在线自我蒸馏（LOPD），旨在通过经验学习来提高智能体的性能和效率。LOPD 通过让自我教师从经验中学习特权上下文，提供密集的标记级监督，从而克服了传统方法对设计师指定特权信息的依赖。该方法通过检索相关经验并将其组合成连续的潜在标记，来指导学生生成任务轨迹，并在每个访问的前缀上提供监督。实验结果表明，LOPD 在多个任务上表现优异，并且学习效率高，标志着智能体进化的可扩展性和自我导向的一个重要进展。'}}}, {'id': 'https://huggingface.co/papers/2608.14284', 'title': 'PRM-as-a-Judge 1.5: A Toolkit for Robot Process Assessment', 'url': 'https://huggingface.co/papers/2608.14284', 'abstract': 'Abstract PRM-as-a-Judge 1.5 provides fine-grained process metrics and reliability tools to evaluate embodied robotic models beyond binary success rates.  Generated by thinkingmachines/Inkling-Small Fine-grained robotic evaluation matters for understanding embodied models, going beyond binary success rates and rule-based process scores. We present PRM-as-a-Judge 1.5, a toolkit for robot process assessment that turns rollout videos into dense progress curves and derives multiple fine metrics. PRM-as-a-Judge 1.5 introduces three metrics, building on version 1.0, that characterize failure-side progress, post-drawdown recovery, and success-side execution quality, helping users understand embodied model capability. Based on the rollout videos from benchmarks, we perform a comprehensive assessment of the embodied models, providing some fine-grained metric results and key findings. We further introduce RoboPulse++ to evaluate the reliability of process reward models (PRM), providing evaluators with a more accurate testing platform. Moreover, we release a user-friendly assessment suite, including the benchmark, metric implementation, and visualization tools, to support reproducible manipulation process evaluation. We call on the community to rethink how robots are evaluated and establish transparent, procedural, and reproducible assessment as a foundation for the next generation of embodied intelligence.', 'score': 6, 'issue_id': 2996, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '8e31614d8c44d00c', 'authors': ['Yuyang Liu', 'Yanqing Shen', 'Ruike Chen', 'Jifan Zhao', 'Yuxuan Tian', 'Yichi Zhang', 'Tianfeng Long', 'Zixuan Yin', 'Yipu Wang', 'Ziheng Qin', 'Wenxing Tan', 'Yang Shi', 'Mingyu Cao', 'Runze Xiao', 'Ziqi Wang', 'Zhixin Yin', 'Shiwei Chu', 'Yi-Fan Zhang', 'Yao Mu', 'Yuheng Ji', 'Yihao Wang', 'Jun Yan', 'Zhongyuan Wang', 'Pengwei Wang', 'Xiaolong Zheng'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.14284.jpg', 'data': {'categories': ['#small_models', '#benchmark', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'От бинарной оценки к детальному анализу: процессно-ориентированная метрика для робототехники', 'desc': 'В этой работе представлена система PRM-as-a-Judge 1.5 для детальной оценки роботизированных моделей, которая выходит за рамки простых бинарных метрик успеха или неудачи. Авторы предлагают набор инструментов, преобразующих видеозаписи манипуляционных операций в детальные кривые прогресса и производящих множество специализированных метрик для понимания способностей воплощённых моделей. Введены три новых метрики, характеризующие прогресс при неудачах, восстановление после ошибок и качество выполнения успешных операций, а также предложена система RoboPulse++ для оценки надёжности моделей process reward model. Авторы выпускают открытый набор инструментов с бенчмарками, реализацией метрик и инструментами визуализации для воспроизводимого и прозрачного оценивания роботизированных систем.'}, 'en': {'title': 'Rethinking Robot Evaluation with Fine-Grained Metrics', 'desc': 'The paper introduces PRM-as-a-Judge 1.5, a toolkit designed to evaluate robotic models using detailed process metrics instead of just simple success rates. It provides fine-grained metrics that assess various aspects of robotic performance, including failure recovery and execution quality. The toolkit also includes RoboPulse++, which enhances the reliability of process reward models for more accurate evaluations. By offering a comprehensive assessment suite, the authors aim to promote transparent and reproducible evaluation methods in the field of embodied intelligence.'}, 'zh': {'title': '重新定义机器人评估的未来', 'desc': 'PRM-as-a-Judge 1.5 是一个用于评估机器人模型的工具包，提供了细致的过程指标和可靠性工具，超越了简单的成功率评估。该工具通过将机器人操作视频转化为密集的进展曲线，生成多个细致的评估指标，帮助用户理解机器人模型的能力。新版本引入了三种新的评估指标，关注失败过程、恢复能力和成功执行质量。我们还推出了RoboPulse++，为过程奖励模型的可靠性评估提供了更准确的平台，呼吁社区重新思考机器人评估的方法。'}}}, {'id': 'https://huggingface.co/papers/2608.13667', 'title': 'Second Thought: Reasoning in Parallel as LLM Agents Act and Observe', 'url': 'https://huggingface.co/papers/2608.13667', 'abstract': "Abstract Second Thought is a training-free framework that runs auxiliary reasoning branches in parallel during agent action-observation waits to reduce sequential decoding and turn counts without harming accuracy.  Generated by thinkingmachines/Inkling-Small LLM agents in the ReAct paradigm alternate between reasoning, acting, and observing, but deliberate reasoning is confined to the Thought phase: while the agent serializes an action and waits for the environment, its reasoning is frozen. We identify this recurring interval for Action and Observation as a reasoning idle window and ask whether it can host additional reasoning in parallel that serves future turns. Therefore, we propose Second Thought, a training-free inference framework that forks four auxiliary branches the instant each Thought phase concludes, decodes them concurrently with the main loop, and merges the generated thoughts back when the environment observation arrives. In this way, Second Thought relocates the added reasoning off the main thread's sequential decoding path. Across three agentic benchmarks and three reasoning LLMs, Second Thought lowers the average turn count in all nine (model,benchmark) pairs and reduces main thread decoding in six of them by up to 43% (roughly 20% on average among those settings), while leaving it essentially unchanged in a seventh; Pass@1 shows no significant change in seven of nine pairs and the two significant differences are +12.4 and +10.2 points. Against a compute-matched control that forces an equivalent budget onto the main thread's own reasoning, it attains strictly higher Pass@1 with 1.3 to 3.2 less sequential decoding in all four settings where the control applies.", 'score': 6, 'issue_id': 2997, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': 'd38910dde874944c', 'authors': ['Zhensu Sun', 'Chengran Yang', 'Yunbo Lyu', 'Jieke Shi', 'David Lo'], 'affiliations': ['Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2608.13667.jpg', 'data': {'categories': ['#optimization', '#reasoning'], 'emoji': '⚡', 'ru': {'title': 'Параллельное мышление: используем мёртвое время агента для ускорения рассуждений', 'desc': 'Second Thought — это фреймворк для оптимизации работы LLM-агентов в парадигме ReAct, которые чередуют рассуждение, действие и наблюдение. Авторы выявили неиспользуемое время, когда агент ожидает ответ окружения после выполнения действия, и предложили запускать в это время вспомогательные ветви рассуждений параллельно основному потоку. Подход не требует переобучения модели и достигает сокращения количества ходов и декодирования на основном потоке на 20% в среднем без значительного снижения точности. Экспериментальная оценка на трёх бенчмарках показала, что метод превосходит аналогичный контроль с эквивалентным вычислительным бюджетом, добиваясь лучших результатов при меньшем последовательном декодировании.'}, 'en': {'title': 'Maximizing Reasoning Efficiency with Second Thought', 'desc': 'The paper introduces Second Thought, a novel framework designed to enhance the efficiency of reasoning in machine learning agents without requiring additional training. It allows agents to run auxiliary reasoning branches in parallel during their waiting periods, effectively utilizing idle time to generate insights for future actions. By forking multiple reasoning paths after each Thought phase, the framework reduces the overall number of turns needed for decision-making and decreases the time spent on sequential decoding. The results demonstrate that Second Thought improves performance across various benchmarks while maintaining accuracy, showcasing its potential to optimize agent behavior in real-time environments.'}, 'zh': {'title': '第二思考：提升推理效率的无训练框架', 'desc': 'Second Thought 是一个无训练的框架，它在代理的动作观察等待期间并行运行辅助推理分支，以减少顺序解码和回合数，同时不影响准确性。该框架通过在每个思考阶段结束时分叉四个辅助分支，并与主循环并行解码，最终在环境观察到达时合并生成的思考。通过这种方式，Second Thought 将额外的推理移出主线程的顺序解码路径。实验结果表明，Second Thought 在多个基准测试中降低了平均回合数，并在大多数情况下减少了主线程的解码时间。'}}}, {'id': 'https://huggingface.co/papers/2608.00220', 'title': 'Verifier-Induced Support Reshaping in On-Policy Optimization', 'url': 'https://huggingface.co/papers/2608.00220', 'abstract': 'Abstract On-policy reinforcement learning with verifiable rewards can improve immediate task performance while reducing the diversity of successful responses needed for future training, a phenomenon called verifier-induced support reshaping.  Generated by thinkingmachines/Inkling-Small We show that on-policy reinforcement learning with verifiable rewards (RLVR) can improve the current objective while making successful behaviors for later objectives too rare to sample and reinforce. We call this verifier-induced support reshaping and define effective rewardable support as successful trajectories reachable within a fixed rollout budget. Across two model families, we study this effect through repeated verifier-scored sampling and bidirectional training on mathematical reasoning and constrained instruction following, including sequential training with the opposite verifier. Math-RLVR raises average instruction-following success but reduces the number of prompts with any successful response under repeated sampling. On IFEval with Qwen3-8B-Base, pass@1 rises by 6.5 percentage points while best@32 falls by 9.8 percentage points, and the same divergence appears across both models and IF benchmarks. Conversely, IF-RLVR shifts math responses from step-by-step openings toward direct answers, lowers best@k across sampling budgets, and reduces reward variation for later Math-RLVR. Token-distribution analyses and controlled opening interventions show that these changes concentrate in the first few response tokens. RLVR mainly reranks openings already available in the base policy, and the selected opening causally affects math searchability. The tested reference-policy constraints, routing priors, and on-policy distillation preserve cross-task support only partially; MathIF and ReasonIF show that marginal gains translate only partly into responses that are both correct and constraint-following. Therefore, endpoint improvements do not guarantee future trainability or joint capability under on-policy optimization. Code is available at https://github.com/sylvain-wei/verifier-induced-support-reshaping', 'score': 4, 'issue_id': 2995, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'aff30fad8bb5412f', 'authors': ['Shaohang Wei', 'Zikun Su', 'Feifan Song', 'Wen Luo', 'Wei Li', 'Guangyue Peng', 'Houfeng Wang'], 'affiliations': ['BUPT', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.00220.jpg', 'data': {'categories': ['#optimization', '#alignment', '#math', '#reasoning', '#rl', '#training'], 'emoji': '⚖️', 'ru': {'title': 'Парадокс улучшения: как награды за одну задачу разрушают обучаемость другой', 'desc': 'В работе исследуется проблема переформирования пространства решений при обучении с подкреплением на политике с проверяемыми наградами. Авторы показывают, что хотя такой подход улучшает производительность текущей задачи, он одновременно делает успешные поведения для будущих задач слишком редкими для эффективного переобучения. Через серию экспериментов с математическими рассуждениями и следованием инструкциям демонстрируется, что этот эффект проявляется в концентрации изменений в начальных токенах ответа и переранжировании стратегий, уже присутствующих в базовой модели. Исследование подчёркивает, что улучшения на текущей задаче не гарантируют сохранение способности модели к переобучению или совместное решение нескольких задач при on-policy оптимизации.'}, 'en': {'title': 'Balancing Immediate Success and Future Learning in RL', 'desc': 'This paper discusses a method called on-policy reinforcement learning with verifiable rewards (RLVR) that enhances immediate task performance but can limit the variety of successful responses for future training. The authors introduce the concept of verifier-induced support reshaping, where successful behaviors become too rare to sample effectively for later objectives. They demonstrate that while RLVR can improve success rates in tasks like instruction-following, it may also reduce the overall number of successful responses available for training. The findings suggest that improvements in performance do not necessarily ensure better future learning capabilities, highlighting a trade-off in reinforcement learning strategies.'}, 'zh': {'title': '在线强化学习中的支持重塑现象', 'desc': '本文探讨了带有可验证奖励的在线强化学习（RLVR），它可以提高当前任务的表现，但可能导致未来训练中成功响应的多样性减少。这种现象被称为验证者引起的支持重塑。研究表明，虽然RLVR可以提高指令遵循的成功率，但在重复采样中，成功响应的数量却减少。最终，虽然在某些任务上取得了短期的改进，但并不保证未来的可训练性或联合能力。'}}}, {'id': 'https://huggingface.co/papers/2608.14071', 'title': 'Scaling Domain Data Repetition in LLM Pretraining', 'url': 'https://huggingface.co/papers/2608.14071', 'abstract': 'Abstract Under proportional scaling of model size and training tokens, optimal repetition of high-quality domain data increases mildly with scale and correlates with domain validation loss rather than unique data volume.  Generated by thinkingmachines/Inkling-Small As large language models scale, their training-token budgets must also increase to maintain an appropriate tokens-per-parameter ratio (\\(TPP\\)). However, high-quality domain data is much harder to scale than general web data. As model size and the training-token budget increase, its fraction in the training mixture tends to decrease. Repeating the available high-quality data provides an effective way to counteract this dilution, but excessive repetition may lead to overfitting. We study this trade-off under practical LLM scaling, where the training-token budget grows proportionally with model size. For a fixed domain, we first find that, surprisingly at a fixed \\(TPP\\), the optimal repetition count mildly increases with model size. Across different domains, we find that the optimal repetition count is strongly negatively correlated with the final validation loss of a domain: domains with lower loss can generally benefit from more repetitions. In contrast, the amount of unique domain data is only weakly related to the optimal repetition count. These findings suggest that repetition counts tuned on smaller proxy models with the same \\(TPP\\) can provide a practical estimate for larger models.', 'score': 3, 'issue_id': 2995, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '54a34442555fba30', 'authors': ['Jingwei Li', 'Xinran Gu', 'Rui Dai', 'Xintong Hao', 'Chengyin Xu', 'Yan Wu', 'Shuran Zheng', 'Jingzhao Zhang'], 'affiliations': ['ByteDance Seed', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14071.jpg', 'data': {'categories': ['#small_models', '#training'], 'emoji': '🔄', 'ru': {'title': 'Оптимальное повторение данных масштабирует лучше, чем увеличение объёма', 'desc': 'В исследовании анализируется оптимальное количество повторений высокочественных данных при масштабировании языковых моделей. Авторы обнаружили, что при пропорциональном увеличении размера модели и бюджета токенов, оптимальное количество повторений растёт медленно, но стабильно. Ключевое открытие заключается в том, что оптимальное количество повторений сильнее коррелирует с валидационной ошибкой домена, чем с объёмом уникальных данных. Полученные результаты позволяют использовать параметры, настроенные на меньших моделях, для предсказания оптимальной стратегии повторений на более крупных моделях.'}, 'en': {'title': 'Maximizing Model Performance with Smart Data Repetition', 'desc': "This paper explores how to effectively use high-quality domain data when training large language models (LLMs). It finds that as the model size increases, the optimal number of times to repeat this high-quality data also increases, but only slightly. Interestingly, the study shows that the best repetition count is more closely linked to the model's validation loss than to the amount of unique data available. This suggests that tuning repetition counts on smaller models can help predict the best approach for larger models."}, 'zh': {'title': '高质量数据重复优化与模型规模的关系', 'desc': '在模型规模和训练数据量成比例扩展的情况下，高质量领域数据的最佳重复次数随着规模的增加而轻微增加，并且与领域验证损失相关，而不是与独特数据量相关。随着大型语言模型的扩展，训练令牌预算也必须增加，以保持适当的每参数令牌比率（TPP）。然而，高质量领域数据的扩展比一般网络数据要困难得多。我们的研究表明，在固定的TPP下，最佳重复次数随着模型规模的增加而轻微增加，并且与最终验证损失呈强负相关。'}}}, {'id': 'https://huggingface.co/papers/2608.13545', 'title': 'LittleLearner: Language Models Under Pedagogically Controlled Knowledge Exposure', 'url': 'https://huggingface.co/papers/2608.13545', 'abstract': "Abstract A curated elementary-grade pretraining corpus and 5B-parameter model create a controlled sandbox for studying knowledge acquisition, representation, and bounded capability growth via post-training and in-context learning.  Generated by thinkingmachines/Inkling-Small Modern language models are trained on heterogeneous web-scale text corpora. Consequently, studying knowledge and skill acquisition is difficult, as prior exposure to related content is hard to characterize. To address this challenge, we introduce LITTLECURRICULUM, a curated 88B-token pretraining corpus tailored to U.S. elementary school material, explicitly excluding concepts, facts, and vocabulary taught above Grade 5. Training a 5B-parameter LLM from scratch on LITTLECURRICULUM yields LITTLELEARNER, a model with sufficient language competence for open-ended evaluation, yet with clear knowledge and capability boundaries mapped to interpretable curriculum guidelines. We release LITTLECURRICULUM and LITTLELEARNER as a developmentally restricted sandbox to study how models acquire, represent, and use data under a well-defined training scope. We illustrate the sandbox's utility in a first suite of experiments on injecting new knowledge through post-training and in-context learning. These methods let LITTLELEARNER better utilize existing knowledge, but do not raise out-of-scope capabilities. Our findings underscore the value of this controlled environment for future investigations.", 'score': 3, 'issue_id': 2999, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': 'dae433c5af81e775', 'authors': ['Fanfei Li', 'Jana Zeller', 'Manuel Prada-Corral', 'Thaddäus Wiedemer', 'Prasanna Mayilvahanan', 'Ryan Cotterell', 'Wieland Brendel'], 'affiliations': ['ETHZ', 'Ellis Institute', 'MPI-IS'], 'pdf_title_img': 'assets/pdf/title_img/2608.13545.jpg', 'data': {'categories': ['#training', '#small_models', '#dataset'], 'emoji': '📚', 'ru': {'title': 'Контролируемая песочница для изучения приобретения знаний в языковых моделях', 'desc': 'В работе представлены LITTLECURRICULUM — аккуратно отобранный корпус текстов объёмом 88 миллиардов токенов, основанный на материалах начальной школы США (до 5 класса), и LITTLELEARNER — языковая модель с 5 миллиардами параметров, обученная с нуля на этом корпусе. Эта контролируемая среда позволяет изучать, как нейросетевые модели приобретают знания, представляют информацию и развивают способности в рамках чётко определённых границ. Авторы демонстрируют, что методы постобучения и контекстного обучения позволяют модели лучше использовать уже имеющиеся знания, но не расширяют её возможности за пределы исходной области. Такой управляемый экспериментальный полигон открывает новые возможности для исследования процесса накопления знаний в больших языковых моделях.'}, 'en': {'title': 'Exploring Knowledge Boundaries in Language Models', 'desc': 'This paper presents LITTLECURRICULUM, a specially designed pretraining dataset consisting of 88 billion tokens focused on U.S. elementary school content, which excludes advanced concepts beyond Grade 5. A 5B-parameter language model, LITTLELEARNER, is trained from scratch on this dataset, allowing researchers to explore knowledge acquisition and representation within a defined educational framework. The study demonstrates how LITTLELEARNER can learn and apply new information through post-training a
