    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.04148', 'title': 'Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments', 'url': 'https://huggingface.co/papers/2609.04148', 'abstract': 'Abstract Terminal-Universe reconstructs executable workspaces from agent trajectories to synthesize diverse training tasks and improves post-training performance through supervised fine-tuning.  Generated by thinkingmachines/Inkling-Small As terminal-based code agents become prevalent, agent trajectories have accumulated at scale, while realistic, executable environments remain scarce. However, environments are what agent post-training actually requires: each can be re-queried into many verifiable tasks and provides execution feedback, whereas a trajectory is a single frozen demonstration. Rather than generating environments from scratch, we observe that the tool-execution history in existing trajectories exposes the structure and contents of the environments in which they ran, making it possible to reconstruct those environments from the trajectories themselves. Thus, we introduce Terminal-Universe, a framework which turns each trajectory into a reusable environment and explores it for synthesizing new tasks and continued interactions. Specifically, Terminal-Universe replays the file operations recorded in a trajectory to restore each file before the agent modified it, yielding a partial workspace; a completion agent then supplies the missing files and dependencies. On this recovered workspace, we both reconstruct the original intent task and synthesize entirely new ones. Besides, we also scale the tasks along two complementary axes: breadth and depth. For breadth, we mine directional dependency relations between related environments and synthesize cross-workspace queries spanning multiple codebases, as developers routinely do in real-world development. For depth, we extend the initial single-turn query into a multi-round session that captures iterative user feedback and requirement refinement via a user agent. Applied to public terminal agent trajectories, Terminal-Universe produces 37.3k task-sufficient environments. Supervised fine-tuning of Qwen3.5-27B on this corpus improves single-round performance on Terminal-Bench 2.1 by 11.9 points and multi-round performance on EvoCode-Bench v2 MT@4 by 13.8 points.', 'score': 133, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'c5f70b18ea1a07cd', 'authors': ['Jie Wu', 'Zhenru Zhang', 'Beichen Zhang', 'Xuwu Wang', 'Yuhui Su', 'Mouxiang Chen', 'Peng Wang', 'Zhihai Wang', 'Que Shen', 'Hao Zhou', 'An Yang', 'Fei Huang', 'Yujiu Yang', 'Dayiheng Liu'], 'affiliations': ['Alibaba Group', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.04148.jpg', 'data': {'categories': [], 'emoji': '⚙️', 'ru': {'title': 'От записей действий агента к переиспользуемым обучающим окружениям', 'desc': 'Terminal-Universe — это фреймворк, который восстанавливает исполняемые рабочие пространства из траекторий работы агентов, используя историю операций с файлами. На восстановленных рабочих пространствах система синтезирует разнообразные новые задачи, расширяя их как по ширине (кросс-рабочие взаимодействия), так и по глубине (многораундовые сессии с обратной связью). Полученный корпус из 37.3k задач использован для обучения LLM-агентов методом supervised fine-tuning, что улучшило производительность модели Qwen3.5-27B на бенчмарках Terminal-Bench и EvoCode-Bench. Подход позволяет эффективно расширить данные для обучения агентов, преобразуя замороженные траектории в переиспользуемые интерактивные среды.'}, 'en': {'title': 'Reconstructing Environments for Enhanced Agent Training', 'desc': 'The paper introduces Terminal-Universe, a framework that reconstructs executable environments from agent trajectories to create diverse training tasks. By analyzing the tool-execution history in these trajectories, the framework can restore environments that agents previously interacted with, allowing for the generation of new tasks. This approach not only reuses existing trajectories but also enhances the training process through supervised fine-tuning, leading to improved performance on benchmark tasks. Ultimately, Terminal-Universe enables the synthesis of a large number of task-sufficient environments, facilitating better agent training and interaction.'}, 'zh': {'title': '重建环境，提升智能代理的训练任务', 'desc': 'Terminal-Universe 是一个框架，它通过重建代理轨迹中的可执行工作空间，来合成多样化的训练任务，并通过监督微调提高后训练性能。该框架利用现有轨迹中的工具执行历史，恢复代理运行的环境，从而生成可重复使用的环境。通过重放轨迹中的文件操作，Terminal-Universe 能够恢复部分工作空间，并由补全代理提供缺失的文件和依赖项。最终，该方法在公共终端代理轨迹上生成了 37,300 个任务充足的环境，并显著提高了模型在多个基准测试上的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.26730', 'title': 'Knowing When Not to Reuse: Conditional Experience Transfer in Autonomous LLM Post-Training', 'url': 'https://huggingface.co/papers/2608.26730', 'abstract': "Abstract Boundary-Calibrated Intervention Transfer selectively reuses past training evidence by checking contextual applicability and running bounded trials, reducing harmful updates and improving final model quality in autonomous post-training.  Generated by thinkingmachines/Inkling-Small Large language models offer broad capabilities, but adapting them to evolving domains, tools, and requirements often entails repeated post-training. Autonomous systems automate parts of this process by proposing updates, training candidates, and using evaluation feedback to select subsequent proposals. As evidence accumulates, a central problem emerges: which past update evidence remains actionable after subsequent training has changed the parent model? An update's effect depends on its parent, data, and training stage. Treating past success as context-free permission can waste compute. If the resulting child is promoted, it can also degrade the subsequent training trajectory. We formulate this problem as conditional experience transfer and introduce Boundary-Calibrated Intervention Transfer (BCIT), a method that authorizes experience reuse before weight-changing training. BCIT binds an observed effect to its source context, checks applicability conditions, vetoes candidates with named hard conflicts, and obtains current-state evidence through a bounded training trial when needed. Fully trained candidates still face a shared adoption rule, and only observed events extend memory. On one 4B model adapted across finance reasoning, text-to-SQL, and function calling, candidate updates exhibit heterogeneous target and retention effects across the evaluated contexts. Under matched candidates, evidence, and compute, BCIT authorizes fewer harmful updates and attains higher equal-budget final-model quality than the evaluated alternatives. These results support treating experience authorization as a distinct problem in autonomous post-training.", 'score': 124, 'issue_id': 3215, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '43bdb1e1e2a2906a', 'authors': ['Tingyun Li', 'Wenfeng Feng', 'Weiqing Li', 'Abudukelimu Wuerkaixi', 'Guohua Liu', 'Yuewei Zhang'], 'affiliations': ['Alibaba Cloud Computing'], 'pdf_title_img': 'assets/pdf/title_img/2608.26730.jpg', 'data': {'categories': ['#transfer_learning', '#optimization', '#training', '#small_models'], 'emoji': '🔄', 'ru': {'title': 'Избирательное переиспользование опыта обучения через калибровку границ применимости', 'desc': 'В статье рассматривается проблема повторного использования прошлого опыта обучения при автономной доподготовке больших языковых моделей. Авторы предлагают метод Boundary-Calibrated Intervention Transfer (BCIT), который проверяет применимость прошлых обновлений в новом контексте и выполняет ограниченные пробные обучения для валидации. Метод связывает наблюдаемый эффект обновления с его исходным контекстом и предотвращает вредные изменения модели на ранних этапах. Экспериментальные результаты показывают, что BCIT более эффективно выбирает полезные обновления и достигает лучшего качества финальной модели при одинаковых вычислительных ресурсах.'}, 'en': {'title': 'Smartly Reusing Past Training for Better Model Updates', 'desc': "The paper introduces Boundary-Calibrated Intervention Transfer (BCIT), a method designed to improve the process of adapting large language models to new tasks by selectively reusing past training experiences. BCIT evaluates the relevance of previous updates based on the current model's context and training stage, ensuring that only applicable experiences are considered for reuse. This approach minimizes harmful updates that could degrade model performance and enhances the overall quality of the final model. The results demonstrate that BCIT leads to better outcomes in various applications, such as finance reasoning and SQL generation, compared to traditional methods."}, 'zh': {'title': '边界校准干预转移：提升模型质量的关键', 'desc': '本文提出了一种名为边界校准干预转移（BCIT）的方法，用于在自主后训练中选择性地重用过去的训练证据。BCIT通过检查上下文的适用性和进行有限试验，减少有害更新并提高最终模型的质量。该方法将观察到的效果与其源上下文绑定，确保只有在适用条件下才允许重用经验。实验结果表明，BCIT在多个评估上下文中能够授权更少的有害更新，并在相同预算下获得更高的最终模型质量。'}}}, {'id': 'https://huggingface.co/papers/2609.03796', 'title': 'LLaDA-Image: Building Strong Image Generators with Fully Open Training Recipes', 'url': 'https://huggingface.co/papers/2609.03796', 'abstract': 'Abstract LLaDA-Image unifies a 6B diffusion transformer with a frozen vision-language module, using image-only pre-training and a Muon optimizer to generate photorealistic images with precise editing, and is distilled into a fast 2-4 step variant that achieves state-of-the-art open-source results.  Generated by thinkingmachines/Inkling-Small We introduce LLaDA-Image, a unified framework that pairs a 6B Diffusion Transformer (DiT) trained from scratch with a frozen vision-language understanding module built on the LLaDA2.0-Mini diffusion language model backbone. Instead of relying heavily on paired image-text data from the beginning, we first build a strong visual generative prior through image-only pre-training and mid-training. The generation pipeline comprises 220M samples, 98 of which are real images. For efficient and scalable optimization, we use parameter-free RMSNorm throughout the DiT together with the Muon optimizer. The resulting unified model produces highly photorealistic images while accurately following fine-grained editing instructions. We further distill LLaDA-Image into LLaDA-Image-Turbo, enabling fast inference in 2-4 sampling steps. On Qwen-Image-Bench, LLaDA-Image achieves overall scores of 53.53 and 53.38 on the English and Chinese tracks, respectively, setting a new state-of-the-art among open-source models on both tracks. To support further research on capable and efficient generative models, we release our model weights, training code, and detailed recipes.', 'score': 97, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '5e9378e5778db2f1', 'authors': ['Chuyan Chen', 'Haoxing Chen', 'Kun Chen', 'Zhenglin Cheng', 'Long Cui', 'Ruishan Fang', 'Zhangxuan Gu', 'Zhicheng Huang', 'Zhenzhong Lan', 'Yuanting Lei', 'Haoquan Li', 'Jianguo Li', 'Rongchuan Li', 'Sidu Li', 'Tao Lin', 'Deyuan Liu', 'Jiacheng Liu', 'Lin Liu', 'Yuxuan Lou', 'Zhisheng Lu', 'Yuxin Ma', 'Shuheng Shen', 'Peng Sun', 'Chaoyang Wang', 'Hongjun Wang', 'Xiaomei Wang', 'Yongxin Wang', 'Chengzhang Wu', 'Hongru Wu', 'Jun Xie'], 'affiliations': ['AGI Research Center', 'Inclusion AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.03796.jpg', 'data': {'categories': ['#optimization', '#diffusion', '#open_source'], 'emoji': '🎨', 'ru': {'title': 'Быстрая фотореалистичная генерация через дистилляцию диффузионного трансформера', 'desc': 'LLaDA-Image объединяет диффузионный трансформер объёмом 6 млрд параметров с замороженным модулем понимания изображений и текста, используя предварительное обучение только на изображениях и оптимизатор Muon для генерации фотореалистичных изображений с точным редактированием. Модель обучается на датасете из 220 млн образцов, включая как синтетические, так и реальные изображения, что позволяет создать мощный генеративный приор. Авторы реализуют дистилляцию модели в быстрый вариант LLaDA-Image-Turbo, способный генерировать изображения за 2-4 шага дифференцирования вместо стандартных 50+. Фреймворк достигает лучших результатов среди открытых моделей на бенчмарке Qwen-Image-Bench как для английского, так и для китайского языков.'}, 'en': {'title': 'LLaDA-Image: Fast and Precise Image Generation Unleashed!', 'desc': 'LLaDA-Image is a novel framework that combines a 6B Diffusion Transformer with a vision-language module to create high-quality images. It utilizes image-only pre-training to establish a strong generative model before incorporating text data, allowing for precise image editing. The model employs the Muon optimizer and RMSNorm for efficient training and fast inference, achieving impressive results in just 2-4 sampling steps. By releasing its model weights and training code, LLaDA-Image aims to advance research in generative models.'}, 'zh': {'title': 'LLaDA-Image：高效生成逼真图像的统一框架', 'desc': 'LLaDA-Image 是一个统一的框架，将一个从零开始训练的 6B 扩散变换器与一个冻结的视觉-语言理解模块结合在一起。该模型通过仅使用图像的预训练，建立了强大的视觉生成先验，并在生成过程中使用了 Muon 优化器。LLaDA-Image 能够生成高度逼真的图像，并准确遵循细致的编辑指令。经过提炼，LLaDA-Image 被转化为 LLaDA-Image-Turbo，实现了快速推理，且在开源模型中达到了新的最先进水平。'}}}, {'id': 'https://huggingface.co/papers/2609.01507', 'title': 'LatentPress: Context Compression Beyond Text and Vision', 'url': 'https://huggingface.co/papers/2609.01507', 'abstract': 'Abstract LatentPress compresses conversational and document context into continuous memory tokens read directly by a frozen decoder, achieving high compression with faster inference and improved accuracy over text or OCR methods.  Generated by thinkingmachines/Inkling-Small Compressed context is usually carried as human-readable text or as rendered images that must be decoded, even when its consumer is a language model. We introduce LatentPress, which writes conversational histories and long documents into a third representation: continuous memory tokens that a frozen decoder reads directly through its input-embedding interface, with no text reconstruction at inference. A small reader-matched writer compresses 4-16times while training only an adapter (4.2M-26.2M parameters, sim!0.1% of the decoder). On LongMemEval, LatentPress reaches 0.504 accuracy at 7.70times compression versus 0.490 for uncompressed evidence, outperforming text summaries (0.184) and OCR-based compression (0.426 to 0.312). On LongBench-QA, in-domain writers match or exceed raw-context reading at 4-8times compression, while 16times trails raw. Writing takes 43ms per conversation, roughly an order of magnitude faster than text summarization or OCR reconstruction, and reading is 5-9times faster than raw context or cached OCR. We validate the interface under two transfer settings, zero-shot from UltraChat to LongMemEval memory QA and from LongMemEval-derived QA to unseen LongBench document domains, establishing direct soft tokens as a practical machine-facing context interface beyond text and vision. The implementation of the experiments could be found at: https://github.com/xuyd16ai/context_softtoken_compress .', 'score': 64, 'issue_id': 3215, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '4e0fe9cf67946ca8', 'authors': ['Zhengze Zhou', 'Hejian Sang'], 'affiliations': ['Cornell University', 'Iowa State University'], 'pdf_title_img': 'assets/pdf/title_img/2609.01507.jpg', 'data': {'categories': ['#transfer_learning', '#optimization', '#open_source', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Из слов в векторы: прямое сжатие контекста для скорости и точности', 'desc': 'В работе предложен метод LatentPress для сжатия контекста диалогов и документов в виде непрерывных токенов в скрытом пространстве, которые напрямую читаются замороженным декодером языковой модели без реконструкции текста. Компрессия достигается путём обучения небольшого адаптера (4-26 млн параметров), который преобразует исходный контекст в soft tokens, обеспечивая сжатие в 4-16 раз. Метод показывает улучшение точности на бенчмарках LongMemEval и LongBench-QA по сравнению с текстовыми суммаризациями и OCR-методами, одновременно ускоряя вывод в 5-9 раз. Подход успешно обобщается в условиях трансфера между разными датасетами и доменами, демонстрируя практическую применимость soft tokens как универсального интерфейса для работы с контекстом.'}, 'en': {'title': 'Revolutionizing Context Compression with LatentPress', 'desc': 'LatentPress is a novel method that compresses conversational and document contexts into continuous memory tokens, which can be directly read by a frozen decoder. This approach allows for significant compression, achieving 4-16 times reduction in size while maintaining high accuracy and faster inference times compared to traditional text or OCR methods. The model demonstrates superior performance on benchmarks like LongMemEval and LongBench-QA, outperforming both text summaries and OCR-based compression techniques. By eliminating the need for text reconstruction during inference, LatentPress provides a more efficient interface for language models to process contextual information.'}, 'zh': {'title': 'LatentPress：高效的上下文压缩与快速推理', 'desc': 'LatentPress是一种新方法，它将对话和文档的上下文压缩成连续的记忆令牌，这些令牌可以直接被冻结的解码器读取。与传统的文本或OCR方法相比，LatentPress在压缩率和推理速度上都有显著提升。通过训练一个小型的适配器，LatentPress能够实现4到16倍的压缩，同时保持高准确性。实验结果表明，LatentPress在多个评估任务中表现优于未压缩的证据和其他压缩方法。'}}}, {'id': 'https://huggingface.co/papers/2609.04199', 'title': 'Compile by Training: Turning Natural-Language Specifications into Local Neural Functions', 'url': 'https://huggingface.co/papers/2609.04199', 'abstract': 'Abstract Compile by training converts natural-language specifications into reusable neural functions by distilling teacher-generated examples into small adapters, enabling efficient deployment without remote model dependencies.  Generated by thinkingmachines/Inkling-Small Many recurring text functions are easy to describe but difficult to implement with rules, while calling a large remote model for every input introduces repeated cost, latency, and dependency on a provider. We present compile by training, which turns a natural-language specification into a reusable neural function. At compile time, teacher models generate task-specific examples that are used to train a small adapter for a compact interpreter. The resulting function runs without the teachers and can be stored, versioned, and composed like ordinary software. On FuzzyBench-Hard, a subset on which the Program-as-Weights fast compiler produced no exact matches, compile by training reaches 83.6% semantic accuracy. This higher accuracy comes with a higher compile-time cost: roughly a minute rather than seconds for the fast compiler. We deploy the compiler in a public interactive service and demonstrate compiled functions in a multi-site website helper, a language-controlled 3D avatar, and a bidirectional English-Claudish translator.', 'score': 62, 'issue_id': 3216, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'e46ceea8190527fd', 'authors': ['Yuntian Deng', 'Pengyu Nie', 'Stuart Shieber'], 'affiliations': ['Harvard University', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2609.04199.jpg', 'data': {'categories': ['#plp', '#small_models', '#training'], 'emoji': '⚙️', 'ru': {'title': 'Компиляция нейрофункций путем дистилляции примеров от учительских моделей', 'desc': 'Статья представляет метод "compile by training", который преобразует текстовые описания функций в компактные нейросетевые адаптеры. Учительские модели генерируют примеры данных, которые используются для обучения маленького адаптера для интерпретатора, позволяя избежать зависимости от удаленных моделей. Полученные функции работают независимо, могут быть сохранены и скомпонованы как обычное ПО. На бенчмарке FuzzyBench-Hard метод достигает 83.6% семантической точности, хотя требует больше времени на компиляцию, чем альтернативные подходы.'}, 'en': {'title': 'Transforming Language into Efficient Neural Functions', 'desc': "This paper introduces a method called 'compile by training' that transforms natural language instructions into reusable neural functions. It uses examples generated by teacher models to create small adapters, which allows for efficient execution without relying on large remote models. This approach reduces costs and latency while enabling the storage and versioning of the generated functions like traditional software. The method achieves a high semantic accuracy of 83.6% on specific benchmarks, although it requires more time to compile compared to faster alternatives."}, 'zh': {'title': '编译训练：将自然语言转化为可重用的神经网络函数', 'desc': '本论文提出了一种名为“编译训练”的方法，可以将自然语言规范转换为可重用的神经网络函数。通过教师模型生成特定任务的示例，训练出小型适配器，从而实现高效的部署，而无需依赖远程模型。该方法在FuzzyBench-Hard数据集上达到了83.6%的语义准确率，尽管编译时间较长，但其准确性显著提高。最终，研究展示了在公共交互服务中应用编译函数的多种实例，包括网站助手、语言控制的3D头像和双向翻译器。'}}}, {'id': 'https://huggingface.co/papers/2609.03430', 'title': 'Random Attention: Rethinking KV Cache Eviction for Efficient Reasoning', 'url': 'https://huggingface.co/papers/2609.03430', 'abstract': 'Abstract Random eviction of reasoning tokens matches selective KV cache compression because reasoning traces are self-protecting through redundancy, making scoring unnecessary once prompts are preserved.  Generated by thinkingmachines/Inkling-Small Large language models achieve superior performance on tasks that require extended reasoning, but long chains of thought make the KV cache a severe memory bottleneck. Existing KV cache compression methods share one paradigm: score each cached token by some estimate of how much it will matter later, and keep the top-scoring ones. We show that the selection signal contributes almost nothing. Random Attention keeps the prompt and evicts uniformly at random within each attention head, computing no score at all; across four models and six reasoning tasks it matches the strongest prior evictor while serving 32-43% higher throughput than it in vLLM deployment. Controlled experiments explain this by showing that 1) the prompt is the fragile part of the cache, and most of the gap between selectors is just whether their selection signal happened to keep it; 2) the reasoning trace protects itself against eviction with redundancy at two levels, in the text (the model restates what it still needs as it works) and across attention heads (each keeps its own copy of the trace), so once the prompt is safe, a random draw retains enough copies of what the model still needs, and no score is required to pick them. Our code is publicly available at https://github.com/SalesforceAIResearch/Random-Attention.', 'score': 62, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'd4db88b0716b84e7', 'authors': ['Heng Wang', 'Jielin Qiu', 'Wenting Zhao', 'Cheng Qian', 'Liangwei Yang', 'Jiawei Han', 'Heng Ji', 'Silvio Savarese', 'Shelby Heinecke', 'Huan Wang'], 'affiliations': ['Salesforce AI Research', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.03430.jpg', 'data': {'categories': ['#optimization', '#open_source', '#reasoning', '#long_context'], 'emoji': '⚡', 'ru': {'title': 'Случайность эффективнее, чем оценки: парадокс в сжатии памяти LLM', 'desc': 'В статье исследуется сжатие KV cache в больших языковых моделях при решении задач с цепочками рассуждений. Авторы показывают, что случайное удаление токенов из cache работает так же хорошо, как методы с селективным сжатием, которые используют сложные оценки важности токенов. Они объясняют этот результат двумя факторами: критичность сохранения промпта в cache и внутренняя избыточность рассуждений модели на уровне текста и attention heads. Предложенный метод Random Attention увеличивает пропускную способность на 32-43% без потери качества, не требуя вычисления оценок важности.'}, 'en': {'title': 'Random Attention: Simplifying KV Cache Management for Better Performance', 'desc': 'This paper introduces a novel approach called Random Attention for managing the KV cache in large language models, which is crucial for tasks requiring extended reasoning. Instead of scoring tokens based on their future importance, this method randomly evicts tokens while ensuring that the prompt is preserved, leading to improved memory efficiency. The authors demonstrate that the reasoning process is inherently self-protecting due to redundancy, allowing the model to maintain performance without complex scoring mechanisms. Their experiments show that Random Attention achieves higher throughput compared to traditional methods while effectively retaining necessary information.'}, 'zh': {'title': '随机驱逐：提升推理效率的新方法', 'desc': '本文探讨了一种新的随机驱逐推理令牌的方法，该方法与选择性KV缓存压缩相匹配。长链推理使得KV缓存成为内存瓶颈，而现有的缓存压缩方法依赖于对每个缓存令牌的重要性评分。我们提出的随机注意力机制在每个注意力头内随机驱逐令牌，而不需要计算评分，结果显示其在多个模型和推理任务中表现优异。实验表明，提示是缓存中最脆弱的部分，而推理轨迹通过冗余自我保护，确保了模型所需信息的保留。'}}}, {'id': 'https://huggingface.co/papers/2609.04098', 'title': 'Why Gated DeltaNet Survives 4-Bit Quantization: NVFP4 W4A4 for the Recurrent Half of a Hybrid 27B LLM', 'url': 'https://huggingface.co/papers/2609.04098', 'abstract': "Abstract Fully quantizing hybrid LLMs—including recurrent Gated DeltaNet layers—to 4-bit NVFP4 preserves accuracy across long-context and reasoning benchmarks by localizing outliers and exploiting robust delta-rule dynamics.  Generated by thinkingmachines/Inkling-Small Hybrid LLMs pair softmax attention with linear-attention layers such as Gated DeltaNet (GDN), whose recurrent state summarizes the context in fixed size. Early community 4-bit quantizations of Qwen3.8-27B (48 GDN layers, 16 attention layers) left the GDN block in 8- or 16-bit precision -- especially its decay and write-strength gates -- on the intuition that errors in a recurrence accumulate over long contexts. We test that intuition by building Minima: NVFP4 W4A4 on all 496 linear layers, GDN included. Across perplexity at 4K/32K, MMLU-Pro, GSM8K, AIME'25, GPQA-Diamond, LiveCodeBench, and RULER retrieval to 64K, Minima matches BF16 within seed noise (5-task average -0.52) while being the smallest (17.5 GiB) and fastest-prefill (+14-19%) recipe we compare, and its 32K perplexity gap shrinks with position. A four-part mechanism study explains why: (i) NVFP4's 16-element block scaling localizes the residual stream's extreme outliers, equalizing activation error across layer roles; (ii) the supposedly fragile gate projections are the least sensitive -- softplus/exponential and sigmoid parameterizations compress ~11% GEMM error to ~2% output error; (iii) the delta-rule recurrence holds injected noise at a flat plateau over 32K tokens and forgets a state impulse within hundreds of steps, because each write overwrites the state along the current key direction; (iv) the per-token quantization cost washes out with context instead of compounding. We also repair a global-scale mismatch that arises when per-module-calibrated NVFP4 checkpoints are served by kernels that fuse those modules into one GEMM, and show calibrated FP8 KV-cache scales are performance-free. The result: a practical recipe -- quantize everything, ship KV scales -- and a mechanistic account of why the recurrent half of a hybrid LLM is the easy half to quantize. Checkpoint: https://huggingface.co/minima-ai/mnma_qwen3.8_27b_nvfp4", 'score': 60, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '9d06359ce95aa157', 'pdf_title_img': 'assets/pdf/title_img/2609.04098.jpg', 'data': {'categories': ['#optimization', '#training', '#long_context', '#inference', '#reasoning', '#architecture', '#open_source'], 'emoji': '⚡', 'ru': {'title': 'Квантизируй всё: рекуррентные слои легче сжимать, чем внимание', 'desc': 'В этой работе исследуется полная квантизация гибридных больших языковых моделей до 4-битного формата NVFP4, включая слои Gated DeltaNet с рекуррентной структурой. Авторы показывают, что благодаря локализации выбросов в остаточном потоке и устойчивости дельта-правила к накоплению ошибок, можно квантизировать все 496 линейных слоев без потери точности на задачах длинного контекста и рассуждений. Механизм работы основан на четырёх ключевых наблюдениях: блочное масштабирование NVFP4 выравнивает ошибки активаций, вентили остаются устойчивыми к квантованию, рекуррентное состояние забывает информацию за сотни шагов, и затраты на квантизацию не накапливаются с длиной контекста. Результат даёт практический рецепт: полная квантизация всех весов и активаций при сохранении масштабов KV-кеша, обеспечивая 17.5 ГБ памяти и ускорение инференса на 14-19%.'}, 'en': {'title': 'Quantizing Hybrid LLMs: Small, Fast, and Accurate!', 'desc': 'This paper discusses a method for fully quantizing hybrid large language models (LLMs) to 4-bit precision while maintaining their accuracy in various benchmarks. The authors introduce Minima, a model that utilizes NVFP4 quantization across all layers, including Gated DeltaNet (GDN), which helps in managing long-context dependencies effectively. They demonstrate that their approach localizes outliers and reduces error accumulation, making the quantization process more robust. The findings suggest that quantizing the recurrent components of LLMs is feasible and can lead to smaller, faster models without significant loss in performance.'}, 'zh': {'title': '量化混合大语言模型的实用方案', 'desc': '这篇论文介绍了一种将混合大语言模型（LLM）完全量化为4位的技术，称为NVFP4。通过局部化异常值和利用稳健的增量规则动态，该方法在长上下文和推理基准测试中保持了准确性。研究表明，Gated DeltaNet（GDN）层的递归状态能够以固定大小总结上下文，从而提高了模型的性能。最终，论文提出了一种实用的量化方案，强调了混合LLM递归部分的量化相对简单。'}}}, {'id': 'https://huggingface.co/papers/2609.04172', 'title': 'Rethinking On-Policy Distillation of Large Language Models II: One Training Example', 'url': 'https://huggingface.co/papers/2609.04172', 'abstract': "Abstract On-policy distillation improves over hundreds of steps from a single query by rapidly covering teacher states, yet student alignment remains slow, indicating the method is algorithm-starved rather than data-starved.  Generated by thinkingmachines/Inkling-Small On-policy distillation (OPD) combines student-generated rollouts with dense token-level supervision from a teacher. Existing work has mainly studied its algorithmic behavior, leaving the role of training data unclear. We examine this role at the data-minimal limit by training on a single query. One-shot OPD keeps improving for hundreds of steps and recovers most of full-data OPD's gain across task domains and model families. We explain this result through the states visited during training and the rate at which the student aligns with the teacher. We measure state coverage, the fraction of the states full-data OPD visits that a query set's rollouts reach. A single query already reaches \\(71.5\\%\\), most of it within the first 100 steps. Adding semantically distinct queries raises coverage and validation accuracy together, until 16 queries reach \\(98.9\\%\\) and match full-data training. Yet alignment slows at a similar pace whether OPD trains on one query or the whole dataset, and even a fixed set of states takes hundreds of steps to absorb. OPD is therefore data-overfed but algorithm-starved. Its rollouts quickly expose broad supervision, while the student absorbs that supervision increasingly slowly. The state-coverage result extends to multi-teacher OPD, where 16 semantically diverse queries per domain match full-data MOPD. As a further stress test, content-light templates and off-domain WildChat queries also approach the real-query baseline. Task content and induced state coverage can therefore come apart. We hope these findings direct future work toward the step efficiency of OPD, and prompt a re-examination of the data and the mechanisms behind its recent successes in frontier post-training.", 'score': 56, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '59c94e66f5affec6', 'authors': ['Zixuan Fu', 'Bingxiang He', 'Yuxin Zuo', 'Haohuan Huang', 'Jinqian Zhang', 'Ruhang Xiao', 'Cheng Qian', 'Qinyu Luo', 'Huan-ang Gao', 'Yudong Wang', 'Zhiyuan Liu', 'Ning Ding', 'Chaojun Xiao'], 'affiliations': ['Johns Hopkins University', 'Northeastern University', 'Tsinghua University', 'University of Chinese Academy of Sciences', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.04172.jpg', 'data': {'categories': ['#optimization', '#training', '#alignment', '#small_models'], 'emoji': '🚀', 'ru': {'title': 'Один запрос лучше ста: OPD ограничена скоростью обучения, а не данными', 'desc': 'В работе исследуется on-policy distillation (OPD) — метод, при котором student модель учится на основе rollouts, сгенерированных самостоятельно, и плотного token-level supervision от teacher модели. Авторы показывают, что обучение даже на одном примере позволяет модели улучшаться сотни шагов, покрывая 71.5% состояний, которые посещает полный датасет. Ключевой вывод: OPD ограничена не количеством данных, а скоростью обучения student модели — alignment происходит медленно независимо от размера датасета. Исследование предполагает, что будущие улучшения должны сосредоточиться на ускорении процесса обучения student модели, а не на расширении объёма данных для обучения.'}, 'en': {'title': 'Maximizing Learning Efficiency with Minimal Queries in OPD', 'desc': "This paper investigates the effectiveness of on-policy distillation (OPD) in machine learning, particularly focusing on how a single query can lead to significant improvements in student model performance over many training steps. The authors find that while OPD can cover a large portion of the teacher's state space quickly, the alignment of the student model with the teacher remains slow, indicating that the algorithm needs enhancement rather than more data. They demonstrate that even with just one query, the student can achieve substantial state coverage and validation accuracy, but the alignment process is still inefficient. The study suggests that future research should focus on improving the efficiency of OPD algorithms and understanding the relationship between training data and model performance."}, 'zh': {'title': '在线策略蒸馏：数据过剩但算法不足', 'desc': '本论文探讨了在单一查询下的在线策略蒸馏（OPD）如何在数百个步骤中持续改进。研究发现，尽管学生模型的对齐速度较慢，但其状态覆盖率在训练初期就能达到71.5%。通过增加语义上不同的查询，状态覆盖率和验证准确率均得到了提升，最终16个查询的覆盖率达到了98.9%。然而，无论是使用单一查询还是整个数据集，学生模型的对齐速度都没有显著变化，表明OPD在数据上过度供给但在算法上却存在不足。'}}}, {'id': 'https://huggingface.co/papers/2609.04196', 'title': 'Puffin-World: Scaling a Unified Multimodal Model with Native 3D World States', 'url': 'https://huggingface.co/papers/2609.04196', 'abstract': 'Abstract Puffin-World is a unified multimodal framework that jointly models physics, geometry, and appearance for physically consistent 3D world generation, reconstruction, and closed-loop exploration.  Generated by thinkingmachines/Inkling-Small We propose Puffin-World, a unified multimodal architecture that integrates physical understanding, spatial simulation, and 3D world generation and reconstruction without relying on external offline modules. To reliably construct and interact with 3D worlds, our framework jointly models three native world states: physics (gravity field and latitude), geometry (depth), and appearance (image), together with a unified Omni-Camera representation that supports diverse tasks and flexible motions. Beyond modeling these states, we introduce a strategy for propagating physical dynamics across future frames. By grounding absolute camera properties in the real world, Puffin-World enables physically consistent and visually stable world generation. We further couple appearance and geometry within a single generative process, jointly synthesizing each future view and reconstructing its underlying geometry. This unified paradigm enables interleaved closed-loop applications requiring synergy across multiple tasks, including mimic and self-calibrated world exploration. To scale Puffin-World to complex scenarios, we construct Puffin-16M, comprising 15 million vision-language-camera triplets and 1 million trajectories featuring various and challenging motions. To foster further research in this area, we released the code, models, and datasets.', 'score': 48, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'cd2905d0e4be6f44', 'authors': ['Kang Liao', 'Yihang Luo', 'Xiao-Ming Wu', 'Linyi Jin', 'Size Wu', 'Chunyu Lin', 'Yao Zhao', 'Fei Wang', 'Wei Li', 'Chen Change Loy'], 'affiliations': ['ACE Robotics', 'Beijing Jiaotong University', 'S-Lab, Nanyang Technological University', 'University of Michigan'], 'pdf_title_img': 'assets/pdf/title_img/2609.04196.jpg', 'data': {'categories': ['#dataset', '#open_source', '#3d', '#multimodal', '#video'], 'emoji': '🐧', 'ru': {'title': 'Единая физически согласованная генерация 3D-миров через совместное моделирование физики, геометрии и внешнего вида', 'desc': 'Puffin-World — это единая мультимодальная архитектура, которая совместно моделирует физику, геометрию и внешний вид для физически корректной генерации и реконструкции 3D-миров. Фреймворк интегрирует понимание физических законов, пространственную симуляцию и синтез изображений в единый процесс без использования внешних предварительно обученных модулей. Ключевой инновацией является введение стратегии распространения физической динамики на будущие кадры с использованием унифицированного представления камеры, что обеспечивает физическую согласованность. Для масштабирования подхода авторы создали датасет Puffin-16M из 15 миллионов триплетов видение-язык-камера, который позволяет моделировать сложные сценарии с разнообразными движениями.'}, 'en': {'title': 'Unified 3D World Generation with Puffin-World', 'desc': 'Puffin-World is a new framework that combines physics, geometry, and appearance to create and explore 3D worlds in a consistent way. It models three key aspects: the physical forces acting on objects, the shapes and sizes of those objects, and how they look visually. The framework uses a special camera system to handle different tasks and movements, allowing for realistic interactions with the 3D environment. Additionally, it includes a method to predict how physical dynamics change over time, making it suitable for complex scenarios and applications.'}, 'zh': {'title': '统一多模态框架，构建物理一致的3D世界', 'desc': 'Puffin-World是一个统一的多模态框架，能够同时建模物理、几何和外观，从而生成和重建物理一致的3D世界。该框架不依赖外部模块，集成了物理理解、空间模拟和3D世界生成。它通过联合建模物理状态、几何形状和外观，支持多种任务和灵活的运动。Puffin-World还引入了一种策略，用于在未来帧中传播物理动态，实现视觉稳定的世界生成。'}}}, {'id': 'https://huggingface.co/papers/2609.04201', 'title': 'Scal3R: Learning Efficient Multi-Relative Pose Query for Scalable Online 3D Reconstruction', 'url': 'https://huggingface.co/papers/2609.04201', 'abstract': "Abstract Scal3R improves long-video online 3D reconstruction by querying multi-reference relative poses with lightweight tokens and pose-graph optimization, reducing drift without retraining the backbone.  Generated by thinkingmachines/Inkling-Small Online 3D reconstruction models perform poorly on long videos. This happens because regressing poses relative to a fixed first-frame anchor forces extrapolation far beyond the training distribution. Small drifts accumulate and amplify into significant geometric collapse. However, we observe that per-frame depth remains stable throughout this failure. The backbone's local geometry remains intact; only the global pose head breaks down. Motivated by this decoupling, we introduce Scal3R. This approach reformulates online reconstruction as multi-reference relative pose querying. We use lightweight learnable tokens, which make up about ~1% of the parameters, and inject them into a completely frozen backbone via asymmetric attention. This setup queries poses relative to multiple past keyframes. An online pose-graph optimization system with loop closure suppresses long-range drift. Scal3R reaches convergence in 8 hours on a single GPU. It reduces the average ATE by over 60% on KITTI compared to the online baseline. It also achieves state-of-the-art performance across Virtual KITTI, Sintel, TUM-Dynamic, ScanNet, and 7-Scenes. Project page: https://linjohnss.github.io/scal3r/", 'score': 25, 'issue_id': 3216, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '56f707f35932c15f', 'authors': ['Chin-Yang Lin', 'Yang-Che Sun', 'Cheng Sun', 'Fu-En Yang', 'Min-Hung Chen', 'Yen-Yu Lin', 'Wei-Chen Chiu', 'Yu-Lun Liu'], 'affiliations': ['Department of Computer Science, National Yang Ming Chiao Tung University', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.04201.jpg', 'data': {'categories': ['#3d', '#video'], 'emoji': '🎬', 'ru': {'title': 'От абсолютных поз к многоопорным: стабильная реконструкция длинных видео без дрейфа', 'desc': 'Scal3R решает проблему накопления ошибок при трёхмерной реконструкции длинных видео, используя многоопорный подход к оценке относительных поз вместо экстраполяции от первого кадра. Метод использует лёгкие обучаемые токены (~1% параметров), внедряемые через асимметричное внимание в замороженный энкодер, что позволяет запрашивать позы относительно нескольких ключевых кадров из прошлого. Оптимизация графа поз с обнаружением циклических замыканий подавляет долгосрочный дрейф без переобучения основной сети. Метод сокращает среднюю абсолютную ошибку позиционирования более чем на 60% и достигает лучших результатов на множестве бенчмарков.'}, 'en': {'title': 'Revolutionizing Long-Video 3D Reconstruction with Scal3R', 'desc': 'Scal3R is a method that enhances the online 3D reconstruction of long videos by using a novel approach to pose estimation. It addresses the problem of drift that occurs when poses are estimated relative to a fixed first-frame anchor, which can lead to significant errors over time. By employing lightweight tokens and a pose-graph optimization system, Scal3R effectively queries multiple past keyframes to maintain accuracy without needing to retrain the model. This results in a substantial reduction in average Absolute Trajectory Error (ATE) and achieves top performance across various benchmark datasets.'}, 'zh': {'title': 'Scal3R：提升长视频3D重建的创新方法', 'desc': 'Scal3R是一种改进长视频在线3D重建的方法，通过查询多参考相对姿态和使用轻量级的学习令牌，结合姿态图优化，减少了漂移而无需重新训练主干网络。传统的在线3D重建模型在长视频上表现不佳，主要是因为相对于固定的第一帧锚点回归姿态会导致超出训练分布的外推。Scal3R通过将在线重建重新构造为多参考相对姿态查询，利用轻量级的学习令牌来优化姿态，从而有效抑制长距离漂移。该方法在单个GPU上仅需8小时即可收敛，并在多个数据集上实现了最先进的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.04034', 'title': 'Editable Visual Design', 'url': 'https://huggingface.co/papers/2609.04034', 'abstract': "Abstract A coding agent guided by a vision-language model generates editable layered designs by synthesizing isolated visual assets and iteratively refining native HTML/CSS layouts.  Generated by thinkingmachines/Inkling-Small While diffusion base models such as GPT-Image-2 and Nano-Banana exhibit remarkable visual expressiveness, their end-to-end generation inherently yields flattened bitmaps with error-prone text, precluding layer-wise post-editing. Conversely, code-based visual generation via Coding Agents provides precise layout control and decoupled layers, yet remains constrained by a lack of global aesthetic intuition and the difficulty of coding complex visual assets.   To address this, we propose Editable Visual Design, a new paradigm driven by a Coding Agent. We designate the VLM as the ``creative brain'' for requirement comprehension, task planning, and aesthetic judgment, while utilizing the image generation model as an on-demand ``visual world simulator'' to synthesize standalone visual assets. Operating under an ``imagine first, then act'' closed-loop workflow, the agent generates isolated assets, writes native HTML/CSS, and iteratively refines the design against visual rendering feedback.   Furthermore, Agent Design Replay faithfully reproduces the creative and reasoning trajectory akin to that of professional human designers. Ultimately, the system delivers editable artifacts with decoupled layers and real text, enabling users to perform intuitive mouse dragging and layout adjustments on a graphical user interface. Validations on posters, infographics, and other scenarios show that this paradigm successfully achieves both refined aesthetics and production-grade editability.", 'score': 24, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '38818023e230f5f7', 'authors': ['Junyan Ye', 'Wei Liu', 'Dongzhi Jiang', 'Zichen Wen', 'HaoDong Li', 'Zhutao Lv', 'Jiaxin Lin', 'Jinhua Yu', 'Jun He', 'Zilong Huang', 'Rui Chen', 'Weijia Li'], 'affiliations': ['Shanghai Jiao Tong University', 'Sun Yat-sen University', 'Tencent Hunyuan', 'The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.04034.jpg', 'data': {'categories': ['#agents', '#multimodal', '#cv', '#reasoning', '#open_source'], 'emoji': '🎨', 'ru': {'title': 'Агент дизайна: сочетание творчества VLM и точности кода', 'desc': 'В работе предлагается новая парадигма для генерации редактируемых графических дизайнов, где vision-language model (VLM) выступает в роли «творческого мозга», направляющего кодирующего агента. Система сочетает преимущества диффузионных моделей для синтеза изолированных визуальных элементов с точностью code-based генерации HTML/CSS разметки. Агент работает по циклическому принципу «сначала представь, потом действуй», итеративно уточняя дизайн на основе визуальной обратной связи. Результат — редактируемые артефакты с разделёнными слоями и настоящим текстом, которыми пользователи могут манипулировать через графический интерфейс.'}, 'en': {'title': 'Empowering Design with Editable Visual Generation', 'desc': 'This paper introduces a new approach called Editable Visual Design, which uses a Coding Agent guided by a vision-language model (VLM) to create layered designs that can be easily edited. Unlike traditional models that produce flat images, this method allows for precise control over layout and aesthetics by generating isolated visual assets and writing native HTML/CSS. The Coding Agent operates in a closed-loop system, where it first imagines the design and then acts on it, refining the output based on visual feedback. The result is a system that produces editable designs with separate layers and real text, making it user-friendly for adjustments and enhancements.'}, 'zh': {'title': '可编辑视觉设计的新范式', 'desc': '本文提出了一种新的可编辑视觉设计范式，利用编码代理和视觉语言模型（VLM）生成可编辑的分层设计。编码代理负责生成独立的视觉资产，并编写原生HTML/CSS，同时根据视觉反馈迭代优化设计。与传统的图像生成模型不同，这种方法允许用户在图形用户界面上直观地进行布局调整。通过在海报和信息图等场景中的验证，证明该系统能够实现精美的美学效果和高质量的可编辑性。'}}}, {'id': 'https://huggingface.co/papers/2609.02367', 'title': 'The Missing Temporal Link: Temporal Context Routing for Script-Driven Audio-Video Generation', 'url': 'https://huggingface.co/papers/2609.02367', 'abstract': "Abstract Temporal Context Routing improves script-aligned timing of shots and dialogue in joint audio-video generation by mapping structured script timing onto shared video-audio temporal axes.  Generated by thinkingmachines/Inkling-Small Joint audio-video generation models have made substantial progress in visual quality and audio-visual synchronization. However, they still provide limited control over when shot transitions occur and dialogue is spoken. This limitation constrains their application in script-driven content creation, where timing errors can undermine narrative coherence and the viewing experience. Current joint generators align video and audio representations on a shared temporal axis, yet the precise timing of shots and dialogue specified in a structured prompt is encoded only in the prompt's text representation and remains unaligned with the temporal coordinates of either modality. Consequently, video and audio may remain synchronized with each other while both fail to follow the script timeline. This mismatch motivates us to extend temporal alignment beyond video and audio to include the structured script. We therefore introduce Temporal Context Routing (TCR), which maps the script timing onto the shared temporal axis of video and audio generation and routes each prompt's guidance to the corresponding positions in both modalities. Compared with the baseline on 200 test scripts, TCR reduces Shot Boundary MAE by 96%, from 1.11 s to 0.042 s, and raises Dialogue Acc@0.5 s from 28.3% to 84.1%. TCR achieves these improvements while maintaining visual quality and audio-visual synchronization comparable to those of the baselines. A user study further shows that participants prefer TCR on all five evaluated dimensions.", 'score': 19, 'issue_id': 3215, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '617eca37fab926f5', 'authors': ['Yichen Liu', 'Quanwei Zhang', 'Haozhe Wang', 'Donghao Zhou', 'Xiaojie Li', 'Yang Shi', 'Jiaming Liu', 'Ruihua Huang', 'Yingtian Zou', 'Daquan Zhou'], 'affiliations': ['CUHK', 'HKUST', 'PKU', 'Qwen Applications', 'SJTU'], 'pdf_title_img': 'assets/pdf/title_img/2609.02367.jpg', 'data': {'categories': ['#multimodal', '#video', '#training', '#audio'], 'emoji': '🎬', 'ru': {'title': 'Маршрутизация временного контекста для точного синхронизации сценария с видео и аудио', 'desc': 'В статье предлагается метод Temporal Context Routing (TCR) для улучшения синхронизации видео и аудио при совместной генерации контента на основе сценариев. Основная идея заключается в том, что текущие модели совместной генерации синхронизируют видео и аудио между собой, но игнорируют временные метки из структурированного сценария, что приводит к рассинхронизации с заданным сценарием. Предложенный метод отображает временные координаты сценария на общую временную ось видео и аудио, маршрутизируя подсказки модели в соответствующие позиции обеих модальностей. Экспериментальные результаты показывают значительное улучшение: ошибка определения границ кадров снизилась на 96%, а точность синхронизации диалогов повысилась с 28.3% до 84.1%, при этом качество визуализации и аудиовизуальная синхронизация остались на уровне базовых моделей.'}, 'en': {'title': 'Aligning Script Timing with Audio-Video Generation', 'desc': 'The paper introduces Temporal Context Routing (TCR), a method that enhances the timing of shots and dialogue in audio-video generation by aligning them with a structured script. Traditional models struggle with precise timing, leading to inconsistencies between the script and the generated content. TCR addresses this by mapping script timing onto a shared temporal axis for both video and audio, ensuring that transitions and dialogue occur as intended. The results show significant improvements in timing accuracy while maintaining high visual and audio quality, making TCR a valuable tool for script-driven content creation.'}, 'zh': {'title': '时间上下文路由：提升音视频生成的时间对齐', 'desc': '本文提出了一种名为时间上下文路由（TCR）的方法，旨在改善音视频生成中的镜头和对话的时间对齐。传统的音视频生成模型在视觉质量和音视频同步方面取得了显著进展，但在镜头切换和对话时机的控制上仍然有限。TCR通过将结构化脚本的时间映射到共享的音视频时间轴上，解决了脚本时间与音视频生成之间的对齐问题。实验结果表明，TCR显著提高了镜头边界的准确性和对话的及时性，同时保持了与基线模型相当的视觉质量和音视频同步。'}}}, {'id': 'https://huggingface.co/papers/2609.04131', 'title': 'Beyond Retrieval: Progressive Latent Memory Evolution for Streaming Video Understanding', 'url': 'https://huggingface.co/papers/2609.04131', 'abstract': 'Abstract LatentStream introduces a progressive latent working memory framework that internalizes streaming visual evidence into compact evolving tokens for continuous reasoning.  Generated by thinkingmachines/Inkling-Small Streaming video understanding requires multimodal large language models (MLLMs) to process continuous visual inputs and respond to user queries under strict causality and bounded memory. Existing approaches typically compress historical observations into an external memory bank and retrieve query-relevant evidence as additional visual context. Though effective, this store-and-retrieve paradigm keeps historical evidence as external visual context, preventing it from being internalized into a compact, evolving latent memory that can continuously guide streaming reasoning. To bridge this gap, we introduce LatentStream, a progressive latent working memory framework that shifts streaming memory from store-and-retrieve to retrieve-and-internalize. Specifically, LatentStream comprises three coordinated components. First, Query-agnostic Hierarchical Streaming Memory organizes visual history into short-, mid-, and long-term levels under a fixed memory budget through Jenks-guided adaptive consolidation. Once a query arrives, Hierarchical Latent Memory Evolution equips groups of latent memory tokens with progressively expanding memory receptive fields, enabling them to iteratively retrieve historical evidence from their corresponding scopes and internalize it into a compact, fixed-length latent memory. Finally, Progressive Confidence-guided Latent Memory Optimization constructs a hierarchical progression reward from group-wise predictive entropy and jointly refines the latent memory tokens and retrieved evidence, encouraging increasingly confident streaming reasoning. Extensive experiments demonstrate that LatentStream achieves new state-of-the-art results on existing online and offline video benchmarks.', 'score': 17, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '46070ff122342e06', 'authors': ['Hongyu Qu', 'Guangming Yao', 'Ling Xing', 'Xiaobin Hu', 'Rongxing Ding', 'Guibin Zhang', 'Fan Zhang', 'Yi Yuan', 'Xiangbo Shu', 'Shuicheng Yan'], 'affiliations': ['Ant Group', 'Nanjing University of Science and Technology', 'National University of Singapore', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.04131.jpg', 'data': {'categories': ['#multimodal', '#video', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Интернализированная память: от хранилища к скрытому рассуждению', 'desc': 'LatentStream предлагает прогрессивную систему скрытой рабочей памяти, которая преобразует непрерывный видеопоток в компактные эволюционирующие токены для рассуждений. Вместо традиционного подхода, когда исторические данные хранятся во внешней памяти и извлекаются по запросу, LatentStream интернализует эту информацию в латентные токены памяти. Система организует визуальную историю на трёх уровнях (краткосрочная, среднесрочная и долгосрочная память) и итеративно пополняет эти токены релевантной информацией из разных временных масштабов. Фреймворк достигает новых результатов на бенчмарках видеопонимания, обеспечивая более уверенные и эффективные рассуждения над потоком данных.'}, 'en': {'title': 'Revolutionizing Streaming Memory with LatentStream', 'desc': 'LatentStream presents a new framework for processing streaming visual data by creating a progressive latent working memory. This approach allows the system to internalize visual evidence into compact tokens, enhancing continuous reasoning capabilities. Unlike traditional methods that rely on external memory banks, LatentStream integrates historical observations directly into its memory, facilitating more efficient retrieval and internalization. The framework includes components for organizing memory hierarchically, evolving latent memory tokens, and optimizing memory through confidence-guided techniques, leading to improved performance on video understanding tasks.'}, 'zh': {'title': '流式推理的新纪元：LatentStream', 'desc': 'LatentStream提出了一种渐进式潜在工作记忆框架，将流式视觉证据内化为紧凑的演变标记，以实现持续推理。该框架通过三大协调组件，优化了流式记忆的存储与内化过程。首先，层次化流式记忆将视觉历史组织为短期、中期和长期记忆。其次，层次化潜在记忆演化使得记忆标记能够迭代检索历史证据，并将其内化为固定长度的潜在记忆，从而提升推理的准确性和效率。'}}}, {'id': 'https://huggingface.co/papers/2609.04083', 'title': 'CORE: Improving Compositional Reasoning in MLLM Embedding via Reranker Distillation', 'url': 'https://huggingface.co/papers/2609.04083', 'abstract': "Abstract CORE distills compositional ranking judgments from a cross-attentive reranker into an embedding model via synthesized multi-level candidates and a Rank-KL objective, improving compositional retrieval without degrading standard performance.  Generated by thinkingmachines/Inkling-Small MLLM-based embedding models remain limited in compositional retrieval, often failing to distinguish scenes containing the same concepts but different attribute-object bindings. Yet the same backbone can resolve such distinctions when used as a cross-attentive reranker, motivating us to distill its compositional judgments into the embedding model. We propose CORE, which synthesizes candidate lists spanning five compositional matching levels and introduces a Rank-KL objective that trains the embedding model to reproduce the reranker's fine-grained ranking. We further introduce a graded evaluation protocol and compare contrastive learning, pairwise CoSENT, and listwise Rank-KL under the same data and tuning budget. Our comparison shows that both CoSENT and Rank-KL use the multi-level supervision more effectively than contrastive learning, with Rank-KL achieving the strongest overall performance. Across three compositional reasoning benchmarks (COLA, SUGARCREPE++, NEGBENCH), CORE-RERANKER-8B achieves an 82.7% total average, outperforming Jina-Reranker by 10.7 points, while CORE-EMBED-8B achieves the best total average (0.666) among all evaluated embedding models. The improvements transfer to the MCMR benchmark without sacrificing retrieval performance on COCO and Flickr30K.", 'score': 11, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '025024237c3df6c0', 'authors': ['Tingyu Song', 'Mingxin Li', 'Yanzhao Zhang', 'Dingkun Long', 'Chu Liu', 'Pengjun Xie', 'Yilun Zhao', 'Shu Wu'], 'affiliations': ['Alibaba Group', 'CASIA', 'University of Chinese Academy of Sciences', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2609.04083.jpg', 'data': {'categories': ['#transfer_learning', '#optimization', '#training', '#multimodal', '#rag', '#reasoning', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Дистилляция композиционных суждений в эмбеддинги для улучшения семантического поиска', 'desc': 'В работе предложен метод CORE для улучшения композиционного поиска путём дистилляции знаний от кросс-аттентивного переранжира в модель эмбеддингов. Авторы синтезируют кандидаты на пяти уровнях композиционного соответствия и используют новый Rank-KL objective для обучения модели эмбеддингов воспроизводить тонкое ранжирование переранжира. Предложена процедура оценки композиционной способности, которая сравнивает контрастное обучение, попарный CoSENT и списковый Rank-KL при одинаковом бюджете данных и настроек. Экспериментальные результаты показывают, что CORE достигает наилучшей производительности на трёх бенчмарках (COLA, SUGARCREPE++, NEGBENCH) и хорошо переносится на другие задачи без потери качества стандартного поиска.'}, 'en': {'title': 'CORE: Enhancing Compositional Retrieval with Rank-KL Distillation', 'desc': "The paper introduces CORE, a method that enhances compositional retrieval in machine learning by distilling ranking judgments from a cross-attentive reranker into an embedding model. It addresses the limitations of existing embedding models that struggle to differentiate between scenes with similar concepts but different attributes. CORE synthesizes candidate lists across multiple compositional levels and employs a Rank-KL objective to train the embedding model to mimic the reranker's detailed ranking. The results show that CORE significantly outperforms other methods in compositional reasoning tasks while maintaining strong standard retrieval performance."}, 'zh': {'title': 'CORE：提升组合检索的新方法', 'desc': 'CORE模型通过合成多层候选项和Rank-KL目标，从交叉注意力重排序器中提取组合排名判断，提升了组合检索的效果，而不降低标准性能。现有的基于MLLM的嵌入模型在组合检索中表现有限，常常无法区分具有相同概念但属性-对象绑定不同的场景。CORE通过合成跨越五个组合匹配层次的候选列表，并引入Rank-KL目标，训练嵌入模型重现重排序器的细粒度排名。我们的实验表明，Rank-KL在多个组合推理基准上表现优异，超越了其他对比学习方法。'}}}, {'id': 'https://huggingface.co/papers/2608.27831', 'title': 'RealSWE: A Compositional Evaluation of Coding Agents under Realistic User Requests', 'url': 'https://huggingface.co/papers/2608.27831', 'abstract': "Abstract Real-world coding requests are shorter and more casual than benchmark tasks, and explicitly stating desired behavior and motivation improves LLM software engineering performance.  Generated by thinkingmachines/Inkling-Small Coding agents are now commonly evaluated on the SWE-bench family of benchmarks, whose tasks are built from curated GitHub issues: long, structured, and information-rich. Real user requests, however, are typically far shorter and less structured. To characterize this gap, we define a six-category information taxonomy and four dimensions of linguistic style, and apply them to real user prompts from SWE-chat and problem statements from SWE-bench Verified and Pro. We find that requests carrying only a problem statement, alone or with limited additional context, account for 88% of real prompts but just 7% of benchmark problems. Furthermore, 87% of real prompts are casually written whereas 94% of benchmark problems are formal. Guided by these observations, we introduce RealSWE, 381 multi-variant task families derived from SWE-bench Verified and Pro. Variants within each family share the same underlying task and gold patch while differing only in information composition and linguistic style. Evaluating seven contemporary LLMs with RealSWE, we find that i) realistic inputs reduce resolution rates by 6.4 pp on average and can change model rankings. Controlled analysis further shows that ii) including Desired Behavior and Motivation significantly affects performance, whereas Environment Information and Reproduction Steps merely add tokens without measurable benefit; iii) linguistic style has only small, model-dependent effects. These findings provide actionable guidance for users and agents: explicitly stating the desired behavior and motivation, which most real prompts omit, substantially improves the LLM's software engineering performance.", 'score': 10, 'issue_id': 3215, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '837cb6a54d2646b1', 'authors': ['Gyuhyeong Kim', 'Hyojung Gwon', 'Jeonghyeon Kim', 'Kyuhong Shim', 'Sunjae Lee'], 'affiliations': ['Sungkyunkwan University'], 'pdf_title_img': 'assets/pdf/title_img/2608.27831.jpg', 'data': {'categories': ['#plp', '#dataset', '#benchmark'], 'emoji': '🔧', 'ru': {'title': 'Разговорный тон и явные цели улучшают понимание LLM в разработке кода', 'desc': 'В статье исследуется разрыв между реальными запросами пользователей и эталонными задачами в оценке LLM для разработки программного обеспечения. Авторы провели анализ текстов реальных запросов из SWE-chat и обнаружили, что они значительно короче и менее структурированы, чем задачи из SWE-bench: 88% реальных запросов содержат только описание проблемы, а 87% написаны в casual стиле. Для изучения влияния структуры и стиля текста на производительность, исследователи создали RealSWE — набор из 381 семейства задач с контролируемыми вариациями информационного содержания и лингвистического стиля. Эксперименты показали, что включение явного описания желаемого поведения и мотивации значительно улучшает производительность LLM, в то время как другие элементы информации имеют незначительный эффект.'}, 'en': {'title': 'Bridging the Gap: Real Requests vs. Benchmark Tasks in LLM Performance', 'desc': 'This paper highlights the difference between real-world coding requests and traditional benchmark tasks used to evaluate coding agents. It identifies that real user requests are often shorter, less structured, and more casual compared to the long and formal tasks found in benchmarks like SWE-bench. The authors introduce RealSWE, a new set of tasks that mimic real user prompts, showing that including explicit desired behavior and motivation can significantly enhance the performance of large language models (LLMs) in software engineering tasks. The study reveals that most real prompts lack detailed context, which impacts the effectiveness of LLMs, suggesting that clearer communication can lead to better outcomes.'}, 'zh': {'title': '明确期望，提升编码表现', 'desc': '这篇论文探讨了现实世界中的编码请求与基准任务之间的差异。研究发现，真实用户的请求通常更短、更随意，而基准任务则较长且结构化。通过定义信息分类和语言风格的维度，作者分析了真实请求与基准问题的不同。结果表明，明确表达期望行为和动机可以显著提高大型语言模型在软件工程中的表现。'}}}, {'id': 'https://huggingface.co/papers/2609.03293', 'title': 'PACE: Towards Surfacing Hidden Conflicts in User Requests', 'url': 'https://huggingface.co/papers/2609.03293', 'abstract': "Abstract PaceMaker uses coordinated agents to retrieve implicit contextual evidence and evaluate whether personalized requests conflict with hidden user constraints.  Generated by thinkingmachines/Inkling-Small Personalized assistants should not only comply with user requests but also assess whether those requests are appropriate given the user's current circumstances. However, prior work has primarily focused on accurately executing requests, overlooking the need for assistants to account for context and engage in conflict-based refusal. Furthermore, while existing work on conflict or safety detection relies on explicitly provided factors, real-world scenarios often involve implicit factors that must be retrieved from a knowledge base (KB). To this end, we introduce Personalized Assistants for Conflict Evaluation (PACE), a dataset for evaluating whether models can identify latent constraints, expressed as egocentric knowledge or events, that render seemingly reasonable user requests inappropriate. PACE pairs user requests grounded in well-defined personas with egocentric KB facts, requiring models to integrate contextual evidence to determine whether a request is conflicting. This implicit retrieval setting hinders the direct association between user requests and conflict-inducing knowledge, making it difficult for existing models to identify relevant user-specific facts. To address this challenge, we further propose PaceMaker, a multi-agent framework in which specialized agents coordinate across query reformulation, multi-hop graph traversal, and conflict-aware filtering to retrieve contextually decisive evidence. Experiments on PACE evaluate both evidence retrieval quality and conflict decision accuracy, showing that PaceMaker consistently outperforms existing approaches.", 'score': 9, 'issue_id': 3216, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '4c4002c29eb16b7a', 'authors': ['Yoojin Kim', 'Jihyoung Jang', 'Hyounghun Kim'], 'affiliations': ['Department of Computer Science and Engineering, POSTECH', 'Graduate School of Artificial Intelligence, POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2609.03293.jpg', 'data': {'categories': [], 'emoji': '🚫', 'ru': {'title': 'Умные помощники, которые говорят "нет" в нужный момент', 'desc': 'В работе предлагается датасет PACE и фреймворк PaceMaker для оценки персонализированных запросов пользователей с учётом скрытых ограничений. Система использует координированные агенты для поиска неявных контекстных доказательств из базы знаний и определения конфликтов между запросом и личными обстоятельствами пользователя. PaceMaker применяет специализированные агенты для переформулировки запросов, многошагового обхода графа знаний и фильтрации конфликтов. Экспериментальные результаты показывают, что предложенный подход превосходит существующие методы в извлечении релевантных доказательств и принятии обоснованных решений об отклонении конфликтных запросов.'}, 'en': {'title': 'Empowering Assistants to Navigate User Contexts and Conflicts', 'desc': "PaceMaker is a framework designed to enhance personalized assistants by enabling them to evaluate user requests against hidden constraints. It focuses on retrieving implicit contextual evidence from a knowledge base to determine if a request is appropriate given the user's situation. The framework introduces the PACE dataset, which helps assess models' abilities to identify latent constraints that may conflict with user requests. By employing coordinated agents for query reformulation and conflict-aware filtering, PaceMaker improves the accuracy of conflict detection in personalized assistance."}, 'zh': {'title': '个性化助手的冲突评估新方法', 'desc': 'PaceMaker 是一个多代理框架，旨在帮助个性化助手评估用户请求是否与隐含的用户约束相冲突。该研究提出了 PACE 数据集，用于评估模型能否识别潜在的约束，这些约束可能使看似合理的用户请求变得不合适。通过整合上下文证据，PaceMaker 能够在查询重构、多跳图遍历和冲突感知过滤之间进行协调，以检索出具有决定性的证据。实验结果表明，PaceMaker 在证据检索质量和冲突决策准确性方面均优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2609.03952', 'title': 'WorldReward: Reward Modeling for Camera-Conditioned World Models', 'url': 'https://huggingface.co/papers/2609.03952', 'abstract': 'Abstract WorldReward is a vision-language reward model that evaluates camera-conditioned world models by aligning video chunks with actions and aggregating preferences for both execution consistency and visual quality.  Generated by thinkingmachines/Inkling-Small Camera-conditioned world models generate interactive videos in which commanded actions should induce the expected scene changes while appearance, geometry, and temporal dynamics remain coherent. Existing rewards assess these requirements separately: geometry-based rewards estimate trajectory execution but cannot judge the visual quality of the executed motion, whereas image-based rewards measure frame quality without capturing action execution or temporal dynamics. We posit that a vision-language model (VLM) offers a shared reasoning space for relating actions to their visual outcomes. However, judging a complete long video against its full action sequence creates a lengthy, noisy context in which short-lived local action evidence can be missed or diluted. We present WorldReward, a VLM-based pairwise preference reward model that unifies action-consistency and visual-quality evaluation for camera-conditioned world models. WorldReward decomposes paired videos into action-aligned chunks, organizes each chunk into structured visual evidence, and aggregates chunk-level decisions by voting into separate video-level action and visual-quality preferences. To train it, we construct a large-scale reasoning-augmented preference dataset using structured judgments generated by a frontier VLM and refined through tool-based agent auditing and targeted human review. We further introduce WorldReward-Bench, a human-annotated benchmark measuring reward-model agreement with human preferences across action consistency, appearance quality, and motion quality. WorldReward achieves the highest agreement on all three dimensions, exceeding GPT-5.5 by 3.42, 1.45, and 3.56 percentage points, respectively. When used for RL post-training of HY-WorldPlay 1.5, it consistently improves both action execution and visual quality across short- to long-term horizons.', 'score': 9, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'c0f0fa6561995052', 'authors': ['Yibin Wang', 'Zehan Wang', 'Junshu Tang', 'Zhimin Li', 'Yujie Zhou', 'Jiazi Bu', 'Pengyang Ling', 'Feng Han', 'Zhixiong Zhang', 'Long Xing', 'Shengyuan Ding', 'Ziang Li', 'Cheng Jin', 'Yuhang Zang', 'Jiaqi Wang', 'Tianyu Pang'], 'affiliations': ['Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Tencent Hunyuan'], 'pdf_title_img': 'assets/pdf/title_img/2609.03952.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#rl', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Единая система оценки действий и визуального качества в генеративных видеомоделях', 'desc': 'WorldReward — это модель вознаграждения на основе vision-language model, которая оценивает мировые модели, обусловленные камерой, путём выравнивания видеофрагментов с действиями. Модель разбивает видео на короткие сегменты, выровненные по действиям, и структурирует визуальные признаки для каждого фрагмента. Система использует голосование на уровне фрагментов для агрегирования предпочтений относительно согласованности действий и визуального качества в целом видео. Исследователи создали большой датасет предпочтений с аннотациями VLM и человеческой проверкой, достигнув лучшего согласия с человеческими предпочтениями по всем трём метрикам качества.'}, 'en': {'title': 'Unifying Action and Visual Quality in Video Evaluation', 'desc': 'WorldReward is a novel vision-language reward model designed to evaluate camera-conditioned world models by aligning video segments with corresponding actions. It addresses the limitations of existing reward systems that separately assess geometric execution and visual quality, by integrating both aspects into a unified framework. The model decomposes videos into action-aligned chunks, allowing for structured evaluation of visual evidence and preferences. By leveraging a large-scale preference dataset and a benchmark for human agreement, WorldReward demonstrates superior performance in enhancing action execution and visual quality in reinforcement learning scenarios.'}, 'zh': {'title': '统一动作一致性与视觉质量的奖励模型', 'desc': 'WorldReward是一种视觉-语言奖励模型，用于评估基于相机的世界模型，通过将视频片段与动作对齐，并聚合执行一致性和视觉质量的偏好来实现。现有的奖励机制通常分别评估几何和图像质量，而WorldReward则通过将视频分解为与动作对齐的片段，统一了这两种评估。该模型利用视觉-语言模型（VLM）提供的共享推理空间，能够更好地关联动作与其视觉结果。通过构建大规模的偏好数据集和引入WorldReward-Bench基准，WorldReward在动作一致性、外观质量和运动质量方面都达到了最高的与人类偏好的一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.03563', 'title': 'FlashRender: Few-Step Generative Rendering via Camera-Controlled Video MeanFlow', 'url': 'https://huggingface.co/papers/2609.03563', 'abstract': 'Abstract FlashRender accelerates generative video rendering via representation alignment, a mean-flow objective, and on-policy distillation to achieve high-quality few-step camera-controlled syn
