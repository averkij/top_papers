fficiency and generalization capabilities. Extensive experiments show that our framework achieves strong performance on spatial manipulation tasks while exhibiting robust generalization. BridgeVLA++ further achieves state-of-the-art performance on two challenging memory-dependent manipulation benchmarks without sacrificing the data efficiency and generalization of the original BridgeVLA. In addition, BridgeVLA++ performs effectively in bimanual manipulation settings and is validated on an additional real-world robotic platform, demonstrating its scalability across tasks, environments, and robotic platforms. These results establish BridgeVLA++ as a unified 3D vision-language-action framework that simultaneously supports data-efficient learning, robust generalization, and effective memory-aware robot manipulation. Project website: https://bridgevla-plus.github.io/.", 'score': 7, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '8159bacb10bcdc20', 'authors': ['Peiyan Li', 'Yuze Zhu', 'Yixiang Chen', 'Qisen Ma', 'Yuan Xu', 'Jiabing Yang', 'He Guan', 'Yan Huang', 'Hongtao Wu', 'Xiao Ma', 'Tao Kong', 'Liang Wang', 'Tieniu Tan'], 'affiliations': ['ByteDance Seed', 'FiveAges', 'New Laboratory of Pattern Recognition (NLPR), Institute of Automation, Chinese Academy of Sciences', 'School of Artificial Intelligence, University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.05042.jpg', 'data': {'categories': ['#3d', '#robotics', '#training', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Память робота: от снимков к действиям с полным пониманием контекста', 'desc': 'В работе представлена система BridgeVLA++, которая объединяет предобученные визуально-языковые модели с пространственно-временной архитектурой памяти для управления роботом при манипуляции объектами в 3D-сценах. Ключевое улучшение заключается в добавлении единой памяти, которая позволяет модели анализировать историю наблюдений и взаимодействий во времени, сохраняя при этом эффективность обучения с ограниченными данными. Система демонстрирует отличную обобщаемость при распределительных сдвигах и достигает государственного уровня результатов на задачах, требующих памяти о предыдущих действиях. BridgeVLA++ успешно применяется к двурукой манипуляции и различным робототехническим платформам, что подтверждает её универсальность и масштабируемость.'}, 'en': {'title': 'Enhancing Robot Manipulation with Memory-Driven Vision-Language Models', 'desc': "This paper presents BridgeVLA++, an advanced framework for 3D robot manipulation that builds on the previous BridgeVLA model. It addresses key challenges in existing vision-language-action (VLA) methods, such as data inefficiency and poor generalization in changing environments. By incorporating a unified spatio-temporal memory architecture, BridgeVLA++ enhances the model's ability to remember past observations and reason about spatial and temporal contexts. The framework demonstrates strong performance in various manipulation tasks, achieving state-of-the-art results while maintaining data efficiency and generalization capabilities."}, 'zh': {'title': 'BridgeVLA++：高效记忆驱动的3D机器人操作框架', 'desc': '本论文提出了一种新的3D视觉-语言-动作（VLA）模型BridgeVLA++，旨在解决现有模型在数据稀缺和记忆依赖场景中的局限性。通过引入统一的时空记忆架构，BridgeVLA++能够有效地建模空间上下文和时间交互历史，从而增强模型的推理能力。实验结果表明，该框架在空间操作任务中表现出色，并在两个具有挑战性的记忆依赖操作基准上达到了最先进的性能。BridgeVLA++不仅在双手操作设置中表现良好，还在真实世界的机器人平台上得到了验证，展示了其在不同任务和环境中的可扩展性。'}}}, {'id': 'https://huggingface.co/papers/2608.04349', 'title': 'Poly-OPD: Heterogeneous Multi-Teacher On-Policy Distillation for Capability-Selectable Flow Models', 'url': 'https://huggingface.co/papers/2608.04349', 'abstract': "Abstract  Leading open text-to-image models often carry complementary strengths: one may lead on preference-aligned aesthetics while another follows compositional instructions more faithfully. However, differences in their autoencoders and noise schedules make it difficult to transfer these strengths across models. In this paper, we present Poly-OPD, a framework that can consolidate complementary strengths of heterogeneous teachers into a single compact flow-matching student. To bridge the incompatible latent spaces of different teachers, Poly-OPD performs on-policy distillation through a pixel bridge. Each student-generated image is re-encoded by a selected teacher's encoder and refined from a noise level matched by magnitude under the teacher's noise schedule. The resulting target is further matched to the student in frozen DINOv2 space, enabling supervision across incompatible latent spaces. To retain complementary capabilities without cross-teacher interference, Poly-OPD uses a gradient compatibility diagnostic to organize its adapters: attention LoRA modules are shared across teachers, whereas feed-forward adapters remain teacher-specific. During distillation, a gap-aware curriculum devotes more training to compositional categories where the student still falls short of the teacher. As each gap narrows, training shifts toward categories with larger remaining gaps. By distilling FLUX.1-dev and Z-Image into a 2.5B SD3.5-Medium student, Poly-OPD improves GenEval from 67.3 to 73.3, surpassing both larger teachers, and raises DrawBench HPSv3 from 9.34 to 11.35, consolidating both strengths within a switchable model.", 'score': 7, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '5be5d1770831b866', 'authors': ['Siming Fu', 'Haojun Xu', 'Ruizhe He', 'Zheming Fu', 'Hualiang Wang', 'Jie Huang', 'Xiaoxiao Ma', 'Mingchen Zhong', 'Weihu Huang', 'Xiaoxuan He', 'Linjiang Huang', 'Si Liu'], 'affiliations': ['Beihang University', 'Joy Future Academy', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.04349.jpg', 'data': {'categories': ['#training', '#multimodal', '#cv', '#transfer_learning', '#diffusion', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Объединение сильных сторон разных моделей генерации в одну компактную нейросеть', 'desc': 'В статье представлена Poly-OPD — фреймворк для дистилляции дополняющих сильных сторон нескольких моделей генерации текста в изображение в один компактный студент. Чтобы преодолеть несовместимость автокодировщиков и расписаний шума разных учителей, метод использует on-policy дистилляцию через пиксельный мост, переносящий сгенерированные образы в латентные пространства разных учителей. Модель применяет диагностику совместимости градиентов для организации адаптеров, разделяя attention LoRA модули между учителями и сохраняя feed-forward адаптеры специфичными для каждого. Во время обучения используется curriculum learning, ориентированный на зазоры в производительности, постепенно сбалансировав все компетенции студента.'}, 'en': {'title': 'Unifying Strengths of Diverse Models with Poly-OPD', 'desc': 'This paper introduces Poly-OPD, a novel framework designed to merge the strengths of different text-to-image models, which often excel in different areas such as aesthetics and compositional accuracy. It addresses the challenge of transferring knowledge between models with incompatible latent spaces by using on-policy distillation and a pixel bridge to align outputs. The framework employs a gradient compatibility diagnostic to manage adapters, allowing shared attention modules while keeping feed-forward adapters specific to each teacher model. By implementing a gap-aware curriculum, Poly-OPD effectively narrows performance gaps during training, resulting in a single student model that outperforms its larger teacher models in various evaluation metrics.'}, 'zh': {'title': '整合互补优势的文本到图像模型', 'desc': '本文提出了一种名为Poly-OPD的框架，旨在将不同文本到图像模型的互补优势整合到一个紧凑的流匹配学生模型中。通过像素桥，Poly-OPD在不同教师的潜在空间之间进行在线蒸馏，确保生成的图像能够与选定教师的编码器相匹配。该框架使用梯度兼容性诊断来组织适配器，以避免教师之间的干扰，同时在蒸馏过程中关注学生与教师之间的差距。最终，Poly-OPD在性能评估中超越了更大的教师模型，成功整合了两者的优势。'}}}, {'id': 'https://huggingface.co/papers/2607.28048', 'title': 'SKILL-KD: Contrastive Skill Distillation for LLM Agents', 'url': 'https://huggingface.co/papers/2607.28048', 'abstract': 'Abstract  Skill-based prompting has become a practical mechanism for improving large language model (LLM) agents, yet existing skill acquisition methods often treat skills as experience summaries, memory entries, or direct summaries of successful demonstrations. This creates a mismatch for weaker student agents: when a student fails because it lacks task knowledge or operational strategy, its failed trajectory may not contain enough evidence to infer the missing behavior, while the teacher trajectory may be too implicit to be internalized as reusable guidance. We propose SKILL-KD, a contrastive skill distillation framework that treats skills as an explicit distillation medium between agents of different capabilities. Given a student failure and the teacher trajectory on the same task, SKILL-KD distills their actionable discrepancy into a textual skill patch, evaluates the patch by re-running the student, and iteratively refines the patch when the student still fails. To prevent repeated local updates from causing skill drift, SKILL-KD further maintains trace-linked edit histories and performs Drift-Aware Skill Consolidation, deciding whether each patch should add a new rule, delete or modify an existing rule, or be skipped. Across five agent benchmarks and two student settings, SKILL-KD consistently improves frozen student agents over fixed-model adaptation baselines.', 'score': 6, 'issue_id': 2861, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '92bbf72d7e9f6568', 'authors': ['Qiming Shi', 'Yibo Dou', 'Jiawen Zhu', 'Yulong Tao', 'Linbo Jin', 'Zhaolu Kang', 'Yunfan Zhou', 'Di Weng'], 'affiliations': ['Alibaba Group', 'School of Software Technology, Zhejiang University', 'School of Software and Microelectronics, Peking University', 'State Key Lab of CAD&CG, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28048.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents'], 'emoji': '🎓', 'ru': {'title': 'Передача навыков между LLM-агентами через контрастную дистилляцию ошибок', 'desc': 'В статье предлагается SKILL-KD — фреймворк контрастной дистилляции навыков для обучения слабых агентов на основе траекторий опытных учителей. Авторы рассматривают навыки как явный механизм передачи знаний между агентами с разными способностями, извлекая из ошибок ученика и успехов учителя текстовые патчи навыков. Система итеративно улучшает патчи через повторное выполнение и использует историю отредактированных правил для предотвращения дрейфа навыков. Экспериментальные результаты на пяти бенчмарках показывают, что SKILL-KD последовательно превосходит методы адаптации моделей при обучении замороженных агентов.'}, 'en': {'title': 'Enhancing Learning with Contrastive Skill Distillation', 'desc': "The paper introduces SKILL-KD, a novel framework for skill distillation in large language model (LLM) agents. Unlike traditional methods that summarize skills, SKILL-KD focuses on the actionable discrepancies between a teacher agent and a student agent when the student fails. It generates textual skill patches that guide the student by refining its operational strategies based on the teacher's successful trajectory. Additionally, SKILL-KD incorporates Drift-Aware Skill Consolidation to manage updates and prevent skill drift, ensuring that the learning process remains effective across various benchmarks."}, 'zh': {'title': '技能蒸馏：提升代理学习的有效方法', 'desc': '本论文提出了一种名为SKILL-KD的对比技能蒸馏框架，旨在改善大型语言模型（LLM）代理的技能获取。该方法将技能视为不同能力代理之间的明确蒸馏媒介，通过分析学生代理的失败轨迹和教师代理的成功轨迹，提取出可操作的技能补丁。SKILL-KD通过反复评估和优化这些补丁，帮助学生代理逐步掌握缺失的任务知识和操作策略。此外，为了防止技能漂移，SKILL-KD维护了编辑历史，并进行漂移感知的技能整合。'}}}, {'id': 'https://huggingface.co/papers/2608.05108', 'title': 'Agent Against Agent: An Agentic System for Automatic Prompt Injection Red Teaming', 'url': 'https://huggingface.co/papers/2608.05108', 'abstract': 'Abstract  Prompt injection poses significant security risks to LLM agents. Efficient and effective red-teaming is therefore critical, both for evaluating these risks and for collecting training data to improve defenses. Existing state-of-the-art prompt injection red-teaming methods primarily rely on reinforcement learning (RL), producing attacker models that often generalize poorly to new target LLMs. In this work, we develop PIMiner, an agentic system for prompt injection red-teaming. During training, PIMiner is trained on a sequence of (dataset, target model) pairs and builds a strategy library from scratch. At test time, the learned strategy library can be directly transferred to a previously unseen target LLM without additional training. PIMiner requires only a small number of queries to a target agent (e.g., 10) per test sample. Experimental results demonstrate that PIMiner achieves strong performance. On IPIArena, it attains a 76.2% ASR against Gemini-2.5-Pro, 61.9% ASR against GPT-5.1, and 42.9% ASR against Claude-Sonnet-4.5. On AgentDojo, it achieves an 86.7% ASR against Gemini-2.5-Pro, 53.3% ASR against GPT-5.1, and 40.0% ASR against Claude-Sonnet-4.5.', 'score': 5, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'b1e69abc710dea2f', 'authors': ['Yanting Wang', 'Chenlong Yin', 'Runpeng Geng', 'Jinyuan Jia'], 'affiliations': ['The Pennsylvania State University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05108.jpg', 'data': {'categories': ['#benchmark', '#rl', '#agents'], 'emoji': '🎯', 'ru': {'title': 'Универсальные стратегии атак на LLM через передачу знаний без переобучения', 'desc': 'Исследование посвящено проблеме инъекций подсказок в LLM агентов, которые представляют серьёзную угрозу безопасности. Авторы разработали PIMiner — агентную систему для красного тестирования, которая строит библиотеку стратегий атак во время обучения на последовательности пар (датасет, целевая модель). Ключевое преимущество подхода заключается в том, что обученная библиотека стратегий может быть напрямую перенесена на новые, ранее не встречавшиеся LLM без переобучения. Экспериментальные результаты показывают высокую эффективность метода с процентом успешных атак от 40% до 86.7% против различных моделей на двух бенчмарках.'}, 'en': {'title': 'PIMiner: Enhancing LLM Security Against Prompt Injection', 'desc': 'This paper addresses the security vulnerabilities of large language models (LLMs) to prompt injection attacks. It introduces PIMiner, a novel system designed for red-teaming these models by efficiently generating attack strategies. Unlike traditional methods that rely on reinforcement learning, PIMiner builds a strategy library from various dataset and model pairs, allowing it to adapt to new LLMs without retraining. Experimental results show that PIMiner achieves high attack success rates across multiple target models, demonstrating its effectiveness in enhancing LLM security.'}, 'zh': {'title': 'PIMiner：高效的提示注入红队系统', 'desc': '本文讨论了提示注入对大型语言模型（LLM）代理的安全风险，并提出了一种新的红队方法PIMiner。PIMiner通过训练一系列（数据集，目标模型）对，构建了一个策略库，可以在没有额外训练的情况下直接应用于未见过的目标LLM。实验结果表明，PIMiner在多个测试中表现出色，能够有效识别和利用提示注入的漏洞。该方法仅需少量查询即可实现高效的攻击成功率，展示了其在安全评估中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.04701', 'title': 'UniWorld-View: Large-Baseline View Synthesis via Video Diffusion Models', 'url': 'https://huggingface.co/papers/2608.04701', 'abstract': 'Abstract  The abundance of casually captured monocular videos and images on social media provides a valuable source for immersive content creation, where generating novel views from such sparse observations can greatly enhance user experiences. However, producing photorealistic and geometrically consistent views with precise camera control remains challenging when input coverage is extremely limited. Reconstruction-based approaches such as NeRF and 3D Gaussian Splatting (3DGS) deteriorate severely under sparse inputs and fail to explicitly handle occlusions. Generative methods ease data requirements but still struggle with large-baseline view synthesis due to inaccurate or implicit geometric guidance. To overcome these limitations, we introduce UniWorld-View, a unified framework for controllable large-baseline novel view synthesis from monocular inputs. UniWorld-View integrates explicit 3D guidance with generative diffusion modeling to enable precise camera control and geometrically consistent view generation. The geometric guidance is obtained through an occlusion-aware point cloud rendering strategy that resolves visibility ambiguities and provides accurate priors for diffusion-based synthesis. By coupling this rendering strategy with powerful video diffusion backbones, UniWorld-View achieves high-fidelity novel view generation even under extreme camera motions and wide-baseline changes, and can further provide multi-view videos for downstream dynamic 3DGS reconstruction. Experiments on the WorldScore benchmark and zero-shot NVS benchmarks demonstrate the effectiveness of UniWorld-View in controllability, geometric consistency, and visual fidelity.', 'score': 5, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '6c87feeaa389fc1d', 'authors': ['Haiyang Zhou', 'Wangbo Yu', 'Chaoran Feng', 'Xunyu Zhou', 'Yonghong Tian', 'Li Yuan'], 'affiliations': ['Peking University', 'Rabbitpre AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.04701.jpg', 'data': {'categories': ['#3d', '#multimodal', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Управляемый синтез новых видов из одного кадра через геометрию и диффузию', 'desc': 'В статье представлена UniWorld-View — объединённая система для синтеза новых видов (novel view synthesis) из монокулярного видео с точным управлением камерой. Авторы комбинируют явную трёхмерную геометрическую информацию с генеративными диффузионными моделями, используя стратегию окклюзионно-осведомлённого рендеринга облака точек для разрешения видимостей и получения точных приоров. Метод эффективно работает даже при экстремальных движениях камеры и больших базовых расстояниях между видами, превосходя как реконструкционные подходы (NeRF, 3DGS), так и чисто генеративные методы. Система может генерировать многовидовые видеопоследовательности для последующей реконструкции динамических сцен через 3D Gaussian Splatting.'}, 'en': {'title': 'UniWorld-View: Mastering Novel View Synthesis with Monocular Inputs', 'desc': 'This paper presents UniWorld-View, a novel framework designed for generating new views from limited monocular video inputs. It combines explicit 3D geometric guidance with generative diffusion models to improve camera control and ensure consistent visual quality. The framework addresses challenges like occlusions and visibility issues through an innovative point cloud rendering strategy. Experiments show that UniWorld-View excels in producing high-fidelity images even with significant camera movement, making it a valuable tool for immersive content creation.'}, 'zh': {'title': 'UniWorld-View：从单目输入生成新视图的统一框架', 'desc': '本论文介绍了一种名为UniWorld-View的统一框架，用于从单目输入生成可控的大基线新视图。该方法结合了显式的三维指导和生成扩散建模，能够实现精确的相机控制和几何一致的视图生成。通过一种考虑遮挡的点云渲染策略，UniWorld-View解决了可见性模糊的问题，并为基于扩散的合成提供了准确的先验信息。实验结果表明，UniWorld-View在可控性、几何一致性和视觉保真度方面表现出色，能够在极端相机运动和宽基线变化下生成高保真的新视图。'}}}, {'id': 'https://huggingface.co/papers/2607.22143', 'title': 'TriGlue: a Biology-Inspired Generative Model for Generating Molecular Glue-Induced Ternary Complex', 'url': 'https://huggingface.co/papers/2607.22143', 'abstract': 'Abstract  Molecular glue degraders have emerged as a promising strategy for targeted protein degradation by inducing ternary complex formation between an E3 ubiquitin ligase and a target protein. Despite their therapeutic potential, computational design of molecular glues remains largely unexplored. Unlike conventional structure-based drug design, molecular glue design is governed by the unknown protein-protein interface and requires the simultaneous modeling of ligand generation, protein-protein docking, and ternary complex assembly. In this work, we formulate molecular glue design as a ternary complex generation problem and propose a biology-inspired generative framework, TriGlue. Motivated by the mechanism of molecular glue action, we decompose ternary complex generation into two coupled stages: interface estimation and interface-conditioned complex generation. First, we develop an SE(3)-equivariant interface estimation module that predicts a geometrically constrained protein-protein interface from unbound monomer structures. Second, we introduce an interface-conditioned ternary flow matching network that jointly generates the molecular glue and predicts the rigid-body transformation required to assemble the ternary complex. Extensive experiments demonstrate that TriGlue generates chemically valid molecules and produces plausible ternary complexes, which highlight the potential of biology-inspired generative modeling for accelerating molecular glue discovery. Our code is available at https://github.com/yuliangyan0807/molecular-glue-design.', 'score': 5, 'issue_id': 2860, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '908c37c7b1f79c4f', 'authors': ['Yuliang Yan', 'Shuo Yan', 'Haochun Tang', 'Yiqin Sun', 'Enyan Dai'], 'affiliations': ['Jilin University', 'The Hong Kong University of Science and Technology (Guangzhou)', 'University of Sydney'], 'pdf_title_img': 'assets/pdf/title_img/2607.22143.jpg', 'data': {'categories': ['#architecture', '#open_source', '#3d', '#science', '#healthcare'], 'emoji': '🧬', 'ru': {'title': 'Генеративная модель для дизайна молекулярных деградаторов белков', 'desc': 'В работе предложен TriGlue — генеративный фреймворк для computational design молекулярных клеевых деградаторов белков. Авторы формулируют задачу дизайна как проблему генерации тройного комплекса между E3 убиквитин лигазой, целевым белком и малой молекулой-лигандом. Подход разложен на два этапа: оценка интерфейса белок-белок с использованием SE(3)-эквивариантной нейросети и условная генерация тройного комплекса через flow matching сеть. Экспериментальные результаты показывают, что модель генерирует химически валидные молекулы и правдоподобные структуры комплексов, демонстрируя эффективность biology-inspired генеративного моделирования.'}, 'en': {'title': 'TriGlue: Accelerating Molecular Glue Discovery through Generative Modeling', 'desc': 'This paper introduces TriGlue, a novel framework for designing molecular glue degraders that facilitate targeted protein degradation. The approach formulates the design process as a problem of generating ternary complexes, which involves predicting protein-protein interfaces and generating suitable ligands. TriGlue employs an SE(3)-equivariant module for interface estimation and a flow matching network for complex assembly, effectively modeling the interactions between proteins and ligands. The results show that TriGlue can create chemically valid molecules and plausible ternary complexes, showcasing its potential in accelerating the discovery of molecular glues.'}, 'zh': {'title': '生物启发的分子胶设计新方法', 'desc': '分子胶降解剂是一种有前景的靶向蛋白降解策略，通过诱导E3泛素连接酶与目标蛋白形成三元复合物。尽管其治疗潜力巨大，但分子胶的计算设计仍然未被充分探索。与传统的基于结构的药物设计不同，分子胶设计需要同时建模配体生成、蛋白质-蛋白质对接和三元复合物组装。本文提出了一种生物启发的生成框架TriGlue，将分子胶设计视为三元复合物生成问题，展示了其在加速分子胶发现方面的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.04926', 'title': 'Consistency-Driven Co-Evolution for Self-Supervised Cross-Representation Learning', 'url': 'https://huggingface.co/papers/2608.04926', 'abstract': 'Abstract  As chart images, tabular data, and visualization code play increasingly important roles across diverse domains, cross-representation understanding across these modalities poses fundamental challenges for AI systems: the relationships across representations are inherently one-to-many, supervision is ambiguous and costly, and model optimization lacks a principled signal that is both direction-adaptive and representation-generalizable beyond task-specific objectives. We introduce CoCoEvolve to improve consistency across chart, table, and code representations. Instead of treating cross-representation mapping as a one-to-many problem, we define explicit one-to-one correspondences and optimize models using agreement between representations, without additional annotations. During training, CoCoEvolve@Train performs co-evolution across the chart-table-code cycle, while CoCoEvolve@Test applies the same consistency objective at inference time for test-time co-optimization. We also present CoCoEvolve@Eval, an evaluation suite covering all six cross-representation tasks. Across four benchmarks, CoCoEvolve improves performance in both training-time and test-time settings. Our project page: https://xhguo7.github.io/CoCoEvolve/.', 'score': 4, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '1e8e2933d897aa4f', 'authors': ['Xuehang Guo', 'Pengyuan Li', 'Tom Hope', 'Tirthankar Ghosal', 'Manling Li', 'Qingyun Wang'], 'affiliations': ['Allen Institute for AI', 'IBM', 'Northwestern University', 'Oak Ridge National Laboratory', 'William & Mary'], 'pdf_title_img': 'assets/pdf/title_img/2608.04926.jpg', 'data': {'categories': ['#training', '#multimodal', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Синхронизация визуализаций через согласованное развитие представлений', 'desc': 'Статья представляет CoCoEvolve — метод для улучшения согласованности между тремя модальностями: графиками, табличными данными и кодом визуализации. Авторы решают проблему одно-ко-многим соответствия между представлениями путём определения явных взаимно-однозначных соответствий и оптимизации моделей на основе согласованности между модальностями без дополнительных аннотаций. Подход включает co-evolution представлений как во время обучения, так и на этапе инференса для уточнения предсказаний. Экспериментальные результаты демонстрируют улучшение производительности модели на четырёх бенчмарках при использовании как обучающих, так и тестовых стратегий оптимизации.'}, 'en': {'title': 'Enhancing Cross-Representation Consistency with CoCoEvolve', 'desc': 'This paper presents CoCoEvolve, a method designed to enhance the understanding of relationships between chart images, tabular data, and visualization code in machine learning. It addresses the challenges of one-to-many mappings and ambiguous supervision by establishing explicit one-to-one correspondences between these representations. The model is optimized through agreement across representations, eliminating the need for additional annotations. CoCoEvolve demonstrates improved performance in both training and testing phases across various benchmarks, showcasing its effectiveness in cross-representation tasks.'}, 'zh': {'title': '提升图表、表格与代码的一致性', 'desc': '本论文介绍了一种名为CoCoEvolve的方法，旨在提高图表、表格和代码表示之间的一致性。我们通过定义明确的一对一对应关系，优化模型以实现表示之间的协议，而无需额外的注释。CoCoEvolve在训练过程中通过图表-表格-代码循环进行共同进化，而在测试时则应用相同的一致性目标进行共同优化。实验结果表明，CoCoEvolve在训练和测试阶段的表现均有所提升。'}}}, {'id': 'https://huggingface.co/papers/2608.03207', 'title': 'DRIFT: Derailing Denoising Trajectories of Flow-Matching VLAs with Adversarial Patch Attack', 'url': 'https://huggingface.co/papers/2608.03207', 'abstract': "Abstract  Flow-matching vision-language-action (VLA) models such as pi0 generate robot actions by integrating a learned denoising velocity field, and have been reported to resist adversarial perturbations that readily fool autoregressive VLAs. We show that this robustness is largely illusory: it stems from prior attacks ignoring the multi-step denoising ODE. We introduce DRIFT (Denoising Redirection via Input perturbation of the Flow-matching Trajectory), a test-time universal adversarial patch placed on the robot's gripper that attacks the denoising velocity field of an off-the-shelf policy. Our central finding is counterintuitive: attacking only the first denoising step is both stronger and cheaper than attacking a wider window of steps, which we explain through a gradient conflict unique to input-space optimization and which is exactly opposite to the training-time backdoor regime. On pi0 and pi0.5 across four LIBERO suites, DRIFT breaks essentially all originally-solvable tasks with a small single patch, far exceeding action- and embedding-space attack baselines.", 'score': 1, 'issue_id': 2864, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '1069ae17c5a4063c', 'authors': ['Hoseong Tae', 'Jong-Seok Lee'], 'affiliations': ['School of Integrated Technology, Yonsei University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03207.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Первый шаг — решающая уязвимость потоковых моделей робототехники', 'desc': 'В статье исследуется уязвимость flow-matching моделей видения-языка-действия (VLA), таких как pi0, которые генерируют действия робота через процесс деноизации. Авторы показывают, что кажущаяся робастность этих моделей к adversarial возмущениям является иллюзией, так как предыдущие атаки игнорировали многошаговый процесс решения дифференциального уравнения. Они предлагают DRIFT — универсальный adversarial patch на захвате робота, который атакует поле скорости деноизации за счёт возмущения входных данных на траектории flow-matching. Ключевой находкой является то, что атака только на первый шаг деноизации более эффективна и экономична, чем атака на несколько шагов, что объясняется уникальным конфликтом градиентов в оптимизации входного пространства.'}, 'en': {'title': 'Unmasking Vulnerabilities in VLA Models with Targeted Attacks', 'desc': "This paper discusses the vulnerabilities of flow-matching vision-language-action (VLA) models, specifically pi0, which are designed to generate robot actions. The authors reveal that the perceived robustness of these models against adversarial attacks is misleading, as it is based on ignoring the complexities of the multi-step denoising process. They introduce a novel attack method called DRIFT, which uses a universal adversarial patch to disrupt the denoising velocity field during the robot's operation. Their findings indicate that targeting the first step of the denoising process is more effective and efficient than broader attacks, highlighting a unique gradient conflict in input-space optimization."}, 'zh': {'title': '揭示VLA模型的虚假鲁棒性', 'desc': '本文探讨了流匹配视觉-语言-动作（VLA）模型的鲁棒性，特别是pi0模型如何通过学习的去噪速度场生成机器人动作。研究表明，这种鲁棒性在很大程度上是虚幻的，因为之前的攻击忽略了多步去噪常微分方程（ODE）。我们提出了DRIFT（通过输入扰动重定向去噪），这是一种在机器人抓手上放置的测试时通用对抗补丁，能够攻击现成策略的去噪速度场。我们的主要发现是，攻击第一个去噪步骤比攻击更广泛的步骤窗口更有效且成本更低，这一现象与训练时的后门机制正好相反。'}}}, {'id': 'https://huggingface.co/papers/2608.03392', 'title': 'Self-Evolving Coding Agents', 'url': 'https://huggingface.co/papers/2608.03392', 'abstract': 'Abstract  Large language models are increasingly embedded in software engineering workflows as coding agents that can inspect repositories, invoke tools, execute tests, debug failures, and generate patches. Yet most existing agents remain largely static after deployment, even though software development is a dynamic, feedback-rich process in which repositories evolve, dependencies change, tests fail, and repair attempts leave reusable experience. This tension has motivated a growing body of work on self-evolving coding agents, where the agent improves its future behavior by updating its framework, memory, skills, tools, models, or collaboration structures from prior coding interactions. In this survey, we provide a systematic synthesis of this emerging area. We first define self-evolving coding agents and distinguish them from conventional coding agents and general self-evolving agents. We then develop an object-centered taxonomy that characterizes what evolves in these systems, and complement it with two orthogonal perspectives: when evolution occurs and what software-specific evidence drives it. Across the literature, we find that executable feedback, repository-level context, and coding trajectories give software engineering a distinctive role as a natural domain for agent self-evolution, but also introduce new challenges in feedback reliability, benchmark overfitting, safety, maintainability, cost, and generalization. By organizing existing work around these dimensions, this survey aims to clarify the conceptual boundaries of self-evolving coding agents and provide a foundation for designing more adaptive, reliable, and software-aware agentic systems. The papers we collect can be found at https://github.com/zhouhao1024/Awesome-Self-Evolving-Coding-Agents.', 'score': 0, 'issue_id': 2863, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '2d089ea931fc2208', 'authors': ['Hao Zhou', 'Haichuan Hu', 'Ye Shang', 'Quanjun Zhang'], 'affiliations': ['Nanjing University', 'Nanjing University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.03392.jpg', 'data': {'categories': ['#survey'], 'emoji': '🤖', 'ru': {'title': 'Кодирующие агенты, которые учатся и адаптируются сами', 'desc': 'Этот обзор посвящен самоэволюционирующим кодирующим агентам на основе больших языковых моделей, которые не остаются статичными после развертывания, а улучшают свое поведение через обновление памяти, навыков, инструментов и стратегий на основе опыта разработки. Авторы предлагают систематическую классификацию таких систем, выделяя три ключевых аспекта: что эволюционирует в агенте, когда происходит эволюция и какие доказательства из процесса разработки ее движут. Исследование показывает, что исполняемая обратная связь, контекст репозитория и траектории кодирования создают уникальные возможности для самоэволюции агентов в инженерии ПО. Однако подход также привносит новые вызовы, включая надежность обратной связи, переобучение на бенчмарках, безопасность и обобщаемость систем.'}, 'en': {'title': 'Empowering Coding Agents to Evolve with Experience', 'desc': 'This paper discusses the concept of self-evolving coding agents, which are advanced AI systems that can adapt and improve their coding abilities over time. Unlike traditional coding agents that remain static after deployment, these agents learn from past interactions and update their frameworks, skills, and tools based on feedback from software development processes. The authors present a taxonomy to categorize the evolution of these agents and highlight the unique challenges they face, such as ensuring feedback reliability and maintaining safety. The survey aims to provide a clearer understanding of self-evolving coding agents and to lay the groundwork for creating more adaptive and effective coding systems.'}, 'zh': {'title': '自我进化编码代理：软件工程的未来', 'desc': '大型语言模型在软件工程工作流程中越来越多地被用作编码代理，能够检查代码库、调用工具、执行测试、调试错误和生成补丁。然而，大多数现有的代理在部署后仍然相对静态，无法适应软件开发中动态变化的环境。为了解决这个问题，研究者们开始关注自我进化的编码代理，这种代理能够通过更新其框架、记忆、技能和工具等来改善未来的行为。本文系统性地综述了这一新兴领域，定义了自我进化编码代理，并提出了一个对象中心的分类法，以帮助理解这些系统的演变特征。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (3)', '#agents (10)', '#agi', '#alignment (3)', '#architecture (3)', '#audio (1)', '#benchmark (13)', '#cv (3)', '#data (1)', '#dataset (5)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations (1)', '#healthcare (1)', '#inference', '#interpretability (2)', '#leakage', '#long_context (2)', '#low_resource (1)', '#machine_translation', '#math', '#multilingual (3)', '#multimodal (12)', '#open_source (5)', '#optimization (4)', '#plp (1)', '#rag', '#reasoning (5)', '#rl (5)', '#rlhf (2)', '#robotics (2)', '#science (1)', '#security (1)', '#small_models (2)', '#story_generation', '#survey (1)', '#synthetic (1)', '#training (13)', '#transfer_learning (2)', '#video (4)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">

                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-06 12:52',lang=currentLang);
        }

                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"

                en: {
                    default: "rating",

                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }

            const prevDate = document.getElementById('prev-date');

            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-06 12:52')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-06 12:52')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();

        hideNextLink('daily');
