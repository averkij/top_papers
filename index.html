aches a median AUROC of 0.886 zero-shot and beats supervised baselines on most benchmarks. Question wording matters little, while context matters more, mostly through fields that encode the label. Jev matches the reference scorer's agreement with human labels, surfaces label defects in existing benchmarks, and costs 63x less than LLM-judge scorers. Code and data: https://github.com/sumleo/RLCDAlignBench.", 'score': 2, 'issue_id': 3332, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '40e54b5ea5d19e04', 'authors': ['Ruoqi Guo', 'Yi Liu', 'Gelei Deng', 'Yuekang Li', 'Lida Zhao', 'Yutao Wu', 'Simin Chen', 'Ying Zhang', 'Leo Yu Zhang'], 'affiliations': ['Deakin University', 'George Mason University', 'Griffith University', 'Nanyang Technological University', 'UNSW', 'Wake Forest University'], 'pdf_title_img': 'assets/pdf/title_img/2609.29429.jpg', 'data': {'categories': ['#training', '#alignment', '#benchmark', '#rlhf', '#interpretability', '#open_source', '#hallucinations'], 'emoji': '🛡️', 'ru': {'title': 'Эффективная калибровка для обнаружения отказов выравнивания языковых моделей', 'desc': 'В этой работе представлена новая методология для оценки отказов выравнивания в развёрнутых языковых моделях с помощью модели Jev, обученной методом усиленного обучения с калибровкой решений (RLCD). В отличие от существующих генеративных судей, требующих отдельного прохода декодирования для каждого критерия, модель Jev может ответить на множество типизированных вопросов об одном входе с откалиброванными вероятностями за один проход. Авторы создали бенчмарк RLCDAlignBench, охватывающий десять типов отказов выравнивания (подхалимство, взлом защиты, обман, инъекции промптов, галлюцинации, нарушения приватности, социальные предубеждения и др.) на 44 наборах данных. Ключевой вклад заключается в том, что вопросы варьируются отдельно от входных данных, позволяя обнаруживать ошибки выравнивания, которые являются релационными и зависят от контекста, недоступного в самом ответе.'}, 'en': {'title': 'Revolutionizing Alignment Detection with Jev', 'desc': 'This paper introduces Jev, a model designed to detect alignment failures in language models using reinforcement learning for calibrated decisions (RLCD). Unlike traditional methods that evaluate each criterion separately, Jev can assess multiple alignment issues in a single call, providing calibrated probabilities for various types of failures. The authors present RLCDAlignBench, a benchmarking framework that tests Jev against ten specific alignment failures, revealing its effectiveness in identifying issues like deception and social bias. The results show that Jev outperforms existing supervised methods while being significantly more cost-effective.'}, 'zh': {'title': 'Jev：高效检测对齐失败的模型', 'desc': '本文介绍了一种新的模型Jev，它通过强化学习进行校准决策，能够在一次调用中回答多个关于输入的问题，并提供校准的概率。我们提出了RLCDAlignBench，这是一个基准测试，评估Jev在十种对齐失败情况上的表现，包括谄媚、越狱、欺骗等。研究表明，问题的措辞对结果影响不大，而上下文信息，特别是输入字段的编码，起着更重要的作用。Jev的表现超越了大多数监督基准，并且成本比现有的LLM-judge评分器低63倍。'}}}, {'id': 'https://huggingface.co/papers/2609.28811', 'title': 'DeltaWAM: Delta World Action Models for Bimanual Manipulation', 'url': 'https://huggingface.co/papers/2609.28811', 'abstract': 'Abstract  World-action models (WAMs) transfer visual and motion priors from pretrained video generators to robot control by jointly modeling visual dynamics and actions. Existing WAMs, however, predict dense future frames during training, repeatedly modeling largely unchanged content and coupling action-conditioned dynamics to nuisance appearance variations. At inference, processing each complete observation with the heavy video expert bottlenecks few-step action generation. Accordingly, we propose DeltaWAM, which jointly predicts visual deltas and actions using dense-anchor, sparse-delta, and action streams, with three architectures that differ in representation and computation sharing. We further develop Streaming Delta Memory (SDM), which updates cached anchor context with compact observed deltas, reducing heavy video-expert processing. On RoboTwin, DeltaWAM with SDM improves average success over Fast-WAM from 81.3% to 85.4% in the clean setting and from 75.8% to 83.9% under visual randomization. The three architectures reduce training FLOPs by 17.78-23.77%, while SDM reduces one-step inference latency and FLOPs by 36.57% and 31.55%, respectively; real-world evaluations further show the highest overall success rate and normalized progress among the evaluated policies. Code: https://github.com/AIGeeksGroup/DeltaWAM. Website: https://aigeeksgroup.github.io/DeltaWAM.', 'score': 2, 'issue_id': 3331, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': 'ac80b49dd12084d6', 'authors': ['Han Yan', 'Zishang Xiang', 'Haokai Jiang', 'Zeyu Zhang', 'Qilin Wang', 'Weiyu Guo', 'Yandong Guo', 'Boxin Shi', 'Hao Tang'], 'affiliations': ['AI2 Robotics', 'School of Computer Science, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2609.28811.jpg', 'data': {'categories': ['#architecture', '#video', '#inference', '#training', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Эффективное управление роботами через предсказание визуальных изменений вместо полных кадров', 'desc': 'Статья представляет DeltaWAM — метод для управления роботами, который переносит знания из предобученных генеративных моделей видео на задачи робототехники путем совместного моделирования визуальной динамики и действий. В отличие от существующих подходов, DeltaWAM предсказывает не полные будущие кадры, а только визуальные дельты (изменения), что значительно снижает вычислительные затраты и упрощает обучение. Авторы предлагают архитектуры с раздельными потоками для якорных кадров, разреженных дельт и действий, а также вводят Streaming Delta Memory для эффективного кэширования контекста при инференсе. На бенчмарке RoboTwin метод показывает улучшение успеха контроля с 81.3% до 85.4% и снижение вычислительных затрат на 17-24% при обучении и 36.57% при инференсе.'}, 'en': {'title': 'Efficient Robot Control with DeltaWAM: Predicting Visual Deltas and Actions', 'desc': 'This paper introduces DeltaWAM, a new approach to World-action models (WAMs) that enhances robot control by predicting visual changes (deltas) alongside actions. Unlike traditional WAMs that generate dense future frames, DeltaWAM focuses on efficient computation by using a combination of dense-anchor, sparse-delta, and action streams. The method incorporates Streaming Delta Memory (SDM) to optimize processing by updating context with compact visual deltas, significantly reducing the computational load during inference. Experimental results show that DeltaWAM outperforms previous models in both success rates and efficiency, demonstrating its effectiveness in real-world applications.'}, 'zh': {'title': '提升机器人控制效率的新方法', 'desc': '本文提出了一种新的世界动作模型DeltaWAM，旨在通过联合预测视觉变化和动作来提高机器人控制的效率。与现有模型不同，DeltaWAM采用了稀疏和密集的视觉锚点，减少了对重复内容的建模，从而提高了推理速度。我们还开发了流式Delta记忆（SDM），通过更新缓存的上下文来降低视频处理的负担。实验结果表明，DeltaWAM在多个设置下的成功率显著提高，同时减少了训练和推理的计算量。'}}}, {'id': 'https://huggingface.co/papers/2609.28923', 'title': 'ViRDM: Taming Representation Distribution Matching for Few-Step Causal Video Generation', 'url': 'https://huggingface.co/papers/2609.28923', 'abstract': 'Abstract  Few-step autoregressive (AR) video diffusion enables low-latency streaming generation, but existing post-training methods predominantly rely on Distribution Matching Distillation (DMD), requiring both a large pretrained teacher and an online critic to estimate distributional discrepancies through diffusion scores. In this work, we ask whether this resource-intensive teacher--critic stack can be eliminated by post-training only the generator against a precomputed target distribution. Drawing inspiration from representation distribution matching (RDM) for one-step image generation, we systematically study its transfer to few-step causal video generation and identify three key barriers: a memory-intractable gradient path, a distinct video optimization regime, and representation distributions that underconstrain temporal dynamics. We introduce ViRDM, a teacher- and critic-free video post-training recipe that addresses these barriers sequentially. By coupling RDM with stochastically truncated clean-exit supervision, a lightweight VAE decoder, and staged vector--Jacobian products, ViRDM makes representation distribution matching memory-feasible for multi-step causal video rollouts. We further establish effective generated-population and initialization regimes for video RDM, and introduce lightweight dynamics regularization to compensate for the underconstrained temporal dynamics. ViRDM turns three-network distillation into generator-only post-training, reducing GPU memory use and training time while improving video quality. With only 20 generator updates, the recipe reaches 84.87 on the official VBench evaluation, outperforming the previous best few-step causal baseline by 0.36, while requiring 16 A100 GPU-hours. We additionally report exploratory results demonstrating the potential of the same recipe for lower causal sampling budget and for one-, two-, and four-step bidirectional generation.', 'score': 2, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '55f9ad27d2a3dfc6', 'authors': ['Zichong Meng', 'Chongjian Ge', 'Chun-Hao P. Huang', 'Yang Zhou', 'Huaizu Jiang'], 'affiliations': ['Adobe Research', 'Northeastern University'], 'pdf_title_img': 'assets/pdf/title_img/2609.28923.jpg', 'data': {'categories': ['#architecture', '#diffusion', '#video', '#optimization', '#training'], 'emoji': '🎬', 'ru': {'title': 'Видеодиффузия без учителя: эффективное постобучение через распределение представлений', 'desc': 'Работа предлагает ViRDM — метод постобучения для видеомоделей, основанный на распределении представлений, который позволяет избежать использования дорогостоящей архитектуры учитель-критик. Авторы адаптируют подход matching представлений (RDM) с одношагового генерирования изображений на многошаговую каузальную генерацию видео, преодолевая три ключевых препятствия: сложность вычисления градиентов, особенности оптимизации видео и недостаточность информации о временной динамике. Введённый метод использует стохастическую суперверизию, лёгкий декодер VAE и оптимизированные векторно-якобианские произведения для эффективного обучения только генератора. ViRDM достигает лучших результатов при минимальных вычислительных затратах, получив 84.87 баллов на VBench всего за 20 обновлений генератора.'}, 'en': {'title': 'Streamlining Video Generation with ViRDM: Less is More!', 'desc': 'This paper presents ViRDM, a novel approach for few-step autoregressive video generation that eliminates the need for a large teacher model and an online critic. Instead of relying on Distribution Matching Distillation, ViRDM focuses on post-training the generator against a precomputed target distribution using representation distribution matching. The authors address challenges such as memory constraints and optimization regimes specific to video generation, leading to a more efficient training process. Ultimately, ViRDM achieves superior video quality with reduced resource requirements, demonstrating its effectiveness in generating high-quality videos with fewer updates.'}, 'zh': {'title': 'ViRDM：高效的视频生成后训练方法', 'desc': '本文提出了一种新的视频生成后训练方法ViRDM，旨在消除对大型预训练教师和在线评论家的依赖。通过仅对生成器进行后训练，ViRDM解决了在少步因果视频生成中遇到的三个主要障碍。该方法结合了表示分布匹配和轻量级的动态正则化，显著降低了GPU内存使用和训练时间，同时提高了视频质量。实验结果表明，ViRDM在官方评估中表现优异，超越了之前的最佳基线。'}}}, {'id': 'https://huggingface.co/papers/2609.30077', 'title': 'Rate-distortion optimization for full-reference image quality metrics via stochastic Hessian estimates', 'url': 'https://huggingface.co/papers/2609.30077', 'abstract': 'Abstract  Block-based video codecs select coding parameters based on the input by optimizing a rate-distortion trade-off. The conventional distortion choice, the sum of squared errors (SSE), simplifies parameter selection: the SSE is the sum of block-wise SSEs, so rate-distortion optimization (RDO) can treat blocks independently. Alternatively, full-reference image quality assessment (FR-IQA) metrics such as MS-SSIM or LPIPS often align better with the human visual system than SSE, but they cannot be used in-loop: they do not decompose block-wise and typically require the fully decoded image as input. Building on existing results in metric quadratization, we approximate a broad class of FR-IQA metrics by an input-dependent quadratic distortion (IDQD), whose quadratic form matrix is derived from the Hessian of the metric evaluated at the source video. To make the distortion computable block-wise, we propose two approximations of the Hessian matrix: 1) keeping the block-diagonal, and 2) keeping only its diagonal. We propose estimators for both that require only matrix-vector products with the Hessian obtained by automatic differentiation. Across five metrics for Kodak and CLIC in VVC, IDQD-RDO achieves 14.2-36.7 % BD-rate savings under the target metric with no decoder changes and incurs 10-30 % encoding complexity overhead.', 'score': 2, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '4d541ddf6ac05965', 'authors': ['Samuel Fernández-Menduiña', 'Eduardo Pavez', 'Antonio Ortega'], 'affiliations': ['University of Southern California, Los Angeles, CA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2609.30077.jpg', 'data': {'categories': ['#video', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Перцептивное видеокодирование через квадратичную аппроксимацию метрик качества', 'desc': 'Исследование предлагает новый подход к оптимизации кодирования видео, заменяя традиционную метрику среднеквадратичной ошибки на более перцептивно значимые метрики качества изображения, такие как MS-SSIM и LPIPS. Авторы разработали метод аппроксимации этих метрик входозависимой квадратичной функцией потерь (IDQD), вычисляемой через матрицу Гессиана, что позволяет применять оптимизацию соотношения скорость-искажение (RDO) независимо для каждого блока. Предложены две стратегии упрощения матрицы Гессиана: сохранение блочно-диагональной структуры и сохранение только диагонали, требующие лишь матрично-векторных произведений, полученных через автоматическое дифференцирование. На тестовых наборах данных Kodak и CLIC метод IDQD-RDO демонстрирует экономию битрейта 14.2-36.7% при целевой метрике без изменения декодера, хотя и с увеличением сложности кодирования на 10-30%.'}, 'en': {'title': 'Optimizing Video Coding with Human-Centric Quality Metrics', 'desc': 'This paper discusses a new approach to optimize video coding parameters by using a more human-aligned image quality assessment method instead of the traditional sum of squared errors (SSE). The authors introduce an input-dependent quadratic distortion (IDQD) that approximates full-reference image quality metrics, allowing for block-wise optimization. They propose two methods to simplify the computation of the Hessian matrix, which is essential for their approach, making it feasible to apply in video encoding. The results show significant bitrate savings while maintaining compatibility with existing decoders, albeit with some increase in encoding complexity.'}, 'zh': {'title': '优化视频编码，提升视觉质量', 'desc': '这篇论文讨论了一种新的视频编码方法，旨在优化编码参数以提高视频质量。传统的失真选择方法使用平方误差和（SSE），但这种方法在处理时无法考虑人类视觉系统的感知。作者提出了一种输入依赖的二次失真（IDQD）近似方法，可以更好地与人类视觉系统对齐，并且能够进行块级计算。通过对Hessian矩阵的近似，IDQD-RDO在多个视频质量评估指标上实现了显著的比特率节省，同时保持了编码复杂度的可接受范围。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (9)', '#agi (1)', '#alignment (3)', '#architecture (4)', '#audio (2)', '#benchmark (12)', '#cv (2)', '#data (1)', '#dataset (6)', '#diffusion (2)', '#ethics', '#games (1)', '#graphs', '#hallucinations (1)', '#healthcare', '#inference (2)', '#interpretability (2)', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math (1)', '#multilingual (1)', '#multimodal (5)', '#open_source (7)', '#optimization (7)', '#plp (1)', '#rag', '#reasoning (7)', '#rl (4)', '#rlhf (3)', '#robotics (4)', '#science (3)', '#security (1)', '#small_models (1)', '#story_generation', '#survey', '#synthetic (1)', '#training (11)', '#transfer_learning', '#video (6)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-25 23:45',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-25 23:45')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-25 23:45')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
