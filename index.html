ata': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Факторизованный поиск гипотез для разрешения неоднозначности косвенных доказательств в больших таксономиях', 'desc': 'Статья посвящена проблеме поиска в больших таксономиях, когда входные данные содержат косвенные доказательства (например, ячейки таблиц), а не явное выражение целевого понятия. Авторы предлагают метод Factorized Hypothesis Search (FHS), который поддерживает несколько частичных интерпретаций по именованным семантическим размерностям для структурированной обработки запросов. Метод включает многогипотезный поиск и проверку кандидатов на уровне размерности, что позволяет лучше разрешать неоднозначность входных данных. На задачах финансовой классификации и клинического кодирования FHS показывает лучшие результаты по метрикам Recall@1, MRR и финальной точности среди неоракульных методов.'}, 'en': {'title': 'Bridging the Retrieval Readiness Gap with Factorized Hypothesis Search', 'desc': "This paper addresses the challenge of large-taxonomy retrieval, particularly when the input data does not clearly express the desired concept. The authors identify a 'retrieval readiness gap' where indirect evidence, like table cells, can lead to poor retrieval performance. They introduce a new method called Factorized Hypothesis Search (FHS), which allows for multiple interpretations of data based on semantic dimensions. FHS demonstrates superior performance in tasks like financial taxonomy tagging and clinical coding, outperforming other methods in key metrics such as Recall@1 and accuracy."}, 'zh': {'title': '因子化假设搜索：提升检索准确性的创新方法', 'desc': '这篇论文讨论了大分类检索中的一个问题，即输入信息往往不是直接表达目标概念，而是间接证据，比如表格单元格的含义依赖于其行、列、数据类型和上下文。我们称这种不匹配为检索准备差距。论文提出了一种新的方法，称为因子化假设搜索（FHS），它在多个命名语义维度上维护多个部分解释，从而支持结构化查询渲染和多假设检索。实验结果表明，FHS在金融分类标记和临床编码任务中表现优异，达到了最佳的召回率和准确性。'}}}, {'id': 'https://huggingface.co/papers/2608.07886', 'title': 'Vision-Language Grounding as Bidirectional Concept Correspondence', 'url': 'https://huggingface.co/papers/2608.07886', 'abstract': 'Abstract  Vision-language grounding connects language to visual content, yet most existing formulations reduce grounding to a unidirectional localization problem: given a prespecified text phrase or category name, identify the corresponding image region. This setup assumes that the relevant linguistic unit is already known, overlooking a more basic challenge in grounded communication: determining which parts of the text are visually referential and how they correspond to entities in the image. We formulate grounding as bidirectional concept correspondence over an image-text pair. Given an image and its paired text, the goal is to recover all correspondences between visually referential text spans and instance-level image segments, without assuming that the relevant text spans are provided. This formulation unifies common grounding tasks, including phrase grounding, referring expression grounding, and open-vocabulary detection, by treating text segmentation, image segmentation, and cross-modal alignment as a single correspondence prediction problem. To address this task, we introduce ConCor-1, a grounding model built on top of a pretrained vision-language model. It uses learnable bridge tokens to represent candidate image-text correspondences and predicts, for each token, a text mask, an image mask, and a correspondence presence score. To train and evaluate this task, we convert diverse grounding and segmentation datasets into a unified correspondence format. Experiments show that ConCor-1 consistently outperforms baselines, improving correspondence F1 by 48% on the long-caption dataset and by 29% on zero-shot LVIS, where the large category list serves as the text input.', 'score': 1, 'issue_id': 2916, 'pub_date': '2026-08-08', 'pub_date_card': {'ru': '8 августа', 'en': 'August 8', 'zh': '8月8日'}, 'hash': 'beb3bf97ec42dd10', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#dataset', '#cv', '#interpretability', '#transfer_learning', '#multimodal'], 'emoji': '🔗', 'ru': {'title': 'Двусторонний поиск соответствий между текстом и визуальным контентом', 'desc': 'Статья представляет новый подход к задаче визуально-языкового выравнивания, переформулировав её как двусторонний поиск соответствий между фрагментами текста и сегментами изображения. Предложенная модель ConCor-1, построенная на основе предварительно обученной мультимодальной модели, использует обучаемые токены-мосты для предсказания текстовых масок, масок изображений и оценок вероятности соответствия. Авторы объединили несколько классических задач выравнивания (phrase grounding, referring expressions и open-vocabulary detection) в единую формулировку поиска соответствий, преобразовав разнородные датасеты в унифицированный формат. Экспериментальные результаты демонстрируют значительное улучшение метрики F1 на 48% на датасетах с длинными подписями и на 29% в zero-shot сценариях на LVIS.'}, 'en': {'title': 'Bridging Text and Image: A Unified Approach to Vision-Language Grounding', 'desc': 'This paper addresses the challenge of vision-language grounding by proposing a bidirectional approach to identify correspondences between text and image segments. Unlike traditional methods that assume the relevant text is known, this approach aims to discover which parts of the text refer to visual elements in the image. The authors introduce ConCor-1, a model that utilizes learnable bridge tokens to predict text and image masks along with a correspondence score for each token. Their experiments demonstrate that ConCor-1 significantly improves performance on various grounding tasks, showcasing its effectiveness in unifying different grounding challenges.'}, 'zh': {'title': '双向概念对应：视觉与语言的深度结合', 'desc': '本文探讨了视觉与语言的结合，提出了一种双向概念对应的方法来解决图像与文本之间的关系。与传统的单向定位问题不同，该方法不假设已知的文本短语，而是从图像和文本对中恢复所有视觉参考文本与图像片段之间的对应关系。我们引入了ConCor-1模型，该模型基于预训练的视觉-语言模型，使用可学习的桥接标记来表示候选的图像-文本对应关系，并为每个标记预测文本掩码、图像掩码和对应存在分数。实验结果表明，ConCor-1在多个基准测试中表现优异，显著提高了对应F1分数。'}}}, {'id': 'https://huggingface.co/papers/2608.09848', 'title': 'CEAA: A Cognitive Embodied Agents Architecture for Interactive Computing Systems', 'url': 'https://huggingface.co/papers/2608.09848', 'abstract': 'Abstract  The development of embodied Intelligent Virtual Agents (IVAs) that have cognitive capabilities in real-time interactive virtual environments remains a challenge, even with today\'s advancements in technology. Existing architectures are often focused on either the implementation of low-level reactive control systems that are constrained by commercial game engines, or high-level representations of reasoning models that can be difficult to implement in virtual worlds. This paper builds on that notion and proposes a modular cognitive architecture for deploying embodied IVAs. This architecture builds on existing, pre-established frameworks such as the Sense-Think-Act paradigm and the Belief-Desire-Intention cognitive model, among others, and aims to provide a reusable implementation-oriented framework as a template for deploying IVA "brains" in interactive 3D computing systems. The proposed architecture contributes by providing a modular, implementation-oriented framework for the deployment of embodied, cognitive-capable IVAs and bridges the gap between high-level agent reasoning models with real-time embodied execution, for scalable, adaptive, and explainable agents in complex interactive virtual environments.', 'score': 0, 'issue_id': 2916, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': '491a8e5df1e6d5c6', 'authors': ['Aimilios Hadjiliasi', 'Louis Nisiotis'], 'affiliations': ['InSPIRE Research Center', 'University of Central Lancashire, Cyprus'], 'pdf_title_img': 'assets/pdf/title_img/2608.09848.jpg', 'data': {'categories': ['#agents', '#architecture', '#3d'], 'emoji': '🤖', 'ru': {'title': 'Модульная архитектура для когнитивных виртуальных агентов в реальном времени', 'desc': 'В статье предлагается модульная когнитивная архитектура для развертывания воплощённых интеллектуальных виртуальных агентов в интерактивных 3D-окружениях. Архитектура основана на проверенных парадигмах, включая Sense-Think-Act и модель Belief-Desire-Intention, обеспечивая мост между высокоуровневыми моделями рассуждения агента и реальным временем исполнения. Предложенный фреймворк предоставляет переиспользуемый шаблон для внедрения интеллектуального поведения агентов в виртуальные миры, обходя ограничения коммерческих игровых движков. Система позволяет создавать масштабируемых, адаптивных и интерпретируемых агентов для сложных интерактивных сценариев.'}, 'en': {'title': 'Bridging the Gap for Smart Virtual Agents', 'desc': 'This paper addresses the challenge of creating Intelligent Virtual Agents (IVAs) that can think and act in real-time within virtual environments. It critiques existing systems that either rely on simple reactive controls or complex reasoning models that are hard to implement. The authors propose a modular cognitive architecture that combines established frameworks like Sense-Think-Act and Belief-Desire-Intention to create a more practical solution. This new architecture aims to make it easier to deploy cognitive agents that are scalable, adaptive, and capable of explaining their actions in interactive 3D settings.'}, 'zh': {'title': '构建具身智能虚拟代理的模块化认知架构', 'desc': '本文探讨了在实时交互虚拟环境中开发具备认知能力的具身智能虚拟代理（IVA）的挑战。现有架构通常集中于低级反应控制系统或难以在虚拟世界中实现的高级推理模型。本文提出了一种模块化的认知架构，旨在为具身IVA的部署提供可重用的实现导向框架。该架构结合了现有的感知-思考-行动范式和信念-欲望-意图模型，旨在实现可扩展、适应性强且可解释的智能代理。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (8)', '#agi', '#alignment', '#architecture (3)', '#audio', '#benchmark (7)', '#cv (1)', '#data', '#dataset (3)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (1)', '#interpretability (2)', '#leakage (1)', '#long_context (3)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual (2)', '#multimodal (4)', '#open_source (8)', '#optimization (6)', '#plp (2)', '#rag', '#reasoning (4)', '#rl (2)', '#rlhf (5)', '#robotics (1)', '#science (2)', '#security (1)', '#small_models (1)', '#story_generation', '#survey', '#synthetic', '#training (6)', '#transfer_learning (4)', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-11 08:06',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-11 08:06')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-11 08:06')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
