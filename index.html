thesis.  Generated by thinkingmachines/Inkling-Small We present FlashRender, a few-step generative rendering framework that retakes a source video along a target camera trajectory in seconds. We identify sampling-step-dependent camera control as a prominent manifestation of discretization error in existing multi-step generative rendering models and show that resolving this inconsistency substantially lowers denoising trajectory curvature, facilitating subsequent step distillation. To this end, we introduce Representation Transformation and Alignment (RETA), which aligns hidden source-video representations with target-video features from a frozen visual geometry model. This directly encodes the geometric transformation within the source-video stream, enabling sampling-step-consistent camera control. We then fine-tune the model with the MeanFlow objective on the lower-curvature denoising trajectory induced by RETA, allowing the model to more effectively address discretization error. Finally, we apply on-policy flow map distillation to correct self-rollout errors under fixed few-step sampling. Extensive experiments show that RETA, MeanFlow, and on-policy flow map distillation play complementary roles in few-step generative rendering. Together, they enable our approach to match multi-step baselines in video quality and geometric consistency at 25x lower sampling cost while achieving superior camera controllability, even under out-of-distribution target camera trajectories.', 'score': 6, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'e8b73307693bbcef', 'authors': ['Byeongjun Park', 'Byung-Hoon Kim', 'Hyungjin Chung'], 'affiliations': ['EverEx', 'Korea University', 'Yonsei University'], 'pdf_title_img': 'assets/pdf/title_img/2609.03563.jpg', 'data': {'categories': ['#video', '#training', '#inference'], 'emoji': '🎬', 'ru': {'title': 'Молниеносная генерация видео с точным управлением камерой', 'desc': 'FlashRender — это система для быстрого синтеза видео с контролем камеры, которая генерирует высококачественное видео за несколько шагов вместо традиционного многошагового подхода. Авторы решили проблему несогласованности управления камерой на разных этапах шумоудаления, введя метод выравнивания представлений RETA, который согласует скрытые представления исходного видео с геометрическими признаками целевого видео. Они применили objective функцию MeanFlow для оптимизации траектории денойзирования и on-policy дистилляцию потоков для исправления ошибок самораскрутки при малом числе шагов. Эксперименты показывают, что FlashRender достигает качества многошагового синтеза при 25 раз меньших вычислительных затратах и обеспечивает превосходный контроль камеры.'}, 'en': {'title': 'Accelerating Video Rendering with Smart Alignment and Distillation', 'desc': 'FlashRender is a generative video rendering framework that enhances the speed and quality of video synthesis by aligning representations and minimizing errors in camera control. It addresses the issue of discretization error in multi-step rendering by introducing Representation Transformation and Alignment (RETA), which ensures consistent camera control across sampling steps. The framework also employs a MeanFlow objective to fine-tune the model, reducing trajectory curvature and improving denoising performance. Additionally, on-policy flow map distillation is used to correct errors during the rendering process, resulting in high-quality video outputs with significantly lower computational costs.'}, 'zh': {'title': 'FlashRender：高效的生成视频渲染新方法', 'desc': 'FlashRender 是一种加速生成视频渲染的框架，通过表示对齐、均值流目标和在线蒸馏来实现高质量的少步摄像机控制合成。该方法解决了现有多步生成渲染模型中的离散化误差，显著降低了去噪轨迹的曲率，从而促进了后续的步骤蒸馏。我们引入了表示转换和对齐（RETA），将源视频的隐藏表示与目标视频特征对齐，直接编码几何变换。通过均值流目标的微调和在线流图蒸馏，我们的模型在视频质量和几何一致性上与多步基线相匹配，同时在采样成本上降低了25倍。'}}}, {'id': 'https://huggingface.co/papers/2609.04128', 'title': 'Environment Evolution for Terminal Agents', 'url': 'https://huggingface.co/papers/2609.04128', 'abstract': "Abstract Environment evolution incrementally raises task difficulty off-policy to sustain continuous learning signals for terminal agents, improving benchmark performance through multi-agent harnesses.  Generated by thinkingmachines/Inkling-Small Scaling interactive and verifiable environments is critical for training terminal agents. As frontier models become more capable, environments synthesized from scratch become less challenging and thus provide limited learning signals. Recent co-evolution methods iteratively synthesize environments near the model's learnable frontier based on weaknesses exposed during rollouts. However, their dependence on on-policy rollouts limits generalization and the continuous provision of learning signals as the model becomes stronger. In this paper, we propose environment evolution, which incrementally increases environment difficulty off-policy and schedules the evolved environments generation by generation during training to provide continuous learning signals. We derive three evolution directions that influence environment difficulty from the multi-turn learning objective and then implement evolution along these directions through a loop-engineered multi-agent harness. Quantitative rollout experiments with Hy4 preview, Claude Opus 5, and GPT-5.6 Sol show that environment evolution consistently produces more difficult environments. We validate its effectiveness on Qwen3.6-27B and Qwen3.6-35B-A3B through simple long-horizon RL training, improving their performance by 14.4 and 18.0 percentage points on Terminal-Bench 2.1, respectively.", 'score': 4, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'a5b17e5ffee0db54', 'authors': ['Zhiyuan Fan', 'Tinghao Yu', 'Yuanjun Cai', 'Jiang Zhou', 'Jiangtao Guan', 'Jincheng Liu', 'Yun Yang', 'Dingxin Hu', 'Zhuo Han', 'Xing Wu', 'Feng Zhang', 'Lilin Wang'], 'affiliations': ['Tencent', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.04128.jpg', 'data': {'categories': ['#rl', '#agents', '#training', '#benchmark'], 'emoji': '🌱', 'ru': {'title': 'Эволюция окружения: непрерывное усложнение задач для обучения агентов', 'desc': 'В этой работе предлагается метод эволюции окружения, который постепенно повышает сложность задач во время обучения агентов. Ключевое отличие от существующих подходов заключается в использовании off-policy обучения, что позволяет продолжать генерировать сложные задачи даже когда модель становится сильнее. Авторы выводят три направления эволюции окружения на основе многошагового обучения с подкреплением и реализуют их через специальную архитектуру с несколькими агентами. Экспериментальные результаты показывают, что предложенный метод значительно улучшает производительность моделей на бенчмарке Terminal-Bench 2.1 на 14-18 процентных пункта.'}, 'en': {'title': 'Evolving Environments for Continuous Learning in RL', 'desc': "This paper introduces a method called environment evolution, which aims to enhance the training of terminal agents by incrementally increasing the difficulty of the environments they operate in. By generating these challenging environments off-policy, the approach allows for continuous learning signals that adapt as the agents improve. The authors identify three key directions for evolving environment difficulty based on the agents' learning objectives and implement this through a multi-agent system. Experimental results demonstrate that this method significantly boosts the performance of various models in long-horizon reinforcement learning tasks."}, 'zh': {'title': '环境进化：提升智能体学习的关键', 'desc': '本文提出了一种环境进化的方法，通过逐步增加环境的难度来支持终端智能体的持续学习。我们设计了三种影响环境难度的进化方向，并通过多智能体系统实现了这些方向的进化。实验结果表明，环境进化能够生成更具挑战性的环境，从而提高智能体的学习效果。最终，我们在多个模型上验证了该方法的有效性，显著提升了它们在基准测试中的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.30391', 'title': 'Using Grounded Theory for Agent Behavior Analysis at Scale', 'url': 'https://huggingface.co/papers/2608.30391', 'abstract': 'Abstract AutoTraceGT automates grounded theory coding on agent trajectories to build task-specific behavioral taxonomies that recover and extend human failure-mode annotations for downstream prediction.  Generated by thinkingmachines/Inkling-Small Understanding agent behavior requires methods that scale to thousands of trajectories and surface new patterns in long, often unfamiliar tasks where pre-built classifiers fall short. We propose to bring grounded theory into agent trajectory analysis: a six-decade-old qualitative method from the social sciences, with a principled saturation criterion and an auditable trail from data to theory. We propose AutoTraceGT (Automated Trace analysis through Grounded Theory), the first multi-agent pipeline that automates grounded theory on agent trajectories. It iteratively performs open, axial, and theoretical coding until saturation, producing a behavioral taxonomy tailored to each task. Across six trajectory corpora, AutoTraceGT produces codebooks that recover 73-91 percent of the failure modes in human-annotated taxonomies and surface additional patterns that those taxonomies miss. The emergent theoretical narrative aligns with prior expert accounts. Used as a deductive feature space, the codebook outperforms zero-shot and few-shot LLM baselines on downstream failure prediction. These results suggest Grounded Theory offers a scalable analytic tool for ML researchers and agent developers studying what agents actually do.', 'score': 4, 'issue_id': 3216, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'b32775c9571c6e36', 'authors': ['Zhuoran Lu', 'Yangyang Yu', 'Zhuoyan Li', 'Yibo Meng', 'Nan Jiang', 'Chengxi Zang', 'Jie Gao', 'Ziang Xiao'], 'affiliations': ['Cornell University', 'Johns Hopkins University', 'Purdue University', 'Stevens Institute of Technology', 'University of Texas at El Paso'], 'pdf_title_img': 'assets/pdf/title_img/2608.30391.jpg', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Автоматическое открытие поведенческих паттернов агентов через обоснованную теорию', 'desc': 'AutoTraceGT автоматизирует методологию обоснованной теории для анализа траекторий агентов, создавая задачеспецифичные классификации поведения. Система итеративно выполняет открытое, осевое и теоретическое кодирование до достижения насыщения, извлекая из данных структурированную таксономию. Полученные кодовки восстанавливают 73-91% ошибок, аннотированных людьми, и одновременно выявляют новые поведенческие паттерны. При использовании в качестве признаков для предсказания отказов система превосходит нулевое обучение и few-shot подходы с LLM.'}, 'en': {'title': 'Automating Behavioral Insights from Agent Trajectories', 'desc': 'AutoTraceGT is a novel approach that automates the process of grounded theory coding for analyzing agent trajectories, which helps in creating specific behavioral taxonomies. This method is particularly useful for understanding complex agent behaviors in tasks where traditional classifiers struggle. By applying grounded theory, AutoTraceGT systematically identifies and categorizes behaviors until a saturation point is reached, ensuring comprehensive coverage of failure modes. The resulting codebooks not only align with human annotations but also reveal additional insights, enhancing predictive performance in downstream tasks.'}, 'zh': {'title': '自动化代理轨迹分析的新方法', 'desc': 'AutoTraceGT 是一种自动化的 grounded theory 编码方法，专注于代理轨迹分析，以构建特定任务的行为分类法。该方法能够处理成千上万的轨迹，并在复杂任务中发现新的模式，克服传统分类器的局限。通过迭代进行开放、轴心和理论编码，AutoTraceGT 生成的行为分类法能够恢复人类注释的失败模式，并发现额外的模式。研究结果表明，Grounded Theory 为机器学习研究者和代理开发者提供了一种可扩展的分析工具，帮助理解代理的实际行为。'}}}, {'id': 'https://huggingface.co/papers/2609.04200', 'title': 'Principia: Relational Physics Tests for Video Models', 'url': 'https://huggingface.co/papers/2609.04200', 'abstract': 'Abstract Principia evaluates video generators on Newtonian physics via calibration-independent relational consistency across paired objects, revealing major physical reasoning gaps.  Generated by thinkingmachines/Inkling-Small Evaluating physical reasoning in video models is difficult because absolute motion measurements depend on frame rate, object scale, and camera calibration, all of which are often ambiguous or unavailable in generated video. We propose a different approach. When two objects in the same scene obey the same physical law, their motions must satisfy predictable relationships, and these relationships hold independent of calibration. We introduce Principia, a benchmark that evaluates Newtonian physics through relational consistency between paired objects. Principia spans eight phenomena - gravity, restitution, friction, rotational inertia, projectile motion, momentum, pendulum, and mass-spring oscillation - across translational, rotational, collisional, and oscillatory dynamics, using real-world scenes recorded under controlled protocols. We also introduce a calibration-independent consistency score that quantifies physical violation directly in image space. Across thousands of generations from six state-of-the-art video generators, no model exceeds 0.42 on Principia despite all scoring around 0.8 on VBench. Vision-language models are evaluated on their ability to detect relational physics violations, with the best model achieving only 67% accuracy and most performing near chance level.', 'score': 2, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'a5f5b6c937c1efbb', 'authors': ['Varun Varma Thozhiyoor', 'Shivam Tripathi', 'Venkatesh Babu Radhakrishnan', 'Anand Bhattad'], 'affiliations': ['Indian Institute of Science', 'Johns Hopkins University'], 'pdf_title_img': 'assets/pdf/title_img/2609.04200.jpg', 'data': {'categories': ['#science', '#video', '#reasoning', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Физика в фокусе: проверка понимания механики через парные объекты', 'desc': 'В статье представлен бенчмарк Principia для оценки понимания классической механики видеогенераторами на основе проверки релационной согласованности движения парных объектов. Авторы предлагают калибровочно-независимый подход, который использует тот факт, что объекты, подчиняющиеся одним физическим законам, должны иметь предсказуемые отношения движений независимо от калибровки камеры. Бенчмарк охватывает восемь физических явлений: гравитацию, упругость, трение, моментальную инерцию, движение снаряда, импульс, маятник и колебания массы на пружине. Результаты показывают серьезные пробелы в физическом рассуждении современных моделей - лучшие генераторы набирают только 0.42 балла, а видео-языковые модели достигают всего 67% точности в обнаружении физических нарушений.'}, 'en': {'title': 'Evaluating Video Generators with Newtonian Physics', 'desc': 'The paper introduces Principia, a benchmark designed to evaluate video generators based on their understanding of Newtonian physics through relational consistency between paired objects. It addresses the challenge of measuring physical reasoning in generated videos, which is complicated by factors like frame rate and camera calibration. By focusing on predictable relationships between objects that obey the same physical laws, Principia provides a calibration-independent consistency score to assess physical accuracy. The results show that current state-of-the-art video generators struggle with physical reasoning, achieving low scores on the benchmark despite performing well on other evaluation metrics.'}, 'zh': {'title': '评估视频生成模型的物理推理能力', 'desc': '本文介绍了一个名为Principia的基准，用于评估视频生成模型在牛顿物理学方面的表现。通过比较同一场景中成对物体的运动关系，Principia能够独立于校准评估物理一致性。研究涵盖了八种物理现象，包括重力、恢复力、摩擦力等，使用真实场景进行测试。结果显示，尽管视频生成模型在其他基准上表现良好，但在Principia上没有模型的得分超过0.42，表明它们在物理推理方面存在显著缺陷。'}}}, {'id': 'https://huggingface.co/papers/2609.03820', 'title': 'Select, Compress, Reinvest: A Controlled Study of Visual-Token Allocation in Long-Video MLLMs', 'url': 'https://huggingface.co/papers/2609.03820', 'abstract': "Abstract Frame selection dominates accuracy in long-video language models, while spatial compression is nearly free if savings are reinvested into more frames, and a unified harness is needed to compare selectors fairly.  Generated by thinkingmachines/Inkling-Small Long-video language models cannot look at every frame: an hour sampled once per second is 3,600 images, and a system keeps only a small fixed slice of that pool. Which frames survive that slice is usually treated as a preprocessing detail; we test whether it should be. Published selectors make the comparison hard because they change the frame scorer, the prompt boundary, the resolution policy, and the answering model all at once. We hold each fixed and vary one decision at a time: selection, spatial compression, and reinvestment of the savings, across six training-free selection rules, three long-video benchmarks, and two answering models. Selection is the largest single lever: on LongVideoBench's hour-long bin, eight query-selected frames beat sixteen uniformly spaced ones by 6.9 points, and Orthogonal Matching Pursuit, an unmodified decades-old sparse-approximation algorithm, matches or comes within a point of every purpose-built selector we compare it against, across all three benchmarks. Compression is close to free: halving each frame's spatial budget at fixed timestamps costs at most 0.44 points. Reinvestment is where that budget turns back into accuracy: spending the freed tokens on twice as many compressed frames, at a measured cost no higher than the original eight, returns a further two to three points; compression only pays off once its savings are spent this way. Along the way, an implementation bug in our own AKS baseline and a 0.07 to 3.74 point gap between two harnesses running the same published rules at the same budget show why these comparisons need to happen inside one controlled harness rather than across papers.", 'score': 2, 'issue_id': 3217, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '55bcf25c49915925', 'authors': ['Prakhar Khatri'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2609.03820.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#long_context', '#video'], 'emoji': '🎬', 'ru': {'title': 'Выбор кадров — главный рычаг для понимания длинных видео', 'desc': 'В работе исследуется проблема выбора кадров для длинных видео в языковых моделях зрения. Авторы проводят контролируемое сравнение различных стратегий отбора кадров, пространственной компрессии и переинвестирования сэкономленных токенов, варьируя каждый фактор независимо. Результаты показывают, что выбор кадров — это наиболее влиятельный фактор, и простой алгоритм Orthogonal Matching Pursuit, разработанный десятки лет назад, конкурирует с современными специализированными селекторами. Исследование демонстрирует, что пространственная компрессия почти не влияет на качество, если сэкономленные вычислительные ресурсы переинвестировать в большее количество кадров.'}, 'en': {'title': 'Maximizing Accuracy in Long-Video Language Models through Smart Frame Selection', 'desc': 'This paper investigates how frame selection impacts the accuracy of long-video language models. It highlights that while spatial compression of frames is inexpensive, the real gains in accuracy come from effectively reinvesting the savings into selecting more frames. The authors conduct a systematic comparison of various frame selection methods, showing that selection is the most significant factor influencing performance. They also emphasize the need for a unified framework to ensure fair comparisons among different selectors and methods.'}, 'zh': {'title': '帧选择是长视频模型准确性的关键', 'desc': '本论文探讨了长视频语言模型中的帧选择对准确性的影响。研究表明，选择合适的帧是提高模型性能的关键，而空间压缩几乎是免费的，只要将节省的资源重新投资于更多的帧。我们通过固定其他变量，逐一测试帧选择、空间压缩和节省的再投资，发现帧选择是影响准确性的最大因素。最后，论文强调了在统一的框架下进行比较的重要性，以确保结果的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2609.01072', 'title': 'Let Confidence Change, Not the Prediction: Prediction-Preserving Repair for Post-hoc Calibration', 'url': 'https://huggingface.co/papers/2609.01072', 'abstract': "Abstract CORD is a post-fit adapter that repairs calibrated probability vectors to exactly preserve original top-1 predictions while maintaining calibration quality.  Generated by thinkingmachines/Inkling-Small Post-hoc calibration corrects reported confidence, yet a multiclass calibrator can also change the associated top-1 prediction. Accuracy captures only the net effect of these changes on correctness, not how often predictions change; the Top-1 Prediction Change Rate (TPCR) instead measures this frequency. We propose Calibrator-Output Repair for Top-1 Decision Preservation (CORD), the first post-fit adapter to impose exact prediction preservation by repairing the full calibrated probability vector. From the original and calibrated outputs alone, CORD determines the mass assigned to the original top-1. The calibrated conditional distribution allocates the remaining mass over the other classes, yielding a repaired vector whose own argmax recovers the original prediction. On the calibration split, CORD coordinates the repaired masses to retain the calibrated outputs' mean mass on original predictions whenever attainable. The adapter alters neither the fitted calibrator nor its direct output, fits no additional supervised map, and requires no user- or validation-tuned hyperparameter. Across CIFAR-10/100 and ImageNet-1K, CORD attains zero TPCR by construction and lowers mean ECE, NLL, and Brier relative to the corresponding direct outputs in every dataset; paired gains persist under distribution shift and across calibration-set sizes. CORD thus removes the preservation constraint from calibrator fitting and assigns exact recovery of the original decision to subsequent output repair. Our code is available at https://github.com/labhai/CORD.", 'score': 2, 'issue_id': 3216, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': 'c35dcb626723965e', 'authors': ['Daehwan Kim', 'Haejun Chung', 'Ikbeom Jang'], 'affiliations': ['Hankuk University of Foreign Studies, Yongin, Republic of Korea', 'Hanyang University, Seoul, Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2609.01072.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Сохраняем старые предсказания, улучшаем откалиброванность', 'desc': 'CORD — это post-hoc адаптер, который восстанавливает откалиброванные вероятностные векторы, сохраняя исходные топ-1 предсказания модели при одновременном улучшении калибровки. Авторы показывают, что стандартная калибровка может случайно изменять основное предсказание классификатора, что не отражается метрикой accuracy. Они предлагают новую метрику TPCR (Top-1 Prediction Change Rate) для измерения частоты изменения предсказаний при калибровке. CORD работает как лёгкий постобработчик, который переделает вероятности так, чтобы argmax остался на исходном классе, одновременно улучшая калибровку по метрикам ECE и NLL.'}, 'en': {'title': 'Preserving Predictions with CORD: Calibration Without Compromise', 'desc': 'CORD is a novel post-fit adapter designed to enhance the calibration of probability vectors while ensuring that the original top-1 predictions remain unchanged. It achieves this by repairing the calibrated outputs without altering the underlying calibrator or requiring additional training. The method introduces the Top-1 Prediction Change Rate (TPCR) to measure how often predictions change, and CORD guarantees a TPCR of zero, meaning predictions are preserved. By maintaining high calibration quality and improving metrics like Expected Calibration Error (ECE) and Negative Log-Likelihood (NLL), CORD effectively balances prediction accuracy with reliability across various datasets.'}, 'zh': {'title': 'CORD：精准保留Top-1预测的校准适配器', 'desc': 'CORD是一种后处理适配器，旨在修复经过校准的概率向量，以精确保留原始的Top-1预测，同时保持校准质量。它通过修复完整的校准概率向量，确保在不改变拟合校准器或其直接输出的情况下，保留原始预测。CORD能够在不同数据集上实现零的Top-1预测变化率，并降低均值预期校准误差、负对数似然和Brier分数。该方法在分布变化和校准集大小变化下仍能保持效果，展示了其在机器学习模型校准中的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.29253', 'title': 'QCell: Recombining and Aligning Cell Queries for Overlapping Instance Segmentation', 'url': 'https://huggingface.co/papers/2608.29253', 'abstract': 'Abstract QCell is a query-based model that improves instance segmentation of overlapping microscopy cells through latent-space recombination and contrastive query alignment.  Generated by thinkingmachines/Inkling-Small Instance segmentation of overlapping cells in microscopy remains challenging due to semi-transparent structures that produce weak boundaries and mixed visual evidence in overlap regions. Existing methods address this through local regions of interest or shape priors but lack global reasoning across overlapping objects. We present QCell, a novel query-based model that de-overlaps cell instances in microscopy scenes. Our approach combines (i) an instance recombination module that decomposes and recombines query representations in latent space, enabling the model to reason about complete object structure under overlap, and (ii) a contrastive query alignment objective that combines distinctive instance feature learning and separation of overlapping cell queries. We additionally introduce a new Organoid dataset benchmark for overlapping cell segmentation. We show that QCell outperforms state-of-the-art methods across multiple benchmarks, achieving +2.2 AP and +2.7 AJI on ISBI2014. Code is available at https://github.com/SlavkoPrytula/QCell', 'score': 2, 'issue_id': 3217, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': '3b5b4d7b6cf946c6', 'pdf_title_img': 'assets/pdf/title_img/2608.29253.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#healthcare', '#cv', '#architecture'], 'emoji': '🔬', 'ru': {'title': 'Разделение перекрывающихся клеток через контрастивное выравнивание запросов', 'desc': 'QCell — это модель на основе запросов (query-based), которая улучшает сегментацию перекрывающихся клеток в микроскопических изображениях. Модель использует рекомбинацию представлений в латентном пространстве и контрастивное выравнивание запросов для разделения перекрывающихся экземпляров клеток. Ключевой компонент — модуль рекомбинации экземпляров, который разлагает и перекомбинирует представления запросов, позволяя модели рассуждать о полной структуре объектов под перекрытием. Авторы также представили новый датасет Organoid и продемонстрировали превосходство QCell над существующими методами на нескольких бенчмарках.'}, 'en': {'title': 'QCell: Revolutionizing Overlapping Cell Segmentation in Microscopy', 'desc': 'QCell is a novel model designed to enhance instance segmentation of overlapping cells in microscopy images. It utilizes a unique approach that involves recombining query representations in latent space, allowing the model to better understand the structure of overlapping objects. Additionally, it employs a contrastive query alignment objective to improve the learning of distinct features and effectively separate overlapping cell instances. The model has been tested on a new Organoid dataset and has shown significant improvements over existing methods, achieving higher average precision and adjusted Jaccard index scores.'}, 'zh': {'title': 'QCell：重叠细胞实例分割的新突破', 'desc': 'QCell是一种基于查询的模型，旨在改善显微镜细胞的实例分割，特别是重叠细胞的处理。该模型通过潜在空间重组和对比查询对齐来解决细胞重叠带来的挑战。QCell结合了实例重组模块和对比查询对齐目标，使模型能够在重叠区域内推理完整的物体结构。实验结果表明，QCell在多个基准测试中优于现有的最先进方法，显著提高了分割精度。'}}}, {'id': 'https://huggingface.co/papers/2609.02373', 'title': 'Percolation Dynamics in Optimization : Variance Cascades and Discrete Scale Invariance', 'url': 'https://huggingface.co/papers/2609.02373', 'abstract': 'Abstract Stochastic gradient descent dynamics are modeled as a percolation process where architectural symmetries cause subnetworks to merge in discrete blocks, producing variance spikes resembling phase transitions, with similar trapping behavior extending to Adam and AdamW under heavy-tailed noise.  Generated by thinkingmachines/Inkling-Small We study the dynamics of Stochastic Gradient Descent (SGD), which is known to steer deep neural networks toward invariant sets that correspond to simpler subnetworks. How this steering unfolds over time remains poorly understood. We answer this by modeling the stochastic gradient flow (SGF) as a percolation process, in which architectural symmetries force subnetworks to merge in discrete simultaneous blocks rather than one at a time. These structural transitions register as variance spikes in a macroscopic order parameter, echoing physical phase transitions. We further show this trapping mechanism and its associated scaling cascade extend to Adam and AdamW under an explicit heavy-tailed noise model.', 'score': 1, 'issue_id': 3216, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '1a65933a60480f29', 'pdf_title_img': 'assets/pdf/title_img/2609.02373.jpg', 'data': {'categories': ['#architecture', '#training'], 'emoji': '🌊', 'ru': {'title': 'Фазовые переходы в динамике градиентного спуска: перколяция и слияние подсетей', 'desc': 'В работе исследуется динамика стохастического градиентного спуска (SGD) через призму теории перколяции, где архитектурные симметрии нейросети вызывают слияние подсетей блоками, что проявляется скачками дисперсии наподобие фазовых переходов. Авторы моделируют стохастический градиентный поток как процесс перколяции и демонстрируют, что подсети объединяются одновременно блоками, а не постепенно, создавая эффекты, аналогичные физическим фазовым переходам. Показано, что механизм трapping (застревания) и связанный с ним каскад масштабирования распространяются также на оптимизаторы Adam и AdamW в условиях тяжелохвостого распределения шума. Исследование проливает свет на ранее неясные аспекты того, как градиентные методы направляют сети к упрощённым конфигурациям на протяжении обучения.'}, 'en': {'title': 'Understanding SGD Dynamics Through Percolation Processes', 'desc': 'This paper explores how Stochastic Gradient Descent (SGD) influences the training of deep neural networks by modeling its dynamics as a percolation process. It reveals that architectural symmetries in the networks lead to the merging of subnetworks in discrete blocks, rather than sequentially. This merging creates variance spikes that are similar to phase transitions observed in physics. Additionally, the study extends these findings to optimization algorithms like Adam and AdamW, demonstrating that they exhibit similar trapping behaviors under heavy-tailed noise conditions.'}, 'zh': {'title': '随机梯度下降的渗流过程与相变现象', 'desc': '本文研究了随机梯度下降（SGD）的动态过程，提出将其建模为渗流过程。网络的结构对称性导致子网络以离散块的形式合并，从而产生类似于相变的方差峰值。我们发现，这种结构转变在宏观参数中表现为方差的剧烈波动，类似于物理中的相变现象。此外，我们还展示了这种捕获机制及其相关的尺度级联在Adam和AdamW算法中也适用，尤其是在重尾噪声模型下。'}}}];

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (2)', '#agi', '#alignment (1)', '#architecture (3)', '#audio (1)', '#benchmark (8)', '#cv (2)', '#data', '#dataset (4)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (2)', '#interpretability', '#leakage', '#long_context (4)', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (7)', '#open_source (6)', '#optimization (7)', '#plp (2)', '#rag (1)', '#reasoning (5)', '#rl (2)', '#rlhf', '#robotics', '#science (1)', '#security', '#small_models (3)', '#story_generation', '#survey', '#synthetic', '#training (9)', '#transfer_learning (3)', '#video (8)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-04 14:40',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-04 14:40')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-04 14:40')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
