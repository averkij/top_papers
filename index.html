    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.28402', 'title': 'StreamEval: Evaluating Interactive Streaming Video Generation Models', 'url': 'https://huggingface.co/papers/2610.28402', 'abstract': 'Abstract StreamEval benchmarks interactive streaming video generation across five tasks, revealing that reliable request execution and sustained state consistency remain major challenges despite high visual quality.  Generated by thinkingmachines/Inkling-Small As streaming video generation advances, enabling real-time interaction with generated video is becoming increasingly important. We introduce StreamEval, a unified benchmark for interactive streaming video generation spanning five tasks: avatar dialogue, avatar performance, world generation, instruction editing, and reference editing. StreamEval comprises 300 scripted test cases lasting 15-300s, each specifying initial assets, incrementally arriving multimodal requests, and explicit requirements for state changes and content preservation. Performance is assessed along four evaluation dimensions: task execution, state consistency, visual fidelity, and audiovisual coordination, instantiated through ten task-specific metrics on a 0-100 scale. Evaluating 37 distinct models across 300 test cases, we find that high visual quality and identity retention do not necessarily coincide with reliable request execution or sustained state consistency. In particular, request execution remains challenging: the highest task-specific scores are 36.90 for Following among seven avatar-performance models, 25.93 for Following in text-conditioned world generation, and 15.00 for Edit Success among three reported reference-editing models. These findings identify reliable request execution under timing and preservation constraints as a central challenge for advancing omni-modal real-time interactive systems. The leaderboard is available at https://streameval.ai', 'score': 342, 'issue_id': 3447, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': 'eded2e0f919c9b25', 'authors': ['StreamEval Team'], 'affiliations': ['CMU', 'NUS', 'NVIDIA', 'Princeton', 'Reactor', 'Tsinghua University', 'UC Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2610.28402.jpg', 'data': {'categories': ['#video', '#survey', '#benchmark', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Качество картинки не равно надёжности: главный вызов интерактивного видео — выполнять запросы', 'desc': 'Статья представляет StreamEval — единый бенчмарк для оценки интерактивной потоковой генерации видео, включающий пять задач: диалог аватара, исполнение аватаром, генерацию мира, редактирование по инструкции и редактирование по референсу. Бенчмарк содержит 300 сценарных тест-кейсов длительностью 15–300 секунд и оценивает модели по четырём измерениям: выполнение задач, консистентность состояния, визуальная достоверность и аудиовизуальная координация. Оценка 37 моделей показала, что высокое визуальное качество и сохранение идентичности не гарантируют надёжного выполнения запросов и устойчивой консистентности состояния. Главной проблемой остаётся надёжное исполнение запросов с учётом временных ограничений и требований сохранения контента, что выступает ключевым вызовом для omni-modal систем реального времени.'}, 'en': {'title': 'StreamEval: Benchmarking Interactive Streaming Video Generation Challenges', 'desc': 'The paper introduces StreamEval, a benchmark designed to evaluate interactive streaming video generation across five specific tasks. It highlights the challenges of maintaining reliable request execution and state consistency, even when visual quality is high. The evaluation involves 300 scripted test cases and assesses performance based on task execution, state consistency, visual fidelity, and audiovisual coordination. The findings reveal that achieving high visual quality does not guarantee effective request handling or consistent state management, indicating significant areas for improvement in real-time interactive systems.'}, 'zh': {'title': 'StreamEval：推动实时交互视频生成的基准挑战', 'desc': '本文介绍了StreamEval，这是一个用于交互式流媒体视频生成的统一基准，涵盖五个任务。尽管生成的视频质量很高，但在请求执行的可靠性和状态一致性方面仍然面临重大挑战。研究评估了37个不同模型在300个测试案例中的表现，发现高视觉质量并不一定与可靠的请求执行或持续的状态一致性相符。本文的结果强调了在时间和内容保留约束下，可靠请求执行是推动全模态实时交互系统发展的核心挑战。'}}}, {'id': 'https://huggingface.co/papers/2610.26659', 'title': 'SpatialScout: Can VLM Agents Actively Explore and Map 3D Scenes?', 'url': 'https://huggingface.co/papers/2610.26659', 'abstract': 'Abstract SpatialScout evaluates vision-language agents on active 3D object mapping, revealing major gaps in precise metric map construction.  Generated by thinkingmachines/Inkling-Small Spatial intelligence requires agents to actively acquire visual evidence and integrate observations into a coherent representation of the three-dimensional world. Yet spatial question answering offers limited evidence of whether models can construct accurate metric maps through autonomous exploration. We introduce SpatialScout, a benchmark for evaluating vision-language model (VLM) agents on active object-level 3D mapping. SpatialScout comprises 80 diverse indoor scenes containing 3,140 target objects. Given an object inventory, RGB observations, camera calibration, and camera poses, agents control a camera to explore each scene and estimate object centers in a shared coordinate frame. The task requires coordinating viewpoint selection, cross-view association, geometric estimation, and map revision under bounded interaction budgets. Evaluation jointly measures localization accuracy and target coverage through object-scale overlap scores that penalize missing predictions. Experiments with frontier VLMs reveal substantial limitations: the strongest evaluated model, Claude Opus 5.5, achieves a mean overlap score of 41.71%, with 47.23% of targets exceeding an intersection-over-union (IoU) threshold of 0.5 and only 3.25% exceeding 0.9. These results reveal a substantial gap between recovering coarse object layouts and constructing complete, precise metric maps. SpatialScout provides a quantitative testbed for developing agents that build reliable 3D spatial representations through active perception. Code is available at https://github.com/JesseZZZZZ/SpatialScout.', 'score': 129, 'issue_id': 3448, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '34c965efbe761083', 'authors': ['Zhaoxi Zhang', 'Hao Liang', 'Linxuan Wu', 'Yiming Wu', 'Yifu Yuan', 'Kun Liang', 'Chenming Tang', 'Meiyi Qiang', 'Wentao Zhang', 'Weikang Li'], 'affiliations': ['Peking University', 'Tianjin University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26659.jpg', 'data': {'categories': ['#benchmark', '#3d', '#agents', '#dataset', '#multimodal', '#cv'], 'emoji': '🗺️', 'ru': {'title': 'От грубой раскладки к точной 3D-карте: агентам ещё далеко до пространственного интеллекта', 'desc': 'SpatialScout — это бенчмарк для оценки VLM-агентов, которые должны активно исследовать трёхмерную сцену и восстанавливать метрическую карту расположения объектов. Агенты управляют камерой, получают RGB-наблюдения, калибровку и позы камеры, а затем оценивают центры 3,140 объектов в 80 indoor-сценах в общей системе координат. Качество измеряется через overlap-оценку, учитывающую точность локализации и покрытие целей, с штрафом за пропущенные предсказания. Эксперименты показали, что даже лучшая модель достигает средней оценки 41.71%, а лишь 3.25% объектов превышают порог IoU 0.9, что указывает на большой разрыв между грубой раскладкой объектов и точной metric map.'}, 'en': {'title': 'Bridging the Gap in 3D Mapping with SpatialScout', 'desc': 'SpatialScout is a benchmark designed to assess vision-language models (VLMs) in their ability to create accurate 3D maps of indoor environments. It involves agents actively exploring scenes to identify and localize objects based on visual evidence, camera calibration, and poses. The evaluation focuses on both localization accuracy and the coverage of target objects, using object-scale overlap scores to measure performance. Results indicate that current VLMs, like Claude Opus 5.5, struggle significantly with precise metric map construction, highlighting the need for improved spatial reasoning in AI agents.'}, 'zh': {'title': 'SpatialScout：评估视觉-语言模型的三维映射能力', 'desc': 'SpatialScout 是一个评估视觉-语言模型（VLM）在主动三维物体映射中的基准。该基准包含80个多样化的室内场景和3140个目标物体，旨在测试模型在自主探索中构建准确度量地图的能力。实验结果显示，当前最强的模型在目标覆盖和定位准确性方面存在显著不足，平均重叠得分仅为41.71%。这表明，尽管模型能够恢复粗略的物体布局，但在构建完整、精确的度量地图方面仍存在较大差距。'}}}, {'id': 'https://huggingface.co/papers/2610.29997', 'title': 'DONIC: Generalist Dexterous Bimanual Tracking Control from Human Demonstrations', 'url': 'https://huggingface.co/papers/2610.29997', 'abstract': 'Abstract DONIC is a generalist bimanual tracker trained on diverse human-motion data that uses reinforcement learning with recycled demonstrations and per-hand rewards to achieve high success on unseen objects without fine-tuning.  Generated by thinkingmachines/Inkling-Small Despite recent progress in dexterous reference tracking, existing models focus primarily on single-hand manipulation and a limited range of interactions, leaving the bimanual dexterous behaviors common in real life unaddressed. The scarcity of contact-rich bimanual manipulation data and the increased complexity of coordinating contacts make developing a generalist bimanual tracker particularly challenging. Therefore, we present 1) DONIC, the first generalist bimanual tracker jointly trained across operation categories and human-motion sources, together with 2) BiHOI, a multi-view dataset of 1,575 sequences spanning 229 objects and emphasizing sustained bimanual interaction, where reconstructed interactions are retargeted into robot references. DONIC combines proximal policy optimization with behavioral cloning in a feedback loop that recycles verified successful executions into training demonstrations. An object-centered per-hand reward maintains object-motion feedback while supervising each hand according to its reference contact role. Clip-Centered Advantages remove reference-dependent advantage offsets while preserving within-trajectory differences. Together, these designs enable one single policy to learn coordinated manipulation across heterogeneous references. Without finetuning, a single checkpoint achieves 86.79% success on unseen trajectories of training objects and 57.32% on held-out objects, surpassing the state-of-the-art bimanual tracking baselines by 77.36 and 45.73 percentage points.', 'score': 124, 'issue_id': 3447, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'ceed873b37c03bda', 'authors': ['Mingze Sun', 'Ziang Cao', 'Yuan Fei', 'Qiankuan Tao', 'Zihan Wang', 'Tianqi Liu', 'Junhao Chen', 'Haiwen Diao', 'Fangzhou Hong', 'Zhaoxi Chen', 'Ziwei Liu'], 'affiliations': ['Ropedia'], 'pdf_title_img': 'assets/pdf/title_img/2610.29997.jpg', 'data': {'categories': ['#rlhf', '#rl', '#robotics', '#dataset', '#data', '#training'], 'emoji': '🤲', 'ru': {'title': 'Одна модель — две руки: универсальный бимануальный трекер без дообучения', 'desc': 'В статье представлена DONIC — универсальная модель для двуручного отслеживания манипуляций, обученная на разнообразных данных о движениях человека. Модель использует обучение с подкреплением (PPO) в сочетании с поведенческим клонированием, а также возвращает успешные демонстрации обратно в обучающую выборку. Для каждой руки применяется объект-центрированная награда, а метод Clip-Centered Advantages устраняет смещения advantage, связанные с эталонной траекторией. Без дообучения одна модель достигает 86.79% успеха на траекториях знакомых объектов и 57.32% на новых, значительно превосходя существующие baseline-подходы.'}, 'en': {'title': 'DONIC: Mastering Bimanual Manipulation with Reinforcement Learning', 'desc': 'The paper introduces DONIC, a novel bimanual tracker that effectively learns to manipulate objects using both hands without needing fine-tuning. It leverages reinforcement learning techniques, specifically proximal policy optimization and behavioral cloning, to improve its performance through recycled demonstrations. The tracker is trained on a diverse dataset called BiHOI, which includes a wide range of bimanual interactions across various objects. DONIC achieves impressive success rates on unseen tasks, significantly outperforming existing models in bimanual dexterous manipulation.'}, 'zh': {'title': 'DONIC：双手灵巧跟踪的新突破', 'desc': 'DONIC是一种通用的双手跟踪器，利用多样的人体运动数据进行训练，采用强化学习和回收演示的方法，能够在未见过的物体上实现高成功率，而无需微调。该模型解决了现有单手操作模型的局限性，专注于双手灵巧行为的跟踪。通过结合近端策略优化和行为克隆，DONIC能够在反馈循环中回收成功执行的示例进行训练。最终，DONIC在未见轨迹上取得了86.79%的成功率，显著超越了现有的双手跟踪基准。'}}}, {'id': 'https://huggingface.co/papers/2610.28577', 'title': 'Cache Engineering for Agents', 'url': 'https://huggingface.co/papers/2610.28577', 'abstract': "Abstract AKV introduces cache engineering to manage LLM agent key-value caches without altering trajectories, improving efficiency and accuracy via drop and repos operations with a co-designed serving engine.  Generated by thinkingmachines/Inkling-Small Large Language Model (LLM) agents can handle increasingly complex tasks, navigating long trajectories of observations and actions. As these trajectories grow, key-value (KV) cache I/O and storage become the dominant cost. Trajectories can also exceed the LLM's maximum context length, requiring control over active cache growth. Prior work uses context engineering to reduce cache size by trimming or summarizing history. However, modifying the trajectory prefix invalidates subsequent cached states and triggers costly re-prefilling of retained context. Task accuracy can also suffer when too little context is retained to limit re-prefill costs. We propose cache engineering as a new scheme. It allows agents to directly control their active KV cache without modifying the trajectory or re-prefilling retained context. Specifically, agents can proactively use drop to exclude selected cache from future attention and repos to adjust retained keys' position encodings. We formalize these cache operations and identify history dependence as a serving challenge: identical token sequences can yield different cache states under different cache operation sequences, making prefix matching insufficient for correct cache reuse. Thus, we co-design the AKV serving engine. It provides a stateless interface compatible with existing serving APIs, while internally managing stateful cache reuse, eviction, and restoration. Experiments show that a tool-response rolling-drop cache policy improves average benchmark scores by 1.7 points and reduces average cost by 27.7%, compared with conventional threshold-triggered summarization. With AKV, it achieves up to 1.2x the output throughput and a 1.5x speedup in P95 request latency. Recursive self-improvement of cache policies further reduces cost by 7.1% over expert design. Our code is at https://github.com/thu-nics/AKV.", 'score': 111, 'issue_id': 3447, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': 'd9c1d8428c55808c', 'authors': ['Tianyu Fu', 'Ruoxi Wang', 'Zihan Min', 'Zhongqi Ren', 'Zhihao Li', 'Tengxuan Liu', 'Shengxu Mu', 'Hanling Zhang', 'Yu Wang'], 'affiliations': ['The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.28577.jpg', 'data': {'categories': ['#optimization', '#inference', '#architecture', '#agents', '#open_source'], 'emoji': '🧠', 'ru': {'title': 'Агент сам управляет своей памятью: KV-кэш без перестройки контекста', 'desc': 'Статья представляет AKV, подход cache engineering, который позволяет LLM-агентам напрямую управлять своим KV-кэшем без изменения траектории и повторного prefill уже сохранённого контекста. Агент может использовать операции drop, чтобы исключать часть кэша из attention, и repos, чтобы корректировать позиционные кодировки сохранённых ключей. Авторы также предлагают co-designed serving engine с stateless-интерфейсом, который внутренне управляет stateful-переиспользованием, вытеснением и восстановлением кэша. В экспериментах стратегия rolling-drop для ответов инструментов повышает средний балл на бенчмарках на 1.7 пункта, снижает стоимость на 27.7% и даёт до 1.2x пропускной способности и 1.5x ускорения P95-латентности.'}, 'en': {'title': 'Optimizing LLM Cache Management with Cache Engineering', 'desc': 'The paper introduces a novel approach called cache engineering to optimize key-value (KV) caches for large language model (LLM) agents. This method allows agents to manage their cache without altering the trajectory of observations and actions, thus maintaining accuracy and efficiency. By implementing operations like drop and repos, agents can control which cache entries are retained and how they are accessed, avoiding the need for costly re-prefilling of context. The proposed AKV serving engine enhances cache management, resulting in significant improvements in performance metrics such as throughput and latency compared to traditional methods.'}, 'zh': {'title': '缓存工程：提升LLM代理效率的新方法', 'desc': '本文提出了一种新的缓存工程方法，用于管理大语言模型（LLM）代理的键值缓存，以提高效率和准确性。通过不改变轨迹，代理可以直接控制其活动的键值缓存，使用丢弃和重新定位操作来优化缓存使用。研究表明，这种方法在基准测试中平均提高了1.7分，并将平均成本降低了27.7%。此外，AKV还实现了更高的输出吞吐量和请求延迟的加速。'}}}, {'id': 'https://huggingface.co/papers/2610.29989', 'title': 'Looking Ahead: Modeling Future Evolution in Autoregressive Video Generation', 'url': 'https://huggingface.co/papers/2610.29989', 'abstract': 'Abstract Future Chunk Prediction improves autoregressive video diffusion by enforcing future-chunk supervision, yielding more physically plausible video generation with reduced training cost.  Generated by thinkingmachines/Inkling-Small Autoregressive video diffusion models generate videos chunk by chunk, yet producing plausible continuations does not guarantee that they capture how scenes evolve. Under teacher forcing, strong temporal redundancy may allow local visual continuity to serve as a shortcut for current-chunk denoising, reducing the pressure to model visual evolution. We introduce Future Chunk Prediction (FCP), an auxiliary objective jointly optimized with teacher-forced denoising that predicts temporally separated chunks without access to the intervening visual context. Drawing supervision directly from training videos, FCP requires no additional pretrained visual encoder and leaves autoregressive inference unchanged. Our method achieves superior physical plausibility over standard teacher-forced autoregressive training with a lower overall training compute budget, highlighting the effectiveness and efficiency of future-chunk supervision for modeling visual evolution. Intriguingly, our visualizations suggest that FCP fosters a more structured representation space, which may be valuable for building autoregressive world models.', 'score': 108, 'issue_id': 3447, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'ea47637b64baac7c', 'authors': ['Ruopeng Gao', 'Yukun Huang', 'Jiarui Hu', 'Shuai Wang', 'Wenbo Hu', 'Ying Shan', 'Limin Wang'], 'affiliations': ['Nanjing University', 'Tencent IEG', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.29989.jpg', 'data': {'categories': ['#video', '#diffusion', '#optimization', '#training'], 'emoji': '🎬', 'ru': {'title': 'Учим модель видео предвидеть будущее, а не просто продолжать кадры', 'desc': 'В статье предлагается Future Chunk Prediction (FCP) — вспомогательная функция потерь для авторегрессионных диффузионных моделей видео, которые генерируют ролики по чанкам. Проблема в том, что при teacher forcing модель может опираться на локальную визуальную непрерывность и не учиться моделировать эволюцию сцены. FCP обучает модель предсказывать удалённые по времени чанки без доступа к промежуточному контексту, используя supervision напрямую из обучающих видео и не требуя дополнительного pretrained visual encoder. Метод даёт более физически правдоподобные видео при меньших вычислительных затратах на обучение и, по-видимому, формирует более структурированное пространство представлений, полезное для world models.'}, 'en': {'title': 'Enhancing Video Generation with Future Chunk Prediction', 'desc': 'The paper introduces Future Chunk Prediction (FCP), a method that enhances autoregressive video diffusion models by adding future-chunk supervision. This approach helps the model generate videos that are more physically realistic while also reducing the computational resources needed for training. FCP works by predicting future video segments without needing to see the segments in between, which encourages the model to learn how scenes change over time. The results show that FCP not only improves the quality of video generation but also creates a more organized representation space, which could be useful for developing advanced autoregressive models.'}, 'zh': {'title': '未来块预测：提升视频生成的物理合理性', 'desc': '未来块预测（FCP）通过引入未来块监督，改善了自回归视频扩散模型的效果，使生成的视频更加符合物理规律，同时降低了训练成本。该方法在教师强制的基础上，优化了一个辅助目标，能够预测时间上分离的块，而无需访问中间的视觉上下文。FCP直接从训练视频中获取监督，不需要额外的预训练视觉编码器，并且不改变自回归推理的过程。我们的实验表明，FCP在物理合理性方面优于标准的教师强制自回归训练，突显了未来块监督在建模视觉演变中的有效性和高效性。'}}}, {'id': 'https://huggingface.co/papers/2610.11942', 'title': 'Right Screen, Wrong Transition: World Models as Verifiers for GUI Agents', 'url': 'https://huggingface.co/papers/2610.11942', 'abstract': 'Abstract A decoder-free, action-conditioned world model predicts next-screen representations to verify GUI transitions and detect hijacked screens with high accuracy and low latency.  Generated by thinkingmachines/Inkling-Small A login screen that appears after a tap on Sign in is expected; the same screen after a tap on View order is an attack. For GUI agents, safety is therefore a property of the transition rather than of the screen, and a monitor that inspects only screens can be defeated by reusing a legitimate one. Judging a transition requires an expectation of what should have followed the action. Existing GUI world models provide one, but they output it as text, code, or images, so checking it against the observed screen requires a second model to judge the two. We argue that a world model meant for verification should instead predict in the space in which observations are encoded, and present LGWM, a decoder-free, action-conditioned world model that predicts the representation of the next screen directly, trained without semantic annotation on 1.85M real GUI transitions. Verification reduces to a vector comparison, and the same signal reveals whether a mismatch is harmful. We evaluate on RSWT-BENCH, a diagnostic where each credential screen appears under both a legitimate and a hijacked transition, so detectors that see only the screen are at chance by construction. The training-free score reaches 0.987 AUC at 17 ms per decision, on par with the strongest closed-source VLMs and about ten AUC points above generative GUI world models at over three orders of magnitude lower latency. The residual direction reaches 0.953 AUC at separating harmful from benign violations, where prompted VLMs are near chance. Further analyses show that the prediction is a usable future state rather than an anomaly score. World models have mostly served as simulators or planners; our results point to a third role, verification, for which predicting in representation space is the natural design.', 'score': 81, 'issue_id': 3448, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '8ca01397e7c38fa8', 'authors': ['Jiaming Zhang', 'Xuan Wang', 'Fuyao Zhang', 'Yang Cao', 'Lingjuan Lyu', 'Wei Yang Bryan Lim'], 'affiliations': ['Institute of Science Tokyo', 'Nanyang Technological University', 'Sony AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.11942.jpg', 'data': {'categories': ['#benchmark', '#security', '#interpretability', '#agents', '#dataset', '#agi', '#architecture', '#cv'], 'emoji': '🛡️', 'ru': {'title': 'Проверяем не экран, а переход: world model как верификатор GUI-действий', 'desc': 'Авторы предлагают LGWM — action-conditioned world model без декодера, которая предсказывает представление следующего экрана GUI прямо в пространстве эмбеддингов, а не в тексте, коде или картинках. Модель обучена без семантической разметки на 1,85 млн реальных переходов между экранами. Проверка перехода сводится к сравнению векторов, что даёт быстрое обнаружение подменённых экранов. На бенчмарке RSWT-BENCH модель достигает AUC 0,987 за 17 мс на решение, что сопоставимо с сильнейшими закрытыми VLM и значительно быстрее генеративных моделей.'}, 'en': {'title': 'Revolutionizing GUI Safety with Direct Prediction Models', 'desc': 'This paper introduces a novel approach to verifying graphical user interface (GUI) transitions using a decoder-free, action-conditioned world model called LGWM. Unlike traditional models that output predictions as text or images, LGWM predicts the next screen representation directly, allowing for efficient verification through vector comparisons. The model is trained on a large dataset of real GUI transitions without the need for semantic annotations, achieving high accuracy and low latency in detecting hijacked screens. The results demonstrate that this method not only enhances safety in GUI interactions but also establishes a new role for world models in verification tasks.'}, 'zh': {'title': '无解码器的世界模型：高效验证GUI过渡', 'desc': '本文提出了一种无解码器的、基于动作的世界模型，用于预测下一屏幕的表示，以验证图形用户界面（GUI）过渡并高效检测被劫持的屏幕。该模型通过直接预测下一屏幕的表示，避免了传统模型需要额外判断的复杂性，从而实现了快速且准确的验证。我们在RSWT-BENCH上进行评估，结果显示该模型在检测恶意与良性过渡方面表现优异，AUC达到了0.987，且决策延迟仅为17毫秒。我们的研究表明，世界模型不仅可以作为模拟器或规划者，还可以作为验证工具，预测表示空间中的状态是其自然设计。'}}}, {'id': 'https://huggingface.co/papers/2610.26828', 'title': 'Agent World Model in the Wild: Computer-Use Agent Environment Synthesis', 'url': 'https://huggingface.co/papers/2610.26828', 'abstract': "Abstract WildAWM synthesizes controllable computer-use environments and tasks to train general agents via interaction, improving out-of-distribution performance across web, CLI, and GUI benchmarks.  Generated by thinkingmachines/Inkling-Small Agent learning is shifting from learning from human data toward learning through interaction with the world. However, scaling such learning directly in real-world computer systems is challenging and can introduce substantial security risks. We therefore propose Agent World Model in the Wild (WildAWM), a scalable pipeline for synthesizing controllable environments and tasks for training general computer-use agents (CUAs). Whereas existing approaches typically specialize in a single agent interaction interface, we construct executable environments that jointly support graphical user interfaces, model context protocol services, and command-line interfaces, allowing agents to flexibly combine visual interaction, tool use, and code execution. WildAWM is entirely powered by open-source models, demonstrating that high-quality computer-use environments can be generated without proprietary frontier models. Beyond environments, we address three recurring challenges in task synthesis: ensuring solvability, maintaining sufficient difficulty, and producing reliable verifiers, by introducing execution-based quality gates that combine heterogeneous agent rollouts, cross-judge consistency checks, and counterfactual probes of judgment robustness. The resulting pipeline synthesizes 341 long-horizon environment-task pairs that can require over 100 agent steps to solve and remain challenging even for frontier models, with GPT-6-Astra solving only 60% of them. We train two Qwen models of different sizes exclusively in these synthetic worlds. Both models achieve substantial gains across 8 out-of-distribution benchmarks spanning web, claw, and computer-use agents, demonstrating that learning in WildAWM's synthesized worlds generalizes broadly to unseen computer-use tasks. The code is publicly available at https://github.com/MSR-Orchard/WildAWM.", 'score': 64, 'issue_id': 3447, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '721d29be7142b979', 'authors': ['Zhaoyang Wang', 'Qianhui Wu', 'Haorui Wang', 'Simon Yu', 'Baolin Peng', 'Canwen Xu', 'Hao Cheng', 'Wenlin Yao', 'Boyi Liu', 'Yite Wang', 'Jianfeng Gao', 'Huaxiu Yao'], 'affiliations': ['Georgia Tech', 'Independent Researcher', 'Microsoft Research', 'Northeastern University', 'UNC-Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2610.26828.jpg', 'data': {'categories': ['#games', '#agi', '#benchmark', '#dataset', '#data', '#training', '#agents', '#synthetic', '#open_source', '#multimodal'], 'emoji': '🌍', 'ru': {'title': 'Учимся управлять компьютером в синтетических мирах', 'desc': 'Статья представляет WildAWM — масштабируемый конвейер, который синтезирует управляемые среды и задачи для обучения универсальных computer-use агентов (CUA) через взаимодействие, без риска для реальных систем. Среды поддерживают одновременно GUI, MCP-сервисы и CLI, поэтому агент может комбинировать визуальные действия, использование инструментов и выполнение кода. Авторы решают проблемы разрешимости, сложности задач и надёжности верификаторов с помощью quality gates на основе выполнения, кросс-судейских проверок и контрфактуальных тестов; весь пайплайн работает на open-source моделях. Модели Qwen, обученные исключительно в синтетических мирах, демонстрируют заметный прирост на 8 out-of-distribution бенчмарках, что говорит о хорошей обобщающей способности.'}, 'en': {'title': 'Empowering Agents with WildAWM: Learning Through Interaction in Diverse Environments', 'desc': 'WildAWM is a framework designed to create controllable environments and tasks for training general computer-use agents (CUAs) through interaction. It addresses the challenges of scaling learning in real-world computer systems while minimizing security risks. The framework supports multiple interaction interfaces, including graphical user interfaces and command-line interfaces, allowing agents to utilize various forms of interaction. By synthesizing diverse tasks and environments, WildAWM enables agents to generalize their learning effectively across different benchmarks, demonstrating improved performance in unseen tasks.'}, 'zh': {'title': 'WildAWM：通用智能体的可控训练环境', 'desc': 'WildAWM是一种合成可控计算机使用环境和任务的系统，用于通过交互训练通用智能体，从而提高其在不同分布下的表现。该系统支持图形用户界面、命令行接口和模型上下文协议服务的联合执行，使智能体能够灵活地结合视觉交互、工具使用和代码执行。WildAWM完全基于开源模型，证明了高质量的计算机使用环境可以在没有专有模型的情况下生成。此外，WildAWM还通过引入基于执行的质量门，解决了任务合成中的可解性、难度保持和可靠性验证等挑战。'}}}, {'id': 'https://huggingface.co/papers/2610.20538', 'title': 'PrismaCoder: Pushing the Boundaries of Open Multimodal Code Intelligence through Decomposed Rubric Synthesis', 'url': 'https://huggingface.co/papers/2610.20538', 'abstract': 'Abstract PrismaForge uses a rubric-based pipeline to synthesize and filter high-quality multimodal code data, enabling open models that rival proprietary systems on visual coding tasks.  Generated by thinkingmachines/Inkling-Small Multimodal code intelligence connects the symbolic world of programs with the visual world their execution creates. Interest in this capability is burgeoning, as models are increasingly asked to produce charts, webpages, animations, and semi-structured documents. Recently, proprietary models have pushed far ahead, producing interactive artifacts even from a text description or a screenshot alone. Yet their data and training remain closed, and open progress is held back by the quantity and quality of available data and by the pipelines and methods for producing it. Quality is the harder of the two, since a sample must be correct as a program, well built, and above all visually right once rendered. No existing signal covers all three. Execution often returns just a pass or fail, code similarity does not map to the visual output, and task-specific verifiers do not generalize. To push open progress further, we start from the data side with PrismaForge, a hierarchical data pipeline centered on a synthesized rubric that decomposes these factors into checkable criteria. The same rubric serves as both filter and reward: it curates the supervised corpus, then drives reinforcement learning on visual-coding tasks. Leveraging PrismaForge for data synthesis and filtering, we build PrismaCoder-2M, the most diverse open dataset for multimodal code intelligence and the largest to date. On the model side, we train PrismaCoder-9B and PrismaCoder-35B on this data and release both. They lead the open state of the art by a wide margin and rival leading proprietary systems. Our analyses further show that the proposed rubric-based pipeline improves multimodal coding performance across model backbones. We release our code and data at https://qiushisun.github.io/PrismaCoder-Home/.', 'score': 49, 'issue_id': 3447, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': '61c7aea41735d876', 'authors': ['Qiushi Sun', 'Jingyang Gong', 'Yang Liu', 'Qiaosheng Chen', 'Zhangyue Yin', 'Zixian Huang', 'Hanxu Hu', 'Jing Xiong', 'Fangzhi Xu', 'Haochen Tan', 'Haoli Bai', 'Lifeng Shang', 'Xiaoguang Li', 'Ben Kao', 'Qipeng Guo', 'Lingpeng Kong', 'Jiahui Gao'], 'affiliations': ['Fudan University', 'Huawei Foundation Model Department', 'Nanjing University', 'Shanghai Innovation Institute', 'The University of Hong Kong', 'University of Zurich'], 'pdf_title_img': 'assets/pdf/title_img/2610.20538.jpg', 'data': {'categories': ['#optimization', '#rl', '#plp', '#benchmark', '#dataset', '#data', '#training', '#synthetic', '#open_source', '#multimodal'], 'emoji': '🎨', 'ru': {'title': 'Рубрика как фильтр и награда: открытые модели учатся писать код, который хорошо выглядит', 'desc': 'Статья представляет PrismaForge — иерархический пайплайн для синтеза и фильтрации данных мультимодального code intelligence, где программный код связан с визуальным результатом его выполнения. Ключевая идея — синтезированный rubric (набор проверяемых критериев), который одновременно служит фильтром качества для supervised fine-tuning и функцией награды для reinforcement learning. На его основе собран датасет PrismaCoder-2M, крупнейший и самый разнообразный открытый датасет такого рода. Обученные на нём модели PrismaCoder-9B и PrismaCoder-35B обходят открытые аналоги и сопоставимы с ведущими закрытыми LLM на задачах визуального кодирования.'}, 'en': {'title': 'Unlocking Open-Source Multimodal Code Intelligence with PrismaForge', 'desc': 'PrismaForge is a new method that creates and filters high-quality multimodal code data, which helps open models perform well in visual coding tasks. It uses a rubric-based pipeline to ensure that the generated code is not only correct but also visually appealing when executed. This approach addresses the challenge of obtaining quality data, which is crucial for training effective models. By developing PrismaCoder-2M, a diverse dataset, and training models like PrismaCoder-9B and PrismaCoder-35B, the research significantly advances open-source multimodal code intelligence, competing with proprietary systems.'}, 'zh': {'title': '开放多模态代码智能的新突破', 'desc': 'PrismaForge 是一个基于评分标准的管道，用于合成和筛选高质量的多模态代码数据，从而使开放模型在视觉编码任务上能够与专有系统相媲美。该方法连接了程序的符号世界与其执行所创造的视觉世界，满足了对生成图表、网页和动画等能力的需求。通过使用 PrismaForge，我们构建了 PrismaCoder-2M，这是迄今为止最丰富的多模态代码智能开放数据集，并训练了 PrismaCoder-9B 和 PrismaCoder-35B 模型。我们的研究表明，基于评分标准的管道显著提升了多模态编码的性能，推动了开放进展。'}}}, {'id': 'https://huggingface.co/papers/2610.28698', 'title': 'Scaling in Games: Continued Pre-Training For Embodied Agents In Diverse Virtual Worlds', 'url': 'https://huggingface.co/papers/2610.28698', 'abstract': 'Abstract Continued pre-training across data scale, diversity, and model size improves embodied learning in virtual worlds but reveals limits in distant-world generalization, motivating richer training beyond imitation.  Generated by thinkingmachines/Inkling-Small Scaling data, diversity and model capacity has improved embodied learning in physical environments, where diverse experiences remain grounded in shared physical laws. Whether these gains extend to virtual worlds with different visual styles, dynamics, controls, and objectives remains unclear. We investigate this question through a controlled study of continued pre-training (CPT) across three axes: data volume, diversity, and model size. Our 120 training configurations span four model sizes from 0.8B to 27B, six data budgets from 50 to 1,600 hours, and five mixtures ranging from Minecraft-only data to diverse multi-world corpora. We assess performance and generalization using three-level validation losses and gameplay benchmarks from in-corpus worlds to unseen worlds. Our results show: (1) more data improves in-corpus performance, diversity improves transfer to related worlds with limited gains in distant worlds, and model size improves data efficiency but generalizes worse to distant worlds under single-world training; (2) we observe an early interface phase with broad cross-world benefits and a later world phase with gains narrowed to in-corpus and related worlds, and fit an empirical scaling law relating validation loss to data volume, diversity and model size; and (3) our models are competitive with Minecraft specialists and frontier models in 3D worlds, and perform best in real-time settings. However, the limits of imitation and persistent gaps in distant worlds suggest that building generalist embodied agents requires richer training stages beyond continued pre-training.', 'score': 47, 'issue_id': 3447, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '238924752d9ed6ab', 'pdf_title_img': 'assets/pdf/title_img/2610.28698.jpg', 'data': {'categories': ['#3d', '#robotics', '#benchmark', '#data', '#training', '#agents'], 'emoji': '🎮', 'ru': {'title': 'Одного предобучения мало: путь к универсальным агентам лежит дальше имитации', 'desc': 'Авторы исследуют, как непрерывное предобучение (continued pre-training, CPT) влияет на embodied-агентов в виртуальных мирах, варьируя объём данных, их разнообразие и размер модели от 0.8B до 27B параметров. Обнаружено, что больше данных улучшает результаты на знакомых мирах, разнообразие помогает переносу на родственные миры, а крупные модели лучше используют данные, но хуже обобщаются на далёкие миры. Выведен эмпирический scaling law, связывающий validation loss с объёмом данных, разнообразием и размером модели, а модели оказываются конкурентными с Minecraft-специалистами и frontier-моделями. Авторы делают вывод, что одной имитации и CPT недостаточно для создания универсальных embodied-агентов, и нужны более богатые этапы обучения.'}, 'en': {'title': 'Beyond Imitation: Enhancing Generalization in Embodied Learning', 'desc': 'This paper explores how continued pre-training (CPT) affects embodied learning in virtual environments, focusing on data scale, diversity, and model size. The study reveals that while increasing data improves performance within familiar environments, it does not significantly enhance generalization to distant or unseen worlds. The authors conducted experiments with various model sizes and data configurations, finding that larger models are more data-efficient but struggle with generalization in new contexts. Ultimately, the research suggests that to create versatile embodied agents, training must go beyond simple imitation and incorporate richer, more varied experiences.'}, 'zh': {'title': '超越模仿：构建通用体现代理的挑战', 'desc': '这篇论文探讨了在虚拟世界中继续预训练对体现学习的影响，特别是在数据规模、多样性和模型大小方面的改进。研究表明，更多的数据可以提高在已知环境中的表现，而多样性则有助于在相关世界中的迁移，但在遥远世界中的效果有限。通过对不同模型大小和数据预算的120种训练配置进行评估，发现模型在单一世界训练下对遥远世界的泛化能力较差。最终，论文指出，要构建通用的体现代理，需要超越简单模仿的更丰富的训练阶段。'}}}, {'id': 'https://huggingface.co/papers/2610.21114', 'title': 'Spectral-Spatial Interpretation', 'url': 'https://huggingface.co/papers/2610.21114', 'abstract': 'Abstract Spectral-Spatial Interpretation assigns localized channel importance at each spatial position via conditional Shapley values, yielding full spectral-spatial attribution matrices that outperform existing methods on multispectral image tasks.  Generated by thinkingmachines/Inkling-Small Post-hoc image explanations usually show where a model looks using spatial heatmaps or indicate which channels matter using global channel scores. These separate views are limiting for multispectral data because channel relevance is often spatially localized and physically meaningful. We introduce Spectral-Spatial Interpretation (SSI), a full-grid attribution method over position-channel players (g,c). For each spatial position, SSI fixes the observed surrounding context, defines a conditional game over the channels at that position, and applies the Shapley value to this local game. The result is a full spectral-spatial attribution matrix rather than a single heatmap or a global channel ranking. SSI has a clear local interpretation. It satisfies Shapley fairness within each position, and aggregating its channel attributions exactly recovers the position-level contextual contrast obtained by replacing that position with the baseline. SSI also differs from context-averaged Owen-style hierarchical accounting, which uses the same position-channel grouping but averages over external spatial coalitions. On HLS Burn Scar, SSI outperforms an MC-Owen estimator across retained attribution metrics while using only about 6% of its evaluation budget. Across CUB-200, EuroSAT, and HLS Burn Scar under both per-channel mean and zero baselines, SSI achieves the best joint deletion and insertion AUC over dense, flat, and rank-1 baselines, yields the strongest spectral hit rates and channel deletion, and leads spatial localization on both annotated datasets. Code is available at https://github.com/AtheavenMa/Spectral-Spatial-Interpretation.', 'score': 45, 'issue_id': 3447, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': 'd7086a410d159b2f', 'authors': ['Haotian Ma', 'Ruqi Yang', 'Philip Townsend'], 'affiliations': ['Department of Computer Sciences, University of Wisconsin-Madison', 'Department of Forest and Wildlife Ecology, University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.21114.jpg', 'data': {'categories': ['#cv', '#interpretability', '#benchmark', '#multimodal'], 'emoji': '🛰️', 'ru': {'title': 'Где и какой спектральный канал важен — объясняем каждую точку изображения', 'desc': 'Статья представляет метод Spectral-Spatial Interpretation (SSI), который объясняет предсказания модели для мультиспектральных изображений, показывая важность каждого канала в каждой пространственной позиции. Для этого используется Shapley value, применённый к локальной условной игре над каналами при фиксированном окружающем контексте, что даёт полную spectral-spatial матрицу атрибуции. Метод сохраняет справедливость Shapley внутри каждой позиции и точно восстанавливает контрастность относительно baseline, отличаясь от Owen-подобных иерархических оценок. Эксперименты на CUB-200, EuroSAT и HLS Burn Scar показывают, что SSI превосходит аналоги по метрикам deletion/insertion, spectral hit rate и пространственной локализации при существенно меньшем бюджете вычислений.'}, 'en': {'title': 'Unlocking Multispectral Insights with Spectral-Spatial Interpretation', 'desc': "The paper introduces Spectral-Spatial Interpretation (SSI), a method that assigns importance to different channels in multispectral images based on their spatial context using conditional Shapley values. Unlike traditional methods that provide either spatial heatmaps or global channel scores, SSI generates a full spectral-spatial attribution matrix, allowing for a more nuanced understanding of channel relevance at each spatial position. This approach ensures fairness and local interpretability, as it considers the surrounding context when evaluating channel contributions. The results demonstrate that SSI outperforms existing techniques on various datasets, providing better insights into the model's decision-making process."}, 'zh': {'title': '光谱-空间解释：提升多光谱图像理解的利器', 'desc': '光谱-空间解释（SSI）通过条件Shapley值为每个空间位置分配局部通道重要性，从而生成全光谱-空间归因矩阵，优于现有的多光谱图像处理方法。传统的后处理图像解释通常使用空间热图显示模型关注的位置，或通过全局通道评分指示哪些通道重要，但这些方法对多光谱数据的局限性较大。SSI方法在每个空间位置固定观察到的周围上下文，定义该位置通道的条件博弈，并应用Shapley值，得到完整的光谱-空间归因矩阵。SSI具有明确的局部解释，满足每个位置的Shapley公平性，并且其通道归因的聚合能够准确恢复通过基线替换该位置所获得的上下文对比。'}}}, {'id': 'https://huggingface.co/papers/2610.17860', 'title': 'Socratic Skill Learning: Interleaving Teaching and Practice for Transferable Agent Skills', 'url': 'https://huggingface.co/papers/2610.17860', 'abstract': 'Abstract Socratic Skill Learning improves reusable agent skills by interleaving expert guidance with student practice and targeted review, outperforming trajectory and contrastive distillation methods.  Generated by thinkingmachines/Inkling-Small Agent Skills improve LLM agents by making task knowledge reusable across sessions. Learning transferable Skills requires evidence about a procedure and its conditions of use, which a successful task attempt can leave untested. We introduce Socratic Skill Learning (SSL), which interleaves expert teaching with Student practice. An Educator guides investigation while the Student remains the sole environment operator and Skill author, able to question, test, and adapt advice. To test reuse beyond the learning task, we construct SkillTransferBench, with 35 task families and 408 executable cases, pairing public variation specifications with held-out evaluation in fresh solver sessions. On the main 22-family, 155-case cohort, Fixed-Window SSL reaches 0.801 utility, versus 0.723 without a Skill, 0.761 for adapted Trace2Skill (trajectory distillation), and 0.751 for adapted SKILL-KD (contrastive distillation). Across three model pairs on shared families, interleaved guidance outperforms expert authoring and post-hoc teaching. Process analysis links guidance to Student writing and package revision; a case study shows the Student testing and refining a proposed procedure for later reuse. As demand for new lessons falls, the cost of fixed-window review grows. Issue-Guided SSL tracks unresolved questions across Skill revisions to select and focus review, reaching 0.805 utility with 61.7% fewer Educator tokens and 16.9% fewer total acquisition tokens than Fixed-Window SSL on the main cohort.', 'score': 30, 'issue_id': 3447, 'pub_date': '2026-10-13', 'pub_date_card': {'ru': '13 октября', 'en': 'October 13', 'zh': '10月13日'}, 'hash': '85fbf0d79a2db513', 'authors': ['Letian Zhu', 'Han Li', 'Yifan Yao', 'Xinping Lei', 'Xinyu Che', 'Jiahao Wang', 'Dianyi Wang', 'Yucheng Fu', 'Jiakai Wang', 'Zhiqi Bai', 'Wenbo Su', 'Jiaheng Liu'], 'affiliations': ['Alibaba Group', 'Nanjing University'], 'pdf_title_img': 'assets/pdf/title_img/2610.17860.jpg', 'data': {'categories': ['#agents', '#dataset', '#benchmark', '#training'], 'emoji': '🎓', 'ru': {'title': 'Учитель задаёт вопросы, ученик сам проверяет навык, и знания переносятся на новые задачи', 'desc': 'В статье представлен метод Socratic Skill Learning (SSL), в котором эксперт-наставник (Educator) направляет ученика (Student) через вопросы и проверку гипотез, а ученик сам тестирует и дорабатывает навыки агента на основе LLM. Авторы создали бенчмарк SkillTransferBench из 35 семейств задач и 408 исполняемых кейсов для оценки переносимости навыков на новые сессии. SSL показывает лучшую полезность (0.801) по сравнению с траекторной дистилляцией Trace2Skill, контрастивной дистилляцией SKILL-KD и работой без навыков. Вариант Issue-Guided SSL отслеживает нерешённые вопросы между ревизиями навыка и сокращает расход токенов наставника примерно на 62% при сохранении качества.'}, 'en': {'title': 'Empowering Agents with Socratic Skill Learning for Reusable Skills', 'desc': 'Socratic Skill Learning (SSL) enhances the ability of agents to learn and reuse skills by combining expert guidance with student practice. This method allows students to actively engage in the learning process, questioning and adapting the advice they receive from educators. The study introduces SkillTransferBench, a framework for evaluating the transferability of learned skills across different tasks, demonstrating that SSL significantly outperforms traditional learning methods like trajectory and contrastive distillation. Additionally, Issue-Guided SSL optimizes the review process by focusing on unresolved questions, leading to improved utility with fewer resources used.'}, 'zh': {'title': '苏格拉底技能学习：提升代理技能的创新方法', 'desc': '这篇论文介绍了一种新的技能学习方法，称为苏格拉底技能学习（SSL），它通过将专家指导与学生实践相结合来提高可重用的代理技能。SSL允许学生在专家的指导下进行探索，同时保持对环境的操作和技能的创作能力。研究表明，SSL在技能重用方面的表现优于传统的轨迹蒸馏和对比蒸馏方法。通过构建技能转移基准，研究者验证了SSL在不同任务中的有效性，显示出其在技能学习和应用中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.29722', 'title': 'Retrieval Augmented Generation Compositionality', 'url': 'https://huggingface.co/papers/2610.29722', 'abstract': 'Abstract LASAGNA evaluates composed RAG pipelines across scales and finds that isolated technique gains do not reliably predict combined retrieval quality, faithfulness, or large-corpus performance.  Generated by thinkingmachines/Inkling-Small Retrieval Augmented Generation (RAG) grounds large language models in external knowledge. Modern pipelines combine embedding, chunking, retrieval, reranking, query augmentation, context compression, and agentic verification, yet these techniques are typically evaluated one at a time. It remains unclear whether their isolated gains survive composition, whether retrieval quality and answer faithfulness favor the same design choices, and whether conclusions from small corpora hold at large scale. We pre-declare three hypotheses and introduce LASAGNA, an open-source framework for controlled RAG evaluation. We test 450 configurations across eight benchmarks and corpora ranging from 5K to 200K documents. Three findings emerge. First, individually strong techniques from different phases of a RAG pipeline do not necessarily compose: three retrieval techniques predict a +47% combined improvement but deliver only +17% when used together. Second, component gains stack differently for retrieval and faithfulness, and optimizing one can hurt the other. Third, the best composition changes as the corpus grows: the combination that wins on a small corpus may not remain best at large scale. These findings show that gains measured in isolation are not reliable predictors of realistic performance, and that new RAG techniques should be tested with the full surrounding stack. We call on researchers to do so and supply LASAGNA to simplify these experiments.', 'score': 25, 'issue_id': 3449, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'ad97f4436d987c1c', 'authors': ['Ido Levy', 'Segev Shlomov', 'Leshem Choshen'], 'affiliations': ['IBM', 'Weizmann Institute of Science'], 'pdf_title_img': 'assets/pdf/title_img/2610.29722.jpg', 'data': {'categories': ['#rag', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Лучшие техники по отдельности не гарантируют лучший RAG в сборе', 'desc': 'В статье представлен фреймворк LASAGNA для систематической оценки RAG-пайплайнов, где большие языковые модели (LLM) получают знания из внешних источников. Авторы протестировали 450 конфигураций на восьми бенчмарках и корпусах от 5 тысяч до 200 тысяч документов. Главный вывод: улучшения, показанные отдельными техниками (retrieval, reranking, сжатие контекста), не складываются при совместном использовании, а лучшая комбинация на малом корпусе может быть неоптимальна на большом. Поэтому новые методы RAG следует проверять во всей связке, а не изолированно.'}, 'en': {'title': 'LASAGNA: Evaluating RAG Techniques Beyond Isolation', 'desc': 'The paper introduces LASAGNA, a framework for evaluating Retrieval Augmented Generation (RAG) pipelines, which combines various techniques like embedding and reranking. It reveals that improvements seen when techniques are tested alone do not always translate to better performance when they are combined in a pipeline. The study shows that optimizing for retrieval quality can negatively impact answer faithfulness, and the best configurations can change depending on the size of the document corpus. Overall, the findings emphasize the importance of testing RAG techniques in a comprehensive manner rather than in isolation.'}, 'zh': {'title': '组合技术的效果不如预期', 'desc': 'LASAGNA是一个用于评估组合检索增强生成（RAG）管道的框架。研究发现，单独的技术提升并不总能可靠地预测组合后的检索质量和答案的可信度。通过测试450种配置，结果显示不同阶段的强技术组合在大规模数据集上表现不佳。该研究强调了在评估新RAG技术时，必须考虑整个管道的影响，而不仅仅是单独的技术。'}}}, {'id': 'https://huggingface.co/papers/2610.28589', 'title': 'AgenticRoboRL: Bringing Coding-Agent Post-Training to Agentic Robotics', 'url': 'https://huggingface.co/papers/2610.28589', 'abstract': "Abstract AgenticRoboRL improves robot planners via supervised fine-tuning and multi-turn reinforcement learning across diverse harnesses, significantly boosting success rates without external memory.  Generated by thinkingmachines/Inkling-Small Agentic robotics systems combine planners with robot harnesses to perform complex manipulation tasks. Recent work improves these systems through better harnesses and external memory, but relies on powerful closed-source models as planners and does not improve the planners' own capabilities. In contrast, coding agents have improved substantially by post-training the model itself. We therefore investigate whether post-training can also improve robot planners. However, applying it across robot harnesses requires accommodating different execution mechanisms, including VLA skill invocation and control-code generation. To this end, we introduce AgenticRoboRL, a framework for post-training robot planners across different harnesses. The training recipe combines supervised fine-tuning with multi-turn reinforcement learning. To accommodate different execution mechanisms, harness-specific adapters connect recorded planner interactions with task outcomes, enabling a common RL training pipeline while keeping execution components fixed. On LIBERO-PRO, AgenticRoboRL raises the success rate of a 9B-parameter planner from 18.1% to 71.0% without external memory, approaching the 72.1% achieved by Codex (GPT-5.5) with external memory. These results demonstrate post-training as an effective approach for improving robot planners. We will release the framework and trained planner checkpoints.", 'score': 20, 'issue_id': 3447, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '5c2ce09bb9cc8dfe', 'authors': ['Xinxin Liu', 'Bingxin Xu', 'Wenrui Bao', 'Ming Li', 'Wentao Bao', 'Chen Chen', 'Yuzhang Shang'], 'affiliations': ['Michigan State University', 'University of Central Florida', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2610.28589.jpg', 'data': {'categories': ['#optimization', '#rl', '#robotics', '#training', '#agents', '#reasoning', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Учим робота-планировщика думать сам, а не полагаться на память', 'desc': 'Авторы предлагают AgenticRoboRL — фреймворк для дообучения (post-training) планировщиков роботов, которые работают с разными harness-системами, например с вызовом VLA-навыков или генерацией управляющего кода. Метод сочетает supervised fine-tuning и многошаговое обучение с подкреплением (multi-turn RL), а специальные адаптеры связывают взаимодействия планировщика с результатами выполнения задач. На бенчмарке LIBERO-PRO успешность 9B-планировщика выросла с 18.1% до 71.0% без внешней памяти, почти догнав LLM Codex (GPT-5.5) с памятью. Это показывает, что дообучение самой модели эффективнее, чем полагаться только на сильные закрытые модели и внешнюю память.'}, 'en': {'title': 'Boosting Robot Planners with Post-Training Power', 'desc': 'AgenticRoboRL is a framework designed to enhance robot planners through a combination of supervised fine-tuning and multi-turn reinforcement learning. This approach allows robot planners to improve their performance across various harnesses without the need for external memory. By using harness-specific adapters, the framework connects planner interactions with task outcomes, enabling a unified reinforcement learning training process. The results show a significant increase in success rates for robot tasks, demonstrating the effectiveness of post-training in improving robotic capabilities.'}, 'zh': {'title': '提升机器人规划器的有效框架', 'desc': 'AgenticRoboRL 是一种通过监督微调和多轮强化学习来提升机器人规划器性能的框架。它在不同的机器人任务中显著提高了成功率，而无需外部记忆。该方法结合了特定任务的适配器，以便在保持执行组件不变的情况下，连接规划器的交互记录与任务结果。实验结果表明，AgenticRoboRL 能够将一个 90 亿参数的规划器的成功率从 18.1% 提高到 71.0%，显示出后训练在提升机器人规划器能力方面的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.29545', 'title': 'PACE: Periodic and Channel-Aligned Encoding of Four-Bit Recurrent States', 'url': 'https://huggingface.co/papers/2610.29545', 'abstract': 'Abstract PACE is a post-hoc four-bit quantizer for linear-attention recurrent states that rounds less frequently and uses column-wise scales to reduce error, enabling lower memory usage without fine-tuning.  Generated by thinkingmachines/Inkling-Small Linear-attention language models keep their context in a recurrent state of fixed size, where an inference system stores one copy of this state for every sequence it decodes at the same time. Storing the state at lower precision therefore lets more sequences share an accelerator. Existing state quantizers round the state after every generated token and report that four bits lose accuracy unless the bit width is raised or the model is fine-tuned.\\par We introduce PACE, a post-hoc four-bit state quantizer. PACE rounds the state only once every few generated tokens, as chunked kernels already do once per chunk during prefill, and keeps the tokens generated in between in a small buffer. Rounding less often reduces the error that accumulates in the state. Additionally, we find that the large entries of the gated-delta state gather in columns, because some channels of the update written at each token remain large across many tokens. PACE therefore shares each quantization scale within one column. It also keeps the heads that retain rounding error longest at eight bits. On four hybrid models from 4B to 35B parameters, PACE with mixed four- and eight-bit heads is competitive with eight-bit DAMP on the three larger models at about two thirds of its memory, PACE with four-bit heads throughout scores higher than Q-Mamba at equal memory, and rounding every few tokens preserves the decoding speedup of the buffer.', 'score': 19, 'issue_id': 3448, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '1c550daa6e68bef4', 'authors': ['Patrick Haller', 'Filipe Laitenberger', 'Alan Akbik'], 'affiliations': ['Humboldt-Universität zu Berlin'], 'pdf_title_img': 'assets/pdf/title_img/2610.29545.jpg', 'data': {'categories': ['#inference', '#optimization'], 'emoji': '🗜️', 'ru': {'title': 'Меньше округлений — больше памяти для последовательностей', 'desc': 'PACE — это метод post-hoc квантования рекуррентного состояния линейного внимания до четырёх бит без дообучения модели. Вместо округления после каждого токена состояние квантуется раз в несколько токенов, а промежуточные токены хранятся в небольшом буфере, что снижает накопление ошибки. Так как крупные значения gated-delta состояния группируются по столбцам, для каждого столбца используется общий масштаб квантования, а наиболее чувствительные головы остаются в восьми битах. На моделях от 4B до 35B параметров PACE экономит память и сохраняет качество LLM, а также скорость декодирования.'}, 'en': {'title': 'Efficient Memory Usage with PACE: Smart Quantization for Linear-Attention Models', 'desc': 'PACE is a novel four-bit quantizer designed for linear-attention recurrent states that minimizes rounding frequency and employs column-wise scaling to enhance accuracy while reducing memory usage. By rounding the state less frequently, PACE effectively decreases the error accumulation that typically occurs in state representations during token generation. This method allows multiple sequences to share computational resources more efficiently, as it maintains a small buffer for intermediate tokens. The results demonstrate that PACE achieves competitive performance with existing quantization methods while significantly lowering memory requirements across various model sizes.'}, 'zh': {'title': 'PACE：高效的四位量化器，降低内存使用', 'desc': 'PACE是一种后处理的四位量化器，用于线性注意力的递归状态。它通过减少量化频率和使用列级缩放来降低误差，从而在不进行微调的情况下减少内存使用。与现有的状态量化器不同，PACE每生成几个标记才进行一次量化，这样可以减少累积误差。此外，PACE在四位和八位头之间共享量化尺度，确保在保持解码速度的同时提高了模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2610.29680', 'title': 'TraceForge: Distilling with Your Own Thinking', 'url': 'https://huggingface.co/papers/2610.29680', 'abstract': "Abstract The study proposes a two-stage supervised and adversarial method to synthesize reasoning traces matching a student model's style from teacher answers, improving coding benchmarks without relying on hidden outputs.  Generated by thinkingmachines/Inkling-Small Using an LLM to generate training data for another is among the most general ways to train one, and it remains common practice. Some frontier teams have closed that route for their own models: what comes back is an answer, or a short summary, without the detailed reasoning trace behind it. That is a little ironic: they were themselves built on distilling human knowledge, and distilling an open-source model is still entirely routine; the restriction applies to their own outputs alone. Recent work recovers the hidden reasoning by replaying encrypted blocks across models. It somehow works, but it breaks the providers' terms of service, so it is not something a product can be built on long-term.   We built the alternative. We take the context and the teacher's answer as input, and generate the reasoning trace ourselves, in the style of the student's own model family. Training is two-stage, supervised and then adversarial: a generator learns to regenerate the family's own reasoning traces from their context and answer, and a critic learns how real a reasoning trace looks. Applied to a teacher's answer, the generator writes one in the family's style. An independent judge rates how likely traces are to be genuine on a scale from 0 to 1: ours average 0.68, real traces 0.66, and traces selected by the critic from four candidates 0.82. These are authenticity scores, not correctness rates.   We test the idea on five benchmarks with everything else held fixed. On general tasks the five training corpora are about the same; on coding, the generated reasoning beats Fable 5's own thinking content. With the same 5,000 questions and the same teacher answers, HumanEval+ improves by 3.7 points and MBPP+ by 7.1 at the final checkpoint, and the MBPP+ lead holds at every checkpoint. We suspect that reasoning written in the student's family style is easier for it to learn from.", 'score': 19, 'issue_id': 3447, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'b768fffcc4fd1723', 'authors': ['Yan Wang'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2610.29680.jpg', 'data': {'categories': ['#plp', '#data', '#training', '#reasoning', '#synthetic'], 'emoji': '🧠', 'ru': {'title': 'Учим модель рассуждать так, как рассуждает она сама', 'desc': 'Статья предлагает двухэтапный метод (сначала supervised обучение, затем adversarial с критиком), который генерирует цепочки рассуждений в стиле модели-ученика по ответам учителя, без использования скрытых выходов закрытых моделей. Генератор учится восстанавливать рассуждения семейства моделей по контексту и ответу, а критик оценивает, насколько они похожи на настоящие. Такие синтетические трассы дают прирост на задачах программирования: HumanEval+ улучшается на 3.7, MBPP+ на 7.1 пункта при том же наборе данных. Авторы предполагают, что рассуждения, написанные в стиле собственного семейства модели, легче для неё усваиваются.'}, 'en': {'title': 'Tailored Reasoning Traces Boost Learning Performance', 'desc': "This paper introduces a novel two-stage method that combines supervised and adversarial learning to create reasoning traces that align with a specific student model's style, based on teacher responses. The approach generates these reasoning traces without relying on hidden outputs, which are often inaccessible in existing models. By training a generator to produce reasoning in the student's style and a critic to evaluate its authenticity, the method achieves competitive performance on coding benchmarks. The results indicate that reasoning traces tailored to the student's model enhance learning effectiveness, leading to improved performance on tasks like HumanEval+ and MBPP+."}, 'zh': {'title': '生成推理轨迹，提升编码表现！', 'desc': '本研究提出了一种两阶段的监督和对抗方法，从教师答案中合成与学生模型风格匹配的推理轨迹。这种方法在不依赖隐藏输出的情况下，提高了编码基准的表现。生成的推理轨迹通过生成器和批评者的合作来实现，生成器学习从上下文和答案中再生推理轨迹，而批评者则评估这些轨迹的真实性。实验结果表明，生成的推理轨迹在多个基准测试中优于传统方法，尤其是在编码任务上表现突出。'}}}, {'id': 'https://huggingface.co/papers/2610.29357', 'title': 'Memory-Centric Continual Learning for AI Agents', 'url': 'https://huggingface.co/papers/2610.29357', 'abstract': 'Abstract Memory-Centric Continual Learning reframes agent memory as an active driver of behavioral improvement through a taxonomy of storage substrates, assets, and policies, a two-loop lifecycle, and scaling frameworks evaluated by retention, adaptation, and transfer.  Generated by thinkingmachines/Inkling-Small Autonomous agents powered by foundation models can reason, plan, and use tools, but their fixed weights and context limits hinder sustained learning from experience over long-term deployment. While external memory systems attempt to bridge this gap, they mostly act as passive retrieval caches, evaluated primarily by whether they can recall stored facts or past interactions. Whether memory can drive genuine continual learning remains an open question. In this paper, we introduce Memory-Centric Continual Learning (MCCL), arguing that memory should be judged by whether it improves future actions, not merely what it retrieves. MCCL has three main parts. First, a three-axis taxonomy organizes memory by where state is stored (substrates), what form it takes (assets), and how it is managed (policies). This defines a two-loop lifecycle that updates memory state in an inner loop while refining management policies in an outer loop based on task feedback. Second, an evaluation protocol measures retention under interference, adaptation to change, and task transfer to isolate genuine behavioral gains from simple context expansion. Third, a memory scaling framework models how agent performance scales with experience, storage capacity, and compute budgets across non-parametric and parametric memory. Together, these components reframe agent memory from passive lookup to continuous learning, offering a principled route toward self-improving autonomous agents.', 'score': 19, 'issue_id': 3447, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '5ea9cfcf84e3c3d1', 'pdf_title_img': 'assets/pdf/title_img/2610.29357.jpg', 'data': {'categories': ['#survey', '#agi', '#benchmark', '#training', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Память, которая учит агента действовать лучше, а не просто вспоминать', 'desc': 'Статья предлагает подход Memory-Centric Continual Learning (MCCL), в котором память агента рассматривается не как пассивный кэш для поиска, а как активный механизм улучшения поведения. Авторы вводят таксономию по трём осям: субстрат хранения, форма представления (assets) и политики управления памятью, а также двухконтурный жизненный цикл с внутренним обновлением состояния и внешним уточнением политик на основе обратной связи. Предложен протокол оценки, измеряющий сохранение знаний при интерференции, адаптацию к изменениям и перенос между задачами, а также фреймворк масштабирования, описывающий связь производительности LLM-агента с объёмом опыта, ёмкостью памяти и вычислительным бюджетом. В целом работа переосмысливает память агентов как основу непрерывного обучения и путь к самосовершенствующимся автономным AI-агентам.'}, 'en': {'title': 'Transforming Memory into a Driver of Continuous Learning', 'desc': "This paper introduces Memory-Centric Continual Learning (MCCL), which emphasizes the role of memory in enhancing an agent's ability to learn and adapt over time. It proposes a taxonomy that categorizes memory based on storage substrates, asset forms, and management policies, creating a structured approach to memory management. The authors argue that memory should not just recall past information but actively contribute to improving future actions through a two-loop lifecycle of memory updates and policy refinement. Additionally, the paper presents an evaluation framework to assess memory effectiveness in terms of retention, adaptation, and transfer, ultimately aiming to transform memory from a passive tool into a dynamic component of continual learning."}, 'zh': {'title': '以记忆驱动持续学习的智能体', 'desc': '本文提出了一种以记忆为中心的持续学习方法（MCCL），强调记忆在行为改进中的积极作用。MCCL通过三轴分类法组织记忆，包括存储基质、资产形式和管理策略，并定义了一个内外循环的生命周期。该方法通过评估干扰下的保留能力、适应变化的能力和任务转移来衡量记忆的有效性。最终，MCCL为自主智能体提供了一种从被动查找转向持续学习的原则性路径。'}}}, {'id': 'https://huggingface.co/papers/2610.30108', 'title': 'Multimodal Embodied Agents: A Unified Capability-centric Perspective from Computer-Use to Robot-Use', 'url': 'https://huggingface.co/papers/2610.30108', 'abstract': 'Abstract PAPAV defines five core capabilities for multimodal embodied agents and highlights gaps in evaluation and physical constraints when moving from digital to robotic settings.  Generated by thinkingmachines/Inkling-Small Multimodal agents (MMAs) sustain interaction through reasoning, memory, tools, and feedback, most visibly as computer-use agents, while robotic systems (RSs) couple sensing and actuation under physical dynamics. We define multimodal embodied agents (MMEAs) as goal-directed systems that couple multimodal task reasoning with physical action and revise decisions from the resulting feedback. This raises a central question: what changes when a multimodal agent moves from computer-use to robot-use? We introduce PAPAV, a unified capability-centric framework of five recurring functions: Perceive the current state, Anticipate action effects, Plan a feasible course, Act through an interface or body, and Verify the outcome. Defined by function rather than architecture, these capabilities let PAPAV identify what all three share and then compare MMEAs with MMAs and with RSs. Five physical constraints, from partial observability to unverifiable outcomes, leave fewer choices fixed in advance and less room to reverse errors. Across 64 benchmarks, explicit evaluation centers on Act; only 5 assess Anticipate and 3 assess Verify, leaving both largely hidden behind task success. These constraints also frame the open challenges we identify. PAPAV therefore provides a common basis for designing reliable physical agents and measuring progress across all five capabilities rather than task success alone.', 'score': 18, 'issue_id': 3447, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '7b875674dc0948c4', 'authors': ['Yanzhe Chen', 'Ziyi Yang', 'Jifeng Zhu', 'Qiming Huang', 'Ruihe An', 'Peiyao Xu', 'Hesen Yang', 'Runda Liu', 'Chang Gong', 'Zhijun Cao', 'Zechen Bai', 'Wenzheng Zeng', 'Yiqi Lin', 'Guoqiang Liang', 'Kevin Yuchen Ma', 'Kevin Qinghong Lin', 'Mike Zheng Shou'], 'affiliations': ['Show Lab, National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2610.30108.jpg', 'data': {'categories': ['#survey', '#robotics', '#agi', '#benchmark', '#agents', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Оценивать роботов не только по успеху задачи, а по всем пяти способностям', 'desc': 'Статья вводит PAPAV, единую рамку из пяти функций для мультимодальных агентов с физическим воплощением: восприятие (Perceive), предвосхищение эффектов действий (Anticipate), планирование (Plan), действие (Act) и проверку результата (Verify). Авторы сравнивают компьютерных агентов, использующих LLM и AI-модели, с роботизированными системами и показывают, что физические ограничения, такие как частичная наблюдаемость и необратимость ошибок, усложняют задачу. Анализ 64 бенчмарков выявил, что оценка почти полностью сосредоточена на действии (Act), тогда как предвосхищение и проверка почти не измеряются. Поэтому авторы предлагают оценивать прогресс по всем пяти способностям, а не только по успешности выполнения задачи.'}, 'en': {'title': 'PAPAV: Bridging Digital and Robotic Agents with Core Capabilities', 'desc': 'The paper introduces PAPAV, a framework that defines five essential capabilities for multimodal embodied agents (MMEAs) which integrate reasoning and physical actions. These capabilities include perceiving the environment, anticipating the effects of actions, planning feasible actions, acting through a physical interface, and verifying outcomes. The authors highlight the challenges faced when transitioning from digital agents to robotic systems, particularly in terms of evaluation and physical constraints. By focusing on these capabilities rather than just task success, PAPAV aims to improve the design and assessment of reliable physical agents.'}, 'zh': {'title': 'PAPAV框架：多模态智能体的五大核心能力', 'desc': '本文提出了PAPAV框架，定义了多模态具身智能体的五个核心能力，包括感知当前状态、预测行动效果、规划可行路径、通过接口或身体行动以及验证结果。多模态具身智能体（MMEAs）是目标导向的系统，能够将多模态任务推理与物理行动结合，并根据反馈修正决策。研究指出，从计算机使用到机器人使用时，多模态智能体面临的评估和物理约束存在差距。PAPAV框架为设计可靠的物理智能体提供了共同基础，并强调了在评估中关注能力而非仅仅是任务成功的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.30120', 'title': 'ALPS: Visual State Encoders for World Models', 'url': 'https://huggingface.co/papers/2610.30120', 'abstract': 'Abstract ALPS is a pretrained visual encoder that unifies physical-state prediction, language alignment, and pixel reconstruction to serve as a shared f
