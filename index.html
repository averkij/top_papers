    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.23318', 'title': 'Agent-G^2: Gaussian Guidance for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.23318', 'abstract': 'Abstract Agent-G² models hint depth as a Gaussian distribution estimated online from existing rollouts, improving reinforcement learning on long-horizon tasks without extra probing.  Generated by thinkingmachines/Inkling-Small Hint-based reinforcement learning addresses reward sparsity in long-horizon agentic tasks by retaining a prefix of an expert trajectory before each rollout, letting the policy explore from a state closer to success. Its effectiveness hinges on the guidance depth: how much of the trajectory to keep. Existing methods treat this depth as a deterministic scalar. Scheduled approaches share one value across samples and ignore per-task heterogeneity; per-sample probing estimates it separately at the cost of extra rollouts. We find that useful guidance occupies a band of depths whose informativeness profile is approximately Gaussian around the band center, rather than concentrating at a single optimal point. We propose Agent-G^2, a Gaussian guidance framework that draws the depth per task from a Gaussian whose center and spread are estimated online from rollouts already collected for policy optimization, requiring no probe rollouts or learned depth predictor. The center combines a global baseline with per-cluster difficulty, and the spread tracks within-cluster variance. We evaluate Agent-G^2 on ALFWorld and WebShop on Qwen2.5-1.5B / 7B-Instruct. Agent-G^2 outperforms the strongest hint-based, hint-free, and Aux-RL baselines on ALFWorld by 2.3 / 3.9 / 7.4 points at under one-third the rollout cost of per-sample probing.', 'score': 10, 'issue_id': 3178, 'pub_date': '2026-08-24', 'pub_date_card': {'ru': '24 августа', 'en': 'August 24', 'zh': '8月24日'}, 'hash': '1b4998f7219e35eb', 'authors': ['Zixuan Wang', 'Yanrui Miao', 'Zhengxi Lu', 'Teng Pan', 'Yiwen Qiu', 'Hongxing Li', 'Peng Qiu', 'Ruiqing Zhang', 'Yongliang Shen'], 'affiliations': ['Baidu Inc.', 'Shandong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.23318.jpg', 'data': {'categories': ['#rl', '#small_models', '#agents'], 'emoji': '🎯', 'ru': {'title': 'Гауссовское распределение глубины подсказок для усиленного обучения без дополнительных проб', 'desc': "В статье представлен метод Agent-G², который моделирует глубину подсказок в обучении с подкреплением как гауссовское распределение, оцениваемое онлайн на основе уже собранных траекторий. Этот подход решает проблему разреженности награды в долгосрочных задачах, позволяя агенту начинать исследование из состояния ближе к успеху. Авторы показывают, что полезная глубина подсказок не сосредоточена в одной оптимальной точке, а распределяется по диапазону значений, информативность которых имеет приблизительно гауссову форму. Предложенный метод достигает лучших результатов чем существующие подходы при значительно меньших вычислительных затратах, не требуя дополнительных пробных rollout'ов или обученного предсказателя."}, 'en': {'title': 'Dynamic Depth for Smarter Reinforcement Learning', 'desc': 'The paper introduces Agent-G², a novel framework for hint-based reinforcement learning that improves performance on long-horizon tasks by using a Gaussian distribution to estimate guidance depth from existing rollouts. This approach allows the policy to start from a more advantageous state by retaining a portion of an expert trajectory, addressing the challenge of reward sparsity. Unlike traditional methods that use a fixed depth or require additional rollouts for probing, Agent-G² dynamically adjusts the guidance depth based on the collected data, optimizing both the center and spread of the Gaussian distribution. The results demonstrate that Agent-G² significantly outperforms existing methods while reducing the cost of rollouts, making it a more efficient solution for complex tasks.'}, 'zh': {'title': '高斯引导：提升强化学习的深度探索', 'desc': '本文提出了一种名为Agent-G²的模型，旨在通过在线估计高斯分布来改进强化学习，特别是在长时间任务中。该模型通过保留专家轨迹的前缀，帮助智能体在接近成功的状态下进行探索，从而解决奖励稀疏的问题。与传统方法不同，Agent-G²将引导深度视为高斯分布，而不是固定的标量，能够更好地适应不同任务的需求。实验结果表明，Agent-G²在多个基准测试中表现优异，显著降低了样本探测的成本。'}}}, {'id': 'https://huggingface.co/papers/2608.26105', 'title': 'VBVR-Pro: A Scalable and Verifiable Suite for Native Visual Reasoning', 'url': 'https://huggingface.co/papers/2608.26105', 'abstract': 'Abstract VBBR-Pro introduces a closed-loop testbed that enables scalable, verifiable, and controllable native visual reasoning through generation across diverse visual substrates.  Generated by thinkingmachines/Inkling-Small Native visual reasoning treats visual generation as the medium of reasoning itself: visual states (i.e. images and videos) are not merely inputs to be understood or outputs to be rendered, but first-class substrates for problem solving beyond language. Yet progress remains bottlenecked by the lack of scalable training tasks, reliable feedback, and controlled comparisons across generative substrates. In this work, we introduce VBVR-Pro, a closed-loop testbed that makes native visual reasoning through generation trainable, verifiable, optimizable, and experimentally controllable. 1) Task scaling. VBVR-Pro turns visual reasoning into a controlled task space of 300 procedurally generated tasks. Models trained on VBVR-Pro show strong transfer beyond the proposed suite across seven external visual reasoning benchmarks such as RISE-Video, MME-CoF-Pro, and BabyVision. 2) Verifiable rewards. VBVR-Pro provides verifiable reward scorers for task-grounded evaluation. Through a systematic study of leading MLLMs as judges, we identify recurring failure modes of the prevalent VLM-as-a-judge paradigm. In contrast, the proposed scorers are grounded in deterministic, task-specific rules, achieve fine-grained alignment with human judgments. Importantly, they serve as reliable reward signals for large-scale multi-task reinforcement learning and demonstrate stronger post-RL performance across visual reasoning tasks. 3) Mechanism study. VBVR-Pro enables controlled modality studies across more than 30 image, video, and interleaved generators. Our analysis shows that video generation remains strongest for tasks requiring persistent spatiotemporal state tracking, while interleaved generation provides a compute-efficient alternative. Critically, ablations and probing suggest the presence of vision-native trajectories that are crucial to visual reasoning. We release all data, models, scorers, and code.', 'score': 6, 'issue_id': 3178, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '2859d40980e715e4', 'authors': ['Junxiang Xu', 'Ruisi Wang', 'Fanyi Pu', 'Maijunxian Wang', 'Ran Ji', 'Tongxi Zhou', 'Chenyang Gu', 'Jing Zuo', 'Hongcan Xiao', 'Yimeng Geng', 'Wanqi Yin', 'Wei Chen', 'Oscar Qian', 'Zhengan Yan', 'Ziqi Huang', 'Haiwen Diao', 'Liang Pan', 'Bo Li', 'Xiangyu Fan', 'Dezhi Luo', 'Fengyuan Yu', 'Zehong Zhao', 'Qingying Gao', 'Tinghui Zhu', 'Yilan Zhang', 'Jingqi Tong', 'Pinyuan Feng', 'Zhengze Jiang', 'Letian Wang', 'Ziyu Guo', 'Renrui Zhang', 'Jieneng Chen', 'Sonia Joseph', 'Constantin Venhoff', 'Saman Motamed', 'Mengyue Yang', 'Chandra Sripada', 'Alan Yuille', 'Philip Torr', 'Lvmin Zhang', 'Vikash Kumar', 'Daniel Khashabi', 'Nikolaus Kriegeskorte', 'Raphaël Millière', 'Vincent C. Müller', 'Anyi Rao', 'Quan Wang', 'Ziwei Liu', 'Dahua Lin', 'Lei Yang', 'Hokin Deng', 'Zhongang Cai'], 'affiliations': ['Carnegie Mellon University', 'Columbia University', 'Friedrich-Alexander-Universitat Erlangen', 'Hong Kong University of Science and Technology', 'INSAIT, Sofia University St. Kliment Ohridski', 'Johns Hopkins University', 'Mila - Institut quebecois dIA', 'Nanyang Technological University', 'Stanford University', 'The Chinese University of Hong Kong', 'The University of Tokyo', 'University of Bristol', 'University of California, Berkeley', 'University of California, Davis', 'University of California, Los Angeles', 'University of California, San Diego', 'University of Michigan', 'University of Oxford', 'University of Toronto', 'VBVR Community Contributors'], 'pdf_title_img': 'assets/pdf/title_img/2608.26105.jpg', 'data': {'categories': ['#multimodal', '#open_source', '#benchmark', '#dataset', '#optimization', '#video', '#rl', '#transfer_learning', '#training', '#reasoning'], 'emoji': '🎬', 'ru': {'title': 'Визуальное рассуждение через генерацию: масштабируемая платформа для обучения и верификации', 'desc': 'В статье представлен VBBR-Pro — закрытый testbed для масштабируемого обучения моделей native visual reasoning, то есть решения задач через визуальную генерацию как основной механизм рассуждения, а не только как средство вывода. Авторы создали контролируемое пространство из 300 процедурно генерируемых задач и предложили верифицируемые reward функции на основе детерминированных правил вместо оценок multimodal LLM, что обеспечивает надежные сигналы для reinforcement learning. Экспериментальное исследование показало, что видео-генерация особенно эффективна для задач, требующих отслеживания пространственно-временных состояний, а чередующаяся генерация предлагает вычислительно эффективную альтернативу. Результаты демонстрируют сильную трансферизацию на семь внешних бенчмарков и выявляют наличие vision-native траекторий, критичных для визуального рассуждения.'}, 'en': {'title': 'Empowering Visual Reasoning with VBBR-Pro: A Scalable Testbed for Generative Learning', 'desc': 'The paper introduces VBBR-Pro, a closed-loop testbed designed to enhance native visual reasoning through generation across various visual formats. It transforms visual reasoning into a structured task space with 300 procedurally generated tasks, allowing models to be trained and evaluated effectively. The testbed also provides verifiable reward systems that align closely with human judgments, improving the reliability of reinforcement learning in visual reasoning tasks. Additionally, it facilitates controlled studies of different generation modalities, revealing insights into the effectiveness of video and interleaved generation methods for specific reasoning challenges.'}, 'zh': {'title': 'VBBR-Pro：可扩展的视觉推理新平台', 'desc': 'VBBR-Pro 是一个闭环测试平台，旨在通过生成多样的视觉材料来实现可扩展、可验证和可控的原生视觉推理。该平台将视觉生成视为推理的媒介，使得图像和视频不仅是输入或输出，而是解决问题的第一类基础。VBBR-Pro 提供了300个程序生成的任务，模型在这些任务上训练后，能够在多个外部视觉推理基准上表现出色。通过可验证的奖励评分机制，VBBR-Pro 使得多任务强化学习的奖励信号更加可靠，从而提升视觉推理任务的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.25927', 'title': 'Code World Model: Coding Agent as World Brain', 'url': 'https://huggingface.co/papers/2608.25927', 'abstract': 'Abstract Code World Model separates persistent world dynamics from visual rendering by using a language model to generate executable state updates and a video model to render observations from proxy representations.  Generated by thinkingmachines/Inkling-Small World models aim to simulate how complex environments evolve under actions and events, yet existing video-based world models primarily learn dynamics from visual observations, which reveal outcomes rather than the underlying knowledge, rules, and mechanisms governing world evolution. This makes it difficult to maintain persistent consequences and support coherent, open-ended evolution. We introduce Code World Model, a framework that separates world evolution from visual realization by combining the reasoning and coding capabilities of language models with the generative priors of video models. A coding agent serves as the world brain, reasoning about events and their consequences and generating executable code to maintain persistent world state and perform rule-consistent evolution. To connect executable state with visual generation, we introduce a proxy representation that encodes frame-wise spatiotemporal constraints and is compiled into a proxy video, which conditions a video model to render high-fidelity visual observations. We further develop data pipelines for constructing aligned proxy-observation pairs from gameplay and real-world videos. After fine-tuning on paired gameplay data, MiniMax-H3 follows proxy-based spatiotemporal specifications from simple interactive worlds built by the coding agent while preserving rich visual details and dynamics. These results demonstrate the potential of combining code for persistent world evolution with video models for flexible visual realization, providing a new path toward open-ended world models.', 'score': 1, 'issue_id': 3178, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '34013ddb8b7a50f5', 'authors': ['Yiwen Chen', 'Guosheng Lin', 'Chi Zhang'], 'affiliations': ['AGI Lab, Westlake University', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2608.25927.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#games', '#video', '#training', '#synthetic', '#reasoning'], 'emoji': '🌍', 'ru': {'title': 'Код как мозг мира: разделение логики и визуализации в мировых моделях', 'desc': 'Работа представляет Code World Model — фреймворк, который разделяет эволюцию виртуального мира от его визуального представления. Система использует языковую модель для генерации исполняемого кода, который поддерживает постоянное состояние мира и обеспечивает логически согласованную эволюцию среды. Для преобразования абстрактного состояния в реалистичные визуальные наблюдения используется промежуточное представление (proxy representation) и видеомодель, которая генерирует высокочастотные визуальные данные. Подход демонстрирует эффективность комбинирования символического кодового мышления с глубокими генеративными моделями для создания открытых мировых моделей.'}, 'en': {'title': 'Revolutionizing World Models: Code Meets Vision', 'desc': 'The Code World Model introduces a novel approach to simulating complex environments by separating the dynamics of world evolution from visual rendering. It utilizes a language model to generate executable state updates, allowing for coherent and persistent consequences in the environment. By combining this with a video model, the framework can render high-fidelity visual observations based on proxy representations that encode spatiotemporal constraints. This innovative method enhances the ability to create open-ended world models that evolve consistently under various actions and events.'}, 'zh': {'title': '代码与视觉的完美结合，开启开放式世界模型的新路径', 'desc': '代码世界模型通过使用语言模型生成可执行的状态更新，并通过视频模型从代理表示中渲染观察，来将持久的世界动态与视觉渲染分开。现有的视频基础世界模型主要从视觉观察中学习动态，这使得它们难以维护持久的后果并支持连贯的开放式演化。我们提出的代码世界模型框架结合了语言模型的推理和编码能力与视频模型的生成先验，旨在实现世界演化与视觉实现的分离。通过引入代理表示，我们能够将可执行状态与视觉生成连接起来，从而实现高保真的视觉观察。'}}}, {'id': 'https://huggingface.co/papers/2608.24979', 'title': 'FrontierChallenge: Evaluating Scientific Workflow Completion', 'url': 'https://huggingface.co/papers/2608.24979', 'abstract': 'Abstract FrontierChallenge evaluates end-to-end scientific workflows across domains, revealing that frontier models complete only about 20% of tasks despite high partial scores and frequent claims of completion.  Generated by thinkingmachines/Inkling-Small Scientific agents increasingly analyze data, execute code, and produce research artifacts, yet most benchmarks emphasize final answers, isolated programs, or a single domain. We introduce FrontierChallenge, a cross-domain benchmark comprising 300 end-to-end scientific workflows. In this paper, we release and evaluate 97 of these tasks, spanning quantum chemistry, molecular dynamics, materials characterization, analytical chemistry, life science, and electrochemistry/environment. Each task provides fixed inputs and specifies a bundle of required scientific deliverables. We evaluate twelve frontier models with three agent scaffolds. Pass Rate measures the fraction of tasks satisfying the full-completion criterion, while Avg. Score captures partial progress. Each of the best-performing configurations completed only 20 of the 97 released tasks, yielding a Pass Rate of 20.6%. Partial progress translated especially poorly into complete delivery in analytical chemistry and electrochemistry/environment: Avg. Scores reached 87.6 and 94.9, but the highest Pass Rates were only 4% and 0%. Among non-passing Claude Code trajectories, 75.5% still ended with language claiming completion. These findings show that neither high partial scores nor confident claims of completion reliably indicate that a scientific task has been fully delivered, highlighting the need to evaluate end-to-end workflow execution and the completeness of scientific deliverables together.', 'score': 1, 'issue_id': 3178, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'ad2d0009c8a21666', 'authors': ['Liangcai Su', 'Zhaopeng Feng', 'Zhuo Chen', 'Zhen Zhang', 'Xiang Lin', 'Ruilin Li', 'Handuo Zhang', 'Ning Wang', 'Kailong Wen', 'Yueqi Guo', 'Feng Xing', 'Yiling Guo', 'Chenxiong Qian', 'Simon Shaolei Du', 'Lidong Bing', 'Xinyu Wang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.24979.jpg', 'data': {'categories': ['#agents', '#open_source', '#benchmark', '#dataset', '#science'], 'emoji': '🔬', 'ru': {'title': 'Полнота важнее уверенности: зачем нужна оценка end-to-end научных рабочих процессов', 'desc': 'В статье представлен FrontierChallenge — кроссдоменный бенчмарк из 300 научных рабочих процессов для оценки способности frontier моделей выполнять комплексные задачи. Авторы протестировали 12 передовых LLM с помощью трёх агентских архитектур на 97 задачах из квантовой химии, молекулярной динамики, аналитической химии и других областей. Результаты показали, что даже лучшие конфигурации моделей выполнили только 20% задач полностью, несмотря на высокие частичные оценки (94.9% в некоторых случаях). Исследование выявило проблему самоуверенности моделей: 75.5% незавершённых попыток завершились утверждениями о выполнении задачи, демонстрируя необходимость оценки полного выполнения научных рабочих процессов, а не только частичного прогресса.'}, 'en': {'title': 'Evaluating True Completion in Scientific Workflows', 'desc': 'The paper introduces FrontierChallenge, a benchmark designed to evaluate the performance of scientific workflows across various domains. It reveals that even advanced models only complete about 20% of tasks, despite achieving high partial scores. The study assesses twelve frontier models on 97 tasks from fields like quantum chemistry and life sciences, highlighting a significant gap between partial progress and actual task completion. The findings emphasize the importance of measuring both the execution of workflows and the completeness of scientific deliverables, rather than relying solely on high scores or claims of success.'}, 'zh': {'title': '科学工作流评估：高得分不等于完整交付', 'desc': 'FrontierChallenge 是一个跨领域的基准测试，评估科学工作流的完整性。尽管前沿模型在部分任务中得分较高，但它们仅完成了约20%的任务。我们测试了97个科学工作流，涵盖多个领域，包括量子化学和生命科学。研究表明，高部分得分并不意味着科学任务的完全交付，强调了评估工作流执行和科学交付完整性的重要性。'}}}];

            categories = categories.map(element => `#${element}`);
            return categories
        }

            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0

            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');

            }

            if (filterLogicIsAnd) {

        });

            const categories = new Set();

                    article.data.categories.forEach(cat => categories.add(cat));

            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {

            categories.forEach(category => {

            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));

        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);

            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-27 02:28')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-27 02:28')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
