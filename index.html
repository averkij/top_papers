ρ = 0.92).'}, 'en': {'title': 'Legal Opinions Need More Than Retrieval', 'desc': 'This paper introduces GPBam, a benchmark for evaluating German public-law reasoning using 81 exam cases and 200 statutory provisions. It jointly measures how well models retrieve relevant laws and write structured legal opinions that apply those laws to case facts. Across 32 models, adding retrieved laws improves essay scores only modestly, even when retrieval is strong. Essay quality closely tracks models’ prior ability to recall statutory text, suggesting that stored legal knowledge matters more than retrieval alone.'}, 'zh': {'title': '法律意见写得好，关键在于真正掌握法条', 'desc': '本文推出 GPBam 基准，包含 81 道德国公法考试案例及参考答案，并提供对 200 条法律条文的复述任务。它同时评估法律检索和长篇法律意见写作，使研究者能检验检索到的条文是否能提升案例分析质量。对 32 个模型的测试显示，加入检索带来的写作成绩提升有限；即使使用高召回率的理想检索，提升也只有 2 到 6 分。模型写作质量与其预先掌握法律条文的程度高度相关，说明法律知识储备比单纯检索更关键。'}}}, {'id': 'https://huggingface.co/papers/2611.06238', 'title': 'Zuse: A Decision Model for European Languages', 'url': 'https://huggingface.co/papers/2611.06238', 'abstract': "Abstract  Decision models read a document and return a probability for each of a fixed set of options instead of generating text. Several appeared in 2026, but none has published results outside English. We describe Zuse, three decision models (4B, 9B and 27B) that train a low-rank adapter and a pointer head on frozen open-weight bases, targeting 27 European languages, and use them to study how this design behaves across languages and tasks. On a broad European suite of 11 sources excluded from training, covering 9 task groups and 27 languages, a development set that also guided model selection, the 27B model reaches 87.5% accuracy with a pooled expected calibration error of 0.016, and 0.035 when weighted per source. Post-hoc analyses of these single-seed results give three findings. First, miscalibration is structured by task rather than language: on parallel reading and topic items in 26 languages the confidence gap varies about as much as sampling noise, while across sources it spans -0.07 to +0.09, with knowledge tasks overconfident and acceptability judgements underconfident at all three sizes, so one fitted temperature cannot correct both. Second, the share of decisions that can be automated at a 5% error budget follows chance-corrected skill (Spearman 0.97 over 33 source and model pairs) more closely than raw accuracy (0.91). Third, reach beyond the training languages is set by the base model: across 210 languages, changing the training run moved scores by at most about 2 points within a size, while languages outside the base's documented list trail by 23 to 28 points at every size. On English public suites Zuse is behind Jev and Kev, including Kev models on the same bases. We also report two pitfalls in building multi-source training data: label-word collision between topic schemes, and an injection augmentation that taught a shortcut. Zuse can be tried at https://bineric.com/zuse.", 'score': 0, 'issue_id': 3542, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': 'd2fe32eaa54e10ec', 'authors': ['Umair Mehmood Imam'], 'affiliations': ['Bineric AI', 'OsloMet'], 'pdf_title_img': 'assets/pdf/title_img/2611.06238.jpg', 'data': {'categories': ['#architecture', '#training', '#small_models', '#machine_translation', '#benchmark', '#interpretability', '#dataset', '#ethics', '#low_resource', '#inference', '#multilingual'], 'emoji': '🇪🇺', 'ru': {'title': 'Zuse: Многоязычные decision-модели, которые знают, насколько они уверены', 'desc': 'Статья представляет Zuse — три decision-модели (4B, 9B и 27B), которые читают документ и возвращают вероятности для фиксированного набора вариантов, а не генерируют текст. Модели обучены как LoRA-адаптеры и pointer head поверх замороженных open-weight baseline LLM и ориентированы на 27 европейских языков. На европейском наборе из 11 источников, не входивших в обучение, лучшая модель 27B достигает точности 87.5% и низкой калибровочной ошибки (ECE 0.016). Анализ показывает, что miscalibration определяется типом задачи, а не языком, а охват языков зависит от базовой модели.'}, 'en': {'title': 'One Decision Model, Many Languages—But Task and Base-Model Limits Matter', 'desc': 'Zuse is a set of 4B, 9B, and 27B decision models that use low-rank adapters and pointer heads on frozen open-weight models to classify documents across 27 European languages. On a broad, held-out European evaluation suite, the largest model achieved 87.5% accuracy and low pooled calibration error, though its results were based on a single training run and a development set used for model selection. The analysis found that confidence errors vary more by task than by language, that safe automation rates track chance-corrected skill, and that performance in languages beyond a base model’s documented coverage is substantially lower. Zuse trails some competing models on English benchmarks, and the paper also describes data-building pitfalls involving conflicting labels and shortcut learning.'}, 'zh': {'title': '多语言决策模型：任务决定校准，基础模型决定语言覆盖', 'desc': 'Zuse 是一组用于分类决策的模型，针对 27 种欧洲语言训练低秩适配器和指针头，同时保持开放权重基础模型冻结。它在未参与训练的多语言测试集上表现良好，但校准误差会因任务类型而异：知识任务容易过度自信，判断可接受性的任务则容易信心不足，因此单一温度缩放难以同时校正两者。可自动化处理的决策比例与校正随机水平后的技能相关性，比与原始准确率的相关性更强；模型对训练数据以外语言的能力，则主要受基础模型覆盖范围限制。研究还指出，多来源训练数据可能出现标签词冲突或模型学会数据增强捷径；在英语公开基准上，Zuse 的表现仍落后于 Jev 和 Kev。'}}}, {'id': 'https://huggingface.co/papers/2611.21439', 'title': 'A Reinforcement Learning Method to Navigate SMEFT Operator Space', 'url': 'https://huggingface.co/papers/2611.21439', 'abstract': 'Abstract A reinforcement learning agent with a lightweight actor-critic architecture explores the Standard Model Effective Field Theory operator space to discover diverse high-quality theory hypotheses and improve global fits.  Generated by deepseek-ai/DeepSeek-V4.1-Flash In particle physics, discrepancies between experimental measurements and Standard Model (SM) predictions are commonly interpreted within new theoretical models. In this context, the Standard Model Effective Field Theory (SMEFT) provides a general framework encompassing a broad class of models. However, exploring the enormous space of possible SMEFT operators rapidly becomes a challenging combinatorial problem: many operators can contribute simultaneously to different observables, their effects are correlated, and distinct operator combinations can provide comparably good descriptions of the data. In this work, we formulate the exploration of the SMEFT operator space as a sequential decision-making problem using reinforcement learning (RL). Our RL agent employs a lightweight actor-critic architecture with approximately 40K trainable parameters in total. Rather than searching for a single best-fit theory, our method is designed to discover a diverse set of high-quality theory hypotheses. We test the method in a complex phenomenological environment comprising 132 observables across several sectors of particle physics, including 24 measurements that deviate from their SM predictions by more than 1.5σ. We show that the learned RL policy efficiently constructs multi-operator theories that substantially improve the global fit. Comparisons with independent random-subset and random-sequential searches demonstrate the ability of the RL policy to navigate this large combinatorial space. Our results establish RL as a systematic framework for exploring diverse patterns of new physics (NP) interactions within SMEFT.', 'score': 0, 'issue_id': 3542, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '2a7210b1d133e5a3', 'authors': ['Jacky Kumar'], 'affiliations': ['Université de Montréal'], 'pdf_title_img': 'assets/pdf/title_img/2611.21439.jpg', 'data': {'categories': ['#math', '#small_models', '#rl', '#optimization', '#science'], 'emoji': '🔬', 'ru': {'title': 'RL-агент исследует пространство новой физики и находит разнообразные теории, объясняющие данные', 'desc': 'В статье предложен подход, в котором reinforcement learning агент с компактной actor-critic архитектурой (около 40K обучаемых параметров) исследует пространство операторов Standard Model Effective Field Theory (SMEFT), чтобы объяснить расхождения между экспериментом и предсказаниями Standard Model. Задача формулируется как последовательное принятие решений, а не поиск одной best-fit теории, и агент находит разнообразный набор качественных многооператорных гипотез. Метод тестируется на среде из 132 наблюдаемых, включая 24 измерения с отклонением более 1.5σ, и заметно улучшает global fit. Сравнение с random-subset и random-sequential поисками показывает, что RL-политика эффективно ориентируется в комбинаторно огромном пространстве.'}, 'en': {'title': 'Reinforcement Learning Navigates SMEFT’s Vast Theory Space', 'desc': 'The paper treats the search for Standard Model Effective Field Theory (SMEFT) operators as a sequential decision-making task. A lightweight reinforcement learning agent, using an actor-critic architecture, builds theories by selecting combinations of operators. Tested on 132 particle-physics observables, its learned policy finds diverse theories that improve the global fit and compares favorably with random search methods. The approach offers a systematic way to explore possible patterns of new-physics interactions.'}, 'zh': {'title': '用强化学习探索新物理理论的广阔空间', 'desc': '这项研究把标准模型有效场论（SMEFT）中寻找算符组合的问题建模为序贯决策任务，并用强化学习进行探索。智能体采用轻量级的演员-评论家架构，总计约有4万个可训练参数，目标是找到多种高质量理论假设，而非只寻找单一最佳拟合。研究在涵盖粒子物理多个领域的132项观测量上测试该方法，结果显示它能高效构建包含多个算符的理论，并显著改善全局拟合。与随机搜索方法相比，强化学习策略能更有效地探索庞大的组合空间，为系统发现SMEFT中的多样新物理相互作用模式提供了方法。'}}}];
        const articlesContainer = document.getElementById('articles-container');

        }

            window.history.pushState({}, '', newUrl);
        }

            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            let settingSortBy = localStorage.getItem('sort_by');

            if (isDarkMode) {
                document.body.classList.remove('light-theme');

                document.getElementById('filter-logic-or').checked = true;

            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');

            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

            }

                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-17 22:07',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-17 22:07')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-17 22:07')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
