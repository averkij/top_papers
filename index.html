608.15964', 'abstract': "Abstract HOTFIXR is a data generation framework that targets multilingual reasoning weaknesses to improve cross-lingual performance without sacrificing overall capability.  Generated by thinkingmachines/Inkling-Small Language-specific competency (LSC) is the phenomenon of a language model performing better or worse depending on the language of the prompt. In other words, a language model outputs different (and potentially incorrect) responses to the same semantic query when prompted in different languages. Prior work attributes this to an internal misalignment of semantic representation across languages. Currently, there are two main approaches to address LSC in the literature: (1) routing all queries through English, improving performance, but limiting language expressivity to English; or (2) training on language-balanced data, equalizing model performance across languages, but reducing overall performance. In this work, we take a data centric perspective and introduce HOTFIXR: Hardness Optimized Training data For Improving X-Lingual Reasoning. It is a data generation framework that uses models to probe and learn a student model's multilingual weaknesses, and generates data to mitigate them. HOTFIXR can generate multilingual synthetic training data that can improve multilingual performance. We evaluate on three in-distribution tasks, three out-of-distribution tasks, and four out-of-distribution languages. On average, HOTFIXR (1) improves in-distribution performance by 6.2%, (2) reduces catastrophic forgetting (induced by fine-tuning) on OOD tasks by 3.7%, and (3) on OOD languages by 7.1%. Overall, as many real-world applications requires multilingual LLMs, our work contributes to the efforts of making LLMs multilingually proficient. We will release code upon acceptance.", 'score': 2, 'issue_id': 3079, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '38cda553af24d0d1', 'authors': ['Ishika Agarwal', 'Arkajyoti Charaborty', 'Tanner Sorensen', 'Neha Gupta', 'Andreas Stolcke'], 'affiliations': ['UIUC', 'Uniphore'], 'pdf_title_img': 'assets/pdf/title_img/2608.15964.jpg', 'data': {'categories': ['#multilingual', '#machine_translation', '#open_source', '#low_resource', '#data', '#dataset', '#synthetic', '#training'], 'emoji': '🌍', 'ru': {'title': 'Умное исправление многоязычности без потери производительности', 'desc': 'HOTFIXR — это фреймворк для генерации данных, который решает проблему языково-специфичной компетентности в многоязычных языковых моделях. Проблема заключается в том, что LLM выдают разные ответы на семантически идентичные запросы в зависимости от языка, что связано с внутренним разбалансом представлений между языками. Вместо компромиссных подходов (маршрутизация через английский или обучение на сбалансированных данных), авторы предлагают подход, ориентированный на данные: система автоматически выявляет многоязычные слабости модели и генерирует синтетические обучающие данные для их преодоления. Эксперименты показывают улучшение производительности на 6.2% для известных задач и значительное снижение забывчивости на неизвестных языках и задачах.'}, 'en': {'title': 'Enhancing Multilingual Reasoning with HOTFIXR', 'desc': 'HOTFIXR is a framework designed to enhance the performance of language models in multilingual reasoning tasks. It addresses the issue of language-specific competency (LSC), where models perform inconsistently based on the language of the input. By generating synthetic training data that targets the weaknesses of a model in different languages, HOTFIXR improves cross-lingual performance without compromising overall capabilities. The framework has shown significant improvements in both in-distribution and out-of-distribution tasks, making it a valuable tool for developing multilingual language models.'}, 'zh': {'title': 'HOTFIXR：提升多语言推理能力的解决方案', 'desc': 'HOTFIXR是一个数据生成框架，旨在解决多语言推理的弱点，以提高跨语言性能而不牺牲整体能力。该框架通过分析学生模型的多语言弱点，生成合成训练数据来改善模型表现。HOTFIXR能够生成多语言的合成训练数据，从而提升多语言性能。我们的评估显示，HOTFIXR在多个任务上显著提高了模型的表现，尤其是在处理不同语言时。'}}}, {'id': 'https://huggingface.co/papers/2608.15888', 'title': 'Bounded Agents: Delegation Security for Multi-Agent AI Systems', 'url': 'https://huggingface.co/papers/2608.15888', 'abstract': "Abstract The Agentic Principal Chain enforces session-aware authorization checks to prevent harmful action combinations and delegation abuses in LLM agents.  Generated by thinkingmachines/Inkling-Small LLM-based agents can act on behalf of a user to access cloud services, call tools, or invoke agents. At session start, the agent's permissions are set but remain static, and each request is evaluated independently, without considering prior actions. Within its permissions, an agent may act contrary to the delegated task, combine individually permitted actions into a prohibited outcome, or delegate authority to a sub-agent without limiting it. A prompt injection poses a risk only if the agent has authority to perform such actions; this is therefore a problem of authorization architecture, not just the model. The Agentic Principal Chain (APC) tracks delegated authority from one principal to the next. APC evaluates each request against the accumulated session state using six authorization checks. APC carries forward and restricts delegated scope and budgets. Using composition closure, APC checks requests against prior actions to prevent prohibited combinations and enforces the decision outside the model. We prove Blast Radius Monotonicity and Composition Soundness for APC implementations; Composition Soundness is limited to prohibited combinations under a complete restriction set and serialized admission. We evaluated 3,154 instances including InjecAgent, AgentDojo, and ASB. Our compromised-model evaluation tests APC independently of model behavior by inserting the ground-truth attack call after the first legitimate tool call. AgentDojo exfiltration fell from 75-100% to 0% across all four domains; APC blocked all 544 InjecAgent data-stealing cases. Intent binding reduced destruction from 38.6% to 4.0% and manipulation from 90.5% to 12.1%. Authorization latency was 0.24 ms at the 99th percentile on an idle host; across 949 AgentDojo task-injection pairs, utility was 8.6 and 13.9 percentage points lower in the two settings. Implementation, evaluation tools, and data are publicly available.", 'score': 2, 'issue_id': 3079, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '2a9d80f90e8e017d', 'authors': ['Xabier Muruaga'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2608.15888.jpg', 'data': {'categories': [], 'emoji': '🔐', 'ru': {'title': 'Цепочка ответственности: контроль полномочий в многоагентных системах', 'desc': 'В статье предложена архитектура Agentic Principal Chain (APC), которая отслеживает делегированные полномочия между агентами в сессии и применяет контрольные проверки авторизации на основе истории взаимодействий. Система предотвращает опасные комбинации действий, утечки данных и неправомерное делегирование власти sub-агентам, вводя ограничения на область действия и бюджеты полномочий. Авторы доказали математические свойства Blast Radius Monotonicity и Composition Soundness для реализаций APC и протестировали подход на 3,154 примерах атак, включая InjecAgent и AgentDojo. Результаты показывают, что APC блокирует атаки кража данных на 100%, снижает манипулирование с 90.5% до 12.1%, при этом добавляя минимальную задержку (0.24 мс) в обработку запросов.'}, 'en': {'title': 'Securing LLM Agents with the Agentic Principal Chain', 'desc': 'The paper introduces the Agentic Principal Chain (APC), a framework designed to enhance session-aware authorization for LLM agents. It addresses the risks of harmful action combinations and delegation abuses by implementing six authorization checks that evaluate requests based on the accumulated session state. By tracking delegated authority and enforcing restrictions, APC prevents agents from executing prohibited actions or delegating unchecked authority to sub-agents. The evaluation shows significant reductions in data exfiltration and manipulation, demonstrating the effectiveness of APC in securing LLM agent operations.'}, 'zh': {'title': '代理主链：确保安全的授权机制', 'desc': '本文提出了代理主链（Agentic Principal Chain, APC），用于在大型语言模型（LLM）代理中实施会话感知的授权检查，以防止有害的操作组合和委托滥用。APC通过六个授权检查来评估每个请求，确保在会话状态下跟踪和限制委托的权限和预算。研究表明，APC能够有效阻止数据泄露和不当操作，显著降低了攻击成功率。通过对多个实例的评估，APC在授权延迟和安全性方面表现出色，确保了代理的安全性和可靠性。'}}}, {'id': 'https://huggingface.co/papers/2608.18115', 'title': 'Temporal Multi-Signal Fusion for Token-Level Hallucination Detection', 'url': 'https://huggingface.co/papers/2608.18115', 'abstract': 'Abstract Hallucination is detected as temporally extended spans via sequence labeling over fused external features, achieving robust cross-model performance without internal model access.  Generated by thinkingmachines/Inkling-Small Token-level hallucination detectors score each token independently from a single signal, and fail exactly when the generating model is confidently wrong. This paper instead treats hallucination as a temporally extended span and detects it by sequence labeling: each token is scored from a 33-dimensional feature stream that fuses text statistics, Natural Language Inference (NLI) entailment, and language model surprisal, with no access to model internals. A Bidirectional Gated Recurrent Unit (BiGRU) over these features reaches an AUC of 0.840 on RAGTruth (10 seeds), an 11-point gain over an independent logistic-regression baseline (p = 0.002, Wilcoxon signed-rank). A controlled decomposition attributes most of the gain to temporal order rather than model capacity: evidence propagates from confident positions to ambiguous neighbors within a span. The same 0.845 ceiling recurs across recurrent, state-space (Mamba), and attention architectures, locating the bottleneck in the feature set rather than the model. Because it reads only the generated text and external signals, the detector works on closed-source models, and it keeps working on text produced by language models it never saw during training, losing under 4% AUC.', 'score': 2, 'issue_id': 3068, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '0d1c6eaa5aefd838', 'authors': ['Igor Itkin'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.18115.jpg', 'data': {'categories': ['#rag', '#benchmark', '#architecture', '#hallucinations'], 'emoji': '🎯', 'ru': {'title': 'Обнаружение галлюцинаций как протяжённых последовательностей токенов', 'desc': 'В статье предлагается новый подход к обнаружению галлюцинаций в текстах, генерируемых языковыми моделями, путём применения sequence labeling к последовательностям токенов вместо независимой оценки каждого токена. Метод использует 33-мерный вектор признаков, объединяющий статистику текста, оценки Natural Language Inference и surprisal языковой модели, без доступа к внутренним компонентам генерирующей модели. BiGRU архитектура, работающая на этих признаках, достигает AUC 0.840 на датасете RAGTruth, что на 11 пунктов выше baseline на логистической регрессии, причём основной вклад вносит учёт временного порядка токенов. Детектор успешно обобщается на закрытые модели и модели, невидимые во время обучения, теряя менее 4% качества.'}, 'en': {'title': 'Detecting Hallucination Through Temporal Context', 'desc': "This paper addresses the issue of hallucination in language models by detecting it as extended spans of text rather than individual tokens. It employs sequence labeling techniques that utilize a 33-dimensional feature stream, which combines various external signals like text statistics and Natural Language Inference (NLI) entailment. The proposed method, using a Bidirectional Gated Recurrent Unit (BiGRU), significantly outperforms traditional token-level detectors, achieving an AUC of 0.840. The findings suggest that the improvement is largely due to the model's ability to consider the temporal order of tokens, rather than just its capacity, making it effective even on unseen text from closed-source models."}, 'zh': {'title': '通过序列标注检测生成模型中的幻觉', 'desc': '本论文提出了一种新的方法来检测生成模型中的幻觉现象，采用序列标注技术来识别时间上延续的幻觉片段。通过融合文本统计、自然语言推理和语言模型的惊讶度等33维特征流，模型在没有访问内部结构的情况下实现了强大的跨模型性能。使用双向门控递归单元（BiGRU）对这些特征进行处理，在RAGTruth数据集上达到了0.840的AUC，显著优于传统的逻辑回归基线。研究表明，检测性能的提升主要归因于时间顺序的考虑，而非模型容量的提升。'}}}, {'id': 'https://huggingface.co/papers/2608.19080', 'title': 'SPK: Eliciting Structured Prior Knowledge for Interpretable Out-of-Distribution Detection in Real-Time Object Detection', 'url': 'https://huggingface.co/papers/2608.19080', 'abstract': 'Abstract Structured Prior Knowledge explicitly extracts latent semantic, geometric, and contextual priors from pretrained object detectors to detect out-of-distribution hallucinations via a compact interpretable representation.  Generated by thinkingmachines/Inkling-Small Object detectors often produce over-confident predictions for objects outside their training categories, leading to so-called out-of-distribution (OoD) hallucinations. Existing approaches for detecting or mitigating such hallucinations typically either construct scoring functions directly over learned object detector representations or modify the object detector itself to suppress hallucination emergence. However, the latent priors implicitly encoded in these representations remain largely unexplored and have not been explicitly decoded for OoD detection. To uncover and exploit these latent priors, we propose Structured Prior Knowledge (SPK), a hallucination-oriented framework that explicitly elicits OoD-relevant priors from pretrained object detectors. Specifically, SPK leverages in-distribution data and hallucination-inducing samples as diagnostic supervision to elicit part-level semantic concepts underlying object detector decision-making, rather than using them merely for rejection or object detector adaptation. The elicited semantic priors are further integrated with geometric and contextual priors to form a compact five-dimensional SPK representation for OoD detection. Extensive experiments across diverse object detector architectures and multiple OoD benchmarks demonstrate that SPK achieves state-of-the-art OoD detection. Our findings reveal that pretrained object detectors already encode substantially richer latent knowledge than is typically exploited for OoD detection. More importantly, this knowledge can be explicitly elicited and organized into a compact, structured, and interpretable knowledge space for prediction reliability analysis. This suggests a promising proactive route for improving object detector reliability by explicitly uncovering and leveraging latent priors. Code and data are available at: https://gricad-gitlab.univ-grenoble-alpes.fr/dnn-safety/spk', 'score': 0, 'issue_id': 3079, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': 'a7a1169611fbb5ed', 'authors': ['Changshun Wu', 'Weicheng He', 'Xiaowei Huang', 'Saddek Bensalem'], 'affiliations': ['CSX-AI, France', 'University of Liverpool, UK', 'Université Grenoble Alpes, France'], 'pdf_title_img': 'assets/pdf/title_img/2608.19080.jpg', 'data': {'categories': ['#hallucinations', '#interpretability', '#benchmark', '#cv'], 'emoji': '🚨', 'ru': {'title': 'Явное извлечение скрытых приоров для обнаружения галлюцинаций в детекторах объектов', 'desc': 'Статья предлагает метод Structured Prior Knowledge (SPK) для обнаружения галлюцинаций вне распределения в детекторах объектов. Авторы явно извлекают скрытые семантические, геометрические и контекстные приоры из предобученных моделей, используя размеченные данные как диагностическую супервизию. Полученные приоры интегрируются в компактное пятимерное представление, которое позволяет эффективно выявлять ошибочные предсказания для объектов вне обучающего распределения. Экспериментальные результаты на различных архитектурах детекторов демонстрируют, что скрытые знания в предобученных моделях можно явно извлечь и организовать в интерпретируемое пространство для повышения надёжности.'}, 'en': {'title': 'Unlocking Latent Knowledge for Better Object Detection', 'desc': 'This paper introduces Structured Prior Knowledge (SPK), a framework designed to improve the detection of out-of-distribution (OoD) hallucinations in object detectors. SPK extracts and utilizes latent semantic, geometric, and contextual priors from pretrained object detectors, which are often overlooked in existing methods. By leveraging in-distribution data and samples that induce hallucinations, SPK elicits part-level semantic concepts that enhance decision-making processes. The resulting five-dimensional SPK representation significantly boosts OoD detection performance, revealing that pretrained models contain valuable latent knowledge that can be systematically organized for better prediction reliability.'}, 'zh': {'title': '揭示潜在知识，提升物体检测可靠性', 'desc': '这篇论文提出了一种名为结构化先验知识（SPK）的框架，用于检测超出分布的幻觉（OoD）。该方法从预训练的物体检测器中提取潜在的语义、几何和上下文先验，以提高检测的可靠性。SPK利用分布内数据和诱发幻觉的样本，明确提取物体检测决策背后的部分语义概念。实验结果表明，SPK在多种物体检测器架构和OoD基准测试中实现了最先进的检测性能。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (7)', '#agi', '#alignment (1)', '#architecture (4)', '#audio (2)', '#benchmark (12)', '#cv (2)', '#data (1)', '#dataset (4)', '#diffusion', '#ethics', '#games (1)', '#graphs', '#hallucinations (2)', '#healthcare', '#inference (3)', '#interpretability (1)', '#leakage (1)', '#long_context (1)', '#low_resource (1)', '#machine_translation (1)', '#math', '#multilingual (1)', '#multimodal (4)', '#open_source (5)', '#optimization (6)', '#plp (1)', '#rag (1)', '#reasoning (4)', '#rl (4)', '#rlhf (1)', '#robotics (2)', '#science (2)', '#security', '#small_models (1)', '#story_generation (1)', '#survey', '#synthetic (3)', '#training (8)', '#transfer_learning', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-20 20:20',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-20 20:20')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-20 20:20')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
