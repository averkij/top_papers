ю, а затем получает избирательный контроль через token-gated LoRA и вектор подавления концептов в текстовых эмбеддингах. Эксперименты, включая количественные оценки и пользовательские исследования, подтверждают эффективность подхода.'}, 'en': {'title': 'Choose the Edits, Keep the Transformation', 'desc': 'Selective Image Analogy (SIA) transfers edits shown in a before-and-after image pair to a new query image, while letting users choose which edits to apply. The authors create a dataset with examples of both complete and partial edit transfers. Their model uses token-gated LoRA and a concept suppression vector to weaken unwanted edit tokens during denoising while preserving selected edits. Evaluations and user studies show that this approach enables flexible edit selection without needing a separate demonstration for every combination.'}, 'zh': {'title': '按需选择编辑，让图像变换更灵活', 'desc': '本文提出选择性图像类比（SIA）任务：从示例图像对中学习多种编辑，并让用户选择将哪些编辑应用到查询图像。为支持训练，作者构建了包含完整编辑和部分编辑目标的多编辑数据集。模型先学习迁移完整变换，再通过掩码对齐的抑制机制实现选择控制：在去噪过程中，令令牌门控的 LoRA 限制适配器更新，并用概念抑制向量削弱文本嵌入中的指定编辑令牌。这样，模型能抑制用户不想要的编辑，同时保留选定的编辑，无须为每种编辑组合重新提供示例；实验和用户研究验证了该方法的效果。'}}}, {'id': 'https://huggingface.co/papers/2611.32786', 'title': 'Simulator-as-Proxy World Model for Robot Manipulation', 'url': 'https://huggingface.co/papers/2611.32786', 'abstract': 'Abstract SimPWM uses a parameter-free simulator as a proxy to generate robot videos and simulated states, revealing that video models follow arm motion more reliably than object dynamics and often ignore simulated object state.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Video world models for robots are increasingly conditioned on a simulated or rendered proxy of the scene, on the assumption that the video will show what the proxy shows. Testing this assumption requires a proxy whose state is explicit and can be perturbed. We present SimPWM (Simulator-as-Proxy World Model): given a calibrated camera, it represents, from the first frame alone, the robot by its 3D model and the objects the gripper may touch as 3D points; a rule-based simulator with no trained parameters moves them under the actions, and a video model renders the result. SimPWM returns the realistic video together with the simulated state. We then freeze the simulated objects while the arm moves as recorded and check whether the video still shows the object lifted. On DROID episodes from unseen setups, the answer differs for the arm and for the objects. With each of three base video models, the arm follows the proxy (robot IoU 0.75-0.78, against at most 0.69 for end-to-end models); rendering the robot alone already gives this. What the simulated objects add is the object state: against a robot-only proxy, they cut missed pick-ups from 54% to 38%, and the video follows them only with some base models: on rigid objects, freezing them lowers the lift rate of MiniMax-H3, fine-tuned on episodes whose simulation agrees with the real video, from 42% to 10%, but that of LTX-2.3, trained on the same episodes, only from 57% to 49%, as if it inferred the grasp from the arm motion; more than half of the remaining lifts of MiniMax-H3 are of cloth and rope, which the simulator carries rigidly. With any base model, the simulated state records what the simulation did; under perturbed actions, a video that disagrees with it reveals that the video ignores the simulated state.', 'score': 0, 'issue_id': 3567, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '8f09529344f6b578', 'authors': ['Tingting Liao', 'Mingjia Huo', 'Hao Li', 'Zhengzhong Liu', 'Eric P. Xing', 'Guangyi Liu'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence', 'Pinscreen', 'University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2611.32786.jpg', 'data': {'categories': ['#benchmark', '#robotics', '#synthetic', '#games', '#3d', '#video'], 'emoji': '🤖', 'ru': {'title': 'Видео следует за рукой, но не всегда за объектом', 'desc': 'Статья представляет SimPWM — мировую модель для роботов, где видеомодель генерирует видео на основе симулятора без обучаемых параметров, который из первого кадра строит 3D-модель робота и объектов. Авторы проверяют, следует ли видео за состоянием симуляции, замораживая объекты и смотря, останется ли предмет поднятым. Результаты показывают, что видеомодели надёжно повторяют движение руки, но объектную динамику часто игнорируют, а степень учёта состояния симуляции зависит от базовой модели (например, MiniMax-H3 и LTX-2.3). Работа показывает, что симулируемое состояние нужно проверять отдельно, так как видео не всегда ему соответствует.'}, 'en': {'title': 'Robot Videos Follow the Arm—But Not Always the Simulated Objects', 'desc': 'SimPWM combines a parameter-free, rule-based simulator with a video model to generate robot videos alongside explicit simulated states. On unfamiliar DROID setups, the videos follow the simulated robot arm more consistently than they follow simulated object motion. Adding simulated objects reduces missed pick-ups, but freezing their states shows that some video models still depict lifts even when the simulation says the objects did not move. This reveals that video models may infer object motion from arm motion rather than reliably using the proxy’s object state.'}, 'zh': {'title': '让模拟状态接受检验：机器人视频模型究竟听谁的？', 'desc': '这篇论文提出 SimPWM：用无需训练参数的规则模拟器生成机器人动作和物体状态，再让视频模型渲染出画面。研究者可以冻结模拟中的物体，同时保留机械臂动作，以检验视频模型是否真正遵循物体状态。实验发现，三种视频模型都较可靠地跟随机械臂动作，但对模拟物体状态的遵循程度因模型而异；加入物体模拟状态也能减少漏检抓取。通过扰动动作并比较视频与模拟状态，SimPWM 能揭示视频模型何时忽略了模拟状态，尤其是对布料和绳索等物体，刚体模拟并不准确。'}}}, {'id': 'https://huggingface.co/papers/2611.33307', 'title': 'Lost in Translation, Not in Confidence: Benchmarking and Calibrating Multilingual Decision Models', 'url': 'https://huggingface.co/papers/2611.33307', 'abstract': 'Abstract  Decision models are language models fine-tuned to return a probability for each option of a typed query, which routers and guardrails threshold directly. They are built on multilingual bases but ranked almost entirely in English. We evaluate 25 top-ranked open-weight decision models on 17 tasks in 14 languages, comparing each language with English on parallel items. Every model loses accuracy in every language, from about 2 points in high-resource languages to 8 in Tamil, while confidence falls only half as much: a threshold set for 95\\% accuracy in English yields 90% in Tamil. The size of the loss is set by the language and the base model rather than by leaderboard rank. In 81 controlled fine-tuning runs, task skill learned in English transfers to other languages and a few thousand target-language items narrow large losses, but neither more data nor full-parameter tuning closes them. Finally, the same test items are answered more accurately in all 23 benchmark--language pairs we compare when an LLM rather than a person translated them, so LLM-translated test sets understate the gap.', 'score': 0, 'issue_id': 3567, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'ae8623bff0f374ba', 'authors': ['Mingzhe Du', 'Thong Thanh Nguyen', 'Nguyen Tran Cong Duy', 'See-Kiong Ng', 'Luu Anh Tuan'], 'affiliations': ['Nanyang Technological University', 'National University of Singapore', 'VinUniversity'], 'pdf_title_img': 'assets/pdf/title_img/2611.33307.jpg', 'data': {'categories': ['#benchmark', '#multilingual', '#training', '#synthetic', '#low_resource', '#translation', '#transfer_learning'], 'emoji': '🌍', 'ru': {'title': 'Английский тянет, остальные языки отстают: точность decision models падает там, где её не замечают', 'desc': 'Авторы исследуют decision models — языковые модели, дообученные возвращать вероятность для каждого варианта ответа, которые используются роутерами и guardrails как пороговые фильтры. Оценка 25 моделей на 17 задачах в 14 языках показала, что точность падает во всех языках относительно английского: примерно на 2 пункта для языков с большими ресурсами и до 8 для тамильского, при этом уверенность падает вдвое слабее. Дообучение на нескольких тысячах примеров целевого языка частично сокращает разрыв, тогда как увеличение данных и полное дообучение параметров его не устраняют. Кроме того, перевод тестовых наборов с помощью LLM занижает реальный разрыв, поэтому такие наборы нельзя считать надёжной основой для оценки.'}, 'en': {'title': 'English-calibrated models make less reliable decisions in other languages', 'desc': 'The paper evaluates 25 open-weight decision models on 17 tasks across 14 languages, comparing their answers on parallel items. Accuracy drops in every language compared with English, while confidence drops less, so English-based thresholds can make decisions less reliable, especially in Tamil. These gaps depend mainly on the language and the model’s base model, and targeted fine-tuning reduces but does not eliminate them. Tests translated by large language models are easier for the models than tests translated by people, so they can understate the language gap.'}, 'zh': {'title': '跨语言决策不能只看英语成绩', 'desc': '这篇论文评测了 25 个开源决策模型在 14 种语言、17 项任务上的表现，并与英语结果进行对照。所有模型在其他语言中的准确率都下降了，但置信度下降较少，因此按英语表现设定的阈值可能无法在其他语言维持同等可靠性。差距主要取决于语言和基础模型，而不是排行榜名次；英语训练出的任务能力可以迁移到其他语言，少量目标语言数据也能缩小差距，但更多数据或全参数微调仍无法消除差距。研究还发现，模型翻译的测试题比人工翻译的题目更容易答对，这意味着使用模型翻译的基准测试可能低估跨语言性能差距。'}}}, {'id': 'https://huggingface.co/papers/2611.34777', 'title': 'When Every Rollout Fails: Splicing Learner-Conditioned Options into Long-Horizon Agent RL', 'url': 'https://huggingface.co/papers/2611.34777', 'abstract': "Abstract SPLICE improves reinforcement learning on long-horizon agent tasks by constructing local training targets from failed trajectories using a proposal model to select splice points and generate bounded options, outperforming GRPO and full-trajectory guidance baselines.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Group-based reinforcement learning with verifiable rewards often yields all-fail groups on long-horizon agent tasks: every sampled trajectory receives zero reward, leaving group-relative methods without a reward-based policy gradient. A common remedy supplies complete solutions from a stronger model, but full trajectories are expensive and expose the learner to long off-policy histories. We introduce SPLICE, which constructs local training targets from failed current-policy trajectories online. For each all-fail group, a proposal model selects a splice point in a current-policy trajectory and generates several bounded options from that point. We estimate each option's value using repeated current-policy continuations, convert positive estimates into a return-weighted local target, and fit the current policy on the options. We evaluate SPLICE across two policy families on two long-horizon agent tasks, Software Engineering with SWE-bench Verified and Deep Research with BrowseComp-Plus. SPLICE outperforms GRPO and full-trajectory guidance baselines in all four settings, improving over GRPO by 2.8--9.8 percentage points. On initially failed SWE tasks, it raises GRPO's graduation rate by 10.8 percentage points. Further experiments show that SPLICE improves performance while reducing costly proposal-model computation.", 'score': 0, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'ebb3d9263e3d92ef', 'authors': ['Haowen Hou', 'Yicheng Liu', 'Zhen Huang', 'Jiaqi Wang'], 'affiliations': ['JD.com', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2611.34777.jpg', 'data': {'categories': ['#benchmark', '#training', '#optimization', '#rl', '#reasoning', '#agents'], 'emoji': '🧩', 'ru': {'title': 'Чиним провалившиеся траектории локальными сплайсами, а не переписываем всё заново', 'desc': 'Статья представляет метод SPLICE для обучения агентов с подкреплением на длинных задачах, где все траектории в группе получают нулевую награду, из-за чего group-relative методы вроде GRPO не могут использовать policy gradient. SPLICE онлайн выбирает точку сплайсинга в неудачной траектории текущей политики и с помощью proposal model генерирует несколько ограниченных вариантов продолжения. Ценность каждого варианта оценивается повторными rollout-ами текущей политики, после чего строится локальная цель, взвешенная по возврату, и политика дообучается на этих вариантах. Эксперименты на SWE-bench Verified и BrowseComp-Plus показывают превосходство над GRPO и подходами с полными траекториями при меньших вычислительных затратах на proposal model.'}, 'en': {'title': 'Learn from failure, one splice at a time', 'desc': 'SPLICE improves reinforcement learning on long-horizon tasks when all sampled trajectories fail and group-based methods lack reward signals. It uses a proposal model to choose a splice point in a failed trajectory and generate several bounded actions, or options, from there. The method estimates each option’s value by running repeated continuations with the current policy, then trains the policy on options weighted by their estimated returns. Across software engineering and deep research tasks, SPLICE outperforms GRPO and full-trajectory guidance while using less proposal-model computation.'}, 'zh': {'title': '从失败轨迹中拼接局部目标，让强化学习走出全败困境', 'desc': '长时程智能体任务中，一组强化学习采样轨迹可能全部失败，导致基于组内相对奖励的方法无法获得有效的策略梯度。SPLICE 针对这种情况，从当前策略的失败轨迹中选取一个拼接点，并由提议模型生成多个长度受限的候选选项。它通过让当前策略多次续写来估计候选选项的价值，再将正向估值转化为按回报加权的局部训练目标，用于更新当前策略。实验显示，SPLICE 在软件工程和深度研究任务的四种设置中均优于 GRPO 和完整轨迹引导基线，同时减少了提议模型的计算开销。'}}}, {'id': 'https://huggingface.co/papers/2611.34756', 'title': 'Collect for Coverage, Replay with Evidence: Adaptive and Efficient On-Policy Distillation for Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2611.34756', 'abstract': 'Abstract  Fully online on-policy distillation (OPD) is costly for long-horizon agents because each update depends on fresh environment rollouts. Prefix replay offers an efficient alternative by sampling current-student responses from stored histories, reducing idle time for long-tail rollouts and allowing each collected trajectory to support multiple updates. However, our analysis of the complete prefix replay pipeline identifies two limitations in long-horizon settings. In trajectory collection, teacher-only trajectories miss student-induced histories, while broader history coverage can reduce teacher reliability. In trajectory reuse, fixed position-based schedules cannot identify critical decisions that may occur at any trajectory depth. We introduce CARE-OPD (Collect for coverAge, Replay with Evidence) to address both limitations. Student-seeded teacher completions and response-level confidence gating expand history coverage while filtering unreliable updates. Hindsight replay allocation then uses downstream execution evidence to select consequential turns. Across long-horizon tasks Software Engineering and Deep Research, CARE-OPD outperforms online OPD and prior prefix replay baselines. On SWE-bench Verified, it raises task success to 59.5% while reducing end-to-end training time by 45% and environment actions by 44% relative to asynchronous online OPD.', 'score': 0, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '569ab269b719dc28', 'authors': ['Haowen Hou', 'Gen Li', 'Ruilin Li', 'Yicheng Liu', 'Zhen Huang', 'Shuai Dong', 'Congcong Wang', 'Kaiwen Tuo', 'Hongrui Wu', 'Zelin Peng', 'Kanghui Tian', 'Ji Zhao', 'Dianyi Wang', 'Jiaqi Wang'], 'affiliations': ['JD.com', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2611.34756.jpg', 'data': {'categories': ['#benchmark', '#training', '#plp', '#optimization', '#rl', '#agents'], 'emoji': '🧭', 'ru': {'title': 'Учиться на сохранённом опыте: дешевле, быстрее и точнее дистилляции агентов', 'desc': 'Статья предлагает CARE-OPD — улучшенный метод on-policy distillation для долгосрочных LLM-агентов, основанный на повторном использовании префиксов траекторий (prefix replay). Авторы выявляют два ограничения: учитель не покрывает историй, порождаемых самой student-моделью, а фиксированные расписания реплея не находят критические решения на произвольной глубине траектории. Метод использует student-seeded completions с гейтингом по уверенности на уровне ответов и hindsight replay, который выбирает значимые ходы по данным последующего выполнения. На задачах Software Engineering и Deep Research CARE-OPD превосходит онлайн-OPD и prior baselines, достигая 59.5% успеха на SWE-bench Verified при сокращении времени обучения на 45% и числа действий в среде на 44%.'}, 'en': {'title': 'Learn from broader histories; replay the decisions that matter', 'desc': 'The paper presents CARE-OPD, a method for making online on-policy distillation more efficient on tasks that require many steps. It collects teacher responses to histories created by the student, then uses confidence gating to filter unreliable training examples. During replay, it uses evidence from later execution to prioritize turns that had an important effect, rather than relying on fixed positions in a trajectory. On software engineering and deep research tasks, CARE-OPD performs better than prior methods; on SWE-bench Verified, it reaches 59.5% success while cutting training time by 45% and environment actions by 44% compared with asynchronous online OPD.'}, 'zh': {'title': '让历史覆盖更广，让关键经验回放更准', 'desc': '这篇论文研究长程智能体的在线策略蒸馏（OPD），指出每次更新都依赖新的环境轨迹，训练成本较高。前缀回放能重复利用已收集的历史，但教师轨迹可能缺少学生会遇到的情境，而固定的回放计划也难以找出真正关键的决策。作者提出 CARE-OPD：用学生生成的历史引导教师补全，并通过回答级置信度筛选不可靠的蒸馏更新；再依据后续执行结果分配回放机会。实验显示，该方法在软件工程和深度研究任务上优于现有基线；在 SWE-bench Verified 上，任务成功率达到 59.5%，相较异步在线 OPD，训练时间减少 45%，环境交互次数减少 44%。'}}}, {'id': 'https://huggingface.co/papers/2611.34939', 'title': 'A Mesh for Every Moment', 'url': 'https://huggingface.co/papers/2611.34939', 'abstract': "Abstract  We present MEMO (a Mesh for Every MOment), a method that reconstructs the geometry of complete dynamic scenes, captured by multiple synchronized cameras, and extracts a mesh at every frame. Existing dynamic Gaussian splatting methods either model appearance alone or target isolated objects segmented by foreground masks, and all of them recover meshes by TSDF fusion or Poisson reconstruction, whose fixed grids limit the detail they can capture. At the core of MEMO is a per-Gaussian motion model inspired by Gaussian processes, which represents each Gaussian's position and rotation over time as a combination of temporal Gaussian kernels. The model keeps every Gaussian a valid surface element throughout the sequence and carries an implicit representation of the dynamic geometry, so a mesh can be derived at any time from a field defined by the Gaussians. Although common in real captures, large and fast motion poses a challenge that dynamic Gaussian splatting methods usually overlook. To account for it, we design a track-based initialization scheme that fits each Gaussian's initial trajectory to point tracks in closed form. We evaluate MEMO on Blender-Moments, a new benchmark of nine animated scenes with ground-truth meshes at every frame, and on two real-world datasets. MEMO reconstructs the most accurate geometry among state-of-the-art methods, and remains competitive in novel-view synthesis and training time. Project page: https://memo-4d.github.io", 'score': 0, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '3f4e6a5ba8eb6d4d', 'authors': ['Roy Or-El', 'Jeong Joon Park', 'Ira Kemelmacher-Shlizerman'], 'affiliations': ['University of Michigan', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2611.34939.jpg', 'data': {'categories': ['#benchmark', '#cv', '#dataset', '#3d', '#video'], 'emoji': '🎬', 'ru': {'title': 'Меш для каждого момента: точная геометрия динамических сцен в любой кадр', 'desc': 'MEMO — это метод реконструкции геометрии динамических сцен, снятых несколькими синхронизированными камерами, который извлекает меш на каждом кадре. Ключевая идея: каждый Gaussian splatting-элемент моделирует своё положение и вращение во времени как комбинацию временных гауссовых ядер, вдохновлённых Gaussian processes, что делает неявное представление геометрии и позволяет получать меш в любой момент. Для обработки больших и быстрых движений предложена инициализация на основе треков, которая аналитически подгоняет начальную траекторию каждого Gaussian под точечные треки. На новом бенчмарке Blender-Moments и двух реальных датасетах MEMO показывает наиболее точную геометрию среди современных методов, сохраняя конкурентоспособность в синтезе новых видов и времени обучения.'}, 'en': {'title': 'A Mesh for Every Moment in a Moving Scene', 'desc': 'MEMO reconstructs the geometry of dynamic scenes from synchronized multi-camera videos and produces a mesh for every frame. It models each Gaussian’s position and rotation over time using temporal Gaussian kernels, keeping the Gaussians as valid surface elements and enabling meshes to be extracted from an implicit geometry field. To handle large, fast movements, MEMO initializes Gaussian trajectories by fitting them to tracked points in closed form. Tests on animated and real-world scenes show that it achieves more accurate geometry than existing methods while remaining competitive in novel-view synthesis and training time.'}, 'zh': {'title': '让每一刻的动态场景，都拥有细致网格', 'desc': 'MEMO 是一种从多台同步相机的视频中重建完整动态场景的方法，并能为每一帧生成网格。它为每个高斯点建立基于高斯过程的运动模型，用时间高斯核表示其位置和旋转变化，使高斯点在整个序列中都能作为有效的表面元素。针对大幅度、快速运动，MEMO 还通过点轨迹设计闭式初始化方案，并从高斯表示的动态几何场中提取任意时刻的网格。实验表明，MEMO 在合成基准和真实数据集上取得了最准确的几何重建效果，同时在新视角合成质量和训练时间方面也具有竞争力。'}}}, {'id': 'https://huggingface.co/papers/2611.34750', 'title': 'SOLVE: Sparse, Ordered Keyposes Make LLM Agents Versatile and Efficient Robot Manipulator', 'url': 'https://huggingface.co/papers/2611.34750', 'abstract': 'Abstract  LLM agents have made remarkable progress in robot manipulation, yet they suffer from expensive inference, dense step-by-step control, and tool bottlenecks. We introduce SOLVE, a training-free, versatile and efficient agent policy: a multimodal LLM agent writes a sparse, ordered sequence of 6-DoF end-effector keyposes per call, observes the result, and writes the next, while a motion planner interpolates between them. The agent decides the number and spacing of keyposes for both fast long-range motion and fine-grained manipulation. This granularity matches the sparsity of teleoperated manipulation: most demonstrations in DROID can be compressed into a few keyposes instead of dense actions. SOLVE grounds keyposes with sparse depth queries answered by noisy sources, such as multi-view triangulation, stereo, or monocular depth, and copes with that noise itself. It also improves from execution feedback, reflecting on its own rollouts and distilling a few rules per task. SOLVE reaches state-of-the-art performance of 74.5% on RoboDojo and 84.5% on RoboLab, with only $1.7 per episode on average, 12x less than previous dense-control agent policies. On a real robot, the same agent achieves an 88% success rate (75 of 85 episodes) over 16 challenging zero-shot tasks. Our project page is at https://serenos.github.io/solve-website.', 'score': 0, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '4c8dc273dfedd073', 'authors': ['Xiang Li', 'Hongyu Zhou', 'Ya-Li Li', 'Tao Li', 'Rui Zhang', 'Junjie Lai', 'Weihua Zhang', 'Shengjin Wang'], 'affiliations': ['Department of Electronic Engineering, Tsinghua University', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2611.34750.jpg', 'data': {'categories': ['#benchmark', '#robotics', '#multimodal', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Меньше шагов, больше смысла: робот думает ключевыми точками', 'desc': 'Статья представляет SOLVE — training-free агентную политику для роботизированной манипуляции, в которой мультимодальный LLM-агент пишет разреженную последовательность 6-DoF ключевых поз захвата (keyposes), а motion planner интерполирует траекторию между ними. Агент сам определяет количество и расположение ключевых поз, что соответствует разреженной природе телеуправляемых демонстраций из датасета DROID. Глубина для привязки поз получается из зашумлённых источников (мультиракурсная триангуляция, стерео или монокулярная оценка глубины), а агент учится на обратной связи выполнения, дистиллируя правила для каждой задачи. Метод достигает state-of-the-art результатов на RoboDojo и RoboLab при стоимости около $1.7 за эпизод, что в 12 раз дешевле предыдущих агентов с плотным управлением.'}, 'en': {'title': 'Sparse Keyposes, Smarter Robot Control', 'desc': 'SOLVE is a training-free robot policy in which a multimodal large language model (LLM) plans a sparse, ordered sequence of 6-DoF end-effector keyposes. A motion planner interpolates between these keyposes, letting the agent use larger steps for long movements and finer steps for precise manipulation. The agent grounds its plans with sparse depth estimates, handles noisy measurements, and improves using feedback from its own executions. SOLVE achieves strong benchmark and real-robot success rates while reducing inference costs compared with dense-control agent policies.'}, 'zh': {'title': '用稀疏关键位姿，让机器人操作更高效', 'desc': '这篇论文提出了 SOLVE，一种无需训练、面向机器人操作的多模态大语言模型智能体策略。它每次生成一组稀疏且有序的末端执行器六自由度关键位姿，再根据执行结果继续规划；运动规划器则在关键位姿之间插补动作。智能体可自行调整关键位姿的数量和间距，并利用稀疏深度信息定位目标、应对深度估计噪声，还能从执行反馈中总结改进规则。在 RoboDojo 和 RoboLab 上，SOLVE 分别达到 74.5% 和 84.5% 的成功率，推理成本比先前的密集控制策略低 12 倍，并在真实机器人上的 16 项零样本任务中取得 88% 的成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.34064', 'title': 'SPARC: Geometry-Guided Attention Pruning for Long-Horizon Camera-Controlled Video Generation', 'url': 'https://huggingface.co/papers/2611.34064', 'abstract': 'Abstract SPARC uses geometry-guided pruning of self-attention in pretrained video diffusion transformers to unify camera control and persistent scene memory, improving camera adherence and revisit consistency while greatly reducing computation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash We present SPARC, a geometry-guided attention pruning framework that turns the native self-attention of pretrained video diffusion transformers into a unified mechanism for camera control and persistent scene memory. Our key insight is that attention connectivity can simultaneously serve as geometric conditioning for camera control and spatial addressing for historical memory retrieval. Motivated by the asymmetric contextual requirements of reconstructing observed content and synthesizing novel regions, SPARC restricts observed tokens to geometrically corresponding historical tokens and local spatiotemporal context, while preserving dense attention for unobserved regions. Correspondence-aware attention biasing and order-invariant historical positioning further enable stable retrieval across long temporal gaps. Without introducing additional learnable control or memory modules, SPARC achieves precise camera adherence and faithful scene revisitation while substantially reducing attention computation. Extensive experiments demonstrate the effectiveness of aggressive attention pruning in improving camera adherence, revisit consistency, and visual fidelity, with an inference speedup of over 50x when combined with four-step distillation. Project page is available at https://zju3dv.github.io/SPARC.', 'score': 0, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '66af2b4859125087', 'authors': ['Zesong Yang', 'Weikai Chen', 'Liyuan Cui', 'Yuan Li', 'Jiaxin Huang', 'Lutao Jiang', 'Runze Zhang', 'Yingda Yin', 'Xiaoyang Huang', 'Kai Yan', 'Keyang Luo', 'Xin Wang', 'Hujun Bao', 'Zhaopeng Cui'], 'affiliations': ['HKUST(GZ)', 'LIGHTSPEED', 'State Key Laboratory of CAD&CG, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.34064.jpg', 'data': {'categories': ['#architecture', '#optimization', '#video', '#inference', '#3d', '#long_context', '#diffusion'], 'emoji': '🎥', 'ru': {'title': 'Внимание, которое помнит сцену и знает, куда смотрит камера', 'desc': 'Авторы представляют SPARC — метод, который через геометрически управляемое прореживание (pruning) механизма self-attention в предобученных video diffusion transformers объединяет управление камерой и долговременную память сцены. Ключевая идея: связность внимания одновременно служит геометрическим условием для камеры и пространственной адресацией для поиска исторических токенов. Наблюдаемые области опираются только на соответствующие исторические токены и локальный spatiotemporal-контекст, а незнакомые области сохраняют полное attention. Метод не добавляет обучаемых модулей и даёт точное следование траектории камеры, согласованность при возвращении к сцене и ускорение инференса более чем в 50 раз вместе с four-step distillation.'}, 'en': {'title': 'Prune Attention, Preserve the Scene', 'desc': 'SPARC is a method for controlling camera motion and remembering scenes in pretrained video diffusion transformers. It prunes self-attention using geometric cues, connecting observed video regions to matching regions in earlier frames while keeping dense attention for newly generated areas. Attention biases and order-invariant positioning help the model retrieve relevant scene details even after long gaps. Experiments show stronger camera control and scene consistency, with over 50× faster inference when combined with four-step distillation.'}, 'zh': {'title': '让注意力连接兼顾镜头控制与场景记忆', 'desc': 'SPARC提出一种利用几何信息裁剪注意力的方法，让预训练的视频扩散Transformer同时支持镜头控制和长期场景记忆。它的核心思路是让注意力连接既表示镜头运动所需的几何关系，也帮助模型从历史帧中定位相关内容。对于已经观测过的区域，模型只关注几何上对应的历史内容和局部时空信息；对于未观测区域，则保留密集注意力，以便生成新内容。实验表明，SPARC能提升镜头控制精度、场景重访一致性和画面质量，并在结合四步蒸馏时将推理速度提升超过50倍。'}}}, {'id': 'https://huggingface.co/papers/2611.17287', 'title': 'Negative-Only Policy Optimization for One-Sided Verifiable Rewards', 'url': 'https://huggingface.co/papers/2611.17287', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) typically relies on a verifier that can reliably judge whether sampled solutions are correct. However, in many realistic settings, complete verification is generally unavailable, while cheap checks can only falsify failures. We formalize this regime as one-sided verifiability (OSV): verified negatives are reliable counterexamples, but verified positives are merely non-falsified candidates and may contain many false positives. This asymmetry makes standard RLVR unreliable, because reinforcing verified positives can directly reward shortcuts that pass partial checks. To address this issue, we propose Negative-Only Policy Optimization (NOPO), which treats verified positives as unlabeled and updates the policy only by suppressing trusted verified negatives. Specifically, NOPO combines a reference-relative negative suppression loss with a group-level adapter that scales each update by the proportion of non-falsified responses. Across unit-test, constraint-check, and LLM self-verifiers, NOPO improves pass@k over baselines on code, logic, and math benchmarks when oracle rewards are unavailable. These gains persist under inference-time scaling and cross-benchmark transfer.', 'score': 0, 'issue_id': 3567, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'bb29ace8bd0adc60', 'authors': ['Jiacheng Xu', 'Shuo He', 'Fuxiang Zhang', 'Chaojie Wang', 'Bo An'], 'affiliations': ['Nanyang Technological University, Singapore', 'Skywork AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.17287.jpg', 'data': {'categories': ['#training', '#plp', '#optimization', '#rl', '#reasoning', '#math'], 'emoji': '🧭', 'ru': {'title': 'Учимся на ошибках: подавлять негативы надёжнее, чем поощрять возможные успехи', 'desc': 'Статья посвящена обучению с подкреплением на верифицируемых наградах (RLVR), где полная проверка правильности ответов недоступна, а дешёвые проверки способны только опровергнуть решение. Авторы формализуют эту ситуацию как односторонюю верифицируемость (OSV), при которой подтверждённые негативные примеры надёжны, а позитивные могут содержать много ложноположительных. Предложенный метод NOPO рассматривает позитивные ответы как неразмеченные и обновляет policy только через подавление доверенных негативов, используя loss с опорой на reference-модель и групповой adapter, масштабирующий обновление долей неопровергнутых ответов. Эксперименты на задачах кода, логики и математики показывают улучшение pass@k при отсутствии oracle-наград, сохраняющееся при inference-time scaling и переносе между бенчмарками.'}, 'en': {'title': 'Learn from What Fails, Not What Only Seems Right', 'desc': 'The paper studies one-sided verifiability, where checks can reliably identify wrong answers but cannot confirm that unchecked answers are correct. Standard reinforcement learning with verifiable rewards can fail in this setting by rewarding false positives that pass partial checks. The authors propose Negative-Only Policy Optimization (NOPO), which treats unchecked answers as unlabeled and updates the policy only to suppress reliably identified failures. Tests on code, logic, and math benchmarks show that NOPO improves pass@k and transfers across tasks without requiring oracle rewards.'}, 'zh': {'title': '只惩罚可信错误，不盲目奖励未被判错的答案', 'desc': '这篇论文研究单侧可验证（OSV）的强化学习场景：验证器能可靠地判定错误答案，却无法确认未被判错的答案一定正确。直接把这些未被判错的答案当作正例进行强化，可能会奖励利用检查漏洞的捷径。作者提出仅负例策略优化（NOPO），将未被判错的答案视为未标注数据，只通过抑制可信的错误答案来更新策略，并根据未被判错答案的比例调整更新幅度。在代码、逻辑和数学任务中，NOPO 在无法获得真实奖励时提升了 pass@k，且在推理时扩展和跨基准迁移中仍保持效果。'}}}];

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-26 10:15',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-26 10:15')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-26 10:15')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
