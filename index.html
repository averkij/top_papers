    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.05571', 'title': 'Grounded Skill Synthesis from Code at Scale for Agentic Intelligence', 'url': 'https://huggingface.co/papers/2609.05571', 'abstract': 'Abstract Code2Skill automatically extracts verifiable procedural skills from source code to improve agent performance before interaction experience accumulates.  Generated by thinkingmachines/Inkling-Small Reusable skills give agents transferable procedural knowledge, making scalable acquisition essential for extending agents beyond prior experience. Existing methods face two limitations: trajectory-based synthesis requires interactions with specific environments, while document-derived skills may lack executable evidence and verification. Source code offers a complementary path: it requires no prior agent experience yet provides executable evidence for grounding abstractions. We present Code2Skill, a fully automated pipeline that transforms selected code units into implementation-anchored records of atomic operations, composite workflows, and recurring patterns, then verifies each record through source-body-blind reconstruction and source-aware comparison. Applied to 19,769 popular, actively maintained GitHub repositories, Code2Skill produces CodeSkillBank, a grounded bank of 1,006,822 accepted records with workflow, boundary, provenance, and source-evidence metadata. Across 72 protocol-matched evaluations covering nine model settings and eight benchmarks, models augmented with retrieved CodeSkillBank skills improve by 11.7% on average over matched baselines and outperform them in 57 cases. Under a unified downstream interface, Code2Skill also outperforms trajectory-derived skill banks on all seven shared benchmarks, showing that repository-derived skills can provide useful procedural knowledge before agents accumulate sufficient interaction experience. Skills synthesized from tested AI-generated code achieve a 93.50% pass rate, compared with 93.00% for human-written code, providing initial evidence that the pipeline can expand with the growing volume of AI-generated software. Overall, Code2Skill transforms procedural knowledge embedded in repositories into grounded, verifiable, and transferable agent skills.', 'score': 2, 'issue_id': 3308, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '6f3547451365584a', 'authors': ['Yongqi Tong', 'Pan Wang', 'Hang Wang', 'Jianshe Li', 'Xin Zhang', 'Jiang-Ming Yang', 'Wei Wu'], 'affiliations': ['Ant International'], 'pdf_title_img': 'assets/pdf/title_img/2609.05571.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#agents'], 'emoji': '💾', 'ru': {'title': 'Извлечение переиспользуемых навыков из кода для трансфера знаний AI агентам', 'desc': 'Code2Skill — это автоматизированная система, которая извлекает процедурные навыки из исходного кода для улучшения производительности AI агентов без необходимости предварительного взаимодействия с окружением. Метод преобразует единицы кода в проверяемые записи об атомарных операциях, композитных workflow и повторяющихся паттернах, используя верификацию через слепую реконструкцию и сравнение с исходным кодом. На основе анализа 19 769 популярных GitHub репозиториев была создана CodeSkillBank — база из более чем миллиона верифицированных записей навыков с метаданными о workflow, граница применения и источниках. Экспериментальные результаты показывают, что модели, дополненные навыками из CodeSkillBank, достигают в среднем 11.7% улучшения производительности и превосходят базовые модели в 57 из 72 тестовых сценариев.'}, 'en': {'title': 'Unlocking Agent Potential with Code2Skill', 'desc': 'Code2Skill is a machine learning framework that extracts actionable skills from source code to enhance the performance of agents before they gain experience through interaction. It addresses limitations of existing methods by using source code, which provides executable evidence for skills without requiring prior agent experience. The framework generates a comprehensive database called CodeSkillBank, containing over a million verified procedural skills from popular GitHub repositories. By integrating these skills, agents show significant performance improvements in various benchmarks, demonstrating the effectiveness of repository-derived knowledge in training AI systems.'}, 'zh': {'title': '从代码中提取可转移的智能体技能', 'desc': 'Code2Skill 是一个自动化工具，可以从源代码中提取可验证的程序技能，以提高智能体在积累交互经验之前的表现。它通过将选定的代码单元转化为基于实现的原子操作记录和复合工作流，提供可转移的程序知识。与现有方法相比，Code2Skill 不需要特定环境的交互，且提供可执行的证据来验证技能。通过对 19,769 个 GitHub 仓库的应用，Code2Skill 生成了一个包含 1,006,822 条记录的技能库，显著提升了模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.21749', 'title': 'GraphSkillEvo: Evolutionary Optimization of Graph-Structured Agent Skills', 'url': 'https://huggingface.co/papers/2609.21749', 'abstract': 'Abstract  Skills can improve the performance of Large Language Model (LLM) agents by providing task-specific procedural guidance, while skill optimization further improves their effectiveness through iterative refinement. However, existing skill optimization methods typically represent skills as unstructured natural-language instructions, creating two key challenges: 1) Unstructured skills often lack explicit workflow-level guidance and contain substantial redundancy, making them difficult for LLMs to execute; 2) the vast search space of unconstrained natural-language skills makes skill optimization ineffective. To address these challenges, we propose representing skills as graph-structured natural-language artifacts. In graph-structured skills, each node represents an execution step together with its operational guidance, while directed edges encode context-dependent transitions between steps. Compared to unstructured skills, graph-structured skills can provide clear workflow-level guidance. Moreover, the proposed graph-structured skill can also facilitate skill optimization. Building on this structured representation, we introduce GraphSkillEvo, a population-based evolutionary optimization framework with mutation and crossover operators for graph-structured skills. By maintaining multiple candidate skills and combining effective components, GraphSkillEvo enables broader and more comprehensive exploration of the structured skill space than purely LLM-based iterative self-refinement. Extensive experiments across five agent benchmarks demonstrate that GraphSkillEvo consistently outperforms the strong skill optimization baseline SkillOpt, improving average accuracy by 4.01% on GPT-5.4-nano and 1.76% on GPT-5.4. Our code is available at https://github.com/ruisun7/GraphSkillEvo.', 'score': 1, 'issue_id': 3308, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': '65d06aabbc10f947', 'authors': ['Rui Sun', 'Zhi Zheng', 'Zhenkun Wang', 'Zhichao Lu'], 'affiliations': ['City University of Hong Kong', 'National University of Singapore', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.21749.jpg', 'data': {'categories': ['#open_source', '#optimization', '#graphs'], 'emoji': '🧬', 'ru': {'title': 'Эволюционная оптимизация графических навыков для агентов LLM', 'desc': 'В статье предложен новый подход к представлению навыков для агентов на основе больших языковых моделей в виде графических структур вместо неструктурированного естественного языка. Граф-структурированные навыки содержат узлы с шагами выполнения и рёбра для кодирования контекстно-зависимых переходов между ними, что обеспечивает лучшее руководство для выполнения задач. На основе этого представления авторы разработали GraphSkillEvo — фреймворк эволюционной оптимизации с популяционными алгоритмами, использующий операторы мутации и кроссовера для улучшения навыков. Экспериментальные результаты на пяти бенчмарках показывают устойчивое превосходство GraphSkillEvo над базовым методом, улучшая точность на 4.01% и 1.76% в зависимости от модели.'}, 'en': {'title': 'Graph-Structured Skills: Enhancing LLM Performance through Structured Guidance', 'desc': 'This paper introduces a new way to improve Large Language Model (LLM) agents by using graph-structured skills instead of traditional unstructured natural-language instructions. By representing skills as graphs, where each node is a step with guidance and edges show how to move between steps, the authors provide clearer workflow guidance for LLMs. They also present GraphSkillEvo, an evolutionary optimization framework that enhances skill optimization by exploring a wider range of structured skills through mutation and crossover techniques. Experimental results show that this approach significantly improves the performance of LLMs compared to existing methods, demonstrating its effectiveness in skill optimization.'}, 'zh': {'title': '图结构技能优化：提升LLM性能的新方法', 'desc': '本论文提出了一种新的技能表示方法，通过图结构的自然语言来优化大型语言模型（LLM）代理的技能。每个节点代表一个执行步骤及其操作指导，而有向边则编码步骤之间的上下文依赖关系。这种图结构的技能提供了清晰的工作流程指导，并且有助于技能的优化。我们还引入了GraphSkillEvo，一个基于种群的进化优化框架，能够在结构化技能空间中进行更广泛的探索，实验结果表明其在多个基准测试中优于传统的技能优化方法。'}}}, {'id': 'https://huggingface.co/papers/2609.22000', 'title': 'RecreationWorld: Scalable and Verifiable Environments for Hybrid Computer-Use Agents', 'url': 'https://huggingface.co/papers/2609.22000', 'abstract': 'Abstract  Computer-use agents (CUAs) have advanced along two separate lines: graphical interaction and software development through code and the command line. Real digital work requires both, interleaved rather than stacked end to end. We study hybrid CUAs that autonomously decide when to explore an interface, implement software, and run and visually verify their artifacts. We introduce RecreationWorld, a five-platform framework built around recreation: given a running reference, an agent must discover its behavior and build a faithful implementation with no prescribed workflow. RecreationWorld provides reproducible environments on Ubuntu, macOS, Windows, Android, and Web, plus a unified harness with native GUI control and coding tools. The running reference serves as an oracle for hidden behavioral tests, providing execution-grounded rewards. We scale trajectory generation with high-quality open-source applications. Models trained on these trajectories improve across five out-of-distribution coding and hybrid computer-use benchmarks and more frequently verify their rendered outputs, providing evidence of transfer beyond recreation. For held-out evaluation, we introduce RecreationBench, comprising 250 diverse tasks across domains and platforms. Reference-grounded programmatic and visual assertions cover action-conditioned outcomes at multiple interaction depths; each is validated on the reference and by human reviewers before the suite is frozen for automatic scoring. GPT-6 Astra leads at 58.1% overall, but passes all programmatic tests on just 2.8% of tasks. Agents reproduce static interface structure more reliably than interactions and computed outputs, while generated applications remain smaller and more monolithic than their references. We release the benchmark, environments, and test suites.', 'score': 1, 'issue_id': 3308, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': 'fd3e2482dc316ba1', 'authors': ['Shuai Bai', 'Jiayong Deng', 'Yikun Fu', 'Chang Gao', 'Xuhao Hu', 'Mianqiu Huang', 'Yizhen Jiang', 'Yuheng Jing', 'Dehui Kong', 'Keliang Li', 'Ning Li', 'Wanli Li', 'Dayiheng Liu', 'Dunjie Lu', 'Changwei Luo', 'Que Shen', 'Zheyuan Wang', 'Zijian Wang', 'Jie Wu', 'Gao Wu', 'Zhihui Xie', 'Rui Xie', 'Haiyang Xu', 'An Yang', 'Jiakang Yuan', 'Yanming Zhang', 'Jiajun Zhang', 'Xi Zhang', 'Zhenru Zhang', 'Zhuo Zhen', 'Mingkang Zhu', 'Bowen Zhou'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2609.22000.jpg', 'data': {'categories': ['#games', '#benchmark', '#multimodal', '#cv', '#dataset', '#open_source', '#optimization', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Гибридные агенты, которые одновременно кодят и управляют интерфейсом', 'desc': 'В работе представлены гибридные агенты для компьютерного взаимодействия, которые могут одновременно работать с графическими интерфейсами и писать код. Авторы создали RecreationWorld — фреймворк с пятью платформами, где агент должен понять поведение запущенной программы и создать её функциональную копию без предписанного сценария. Модели обучаются на траекториях взаимодействия с реальными открытыми приложениями и демонстрируют улучшения на бенчмарках гибридного компьютерного взаимодействия. Для оценки представлен RecreationBench с 250 разнообразными задачами, включающими программные и визуальные проверки корректности на нескольких уровнях взаимодействия.'}, 'en': {'title': 'Empowering Agents with Hybrid Learning in RecreationWorld', 'desc': 'This paper presents a study on hybrid computer-use agents (CUAs) that can autonomously navigate both graphical interfaces and software development tasks. The authors introduce RecreationWorld, a versatile framework that allows agents to learn from a running reference by discovering behaviors and creating implementations without a fixed workflow. The framework supports multiple platforms and provides a unified environment for testing and validating agent performance through execution-grounded rewards. The results show that models trained in this setting can effectively transfer their learning to various coding and interaction tasks, demonstrating improved performance across diverse benchmarks.'}, 'zh': {'title': '混合计算机使用代理的创新研究', 'desc': '本文研究了混合计算机使用代理（CUAs），这些代理能够自主决定何时探索界面、实现软件并运行和验证其产物。我们引入了RecreationWorld，这是一个基于娱乐的五平台框架，允许代理在没有预设工作流程的情况下发现行为并构建忠实实现。通过高质量的开源应用程序，我们扩展了轨迹生成，并在五个不同的编码和混合计算机使用基准上提高了模型的表现。我们还推出了RecreationBench，包含250个多样化任务，提供了基于参考的程序性和视觉断言，以便进行自动评分。'}}}, {'id': 'https://huggingface.co/papers/2609.22069', 'title': 'OmniVBench: A Benchmark and Large-Scale Dataset for Omni Reference-to-Video Generation', 'url': 'https://huggingface.co/papers/2609.22069', 'abstract': 'Abstract  Reference-to-video (R2V) generation is evolving toward increasingly general and versatile reference control, giving rise to the emerging paradigm of omni R2V generation. However, existing benchmarks fall short of these emerging capabilities: their test cases cover limited reference types and compositions, and their evaluation protocols largely assess holistic reference consistency, overlooking whether reference factors are properly preserved, disentangled, and routed. Meanwhile, the high cost of constructing omni R2V training data makes suitable training resources scarce. To address these gaps, we introduce OmniVBench and the Omni-R2V Dataset for evaluating and training omni R2V models. OmniVBench expands R2V evaluation across broader reference types, fine-grained control tasks, and richer reference compositions, covering 7 task families and 18 fine-grained tasks spanning content, motion, style, structure, narrative, and multi-reference settings. We introduce factor-grounded evaluation with 12,172 case-specific checklist items, assessing whether intended reference factors are faithfully preserved, correctly disentangled and bound to their targets, and properly realized according to the instruction. We further introduce the Omni-R2V Dataset, bringing industrial-grade training resources for diverse R2V tasks to the broader research community. Drawing primarily on a large-scale corpus of professional video footage, it comprises 340K processed training samples spanning diverse reference types and multi-reference compositions. We develop task-specific pipelines for reference-target pair construction, offering a practical and scalable recipe for omni R2V data construction. Extensive evaluation of advanced open- and closed-source R2V models reveals clear performance gaps across task families and evaluation dimensions on OmniVBench, highlighting remaining limitations of current R2V models.', 'score': 1, 'issue_id': 3308, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': '5be9996ae32e5078', 'authors': ['Wenxue Li', 'Peiyan Guan', 'Haoyang Jiang', 'Junxian Cai', 'Hualuo Liu', 'Chunjie Zhang', 'Chong Guan', 'Songlian Li', 'Taiyi Wu', 'Yongjian Yu', 'Xiaotong Zhao', 'Alan Zhao', 'Eric Liu', 'Xi Chen', 'Yu Liu', 'Lei Zhu'], 'affiliations': ['Online Video BU, Tencent', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2609.22069.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#synthetic', '#video', '#dataset', '#diffusion', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Комплексная система для контролируемой генерации видео по многообразным референсам', 'desc': 'Статья представляет OmniVBench и Omni-R2V Dataset для оценки и обучения моделей генерации видео по референсам (Reference-to-Video). Авторы разработали комплексный бенчмарк, охватывающий 7 семейств задач и 18 детализированных подзадач, включая контроль контента, движения, стиля и структуры. Введена факторная оценка с более чем 12 тысячами контрольных списков для проверки правильности сохранения и разделения референсных факторов. Создан индустриальный датасет из 340 тысяч обучающих примеров с разными типами референсов и композициями для масштабируемого обучения моделей.'}, 'en': {'title': 'Empowering R2V Models with OmniVBench and Omni-R2V Dataset', 'desc': 'This paper introduces a new framework for evaluating and training reference-to-video (R2V) models called OmniVBench and the Omni-R2V Dataset. It addresses the limitations of existing benchmarks by expanding the types of references and tasks evaluated, ensuring that models can handle a variety of content, motion, style, and narrative elements. The authors propose a factor-grounded evaluation method to assess how well models preserve and disentangle reference factors in their outputs. Additionally, the Omni-R2V Dataset provides a large-scale collection of training samples, facilitating the development of more robust R2V models.'}, 'zh': {'title': '推动参考视频生成的全面评估与训练', 'desc': '本文介绍了一种新的参考视频生成（R2V）评估和训练框架，称为OmniVBench和Omni-R2V数据集。现有的R2V基准测试无法满足日益增长的多样化参考控制需求，缺乏对参考因素的细致评估。OmniVBench扩展了评估范围，涵盖了多种参考类型和细粒度控制任务，并引入了基于因素的评估方法。Omni-R2V数据集则提供了丰富的训练资源，支持多样化的R2V任务，推动了该领域的研究进展。'}}}, {'id': 'https://huggingface.co/papers/2609.22083', 'title': 'MintAct: A Unified Visual Agent for Digital Environments', 'url': 'https://huggingface.co/papers/2609.22083', 'abstract': 'Abstract  We present MintAct, a family of vision-language models that unifies UI grounding, multi-step navigation across mobile, desktop, and web, and visual tool use, trained at 2B, 4B, and 8B scales. Through careful design of our environments, data, and training recipes, MintAct models match the performance of per-domain specialists across all of these capabilities. To enable this, we develop a scalable environment and reinforcement learning (RL) infrastructure. On the environment side, we host hundreds of concurrent instances across heterogeneous per-domain backends, serving both trajectory data collection and online RL. To enable efficient and scalable RL training, an asynchronous framework keeps explicit control over the cross-domain training distribution and remains stable under noisy environment feedback and off-policy drift. Experimental results show that MintAct achieves state-of-the-art performance (48.9 on OSWorld-Verified) across a wide range of benchmarks at comparable model sizes.', 'score': 1, 'issue_id': 3308, 'pub_date': '2026-09-18', 'pub_date_card': {'ru': '18 сентября', 'en': 'September 18', 'zh': '9月18日'}, 'hash': '0a9e3a40fd79a0e1', 'pdf_title_img': 'assets/pdf/title_img/2609.22083.jpg', 'data': {'categories': ['#training', '#benchmark', '#multimodal', '#small_models', '#rl', '#cv', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Универсальный агент для взаимодействия с цифровыми интерфейсами через обучение с подкреплением', 'desc': 'В работе представлена MintAct — семейство vision-language моделей, объединяющих грундирование UI, навигацию по мобильным и веб-приложениям, а также использование визуальных инструментов в единой системе. Модели обучены методом обучения с подкреплением на масштабируемой инфраструктуре, которая управляет сотнями одновременных сессий приложений и собирает данные траекторий в реальном времени. Разработанный асинхронный фреймворк обеспечивает стабильное обучение при наличии шума в обратной связи окружения и проблем смещения вне политики. Модель достигает наилучших результатов на бенчмарках, включая OSWorld-Verified (48.9 балла), конкурируя со специализированными системами для отдельных доменов.'}, 'en': {'title': 'MintAct: Unifying Vision-Language Tasks with Scalable Reinforcement Learning', 'desc': 'MintAct is a set of advanced vision-language models designed to handle various tasks like UI grounding and multi-step navigation on different platforms. It achieves high performance by integrating specialized training environments and reinforcement learning techniques. The models are trained at different scales (2B, 4B, and 8B parameters) and are capable of competing with domain-specific models in multiple tasks. The innovative asynchronous framework allows for efficient training while managing the complexities of cross-domain data and feedback.'}, 'zh': {'title': 'MintAct：统一多领域的视觉-语言模型', 'desc': 'MintAct是一种视觉-语言模型家族，能够统一用户界面定位、多步导航以及视觉工具使用，支持移动、桌面和网页等多种平台。通过精心设计的环境、数据和训练方案，MintAct模型在这些能力上与各领域的专业模型表现相当。为了实现这一目标，我们开发了可扩展的环境和强化学习基础设施，能够同时处理多个领域的任务。实验结果表明，MintAct在多个基准测试中达到了最先进的性能，展示了其在不同模型规模下的优越性。'}}}, {'id': 'https://huggingface.co/papers/2609.20942', 'title': 'When AI Reviews Train AI Reviewers: Scientific-Judgment Collapse and Mitigation', 'url': 'https://huggingface.co/papers/2609.20942', 'abstract': 'Abstract  Large language models (LLMs) increasingly participate in scientific evaluation, both as automated reviewers and as assistants to human reviewers. As model-generated reviews enter public data and future training corpora, AI peer review can become recursive: later reviewers learn from judgments produced by earlier models. We study one step of this feedback loop in a controlled setting. Starting from Llama 3.1 8B, we first fine-tune a reviewer on official ICLR reviews from 2018--2023 and then train four successor models on ICLR 2024 data with systematically varied mixtures of official and model-generated reviews. Our study shows that introducing synthetic reviews compresses rating distributions and reduces both same-paper and corpus-level semantic diversity. We call this pattern scientific-judgment collapse.   To mitigate this failure mode, we introduce TrustReviewer, an open-source LLM-based system for generating peer reviews of AI and machine learning papers. TrustReviewer intervenes at two complementary stages. For training-time prevention, we train the core reviewer in a single stage on a curated corpus designed to reduce low-quality and semantically degenerate supervision. For test-time correction, paired activation steering aims to further mitigate residual tendencies toward collapsed judgments without further training or additional expert annotation. Together, these results characterize a concrete risk of recursive reviewer training and provide practical interventions for preserving judgment diversity and improving recommendation alignment in AI-assisted scientific evaluation.', 'score': 1, 'issue_id': 3308, 'pub_date': '2026-09-17', 'pub_date_card': {'ru': '17 сентября', 'en': 'September 17', 'zh': '9月17日'}, 'hash': '7659749fbb38fe62', 'authors': ['Sy-Tuyen Ho', 'Minghui Liu', 'Furong Huang'], 'affiliations': ['University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2609.20942.jpg', 'data': {'categories': ['#interpretability', '#training', '#synthetic', '#rlhf', '#dataset', '#science', '#open_source'], 'emoji': '🔄', 'ru': {'title': 'Предотвращение коллапса научных суждений в рекурсивном обучении языковых моделей-рецензентов', 'desc': 'В статье исследуется проблема рекурсивного обучения языковых моделей на основе их собственных предыдущих оценок в научном рецензировании. Авторы показали, что когда модели обучаются на смеси официальных рецензий и синтетических оценок, генерируемых другими моделями, происходит коллапс научных суждений: оценки становятся однородными и теряют смысловое разнообразие. Для решения этой проблемы предложена система TrustReviewer, которая использует два подхода: на этапе обучения применяется тщательно отобранный набор данных для улучшения качества, а на этапе инференса используется техника управления активациями нейронной сети для предотвращения деградации суждений. Исследование демонстрирует конкретный риск рекурсивного обучения моделей-рецензентов и предлагает практические методы для сохранения разнообразия оценок в системах автоматизированного научного рецензирования.'}, 'en': {'title': 'Preserving Diversity in AI Peer Review with TrustReviewer', 'desc': "This paper explores the impact of large language models (LLMs) on the peer review process in scientific evaluation. It highlights a phenomenon called 'scientific-judgment collapse,' where the introduction of model-generated reviews leads to reduced diversity in ratings and judgments. The authors propose a solution called TrustReviewer, which is designed to improve the quality of peer reviews by using a curated training corpus and a method called paired activation steering. This approach aims to maintain diverse and accurate evaluations in AI-assisted scientific reviews, addressing the risks associated with recursive training of reviewers."}, 'zh': {'title': '保持科学评审的多样性与质量', 'desc': '这篇论文探讨了大型语言模型（LLMs）在科学评审中的应用，尤其是作为自动评审者和人类评审者的助手。研究发现，当模型生成的评审进入公共数据后，后续的评审者可能会受到早期模型判断的影响，形成反馈循环。作者提出了一种名为TrustReviewer的开源系统，旨在生成AI和机器学习论文的同行评审，以减少低质量评审的影响。通过在训练和测试阶段的干预，TrustReviewer能够保持评审判断的多样性，改善AI辅助科学评估的推荐一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.20669', 'title': 'Learning Foresight without Explicit Trajectories for 3D Diffusion Policies', 'url': 'https://huggingface.co/papers/2609.20669', 'abstract': 'Abstract  3D diffusion policies are strong at generating geometrically grounded actions from current observations, but successful manipulation requires not only knowing what motion is feasible now, but also anticipating where the interaction is heading. Existing policies largely leave such foresight to emerge implicitly from action learning. We introduce Movement Trend Guidance, a simple but effective way to provide this foresight without introducing an explicit plan. From a short observation history, the policy learns a compact latent representation of interaction evolution. During training, sparse future gripper states supervise this representation; at inference, only the latent is retained as future-oriented conditioning alongside the current observation. The latent provides global conditioning for action generation, while an additional gated FiLM branch is used only at the UNet bottleneck. Despite adding only 3.52% more parameters to DP3, our method preserves the original dense-action and receding-horizon formulation and consistently improves upon DP3 across RoboTwin2.0, LIBERO-40, and DexArt. It reaches 62.8% vs. 56.1% in 50-task RoboTwin2.0 mixed training, 71.93% vs. 37.08% on LIBERO-40, and 72.0% vs. 49.0% on five real-robot tasks. These results show that a diffusion policy can benefit substantially from knowing where an interaction is heading, without being told exactly where to move.', 'score': 0, 'issue_id': 3308, 'pub_date': '2026-09-17', 'pub_date_card': {'ru': '17 сентября', 'en': 'September 17', 'zh': '9月17日'}, 'hash': 'fc5ea531b0351813', 'pdf_title_img': 'assets/pdf/title_img/2609.20669.jpg', 'data': {'categories': ['#architecture', '#training', '#3d', '#diffusion', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Предчувствие взаимодействия: обучение диффузионных политик видеть будущее', 'desc': 'В работе предлагается метод Movement Trend Guidance для улучшения 3D diffusion policies в задачах манипуляции роботом. Ключевая идея заключается в том, чтобы предоставить политике информацию о тренде развития взаимодействия через компактное латентное представление, обучаемое на истории наблюдений и контролируемое редкими будущими состояниями захвата. Во время инференции это латентное представление используется как глобальная подсказка для генерации действий через gated FiLM модуль в bottleneck части UNet, добавляя при этом только 3.52% параметров. Метод демонстрирует значительное улучшение результатов на бенчмарках RoboTwin2.0, LIBERO-40 и реальных робототехнических задачах, достигая улучшения производительности на 6-34 процентных пункта без явного планирования.'}, 'en': {'title': 'Anticipating Interaction: Enhancing 3D Diffusion Policies with Movement Trend Guidance', 'desc': 'This paper presents a new method called Movement Trend Guidance to enhance 3D diffusion policies in robotic manipulation. The approach allows the policy to learn a compact representation of how interactions evolve over time, which helps in anticipating future states without needing explicit planning. By using sparse future gripper states during training, the model can generate actions that are more aligned with the expected trajectory of interactions. The results show significant performance improvements across various tasks, demonstrating that understanding the direction of movement can greatly enhance action generation in robotic systems.'}, 'zh': {'title': '运动趋势引导：提升3D扩散策略的未来预测能力', 'desc': '这篇论文提出了一种新的方法，称为运动趋势引导，旨在提高3D扩散策略在动作生成中的表现。该方法通过学习交互演变的紧凑潜在表示，帮助策略在当前观察的基础上预测未来的动作趋势。训练过程中，稀疏的未来抓取状态用于监督潜在表示，而在推理时，仅保留潜在表示作为未来导向的条件。实验结果表明，该方法在多个任务上显著提高了性能，证明了扩散策略在了解交互趋势方面的潜力。'}}}];

        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (3)', '#agi', '#alignment', '#architecture (1)', '#audio', '#benchmark (4)', '#cv (2)', '#data', '#dataset (4)', '#diffusion (2)', '#ethics', '#games (1)', '#graphs (1)', '#hallucinations', '#healthcare', '#inference', '#interpretability (1)', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (3)', '#open_source (4)', '#optimization (2)', '#plp', '#rag', '#reasoning', '#rl (1)', '#rlhf (1)', '#robotics (1)', '#science (1)', '#security', '#small_models (1)', '#story_generation', '#survey', '#synthetic (2)', '#training (3)', '#transfer_learning', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-21 02:32',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-21 02:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-21 02:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
