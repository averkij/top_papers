    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.17426', 'title': 'SemComp-Bench: Benchmarking Semantic Task Completion in Video Generation', 'url': 'https://huggingface.co/papers/2608.17426', 'abstract': 'Abstract Semantic task completion video generation evaluates whether generated videos achieve intended outcomes with semantic grounding, supported by a curated dataset and vision-language model-based benchmark.  Generated by thinkingmachines/Inkling-Small We introduce Semantic Task Completion Video Generation, an outcome-oriented video generation task. Under this formulation, success requires both achievement of the intended outcome and semantic grounding. Semantic grounding characterizes the correspondence between the reference image and the generated outcome in terms of high-level semantics relevant to the task. Evaluation focuses on the generated outcome and requires neither the presentation of a complete sequence of intermediate task steps nor conventional appearance consistency with the reference image. To support systematic evaluation, we construct SemComp-Data, an evaluation dataset covering six domains. Each instance comprises a reference image, a detailed instruction, a brief instruction, and an outcome-centric video clip. A scalable four-stage curation pipeline converts raw videos into standardized SemComp-Data instances. We further introduce SemComp-Bench, an evaluation protocol that uses a vision-language model (VLM) to answer structured binary questions. SemComp-Bench reports the OA Score and the GR Score for Outcome Achievement and Generation Reliability, respectively. Experiments on representative video generation models show that achieving intended outcomes while maintaining task-relevant semantic grounding in reference images remains challenging.', 'score': 151, 'issue_id': 3064, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'f5823abd4e9867da', 'authors': ['Keyu Tu', 'Zhuowei Chen', 'Mengqi Huang', 'Yuxin Wang', 'Jiahao Zhu', 'Zhendong Mao', 'Yongdong Zhang'], 'affiliations': ['FrameX.AI', 'Sun Yat-sen University', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.17426.jpg', 'data': {'categories': ['#video', '#multimodal', '#dataset', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'От инструкции к результату: семантически обоснованная генерация видео', 'desc': 'В работе предлагается новая задача генерации видео с фокусом на семантическое завершение задач, где качество оценивается по достижению намеченного результата и соответствию между исходным изображением и итоговым видео. Авторы создали датасет SemComp-Data, содержащий примеры из шести различных предметных областей с инструкциями и видеороликами, ориентированными на результат. Для оценки качества разработан бенчмарк SemComp-Bench, использующий vision-language модель для проверки семантической корректности через структурированные вопросы. Экспериментальные результаты показывают, что существующие модели генерации видео испытывают сложности в одновременном достижении целевого результата и сохранении семантического соответствия задаче.'}, 'en': {'title': 'Achieving Outcomes with Semantic Grounding in Video Generation', 'desc': 'This paper presents a new task called Semantic Task Completion Video Generation, which focuses on creating videos that not only achieve specific outcomes but also maintain a connection to the original reference image through semantic grounding. Semantic grounding ensures that the generated video aligns with the high-level meanings of the task, rather than just visual similarities. The authors introduce a dataset called SemComp-Data, which includes various instances of reference images, instructions, and outcome-focused video clips to facilitate evaluation. They also propose SemComp-Bench, a protocol that uses a vision-language model to assess the success of generated videos based on outcome achievement and generation reliability.'}, 'zh': {'title': '语义驱动的视频生成新挑战', 'desc': '本文介绍了一种新的视频生成任务，称为语义任务完成视频生成。该任务的成功不仅要求生成的视频达到预期结果，还需要与参考图像在语义上相对应。为了支持系统评估，研究者构建了一个名为SemComp-Data的数据集，涵盖六个领域，并引入了SemComp-Bench评估协议。实验表明，在保持与参考图像的语义一致性的同时，实现预期结果仍然具有挑战性。'}}}, {'id': 'https://huggingface.co/papers/2608.16590', 'title': 'Zetta ζ: An Efficient Closed-Loop Embodied Harness for Self-Evolving Physical Intelligence', 'url': 'https://huggingface.co/papers/2608.16590', 'abstract': 'Abstract Zetta is a closed-loop embodied harness that evolves runtime critics and recovery skills online to govern physical execution at action frequency, achieving high success on robot benchmarks with faster inference and scaling self-exploration.  Generated by thinkingmachines/Inkling-Small Embodied agents are increasingly used to close the gap left by end-to-end policy models. Yet the agentic path has not realized closed-loop learning in physical execution: existing harnesses remain largely open-loop, following fixed skills during rollout and reflecting only after an episode completes. Such post-hoc reflection cannot govern execution as it unfolds, because physical interaction requires decisions to track rapidly changing robot-environment states at a frequency beyond today\'s large agentic models. We present Zetta, a closed-loop embodied harness that evolves code-based runtime critics and recovery skills online while keeping the base policy frozen. Through three timescale-separated loops, Zetta provides action-frequency governance, rollout-level critic-recovery proposal, and validation-gated skill updates. Together with Z-Infra, a rollout infrastructure decoupling agent logic from heterogeneous execution resources, Zetta achieves state-of-the-art success on LIBERO-Pro and RoboCasa under our current rollout budget, reaching 90.8% and 93.6%, with an 11.1x inference speedup; success continues to scale with self-exploration experience; learned skills transfer zero-shot, and clear robotic "Aha Moments" emerge. These results show that closed-loop harness self-evolution opens a scaling path for reliable physical intelligence.', 'score': 129, 'issue_id': 3065, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '23f6b166dfa9193d', 'authors': ['Xin Ding', 'Liang Mi', 'Mingzhe Huang', 'Zixuan Wang', 'Chao Zhang', 'Zixu Hao', 'Fu Chen', 'Xiangyu Li', 'Yikai Zheng', 'Yaoyu Guo', 'Weijun Wang', 'Kun Li', 'Hao Wu', 'Yunxin Liu', 'Ting Cao'], 'affiliations': ['Institute for AI Industry Research (AIR), Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16590.jpg', 'data': {'categories': ['#benchmark', '#robotics', '#agents', '#inference'], 'emoji': '🤖', 'ru': {'title': 'Замкнутая эволюция критиков для надёжного управления физическими агентами', 'desc': 'Zetta представляет замкнутую систему управления для робототехники, которая эволюционирует критиков и навыков восстановления во время выполнения, не изменяя базовую политику. Система использует три временные масштаба для управления действиями робота на частоте выполнения команд, что позволяет следить за быстро меняющимся состоянием среды. Достигнув 90.8% и 93.6% успеха на бенчмарках LIBERO-Pro и RoboCasa с 11-кратным ускорением вывода, Zetta демонстрирует превосходящие результаты. Система показывает, что закрытой контур и самоэволюция архитектуры открывают масштабируемый путь для разработки надёжного физического интеллекта.'}, 'en': {'title': 'Zetta: Revolutionizing Real-Time Learning for Robots', 'desc': 'Zetta is an innovative closed-loop system designed for embodied agents that enhances their ability to learn and adapt in real-time during physical tasks. Unlike traditional open-loop systems that rely on fixed skills, Zetta evolves runtime critics and recovery skills while the base policy remains unchanged, allowing for dynamic decision-making. It operates through three distinct loops that manage actions, propose recovery strategies, and update skills based on validation, leading to improved performance in robotic benchmarks. The results demonstrate that Zetta not only accelerates inference speed but also enables agents to learn from their experiences, achieving high success rates in complex environments.'}, 'zh': {'title': '闭环控制，智能进化！', 'desc': 'Zetta是一种闭环的具身控制系统，能够在线进化运行时评估者和恢复技能，以管理物理执行。它通过三个时间尺度分离的循环，实现了动作频率的治理、回合级别的评估恢复提议和验证门控的技能更新。Zetta在LIBERO-Pro和RoboCasa的基准测试中取得了优异的成绩，推理速度提高了11.1倍，并且随着自我探索经验的增加，成功率持续提升。该研究表明，闭环控制系统的自我进化为可靠的物理智能开辟了新的发展路径。'}}}, {'id': 'https://huggingface.co/papers/2608.18565', 'title': 'SemaPLC: A Project-Grounded, Verification-Gated Agent Harness for PLC Code Generation', 'url': 'https://huggingface.co/papers/2608.18565', 'abstract': 'Abstract SemaPLC is a verification-gated agent harness that validates generated PLC logic through external compilation and live runtime execution, achieving higher verified pass rates than baseline methods.  Generated by thinkingmachines/Inkling-Small Programmable logic controllers (PLCs) run industrial plants, and large language models can already generate independent program organization units (POUs) for them. Whether such logic integrates into an existing PLC project and then runs correctly has been checked only in limited tests. We present SemaPLC, a project-grounded and verification-gated agent harness assembled from conventional tools but governed by a strict completion rule. Rather than stopping when the model judges its own output adequate, SemaPLC declares a task complete only when logged external checks confirm it. Those checks cover the specification, the compilation, and the behavior on a live runtime. On 117 independent-POU tasks matching existing benchmarks, it attains the highest strict verified pass rate on all seven models (72.6\\% mean). On a project-context track of 65 tasks whose generated logic must compile and run inside a real project, it attains the highest mean on integrated compilation, static behavior, and dynamic behavior. Of the three layers, dynamic behavior is the most revealing. We measure it by deploying the generated and the reference logic to a live PLC runtime and comparing their executed traces. All methods fall within 10 static points of one another, whereas dynamic scores separate them sharply, from 22.4 to 31.4 for the baselines against 52.2 for SemaPLC. Overall, our verification-gated harness raises the mean at every layer and most sharply at runtime. Execution, not static scoring, is the faithful test of whether generated control logic actually works. SemaPLC is open-sourced at https://github.com/midea-ai/SemaPLC.', 'score': 110, 'issue_id': 3064, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '4b00fee54d58bd1c', 'authors': ['Yanlun Tu', 'Huacan Wang', 'Ziyue Zhou', 'Jie Zhou', 'Ningyan Zhu', 'Ge Chen', 'Wangyi Chen', 'Tengfei Zhou', 'Yifan Zhou', 'Dasheng Yang', 'Xiaofeng Mou', 'Hui Zhang', 'Yi Xu'], 'affiliations': ['KUKA', 'Midea AIRC', 'SJTU', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2608.18565.jpg', 'data': {'categories': ['#plp', '#open_source', '#agents', '#benchmark'], 'emoji': '🏭', 'ru': {'title': 'Верификация через выполнение: тестирование сгенерированного кода PLC в реальности', 'desc': 'SemaPLC — это система проверки для агентов, которые генерируют код для программируемых логических контроллеров (PLC), используемых в промышленности. Система использует внешнюю компиляцию и прямое выполнение на реальном оборудовании для проверки корректности сгенерированного кода, а не полагается на самооценку модели. На наборе из 117 задач система достигла наивысшего показателя успешной верификации (72,6% в среднем) среди всех протестированных LLM. Особенность работы в том, что динамическая проверка во время выполнения на реальном контроллере показывает наиболее точную оценку качества — разница между методами составляет от 22,4 до 52,2%, что значительно превышает различия на этапе статической проверки.'}, 'en': {'title': 'SemaPLC: Ensuring Reliable PLC Logic Through Rigorous Verification', 'desc': 'SemaPLC is a verification-gated agent harness designed to validate the logic generated for programmable logic controllers (PLCs) through external compilation and live execution. It ensures that the generated program organization units (POUs) not only meet specifications but also function correctly in real-time environments. By implementing a strict completion rule, SemaPLC only considers a task complete when external checks confirm its correctness, leading to significantly higher verified pass rates compared to traditional methods. The system excels particularly in dynamic behavior evaluation, demonstrating that execution is the true measure of the effectiveness of generated control logic.'}, 'zh': {'title': 'SemaPLC：提升PLC逻辑验证的利器', 'desc': 'SemaPLC 是一个验证门控的代理工具，旨在通过外部编译和实时执行来验证生成的可编程逻辑控制器（PLC）逻辑。与传统方法相比，SemaPLC 在验证通过率上表现更佳，尤其是在动态行为的测试中。该工具不仅在模型自我评估输出时停止，而是要求外部检查确认任务完成。通过对117个独立的POU任务进行测试，SemaPLC 在所有七个模型中达到了最高的严格验证通过率。'}}}, {'id': 'https://huggingface.co/papers/2608.13558', 'title': 'OmniScientist: An Omni-Modal Omni-Discipline AI Scientist', 'url': 'https://huggingface.co/papers/2608.13558', 'abstract': 'Abstract OmniScientist is an end-to-end omni-modal AI scientist that performs multidisciplinary research directly from heterogeneous raw evidence using autonomous agents and lifecycle-wide perception, improving evidence-grounded discovery across diverse scientific modalities.  Generated by thinkingmachines/Inkling-Small Recent advances in foundation models have enabled AI scientists to automate increasingly complete research workflows, from hypothesis generation and code execution to manuscript preparation. Yet workflow coverage alone does not provide access to the full evidence on which scientific discovery depends. Existing systems typically reason over text, code, labels, or precomputed summaries, leaving scientifically decisive spatial, temporal, cross-channel, and procedural relations unavailable to the agent. We introduce OmniScientist, an end-to-end, omni-modal AI scientist that conducts multidisciplinary research directly from heterogeneous raw evidence. A perception layer and 3 autonomous agents for ideation, experiment, and writeup operate within a deterministic pipeline, allowing observations to shape research questions, experimental decisions, and final claims throughout the research lifecycle. By running idea, rigour, and claim checks in code, the system enforces novelty screening, statistical validity, execution provenance, and numerical traceability. We evaluate OmniScientist on 36 real-data cases spanning 5 discipline families, 4 families of scientific evidence, and modalities including images, signals, audio, video, 3-D structures, trajectories, tables, formulae, and graphs. The system completes the full path from raw data to a compiled manuscript in all 36 cases and achieves a mean overall paper score of 6.3 with the reference reasoning backbone. In paired comparisons against a blind variant that receives only precomputed scalar features, direct perception improves all 7 evaluation dimensions and wins 85% of head-to-head judgments. These results show that lifecycle-wide perception is essential for evidence-grounded scientific discovery and provides a practical path toward broadly capable AI scientists.', 'score': 83, 'issue_id': 3065, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': 'c93c89ef6885133d', 'authors': ['Bobo Li', 'Hao Fei', 'Tianjie Ju', 'Mong-Li Lee', 'Wynne Hsu'], 'affiliations': ['National University of Singapore', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.13558.jpg', 'data': {'categories': ['#3d', '#cv', '#multimodal', '#audio', '#science', '#open_source', '#agents', '#video'], 'emoji': '🔬', 'ru': {'title': 'Многомодальный AI учёный для полного цикла научных исследований от сырых данных до публикации', 'desc': 'OmniScientist представляет собой автономного AI учёного, который проводит научные исследования на основе разнородных сырых данных различных модальностей, включая изображения, видео, аудио и таблицы. Система использует слой восприятия и три специализированных агента для генерации гипотез, проведения экспериментов и написания научных статей в едином deterministic pipeline. В отличие от существующих подходов, которые работают только с текстом и предвычисленными признаками, OmniScientist сохраняет пространственные, временные и процедурные связи в данных, что критически важно для научного открытия. Система успешно завершила полный цикл от сырых данных до готовой рукописи в 36 реальных задачах из пяти научных дисциплин, демонстрируя преимущество прямого восприятия информации над работой с агрегированными признаками.'}, 'en': {'title': 'Revolutionizing Research with OmniScientist: The Future of AI in Science', 'desc': 'OmniScientist is a comprehensive AI system designed to conduct scientific research by directly analyzing diverse types of raw evidence. It utilizes a perception layer and three autonomous agents to manage the research process, from generating hypotheses to writing manuscripts. This system enhances the research workflow by ensuring that all relevant data, including complex relationships and modalities, are considered throughout the study. Evaluation results demonstrate that OmniScientist significantly outperforms traditional methods by integrating direct perception into the research lifecycle, leading to more robust scientific discoveries.'}, 'zh': {'title': '全方位感知，推动科学发现的未来', 'desc': 'OmniScientist 是一种全方位的人工智能科学家，能够直接从多种原始证据中进行跨学科研究。它通过自主代理和全生命周期感知，提升了基于证据的科学发现能力。该系统能够自动化整个研究流程，从假设生成到代码执行，再到手稿准备。通过对原始数据的直接感知，OmniScientist 在多个科学领域中实现了从数据到论文的完整转化，展示了全生命周期感知在科学发现中的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.17253', 'title': 'Co-RL: Unsupervised Reasoning Emerges from Diverse Cohort in Multi-agent RL', 'url': 'https://huggingface.co/papers/2608.17253', 'abstract': 'Abstract Co-RL enables unsupervised reasoning via cooperative multi-agent reinforcement learning with peer-derived rewards, improving performance across text and vision tasks without ground-truth labels.  Generated by thinkingmachines/Inkling-Small Reinforcement learning (RL) has emerged as a powerful approach for improving reasoning in language and vision-language models, yet its strongest successes still depend heavily on ground-truth supervision (e.g., verifiable reward). Such annotations are costly to obtain and become increasingly scarce as reasoning capabilities advance beyond what humans can reliably evaluate. Self-rewarding RL reduces this dependence by enabling models to derive reward signals from their own completions. However, training solely on self-generated feedback can reinforce existing biases and suboptimal behaviors, reduce response diversity, and ultimately lead to homogenized responses and training collapse. In this work, we show that unsupervised reasoning can emerge through cooperative multi-agent training. We introduce Co-RL, a framework in which multiple decoupled models, sharing no parameters, are simultaneously optimized through RL using rewards derived from their peers. We further show that increasing cohort diversity, through heterogeneous model families, sizes, and rephrased training samples, reduces the correlated errors that drive self-reinforcing feedback loops. This diversity consistently improves reasoning performance, maintains behavioral diversity, and mitigates training collapse. Across text-only and multimodal domains, Co-RL consistently outperforms the base models and prior label-free approaches, while matching or surpassing supervised methods, without access to any ground-truth labels. Concretely, Co-RL yields average gains of 3.0-8.6% across seven text-only benchmarks for LLMs and 2.3-7.2% across four multimodal benchmarks for VLMs. Code is available at https://github.com/DrStranded/Co-RL.', 'score': 82, 'issue_id': 3066, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': 'ee47f36b84bd215e', 'authors': ['Yunhao Yang', 'Yuexin Bian', 'Yunjie Tian', 'Di Fu', 'Tianjin Huang', 'Yuanyuan Shi', 'Ziang Xiao', 'Nuno Vasconcelos', 'Yijiang Li'], 'affiliations': ['Independent Researcher', 'Johns Hopkins University', 'UC San Diego', 'University of Exeter'], 'pdf_title_img': 'assets/pdf/title_img/2608.17253.jpg', 'data': {'categories': ['#reasoning', '#training', '#multimodal', '#open_source', '#alignment', '#rl'], 'emoji': '🤝', 'ru': {'title': 'Коллективный разум: обучение с подкреплением через сотрудничество агентов без учителя', 'desc': 'Co-RL — это фреймворк для обучения нескольких независимых моделей через кооперативное многоагентное обучение с подкреплением, где агенты генерируют сигналы награды друг для друга без использования разметки. Метод решает проблему самоусиления предубеждений при использовании только собственных сигналов обратной связи, путём введения разнообразия в архитектуры моделей, их размеры и обучающие данные. Экспериментально показано, что кооперативное взаимодействие моделей улучшает качество рассуждений, сохраняет разнообразие ответов и предотвращает коллапс обучения. Co-RL демонстрирует улучшения на 3.0-8.6% для текстовых задач и 2.3-7.2% для мультимодальных бенчмарков без доступа к истинной разметке.'}, 'en': {'title': 'Cooperative Learning Without Labels: Unlocking Unsupervised Reasoning', 'desc': "The paper introduces Co-RL, a novel framework for cooperative multi-agent reinforcement learning that allows models to learn without relying on ground-truth labels. By enabling multiple independent models to derive rewards from each other's outputs, Co-RL mitigates issues like bias reinforcement and training collapse that can occur with self-rewarding methods. The approach emphasizes the importance of diversity among the models, which helps reduce correlated errors and enhances reasoning performance. Results show that Co-RL outperforms traditional models and previous label-free methods across various text and vision tasks, achieving significant performance gains."}, 'zh': {'title': '合作强化学习：无监督推理的新方法', 'desc': 'Co-RL是一种通过合作的多智能体强化学习实现无监督推理的方法。它允许多个模型在没有共享参数的情况下，通过彼此的奖励信号进行优化，从而提高推理性能。通过增加模型的多样性，Co-RL能够减少自我强化反馈循环带来的相关错误，保持行为多样性，避免训练崩溃。实验结果表明，Co-RL在文本和多模态任务上均优于基线模型和之前的无标签方法，且在没有真实标签的情况下，性能与监督方法相当或更好。'}}}, {'id': 'https://huggingface.co/papers/2608.19197', 'title': 'SPADE: Self-Play in Adaptive Synthetic Executable Environments', 'url': 'https://huggingface.co/papers/2608.19197', 'abstract': "Abstract SPADE is a self-play reinforcement learning framework where a language model designs adaptive executable training environments and learns to solve them, improving reasoning and tool-use performance through regret-based environment targeting.  Generated by thinkingmachines/Inkling-Small Continuous self-improvement requires an ever-expanding pool of self-generated, diverse, adaptive goals. For language agents, existing training environment pools (hand-curated, statically synthesized, or frozen-verifier) keep the goal distribution fixed as the learner scales. We introduce SPADE (Self-Play in Adaptive Synthetic Executable Environments), a self-play RL framework in which a single LLM plays two roles: an Environment Designer that writes complete, long-horizon training environments as executable code with an OpenAI Gym-style reset()/step() interface, and a Reasoning Agent that learns to act in them. Each is a stateful, multi-turn environment (state transitions, reward functions, and verification code), so one interface spans reasoning problems and multi-step agentic tool use. The Reasoning Agent's regret is estimated using the gap between its reward with and without privileged hints; in optimizing this regret signal the Environment Designer learns to target environments at the edge of the agent's capabilities while keeping them feasible. Through extensive experimentation, we find several components critical to success: grounding the Environment Designer on documents sampled from a large pretraining corpus, and giving it an accumulated environment memory. Scaling to 30B-parameter models, SPADE improves over the strongest fixed-environment baseline by +5.3 on average across eight held-out math, science, code, and reasoning benchmarks, and lifts the tool-use setting by +5.7 on BFCL-v4 multi-turn and +13.9 on ACEBench-Agent; on the games setting, the margin over the strongest baseline grows with model scale. By making environment design itself a learnable component, SPADE takes a concrete step toward open-ended self-improvement.", 'score': 40, 'issue_id': 3064, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': 'b8e766ede93965d2', 'authors': ['Bo Liu', 'Simon Yu', 'Yiding Jiang', 'Ao Qu', 'Andrew Zhao', 'Zichen Liu', 'Junsu Kim', 'Zijian Zhou', 'Seungone Kim', 'Tongzheng Ren', 'Mickel Liu', 'Hanfei Yu', 'Zhaorun Chen', 'Weiyan Shi', 'Paul Pu Liang', 'Luke Zettlemoyer', 'Yejin Choi', 'Natasha Jaques'], 'affiliations': ['Carnegie Mellon University', 'Massachusetts Institute of Technology', 'National University of Singapore', 'Northeastern University', 'Seoul National University', 'Stanford University', 'Stevens Institute of Technology', 'University of Chicago', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2608.19197.jpg', 'data': {'categories': ['#synthetic', '#reasoning', '#optimization', '#agents', '#training', '#rl', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Модель, которая сама создаёт себе задачи для самосовершенствования', 'desc': 'SPADE — это фреймворк обучения с подкреплением, где одна языковая модель играет две роли: создатель окружения, который пишет адаптивные тренировочные задачи как исполняемый код, и агента, который учится их решать. Агент улучшает свои навыки через сигнал сожаления (regret), измеряемый разницей между его производительностью с подсказками и без них, что позволяет создателю окружения генерировать задачи на границе возможностей агента. Система использует память накопленных окружений и документы из корпуса предварительного обучения для более эффективного дизайна задач. Метод показал значительные улучшения на бенчмарках математики, науки, программирования и использования инструментов — на 5-14 процентных пункта выше существующих подходов.'}, 'en': {'title': 'SPADE: Self-Improving Learning through Adaptive Environment Design', 'desc': "SPADE is a novel self-play reinforcement learning framework that enables a language model to create adaptive training environments while simultaneously learning to solve them. It features two main roles: an Environment Designer that generates executable training scenarios and a Reasoning Agent that interacts with these environments. The framework uses a regret-based approach to optimize the learning process, allowing the Environment Designer to create challenges that are just within the agent's capabilities. By leveraging self-generated goals and scaling to large models, SPADE significantly enhances performance in reasoning and tool-use tasks compared to traditional fixed-environment methods."}, 'zh': {'title': '自我对弈：开启开放式自我改进的新篇章', 'desc': 'SPADE是一种自我对弈的强化学习框架，利用语言模型设计自适应的可执行训练环境，并通过基于遗憾的环境目标优化来提高推理和工具使用的表现。该框架中，语言模型同时扮演环境设计者和推理代理的角色，设计出具有多轮状态转移和奖励函数的复杂环境。通过对环境设计的学习，SPADE能够生成多样化的目标，促进自我改进。实验结果表明，SPADE在多个基准测试中显著超越了传统的固定环境基线，展示了其在开放式自我改进方面的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.18940', 'title': 'Training Chemical Plausibility-Aware Large Language Models for Single-Step Retrosynthesis', 'url': 'https://huggingface.co/papers/2608.18940', 'abstract': 'Abstract Top-K prompting and plausibility-aware training improve diverse reaction prediction in single-step retrosynthesis, yielding state-of-the-art results on a large verified reaction dataset and motivating ensemble systems.  Generated by thinkingmachines/Inkling-Small Single-step retrosynthesis is a central component of computer-aided synthesis planning, yet its intrinsically one-to-many nature is poorly captured by single-answer evaluation and benchmarking protocols. To address this, we introduce Top-K prompting as a robust training and inference paradigm to better capture diverse, plausible reaction predictions. We compile CREED-CCV-2+USPTO-XL, an ultra-large-scale dataset of ~45.6 million verified reactions to train the C3LM (Chemistry Constraint-Consistent Language Model). By integrating fine-tuning with ChemCensor-based and novelty-oriented rewards, our model achieves state-of-the-art performance on the OOD URSA-expert-2026 benchmark. Further analysis of reaction uniqueness shows that LLMs and conventional models explore complementary reaction spaces, motivating ensemble-based retrosynthesis systems. Overall, our results establish Top-K, plausibility-aware training as a practical new direction for robust future LLM-based synthesis planning.', 'score': 29, 'issue_id': 3064, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '9c09238ec869ced9', 'authors': ['Bogdan Zagribelnyy', 'Ivan Ilin', 'Nikita Bondarev', 'Maksim Kuznetsov', 'Mathieu Reymond', 'Vladimir Aladinskiy', 'Alex Aliper', 'Alex Zhavoronkov'], 'affiliations': ['Insilico Medicine AI Limited, Abu Dhabi, UAE', 'Insilico Medicine Canada Inc., Montreal, Quebec, Canada', 'Insilico Medicine Hong Kong Ltd., Hong Kong SAR, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.18940.jpg', 'data': {'categories': ['#dataset', '#optimization', '#training', '#rlhf', '#science', '#benchmark'], 'emoji': '⚗️', 'ru': {'title': 'Многовариантное предсказание реакций через Top-K промптинг и ансамбльные системы', 'desc': 'Статья посвящена улучшению предсказания реакций в одношаговом ретросинтезе с помощью техники Top-K промптинга и обучения с учетом правдоподобия. Авторы создали огромный датасет из 45.6 миллионов верифицированных реакций и обучили языковую модель C3LM, которая достигла лучших результатов на бенчмарке URSA-expert-2026. Анализ показал, что большие языковые модели и традиционные модели исследуют дополняющие друг друга пространства реакций, что мотивирует использование ансамблевых систем. Работа предлагает новый практический подход к обучению LLM-моделей для планирования синтеза на основе оценки плауцибилити предсказанных реакций.'}, 'en': {'title': 'Enhancing Reaction Diversity with Top-K Prompting in Retrosynthesis', 'desc': 'This paper presents a new approach called Top-K prompting to improve the prediction of diverse reactions in single-step retrosynthesis, which is important for computer-aided synthesis planning. The authors introduce a large dataset, CREED-CCV-2+USPTO-XL, containing approximately 45.6 million verified reactions to train their model, C3LM. By using a combination of fine-tuning techniques and rewards focused on novelty, the model achieves top performance on established benchmarks. The findings suggest that combining different models can enhance the exploration of reaction possibilities, paving the way for more effective synthesis planning systems.'}, 'zh': {'title': 'Top-K提示：提升逆合成反应预测的多样性与合理性', 'desc': '本文提出了一种新的训练和推理方法，称为Top-K提示，以提高单步逆合成中反应预测的多样性和合理性。通过使用一个包含约4560万条验证反应的超大规模数据集，训练了C3LM模型。该模型结合了基于ChemCensor的奖励和新颖性导向的微调，达到了在OOD URSA-expert-2026基准测试中的最佳性能。研究表明，大型语言模型和传统模型在反应空间的探索上具有互补性，推动了基于集成的逆合成系统的发展。'}}}, {'id': 'https://huggingface.co/papers/2608.14929', 'title': 'Training Leaves Traces: Centered Residual Signatures for Language Model Lineage Verification', 'url': 'https://huggingface.co/papers/2608.14929', 'abstract': 'Abstract Compatible open-weight language model checkpoints share detectable weight-space ancestry signals that distinguish true lineage from independent or distilled models without requiring data.  Generated by thinkingmachines/Inkling-Small Open-weight language models are fine-tuned, quantized, pruned, and merged, yet their provenance is often undocumented. We study data-free white-box lineage verification: can weights alone reveal whether two compatible model checkpoints share ancestry?   Residual training produces a shared identity-aligned component in branch products, so this structure alone cannot establish ancestry. We remove it and compare checkpoint-specific structure across residual blocks, yielding a symmetric lineage score calibrated against independent checkpoints. On residual-MLP and GPT-2 benchmarks, the score separates fine-tuned, LoRA-merged, pruned, and quantized descendants from independent and distilled models (AUROC=1.0), distinguishing weight ancestry from behavioral similarity. Under function-preserving checkpoint laundering experiments, weight-space baselines lose margin or fail; our score remains unchanged and runs 76x faster than the nearest robust baseline on GPT-2. The projection-pairing signal appears across six language-model families and beyond, and a case study correctly identifies 3 related and 7 unrelated LLaMA-2 public checkpoints. Collectively, these results establish a passive, data-free provenance signal for compatible open-weight language-model checkpoints', 'score': 16, 'issue_id': 3064, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '025c3d3d01890d18', 'authors': ['Aman Singh Thakur', 'Rayan Khoury'], 'affiliations': ['Amazon', 'Massachusetts Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.14929.jpg', 'data': {'categories': ['#training', '#small_models', '#inference', '#architecture'], 'emoji': '🧬', 'ru': {'title': 'Безданные отпечатки предков: восстановление родства моделей через анализ весов', 'desc': 'В статье предложен метод определения родства между checkpoints языковых моделей на основе анализа весов без использования данных. Авторы обнаружили, что модели, полученные путём fine-tuning, quantization, pruning и merging, оставляют характерные следы в весовом пространстве, которые отличают истинных потомков от независимо обученных или дистиллированных моделей. Разработанный ими симметричный score сравнивает структуру весов в residual блоках, достигая идеального разделения (AUROC=1.0) между потомками и неродственными моделями. Метод остаётся устойчив к попыткам скрыть родство и работает в 76 раз быстрее аналогичных решений на примере GPT-2 и других семейств языковых моделей.'}, 'en': {'title': 'Uncovering Ancestry in Language Models Using Weights Alone', 'desc': 'This paper explores how to determine the ancestry of open-weight language models using only their weights, without needing any training data. It introduces a method for lineage verification that distinguishes between models that share a common origin and those that are independently developed. The authors demonstrate that their approach can accurately identify relationships among various model checkpoints, achieving perfect separation between related and unrelated models. Their findings suggest a reliable way to trace the lineage of language models, which is crucial for understanding their development and ensuring transparency in machine learning.'}, 'zh': {'title': '无数据的语言模型血统验证', 'desc': '这篇论文研究了开放权重语言模型的血统验证问题。作者提出了一种无数据的白盒验证方法，通过分析模型权重来判断两个模型是否有共同的祖先。研究表明，残差训练会产生共享的身份对齐组件，但这不足以确定血统。最终，作者开发的对称血统评分能够有效区分不同来源的模型，且在多个基准测试中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.18746', 'title': 'Decision-Metric Alignment in Latent World Models: Diagnostics and Action-Conditioned Objectives for MPC Planning', 'url': 'https://huggingface.co/papers/2608.18746', 'abstract': 'Abstract Action-conditioned objectives improve latent geometry for Euclidean-cost model-predictive control by enhancing decision-metric alignment in world models.  Generated by thinkingmachines/Inkling-Small JEPA-style latent world models can use Euclidean distance to a goal latent as the cost for model-predictive control (MPC). Strong decoding of task variables, however, does not guarantee that this particular cost ranks candidate action sequences by real task progress. We call the latter property decision-metric alignment. We introduce Plan-Real Spearman, which measures latent--real rank agreement on random plans, and CEM-stage Spearman, which measures the same agreement as cross-entropy-method (CEM) search concentrates its proposal. We analyze sufficient conditions under which latent distance preserves real-cost rankings, identifying encoder distortion, terminal rollout error, and candidate margins as the controlling quantities. Guided by the observed empirical alignment gap, DA-LeWM augments LeWM with inverse-dynamics and demonstration-conditioned goal-action heads. Across all our experiments, DA-LeWM accelerates convergence and achieves higher online success than LeWM, while probe scores remain similar. These results show that action-conditioned objectives improve the geometry used by Euclidean-cost, CEM-based latent MPC.', 'score': 15, 'issue_id': 3065, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '84cb89c451b3e2be', 'authors': ['Jiawei Wang', 'Ke Rui', 'Yushen Zuo', 'Yichun Feng', 'Minglei Li'], 'affiliations': ['Simple AI, Beijing, China', 'University of Chinese Academy of Sciences, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.18746.jpg', 'data': {'categories': ['#training', '#optimization', '#architecture', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Действие-обусловленные цели для геометрии латентного пространства в MPC', 'desc': 'В этой работе исследуется проблема выравнивания метрики решения в латентных мировых моделях JEPA для управления на основе моделей (MPC). Авторы показывают, что Евклидово расстояние в латентном пространстве до целевой точки не гарантирует правильный ранжирование последовательностей действий по прогрессу в решении задачи. Они предлагают метрики Plan-Real Spearman и CEM-stage Spearman для измерения согласованности между ранжированиями в латентном пространстве и реальной окружающей среде. Предложенный метод DA-LeWM использует обратную динамику и целевые заголовки, кондиционированные демонстрациями, что приводит к ускорению сходимости и улучшению результатов онлайн-обучения.'}, 'en': {'title': 'Enhancing MPC with Action-Conditioned Objectives', 'desc': "This paper discusses how action-conditioned objectives can enhance the performance of model-predictive control (MPC) in latent world models. It introduces a new metric, Plan-Real Spearman, to evaluate how well the model's predictions align with actual task progress. The authors identify key factors that affect the accuracy of these predictions, such as encoder distortion and rollout errors. By incorporating inverse-dynamics and demonstration-conditioned goals, the proposed DA-LeWM model shows improved convergence and success rates compared to the traditional LeWM model."}, 'zh': {'title': '行动条件目标提升模型预测控制的效果', 'desc': '本文探讨了如何通过增强决策度量对齐来改善欧几里得成本模型预测控制中的潜在几何。我们提出了一种新的方法，称为Plan-Real Spearman，用于测量潜在与真实排名的一致性。研究表明，潜在距离能够保持真实成本排名的条件包括编码器失真和候选边际等因素。通过引入逆动态和示范条件的目标动作头，DA-LeWM在所有实验中加速了收敛，并在在线成功率上超越了LeWM。'}}}, {'id': 'https://huggingface.co/papers/2608.18171', 'title': 'Looped Language Models Improve Compositional Tool Calling', 'url': 'https://huggingface.co/papers/2608.18171', 'abstract': 'Abstract Looped language models improve compositional, multi-step tool use through recurrent computation, with adaptive inference balancing accuracy and compute cost.  Generated by thinkingmachines/Inkling-Small Looped language models have shown promising results on reasoning benchmarks, yet their potential for agentic tool use remains largely unexplored. We study this question in compositional tool-calling settings, where models must coordinate multiple API calls, maintain intermediate state, and preserve dependencies across tool interactions. We evaluate native and retrofitted looped language models on API-Bank, BFCL, and NESTful, comparing looped and non-looped models trained under matched supervised fine-tuning recipes and varying recurrent depth at inference time. In controlled experiments, recurrent computation generally benefits compositional and dependency-aware tool use, while providing smaller and more model-dependent gains on isolated API invocation. Accuracy on multi-step tool use generally increases with recurrent depth; adaptive inference, however, achieves a more favorable compute-performance trade-off by allocating additional computation only when needed. Our results suggest that looped language models are a promising architecture for agentic systems that require reliable planning, coordination, and execution of compositional tool use workflows.', 'score': 15, 'issue_id': 3064, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '62122b17eadd8640', 'authors': ['Andrei Cristian Popescu', 'Haitz Sáez de Ocáriz Borde', 'Pietro Liò'], 'affiliations': ['Department of Computer Science and Technology, University of Cambridge, United Kingdom'], 'pdf_title_img': 'assets/pdf/title_img/2608.18171.jpg', 'data': {'categories': ['#inference', '#architecture', '#agents', '#training', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Циклические модели для многошаговой координации инструментов с адаптивными вычислениями', 'desc': 'В работе исследуются циклические языковые модели, которые используют рекуррентные вычисления для улучшения композитного использования инструментов через API-вызовы. Авторы оценивают как нативные, так и адаптированные циклические модели на бенчмарках API-Bank, BFCL и NESTful, сравнивая их с обычными моделями при различной глубине рекуррентности. Результаты показывают, что рекуррентные вычисления особенно эффективны для многошаговых задач, требующих координации нескольких вызовов и сохранения зависимостей между ними. Адаптивный вывод позволяет достичь лучшего баланса между точностью и вычислительными затратами, выделяя дополнительные ресурсы только при необходимости.'}, 'en': {'title': 'Enhancing Tool Use with Looped Language Models', 'desc': 'This paper explores the effectiveness of looped language models in performing complex tasks that require multiple steps and coordination between different tools. These models utilize recurrent computation to enhance their ability to manage dependencies and maintain state across various API calls. The study evaluates the performance of these models against traditional ones, showing that increased recurrent depth generally improves accuracy in multi-step tasks. Additionally, the introduction of adaptive inference allows for a more efficient balance between computational cost and performance, making looped models suitable for systems that need reliable planning and execution.'}, 'zh': {'title': '循环语言模型：提升工具使用的智能系统', 'desc': '循环语言模型通过递归计算提高了组合性和多步骤工具使用的能力，同时在准确性和计算成本之间实现了自适应推理的平衡。尽管循环语言模型在推理基准测试中表现良好，但其在自主工具使用方面的潜力仍未得到充分探索。我们在组合工具调用的环境中研究了这一问题，模型需要协调多个API调用，维护中间状态，并保持工具交互之间的依赖关系。实验结果表明，递归计算通常有利于组合和依赖感知的工具使用，同时在单独的API调用中提供的增益较小且依赖于模型。'}}}, {'id': 'https://huggingface.co/papers/2608.18423', 'title': 'FM-Bench: A Benchmark for Long-Horizon Management with Competing Agents', 'url': 'https://huggingface.co/papers/2608.18423', 'abstract': "Abstract FM-Bench evaluates long-horizon decision-making of LLM agents managing a football club over 20 years, revealing that managerial behavior rather than scale or token spend drives performance.  Generated by thinkingmachines/Inkling-Small Language model agents now execute bounded tasks reliably. Whether they can sustain effective decision-making over long horizons, where actions have cumulative consequences and the environment responds to their choices, remains largely unmeasured. FM-Bench (Football Management Benchmark) measures this. An LLM agent runs a football club for 20 in-game years through 26 tools and roughly 340 to 400 decision stops. It drafts a squad on the same budget as every rival, trades players, negotiates contracts, invests in facilities and youth, sets lineups, and answers to a board that can fire it, while a deterministic engine accumulates every year into one final score with no LLM judge or human rater. The solo track plays each of 15 frontier models against a frozen scripted world, and the Arena places the same models plus a scripted anchor in one shared 20-year world; to our knowledge, the first head-to-head evaluation at this scale. We measure six behavioral capabilities behind the score. Across three seeds, all 15 models complete every horizon while the blind scripted baselines die out in most of theirs, and claude-fable-5 tops the solo board on mean score and the Arena, where the title nonetheless rotates among ten models. Neither scale, price, nor vendor predicts the order; the order settles only late in the horizon, and the best first-play human lands only at the bottom of the model board. What separates the models is managerial behavior rather than computation. Higher-scoring models reduce slow-payoff investment near the end, keep cash invested rather than idle, and open renewals well before the deadline, while token spend predicts nothing. No model learns the market's hidden prices from hundreds of rejected bids, and self-managed memory fails in two opposite modes: an archive that only grows or a plan rewritten every season. Code is available at https://github.com/Analogy-AI/fm-bench.", 'score': 13, 'issue_id': 3063, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '1eed252ac1f00a98', 'authors': ['Tianyou Wang', 'Chongyang Gao', 'Kezhen Chen', 'Chen Dong', 'Yinghao He', 'Donghan Li', 'Wangcheng Xu', 'Hongjiu Zhang', 'Chi Li'], 'affiliations': ['AnalogyAI'], 'pdf_title_img': 'assets/pdf/title_img/2608.18423.jpg', 'data': {'categories': ['#games', '#open_source', '#reasoning', '#long_context', '#benchmark', '#agents'], 'emoji': '⚽', 'ru': {'title': 'Мастерство управления превосходит размер модели', 'desc': 'В статье представлен FM-Bench — бенчмарк для оценки долгосрочного принятия решений агентами на основе LLM, которые управляют футбольным клубом в течение 20 игровых сезонов. Агент взаимодействует с детерминированной средой через 26 инструментов и около 340-400 точек принятия решений, выполняя задачи подобные подбору команды, торговле игроками и управлению инвестициями. Исследование показывает, что среди 15 фронтальных моделей различия в производительности определяются поведенческими стратегиями управления, а не масштабом модели или объемом потраченных токенов. Ключевое открытие состоит в том, что успешные модели демонстрируют специфические поведенческие паттерны: сокращение долгосрочных инвестиций в конце периода, сохранение активов в инвестициях и своевременное возобновление контрактов.'}, 'en': {'title': 'Managerial Behavior Trumps Scale in Long-Term Decision-Making', 'desc': 'FM-Bench is a benchmark designed to evaluate the long-term decision-making abilities of large language model (LLM) agents in managing a football club over a span of 20 years. The study reveals that the effectiveness of these agents is influenced more by their managerial behavior than by their computational scale or token expenditure. The benchmark involves various tasks such as player trading, contract negotiations, and strategic investments, with performance measured through cumulative outcomes rather than immediate results. Notably, the findings indicate that successful models prioritize timely investments and proactive management, while traditional metrics like token spend do not correlate with success.'}, 'zh': {'title': '管理行为决定足球俱乐部的成功', 'desc': 'FM-Bench是一个评估大型语言模型（LLM）代理在管理足球俱乐部时的长期决策能力的基准测试。研究表明，管理行为比模型的规模或花费的代币更能影响表现。该基准测试通过模拟20年内的决策过程，考察了模型在不同情境下的表现。结果显示，成功的模型在投资和决策时更具前瞻性，而不是单纯依赖计算能力。'}}}, {'id': 'https://huggingface.co/papers/2608.14229', 'title': 'The More Popular, The Harder to Forget: Adaptive Popularity for LLM Unlearning', 'url': 'https://huggingface.co/papers/2608.14229', 'abstract': "Abstract AdaPop adapts gradient pressure by fact popularity and automates forget-retain balance to reduce leakage of unlearned content.  Generated by thinkingmachines/Inkling-Small Popular facts are memorised more deeply during pretraining and resist removal longer than rare ones, yet existing LLM unlearning methods apply uniform gradient pressure regardless of training-data frequency. We propose the AdaPop (Adaptive Popularity) method, which combines local token confidence with a per-fact popularity-dependent exponent derived from an external proxy (e.g., Wikidata sitelinks, LLM-as-Judge), and automates the forget-retain balance via a dual-ascent controller that adjusts the retain penalty each epoch. Across three model families and two benchmarks, AdaPop leaks ~5x less forgotten content than competing methods under paraphrased queries and ~1.6x less under adversarial reformulations. We support our analysis with internal metrics: under our method, forget-set hidden states move further from the pre-unlearning model's states than under other methods, while retain-set representations remain close.", 'score': 13, 'issue_id': 3069, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': 'c81a7dd655883780', 'authors': ['Anna Borisiuk', 'Andrey Savchenko', 'Alexander Panchenko', 'Elena Tutubalina'], 'affiliations': ['AIRI', 'ISP RAS Research Center for Trusted Artificial Intelligence', 'Sber AI Lab', 'Skoltech'], 'pdf_title_img': 'assets/pdf/title_img/2608.14229.jpg', 'data': {'categories': ['#leakage', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Адаптивное удаление информации из LLM с учётом популярности фактов', 'desc': 'В работе предлагается метод AdaPop для удаления информации из больших языковых моделей, который адаптирует градиентное давление в зависимости от популярности фактов в обучающих данных. Авторы заметили, что часто встречающиеся факты запоминаются глубже и труднее забываются, чем редкие, поэтому применяют дифференцированный подход к их удалению. Метод комбинирует локальную уверенность токенов с зависящим от популярности коэффициентом и использует контроллер двойственного восхождения для автоматического управления балансом между забыванием и сохранением. Экспериментальные результаты показывают, что AdaPop на 5 раз меньше утекает забытой информации при перефразировании запросов и на 1.6 раз меньше при враждебных переформулировках.'}, 'en': {'title': 'Adaptive Unlearning: Balancing Forgetting and Retaining with Popularity', 'desc': 'The AdaPop method enhances the unlearning process in machine learning by adjusting the gradient pressure based on the popularity of facts in the training data. It recognizes that popular facts are retained longer than rare ones and automates the balance between forgetting and retaining information. By using a dual-ascent controller, AdaPop dynamically modifies the penalty for retaining facts during training, leading to more effective unlearning. Experimental results show that AdaPop significantly reduces the leakage of unlearned content compared to existing methods, demonstrating its effectiveness across various model families and benchmarks.'}, 'zh': {'title': '自适应流行度：优化遗忘与保留的平衡', 'desc': 'AdaPop是一种自适应的学习方法，通过考虑事实的流行度来调整梯度压力，从而自动化遗忘与保留的平衡，减少未学习内容的泄漏。流行的事实在预训练期间被更深地记忆，并且比稀有事实更难以移除。现有的大型语言模型（LLM）遗忘方法对所有训练数据施加统一的梯度压力，而AdaPop则结合了局部标记置信度和基于外部代理的流行度依赖指数。实验结果表明，AdaPop在处理改写查询时泄漏的遗忘内容比竞争方法少约5倍，且在对抗性重构下也减少了约1.6倍。'}}}, {'id': 'https://huggingface.co/papers/2608.13947', 'title': 'Scaling Creative Writing Beyond Story-Centric Data with Attribute-Guided Genre Expansion', 'url': 'https://huggingface.co/papers/2608.13947', 'abstract': "Abstract A framework that separates thematic seeds from genre-form controls generates diverse, high-quality creative writing data across 13 genres and improves LLM creative writing performance.  Generated by thinkingmachines/Inkling-Small High-quality creative writing data for large language models (LLMs) remains dominated by story-centric data, limiting models' ability to follow the structural and functional conventions of diverse creative formats. We propose an attribute-guided genre expansion framework for scaling creative writing data beyond story generation. By separating thematic breadth from genre-form control, our framework leverages human-authored story prompts as diverse creative seeds, while utilizing manually curated genre attributes to enforce distinct structural, stylistic, and formatting conventions. We combine these to prompt strong LLMs for genre-faithful query-response pairs, which are then quality-filtered. Applying this framework, we construct the Multi-Genre Collection, a 50K-example corpus spanning 13 creative genres, including story, rap, lyrics, scripts, game design, character design, and other creative formats. Experiments across out-of-distribution writing benchmarks and held-out genre diagnostics demonstrate that models fine-tuned on our data consistently surpass not only base models and writing-specialized baselines, but also models trained on existing writing corpora. Genre-count ablations further indicate that controlled genre expansion, rather than story-centric scaling alone, is a key driver of robust creative writing capability.", 'score': 13, 'issue_id': 3065, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '6dbdf2b8f26a9bd3', 'authors': ['Hwan Chang', 'Yongil Kim', 'Heuiyeen Yeen', 'Yireun Kim', 'Jinsik Lee', 'Hwanhee Lee'], 'affiliations': ['Chung-Ang University', 'LG AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2608.13947.jpg', 'data': {'categories': ['#synthetic', '#story_generation'], 'emoji': '✍️', 'ru': {'title': 'Контролируемое расширение жанров для высокачественного творческого письма в LLM', 'desc': 'Авторы предлагают框架 для расширения тренировочных данных для творческого письма за счёт разделения тематического содержания и жанрово-формальных ограничений. Фреймворк использует человеческие подсказки в качестве семян для разнообразия и применяет вручную подобранные атрибуты жанров для контроля структуры и стиля. На базе этого подхода построен корпус Multi-Genre Collection из 50 тысяч примеров, охватывающий 13 жанров творческого письма. Модели, дообученные на этих данных, показывают лучшие результаты на тестах, превосходя базовые модели и специализированные на письме решения.'}, 'en': {'title': 'Unlocking Diverse Creativity in Language Models', 'desc': 'This paper presents a new framework that enhances the creative writing capabilities of large language models (LLMs) by separating thematic elements from genre-specific controls. By using human-authored prompts as creative seeds and applying curated genre attributes, the framework generates diverse writing data across 13 different genres. The resulting Multi-Genre Collection consists of 50,000 examples that include various creative formats like stories, rap, and scripts. Experiments show that models trained on this data outperform both standard models and those trained on traditional writing datasets, highlighting the importance of genre-specific training for improving creative writing performance.'}, 'zh': {'title': '解锁多样化创意写作的潜力', 'desc': '本论文提出了一种框架，通过将主题种子与体裁控制分离，生成多样化且高质量的创意写作数据，涵盖13种体裁，并提升大型语言模型（LLM）的创意写作表现。该框架利用人类创作的故事提示作为多样化的创意种子，同时使用手动整理的体裁属性来强制执行不同的结构、风格和格式规范。通过这种方法，我们构建了一个包含50,000个示例的多体裁集合，涵盖故事、说唱、歌词、剧本、游戏设计、角色设计等多种创意格式。实验结果表明，基于我们数据微调的模型在多种写作基准测试中表现优于基础模型和专门写作的基线模型，显示出受控的体裁扩展是提升创意写作能力的关键因素。'}}}, {'id': 'https://huggingface.co/papers/2608.18701', 'title': 'SoftVTBench: A Deformation-Aware Visuo-Tactile Dataset and Benchmark for Deformable-Object Manipulation', 'url': 'https://huggingface.co/papers/2608.18701', 'abstract': "Abstract SoftVTBench introduces a synchronized visuo-tactile dataset and deformation-aware benchmark for evaluating physical interaction quality during deformable-object manipulation.  Generated by thinkingmachines/Inkling-Small Physical interaction quality is central to deformable-object manipulation, yet most benchmarks evaluate task success alone. A policy may complete the task while allowing slip or causing excessive compression. A primary bottleneck is the absence of visuo-tactile datasets that pair policy-visible contact observations with independent physical ground truth over complete tasks. We introduce SoftVTBench, a visuo-tactile dataset for physical-interaction-aware deformable-object manipulation. It contains 4,000 expert demonstrations and more than 50 assets, including volumetric deformable objects and visually matched rigid twins. At 20 Hz, each episode synchronizes multi-view RGB, dual-finger tactile RGB and marker motion, proprioception, language, and binary and continuous gripper actions, alongside evaluator-only finite-element (FEM) states. Building upon this dataset, we establish a closed-loop benchmark that uses fixed object-specific calibration to define the Deformation-aware Success Rate (DSR), which counts a rollout as successful only when it completes the task and keeps peak normalized deformation within tolerance. Across Diffusion Policy, π_{0.5}, and FastWAM, all 12 in-distribution configurations contain successful rollouts that violate the deformation tolerance, accounting for 0.7--24% of each configuration's successes. Under distribution shift, visuo-tactile variants achieve higher task success in all six policy--suite comparisons and higher DSR in five, whereas their in-distribution benefits are mixed. These results show that making touch available does not by itself ensure effective multimodal fusion. SoftVTBench therefore provides a common visuo-tactile resource for studying not only whether a policy succeeds, but how it physically interacts with deformable objects and when touch improves that interaction.", 'score': 12, 'issue_id': 3064, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '129735d918b498e9', 'authors': ['Bowen Jing', 'Mingxin Wang', 'Ruiyang Hao', 'Chenchen Ge', 'Hanwen Shen', 'Junjie He', 'Yang Cui', 'Yiming Hou', 'Weitao Zhou', 'Jiawei Wang', 'Minglei Li', 'Dandan Zhang', 'Ding Zhao', 'Houde Liu', 'Xiaofan Li', 'Si Liu', 'Ping Luo', 'Haibao Yu'], 'affiliations': ['Beihang University', 'Carnegie Mellon University', 'Imperial College London', 'Kings College London', 'Simple AI', 'Southeast University', 'Stevens Institute of Technology', 'The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong', 'Tsinghua University', 'Tuojing Intelligence', 'University of Manchester', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.18701.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#optimization', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Оценка качества физического взаимодействия при манипулировании мягкими объектами', 'desc': 'Авторы представляют SoftVTBench — набор данных, который синхронизирует визуальные и тактильные наблюдения при манипулировании деформируемыми объектами, содержащий 4000 экспертных демонстраций и более 50 различных объектов. На основе этого датасета они предлагают бенчмарк с метрикой Deformation-aware Success Rate (DSR), которая оценивает не только успешное выполнение задачи, но и качество физического взаимодействия, включая избежание чрезмерного сжатия и проскальзывания. Исследование показывает, что даже успешные развертывания политик часто нарушают ограничения на деформацию объектов (от 0,7 до 24% случаев), а наличие тактильной информации не гарантирует эффективное мультимодальное слияние данных. SoftVTBench служит общим ресурсом для изучения того, как именно политики физически взаимодействуют с деформируемыми объектами и когда тактильная обратная связь действительно улучшает результаты.'}, 'en': {'title': 'Enhancing Deformable Object Manipulation with Visuo-Tactile Insights', 'desc': 'SoftVTBench is a new dataset designed to improve the evaluation of how well machines manipulate deformable objects by considering both visual and tactile feedback. Traditional benchmarks often only measure whether a task is completed, ignoring the quality of physical interactions like slipping or excessive compression. This dataset includes 4,000 expert demonstrations and various objects, providing synchronized data on visual and tactile inputs, as well as physical states. The study introduces a new metric, the Deformation-aware Success Rate (DSR), which assesses not just task completion but also the quality of the manipulation, highlighting the importance of integrating tactile information for better performance.'}, 'zh': {'title': '变形物体操作的新基准：SoftVTBench', 'desc': 'SoftVTBench是一个同步的视觉-触觉数据集和变形感知基准，用于评估可变形物体操作过程中的物理交互质量。该数据集包含4000个专家演示和50多个资产，提供多视角RGB图像、双指触觉RGB图像和其他传感器数据。通过建立变形感知成功率（DSR）基准，研究者可以评估操作是否成功以及在操作过程中物体的变形是否在容忍范围内。结果表明，触觉信息的引入并不总能保证有效的多模态融合，SoftVTBench为研究物理交互提供了重要资源。'}}}, {'id': 'https://huggingface.co/papers/2608.18852', 'title': 'SkillGate: Training In-Policy Skill Selection in Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2608.18852', 'abstract': "Abstract SkillGate fixes selector credit starvation in agent skill selection by separating outcome credit for execution tokens from local advantage for skill-naming tokens, improving success rates and reducing misleading skill exposure.  Generated by thinkingmachines/Inkling-Small Agent frameworks increasingly package procedural knowledge as skills: instruction files an agent reads on demand, while public libraries now hold thousands of them. Which skill to read has thus become a decision the policy itself makes in the middle of an episode, yet no existing signal trains it. We show that the default remedy, outcome-rewarded RL over the candidate slate, cannot teach it, for a structural reason we identify and name selector credit starvation: under a broadcast, sequence-level advantage, the few tokens that name the chosen skill carry a vanishing share of the loss, and the credit they inherit is increasingly wrong-signed as trajectories lengthen. A correct choice is punished whenever the execution after it fails, even though the choice itself is among the most valuable decisions in the trajectory. Auditing a completed run's own training artifacts confirms all three properties, each worsening monotonically with horizon. SkillGate removes the failure by construction: it partitions the token support into two disjoint credit channels, outcome credit reaching only execution tokens, and a separate action-local advantage reaching exactly the skill-naming tokens, positive only when a trajectory's single read is the correct one. On five agentic benchmarks under a 16-candidate slate, SkillGate lifts a 9B policy from 40.8% to 53.2% trial success, well ahead of the identical budget spent on outcome reward alone, while cutting exposure to misleading candidates by two thirds and reading fewer skills.", 'score': 2, 'issue_id': 3070, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': 'fe738c10a461254e', 'authors': ['Qingyao Li', 'Wenxiang Jiao', 'Shuai Shao', 'Kangning Zhang', 'Yuan Lu', 'Yi Guo', 'Weiwen Liu', 'Weinan Zhang', 'Yong Yu'], 'affiliations': ['Shanghai Jiao Tong University', 'Xiaohongshu Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2608.18852.jpg', 'data': {'categories': ['#agents', '#reasoning', '#optimization', '#training', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Разделяй и властвуй: как правильно обучить агента выбирать нужные навыки', 'desc': 'Статья решает проблему selector credit starvation при обучении агентов выбирать нужные скиллы из больших библиотек. Авторы показывают, что стандартный подход reinforcement learning с outcome reward не может корректно обучать выбор скиллов, так как токены, отвечающие за выбор, получают исчезающе малую долю градиента и неправильный знак кредита. SkillGate решает эту проблему разделением кредитных каналов: outcome credit направляется только на токены выполнения, а отдельный action-local advantage используется для токенов выбора скилла. Метод повысил успешность агента с 40.8% до 53.2% и значительно снизил воздействие неправильных скиллов на политику.'}, 'en': {'title': 'SkillGate: Enhancing Agent Skill Selection with Credit Separation', 'desc': 'The paper introduces SkillGate, a solution to the problem of selector credit starvation in agent skill selection. This issue arises when the credit for choosing a skill is not accurately reflected in the rewards, leading to poor learning outcomes. SkillGate addresses this by separating the credit channels for execution tokens and skill-naming tokens, ensuring that only the correct skill receives positive reinforcement. As a result, SkillGate significantly improves the success rates of agents while reducing the exposure to misleading skills.'}, 'zh': {'title': 'SkillGate：提升代理技能选择的成功率', 'desc': 'SkillGate 通过将执行令牌的结果信用与技能命名令牌的局部优势分开，解决了代理技能选择中的选择器信用饥饿问题。这种方法提高了成功率，并减少了误导性技能的暴露。研究表明，传统的基于结果奖励的强化学习无法有效训练选择器，因为在长时间序列中，选择技能的令牌所承载的损失逐渐减小且可能出现错误。SkillGate 通过构建两个独立的信用通道，确保只有执行令牌接收结果信用，而技能命名令牌仅在正确选择时获得积极的局部优势，从而有效提升了代理的表现。'}}}, {'id': 'https://huggingface.co/papers/2512.14629', 'title': 'Evaluating Music Context Preservation: A Multi-facet Framework for Music Editing Systems', 'url': 'https://huggingface.co/papers/2512.14629', 'abstract': 'Abstract The study introduces MuseCPEval, a framework with tailored metrics to evaluate preservation of unchanged musical attributes during editing tasks.  Generated by thinkingmachines/Inkling-Small Music editing plays a vital role in modern music production, with applications in film, broadcasting, and game development. Recent advances in music editing systems have enabled diverse editing tasks such as timbre transfer, instrument substitution, and genre transformation. However, many existing works overlook evaluating their ability to preserve musical facets that should remain unchanged during editing, which we define as Music Context Preservation (MuseCP). While some studies do consider MuseCP, their evaluation protocols and metrics are not comprehensive. To address this, we introduce the first MuseCP evaluation framework, MuseCPEval, that covers four categories of music facets with fine-grained and well-tailored metrics to capture nuanced changes in music attributes. Objective validation and a human study demonstrate the effectiveness of these metrics. Moreover, the case studies on diverse music editing systems illustrate the practical utility of these metrics as a testbed and diagnostic tool, providing insights into the strengths and limitations of existing systems. We hope our metrics and findings can offer practical guidance for developing more effective and reliable music editing strategies with strong MuseCP capability', 'score': 2, 'issue_id': 3081, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'ceafdf686c9dd194', 'authors': ['Yash Vishe', 'Eric Xue', 'Xunyi Jiang', 'Zachary Novack', 'Junda Wu', 'Julian McAuley', 'Xin Xu'], 'affiliations': ['University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2512.14629.jpg', 'data': {'categories': ['#audio', '#benchmark'], 'emoji': '🎵', 'ru': {'title': 'Измерение сохранения музыкального контекста при автоматическом редактировании', 'desc': 'В статье представлена MuseCPEval — фреймворк для оценки качества систем редактирования музыки, которые должны сохранять неизменяемые музыкальные атрибуты при выполнении задач редактирования (трансформация тембра, замена инструментов, преобразование жанра). Авторы вводят концепцию Music Context Preservation (MuseCP) и предлагают набор специализированных метрик для измерения способности моделей сохранять музыкальные характеристики, которые не должны изменяться. Фреймворк охватывает четыре категории музыкальных атрибутов с детальными и адаптированными под музыку метриками. Эффективность подхода подтверждена объективной валидацией, пользовательским исследованием и анализом существующих систем редактирования музыки.'}, 'en': {'title': 'Preserving Musical Integrity in Editing with MuseCPEval', 'desc': 'The paper presents MuseCPEval, a new framework designed to evaluate how well music editing systems maintain certain musical attributes that should remain unchanged during editing tasks. This concept, referred to as Music Context Preservation (MuseCP), is crucial for ensuring the integrity of music in various applications like film and gaming. The framework introduces tailored metrics that assess four categories of musical facets, providing a detailed analysis of changes in music attributes. Through objective validation and human studies, the effectiveness of these metrics is demonstrated, offering valuable insights for improving music editing technologies.'}, 'zh': {'title': '提升音乐编辑中的上下文保持能力', 'desc': '本研究介绍了MuseCPEval，这是一个专门用于评估音乐编辑任务中保持不变的音乐属性的框架。随着音乐编辑系统的进步，编辑任务变得多样化，但许多现有研究忽视了评估在编辑过程中应保持不变的音乐特征。我们定义这种能力为音乐上下文保持（MuseCP），并提出了第一个MuseCP评估框架，涵盖四类音乐特征，使用精细化的指标捕捉音乐属性的细微变化。通过客观验证和人类研究，证明了这些指标的有效性，并展示了它们在不同音乐编辑系统中的实际应用。'}}}, {'id': 'https://huggingface.co/papers/2608.16490', 'title': 'Towards Real-Time and Adaptable LiDAR Scene Completion', 'url': 'https://huggingface.co/papers/2608.16490', 'abstract': 'Abstract RapidLiDAR learns adaptive spatial displacements to initialize LiDAR scenes and refines them via multi-scale voxel and BEV features for real-time completion.  Generated by thinkingmachines/Inkling-Small LiDAR scene completion is a key component of 3D perception in autonomous driving, where the scene must be completed in real time to be usable in downstream tasks. Existing approaches typically follow an initialize-and-refine paradigm, in which a coarse initialization of the scene is first constructed, then refined into complete 3D geometry. Generative models are slower because they iteratively refine random Gaussian noise into the scene, while non-generative methods perturb the partial scene with a fixed noise scale, which limits coverage of large gaps and occluded regions and requires manual recalibration for each new sensor configuration. We present RapidLiDAR, a LiDAR scene completion method that treats the initialization itself as a learned, data-driven component. We propose an adaptive initialization module that predicts a spatially varying displacement for each partial input point, expanding the partial observations into a coarse scene initialization adapted to the local geometry, without requiring manual noise tuning. To refine this coarse initialization into a complete and coherent scene, we additionally propose a multi-scale reconstruction module that further refines point positions by querying multi-scale 3D voxel and 2D BEV feature maps constructed from the input scan. By replacing point-neighborhood operators such as farthest point sampling and k-nearest neighbor search with voxel- and BEV-based feature extraction, our architecture is faster and can handle different input resolutions by design. Experiments on SemanticKITTI and KITTI-360 show that our method achieves completion performance on par with the state of the art while completing a full scene in 0.1 seconds, which is 2.3 times faster than the fastest prior method. This matches the 10 Hz acquisition rate of typical automotive LiDAR sensors, taking a step toward real-time LiDAR scene completion.', 'score': 2, 'issue_id': 3081, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '2b6e5868fdd5e460', 'authors': ['Azhar Hussian', 'Martin Vossiek', 'Vasileios Belagiannis'], 'affiliations': ['Friedrich-Alexander-Universität Erlangen-Nürnberg, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2608.16490.jpg', 'data': {'categories': ['#3d', '#benchmark'], 'emoji': '📡', 'ru': {'title': 'Обучаемая инициализация вместо шума: быстрое дополнение LiDAR сцен в реальном времени', 'desc': 'RapidLiDAR предлагает новый подход к дополнению сцен LiDAR для автономного вождения, заменяя фиксированное случайное возмущение на обучаемый модуль адаптивной инициализации, который предсказывает пространственно-варьирующиеся смещения для каждой входной точки. Метод использует двухэтапную архитектуру: сначала адаптивная инициализация расширяет частичные наблюдения в грубое приближение сцены, а затем модуль многомасштабной реконструкции уточняет позиции точек, используя признаки из 3D воксельных и 2D BEV карт. Вместо операторов поиска соседей типа farthest point sampling авторы используют воксель-ориентированную и BEV-ориентированную экстракцию признаков, что позволяет обрабатывать входные данные разного разрешения и значительно ускорить вычисления. На бенчмарках SemanticKITTI и KITTI-360 метод достигает 0.1 секунды на полную сцену, что в 2.3 раза быстрее предыдущих методов и соответствует 10 Hz частоте LiDAR датчиков в автомобилях.'}, 'en': {'title': 'Real-Time LiDAR Scene Completion with Adaptive Learning', 'desc': 'RapidLiDAR is a novel method for completing LiDAR scenes in real-time, crucial for 3D perception in autonomous driving. It introduces an adaptive initialization module that learns to predict spatial displacements for each input point, allowing for a more accurate and data-driven scene initialization. The method refines this initialization using a multi-scale reconstruction module that leverages voxel and BEV features, enhancing the completion process without manual noise adjustments. RapidLiDAR achieves competitive performance while processing scenes significantly faster than existing methods, making it suitable for real-time applications.'}, 'zh': {'title': 'RapidLiDAR：实时LiDAR场景补全的新方法', 'desc': 'RapidLiDAR是一种用于LiDAR场景补全的方法，它通过学习自适应的空间位移来初始化场景，并通过多尺度体素和鸟瞰视图特征进行精细化处理。该方法的初始化模块能够根据局部几何特征为每个输入点预测空间位移，从而生成适应性的粗略场景初始化，避免了手动噪声调节。为了将粗略初始化精细化为完整且一致的场景，RapidLiDAR还引入了多尺度重建模块，通过查询多尺度的3D体素和2D鸟瞰视图特征图来进一步优化点的位置。实验结果表明，该方法在SemanticKITTI和KITTI-360数据集上实现了与最先进技术相当的补全性能，并且在0.1秒内完成整个场景，速度是之前最快方法的2.3倍，向实时LiDAR场景补全迈出了重要一步。'}}}, {'id': 'https://huggingface.co/papers/2608.15964', 'title': 'LLMs Get Smarter from Targeted Synthetic Multilingual Data', 'url': 'https://huggingface.co/papers/2
